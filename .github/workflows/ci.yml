name: CI (tests)

# Regression test runner.
#   - Runs on every push / PR that touches the app module or the build file, so a
#     feature change can't merge without the suite passing.
#   - Runs nightly on a schedule to catch drift that isn't tied to a commit
#     (dependency updates, GitHub runner image changes, flaky/time-based tests).
#   - workflow_dispatch lets you trigger it by hand from the Actions tab.
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'pom.xml'
      - '.github/workflows/ci.yml'
  schedule:
    # 03:17 UTC nightly. Off the top of the hour to avoid the scheduler stampede.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The current suite is pure-unit (JUnit 5 + Mockito + AssertJ, no Spring/DB),
      # so no service containers are needed yet. When the DB-bound integration tests
      # land (the nesting / recursive-CTE ACL resolution the notes flag), add MySQL
      # and BaseX as `services:` here and point the tests at them.
      - name: Run tests
        run: mvn -B clean test

      # Surefire reports are useful even (especially) on failure, so publish them
      # regardless of the test outcome.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

      # Browsable HTML coverage + the XML for tooling. Grab this after the first
      # run to read the real coverage number, then ratchet the JaCoCo floor in
      # app/pom.xml up to hold that line.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: 'app/target/site/jacoco/**'
          if-no-files-found: ignore
