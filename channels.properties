# ============================================================
# channels.properties — YouTube channels for transcript fetching
# ============================================================
# Format:
#   key = https://www.youtube.com/@Handle
#   key.types  = videos,streams,shorts   (optional, default: videos,streams)
#   key.folder = Folder Name             (optional, overrides yt-dlp %(channel)s)
#   key.email  = a@b.cd                  (optional) Who owns the channel content.
#
# Run:
#   python3 scripts/channels/01_fetch_transcripts.py              # all channels
#   python3 scripts/channels/01_fetch_transcripts.py --channel godlogic
#   python3 scripts/channels/01_fetch_transcripts.py --dry-run    # preview only
# ============================================================
#
# The public repository ships this file EMPTY: the channel registry (and the
# outreach addresses it carries) is not published. Add your own channels here.

[channels]
