# chronological.yml — Bible reading plan in chronological order
#
# Book names must match BaseX exactly (verified against bible-niv-2011.xml).
# Key names: "Song of Songs", "Psalm" (not Psalms), "Revelation"
#
# Entry formats:
#   - book: "Genesis"
#     chapters: "1-11"          # chapter range
#
#   - book: "2 Kings"
#     chapters: "18"
#     verses: "1-8"             # verse range within a single chapter
#
#   - books:                    # multiple books in one reading unit
#       - {book: "2 Samuel",    chapters: "5"}
#       - {book: "1 Chronicles", chapters: "11-12"}
#
# Corrections applied vs. original Grok plan:
#   - Song of Songs not split (merged 1-4 + 4-8 → 1-8)
#   - 2 Chronicles 2 (wrong) → 2 Chronicles 26
#   - John 1 moved from NT opening to sit with John 2-5
#
# SoS placement: between 1 Kings 3-4 and Proverbs, during Solomon's reign.
# Apocrypha/deuterocanon (KJV 80, DRA 72) not covered — unstamped books
# will be reported by stamp_chronological.py and sort to end in chrono mode.

