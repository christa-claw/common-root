# writing.yml — the Bible in the order its books were WRITTEN
#
# The companion to chronological.yml, which orders the Bible by when the events
# it DESCRIBES happened. Same entry format, same book names, same stamper
# machinery (06b_stamp_writing.py writes @globalWritingSeq).
#
# THE BASIS — read this before trusting the order
# -----------------------------------------------
# Critical scholarly consensus, stated as a range. Every entry carries the
# years between which the book (or the stratum of it) is generally held to
# have reached its present form, and the list is sorted by the MIDDLE of that
# range, ties broken by canonical position. Nothing else decides the order.
#
# That is a position, not a fact, and it is contested:
#   * Traditional attribution (Moses writes the Pentateuch, David the Psalms,
#     Daniel in the sixth century) would give a different order. This file does
#     not follow it, and the printed edition says so.
#   * Books that grew over centuries are placed by the date of their FINAL form,
#     so the Pentateuch (Priestly and final redaction, c. 550-400 BCE) falls AFTER
#     the Deuteronomistic History (Joshua-Kings, final exilic form, c. 620-560
#     BCE) and after Deuteronomy. A reader will find Deuteronomy before Genesis.
#     That is what "written order" means on this basis, and it is the point.
#   * Only Isaiah and Zechariah are split into strata, because that split is
#     close to universal among critical scholars. Psalms, Proverbs, Genesis and
#     the rest are placed whole; splitting them would take a verse-by-verse
#     dating that no consensus supports.
#   * Where authorship is disputed (Colossians, 2 Thessalonians, Ephesians, the
#     Pastorals) the range spans both views rather than choosing one.
#
# The apocrypha and deuterocanon are outside this plan; unstamped books sort to
# the end, as with the chronological plan.

sequence:

  - book: "Amos"
    chapters: "1-9"   # 765 BCE - 755 BCE

  - book: "Hosea"
    chapters: "1-14"   # 755 BCE - 720 BCE

  - book: "Isaiah"
    chapters: "1-39"   # 740 BCE - 700 BCE — First Isaiah; later additions are within the range

  - book: "Micah"
    chapters: "1-7"   # 725 BCE - 700 BCE

  - book: "Nahum"
    chapters: "1-3"   # 663 BCE - 612 BCE

  - book: "Zephaniah"
    chapters: "1-3"   # 640 BCE - 620 BCE

  - book: "Jeremiah"
    chapters: "1-52"   # 627 BCE - 580 BCE

  - book: "Deuteronomy"
    chapters: "1-34"   # 650 BCE - 550 BCE — core c. 622; exilic edition

  - book: "Habakkuk"
    chapters: "1-3"   # 610 BCE - 590 BCE

  - book: "Joshua"
    chapters: "1-24"   # 620 BCE - 560 BCE — Deuteronomistic History, final exilic form

  - book: "Judges"
    chapters: "1-21"   # 620 BCE - 560 BCE — Deuteronomistic History, final exilic form

  - book: "1 Samuel"
    chapters: "1-31"   # 620 BCE - 560 BCE — Deuteronomistic History, final exilic form

  - book: "2 Samuel"
    chapters: "1-24"   # 620 BCE - 560 BCE — Deuteronomistic History, final exilic form

  - book: "1 Kings"
