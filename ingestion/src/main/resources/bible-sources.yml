  # corpus-wide English-@name convention that cross-edition sync depends on).
  # bible-irvhin-2019 is ingested from ebible.org USFM instead, via
  # scripts/bibles/02_convert_usfm_flat.py + 03_import_json_bible.py (strips \f footnotes, writes
  # English CANON names). Do NOT re-add a localCode row for it — /ingest/all would
  # overwrite the clean doc with the dirty clone data.

