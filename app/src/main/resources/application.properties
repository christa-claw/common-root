spring.application.name=religious-texts-app
server.port=8090

# Filtered by Maven from the pom version (@..@ delimiters are Spring Boot's
# convention to avoid clashing with Spring's own ${..} property placeholders).
religioustext.version=@project.version@
# Environment tag shown beside the version (dev by default; the -Pproduction build bakes 'prod').
# Override at runtime if needed, e.g. -Dreligioustext.env=staging.
religioustext.env=@rt.env@

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
file.encoding=UTF-8

spring.datasource.url=jdbc:mysql://localhost:3306/religioustext?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC
spring.datasource.username=rtuser
spring.datasource.password=${DB_PASSWORD:rtpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# validate: fail fast at boot if an entity has no matching table/column, instead
# of 500ing on the first user write. Flyway still owns all schema changes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

religioustext.transcripts-dir=transcripts

basex.uri=http://localhost:8984/rest
basex.username=admin
basex.password=${BASEX_PASSWORD:admin}
basex.database=religioustext
basex.schema.path=/srv/basex/schema/religious-text.xsd

# Meilisearch full-text index. Populated out-of-band by reindex_search.py; the
# app only queries it. Local defaults match the dev stack; prod overrides via
# the MEILI_* env vars (see docker-compose.prod.yml).
meili.url=${MEILI_URL:http://localhost:7700}
meili.key=${MEILI_KEY:masterKey-dev-local}
meili.index=${MEILI_INDEX:search}

vaadin.launch-browser=false
vaadin.whitelisted-packages=com.vaadin,org.vaadin,dev.hilla,org.religioustext

# Session cookie — strictly necessary JSESSIONID only, no persistent cookies
# (no remember-me, no reading-data or religious-content stored client-side)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=3600

logging.level.org.religioustext=DEBUG
logging.level.org.springframework.batch=INFO
logging.level.com.vaadin=INFO

spring.config.import=optional:classpath:application-local.properties

# ── Transactional mail (password reset / email verification) ────────────────
# SMTP is OFF until spring.mail.host is set. Until then MailService LOGS the
# reset/verification link instead of sending it (dev, and un-configured prod).
# To enable on prod, set these on the app container (docker-compose.prod.yml
# environment / its .env) — the password is a secret, never commit it:
#   SPRING_MAIL_HOST=<provider smtp host>        e.g. smtp.resend.com, smtp-relay.brevo.com
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=<provider username>
#   SPRING_MAIL_PASSWORD=<provider password / API key>
#   RELIGIOUSTEXT_BASE_URL=https://common-root.org     (also fixes localhost:8090 links)
#   RELIGIOUSTEXT_MAIL_FROM=noreply@common-root.org    (must be on a verified domain)
# The STARTTLS/auth + timeout defaults below suit port-587 providers and stay
# inert until a host is present; a 465/SSL-only provider would override these.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Dev/test only: seed access-control test data (login users per role, a claimed channel,
# a nested group) at startup so the V11 permissions model can be exercised by hand.
# NEVER set true in prod. Enable with -Dreligioustext.dev.seed-testdata=true or here.
religioustext.dev.seed-testdata=false

# ── Web API (docs/api-spec.md §5) ─────────────────────────────────────────
# Monthly allowances per key, calendar month UTC. Placeholders pending
# ratification (spec §10.1): sized so the honest whole-corpus researcher
# never notices the meter. bytes = 5 GiB.
api.quota.requests-per-month=20000
api.quota.bytes-per-month=5368709120
api.quota.burst-per-minute=60

# ── Attestation (docs/api-spec.md §3.7) ───────────────────────────────────
# HMAC secret for content attestation. Unset in dev => a random per-boot secret
# (tags don't survive restart). In prod set API_ATTEST_SECRET; rotate by
# changing API_ATTEST_KID and moving the old pair into api.attest.retired
# ("k1:oldsecret,k0:oldersecret") so old tags keep verifying.
api.attest.kid=${API_ATTEST_KID:k1}
api.attest.secret=${API_ATTEST_SECRET:}
api.attest.retired=${API_ATTEST_RETIRED:}
# Label of the corpus version baked into tags; the publish pipeline should set
# this to the corpus hash (build_basex_image.sh) — "dev" until it does.
api.corpus.hash=${API_CORPUS_HASH:dev}
