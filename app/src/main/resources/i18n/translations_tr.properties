about.search.title=Her şeyde arama
about.search.body=Tek bir arama kutusu artık kütüphanedeki her baskıyı ve dili — Kutsal Kitap, Kur'an, Hadis ve daha fazlasını — yorumların yanında kapsıyor. Bir kelime ya da tümce arayın, ayet başına tek bir sonuç alın; hangi çevirilerin açılacağını seçin ve iki ya da daha fazlasını eşitlenmiş sütunlarda yan yana karşılaştırın. Ayrıca okuyucunun araç çubuğuna bir başvuru listesi yapıştırarak her pasajı aynı anda kendi sütununda açabilirsiniz.

