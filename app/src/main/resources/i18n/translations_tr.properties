about.sources.title=Kaynaklar ve Atıf
about.sources.intro=Tüm metinler saygın kamu malı ya da lisanslı sağlayıcılardan alınmıştır. Bu platformdaki her metin için doğru atıf yapmaya kararlıyız. Bir lisansın izin verdiği yerde, tam metin kişisel çalışma için serbestçe sunulur.
about.sources.row.bible=Kutsal Kitap metinleri (kamu malı)
about.sources.row.licensed=NIV, NASB, NBLA (lisanslı)
about.sources.row.quran=Kur'an — Arapça ve çeviriler
about.sources.row.hadith=Hadis derlemeleri — Arapça ve İngilizce
about.sources.row.lds=Son Zaman Azizleri standart eserleri (kamu malı)
about.sources.note=Lisanslı çeviriler (NIV, NASB, NBLA) izinle kullanılmaktadır. Lisanslı içeriğin bu platform dışında çoğaltılması ya da yeniden dağıtılması yasaktır. Kamu malı metinler serbestçe kullanılabilir ve paylaşılabilir.

about.comments.title=Görüşlerinizi Paylaşın
about.comments.body=Herhangi bir ayete yorum ve not bırakmak için ücretsiz bir hesap oluşturun. Notlarınız varsayılan olarak gizli kalır — dilerseniz paylaşırsınız. Metinleri okumak ve incelemek her zaman ücretsizdir, hesap gerekmez.
about.comments.register=Ücretsiz Hesap Oluştur
about.comments.signIn=Giriş Yap

about.about.title=Bu Proje Hakkında
about.about.p1=Common Root?, İbrahimî kutsal metinlerin ciddi karşılaştırmalı incelemesini herkes için — akademisyenler, öğrenciler ve meraklı okuyucular için — erişilebilir kılmak üzere kurulmuş bağımsız bir projedir. Herhangi bir dinî kuruluş ya da yayıncıyla bağlantılı değildir. Adı bir davettir: bu metinleri yan yana okuyup neyi paylaştıklarını, nerede ayrıştıklarını kendiniz tartın.
about.about.p2=Platform açık kaynaklı teknoloji üzerine kuruludur: Java, Vaadin, Spring Boot, BaseX (yerel bir XML veritabanı) ve MySQL (kullanıcı hesapları ve yorumları için). Kamu malı kaynak metinler serbestçe sunulur. Lisanslı çeviriler yayıncılarının izniyle kullanılır.
about.about.p3=Yeni çeviriler, gelenekler ve özellikler sürekli eklenir. Kur'an ve on Hadis derlemesi artık Kutsal Kitap çevirilerinin yanında okuyucuda; her metin ve yorumda tam metin araması yerleşik olarak var; yorum entegrasyonu ve çapraz başvuru bağlantıları sırada.

about.support.title=Projeyi Destekleyin
