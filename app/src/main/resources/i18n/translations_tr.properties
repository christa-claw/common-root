# Landing page (AboutView)
about.nav.openReader=Okuyucuyu Aç

about.hero.title=Dünyamızı Şekillendiren Metinleri İnceleyin
about.hero.subtitle=İbrahimî dinlerin kutsal metinlerini — Kutsal Kitap çevirileri, Kur'an, Hadis ve yorumları — özgün dillerinde ve çevirileriyle, yan yana ve dilediğiniz derinlikte keşfetmek için ücretsiz, açık bir okuyucu.
about.hero.cta=Okuyucuyu Aç →

about.howto.title=Okuyucu Nasıl Kullanılır
about.howto.intro=Okuyucu sütunlar üzerine kuruludur. Her sütun tek bir metni gösterir — bir Kutsal Kitap çevirisi, Kur'an, bir yorum ya da kendi notlarınız. İstediğiniz kadar sütun açabilir ve gelenekleri özgürce harmanlayabilirsiniz.
about.howto.step1.title=Bir Kaynak Seçin
about.howto.step1.body=Sütun başlığındaki "Kaynak seçin..." ögesine tıklayın ve açılır listeden herhangi bir çeviri veya metni seçin.
about.howto.step2.title=Gezinin
about.howto.step2.body=İstediğiniz yere gitmek için kitap seçicisini ve bölüm oklarını kullanın. Ya da yalnızca kaydırın — okuyucu, sayfanın altına ulaştığınızda bir sonraki bölümü otomatik olarak yükler.
about.howto.step3.title=Daha Fazla Sütun Ekleyin
about.howto.step3.body=İlkinin yanında ikinci veya üçüncü bir metin açmak için araç çubuğundaki "Sütun Ekle" ögesine tıklayın. Çevirileri veya gelenekleri yan yana karşılaştırın.
about.howto.step4.title=Eşitleyin ya da Serbestçe Gezinin
about.howto.step4.body=Sütunlar varsayılan olarak birlikte kaydırılır. Bir sütunu bağımsız gezinmek için başlığındaki 🔗 bağlantı simgesine tıklayarak bağını çözün.
about.howto.step5.title=Görüntüleme Kipini Değiştirin
about.howto.step5.body=Her sütun için başlıktaki açılır menüyü kullanarak Özgün, Bölümler (1227), Ayetler (1551) ve Başlıklar kipleri arasında geçiş yapın. Bunların ne anlama geldiğini aşağıda görebilirsiniz.
about.howto.step6.title=Yorum Bağlantılarını İzleyin
about.howto.step6.body=Bir yorum bir ayete atıfta bulunduğunda bağlantıya tıklayın — açık olan tüm Kutsal Kitap sütunları otomatik olarak o pasaja atlar.
about.howto.step7.title=Her Şeyde Arama Yapın
about.howto.step7.body=Tüm ayetler ve yorumlar arasında aynı anda arama yapmak için araç çubuğundaki 🔍 simgesine tıklayın. Herhangi bir sonuç, doğrudan yeni bir sütunda ilgili pasaja atlar.

about.modes.title=Görüntüleme Kiplerini Anlamak
about.modes.intro=Her sütun başlığındaki görüntüleme kipi seçici, metnin nasıl sunulacağını denetler. Her kip, editöryel tarihin farklı bir katmanını yansıtır — kimi çok eski, kimi şaşırtıcı ölçüde yeni. Bu ayrımların nereden geldiğini anlamak, okuma biçiminizi değiştirir.
about.modes.original.label=Özgün
about.modes.original.subtitle=Scriptio Continua
about.modes.original.p1=En eski Kutsal Kitap el yazmaları — ister Yeni Ahit'in Yunanca papirüsleri ister büyük İbranice kodeksleri olsun — boşluksuz, noktalama işaretsiz, bölüm arasız ve ayet numarasız, kesintisiz büyük harflerle yazılmıştı. Okuyucuların metni zaten çözebilecek kadar iyi bildiği varsayılırdı.
about.modes.original.p2=Bu kip o deneyimi yeniden yaratır. Bilinçli olarak zorlayıcıdır. Onu okumak, sizi metinle ilk okuyucuların yaptığı gibi ilişki kurmaya zorlar — kopuk, alıntılanabilir parçalar toplamı olarak değil, kesintisiz bir savunu ya da anlatı olarak. Pek çok akademisyen, bunun yazarların özgün niyetiyle karşılaşmanın en dürüst yolu olduğunu savunur.
about.modes.simplified.label=Sadeleştirilmiş
about.modes.simplified.subtitle=Okunabilir Kesintisiz Metin
about.modes.simplified.p1=Bu kip, özgün metnin kesintisiz, bölünmemiş akışını korur ama sonraki yüzyıllarda yazıcıların eklediklerini — kelime aralarını, küçük harfleri ve noktalamayı — geri getirir. Gerçek bir tarihsel aralığı yansıtır: metinler bu şekilde okunabilir hâle geldikten çok sonra bile hâlâ bölüm ya da ayet numarası olmadan dolaşımdaydı. Langton'ın bölümleri ve Estienne'in ayetleri henüz yüzyıllar uzaktaydı.
about.modes.simplified.p2=Tam Scriptio Continua bilinçli olarak çetindir — her şeyi bir anda çıkarır; bu da onu çarpıcı bir gösterim ama gerçekten okumak için zorlu bir yer kılar. Bu sadeleştirilmiş kip yalnızca bu bölümün konusu olan tek katmanı kaldırır: bağlamdan kopuk alıntılamaya (proof-texting) davetiye çıkaran geç eklemeler olan bölüm ve ayet numaralandırmasını. Metin okunaklı kaldığından, bir kitabı, alıntılanabilir hücrelerden oluşan bir ızgara olarak değil, yazarının yazdığı kesintisiz savunu ya da anlatı olarak baştan sona okuyabilirsiniz. Tam Scriptio Continua ara sıra gelen bir sarsıntıysa, bu, numaralar olmadan okumanın gündelik yoludur.
about.modes.chapters.label=Bölümler (1227)
about.modes.chapters.subtitle=Stephen Langton tarafından eklendi
about.modes.chapters.p1=İngiliz bilgin ve sonradan Canterbury Başpiskoposu olan Stephen Langton, Kutsal Kitap'ı bugün hâlâ kullanılan bölüm sistemine yaklaşık MS 1227'de ayırdı — metinlerin yazılmasından bin yıldan fazla süre sonra.
about.modes.chapters.p2=Amacı pratikti: bilginlerin teolojik tartışmalarda pasajları tutarlı biçimde alıntılamak için bir yola ihtiyacı vardı. Bölüm ayrımları hiçbir zaman ilhamla çizilmiş sınırlar olarak tasarlanmadı. Langton devasa bir metinde hızlı çalıştı; ayrımları kimi zaman mükemmel, kimi zaman rahatsız edicidir — bir savunuyu, bir şiiri, hatta bir cümleyi ortasından keserek yazarın özgün akışını gölgeler.
about.modes.verses.label=Ayetler (1551)
about.modes.verses.subtitle=Robert Estienne tarafından eklendi
about.modes.verses.p1=Ayet numaraları Yeni Ahit'e 1551'de, Stephanus olarak da bilinen Fransız matbaacı Robert Estienne tarafından eklendi. Oğluna göre bu ayrımları Paris'ten Lyon'a giderken inter equitandum — yani "at üstünde" — yaptı. Ayetleri eyerde numaralandırma imgesi ünlüdür ama tartışmalıdır; ata binen herkesin doğrulayacağı gibi, hareket hâlindeyken bunu yapmak neredeyse olanaksızdır ve akademisyenler işi aslında her akşam yol üzerindeki hanlarda yaptığından şüphelenir. Duruşu ne olursa olsun, yolculuğun telaşı en şaşırtıcı ayrımlardan bazılarını açıklayabilir.
about.modes.verses.p2=Eski Ahit'in ayet sistemi kısa süre sonra geldi. Bölümler gibi ayetler de yalnızca kolay başvuru için eklendi. O zamandan beri milyarlarca insanın kutsal metni okuma ve alıntılama biçimini şekillendirdiler — çoğu zaman parçaları, özgün yazarların hiç amaçlamadığı ya da öngörmediği biçimde bağlamlarından koparan yollarla.
about.modes.titles.label=Başlıklar
about.modes.titles.subtitle=Editöryel Bölüm Başlıkları
about.modes.titles.p1=Bazen perikop da denen bölüm başlıkları, okuyuculara yol göstermek için yayıncılar ve çevirmenlerce eklenen editöryel başlıklardır. Hiçbir özgün el yazmasının parçası değildirler.
about.modes.titles.p2=Çeviriden çeviriye önemli ölçüde değişirler: NIV bunları bolca kullanırken KJV'de hiç yoktur. Kimi başlıklar yardımcı özetlerdir; kimileriyse siz tek bir kelime bile okumadan önce pasaja teolojik bir yorum dayatır. Önce başlıksız, sonra başlıklı okumak açıklayıcı bir alıştırma olabilir.

about.problems.title=Ayrımlar Metni Çarpıttığında
about.problems.intro=Bölüm ve ayet ayrımları milyarlarca insanın kutsal metni okuma biçimini şekillendirdi — ama bunlar metinlerin yazılmasından yüzyıllar sonra insan editörlerce eklendi ve kimi zaman özgün savunuyu, anlamı gerçekten değiştirecek biçimde keser. Aşağıdakiler en önemli örnekler arasındadır.
about.problems.isaiah.ref=Yeşaya 52:13 – 53:12
about.problems.isaiah.title=İkiye Bölünen Bir Peygamberlik
about.problems.isaiah.p1=Yeşaya 53'teki bölüm ayrımı, aslında tek ve kesintisiz olan bir şiiri — çoğu zaman dördüncü Kul İlahisi denen şiiri — ortasından keser. Şiir, Yeşaya 52:13'te "İşte kulum başarılı olacak; yükselecek, yücelip çok üstün olacak" sözleriyle başlar. Bu açılış kıtası (52:13–15), 53. bölümde gelen ve Hristiyanların çarmıha gerilişin bir peygamberliği olarak okuduğu bütün pasajı hazırlar.
about.problems.isaiah.p2=Bölüm ayrımı 52:13–15'i okuyucuların "Yeşaya 52" saydığı yere, ana gövdeyi ise "Yeşaya 53"e yerleştirdiği için açılış ayetleri sık sık gözden kaçar. Şiir çoğunlukla 53:1'den başlanarak alıntılanır ve çarpıcı açılışını yitirir. Onu — özgün metnin sunduğu gibi — tek ve kesintisiz bir pasaj olarak okumak, peygamberliğin bütün yayını geri kazandırır.
about.problems.romans.ref=Romalılar 7 – 8
about.problems.romans.title="Bunun İçin"in "Çünkü"sünü Yitirmesi
about.problems.romans.p1=Romalılar 8, Yeni Ahit'in en ünlü satırlarından biriyle açılır: "Bunun için, Mesih İsa'ya ait olanlara artık hiçbir mahkûmiyet yoktur." "Bunun için" sözü kritik bir iş görür — Pavlus'un az önce yaptığı bir savunudan bir sonuç çıkardığını gösterir.
about.problems.romans.p2=Ama bölüm ayrımı sonucu savunudan koparır. 8. bölümden başlayan okuyucular, kanıtı olmayan bir bildirimle karşılaşır. Pavlus'un 7. bölümdeki beden ile ruh arasındaki mücadeleye dair savunusu, 8. bölümdeki güvencenin doğrudan temelidir. Bölüm ayrımı, Romalılar 8:1'in sürdürülmüş bir teolojik savununun doruğu değil de tek başına bir vaat gibi okunmasına katkıda bulunmuştur.
about.problems.philippians.ref=Filipililer 4:13
about.problems.philippians.title=Kutsal Metindeki En Çok Yanlış Alıntılanan Ayet
about.problems.philippians.p1="Beni güçlendirenin aracılığıyla her şeyi yapabilirim" Kutsal Kitap'ın en çok alıntılanan ayetlerinden biridir — ürünlerin üzerine basılır, spor müsabakalarından önce anılır ve genel bir ilahî güçlendirme vaadi olarak öne sürülür.
about.problems.philippians.p2=Oysa bağlamında Pavlus çok daha özgül ve çok daha zorlu bir şeyden söz eder: yoklukta hoşnutluk. Çevresindeki ayetler şöyledir: "Hangi durumda olursam olayım, yetinmeyi öğrendim. Yoksulluk çekmeyi de bilirim, bolluk içinde yaşamayı da bilirim." Pavlus'un Mesih aracılığıyla yapabildiği "her şey", her koşula — bollukta da yoklukta da — sükûnetle katlanmaktır. Ayet ayrımı, ayeti bu bağlamdan sıyırıp acıya zarafetle katlanmaya dair bir öğretiyi başarıya dair bir slogana dönüştürdü.
about.problems.jeremiah.ref=Yeremya 29:11
about.problems.jeremiah.title=Bireylere Değil, Sürgündekilere Bir Vaat
about.problems.jeremiah.p1="Çünkü sizin için düşündüğüm tasarıları biliyorum, diyor RAB; sizi zarar değil, esenlik veren, geleceğe umut bağlatan tasarılardır bunlar" çağdaş Hristiyan kültürünün en sevilen ayetlerinden biridir ve çoğu zaman kişisel bir ilahî vaat olarak uygulanır.
about.problems.jeremiah.p2=Bağlamında Tanrı, Babil'de sürgündeki tüm İsrail topluluğuna sesleniyor — ve onlara duymak istemedikleri bir şeyi söylüyor: sürgünün yetmiş yıl süreceğini. Umut dolu ayet, sürgündekilere Babil'e yerleşmelerini, evler yapmalarını, bahçeler dikmelerini ve ömürleri boyunca dönmeyeceklerini kabullenmelerini söyleyen bir mektuba gömülüdür. Vaat gerçektir — ama ortaktır, uzun vadelidir ve önünde onlarca yıllık acı vardır. Ayet ayrımı, tesellinin bağlamdan koparılıp kolayca çekilmesini sağladı.
about.problems.john.ref=Yuhanna 11:35
about.problems.john.title=En Kısa Ayet ve Yitirdiği
about.problems.john.p1="İsa ağladı" Kutsal Kitap'taki en kısa ayettir — bu özelliği onu ünlü kılmış, sık sık alıntılanır ve çoğunlukla tek başına ezberlenmiştir.
about.problems.john.p2=Özgün Yunanca metinde ayet, sürüp giden duygusal bir sahnenin parçasıdır: İsa'nın Lazar'ın mezarına gelişi, Meryem'in ağladığını görmesi, kalabalığın ağladığını görmesi ve "ruhunda derinden sarsılıp üzülmesi" — Yunancada (embrimaomai) yalnızca hüzün değil, öfke ya da kızgınlık çağrışımı taşıyan bir ifade. Akademisyenler İsa'nın kederden mi, yas tutanlara duyduğu şefkatten mi, yoksa daha karmaşık bir şeyden mi ağladığını tartışır. Ayet ayrımı, teolojik açıdan zengin bir anı, İsa'nın insani duyguyu paylaşmasına dair dokunaklı bir öyküye indirgemiştir.
about.problems.callout.title=Proof-Texting ve Ayet Sistemi
about.problems.callout.p1=Ayet sistemi, istemeden de olsa "proof-texting" için — bir teolojik ya da ahlaki görüşü desteklemek üzere, çevresindeki savunuya bakmadan tek bir ayeti alıntılama alışkanlığı için — zemin hazırladı. Hem akademik tartışma hem de popüler kültür bundan etkilendi. Bağlamından koparılmış bir ayet, yazarın amaçladığının neredeyse tersini söylüyormuş gibi görünebilir.
about.problems.callout.p2=Özgün ve Bölümler görüntüleme kiplerinin var olma nedeni budur. Bir bölümü ya da kitabı — ayet numaralarının görsel kesintisi olmadan — kesintisiz düzyazı olarak okumak, çoğu zaman ayet ızgarasının neredeyse görünmez kıldığı bir savunuyu, anlatıyı ya da şiiri açığa çıkarır.

about.texts.title=Mevcut Metinler
about.texts.intro=Platform şu anda aşağıdaki metinleri içeriyor. Düzenli olarak daha fazla çeviri ve gelenek ekleniyor.
about.texts.bibleHeader=Kutsal Kitap Çevirileri
about.texts.quranHeader=Kur'an
about.texts.hadithHeader=Hadis Derlemeleri
about.texts.hadithNote=Her derlemenin Arapça metni (matn) klasik ve kamu malıdır. İngilizce çeviriler hadith-api üzerinden sunulur ve kaynakları her baskı için ayrı ayrı doğrulanmaktadır.
about.texts.ldsHeader=Son Zaman Azizleri Standart Eserleri
about.texts.ldsNote=Son Zaman Azizleri (Mormon) standart eserleri, kamu malı olarak — telif hakkıyla korunan modern inceleme aygıtı (dipnotlar, bölüm özetleri ve Mormon Kitabı girişi) olmaksızın, köklü metin.
