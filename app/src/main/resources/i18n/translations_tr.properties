about.quran.title=Kur'an
about.quran.intro=Kutsal Kitap'ın bölüm ve ayetleri metne yazılmasından yüzyıllar sonra dayatılmışken, Kur'an yapısı bozulmadan geldi. 114 sureye ve bunların içindeki ayetlere bölünmesi, sonradan üzerine serilmiş editöryel bir ızgara değil, aktarıldığı hâliyle metnin kendisine aittir. Kur'an'ın karşılaştırmalı okuyucuya sunduğu şey ise, aynı metin içinden iki ayrı yol ve okunma biçimini şekillendiren, özgün ile çevirileri arasındaki bir ayrımdır.
about.quran.original.title=Sure ve ayet: editöryel değil, özgün
about.quran.original.p1=Sure bir bölümdür; ayet (sözcük anlamıyla "bir işaret") bir dizedir. Kutsal Kitap'ın bölüm ve ayet numaralarının — Stephen Langton'ın yaklaşık 1227'de, Robert Estienne'in 1551'de eklediği — aksine, Kur'an'ın sureleri ve ayetleri, en erken aktarımından beri var olan, metnin kendi yapısına aittir.
about.quran.original.p2=Bu yüzden burada "Numaralı ayetler" kipinde okumak, Kutsal Kitap'ta olduğu gibi ortaçağ kökenli bir katmanı geri almak değildir; numaralandırma metnin özünde vardır.
about.quran.standardization.title=Tasarım gereği tek metin
about.quran.standardization.p1=Bugün dolaşımdaki Kur'an, bilinçli bir standartlaştırmayı yansıtır. Geleneksel anlatıya göre, Peygamber'in ölümünden yaklaşık yirmi yıl sonra, bölgesel toplulukların farklı biçimlerde okuduğu bir durumla karşılaşan halife Osman, yetkili bir yazılı metin oluşturttu, kopyalarını başlıca merkezlere gönderdi — ve rakip nüshaların yok edilmesini emretti. Kimi önde gelen sahabelerin, yer yer sözcükte ya da surelerin sıralamasında farklılık gösteren kişisel nüshaları olduğu anımsanır.
about.quran.standardization.p2=Kutsal Kitap'ın metni yüzyıllar boyunca birçok elden geçerek şekillenmişken, Kur'an'ınki erkenden ve bilinçli olarak tek resmî bir tashihe sabitlendi — farklı türden bir editöryel tarih, ama yine de bir editöryel tarih.
about.quran.orders.title=İki sıra: okuma ve iniş
about.quran.orders.p1=Genellikle gördüğünüz Kur'an — mushaf — indirildiği sırayla düzenlenmemiştir. Açılış suresi Fâtiha'dan sonra sureler kabaca en uzundan en kısaya doğru gider: kronoloji değil, okuma ve ezberleme için bir sıra. İniş sırası farklıdır — erken Mekke yıllarının kısa, acil sureleriyle başlar ve yaklaşık yirmi yıla yayılır.
about.quran.orders.p2=Bu okuyucu ikisi arasında geçiş yapmanıza olanak tanır; böylece metni okunduğu gibi okuyabilir ya da indirildiği gibi izleyebilirsiniz. (İnişin tam sırası akademisyenlerce yeniden kurulur ve yer yer tartışmalıdır.)
about.quran.meccaMedina.title=Mekkî ve Medenî
about.quran.meccaMedina.p1=Gelenek, sureleri Mekke'de inenler ve daha sonra Medine'de inenler diye ayırır. Mekkî sureler daha kısa ve daha şiirsel olma eğilimindedir — Tanrı'nın birliği, diriliş ve gelecek hesapla ilgili. Medenî sureler daha uzun olma ve hukuk, topluluk ve yerleşik bir toplumun yaşamıyla daha çok ilgilenme eğilimindedir.
about.quran.meccaMedina.p2=Bir pasajın Mekkî mi Medenî mi olduğunu bilmek, tıpkı bir Kutsal Kitap pasajının bağlamı gibi, çoğu zaman onun nasıl okunduğunu değiştirir.
about.quran.translations.title=Arapça ve çevirileri
about.quran.translations.p1=İslam geleneğinde Kur'an, Arapça metnin kendisidir; bir çeviri, asıl Kur'an değil, anlamının bir yorumu sayılır — çevirmenlerin eserlerini "Yüce Kur'an'ın Meali" ya da "bir yorum" diye adlandırmalarının nedeni budur.
about.quran.translations.p2=Bu okuyucu o ayrımı görünür tutar: Arapça baskı temel metindir ve her ayetin altında, onun yerine değil, bir çeviri gösterilebilir; böylece özgünü ve onun bir çevirisini birlikte okursunuz.
about.quran.callout.title=Kur'an'ı burada okumak
about.quran.callout.p1=Tam da bunun için iki özellik tasarlandı. Sıra düğmesi sizi okunan sıra ile iniş sırası arasında taşır. Çeviri eşlikçisi, her Arapça ayetin altına, satır satır kilitli bir çeviri yerleştirir; böylece özgün metin öncelikli kalır, çeviri ona destek olur.
about.quran.callout.p2=Amaç Kutsal Kitap'takiyle aynıdır — metnin kendi terimleriyle okunmasına izin vermek ve editöryel ile yorumsal katmanları görünmez değil görünür kılmak.

