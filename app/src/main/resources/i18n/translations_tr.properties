about.sources.download=Kamu malı her basım bütün olarak indirilebilir — okuyucunun kendisinin okuduğu XML olarak: religious-text.xsd şemasına göre kitaplar, bölümler ve ayetler. 0.8.5’ten itibaren bu API üzerinden yapılır: hesap sayfanızdan ücretsiz bir anahtar oluşturun ve /api/v1/texts/{token}/download adresini çekin. Sitede okumak asla anahtar gerektirmez; anahtar yalnızca indirmeleri ölçer. Lisanslı basımlar sunulmaz; API buna bir listeye güvenerek değil, her metnin kendi lisansını okuyarak karar verir.
about.sources.downloadTitle=Metinleri yanınıza alın
about.texts.lineageChains=patch_lineage.py kaynaklı kayıtlı zincirler:
about.texts.lineageHow=Bir Kutsal Kitap sütununun üstündeki ▾ denetimi, o zinciri her ayetin altında açar; her tıklama bir basamak, altta yatan İbranice ya da Yunancaya ulaşana dek. ▴ en derin basamağı yeniden kapatır. Her basamak, basımının kısaltmasını ve yılını taşır — «GNV 1599» — böylece bir okuyuşun kat ettiği mesafe, bizim iddia ettiğimiz bir şey değil, görebileceğiniz bir şey olur.
about.texts.lineageIntro=Çeviriler bağımsız tanıklar değildir. King James çevirmenleri, Tyndale ve Cenevre el altında olmak üzere Bishops' Bible üzerinden çalıştı; Revised Version King James'i düzeltti; American Standard Revised'ı gözden geçirdi; World English Bible American Standard'ı çağdaşlaştırdı. Dört yüzyıl boyunca çevirmenler, her biri bir öncekinin omzunun üzerinden okuyarak.
about.texts.lineageModes=Basamaklar ayet düzeyindedir; bu yüzden denetimler yalnızca Ayetler ve Başlıklar görüntüleme kiplerinde görünür. Özgün, Sürekli ve Bölümler kesintisiz akışlarını korur; orada ayarladığınız derinlik sessizce saklanır ve geri döndüğünüzde yeniden gelir. Adımlama içeriğe de duyarlıdır — bulunduğunuz kitap için söyleyecek bir şeyi olmayan basamaklar atlanır; Eski Antlaşma'dan Yeni'ye kaydırırken İbranice tanık, tek tıklama olmadan Yunanca tanıkla yer değiştirir.
about.texts.lineageTitle=Çeviri soyağacı — bir basım neyin üzerinde durur
about.texts.lineageWitness=≈ ile işaretli basamaklar özgün dildeki tanıklardır. Her çeviri son tahlilde İbranice ve Yunancaya dayandığı için gösterilirler — basım onları kaynağı olarak andığı için değil; Westminster Leningrad Kodeksi ile Textus Receptus bu zemini temsil eder. Bu gerçek bir sınırlılıktır, bir iddia değil: NIV ya da NASB gibi çağdaş bir çeviri, henüz bu derlemde bulunmayan eleştirel basımlardan çalışır; dolayısıyla merdiveni bir zincir değil, tek bir ≈ basamağıdır. Bir basımın yukarıdaki listede olmayışı, soyunu kaydetmediğimiz anlamına gelir — soyu olmadığı anlamına değil.
