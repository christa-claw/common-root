about.sources.title=Fuentes y atribución
about.sources.intro=Todos los textos provienen de proveedores acreditados de dominio público o con licencia. Nos comprometemos a atribuir debidamente cada texto de esta plataforma. Cuando una licencia lo permite, el texto completo se ofrece gratuitamente para el estudio personal.
