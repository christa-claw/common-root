about.search.title=Busca en todo
about.search.body=Una sola barra de búsqueda abarca ahora todas las ediciones e idiomas de la biblioteca — la Biblia, el Corán, el Hadiz y más — junto con los comentarios. Busca una palabra o frase y obtendrás un resultado por versículo; elige qué traducciones abrir y compara dos o más en paralelo en columnas sincronizadas. También puedes pegar una lista de referencias en la barra de herramientas del lector para abrir cada pasaje en su propia columna a la vez.
