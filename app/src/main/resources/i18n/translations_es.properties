# ── La sección del Corán ─────────────────────────────────────────────
about.quran.title=El Corán
about.quran.intro=Mientras que los capítulos y versículos de la Biblia se impusieron al texto siglos después de haber sido escrito, el Corán llegó con su estructura intacta. Su división en 114 azoras, y las aleyas que contienen, pertenece al texto tal como fue transmitido, y no a una retícula editorial superpuesta más tarde. Lo que el Corán ofrece al lector comparativo es, en cambio, dos maneras de recorrer el mismo texto y una distinción entre el original y sus traducciones que determina cómo se lee.
about.quran.original.title=Azora y aleya: original, no editorial
about.quran.original.p1=Una azora es un capítulo; una aleya (literalmente "un signo") es un versículo. A diferencia de los números de capítulo y versículo de la Biblia —añadidos por Stephen Langton hacia 1227 y Robert Estienne en 1551—, las azoras y aleyas del Corán pertenecen a la estructura propia del texto, presente desde su transmisión más temprana.
about.quran.original.p2=Por eso, leer aquí en el modo "Aleyas numeradas" no deshace una capa medieval, como ocurre con la Biblia; la numeración es propia del texto.
about.quran.standardization.title=Un solo texto, por designio
about.quran.standardization.p1=El Corán tal como circula hoy refleja una estandarización deliberada. Según el relato tradicional, unas dos décadas después de la muerte del Profeta, el califa Uthman, ante comunidades regionales que recitaban de maneras divergentes, mandó establecer un texto escrito autorizado y enviar copias a los principales centros, y ordenó destruir los códices rivales. Se recuerda que algunos compañeros destacados tenían códices personales que diferían en algunos lugares, en la redacción o en el orden de las azoras.
about.quran.standardization.p2=Mientras que el texto de la Biblia fue moldeado por muchas manos a lo largo de los siglos, el del Corán se fijó pronto y deliberadamente en una única recensión oficial: una clase distinta de historia editorial, pero una historia editorial al fin y al cabo.
about.quran.orders.title=Dos órdenes: recitación y revelación
about.quran.orders.p1=El Corán que se suele ver —el mushaf— no está ordenado según fue revelado. Después de la azora inicial, Al-Fatiha, las azoras van en líneas generales de la más larga a la más corta: un orden para la recitación y la memorización, no cronológico. El orden de la revelación es distinto: comienza con las azoras breves y urgentes de los primeros años de La Meca y se desarrolla a lo largo de unas dos décadas.
about.quran.orders.p2=Este lector te permite alternar entre ambos, de modo que puedas leer el texto tal como se recita o seguirlo tal como fue revelado. (La secuencia exacta de la revelación es reconstruida por los estudiosos y, en algunos puntos, objeto de debate.)
about.quran.meccaMedina.title=Mecano y medinense
about.quran.meccaMedina.p1=La tradición divide las azoras entre las reveladas en La Meca y las reveladas después en Medina. Las azoras mecanas suelen ser más cortas y poéticas, centradas en la unicidad de Dios, la resurrección y el juicio venidero. Las azoras medinenses suelen ser más largas y se ocupan más de la ley, la comunidad y la vida de una sociedad establecida.
about.quran.meccaMedina.p2=Saber si un pasaje es mecano o medinense a menudo cambia cómo se lee, igual que ocurre con el contexto de un pasaje bíblico.
about.quran.translations.title=El árabe y sus traducciones
about.quran.translations.p1=En la tradición islámica, el Corán es el propio texto árabe; una traducción se considera una interpretación de su significado más que el Corán propiamente dicho, razón por la cual los traductores titulan su obra "El significado del Glorioso Corán" o "una interpretación".
about.quran.translations.p2=Este lector mantiene visible esa distinción: la edición árabe es el texto base, y una traducción puede mostrarse debajo de cada aleya en lugar de sustituirla, de modo que leas el original y una versión de él a la vez.
about.quran.callout.title=Leer el Corán aquí
about.quran.callout.p1=Hay dos funciones pensadas exactamente para esto. El conmutador de orden te lleva entre el orden recitado y el orden de la revelación. El acompañante de traducción coloca una versión debajo de cada aleya árabe, alineada línea por línea, de modo que el original siga siendo lo primario y la traducción lo apoye.
about.quran.callout.p2=El objetivo es el mismo que con la Biblia: dejar que el texto se lea en sus propios términos y hacer visibles las capas editoriales e interpretativas en lugar de invisibles.

