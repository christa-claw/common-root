# === Añadido 2026-07-02 — portada (modo simplificado, hadices/SUD), comentarios, notas, modos ===
mode.ORIGINAL.desc=Los manuscritos originales se escribían en mayúsculas continuas (scriptio continua), sin espacios entre palabras ni divisiones en capítulos y versículos
mode.ORIGINAL_SIMPLE.desc=Texto continuo con espaciado y minúsculas modernas, pero sin división en capítulos ni versículos — tal como aparecían los textos antes de introducirse la numeración
mode.CHAPTERS.desc=Capítulos añadidos por Stephen Langton, arzobispo de Canterbury, hacia 1227 d. C.
mode.CHAPTERS_VERSES.desc=Versículos añadidos por Robert Estienne (Stephanus), 1551 d. C.
mode.TITLES.desc=Los títulos de sección son añadidos editoriales que varían según el editor
nav.sponsor=♥ Patrocinar
about.modes.simplified.label=Simplificado
about.modes.simplified.subtitle=Texto continuo legible
about.modes.simplified.p1=Este modo conserva el flujo continuo e indiviso del original, pero restaura lo que los copistas añadieron en los siglos siguientes: los espacios entre palabras, las minúsculas y la puntuación. Refleja un intervalo histórico real: mucho después de que los textos se volvieran legibles de esta manera, siguieron circulando sin números de capítulo ni versículo. Los capítulos de Langton y los versículos de Estienne aún tardarían siglos en llegar.
about.modes.simplified.p2=La Scriptio continua completa es deliberadamente exigente: lo elimina todo de una vez, lo que la convierte en una demostración impactante pero en un lugar difícil para leer de verdad. Este modo simplificado elimina solo la capa de la que trata esta sección: la numeración de capítulos y versículos, las adiciones tardías que invitan a citar fuera de contexto. El texto sigue siendo legible, de modo que puede leerse un libro entero como el argumento o la narración continua que escribió su autor, en lugar de como una cuadrícula de celdas citables. Donde la Scriptio continua completa es la sacudida ocasional, este es el modo cotidiano de leer sin los números.
about.texts.hadithHeader=Colecciones de hadices
about.texts.hadithNote=El matn árabe de cada colección es clásico y de dominio público. Las traducciones inglesas proceden de la hadith-api y su procedencia se está verificando edición por edición.
about.texts.ldsHeader=Obras canónicas de los Santos de los Últimos Días
about.texts.ldsNote=Las obras canónicas de los Santos de los Últimos Días (mormones), de dominio público: el texto tradicional sin el aparato de estudio moderno protegido por derechos de autor (notas al pie, resúmenes de capítulos y la introducción al Libro de Mormón).
