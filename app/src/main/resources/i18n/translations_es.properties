about.texts.downloadThis=Descargar este texto como XML (dominio público)
about.texts.lineageChains=Cadenas registradas, de patch_lineage.py:
about.texts.lineageHow=El control ▾ en la parte superior de una columna bíblica abre esa cadena bajo cada versículo, un peldaño por clic, hasta llegar al hebreo o al griego que hay debajo. ▴ vuelve a cerrar el peldaño más profundo. Cada peldaño lleva la abreviatura y el año de su edición — «GNV 1599» — de modo que la distancia que ha recorrido una lectura es algo que puedes ver, no algo que nosotros afirmamos.
about.texts.lineageIntro=Las traducciones no son testigos independientes. Los traductores de la King James trabajaron a partir de la Bishops' Bible con Tyndale y Ginebra al alcance de la mano; la Revised Version corrigió la King James; la American Standard revisó la Revised; la World English Bible modernizó la American Standard. Cuatro siglos de traductores, cada uno leyendo por encima del hombro del anterior.
about.texts.lineageModes=Los peldaños son por versículo, así que los controles solo aparecen en los modos de visualización Versículos y Títulos. Original, Continuo y Capítulos conservan su flujo ininterrumpido; una profundidad fijada allí persiste en silencio y vuelve cuando cambias de nuevo. El avance también es sensible al contenido — los peldaños que no tienen nada que decir para el libro en que estás se omiten, de modo que al desplazarte del Antiguo Testamento al Nuevo el testigo hebreo se cambia por el griego sin un clic.
about.texts.lineageTitle=Linaje de las traducciones — sobre qué se sostiene una edición
about.texts.lineageWitness=Los peldaños marcados con ≈ son testigos en lengua original. Se muestran porque toda traducción descansa en última instancia sobre el hebreo y el griego, no porque la edición los nombre como su fuente — el Códice de Leningrado (Westminster) y el Textus Receptus representan ese suelo. Es una limitación real, no una afirmación: una traducción moderna como la NIV o la NASB trabaja con ediciones críticas que aún no están en este corpus, así que su escalera es un único peldaño ≈ en lugar de una cadena. Que una edición falte en la lista de arriba significa que no hemos registrado su ascendencia, no que carezca de ella.
