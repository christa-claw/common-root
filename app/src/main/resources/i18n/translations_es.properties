# === Landing page (AboutView) — Español ===
about.nav.openReader=Abrir el lector

about.hero.title=Estudia los textos que dan forma a nuestro mundo
about.hero.subtitle=Un lector libre y abierto para explorar las escrituras de las religiones abrahámicas — traducciones de la Biblia, el Corán, el Hadiz y comentarios — una al lado de la otra, en cualquier idioma y con toda la profundidad que desees.
about.hero.cta=Abrir el lector →

about.howto.title=Cómo usar el lector
about.howto.intro=El lector se organiza en columnas. Cada columna muestra un texto: una traducción de la Biblia, el Corán, un comentario o tus propias notas. Puedes abrir tantas columnas como quieras y combinar tradiciones libremente.
about.howto.step1.title=Elige una fuente
about.howto.step1.body=Haz clic en «Seleccionar fuente...» en la cabecera de la columna y elige cualquier traducción o texto del menú desplegable.
about.howto.step2.title=Navega
about.howto.step2.body=Usa el selector de libros y las flechas de capítulo para saltar a cualquier parte. O simplemente desplázate: el lector carga el siguiente capítulo automáticamente al llegar al final.
about.howto.step3.title=Añade más columnas
about.howto.step3.body=Haz clic en «Añadir columna» en la barra de herramientas para abrir un segundo o tercer texto junto al primero. Compara traducciones o tradiciones una al lado de la otra.
about.howto.step4.title=Sincroniza o navega libremente
about.howto.step4.body=Las columnas se desplazan juntas de forma predeterminada. Haz clic en el icono de enlace 🔗 en la cabecera de cualquier columna para desvincularla y navegar por ella de forma independiente.
about.howto.step5.title=Cambia el modo de visualización
about.howto.step5.body=Alterna entre los modos Original, Capítulos (1227), Versículos (1551) y Títulos en cada columna mediante el menú desplegable de la cabecera. Más abajo se explica qué significan.
about.howto.step6.title=Sigue los enlaces de los comentarios
about.howto.step6.body=Cuando un comentario hace referencia a un versículo, haz clic en el enlace: todas las columnas bíblicas abiertas saltan automáticamente a ese pasaje.
about.howto.step7.title=Busca en todo
about.howto.step7.body=Haz clic en el icono 🔍 de la barra de herramientas para buscar en todos los versículos y comentarios a la vez. Cualquier resultado se abre directamente en el pasaje, en una nueva columna.

about.modes.title=Entender los modos de visualización
about.modes.intro=El selector de modo en la cabecera de cada columna controla cómo se presenta el texto. Cada modo refleja una capa distinta de la historia editorial: algunas antiguas, otras sorprendentemente recientes. Entender de dónde provienen estas divisiones cambia tu manera de leer.
about.modes.original.label=Original
about.modes.original.subtitle=Scriptio continua
about.modes.original.p1=Los manuscritos bíblicos más antiguos —ya fueran los papiros griegos del Nuevo Testamento o los grandes códices hebreos— se escribían en escritura continua en mayúsculas, sin espacios, sin puntuación, sin divisiones de capítulos y sin números de versículo. Se esperaba que los lectores ya conocieran el texto lo suficiente para interpretarlo.
about.modes.original.p2=Este modo recrea esa experiencia. Es deliberadamente difícil. Leerlo te obliga a abordar el texto como lo hacían los primeros lectores: como un argumento o una narración continua, no como una colección de fragmentos aislados y citables. Muchos estudiosos sostienen que esta es la forma más honesta de acercarse a la intención original de los autores.
about.modes.chapters.label=Capítulos (1227)
about.modes.chapters.subtitle=Añadidos por Stephen Langton
about.modes.chapters.p1=Stephen Langton, un erudito inglés que llegó a ser arzobispo de Canterbury, dividió la Biblia en el sistema de capítulos que todavía se usa hoy hacia el año 1227 d. C., más de mil años después de que se escribieran los textos.
about.modes.chapters.p2=Su motivación era práctica: los eruditos necesitaban una manera coherente de citar pasajes en los debates teológicos. Las divisiones de capítulos nunca pretendieron ser fronteras inspiradas. Langton trabajó con rapidez sobre un texto enorme, y sus divisiones son a veces excelentes y a veces discordantes: cortan a mitad de un argumento, de un poema o incluso de una frase, oscureciendo el flujo original del autor.
about.modes.verses.label=Versículos (1551)
about.modes.verses.subtitle=Añadidos por Robert Estienne
about.modes.verses.p1=Los números de versículo se añadieron al Nuevo Testamento en 1551 por Robert Estienne, un impresor francés también conocido como Stephanus. Según su hijo, hizo las divisiones inter equitandum —«a caballo»— durante el viaje de París a Lyon. La imagen de alguien numerando versículos desde la silla de montar es célebre, pero discutida; como sabe cualquiera que monte, apenas es posible en movimiento, y los estudiosos sospechan que en realidad trabajaba de noche en las posadas del camino. Sea como fuere, las prisas del viaje quizá expliquen algunas de las divisiones más desconcertantes.
about.modes.verses.p2=El sistema de versículos del Antiguo Testamento le siguió poco después. Al igual que los capítulos, los versículos se añadieron únicamente por comodidad de referencia. Desde entonces han moldeado la forma en que miles de millones de personas leen y citan las escrituras, a menudo aislando fragmentos de su contexto de maneras que los autores originales nunca pretendieron ni imaginaron.
about.modes.titles.label=Títulos
about.modes.titles.subtitle=Encabezados editoriales de sección
about.modes.titles.p1=Los títulos de sección —a veces llamados perícopas— son encabezados editoriales añadidos por editores y traductores para ayudar a los lectores a orientarse. No forman parte de ningún manuscrito original.
about.modes.titles.p2=Varían notablemente entre traducciones: la NIV los usa con profusión, mientras que la KJV no tiene ninguno. Algunos títulos son resúmenes útiles; otros imponen una interpretación teológica sobre un pasaje antes de que hayas leído una sola palabra. Leer primero sin títulos y luego con ellos puede ser un ejercicio revelador.

about.problems.title=Cuando las divisiones distorsionan el texto
about.problems.intro=Las divisiones de capítulos y versículos han moldeado la forma en que miles de millones de personas leen las escrituras, pero fueron añadidas por editores humanos siglos después de que se escribieran los textos, y a veces cortan el argumento original de maneras que cambian realmente el significado. Estos son algunos de los ejemplos más significativos.
about.problems.isaiah.ref=Isaías 52:13 – 53:12
about.problems.isaiah.title=Una profecía partida en dos
about.problems.isaiah.p1=La división de capítulo en Isaías 53 atraviesa lo que en realidad es un único poema continuo, a menudo llamado el cuarto Canto del Siervo. El poema comienza en Isaías 52:13 con: «He aquí que mi siervo actuará con sabiduría; será enaltecido y exaltado, y puesto muy en alto». Esta estrofa inicial (52:13–15) prepara todo el pasaje que sigue en el capítulo 53, que los cristianos leen como una profecía de la crucifixión.
about.problems.isaiah.p2=Como la división de capítulo coloca 52:13–15 en lo que los lectores consideran «Isaías 52» y el cuerpo principal en «Isaías 53», los versículos iniciales se pasan por alto con frecuencia. El poema se cita habitualmente empezando en 53:1, perdiendo su dramática apertura. Leerlo como un pasaje ininterrumpido, tal como lo presenta el texto original, restaura el arco completo de la profecía.
about.problems.romans.ref=Romanos 7 – 8
about.problems.romans.title=El «por tanto» que perdió su «porque»
about.problems.romans.p1=Romanos 8 comienza con una de las frases más famosas del Nuevo Testamento: «Por tanto, ahora no hay ninguna condenación para los que están en Cristo Jesús». La palabra «por tanto» cumple una función crucial: indica que Pablo está sacando una conclusión de un argumento que acaba de exponer.
about.problems.romans.p2=Pero la división de capítulo separa la conclusión del argumento. Quienes empiezan en el capítulo 8 encuentran una declaración sin su demostración. El argumento de Pablo sobre la lucha entre la carne y el espíritu en el capítulo 7 es el fundamento directo de la certeza del capítulo 8. La división de capítulos ha contribuido a que Romanos 8:1 se lea como una promesa aislada en lugar de como el punto culminante de un argumento teológico sostenido.
about.problems.philippians.ref=Filipenses 4:13
about.problems.philippians.title=El versículo peor citado de las escrituras
about.problems.philippians.p1=«Todo lo puedo en Cristo que me fortalece» es uno de los versículos más citados de la Biblia: impreso en mercancías, citado antes de los eventos deportivos e invocado como una promesa general de poder divino.
about.problems.philippians.p2=En su contexto, Pablo habla de algo mucho más concreto y mucho más exigente: el contentamiento en la pobreza. Los versículos que lo rodean dicen: «He aprendido a contentarme, cualquiera que sea mi situación. Sé vivir en la escasez y sé vivir en la abundancia». El «todo» que Pablo puede hacer en Cristo es soportar cualquier circunstancia —abundancia o privación— con serenidad. La división de versículos arrancó el texto de este contexto y convirtió una enseñanza sobre el sufrimiento con dignidad en un eslogan sobre el éxito.
about.problems.jeremiah.ref=Jeremías 29:11
about.problems.jeremiah.title=Una promesa a unos exiliados, no a individuos
about.problems.jeremiah.p1=«Porque yo sé los planes que tengo para vosotros, declara el Señor, planes de bienestar y no de mal, para daros un futuro y una esperanza» es uno de los versículos más populares de la cultura cristiana contemporánea, aplicado a menudo como una promesa divina personal.
about.problems.jeremiah.p2=En su contexto, Dios se dirige a toda la comunidad de israelitas exiliados en Babilonia, y les está diciendo algo que no querían oír: que el exilio durará setenta años. El esperanzador versículo está inserto en una carta que ordena a los exiliados establecerse en Babilonia, construir casas, plantar huertos y aceptar que no regresarán mientras vivan. La promesa es real, pero es colectiva, a largo plazo y precedida por décadas de sufrimiento. La división de versículos facilitó extraer el consuelo dejando atrás el contexto.
about.problems.john.ref=Juan 11:35
about.problems.john.title=El versículo más corto y lo que perdió
about.problems.john.p1=«Jesús lloró» es el versículo más corto de la Biblia, una distinción que lo ha hecho famoso, muy citado y ampliamente memorizado de forma aislada.
about.problems.john.p2=En el griego original, el versículo forma parte de una escena emocional sostenida: Jesús llega a la tumba de Lázaro, ve llorar a María, ve llorar a la multitud y se siente «profundamente conmovido en espíritu y turbado», una expresión que en griego (embrimaomai) lleva un sentido de enojo o agitación, no solo de tristeza. Los estudiosos debaten si Jesús lloró de dolor, de compasión por los que sufrían o por algo más complejo. La división de versículos ha reducido un momento teológicamente rico a una anécdota conmovedora sobre Jesús compartiendo la emoción humana.
about.problems.callout.title=Las citas fuera de contexto y el sistema de versículos
about.problems.callout.p1=El sistema de versículos creó sin querer las condiciones para el «proof-texting»: la práctica de citar un versículo aislado para apoyar una postura teológica o moral sin referencia a su argumento circundante. Tanto el debate académico como la cultura popular se han visto moldeados por esto. Un versículo separado de su contexto puede parecer decir casi lo contrario de lo que el autor pretendía.
about.problems.callout.p2=Por eso existen los modos de visualización Original y Capítulos. Leer un capítulo o un libro como prosa continua, sin la interrupción visual de los números de versículo, a menudo revela un argumento, una narración o un poema que la cuadrícula de versículos había vuelto casi invisible.

