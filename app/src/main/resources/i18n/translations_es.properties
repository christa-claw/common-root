about.sources.download=Cada edición de dominio público puede descargarse entera, como el mismo XML que lee el propio lector — libros, capítulos, versículos y las secuencias de orden de lectura, conforme al esquema de religious-text.xsd. Sin cuenta, sin paso de exportación, sin raspar una página web para obtener un texto que nunca fue nuestro para retener. Las ediciones con licencia no se sirven ahí, y el punto de acceso lo decide leyendo la licencia propia de cada texto en lugar de fiarse de una lista.
