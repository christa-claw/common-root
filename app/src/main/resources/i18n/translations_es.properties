about.comments.title=Comparte tus reflexiones
about.comments.body=Crea una cuenta gratuita para dejar comentarios y notas en cualquier versículo. Tus anotaciones son privadas de forma predeterminada; compártelas si lo deseas. Leer y estudiar los textos es siempre gratis, sin necesidad de cuenta.
about.comments.register=Crear cuenta gratuita
about.comments.signIn=Iniciar sesión

about.about.title=Acerca de este proyecto
about.about.p1=Common Root? es un proyecto independiente creado para hacer accesible a todos el estudio comparado serio de las escrituras abrahámicas: estudiosos, estudiantes y lectores curiosos por igual. No está afiliado a ninguna organización religiosa ni editorial. El nombre es una invitación: leer estos textos uno al lado del otro y sopesar por ti mismo lo que comparten y en qué divergen.
about.about.p2=La plataforma está construida con tecnología de código abierto: Java, Vaadin, Spring Boot, BaseX (una base de datos XML nativa) y MySQL (para las cuentas de usuario y los comentarios). Los textos originales de dominio público están disponibles gratuitamente. Las traducciones con licencia se usan con permiso de sus editores.
about.about.p3=Continuamente se añaden nuevas traducciones, tradiciones y funciones. Las traducciones del Corán y las colecciones de Hadiz son lo próximo, seguidas de la integración de comentarios y los enlaces de referencias cruzadas.

about.support.title=Apoya el proyecto
about.support.body=Common Root? es gratis y siempre lo será. Si te resulta útil, el patrocinio ayuda a cubrir el alojamiento, el acceso a traducciones con licencia y el tiempo para añadir nuevos textos y funciones.
