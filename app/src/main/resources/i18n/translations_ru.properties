about.sources.download=Любое издание в общественном достоянии можно скачать целиком — тем же XML, который читает сама читалка: книги, главы и стихи по схеме religious-text.xsd. С версии 0.8.5 это делается через API: создайте бесплатный ключ на странице учётной записи и запросите /api/v1/texts/{token}/download. Чтение на сайте ключа не требует; ключ лишь учитывает загрузки. Лицензированные издания не выдаются, и API определяет это по лицензии самого текста, а не по списку.
about.sources.downloadTitle=Возьмите тексты с собой
about.texts.lineageChains=Записанные цепочки, из patch_lineage.py:
about.texts.lineageHow=Элемент ▾ вверху библейской колонки раскрывает эту цепочку под каждым стихом, по одной ступени за щелчок, пока она не дойдёт до лежащего в основании еврейского или греческого текста. ▴ снова закрывает самую глубокую ступень. Каждая ступень несёт сокращение и год своего издания — «GNV 1599», — так что путь, пройденный чтением, можно увидеть, а не принимать на веру с наших слов.
about.texts.lineageIntro=Переводы — не независимые свидетели. Переводчики Библии короля Якова работали с Епископской Библией, держа под рукой Тиндейла и Женевскую; Revised Version исправила короля Якова; American Standard пересмотрела Revised; World English Bible осовременила American Standard. Четыре века переводчиков, каждый из которых читал через плечо предыдущего.
about.texts.lineageModes=Ступени привязаны к стихам, поэтому элементы управления появляются только в режимах отображения «Стихи» и «Заголовки». «Оригинал», «Сплошной» и «Главы» сохраняют непрерывное течение; глубина, заданная там, тихо сохраняется и возвращается при переключении обратно. Шаги учитывают и содержание — ступени, которым нечего сказать о книге, где вы находитесь, пропускаются, так что при прокрутке из Ветхого Завета в Новый еврейский свидетель сменяется греческим без единого щелчка.
about.texts.lineageTitle=Родословная переводов — на чём стоит издание
about.texts.lineageWitness=Ступени с пометкой ≈ — свидетели на языке оригинала. Они показываются потому, что всякий перевод в конечном счёте покоится на еврейском и греческом тексте, а не потому, что издание называет их своим источником — Ленинградский кодекс (Вестминстерский) и Textus Receptus замещают это основание. Это настоящее ограничение, а не претензия: современный перевод вроде NIV или NASB работает с критическими изданиями, которых в этом корпусе пока нет, поэтому его лестница — одна ступень ≈, а не цепочка. Отсутствие издания в списке выше означает, что мы не записали его родословную, а не что её нет.
