about.sources.title=Источники и указание авторства
about.sources.intro=Все тексты взяты у авторитетных поставщиков из общественного достояния или предоставленных по лицензии. Мы стремимся к надлежащему указанию авторства для каждого текста на этой платформе. Где это позволяет лицензия, полный текст предоставляется бесплатно для личного изучения.
about.sources.row.bible=Библейские тексты (общественное достояние)
about.sources.row.licensed=NIV, NASB, NBLA (по лицензии)
about.sources.row.quran=Коран — арабский и переводы
about.sources.row.hadith=Сборники хадисов — арабский и английский
about.sources.note=Лицензированные переводы (NIV, NASB, NBLA) используются с разрешения. Воспроизведение или распространение лицензированного содержимого за пределами этой платформы не допускается. Тексты из общественного достояния можно свободно использовать и распространять.

about.comments.title=Поделитесь своими наблюдениями
about.comments.body=Создайте бесплатную учётную запись, чтобы оставлять комментарии и заметки к любому стиху. По умолчанию ваши заметки приватны — поделитесь ими, если захотите. Читать и изучать тексты всегда бесплатно и без учётной записи.
about.comments.register=Создать бесплатную учётную запись
about.comments.signIn=Войти

about.about.title=Об этом проекте
about.about.p1=Common Root? — независимый проект, созданный для того, чтобы сделать серьёзное сравнительное изучение авраамических Писаний доступным для всех: учёных, студентов и просто любознательных читателей. Он не связан ни с какой религиозной организацией или издательством. Само название — это приглашение: читать эти тексты рядом друг с другом и самостоятельно взвешивать, что у них общего и где они расходятся.
about.about.p2=Платформа построена на технологиях с открытым исходным кодом: Java, Vaadin, Spring Boot, BaseX (нативная база данных XML) и MySQL (для учётных записей и комментариев). Исходные тексты из общественного достояния доступны бесплатно. Лицензированные переводы используются с разрешения их издателей.
about.about.p3=Новые переводы, традиции и функции добавляются постоянно. Следующими будут переводы Корана и сборники хадисов, а затем — интеграция комментариев и перекрёстные ссылки.

about.support.title=Поддержать проект
about.support.body=Common Root? бесплатен и всегда будет таким. Если он вам полезен, спонсорская поддержка помогает покрывать хостинг, доступ к лицензированным переводам и время на добавление новых текстов и функций.
about.support.cta=♥ Поддержать на GitHub

