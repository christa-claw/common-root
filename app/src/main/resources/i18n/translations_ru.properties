mode.ORIGINAL.desc=Оригинальные рукописи писались сплошными заглавными буквами (scriptio continua), без пробелов между словами и без деления на главы и стихи
mode.ORIGINAL_SIMPLE.desc=Сплошной текст с современными пробелами и строчными буквами, но без деления на главы и стихи — таким текст был до введения нумерации
mode.CHAPTERS.desc=Главы добавил Стефан Лэнгтон, архиепископ Кентерберийский, ок. 1227 г.
mode.CHAPTERS_VERSES.desc=Стихи добавил Робер Этьенн (Стефанус) в 1551 г.
mode.TITLES.desc=Заголовки разделов — редакторские добавления, различающиеся у разных издателей
nav.sponsor=♥ Поддержать
about.modes.simplified.label=Упрощённый
about.modes.simplified.subtitle=Читаемый сплошной текст
about.modes.simplified.p1=Этот режим сохраняет сплошной, нерасчленённый поток оригинала, но возвращает то, что переписчики добавили в последующие столетия, — пробелы между словами, строчные буквы и знаки препинания. Он отражает реальный исторический период: ещё долго после того, как тексты стали читаемыми в таком виде, они ходили без номеров глав и стихов. До глав Лэнгтона и стихов Этьенна оставались столетия.
about.modes.simplified.p2=Полная Scriptio continua намеренно сурова — она убирает всё сразу, что делает её яркой демонстрацией, но трудным местом для настоящего чтения. Упрощённый режим убирает лишь тот слой, о котором идёт речь в этом разделе: нумерацию глав и стихов — поздние добавления, подталкивающие к цитированию вне контекста. Текст остаётся удобочитаемым, и целую книгу можно прочесть как непрерывное рассуждение или повествование, написанное автором, а не как сетку цитируемых ячеек. Если полная Scriptio continua — это редкая встряска, то это — повседневный способ читать без номеров.
about.texts.hadithHeader=Сборники хадисов
about.texts.hadithNote=Арабский матн каждого сборника классический и находится в общественном достоянии. Английские переводы поступают из hadith-api, их происхождение проверяется для каждого издания.
about.texts.ldsHeader=Канонические труды Святых последних дней
about.texts.ldsNote=Канонические труды Святых последних дней (мормонов), в общественном достоянии — традиционный текст без современного учебного аппарата, защищённого авторским правом (сносок, кратких содержаний глав и введения к Книге Мормона).
