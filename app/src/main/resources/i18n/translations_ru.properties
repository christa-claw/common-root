about.search.title=Поиск по всему
about.search.body=Теперь единое поле поиска охватывает все издания и языки библиотеки — Библию, Коран, хадисы и другое — вместе с комментариями. Найдите слово или фразу — и вы получите по одному результату на стих; выберите, какие переводы открыть, и сравните два или больше бок о бок в синхронизированных столбцах. Вы также можете вставить список ссылок в панель инструментов читалки, чтобы открыть каждое место сразу в собственном столбце.
