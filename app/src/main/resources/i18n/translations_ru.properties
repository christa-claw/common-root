# === Landing page (AboutView) — Русский ===
about.nav.openReader=Открыть читалку

about.hero.title=Изучайте тексты, которые сформировали наш мир
about.hero.subtitle=Бесплатная открытая читалка для изучения священных текстов авраамических религий — переводов Библии, Корана, хадисов и комментариев — рядом друг с другом, на любом языке и с любой глубиной.
about.hero.cta=Открыть читалку →

about.howto.title=Как пользоваться читалкой
about.howto.intro=Читалка построена вокруг колонок. В каждой колонке отображается один текст — перевод Библии, Коран, комментарий или ваши собственные заметки. Вы можете открыть сколько угодно колонок и свободно сочетать традиции.
about.howto.step1.title=Выберите источник
about.howto.step1.body=Нажмите «Выбрать источник...» в заголовке колонки и выберите любой перевод или текст из выпадающего списка.
about.howto.step2.title=Перемещайтесь по тексту
about.howto.step2.body=Используйте выбор книги и стрелки глав, чтобы перейти к любому месту. Или просто прокручивайте — читалка автоматически подгружает следующую главу, когда вы доходите до конца.
about.howto.step3.title=Добавляйте колонки
about.howto.step3.body=Нажмите «Добавить колонку» на панели инструментов, чтобы открыть второй или третий текст рядом с первым. Сравнивайте переводы или традиции бок о бок.
about.howto.step4.title=Синхронизация или свободный просмотр
about.howto.step4.body=По умолчанию колонки прокручиваются вместе. Нажмите значок связи 🔗 в заголовке любой колонки, чтобы отвязать её и просматривать независимо.
about.howto.step5.title=Меняйте режим отображения
about.howto.step5.body=Переключайтесь между режимами «Оригинал», «Главы (1227)», «Стихи (1551)» и «Заголовки» для каждой колонки с помощью выпадающего списка в заголовке. Что они означают, объясняется ниже.
about.howto.step6.title=Переходите по ссылкам комментариев
about.howto.step6.body=Когда комментарий ссылается на стих, нажмите на ссылку — все открытые библейские колонки автоматически перейдут к этому месту.
about.howto.step7.title=Поиск по всему
about.howto.step7.body=Нажмите значок 🔍 на панели инструментов, чтобы искать по всем стихам и комментариям сразу. Любой результат открывается прямо на нужном месте в новом столбце.

about.modes.title=Как понимать режимы отображения
about.modes.intro=Выбор режима отображения в заголовке каждой колонки определяет, как подаётся текст. Каждый режим отражает свой слой редакторской истории — какой-то древний, какой-то на удивление недавний. Понимание того, откуда взялись эти деления, меняет то, как вы читаете.
about.modes.original.label=Оригинал
about.modes.original.subtitle=Scriptio continua
about.modes.original.p1=Древнейшие библейские рукописи — будь то греческие папирусы Нового Завета или великие еврейские кодексы — писались сплошным письмом заглавными буквами, без пробелов, без знаков препинания, без деления на главы и без номеров стихов. Предполагалось, что читатель уже знает текст достаточно хорошо, чтобы разбирать его.
about.modes.original.p2=Этот режим воссоздаёт такой опыт. Он намеренно труден. Чтение в нём заставляет воспринимать текст так, как воспринимали его первые читатели, — как непрерывное рассуждение или повествование, а не как набор отдельных пригодных для цитирования фрагментов. Многие учёные считают, что это самый честный способ соприкоснуться с изначальным замыслом авторов.
about.modes.chapters.label=Главы (1227)
about.modes.chapters.subtitle=Добавлены Стефаном Лэнгтоном
about.modes.chapters.p1=Стефан Лэнгтон, английский учёный, ставший архиепископом Кентерберийским, около 1227 года разделил Библию на главы — систему, которая используется и поныне, — более чем через тысячу лет после написания самих текстов.
about.modes.chapters.p2=Его побуждение было практическим: учёным нужен был единообразный способ ссылаться на отрывки в богословских спорах. Деление на главы никогда не задумывалось как боговдохновенные границы. Лэнгтон работал быстро над огромным текстом, и его деления порой превосходны, а порой неуместны — они рассекают рассуждение, поэму или даже предложение посередине, затемняя изначальный ход мысли автора.
about.modes.verses.label=Стихи (1551)
about.modes.verses.subtitle=Добавлены Робером Этьенном
about.modes.verses.p1=Номера стихов были добавлены в Новый Завет в 1551 году Робером Этьенном, французским печатником, известным также как Стефанус. По словам его сына, он сделал деления inter equitandum — «верхом» — во время поездки из Парижа в Лион. Образ человека, нумерующего стихи прямо в седле, знаменит, но спорен; как подтвердит любой всадник, на ходу это едва ли возможно, и учёные полагают, что на самом деле он работал по вечерам, на постоялых дворах вдоль дороги. Как бы то ни было, спешка поездки, возможно, объясняет некоторые из самых странных делений.
about.modes.verses.p2=Вскоре последовала и система стихов Ветхого Завета. Как и главы, стихи были добавлены исключительно для удобства ссылок. С тех пор они определили то, как миллиарды людей читают и цитируют Писание, — нередко вырывая фрагменты из их контекста так, как изначальные авторы никогда не предполагали и не имели в виду.
about.modes.titles.label=Заголовки
about.modes.titles.subtitle=Редакторские заголовки разделов
about.modes.titles.p1=Заголовки разделов — иногда называемые перикопами — это редакторские заголовки, добавленные издателями и переводчиками, чтобы помочь читателю ориентироваться. Они не являются частью какой-либо изначальной рукописи.
about.modes.titles.p2=Они заметно различаются между переводами: NIV использует их широко, тогда как в KJV их нет вовсе. Одни заголовки — полезные краткие сводки; другие навязывают отрывку богословское толкование ещё до того, как вы прочли хоть слово. Прочитать сначала без заголовков, а затем с ними — поучительное упражнение.

about.problems.title=Когда деления искажают текст
about.problems.intro=Деление на главы и стихи определило то, как миллиарды людей читают Писание, — но оно было добавлено людьми-редакторами спустя столетия после написания текстов и порой рассекает изначальное рассуждение так, что это по-настоящему меняет смысл. Ниже приведены одни из самых значимых примеров.
about.problems.isaiah.ref=Исаия 52:13 – 53:12
about.problems.isaiah.title=Пророчество, разрезанное надвое
about.problems.isaiah.p1=Деление на главы в Исаии 53 рассекает то, что на самом деле является единой непрерывной поэмой, — её часто называют четвёртой Песнью о Рабе. Поэма начинается в Исаии 52:13 словами: «Вот, раб Мой будет благоуспешен, возвысится и вознесётся, и возвеличится». Эта начальная строфа (52:13–15) подготавливает весь отрывок, следующий в главе 53, который христиане читают как пророчество о распятии.
about.problems.isaiah.p2=Поскольку деление на главы помещает 52:13–15 в то, что читатели воспринимают как «Исаия 52», а основную часть — в «Исаия 53», начальные стихи часто упускают из виду. Поэму обычно цитируют начиная с 53:1, теряя её драматическое начало. Чтение её как единого, неразрывного отрывка — так, как подаёт его изначальный текст, — восстанавливает всю дугу пророчества.
about.problems.romans.ref=Римлянам 7 – 8
about.problems.romans.title=«Итак», потерявшее своё «потому что»
about.problems.romans.p1=Римлянам 8 открывается одной из самых знаменитых строк Нового Завета: «Итак нет ныне никакого осуждения тем, которые во Христе Иисусе». Слово «итак» выполняет важнейшую работу — оно указывает, что Павел делает вывод из только что изложенного рассуждения.
about.problems.romans.p2=Но деление на главы отрывает вывод от рассуждения. Те, кто начинает с главы 8, встречают утверждение без его доказательства. Рассуждение Павла о борьбе между плотью и духом в главе 7 — прямое основание для уверенности главы 8. Деление на главы способствовало тому, что Римлянам 8:1 читают как отдельно стоящее обещание, а не как кульминацию развёрнутого богословского рассуждения.
about.problems.philippians.ref=Филиппийцам 4:13
about.problems.philippians.title=Самый неверно цитируемый стих Писания
about.problems.philippians.p1=«Всё могу в укрепляющем меня Иисусе Христе» — один из самых широко цитируемых стихов Библии: его печатают на товарах, произносят перед спортивными состязаниями и приводят как общее обещание божественной силы.
about.problems.philippians.p2=В контексте Павел говорит о чём-то гораздо более конкретном и гораздо более трудном: о довольстве в нужде. Окружающие стихи гласят: «Я научился быть довольным тем, что у меня есть. Умею жить и в скудости, умею жить и в изобилии». То «всё», что Павел может во Христе, — это переносить любые обстоятельства, изобилие или лишения, с невозмутимостью. Деление на стихи вырвало стих из этого контекста и превратило учение о достойном перенесении страданий в лозунг о достижениях.
about.problems.jeremiah.ref=Иеремия 29:11
about.problems.jeremiah.title=Обещание изгнанникам, а не отдельным людям
about.problems.jeremiah.p1=«Ибо только Я знаю намерения, какие имею о вас, говорит Господь, намерения во благо, а не на зло, чтобы дать вам будущность и надежду» — один из самых популярных стихов в современной христианской культуре, который часто применяют как личное божественное обещание.
about.problems.jeremiah.p2=В контексте Бог обращается ко всей общине израильтян, изгнанных в Вавилон, — и говорит им то, что они не хотели слышать: что изгнание продлится семьдесят лет. Обнадёживающий стих помещён в письмо, велящее изгнанникам поселиться в Вавилоне, строить дома, разводить сады и принять то, что они не вернутся при своей жизни. Обещание реально, но оно коллективное, долгосрочное и предварено десятилетиями страданий. Деление на стихи позволило легко извлечь утешение, оставив позади контекст.
about.problems.john.ref=Иоанна 11:35
about.problems.john.title=Самый короткий стих и то, что он утратил
about.problems.john.p1=«Иисус прослезился» — самый короткий стих Библии; эта особенность сделала его знаменитым, часто цитируемым и широко заучиваемым в отрыве от контекста.
about.problems.john.p2=В оригинальном греческом тексте этот стих — часть целостной эмоциональной сцены: Иисус приходит к гробнице Лазаря, видит плачущую Марию, видит плачущую толпу и «восскорбел духом и возмутился» — выражение, которое в греческом (embrimaomai) несёт оттенок гнева или волнения, а не одной лишь печали. Учёные спорят, плакал ли Иисус от скорби, от сострадания к скорбящим или от чего-то более сложного. Деление на стихи свело богословски насыщенный момент к трогательному анекдоту о том, как Иисус разделяет человеческие чувства.
about.problems.callout.title=Выдёргивание стихов из контекста и система стихов
about.problems.callout.p1=Система стихов невольно создала условия для «выдёргивания стихов из контекста» (proof-texting) — практики цитирования отдельного стиха в поддержку богословской или нравственной позиции без учёта окружающего рассуждения. Этим сформированы и научные споры, и популярная культура. Стих, оторванный от контекста, может показаться говорящим почти противоположное тому, что имел в виду автор.
about.problems.callout.p2=Именно поэтому существуют режимы отображения «Оригинал» и «Главы». Чтение главы или книги как непрерывной прозы — без зрительного прерывания номерами стихов — нередко открывает рассуждение, повествование или поэму, которые сетка стихов сделала почти невидимыми.

