# ── Раздел о Коране ──────────────────────────────────────────────────
about.quran.title=Коран
about.quran.intro=Если главы и стихи Библии были наложены на текст спустя столетия после его написания, то Коран явился с уже сложившейся структурой. Его деление на 114 сур и аяты внутри них принадлежат тексту в том виде, в каком он был передан, — а не позднейшей редакторской сетке, наложенной поверх него. Вместо этого Коран предлагает читателю-компаративисту два пути сквозь один и тот же текст и различение между оригиналом и его переводами, которое определяет, как его читают.
about.quran.original.title=Сура и аят: изначальное, а не редакторское
about.quran.original.p1=Сура — это глава; аят (буквально "знамение") — это стих. В отличие от номеров глав и стихов в Библии, добавленных Стефаном Лэнгтоном около 1227 года и Робером Этьеном в 1551 году, суры и аяты Корана принадлежат собственной структуре текста и присутствуют в нём с самой ранней передачи.
about.quran.original.p2=Поэтому чтение в режиме "Нумерованные аяты" здесь не снимает средневековый слой, как в случае с Библией; нумерация присуща самому тексту.
about.quran.standardization.title=Единый текст, по замыслу
about.quran.standardization.p1=Коран в том виде, в каком он распространён сегодня, отражает сознательную стандартизацию. Согласно традиционному преданию, примерно через два десятилетия после смерти Пророка халиф Усман, столкнувшись с тем, что разные общины читали по-разному, повелел установить авторитетный письменный текст и разослать копии в главные центры — и приказал уничтожить соперничающие списки. О некоторых видных сподвижниках сохранилась память, что у них были личные списки, местами отличавшиеся в формулировках или в порядке сур.
about.quran.standardization.p2=Если текст Библии формировался многими руками на протяжении столетий, то текст Корана был рано и намеренно закреплён в единой официальной редакции — иной род редакторской истории, но всё же редакторская история.
about.quran.orders.title=Два порядка: чтение и ниспослание
about.quran.orders.p1=Коран, который вы обычно видите, — мусхаф — расположен не в том порядке, в каком он был ниспослан. После открывающей суры, Аль-Фатихи, суры идут в целом от самой длинной к самой короткой: это порядок для чтения вслух и заучивания, а не хронология. Порядок ниспослания иной — он начинается с коротких, настойчивых сур ранних мекканских лет и разворачивается на протяжении примерно двух десятилетий.
about.quran.orders.p2=Эта программа для чтения позволяет переключаться между двумя порядками, так что вы можете читать текст так, как он читается вслух, или следовать ему так, как он был ниспослан. (Точная последовательность ниспослания реконструирована учёными и местами оспаривается.)
about.quran.meccaMedina.title=Мекканские и мединские
about.quran.meccaMedina.p1=Традиция делит суры на ниспосланные в Мекке и ниспосланные позже в Медине. Мекканские суры обычно короче и поэтичнее — они говорят о единстве Бога, о воскресении и о грядущем воздаянии. Мединские суры обычно длиннее и больше касаются закона, общины и жизни оседлого общества.
about.quran.meccaMedina.p2=Знание о том, мекканский перед нами отрывок или мединский, часто меняет его прочтение — подобно тому как меняет его контекст библейского отрывка.
about.quran.translations.title=Арабский текст и его переводы
about.quran.translations.p1=В исламской традиции Коран — это сам арабский текст; перевод считается толкованием его смысла, а не собственно Кораном, — поэтому переводчики озаглавливают свой труд "Смысл Священного Корана" или "толкование".
about.quran.translations.p2=Эта программа для чтения сохраняет это различение зримым: арабское издание — это основной текст, а перевод может показываться под каждым аятом, а не вместо него, так что вы читаете оригинал и его передачу одновременно.
about.quran.callout.title=Чтение Корана здесь
about.quran.callout.p1=Две функции созданы именно для этого. Переключатель порядка перемещает вас между порядком чтения и порядком ниспослания. Спутник-перевод помещает передачу под каждым арабским аятом, строка к строке, так что оригинал остаётся главным, а перевод его поддерживает.
about.quran.callout.p2=Цель та же, что и с Библией, — дать тексту быть прочитанным на его собственных условиях и сделать редакторские и толковательные слои видимыми, а не невидимыми.

