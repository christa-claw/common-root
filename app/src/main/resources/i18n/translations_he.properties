mode.ORIGINAL_SIMPLE.desc=טקסט רציף עם ריווח מילים ואותיות רישיות מודרניים, אך ללא חלוקה לפרקים או לפסוקים — כפי שנראו הטקסטים לפני הנהגת המספור
