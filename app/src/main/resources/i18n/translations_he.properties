# Landing page (AboutView)
# ─────────────────────────────────────────────────────────────────────
about.nav.openReader=פתיחת הקורא

about.hero.title=לימוד הכתבים שמעצבים את עולמנו
about.hero.subtitle=קורא חופשי ופתוח לכתבי הקודש של הדתות האברהמיות — תרגומי התנ״ך והברית החדשה, הקוראן, החדית׳ ופרשנות — זה לצד זה, בשפות המקור ובתרגום, ולכל עומק שתבחרו.
about.hero.cta=פתיחת הקורא ←

about.howto.title=כיצד להשתמש בקורא
about.howto.intro=הקורא בנוי סביב עמודות. כל עמודה מציגה טקסט אחד — תרגום מקרא, הקוראן, פרשנות או ההערות שלכם. אפשר לפתוח עמודות רבות ככל שתרצו ולשלב מסורות בחופשיות.
about.howto.step1.title=בחרו מקור
about.howto.step1.body=לחצו על "בחרו מקור..." בראש העמודה ובחרו כל תרגום או טקסט מהרשימה.
about.howto.step2.title=נווטו
about.howto.step2.body=הגיעו לכל מקום בעזרת בורר הספרים וחיצי הפרקים. או פשוט גללו — הקורא טוען את הפרק הבא אוטומטית כשמגיעים לסוף.
about.howto.step3.title=הוסיפו עמודות
about.howto.step3.body=לחצו על "הוספת עמודה" בסרגל הכלים כדי לפתוח טקסט שני או שלישי לצד הראשון. השוו תרגומים או מסורות זה לצד זה.
about.howto.step4.title=סנכרון או קריאה עצמאית
about.howto.step4.body=כברירת מחדל העמודות נגללות יחד. לחצו על סמל הקישור 🔗 בראש עמודה כדי לנתק אותה ולקרוא בה באופן עצמאי.
about.howto.step5.title=החליפו תצוגה
about.howto.step5.body=עברו בין תצוגת מקור, פרקים (1227), פסוקים (1551) וכותרות בעזרת הרשימה שבראש כל עמודה. ההסבר על כל תצוגה מופיע בהמשך.
about.howto.step6.title=עקבו אחר הפניות בפרשנות
about.howto.step6.body=כאשר פרשנות מפנה לפסוק, לחצו על הקישור — כל עמודות המקרא הפתוחות מנווטות אוטומטית לאותו קטע.
about.howto.step7.title=חפשו בהכול
about.howto.step7.body=לחצו על סמל 🔍 בסרגל הכלים כדי לחפש בכל פסוק והערה בבת אחת. כל תוצאה נפתחת בעמודה חדשה ישירות בקטע המבוקש.

about.modes.title=הבנת תצוגות הטקסט
about.modes.intro=בורר התצוגה שבראש כל עמודה קובע כיצד הטקסט מוצג. כל תצוגה משקפת שכבה אחרת של היסטוריה עריכתית — חלקן עתיקות, חלקן מאוחרות במפתיע. הבנת מקורן של החלוקות משנה את אופן הקריאה.
about.modes.original.label=מקור
about.modes.original.subtitle=סקריפטיו קונטינואה
about.modes.original.p1=כתבי היד המקראיים הקדומים ביותר — פפירוסים יווניים של הברית החדשה וכתבי היד הגדולים של המקרא — נכתבו ברצף אותיות אחיד, ללא רווחים, ללא פיסוק, ללא חלוקת פרקים וללא מספרי פסוקים. מהקוראים צופה היכרות מוקדמת עם הטקסט כדי שיוכלו לקוראו כלל.
about.modes.original.p2=תצוגה זו משחזרת את החוויה ההיא. היא מאתגרת בכוונה. קריאה בה כופה מפגש עם הטקסט כפי שפגשו אותו קוראיו הראשונים — לא כאוסף קטעים מבודדים הניתנים לציטוט, אלא כטיעון או סיפור רציף אחד. חוקרים רבים סבורים שזו הדרך הנאמנה ביותר לפגוש את כוונת המחברים המקורית.
about.modes.simplified.label=מפושט
about.modes.simplified.subtitle=טקסט רציף קריא
about.modes.simplified.p1=תצוגה זו שומרת על הזרימה הרציפה והבלתי מחולקת של המקור, אך משיבה את מה שהוסיפו המעתיקים במאות השנים שלאחר מכן — רווחים בין מילים, אותיות רגילות ופיסוק. היא משקפת תקופה היסטורית ממשית: הטקסטים הופצו זמן רב במתכונת קריאה זו, ללא מספרי פרקים ופסוקים. פרקי לנגטון ופסוקי אטיין היו אז במרחק מאות שנים.
about.modes.simplified.p2=הסקריפטיו קונטינואה המלאה קשוחה בכוונה — היא מסירה הכול בבת אחת, ולכן היא הדגמה מרשימה אך מקום קשה לקריאה. התצוגה המפושטת מסירה רק את השכבה שהחלק הזה עוסק בה: מספרי הפרקים והפסוקים — התוספות המאוחרות המזמינות שליפת פסוקים כהוכחות. הטקסט נותר קריא, כך שאפשר לקרוא ספר שלם כטיעון או כסיפור הרציף שכתב מחברו, ולא כרשת של תאים ברי־ציטוט. אם הסקריפטיו קונטינואה המלאה היא זעזוע חד־פעמי, זו דרך הקריאה היומיומית ללא מספרים.
about.modes.chapters.label=פרקים (1227)
about.modes.chapters.subtitle=נוספו בידי סטיבן לנגטון
about.modes.chapters.p1=סטיבן לנגטון, מלומד אנגלי שלימים היה לארכיבישוף של קנטרברי, חילק את המקרא סביב שנת 1227 לספירה — למעלה מאלף שנה לאחר כתיבת הטקסטים — למערכת הפרקים הנהוגה עד היום.
about.modes.chapters.p2=מניעיו היו מעשיים: המלומדים נזקקו לדרך אחידה להפנות לקטעים בוויכוחים תאולוגיים. חלוקות הפרקים מעולם לא נועדו להיות גבולות שבהשראה אלוהית. לנגטון עבד במהירות על טקסט עצום, וחלוקותיו מצוינות פה ומטרידות שם — חותכות באמצע טיעון, באמצע שירה ואף באמצע משפט, באופן המטשטש את הזרימה שהתכוון לה המחבר.
about.modes.verses.label=פסוקים (1551)
about.modes.verses.subtitle=נוספו בידי רובר אטיין
about.modes.verses.p1=מספרי הפסוקים בברית החדשה נוספו בשנת 1551 בידי המדפיס הצרפתי רובר אטיין (הידוע גם כסטפנוס). לפי בנו, הוא קבע את החלוקות inter equitandum — כלומר "על גב הסוס" — במהלך המסע מפריז לליון. הדימוי של מי שממספר פסוקים בעודו רכוב באוכף מפורסם אך שנוי במחלוקת; כפי שכל רוכב יודע, קשה מאוד לעשות זאת תוך כדי תנועה, וחוקרים משערים שלמעשה עבד בערבים, בפונדקי הדרך. כך או כך, חופזון המסע עשוי להסביר כמה מן החלוקות התמוהות ביותר.
about.modes.verses.p2=מערכת הפסוקים של התנ״ך באה זמן קצר אחריה. כמו הפרקים, גם הפסוקים נוספו לנוחות הפניה בלבד. מאז הם מעצבים את האופן שבו מיליארדים קוראים ומצטטים את כתבי הקודש — לא אחת באופן המנתק קטעים מהקשרם בדרכים שמחבריהם המקוריים לא שיערו.
about.modes.titles.label=כותרות
about.modes.titles.subtitle=כותרות מערכת עריכתיות
about.modes.titles.p1=כותרות הקטעים — המכונות לעתים פריקופות — הן כותרות עריכתיות שהוסיפו מו״לים ומתרגמים לנוחות הקוראים. הן אינן חלק משום כתב יד מקורי.
about.modes.titles.p2=הן שונות מאוד בין תרגומים: ה־NIV משתמש בהן בהרחבה, ואילו ב־KJV אין אותן כלל. חלק מהכותרות הן תקצירים מועילים; אחרות כופות פרשנות תאולוגית על קטע עוד לפני שקראתם מילה אחת. קריאה תחילה בלי כותרות ואחר כך איתן עשויה להיות תרגיל מאיר עיניים.

about.problems.title=כאשר החלוקות מעוותות את הטקסט
about.problems.intro=חלוקות הפרקים והפסוקים עיצבו את קריאתם של מיליארדים בכתבי הקודש — אך הן נוספו בידי עורכים בשר ודם מאות שנים לאחר כתיבת הטקסטים, ולעתים הן חותכות את הטיעון המקורי באופן שממש משנה משמעות. להלן כמה מהדוגמאות המשמעותיות ביותר.
about.problems.isaiah.ref=ישעיהו נב 13 – נג 12
about.problems.isaiah.title=נבואה שנחצתה לשניים
about.problems.isaiah.p1=מעבר הפרק בישעיהו נ״ג חותך באמצע שיר אחד רציף — המכונה לרוב שירת העבד הרביעית. השיר נפתח בישעיהו נב 13: "הנה ישכיל עבדי ירום ונשא וגבה מאד". הפתיחה הזו (נב 13–15) מציבה את המסגרת לקטע כולו הנמשך בפרק נ״ג, שנוצרים קוראים בו נבואה על הצליבה.
about.problems.isaiah.p2=מכיוון שחלוקת הפרקים מציבה את נב 13–15 בעיני הקוראים ב"ישעיהו נב" ואת עיקר הקטע ב"ישעיהו נג", הפסוקים הפותחים נשמטים תדיר. את השיר נהוג לצטט מ־נג 1, וכך אובדת פתיחתו הדרמטית. קריאתו כקטע אחד שלם — כפי שהטקסט המקורי מציג אותו — משיבה לנבואה את מלוא היקפה.
about.problems.romans.ref=רומים ז – ח
about.problems.romans.title="על כן" שאיבד את נימוקו
about.problems.romans.p1=פרק ח באיגרת אל הרומים נפתח באחת השורות המפורסמות בברית החדשה: "על כן אין עתה שום אשמה באלה אשר הם במשיח ישוע". המילים "על כן" עושות כאן עבודה מכרעת — הן מאותתות שפאולוס מסיק מסקנה מטיעון שזה עתה השלים.
about.problems.romans.p2=אך מעבר הפרק מפריד את המסקנה מן הטיעון. הקוראים המתחילים בפרק ח מקבלים הכרזה ללא ראיות. טיעונו של פאולוס בפרק ז על המאבק בין הבשר לרוח הוא היסוד הישיר להבטחת פרק ח. חלוקת הפרקים תרמה לכך שרומים ח 1 נקרא כהבטחה עצמאית ולא כשיאו של טיעון תאולוגי ממושך.
about.problems.philippians.ref=פיליפים ד 13
about.problems.philippians.title=הפסוק המצוטט־שלא־בהקשרו ביותר בכתובים
about.problems.philippians.p1="כל זאת אוכל בעזרת המשיח הנותן כח בקרבי" הוא מהפסוקים המצוטטים ביותר במקרא — מודפס על חפצים, נישא לפני תחרויות ספורט ומוזכר כהבטחה כללית להעצמה אלוהית.
about.problems.philippians.p2=בהקשרו, פאולוס דן בדבר ספציפי ומאתגר הרבה יותר: שביעות רצון במחסור. הפסוקים הסמוכים אומרים: "למדתי להסתפק במה שיש לי. ידעתי לענות אף ידעתי לרוות". ה"כול" שפאולוס יכול לו במשיח הוא לשאת בסבלנות כל מצב — שפע או מחסור. חלוקת הפסוקים תלשה את הפסוק מהקשר זה והפכה שיעור על נשיאת מצוקה בכבוד לסיסמת הישגים.
about.problems.jeremiah.ref=ירמיהו כט 11
about.problems.jeremiah.title=הבטחה לגולים, לא ליחידים
about.problems.jeremiah.p1="כי אנכי ידעתי את המחשבת אשר אנכי חשב עליכם נאם יהוה מחשבות שלום ולא לרעה לתת לכם אחרית ותקוה" הוא מהפסוקים האהובים בתרבות הנוצרית בת זמננו, המיושם תדיר כהבטחה אלוהית אישית.
about.problems.jeremiah.p2=בהקשרו, אלוהים פונה אל קהילת הגולים בבבל כולה — ואומר להם את מה שלא רצו לשמוע: שהגלות תימשך שבעים שנה. הפסוק מלא התקווה שזור במכתב המורה לגולים להתיישב בבבל, לבנות בתים, לטעת גנות ולהשלים עם כך שלא ישובו בימי חייהם. ההבטחה אמיתית — אך היא קיבוצית, ארוכת טווח, ובאה עם עשרות שנות קושי, לא במקומן. חלוקת הפסוקים הקלה לשלוף את הנחמה ולהשאיר את ההקשר מאחור.
about.problems.john.ref=יוחנן יא 35
about.problems.john.title=הפסוק הקצר ביותר ומה שאבד לו
about.problems.john.p1="ויבך ישוע" הוא הפסוק הקצר ביותר במקרא — ייחוד שעשה אותו מפורסם, מצוטט תדיר ומשונן במנותק.
about.problems.john.p2=ביוונית המקורית הפסוק הוא חלק מסצנה רגשית ממושכת: ישוע מגיע אל קבר אלעזר, רואה את מרים בוכה ואת ההמון בוכה, ו"רוחו סערה בקרבו" — ביטוי שביוונית (embrimaomai) נושא גם גוון של כעס או תרעומת, לא רק צער. חוקרים חלוקים אם בכה מאבל, מחמלה על המתאבלים, או מדבר מורכב יותר. חלוקת הפסוקים צמצמה רגע עשיר תאולוגית לרגע מרגש בלבד של ישוע השותף ברגש אנושי.
about.problems.callout.title=שליפת פסוקים ומערכת הפסוקים
about.problems.callout.p1=מערכת הפסוקים יצרה שלא במתכוון את התנאים ל"שליפת פסוקים כהוכחות" (proof-texting) — ציטוט פסוק בודד לתמיכה בעמדה תאולוגית או מוסרית בלי להתייחס לטיעון הסובב אותו. גם השיח המחקרי וגם התרבות הפופולרית עוצבו על ידה. פסוק מנותק מהקשרו עלול להיראות כאומר כמעט את ההפך מכוונת מחברו.
about.problems.callout.p2=לשם כך קיימות תצוגות המקור והפרקים. קריאת פרק או ספר כפרוזה רציפה — בלי ההפרעה החזותית של מספרי פסוקים — חושפת תדיר את הטיעון, הסיפור או השירה שרשת הפסוקים כמעט העלימה.

about.texts.title=הטקסטים הזמינים
