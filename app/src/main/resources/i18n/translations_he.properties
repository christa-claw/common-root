about.about.title=על הפרויקט
about.about.p1=‏Common Root?‏ הוא פרויקט עצמאי שנועד להנגיש לימוד השוואתי רציני של כתבי הקודש האברהמיים לכולם — חוקרים, תלמידים וקוראים סקרנים כאחד. הוא אינו מזוהה עם שום ארגון דתי או מו״ל. השם עצמו הוא הזמנה: לקרוא את הכתבים הללו זה לצד זה ולשקול בעצמכם מה משותף להם והיכן הם נפרדים.
about.about.p2=הפלטפורמה בנויה על טכנולוגיות קוד פתוח: Java, ‏Vaadin, ‏Spring Boot, ‏BaseX (מסד נתונים XML טבעי) ו־MySQL (לחשבונות משתמשים והערות). טקסטים בנחלת הכלל זמינים חינם. תרגומים ברישיון בשימוש באישור המו״לים.
about.about.p3=תרגומים, מסורות ותכונות חדשים נוספים כל העת. הקוראן ועשרה אוספי חדית׳ נמצאים כעת בקורא לצד תרגומי המקרא, וחיפוש בטקסט מלא מובנה בכל טקסט והערה; שילוב פרשנות וקישורי הפניות צולבות הם הבאים בתור.

about.support.title=תמיכה בפרויקט
about.support.body=‏Common Root?‏ חינם ויישאר כזה. אם הוא מועיל לכם, החסות מסייעת לכסות את עלויות האחסון, הגישה לתרגומים ברישיון והזמן להוספת טקסטים ותכונות חדשים.
about.support.cta=♥ תמכו דרך GitHub

