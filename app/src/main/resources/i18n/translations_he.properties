about.search.body=תיבת חיפוש אחת מקיפה כעת כל מהדורה וכל שפה בספרייה — מקרא, קוראן, חדית׳ ועוד — לצד הפרשנות. חפשו מילה או ביטוי ותקבלו תוצאה אחת לכל פסוק; בחרו אילו תרגומים לפתוח והשוו שניים או יותר זה לצד זה בעמודות מסונכרנות. אפשר גם להדביק רשימת הפניות בסרגל הכלים של הקורא ולפתוח כל קטע בעמודה משלו בבת אחת.

