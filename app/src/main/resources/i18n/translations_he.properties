about.sources.download=כל מהדורה בנחלת הכלל ניתנת להורדה בשלמותה, באותו XML שהקורא עצמו קורא — ספרים, פרקים, פסוקים ורצפי סדר הקריאה, לפי הסכמה שב־religious-text.xsd. בלי חשבון, בלי שלב ייצוא, בלי גירוד של דף אינטרנט כדי להשיג טקסט שמעולם לא היה שלנו לעכב. מהדורות מורשות אינן מוגשות שם, ונקודת הקצה מכריעה בכך על ידי קריאת הרישיון של כל טקסט עצמו במקום להסתמך על רשימה.
about.sources.downloadTitle=קחו את הטקסטים איתכם
about.texts.downloadThis=הורדת הטקסט הזה כ־XML (נחלת הכלל)
about.texts.lineageChains=שרשראות מתועדות, מתוך patch_lineage.py:
about.texts.lineageHow=הפקד ▾ שבראש עמודת תנ"ך פותח את השרשרת הזו מתחת לכל פסוק, שלב אחד בכל לחיצה, עד שהיא מגיעה לעברית או ליוונית שמתחת. ▴ סוגר שוב את השלב העמוק ביותר. כל שלב נושא את קיצור המהדורה ושנתה — "GNV 1599" — כך שהמרחק שעברה גרסת קריאה הוא דבר שרואים, ולא דבר שאנחנו טוענים.
about.texts.lineageIntro=תרגומים אינם עדים בלתי תלויים. מתרגמי קינג ג'יימס עבדו מתוך תנ"ך הבישופים כשטינדל וז'נבה בהישג ידם; ה־Revised Version תיקנה את קינג ג'יימס; ה־American Standard עדכנה את ה־Revised; ה־World English Bible חידשה את ה־American Standard. ארבע מאות שנים של מתרגמים, כל אחד קורא מעבר לכתפו של קודמו.
about.texts.lineageModes=השלבים הם ברזולוציית פסוק, ולכן הפקדים מופיעים רק במצבי התצוגה פסוקים וכותרות. מקור, רציף ופרקים שומרים על זרימתם הבלתי פוסקת; עומק שנקבע שם נשמר בשקט וחוזר כשעוברים חזרה. הצעידה גם מודעת לתוכן — שלבים שאין להם מה לומר על הספר שבו אתם נמצאים מדולגים, כך שגלילה מהתנ"ך אל הברית החדשה מחליפה את העד העברי בעד היווני בלי לחיצה.
about.texts.lineageTitle=ייחוס התרגומים — על מה עומדת מהדורה
about.texts.lineageWitness=שלבים המסומנים ב־≈ הם עדים בשפת המקור. הם מוצגים משום שכל תרגום נשען בסופו של דבר על העברית והיוונית, ולא משום שהמהדורה מציינת אותם כמקורה — כתב יד לנינגרד (וסטמינסטר) והטקסטוס רצפטוס ממלאים את מקום היסוד הזה. זו מגבלה אמיתית, לא טענה: תרגום מודרני כמו NIV או NASB עובד ממהדורות ביקורתיות שטרם נכללו בקורפוס הזה, ולכן הסולם שלו הוא שלב ≈ בודד ולא שרשרת. היעדרה של מהדורה מהרשימה שלמעלה פירושו שלא תיעדנו את ייחוסה, לא שאין לה כזה.
