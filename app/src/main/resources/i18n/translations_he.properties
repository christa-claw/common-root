about.quran.title=הקוראן
about.quran.intro=בעוד פרקי המקרא ופסוקיו הוטלו על הטקסט מאות שנים לאחר כתיבתו, הקוראן הגיע עם מבנהו. חלוקתו ל־114 סורות, והפסוקים שבתוכן, הם חלק ממרקם הטקסט כפי שנמסר — לא רשת עריכתית מאוחרת. מה שהקוראן מציע לקורא המשווה תחת זאת הוא שני מסלולים דרך אותו טקסט, והבחנה בין המקור לתרגומיו המעצבת את אופן קריאתו.
about.quran.original.title=סורה ואיה: מקוריות, לא עריכתיות
about.quran.original.p1=סורה היא פרק; איה (מילולית "אות", "סימן") היא פסוק. בשונה ממספרי הפרקים והפסוקים של המקרא — שהוסיפו סטיבן לנגטון סביב 1227 ורובר אטיין ב־1551 — הסורות והאיות של הקוראן הן חלק ממבנה הטקסט עצמו, נוכחות ממסירתו המוקדמת ביותר.
about.quran.original.p2=לכן קריאה בתצוגת "פסוקים ממוספרים" כאן אינה הסרת שכבה ימי־ביניימית כמו במקרא; המספור הזה שייך לטקסט עצמו.
about.quran.standardization.title=טקסט אחד, במתכוון
about.quran.standardization.p1=הקוראן הנפוץ היום הוא פרי תקנון מכוון. לפי המסורת, כשני עשורים לאחר מות הנביא, הח׳ליף עות׳מאן, נוכח נוסחים שונים בקהילות האזוריות, כונן טקסט כתוב מוסמך ושלח עותקים למרכזים הראשיים — והורה להשמיד את הקבצים המתחרים. על אחדים מבכירי הצחאבה נמסר שקובצי־האישיים שלהם נבדלו פה ושם בנוסח או בסדר הסורות.
about.quran.standardization.p2=בעוד נוסח המקרא התגבש במאות שנים ובידיים רבות, נוסח הקוראן קובע בכוונת מכוון, בשלב מוקדם, במהדורה רשמית אחת — סוג אחר של היסטוריה עריכתית, אך היסטוריה עריכתית בכל זאת.
about.quran.orders.title=שני סדרים: של הטקסט ושל ההתגלות
about.quran.orders.p1=הקוראן שרואים לרוב — המוצחף — אינו מסודר לפי סדר התגלותו. אחרי סורת הפתיחה, אל־פאתיחה, הסורות ערוכות בקירוב מהארוכה לקצרה: זהו סדר של קריאה ושינון, לא כרונולוגיה. סדר ההתגלות שונה — הוא נפתח בסורות הקצרות והלוהטות של שנות מכה המוקדמות ונפרש על פני כשני עשורים.
about.quran.orders.p2=הקורא הזה מאפשר לעבור בין השניים, כך שתוכלו לקרוא את הטקסט כפי שהוא נקרא, או להתחקות אחריו כפי שהתגלה. (סדר ההתגלות המדויק הוא שחזור מחקרי ושנוי במחלוקת פה ושם.)
about.quran.meccaMedina.title=מכה ומדינה
about.quran.meccaMedina.p1=המסורת מחלקת את הסורות לאלה שהתגלו במכה ולאלה שהתגלו מאוחר יותר במדינה. סורות מכה נוטות להיות קצרות ופיוטיות יותר — עוסקות באחדות האל, בתחייה ובדין הבא. סורות מדינה ארוכות בדרך כלל ועוסקות יותר בהלכה, בקהילה ובחיי חברה מיושבת.
about.quran.meccaMedina.p2=ידיעה אם קטע הוא מכני או מדני משנה תדיר את אופן קריאתו, ממש כשם שרקע של קטע מקראי משנה.
about.quran.translations.title=הערבית ותרגומיה
about.quran.translations.p1=במסורת האסלאמית הקוראן הוא הטקסט הערבי עצמו; תרגום אינו נחשב לקוראן אלא לפירוש משמעויותיו — ולכן מתרגמים מכתירים את יצירתם "משמעויות הקוראן הנשגב" או "פירוש".
about.quran.translations.p2=הקורא הזה משאיר את ההבחנה גלויה: המהדורה הערבית היא טקסט הבסיס, ותרגום ניתן להצגה מתחת לכל איה, לא במקומה — כך שקוראים את המקור ואת אחד מפירושיו זה לצד זה.
about.quran.callout.title=קריאת הקוראן כאן
about.quran.callout.p1=שתי יכולות נבנו בדיוק לשם כך. מתג הסדר מעביר בין סדר הטקסט לסדר ההתגלות. מלווה התרגום מציב פירוש מתחת לכל איה ערבית, שורה מול שורה — כך שהמקור נשאר ראשי והתרגום תומך בו.
about.quran.callout.p2=המטרה זהה לזו שבמקרא — לתת לטקסט להיקרא בתנאיו שלו, ולהפוך את השכבות העריכתיות והפרשניות לגלויות במקום לסמויות.

