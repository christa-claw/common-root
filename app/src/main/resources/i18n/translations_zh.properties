# ── 《古兰经》部分 ───────────────────────────────────────────────────
about.quran.title=《古兰经》
about.quran.intro=圣经的章与节是在其写成数百年之后才被加诸文本之上的，而《古兰经》则是带着完整的结构问世的。它划分为114章（苏拉），以及各章之内的节（阿亚），属于文本被传述时本来的样子——而非后来覆盖其上的编辑性格栏。《古兰经》给比较阅读者带来的，是穿越同一文本的两条路径，以及原文与其译本之间的区分，而这区分塑造了人们阅读它的方式。
about.quran.original.title=苏拉与阿亚：本有的，而非编辑的
about.quran.original.p1=一章（苏拉）即一卷；一节（阿亚，字面意为"一个迹象"）即一节经文。与圣经的章节编号不同——那是斯蒂芬·朗顿于约1227年、罗伯特·埃斯蒂安于1551年加上的——《古兰经》的章与节属于文本自身的结构，自其最早的传述起便已存在。
about.quran.original.p2=因此，在此处以"编号经文"模式阅读，并不像阅读圣经那样是在去除一层中世纪的叠加；这种编号本就是文本所固有的。
about.quran.standardization.title=一个文本，出于刻意
about.quran.standardization.p1=今日流传的《古兰经》反映出一种刻意的标准化。按传统的记载，在先知逝世约二十年后，哈里发奥斯曼面对各地以互有出入的方式诵读的状况，下令确立一部权威的书面文本，并将抄本送往各大中心——同时下令销毁相竞的抄本。据记载，一些著名的圣门弟子拥有私人抄本，在个别地方的措辞或章次上有所不同。
about.quran.standardization.p2=圣经的文本是在数百年间经众人之手塑成的，而《古兰经》的文本则在早期便被刻意固定为单一的官方校订本——这是另一种编辑史，但终究仍是一种编辑史。
about.quran.orders.title=两种次序：诵读与降示
about.quran.orders.p1=你通常所见的《古兰经》——即"穆斯哈夫"——并非按其降示的次序排列。在开端章《法蒂哈》之后，各章大致由长到短排列：这是为诵读与背记而设的次序，而非按时间先后。降示的次序则不同——它始于麦加早期那些简短而紧迫的章，并在约二十年间逐渐展开。
about.quran.orders.p2=本阅读器让你可以在两者之间切换，从而既能照其诵读的样子阅读文本，也能照其降示的样子追随它。（降示的确切先后由学者们重建而成，并在若干处存有争议。）
about.quran.meccaMedina.title=麦加章与麦地那章
about.quran.meccaMedina.p1=传统将各章分为在麦加降示的与后来在麦地那降示的。麦加章往往较短且更具诗意——关切真主的独一、复活以及将临的清算。麦地那章往往较长，更多关切律法、群体以及定居社会的生活。
about.quran.meccaMedina.p2=知道一段经文属麦加还是麦地那，往往会改变它被阅读的方式，正如一段圣经经文的背景所起的作用一样。
about.quran.translations.title=阿拉伯文及其译本
about.quran.translations.p1=在伊斯兰传统中，《古兰经》就是阿拉伯文文本本身；译本被视为对其意义的诠释，而非《古兰经》本身——这正是译者将其著作题为"光辉《古兰经》之意涵"或"一种诠释"的缘由。
about.quran.translations.p2=本阅读器让这一区分保持可见：阿拉伯文版本是底本，而译文可以显示在每一节之下，而非取而代之，使你同时阅读原文及其译述。
about.quran.callout.title=在此阅读《古兰经》
about.quran.callout.p1=有两项功能正是为此而设。次序切换让你在诵读次序与降示次序之间移动。译文伴读将一段译述置于每一节阿拉伯文经文之下，逐行对齐锁定，使原文始终为主、译文为辅。
