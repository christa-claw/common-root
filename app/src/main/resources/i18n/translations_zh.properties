about.sources.download=每个公有领域的版本都可以整体下载，格式与阅读器自身读取的 XML 相同——书卷、章、节以及阅读顺序序列，遵循 religious-text.xsd 架构。无需账户，无需导出步骤，也无需为了获取一份本就不属于我们扣留的文本而抓取网页。受许可保护的版本不在此提供，而这由端点通过读取每个文本自身的许可来判定，而不是依赖一份清单。
about.sources.downloadTitle=把文本带走
about.texts.downloadThis=将此文本下载为 XML（公有领域）
about.texts.lineageChains=已记录的链条，来自 patch_lineage.py：
about.texts.lineageHow=圣经栏顶部的 ▾ 控件会在每节经文下方展开这条链，每点击一次展开一级，直到抵达底层的希伯来文或希腊文。▴ 则再次收起最深的一级。每一级都标着其版本的缩写和年份——“GNV 1599”——因此一种读法走过的距离是你能亲眼看到的，而不是我们的断言。
about.texts.lineageIntro=译本并不是相互独立的见证。钦定本（King James）的译者以主教圣经（Bishops' Bible）为底本，手边放着廷代尔译本和日内瓦圣经；修订版（Revised Version）修正了钦定本；美国标准版修订了修订版；世界英语圣经又将美国标准版现代化。四个世纪的译者，每一位都在前人的肩头上阅读。
about.texts.lineageModes=梯级以节为单位，因此控件只出现在“分节”和“标题”显示模式中。“原貌”“连续”“分章”保持不间断的文流；你在那里设定的深度会静静保留，切换回来时恢复。层级切换也顾及内容——对你所在书卷无话可说的梯级会被跳过，因此从旧约滚动到新约时，希伯来文见证会自动换成希腊文见证，无需点击。
about.texts.lineageTitle=译本源流——一个版本立于何处
about.texts.lineageWitness=标有 ≈ 的梯级是原文见证。展示它们，是因为一切译本归根结底都立于希伯来文和希腊文之上，而不是因为该版本把它们列为来源——威斯敏斯特列宁格勒抄本和公认经文（Textus Receptus）代表着那个底层。这是一个真实的局限，而非宣称：像 NIV 或 NASB 这样的现代译本依据的校勘本尚未收入本文库，因此它的梯子只是单独一个 ≈ 梯级，而不是一条链。某个版本不在上表中，意味着我们尚未记录它的源流，而不是它没有源流。
