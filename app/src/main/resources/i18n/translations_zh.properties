# === Landing page (AboutView) — 简体中文 ===
about.nav.openReader=打开阅读器

about.hero.title=研读塑造我们世界的经典
about.hero.subtitle=一个自由开放的阅读器，用于探索亚伯拉罕诸教的经典——圣经译本、《古兰经》、圣训与注释——并排对照，支持任何语言，任你深入。
about.hero.cta=打开阅读器 →

about.howto.title=如何使用阅读器
about.howto.intro=阅读器以「栏」为核心。每一栏显示一种文本——一种圣经译本、《古兰经》、一部注释，或你自己的笔记。你可以打开任意多栏，并自由地混合不同传统。
about.howto.step1.title=选择来源
about.howto.step1.body=点击栏标题中的「选择来源…」，从下拉菜单中选取任意译本或文本。
about.howto.step2.title=导航
about.howto.step2.body=使用书卷选择器和章节箭头跳转到任意位置。或者直接滚动——当你滚到底部时，阅读器会自动加载下一章。
about.howto.step3.title=添加更多栏
about.howto.step3.body=点击工具栏中的「添加栏」，在第一栏旁边打开第二或第三种文本。并排比较不同译本或传统。
about.howto.step4.title=同步或自由浏览
about.howto.step4.body=各栏默认一起滚动。点击任意栏标题中的链接图标 🔗，即可解除其链接并独立浏览该栏。
about.howto.step5.title=切换显示模式
about.howto.step5.body=通过标题中的下拉菜单，为每一栏在「原文」「章（1227）」「节（1551）」和「标题」等模式之间切换。各模式的含义见下文。
about.howto.step6.title=跟随注释链接
about.howto.step6.body=当某条注释引用某节经文时，点击该链接——所有打开的圣经栏都会自动跳转到那段经文。
about.howto.step7.title=全文搜索
about.howto.step7.body=点击工具栏中的 🔍 图标，一次搜索所有经文和注释。任何结果都会在新栏中直接打开到对应段落。

about.modes.title=理解各种显示模式
about.modes.intro=每一栏标题中的显示模式选择器控制文本的呈现方式。每种模式都反映出编辑历史的不同层次——有的古老，有的却晚得出人意料。理解这些划分从何而来，会改变你的阅读方式。
about.modes.original.label=原文
about.modes.original.subtitle=Scriptio continua（连写体）
about.modes.original.p1=最早的圣经抄本——无论是新约的希腊文蒲草纸卷，还是宏伟的希伯来文抄本——都以连续的大写字体书写，没有空格、没有标点、没有分章、也没有节号。读者被默认已经足够熟悉文本，能够自行断读。
about.modes.original.p2=此模式重现了那种体验。它是刻意为难人的。读它会迫使你像最早的读者那样面对文本——把它当作连续的论证或叙事，而非一堆孤立、可供引用的片段。许多学者认为，这是最忠实地领会作者本意的方式。
about.modes.chapters.label=章（1227）
about.modes.chapters.subtitle=由斯蒂芬·朗顿添加
about.modes.chapters.p1=斯蒂芬·朗顿（Stephen Langton）是一位英格兰学者，后来成为坎特伯雷大主教。他大约在公元1227年把圣经划分成至今仍在使用的分章系统——这已是经文写成一千多年之后的事。
about.modes.chapters.p2=他的动机很实际：学者们需要一种统一的方式，在神学辩论中引用经文段落。分章从未打算成为受默示的界限。朗顿在浩繁的文本上工作得很快，他的划分有时极佳，有时却很生硬——会在论证、诗篇、甚至句子的中途切断，遮蔽了作者原本的行文脉络。
about.modes.verses.label=节（1551）
about.modes.verses.subtitle=由罗贝尔·埃蒂安添加
about.modes.verses.p1=节号于1551年由法国印刷商罗贝尔·埃蒂安（Robert Estienne，又名 Stephanus）加入新约。据他儿子说，他是在从巴黎前往里昂的途中做出这些划分的，即所谓 inter equitandum——"骑马途中"。骑在马鞍上为经文编号的画面广为流传，却颇有争议；正如任何骑过马的人都清楚，行进之中几乎无法做到，学者们因此推测他其实是利用夜晚在沿途客栈里完成的。无论如何，旅途的仓促或许能解释某些更令人费解的划分。
about.modes.verses.p2=旧约的节号系统随后不久也出现了。和分章一样，分节纯粹是为了便于引用。自此，它们塑造了亿万人阅读和引用经文的方式——往往以原作者从未打算、也未曾预料的方式，把片段从其语境中剥离出来。
about.modes.titles.label=标题
about.modes.titles.subtitle=编辑性的段落标题
about.modes.titles.p1=段落标题——有时称为「分段标题」（pericope）——是出版者和译者为帮助读者导航而添加的编辑性标题。它们并不属于任何原始抄本。
about.modes.titles.p2=它们在各译本之间差异很大：NIV 大量使用，而 KJV 则完全没有。有些标题是有用的概括；有些却在你读到一个字之前，就已把某种神学解释强加于经文之上。先不看标题、再看标题地读，会是一种发人深省的练习。

about.problems.title=当划分扭曲了文本
about.problems.intro=分章与分节塑造了亿万人阅读经文的方式——但它们是在经文写成数百年之后，由人类编辑添加的，有时会横切原本的论证，以真正改变其含义的方式。以下是其中最重要的几个例子。
about.problems.isaiah.ref=以赛亚书 52:13 – 53:12
about.problems.isaiah.title=被劈成两半的预言
about.problems.isaiah.p1=以赛亚书53章的分章切断了其实是一首连续诗篇的内容——常被称为第四首「仆人之歌」。这首诗始于以赛亚书52:13：「我的仆人行事必有智慧，必被高举上升，且成为至高。」这一开篇诗节（52:13–15）为随后第53章的整段经文铺垫，而基督徒将其读作关于受难的预言。
about.problems.isaiah.p2=由于分章把52:13–15归入读者所认为的「以赛亚书52章」，而把主体部分归入「以赛亚书53章」，开篇几节常被忽略。这首诗通常被从53:1开始引用，失去了它戏剧性的开端。把它当作一整段不间断的经文来读——正如原文所呈现的那样——便能恢复这则预言的完整弧线。
about.problems.romans.ref=罗马书 7 – 8
about.problems.romans.title=失去了「因为」的那个「所以」
about.problems.romans.p1=罗马书8章以新约中最著名的句子之一开篇：「如今，那些在基督耶稣里的，就不定罪了。」「如今／所以」一词起着关键作用——它表明保罗正从他刚刚作出的论证中得出结论。
about.problems.romans.p2=但分章把结论与论证分开了。从第8章读起的人，遇到的是一个没有其证明的宣告。保罗在第7章中关于肉体与圣灵之争的论证，正是第8章那份确信的直接根基。分章使罗马书8:1被当作一个独立的应许来读，而非一段持续展开的神学论证的高潮。
about.problems.philippians.ref=腓立比书 4:13
about.problems.philippians.title=经文中最常被误引的一节
about.problems.philippians.p1=「我靠着那加给我力量的，凡事都能做」是圣经中被引用得最广的经节之一——印在商品上、在体育赛事前被援引，并被当作神赐能力的笼统应许。
about.problems.philippians.p2=但在上下文里，保罗谈的是某种远为具体、也远为艰难的事：在贫乏中知足。周围的经文写道：「我无论在什么景况都可以知足，这是我已经学会了。我知道怎样处卑贱，也知道怎样处丰富。」保罗在基督里所能做的「凡事」，乃是以平静的心承受任何境遇——无论丰富还是匮乏。分节把这节经文从此语境中剥离，将一段关于优雅承受苦难的教导，变成了一句关于成功的口号。
about.problems.jeremiah.ref=耶利米书 29:11
about.problems.jeremiah.title=给被掳者、而非给个人的应许
about.problems.jeremiah.p1=「耶和华说：我知道我向你们所怀的意念是赐平安的意念，不是降灾祸的意念，要叫你们末后有指望」是当代基督教文化中最流行的经节之一，常被当作神对个人的应许来套用。
about.problems.jeremiah.p2=但在上下文里，神是在对被掳到巴比伦的全体以色列人说话——而且祂告诉他们一件他们并不愿听的事：被掳要持续七十年。这节充满盼望的经文，嵌在一封吩咐被掳者在巴比伦安顿、盖房、栽园，并接受自己有生之年不得归回的信中。应许是真实的——但它是群体的、长远的，且其前是数十年的苦难。分节使人很容易抽取出安慰，却把语境抛在脑后。
about.problems.john.ref=约翰福音 11:35
about.problems.john.title=最短的一节经文，以及它失去了什么
about.problems.john.p1=「耶稣哭了」是圣经中最短的一节——这一特点使它出名、频繁被引用，也被广泛地孤立背诵。
about.problems.john.p2=在希腊原文中，这节经文是一整幕持续情感场景的一部分：耶稣来到拉撒路的坟墓前，看见马利亚在哭，看见众人在哭，并「心里悲叹，又甚忧愁」——这个短语在希腊文中（embrimaomai）带有愤怒或激动之意，而不只是悲伤。学者们争论耶稣究竟是出于哀恸、出于对哀哭者的怜悯，还是出于某种更复杂的情感而哭。分节把一个神学上极为丰富的时刻，缩减成了一则关于耶稣分担人类情感的动人轶事。
about.problems.callout.title=断章取义与分节系统
about.problems.callout.p1=分节系统无意间为「断章取义」（proof-texting）创造了条件——即引用一节孤立的经文来支持某种神学或道德立场，却不顾其周围的论证。学术辩论与流行文化都受其塑造。一节脱离语境的经文，可能看起来几乎在说与作者本意相反的话。
about.problems.callout.p2=这正是「原文」和「章」这两种显示模式存在的原因。把一章或一卷当作连续的散文来读——没有节号在视觉上的打断——往往能显出一段被节号网格变得几乎不可见的论证、叙事或诗篇。

