about.texts.hadithNote=各圣训集的阿拉伯语正文（matn）为古典文本，属公有领域。英文翻译经由 hadith-api 提供，其来源正逐一按版本核实。
about.texts.ldsHeader=后期圣徒标准经文
about.texts.ldsNote=后期圣徒（摩尔门）标准经文，属公有领域——沿用已久的正文，不含受版权保护的现代研读辅助（脚注、章节摘要及《摩尔门经》导言）。
