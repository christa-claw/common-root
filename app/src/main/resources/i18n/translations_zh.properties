about.about.title=关于本项目
about.about.p1=Common Root? 是一个独立项目，旨在让人人都能认真地对亚伯拉罕诸教经典进行比较研究——无论学者、学生，还是好奇的读者。它不隶属于任何宗教组织或出版机构。这个名字本身是一种邀请：把这些文本并排阅读，由你自己来衡量它们的共通之处与分歧所在。
about.about.p2=平台建立在开源技术之上：Java、Vaadin、Spring Boot、BaseX（一个原生 XML 数据库）以及 MySQL（用于用户账户和评论）。来自公有领域的源文本免费提供。授权译本则经其出版方许可使用。
about.about.p3=新的译本、传统与功能在持续加入。接下来是《古兰经》译本与圣训集，随后是注释整合与交叉引用链接。

about.support.title=支持本项目
about.support.body=Common Root? 是免费的，并将永远免费。如果它对你有用，赞助有助于支付托管、授权译本的访问费用，以及添加新文本和新功能所需的时间。
