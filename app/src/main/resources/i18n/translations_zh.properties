about.modes.simplified.label=简化
about.modes.simplified.subtitle=可读的连续文本
about.modes.simplified.p1=此模式保留了原文连续、不加分割的行文，同时恢复了后世抄写者数百年间加入的内容——词间空格、小写字母和标点。它对应一段真实的历史时期：文本以这种方式变得可读之后很久，仍在没有章节编号的情况下流传。兰顿的分章和艾蒂安的分节还要等上几个世纪。
about.modes.simplified.p2=完整的连写体刻意让人吃力——它一次剥去所有辅助，令人印象深刻，却难以真正用来阅读。这个简化模式只去掉本节所讨论的那一层：章节编号，即那些容易诱发断章取义的后世添加。文本仍然清晰易读，你可以把一卷书当作作者写下的连续论证或叙事来通读，而不是一格格可供引用的单元。如果说完整连写体是偶尔的震撼，这便是不带编号阅读的日常方式。
