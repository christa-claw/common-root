about.sources.note=Les traductions sous licence (NIV, NASB, NBLA) sont utilisées avec autorisation. La reproduction ou la redistribution de contenu sous licence en dehors de cette plateforme n'est pas autorisée. Les textes du domaine public peuvent être librement utilisés et partagés.

about.comments.title=Partagez vos observations
about.comments.body=Créez un compte gratuit pour laisser des commentaires et des notes sur n'importe quel verset. Vos annotations restent privées par défaut — partagez-les si vous le souhaitez. Lire et étudier les textes est toujours gratuit, sans compte.
about.comments.register=Créer un compte gratuit
about.comments.signIn=Se connecter

about.about.title=À propos de ce projet
about.about.p1=Common Root? est un projet indépendant conçu pour rendre l'étude comparative sérieuse des Écritures abrahamiques accessible à tous — spécialistes, étudiants et lecteurs curieux. Il n'est affilié à aucune organisation religieuse ni à aucun éditeur. Le nom est une invitation : lire ces textes côte à côte et juger par soi-même ce qu'ils partagent et là où ils divergent.
about.about.p2=La plateforme repose sur des technologies open source : Java, Vaadin, Spring Boot, BaseX (une base de données XML native) et MySQL (pour les comptes utilisateurs et les commentaires). Les textes sources du domaine public sont disponibles gratuitement. Les traductions sous licence sont utilisées avec l'autorisation de leurs éditeurs.
about.about.p3=De nouvelles traductions, traditions et fonctionnalités sont ajoutées en continu. Le Coran et dix recueils de hadiths sont désormais dans le lecteur aux côtés des traductions de la Bible, et la recherche plein texte dans tous les textes et commentaires est intégrée ; l'intégration des commentaires et les liens de références croisées sont les prochaines étapes.

about.support.title=Soutenir le projet
about.support.body=Common Root? est gratuit et le restera toujours. S'il vous est utile, le parrainage aide à couvrir l'hébergement, l'accès aux traductions sous licence et le temps nécessaire pour ajouter de nouveaux textes et fonctionnalités.
about.support.cta=♥ Soutenir sur GitHub

