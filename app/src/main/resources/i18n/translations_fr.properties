# ── Section Le Coran (page d'accueil) ────────────────────────────────
about.quran.title=Le Coran
about.quran.intro=Là où les chapitres et les versets de la Bible ont été imposés au texte des siècles après sa rédaction, le Coran est arrivé avec sa structure intacte. Sa division en 114 sourates, et les ayât qu'elles contiennent, appartient au texte tel qu'il a été transmis — et non à une grille éditoriale posée par-dessus. Ce que le Coran offre plutôt au lecteur comparatiste, ce sont deux parcours à travers le même texte, et une distinction entre l'original et ses traductions qui façonne la manière dont on le lit.
about.quran.original.title=Sourate et ayah : d'origine, non éditoriales
about.quran.original.p1=Une sourate est un chapitre ; une ayah (littéralement « un signe ») est un verset. Contrairement aux numéros de chapitres et de versets de la Bible — ajoutés par Stephen Langton vers 1227 et Robert Estienne en 1551 — les sourates et les ayât du Coran appartiennent à la structure propre du texte, présentes dès sa plus ancienne transmission.
about.quran.original.p2=Lire ici en mode « Ayât numérotés » ne revient donc pas à défaire une surcouche médiévale, comme c'est le cas pour la Bible ; la numérotation est intrinsèque au texte.
about.quran.standardization.title=Un seul texte, à dessein
about.quran.standardization.p1=Le Coran tel qu'il circule aujourd'hui reflète une standardisation délibérée. Selon le récit traditionnel, une vingtaine d'années après la mort du Prophète, le calife Othman, confronté à des communautés régionales qui récitaient de façons divergentes, fit établir un texte écrit faisant autorité et envoya des copies dans les grands centres — et ordonna la destruction des codices concurrents. On rapporte que certains compagnons éminents possédaient des codices personnels qui différaient par endroits, dans la formulation ou dans l'ordre des sourates.
about.quran.standardization.p2=Là où le texte de la Bible a été façonné par de nombreuses mains au fil des siècles, celui du Coran a été fixé tôt et délibérément en une seule recension officielle — un autre type d'histoire éditoriale, mais une histoire éditoriale tout de même.
about.quran.orders.title=Deux ordres : récitation et révélation
about.quran.orders.p1=Le Coran que vous voyez habituellement — le mushaf — n'est pas disposé dans l'ordre où il a été révélé. Après la sourate d'ouverture, Al-Fatiha, les sourates vont globalement de la plus longue à la plus courte : un ordre pour la récitation et la mémorisation, non une chronologie. L'ordre de la révélation est différent — il commence par les sourates courtes et pressantes des premières années mecquoises et se déploie sur quelque deux décennies.
about.quran.orders.p2=Ce lecteur vous permet de basculer entre les deux, afin que vous puissiez lire le texte tel qu'il est récité ou le suivre tel qu'il a été révélé. (La séquence exacte de la révélation est reconstruite par les spécialistes et débattue par endroits.)
about.quran.meccaMedina.title=Mecquoises et médinoises
about.quran.meccaMedina.p1=La tradition répartit les sourates entre celles révélées à La Mecque et celles révélées plus tard à Médine. Les sourates mecquoises tendent à être plus courtes et plus poétiques — préoccupées de l'unicité de Dieu, de la résurrection et du jugement à venir. Les sourates médinoises tendent à être plus longues et davantage tournées vers la loi, la communauté et la vie d'une société établie.
about.quran.meccaMedina.p2=Savoir si un passage est mecquois ou médinois change souvent la manière dont on le lit, tout comme le cadre d'un passage biblique.
about.quran.translations.title=L'arabe et ses traductions
about.quran.translations.p1=Dans la tradition islamique, le Coran est le texte arabe lui-même ; une traduction est considérée comme une interprétation de son sens plutôt que comme le Coran proprement dit — c'est pourquoi les traducteurs intitulent leur travail « Le sens du noble Coran » ou « une interprétation ».
about.quran.translations.p2=Ce lecteur garde cette distinction visible : l'édition arabe est le texte de base, et une traduction peut être affichée sous chaque ayah plutôt qu'à sa place, de sorte que vous lisez ensemble l'original et l'une de ses restitutions.
about.quran.callout.title=Lire le Coran ici
about.quran.callout.p1=Deux fonctionnalités sont conçues précisément pour cela. Le sélecteur d'ordre vous fait passer de l'ordre récité à l'ordre de la révélation. Le compagnon de traduction place une restitution sous chaque ayah arabe, alignée ligne à ligne, de sorte que l'original reste premier et que la traduction le soutient.
about.quran.callout.p2=Le but est le même qu'avec la Bible — laisser le texte être lu selon ses propres termes, et rendre les strates éditoriales et interprétatives visibles plutôt qu'invisibles.

