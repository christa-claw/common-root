about.sources.download=Chaque édition du domaine public peut être téléchargée en entier, sous la même forme XML que celle que lit le lecteur lui-même — livres, chapitres, versets et séquences d'ordre de lecture, selon le schéma religious-text.xsd. Pas de compte, pas d'étape d'export, pas de moissonnage d'une page web pour obtenir un texte qui n'a jamais été nôtre à retenir. Les éditions sous licence n'y sont pas servies, et le point d'accès en décide en lisant la licence propre de chaque texte plutôt qu'en se fiant à une liste.
about.sources.downloadTitle=Emportez les textes avec vous
about.texts.downloadThis=Télécharger ce texte en XML (domaine public)
about.texts.lineageChains=Chaînes enregistrées, issues de patch_lineage.py :
about.texts.lineageHow=La commande ▾ en haut d'une colonne biblique ouvre cette chaîne sous chaque verset, un barreau par clic, jusqu'à atteindre l'hébreu ou le grec en dessous. ▴ referme le barreau le plus profond. Chaque barreau porte l'abréviation et l'année de son édition — « GNV 1599 » — de sorte que la distance parcourue par une leçon est quelque chose que vous pouvez voir plutôt que quelque chose que nous affirmons.
about.texts.lineageIntro=Les traductions ne sont pas des témoins indépendants. Les traducteurs de la King James travaillaient à partir de la Bishops' Bible, avec Tyndale et Genève à portée de main ; la Revised Version a corrigé la King James ; l'American Standard a révisé la Revised ; la World English Bible a modernisé l'American Standard. Quatre siècles de traducteurs, chacun lisant par-dessus l'épaule du précédent.
about.texts.lineageModes=Les barreaux sont à l'échelle du verset, aussi les commandes n'apparaissent-elles que dans les modes d'affichage Versets et Titres. Original, Continu et Chapitres gardent leur flux ininterrompu ; une profondeur réglée là persiste discrètement et revient quand vous rebasculez. Le déplacement est aussi sensible au contenu — les barreaux qui n'ont rien à dire pour le livre où vous êtes sont sautés, si bien qu'en défilant de l'Ancien Testament au Nouveau, le témoin hébreu cède la place au témoin grec sans un clic.
about.texts.lineageTitle=Lignée des traductions — ce sur quoi repose une édition
about.texts.lineageWitness=Les barreaux marqués ≈ sont des témoins en langue originale. Ils sont affichés parce que toute traduction repose en dernier ressort sur l'hébreu et le grec, non parce que l'édition les nomme comme sa source — le Codex de Léningrad (Westminster) et le Textus Receptus tiennent lieu de ce socle. C'est une limite réelle, non une prétention : une traduction moderne comme la NIV ou la NASB travaille à partir d'éditions critiques qui ne sont pas encore dans ce corpus, si bien que son échelle est un unique barreau ≈ plutôt qu'une chaîne. L'absence d'une édition dans la liste ci-dessus signifie que nous n'avons pas consigné son ascendance, non qu'elle n'en ait pas.
