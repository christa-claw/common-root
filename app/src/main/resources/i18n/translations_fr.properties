# === Landing page (AboutView) — Français ===
about.nav.openReader=Ouvrir le lecteur

about.hero.title=Étudiez les textes qui façonnent notre monde
about.hero.subtitle=Un lecteur libre et ouvert pour explorer les Écritures des religions abrahamiques — traductions de la Bible, le Coran, les hadiths et des commentaires — côte à côte, dans leurs langues originales et en traduction, à toute profondeur.
about.hero.cta=Ouvrir le lecteur →

about.howto.title=Comment utiliser le lecteur
about.howto.intro=Le lecteur s'organise autour de colonnes. Chaque colonne affiche un texte — une traduction de la Bible, le Coran, un commentaire ou vos propres notes. Vous pouvez ouvrir autant de colonnes que vous le souhaitez et mêler librement les traditions.
about.howto.step1.title=Choisir une source
about.howto.step1.body=Cliquez sur « Choisir une source... » dans l'en-tête de la colonne et sélectionnez n'importe quelle traduction ou texte dans le menu déroulant.
about.howto.step2.title=Naviguer
about.howto.step2.body=Utilisez le sélecteur de livre et les flèches de chapitre pour aller où vous voulez. Ou faites simplement défiler — le lecteur charge automatiquement le chapitre suivant lorsque vous arrivez en bas.
about.howto.step3.title=Ajouter des colonnes
about.howto.step3.body=Cliquez sur « Ajouter une colonne » dans la barre d'outils pour ouvrir un deuxième ou un troisième texte à côté du premier. Comparez les traductions ou les traditions côte à côte.
about.howto.step4.title=Synchroniser ou parcourir librement
about.howto.step4.body=Par défaut, les colonnes défilent ensemble. Cliquez sur l'icône de lien 🔗 dans l'en-tête d'une colonne pour la détacher et la parcourir indépendamment.
about.howto.step5.title=Changer de mode d'affichage
about.howto.step5.body=Basculez entre les modes Original, Chapitres (1227), Versets (1551) et Titres pour chaque colonne à l'aide du menu déroulant de l'en-tête. Voir ci-dessous ce qu'ils signifient.
about.howto.step6.title=Suivre les liens des commentaires
about.howto.step6.body=Lorsqu'un commentaire renvoie à un verset, cliquez sur le lien — toutes les colonnes bibliques ouvertes sautent automatiquement à ce passage.
about.howto.step7.title=Tout rechercher
about.howto.step7.body=Cliquez sur l'icône 🔍 dans la barre d'outils pour rechercher dans tous les versets et commentaires à la fois. Chaque résultat s'ouvre directement au passage, dans une nouvelle colonne.

about.modes.title=Comprendre les modes d'affichage
about.modes.intro=Le sélecteur de mode d'affichage dans l'en-tête de chaque colonne détermine la présentation du texte. Chaque mode reflète une strate différente de l'histoire éditoriale — certaines anciennes, d'autres étonnamment récentes. Comprendre d'où viennent ces divisions change votre manière de lire.
about.modes.original.label=Original
about.modes.original.subtitle=Scriptio continua
about.modes.original.p1=Les plus anciens manuscrits bibliques — qu'il s'agisse des papyrus grecs du Nouveau Testament ou des grands codices hébreux — étaient écrits en capitales continues, sans espaces, sans ponctuation, sans division en chapitres et sans numéros de versets. On attendait du lecteur qu'il connaisse déjà le texte assez bien pour le déchiffrer.
about.modes.original.p2=Ce mode recrée cette expérience. Il est délibérément exigeant. Le lire vous oblige à aborder le texte comme le faisaient les premiers lecteurs — comme un raisonnement ou un récit continu, et non comme une collection de fragments isolés et citables. Beaucoup de spécialistes estiment que c'est la façon la plus honnête de rencontrer l'intention première des auteurs.
about.modes.simplified.label=Simplifié
about.modes.simplified.subtitle=Texte continu lisible
about.modes.simplified.p1=Ce mode conserve le flux continu et indivis de l'original, mais rétablit ce que les scribes ont ajouté au cours des siècles suivants — les espaces entre les mots, les minuscules et la ponctuation. Il reflète un intervalle historique réel : longtemps après que les textes furent devenus lisibles ainsi, ils circulaient encore sans numéros de chapitres ni de versets. Les chapitres de Langton et les versets d'Estienne étaient encore à des siècles de distance.
about.modes.simplified.p2=La Scriptio continua intégrale est délibérément éprouvante — elle retire tout d'un coup, ce qui en fait une démonstration saisissante mais un texte difficile à lire vraiment. Ce mode simplifié ne retire que la seule couche dont traite cette section : la numérotation des chapitres et des versets, ces ajouts tardifs qui invitent à la citation hors contexte. Le texte reste lisible, de sorte que vous pouvez lire un livre entier comme le raisonnement ou le récit continu que son auteur a écrit, et non comme une grille de cases citables. Là où la Scriptio continua intégrale est la secousse occasionnelle, ceci est la manière quotidienne de lire sans les numéros.
about.modes.chapters.label=Chapitres (1227)
about.modes.chapters.subtitle=Ajoutés par Stephen Langton
about.modes.chapters.p1=Stephen Langton, un érudit anglais devenu archevêque de Cantorbéry, divisa la Bible selon le système de chapitres encore utilisé aujourd'hui vers 1227 apr. J.-C. — plus de mille ans après la rédaction des textes.
about.modes.chapters.p2=Sa motivation était pratique : les érudits avaient besoin d'une manière cohérente de citer les passages dans les débats théologiques. Les divisions en chapitres n'ont jamais été conçues comme des frontières inspirées. Langton travailla vite sur un texte immense, et ses divisions sont tantôt excellentes, tantôt déconcertantes — coupant au milieu d'un raisonnement, d'un poème, voire d'une phrase, d'une manière qui masque le fil original de l'auteur.
about.modes.verses.label=Versets (1551)
about.modes.verses.subtitle=Ajoutés par Robert Estienne
about.modes.verses.p1=Les numéros de versets furent ajoutés au Nouveau Testament en 1551 par Robert Estienne, un imprimeur français également connu sous le nom de Stephanus. Selon son fils, il établit les divisions inter equitandum — « à cheval » — lors d'un voyage de Paris à Lyon. L'image d'un homme numérotant les versets en selle est célèbre mais contestée ; comme le sait quiconque monte à cheval, c'est à peine possible en mouvement, et les spécialistes soupçonnent qu'il travaillait en réalité le soir, dans les auberges du chemin. Quoi qu'il en soit, la hâte du voyage pourrait expliquer certaines des divisions les plus déroutantes.
about.modes.verses.p2=Le système des versets de l'Ancien Testament suivit peu après. Comme les chapitres, les versets furent ajoutés uniquement pour la commodité des références. Depuis, ils ont façonné la manière dont des milliards de personnes lisent et citent les Écritures — souvent en isolant des fragments de leur contexte d'une façon que les auteurs originaux n'ont jamais voulue ni prévue.
about.modes.titles.label=Titres
about.modes.titles.subtitle=Intertitres éditoriaux
about.modes.titles.p1=Les titres de section — parfois appelés péricopes — sont des intertitres éditoriaux ajoutés par les éditeurs et les traducteurs pour aider le lecteur à se repérer. Ils ne font partie d'aucun manuscrit original.
about.modes.titles.p2=Ils varient considérablement d'une traduction à l'autre : la NIV en use abondamment, tandis que la KJV n'en a aucun. Certains titres sont des résumés utiles ; d'autres imposent une interprétation théologique à un passage avant même que vous n'ayez lu un seul mot. Lire d'abord sans les titres, puis avec, peut être un exercice révélateur.

about.problems.title=Quand les divisions déforment le texte
about.problems.intro=Les divisions en chapitres et en versets ont façonné la manière dont des milliards de personnes lisent les Écritures — mais elles ont été ajoutées par des éditeurs humains des siècles après la rédaction des textes, et elles tranchent parfois le raisonnement original d'une façon qui en change véritablement le sens. Voici quelques-uns des exemples les plus marquants.
about.problems.isaiah.ref=Ésaïe 52:13 – 53:12
about.problems.isaiah.title=Une prophétie coupée en deux
about.problems.isaiah.p1=La coupure de chapitre à Ésaïe 53 traverse ce qui est en réalité un seul poème continu — souvent appelé le quatrième Chant du Serviteur. Le poème commence à Ésaïe 52:13 par : « Voici, mon serviteur prospérera ; il montera, il s'élèvera, il s'élèvera bien haut. » Cette strophe d'ouverture (52:13–15) prépare tout le passage qui suit au chapitre 53, que les chrétiens lisent comme une prophétie de la crucifixion.
about.problems.isaiah.p2=Comme la division en chapitres place 52:13–15 dans ce que les lecteurs considèrent comme « Ésaïe 52 » et le corps principal dans « Ésaïe 53 », les versets d'ouverture sont fréquemment négligés. Le poème est couramment cité à partir de 53:1, perdant son ouverture saisissante. Le lire comme un seul passage ininterrompu — tel que le présente le texte original — restitue tout l'arc de la prophétie.
about.problems.romans.ref=Romains 7 – 8
about.problems.romans.title=Le « c'est pourquoi » qui a perdu son « parce que »
about.problems.romans.p1=Romains 8 s'ouvre sur l'une des lignes les plus célèbres du Nouveau Testament : « Il n'y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ. » Le mot « donc » accomplit un travail décisif — il signale que Paul tire une conclusion d'un raisonnement qu'il vient de mener.
about.problems.romans.p2=Mais la coupure de chapitre sépare la conclusion du raisonnement. Ceux qui commencent au chapitre 8 rencontrent une affirmation sans sa démonstration. Le raisonnement de Paul sur le combat entre la chair et l'esprit au chapitre 7 est le fondement direct de l'assurance du chapitre 8. La division en chapitres a contribué à ce que Romains 8:1 soit lu comme une promesse isolée plutôt que comme le sommet d'un raisonnement théologique soutenu.
about.problems.philippians.ref=Philippiens 4:13
about.problems.philippians.title=Le verset le plus mal cité des Écritures
about.problems.philippians.p1=« Je puis tout par celui qui me fortifie » est l'un des versets les plus cités de la Bible — imprimé sur des produits, invoqué avant les compétitions sportives et brandi comme une promesse générale de puissance divine.
about.problems.philippians.p2=Dans son contexte, Paul parle de quelque chose de bien plus précis et de bien plus exigeant : le contentement dans le dénuement. Les versets environnants disent : « J'ai appris à être content dans l'état où je me trouve. Je sais vivre dans l'humiliation, et je sais vivre dans l'abondance. » Le « tout » que Paul peut faire par le Christ, c'est supporter toute circonstance — l'abondance ou la privation — avec sérénité. La division en versets a arraché le verset à ce contexte et transformé un enseignement sur la souffrance vécue avec grâce en un slogan sur la réussite.
about.problems.jeremiah.ref=Jérémie 29:11
about.problems.jeremiah.title=Une promesse aux exilés, non aux individus
about.problems.jeremiah.p1=« Car je connais les projets que j'ai formés sur vous, dit l'Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l'espérance » est l'un des versets les plus populaires de la culture chrétienne contemporaine, souvent appliqué comme une promesse divine personnelle.
about.problems.jeremiah.p2=Dans son contexte, Dieu s'adresse à toute la communauté des Israélites exilés à Babylone — et il leur dit une chose qu'ils ne voulaient pas entendre : que l'exil durera soixante-dix ans. Le verset plein d'espérance est inséré dans une lettre qui ordonne aux exilés de s'installer à Babylone, de bâtir des maisons, de planter des jardins et d'accepter qu'ils ne reviendront pas de leur vivant. La promesse est réelle — mais elle est collective, à long terme, et précédée de décennies de souffrance. La division en versets a permis d'en extraire facilement le réconfort tout en laissant de côté le contexte.
about.problems.john.ref=Jean 11:35
about.problems.john.title=Le plus court verset et ce qu'il a perdu
about.problems.john.p1=« Jésus pleura » est le plus court verset de la Bible — une particularité qui l'a rendu célèbre, fréquemment cité et largement mémorisé de façon isolée.
about.problems.john.p2=Dans le grec original, le verset fait partie d'une scène d'émotion soutenue : Jésus arrivant au tombeau de Lazare, voyant Marie pleurer, voyant la foule pleurer, et « frémissant en son esprit et tout troublé » — une expression qui, en grec (embrimaomai), porte un sens de colère ou d'agitation, et non de simple tristesse. Les spécialistes débattent pour savoir si Jésus pleura de chagrin, de compassion pour les affligés, ou de quelque chose de plus complexe. La division en versets a réduit un moment théologiquement riche à une anecdote touchante sur Jésus partageant l'émotion humaine.
about.problems.callout.title=La citation hors contexte et le système des versets
about.problems.callout.p1=Le système des versets a créé par inadvertance les conditions de la « citation hors contexte » (proof-texting) — la pratique consistant à citer un verset isolé pour appuyer une position théologique ou morale sans tenir compte du raisonnement qui l'entoure. Le débat savant comme la culture populaire en ont été façonnés. Un verset détaché de son contexte peut sembler dire presque le contraire de ce que l'auteur voulait dire.
about.problems.callout.p2=C'est la raison d'être des modes d'affichage Original et Chapitres. Lire un chapitre ou un livre comme une prose continue — sans l'interruption visuelle des numéros de versets — révèle souvent un raisonnement, un récit ou un poème que la grille des versets avait rendus presque invisibles.

