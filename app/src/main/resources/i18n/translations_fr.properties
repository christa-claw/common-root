about.sources.title=Sources et attribution
about.sources.intro=Tous les textes proviennent de fournisseurs réputés, du domaine public ou sous licence. Nous nous engageons à attribuer correctement chaque texte de cette plateforme. Lorsqu'une licence le permet, le texte intégral est fourni gratuitement pour l'étude personnelle.
