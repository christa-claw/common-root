about.search.body=Une seule barre de recherche couvre désormais toutes les éditions et langues de la bibliothèque — Bible, Coran, hadiths et plus — aux côtés des commentaires. Recherchez un mot ou une expression et vous obtenez un résultat par verset ; choisissez les traductions à ouvrir et comparez-en deux ou plus côte à côte dans des colonnes synchronisées. Vous pouvez aussi coller une liste de références dans la barre d'outils du lecteur pour ouvrir chaque passage dans sa propre colonne d'un coup.

# === Ajouté 2026-07-02 — descriptions des modes d'affichage ===
mode.ORIGINAL.desc=Les manuscrits originaux étaient écrits en majuscules continues (scriptio continua), sans espaces entre les mots ni divisions en chapitres et versets
mode.ORIGINAL_SIMPLE.desc=Texte continu avec espacement des mots et minuscules modernes, mais sans division en chapitres ni versets — tel que les textes se présentaient avant l'introduction de la numérotation
mode.CHAPTERS.desc=Chapitres ajoutés par Étienne Langton, archevêque de Cantorbéry, vers 1227 apr. J.-C.
mode.CHAPTERS_VERSES.desc=Versets ajoutés par Robert Estienne (Stephanus), 1551 apr. J.-C.
mode.TITLES.desc=Les titres de sections sont des ajouts éditoriaux qui varient selon l'éditeur

