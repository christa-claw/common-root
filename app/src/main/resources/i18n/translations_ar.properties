about.texts.lineageChains=السلاسل المسجّلة، من patch_lineage.py:
about.texts.lineageHow=أداة التحكم ▾ أعلى عمود الكتاب المقدس تفتح تلك السلسلة تحت كل آية، درجة واحدة مع كل نقرة، حتى تبلغ النص العبري أو اليوناني في الأساس. أما ▴ فتطوي أعمق درجة من جديد. كل درجة تحمل اختصار طبعتها وسنتها — «GNV 1599» — فتصبح المسافة التي قطعتها قراءةٌ ما شيئًا تراه بعينك لا شيئًا نزعمه نحن.
about.texts.lineageIntro=الترجمات ليست شهودًا مستقلين. فمترجمو ترجمة الملك جيمس عملوا انطلاقًا من «كتاب الأساقفة» وإلى جانبهم تيندل وجنيف؛ والنسخة المنقّحة (Revised Version) صحّحت الملك جيمس؛ والمعيارية الأمريكية نقّحت المنقّحة؛ وكتاب العالم الإنجليزي (WEB) حدّث المعيارية الأمريكية. أربعة قرون من المترجمين، كلٌّ يقرأ من فوق كتف سلفه.
about.texts.lineageModes=الدرجات مفصّلة على مستوى الآية، لذا لا تظهر أدوات التحكم إلا في وضعَي العرض «الآيات» و«العناوين». أما «الأصل» و«المتصل» و«الإصحاحات» فتحافظ على تدفقها غير المنقطع؛ والعمق الذي تضبطه هناك يبقى بهدوء ويعود عندما ترجع. كما أن التدرّج واعٍ بالمحتوى — فالدرجات التي لا شيء عندها عن السفر الذي أنت فيه تُتخطى، فإذا انتقلت بالتمرير من العهد القديم إلى الجديد حلّ الشاهد اليوناني محل العبري دون نقرة.
about.texts.lineageTitle=نسب الترجمات — علامَ تقوم الطبعة
about.texts.lineageWitness=الدرجات الموسومة بعلامة ≈ شهودٌ باللغة الأصلية. تُعرض لأن كل ترجمة تستند في النهاية إلى العبرية واليونانية، لا لأن الطبعة تسمّيها مصدرًا لها — فمخطوطة لينينغراد (وستمنستر) والنص المستلم (Textus Receptus) يقومان مقام ذلك الأساس. وهذا قيد حقيقي لا ادعاء: فترجمة حديثة مثل NIV أو NASB تعمل على طبعات نقدية لم تدخل هذه الذخيرة بعد، فيكون سلّمها درجة ≈ واحدة لا سلسلة. وغياب طبعة عن القائمة أعلاه يعني أننا لم نسجّل نسبها، لا أنْ لا نسب لها.
