about.sources.row.hadith=كتب الحديث — العربية والإنجليزية
about.sources.note=تُستخدَم الترجمات المرخَّصة (NIV وNASB وNBLA) بإذن. ولا يُسمح بإعادة إنتاج المحتوى المرخَّص أو إعادة توزيعه خارج هذه المنصّة. أما نصوص الملكية العامة فيمكن استخدامها ومشاركتها بحرية.

about.comments.title=شارِك استبصاراتك
about.comments.body=أنشئ حسابًا مجانيًا لترك التعليقات والملاحظات على أي آية. تبقى ملاحظاتك خاصة افتراضيًا — وشاركها إن شئت. وقراءة النصوص ودراستها مجانية دائمًا ودون حاجة إلى حساب.
about.comments.register=أنشئ حسابًا مجانيًا
about.comments.signIn=تسجيل الدخول

about.about.title=عن هذا المشروع
about.about.p1=‏Common Root? مشروع مستقل أُنشئ ليجعل الدراسة المقارنة الجادّة للنصوص الإبراهيمية المقدّسة في متناول الجميع — الباحثين والطلاب والقرّاء الفضوليين على حدّ سواء. وهو غير منتسب إلى أي منظمة دينية أو ناشر. والاسم دعوة: أن تقرأ هذه النصوص جنبًا إلى جنب وأن تزن بنفسك ما تشترك فيه وأين تفترق.
about.about.p2=بُنيت المنصّة على تقنيات مفتوحة المصدر: Java وVaadin وSpring Boot وBaseX (قاعدة بيانات XML أصيلة) وMySQL (لحسابات المستخدمين والتعليقات). والنصوص المصدرية من الملكية العامة متاحة مجانًا. أما الترجمات المرخَّصة فتُستخدَم بإذن ناشريها.
about.about.p3=تُضاف ترجمات وتقاليد وميزات جديدة باستمرار. والقادم هو ترجمات القرآن ومجموعات الحديث، يتبعها دمج الشروح وروابط الإحالات المتبادلة.

about.support.title=ادعم المشروع
about.support.body=‏Common Root? مجاني وسيبقى كذلك دائمًا. وإن كان مفيدًا لك، فإن الرعاية تساعد على تغطية الاستضافة والوصول إلى الترجمات المرخَّصة والوقت اللازم لإضافة نصوص وميزات جديدة.
