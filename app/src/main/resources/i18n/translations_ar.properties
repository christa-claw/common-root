# ── قسم القرآن ───────────────────────────────────────────────────────
about.quran.title=القرآن
about.quran.intro=حيث فُرضت إصحاحات الكتاب المقدس وأعداده على النص بعد قرون من كتابته، جاء القرآن وبنيته قائمة. إن تقسيمه إلى 114 سورة، والآيات التي تتضمنها، ينتمي إلى النص كما نُقل — لا إلى شبكة تحريرية وُضعت فوقه لاحقًا. وما يقدّمه القرآن للقارئ المقارن هو بدلًا من ذلك طريقان عبر النص نفسه، وتمييزٌ بين الأصل وترجماته يشكّل كيفية قراءته.
about.quran.original.title=السورة والآية: أصيلة لا تحريرية
about.quran.original.p1=السورة فصل؛ والآية (حرفيًا "علامة") هي العدد. وعلى خلاف أرقام الإصحاحات والأعداد في الكتاب المقدس — التي أضافها ستيفن لانغتون نحو عام 1227 وروبير إستيان عام 1551 — فإن سور القرآن وآياته تنتمي إلى بنية النص ذاتها، وهي حاضرة منذ أقدم نقل له.
about.quran.original.p2=ولذلك فإن القراءة في وضع "آيات مرقّمة" هنا لا تُزيل طبقةً وُضعت في العصور الوسطى، كما هو الحال مع الكتاب المقدس؛ فالترقيم أصيل في النص.
about.quran.standardization.title=نصّ واحد، عن قصد
about.quran.standardization.p1=يعكس القرآن كما هو متداوَل اليوم توحيدًا مقصودًا. وبحسب الرواية التقليدية، فبعد نحو عقدين من وفاة النبي، أمر الخليفة عثمان — في مواجهة جماعات إقليمية تتلو بطرق متباينة — بإثبات نصّ مكتوب مُعتمَد وإرسال نسخ منه إلى الأمصار الكبرى، وأمر بإتلاف المصاحف المنافسة. ويُذكر أن بعض الصحابة البارزين كانت لديهم مصاحف شخصية تختلف في مواضع، في الصياغة أو في ترتيب السور.
about.quran.standardization.p2=وحيث تشكّل نص الكتاب المقدس على أيدٍ كثيرة عبر قرون، فإن نص القرآن ثُبِّت مبكرًا وعن قصد في نسخة رسمية واحدة — وهو نوع مختلف من التاريخ التحريري، لكنه تاريخ تحريري على كل حال.
about.quran.orders.title=ترتيبان: التلاوة والتنزيل
about.quran.orders.p1=القرآن الذي تراه عادةً — المصحف — ليس مرتَّبًا وفق ترتيب نزوله. فبعد السورة الافتتاحية، الفاتحة، تسير السور إجمالًا من الأطول إلى الأقصر: وهو ترتيب للتلاوة والحفظ، لا ترتيب زمني. أما ترتيب التنزيل فمختلف — إذ يبدأ بالسور القصيرة المُلِحّة من سنوات مكة الأولى ويمتد على نحو عقدين.
about.quran.orders.p2=يتيح لك هذا القارئ التبديل بين الترتيبين، فتقرأ النص كما يُتلى أو تتبعه كما نُزِّل. (وتسلسل التنزيل الدقيق أعاد العلماء بناءه، وهو موضع خلاف في بعض المواضع.)
about.quran.meccaMedina.title=مكية ومدنية
about.quran.meccaMedina.p1=تقسّم التقاليد السور إلى ما نزل بمكة وما نزل لاحقًا بالمدينة. وتميل السور المكية إلى أن تكون أقصر وأكثر شعرية — تُعنى بوحدانية الله والبعث والحساب الآتي. أما السور المدنية فتميل إلى أن تكون أطول وأكثر عناية بالشريعة والجماعة وحياة مجتمع مستقر.
about.quran.meccaMedina.p2=ومعرفة كون المقطع مكيًّا أو مدنيًّا تغيّر في الغالب طريقة قراءته، تمامًا كما يفعل سياق المقطع الكتابي.
about.quran.translations.title=العربية وترجماتها
about.quran.translations.p1=في التقليد الإسلامي، القرآن هو النص العربي ذاته؛ وتُعدّ الترجمة تفسيرًا لمعناه لا القرآن نفسه — ولهذا يعنون المترجمون أعمالهم بـ"معاني القرآن الكريم" أو "تفسير".
about.quran.translations.p2=يُبقي هذا القارئ ذلك التمييز ظاهرًا: فالنسخة العربية هي النص الأساس، ويمكن عرض ترجمة أسفل كل آية بدلًا من أن تحلّ محلّها، فتقرأ الأصل وترجمةً له معًا.
about.quran.callout.title=قراءة القرآن هنا
about.quran.callout.p1=ثمة ميزتان بُنيتا لهذا الغرض بالضبط. مُبدِّل الترتيب ينقلك بين ترتيب التلاوة وترتيب التنزيل. ورفيق الترجمة يضع ترجمةً أسفل كل آية عربية، مقفلةً سطرًا بسطر، بحيث يبقى الأصل هو الأساس وتدعمه الترجمة.
about.quran.callout.p2=والغاية هي ذاتها كما مع الكتاب المقدس — أن يُترك النص ليُقرأ بشروطه الخاصة، وأن تُجعل الطبقات التحريرية والتفسيرية ظاهرةً لا خفية.

