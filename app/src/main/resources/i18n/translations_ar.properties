about.modes.simplified.label=مبسّط
about.modes.simplified.subtitle=نص متصل مقروء
about.modes.simplified.p1=يحافظ هذا الوضع على تدفق النص الأصلي المتصل غير المجزأ، لكنه يعيد ما أضافه النسّاخ في القرون التالية — المسافات بين الكلمات والأحرف الصغيرة وعلامات الترقيم. وهو يعكس فترة تاريخية حقيقية: فبعد أن أصبحت النصوص مقروءة بهذه الطريقة بزمن طويل، ظلت تتداول دون أرقام إصحاحات أو آيات. كانت إصحاحات لانغتون وآيات إتيان لا تزال بعيدة قروناً.
about.modes.simplified.p2=إن Scriptio continua الكاملة شاقة عمداً — فهي تجرّد كل شيء دفعة واحدة، مما يجعلها عرضاً مؤثراً لكنها مكان صعب للقراءة الفعلية. هذا الوضع المبسّط يزيل فقط الطبقة التي يتناولها هذا القسم: ترقيم الإصحاحات والآيات، تلك الإضافات المتأخرة التي تغري بالاستشهاد المجتزأ. يبقى النص مقروءاً، فتستطيع قراءة سفر كامل بوصفه الحجة أو السرد المتصل الذي كتبه مؤلفه، لا شبكة من الخلايا القابلة للاقتباس. وحيث تكون Scriptio continua الكاملة هي الهزة العابرة، يكون هذا هو الأسلوب اليومي للقراءة من دون الأرقام.
