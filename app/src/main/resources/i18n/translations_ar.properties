about.nav.openReader=افتح القارئ

about.hero.title=ادرس النصوص التي شكّلت عالمنا
about.hero.subtitle=قارئ حر ومفتوح لاستكشاف نصوص الديانات الإبراهيمية المقدّسة — ترجمات الكتاب المقدّس والقرآن والحديث والشروح — جنبًا إلى جنب، بأي لغة وبأي قدر من العمق.
about.hero.cta=افتح القارئ ←

about.howto.title=كيفية استخدام القارئ
about.howto.intro=القارئ مبنيّ حول أعمدة. يعرض كل عمود نصًّا واحدًا — ترجمة للكتاب المقدّس أو القرآن أو شرحًا أو ملاحظاتك الخاصة. يمكنك فتح أي عدد تشاء من الأعمدة والمزج بين التقاليد بحرية.
about.howto.step1.title=اختر مصدرًا
about.howto.step1.body=انقر على «اختر مصدرًا...» في رأس العمود واختر أي ترجمة أو نص من القائمة المنسدلة.
about.howto.step2.title=تنقّل
about.howto.step2.body=استخدم محدّد الأسفار وأسهم الأصحاحات للانتقال إلى أي موضع. أو مرّر فحسب — يحمّل القارئ الأصحاح التالي تلقائيًا عند بلوغك النهاية.
about.howto.step3.title=أضف مزيدًا من الأعمدة
about.howto.step3.body=انقر على «أضف عمودًا» في شريط الأدوات لفتح نص ثانٍ أو ثالث إلى جانب الأول. قارن بين الترجمات أو التقاليد جنبًا إلى جنب.
about.howto.step4.title=زامِن أو تصفّح بحرية
about.howto.step4.body=تتمرّر الأعمدة معًا افتراضيًا. انقر على أيقونة الربط 🔗 في رأس أي عمود لفصله وتصفّحه على نحو مستقل.
about.howto.step5.title=غيّر وضع العرض
about.howto.step5.body=بدّل بين أوضاع «الأصل» و«الأصحاحات (1227)» و«الآيات (1551)» و«العناوين» لكل عمود عبر القائمة المنسدلة في الرأس. انظر أدناه لمعرفة معاني هذه الأوضاع.
about.howto.step6.title=اتبع روابط الشروح
about.howto.step6.body=عندما يشير شرح ما إلى آية، انقر على الرابط — فتنتقل كل أعمدة الكتاب المقدّس المفتوحة تلقائيًا إلى ذلك المقطع.
about.howto.step7.title=ابحث في كل شيء
about.howto.step7.body=انقر على أيقونة 🔍 في شريط الأدوات للبحث في كل الآيات والشروح دفعةً واحدة. تفتح أي نتيجة مباشرةً عند الموضع في عمود جديد.

about.modes.title=فهم أوضاع العرض
about.modes.intro=يتحكّم محدّد وضع العرض في رأس كل عمود في كيفية تقديم النص. يعكس كل وضع طبقة مختلفة من التاريخ التحريري — بعضها قديم وبعضها حديث على نحو مفاجئ. وفهم مصدر هذه التقسيمات يغيّر طريقة قراءتك.
about.modes.original.label=الأصل
about.modes.original.subtitle=Scriptio continua
about.modes.original.p1=كُتبت أقدم مخطوطات الكتاب المقدّس — سواء البرديات اليونانية للعهد الجديد أو المخطوطات العبرية الكبرى — بخطّ متّصل بأحرف كبيرة، دون مسافات ولا علامات ترقيم ولا فواصل أصحاحات ولا أرقام آيات. وكان يُفترض في القارئ أن يعرف النص جيدًا بما يكفي لتحليله.
about.modes.original.p2=يعيد هذا الوضع خلق تلك التجربة. وهو صعب عن قصد. تجبرك قراءته على التعامل مع النص كما تعامل معه أوائل القرّاء — بوصفه حجّة أو سردًا متّصلًا، لا مجموعة شذرات منعزلة قابلة للاقتباس. ويرى كثير من الباحثين أن هذه أصدق طريقة للقاء مقصد المؤلفين الأصلي.
about.modes.chapters.label=الأصحاحات (1227)
about.modes.chapters.subtitle=أضافها ستيفن لانغتون
about.modes.chapters.p1=قام ستيفن لانغتون، وهو عالم إنجليزي صار رئيسًا لأساقفة كانتربري، بتقسيم الكتاب المقدّس إلى نظام الأصحاحات المستخدَم حتى اليوم نحو عام 1227 للميلاد — أي بعد أكثر من ألف عام من كتابة النصوص.
about.modes.chapters.p2=كان دافعه عمليًّا: احتاج العلماء إلى طريقة موحّدة للاستشهاد بالمقاطع في المناظرات اللاهوتية. ولم يُقصد بتقسيمات الأصحاحات قطّ أن تكون حدودًا موحى بها. وقد عمل لانغتون بسرعة على نص هائل، فجاءت تقسيماته ممتازة أحيانًا ونابية أحيانًا — تقطع في منتصف الحجّة أو القصيدة أو حتى الجملة على نحو يحجب التدفّق الأصلي للمؤلف.
about.modes.verses.label=الآيات (1551)
about.modes.verses.subtitle=أضافها روبير إستيان
about.modes.verses.p1=أُضيفت أرقام الآيات إلى العهد الجديد عام 1551 على يد روبير إستيان، وهو طابع فرنسي يُعرف أيضًا باسم ستيفانوس. وبحسب ابنه، فقد وضع التقسيمات inter equitandum — أي «على ظهر الحصان» — خلال رحلته من باريس إلى ليون. وصورةُ من يُرقّم الآيات وهو في السرج مشهورةٌ لكنها موضع جدل؛ فكما يعرف كل فارس، يكاد ذلك يكون مستحيلًا أثناء الحركة، ويرجّح الباحثون أنه أنجز العمل في الحقيقة مساءً في نُزُل الطريق. وأيًّا كان الأمر، فإن عجلة السفر قد تفسّر بعض التقسيمات الأكثر إثارة للحيرة.
about.modes.verses.p2=وتبع ذلك بعد قليل نظام آيات العهد القديم. ومثل الأصحاحات، أُضيفت الآيات لمجرد التيسير في الإحالة. ومنذ ذلك الحين شكّلت كيفية قراءة مليارات البشر للنص المقدّس واستشهادهم به — كثيرًا ما تعزل الشذرات عن سياقها على نحو لم يقصده المؤلفون الأصليون ولم يتوقّعوه.
about.modes.titles.label=العناوين
about.modes.titles.subtitle=عناوين أقسام تحريرية
about.modes.titles.p1=عناوين الأقسام — وتُسمّى أحيانًا «البريكوب» — هي عناوين تحريرية يضيفها الناشرون والمترجمون لمساعدة القرّاء على التنقّل. وهي ليست جزءًا من أي مخطوطة أصلية.
about.modes.titles.p2=وهي تتفاوت تفاوتًا كبيرًا بين الترجمات: تستخدمها NIV على نطاق واسع، بينما تخلو منها KJV تمامًا. بعض العناوين خلاصات مفيدة؛ وبعضها يفرض تفسيرًا لاهوتيًا على المقطع قبل أن تقرأ كلمة واحدة. والقراءة أولًا دون عناوين ثم بها قد تكون تمرينًا كاشفًا.

about.problems.title=حين تشوّه التقسيمات النص
about.problems.intro=شكّلت تقسيمات الأصحاحات والآيات كيفية قراءة مليارات البشر للنص المقدّس — لكنها أُضيفت على يد محرّرين بشر بعد قرون من كتابة النصوص، وهي تقطع أحيانًا الحجّة الأصلية على نحو يغيّر المعنى فعلًا. وفيما يلي بعض أبرز الأمثلة.
about.problems.isaiah.ref=إشعياء 52:13 – 53:12
about.problems.isaiah.title=نبوءة شُطرت شطرين
about.problems.isaiah.p1=يقطع الفاصل بين الأصحاحين عند إشعياء 53 ما هو في الحقيقة قصيدة واحدة متّصلة — تُسمّى غالبًا «نشيد العبد الرابع». تبدأ القصيدة في إشعياء 52:13 بقوله: «هوذا عبدي يعقل، يتعالى ويرتقي ويتسامى جدًا». وهذه الستانزا الافتتاحية (52:13–15) تمهّد للمقطع كله الذي يتبعها في الأصحاح 53، والذي يقرؤه المسيحيون بوصفه نبوءة عن الصلب.
about.problems.isaiah.p2=ولأن تقسيم الأصحاحات يضع 52:13–15 فيما يعدّه القرّاء «إشعياء 52» ويضع المتن الرئيسي في «إشعياء 53»، كثيرًا ما تُغفَل الآيات الافتتاحية. فيُستشهد بالقصيدة عادةً ابتداءً من 53:1، فتفقد افتتاحها الدرامي. أما قراءتها مقطعًا واحدًا غير منقطع — كما يقدّمها النص الأصلي — فتعيد القوس الكامل للنبوءة.
about.problems.romans.ref=رومية 7 – 8
about.problems.romans.title=«إذًا» التي فقدت «لأنّ»
about.problems.romans.p1=يُستهلّ رومية 8 بأحد أشهر سطور العهد الجديد: «إذًا لا شيء من الدينونة الآن على الذين هم في المسيح يسوع». وكلمة «إذًا» تؤدّي عملًا حاسمًا — فهي تشير إلى أن بولس يستخلص نتيجة من حجّة أوردها للتو.
about.problems.romans.p2=لكن الفاصل بين الأصحاحين يفصل النتيجة عن الحجّة. فمن يبدأ من الأصحاح 8 يلقى إعلانًا بلا برهانه. إن حجّة بولس حول الصراع بين الجسد والروح في الأصحاح 7 هي الأساس المباشر للطمأنينة في الأصحاح 8. وقد أسهم تقسيم الأصحاحات في قراءة رومية 8:1 بوصفه وعدًا قائمًا بذاته بدلًا من كونه ذروة حجّة لاهوتية متواصلة.
about.problems.philippians.ref=فيلبي 4:13
about.problems.philippians.title=أكثر آيات النص المقدّس اقتباسًا في غير موضعها
about.problems.philippians.p1=«أستطيع كل شيء في المسيح الذي يقوّيني» من أكثر آيات الكتاب المقدّس استشهادًا — تُطبَع على السلع، وتُتلى قبل المباريات الرياضية، ويُستحضَر بها وعد عام بالتمكين الإلهي.
about.problems.philippians.p2=أما في سياقها، فبولس يتحدّث عن أمر أكثر تحديدًا وأشدّ صعوبة بكثير: القناعة في الفقر. تقول الآيات المحيطة: «تعلّمت أن أكون مكتفيًا بما أنا فيه. أعرف أن أتّضع وأعرف أيضًا أن أستفيض». فـ«كل شيء» الذي يستطيعه بولس في المسيح هو احتمال أي ظرف — وفرةً كان أم حرمانًا — برباطة جأش. وقد جرّد تقسيم الآيات النصَّ من هذا السياق فحوّل تعليمًا عن احتمال الألم بكرامة إلى شعار عن الإنجاز.
about.problems.jeremiah.ref=إرميا 29:11
about.problems.jeremiah.title=وعد لمسبيّين، لا لأفراد
about.problems.jeremiah.p1=«لأني عرفت الأفكار التي أنا مفتكر بها عنكم، يقول الرب، أفكار سلام لا شر، لأعطيكم آخرة ورجاء» من أكثر الآيات شيوعًا في الثقافة المسيحية المعاصرة، وكثيرًا ما تُطبَّق بوصفها وعدًا إلهيًا شخصيًا.
about.problems.jeremiah.p2=أما في سياقها، فالله يخاطب جماعة بني إسرائيل المسبيّين في بابل بأكملها — ويقول لهم ما لم يريدوا سماعه: إن السبي سيدوم سبعين سنة. فالآية المفعمة بالرجاء مضمَّنة في رسالة تأمر المسبيّين بأن يستقرّوا في بابل ويبنوا البيوت ويغرسوا الجنائن ويقبلوا أنهم لن يعودوا في حياتهم. الوعد حقيقي — لكنه جماعي وبعيد المدى وتسبقه عقود من المعاناة. وقد سهّل تقسيم الآيات انتزاع العزاء وترك السياق وراءه.
about.problems.john.ref=يوحنا 11:35
about.problems.john.title=أقصر آية وما فقدته
about.problems.john.p1=«بكى يسوع» هي أقصر آية في الكتاب المقدّس — ميزة جعلتها شهيرة وكثيرة الاستشهاد وواسعة الحفظ في انعزال عن سياقها.
about.problems.john.p2=في النص اليوناني الأصلي، تُعدّ الآية جزءًا من مشهد عاطفي متّصل: يسوع يصل إلى قبر لعازر، ويرى مريم تبكي، ويرى الجمع يبكي، و«انزعج بالروح واضطرب» — وهي عبارة تحمل في اليونانية (embrimaomai) معنى الغضب أو الاضطراب، لا الحزن وحده. ويختلف الباحثون في ما إذا كان يسوع قد بكى من الأسى، أم من الشفقة على الباكين، أم من شيء أعقد. وقد اختزل تقسيم الآيات لحظةً لاهوتية ثرية إلى طُرفة مؤثّرة عن مشاركة يسوع المشاعر البشرية.
about.problems.callout.title=الاستشهاد الانتقائي ونظام الآيات
about.problems.callout.p1=أوجد نظام الآيات من غير قصد الظروف المواتية للاستشهاد الانتقائي (proof-texting) — أي ممارسة الاستشهاد بآية منعزلة لتأييد موقف لاهوتي أو أخلاقي دون الرجوع إلى الحجّة المحيطة بها. وقد تشكّل بهذا النقاشُ العلمي والثقافةُ الشعبية على السواء. والآية المنتزَعة من سياقها قد تبدو وكأنها تقول نقيض ما قصده المؤلف تقريبًا.
about.problems.callout.p2=ولهذا وُجد وضعا العرض «الأصل» و«الأصحاحات». فقراءة أصحاح أو سفر بوصفه نثرًا متّصلًا — دون المقاطعة البصرية بأرقام الآيات — كثيرًا ما تكشف حجّة أو سردًا أو قصيدة جعلتها شبكة الآيات شبه خفية.

