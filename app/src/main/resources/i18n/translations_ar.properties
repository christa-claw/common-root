about.sources.title=المصادر والإسناد
about.sources.intro=جميع النصوص مأخوذة من مزوّدين موثوقين من الملكية العامة أو بترخيص. ونحن ملتزمون بالإسناد السليم لكل نص على هذه المنصّة. وحيثما يسمح الترخيص، يُتاح النص الكامل مجانًا للدراسة الشخصية.
about.sources.row.bible=نصوص الكتاب المقدّس (ملكية عامة)
about.sources.row.licensed=NIV وNASB وNBLA (مرخَّصة)
