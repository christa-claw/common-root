about.sources.download=كل طبعة في الملكية العامة يمكن تنزيلها كاملة، بصيغة XML نفسها التي يقرأها القارئ — الأسفار والإصحاحات والآيات وتسلسلات ترتيب القراءة، وفق المخطط في religious-text.xsd. لا حساب، ولا خطوة تصدير، ولا كشط لصفحة ويب للحصول على نص لم يكن يومًا ملكنا لنحجبه. أما الطبعات المرخّصة فلا تُقدَّم هناك، ونقطة الوصول تقرر ذلك بقراءة رخصة كل نص بذاتها بدل الاعتماد على قائمة.
