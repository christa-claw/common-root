# صفحة «حول» — قسم البحث + تسميات إصدارات اللغات الأصلية
about.search.title=ابحث في كل شيء
about.search.body=أصبح صندوق بحث واحد يشمل الآن كل إصدار ولغة في المكتبة — الكتاب المقدّس والقرآن والحديث وغيرها — إلى جانب الشروح. ابحث عن كلمة أو عبارة فتحصل على نتيجة واحدة لكل آية؛ اختر الترجمات التي تريد فتحها، وقارن اثنتين أو أكثر جنبًا إلى جنب في أعمدة متزامنة. ويمكنك أيضًا لصق قائمة من المراجع في شريط أدوات القارئ لفتح كل مقطع في عموده الخاص دفعةً واحدة.
