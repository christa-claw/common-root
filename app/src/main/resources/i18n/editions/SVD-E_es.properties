title=Smith & Van Dyck (texto de eBible) — Sobre esta edición | Common Root
description=La Biblia árabe de Smith y Van Dyck de 1865, en el texto electrónico completamente vocalizado que eBible.org publica como dominio público, a partir del archivo fuente de la Sociedad Bíblica Americana.
heroHeading=Smith & Van Dyck — el texto completamente vocalizado
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Esta es la misma traducción que [[SVD|Smith & Van Dyck]] —la Biblia árabe que Eli Smith comenzó en Beirut y Cornelius Van Dyck terminó en 1865, con los sabios árabes Butrus al-Bustani, Nasif al-Yaziji y Yusuf al-Asir— compuesta a partir de un archivo electrónico distinto. La traducción es la misma; el archivo es la razón de que exista esta edición.
hero.2=Una Biblia de 1865 es libre para cualquiera, pero una copia electrónica de ella es también el trabajo de alguien, y el texto de Van Dyck circula por la red en muchas copias de origen incierto. Algunas se ofrecen con una reivindicación de derechos de autor sobre la transcripción misma. Un texto cuyo origen no puede rastrearse no puede imprimirse con confianza, así que esta edición usa una copia cuyo origen sí puede rastrearse: la que publica eBible.org, declarada de dominio público, que nombra a la Misión Siria como traductora y a la Sociedad Bíblica Americana como contribuyente de la fuente. El archivo está fechado el 2020-08-03.
hero.3=Está completamente vocalizado. Cada palabra lleva sus vocales breves y las demás marcas de lectura, mientras que el otro texto de Van Dyck en este lector va en su mayoría sin vocalizar. Eso lo hace más lento de componer y más fácil de leer en voz alta, y una página vocalizada necesita más espacio entre líneas, de modo que una copia impresa de esta edición resulta más larga que el mismo texto sin vocalizar.
hero.4=Es la edición que elegir cuando la pregunta es si el texto puede imprimirse. Para leer en pantalla, cualquiera de los dos Van Dyck sirve igual.

