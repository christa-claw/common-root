title=Koran — Sablukow — Über diese Ausgabe | Common Root
description=Gordi Sablukows russische Übersetzung, 1878 in Kasan veröffentlicht und meist als die erste russische Koranübersetzung bezeichnet, die unmittelbar aus dem Arabischen und nicht über eine französische oder englische Zwischenstufe entstand — und in diesem Korpus die russische Begleitübersetzung, die unter dem uthmanischen arabischen Text erscheint.
heroHeading=Koran — Sablukow
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordi Semjonowitsch Sablukow (1803–1880) wurde für den russisch-orthodoxen Klerus ausgebildet und schloss 1826 das Geistliche Seminar Orenburg und 1830 die Geistliche Akademie Moskau ab. Die folgenden zwei Jahrzehnte, von 1830 bis 1849, lehrte er Geschichte und orientalische Sprachen am Geistlichen Seminar Saratow — wo Mitte der 1840er-Jahre der spätere radikale Schriftsteller Nikolai Tschernyschewski zu seinen Schülern zählte —, bevor er 1849 in die Missionsabteilung der Geistlichen Akademie Kasan wechselte, wo er bis 1862 orientalische und klassische Sprachen lehrte.
hero.2=Russische Koranübersetzungen reichen zurück bis 1716, als Pjotr Postnikow im Auftrag Peters des Großen eine anfertigte — jedoch aus dem Französischen von André du Ryer, nicht aus dem Arabischen, ebenso wie Alexei Kolmakows Übersetzung von 1792, die aus dem Englischen von George Sale stammte. Sablukows Übersetzung, 1878 in Kasan unter dem Titel "Коран, законодательная книга мохаммеданского вероучения" ("Der Koran, das Gesetzbuch des mohammedanischen Glaubens") veröffentlicht, gilt üblicherweise als die erste russische Koranübersetzung, die unmittelbar aus dem arabischen Original entstand — das Ergebnis seiner Jahre als Lehrer orientalischer Sprachen in Kasan.
hero.3=Im darauffolgenden Jahr fügte er einen Begleitband mit Anmerkungen hinzu, "Приложения к переводу Корана" (1879), und später zwei weitere, damit verbundene Studien: "Сведения о Коране" ("Angaben zum Koran", 1884) und eine frühere vergleichende Abhandlung über christliche und muslimische Lehren zu den Namen Gottes (1873). Seine Übersetzung blieb seither eine der stärker verbreiteten russischen Fassungen, auch nachdem spätere Übersetzungen — darunter die postum veröffentlichte von Ignati Kratschkowski — in der sowjetischen und postsowjetischen akademischen Nutzung bekannter wurden.
hero.4=Was hier in der Ausgabe ru.sablukov von alquran.cloud digitalisiert wurde, wird in diesem Korpus als russische Begleitübersetzung zu [[Q-AR|dem uthmanischen arabischen Text]] angeboten, neben den englischen Übersetzungen von [[Q-EN|Pickthall]] (1930) und [[Q-YA|Yusuf Ali]] (1934) — den drei Übersetzungen, die eine Durchsicht der verfügbaren Übersetzungen als eindeutig frei nutzbar fand, je eine pro Sprache neben dem Arabischen.

