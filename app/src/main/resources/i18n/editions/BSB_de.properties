title=Berean Standard Bible — Über diese Ausgabe | Common Root
description=Die Berean Standard Bible: eine moderne englische Übersetzung der Teams von Bible Hub und Discovery Bible aus dem masoretischen Hebräisch und einem selbst herausgegebenen griechischen Neuen Testament — und dann in die Gemeinfreiheit verschenkt.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Die Berean Standard Bible ist eine der jüngsten Übersetzungen dieser Sammlung und eine der offensten über ihr eigenes Vorgehen. Gemacht haben sie die Teams hinter Bible Hub und Discovery Bible unter einem beratenden Ausschuss, und sie erschien zuerst unter einem anderen Namen: Berean Study Bible. Das sorgte für anhaltende Verwirrung, denn eine study Bible meint gewöhnlich eine mit Kommentar und Anmerkungen aufgefüllte Bibel, was diese nicht ist. Die Übersetzung wurde umbenannt; die Abkürzung blieb.
hero.2=Die meisten Übersetzungen beginnen bei einem griechischen Neuen Testament, das jemand anders herausgegeben hat. Dieses Projekt baute zuerst sein eigenes. Die Berean Greek Bible nimmt Nestle 1904 zur Grundlage — gewählt, wie ihre Herausgeber sagen, weil es der genaueste kritische Text ist, der bereits gemeinfrei vorliegt — und kollationiert ihn gegen Nestle–Aland, das griechische Neue Testament der SBL, Tischendorf, Westcott–Hort, den byzantinischen Text und den Textus Receptus, mit Fußnoten dort, wo sie auseinandergehen. Das Englische wurde daraus übersetzt. Das Alte Testament kommt aus dem masoretischen Hebräisch, wobei die Schriftrollen vom Toten Meer, die Septuaginta und andere frühe Zeugen herangezogen wurden, wo sie eine Lesart betreffen. Dieselbe Arbeit erschien dann in Schichten: als Wort-für-Wort-Interlinear, als steif wörtliche Ausgabe und als diese lesbare, sodass ein Leser Schritt für Schritt vom Griechischen ins Englische gehen kann, statt den Übersetzern aufs Wort zu glauben. Das stellt die Berean auch auf die andere Seite einer Scheidelinie, die dieses Korpus sichtbar macht: die Genfer Bibel und die King James Version stammen hier vom Textus Receptus ab, diese nicht.
hero.3=Das Letzte, was das Projekt mit dem Text tat, war, ihn wegzugeben. Die Berean-Texte wurden im April 2023 in die Gemeinfreiheit entlassen, und deshalb kann die ganze Bibel in diesem Korpus liegen und wieder aus ihm herauskopiert werden. Stellt man die Oberfläche des Lesers auf Englisch, öffnet die New International Version, die hier unter Lizenz steht; die Berean ist das moderne Englisch daneben, das jeder zitieren, drucken und weitergeben darf. In den Abstammungssprossen verhält sie sich wie die Biblia en Español Sencillo. Für sie ist keine Vorlage verzeichnet, denn sie ist eine neue Übersetzung und nicht die Revision von etwas, das dieses Korpus führt; eine unter einem Berean-Vers geöffnete Sprosse fällt daher geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden statt auf eine ältere englische Bibel. Auch die Jahreszahl lässt der Katalog leer. Das ist kein Versehen — der Text wird weiter revidiert, wie Korrekturen eingehen, und die Jahreszahlen hier sind kuratiert und nicht geraten, sodass eine Ausgabe ohne einen einzigen datierten Druck kein Datum bekommt.

