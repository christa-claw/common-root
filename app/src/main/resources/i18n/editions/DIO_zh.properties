title=迪奥达蒂圣经 1649（意大利文）— 关于此版本 | Common Root
description=乔瓦尼·迪奥达蒂的意大利文圣经：1607 年刊于日内瓦，是第一部据希伯来文与希腊文而非武加大译本译成的意大利文圣经，1641 年经他亲手加注修订——以及文件上的年份为何是他去世之年。
heroHeading=迪奥达蒂圣经 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=乔瓦尼·迪奥达蒂 1576 年生于日内瓦，其家为卢卡的商贾，宁可离开意大利也不肯舍弃信仰。他血脉上是意大利人，学养上是日内瓦人，而这本书之所以存在，全在于这一结合：他握有宗教改革未曾抵达的那个国度的语言，而他所立之处，正是已成为宗教改革印刷所的城市。他二十一岁时，特奥多尔·贝扎举荐他出任希伯来文教席。1606 年他任神学教授，1608 年受任牧师，次年继贝扎而主神学讲席；1618 年他以日内瓦代表的身份赴多特会议，并是受命撰录会议纪要的六人之一。
hero.2=他的意大利文圣经 1607 年刊于日内瓦。意大利此前不是没有俗语圣经——马莱尔米的成于 1471 年，布鲁乔利的成于 1532 年——但它们或据拉丁文而作，或极重地倚仗拉丁文。迪奥达蒂则直趋希伯来文与希腊文；就新约而言，那便是贝扎早一辈在同一座城中所校订的希腊文本。1641 年他出了一个附有自撰注释的修订版，后世重印皆自此而出。它成了、并且一直是意大利的新教圣经——而在一个几乎没有新教读者的国度，这意味着四百年间抱持它的始终是极少数人。他也把圣经译成了法文，成于 1644 年；那一部通常被视为二者中较弱的，他本人大概也不会争辩。
hero.3=目录卡片上的年份值得一句话，因为那里并没有年份。此文本在数字世界中以“迪奥达蒂 1649”之名流传，而 1649 并非某个版本——那是迪奥达蒂去世的年份。真正有所指的两个年份，是译本初次问世的 1607 年，和他加以修订的 1641 年。某一份数字文件究竟代表其中哪一个，本项目并未查实，故目录宁可让年份一栏留白，也不印一个自己担不起的数字。名称则一仍其旧，因为人们要查的正是这个名字。
hero.4=在本阅读器中，它是唯一的意大利文圣经，所以把界面设为意大利文便在它上面开启——并非因为它被挑选出来，如同西班牙文选定了 Reina-Valera 1909 那样，而是因为目录扫描在这门语言里找不到别的。谱系阶梯中未为它记录任何母本，所以在某一节之下展开的阶梯径直落到以 ≈ 标示的原文底层。该底层为希腊文提供公认文本，而在此处这异乎寻常地贴近实情：本语料库中多数版本的公认文本，其实是代替译者当年真正使用的校勘本而立；迪奥达蒂却确确实实是据那一系的一部希腊文印本而作。它的阶梯标签不带年份，正与卡片上的空白相合。

