fact.1.label=语言
fact.1.value=意大利文
fact.2.label=译者
fact.2.value=乔瓦尼·迪奥达蒂（1576–1649），生于日内瓦，其家为新教商贾，宁可离开卢卡也不肯舍弃信仰
fact.3.label=初次刊行
fact.3.value=1607 年，于日内瓦——第一部据希伯来文与希腊文而非拉丁文译成的意大利文圣经
fact.4.label=修订版
fact.4.value=1641 年，附迪奥达蒂自撰注释；其后三百年间，此文本即以此种形态重印
fact.5.label=名称何以作 1649
fact.5.value=1649 是迪奥达蒂去世之年，并非某版本之年——该年份随数字文本一路同行，而目录卡片宁可让年份一栏留白，也不断言一个年份
fact.6.label=新约背后的希腊文
fact.6.value=贝扎早一辈在日内瓦所出的诸版——属于本语料库以[[TR|公认文本]]之名收存的那一系希腊文印本
fact.7.label=同出其手
fact.7.value=一部法文圣经，成于 1644 年，通常被视为二者中较弱的——法文并非他用以思考的语言
fact.8.label=内容
fact.8.value=66 卷——新教正典，不含次经
fact.9.label=在本语料库中
fact.9.value=此处唯一的意大利文圣经，所以意大利文界面在它上面开启；谱系阶梯中未记录任何母本，其阶梯标签不带年份
