title=フリーダム・バイブル — この版について | Common Root
description=フリーダム・バイブル(Japanese Freedom Bible):eBible.orgが著作権の設定されていない翻訳の草案として配布している、66書からなる完全な日本語聖書。このコーパスで唯一の日本語聖書であり、そのため日本語インターフェースはこの版を開く。
heroHeading=フリーダム・バイブル
readerHref=/reader?c1.src=jfb

hero.1=フリーダム・バイブル——英語名Japanese Freedom Bible——は、eBible.orgが配布する完全な日本語聖書であり、eBible.orgは自らをこの翻訳の公式な配布元と称している。きわめて新しい訳である。このコーパスが保持する原典ファイルの日付は2026年8月19日で、カードにある2026年はそれらのファイルの日付である。eBibleは別個の出版日を示しておらず、ここでもそれを断定しない。
hero.2=この訳について記録されていないことは多く、それははっきり述べておくべきである。eBibleのページは翻訳者・委員会・出版者のいずれも挙げておらず、何から訳されたのか——ヘブライ語とギリシャ語から直接か、別の現代訳を経由したのか——も述べていない。この訳自身の著作権ページはこれを「翻訳の草案」と呼び、改善の提案を募っている。したがって、ここにある本文は定まった版ではなく、進行中の仕事の一時点を写したものである。
hero.3=明らかなのはその法的な位置づけである。同じページは、この翻訳には著作権が設定されていないと述べ、パブリックドメインと表示している。それゆえ、これがこのコーパスの日本語テキストとなった。eBible上で著作権に縛られない完全な日本語聖書は、これだけだったからである。この訳に系譜を与ええたはずのより古い日本語聖書、すなわち1887年に完成し、とうにパブリックドメインとなっている明治期の翻訳は、その配布元からは入手できない。
hero.4=このコーパスでは、プロテスタント正典の66書、31,098節を収め、第二正典は含まない。底本の記録がないため、その一節の下で段を開くと、≈ 印で示された原語の底面へ直接たどり着く。そこに表示されるヘブライ語とギリシャ語は証人であって、この訳が何から訳されたかの主張ではない——出所が不明である以上、それこそが誠実な読み方である。このコーパスで唯一の日本語聖書であり、そのため日本語インターフェースは標準でこの版を開く。

