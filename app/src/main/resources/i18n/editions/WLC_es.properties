title=Códice de Leningrado — Acerca de esta edición | Common Root
description=El Códice de Leningrado: el manuscrito completo más antiguo que existe de la Biblia hebrea, copiado en 1008 d. C. y todavía el texto base de la mayoría de las traducciones modernas del Antiguo Testamento.
heroHeading=Códice de Leningrado
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=Este es el manuscrito completo más antiguo que se conserva de la Biblia hebrea. Lo copió un escriba llamado Samuel ben Jacob, que trabajaba en el Viejo Cairo y que, en una nota de su puño al final del manuscrito, fechó su trabajo en el año 1008 d. C.
hero.2=Samuel ben Jacob no inventaba un texto: lo preservaba. Trabajó dentro de la tradición de la familia Ben Aser, la máxima autoridad en la masora, el elaborado sistema de signos vocálicos, marcas de cantilación y notas marginales que los sabios judíos habían ido refinando durante siglos para fijar la pronunciación de la Biblia hebrea y protegerla de la corrupción. Sí se conserva un manuscrito Ben Aser más antiguo y probablemente más autorizado —el Códice de Alepo—, pero gran parte de su sección de la Torá se perdió en 1947. El Códice de Leningrado se aprecia precisamente porque está completo y es lo bastante antiguo como para situarse en el origen mismo de esa tradición.
hero.3=Debe su nombre a la ciudad donde acabó depositado: Leningrado, como se llamaba San Petersburgo cuando el manuscrito entró en la erudición occidental, un nombre que se le quedó incluso después de que la ciudad recuperara el suyo en 1991. Hoy es la base de la Biblia Hebraica Stuttgartensia, la edición académica de referencia de la Biblia hebrea, lo que significa que casi cualquier traducción moderna del Antiguo Testamento, en casi cualquier lengua, se remonta a la copia cuidadosa de un solo escriba cairota del siglo XI, sepan o no sus lectores cómo se llamaba.

