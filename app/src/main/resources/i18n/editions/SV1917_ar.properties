title=Svenska 1917 — عن هذه الطبعة | Common Root
description=ترجمة كنيسة السويد لعام 1917 — Gustav V:s bibel — أول كتاب مقدّس سويدي يُصنع مباشرة من العبرية واليونانية بدل أن يكون مراجعة لما قبله، والكتاب المقدّس السويدي الوحيد الذي تحمله هذه المجموعة.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=طوال ثلاثة قرون ونصف، كان لكنيسة السويد كتاب مقدّس واحد، يُراجَع ولا يُصنع من جديد قط. اعتمد كتاب غوستاف فاسا المقدّس لعام 1541، أول كتاب مقدّس كامل يُطبع بالسويدية، اعتمادًا كبيرًا على ألمانية مارتن لوثر. وراجعه كتاب غوستاف الثاني أدولف المقدّس لعام 1618، ثم جاء Karl XII:s bibel لعام 1703 — الذي أُنجز في عهد ملكٍ مع أن أباه هو من أمر به قبله — فحمل تلك السويدية الموروثة نفسها خطوة أخرى إلى الأمام. ولم تعد واحدة من الثلاثة إلى البداية من جديد.
hero.2=في سنة 1773 عيّن غوستاف الثالث لجنة كتابية لتفعل ما لم تفعله أي من تلك المراجعات: أن تترجم مباشرة عن العبرية واليونانية بدل أن تحمل السويدية القديمة خطوة أخرى إلى الأمام. وجلست اللجنة 144 سنة. وجاءت نتيجتها — ثاني ترجمة كاملة للكتاب المقدس في السويد، بعد ترجمة غوستاف فاسا وقبل Bibel 2000 — منجَزة ومصدَّقة في عهد غوستاف الخامس سنة 1917، ولهذا ما زالت تُدعى غالبًا Gustav V:s bibel.
hero.3=يقوم العهد القديم على النص العبري المسوري، كما قامت عليه الطبعات التي سبقته. أما العهد الجديد فلا يسير على خطّها: فهو يتبع أحدث نصّ يوناني نقدي كان متاحًا للجنة حتى سنة 1917، لا النصّ المستلم الذي تُبنى عليه كتب هذه المجموعة المقدّسة من عصر الإصلاح.
hero.4=في هذا القارئ هو الكتاب المقدس السويدي الوحيد، فضبط الواجهة على السويدية يفتح عليه — لا لأنه انتُقي انتقاءً، كما انتُقيت Reina-Valera 1909 للإسبانية، بل لأن مسح الفهرس لا يجد في اللغة غيره. وليس له في درجات النسب أصل مسجّل، فالدرجة المفتوحة تحت آية تهبط رأسًا إلى أرضية اللغات الأصلية المعلَّمة بـ ≈. وتلك الأرضية تقدّم للغة اليونانية النصّ المستلم، وههنا يبعد ذلك عن الحقيقة أكثر من المعتاد: فاللجنة تركت النصّ المستلم عمدًا من أجل نصّ نقدي أحدث، فالأرضية تحت آية من هذه الترجمة تسمّي نصًّا يونانيًا ليس هو النصّ الذي تبعته هذه الترجمة فعلًا.

