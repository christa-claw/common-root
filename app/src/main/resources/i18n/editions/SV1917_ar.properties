fact.3.label=هذه الترجمة
fact.3.value=أُنجزت وصُدِّقت في عهد غوستاف الخامس سنة 1917؛ وما زالت تُدعى غالبًا Gustav V:s bibel
fact.4.label=سبقتها
fact.4.value=Karl XII:s bibel (1703) — وهي نفسها مراجعة تمتدّ عبر كتاب غوستاف الثاني أدولف المقدّس (1618) إلى كتاب غوستاف فاسا المقدّس (1541)
fact.5.label=أزاحتها
fact.5.value=Bibel 2000 (1972–2000)؛ وقد جمعت طبعة وسيطة بين العهد القديم من هذه الترجمة ومراجعة للعهد الجديد سنة 1981
fact.6.label=العهد القديم عن
fact.6.value=العبرية الماسورية، وتقدّم لها الأرضيةُ شاهداً [[WLC|مخطوطة لينينغراد الوستمنسترية]] التي في هذه المجموعة
fact.7.label=العهد الجديد عن
fact.7.value=أحدث نصّ يوناني نقدي كان متاحًا للجنة حتى سنة 1917، لا [[TR|النصّ المتلقَّى]] الذي تُبنى عليه كتب هذه المجموعة المقدّسة من عصر الإصلاح
fact.8.label=الرخصة
fact.8.value=ملك عام
fact.9.label=في هذه المجموعة
fact.9.value=الكتاب المقدس السويدي الوحيد ههنا، فتفتح عليه الواجهة السويدية بالتلقائي لا بانتقاء مدروس؛ وليس له في درجات النسب أصل مسجّل
