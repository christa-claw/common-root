title=Câmiu't-Tirmizî — Bu Baskı Hakkında | Common Root
description=Câmiu't-Tirmizî: Ebu İsa et-Tirmizî'nin her rivayetin gücünü açıkça derecelendirerek ve fakihlerin ondan çıkardığı hukuki tartışmaları kaydederek oluşturduğu hadis derlemesi — Sünni İslam'ın Altı Kitabı'ndan biri sayılır.
heroHeading=Câmiu't-Tirmizî
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Ebu İsa Muhammed bin İsa et-Tirmizî, hicri 209 (miladi 824) yılı civarında, bugün Özbekistan–Afganistan sınırında yer alan Horasan'da, Termiz yakınlarında doğdu. Yaklaşık yirmi yaşında hadis tahsiline başladı ve hicri 235 yılından itibaren hadis aramak için Horasan, Irak ve Hicaz üzerinden seyahat etti; başlıca hocası Muhammed el-Buhari'nin yanı sıra Müslim bin el-Haccac, Ebu Davud es-Sicistani, Kuteybe bin Said ve Ali bin Hucr'dan ders aldı. Ömrünün sonlarına doğru gözlerini kaybetti; "ed-Darir" ("Kör") lakabı buradan gelir. Termiz bölgesine döndü ve burada hicri 279 (miladi 892) yılının receb ayının on üçünde, yaklaşık yetmiş yaşında vefat etti.
hero.2=Tam adı, el-Câmiu'l-Muhtasar mine's-Sünen an Resulillâh ve Ma'rifeti's-Sahîh ve'l-Ma'lûl ve mâ aleyhi'l-Amel, genellikle Câmiu't-Tirmizî veya Sünenü't-Tirmizî olarak kısaltılır. Sahih al-Buhari ve Sahih-i Müslim yalnızca derleyicilerinin tam sahih saydığı hadisleri kabul ederken, et-Tirmizî her hadisi metnin içinde açıkça derecelendirdi — sahih, hasen, zayıf veya garib — ve hadisi dışarıda bırakmak yerine daha zayıf bir derecelendirmenin gerekçelerini açıkladı; ayrıca hukuk mezheplerinin (mezâhib) nerede ayrıldığını ve her tarafın hangi delillere başvurduğunu ortaya koydu; bu da kitabı kendi başına bir hadis derlemesi olduğu kadar hadise dayalı hukuki muhakemeye bir kılavuz da yapar.
hero.3=Sünni gelenek onu, genellikle Sahih al-Buhari, Sahih-i Müslim ve Sünen-i Ebu Davud'dan sonra Altı Kitap arasında sayar; kalan kitaplar arasında tam olarak nerede durduğu — ve altıncı sırayı hangi derlemenin doldurduğu, Sünen-i İbn Mâce'nin yaygın ama tarihsel olarak önerilen tek cevap olmadığı — uzun zamandır tartışılmış, ancak çözülmemiştir; bu derlemedeki diğer Sünen kitapları için de durum aynıdır. Kitap için verilen hadis sayısı aynı nedenle değişir: geleneksel sayıma göre yaklaşık 4.330, başka yerlerde yaklaşık 4.400 olarak anılır; yapısı da değişik şekillerde tanımlanır — 46 kitap, Ahmed Muhammed Şâkir'in Kahire baskısında 49 bölüm, veya elli bölüm. Bu derlemenin kendi rakamı ise bambaşka bir rakamdır: 49 kitap ve 3.998 numaralı hadis; bu, alındığı dijital baskının biçimidir, herhangi bir belirli basılı geleneği yansıttığı iddiası değildir.
hero.4=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-tirmidhi baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin Sahih al-Buhari, Sahih-i Müslim, Sünen-i Ebu Davud ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

