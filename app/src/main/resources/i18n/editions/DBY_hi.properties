title=डार्बी 1885 (फ़्रांसीसी) — इस संस्करण के बारे में | Common Root
description=1885 की फ़्रांसीसी डार्बी बाइबिल: पो–वेवे अनुवाद, जिसे जॉन नेल्सन डार्बी और उनके सहयोगियों ने 1859 में आरम्भ किया और जो उनकी मृत्यु के तीन वर्ष बाद पूरा हुआ — और वही संस्करण जिससे आगे चलकर उनका अंग्रेज़ी पुराना नियम बनाया गया।
heroHeading=डार्बी 1885 (फ़्रांसीसी)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=जॉन नेल्सन डार्बी को और बातों के लिए स्मरण किया जाता है — उन्होंने आयरलैंड की कलीसिया छोड़ी, प्लीमथ ब्रदरन की स्थापना में सहयोग दिया और डिस्पेंसेशनल पूर्व-सहस्राब्दिवाद को प्रचलित किया — किन्तु उन्होंने अपने जीवन का बड़ा भाग बाइबिल के अनुवाद में बिताया, और वह भी तीन भाषाओं में। उनमें असामान्य बात क्रम है। अधिकांश अनुवादक अपनी ही भाषा से बाहर की ओर काम करते हैं। डार्बी की अंग्रेज़ी बाइबिल तीनों में सबसे अन्त में पूरी हुई, और उसका पुराना नियम उन्होंने सीधे इब्रानी से नहीं बनाया, वरन् उन फ़्रांसीसी और जर्मन संस्करणों से जो वे पहले ही दूसरों के साथ मिलकर तैयार कर चुके थे।
hero.2=यह वही फ़्रांसीसी है। डार्बी इसके प्रमुख विद्वान थे, किन्तु अपने नाम से जुड़ी किसी भी कृति के अकेले अनुवादक कभी नहीं; फ़्रांसीसी दल में विलियम जोसेफ़ लो और पिएर श्लुमबर्जे सम्मिलित थे। नया नियम 1859 में निकला और अगले दो दशकों में तीन बार पुनर्मुद्रित हुआ। पूरी बाइबिल 1885 में पो और वेवे में प्रकाशित हुई — इसी से वह नाम पड़ा जिससे यह सामान्यतः जानी जाती है — यद्यपि मुखपृष्ठ कुछ भ्रम में डालता है: पो फ़्रांस के सुदूर दक्षिण में है, और यह काम मुख्यतः फ़्रांसीसीभाषी स्विट्ज़रलैंड की ब्रदरन सभाओं के लिए किया गया था। डार्बी की मृत्यु 1882 में हो चुकी थी, अतः पूरी पुस्तक उन्होंने कभी नहीं देखी।
hero.3=अनुवाद सिद्धान्ततः शाब्दिक है, और डार्बी ने अपने जर्मन नए नियम की भूमिका में इसका कारण स्पष्ट कहा: विद्वान मूल को देख सकता है, इसलिए अनुवाद का प्रयोजन यह है कि उसका यथासम्भव यथार्थ प्रतिरूप उनके हाथों में रखा जाए जो मूल नहीं देख सकते। उन्होंने यह चेतावनी भी दी कि अधिक स्वतन्त्र अनुवाद उन अर्थों को खो देता है जिन्हें स्वयं अनुवादक ने भी सम्भवतः न पकड़ा हो। परिणाम यथार्थ और अलंकाररहित है, और इसे कभी ऊँचे स्वर में पढ़ने के लिए बनाया ही नहीं गया था — अपने उपदेश में डार्बी King James Version का प्रयोग करते थे।
hero.4=दो बातें इसे इस संग्रह के शेष से जोड़ती हैं। जर्मन डार्बी बाइबिल एल्बरफ़ेल्डर है, जो यहाँ Elberfelder 1905 के रूप में है — वही व्यक्ति, वही सिद्धान्त, और उन दो पाठों में से एक जिनसे उनका अंग्रेज़ी पुराना नियम जोड़ा गया; अतः फ़्रांसीसी और जर्मन ये दोनों कार्ड अपनी भिन्न भाषाओं से जितना जान पड़ता है, उससे कहीं निकट के सम्बन्धी हैं। और ईश्वर के नाम के साथ इसका व्यवहार इसे American Standard Version के पास रख देता है, जो सहस्रों स्थानों पर “Jehovah” छापती है जहाँ King James Version “the LORD” छापती है; डार्बी ने वही निर्णय पहले लिया, और तीन भाषाओं में। पाठक में यह एकमात्र फ़्रांसीसी बाइबिल है, इसलिए फ़्रांसीसी अंतरफलक इसी पर खुलता है। वंश-पायदानों में इसके लिए कोई मूल अभिलिखित नहीं, और यहाँ के अधिकांश तिथियुक्त संस्करणों के विपरीत इसका पायदान चिह्न कोई वर्ष रखता ही नहीं — सूची-कार्ड 1885 दिखाता है, किन्तु पायदान-वर्ष एक अलग, हाथ से बनी सूची हैं, और यह संस्करण अभी उसमें नहीं है।

