fact.4.label=नया नियम
fact.4.value=पहली बार 1859 में, पुनर्मुद्रण 1872, 1875 और 1878 में
fact.5.label=पूरी बाइबिल
fact.5.value=1885, पो और वेवे में प्रकाशित — डार्बी की मृत्यु के तीन वर्ष बाद
fact.6.label=किसके लिए बनी
fact.6.value=ब्रदरन सभाओं के लिए, मुख्यतः फ़्रांसीसीभाषी स्विट्ज़रलैंड की सभाओं के लिए, न कि स्वयं पो की
fact.7.label=अनुवाद का प्रकार
fact.7.value=जानबूझकर शाब्दिक, ऊँचे स्वर में पढ़ने के बजाय निजी अध्ययन के लिए बनाया गया; ईश्वर का नाम «l'Éternel» किया गया है, «le Seigneur» नहीं छोड़ा गया
fact.8.label=सहोदर संस्करण
fact.8.value=जर्मन डार्बी बाइबिल एल्बरफ़ेल्डर है, इस संग्रह में [[ELB|Elberfelder 1905]]; अंग्रेज़ी डार्बी पुराना नियम फ़्रांसीसी और जर्मन कार्य से बना, सीधे डार्बी की अपनी अंग्रेज़ी से नहीं
fact.9.label=विषय-वस्तु
fact.9.value=66 पुस्तकें — प्रोटेस्टेंट कैनन, द्वितीय-कैनन रहित
fact.10.label=इस संग्रह में
fact.10.value=यहाँ की एकमात्र फ़्रांसीसी बाइबिल, इसलिए फ़्रांसीसी अंतरफलक इसी पर खुलता है; वंश-पायदानों में कोई मूल अभिलिखित नहीं, और इसका पायदान चिह्न बिना वर्ष के प्रस्तुत होता है यद्यपि सूची-कार्ड 1885 दिखाता है
