title=Biblia en Español Sencillo — Om denna utgåva | Common Root
description=Biblia en Español Sencillo: en spansk bibel på enkel nutidsspanska, utgiven av AudioBiblia.org från 2018, skriven lika mycket för att höras som för att läsas och licensierad så att vem som helst får kopiera den.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=I fyra hundra år har den protestantiska bibeln på spanska i praktiken varit en enda bok i på varandra följande revisioner: Casiodoro de Reinas översättning från 1569, så som Cipriano de Valera reviderade den 1602, och den långa raden av Reina-Valera-utgåvor därefter. Biblia en Español Sencillo är inte en av dem. Den är en ny översättning, gjord på nutida spanska och medvetet enkel, utgiven av AudioBiblia.org — Nya testamentet tillsammans med Psaltaren och Ordspråksboken 2018, Gamla testamentet färdigt i oktober 2019. Översättningen tillskrivs Irma Flores, och utgivarna beskriver den som konservativ och evangelikal.
hero.2=Det som skiljer den ut är varifrån den kommer. Den är ett verk av en ljudbibelverksamhet, och texten och en fullständig inspelning kapitel för kapitel togs fram tillsammans i stället för att den ena lästes ur den andra. Syftet var detsamma för båda: en bibel som är lätt att förstå och som får kopieras och spridas fritt och lagligt. Den senare halvan är ingen bisak. Översättningen bär en Creative Commons Erkännande-licens, med AudioBiblia.org och Irma Flores angivna, i stället för ett förlags förbehållna rättigheter — och det är därför hela texten kan ligga i detta korpus och ställas vers för vers bredvid vad som helst annat i det.
hero.3=I denna läsare är den en av fyra spanska utgåvor. Ställer man gränssnittet på spanska öppnar läsaren fortfarande Reina-Valera 1909; detta är en utgåva man byter till. Den beter sig också annorlunda i stegpinnarna. Eftersom den är en ny översättning och inte en revision av något som korpuset rymmer är ingen förlaga noterad för den — så en stegpinne öppnad under en vers ur Biblia en Español Sencillo faller rakt ned på det med ≈ markerade grundspråksgolvet och inte, som i den engelska kedjan, till en äldre utgåva av samma bok. Sätt den i stället i andra spalten mot Reina-Valera 1909, så är avståndet mellan de två tonlägena det som är värt att se på.

