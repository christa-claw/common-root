title=Muwatta Malik — Acerca de esta edición | Common Root
description=Muwatta Malik: el compendio de derecho y hadices del imam Malik ibn Anas, anterior en casi un siglo a los Seis Libros del islam suní y propuesto a veces para ocupar entre ellos el lugar del Sunan Ibn Majah.
heroHeading=Muwatta Malik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Malik ibn Anas ibn Malik ibn Abi 'Amir al-Asbahi al-Madani, conocido por la kunya Abu Abdullah, nació hacia el año 93 d. H. (711 d. C.) en Medina y murió allí en el año 179 (795 d. C.), enterrado en el cementerio de al-Baqi'. Estudió con eruditos como Hisham ibn Urwah, Ibn Shihab al-Zuhri, Ja'far al-Sadiq y Nafi' Mawla Ibn Umar, y enseñó en Medina toda su vida, ganándose títulos como Imam Dar al-Hiyra ("el imán de la ciudad de la Hégira") y Shaykh al-Islam. Se convirtió en el epónimo de la escuela malikí, una de las cuatro grandes escuelas jurídicas del islam suní; su discípulo más destacado, Muhammad ibn Idris al-Shafi'i —que más tarde fundó la escuela shafií— llamó al libro de Malik "el más fiable sobre la tierra después del Corán". Se dice que el califa abasí al-Mansur quiso convertirlo en la única referencia jurídica del imperio; el propio Malik se negó.
hero.2=Al-Muwatta ("el camino bien trillado") se compuso, según la tradición, a lo largo de unos cuarenta años a comienzos del período abasí; su nombre vendría de que Malik mostró el texto a setenta juristas de Medina, todos los cuales estuvieron de acuerdo (wata'a) con él. Reúne hadices atribuidos al Profeta junto con los dichos jurídicos de sus compañeros y de la generación siguiente, además de las propias resoluciones de Malik —según una valoración, la obra más antigua que se conserva en fundir así hadiz y fiqh, anterior en casi un siglo a los Seis Libros. Las cifras sobre su tamaño varían según la recensión y el modo de contar: una cifra habitualmente citada para los hadices propiamente dichos es de unos 1.720, mientras que se dice que Malik seleccionó poco menos de 1.900 narraciones de las 100.000 que tendría a su disposición.
hero.3=Se conocen al menos dieciséis recensiones de al-Muwatta. La que se convirtió en referencia estándar, sobre todo para la escuela malikí, es la de Yahya ibn Yahya al-Laythi; una recensión rival de Ahmad ibn Abi Bakr al-Zuhri es entre un cinco y un diez por ciento más extensa. Existen alrededor de un centenar de comentarios solo sobre la recensión de al-Laythi. Por ser anterior a los Seis Libros del islam suní, algunos eruditos —los malikíes e Ibn al-Athir entre otros— sostienen que es al-Muwatta, y no el [[IBM|Sunan Ibn Majah]], el que debería figurar en esa lista canónica; se suele decir que el Sunan de Ibn Majah conservó el puesto porque su contenido se solapa menos con los otros cinco, no porque se le juzgue más fiable.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-malik de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]], el [[NAS|Sunan an-Nasa'i]], el [[IBM|Sunan Ibn Majah]] y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

