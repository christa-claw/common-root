title=Versión Biblia Libre — Über diese Ausgabe | Common Root
description=Versión Biblia Libre: eine spanische Bibel von Free Bible Ministry, übersetzt von Jonathan Gallagher und Shelly Barrios de Avila als spanisches Gegenstück zur englischen Free Bible Version, frei lizenziert für jede Nutzung.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — „die freie Version der Bibel“ — ist das spanischsprachige Gegenstück zur englischen Free Bible Version, herausgegeben vom selben Verlag, Free Bible Ministry, einer gemeinnützigen Organisation mit Sitz in Laurel, Maryland. Ihr Neues Testament wird den Übersetzern Jonathan Gallagher und Shelly Barrios de Avila zugeschrieben, mit Gustavo Sanabria und Rebekah Põldaas als Mitwirkenden, und trägt ein auf 2018–2020 datiertes Urheberrecht zugunsten von Gallagher und Barrios de Avila. Wie ihr englisches Gegenstück existiert sie, um die Urheberrechtsseite als Hindernis für die Nutzung zu beseitigen: Der Text darf von jedem kopiert, gedruckt, online veröffentlicht oder bearbeitet werden, ohne Tantiemen und ohne um Erlaubnis zu fragen.
hero.2=Das veröffentlichte Vorwort dokumentiert die Grundlage des Neuen Testaments deutlich — direkt aus dem griechischen Nestle–Aland-Text übersetzt, dem kritischen Text, den die Bibelgesellschaften benutzen —, nennt aber keinen eigenen Quelltext für das Alte Testament, obwohl die in diesem Korpus geführte Ausgabe der vollständige, sechsundsechzig Bücher umfassende protestantische Kanon ist. Wo die Materialien eine Lücke lassen, bleibt sie auch hier offen, statt mit einer Vermutung gefüllt zu werden.
hero.3=In diesem Leser ist sie eine von fünf spanischen Ausgaben. Die spanische Oberfläche öffnet weiterhin standardmäßig die [[RVR09|Reina-Valera 1909]], einen gemeinfreien Text aus einer gänzlich anderen, jahrhundertealten Tradition; diese Ausgabe erreicht man stattdessen über ihre eigene Karte, neben [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] und [[NBLA|Nueva Biblia de las Américas]]. Sie ist die Revision keiner von ihnen, sodass für sie keine Vorlage in den Abstammungssprossen verzeichnet ist — eine unter einem Vers der Versión Biblia Libre geöffnete Sprosse fällt geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden. Ihr nächster Verwandter in diesem Korpus ist gar nicht spanisch: [[FBV|die Free Bible Version]], die englische Übersetzung desselben Verlags, unter derselben Lizenz.

