fact.9.label=Bu derlemede
fact.9.value=[[NIV|New International Version]] ve [[NASB|New American Standard Bible]] ile birlikte, kamuya mal edilmek yerine lisanslıdır — özgürce kopyalanamaz, lisanslıdır, ancak ikisinden de belirgin biçimde daha serbest koşullarla. Soy basamaklarında ona kayıtlı bir ebeveyn yoktur: Robert Young'ın, bu derlemede tutulmayan Literal Translation'ının bir gözden geçirmesi olarak sunulur, böylece bir LSV ayetinin altındaki basamak doğrudan ≈ işaretli özgün-dil tabanına iner. İngilizce arayüz varsayılan olarak New International Version'da açılır; bu baskıya kendi kartından ulaşılır.
