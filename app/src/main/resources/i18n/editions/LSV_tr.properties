title=Literal Standard Version — Bu Baskı Hakkında | Common Root
description=Literal Standard Version: Covenant Press'in, Robert Young'ın on dokuzuncu yüzyıldan kalma Literal Translation'ı üzerine 2020 tarihli gözden geçirmesi; okunabilir İngilizcenin elverdiği ölçüde İbranice, Aramice ve Yunancanın en tutarlı biçimde harfî İngilizce karşılığını hedefler.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version, kendisini Robert Young'ın on dokuzuncu yüzyıldan kalma aşırı harfî İngilizce Mukaddes Kitabı olan Literal Translation'ın büyük bir gözden geçirmesi olarak tanıtır; bu çeviri ilk olarak 1862'de yayımlanmış, Young'ın kendisi tarafından 1887 ve 1898'de gözden geçirilmiştir. Covenant Christian Coalition'ın yayın kolu olan Covenant Press, 2018'in başında, Young'ın kelimesi kelimesine harfîlik taahhüdünü korurken İngilizcesini güncelleme ve daha sonraki elyazması ve sözlükbilim araştırmasının ilerlediği yerleri düzeltme açıklanan hedefiyle yeni gözden geçirmeye başladı. Çalışma tamamlanıp 2 Şubat 2020'de yayımlandı; ABD telif hakkı o yılın Ocak ayında tescil edildi, e-kitap baskıları ise aynı yılın Mayıs ayında onu izledi. Tek tek çevirmenler yayımlanan baskıda adlandırılmaz; destekleyen kurumlar olarak Covenant Press ve Covenant Christian Coalition belirtilir.
hero.2=Eski Antlaşma için LSV, Masoretik Metni izler; Septuaginta'nın önemli etkisiyle ve okumaları yeterince açık görüldüğünde Lut Gölü Tomarlarına ara sıra başvurularak. Yeni Antlaşma için Textus Receptus'u ve Çoğunluk Metni'ni izler; İskenderiye gelenegine ait okumaları ise genel bir ilke olarak değil, belirli ve açıkça belirtilen durumlarda benimser. Çevirmenler üç yönlendirici ilke ortaya koydu: İngilizcenin elverdiği ölçüde orijinalin fiil zamanını korumak, tutarlılığın mümkün olduğu ölçüde verilen bir orijinal sözcüğü aynı İngilizce sözcükle karşılamak, ve İngilizce okunabilirliğin gerçekten bir değişiklik gerektirdiği yerler dışında orijinal sözcük sırasını korumak. Eski Antlaşma'nın ilahî adı, "RAB" gibi bir unvanla karşılanmak yerine harf çevirisiyle verilir; bu, çevirinin okuyucuya orijinal metnin kendi seçimlerini düzleştirmeden göstermeyi tercih eden genel tutumuyla uyumludur.
hero.3=Bu derlemeyle bağlantı, soy bağından çok metinseldir: Literal Standard Version'ın Yeni Antlaşması, Textus Receptus'a ve Çoğunluk Metni'ne dayanır; bu derlemenin ayrı ve tam olarak Textus Receptus adıyla tuttuğu aynı Yunanca temel — King James Version'ın ve genel olarak Reform dönemi gelenegin temelindeki metin. İki baskı arasında hiçbir soy basamağı yoktur, çünkü LSV, Textus Receptus'un kendisinin ya da burada tutulan başka bir metnin değil, Young'ın Literal Translation'ının bir gözden geçirmesi olarak sunulur; bu nedenle bir LSV ayetinin altındaki basamak doğrudan ≈ işaretli özgün-dil tabanına iner. Kamuya mal edilmek yerine Creative Commons Atıf-AynıLisanslaPaylaş 4.0 lisansıyla yayımlanır; bu da onu New International Version ve New American Standard Bible'ın yanında, özgürce kopyalanamaz, lisanslı baskılar arasına yerleştirir — ancak ikisinden de belirgin biçimde daha serbest koşullarla. İngilizce arayüz varsayılan olarak New International Version'da açılır; bu baskıya ise kendi kartından ulaşılır.

