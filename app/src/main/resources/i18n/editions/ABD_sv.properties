fact.7.label=Antal hadither
fact.7.value=4 800 utvalda enligt Abu Dawuds lärjunge Ibn Dasah, eller 5 274 i Muhammad Muhyiddin Abd al-Hamids standardutgåva, Kairo 1935; de två siffrorna förenas inte i källorna
fact.8.label=I detta korpus
