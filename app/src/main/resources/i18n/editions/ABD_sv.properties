title=Sunan Abi Dawud — Om denna utgåva | Common Root
description=Sunan Abi Dawud: den hadithsamling Abu Dawud al-Sijistani sammanställde för dess betydelse för islamisk rätt, hämtad ur omkring 500 000 berättelser han granskat och ordnad efter rättsligt ämne — den tredje av sunniislams Sex böcker.
heroHeading=Sunan Abi Dawud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani föddes omkring år 202 e.H. (817–818 e.Kr.) i Sijistan, en provins i Khorasan som i dag ligger vid gränsen mellan Iran och Afghanistan. Han nådde Bagdad vid arton års ålder och reste därefter genom Khorasan, Irak, Hijaz, Syrien, Egypten och Nishapur för att söka hadither, och studerade under omkring 300 lärda, bland dem Ahmad ibn Hanbal. Han slog sig ner i Basra, där han dog en fredag i månaden shawwal år 275 e.H. (889 e.Kr.) vid sjuttiotre års ålder, och begravdes bredvid den rättslärde Sufyan al-Thawri.
hero.2=Hans intresse var specifikt rättsligt: till skillnad från Sahih al-Bukhari och Sahih Muslim, som täcker tro, historia och lag på lika villkor, byggde Abu Dawud sin Sunan kring hadither med betydelse för fiqh, och ordnade den i böcker som går igenom de ämnen en rättslärd behöver — rituell rening, bön, zakat, fasta, äktenskap, arv, domarämbete och det övriga. Enligt hans lärjunge Ibn Dasah granskade han omkring 500 000 hadith-berättelser när han samlade materialet. Han satte också en annan måttstock än al-Bukhari och Muslim: medan de endast godtog hadither de bedömde som fullt autentiska, tog Abu Dawud med en del mursal-, svaga (da'if) och till och med munkar-berättelser när ingen starkare hadith behandlade en given rättslig fråga, och förklarade sin metod i ett brev till folket i Mecka samt själv angav de svagare bedömningarna i stället för att lämna dem omärkta.
hero.3=Sunnitisk tradition räknar Sunan Abi Dawud som den tredje av Sex böckerna, efter Sahih al-Bukhari och Sahih Muslim; var exakt den, Jami` at-Tirmidhi, Sunan an-Nasa'i och Sunan Ibn Majah rankas i förhållande till varandra bland de återstående fyra har länge diskuterats utan att avgöras. Siffrorna som anges för boken stämmer inte med varandra på ett sätt ingen tycks ha löst: Ibn Dasahs siffra för vad Abu Dawud valde ut är 4 800 hadither, medan den moderna standardutgåvan — redigerad av Muhammad Muhyiddin Abd al-Hamid och tryckt i Kairo 1935 — numrerar 5 274. Detta korpus egen siffra, 43 böcker och 5 274 hadither, stämmer exakt med den Kairoutgåvans numrering, vilket här ger den fastare mark än Sahih al-Bukhari eller Sahih Muslim, där detta korpus siffra inte återger någon enskild tryckttradition.
hero.4=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-abudawud-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för Sahih al-Bukhari, Sahih Muslim och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

