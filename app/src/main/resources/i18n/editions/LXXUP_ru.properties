title=Обновлённая английская Септуагинта Брентона — Об этом издании | Common Root
description=Английская Септуагинта сэра Ланселота Брентона 1844 и 1851 годов, в которой Адам Бойд в 2020 году осовременил орфографию и имена, — тот же перевод, что и исходный Брентон рядом с ней в этом собрании, и thou и thee остались там, где их поставил Брентон.
heroHeading=Обновлённая английская Септуагинта Брентона
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Это английский перевод Септуагинты, греческого Ветхого Завета, сделанный сэром Ланселотом Брентоном, с осовремененным английским языком. Брентон переводил главным образом по Ватиканскому кодексу; лондонское издательство Samuel Bagster and Sons выпустило его перевод в 1844 году и переиздало вместе с неканоническими книгами в 1851 году. В 2020 году Адам Бойд переработал его для eBible.org и передал свои изменения в общественное достояние. Заново он его не переводил. Его предисловие перечисляет, что он изменил: орфография приведена к современной американской, так что «shew» стало «show»; имена людей и названия мест даны в формах, привычных английскому читателю; «begat» и «spake» превратились в «begot» и «spoke»; дефисы и сдвоенные знаки препинания упорядочены; поэзия набрана как поэзия. То, что он сохранил, сохранено столь же намеренно: «thou», «thee» и «ye» с относящимися к ним глагольными формами, грамматика Брентона и его тяжёлая пунктуация XIX века.
hero.2=Разница лучше всего видна рядом с исходным Брентоном, который тоже есть в этом собрании. Брентон писал еврейские имена так, как их пишет греческий; обновление обычно даёт английскую форму. Там, где книга Неемии у Брентона начинается словами «the words of Neemias the son of Chelcia», здесь стоит «Nehemiah the son of Hacaliah»; Elias the Thesbite становится Elijah the Tishbite, а Emmanuel в Исаии 7:14 — Immanuel. Под орфографией перевод по-прежнему брентоновский, и потому он по-прежнему читает там, где читает греческий. «A virgin shall conceive» в Исаии 7:14 передаёт греческое parthenos; псалмы сохраняют греческую нумерацию, так что Псалом 22 здесь — псалом о пастыре; и земля в Бытии 1:2 по-прежнему «unsightly and unfurnished». Остаются и старые местоимения: «thou shalt call his name Immanuel».
hero.3=В этом читателе оно стоит вне ступеней родословия. Собрание не записывает для него предка — ни греческого текста, который переводил Брентон, ни Брентона, которого оно перерабатывает, — поэтому ступень, открытая под одним из его стихов, падает прямо на пол языков оригинала, помеченный ≈, а для Ветхого Завета это Ленинградский кодекс: еврейский текст, а не тот греческий, с которого сделан этот перевод. Чтобы спуститься от английского Брентона к его греческому, откройте исходного Брентона, чей записанный предок — Септуагинта. На этом издании, в свою очередь, ничего не стоит, и ни один язык интерфейса не открывается на нём; английский интерфейс открывается на New International Version. Наша копия уже книги. В ней 36 книг. Ездра и Неемия — одна книга из 23 глав, как в греческом, и Неемия начинается с главы 11. Файлы eBible.org, из которых она взята, содержат также неканонические книги и дают Есфирь и Даниила только в их более длинных греческих формах; ничего из этого не было включено, так что здесь нет ни Есфири, ни Даниила, ни Товита или Премудрости.

