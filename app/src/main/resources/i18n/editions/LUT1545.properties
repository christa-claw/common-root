title=Luther Bibel 1545 — About This Edition | Common Root
description=Luther's Ausgabe letzter Hand: the 1545 Wittenberg Bible, the last edition Martin Luther revised himself, and the text that became standard after his death.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Not Luther's first Bible, but his last. The New Testament he made at the Wartburg appeared in 1522 and the complete Bible in 1534; he kept revising for another decade, and the edition Hans Lufft printed at Wittenberg in 1545 is the final one Luther saw through himself. German calls it the Ausgabe letzter Hand, the last-hand edition. He died the following February, and this text became the standard against which later Luther Bibles were set.
hero.2=He worked from the originals rather than from the Latin: Erasmus's printed Greek for the New Testament, the Masoretic Hebrew for the Old, with a circle of Wittenberg colleagues to argue the hard passages. What resulted did for German roughly what the 1642 Biblia would do for Finnish a century later. A language of many dialects and little settled prose was given a single register everyone could read, and the modern written language grew out of it.
hero.3=Two chains meet here. Luther Bibel 1912 sits directly above this edition, being a revision of it. So does Biblia 1642, three rungs up the Finnish line, because the Turku committee worked with Luther open. Beneath it the ladder reaches the floor — the Textus Receptus for the Greek, the Westminster Leningrad Codex for the Hebrew — and those rungs are solid rather than marked ≈, because Erasmus's Greek and the Masoretic Hebrew are what Luther actually translated from, not witnesses stood in after the fact.

