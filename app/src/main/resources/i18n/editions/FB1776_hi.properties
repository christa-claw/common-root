title=Biblia 1776 — इस संस्करण के बारे में | Common Root
description=Biblia 1776: डेढ़ सदी तक फ़िनलैंड की कलीसियाई बाइबल, घर में पढ़ने के लिए छपी पहली फ़िनिश बाइबल, और आज भी वही पुस्तक जिसे फ़िनिश भाषा «Biblia» कहकर इंगित करती है।
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=इस पृष्ठ के लिए संशोधन भेजने वालों का धन्यवाद।

# The narrative, one paragraph per key, in order.
hero.1=फ़िनलैंड की तीसरी बाइबल, और वही जो टिकी। यह नया अनुवाद नहीं, पुनरीक्षण है: यह रेखा फ़्लोरिनुस के 1683–85 के पुनरीक्षण से होती हुई 1642 की Biblia तक जाती है, जो पहली पूर्ण फ़िनिश बाइबल थी। यह संशोधन आन्देर्स (आन्ती) लित्सेलियुस ने किया, जो 1758 में अपनी एक बाइबल पहले ही सम्पादित कर चुके थे। 1776 के संस्करण ने वर्तनी बदली, और उसके साथ पहुँच भी। यह आधुनिक की गई वर्तनी में छपी पहली फ़िनिश बाइबल थी, और केवल वाचन-मंच के लिए नहीं बल्कि घरेलू उपयोग के लिए छपी पहली बाइबल भी। जिस बाइबल का स्वामी एक परिवार हो सकता है, वह उस बाइबल से भिन्न वस्तु है जिसकी स्वामी एक कलीसिया हो। बीच के संस्करण केवल वर्तनी के नहीं थे। 1685 का संस्करण तैयार करने वाले पाइमियो के प्रोवोस्ट हेनरिक फ़्लोरिनुस इब्रानी और यूनानी जानते थे और उन्होंने भाषा जितना ही विषय-वस्तु को भी सुधारा — शब्दावली वर्तनी से अधिक बदली — और बीच के संस्करणों के विषय में माना जाता है कि उनमें मूल भाषाओं से अनुवाद-कार्य भी हुआ, न कि केवल 1642 की सफ़ाई। इसलिए जो 1642 की तुलना 1776 से करता है, वह दो पुनरीक्षणों के पार देख रहा है, वर्तनी के एक परिवर्तन के पार नहीं।
hero.2=यह डेढ़ सदी तक कलीसिया के उपयोग में रही, जब तक Kirkkoraamattu 1933/38 ने इसकी जगह नहीं ले ली; और आधिकारिक न रह जाने पर भी इसका पढ़ा जाना बंद नहीं हुआ। फ़िनलैंड की इवेंजेलिकल लूथरन कलीसिया के भीतर दो जागरण आंदोलनों — लेस्टाडियन और rukoilevaiset — ने इसे बनाए रखा और आज भी इसका उपयोग करते हैं। इसीलिए फ़िनिश में अकेला शब्द Biblia इसी की ओर संकेत करता है, किसी पुराने या नए संस्करण की ओर नहीं; और इसीलिए इस पुस्तक को Vanha kirkkoraamattu, अर्थात् पुरानी कलीसियाई बाइबल, भी कहा जाता है।
hero.3=इस पाठक में यह फ़िनिश शृंखला का मध्य है। Kirkkoraamattu 1933/38 की किसी आयत के नीचे एक पायदान खोलिए तो यह संस्करण प्रकट होता है; इसके नीचे एक और खोलिए तो 1642 की Biblia। किंतु दोनों पायदान भिन्न रूप से पढ़े जाने चाहिए। 1933/38 के अनुवादकों ने इब्रानी और यूनानी से काम किया, अतः ऊपर का पायदान एक ही कलीसिया की बाइबल के भीतर उत्तराधिकार है, व्युत्पत्ति नहीं। नीचे का पायदान वास्तविक व्युत्पत्ति है: 1776, 1642 का पुनरीक्षण है, और उस पग के दोनों ओर के शब्द तुलना के लिए ही हैं।
hero.4=इस साइट के पाठ के विषय में एक सावधानी: यह 1776 की छपाई नहीं है। यहाँ जो है वह एक सार्वजनिक-अधिकार डिजिटल पाठ से उतरा है जिसकी वर्तनी किसी बाद के हाथ ने नियमित की और जिसका संपादन-इतिहास अभिलिखित नहीं है — इसके 31,102 पदों में ठीक एक में w अक्षर मिलता है, जबकि 1642 की Biblia में 26,862 में मिलता है, और v के स्थान पर w उसी वर्तनी का सबसे स्पष्ट चिह्न है जिसमें 1776 छपी थी। अर्थात् 1776 ने 1642 की वर्तनी आधुनिक की, और यह पाठ उसके बाद फिर एक बार आधुनिक किया गया, जिससे यह छपी हुई पुस्तक से उससे भी दूर जा पड़ा जितनी 1776, 1642 से थी। पुराने साहित्यिक फ़िनिश के दो विद्वानों ने सबसे पहले यही पूछा कि यह कौन-सा संस्करण है, और प्रश्न ठीक था। 1776 की छपाई स्वयं फ़िनलैंड के राष्ट्रीय पुस्तकालय के स्वीडिश-काल संग्रह में पृष्ठ-चित्रों के रूप में सुरक्षित है; इसके स्थान पर एक निष्ठावान पाठ रखना वह काम है जो हम करना चाहेंगे।

