title=King James Version — על מהדורה זו | Common Root
description=ה־King James Version משנת 1611: ארבעים ושבעה מתרגמים בשש חבורות, שנצטוו לתקן את ה־Bishops' Bible ולא להתחיל מחדש — ובאוסף זה, נוסח שמונים הספרים שעודנו נושא את הספרים החיצוניים שנשאה ההדפסה הראשונה.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=היא החלה כוויתור באספה שעניינה היה אחר. בוועידת המפטון קורט של שנת 1604, שכינס ג'יימס הראשון כדי לשמוע את טענות הפוריטנים על סידור התפילה, הועלתה הצעה לתרגום חדש והמלך אימץ אותה. ארבעים ושבעה מלומדים מונו וחולקו לשש חבורות — שתיים בווסטמינסטר, שתיים באוקספורד, שתיים בקיימברידג' — לכל אחת חלקה במקרא ומערכת כללים לעבוד לפיה. הראשון בכללים הללו הוא החשוב ביותר לקריאה: עליהם ללכת אחר ה־Bishops' Bible משנת 1568 ולשנותה רק ככל שהמקור מחייב. הדבר הוזמן כתיקון ולא כתרגום חדש, וכך גם הוא נקרא. רוברט בארקר, מדפיס המלך, הוציא את הספר המוגמר בלונדון בשנת 1611.
hero.2=מה שהכללים לא אמרו, והמתרגמים עשו בכל זאת, היה להושיט יד שוב ושוב אל מעבר ל־Bishops' Bible. האנגלית שירשו נעשתה בידי אחרים — טינדל בראש ובראשונה, ומקרא ז'נבה שדור שלם של קוראים אנגלים אכן החזיק בו וקרא בו בבית. אוסף זה רושם את החוב הזה במקום להותירו למבוא: מקורו הרשום של ה־King James Version כאן הוא [[GNV|מקרא ז'נבה]], ומתחתיו הנוסח היווני המקובל והעברית המסורתית. פתחו שלב שושלת מתחת לפסוק של King James, ומה שעולה הוא ז'נבה. השניים קרובים זה לזה פסוק אחר פסוק עד כדי כך שהשאלה המעניינת חדלה להיות אם נעשה שימוש בז'נבה, ונעשית היכן בחרו חבורות שנת 1611 לסטות ממנה — וזה דבר שאפשר עתה להביט בו ולא לקבלו באמונה.
hero.3=הבדל אחד בין King James זו לרוב האחרות נוגע למה שיש בה. הנוסח כאן מונה שמונים ספרים ו־36,820 פסוקים: הברית הישנה והחדשה וארבעה עשר הספרים החיצוניים מודפסים ביניהן, כפי שהדפיס אותם הכרך משנת 1611. כמעט כל King James הנמכרת היום מונה שישים ושישה. האוסף שומר על התבנית הארוכה, וההשפעה נראית לאורך השרשרת הרשומה: ב[[GNV|מקרא ז'נבה]] כאן שישים ושישה ספרים, בזו שמונים, ב[[RV|מהדורה מתוקנת]] שמעליה שמונים, וב[[ASV|American Standard Version]] שמעליה שוב שישים ושישה. אם מהדורה מדפיסה את הספרים החיצוניים היא הכרעה שכל אחת קיבלה לעצמה, והצבתן בטור אחד עושה את התבנית קריאה.
hero.4=היו מדויקים במשמעות השנה שעל הכרטיס. כתוב בו 1611, וזהו תאריך התרגום — אין זו טענה בדבר איזו הדפסה הוא הנוסח הזה. האנגלית כאן מודרנית בכתיבה: בראשית פותח «In the beginning God created the heaven and the earth», ואילו גיליונות שנת 1611 קראו «In the beginning God created the Heauen, and the Earth». זו אפוא ה־King James כפי שמדפיסים מאוחרים תיקננו אותה, וההדפסה המסוימת שממנה היא נגזרת אינה רשומה — אותו פער כן שהאוסף מותיר עבור [[FB1776|Biblia 1776]]. לקריאת הכרעותיהם של המתרגמים אין בכך הבדל; לציטוט ספר שנת 1611 כחפץ יש בכך כל ההבדל. שימו לב גם שאין זו המהדורה שבה נפתח ממשק אנגלי: זו [[NIV|New International Version]], וה־King James היא מהדורה שעוברים אליה.

