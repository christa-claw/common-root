fact.8.label=השנה שעל הכרטיס
fact.8.value=1611, תאריך התרגום ולא של הדפסת נוסח זה; הכתיב כאן הוא המודרני, ומאיזו הדפסה הוא נגזר אינו רשום
fact.9.label=באוסף זה
