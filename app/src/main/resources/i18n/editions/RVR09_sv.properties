title=Reina Valera 1909 — Om denna utgåva | Common Root
description=Reina-Valera 1909: den revision som bar Casiodoro de Reinas spanska från 1569, så som Cipriano de Valera hade reviderat den 1602, in i nittonhundratalet — och den utgåva denna läsare öppnar på för spanskan.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=Den spanska protestantiska bibeln är i ovanligt hög grad en enda bok. Casiodoro de Reina, som lämnat Spanien undan inkvisitionen, fullbordade sin översättning i landsflykt och gav ut den i Basel 1569 — Biblia del Oso, uppkallad efter björnen på titelbladet. Cipriano de Valera, som suttit i samma kloster utanför Sevilla och gjort samma flykt, gick igenom den i åratal och gav ut resultatet i Amsterdam 1602, Biblia del Cántaro. Varje Reina-Valera sedan dess är en revision av en revision av den, och därför minns ett bindestrecksnamn två män som aldrig arbetade i samma rum.
hero.2=Detta är revisionen från 1909, utarbetad under Brittiska och utländska bibelsällskapet tillsammans med Amerikanska bibelsällskapet, och i allmänhet kallad Versión Antigua — den gamla versionen — av dem som fortsatte bruka den. Den följde på en tidigare revision från 1862, och den är försiktig med just det som revisioner brukar ändra: ordalydelsen förs fram där Reina och Valera blivit svåra att följa, och lämnas i fred där de inte blivit det. Gamla testamentet vilar på den masoretiska hebreiskan och Nya på Textus Receptus, liksom Reinas gjorde.
hero.3=Den höll den spansktalande protestantiska världen nästan för sig själv i ett femtiotal år, tills revisionen från 1960 trängde undan den, och den har aldrig riktigt försvunnit. Den är fri från upphovsrätt, vilket 1960 inte är, så det är denna Reina-Valera som trycks, läggs ut och citeras utan någons tillstånd. Det är också därför hela texten kan rymmas i detta korpus och kopieras ut ur det igen.
hero.4=I denna läsare har spanskan fem biblar, och det är på denna gränssnittet öppnar. Det är ett kurerat val och inte en tillfällighet i katalogen: till skillnad från arabiskan eller kinesiskan, där läsaren öppnar på den enda bibel som finns på språket, har spanskan alternativ och denna valdes bland dem. I stegpinnarna är ingen förlaga noterad för den, så en stegpinne öppnad under en vers faller rakt ned på det med ≈ markerade grundspråksgolvet. Golvet träffar närmare här än det brukar, av samma skäl som vid den arabiska bibeln: grekiskan det bjuder är Textus Receptus, och det är ur Textus Receptus Reinas Nya testamente gjordes.

