title=I quaranta hadith qudsi — Su questa edizione | Common Root
description=Quaranta hadith qudsi — detti il cui significato, secondo i musulmani, viene da Dio, mentre la loro formulazione, come in ogni altro hadith, passa per Maometto — letti qui come volume compagno dei quaranta hadith di an-Nawawi.
heroHeading=I quaranta hadith qudsi
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Un hadith qudsi (hadith "sacro" o "divino") si distingue da un hadith ordinario per l'origine attribuita al suo significato: dotti come al-Jurjani lo descrivono come parola di Dio, espressa nelle parole stesse di Maometto, a differenza del Corano, la cui formulazione stessa è ritenuta divina. Questa distinzione riguarda il rango, non la solidità — un hadith qudsi non deve necessariamente essere sahih (solido); alcuni così classificati sono da'if (debole) o contestati, giudicati secondo gli stessi criteri delle catene di trasmissione di ogni altro hadith.
hero.2=Raccogliere quaranta hadith qudsi segue la stessa vecchia abitudine de[[NAW|i quaranta hadith di an-Nawawi]] e del più ampio genere dei "quaranta hadith" (arba'iniyyat) a cui appartiene, qui ristretto però a una sola categoria di hadith piuttosto che all'hadith in generale. Un'edizione inglese molto diffusa proprio con questo titolo — scelta e tradotta da Ezzeddin Ibrahim e Denys Johnson-Davies, che realizzarono anche la traduzione compagna della raccolta di an-Nawawi — fu pubblicata dall'Islamic Texts Society nel 1997 come volume bilingue arabo-inglese, i cui quaranta hadith sono tratti da tutta la letteratura hadithica classica. Se i quaranta hadith offerti da questo corpus siano proprio quella selezione, o un insieme assemblato indipendentemente e pubblicato sotto lo stesso titolo tradizionale, non è stato stabilito da parte di questo corpus.
hero.3=Il testo arabo qui presente è il matn classico, ritenuto di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-qudsi di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]], il [[NAS|Sunan an-Nasa'i]], il [[IBM|Sunan Ibn Majah]], il [[MAL|Muwatta Malik]], i [[NAW|quaranta hadith di an-Nawawi]] e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=Arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Nessun compilatore classico unico; un'edizione inglese pubblicata con questo titolo fu scelta e tradotta da Ezzeddin Ibrahim e Denys Johnson-Davies, che ne raccolsero i quaranta hadith da tutta la letteratura hadithica classica
fact.3.label=Titolo
fact.3.value=Hadith qudsi — hadith "sacro" o "divino", il cui significato è ritenuto venire da Dio benché la sua formulazione sia quella di Maometto, a differenza del Corano
fact.4.label=Compilato
fact.4.value=Un'antologia tratta dalla più ampia letteratura hadithica piuttosto che un unico testo continuo; l'edizione inglese di Ibrahim/Johnson-Davies con questo titolo fu pubblicata nel 1997
fact.5.label=Metodo
fact.5.value=Selezione basata sulla classificazione come qudsi, non sul rango canonico; un hadith qudsi non deve necessariamente essere sahih (solido) — alcuni così classificati sono da'if (debole) o contestati
fact.6.label=Posizione
fact.6.value=Un'antologia fra diverse che portano questo titolo, nella stessa lunga tradizione dei quaranta hadith (arba'iniyyat) de[[NAW|i quaranta hadith di an-Nawawi]]
fact.7.label=Numero di hadith
fact.7.value=40
fact.8.label=In questo corpus
fact.8.value=1 libro e 40 hadith numerati
fact.9.label=Traduzione inglese
fact.9.value=Tratta dall'edizione eng-qudsi di fawazahmed0/hadith-api, mostrata in accompagnamento all'arabo; se discenda dalla traduzione di Ibrahim/Johnson-Davies o da una indipendente non è confermato da parte di questo corpus
fact.10.label=Licenza
fact.10.value=Il matn arabo è il testo classico, ritenuto di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
