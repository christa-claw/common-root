title=Smith & Van Dyck — À propos de cette édition | Common Root
description=La Bible arabe de Smith et Van Dyck : commencée par Eli Smith à Beyrouth, achevée par Cornelius Van Dyck en 1865 avec les lettrés de la Nahda Butrus al-Bustani, Nasif al-Yaziji et Yusuf al-Asir — elle demeure la Bible arabe la plus lue.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=La mission américaine de Beyrouth entreprit cette traduction vers 1847, et celui qui la commença ne l'acheva pas. Eli Smith avait passé deux décennies au Levant et savait la langue assez bien pour en disputer ; il travailla au texte jusqu'à sa mort, en 1857. Cornelius Van Alen Van Dyck la reprit et la mena à terme : le Nouveau Testament fut prêt en 1860, l'Ancien cinq ans plus tard, en 1865. Les deux noms portés par le livre sont les deux moitiés d'un même travail.
hero.2=Les noms qui ne figurent pas au dos pèsent autant. Van Dyck avait appris son arabe auprès de Butrus al-Bustani et de Nasif al-Yaziji, et tous deux travaillèrent avec lui à la traduction, ainsi que le cheikh Yusuf al-Asir, qui reprit l'arabe pour l'idiome et le style. Ces trois-là n'étaient pas les auxiliaires d'une entreprise missionnaire. Ils comptaient parmi les figures centrales de la Nahda, la renaissance littéraire arabe, et ce qui en sortit se lit comme de la prose arabe et non comme une traduction déguisée en arabe. C'est pourquoi le livre a survécu à la mission qui l'avait payé.
hero.3=Ce fut un exploit typographique autant que savant. L'American Press de Beyrouth le composa dans un caractère arabe gravé pour la mission et achevé en 1843, cette fonte qu'on appelle encore al-Amerikani et à la forme de laquelle Smith avait pris part. L'arabe est difficile à composer correctement — les lettres se lient et changent de dessin en se liant — et une Bible qui avait bonne figure sur la page fit davantage pour son accueil qu'aucun argument. Des millions d'exemplaires sont sortis depuis, vers des lecteurs protestants comme coptes, et pour la plupart des chrétiens arabophones la Bible sonne simplement ainsi.
hero.4=Dans ce lecteur, elle est la seule bible arabe, ce qui règle son comportement. Réglez l'interface sur l'arabe et c'est elle qui s'ouvre — non qu'on l'ait choisie, comme la Reina-Valera 1909 le fut pour l'espagnol, mais parce que le catalogue cherche une bible dans la langue de l'interface et en trouve exactement une. Elle est en outre l'une des deux seules éditions d'ici dont le texte court de droite à gauche, l'autre étant la bible hébraïque moderne. Dans les échelons de filiation aucun texte source ne lui est enregistré, de sorte qu'un échelon ouvert sous un verset tombe droit sur le sol des langues originales marqué d'un ≈ — ce qui vise ici de plus près que d'ordinaire, puisque le grec que ce sol fournit est le Textus Receptus, et que c'est du Textus Receptus que son Nouveau Testament a été fait.

