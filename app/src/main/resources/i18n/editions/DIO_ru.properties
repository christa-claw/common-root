title=Диодати 1649 (итальянская) — Об этом издании | Common Root
description=Итальянская Библия Джованни Диодати: издана в Женеве в 1607 году, первая сделанная с еврейского и греческого, а не с Вульгаты, пересмотренная с его собственными примечаниями в 1641 году — и почему на файле стоит год его смерти.
heroHeading=Диодати 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Джованни Диодати родился в Женеве в 1576 году в семье купцов из Лукки, покинувших Италию, но не отрекшихся от своей веры. По происхождению он был итальянец, по выучке женевец, и всё существование этой книги объясняется именно таким сочетанием: у него был язык страны, до которой Реформация не дошла, а стоял он в городе, ставшем её типографией. Теодор Беза выдвинул его на кафедру еврейского языка, когда ему был двадцать один год. В 1606 году он стал профессором богословия, в 1608 — пастором, а на следующий год наследовал Безе на богословской кафедре; в 1618 году поехал на Дордрехтский синод женевским делегатом и был одним из шести человек, назначенных составлять его акты.
hero.2=Его итальянская Библия была напечатана в Женеве в 1607 году. Библии на народном языке в Италии бывали и прежде — Малерми 1471 года, Бручоли 1532 года, — но они работали с латыни или тяжело на неё опирались. Диодати пошёл к еврейскому и греческому, а для Нового Завета это означало греческий текст, изданный Безой в том же городе поколением раньше. В 1641 году он выпустил пересмотренное издание с собственными пояснительными примечаниями, и именно от него происходят перепечатки. Она стала — и осталась — итальянской протестантской Библией, что в стране почти без протестантских читателей значило: четыре столетия её несло очень небольшое число людей. Он перевёл Библию и на французский, в 1644 году; ту принято считать более слабой, и он, вероятно, не стал бы спорить.
hero.3=О годе на карточке стоит сказать фразу, потому что его нет. Этот текст ходит в цифровом виде под ярлыком «Диодати 1649», а 1649 — не издание: это год смерти Диодати. Две даты, которые что-то значат, — 1607, когда перевод впервые вышел, и 1641, когда он его пересмотрел. Какую из них на деле представляет тот или иной цифровой файл, в этом проекте не установлено, и потому каталог оставляет столбец года пустым, а не печатает число, за которое не может отвечать. Имя сохранено таким, каким пришло, потому что искать будут именно его.
hero.4=В этой читалке она единственная итальянская Библия, так что итальянский интерфейс открывает именно её — не как отобранный вручную выбор, каким для испанского отобрана Reina-Valera 1909, а потому, что перебор каталога не находит на этом языке ничего другого. В ступенях родословия источник для неё не записан, так что ступень, открытая под стихом, уходит прямо на пол исходных языков, помеченный знаком ≈. Этот пол даёт для греческого Textus Receptus, и здесь это необычно близко к истине: для большинства изданий этого собрания Receptus стоит вместо критического текста, которым переводчики на деле пользовались, но Диодати действительно работал с печатным греческим текстом этого семейства. Метка ступени у неё без года, что отвечает пустоте на карточке.

