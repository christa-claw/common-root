fact.2.value=Джованни Диодати (1576–1649), родился в Женеве в семье протестантских купцов, покинувших Лукку, но не отрекшихся от своей веры
fact.3.label=Первое издание
fact.3.value=1607, в Женеве — первая итальянская Библия, сделанная с еврейского и греческого, а не с латыни
fact.4.label=Пересмотренное издание
fact.4.value=1641, с собственными примечаниями Диодати; в этом виде текст перепечатывался следующие три столетия
fact.5.label=Почему в названии стоит 1649
fact.5.value=1649 — год смерти Диодати, а не год издания: дата едет вместе с цифровым текстом, и каталожная карточка оставляет столбец года пустым, а не утверждает какой-либо
fact.6.label=Греческий за Новым Заветом
fact.6.value=издания Безы, сделанные в Женеве поколением раньше, — в пределах того семейства печатных греческих текстов, которое это собрание держит как [[TR|Textus Receptus]]
fact.7.label=Также его работа
fact.7.value=французская Библия, 1644, обычно считаемая более слабой из двух — по-французски он не думал
fact.8.label=Состав
fact.8.value=66 книг — протестантский канон, без второканонических
fact.9.label=В этом собрании
fact.9.value=единственная итальянская Библия здесь, так что итальянский интерфейс открывает её; в ступенях родословия источник не записан, а метка ступени отображается без года
