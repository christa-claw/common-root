title=高価な真珠 — この版について | Common Root
description=高価な真珠：ジョセフ・スミスの啓示、翻訳、記述を選んで収めたもの。1851年にイングランドのリバプールで伝道用の小冊子として初めてまとめられ、1880年に末日聖徒によって聖典として受け入れられた。
heroHeading=高価な真珠
readerHref=/reader?c1.src=pgp

hero.1=高価な真珠は、聖典としてではなく伝道用の小冊子として始まった。1851年、当時教会のヨーロッパ伝道部会長であったフランクリン・D・リチャーズが、イングランドのリバプールでこれを編纂した。初期の教会の新聞に掲載されたり、わずかな部数しか出回らなかったりしたジョセフ・スミスの著作を集め、英国の会員が一か所でそれらを読めるようにしたのである。書名は、マタイによる福音書13:45–46のたとえ、すなわち持ち物をすべて売り払って一つの高価な真珠を買う商人の話に由来する。
hero.2=オーソン・プラットが編集し配列し直した第二版が1878年にソルトレーク・シティーで出版され、1880年10月10日、教会の総大会が投票によってこれを聖典として受け入れた。主にジェームズ・E・タルメージが準備した1902年の改訂版は、本文を章と節に分け、教義と聖約と重複していた啓示を除いた。1921年版では二段組みとなった。1976年にはさらに二つの啓示——日の栄えの王国の示現と、ジョセフ・F・スミスによる死者の贖いの示現——が加えられ、1979年に教会はこれらを教義と聖約に移した。その1981年版では、これらは第137節と第138節として収められている。
hero.3=現行版は五つの部分から成る。「モーセ書」と「ジョセフ・スミス—マタイ」は、ジョセフ・スミスが1830年に始めた欽定訳聖書の改訳からの抜粋である。前者は、モーセに与えられた示現を枠組みとして創世記の冒頭の諸章を拡大して語るもので、後者はマタイによる福音書23:39と第24章を書き改めたものである。「アブラハム書」は、1835年にオハイオ州カートランドで入手されたエジプトのパピルスからスミスが翻訳したと述べた本文であり、1842年にイリノイ州ノーブーのTimes and Seasons紙に、現在、模写第1号、第2号、第3号と呼ばれる三つの図版とともに掲載された。「ジョセフ・スミス—歴史」は、彼が1838年に用意した自身の若い頃と示現についての記録から取られたもので、「信仰箇条」は、1842年にシカゴの新聞編集者ジョン・ウェントワースに宛てた手紙にある十三の信仰の表明である。
hero.4=「アブラハム書」は、最も多く疑問が呈されてきた部分である。パピルスの大部分は長い間失われたと考えられ、おそらく1871年のシカゴ大火で焼失したとされていたが、かつてジョセフ・スミスが所有していた十点の断片がニューヨークのメトロポリタン美術館で見つかり、同館は1967年にそれらを教会に移譲した。学者たちはこれらの断片を、紀元前3世紀から紀元1世紀の間に書かれた一般的なエジプトの葬祭文書の一部と見なしており、教会自身がこの書について公表した論考も、断片上の文字のいずれもアブラハムの名やこの書が記す出来事に触れていないことを認めている。
hero.5=聖書、モルモン書、教義と聖約とともに、これは末日聖徒イエス・キリスト教会の四つの標準聖典の一つである。ジョセフ・スミスの運動から生まれたもう一つの大きな教会であるCommunity of Christは、これを聖典に数えていない。このコーパスの本文は、Mormon Documentation ProjectのパブリックドメインのJSONエクスポートに由来し、ここにあるモルモン書や教義と聖約と同じ出典である。五つの部分は五つの書として保たれ、モーセ書は八章、アブラハム書は五章、残る三つはそれぞれ一章から成る。三つの模写とそれに添えて印刷された説明は節から成る本文ではないため、収められていない。二つの姉妹書と同様、特定の歴史的な刷りではなく現行の標準版の文言に従っており、そのためここでは出版年を示していない。

fact.1.label=言語
fact.1.value=英語
fact.2.label=制作者
fact.2.value=ジョセフ・スミス・ジュニア（1805–1844）：啓示、欽定訳聖書の改訳、エジプトのパピルスから行ったと彼が述べた翻訳、彼自身の歴史、および信仰の表明。初めて一冊にまとめたのはフランクリン・D・リチャーズ
fact.3.label=出版
fact.3.value=1851年、イングランドのリバプール。フランクリン・D・リチャーズが編纂した伝道用小冊子として。第二版は1878年、ソルトレーク・シティー、オーソン・プラット編。1880年10月10日に総大会で聖典として受け入れられた
fact.4.label=構成
fact.4.value=五つの部分——「モーセ書」「アブラハム書」「ジョセフ・スミス—マタイ」「ジョセフ・スミス—歴史」「信仰箇条」——から成り、1902年の改訂以来、章と節に分けられている。このコーパスでは各部分を一つの書として扱う
fact.5.label=位置づけ
fact.5.value=末日聖徒イエス・キリスト教会の四つの標準聖典の一つで、聖書、[[BOM|モルモン書]]、[[DC|教義と聖約]]とともに数えられる。Community of Christはこれを聖典と見なしていない
fact.6.label=このコーパスでは
fact.6.value=本文は、Mormon Documentation ProjectがパブリックドメインとしたJSONエクスポートの現行の標準的な文言に従っている——[[BOM|モルモン書]]や[[DC|教義と聖約]]と同じ出典である。モーセとマタイの抜粋は[[KJV|キング・ジェイムズ・バージョン]]の本文を改めたもので、この版もコーパスに収められている。模写とその説明は含まれておらず、単一の印刷年はここに示していない
fact.7.label=ライセンス
fact.7.value=データの管理者の宣言によりパブリックドメイン。現代の著作権で保護された研究資料は含まれていない
