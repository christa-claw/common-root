title=Luther Bibel 1912 — عن هذه الطبعة | Common Root
description=التنقيح الكنسي الرسمي الثاني لكتاب لوثر المقدّس: مراجعة متأنّية عن قصد، فُرغ منها سنة 1910 وأُقرّت سنة 1912، وهي آخر نصّ لوثري يقوم على Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=تنقيحٌ لتنقيح. كانت الكنائس الألمانية قد اتفقت سنة 1892 على نصّ واحد لكتاب لوثر المقدّس، هو التنقيح الكنسي الرسمي الأول، وما مضت سنوات قليلة حتى قيل إنه لا يكفي. والمآخذ هي المآخذ القديمة: كثرة الألفاظ المهجورة، وإملاءٌ لم يعد إملاء أحد. والثانية هي التي رجّحت الكفّة. فقد أعطى دودن الإمبراطورية الألمانية إملاءً مُلزِمًا يُدرَّس في المدارس، وكتابٌ لوثريّ يحيد عنه يعسر وضعه أمام فصل دراسي. وفي سنة 1906 وافق المؤتمر الكنسي الإنجيلي الألماني على تنقيح جديد، وأمر صراحةً أن يكون رفيقًا محافظًا. فمرّت لجنة من اللاهوتيين على كل سفر حتى سنة 1910، وفي سنة 1912 أقرّ المؤتمر النتيجة.
hero.2=لم يستغرق العمل أكثر من سنتين بقليل، وفي ذلك ما يدلّ على نوع التنقيح. لم يكن أحد يسعى إلى كتاب لوثريّ جديد، لا من جهة فقه اللغة ولا من جهة أخرى. وقد نبذه منقّح لاحق، هو فريتز تشيرش، بوصفه تنقيحًا على طريقة معلّمي المدارس، والوصف ليس كاذبًا في المنهج — الإملاء سُوّي، وأشدّ الكلمات موتًا استُبدلت، واللفظ فيما عدا ذلك تُرك حيث وضعه لوثر. وما يفوت الوصفَ هو مقدار ثباته. فعبر عقود التنقيحات الجزئية التي تلت، بقي نصّ سنة 1912 في مكانه، ولا يزال يُقرأ ويُباع. ومن ذلك Jubiläumsbibel سنة 1912، طبعة معهد فورتمبيرغ للكتاب المقدّس في مئويته مع حواشٍ شارحة، أُعيد طبعها بالخط القوطي إلى وقت متقدّم من هذا القرن. ومنه أن حقّ النشر قد سقط، فلا يكلّف استنساخ النصّ شيئًا، ولذلك تجده في كل مكان — ومن ذلك هنا.
hero.3=وشيءٌ واحد قبل كل شيء يبقيه في الاستعمال عند القرّاء المحافظين: أنه آخر تنقيح لوثريّ مبنيّ على Textus Receptus، العهد الجديد اليوناني في القرنين السادس عشر والسابع عشر. فكل ما بعده انتقل إلى النصّ النقدي. وذلك يجعل هذه الطبعة درجةً نظيفة على نحو غير معتاد يُوطأ عليها في السلّم، لأن اليونانية التي تحتها هي اليونانية نفسها التي تحت طبعة لوثر الخاصة سنة 1545، وتحت جنيف وتحت King James — فالبرج كله يتشارك أرضًا واحدة بدل أن يستبدلها في منتصف الصعود.
hero.4=وفي درجات النسب تقع هذه الطبعة مباشرةً فوق Luther Bibel 1545، ولها سلف مسجَّل واحد لا غير، هو تلك. افتح درجةً تحت آية من سنة 1912 يظهر تحتها لفظ لوثر نفسه من سنة 1545؛ وافتح أخرى يبلغ السلّم Textus Receptus لليونانية ومخطوطة لينينغراد للعبرية. ثلاثمئة وسبع وستون سنة من التنقيح، آيةً آية، بنقرتين. وما ليست هذه الطبعة إياه هو الكتاب الذي تُفتح عليه الواجهة الألمانية — فليس للألمانية طبعة افتراضية مختارة، فيأخذ القارئ أول كتاب مقدّس ألماني في الفهرس، وهو الإلبرفلدي.

