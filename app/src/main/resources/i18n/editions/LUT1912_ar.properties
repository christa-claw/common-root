fact.12.value=قمة السلّم الألماني: سلف مسجَّل واحد، [[LUT1545|Luther Bibel 1545]]، وتحته أرض لغات الأصل. وحواشي المنقّحين الخمس والثمانون محفوظة هنا تعليقاتٍ لا مطروحة، وهي مقيَّدة بالطبعة — فشرح من سنة 1912 يظهر تحت عمود سنة 1912 ولا يظهر في غيره. وليست هي ما تُفتح عليه الواجهة الألمانية؛ ذاك [[ELB|الإلبرفلدي]]، الأول في الفهرس بحكم اختصاره لا غير
