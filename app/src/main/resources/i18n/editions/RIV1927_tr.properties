title=Riveduta 1927 (İtalyanca) — Bu Baskı Hakkında | Common Root
description=Riveduta: Giovanni Diodati'nin İtalyanca Kutsal Kitap'ı, Valdocu ilahiyatçı Giovanni Luzzi başkanlığındaki bir kurulca İbranice ve Yunancaya göre gözden geçirilmiş, 1924'te Roma'da İngiliz ve Yabancı Kutsal Kitap Derneği tarafından yayımlanmış — ve dosyanın neden 1927 dediği.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi 1856'da İsviçre'nin Graubünden kantonundaki Aşağı Engadin'de doğdu ve ailesi ertesi yıl Lucca'ya göç edince bebekken oraya götürüldü. İtalyan olarak büyüdü, Floransa'daki Valdocu İlahiyat Fakültesi'nde — İtalya'nın eski Protestan kilisesinin okulunda — okudu, sonra orada ilahiyat öğretti ve şehirde papazlık yaptı. Son yıllarını yeniden İsviçre'de, Poschiavo'da geçirdi ve 1948'de orada öldü.
hero.2=Riveduta 1906'da başladı: Diodati'nin on yedinci yüzyıl çevirisini bir asırdır İtalyan okurlar için basan İngiliz ve Yabancı Kutsal Kitap Derneği, onu gözden geçirmek üzere bir grup kurdu ve başına Luzzi'yi getirdi. Luzzi bunu Katolik bilginlerle ortak bir Kutsal Kitap yapmayı ummuştu; Vatikan reddetti ve iş Protestan bir revizyon olarak sürdü. Kutsal Kitap'ın tamamı 1924'te Roma'da çıktı ve başlık sayfasında asıl metne göre gözden geçirilmiş bir sürüm olarak tanıtıldı — “riveduta”, yani gözden geçirilmiş; o günden beri bu adla bilinir. Yeni bir çeviri değildir: altında Diodati'nin metni durur, İbranice ve Yunancayla yeniden karşılaştırılmış olarak. Yirminci yüzyılın büyük bölümünde İtalyan Protestanların Kutsal Kitap'ı oldu; ardılı Nuova Riveduta'yı ise 1994'te Cenevre Kutsal Kitap Derneği yayımladı. Luzzi ayrıca kendi açıklamalı çevirisini de yaptı; 1921'den itibaren Floransa'da çıkan on iki cilt halinde. O başka bir eserdir, bu metin değildir.
hero.3=Revizyon sayfada görünür. Eski Antlaşma'da Tanrı'nın adı “l'Eterno”dur, yani Ezeli Olan — Mezmur 23'te “L'Eterno è il mio pastore” — Diodati'nin “il Signore” dediği yerde. Yeşaya 7:14'te “la giovane”, yani genç kadın, Diodati'nin “la Vergine” dediği yerde. Yeni Antlaşma'da, sonraki eleştirel baskıların Textus Receptus'tan ayrıldığı yerlerde o da ayrılır: 1. Yuhanna 5:7'de göksel tanıklar yoktur, Matta 6:13'teki Rab'bin duası övgü cümlesi olmadan biter, Elçilerin İşleri 8:37 ise korunmuş ama köşeli ayraç içine alınmıştır. Mezmurlar İbranice numaralamayı izler ve bir mezmurun başlığı ilk ayetine katılmıştır — Mezmur 23 “Salmo di Davide.” ile açılır — bu yüzden Mezmur 51, İngilizce Kutsal Kitaplarda olduğu gibi 19 ayettir. Tarihe gelince: 1927, dijital metnin taşıdığı ve kataloğun sakladığı yıldır; bu yüzden basamak etiketi 1927 gösterir. Riveduta'nın kendisi 1924'te çıktı; bu dosyanın sonraki hangi baskıyı yansıttığı bu projece saptanmış değildir.
hero.4=Bu okuyucuda, iki Diodati nüshasının yanında yer alan üç İtalyanca Kutsal Kitap'tan biridir. İtalyanca bir arayüz bunu açmaz: İtalyanca için elle yapılmış bir seçim yoktur, bu yüzden okuyucu katalog sırasındaki ilk İtalyanca Kutsal Kitap'ı alır, o da Diodati 1649'dur. Soy basamaklarında bunun için kayıtlı bir kaynak yoktur — Riveduta bir Diodati revizyonu olduğu ve Diodati bu derlemede bulunduğu halde Diodati bile — bu yüzden bir ayetin altında açılan basamak doğrudan ≈ ile işaretli kaynak dil tabanına düşer: Eski Antlaşma için Westminster Leningrad Kodeksi, Yeni için Textus Receptus; yani tam da bu revizyonun uzaklaştığı Yunanca.

