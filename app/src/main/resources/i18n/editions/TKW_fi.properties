title=Textbibel 1906 — Tietoja tästä laitoksesta | Common Root
description=Kautzschin ja Weizsäckerin Textbibel: oppineiden saksankielinen Raamattu, käännetty uudelleen hepreasta ja kreikasta ja julkaistu yhtenä niteenä Tübingenissä 1899; tämän tekstin vuosiluku on 1906.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Kaksi professoria, kaksi testamenttia. Carl Weizsäcker (1822–1899) oli kirkkohistorioitsija Tübingenissä, jossa hän seurasi Ferdinand Christian Bauria oppituolissa 1861 ja oli yliopiston kansleri vuodesta 1889. Hänen Uuden testamentin käännöksensä ilmestyi ensi kerran 1875, ja hänen elinaikanaan siitä otettiin yhdeksän painosta, joista viimeisen hän valmisteli kuolinvuoteellaan. Emil Kautzsch (1841–1910) oli Vanhan testamentin tutkija, joka opetti Leipzigissä, Baselissa ja Tübingenissä ennen kuin asettui Halleen 1888; hänen Vanha testamenttinsa, käännetty yhdessä joukon alan asiantuntijoita kanssa, ilmestyi kokonaisena 1894.
hero.2=Vuonna 1899, Weizsäckerin kuolinvuonna, molemmat yhdistettiin yhdeksi niteeksi, Textbibel des Alten und Neuen Testaments, jonka julkaisi J.C.B. Mohr (Paul Siebeck) Tübingenissä. Nimi kertoo, mikä se on: pelkkä teksti lukijoille, jotka halusivat tietää, mitä heprea ja kreikka sanovat, oman aikansa saksaksi. Lutherin korvaajaksi sitä ei koskaan tarkoitettu. Weizsäcker vältti tietoisesti Lutherin kieltä ja pyrki sen sijaan välittämään vaikutelman, jonka alkuteksti teki ensimmäisiin lukijoihinsa; hänen elämäkerturinsa piti epätodennäköisenä, että siitä koskaan tulisi kansankirja, eikä tullutkaan. Sitä painettiin uudelleen 1910-luvulle asti. Tämän digitaalisen tekstin vuosiluku on 1906; minkä painoksen tuo painos edustaa, ei tämä hanke ole selvittänyt.
hero.3=Se kuulostaa aikansa tutkimukselta. Jumalan nimi Vanhassa testamentissa on ”Jahwe” – ”Jahwe ist mein Hirte” psalmissa 23 – tuhansia kertoja, missä Lutherilla on ”der Herr”. Jesajan 7:14:ssä on ”ein junges Weib”, nuori nainen. Uudessa testamentissa Isä meidän -rukous Matteuksen 6:13:ssa päättyy ilman doksologiaa, eikä 1. Johanneksen kirjeen 5:7:ssä ole taivaallisia todistajia. Vanha testamentti noudattaa heprealaista luku- ja jakeenjakoa: psalmien otsikot lasketaan jakeisiin, joten psalmissa 51 on 21 jaetta, ja Malakian kirjassa on kolme lukua eikä neljää. Oikeinkirjoitus on vanhempaa kuin vuosiluku antaa odottaa – Johanneksen 8:1:ssä Jeesus ”gieng” Öljymäelle.
hero.4=Tässä lukuohjelmassa se on yksi neljästä saksankielisestä Raamatusta, Elberfelderin sekä Lutherin vuosien 1545 ja 1912 tekstien rinnalla. Saksankielinen käyttöliittymä ei avaa sitä: saksalle ei ole valittu omaa käännöstä, joten lukuohjelma ottaa luettelon ensimmäisen saksankielisen Raamatun, joka on Elberfelder. Polveutumisaskelmiin ei ole kirjattu sille kantatekstiä, mikä sopii alkukielistä tehdylle käännökselle: jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukieliseen pohjaan – Vanhassa testamentissa Westminsterin Leningradin koodeksiin ja Uudessa Textus Receptukseen, kreikkaan, jota tämä käännös ei seuraa, kuten 1. Johanneksen kirjeen 5:7 osoittaa.

