title=Septuaginta griega de Brenton — Acerca de esta edición | Common Root
description=La Septuaginta — el Antiguo Testamento griego de la diáspora judía y de la Iglesia primitiva — en el texto griego que Lancelot Brenton imprimió junto a su inglés en 1851, y el peldaño bajo la Vulgata y la Biblia Sinodal rusa en este lector.
heroHeading=Septuaginta griega de Brenton
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=La Septuaginta es la traducción más antigua de la Biblia hebrea, y durante los primeros siglos cristianos fue sencillamente la Biblia. Judíos de lengua griega de Alejandría la comenzaron con los cinco libros de la Ley, probablemente en el siglo III a. C., y los demás libros siguieron durante los dos siglos siguientes. El nombre viene de un relato: la Carta de Aristeas cuenta que setenta y dos ancianos fueron enviados desde Jerusalén para traducir la Ley para el rey Ptolomeo II, y «los Setenta» — LXX en números romanos — pasó a ser el nombre de todo el Antiguo Testamento griego. Los autores del Nuevo Testamento la citan constantemente, la Iglesia primitiva la leía, y las Iglesias ortodoxas la siguen leyendo como su Antiguo Testamento.
hero.2=Su importancia va más allá de su antigüedad. Los traductores trabajaron sobre manuscritos hebreos que diferían en algunos puntos del texto masorético que más tarde se volvió normativo — Jeremías, por ejemplo, es notablemente más corto en griego —, de modo que en muchos pasajes la Septuaginta es el testimonio más antiguo de una lectura hebrea que la propia tradición hebrea no conservó. Contiene además libros que el canon hebreo no tiene, entre ellos Tobías, Judit, Sabiduría, Eclesiástico y Baruc. Y algunas de sus elecciones de palabras se volvieron doctrina: en Isaías 7:14, donde el hebreo dice ʿalmah, una joven, el griego dice parthenos, una virgen — la palabra que cita Mateo.
hero.3=El griego que aquí se ofrece es el texto que imprimió Sir Lancelot Brenton. En 1844 publicó una traducción inglesa de la Septuaginta, hecha principalmente sobre el Codex Vaticanus, el manuscrito del siglo IV que se guarda en la Biblioteca Vaticana; en 1851 Samuel Bagster, de Londres, la reeditó con los libros apócrifos añadidos y el griego junto al inglés, y es ese griego el que contiene este corpus. Sus salmos conservan la numeración griega, que comparte la Vulgata de este corpus: en ambas, el salmo 22 es el del pastor, el salmo 23 del hebreo y de la mayoría de las Biblias inglesas. Hay 151 salmos; Esdras y Nehemías forman un solo libro; Ester y Daniel aparecen en sus formas griegas más largas.
hero.4=En este lector es un peldaño, no el suelo. Está bajo la Vulgata latina, porque una parte de la Vulgata llegó a través del griego: su salterio es el que Jerónimo hizo a partir del griego de la Hexapla de Orígenes y que su propia traducción del hebreo nunca desplazó, y Sabiduría, Eclesiástico y Baruc quedaron en versiones latinas antiguas hechas del griego. Está bajo la Biblia Sinodal rusa, cuyo Antiguo Testamento conservó muchas lecturas de la Septuaginta procedentes de la Biblia eslava que la precedía, y bajo la propia traducción inglesa de Brenton. No tiene antecesor registrado: el hebreo del que se tradujo no está en el corpus, y el Códice de Leningrado, más de mil años posterior y de la línea masorética, aparece debajo de ella solo como suelo de las lenguas originales. Contiene solo el Antiguo Testamento, así que bajo un versículo del Nuevo Testamento el peldaño se salta — y no todos los libros de la tradición griega están aquí: este ejemplar tiene 45 libros y ninguno de los Macabeos.

