title=Corano — Yusuf Ali — Informazioni su questa edizione | Common Root
description=La traduzione di Abdullah Yusuf Ali, pubblicata in quattro volumi tra il 1934 e il 1937 da un funzionario indiano divenuto studioso dell'islam — una delle sole due traduzioni inglesi del Corano risultate inequivocabilmente di pubblico dominio, e in questo corpus una seconda traduzione inglese di accompagnamento insieme a quella di Pickthall.
heroHeading=Corano — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872-1953) nacque a Bombay e fu istruito dapprima al Wilson College di quella città, dove un'educazione religiosa affiancata alla scuola lo portò a imparare il Corano a memoria da ragazzo. Una laurea di prima classe in letteratura inglese ottenuta all'Università di Bombay nel 1891 gli valse una borsa di studio della Presidency per la Gran Bretagna, dove studiò giurisprudenza al St John's College di Cambridge, laureandosi e conseguendo il titolo in diritto nel 1895 e tornando quello stesso anno in India con un incarico nel servizio civile indiano.
hero.2=Trascorse quasi due decenni nel servizio civile — come magistrato e funzionario delle entrate, poi come giudice e in seguito come vicesegretario nel dipartimento delle Finanze del governo indiano — prima di dimettersi nel 1914 e stabilirsi in Gran Bretagna. Lì divenne amministratore fiduciario della moschea Shah Jehan di Woking e del fondo della moschea dell'East London, fu nominato CBE nel 1917 per il lavoro svolto durante la guerra e tenne lezioni di hindustani alla School of Oriental Studies. Tornò in India negli anni Venti (1920) e Trenta come preside dell'Islamia College di Lahore, e fu nel corso di quegli anni, dopo oltre un decennio di lavoro, che rese il Corano in inglese accompagnandolo con proprie note esplicative.
hero.3=La traduzione uscì in trenta fascicoli tra il 1934 e il 1937, il primo il 4 aprile 1934, con il titolo "The Holy Qur'an: Text, Translation and Commentary", pubblicata da Shaik Muhammad Ashraf di Lahore; un'edizione riunita in un solo volume seguì nel 1938, con un'edizione rivista nel 1939-1940. Insieme a quella di Pickthall, divenne una delle due traduzioni inglesi del Corano più lette del Novecento, nota soprattutto per l'ampiezza delle sue note a piè di pagina, e da allora è stata ristampata, in parte rielaborata da altre mani, in una trentina di edizioni successive — tra cui una diffusa in Nord America da Amana Publications a partire dal 1977 e una revisione promossa dall'Arabia Saudita negli anni Ottanta (1980).
hero.4=Ciò che è stato digitalizzato qui, tramite alquran.cloud, è il testo della traduzione in sé e non il commento che lo accompagna, ed è offerto in questo corpus come seconda traduzione inglese di accompagnamento [[Q-AR|al testo arabo uthmani]], insieme a quella di [[Q-EN|Pickthall]] del 1930. Fu una delle sole due versioni inglesi che una rassegna delle traduzioni disponibili trovò inequivocabilmente libere da diritti — questa e quella di Pickthall —, sebbene "inequivocabilmente" richieda qui una precisazione: l'opera è di pubblico dominio nell'Unione Europea e in Pakistan, dove Yusuf Ali morì e dove l'opera fu pubblicata per la prima volta, ma un copyright pro forma registrato negli Stati Uniti nel 1996 vi sarebbe valido fino al 2033.

