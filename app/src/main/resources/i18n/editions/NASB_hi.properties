fact.6.value=रूपात्मक समानता — मूल भाषाओं से उतना ही शब्दशः अनुवादित जितना पढ़ी जा सकने वाली अंग्रेज़ी अनुमति देती है, जहाँ अधिक स्पष्ट मुहावरा चुना गया वहाँ अधिक शब्दशः रूप पाद-टिप्पणी में दर्ज; हिब्रू, अरामी और यूनानी से एक नया अनुवाद, किसी पूर्ववर्ती अंग्रेज़ी बाइबिल का संशोधन नहीं, अमेरिकन स्टैंडर्ड वर्शन की पद्धति में अपनी जड़ों के बावजूद
