title=New American Standard Bible 2020 — इस संस्करण के बारे में | Common Root
description=न्यू अमेरिकन स्टैंडर्ड बाइबिल: अमेरिकन स्टैंडर्ड वर्शन की शब्द-दर-शब्द शब्दशः निष्ठा की लॉकमन फ़ाउंडेशन की अपनी निरंतरता, जिसे हिब्रू, अरामी और यूनानी से नए सिरे से अनुवादित किया गया है और जो अब अपने 2020 के पाठ में है।
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=न्यू अमेरिकन स्टैंडर्ड बाइबिल की शुरुआत एक सर्वथा नई परियोजना के रूप में नहीं, बल्कि एक सुनिश्चित निरंतरता के रूप में हुई। कैलिफ़ोर्निया के ला हाब्रा में स्थित एक गैर-लाभकारी संस्था, लॉकमन फ़ाउंडेशन ने 1959 में यह काम शुरू किया ताकि 1901 के अमेरिकन स्टैंडर्ड वर्शन को आगे बढ़ाया जा सके — हिब्रू, अरामी और यूनानी के प्रति शब्दशः, शब्द-दर-शब्द निष्ठा की उसकी प्रतिष्ठा बनाए रखते हुए, साथ ही उसकी पुरानी पड़ चुकी अंग्रेज़ी को आधुनिक बनाते हुए। फ़ाउंडेशन ने ईसाई कॉलेजों, विश्वविद्यालयों और धर्मशास्त्रीय संस्थानों के विद्वानों की एक समिति बनाई, जो अधिकांशतः रूढ़िवादी इवैंजेलिकल संप्रदायों से थे, और अनुवाद चरणों में प्रकाशित हुआ: यूहन्ना का सुसमाचार 1960 में, बाकी सुसमाचार 1962 में, पूरा नया नियम 1963 में, भजन संहिता अलग से 1968 में, और पूरी बाइबिल 1971 में। इस पहले पूर्ण संस्करण ने पुराने नियम के लिए रूडोल्फ़ किटेल की बिब्लिया हेब्राइका के तीसरे संस्करण का आधार लिया, मृत सागर पोथियों को भी ध्यान में रखते हुए, और नए नियम के लिए नेस्ले और अलांड के नोवुम टेस्टामेंटम ग्रेसे के 23वें संस्करण का।
hero.2=उस पहले मुद्रण के बाद संशोधन का काम दशकों तक चलता रहा। 1972, 1973 और 1975 में मामूली शब्द-परिवर्तन हुए, फिर 1977 में एक अधिक व्यापक संशोधन, और 1992 में एक और सीमित संशोधन। 1995 में फ़ाउंडेशन ने अपडेटेड एडिशन प्रकाशित किया — यानी NASB95, वह पाठ जिसे अधिकांश लोग केवल "NASB" कहते समय समझते हैं — जिसमें बिब्लिया हेब्राइका स्टटगार्टेंसिया और नेस्ले-अलांड के 26वें संस्करण का सहारा लिया गया। वर्तमान पाठ 2020 का अद्यतन है, जिसके कुछ भाग 2018 में ही ऑनलाइन दिखने लगे थे: इसने पुराने नियम का पाठ-आधार बिब्लिया हेब्राइका स्टटगार्टेंसिया और, जिन पुस्तकों में उपलब्ध हो वहाँ, उससे नई बिब्लिया हेब्राइका क्विंटा में स्थानांतरित किया, साथ ही सेप्टुआजिंट, मृत सागर पोथियों, तर्गुमों और अन्य प्राचीन संस्करणों को वहाँ ध्यान में रखा जहाँ वे किसी पाठ-भेद पर असर डालते हैं, जबकि नया नियम अब नेस्ले-अलांड के 28वें संस्करण का अनुसरण करता है, जिसे एडिटियो क्रिटिका मेयर के यूनानी हस्तलिपि प्रमाणों के अधिक समृद्ध संग्रह से पूरक किया गया है। अनुवादकों की घोषित पद्धति हर संशोधन में एक जैसी रही: मूल पाठ को उतना ही शब्दशः प्रस्तुत करना जितना अंग्रेज़ी अनुमति दे, और जहाँ सख़्ती से शब्दशः अनुवाद भ्रामक हो या अस्वाभाविक लगे, वहाँ अधिक स्पष्ट मुहावरा चुनना और अधिक शब्दशः रूप को पाद-टिप्पणी में दर्ज करना — एक अनुशासन जिसे अक्सर इस बात के कारण के रूप में बताया जाता है कि यह बीसवीं और इक्कीसवीं सदी के व्यापक रूप से प्रयुक्त अंग्रेज़ी अनुवादों में सबसे अधिक शब्दशः अनुवादों में से एक है।
hero.3=अपने नाम और अमेरिकन स्टैंडर्ड वर्शन के प्रति अपने घोषित ऋण के बावजूद, न्यू अमेरिकन स्टैंडर्ड बाइबिल मूल भाषाओं से किया गया एक नया अनुवाद है, उसकी पंक्ति-दर-पंक्ति संशोधन नहीं, और इसलिए संग्रह में इसके लिए कोई मूल स्रोत दर्ज नहीं है: NASB की किसी आयत के नीचे वंशावली की सीढ़ी खोलने पर यह सीधे ≈ चिह्नित मूल-भाषा तल तक पहुँचती है, ठीक वैसे ही जैसे न्यू इंटरनैशनल वर्शन के साथ होता है। इन दोनों में इस रूप से बढ़कर भी समानता है — दोनों ही लाइसेंस-प्राप्त हैं, मुफ़्त प्रतिलिपि योग्य नहीं, वे उसी शेल्फ़ पर मौजूद मुक्त-प्रतिलिपि अंग्रेज़ी संस्करणों से अलग खड़े हैं, हालाँकि अंग्रेज़ी इंटरफ़ेस डिफ़ॉल्ट रूप से न्यू इंटरनैशनल वर्शन पर खुलता है, जबकि न्यू अमेरिकन स्टैंडर्ड बाइबिल तक अनुवाद-ग्रिड में उसके अपने कार्ड से पहुँचा जाता है।

