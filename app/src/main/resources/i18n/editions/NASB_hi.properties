fact.8.value=लाइसेंस-प्राप्त, मुफ़्त प्रतिलिपि योग्य नहीं। 1,000 तक आयतें किसी भी रूप में लिखित अनुमति के बिना उद्धृत की जा सकती हैं, बशर्ते वे बाइबिल की कोई पूरी पुस्तक न बनाएँ और न ही उद्धृत करने वाली रचना के आधे से अधिक हों, साथ में 1960, 1971, 1977, 1995 और 2020 वर्षों का उल्लेख करने वाला कॉपीराइट नोटिस हो; इससे अधिक के लिए लॉकमन फ़ाउंडेशन की अनुमति आवश्यक है
fact.9.label=इस संग्रह में
fact.9.value=[[NIV|न्यू इंटरनैशनल वर्शन]] की तरह लाइसेंस-प्राप्त, मुफ़्त प्रतिलिपि योग्य नहीं — अंग्रेज़ी इंटरफ़ेस डिफ़ॉल्ट रूप से उस संस्करण पर खुलता है, और यह संस्करण अपने ही कार्ड से पहुँचा जाता है। वंशावली की सीढ़ियों में इसके लिए कोई मूल स्रोत दर्ज नहीं है: भले ही फ़ाउंडेशन इस परियोजना को [[ASV|अमेरिकन स्टैंडर्ड वर्शन]] की शब्दशः निष्ठा की निरंतरता बताता है, यह हिब्रू, अरामी और यूनानी से नए सिरे से अनुवादित है, न कि उसका या यहाँ रखे किसी अन्य अंग्रेज़ी पाठ का संशोधन, इसलिए NASB की किसी आयत के नीचे की सीढ़ी सीधे ≈ चिह्नित मूल-भाषा तल तक पहुँचती है
