# The narrative, one paragraph per key, in order.
hero.1=המקרא השלם הראשון בפינית. לפניו היו הברית החדשה של מיקאל אגריקולה משנת 1548 וחלקים מן הישנה שראו אור בשנות ה־50 של המאה ה־16; אחריו היה מקרא שלם בשפה שכמעט לא נכתבה. ארבעה מלומדים עשו את המלאכה בין 1638 ל־1641 — אסקיל פטראוס, מרטינוס סטודיוס, הנריקוס הופמן וגרגוריוס מתאי — תחת איסאקוס רותוביוס, הבישוף של טורקו, שדחף את המפעל עד סופו. פינלנד הייתה חלק משוודיה, והכרך הופיע ב־1642 בחסות המלכה כריסטינה. ניסיון נעשה דור קודם לכן: בשנת 1602 מונתה ועדה לתרגום המקרא, כנראה בראשות אריקוס אריצ'י סורולאינן, הבישוף של טורקו. דומה שהפיקה טיוטות אך מעולם לא חיברה אותן למקרא שלם, וגורלן אבד ברובו — אף שמקובל לחשוב שהעבודה הזאת ניכרת בתרגום 1642.
hero.2=הם תרגמו מן העברית ומן היוונית והגרמנית של לותר לצדם. המקרא השוודי של גוסטב ואסה היה הספר האחר שעל השולחן; הוא איננו באוסף הזה, ולכן השרשרת רושמת כאן את לותר — ולצדו את הפינית של אגריקולה משנת 1548, נוסח היסוד שהוועדה עיבדה. השפעתה הגדולה יותר של ה־Biblia של 1642 נפלה על הפינית עצמה. שפה שכמעט לא הייתה בה פרוזה כתובה קיבלה, בכרך אחד, אוצר מילים ומקצב לכול — מן החוק ועד הקינה — וכל מקרא פיני מאוחר יותר הוא תיקון שלה או יורש שלה, ולא התחלה חדשה.
hero.3=בקורא הזה עומדת מהדורת 1642 בין שני שלבים פיניים. שלושה שלבים מתחת ל־Kirkkoraamattu 1933/38, מתחת ל־Biblia 1776, מופיעה מהדורה זו, ומתחתיה שני הורים זה לצד זה — הפינית של אגריקולה משנת 1548, נוסח היסוד שהוועדה עיבדה, והגרמנית של לותר משנת 1545, פתוחה על השולחן. שלב אחד למטה מזה, והשרשרת כבר עזבה את הפינית לתמיד. הנוסח כאן בא ממאגר VKS של הפינית הספרותית הקדומה במרכז Kotus, ולכן הכתיב שאתם רואים — ״tulcon walkeus״ — הוא זה של דפוס 1642 עצמו ואינו מחודש.

