title=Baibal Olcim — Tietoa tästä laitoksesta | Common Root
description=Baibal Olcim: Raamattu matu-chinin kielellä, Myanmarin Chinin osavaltion vähemmistökielellä, jonka eBible.org levittää aidosti vapaana (public domain) tekstinä, jonka kääntäjää ja käännösvuotta ei tunneta.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Matu-chin — myös matupi-chin — on sinotiibetiläinen kieli, jota puhuu noin 34 000 ihmistä Matupin seudulla, Myanmarin Chinin osavaltion eteläosassa, ja sukulaisyhteisöjä rajan takana Intian Mizoramin osavaltiossa. Baibal Olcim on Raamattu tällä kielellä, ja se on tämän aineiston ainoa matu-chininkielinen teksti.
hero.2=Se, mitä tiedot eivät kerro, on kuka sen käänsi tai milloin. eBible.org, joka levittää tekstiä, ilmoittaa vain, että se on vapaa (public domain), ja luetteloi sen koodilla hlt, joka on matu-chinin ISO 639-3 -koodi — ei kääntäjää, ei komiteaa, ei käännösvuotta. Tämä sivu jättää molemmat tyhjäksi ennemmin kuin arvaa niitä. Samalla koodilla on täällä oma pieni historiansa: aiempi yritys lisätä tähän aineistoon toinen hindinkielinen Raamattu arkistoitiin koodin hlt alle samankaltaisen lyhenteen perusteella, kunnes matu-chininkielisten jakeiden ilmestyminen sinne, missä odotettiin hindiä, paljasti erehdyksen. Tämä laitos on se, joka todella tarkistettiin koodinsa nimeämää kieltä vasten.
hero.3=Se lisättiin sen vuoksi, mitä se on, ei pituutensa vuoksi: aidosti vapaa (public domain) Raamattu, ei vain lisensoitu, kielellä, jota puhuvan kristityn vähemmistön on täytynyt kokea todellista vainoa Myanmarin sisällissodan keskellä, Chinin osavaltiossa ja sen ympäristössä. Lukuohjelma, joka ei vaadi käyttäjiltään mitään eikä seuraa ketään heistä, on juuri tällaista tapausta varten — mikä selittää myös suurelta osin, miksi tällä sivulla on niin vähän muuta pantavaa faktoihinsa.

