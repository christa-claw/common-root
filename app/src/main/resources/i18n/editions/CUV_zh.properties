title=和合本 — 关于此版本 | Common Root
description=1919 年的和合本：历时二十九年的委员会工作，成就了华人基督徒至今仍在诵读的圣经，也是最早以书面白话官话写成并出版的书籍之一。
heroHeading=和合本
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=1890 年，在华的各基督教差会在上海开会，承认了一个难题。中文圣经当时已有数种，却没有两部彼此相合——措辞不合，人名译写不合，甚至连该用哪一层次的中文来写也不合。大会议决另作一部各差会共用的译本，名之为和合本，即调和相合的文本。当时的书面中文分作士人所用的文言与众人所说的白话两截，因此一次委办了三部——两部文言，一部官话。
hero.2=官话委员会花了二十九年。主持其事的是美国长老会传教士狄考文（Calvin Wilson Mateer），自 1863 年起居于山东；1908 年他去世时工程尚未完成，他从六七个差会中集合起来的委员会继续做下去，与他们并肩共事的中国学者也继续做下去，只是差会档案对这些人的姓名保存得远为草率。他们以英文 Revised Version 为所译的底本，并对照其背后的希伯来文与希腊文加以核校——这就使本语料库自有的 Revised Version 位于这部圣经上游一级，而 King James Version 又在其上一级。两部文言译本后来合并为一。存留下来的是官话本。
hero.3=它于 1919 年出版，而这个年份为它做成的，比任何委员会所能做的都多。那正是五四运动之年，中国作家开始认真弃文言而就白话，和合本恰在此时问世，成为最早一批本就以白话写成的大部头书籍之一。一部原为平息传教士之间争论而作的译本，竟成了现代汉语散文的一座里程碑，其语句为从未翻开过圣经的人所引用。此后它一直以两种版本印行，二者只差一个字——神还是上帝——并调整字距，使两种版本至今仍在同一处分页。
hero.4=在本阅读器中，它是唯一的中文圣经，这就决定了它行为上的两件事。把界面设为中文，打开的便是它——并非因为它被挑选出来，如同西班牙文选定了 Reina-Valera 1909 那样，而是因为目录在这门语言里找不到别的圣经。而在谱系阶梯中，它没有记录在案的母本，所以经文之下的一级阶梯径直落到以 ≈ 标示的原文底层，尽管它所自出的 Revised Version 就在本库中隔着一栏。不过它的阶梯标签确实带着年份，1919 年，这并非此处每一部版本都有的。

