# The narrative, one paragraph per key, in order.
hero.1=Perusenglannin, Basic Englishin, laati C. K. Ogden Orthological Institute -laitoksesta: 850 englannin sanan luettelo, jota tarjottiin kansainväliseksi apukieleksi. Bible in Basic English syntyi komiteassa, jota johti S. H. Hooke (1874–1968), Vanhan testamentin tutkija, josta tuli Lontoon yliopiston Samuel Davidson -professori Vanhan testamentin tutkimuksessa vuonna 1930, ja joka työskenteli yhdessä Orthological Instituten kanssa. Raamattu käännettiin hepreasta ja kreikasta, eikä sitä yksinkertaistettu jostakin aiemmasta englanninkielisestä käännöksestä, ja Cambridge University Pressin hallituksen asettama komitea kävi perusenglanninkielisen tekstin sen jälkeen yksityiskohtaisesti läpi. Ogdenin 850 sanaan kääntäjät lisäsivät 100 runouden ymmärtämistä auttavaa sanaa ja 50 Raamatun tarvitsemaa sanaa, yhteensä 150. Cambridge University Press julkaisi Uuden testamentin 1941 ja koko Raamatun 1949; vuoden 1965 painosta levitettiin Yhdysvalloissa ilman tekijänoikeusmerkintää, ja siksi teksti on siellä vapaassa käytössä.
hero.2=Tulos on selkeää ja tasaista kieltä tuon pienen sanaston rajoissa. Genesis alkaa ”At the first God made the heaven and the earth.” Psalmi 23 alkaa ”The Lord takes care of me as his sheep; I will not be without any good thing.” Johanneksen evankeliumi alkaa ”From the first he was the Word, and the Word was in relation with God and was God,” ja Johanneksen 3:16 kuuluu ”For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.” Jumalan nimi on kauttaaltaan ”the Lord”, paitsi kahdeksassa jakeessa, joissa se on ”Yahweh”; niihin kuuluvat 2. Mooseksen kirjan 6:3, jossa Jumala sanoo, että Abraham, Iisak ja Jaakob ”had no knowledge of my name Yahweh”, sekä Psalmi 83:18. Missä heprea oli liian epävarmaa käännettäväksi, kääntäjät panivat sen paikalle pisteitä, ja meidän kappaleessamme muutama jae, muiden muassa Job 34:29–33 ja Job 36:16–20, on pelkkää ”...”.
hero.3=Meidän kappaleemme sisältää 66 kirjaa Genesiksestä Ilmestyskirjaan, ilman apokryfikirjoja, King James Versionin ja Revised Versionin luku- ja jakeenumeroinnin mukaan — 150 psalmia, ja Malakia päättyy lukuun 4. Psalmien otsikoita siinä ei ole: Psalmi 51 alkaa sanoin ”Have pity on me, O God”. Uusi testamentti ei ole vastaanotetun tekstin käännös. Kuusitoista jaetta, jotka tekstikriittiset laitokset jättävät pois, muiden muassa Matteuksen 17:21, Apostolien tekojen 8:37 ja Roomalaiskirjeen 16:24, on säilytetty tässä vain tyhjinä paikkoina, jotka on merkitty []; 1. Johanneksen kirjeen 5:7:ssä ei ole kolmea todistajaa taivaassa; kertomus aviorikoksesta tavatusta naisesta, Johanneksen 7:53–8:11, on hakasulkeissa, kun taas Markuksen pidempi loppu on säilytetty. Tässä lukijassa se seisoo omillaan. Aineistoon ei ole kirjattu sille edeltäjää, joten jonkin sen jakeen alta avattu polveutumisaskelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan: Vanhassa testamentissa Leningradin koodeksiin ja Uudessa Textus Receptukseen, kreikkalaiseen tekstiin, jota tämä käännös ei noissa kuudessatoista kohdassa seuraa. Mitään ei myöskään ole kirjattu seisomaan sen päällä. Mikään käyttöliittymän kieli ei avaudu tähän laitokseen; englanninkielinen käyttöliittymä avautuu New International Versioniin, ja tähän päästään sen omasta kortista käännösruudukossa.

