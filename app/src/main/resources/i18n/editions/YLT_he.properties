title=Young's Literal Translation — על מהדורה זו | Common Root
description=התרגום המילולי של כתבי הקודש מאת רוברט יאנג, שראה אור לראשונה באדינבורו ב־1862, ותוקן בידי יאנג עצמו ב־1887 ובידי מו״ליו ב־1898 — תרגום אנגלי השומר על הזמנים, על סדר המילים, ועד כמה שאפשר גם על אוצר המילים של העברית והיוונית, אף במקום שהאנגלית מתקשה לעמוד בכך.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=רוברט יאנג (1822–1888) היה מדפיס ומוכר ספרים באדינבורו. בשנות חניכותו כמדפיס לימד את עצמו עברית ועוד כמה לשונות מזרחיות, ניהל בשנים 1856–1861 בית דפוס של המיסיון בסוּרַט שבהודו, ונזכר בעיקר בזכות שני ספרים: הקונקורדנציה Analytical Concordance to the Bible והתרגום הזה. הוא פרסם את Literal Translation באדינבורו ב־1862 ומהדורה מתוקנת ב־1887. עשר שנים אחרי מותו, בינואר 1898, הוציאו מו״ליו מהדורה שלישית, שתוקנה פעם נוספת ”על קוויה הקיימים”; זה הטקסט שבאוסף זה. יאנג תרגם את הברית הישנה מן הנוסח המסורתי המקובל ואת הברית החדשה מן הנוסח היווני המקובל, הטקסטוס רצפטוס, ואמר במפורש שלא ינסה להתקין נוסח חדש לאף אחד מהם: תרגום, כתב, הוא משימה שונה מביקורת הנוסח, ומעטים כשירים לשתיהן.
hero.2=כל המטרה היא לאפשר לקורא האנגלי לראות את הדקדוק של המקור. יאנג סבר שתרגום הנותן הווה במקום שבמקור יש עבר, או ”an a for a the”, מילית סתמית (a) במקום ה׳ הידיעה (the), מניח בצד את ההשראה המילולית, ותרגם בהתאם. צורות הפועל העבריות עוברות לזמנים באנגלית, ולכן הסיפור מתנהל לעתים קרובות בהווה: ספר בראשית נפתח ב־”In the beginning of God's preparing the heavens and the earth —” וממשיך ”and God saith, ‘Let light be;’ and light is.” מילים שנוספו לשם המובן עומדות בסוגריים מרובעים: ”Jehovah [is] my shepherd, I do not lack.” הוא ניסה לתת לכל מילה עברית או יוונית מקבילה אנגלית אחת בכל מקום שיכול, ולכן ”עולם” העברי ו־aiōn היווני נעשים ”age” ו־”age-during” ולא ”ever” ו־”eternal”; במתי 25:46 הצדיקים הולכים ”to life age-during”. השם המפורש מופיע לאורך כל הברית הישנה בצורה ”Jehovah”.
hero.3=העותק שלנו שלם: 66 ספרים, מבראשית ועד ההתגלות, בלי הספרים החיצוניים, בחלוקת הפרקים והפסוקים האנגלית — 150 מזמורים, שכותרת כל אחד מהם משולבת בפסוק הראשון שלו, ומלאכי המסתיים בפרק 4. כתרגום של הנוסח המקובל, יש בו הקטעים שהמהדורות הביקורתיות המאוחרות מטילות בהם ספק, מן הסיום הארוך של מרקוס ועד שלושת העדים בשמים ביוחנן א׳ 5:7, שטקסט זה מעמיד בסוגריים מרובעים, כפי שהוא עושה בכל מעשי השליחים 8:37. בקורא זה הוא עומד לבדו. האוסף אינו רושם לו הורה, ולכן שלב שושלת שנפתח מתחת לאחד מפסוקיו נופל ישירות לרצפת לשונות המקור המסומנת ב־≈: כתב יד לנינגרד בברית הישנה והטקסטוס רצפטוס בברית החדשה. רצפה זו קרובה למה שיאנג עצמו תרגם ממנו, העברית המסורתית והיוונית המקובלת, אם כי לא באותן הדפסות. גם דבר אינו רשום כעומד עליו. ה־Literal Standard Version משנת 2020, שגם היא באוסף זה, מציגה את עצמה כעיבוד מקיף של מפעלו של יאנג, אך האוסף אינו רושם קשר זה, ולכן השלבים שמתחת ל־LSV אינם מובילים לכאן. אף שפת ממשק אינה נפתחת על מהדורה זו; ממשק אנגלי נפתח על New International Version, ולמהדורה זו מגיעים מן הכרטיס שלה ברשת התרגומים.

