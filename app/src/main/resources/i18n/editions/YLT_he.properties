fact.5.label=סוג התרגום
fact.5.value=מילולי בקפדנות: זמני המקור נשמרים גם במקום שהאנגלית נשמעת משונה, ולכן הסיפור מתנהל לעתים קרובות בהווה; מילה אנגלית אחת לכל מילה במקור ככל האפשר, כך ש”עולם” ו־aiōn נעשים ”age” ו־”age-during”; מילים שנוספו לשם המובן בסוגריים מרובעים; השם המפורש כ־”Jehovah”
fact.6.label=פורסמה
fact.6.value=אדינבורו, 1862; בתיקון יאנג, 1887; מהדורה שלישית, בתיקון חוזר של מו״ליו, אדינבורו, ינואר 1898 — הטקסט שבאוסף
fact.7.label=רישיון
fact.7.value=נחלת הכלל; עותק זה מ־eBible.org
fact.8.label=באוסף זה
fact.8.value=66 ספרים, הקאנון הפרוטסטנטי כולו, בלי הספרים החיצוניים; חלוקת פרקים ופסוקים אנגלית, כך שהמזמורים הם 150 וכותרת כל מזמור משולבת בפסוק הראשון שלו
fact.9.label=שושלת
fact.9.value=אין הורה רשום, ואין דבר הרשום כעומד עליו — השלב נפתח ישירות על רצפת לשונות המקור, [[WLC|כתב יד לנינגרד]] בברית הישנה ו־[[TR|הנוסח המקובל]] בברית החדשה; [[LSV|Literal Standard Version]] משנת 2020 מעבדת את מפעלו של יאנג, אך האוסף אינו רושם את הקשר
