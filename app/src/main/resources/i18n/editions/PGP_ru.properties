title=Драгоценная Жемчужина — Об этом издании | Common Root
description=Драгоценная Жемчужина: подборка откровений, переводов и повествований Джозефа Смита, впервые собранная в 1851 году как миссионерская брошюра в Ливерпуле, Англия, и принятая святыми последних дней как писание в 1880 году.
heroHeading=Драгоценная Жемчужина
readerHref=/reader?c1.src=pgp

hero.1=Драгоценная Жемчужина появилась как миссионерская брошюра, а не как книга писания. В 1851 году Франклин Д. Ричардс, тогдашний президент Европейской миссии церкви, составил её в Ливерпуле, Англия, собрав сочинения Джозефа Смита, которые печатались в ранних церковных газетах или расходились лишь в немногих экземплярах, чтобы у членов церкви в Великобритании они были собраны в одном месте. Название восходит к притче из Евангелия от Матфея 13:45–46 о купце, который продаёт всё, что имеет, чтобы купить одну драгоценную жемчужину.
hero.2=Второе издание, отредактированное и перекомпонованное Орсоном Праттом, вышло в Солт-Лейк-Сити в 1878 году, а 10 октября 1880 года генеральная конференция церкви голосованием приняла его как писание. Пересмотренное издание 1902 года, подготовленное главным образом Джеймсом Э. Талмеджем, разделило текст на главы и стихи и исключило откровения, общие с Учением и Заветами; в издании 1921 года текст был набран в две колонки. В 1976 году были добавлены ещё два откровения — видение целестиального царства и видение Джозефа Ф. Смита об искуплении умерших, — а в 1979 году церковь перенесла их в Учение и Заветы, в издании которых 1981 года они напечатаны как разделы 137 и 138.
hero.3=Нынешнее издание состоит из пяти частей. «Избранное из Книги Моисея» и «Джозеф Смит – Матфей» — это выдержки из начатой Джозефом Смитом в 1830 году переработки Библии короля Иакова: первая — расширенное изложение начальных глав Книги Бытия в обрамлении видений, данных Моисею; вторая — новая редакция стиха 23:39 и главы 24 Евангелия от Матфея. «Книга Авраама» — текст, который, по словам Смита, он перевёл с египетских папирусов, приобретённых в Киртланде, штат Огайо, в 1835 году; она была опубликована в 1842 году в газете Times and Seasons в Наву, штат Иллинойс, вместе с тремя иллюстрациями, которые теперь называются факсимиле 1, 2 и 3. «Джозеф Смит – История» взята из составленного им в 1838 году рассказа о его ранних годах и видениях, а «Символы веры» — тринадцать положений веры из письма 1842 года чикагскому редактору газеты Джону Уэнтворту.
hero.4=«Книга Авраама» — та часть, которую чаще всего ставят под сомнение. Большая часть папирусов долго считалась уничтоженной, вероятно, во время чикагского пожара 1871 года, однако десять фрагментов, некогда принадлежавших Джозефу Смиту, обнаружились в Метрополитен-музее в Нью-Йорке, который в 1967 году передал их церкви. Учёные определяют эти фрагменты как части обычных египетских погребальных текстов, написанных между III веком до н. э. и I веком н. э., а собственное опубликованное эссе церкви об этой книге признаёт, что ни один из знаков на них не упоминает имени Авраама или какого-либо события, о котором рассказывает книга.
hero.5=Вместе с Библией, Книгой Мормона и Учением и Заветами она входит в четыре канонических писания Церкви Иисуса Христа Святых последних дней; Community of Christ, другая крупная церковь, восходящая к движению Джозефа Смита, не причисляет её к своим писаниям. Текст в этом собрании взят из JSON-экспорта Mormon Documentation Project, находящегося в общественном достоянии, — того же источника, что и Книга Мормона и Учение и Заветы здесь, — и сохраняет пять частей как пять книг: Моисей с восемью главами, Авраам с пятью и последние три — по одной. Три факсимиле и напечатанные при них пояснения не являются текстом со стихами и поэтому не включены. Как и два родственных ей издания, она передаёт формулировки нынешнего стандартного издания, а не какого-то одного исторического тиража, поэтому год издания здесь не указан.

