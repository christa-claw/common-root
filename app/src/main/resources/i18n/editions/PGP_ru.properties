fact.2.label=Кем сделана
fact.2.value=Джозеф Смит-младший (1805–1844): откровения, его переработка Библии короля Иакова, перевод, который, по его словам, он сделал с египетских папирусов, его собственная история и изложение вероучения; впервые собраны в один том Франклином Д. Ричардсом
fact.3.label=Издана
fact.3.value=1851, Ливерпуль, Англия, как миссионерская брошюра, составленная Франклином Д. Ричардсом; второе издание 1878, Солт-Лейк-Сити, под редакцией Орсона Пратта; принята как писание генеральной конференцией 10 октября 1880 года
fact.4.label=Структура
fact.4.value=Пять частей — «Избранное из Книги Моисея», «Книга Авраама», «Джозеф Смит – Матфей», «Джозеф Смит – История» и «Символы веры», — разделённых на главы и стихи с пересмотра 1902 года; в нашем собрании каждая часть представлена как отдельная книга
fact.5.label=Положение
fact.5.value=Одно из четырёх канонических писаний Церкви Иисуса Христа Святых последних дней, наряду с Библией, [[BOM|Книгой Мормона]] и [[DC|Учением и Заветами]]; Community of Christ не считает её писанием
fact.6.label=В этом собрании
fact.6.value=Текст следует нынешней стандартной формулировке из JSON-экспорта Mormon Documentation Project, объявленного общественным достоянием, — того же источника, что и для [[BOM|Книги Мормона]] и [[DC|Учения и Заветов]]; выдержки из Моисея и Матфея перерабатывают текст [[KJV|Библии короля Иакова]], которая тоже есть в собрании; факсимиле и пояснения к ним опущены, и отдельный год печати здесь не указан
fact.7.label=Лицензия
