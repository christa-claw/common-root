title=Sahih al-Bukhari — Su questa edizione | Common Root
description=Sahih al-Bukhari: la raccolta di hadith che l'islam sunnita colloca al secondo posto per autorità, subito dopo il Corano, messa insieme da Muhammad al-Bukhari fra circa 600.000 racconti che aveva esaminato, ammettendo solo quelli sostenuti da una catena ininterrotta di trasmettitori ritenuti attendibili.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismail al-Bukhari raccolse questa compilazione per lo più in due moschee — la Moschea Sacra alla Mecca e la Moschea del Profeta a Medina — e la completò nella sua città natale, Bukhara, verso l'anno 232 dell'Egira (846 d.C.); trascorse circa gli ultimi due decenni della sua vita a revisionarla ulteriormente durante i suoi viaggi. Il suo titolo completo, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, viene di solito abbreviato in Sahih al-Bukhari — «la [raccolta] attendibile di al-Bukhari». Si racconta che al-Bukhari stesso abbia affermato di averla scelta fra circa 600.000 racconti di hadith che aveva esaminato, ammettendo un racconto solo quando, a suo giudizio, portava una catena ininterrotta di trasmettitori attendibili fino alla fonte originale.
hero.2=Questo criterio spiega il peso di cui gode l'opera. Il Sahih al-Bukhari è considerato il primo dei Sei Libri dell'islam sunnita (Kutub al-Sitta), e insieme al Sahih Muslim — il suo rivale più prossimo per metodo e reputazione — i due sono chiamati i Sahihayn, «i due attendibili». La maggior parte degli studiosi sunniti collocano la raccolta di al-Bukhari sopra ogni altro libro di hadith e, in autorità, subito dopo il Corano stesso, sebbene una minoranza abbia invece sostenuto la precedenza del Sahih Muslim. Il materiale è organizzato per argomento piuttosto che per trasmettitore o cronologia (ciò che gli studiosi chiamano musannaf), diviso in libri (kutub) che vanno dalla purificazione rituale e dalla preghiera al commercio, al matrimonio, alla vita dei profeti precedenti e ai segni dell'Ultima Ora.
hero.3=Quanti hadith contenga davvero il libro dipende da quale tradizione di stampa li conti. La cifra oggi più citata, 7.563, deriva dalla numerazione che l'editore Muhammad Fu'ad Abd al-Baqi diede al testo nel Novecento, e conta di nuovo un hadith ogni volta che viene ripetuto sotto un altro capitolo; eliminate le ripetizioni, Ibn Hajar al-Asqalani ne contò 2.602. Altri studiosi hanno proposto altri totali ancora. La cifra propria di questo corpus è a sua volta una terza: 98 libri e 7.589 hadith numerati, che è semplicemente la forma dell'edizione digitale da cui proviene, non una pretesa di riprodurre esattamente una particolare numerazione a stampa.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-bukhari di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Muhammad ibn Ismail al-Bukhari (194–256 dell'Egira / 810–870 d.C.)
fact.3.label=Titolo completo
fact.3.value=al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi — di solito abbreviato in Sahih al-Bukhari
fact.4.label=Compilato
fact.4.value=per lo più alla Moschea Sacra alla Mecca e alla Moschea del Profeta a Medina; completato a Bukhara verso l'anno 232 dell'Egira (846 d.C.)
fact.5.label=Metodo
fact.5.value=ammette un hadith solo con una catena ininterrotta di trasmettitori che al-Bukhari giudicava attendibili; si racconta che abbia scelto la raccolta fra circa 600.000 racconti che aveva esaminato
fact.6.label=Posizione
fact.6.value=il primo dei Sei Libri dell'islam sunnita (Kutub al-Sitta); insieme al [[MUS|Sahih Muslim]] forma «i Sahihayn», le due raccolte collocate in autorità subito dopo il Corano
fact.7.label=Numero di hadith
fact.7.value=7.563 con ripetizioni nella numerazione di Abd al-Baqi, ampiamente diffusa, o 2.602 senza ripetizione secondo il conteggio di Ibn Hajar al-Asqalani; le edizioni a stampa differiscono sia nella numerazione dei capitoli sia in quella degli hadith
fact.8.label=In questo corpus
fact.8.value=98 libri (kutub) e 7.589 hadith numerati — la forma propria del set di dati di origine, non la riproduzione di una particolare numerazione a stampa
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-bukhari di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione pubblicata discenda non è ancora stato stabilito da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
