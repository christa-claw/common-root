title=Luther Bibel 1545 — À propos de cette édition | Common Root
description=L'Ausgabe letzter Hand de Luther : la Bible de Wittenberg de 1545, la dernière édition que Martin Luther a révisée lui-même, et le texte devenu la référence après sa mort.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Non la première Bible de Luther, mais la dernière. Le Nouveau Testament qu'il a fait à la Wartburg a paru en 1522 et la Bible complète en 1534 ; il a continué de réviser une décennie encore, et l'édition que Hans Lufft a imprimée à Wittenberg en 1545 est la dernière que Luther a menée lui-même à son terme. L'allemand l'appelle Ausgabe letzter Hand, l'édition de dernière main. Il est mort au mois de février suivant, et ce texte est devenu la mesure sur laquelle les Bibles de Luther postérieures ont été réglées.
hero.2=Il a travaillé sur les originaux et non sur le latin : le grec imprimé d'Érasme pour le Nouveau Testament, l'hébreu massorétique pour l'Ancien, avec un cercle de collègues de Wittenberg pour débattre des passages difficiles. Ce qui en est sorti a fait pour l'allemand à peu près ce que la Biblia de 1642 ferait pour le finnois un siècle plus tard. Une langue à nombreux dialectes et à prose peu fixée a reçu un registre unique que tous pouvaient lire, et la langue écrite moderne en est née.
hero.3=Deux chaînes se rejoignent ici. La Luther Bibel 1912 se tient immédiatement au-dessus de cette édition, dont elle est une révision. De même la Biblia 1642, trois échelons plus haut dans la ligne finnoise, parce que le comité de Turku travaillait Luther ouvert. Au-dessous, l'échelle atteint le sol — le Textus Receptus pour le grec, le Codex de Leningrad pour l'hébreu — et ces échelons sont pleins et non marqués ≈, car le grec d'Érasme et l'hébreu massorétique sont ce dont Luther a réellement traduit, et non des témoins placés après coup.

