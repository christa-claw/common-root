title=Öğreti ve Antlaşmalar — Bu Baskı Hakkında | Common Root
description=Öğreti ve Antlaşmalar: Joseph Smith'in kaydettiği vahiyler ve diğer bildirimler; 1835'te Kirtland, Ohio'da ilk kez yayımlanmış ve Son Gün Azizleri tarafından İncil'in yanında kutsal metin olarak okunmaktadır.
heroHeading=Öğreti ve Antlaşmalar
readerHref=/reader?c1.src=dc

hero.1=Öğreti ve Antlaşmalar, Joseph Smith Jr.'ın Tanrı'dan doğrudan ileti olarak aldığını söylediği vahiyleri, görümleri ve diğer bildirimleri bir araya getirir; bunlar esasen kilisenin Ohio, Missouri ve New York'taki ilk yıllarında kaydedilmiştir. "Mesih Kilisesi'nin Yönetimi için Buyruklar Kitabı" adlı daha önceki bir derleme, Missouri'nin Independence kasabasındaki kilise matbaasında basılmaktayken, Temmuz 1833'te bir güruh matbaayı yıkmış ve kitap tamamlanamadan yarım kalan sayfaları dağıtmıştır; kitap resmi olarak hiçbir zaman yayımlanmamış, yalnızca o sırada kurtarılan ciltlenmemiş sayfalardan az sayıda örnek günümüze ulaşmıştır.
hero.2=1835'te, genişletilmiş ve yeniden adlandırılmış bir baskı olan "Son Gün Azizleri Kilisesi'nin Öğreti ve Antlaşmaları", Kirtland, Ohio'da yayımlanmıştır; bu baskıyı Joseph Smith, Oliver Cowdery, Sidney Rigdon ve Frederick G. Williams'tan oluşan dört kişilik bir komite derlemiş ve onaylamıştır. Bu ilk baskı, tek bir kapak altında iki türde içerik toplamıştır — Kirtland Okulu'nda verilen ve kitabın "Öğreti"si olarak sunulan bir dizi teolojik ders ile kaydedilmiş vahiylerin kendisi, kitabın "Antlaşmaları" olarak sunulmuştur. Lectures on Faith olarak tanınan bu dersler, daha sonra kitaptan çıkarılmıştır — bu değişiklik genellikle 1921 baskısına tarihlenir — böylece vahiyler eserin tamamını oluşturmuştur.
hero.3=Kitap, bir İncil'in kitap, bölüm ve ayetleri yerine numaralandırılmış bölümler (section) halinde düzenlenmiştir; bu da onun ne olduğunu yansıtır: tek, sürekli bir anlatı değil, ayrı metinlerden oluşan bir derleme. Hem içerik hem de numaralandırma, 19. yüzyıl baskıları boyunca değişmiştir; bunlardan biri, Orson Pratt yönetimindeki 1876 baskısıdır ve bu baskı daha önceki malzemeyi yeniden düzenlemiş, yeni vahiyler eklemiştir. Modern baskı, 1981'de bugünkü biçimini almıştır; bu tarihte iki bölüm daha — yücelik dereceleri görümü ve ölülerin kurtuluşu görümü — 137 ve 138. bölümler olarak eklenmiş, bunlara iki "Resmi Bildirim" de katılmıştır: kilisenin yeni çok eşli evlilikleri onaylamasına son veren 1890 tarihli bir manifesto ve rahiplik atamasını ırk ayrımı yapmadan tüm layık erkek üyelere genişleten 1978 tarihli bir bildirim. 2013 baskısı ise diğer kaynak malzemeleri güncellemiştir. Bugün kullanılan standart baskı, 138 bölüm ve iki Resmi Bildirim içermektedir.
hero.4=Bu kitap, Son Gün Azizleri hareketinin standart eserleri olarak adlandırdığı dört eserden biridir; İncil, [[BOM|Mormon Kitabı]] ve [[PGP|Değerli İnci]] ile birlikte anılır. Aynı hareketten doğan ayrı bir mezhep olan Community of Christ, kendi Öğreti ve Antlaşmalar'ını, bundan bağımsız olarak numaralandırılmış ve güncellenmiş biçimde sürdürmektedir. Bu derlemedeki metin, Mormon Documentation Project'in JSON dışa aktarımından alınmıştır; bu, [[BOM|Mormon Kitabı]] ve [[PGP|Değerli İnci]] için kullanılan aynı kamu malı kaynaktır ve burada tek bir kitap olarak, "Öğreti ve Antlaşmalar" biçiminde sunulmuştur; bu kitapta her bölüm bir bölüm (chapter) işlevi görür. Metin, bugünkü standart baskının ifadelerini izler ve telif hakkı korumalı dipnotları ile bölüm başlıklarını dışarıda bırakır; bu nedenle burada tek bir yayın yılı belirtilmemiştir.

