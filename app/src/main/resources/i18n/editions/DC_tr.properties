fact.2.value=Joseph Smith Jr.'ın (1805–1844) Tanrı'dan doğrudan ileti olarak aldığını söylediği vahiyler ve diğer bildirimler; daha sonraki az sayıda bölüm, özellikle de iki Resmi Bildirim, onun kilise başkanlığındaki ardıllarından gelmiştir
fact.3.label=Yayımlanma
fact.3.value=1835, Kirtland, Ohio; 1833 tarihli ve tamamlanamamış Buyruklar Kitabı'nı genişletmiştir; Joseph Smith, Oliver Cowdery, Sidney Rigdon ve Frederick G. Williams'tan oluşan bir komite tarafından derlenip onaylanmıştır
fact.4.label=Yapı
fact.4.value=Kitap, bölüm ve ayetler yerine 138 numaralandırılmış bölüm (section) ile iki Resmi Bildirim; derlememizde her bölüm, "Öğreti ve Antlaşmalar" adlı tek bir kitap içinde bir bölüm (chapter) işlevi görür
fact.5.label=Konum
fact.5.value=Son Gün Azizleri hareketinin dört standart eserinden biri; İncil, [[BOM|Mormon Kitabı]] ve [[PGP|Değerli İnci]] ile birlikte anılır
fact.6.label=Bu derlemede
fact.6.value=Metin, Mormon Documentation Project'in kamu malı olarak ilan edilmiş JSON dışa aktarımından alınan bugünkü standart ifadeleri izler — bu, [[BOM|Mormon Kitabı]] ve [[PGP|Değerli İnci]] için kullanılan kaynakla aynıdır; telif hakkı korumalı dipnotları ve bölüm başlıkları dışarıda bırakılmıştır — bu nedenle burada tek bir baskı yılı belirtilmemiştir
