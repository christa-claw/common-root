title=Shah Waliullah Dehlawin neljäkymmentä hadithia — Tietoja tästä laitoksesta | Common Root
description=Shah Waliullah Dehlawin neljäkymmentä hadithia: neljäkymmentä hadithia, jotka 1700-luvun delhiläinen oppinut kertoi kuulleensa suoraan omalta opettajaltaan opiskeluvuotensa aikana Medinassa, säilytettynä yhdessä niiden siirtoketjujen kanssa — tämänlaatuisista kokoelmista luetuin Intian niemimaalta.
heroHeading=Shah Waliullah Dehlawin neljäkymmentä hadithia
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Shah Waliullah Dehlawi — täydeltä nimeltään Qutb al-Din Ahmad ibn 'Abd al-Rahim al-'Umari al-Dihlawi — syntyi 21. helmikuuta 1703 Phulatissa, lähellä Muzaffarnagaria, ja kasvoi Delhissä, missä hänen isänsä Shah Abdur Rahim oli perustanut Madrasah-i Rahimiyahin. Hänen kerrotaan oppineen Koraanin ulkoa seitsemän vuoden iässä ja suorittaneen aikansa tavanomaisen oppimäärän viidentoista vuoden iässä, ja hän seurasi isäänsä madrasan johtajana kaksi vuotta myöhemmin. Vuosina 1730–31 hän teki hajj-pyhiinvaelluksen ja vietti sen jälkeen noin vuoden Medinassa opiskellen hadithia — ensisijaisesti Abu Tahir al-Kurdin (myös muodossa al-Kurani) johdolla, ja opiskeli lisäksi Muhammad Wafdullah al-Malikin ja šeikki Taj al-Din al-Qal'in johdolla — ennen paluutaan Delhiin 16. joulukuuta 1732. Hän kuoli Delhissä 20. elokuuta 1762 (29. muharram 1176 AH) ja haudattiin isänsä viereen. Hänen muihin teoksiinsa kuuluvat Hujjat Allah al-Baligha, jota pidetään yleisesti hänen tärkeimpänä teoksenaan, Al-Fawz al-Kabir, sekä Futuh al-Haramayn, hänen oma kertomuksensa matkasta, joka vei hänet Hijaziin.
hero.2=Al-Arba'in jatkaa samaa "neljänkymmenen hadithin" (arba'iniyyat) perinnettä kuin [[NAW|An-Nawawin neljäkymmentä hadithia]] ja [[QUD|Neljäkymmentä pyhää hadithia]]; perinne palautuu hadithiin, joka lupaa paikan oppineiden joukossa tuomiopäivänä sille, joka säilyttää neljäkymmentä uskoon liittyvää hadithia — hadith, jonka useimmat kriitikot itse luokittelevat heikoksi (da'if) — sekä ensimmäiseen, nykyisin kadonneeseen kokoelmaan, joka on liitetty Abdullah ibn al-Mubarakiin (k. 797). Se eroaa näistä kahdesta siinä, mitä se kokoaa: sen englanninkielinen kustantaja kuvaa sitä neljäksikymmeneksi hadithiksi, jotka Shah Waliullah kertoi kuulleensa suoraan omalta opettajaltaan Medinassa, ei aiheen tai luokitusarvon perusteella laajemmasta kirjallisuudesta valikoituneiksi — ja kukin niistä on säilytetty yhdessä sen siirtoketjun (sanad) kanssa, jota kautta hän sen vastaanotti. Se on henkilökohtainen siirtotallennus siitä opiskeluvuodesta, joka hänen poikansa mukaan muutti sitä, miten hän opetti ja kirjoitti palattuaan Delhiin.
hero.3=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-dehlawi-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää teoksissa [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]], [[NAW|Forty Hadith of an-Nawawi]] ja [[QUD|Forty Hadith Qudsi]] sekä Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=Klassista arabiaa, englanninkielinen käännös näkyy lukijassa jokaisen hadithin alla
fact.2.label=Kokoaja
fact.2.value=Shah Waliullah Dehlawi (1703–1762)
fact.3.label=Nimi
fact.3.value=Tunnetaan arabiaksi nimellä Al-Arba'in ("Neljäkymmentä"); nykyaikainen englanninkielinen laitos nimellä Forty Hadith of Shah Wali-Allah julkaistiin Turath Publishingin kustantamana vuonna 2015, kääntäjänä Safaruk Zaman Chowdhury
fact.4.label=Koottu
fact.4.value=Sen jälkeen kun Shah Waliullah palasi Delhiin 16. joulukuuta 1732, tehtyään hajj-pyhiinvaelluksen vuosina 1730–31 ja opiskeltuaan hadithia Medinassa noin vuoden, ensisijaisesti Abu Tahir al-Kurdin (myös muodossa al-Kurani) johdolla
fact.5.label=Menetelmä
fact.5.value=Sen englanninkielisen kustantajan mukaan kukin neljästäkymmenestä hadithista on sellainen, jonka Shah Waliullah kertoi kuulleensa suoraan omalta opettajaltaan, säilytettynä yhdessä sen siirtoketjun (sanad) kanssa, jota kautta hän sen vastaanotti — henkilökohtainen siirtotallennus, ei aiheen tai luokitusarvon perusteella tehty valikoima
fact.6.label=Asema
fact.6.value=Tunnetuin Intian niemimaalta peräisin oleva "neljänkymmenen hadithin" (arba'iniyyat) kokoelma; jatkaa lajia, jonka ensimmäinen tunnettu, nykyisin kadonnut esimerkki on liitetty Abdullah ibn al-Mubarakiin (k. 797) ja joka tuotti myös [[NAW|An-Nawawin neljäkymmentä hadithia]] ja [[QUD|Neljäkymmentä pyhää hadithia]]
fact.7.label=Hadith-määrä
fact.7.value=40
fact.8.label=Tässä aineistossa
fact.8.value=1 kirja ja 40 numeroitua hadithia
fact.9.label=Englanninkielinen käännös
fact.9.value=Otettu fawazahmed0/hadith-api:n eng-dehlawi-laitoksesta, näytetään arabiankielisen tekstin rinnalla; aineisto merkitsee kääntäjän tuntemattomaksi, ja sitä, onko kyseessä Turath Publishingin/Chowdhuryn käännös tai itsenäinen käännös, ei ole tämän aineiston puolesta vahvistettu
fact.10.label=Käyttöoikeus
fact.10.value=Arabiankielinen matn on klassinen, vapaasti käytettävä teksti; englanninkielisen käännöksen käyttöoikeus on edelleen tarkistuksessa
