title=Läran och förbunden — Om denna utgåva | Common Root
description=Läran och förbunden: uppenbarelser och andra uttalanden nedtecknade av Joseph Smith, först utgivna 1835 i Kirtland, Ohio, och lästa av sistadagarsheliga som skrift vid sidan av Bibeln.
heroHeading=Läran och förbunden
readerHref=/reader?c1.src=dc

hero.1=Läran och förbunden samlar uppenbarelser, visioner och andra uttalanden som Joseph Smith d.y. sade sig ha tagit emot som direkta meddelanden från Gud, nedtecknade huvudsakligen under kyrkans allra första år i Ohio, Missouri och New York. En tidigare sammanställning, med titeln "A Book of Commandments for the Government of the Church of Christ", höll på att tryckas vid kyrkans tryckeri i Independence, Missouri, när en folkhop förstörde tryckeriet i juli 1833 och spred de ofullständiga arken innan boken kunde färdigställas; den gavs aldrig officiellt ut, även om ett litet antal av de räddade, oinbundna arken finns bevarade.
hero.2=En utökad och omdöpt utgåva, "Doctrine and Covenants of the Church of the Latter Day Saints", följde 1835, utgiven i Kirtland, Ohio, och sammanställd och godkänd av en kommitté på fyra: Joseph Smith, Oliver Cowdery, Sidney Rigdon och Frederick G. Williams. Den första utgåvan förenade två slags material under ett omslag — en serie teologiska föreläsningar som hållits vid Kirtland School, presenterade som dess "Lära", vid sidan av de nedtecknade uppenbarelserna själva, presenterade som dess "Förbund". Föreläsningarna, sedan dess kända som Lectures on Faith, togs senare bort ur boken — en ändring som oftast daterats till 1921 års utgåva — så att uppenbarelserna blev hela verket.
hero.3=Boken är indelad i numrerade avsnitt snarare än de böcker, kapitel och verser som en Bibel har, vilket återspeglar vad den är: en samlad mängd fristående texter snarare än en enda sammanhängande berättelse. Både innehåll och numrering ändrades genom 1800-talets utgåvor, bland annat en utgåva från 1876 under Orson Pratt som omorganiserade tidigare material och lade till ytterligare uppenbarelser. Den moderna utgåvan fick sin nuvarande form 1981, då två ytterligare stycken — en syn av härlighetsgraderna och en syn av de dödas återlösning — lades till som avsnitt 137 och 138, tillsammans med två "officiella förklaringar": ett manifest från 1890 som avslutade kyrkans stöd för nya flerfaldiga äktenskap, och en förklaring från 1978 som utsträckte prästvigning till alla värdiga manliga medlemmar oavsett hudfärg. En tryckning från 2013 uppdaterade ytterligare referensmaterial. Standardutgåvan som används i dag omfattar 138 avsnitt och de två officiella förklaringarna.
hero.4=Den räknas som en av de fyra volymer som sistadagarsheligas rörelse kallar sina standardverk, vid sidan av Bibeln, [[BOM|Mormons bok]] och [[PGP|Den dyrbara pärlan]]. Community of Christ, ett separat samfund som härstammar från samma rörelse, har sin egen Läran och förbunden, numrerad och uppdaterad oberoende av denna. Texten i detta korpus kommer från Mormon Documentation Projects JSON-export, samma fria källa som används för [[BOM|Mormons bok]] och [[PGP|Den dyrbara pärlan]], och återges här som en enda bok, "Läran och förbunden", där varje avsnitt motsvarar ett kapitel; den följer dagens standardutgåvas ordalydelse och utelämnar de upphovsrättsskyddade fotnoterna och kapitelrubrikerna, därför anges inget enskilt utgivningsår här.

