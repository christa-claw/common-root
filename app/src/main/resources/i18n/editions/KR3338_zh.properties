title=Kirkkoraamattu 1933/38 — 关于此版本 | Common Root
description=Kirkkoraamattu 1933/38：芬兰教会圣经，自希伯来文与希腊文重新翻译，分两半于1933年与1938年获得采纳；此前一个委员会已为之工作了约七十年。
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=这个名称是两个年份，因为这部书是分两半到来的。芬兰福音信义会于1933年接受旧约，于1938年接受新约，芬兰语自此称它为1933/38年的教会圣经。末尾的这两个年份掩去了开端有多久远：翻译委员会早在1861年即已设立。约七十年，以及不止一代译者，把受命与成书隔开。
hero.2=委员会所成就的是一部新译，而非修订。它据旧约的希伯来文与新约的希腊文工作——不经拉丁文、德文或瑞典文的中介，也不据当时已在使用的芬兰文圣经。然而它仍自觉是那部圣经的继承者，即作为教会经文达一个半世纪之久的 Biblia 1776，并保留了旧书大量的词汇与语调。正是这份承袭，使一部1938年完成的圣经在最初的读者听来便已古旧，也使它至今仍带着芬兰经文的庄重语体。它一直是官方教会圣经，直到1992年。
hero.3=在本阅读器中它担着两重职分。把界面设为芬兰语，打开的就是此版本——目录自身的排序本会给你 Biblia 1776，所以芬兰语的默认是有意的选取，而非字母顺序的偶然。它同时是芬兰谱系链的最高一级：在 KR3338 的某一节下展开一级，Biblia 1776 便出现在其下。这一级应读作同一教会圣经内部的承续，而非来源，因为1933/38年的译者眼前是希伯来文与希腊文，不是1776年的文本。Biblia 1776 之下，链条继续：1642年的 Biblia，为1776年的版本所修订；再往下是阿格里科拉1548年的芬兰文，为那个委员会所修订；以及路德1545年的德文，工作时摊开在他们身旁。唯有在这些之下，梯子才触及希伯来文与希腊文。

