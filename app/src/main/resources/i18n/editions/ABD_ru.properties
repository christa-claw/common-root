title=Сунан Абу Дауда — Об этом издании | Common Root
description=Сунан Абу Дауда: сборник хадисов, составленный Абу Даудом ас-Сиджистани за его значение для исламского права, отобранный из примерно 500 000 проверенных им сообщений и упорядоченный по правовым темам — третий из суннитских Шести книг.
heroHeading=Сунан Абу Дауда
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Абу Дауд Сулейман ибн аль-Ашъас аль-Азди ас-Сиджистани родился около 202 года хиджры (817–818 года н. э.) в Сиджистане, провинции Хорасана, которая сегодня лежит на границе Ирана и Афганистана. Он достиг Багдада в восемнадцать лет, а затем путешествовал по Хорасану, Ираку, Хиджазу, Сирии, Египту и Нишапуру в поисках хадисов, обучаясь у примерно 300 учёных, среди которых был Ахмад ибн Ханбаль. Он поселился в Басре, где умер в пятницу месяца шавваль 275 года хиджры (889 года н. э.) в возрасте семидесяти трёх лет и был похоронен рядом с правоведом Суфьяном ас-Саури.
hero.2=Его интерес был сугубо правовым: в отличие от Сахиха аль-Бухари и Сахиха Муслима, которые охватывают вероучение, историю и право в равной мере, Абу Дауд построил свой Сунан вокруг хадисов, относящихся к фикху, расположив его в книгах, которые проходят через темы, нужные правоведу — ритуальное очищение, молитву, закят, пост, брак, наследование, судейство и прочее. По свидетельству его ученика Ибн Дасы, при сборе материала он проверил около 500 000 сообщений хадисов. Он установил и иную, чем у аль-Бухари и Муслима, планку: там, где они допускали лишь хадисы, которые считали полностью достоверными, Абу Дауд включал некоторые мурсаль, слабые (да'иф) и даже мункар-сообщения, когда более сильного хадиса по данному правовому вопросу не находилось, объясняя свой метод в письме к жителям Мекки и сам же отмечая более слабые оценки, а не оставляя их без пометки.
hero.3=Суннитская традиция ставит Сунан Абу Дауда третьим среди Шести книг, после Сахиха аль-Бухари и Сахиха Муслима; то, на каком именно месте он, Джами ат-Тирмизи, Сунан ан-Насаи и Сунан Ибн Маджа стоят друг относительно друга среди оставшихся четырёх, долго обсуждалось, но не было решено. Приводимые для книги числа не согласуются друг с другом так, что никто, похоже, этого не объяснил: число Ибн Дасы для того, что отобрал Абу Дауд, — 4 800 хадисов, тогда как современное стандартное издание — подготовленное Мухаммадом Мухьи ад-Дином Абд аль-Хамидом и напечатанное в Каире в 1935 году — нумерует 5 274. Собственное число этого собрания, 43 книги и 5 274 хадиса, точно совпадает с нумерацией того каирского издания, что здесь ставит его на более твёрдую почву, чем Сахих аль-Бухари или Сахих Муслима, где число этого собрания не воспроизводит ни одной отдельной печатной традиции.
hero.4=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-abudawud сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для Сахиха аль-Бухари, Сахиха Муслима и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=классический арабский, с английским переводом под каждым хадисом в читалке
fact.2.label=Составитель
fact.2.value=Абу Дауд Сулейман ибн аль-Ашъас аль-Азди ас-Сиджистани (202–275 года хиджры / 817–889 года н. э.)
fact.3.label=Название
fact.3.value=известен просто как Сунан Абу Дауда; в отличие от [[BUK|Сахиха аль-Бухари]], для него не зафиксировано отдельного полного названия
fact.4.label=Составлен
fact.4.value=собран в путешествиях по Хорасану, Ираку, Хиджазу, Сирии, Египту и Нишапуру; Абу Дауд поселился и умер в Басре
fact.5.label=Метод
fact.5.value=упорядочен по правовой теме (фикх), а не по передатчику или хронологии; включает некоторые слабые, мурсаль и мункар-хадисы там, где более сильное сообщение не охватывает правовой вопрос, с явной пометкой об этом
fact.6.label=Положение
fact.6.value=третья из суннитских Шести книг (Кутуб ас-Ситта), после [[BUK|Сахиха аль-Бухари]] и [[MUS|Сахиха Муслима]]; её ранг среди оставшихся трёх книг является предметом споров, а не решённым вопросом
fact.7.label=Число хадисов
fact.7.value=4 800 отобранных, по данным ученика Абу Дауда Ибн Дасы, либо 5 274 в стандартном издании Мухаммада Мухьи ад-Дина Абд аль-Хамида, Каир, 1935 год; источники не согласуют эти два числа
fact.8.label=В этом собрании
fact.8.value=43 книги и 5 274 пронумерованных хадиса — точно совпадает с нумерацией каирского издания 1935 года
fact.9.label=Английский перевод
fact.9.value=взят из издания eng-abudawud сервиса fawazahmed0/hadith-api, показан как сопровождение под арабским текстом; от какого опубликованного перевода он происходит, со стороны этого собрания пока не установлено
fact.10.label=Лицензия
fact.10.value=арабский матн — классический текст, находящийся в общественном достоянии; лицензия английского перевода пока на проверке
