title=Luther Bibel 1545 — על מהדורה זו | Common Root
description=ה־Ausgabe letzter Hand של לותר: מקרא ויטנברג משנת 1545, המהדורה האחרונה שמרטין לותר הגיה בעצמו, והנוסח שנעשה אמת מידה לאחר מותו.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=לא המקרא הראשון של לותר אלא האחרון שלו. הברית החדשה שעשה בוורטבורג הופיעה ב־1522 והמקרא השלם ב־1534; הוא הוסיף להגיה עוד עשור, והמהדורה שהאנס לופט הדפיס בוויטנברג ב־1545 היא האחרונה שלותר הביא בעצמו לידי גמר. הגרמנית קוראת לה Ausgabe letzter Hand, מהדורת היד האחרונה. הוא מת בפברואר שלאחר מכן, והנוסח הזה נעשה אמת המידה שכנגדה נערכו מקראות לותר המאוחרים.
hero.2=הוא עבד מן המקורות ולא מן הלטינית: היוונית המודפסת של ארסמוס לברית החדשה, העברית המסורתית לישנה, ועמו חוג עמיתים בוויטנברג להתווכח על המקומות הקשים. מה שיצא מזה עשה לגרמנית בערך את מה שה־Biblia של 1642 תעשה לפינית מאה שנים לאחר מכן. שפה של ניבים רבים ופרוזה מעטה ומיוצבת קיבלה מִשלב אחד שהכול יכלו לקרוא, והלשון הכתובה המודרנית צמחה ממנו.
hero.3=שתי שרשראות נפגשות כאן. Luther Bibel 1912 עומדת ממש מעל מהדורה זו, בהיותה תיקון שלה. וכך גם Biblia 1642, שלושה שלבים מעלה בקו הפיני, משום שוועדת טורקו עבדה ולותר פתוח לפניה. מתחתיה מגיע הסולם לרצפה — Textus Receptus ליוונית, כתב יד לנינגרד לעברית — והשלבים האלה מלאים ואינם מסומנים ב־≈, משום שהיוונית של ארסמוס והעברית המסורתית הן מה שלותר תרגם ממנו באמת, ולא עדים שהוצבו בדיעבד.

