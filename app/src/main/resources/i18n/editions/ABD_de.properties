title=Sunan Abi Dawud — Über diese Ausgabe | Common Root
description=Sunan Abi Dawud: die Hadith-Sammlung, die Abu Dawud al-Sijistani wegen ihrer Bedeutung für das islamische Recht zusammenstellte, ausgewählt aus rund 500.000 von ihm geprüften Überlieferungen und nach Rechtsthema geordnet — das dritte der Sechs Bücher des sunnitischen Islam.
heroHeading=Sunan Abi Dawud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani wurde um das Jahr 202 n. H. (817–818 n. Chr.) in Sijistan geboren, einer Provinz Khorasans, die heute an der Grenze zwischen Iran und Afghanistan liegt. Er erreichte Bagdad mit achtzehn Jahren und reiste anschließend durch Khorasan, den Irak, den Hijaz, Syrien, Ägypten und Nishapur, um Hadithe zu sammeln, wobei er bei rund 300 Gelehrten studierte, darunter Ahmad ibn Hanbal. Er ließ sich in Basra nieder, wo er an einem Freitag im Monat Schawwal des Jahres 275 n. H. (889 n. Chr.) im Alter von dreiundsiebzig Jahren starb und neben dem Rechtsgelehrten Sufyan al-Thawri begraben wurde.
hero.2=Sein Interesse war spezifisch rechtlicher Natur: anders als Sahih al-Bukhari und Sahih Muslim, die Glauben, Geschichte und Recht gleichermaßen abdecken, baute Abu Dawud seine Sunan um Hadithe mit Bezug zum Fiqh auf und gliederte sie in Bücher, die durch die Themen führen, die ein Rechtsgelehrter braucht — rituelle Reinigung, Gebet, Zakat, Fasten, Ehe, Erbschaft, Richteramt und das Übrige. Laut seinem Schüler Ibn Dasah prüfte er bei der Zusammenstellung des Materials rund 500.000 Hadith-Überlieferungen. Er setzte außerdem einen anderen Maßstab als al-Bukhari und Muslim: während diese nur Hadithe zuließen, die sie als voll authentisch beurteilten, nahm Abu Dawud einige mursal-, schwache (da'if) und sogar munkar-Überlieferungen auf, wenn kein stärkerer Hadith einen bestimmten Rechtspunkt behandelte, erklärte seine Methode in einem Brief an die Bewohner Mekkas und vermerkte die schwächeren Einstufungen selbst, statt sie unmarkiert zu lassen.
hero.3=Die sunnitische Tradition zählt Sunan Abi Dawud als drittes der Sechs Bücher, nach Sahih al-Bukhari und Sahih Muslim; wo genau es, Jami` at-Tirmidhi, Sunan an-Nasa'i und Sunan Ibn Majah im Verhältnis zueinander unter den verbleibenden vier einzuordnen sind, wird seit langem diskutiert, ohne entschieden zu sein. Die für das Buch angegebenen Zahlen stimmen auf eine Weise nicht überein, die niemand aufgelöst zu haben scheint: Ibn Dasahs Zahl für das, was Abu Dawud auswählte, lautet 4.800 Hadithe, während die moderne Standardausgabe — herausgegeben von Muhammad Muhyiddin Abd al-Hamid und 1935 in Kairo gedruckt — 5.274 zählt. Die eigene Zahl dieses Korpus, 43 Bücher und 5.274 Hadithe, stimmt genau mit der Zählung jener Kairoer Ausgabe überein, was es hier auf festeren Boden stellt als Sahih al-Bukhari oder Sahih Muslim, wo die Zahl dieses Korpus keine einzelne Drucktradition wiedergibt.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-abudawud-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für Sahih al-Bukhari, Sahih Muslim und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=klassisches Arabisch, mit einer englischen Übersetzung unter jedem Hadith im Reader
fact.2.label=Zusammengestellt von
fact.2.value=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani (202–275 n. H. / 817–889 n. Chr.)
fact.3.label=Titel
fact.3.value=schlicht als Sunan Abi Dawud bekannt; anders als bei [[BUK|Sahih al-Bukhari]] ist kein eigenständiger vollständiger Titel überliefert
fact.4.label=Zusammengestellt
fact.4.value=gesammelt auf Reisen durch Khorasan, den Irak, den Hijaz, Syrien, Ägypten und Nishapur; Abu Dawud ließ sich in Basra nieder und starb dort
fact.5.label=Methode
fact.5.value=nach Rechtsthema (Fiqh) geordnet statt nach Überlieferer oder Chronologie; enthält einige schwache, mursal- und munkar-Hadithe, wenn kein stärkerer Bericht einen Rechtspunkt abdeckt, ausdrücklich als solche gekennzeichnet
fact.6.label=Stellung
fact.6.value=das dritte der sechs Bücher des sunnitischen Islam (Kutub as-Sitta), nach [[BUK|Sahih al-Bukhari]] und [[MUS|Sahih Muslim]]; sein Rang unter den verbleibenden drei Büchern ist umstritten und nicht entschieden
fact.7.label=Hadith-Anzahl
fact.7.value=4.800 ausgewählte nach Angabe von Abu Dawuds Schüler Ibn Dasah, oder 5.274 in Muhammad Muhyiddin Abd al-Hamids Standardausgabe, Kairo 1935; die Quellen bringen diese beiden Zahlen nicht in Einklang
fact.8.label=In diesem Korpus
fact.8.value=43 Bücher und 5.274 numerierte Hadithe — stimmt genau mit der Zählung der Kairoer Ausgabe von 1935 überein
fact.9.label=Englische Übersetzung
fact.9.value=entnommen der eng-abudawud-Ausgabe der fawazahmed0/hadith-api, als Begleittext unter dem Arabischen gezeigt; von welcher veröffentlichten Übersetzung sie abstammt, ist von Seiten dieses Korpus noch nicht geklärt
fact.10.label=Lizenz
fact.10.value=der arabische Matn ist der klassische, gemeinfreie Text; die Lizenz der englischen Übersetzung ist noch in Prüfung
