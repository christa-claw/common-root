title=Bible in Basic English — About This Edition | Common Root
description=The Bible in Basic English, translated from the Hebrew and the Greek by a committee under S. H. Hooke and published by Cambridge University Press — the New Testament in 1941, the whole Bible in 1949 — in C. K. Ogden's Basic English of 850 words, with 150 more added for poetry and for the Bible.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=Basic English was devised by C. K. Ogden of the Orthological Institute: a list of 850 English words, put forward as an international auxiliary language. The Bible in Basic English was made by a committee under the direction of S. H. Hooke (1874–1968), the Old Testament scholar who became Samuel Davidson Professor of Old Testament Studies in the University of London in 1930, working with the Orthological Institute. It was translated from the Hebrew and the Greek, not simplified from an earlier English version, and the Basic text was then gone over in detail by a committee formed by the Syndics of Cambridge University Press. To Ogden's 850 words the translators added 100 that help with poetry and 50 needed for the Bible, 150 in all. Cambridge University Press published the New Testament in 1941 and the whole Bible in 1949; a printing of 1965 was distributed in the United States without a copyright notice, which is why the text is in the public domain there.
hero.2=The result reads plainly and evenly, within that small vocabulary. Genesis opens “At the first God made the heaven and the earth.” Psalm 23 begins “The Lord takes care of me as his sheep; I will not be without any good thing.” John's Gospel opens “From the first he was the Word, and the Word was in relation with God and was God,” and John 3:16 reads “For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.” The divine name is “the Lord” throughout, except in eight verses where it is given as “Yahweh”, among them Exodus 6:3, where God says that Abraham, Isaac and Jacob “had no knowledge of my name Yahweh”, and Psalm 83:18. Where the Hebrew was too uncertain to translate, the translators put dots in its place, and in our copy a few verses, among them Job 34:29–33 and Job 36:16–20, stand as nothing but “...”.
hero.3=Our copy holds 66 books, Genesis to Revelation, without the Apocrypha, in the chapter and verse numbering of the King James and Revised Versions — 150 Psalms, and Malachi ending at chapter 4. It carries no psalm titles: Psalm 51 begins at “Have pity on me, O God”. The New Testament is not a Received-Text translation. Sixteen verses that the critical editions leave out, among them Matthew 17:21, Acts 8:37 and Romans 16:24, are kept here only as empty places marked [], and 1 John 5:7 has no three witnesses in heaven; the story of the woman taken in adultery, John 7:53–8:11, stands in square brackets, while the longer ending of Mark is kept. In this reader it stands on its own. The corpus records no parent for it, so a lineage rung opened beneath one of its verses goes straight to the original-language floor marked ≈: the Westminster Leningrad Codex in the Old Testament and the Textus Receptus in the New, a Greek text this translation does not follow at those sixteen places. Nothing is recorded as standing on it either. No interface language opens on this edition; an English interface opens on the New International Version, and this one is reached from its own card in the translation grid.

