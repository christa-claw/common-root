title=Biblia en Español Sencillo — Tietoja tästä laitoksesta | Common Root
description=Biblia en Español Sencillo: AudioBiblia.orgin vuodesta 2018 julkaisema selkeäkielinen espanjalainen Raamattu, joka on kirjoitettu yhtä lailla kuultavaksi kuin luettavaksi ja lisensoitu niin, että kuka tahansa saa kopioida sen.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Neljänsadan vuoden ajan espanjankielinen protestanttinen Raamattu on ollut käytännössä yksi kirja peräkkäisinä tarkistuksina: Casiodoro de Reinan käännös vuodelta 1569, sellaisena kuin Cipriano de Valera sen vuonna 1602 tarkisti, ja pitkä sarja Reina-Valera-laitoksia sen jälkeen. Biblia en Español Sencillo ei ole niitä. Se on uusi käännös, tehty nykyespanjaksi ja tarkoituksella selkeä, ja sen julkaisija on AudioBiblia.org — Uusi testamentti yhdessä Psalmien ja Sananlaskujen kanssa vuonna 2018, Vanha testamentti valmiina lokakuussa 2019. Käännös on merkitty Irma Floresin nimiin, ja julkaisijat kuvaavat sitä konservatiiviseksi ja evankeliseksi.
hero.2=Erottavaa on se, mistä se on lähtöisin. Se on ääniraamattutyön tulos, ja teksti sekä koko Raamatun kattava luku luvulta etenevä äänitys tehtiin yhdessä eikä niin, että toinen olisi luettu toisesta. Tavoite oli molemmille sama: helposti ymmärrettävä Raamattu, jota saa kopioida ja jakaa vapaasti ja laillisesti. Tuo jälkimmäinen puoli ei ole sivuseikka. Käännöksellä on Creative Commons Nimeä -lisenssi, joka mainitsee AudioBiblia.orgin ja Irma Floresin, eikä kustantajan pidättämiä oikeuksia — juuri siksi koko teksti voi olla tässä aineistossa ja se voidaan asettaa jae jakeelta minkä tahansa muun rinnalle.
hero.3=Tässä lukuohjelmassa se on yksi neljästä espanjankielisestä laitoksesta. Kun käyttöliittymä asetetaan espanjaksi, avautuu yhä Reina-Valera 1909; tämä on laitos, johon vaihdetaan. Se käyttäytyy toisin myös polveutumisaskelmissa. Koska se on tuore käännös eikä minkään tässä aineistossa olevan tekstin tarkistus, sille ei ole kirjattu kantatekstiä — niinpä Biblia en Español Sencillo -jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan eikä, kuten englanninkielisessä ketjussa, saman kirjan vanhempaan laitokseen. Aseta se sen sijaan toiseen palstaan Reina-Valera 1909:n rinnalle, ja katsomisen arvoista on näiden kahden tyylilajin välinen etäisyys.

