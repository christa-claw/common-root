title=Biblia en Español Sencillo — この版について | Common Root
description=Biblia en Español Sencillo:2018年からAudioBiblia.orgが刊行している、平易な現代スペイン語で書かれた聖書であり、読まれることと同じくらい聞かれることを意図して作られ、誰でも複製できるようライセンスされている。
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=四百年にわたり、スペイン語のプロテスタント聖書は実質的に一冊の書物が版を重ねてきたに過ぎなかった——カシオドロ・デ・レイナによる1569年の訳、それをシプリアーノ・デ・バレラが1602年に改訂したもの、そしてそれに続く長いレイナ・バレラ版の系列である。Biblia en Español Sencilloはこれらのいずれでもない。現代のスペイン語で、意図して平易に作られた新しい翻訳であり、AudioBiblia.orgによって刊行された——新約聖書は詩篇と箴言とともに2018年に、旧約聖書は2019年10月に完成した。この翻訳はイルマ・フローレスに帰せられており、発行元はこれを保守的で福音主義的な訳であると説明している。
hero.2=これを際立たせているのは、その出自である。これは音声聖書を手がける団体の仕事であり、本文と、章ごとの完全な朗読録音とは、一方が他方を読み上げたのではなく、ともに作られた。掲げられた目標は両者で同じであった——理解しやすい聖書であり、自由かつ合法的に複製し、共有できる聖書である。この第二の点は付け足しではない。この翻訳はクリエイティブ・コモンズ 表示 4.0のライセンスを帯びており、発行元が権利を留保するのではなく、AudioBiblia.orgとイルマ・フローレスの名を示すにとどめている——そのため本文全体がこのコーパスに収まり、そこに収められた他のどの聖書とも節ごとに並べて置くことができる。
hero.3=この読書環境では、これは四つのスペイン語訳のうちの一つである。インターフェースをスペイン語に設定しても、リーダーが開くのは依然としてレイナ・バレラ1909であり、これは切り替えて読む版である。系譜の段でもふるまいが異なる。これはこのコーパスが収める何かの改訂ではなく、まったく新しい翻訳であるため、母本は記録されていない——そのためBiblia en Español Sencilloの一節の下で段を開くと、英語の連鎖のように同じ書物の古い版へではなく、≈ 印で示された原語の底面へと直接至る。代わりにレイナ・バレラ1909と並べて第二列に置けば、この二つの文体の間にある距離こそが、見るに値するものとなる。

