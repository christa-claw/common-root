title=Smith & Van Dyck — Om denna utgåva | Common Root
description=Smith och Van Dycks arabiska bibel: påbörjad av Eli Smith i Beirut, fullbordad av Cornelius Van Dyck 1865 tillsammans med nahda-lärde som Butrus al-Bustani, Nasif al-Yaziji och Yusuf al-Asir, och alltjämt den mest lästa arabiska bibeln.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=Den amerikanska missionen i Beirut inledde denna översättning omkring 1847, och den som började den fick inte avsluta den. Eli Smith hade tillbringat två årtionden i Levanten och kunde språket väl nog för att tvista om det; han arbetade med texten ända till sin död 1857. Cornelius Van Alen Van Dyck tog över och förde den i hamn — Nya testamentet färdigt 1860, Gamla testamentet fem år senare, 1865. De två namnen på boken är två halvor av ett och samma arbete.
hero.2=Namnen som inte står på ryggen väger lika tungt. Van Dyck hade lärt sig sin arabiska av Butrus al-Bustani och Nasif al-Yaziji, och båda arbetade med översättningen tillsammans med honom, liksom shejken Yusuf al-Asir, som gick igenom arabiskan för idiom och stil. De tre var inte biträden i ett missionsföretag. De hörde till nahdans centralgestalter, den arabiska litterära väckelsens, och det som kom ut läses som arabisk prosa och inte som en översättning utklädd till arabiska. Därför överlevde boken den mission som bekostade den.
hero.3=Det var en bragd i tryckerikonst lika mycket som i lärdom. American Press i Beirut satte den i ett arabiskt snitt som skurits för missionen och blev färdigt 1843, den stil som ännu kallas al-Amerikani och som Smith varit med om att forma. Arabiska är svår att sätta väl — bokstäverna binds samman och byter form när de binds — och en bibel som såg riktig ut på sidan gjorde mer för sitt mottagande än argument kunde göra. Miljoner exemplar har sedan dess gått ut, till protestantiska och koptiska läsare lika, och för de flesta arabisktalande kristna är det helt enkelt så här Bibeln låter.
hero.4=Den här läsaren innehåller tre arabiska biblar: den här, samma översättning i den helt vokaliserade text som eBible.org publicerar ([[SVD-E|Smith & Van Dyck, eBible-text]]), och Biblicas moderna [[ONAV|Open New Arabic Version]]. Dess text löper från höger till vänster, liksom de hebreiska utgåvorna och de andra arabiska. I stegpinnarna är ingen förlaga noterad för den, så en stegpinne öppnad under en vers faller rakt ned på det med ≈ markerade grundspråksgolvet — vilket träffar närmare här än det brukar, eftersom grekiskan golvet bjuder är Textus Receptus, och det är ur Textus Receptus dess Nya testamente gjordes.

