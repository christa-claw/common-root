title=テクストビーベル1906年 — この版について | Common Root
description=カウチとヴァイツゼッカーのテクストビーベル（Textbibel）：ヘブライ語とギリシャ語から新たに訳された学者のためのドイツ語聖書で、1899年にテュービンゲンで初めて1巻にまとめて出版された。ここにあるテキストは1906年の日付をもつ。
heroHeading=テクストビーベル1906年
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=2人の教授、2つの聖書。カール・ヴァイツゼッカー（1822–1899）はテュービンゲンの教会史家で、1861年にフェルディナント・クリスティアン・バウアの講座を継ぎ、1889年からは大学の総長を務めた。彼の新約聖書の翻訳は1875年に初めて出版され、存命中に9版を重ね、最後の版は死の床で準備された。エミール・カウチ（1841–1910）は旧約学者で、ライプツィヒ、バーゼル、テュービンゲンで教えたのち、1888年にハレに落ち着いた。専門家の同僚たちと共に訳した彼の旧約聖書は、1894年に全巻がそろった。
hero.2=ヴァイツゼッカーが没した1899年、2つは1巻にまとめられ、Textbibel des Alten und Neuen Testaments としてテュービンゲンの J.C.B. Mohr（Paul Siebeck）から出版された。書名がその性格を語っている。ヘブライ語とギリシャ語が何を言っているのかを、自分たちの時代のドイツ語で知りたい読者のための、本文だけの聖書である。ルターに取って代わるつもりは初めからなかった。ヴァイツゼッカーは意図してルターの言葉づかいを避け、原文が最初の読者に与えた印象を伝えようとした。彼の伝記作者は、これが民衆の書物になることはまずないと考え、実際そうはならなかった。1910年代まで版を重ねた。ここにあるデジタルテキストは1906年の日付をもつが、その刷りが第何版にあたるかは、このプロジェクトでは確かめられていない。
hero.3=これはその時代の学問のように読める。旧約聖書の神名は「Jahwe」で——詩編23編では「Jahwe ist mein Hirte」——ルターが「der Herr」とする箇所に何千回も現れる。イザヤ書7:14は「ein junges Weib」、若い女である。新約聖書では、マタイによる福音書6:13の主の祈りは頌栄なしで終わり、ヨハネの手紙一5:7には天の証人がいない。旧約聖書はヘブライ語の章節区分を保っている。詩編の表題は節番号に数えられるので、詩編51編は21節あり、マラキ書は4章ではなく3章である。綴りは日付から想像されるより古い——ヨハネによる福音書8:1でイエスはオリーブ山へ「gieng」。
hero.4=このリーダーでは、エルバーフェルダー聖書およびルターの1545年と1912年のテキストと並ぶ、4つのドイツ語聖書の一つである。ドイツ語のインターフェースが開くのはこれではない。ドイツ語には選定された既定の版がないので、リーダーはカタログで最初のドイツ語聖書を取り、それがエルバーフェルダー聖書である。系譜の段にはこの版の母本が記録されていないが、それは原典から訳された翻訳にふさわしい。節の下で段を開くと直接、≈ の印が付いた原語の底面に至る。旧約ではウェストミンスター・レニングラード写本、新約ではテクストゥス・レセプトゥスであり、ヨハネの手紙一5:7が示すとおり、後者はこの翻訳が従っていないギリシャ語である。

