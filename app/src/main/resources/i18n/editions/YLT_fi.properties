title=Young's Literal Translation — Tietoja tästä laitoksesta | Common Root
description=Robert Youngin kirjaimellinen raamatunkäännös, ensimmäisen kerran julkaistu Edinburghissa 1862, Youngin itsensä tarkistama 1887 ja hänen kustantajiensa 1898 — englanninkielinen Raamattu, joka säilyttää heprean ja kreikan aikamuodot, sanajärjestyksen ja mahdollisuuksien mukaan sanaston silloinkin, kun englanti tuskin pysyy perässä.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) oli edinburghilainen kirjanpainaja ja kirjakauppias, joka opetteli itsekseen hepreaa ja useita muita itämaisia kieliä kirjapainon oppipoikavuosinaan, johti lähetyspainoa Suratissa Intiassa vuosina 1856–1861 ja jäi muistiin ennen kaikkea kahdesta kirjasta: Analytical Concordance to the Bible -konkordanssista ja tästä käännöksestä. Hän julkaisi Literal Translationin Edinburghissa 1862 ja tarkistetun laitoksen 1887. Kymmenen vuotta hänen kuolemansa jälkeen, tammikuussa 1898, hänen kustantajansa julkaisivat kolmannen laitoksen, joka oli tarkistettu jälleen ”nykyisillä linjoillaan”; se on tämän aineiston teksti. Young käänsi Vanhan testamentin vakiintuneesta masoreettisesta hepreasta ja Uuden testamentin kreikkalaisesta vastaanotetusta tekstistä, Textus Receptuksesta, ja sanoi suoraan, ettei yrittänyt laatia kummastakaan uutta tekstiä: kääntäminen on hänen mukaansa eri tehtävä kuin tekstikritiikki, ja harva on pätevä molempiin.
hero.2=Koko tavoite on näyttää englantilaiselle lukijalle alkutekstin kielioppi. Youngin mielestä käännös, joka antaa preesensin siinä, missä alkuteksti käyttää mennyttä aikamuotoa, tai ”an a for a the”, epämääräisen artikkelin määräisen tilalle, sivuuttaa sanainspiraation, ja hän käänsi sen mukaisesti. Heprean verbimuodot siirtyvät englannin aikamuodoiksi, joten kertomus etenee usein preesensissä: Genesis alkaa ”In the beginning of God's preparing the heavens and the earth —” ja jatkuu ”and God saith, ‘Let light be;’ and light is.” Merkityksen vuoksi lisätyt sanat ovat hakasulkeissa: ”Jehovah [is] my shepherd, I do not lack.” Hän pyrki antamaan jokaiselle heprean tai kreikan sanalle yhden englanninkielisen vastineen aina kun pystyi, ja siksi heprean olam ja kreikan aiōn ovat ”age” ja ”age-during” eivätkä ”ever” ja ”eternal”; Matteuksen 25:46:ssa vanhurskaat menevät ”to life age-during”. Jumalan nimi on koko Vanhassa testamentissa ”Jehovah”.
hero.3=Meidän kappaleemme on täydellinen: 66 kirjaa Genesiksestä Ilmestyskirjaan, ilman apokryfikirjoja, englantilaisen luku- ja jakeenumeroinnin mukaan — 150 psalmia, joiden otsikko on sulautettu ensimmäiseen jakeeseen, ja Malakia päättyy lukuun 4. Vastaanotetun tekstin käännöksenä se sisältää ne kohdat, jotka myöhemmät tekstikriittiset laitokset asettavat kyseenalaisiksi, Markuksen pidemmästä lopusta 1. Johanneksen kirjeen 5:7:n kolmeen todistajaan taivaassa, jotka tämä teksti panee hakasulkeisiin, kuten myös koko Apostolien tekojen 8:37:n. Tässä lukijassa se seisoo omillaan. Aineistoon ei ole kirjattu sille edeltäjää, joten jonkin sen jakeen alta avattu polveutumisaskelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan: Vanhassa testamentissa Leningradin koodeksiin ja Uudessa Textus Receptukseen. Tämä pohja on lähellä sitä, mistä Young itse käänsi, masoreettista hepreaa ja vastaanotettua kreikkaa, vaikkei samoina painoksina. Mitään ei myöskään ole kirjattu seisomaan sen päällä. Literal Standard Version vuodelta 2020, sekin tässä aineistossa, esittää itsensä perustavanlaatuisena tarkistuksena Youngin työstä, mutta aineisto ei kirjaa tätä yhteyttä, joten LSV:n alla olevat askelmat eivät johda tänne. Mikään käyttöliittymän kieli ei avaudu tähän laitokseen; englanninkielinen käyttöliittymä avautuu New International Versioniin, ja tähän päästään sen omasta kortista käännösruudukossa.

