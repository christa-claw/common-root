fact.5.label=Käännöstyyppi
fact.5.value=Tiukan kirjaimellinen: alkutekstin aikamuodot säilytetty silloinkin, kun englanti kuulostaa oudolta, joten kertomus etenee usein preesensissä; yksi englannin sana kutakin alkutekstin sanaa kohti mahdollisuuksien mukaan, jolloin olam ja aiōn ovat ”age” ja ”age-during”; merkityksen vuoksi lisätyt sanat hakasulkeissa; Jumalan nimi muodossa ”Jehovah”
fact.6.label=Julkaistu
fact.6.value=Edinburgh, 1862; Youngin tarkistama, 1887; kolmas laitos, hänen kustantajiensa jälleen tarkistama, Edinburgh, tammikuu 1898 — tässä oleva teksti
