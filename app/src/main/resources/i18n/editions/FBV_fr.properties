fact.3.label=Publiée par
fact.3.value=Free Bible Ministry, organisme sans but lucratif, qui édite aussi la [[VBL|Versión Biblia Libre]] espagnole conservée dans ce corpus
fact.4.label=Traduite d'après
fact.4.value=l'hébreu et le Nouveau Testament grec de Nestle–Aland — le texte critique dont se servent les sociétés bibliques
fact.5.label=Méthode
fact.5.value=traduite du texte original avec le seul secours des lexiques, puis comparée aux versions existantes à titre de contrôle — ni synthèse de celles-ci ni révision d'une Bible anglaise antérieure
fact.6.label=Style
fact.6.value=anglais moderne sans argot ni familiarité passagère, et sans chercher à rendre les positions d'une communauté de foi particulière
fact.7.label=Licence
fact.7.value=Creative Commons Attribution-Partage dans les mêmes conditions 4.0 — copier, imprimer et adapter librement, à condition de nommer la version, de signaler les modifications et de placer le dérivé sous la même licence
fact.8.label=Année au catalogue
fact.8.value=laissée en blanc plutôt que devinée — le projet révise le texte et le republie au fil de l'eau, si bien qu'aucun tirage n'est l'édition
fact.9.label=Sous un échelon
fact.9.value=≈ TR, témoin du grec plutôt que texte de base de cette traduction ; le corpus ne contient encore aucune édition critique grecque, de sorte que le même suppléant sert à [[NIV|la NIV]], [[NASB|la NASB]] et [[BSB|la BSB]]
fact.10.label=Dans ce corpus
fact.10.value=les 66 livres. L'anglais ouvre sur la [[NIV|New International Version]] sous licence, de sorte que celle-ci se tient auprès de [[BSB|la Berean Standard Bible]] et de [[WEB|la World English Bible]] comme l'anglais qu'un lecteur peut remporter avec lui
