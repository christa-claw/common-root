title=Free Bible Version — À propos de cette édition | Common Root
description=Free Bible Version : une Bible anglaise moderne traduite de l'hébreu et du grec de Nestle–Aland par Jonathan Gallagher, publiée sous une licence de partage à l'identique afin que chacun puisse la réimprimer.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Cette traduction doit son existence à une page de copyright. Presque toutes les Bibles anglaises modernes en portent une, et ce qu'elle dit d'ordinaire, c'est que quelques centaines de versets peuvent être cités sans rien demander, qu'un livre entier exige une autorisation écrite et que publier le texte en entier revient à verser des redevances. Pour le site d'une paroisse ou pour un enregistrement, l'affaire peut s'arrêter là. La Free Bible Version a été faite pour être la version devant laquelle il n'y a rien.
hero.2=Elle est l'œuvre de Jonathan Gallagher, docteur en théologie de St Andrews, et elle est publiée par Free Bible Ministry, organisme sans but lucratif. Le Nouveau Testament vient du grec de Nestle–Aland — le texte critique dont se servent les sociétés bibliques — et l'Ancien de l'hébreu. La méthode que le projet décrit mérite d'être dite, car ce n'est pas la méthode courante : on traduit du texte original avec les seuls lexiques, et l'on ne compare qu'ensuite avec les versions existantes, comme contrôle contre les doublons et les fautes, non comme source. Ce n'est ni la révision d'une Bible anglaise plus ancienne ni la synthèse de plus récentes. Son but affiché est un anglais contemporain qui évite l'argot et les tournures à la mode, et elle se refuse à traduire dans le sens des positions d'une communauté de foi particulière.
hero.3=La licence est le fond de l'affaire. C'est Creative Commons Attribution-Partage dans les mêmes conditions 4.0 : copiez-la, imprimez-la, mettez-la sur un site, adaptez-la, pourvu que la version soit nommée, que les modifications soient signalées et que ce qui en est tiré paraisse aux mêmes conditions. C'est un autre marché que le domaine public — la liberté se transmet au lieu d'être abandonnée — et c'est la licence de la Versión Biblia Libre espagnole de ce corpus, issue du même ministère.
hero.4=Deux conséquences pour le lecteur. Le catalogue laisse son année en blanc, parce que le projet publie ses révisions à mesure qu'il les fait ; il n'existe aucun tirage daté auquel ce corpus serait arrimé, et en inventer un serait pire que le blanc. Et un échelon ouvert sous un verset de la Free Bible Version affiche ≈ TR, le Textus Receptus, marqué comme témoin et non comme texte de base. Ce n'est pas de là que cette traduction a été faite. C'est ce que le corpus peut aujourd'hui offrir comme grec — aucune édition critique n'y figure encore — et le même suppléant apparaît, pour la même raison, sous la New International Version, la New American Standard Bible et la Berean Standard Bible.

