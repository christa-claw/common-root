title=Латинская Вульгата — Об этом издании | Common Root
description=Латинская Вульгата: перевод Иеронима, заказанный в 382 году и законченный около 405-го, который нёс Библию через Западную Европу тысячу лет и стал первой книгой, напечатанной Гутенбергом.
heroHeading=Латинская Вульгата
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=К концу четвёртого века латинские евангелия, ходившие на Западе, расходились друг с другом от списка к списку, и папа Дамасий I поручил своему секретарю Иерониму привести их в порядок. Иероним начал с правки. В итоге он отдал этому более двадцати лет, большую часть их в Вифлееме, и создал то, о чём никто не просил.
hero.2=Решающим шагом стал перевод Ветхого Завета с еврейского, а не с греческой Септуагинты, которой Церковь пользовалась всегда. Иероним называл этот принцип “hebraica veritas” — еврейская истина — и он вызвал спор: Августин писал ему, опасаясь, что общины возмутятся, когда привычные чтения переменятся у них под ногами. Иероним сделал это всё равно. Оттого-то латинская Библия и стоит ближе к еврейскому тексту, чем греческая Библия, которую читали первые христиане.
hero.3=Она была Библией Западной Европы целое тысячелетие — срок больший, чем у любого перевода до или после. С неё Уиклиф переводил на английский, с ней работали и переводчики Дуэ-Реймсской Библии, так что Дуэ-Реймсская Библия в этом собрании — её прямой потомок, и ступени того издания ведут сюда. Она же стала первой большой книгой, напечатанной подвижными литерами: Библия, набранная Гутенбергом в Майнце около 1455 года, была этим текстом.

