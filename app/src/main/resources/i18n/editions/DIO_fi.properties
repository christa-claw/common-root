title=Diodati 1649 (italia) — Tietoja tästä laitoksesta | Common Root
description=Giovanni Diodatin italiankielinen Raamattu: painettu Genevessä 1607, ensimmäinen hepreasta ja kreikasta eikä Vulgatasta tehty, tarkistettu omin selityksin 1641 — ja miksi tiedoston vuosiluku on hänen kuolinvuotensa.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati syntyi Genevessä 1576 luccalaiseen kauppiassukuun, joka oli lähtenyt Italiasta ennemmin kuin luopunut uskostaan. Hän oli syntyperältään italialainen ja koulutukseltaan genevalainen, ja juuri tuo yhdistelmä on koko syy tämän kirjan olemassaoloon: hänellä oli sen maan kieli, jota uskonpuhdistus ei ollut tavoittanut, ja hän seisoi siinä kaupungissa, josta oli tullut uskonpuhdistuksen kirjapaino. Theodorus Beza esitti häntä heprean oppituoliin kahdenkymmenenyhden vuoden iässä. Vuonna 1606 hänestä tuli teologian professori, 1608 pastori, ja seuraavana vuonna hän seurasi Bezaa teologian oppituolissa; vuonna 1618 hän meni Dordrechtin synodiin Genevan edustajana ja oli yksi kuudesta miehestä, jotka määrättiin laatimaan sen pöytäkirjat.
hero.2=Hänen italiankielinen Raamattunsa painettiin Genevessä 1607. Italiassa oli ollut kansankielisiä Raamattuja ennenkin — Malermin 1471, Bruciolin 1532 — mutta ne tekivät työnsä latinasta tai nojasivat siihen raskaasti. Diodati meni hepreaan ja kreikkaan, ja Uuden testamentin osalta se tarkoitti sitä kreikkalaista tekstiä, jonka Beza oli toimittanut samassa kaupungissa sukupolvea aiemmin. Vuonna 1641 hän julkaisi tarkistetun laitoksen omine selittävine muistiinpanoineen, ja juuri siitä myöhemmät painokset polveutuvat. Siitä tuli — ja on yhä — italialainen protestanttinen Raamattu, mikä maassa, jossa protestanttista lukijakuntaa ei juuri ole, merkitsi että sitä kantoi neljän vuosisadan ajan hyvin pieni joukko ihmisiä. Hän käänsi Raamatun myös ranskaksi, 1644; sitä pidetään yleisesti heikompana, eikä hän luultavasti olisi väittänyt vastaan.
hero.3=Kortin vuosiluvusta kannattaa sanoa lause, koska sitä ei ole. Tämä teksti kiertää digitaalisesti nimellä ”Diodati 1649”, eikä 1649 ole mikään laitos — se on Diodatin kuolinvuosi. Ne kaksi vuosilukua, jotka merkitsevät jotakin, ovat 1607, jolloin käännös ensi kerran ilmestyi, ja 1641, jolloin hän tarkisti sen. Kumpaa niistä jokin tietty digitaalinen tiedosto todella edustaa, ei ole tässä hankkeessa selvitetty, joten luettelo jättää vuosisarakkeen tyhjäksi ennemmin kuin painaa numeron, jonka takana se ei voi seistä. Nimi on pidetty sellaisena kuin se saapui, koska sillä nimellä sitä haetaan.
hero.4=Tässä lukuohjelmassa se on ainoa italiankielinen Raamattu, joten käyttöliittymän asettaminen italiaksi avaa sen — ei valittuna poimintana, niin kuin Reina-Valera 1909 on poimittu espanjalle, vaan siksi ettei luettelon haku löydä kielestä mitään muuta. Polveutumisaskelmiin sille ei ole kirjattu kantatekstiä, joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan. Tuo pohja tarjoaa kreikaksi Textus Receptuksen, ja tässä se on epätavallisen lähellä totuutta: useimpien tämän aineiston laitosten kohdalla Receptus seisoo sijaisena sille kriittiselle tekstille, jota kääntäjät todella käyttivät, mutta Diodati todella työskenteli tuon perheen painetusta kreikkalaisesta tekstistä. Askelmamerkintä ei kanna vuosilukua, mikä vastaa kortin tyhjää kohtaa.

