title=King James Version — इस संस्करण के बारे में | Common Root
description=1611 का King James Version: छह मंडलियों में सैंतालीस अनुवादक, जिन्हें नए सिरे से आरंभ करने के बजाय Bishops' Bible का संशोधन करने को कहा गया — और इस संग्रह में वह अस्सी-पुस्तक पाठ जो आज भी पहली छपाई के अपोक्रिफ़ा को धारण किए है।
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=इसका आरंभ किसी और विषय पर बुलाई गई सभा में दी गई एक रियायत के रूप में हुआ। 1604 के हैम्पटन कोर्ट सम्मेलन में, जिसे जेम्स प्रथम ने प्रार्थना-पुस्तक संबंधी प्यूरिटन शिकायतें सुनने के लिए बुलाया था, एक नए अनुवाद का प्रस्ताव उठा और राजा ने उसे अपना लिया। सैंतालीस विद्वान नियुक्त हुए और छह मंडलियों में बाँटे गए — दो वेस्टमिंस्टर में, दो ऑक्सफ़ोर्ड में, दो कैम्ब्रिज में — प्रत्येक के पास बाइबिल का अपना भाग और काम करने के लिए नियमों की एक सूची थी। उन नियमों में पहला ही पढ़ने की दृष्टि से सर्वाधिक महत्त्वपूर्ण है: उन्हें 1568 की Bishops' Bible का अनुसरण करना था और उसे केवल उतना ही बदलना था जितना मूल पाठ अपेक्षित करे। यह काम नए अनुवाद के रूप में नहीं, संशोधन के रूप में सौंपा गया था, और पढ़ने में वैसा ही लगता है। राजा के मुद्रक रॉबर्ट बार्कर ने पूर्ण पुस्तक 1611 में लंदन से प्रकाशित की।
hero.2=नियमों ने जो नहीं कहा और अनुवादकों ने फिर भी किया, वह था बार-बार Bishops' Bible के पीछे तक पहुँचना। जो अंग्रेज़ी उन्हें विरासत में मिली थी वह औरों की बनाई थी — सबसे बढ़कर टिंडेल की, और जिनेवा बाइबिल की, जो अंग्रेज़ पाठकों की एक पूरी पीढ़ी के पास सचमुच थी और जिसे वे घर पर पढ़ते थे। यह संग्रह उस ऋण को भूमिका के भरोसे छोड़ने के बजाय दर्ज करता है: यहाँ King James Version का अभिलिखित मूल [[GNV|जिनेवा बाइबिल]] है, और उसके नीचे प्रचलित यूनानी पाठ तथा मासोरा इब्रानी। King James के किसी पद के नीचे वंश-पायदान खोलिए, और ऊपर जो आता है वह जिनेवा है। दोनों पद-दर-पद इतने निकट हैं कि दिलचस्प प्रश्न यह रह ही नहीं जाता कि जिनेवा का उपयोग हुआ या नहीं, बल्कि यह बन जाता है कि 1611 की मंडलियों ने उससे हटने का निर्णय कहाँ लिया — और अब इसे मान लेने के बजाय देखा जा सकता है।
hero.3=इस King James और अधिकांश अन्य के बीच एक अंतर इस बात का है कि इसमें है क्या। यहाँ पाठ अस्सी पुस्तकों और 36,820 पदों तक फैला है: पुराना और नया नियम, और उनके बीच छपी अपोक्रिफ़ा की चौदह पुस्तकें, ठीक जैसे 1611 के खंड ने उन्हें छापा था। आज बिकने वाली लगभग हर King James बाइबिल में छियासठ हैं। संग्रह लंबे स्वरूप को बनाए रखता है, और इसका प्रभाव उस शृंखला के साथ दिखता है जिसे वंशावली दर्ज करती है: यहाँ [[GNV|जिनेवा बाइबिल]] में छियासठ पुस्तकें हैं, इसमें अस्सी, इसके ऊपर [[RV|संशोधित संस्करण]] में अस्सी, और उसके ऊपर [[ASV|American Standard Version]] में फिर छियासठ। कोई संस्करण अपोक्रिफ़ा छापे या नहीं, यह निर्णय हर एक ने अलग-अलग लिया, और उन्हें एक ही स्तंभ में रखने से यह प्रतिरूप पढ़ने योग्य हो जाता है।
hero.4=कार्ड पर दिए वर्ष का अर्थ क्या है, इस बारे में सटीक रहिए। उस पर 1611 लिखा है, और वह अनुवाद की तिथि है — यह दावा नहीं कि यह पाठ कौन-सी छपाई है। यहाँ की अंग्रेज़ी की वर्तनी आधुनिक की हुई है: उत्पत्ति आरंभ होती है «In the beginning God created the heaven and the earth», जबकि 1611 के फ़र्मों में पढ़ा जाता था «In the beginning God created the Heauen, and the Earth»। सो यह वह King James है जैसा बाद के मुद्रकों ने उसे मानकीकृत किया, और वह विशिष्ट छपाई जिससे यह उतरा है, अभिलिखित नहीं है — वही ईमानदार रिक्ति जो संग्रह [[FB1776|Biblia 1776]] के लिए छोड़ता है। अनुवादकों के निर्णय पढ़ने के लिए इससे कोई अंतर नहीं पड़ता; 1611 की पुस्तक को एक वस्तु के रूप में उद्धृत करने के लिए सारा अंतर इसी से पड़ता है। यह भी ध्यान रहे कि अंग्रेज़ी अंतरफलक इस संस्करण पर नहीं खुलता: वह [[NIV|New International Version]] है, और King James वह है जिस पर आप स्वयं जाते हैं।

