fact.1.value=अंग्रेज़ी
fact.2.label=किसके आदेश से
fact.2.value=1604 के हैम्पटन कोर्ट सम्मेलन में, जेम्स प्रथम द्वारा, एक प्यूरिटन प्रस्ताव से जिसे उन्होंने अपनाया
fact.3.label=किसने तैयार किया
fact.3.value=छह मंडलियों में सैंतालीस अनुवादक — दो वेस्टमिंस्टर में, दो ऑक्सफ़ोर्ड में, दो कैम्ब्रिज में
fact.4.label=जिसका संशोधन करने को कहा गया
fact.4.value=1568 की Bishops' Bible, जिसे केवल वहीं बदला जाए जहाँ मूल भाषाएँ अपेक्षित करें — अनुवादकों को दिए नियमों में पहला
fact.5.label=पहली छपाई
fact.5.value=1611, लंदन में, राजा के मुद्रक रॉबर्ट बार्कर द्वारा
fact.6.label=अभिलिखित मूल
fact.6.value=[[GNV|1599 की जिनेवा बाइबिल]], और मूल-भाषाओं के तल पर [[TR|टेक्स्टस रिसेप्टस]] तथा [[WLC|वेस्टमिंस्टर लेनिनग्राद संहिता]], ≈ से चिह्नित, क्योंकि वे उन पाठों के साक्षी हैं, अनुवादकों की अपनी प्रतियाँ नहीं
fact.7.label=यहाँ पुस्तकें
fact.7.value=अस्सी पुस्तकें और 36,820 पद — अपोक्रिफ़ा सहित, जैसा 1611 की छपाई में था, जबकि आज अधिकांश King James बाइबिलें छियासठ छापती हैं
fact.8.label=कार्ड पर वर्ष
fact.8.value=1611, अनुवाद की तिथि, इस पाठ की छपाई की नहीं; यहाँ की वर्तनी आधुनिक है, और यह किस छपाई से उतरा है, अभिलिखित नहीं
fact.9.label=इस संग्रह में
fact.9.value=[[WLC|मासोरा इब्रानी]] और [[TR|यूनानी]] तक उतरती अंग्रेज़ी शृंखला में [[GNV|जिनेवा]] और [[RV|संशोधित संस्करण]] के बीच का पायदान; अंग्रेज़ी का पूर्वनिर्धारित संस्करण नहीं, जो [[NIV|New International Version]] है
