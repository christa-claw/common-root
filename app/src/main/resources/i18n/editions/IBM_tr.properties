fact.2.label=Derleyen
fact.2.value=Ebu Abdullah Muhammed bin Yezid İbn Mâce el-Kazvinî (hicrî 209–273 / miladi 824–887)
fact.3.label=Adı
fact.3.value=Sünen-i İbn Mâce olarak bilinir
fact.4.label=Derlendiği yer
fact.4.value=Irak, Hicaz, Suriye ve Mısır üzerinden yapılan seyahatlerde toplandı; İbn Mâce Kazvin'e yerleşti ve hicri 273 (miladi 887) yılında orada vefat etti
fact.5.label=Yöntem
fact.5.value=[[ABD|Sünen-i Ebu Davud]] ve [[TIR|Câmiu't-Tirmizî]] gibi hukuki konuya göre düzenlenmiştir; ez-Zehebî'nin sayımına göre yaklaşık 1.500 bölümden oluşur
fact.6.label=Konum
fact.6.value=Sünni İslam'ın Altı Kitabı'nın (Kütüb-i Sitte) sonuncusu sayılır, [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]] ve [[NAS|Sünen-i Nesâî]]'den sonra — bazılarının bunun yerine [[MAL|Muvatta-i Mâlik]]'e veya ed-Dârakutnî'nin Sünen'ine verdiği tartışmalı bir altıncı yer
fact.7.label=Hadis sayısı
fact.7.value=ez-Zehebî'nin sayımına göre yaklaşık 4.000, bunlardan yaklaşık otuzu genellikle uydurma kabul edilir; bu derlemenin kaynak baskısı 4.343 olarak numaralandırır
fact.8.label=Bu derlemede
fact.8.value=38 kitap ve 4.343 numaralı hadis
fact.9.label=İngilizce çeviri
fact.9.value=fawazahmed0/hadith-api'nin eng-ibnmajah baskısından alınmıştır, Arapça metnin altında eşlik eden çeviri olarak gösterilir; hangi yayınlanmış çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir
fact.10.label=Lisans
fact.10.value=Arapça metin (matn), kamu malı olan klasik metindir; İngilizce çevirinin lisansı hâlâ inceleme aşamasındadır
