title=Sünen-i İbn Mâce — Bu Baskı Hakkında | Common Root
description=Sünen-i İbn Mâce: Sünni İslam'ın Altı Kitabı'nın sonuncusu, hukuki konuya göre düzenlenmiş, aralarındaki yeri de içerdiği zayıf ve uydurma hadisler yüzünden uzun süredir tartışmalı olan derleme.
heroHeading=Sünen-i İbn Mâce
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Ebu Abdullah Muhammed bin Yezid İbn Mâce er-Rabiî el-Kazvinî, hicri 209 (miladi 824) yılında, bugün İran'ın kuzeybatısında bulunan Kazvin'de, Rabîa kabilesinin mevâlîsinden (Arap olmayan müşterilerinden) bir ailede doğdu — Mâce, bir rivayete göre babasının lakabıydı, bir dedenin veya annenin adı değildi. Irak, Hicaz, Suriye ve Mısır üzerinden hadis aramak için seyahat etti ve geniş bir âlimler çevresinden ders aldı; gelecekteki Sünen'inin dörtte birinden fazlasının tek bir öğretmene, İbn Ebî Şeybe'ye, dayandığı söylenir. Ebu Ya'lâ el-Halîlî gibi çağdaşları onu güvenilir, önde gelen ve üzerinde fikir birliği olan bir otorite olarak andı. Hicri 273 (miladi 887) yılında Kazvin'de öldü; el-Kettânî ise hicri 275 (miladi 889) yılını da kaydeder. Geleneksel anlatıma göre, İbn Mâce tamamlanmış Sünen'ini kendisine okuduktan sonra Ebu Zür'a er-Râzî, insanlar bu kitaba sahip olsaydı diğer Sünen derlemelerinin büyük ölçüde gereksiz hâle geleceğini söyledi.
hero.2=Sünen'i, ez-Zehebî'nin sayımına göre, yaklaşık 1.500 bölüm ve yaklaşık 4.000 hadisten oluşur; [[ABD|Ebu Davud]] ve [[TIR|et-Tirmizî]]'nin derlemeleri gibi hukuki konuya göre düzenlenmiştir. Sağlam ve kabul edilebilir malzemenin yanında, sonraki âlimlerin zayıf saydığı, bunlardan yaklaşık otuzunun genellikle doğrudan uydurma kabul edildiği hadisler de içerir — bazı âlimlerin Altı yerine sadece "Beş"i saymasının nedeni budur.
hero.3=Sünni gelenek Sünen-i İbn Mâce'yi [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]] ve [[NAS|Sünen-i Nesâî]] ile birlikte Altı Kitap'ın (Kütüb-i Sitte) sonuncusu olarak sayar. Bu altıncı yer de tartışmalıdır: Malikîler ve İbn el-Esîr başkalarıyla birlikte onun yerine [[MAL|Muvatta-i Mâlik]]'i anar, bazıları ise ed-Dârakutnî'nin Sünen'ini anar; İbn Mâce'nin kitabının bu yeri genellikle, en güvenilir aday olarak görüldüğünden değil, içeriğinin diğer beşiyle en az örtüşmesinden dolayı kazandığı söylenir.
hero.4=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-ibnmajah baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]], [[NAS|Sünen-i Nesâî]] ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

