title=New American Standard Bible 2020 — Bu Baskı Hakkında | Common Root
description=New American Standard Bible: Lockman Vakfı'nın, American Standard Version'ın kelimesi kelimesine harfî sadakatini sürdüren kendi devamı; İbranice, Aramice ve Yunancadan yeniden çevrildi ve şimdi 2020 metnindedir.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=New American Standard Bible, tamamen yeni bir proje değil, bilinçli bir devam niteliğiyle başladı. Kaliforniya'nın La Habra kentinde bulunan kâr amacı gütmeyen Lockman Vakfı, 1901 tarihli American Standard Version'ı ileriye taşımak için 1959'da bu çalışmayı başlattı — İbranice, Aramice ve Yunancaya harfî, kelimesi kelimesine sadakat konusundaki itibarını korurken, eskimiş İngilizcesini güncelleyerek. Vakıf, büyük ölçüde muhafazakâr evanjelik mezheplerden, Hıristiyan kolej ve ilahiyat okullarından bilim insanlarından oluşan bir komite kurdu ve çeviri aşamalı olarak yayımlandı: Yuhanna İncili 1960'ta, diğer İnciller 1962'de, Yeni Antlaşma'nın tümü 1963'te, Mezmurlar ayrıca 1968'de ve Kitabın tümü 1971'de. Bu ilk tam baskı, Eski Antlaşma için Rudolf Kittel'in Biblia Hebraica'sının üçüncü baskısına, Lut Gölü Tomarları da gözden geçirilerek, ve Yeni Antlaşma için Nestle ile Aland'ın Novum Testamentum Graece'sinin 23. baskısına dayandı.
hero.2=O ilk baskıdan sonra onlarca yıl boyunca gözden geçirme çalışması sürdü. 1972, 1973 ve 1975'te küçük ifade değişiklikleri yapıldı, ardından 1977'de daha kapsamlı bir gözden geçirme ve 1992'de sınırlı bir gözden geçirme daha geldi. 1995'te Vakıf, Updated Edition'ı — yani çoğu kişinin sadece "NASB" dediğinde kastettiği metin olan NASB95'i — Biblia Hebraica Stuttgartensia'ya ve Nestle-Aland'ın 26. baskısına başvurarak yayımladı. Mevcut metin, bazı bölümleri 2018'de internette görünmeye başlamış olan 2020 güncellemesidir: Eski Antlaşma'nın metin temelini Biblia Hebraica Stuttgartensia'ya ve kapsadığı kitaplar için ondan daha yeni olan Biblia Hebraica Quinta'ya taşıdı; bir okumayı etkiledikleri yerlerde Septuaginta, Lut Gölü Tomarları, Targumlar ve diğer eski çevirilere başvurdu; Yeni Antlaşma ise şimdi Nestle-Aland'ın 28. baskısını izliyor, Editio Critica Maior'un daha zengin Yunanca el yazması kanıtlarıyla desteklenmiş olarak. Çevirmenlerin beyan ettiği yöntem her gözden geçirmede aynı kaldı: İngilizcenin izin verdiği ölçüde orijinali harfî olarak aktarmak, ve sıkı sıkıya harfî bir çevirinin yanıltıcı olacağı veya doğal okunmayacağı yerlerde daha açık ifadeyi seçip daha harfî karşılığı dipnotta kaydetmek — bu disiplin, bunun yirminci ve yirmi birinci yüzyılların yaygın kullanılan İngilizce çevirileri arasında en harfî olanlardan biri sayılmasının nedeni olarak düzenli biçimde gösterilir.
hero.3=Adına ve American Standard Version'a beyan ettiği borcuna karşın, New American Standard Bible onun satır satır bir gözden geçirmesi değil, özgün dillerden yapılmış yeni bir çeviridir, ve derlemede ona uygun biçimde bir ebeveyn kaydı yoktur: Bir NASB ayetinin altındaki bir soy basamağını açmak, tam olarak New International Version'da olduğu gibi, doğrudan ≈ işaretli özgün-dil tabanına iner. İkisinin paylaştığı bu biçimden daha fazlasıdır — her ikisi de özgürce kopyalanabilir değil, lisanslıdır, aynı rafta bulunan özgürce kopyalanabilir İngilizce baskılardan ayrı dururlar, gerçi İngilizce arayüz varsayılan olarak New International Version'da açılır, New American Standard Bible'a ise çeviri ızgarasındaki kendi kartından ulaşılır.

fact.1.label=Dil
fact.1.value=İngilizce
fact.2.label=Ismarlanışı
fact.2.value=Kaliforniya'nın La Habra kentindeki Lockman Vakfı, projeyi 1959'da American Standard Version'ın harfî çeviri geleneğinin devamı olarak başlattı
fact.3.label=Hazırlayanlar
fact.3.value=Vakıf tarafından desteklenen bir çeviri komitesi, büyük ölçüde muhafazakâr evanjelik mezheplerden, Hıristiyan kolej ve ilahiyat okullarından bilim insanlarını topladı
fact.4.label=Eski Antlaşma kaynağı
fact.4.value=1971 özgün baskısı için Rudolf Kittel'in Biblia Hebraica'sı (3. baskı) ve Lut Gölü Tomarları; 1995 gözden geçirmesinden Biblia Hebraica Stuttgartensia; 2020 metni, bulunabildiği yerde ondan daha yeni olan Biblia Hebraica Quinta ile birlikte Biblia Hebraica Stuttgartensia'yı esas alır, Septuaginta, Lut Gölü Tomarları, Targumlar ve diğer eski çevirilere de başvurularak
fact.5.label=Yeni Antlaşma kaynağı
fact.5.value=1971 özgün baskısı için Nestle ile Aland'ın Novum Testamentum Graece'sinin 23. baskısı; 1995 gözden geçirmesinden 26. baskı; 2020 metni için Editio Critica Maior'un Yunanca el yazması kanıtlarıyla desteklenmiş 28. baskı (NA28)
fact.6.label=Çeviri türü
fact.6.value=Biçimsel eşdeğerlik — okunabilir İngilizcenin izin verdiği ölçüde özgün dillerden harfî olarak çevrildi, daha açık bir ifadenin seçildiği yerlerde daha harfî karşılık dipnotta kaydedildi; American Standard Version'ın yaklaşımındaki köklerine karşın, önceki bir İngilizce Kutsal Kitabın gözden geçirmesi değil, İbranice, Aramice ve Yunancadan yeni bir çeviri
fact.7.label=Yayımlanışı
fact.7.value=Yuhanna İncili 1960'ta, İnciller 1962'de, Yeni Antlaşma 1963'te, Mezmurlar 1968'de, Kitabın tümü 1971'de, 1972, 1973 ve 1975'te küçük metin değişiklikleri, 1977'de büyük bir gözden geçirme, 1992'de sınırlı bir gözden geçirme, 1995'te Updated Edition (NASB95), ve 2018'den itibaren bölümleri internette yayımlanan mevcut 2020 metni
fact.8.label=Lisans
fact.8.value=Lisanslı, özgürce kopyalanamaz. Kutsal Kitabın tam bir kitabını oluşturmaması ve alıntılayan eserin yarısından fazlasını geçmemesi koşuluyla, 1960, 1971, 1977, 1995 ve 2020 yıllarını belirten bir telif hakkı bildirimiyle birlikte, yazılı izin olmadan herhangi bir biçimde 1.000'e kadar ayet alıntılanabilir; bunun ötesi Lockman Vakfı'nın iznini gerektirir
fact.9.label=Bu derlemede
fact.9.value=[[NIV|New International Version]] gibi özgürce kopyalanamaz, lisanslı — İngilizce arayüz varsayılan olarak o baskıda açılır, buna ise kendi kartından ulaşılır. Soy basamaklarında ona kayıtlı bir ebeveyn yoktur: Vakıf projeyi [[ASV|American Standard Version]]'ın harfîliğinin devamı olarak tanımlasa da, bu, İbranice, Aramice ve Yunancadan yeniden çevrilmiştir, onun veya burada tutulan başka bir İngilizce metnin gözden geçirmesi değildir, böylece bir NASB ayetinin altındaki basamak doğrudan ≈ işaretli özgün-dil tabanına iner
