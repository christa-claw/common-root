# The narrative, one paragraph per key, in order.
hero.1=זהו אותו תרגום כמו [[SVD|סמית' וּוָן דייק]] — הביבליה הערבית שהחל בה אֵלַי סמית' בביירות והשלים קורנליוס ון דייק בשנת 1865, בסיועם של חכמי הערבית בֻּטרוס אל-בֻּסתאני, נאצִיף אל-יאזִ'ג'י ויוּסֻף אל-אסִיר — סודר מקובץ אלקטרוני אחר. התרגום הוא אותו תרגום; הקובץ הוא הסיבה שבעבורה קיימת מהדורה זו.
hero.2=ביבליה משנת 1865 חופשית לכול, אך העתק אלקטרוני שלה הוא גם הוא מלאכתו של מישהו, ונוסח ון דייק מצוי ברשת בעותקים רבים שמקורם אינו ידוע. יש המוצעים בטענה שזכות היוצרים חלה על ההעתקה עצמה. נוסח שאין לעקוב אחר מקורו אין להדפיסו בבטחה, ולכן מהדורה זו משתמשת בהעתק שמקורו ידוע: זה שמפרסם eBible.org, המוצהר כנחלת הכלל, המציין את המיסיון הסורי כמתרגם ואת האגודה האמריקנית לכתבי הקודש כתורמת המקור. הקובץ מתוארך ל־2020-08-03.
hero.3=הוא מנוקד במלואו. כל מילה נושאת את ניקודה ואת סימני הקריאה האחרים, במקום שבו נוסח ון דייק האחר בקורא זה בלתי מנוקד ברובו. הדבר מאט את הסידור ומקל על הקריאה בקול, ועמוד מנוקד דורש יותר מקום בין השורות, כך שעותק מודפס של מהדורה זו יוצא ארוך יותר מאותו נוסח בלא ניקוד.
hero.4=זו המהדורה שיש לבחור בה כאשר השאלה היא אם ניתן להדפיס את הנוסח. לקריאה על המסך, כל אחד משני נוסחי ון דייק משרת באותה מידה.

