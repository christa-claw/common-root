title=סמית' וּוָן דייק (נוסח eBible) — על מהדורה זו | Common Root
description=הביבליה הערבית של סמית' ווָן דייק משנת 1865, בנוסח האלקטרוני המנוקד במלואו שמפרסם eBible.org כנחלת הכלל, מקובץ המקור של האגודה האמריקנית לכתבי הקודש.
