title=Bible in Basic English — Об этом издании | Common Root
description=Bible in Basic English — перевод с еврейского и греческого, выполненный комитетом под руководством С. Х. Хука и изданный Cambridge University Press (Новый Завет в 1941 году, вся Библия в 1949 году), на Basic English Ч. К. Огдена из 850 слов, к которым добавлено ещё 150 — для поэзии и для Библии.
heroHeading=Bible in Basic English
