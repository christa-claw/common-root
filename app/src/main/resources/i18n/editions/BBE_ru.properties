# The narrative, one paragraph per key, in order.
hero.1=Basic English создал Ч. К. Огден из Orthological Institute: это список из 850 английских слов, предложенный как международный вспомогательный язык. Bible in Basic English подготовил комитет под руководством С. Х. Хука (1874–1968), исследователя Ветхого Завета, ставшего в 1930 году профессором ветхозаветных исследований Лондонского университета на кафедре имени Сэмюэла Дэвидсона, в сотрудничестве с Orthological Institute. Перевод сделан с еврейского и греческого, а не упрощён из какого-либо прежнего английского перевода; затем текст на Basic подробно просмотрел комитет, созданный синдиками Cambridge University Press. К 850 словам Огдена переводчики добавили 100 слов, помогающих в поэзии, и 50 слов, необходимых для Библии, — всего 150. Cambridge University Press выпустило Новый Завет в 1941 году, а всю Библию в 1949 году; тираж 1965 года распространялся в США без знака охраны авторского права, и поэтому там текст находится в общественном достоянии.
hero.2=Результат читается просто и ровно, в пределах этого небольшого словаря. Книга Бытия начинается словами «At the first God made the heaven and the earth.» Псалом 23 начинается так: «The Lord takes care of me as his sheep; I will not be without any good thing.» Евангелие от Иоанна открывается словами «From the first he was the Word, and the Word was in relation with God and was God,» а Иоанн 3:16 звучит так: «For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.» Божье имя везде передано как «the Lord», кроме восьми стихов, где оно дано как «Yahweh», среди них Исход 6:3, где Бог говорит, что Авраам, Исаак и Иаков «had no knowledge of my name Yahweh», и Псалом 83:18. Там, где еврейский текст был слишком неясен для перевода, переводчики поставили на его месте точки, и в нашей копии несколько стихов, среди них Иов 34:29–33 и Иов 36:16–20, состоят только из «...».
hero.3=Наша копия содержит 66 книг, от Бытия до Откровения, без неканонических книг, в нумерации глав и стихов King James и Revised Version — 150 псалмов, и Книга Малахии, заканчивающаяся главой 4. Надписаний псалмов в ней нет: Псалом 51 начинается со слов «Have pity on me, O God». Новый Завет — не перевод общепринятого текста. Шестнадцать стихов, которые критические издания опускают, среди них Матфей 17:21, Деяния 8:37 и Римлянам 16:24, сохранены здесь лишь как пустые места, помеченные [], а в 1-м послании Иоанна 5:7 нет трёх свидетелей на небе; рассказ о женщине, взятой в прелюбодеянии, Иоанн 7:53–8:11, заключён в квадратные скобки, тогда как длинное окончание Марка сохранено. В этом читателе она стоит особняком. Собрание не записывает для неё предка, поэтому ступень родословия, открытая под одним из её стихов, падает прямо на пол языков оригинала, помеченный ≈: в Ветхом Завете это Ленинградский кодекс, в Новом — Textus Receptus, греческий текст, которому этот перевод в тех шестнадцати местах не следует. И ничего не записано как стоящее на ней. Ни один язык интерфейса не открывается на этом издании; английский интерфейс открывается на New International Version, а к этому изданию ведёт его собственная карточка в сетке переводов.

