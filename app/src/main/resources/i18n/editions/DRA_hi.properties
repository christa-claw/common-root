title=डुए-रिम्स 1899 — इस संस्करण के बारे में | Common Root
description=डुए-रिम्स बाइबिल: लैटिन वुल्गाता से किया गया अंग्रेज़ी कैथोलिक अनुवाद, नया नियम रिम्स में 1582 में और पुराना नियम डुए में 1609–10 में, बिशप चैलनर द्वारा संशोधित, 1899 की बाल्टीमोर छपाई में।
heroHeading=डुए-रिम्स 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=1568 में अंग्रेज़ कैथोलिकों के एक समूह ने — जिनमें बहुत से ऑक्सफ़ोर्ड के ऐसे विद्वान थे जो अब अपने पद नहीं रख सकते थे — विलियम एलन के नेतृत्व में फ़्लैंडर्स के डुए में एक महाविद्यालय स्थापित किया। उसके अस्तित्व का एक प्रयोजन यह था कि कैथोलिकों के हाथों में एक अंग्रेज़ी बाइबिल पहुँचे, क्योंकि उस समय प्रचलित एकमात्र अंग्रेज़ी बाइबिलें प्रोटेस्टेंट थीं और विवाद में प्रयुक्त होती थीं। ग्रेगरी मार्टिन ने अक्टूबर 1578 में लगभग दो अध्याय प्रतिदिन की गति से अनुवाद आरम्भ किया, और नया नियम 1582 में रिम्स में प्रकाशित हुआ, जहाँ महाविद्यालय अस्थायी रूप से चला गया था। मार्टिन का उसी वर्ष 28 अक्टूबर को निधन हुआ, अपने नए नियम के प्रकट होने के कुछ ही सप्ताह बाद। पुराना नियम उसी समय तैयार था और फिर अमुद्रित पड़ा रहा, इस साधारण कारण से कि महाविद्यालय के पास उसे छापने का धन नहीं था; वह अन्ततः 1609 और 1610 में दो खण्डों में निकला, जब किंग जेम्स संस्करण दो वर्ष दूर था।
hero.2=इस संग्रह की हर दूसरी अंग्रेज़ी बाइबिल से इसे जो अलग करता है वह यह है कि यह किससे बनी। इब्रानी और यूनानी से नहीं: लैटिन वुल्गाता से। ट्रेंट की महासभा ने वुल्गाता को कलीसिया का प्रामाणिक पाठ घोषित किया था, और डुए के अनुवादकों ने यह भी तर्क दिया कि जेरोम ने ऐसी पाण्डुलिपियों से काम किया था जो उनके लिए उपलब्ध किसी भी यूनानी प्रति से पुरानी थीं — पुराने नियम के विषय में 1600 के आसपास यह सोचना अनुचित नहीं था। जो गद्य बना वह भारी रूप से लैटिनमय है, कभी-कभी इस सीमा तक कि वह अंग्रेज़ी रह ही नहीं जाता: प्रभु की प्रार्थना “supersubstantial bread” माँगती है, क्योंकि अनुवादक उस शब्द को देशज नहीं बनाना चाहते थे जिस पर धर्मविज्ञान टिका था। यह नीति थी, अक्षमता नहीं।
hero.3=अठारहवीं शताब्दी के मध्य तक इसे पढ़ पाना लगभग किसी के बस में नहीं रहा, और बिशप रिचर्ड चैलनर ने 1749 और 1752 के बीच इसका संशोधन किया — व्यापक रूप से, और बहुत कुछ किंग जेम्स संस्करण की दिशा में, जो तब तक बस वही था जैसा अंग्रेज़ी में धर्मग्रन्थ सुनाई देता था। आज जो भी बाइबिल डुए-रिम्स के नाम से बिकती है वह चैलनर का पाठ है, मार्टिन का नहीं। यह 1899 की अमेरिकी छपाई है, बाल्टीमोर की जॉन मर्फ़ी कम्पनी की, जिस पर कार्डिनल जेम्स गिबन्स का इम्प्रिमेटुर है; चूँकि वह छपाई बहुत पहले से कॉपीराइट-मुक्त है, तब से उसी को स्कैन किया, टंकित किया और पुनरुत्पादित किया गया है, और वस्तुतः लगभग हर डिजिटल डुए-रिम्स यही है।
hero.4=इस पाठक में यह कुछ ऐसा करती है जो यहाँ का लगभग कोई अन्य संस्करण नहीं कर सकता। इसका अभिलिखित मूल इसी संग्रह में उपस्थित है: डुए-रिम्स के किसी पद के नीचे एक वंश-पायदान खोलिए, और नीचे का पायदान स्वयं लैटिन वुल्गाता है — वही पाठ जिससे यह वास्तव में अनूदित हुई — न कि ≈ से चिह्नित वह मूल-भाषा तल जिस पर अधिकांश संस्करण गिरते हैं। पायदान-तंत्र ठीक इसी स्थिति के लिए बनाया गया था। प्रभाव उल्टी दिशा में भी बहा — रिम्स का नया नियम किंग जेम्स के अनुवादकों की मेज़ों पर था, और उसकी बहुत-सी लैटिनमय शब्दावली उनके काम में चली गई — किन्तु वंश-सूची केवल औपचारिक संशोधन-रेखाएँ रखती है, इसलिए वह ऋण वहाँ दर्ज नहीं है। एक उलटाव ध्यान देने योग्य है: इसका पायदान चिह्न वर्ष 1899 दिखाता है जबकि सूची-कार्ड कोई वर्ष नहीं दिखाता। पायदान-वर्ष हाथ से बनाई गई एक सूची हैं और कार्ड सूची के अपने मेटाडेटा को पढ़ता है, और जहाँ कोई संस्करण एक में है और दूसरे में नहीं, वहाँ दोनों सार्वजनिक रूप से असहमत रहते हैं।
hero.5=पुस्तक-सूची के विषय में एक सावधानी। यहाँ रखे पाठ में 72 पुस्तकें हैं, मुद्रित कैथोलिक बाइबिल की 73 नहीं। जो छह द्वितीयक-प्रामाणिक पुस्तकें इसमें हैं — तोबीत, यूदीत, 1 और 2 मक्काबी, सुलैमान का ज्ञान और सीराख — वे प्रकाशितवाक्य के बाद रखी हैं, अपने कैथोलिक स्थानों पर नहीं, और बारूक बिलकुल अनुपस्थित है। यह डिजिटल पाठ का गुण है जैसा वह लिया गया, 1899 की पुस्तक का नहीं; और इसका अर्थ है कि यह स्तम्भ पद-दर-पद सही पढ़ा जाएगा, किन्तु इसका उपयोग यह जाँचने के लिए नहीं करना चाहिए कि कैथोलिक सूची में क्या-क्या है।

