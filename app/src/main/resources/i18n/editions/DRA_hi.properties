fact.1.label=भाषा
fact.1.value=अंग्रेज़ी — कैथोलिक परम्परा
fact.2.label=किससे अनूदित
fact.2.value=लैटिन वुल्गाता से, इब्रानी और यूनानी से नहीं — वही [[VUL|वुल्गाता]] जो इस संग्रह में है
fact.3.label=नया नियम
fact.3.value=रिम्स, 1582 — मुख्यतः ग्रेगरी मार्टिन का कार्य, साथ में विलियम एलन, रिचर्ड ब्रिस्टो और थॉमस वर्थिंगटन
fact.4.label=पुराना नियम
fact.4.value=डुए, 1609 और 1610, दो खण्डों में — नए नियम के साथ ही पूरा हुआ पर छपाई के धन के अभाव में लगभग तीस वर्ष रुका रहा
fact.5.label=संशोधनकर्ता
fact.5.value=बिशप रिचर्ड चैलनर, 1749–1752 — आज डुए-रिम्स के नाम से बिकने वाली हर पुस्तक चैलनर का संशोधन है, 1582/1610 का पाठ नहीं
fact.6.label=यह छपाई
fact.6.value=1899 का अमेरिकी संस्करण, बाल्टीमोर की जॉन मर्फ़ी कम्पनी का, कार्डिनल जेम्स गिबन्स के इम्प्रिमेटुर सहित — बहुत पहले से कॉपीराइट-मुक्त, और यही संस्करण डिजिटल रूप में प्रचलित है
fact.7.label=यहाँ की सामग्री
fact.7.value=72 पुस्तकें: प्रोटेस्टेंट सूची की 66 पुस्तकें प्रोटेस्टेंट क्रम में, और तोबीत, यूदीत, 1 तथा 2 मक्काबी, सुलैमान का ज्ञान और सीराख प्रकाशितवाक्य के बाद जोड़ी हुईं। बारूक नहीं है, इसलिए यह स्तम्भ कैथोलिक सूची की विश्वसनीय जाँच नहीं है
fact.8.label=वंश
fact.8.value=यहाँ के उन थोड़े संस्करणों में से एक जिनका अभिलिखित मूल स्वयं इसी संग्रह में है — डुए-रिम्स के पद के नीचे का पायदान [[VUL|लैटिन वुल्गाता]] पर खुलता है, मूल-भाषा तल पर नहीं
fact.9.label=इस संग्रह में
fact.9.value=इसके पायदान चिह्न पर वर्ष 1899 अंकित है यद्यपि सूची-कार्ड वर्ष रिक्त छोड़ता है; पायदान-वर्ष एक अलग हस्त-निर्मित सूची हैं, और दोनों का असहमत होना स्वीकार्य है
