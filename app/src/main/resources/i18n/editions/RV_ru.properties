fact.3.label=Выполнен
fact.3.value=двумя коллегиями, по одной на каждый Завет, из более чем пятидесяти британских учёных нескольких деноминаций, при участии американских учёных перепиской
fact.4.label=Издан
fact.4.value=Новый Завет в 1881 году, Ветхий Завет в 1885-м, апокрифы в 1894-м
fact.5.label=Пересмотр издания
fact.5.value=[[KJV|King James Version 1611 года]], изменённого лишь там, где языки подлинника были сочтены того требующими
fact.6.label=Новый Завет по
fact.6.value=собственному критическому греческому тексту пересматривавших, не по Textus Receptus; Уэсткотт и Хорт заседали в коллегии и подавали ей свой текст в корректуре
fact.7.label=Ветхий Завет по
fact.7.value=масоретскому еврейскому тексту
fact.8.label=Имя Божие
fact.8.value=«The LORD», как было в King James Version, кроме мест, где та сама печатала «JEHOVAH»; провести имя насквозь было американским предпочтением, выпущенным в [[ASV|American Standard Version]] 1901 года
fact.9.label=Книг здесь
fact.9.value=восемьдесят книг и 36 873 стиха — четырнадцать апокрифических рядом с шестьюдесятью шестью, как они есть здесь и у [[KJV|King James Version]]
fact.10.label=Год на карточке
fact.10.value=пуст, и намеренно: три выпуска — 1881, 1885, 1894 — и этот текст в восьмидесяти книгах несёт все три; собрание клеймит 1885, и это же показывает значок ступени
fact.11.label=В этом собрании
fact.11.value=ступень между [[KJV|King James Version]] и [[ASV|American Standard Version]] в самой длинной здешней цепи, которая поднимается к [[WEB|World English Bible]] и спускается через [[GNV|Женеву]] к [[TR|греческому]] и [[WLC|масоретскому еврейскому тексту]]
