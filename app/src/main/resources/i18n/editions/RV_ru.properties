title=Revised Version — Об этом издании | Common Root
description=Английская Revised Version: единственный пересмотр King James Version, когда-либо санкционированный Церковью Англии, вышедший тремя выпусками между 1881 и 1894 годами, — и здесь ступень между King James Version и American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=Revised Version — тот единственный пересмотр King James Version, который английская церковь действительно заказала. Кентерберийская конвокация постановила его в 1870 году и назначила две коллегии, по одной на каждый Завет, собрав в них более пятидесяти британских учёных из нескольких деноминаций — не одних лишь англикан, что само по себе было новшеством и вызвало споры. Американских учёных пригласили участвовать перепиской, и они участвовали. Указание было осторожным: изменять Authorised Version лишь там, где того требуют верно переданные языки подлинника. Новый Завет вышел в 1881 году, Ветхий Завет в 1885-м, а апокрифы, над которыми работали последними, в 1894-м.
hero.2=Осторожное указание не помешало новозаветной коллегии принять самое далеко идущее решение всей книги. Они не работали по Textus Receptus. Уэсткотт и Хорт заседали в этой коллегии и по ходу работы подавали ей в корректуре собственный греческий текст; то, на чём остановились пересматривавшие, было их собственным эклектическим текстом, а не в точности текстом Уэсткотта и Хорта, но он решительно сдвинулся к более древним унциальным рукописям. Поставьте это издание рядом с King James Version в две колонки — и сдвиг виден сразу. В 1 Ин. 5:7 колонка King James читает «For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one», а эта читает «And it is the Spirit that beareth witness, because the Spirit is the truth».
hero.3=Чего британские пересматривавшие не изменили — это именно то, что американцы больше всего хотели изменить. В Пс. 23:1 это издание по-прежнему печатает «The LORD is my shepherd», ровно как King James Version; стоящая над ним American Standard Version печатает «Jehovah is my shepherd». Имя стоит здесь только там, где его напечатала сама King James Version, — в Исх. 6:3 обе читают «by my name JEHOVAH», — а провести его через весь Ветхий Завет было американским предпочтением, отправленным в приложение по четырнадцатилетнему соглашению и выпущенным в текст лишь в 1901 году. Читать обе колонки вместе — кратчайший путь увидеть, что это соглашение на деле удержало. Второе отличие сказывается в форме фраз, а не в их букве: пересматривавшие порвали с набором «стих на строку» и набрали прозу абзацами, и след этого сохранился здесь в стихах, которые начинаются со строчной буквы, потому что продолжают фразу, — «and I appeared unto Abraham» в Исх. 6:3, где колонка King James начинается «And I appeared».
hero.4=Карточка этого издания оставляет год пустым, и это честный ответ, а не пробел. Revised Version публиковалась не однажды, а трижды, и текст здесь — тот, что в восьмидесяти книгах: шестьдесят шесть книг плюс четырнадцать апокрифических, всего 36 873 стиха, а значит, он несёт материал, которого не было в печати до 1894 года. Запись собрания клеймит его 1885 годом, когда Ветхий Завет завершил собственно Библию, и этот год показывает значок ступени родословия. От какой печати происходит текст, не записано — тот же пробел, который собрание оставляет открытым для King James Version и для финской Biblia 1776 года. Заметим также, что ни один интерфейс не открывается на этом издании; английский открывается на New International Version, а на это переключаются.

