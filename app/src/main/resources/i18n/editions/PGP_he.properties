fact.2.value=ג'וזף סמית' הבן (1805–1844): התגלויות, העריכה מחדש שלו לתרגום המלך ג'יימס, תרגום שלדבריו עשה מפפירוסים מצריים, ההיסטוריה שלו עצמו והצהרת אמונה; כונסו לראשונה לכרך אחד בידי פרנקלין ד. ריצ'רדס
fact.3.label=יצאה לאור
fact.3.value=1851, ליברפול, אנגליה, כחוברת שליחות שקיבץ פרנקלין ד. ריצ'רדס; מהדורה שנייה 1878, סולט לייק סיטי, בעריכת אורסון פראט; התקבלה ככתבי קודש בוועידה כללית ב-10 באוקטובר 1880
fact.4.label=מבנה
fact.4.value=חמישה חלקים — מבחר מספר משה, ספר אברהם, ג'וזף סמית' — מתי, ג'וזף סמית' — היסטוריה ועיקרי האמונה — המחולקים לפרקים ולפסוקים מאז העריכה של 1902; באוסף שלנו כל חלק הוא ספר בפני עצמו
fact.5.label=מעמד
fact.5.value=אחד מארבעת כתבי הקודש התקניים של כנסיית ישוע המשיח של קדושי אחרית הימים, לצד המקרא, [[BOM|ספר מורמון]] ו[[DC|תורה ובריתות]]; Community of Christ אינה רואה בו כתבי קודש
fact.6.label=באוסף זה
fact.6.value=הטקסט נאמן לנוסח התקני הנוכחי מתוך ייצוא ה-JSON של Mormon Documentation Project שהוכרז נחלת הכלל — אותו המקור של [[BOM|ספר מורמון]] ו[[DC|תורה ובריתות]]; הקטעים ממשה וממתי מעבדים את נוסח [[KJV|תרגום המלך ג'יימס]], הנמצא גם הוא באוסף; הפקסימיליות וההסברים להן הושמטו, ואין מצוינת כאן שנת דפוס אחת
fact.7.label=רישיון
fact.7.value=נחלת הכלל, לפי הצהרת האחראי על הנתונים; החומר הלימודי המודרני המוגן בזכויות יוצרים אינו כלול
