title=הפנינה היקרה — על מהדורה זו | Common Root
description=הפנינה היקרה: מבחר מהתגלויותיו, מתרגומיו ומסיפוריו של ג'וזף סמית', שקובץ לראשונה ב-1851 כחוברת שליחות בליברפול שבאנגליה, ושקדושי אחרית הימים קיבלו ככתבי קודש ב-1880.
heroHeading=הפנינה היקרה
readerHref=/reader?c1.src=pgp

hero.1=הפנינה היקרה החלה את דרכה כחוברת שליחות ולא כספר קודש. ב-1851 קיבץ אותה פרנקלין ד. ריצ'רדס, אז נשיא השליחות האירופית של הכנסייה, בליברפול שבאנגליה: הוא אסף כתבים של ג'וזף סמית' שהתפרסמו בעיתוני הכנסייה הראשונים או שהופצו רק בעותקים מעטים, כדי שלחברי הכנסייה בבריטניה יהיו הם מכונסים במקום אחד. שמה לקוח מן המשל שבמתי 13:45–46, על הסוחר המוכר את כל אשר לו כדי לקנות פנינה יקרה אחת.
hero.2=מהדורה שנייה, שערך וסידר מחדש אורסון פראט, יצאה לאור בסולט לייק סיטי ב-1878, וב-10 באוקטובר 1880 קיבלה אותה ועידה כללית של הכנסייה בהצבעה ככתבי קודש. עריכה מחודשת מ-1902, שהכין בעיקר ג'יימס א. טלמג', חילקה את הטקסט לפרקים ולפסוקים והשמיטה את ההתגלויות שהיו משותפות לה ולתורה ובריתות; מהדורת 1921 נסדרה בשני טורים. ב-1976 נוספו שתי התגלויות נוספות — חזון הממלכה השמימית וחזונו של ג'וזף פ. סמית' על גאולת המתים — וב-1979 העבירה אותן הכנסייה לתורה ובריתות, שבמהדורת 1981 שלו הן מודפסות כפרקים 137 ו-138.
hero.3=המהדורה הנוכחית כוללת חמישה חלקים. "מבחר מספר משה" ו"ג'וזף סמית' — מתי" הם קטעים מן העריכה מחדש של תרגום המלך ג'יימס שג'וזף סמית' החל בה ב-1830: הראשון הוא סיפור מורחב של פרקי הפתיחה של ספר בראשית, ממוסגר בחזיונות שניתנו למשה; השני — עיבוד מחדש של מתי 23:39 ופרק 24. "ספר אברהם" הוא הטקסט שסמית' אמר כי תרגם מפפירוסים מצריים שנרכשו בקירטלנד שבאוהיו ב-1835; הוא התפרסם ב-1842 בעיתון Times and Seasons בנאבו שבאילינוי, יחד עם שלושה איורים המכונים כיום פקסימיליות 1, 2 ו-3. "ג'וזף סמית' — היסטוריה" לקוח מן הדיווח על ימיו הראשונים ועל חזיונותיו שהכין ב-1838, ו"עיקרי האמונה" הם שלוש־עשרה הצהרות אמונה מתוך מכתב משנת 1842 אל עורך העיתון השיקגואי ג'ון וֶנטוורת'.
hero.4=ספר אברהם הוא החלק שהועמד בספק לעיתים הקרובות ביותר. רוב הפפירוסים נחשבו זמן רב להרוסים, כנראה בשריפה הגדולה של שיקגו ב-1871, אך עשרה קטעים שהיו פעם ברשותו של ג'וזף סמית' התגלו במוזיאון המטרופוליטן לאמנות בניו יורק, שהעביר אותם לכנסייה ב-1967. החוקרים מזהים את הקטעים כחלקים מטקסטים מצריים רגילים של קבורה, שנכתבו בין המאה השלישית לפני הספירה למאה הראשונה לספירה, והמאמר שהכנסייה עצמה פרסמה על הספר מודה כי אף אחד מן הסימנים שעליהם אינו מזכיר את שמו של אברהם או אירוע כלשהו שהספר מספר עליו.
hero.5=לצד המקרא, ספר מורמון ותורה ובריתות, זהו אחד מארבעת כתבי הקודש התקניים של כנסיית ישוע המשיח של קדושי אחרית הימים; Community of Christ, הכנסייה הגדולה האחרת שצמחה מתנועתו של ג'וזף סמית', אינה מונה אותו בין כתבי הקודש שלה. הטקסט באוסף זה מקורו בייצוא ה-JSON של Mormon Documentation Project, שבנחלת הכלל, אותו המקור של ספר מורמון ותורה ובריתות שכאן, והוא שומר על חמשת החלקים כחמישה ספרים: משה בשמונה פרקים, אברהם בחמישה, ושלושת האחרונים בפרק אחד כל אחד. שלוש הפקסימיליות וההסברים שהודפסו עמן אינם טקסט של פסוקים, ולכן אינם כלולים. כמו שני חבריו, הוא נאמן לנוסח המהדורה התקנית הנוכחית ולא לדפוס היסטורי מסוים, ולכן אין מצוינת כאן שנת הוצאה.

