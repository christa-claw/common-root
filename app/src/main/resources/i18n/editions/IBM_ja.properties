fact.3.label=名称
fact.3.value=スナン・イブン・マージャとして知られる
fact.4.label=編纂地と時期
fact.4.value=イラク、ヒジャーズ、シリア、エジプトを巡る旅の中で集められた。イブン・マージャはカズウィーンに定住し、ヒジュラ暦273年（西暦887年）に同地で没した
fact.5.label=方法
fact.5.value=[[ABD|スナン・アブー・ダーウード]]や[[TIR|ジャーミウ・アッ=ティルミズィー]]のように法学上の主題によって整理されている。アッ=ザハビーの数え方では約1,500章からなる
fact.6.label=位置づけ
fact.6.value=スンニ派イスラームの六書（クトゥブ・スィッタ）の最後の一書とされ、前の五書は[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]——この第六の席は論争の対象であり、一部の学者は[[MAL|ムワッタ・マーリク]]やアッ=ダーラクトゥニーの『スナン』を挙げる
fact.7.label=ハディースの数
fact.7.value=アッ=ザハビーの数え方では約4,000件。そのうち約三十件はほぼ総意として偽造とされる。このコーパスの底本の版では4,343件と番号づけられている
fact.8.label=このコーパスでは
fact.8.value=38巻・4,343件の番号付きハディース
