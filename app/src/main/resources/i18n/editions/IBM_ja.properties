title=スナン・イブン・マージャ — この版について | Common Root
description=スナン・イブン・マージャ——スンニ派イスラームの六書のうち最後の一書。法学上の主題によって整理されているが、弱いハディースや偽造されたハディースも含むため、六書におけるその位置づけは長く論じられてきた。
heroHeading=スナン・イブン・マージャ
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=アブー・アブド・アッラー・ムハンマド・イブン・ヤズィード・イブン・マージャ・アッ=ラビーイー・アル=カズウィーニーは、ヒジュラ暦209年（西暦824年）、現在のイラン北西部にあたるカズウィーンに、ラビーア族のマワーリー（庇護民）の家に生まれた——「マージャ」は、一説によれば祖父や母の名ではなく、父のあだ名であったという。彼はハディースを求めてイラク、ヒジャーズ、シリア、エジプトを巡り、広範な学者たちのもとで学んだ。彼が後にまとめた『スナン』の四分の一以上が、イブン・アビー・シャイバという一人の師にのみ由来するとも言われる。アブー・ヤアラー・アル=ハリーリーら同時代の人々は、彼を信頼できる、名高い、合意された権威として称えた。彼はヒジュラ暦273年（西暦887年）にカズウィーンで没したが、アル=カッターニーはヒジュラ暦275年（西暦889年）とも記している。伝統的な逸話によれば、イブン・マージャが完成した『スナン』を読み上げた後、アブー・ズルア・アッ=ラーズィーは、人々がこの書物を持っていれば、他の『スナン』の多くは概ね不要になるだろうと評したという。
hero.2=彼の『スナン』は、アッ=ザハビーの数え方によれば、約1,500章・約4,000件のハディースからなり、[[ABD|アブー・ダーウード]]や[[TIR|アッ=ティルミズィー]]の書物と同様、法学上の主題によって整理されている。健全・許容できる伝承に加えて、後世の学者が弱いと判定したハディースも含まれており、そのうち約三十件はほぼ総意として偽造とされる——これが一部の学者が六書ではなく「五書」としか数えない理由である。
hero.3=スンニ派の伝統では、スナン・イブン・マージャは、[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]とともに六書（クトゥブ・スィッタ）の最後の一書に数えられる。しかしこの第六の席自体が論争の対象であり、マーリク派やイブン・アル=アスィールらは代わりに[[MAL|ムワッタ・マーリク]]を挙げ、一部はアッ=ダーラクトゥニーの『スナン』を挙げる。イブン・マージャの書がこの席を得たのは、一般に、他の五書と内容の重複がもっとも少なかったためとされ、候補の中でもっとも健全と判定されたからではないとされる。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-ibnmajah 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

