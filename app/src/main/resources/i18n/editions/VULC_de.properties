title=Clementinische Vulgata — Über diese Ausgabe | Common Root
description=Die Clementinische Vulgata: die päpstliche Revision der lateinischen Bibel des Hieronymus, 1592 in Rom gedruckt und 1593 und 1598 verbessert neu aufgelegt – bis 1979 der lateinische Standardtext der katholischen Kirche und in diesem Reader eine Sprosse über der Vulgata.
heroHeading=Clementinische Vulgata
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=1546 erklärte das Konzil von Trient die Vulgata zur authentischen lateinischen Bibel der Kirche und ließ damit eine Frage offen, die es nicht beantwortete: welche Vulgata? Elf Jahrhunderte des Abschreibens von Hand hatten keine zwei Handschriften ganz gleich gelassen, und das Konzil verlangte einen verbesserten Text. Papst Sixtus V. lieferte 1590 einen, zu einem großen Teil von ihm selbst überarbeitet, mit einer Bulle, die ihn für authentisch erklärte. Er starb im August desselben Jahres, und binnen weniger Wochen hatten die Kardinäle den Verkauf gestoppt. Unter Clemens VIII. erarbeitete eine Kommission – Francisco de Toledo unter den Herausgebern, Robert Bellarmin im Zentrum der Arbeit – den Ersatz, 1592 in Rom gedruckt. Kleinere Nachdrucke 1593 und 1598 beseitigten die meisten seiner Druckfehler und fügten die Prologe des Hieronymus und Randverweise hinzu.
hero.2=Dieser Text war fast vier Jahrhunderte lang die lateinische Standardbibel der katholischen Kirche, bis zur Nova Vulgata von 1979, und Missale und Brevier von 1962 verwenden ihn noch heute. Es ist die Bibel des Hieronymus, wie die Kirche sie empfangen hatte, nicht wie er sie hinterließ. Die Psalmen sind sein gallikanischer Psalter, nach dem Griechischen überarbeitet, nicht seine spätere Übersetzung aus dem Hebräischen, und deshalb behalten sie die griechische Zählung: Psalm 22 beginnt hier mit „Dominus regit me“, dem Hirtenpsalm. In 1 Joh 5,7 steht das Comma Johanneum, „Pater, Verbum, et Spiritus Sanctus“, ein lateinischer Zusatz, den die frühen griechischen Handschriften nicht haben. Ester und Daniel stehen in ihrer längeren Form, die griechischen Zusätze gesammelt am Ende von Ester und als die beiden letzten Kapitel Daniels. Die eBible.org-Datei, aus der diese Abschrift stammt, druckt den Text von 1598 mit der Glossa Ordinaria als Anmerkungen – dem Kommentar aus der Schule Anselms von Laon aus dem zwölften Jahrhundert, in Mignes Ausgabe von 1880. Die Anmerkungen sind nicht ins Korpus gelangt; die eckigen Klammern in manchen Versen stammen aus der Quelle selbst.
hero.3=In diesem Reader ist sie eine Sprosse mit einer einzigen verzeichneten Vorlage, der lateinischen Vulgata: Öffnet man unter einem ihrer Verse eine Sprosse, erscheint die Vulgata. Man darf erwarten, dass beide fast Wort für Wort gleich lauten. Die Vulgata in diesem Korpus ist selbst einem clementinischen Text entnommen, sodass sie vor allem die Zeichensetzung unterscheidet – und die Bücher, die dieser Abschrift fehlen. Sie hat 66, die Bücher des protestantischen Kanons, mit Ester und Daniel in ihrer längeren Form. Die Quelldateien enthalten auch Tobit, Judit, Weisheit, Jesus Sirach, Baruch und die beiden Makkabäerbücher, die alle in der Vulgata darunter stehen; keines davon ist angekommen, sodass dort, wo die Vulgata Tobit hat, nichts darüber steht. Das Gebet des Manasse sowie 3 und 4 Esra, die die Clementina in einem Anhang druckte, stehen weder in der Quelle noch im Korpus. Auf dieser Ausgabe selbst steht im Korpus nichts.

