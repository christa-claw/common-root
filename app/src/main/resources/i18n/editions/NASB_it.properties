title=New American Standard Bible 2020 — Informazioni su questa edizione | Common Root
description=La New American Standard Bible: la continuazione della Fondazione Lockman della letteralità parola per parola dell'American Standard Version, tradotta di nuovo dall'ebraico, dall'aramaico e dal greco e ora nel suo testo del 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=La New American Standard Bible nacque come una continuazione deliberata, non come un progetto interamente nuovo. La Fondazione Lockman, un'organizzazione non profit con sede a La Habra, in California, avviò il lavoro nel 1959 per portare avanti l'American Standard Version del 1901 — mantenendone la fama di fedeltà letterale, parola per parola, all'ebraico, all'aramaico e al greco, mentre ne modernizzava l'inglese datato. La Fondazione riunì un comitato di studiosi provenienti da college e seminari cristiani e, in gran parte, da denominazioni evangeliche conservatrici, e la traduzione uscì per fasi: il Vangelo di Giovanni nel 1960, gli altri Vangeli nel 1962, il Nuovo Testamento completo nel 1963, i Salmi separatamente nel 1968, e l'intera Bibbia nel 1971. Quella prima edizione completa si basò, per l'Antico Testamento, sulla terza edizione della Biblia Hebraica di Rudolf Kittel, con i rotoli del Mar Morto consultati, e per il Nuovo Testamento, sulla 23ª edizione del Novum Testamentum Graece di Nestle e Aland.
hero.2=La revisione continuò per decenni dopo quella prima stampa. Piccoli cambiamenti nella formulazione seguirono nel 1972, nel 1973 e nel 1975, poi una revisione più sostanziale nel 1977 e un'altra, più limitata, nel 1992. Nel 1995 la Fondazione pubblicò la Updated Edition — la NASB95, il testo che la maggior parte delle persone intende quando dice semplicemente «la NASB» — consultando la Biblia Hebraica Stuttgartensia e la 26ª edizione di Nestle-Aland. Il testo attuale è l'aggiornamento del 2020, parti del quale avevano già iniziato ad apparire online nel 2018: spostò la base testuale dell'Antico Testamento sulla Biblia Hebraica Stuttgartensia e, per i libri che copre, sulla più recente Biblia Hebraica Quinta, consultando la Settanta, i rotoli del Mar Morto, i Targum e altre versioni antiche dove incidono su una lettura, mentre il Nuovo Testamento segue ora la 28ª edizione di Nestle-Aland, integrata dall'apparato più ampio di testimonianze manoscritte greche dell'Editio Critica Maior. Il metodo dichiarato dei traduttori rimase lo stesso in ogni revisione: rendere l'originale quanto più letteralmente consenta un inglese leggibile, e dove una resa strettamente letterale avrebbe potuto trarre in inganno o suonare innaturale, scegliere l'idioma più chiaro e annotare in nota la dicitura più letterale — una disciplina spesso citata come la ragione per cui questa è una delle più letterali tra le traduzioni inglesi di ampia diffusione del Novecento e del Duemila.
hero.3=Nonostante il nome e il debito dichiarato verso l'American Standard Version, la New American Standard Bible è una traduzione nuova dalle lingue originali, non una revisione riga per riga di quella, e il corpus di conseguenza non registra per essa alcun genitore: aprendo un piolo di discendenza sotto un versetto della NASB si scende direttamente al fondo della lingua originale, segnato con ≈, esattamente come per la New International Version. Le due hanno in comune più di questa forma — entrambe sono su licenza e non di pubblico dominio, il che le distingue dalle edizioni inglesi liberamente copiabili sullo stesso scaffale, sebbene un'interfaccia in inglese si apra per impostazione predefinita sulla New International Version, mentre la New American Standard Bible si raggiunge dalla propria scheda nella griglia delle traduzioni.

fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Commissionata
fact.2.value=Dalla Fondazione Lockman di La Habra, in California, che avviò il progetto nel 1959 come continuazione della tradizione di traduzione letterale dell'American Standard Version
fact.3.label=Realizzata da
fact.3.value=Un comitato di traduzione finanziato dalla Fondazione, con studiosi provenienti da college e seminari cristiani e, in gran parte, da denominazioni evangeliche conservatrici
fact.4.label=Antico Testamento da
fact.4.value=La Biblia Hebraica di Rudolf Kittel (3ª edizione) e i rotoli del Mar Morto per l'edizione originale del 1971; la Biblia Hebraica Stuttgartensia dalla revisione del 1995; il testo del 2020 cita la Biblia Hebraica Stuttgartensia e, dove disponibile, la più recente Biblia Hebraica Quinta, con la Settanta, i rotoli del Mar Morto, i Targum e altre versioni antiche consultate
fact.5.label=Nuovo Testamento da
fact.5.value=Il Novum Testamentum Graece di Nestle e Aland, 23ª edizione, per l'edizione originale del 1971; la 26ª edizione dalla revisione del 1995; la 28ª edizione (NA28) per il testo del 2020, integrata dall'apparato di testimonianze manoscritte greche dell'Editio Critica Maior
fact.6.label=Tipo di traduzione
fact.6.value=Equivalenza formale — tradotta con tutta la letteralità dalle lingue originali che un inglese leggibile consente, con la resa più letterale annotata in nota dove si è scelto invece un idioma più chiaro; una traduzione nuova dall'ebraico, dall'aramaico e dal greco, non una revisione di una Bibbia inglese precedente, nonostante le sue radici nell'approccio dell'American Standard Version
fact.7.label=Pubblicata
fact.7.value=Il Vangelo di Giovanni nel 1960, i Vangeli nel 1962, il Nuovo Testamento nel 1963, i Salmi nel 1968, la Bibbia completa nel 1971, piccoli cambiamenti testuali nel 1972, nel 1973 e nel 1975, una revisione maggiore nel 1977, una revisione limitata nel 1992, la Updated Edition (NASB95) nel 1995, e il testo attuale del 2020, parti del quale apparvero online dal 2018
fact.8.label=Licenza
fact.8.value=Su licenza, non di pubblico dominio. Si possono citare fino a 1.000 versetti in qualsiasi forma senza autorizzazione scritta, purché non costituiscano un libro intero della Bibbia né più della metà dell'opera citante, con un avviso di copyright che nomini 1960, 1971, 1977, 1995 e 2020; qualsiasi uso maggiore richiede l'autorizzazione della Fondazione Lockman
fact.9.label=In questo corpus
fact.9.value=Su licenza e non di pubblico dominio, come [[NIV|la New International Version]] — l'interfaccia inglese si apre per impostazione predefinita su quell'edizione, e questa si raggiunge dalla propria scheda. Nei pioli di discendenza non è registrato alcun genitore: sebbene la Fondazione descriva il progetto come una continuazione della letteralità [[ASV|dell'American Standard Version]], essa è tradotta di nuovo dall'ebraico, dall'aramaico e dal greco e non è una revisione di quella né di alcun altro testo inglese qui custodito, cosìché un piolo sotto un versetto della NASB scende direttamente al fondo della lingua originale, segnato con ≈
