title=Nueva Biblia de las Américas — Об этом издании | Common Root
description=Nueva Biblia de las Américas: латиноамерикано-испанская переработка The Lockman Foundation собственной La Biblia de las Américas, переносящая тот же пословный метод в повседневный испанский язык, на котором говорят по всей Америке.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas — это латиноамерикано-испанское издание The Lockman Foundation, построенное на более раннем La Biblia de las Américas фонда 1986 года — которое само является результатом примерно пятнадцати лет работы двадцати двух переводчиков и консультантов, по той же пословной переводческой философии, позднее перенесённой в английский язык как New American Standard Bible. Вместо нового перевода с иврита и греческого, NBLA представляет собой переработку регистра: комитет Lockman из двенадцати человек переработал более кастильский испанский язык La Biblia de las Américas в привычный, современный испанский, на котором говорят по всей Латинской Америке, заменив такие формы, как местоимение второго лица множественного числа «vosotros», более распространённым «ustedes», и облегчив конструкции, такие как формульное «y» и «sucedió que», которые прежний текст перенёс буквально из еврейского повествовательного стиля. Собственное уведомление The Lockman Foundation о разрешении на цитирование датирует готовый текст 2005 годом.
hero.2=Текстовая основа напрямую вытекает из La Biblia de las Américas: Ветхий Завет опирается на Biblia Hebraica Рудольфа Киттеля, со свитками Мёртвого моря, принятыми во внимание, а Новый Завет в целом — на 27-е издание Novum Testamentum Graece Эберхарда Нестле, с учётом дополнительных рукописных свидетельств там, где они влияют на то или иное чтение. Некоторые книготорговцы и каталоги библейского программного обеспечения теперь группируют Nueva Biblia de las Américas вместе с переработкой New American Standard Bible фонда 2020 года, продавая их как подобранную пару для англоязычных и испаноязычных читателей одной и той же буквалистской традиции; сам перевод, однако, не несёт в собственных уведомлениях фонда более позднюю дату авторского права, чем 2005 год.
hero.3=Испанский интерфейс здесь по умолчанию открывается на Reina Valera 1909 — свободно копируемом тексте из совершенно иной переводческой традиции и на столетие более старом; Nueva Biblia de las Américas же достигается со своей собственной карточки в сетке переводов. С этим изданием она делит мало текстовой истории, но многое — с New American Standard Bible: тот же фонд, тот же метод формальной эквивалентности и тот же лицензированный, а не общественный статус, позволяющий цитировать до 500 стихов без письменного разрешения, при условии, что они не составляют целую книгу или более четверти цитирующего произведения. В ступенях родословной не записано родителя: La Biblia de las Américas, текст, который она перерабатывает, сама не хранится в этом собрании, так что ступень под стихом NBLA ведёт прямо к полу оригинального языка, отмеченному ≈.

fact.1.label=Язык
fact.1.value=Испанский
fact.2.label=Заказан
fact.2.value=The Lockman Foundation из Ла-Абры, Калифорния — та же некоммерческая организация, стоящая за New American Standard Bible и собственным предшественником, La Biblia de las Américas (1986)
fact.3.label=Кем сделан
fact.3.value=Комитетом по переработке из двенадцати человек от Lockman, работавшим на основе перевода La Biblia de las Américas, который сам является работой двадцати двух переводчиков и консультантов за примерно пятнадцать лет
fact.4.label=Ветхий завет с
fact.4.value=Biblia Hebraica Рудольфа Киттеля, со свитками Мёртвого моря, принятыми во внимание, унаследованной от собственной текстовой основы La Biblia de las Américas
fact.5.label=Новый завет с
fact.5.value=Novum Testamentum Graece Эберхарда Нестле, в целом 27-го издания, с учётом дополнительных рукописных свидетельств там, где они влияют на чтение
fact.6.label=Род перевода
fact.6.value=Формальная эквивалентность, тот же пословный метод, что и у La Biblia de las Américas и New American Standard Bible — не новый перевод, а переработка регистра в привычный, современный испанский, на котором говорят по всей Латинской Америке, с заменой кастильских форм, таких как «vosotros», на «ustedes» и переработкой конструкций, таких как формульное «y» и «sucedió que», которые прежний текст переносил буквально с иврита
fact.7.label=Издан
fact.7.value=Защищён авторским правом в 2005 году The Lockman Foundation; некоторые каталоги с тех пор группируют его вместе с переработкой New American Standard Bible фонда 2020 года, но 2005 год остаётся годом, указанным в его собственном уведомлении об авторском праве
fact.8.label=Лицензия
fact.8.value=Лицензирован, не общественное достояние. До 500 стихов можно цитировать в любой форме без письменного разрешения, при условии, что они не составляют целую библейскую книгу или более четверти цитирующего произведения, с уведомлением об авторском праве, указывающим 2005 год; всё, что превышает это, требует разрешения The Lockman Foundation
fact.9.label=В этом собрании
fact.9.value=Лицензирован, а не общественное достояние, как и [[NASB|New American Standard Bible]] того же фонда. Испанский интерфейс по умолчанию открывается на [[RVR09|Reina Valera 1909]] — свободно копируемом тексте из несвязанной традиции и на столетие более старом, тогда как это издание достигается со своей собственной карточки. В ступенях родословной не записано родителя: это переработка регистра La Biblia de las Américas, которая сама не хранится в этом собрании, так что ступень под стихом NBLA ведёт прямо к полу оригинального языка, отмеченному ≈.
