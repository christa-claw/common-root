title=Palabra de Dios para Ti — Über diese Ausgabe | Common Root
description=Palabra de Dios para Ti: eine 2020 von der Asociación Bíblica Latinoamericana veröffentlichte spanische Übersetzung, die die hebräischen Gottesnamen transliteriert beibehält und frei für jede Nutzung lizenziert ist.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — „das Wort Gottes für dich" — ist eine neue spanische Übersetzung, die 2020 von der Asociación Bíblica Latinoamericana veröffentlicht wurde; ein elektronischer Text erschien 2022 über die Latinamerican Textual Bible Foundation, Inc., eine in Florida eingetragene gemeinnützige Organisation, die ihn auf eBible.org und YouVersion verbreitet. Sie wird den Übersetzern Francisco Liévano und Joyce Liévano zugeschrieben. Anders als die Reina-Valera-Linie, auf die dieses Korpus' spanische Oberfläche standardmäßig öffnet, ist sie keine Revision von Casiodoro de Reinas Übersetzung aus dem 16. Jahrhundert oder von irgendetwas, das davon abstammt; sie ist eine eigenständige Übersetzung, direkt aus den Ausgangssprachen gemacht, an gewöhnliche Leser im spanischsprachigen Amerika gerichtet und dazu bestimmt, frei zitiert zu werden, ohne um Erlaubnis zu fragen.
hero.2=Das Alte Testament folgt der Biblia Hebraica Stuttgartensia, das Neue Testament der 27. Auflage von Eberhard Nestles Novum Testamentum Graece. Eine Entscheidung hebt ihre Seiten von den meisten spanischen Bibeln seit Reina ab: Wo jene das Tetragrammaton mit „Jehová" wiedergeben oder durch „Señor" ersetzen, behält Palabra de Dios para Ti die hebräischen Namen selbst bei, transliteriert — Yavé, ʼElohim, ʼEL-Shadday —, sodass die Genesis, in den eigenen Worten dieser Ausgabe, beginnt: „En un principio ʼElohim creó los cielos y la tierra."
hero.3=In diesem Leser ist sie eine von vier spanischen Ausgaben, neben [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] und [[VBL|Versión Biblia Libre]]. Die Oberfläche öffnet weiterhin standardmäßig die Reina-Valera 1909; dies ist eine Ausgabe, die man über ihre eigene Karte erreicht. Wie die beiden anderen ist sie eine neue Übersetzung und nicht die Revision von etwas, das dieses Korpus sonst führt, sodass für sie keine Vorlage in den Abstammungssprossen verzeichnet ist — eine unter einem ihrer Verse geöffnete Sprosse fällt geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden. Die Asociación Bíblica Latinoamericana gibt auch eine umfangreichere gedruckte Ausgabe mit den deuterokanonischen Büchern heraus; der in diesem Korpus geführte Text ist der übliche sechsundsechzig Bücher umfassende protestantische Kanon.

