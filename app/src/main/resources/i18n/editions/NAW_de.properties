title=Die vierzig Hadithe des an-Nawawi — Über diese Ausgabe | Common Root
description=Die vierzig Hadithe des an-Nawawi: 42 von Imam an-Nawawi ausgewählte Hadithe, jeder als "große Grundlage" (qa'ida azima) der Religion gedacht — das meistgelesene Werk der Vierzig-Hadith-Gattung.
heroHeading=Die vierzig Hadithe des an-Nawawi
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Sharaf an-Nawawi wurde im Monat Muharram 631 AH (Oktober 1233) in Nawa bei Daraa in Syrien geboren und zog mit achtzehn Jahren zum Studium nach Damaskus. 665 AH (1267) wurde er zum Leiter der Ashrafiyya-Dar-al-Hadith in Damaskus bestellt, ein Amt, das er bis zu seinem Tod in Nawa im Jahr 676 AH (1277), Mitte vierzig, behielt; dort wurde er auch bestattet. Als schafiitischer Rechtsgelehrter schrieb er in diesem kurzen Leben zahlreiche Werke, darunter Riyad as-Salihin, einen als Al-Minhaj bekannten Kommentar zu Sahih Muslim, al-Majmu' Sharh al-Muhadhab, Minhaj al-Talibin und Kitab al-Adhkar.
hero.2=Al-Arba'in al-Nawawiyya setzt eine ältere Gattung von "Vierzig-Hadith"-Sammlungen (arba'iniyyat) fort, deren Ausgangspunkt ein Hadith ist, das demjenigen, der vierzig Hadithe der Religion bewahrt, am Jüngsten Tag einen Platz unter den Gelehrten verspricht — ein Hadith, das die meisten Kritiker selbst als da'if (schwach) einstufen. Die erste solche Sammlung, heute verloren, wird Abdullah ibn al-Mubarak (gest. 797) zugeschrieben; viele Gelehrte folgten mit eigenen Sammlungen. An-Nawawi wählte Hadithe aus, die er für sicher hielt, meist aus [[BUK|Sahih al-Bukhari]] und [[MUS|Sahih Muslim]], jedes als das, was er eine "große Grundlage" (qa'ida azima) der Religion nannte — und trotz des Namens enthält die Sammlung heute zweiundvierzig Hadithe. Sie wurde zum meistgelesenen Beispiel dieser Gattung, erhielt Dutzende Kommentare, am bekanntesten Ibn Rajab al-Hanbalis Jami' al-'Ulum wal-Hikam, und zählt zu den meistgelesenen Werken des sunnitischen Islam nach dem Koran selbst.
hero.3=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-nawawi-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]] und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

