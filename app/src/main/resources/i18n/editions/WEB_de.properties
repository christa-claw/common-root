title=World English Bible — Über diese Ausgabe | Common Root
description=Die World English Bible: eine Revision der American Standard Version von 1901 ins heutige Englisch, 1994 von Michael Paul Johnson begonnen, im Neuen Testament dem griechischen Mehrheitstext angeglichen und bewusst gemeinfrei gestellt.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=Die World English Bible verdankt ihr Dasein einem Urheberrechtsproblem. 1994 rechnete Michael Paul Johnson, ein Ingenieur, der die Bibel in den Stunden übersetzte, die ein Ganztagsberuf übrig ließ, aus, wie lange er für eine heutige englische Bibel brauchen würde, die jeder frei kopieren darf — und die Antwort gefiel ihm nicht. Er hörte auf, von Grund auf zu übersetzen, und fing noch einmal bei der American Standard Version von 1901 an: genau, angesehen und, anders als die King-James-Bibel (in England und Wales bis heute durch das Patent der Krone belastet), ganz frei von Urheberrecht. Ein Programm, das er selbst schrieb, ging die ASV nach Wörtern durch, die keine heutige Bibel mehr gebraucht, schlug Ersatz vor und führte die Austausche in etwa fünfzehn Minuten aus. Alles, was das Programm nicht konnte — Wortstellung, Zeichensetzung, Anführungszeichen —, wurde in den folgenden Jahren von Hand gemacht, und der Text erschien, und erschien in Revisionen wieder, von 1997 an.
hero.2=Zwei Dinge trennen sie von der Ausgabe, die sie revidiert. Das erste ist das Griechische. Das Neue Testament der ASV folgte dem kritischen Text der Revisoren, nahe an dem, was die Nestle-Aland-Ausgabe werden sollte; die World English Bible wurde stattdessen dem byzantinischen Mehrheitstext angeglichen und ist damit weder der Text ihrer Stammform noch der Textus Receptus der King-James-Übersetzer. Das zweite ist der Gottesname. Die ASV druckte „Jehovah“; die World English Bible druckt „Yahweh“, mit einer Fußnote zu 1. Mose 2,4, die die Wahl dem Leser erklärt, der „the LORD“ erwartet. Die britische Ausgabe kehrt zu „LORD“ zurück — das Exemplar in diesem Korpus ist das amerikanische, also liest man „Yahweh“. Jenseits dieser beiden Entscheidungen bleibt sie eine formal treue Übersetzung in der Art ihrer Stammform: dieselbe enge Bindung an die hebräische und griechische Wortstellung, in einer Schreibung und Grammatik, die keiner Erläuterung mehr bedürfen.
hero.3=Im Leser ist sie ein Blatt, und das einzige am längsten Ast dieses Korpus. Öffnet man unter einem Vers der World English Bible eine Sprosse, erscheint darunter die American Standard Version, und darunter die Revised Version, die King-James-Bibel und die Genfer Bibel, hinab bis zum Ursprachenboden, der mit ≈ bezeichnet ist. Nichts im Korpus steht seinerseits auf der World English Bible. Sie ist auch der weiteste Text dieses Astes: die American Standard Version hatte keine Apokryphen, also wurden die der World English Bible eigens gemacht, aus den Apokryphen der King-James-Bibel und aus Brentons englischer Septuaginta, und unser Exemplar trägt achtzig Bücher, wo die ASV darunter sechsundsechzig trägt — darunter das 3. und 4. Makkabäerbuch und Psalm 151, die die King-James-Apokryphen nicht haben. Baruch, das sie haben, fehlt in unserem Exemplar. Die Über-Seite lässt die Jahresspalte dieser Ausgabe leer, und zu Recht: ein einzelnes Erscheinungsjahr gibt es nicht. Das Korpus stempelt 2000, damit die Sprossenchips etwas zum Sortieren haben.

