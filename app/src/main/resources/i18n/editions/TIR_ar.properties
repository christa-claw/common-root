fact.1.label=اللغة
fact.1.value=العربية الكلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=أبو عيسى محمد بن عيسى الترمذي (209–279 هـ / 824–892 م)
fact.3.label=الاسم
fact.3.value=يُعرف بجامع الترمذي أو سنن الترمذي؛ واسمه الكامل الجامع المختصر من السنن عن رسول الله ومعرفة الصحيح والمعلول وما عليه العمل
fact.4.label=مكان وزمان التأليف
fact.4.value=جُمع في رحلات عبر خراسان والعراق والحجاز بدأت نحو سنة 235 هـ؛ توفي الترمذي قرب ترمذ سنة 279 هـ (892 م)
fact.5.label=المنهج
fact.5.value=يُبيّن حكمه على كل حديث صريحاً بين صحيح أو حسن أو ضعيف أو غريب ويشرح أسباب الحكم الأضعف، ويبيّن مواضع اختلاف المذاهب الفقهية والأدلة التي يستند إليها كل طرف — بخلاف قبول ما حُكم بصحته التامة فقط، كما يفعل [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]]
fact.6.label=المكانة
fact.6.value=من كتب السنة الستة عند أهل السنة (الكتب الستة)، عادة بعد [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]]؛ ترتيبه الدقيق بين الكتب الباقية، وأيها يشغل المرتبة السادسة، مسألة جدل لا حسم
fact.7.label=عدد الأحاديث
fact.7.value=نحو 4,330 حديثاً بحسب العد التقليدي، ويُذكر في مواضع أخرى بنحو 4,400؛ كما يُوصف بنيانه أيضاً بطرق مختلفة، فيقال 46 كتاباً أو 49 باباً في طبعة أحمد محمد شاكر بالقاهرة أو خمسون باباً
fact.8.label=في هذه المجموعة
fact.8.value=49 كتاباً و3,998 حديثاً مرقَّماً — شكل البيانات المصدرية نفسها، لا استنساخاً لتقليد مطبوع معيّن
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-tirmidhi في fawazahmed0/hadith-api، وتظهر مرافقة تحت العربية؛ ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة منشورة تعود
fact.10.label=الرخصة
fact.10.value=المتن العربي هو النص الكلاسيكي الملك العام؛ أما رخصة الترجمة الإنجليزية فما زالت قيد المراجعة
