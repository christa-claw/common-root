title=جامع الترمذي — عن هذه الطبعة | Common Root
description=جامع الترمذي: مجموعة الأحاديث التي بناها أبو عيسى الترمذي على تقييم صريح لقوة كل رواية وتسجيل الحجج الفقهية التي استخلصها الفقهاء منها — يُحسب من بين كتب السنة الستة عند أهل السنة.
heroHeading=جامع الترمذي
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد أبو عيسى محمد بن عيسى الترمذي نحو سنة 209 هـ (824 م) قرب ترمذ، في خراسان، فيما يقع اليوم على الحدود بين أوزبكستان وأفغانستان. بدأ طلب الحديث في نحو العشرين من عمره، ورحل من سنة 235 هـ عبر خراسان والعراق والحجاز طلباً له، ودرس بصفة أساسية على محمد البخاري — شيخه الأول — وكذلك على مسلم بن الحجاج وأبي داود السجستاني وقتيبة بن سعيد وعلي بن حجر. وكفّ بصره في أواخر حياته، ومن ذلك لُقّب بـ"الضرير". وعاد إلى منطقة ترمذ، حيث توفي في 13 رجب سنة 279 هـ (9 أكتوبر 892 م) عن نحو سبعين عاماً.
hero.2=واسمه الكامل، الجامع المختصر من السنن عن رسول الله ومعرفة الصحيح والمعلول وما عليه العمل، يُختصر عادة إلى جامع الترمذي أو سنن الترمذي. وبخلاف صحيح البخاري وصحيح مسلم، اللذين لا يقبلان إلا ما حكم مؤلفاهما بصحته التامة، كان الترمذي يُبيّن حكمه على كل حديث صريحاً داخل النص نفسه — صحيح أو حسن أو ضعيف أو غريب — ويشرح أسباب الحكم الأضعف بدل حذف الحديث؛ كما بيّن مواضع اختلاف المذاهب الفقهية والأدلة التي استند إليها كل طرف، وهو ما يجعل الكتاب دليلاً على الاستدلال الفقهي بالحديث بقدر ما هو مجموعة أحاديث في ذاته.
hero.3=تضع التقاليد السنية هذا الكتاب بين الكتب الستة، بعد صحيح البخاري وصحيح مسلم وسنن أبي داود عادة؛ أما ترتيبه الدقيق بين الكتب الباقية — وأيّ مجموعة تشغل المرتبة السادسة، وسنن ابن ماجه هو الجواب الشائع لكنه ليس الوحيد الذي طُرح تاريخياً — فمسألة طال فيها الجدل العلمي ولم تُحسم، كما هو شأن مجموعات السنن الأخرى في هذه المجموعة. وعدد الأحاديث المعطى للكتاب يتفاوت للسبب نفسه: نحو 4,330 حديثاً بحسب العد التقليدي، ويُذكر في مواضع أخرى بنحو 4,400؛ كما يُوصف بنيانه بطرق مختلفة، فيقال 46 كتاباً أو 49 باباً في طبعة أحمد محمد شاكر بالقاهرة أو خمسون باباً. ورقم هذه المجموعة نفسها رقم آخر مختلف: 49 كتاباً و3,998 حديثاً مرقَّماً، وهو شكل الطبعة الرقمية التي أُخذ منها لا دعوى باستنساخ تقليد مطبوع معيّن.
hero.4=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-tirmidhi في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في صحيح البخاري وصحيح مسلم وسنن أبي داود وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

