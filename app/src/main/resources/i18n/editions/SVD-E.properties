title=Smith & Van Dyck (eBible text) — About This Edition | Common Root
description=The Smith & Van Dyck Arabic Bible of 1865 in the fully vowelled electronic text that eBible.org publishes as public domain, from the American Bible Society's source file.
heroHeading=Smith & Van Dyck — the fully vowelled text
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=This is the same translation as [[SVD|Smith & Van Dyck]] — the Arabic Bible that Eli Smith began at Beirut and Cornelius Van Dyck finished in 1865, with the Arabic scholars Butrus al-Bustani, Nasif al-Yaziji and Yusuf al-Asir — set from a different electronic file. The translation is the same; the file is the reason this edition exists.
hero.2=A Bible from 1865 is free to anyone, but an electronic copy of it is also somebody's work, and the Van Dyck text circulates on the web in many copies of uncertain origin. Some are offered with a claim of copyright over the transcription itself. A text whose origin cannot be traced cannot be printed with confidence, so this edition uses a copy whose origin can: the one eBible.org publishes, declared public domain, naming the Syrian Mission as the translator and the American Bible Society as the contributor of the source. The file is dated 2020-08-03.
hero.3=It is fully vowelled. Every word carries its short vowels and the other reading marks, where the other Van Dyck text in this reader is largely unmarked. That makes it slower to set and easier to read aloud, and a vowelled page wants more space between the lines, so a printed copy of this edition runs longer than the same text unvowelled would.
hero.4=It is the edition to choose when the question is whether the text may be printed. For reading on screen, either Van Dyck serves.

