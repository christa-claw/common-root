# The narrative, one paragraph per key, in order.
hero.1=Nimi on kaksi vuosilukua, koska kirja saapui kahdessa osassa. Suomen evankelis-luterilainen kirkko hyväksyi Vanhan testamentin vuonna 1933 ja Uuden testamentin vuonna 1938, ja suomeksi sitä on siitä lähtien kutsuttu vuosien 1933/38 kirkkoraamatuksi. Nuo loppupään vuosiluvut kätkevät sen, kuinka kaukana alku oli: käännöskomitea oli asetettu jo 1861. Noin seitsemänkymmentä vuotta ja useampi kääntäjäpolvi erottaa toimeksiannon valmiista Raamatusta.
hero.2=Komitea tuotti uuden käännöksen eikä tarkistusta. Se työsti Vanhan testamentin hepreasta ja Uuden kreikasta — ei latinalaisten, saksalaisten tai ruotsalaisten välikäsien kautta eikä jo käytössä olleesta suomalaisesta Raamatusta. Silti se oli tietoisesti tuon Raamatun seuraaja, vuoden 1776 Biblian, joka oli ollut kirkon teksti puolitoista vuosisataa, ja se säilytti paljon vanhemman kirjan sanastoa ja poljentoa. Tuo perintö on syy siihen, että vuonna 1938 valmistunut Raamattu kuulosti jo ensimmäisistä lukijoistaan vanhahtavalta, ja siihen että se yhä kantaa suomalaisen pyhän kirjan juhlavaa rekisteriä. Se pysyi virallisena kirkkoraamattuna vuoteen 1992.
hero.3=Tässä lukijassa sillä on kaksi tehtävää. Aseta käyttöliittymä suomeksi, ja tämä laitos avautuu — luettelon oma järjestys antaisi sinulle Biblia 1776:n, joten suomalainen oletus on tietoinen valinta eikä aakkosten sattuma. Se on myös suomalaisen sukuketjun ylin askelma. Avaa yksi askelma KR3338-jakeen alta, ja Biblia 1776 ilmestyy; lue tuo askelma saman kirkon Raamatun seuraantona eikä lähteenä, sillä vuosien 1933/38 kääntäjillä oli edessään heprea ja kreikka eikä vuoden 1776 teksti. Sen alapuolella ketju jatkuu vuoden 1642 Bibliaan, edelleen Agricolan vuoden 1548 suomeen ja Lutherin vuoden 1545 saksaan, ennen kuin se saavuttaa alkukielet.

