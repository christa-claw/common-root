title=Kirkkoraamattu 1933/38 — Tietoja tästä laitoksesta | Common Root
description=Kirkkoraamattu 1933/38: Suomen kirkkoraamattu, käännetty uudelleen hepreasta ja kreikasta ja hyväksytty kahdessa osassa vuosina 1933 ja 1938, kun komitea oli työskennellyt sen parissa noin seitsemänkymmentä vuotta.
heroHeading=Kirkkoraamattu 1933/38
