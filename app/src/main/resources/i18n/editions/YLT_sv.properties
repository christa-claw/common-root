fact.2.value=Robert Young (1822–1888), boktryckare, bokhandlare och självlärd språkman i Edinburgh, sammanställare av Analytical Concordance to the Bible
fact.3.label=Gamla testamentet från
fact.3.value=Den mottagna masoretiska hebreiska texten — den tradition som också [[WLC|Leningradkodexen]] i detta korpus tillhör
fact.4.label=Nya testamentet från
fact.4.value=Den grekiska mottagna texten, [[TR|Textus Receptus]] — behållen, skrev Young, ”inte för att den anses fullkomlig”, utan för att översättning och textkritik är skilda uppgifter
fact.5.label=Typ av översättning
fact.5.value=Strängt ordagrann: originalets tempus behållna även där engelskan låter underlig, så att berättelsen ofta löper i presens; ett engelskt ord för varje ord i originalet så långt det går, så att olam och aiōn blir ”age” och ”age-during”; ord tillagda för meningens skull inom hakparentes; gudsnamnet som ”Jehovah”
fact.6.label=Utgiven
fact.6.value=Edinburgh, 1862; reviderad av Young, 1887; tredje utgåvan, reviderad på nytt av hans förläggare, Edinburgh, januari 1898 — den text som finns här
fact.7.label=Licens
fact.7.value=I det fria; denna kopia från eBible.org
fact.8.label=I detta korpus
fact.8.value=66 böcker, den protestantiska kanon i sin helhet, utan apokryferna; engelsk kapitel- och versindelning, så att psalmerna är 150 och varje psalms överskrift löper in i dess första vers
fact.9.label=Härstamning
fact.9.value=Ingen noterad förlaga och inget noterat som står på den — en stegpinne öppnar rakt på grundspråksgolvet, [[WLC|Leningradkodexen]] i Gamla testamentet och [[TR|Textus Receptus]] i Nya; [[LSV|Literal Standard Version]] från 2020 reviderar Youngs arbete, men korpuset noterar inte länken
