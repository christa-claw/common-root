title=Young's Literal Translation — Om denna utgåva | Common Root
description=Robert Youngs ordagranna bibelöversättning, först utgiven i Edinburgh 1862, reviderad av Young 1887 och av hans förläggare 1898 — en engelsk bibel som behåller hebreiskans och grekiskans tempus, ordföljd och så långt det går ordförråd, också där engelskan knappt hänger med.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) var boktryckare och bokhandlare i Edinburgh. Han lärde sig på egen hand hebreiska och flera andra österländska språk under sin lärlingstid som tryckare, ledde ett missionstryckeri i Surat i Indien 1856–1861 och är framför allt ihågkommen för två böcker: konkordansen Analytical Concordance to the Bible och denna översättning. Han gav ut Literal Translation i Edinburgh 1862 och en reviderad utgåva 1887. Tio år efter hans död, i januari 1898, gav hans förläggare ut en tredje utgåva, ännu en gång reviderad ”efter dess nuvarande linjer”; det är den texten som finns i detta korpus. Young översatte Gamla testamentet från den mottagna masoretiska hebreiska texten och Nya testamentet från den grekiska mottagna texten, Textus Receptus, och sade rent ut att han inte tänkte skapa en ny text av någondera: översättning, skrev han, är en annan uppgift än textkritik, och få är kvalificerade för båda.
hero.2=Hela syftet är att låta en engelsk läsare se originalets grammatik. Young menade att en översättning som ger presens där originalet har preteritum, eller ”an a for a the”, obestämd artikel i stället för bestämd, sätter ordinspirationen åt sidan, och han översatte därefter. De hebreiska verbformerna kommer fram som engelska tempus, så berättelsen löper ofta i presens: Första Moseboken börjar ”In the beginning of God's preparing the heavens and the earth —” och fortsätter ”and God saith, ‘Let light be;’ and light is.” Ord som lagts till för meningens skull står inom hakparentes: ”Jehovah [is] my shepherd, I do not lack.” Han försökte ge varje hebreiskt eller grekiskt ord en enda engelsk motsvarighet där han kunde, och därför blir hebreiskans olam och grekiskans aiōn ”age” och ”age-during” i stället för ”ever” och ”eternal”; i Matteus 25:46 går de rättfärdiga bort ”to life age-during”. Gudsnamnet står genom hela Gamla testamentet som ”Jehovah”.
hero.3=Vår kopia är fullständig: 66 böcker, från Första Moseboken till Uppenbarelseboken, utan apokryferna, i engelsk kapitel- och versindelning — 150 psalmer, där varje psalms överskrift löper in i dess första vers, och Malaki som slutar med kapitel 4. Som översättning av den mottagna texten har den med de ställen som senare textkritiska utgåvor ifrågasätter, från Markus längre slut till de tre vittnena i himlen i Första Johannesbrevet 5:7, som denna text sätter inom hakparentes, liksom hela Apostlagärningarna 8:37. I denna läsare står den för sig själv. Korpuset har ingen förlaga noterad för den, så en härstamningens stegpinne öppnad under en av dess verser faller rakt ned på grundspråksgolvet märkt med ≈: Leningradkodexen i Gamla testamentet och Textus Receptus i Nya. Det golvet ligger nära det Young själv översatte, den masoretiska hebreiskan och den mottagna grekiskan, om än inte i samma tryck. Ingenting är heller noterat som stående på den. Literal Standard Version från 2020, också den i detta korpus, presenterar sig som en genomgripande revidering av Youngs arbete, men korpuset noterar inte den länken, så stegpinnarna under LSV leder inte hit. Inget gränssnittsspråk öppnar på denna utgåva; ett engelskt gränssnitt öppnar på New International Version, och denna nås från sitt eget kort i översättningsrutnätet.

