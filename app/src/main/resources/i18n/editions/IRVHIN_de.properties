title=Indische Revidierte Version — Über diese Ausgabe | Common Root
description=Die Indische Revidierte Version (IRV): eine 2019 erschienene Hindi-Bibelübersetzung von Bridge Connectivity Solutions, lizenziert unter CC BY-SA 4.0 — der Hindi-Text, mit dem dieses Korpus standardmäßig geöffnet wird.
heroHeading=Indische Revidierte Version
readerHref=/reader?c1.src=irvhin

hero.1=Die Indische Revidierte Version ist eine moderne Hindi-Übersetzung der Bibel, deren Urheberrecht aus den Jahren 2017 und 2019 bei Bridge Connectivity Solutions Pvt. Ltd. liegt, einer indischen Organisation für Bibelübersetzung und Technologie. Sie gehört zu einer breiteren Reihe "Indische Revidierte Version", die derselbe Verlag parallel in mehreren anderen großen Sprachen Indiens herausgebracht hat — darunter Kannada, Tamil, Telugu und Assamesisch —, jede eine vollständige Bibel in ihrer eigenen Schrift, veröffentlicht unter derselben offenen Lizenz.
hero.2=Der Text von Common Root stammt aus der USFM-Distribution der Hindi-IRV von eBible.org, dort katalogisiert als hin2017, und nicht aus einer früheren digitalen Kopie derselben Übersetzung, die mit Fußnotentext kursierte, der direkt in die Verse eingefügt war, und mit Buchnamen auf Hindi statt auf Englisch. Ein erneuter Import aus dieser USFM-Quelle behob beide Probleme, bevor diese Ausgabe hier aufgenommen wurde — dieses Korpus hält Buchnamen intern in allen seinen Ausgaben auf Englisch, unabhängig von der eigenen Sprache der Bibel.
hero.3=Sie ist hier in Devanagari-Schrift geschrieben, als इंडियन रिवाइज़्ड वर्ज़न, und enthält den üblichen protestantischen Kanon von 66 Büchern, ohne deuterokanonische Bücher.
hero.4=Sie ist die einzige Hindi-Bibel in diesem Korpus, sodass eine Hindi-Oberfläche standardmäßig mit ihr öffnet.

