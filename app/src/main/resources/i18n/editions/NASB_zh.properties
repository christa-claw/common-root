title=New American Standard Bible 2020 — 关于本译本 | Common Root
description=新美国标准圣经:洛克曼基金会对美国标准译本逐字直译传统的延续,依据希伯来文、亚兰文和希腊文重新翻译而成,现为2020年版本。
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=新美国标准圣经最初是有意延续,而非全新项目。洛克曼基金会是总部位于加利福尼亚州拉哈布拉的非营利机构,于1959年启动此项工作,旨在延续1901年美国标准译本——保持其对希伯来文、亚兰文和希腊文逐字直译的忠实声誉,同时使其陈旧的英语现代化。基金会组建了一个由基督教学院、神学院的学者组成的委员会,主要来自保守福音派教派,译本分阶段问世:1960年出版《约翰福音》,1962年出版其余福音书,1963年出版新约全书,1968年单独出版《诗篇》,1971年出版整本圣经。这部最初的完整版本旧约部分依据鲁道夫·基特尔的《希伯来圣经》第三版,并参考死海古卷,新约部分依据内斯特勒与阿兰德的《新约希腊文本》第23版。
hero.2=自第一版问世后,修订工作持续了数十年。1972年、1973年和1975年陆续进行了小幅措辞修改,1977年进行了较大幅度的修订,1992年又进行了一次有限的修订。1995年,基金会出版了《更新版》——即NASB95,大多数人单说"NASB"时指的就是这个版本——参考了《斯图加特希伯来圣经》和内斯特勒-阿兰德第26版。现行文本是2020年版,其部分内容已于2018年开始在网上发布:旧约文本基础转为《斯图加特希伯来圣经》,其所涵盖的书卷则采用更新的《昆塔希伯来圣经》,并在影响释读之处参考了《七十士译本》、死海古卷、塔古姆译本及其他古代译本,而新约现在依据内斯特勒-阿兰德第28版,并辅以《批评大全本》更丰富的希腊文抄本证据。译者宣称的方法在每次修订中始终如一:在英语允许的范围内尽可能逐字翻译原文,若严格的逐字翻译会造成误导或读起来不自然,则选用更清晰的说法,并将更逐字的译法注于脚注——这一原则常被认为是本译本成为二十、二十一世纪广泛使用的英语译本中最为直译的版本之一的原因。
hero.3=尽管名称上及声明上承袭于美国标准译本,新美国标准圣经实际上是依据原文重新翻译的译本,而非对其逐行修订而成,因此语料库中未为其记录母本:在NASB经文下展开谱系阶梯,会直通标记为≈的原文底线,与新国际版的情形完全相同。这两个译本的共同之处不止于此——二者均为授权使用而非公共领域,与同一书架上可自由复制的英语版本不同,尽管英语界面默认打开的是新国际版,新美国标准圣经则需从译本网格中自己的卡片进入。

fact.1.label=语言
fact.1.value=英语
fact.2.label=受命缘起
fact.2.value=加利福尼亚州拉哈布拉的洛克曼基金会,该基金会于1959年发起此项目,作为美国标准译本逐字翻译传统的延续
fact.3.label=编译者
fact.3.value=由基金会资助的翻译委员会,成员为来自基督教学院和神学院的学者,主要来自保守福音派教派
fact.4.label=旧约据
fact.4.value=1971年原版依据鲁道夫·基特尔的《希伯来圣经》(第三版)及死海古卷;1995年修订版依据《斯图加特希伯来圣经》;2020年版文本依据《斯图加特希伯来圣经》,并在可获得之处采用更新的《昆塔希伯来圣经》,同时参考了《七十士译本》、死海古卷、塔古姆译本及其他古代译本
fact.5.label=新约据
fact.5.value=1971年原版依据内斯特勒与阿兰德《新约希腊文本》第23版;1995年修订版依据第26版;2020年版文本依据第28版(NA28),并辅以《批评大全本》的希腊文抄本证据
fact.6.label=翻译取向
fact.6.value=形式对应——在可读英语允许的范围内尽可能逐字依据原文翻译,凡选用更清晰说法之处,均将更逐字的译法注于脚注;尽管承袭美国标准译本的方法,本译本仍是依据希伯来文、亚兰文和希腊文的重新翻译,而非对早期英语圣经的修订
fact.7.label=出版
fact.7.value=1960年出版《约翰福音》,1962年出版福音书,1963年出版新约,1968年出版《诗篇》,1971年出版整本圣经,1972年、1973年和1975年进行小幅文本修改,1977年进行大幅修订,1992年进行有限修订,1995年出版《更新版》(NASB95),现行2020年版文本部分内容自2018年起在网上发布
fact.8.label=授权
fact.8.value=已授权使用,非公共领域。引用不超过1,000节经文、且不构成完整的一卷圣经书或超过引用作品一半内容者,无需书面许可即可以任何形式引用,但须附上标明1960、1971、1977、1995和2020年份的版权声明;超出此范围需洛克曼基金会许可
fact.9.label=在本语料库中
fact.9.value=与[[NIV|新国际版]]一样为授权使用而非公共领域——英语界面默认打开该译本,本译本则需从自己的卡片进入。谱系阶梯中未记录母本:尽管基金会将本项目描述为[[ASV|美国标准译本]]逐字直译传统的延续,它实际上是依据希伯来文、亚兰文和希腊文重新翻译的译本,而非对本语料库中任何英语文本的修订,因此NASB经文下的阶梯会直通标记为≈的原文底线
