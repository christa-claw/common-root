title=Bible d'Ostervald (français) — À propos de cette édition | Common Root
description=La Bible d'Ostervald : la révision, par un pasteur de Neuchâtel, de la Bible protestante française de Genève, parue pour la première fois en 1744, ici dans une révision ultérieure à l'orthographe moderne.
heroHeading=Bible d'Ostervald
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald est né à Neuchâtel en 1663 et y est mort en 1747. Consacré au ministère dans sa ville natale en 1683, il passa l'essentiel de sa vie au service de son Église, d'abord comme diacre puis, à partir de 1699, comme pasteur, tout en enseignant la théologie. Sa Bible n'est pas une traduction nouvelle à partir de l'hébreu et du grec, mais une révision de la Bible protestante française de Genève, la version que lisaient les Églises réformées de langue française depuis le XVIe siècle. Le texte révisé par Ostervald parut pour la première fois en 1744, trois ans avant sa mort, et fut réimprimé et révisé pendant plus de deux siècles ; il était aussi bien connu en Grande-Bretagne.
hero.2=Le texte de ce corpus n'est pas le français de 1744. Le XVIIIe siècle écrivait « étoit » là où le français moderne écrit « était » ; cette copie porte « était » partout et « étoit » pas une seule fois : elle provient donc de l'une des révisions ultérieures qui ont gardé le nom d'Ostervald. La plus connue est la révision publiée par la Société biblique de France en 1881, dont le Nouveau Testament est l'œuvre de Ch. L. Frossard, et ce texte a encore été mis à jour en 1996. eBible.org, d'où vient cette copie, ne nomme qu'« Ostervald », sans la révision, et cette page n'en nomme donc aucune. Quelques traits se voient presque à chaque page. Le nom divin est « l'Éternel », comme chez Segond et dans la Darby française : « L'Éternel est mon berger; je n'aurai point de disette » au Psaume 23. Ésaïe 7:14 garde « la vierge sera enceinte » — la vierge — là où Segond a la jeune fille. Et le Nouveau Testament garde des leçons du Textus Receptus que les éditions critiques suppriment : 1 Jean 5:7 porte les trois témoins célestes, « le Père, la Parole, et le Saint-Esprit », qui manquent à la Segond voisine.
hero.3=Dans ce lecteur, elle est l'une des trois bibles françaises, à côté de la Segond et de la Darby française. Une interface en français ne s'ouvre pas sur elle : le français n'a pas de choix curaté, si bien que le lecteur prend la première bible française dans l'ordre du catalogue, qui est la Darby. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation — la Bible de Genève qu'elle révise n'est pas dans ce corpus —, si bien qu'un échelon ouvert sous un verset descend droit au sol des langues originales marqué d'un ≈ : pour l'Ancien Testament le Codex de Léningrad, et pour le Nouveau le Textus Receptus, la tradition grecque que cette Bible suit réellement. Sa pastille d'échelon porte l'année 1744, celle de la révision d'Ostervald lui-même et non celle du texte affiché. Ouvrez-la à côté de la Segond pour voir deux siècles de langue biblique protestante française côte à côte.

