title=Bible synodale — À propos de cette édition | Common Root
description=La Bible synodale russe de 1876 : commencée en 1813 par la Société biblique russe, achevée par les quatre académies théologiques orthodoxes sous la direction du métropolite Philarète, et encore aujourd'hui la Bible que la plupart des russophones désignent simplement par « la Bible ».
heroHeading=Bible synodale
readerHref=/reader?c1.src=syn

hero.1=Le projet commence en 1813, lorsque la Société biblique russe, tout juste fondée, entreprend avec le soutien du tsar Alexandre Ier une traduction en russe destinée à se tenir aux côtés de la Bible slavonne d'Église, non à la remplacer. Un Nouveau Testament paraît en quelques années. Le clergé conservateur voit dans une Bible en russe parlé une menace pour l'autorité du texte slavon, et en 1826 Nicolas Ier dissout la Société et arrête le travail pour trois décennies.
hero.2=La traduction ne reprend que sous Alexandre II. En 1858, le Saint-Synode autorise une nouvelle version russe et en confie la tâche aux académies théologiques de Moscou, Saint-Pétersbourg, Kazan et Kiev, le métropolite Philarète (Drozdov) de Moscou en assurant la direction et la révision finale. Le Nouveau Testament, traduit du texte grec imprimé connu sous le nom de Textus Receptus, paraît en 1862. L'Ancien Testament pose la question la plus difficile à trancher : Philarète insiste pour remonter, au-delà du texte slavon, à l'hébreu lui-même, ce à quoi s'opposent ceux qui tiennent au fondement grec du texte slavon, et l'autorisation formelle du Synode de traduire à partir du texte massorétique ne vient qu'en cette même année 1862 — alors que l'essentiel de l'Ancien Testament était déjà traduit sur cette base.
hero.3=La Bible complète — Ancien et Nouveau Testament réunis pour la première fois sous une même couverture dans ce russe nouveau et non en slavon d'Église — paraît en 1876, à l'Imprimerie synodale, d'où vient le nom usuel de la traduction. Son Ancien Testament n'en ressort pas purement hébraïque : là où la Septante que conservait la tradition slavonne s'écartait du texte massorétique, la leçon grecque était souvent gardée tout de même, généralement comme variante entre parenthèses, si bien que le livre achevé conserve une véritable dette envers la Bible grecque qui se tenait derrière l'ancien texte slavon.
hero.4=Elle n'a plus eu de rivale sérieuse depuis. Lecteurs orthodoxes, catholiques, baptistes et d'autres confessions protestantes en Russie recourent tous, sous une forme ou une autre, au même texte, et son style a marqué le russe littéraire autant que la Bible du roi Jacques a marqué l'anglais. Dans ce corpus, elle compte 66 livres, le canon protestant et non le canon orthodoxe plus large, et c'est la seule Bible russe ici, de sorte qu'une interface en russe s'ouvre sur elle.

