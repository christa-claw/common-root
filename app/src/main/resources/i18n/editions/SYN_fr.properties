fact.13.label=Audio
fact.13.value=La Bible complète — chaque chapitre des deux Testaments — lue par la voix neuronale de synthèse vocale Microsoft Azure ru-RU-DmitryNeural, synthétisée chapitre par chapitre plutôt que verset par verset, afin que la prose garde son rythme de phrase naturel.
fact.14.label=Limites de l'audio
fact.14.value=Génération automatique et non lecture humaine : la prononciation des noms et des termes n'a donc pas été vérifiée par un éditeur ; la ligne de lecture suit le texte et ne surligne chaque verset qu'en mode d'affichage « Versets » — dans les autres modes, l'audio continue de jouer, simplement sans surlignage.
