title=ジャーミウ・アッ=ティルミズィー — この版について | Common Root
description=ジャーミウ・アッ=ティルミズィー——アブー・イーサー・アッ=ティルミズィーが、各伝承の強さを公然と等級づけ、そこから法学者が引き出した法学上の論争を記録して編んだハディース集。スンニ派イスラームの六書の一つに数えられる。
heroHeading=ジャーミウ・アッ=ティルミズィー
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=アブー・イーサー・ムハンマド・イブン・イーサー・アッ=ティルミズィーは、ヒジュラ暦209年（西暦824年）頃、ホラーサーン地方のテルメズ近郊（現在のウズベキスタンとアフガニスタンの国境地帯）に生まれた。二十歳頃にハディースの学習を始め、ヒジュラ暦235年からはそれを求めてホラーサーン、イラク、ヒジャーズを遍歴し、主にムハンマド・アル=ブハーリー——彼の主たる師——のもとで学び、またムスリム・イブン・アル=ハッジャージュ、アブー・ダーウード・アッ=シジスターニー、クタイバ・イブン・サイード、アリー・イブン・フジュルのもとでも学んだ。晩年に失明し、これが彼の異名「アッ=ダリール」（「盲目の者」）の由来となった。テルメズ近郊に戻り、ヒジュラ暦279年ラジャブ月13日（西暦892年10月9日）に七十歳ほどで没した。
hero.2=彼の正式な書名、アル=ジャーミウ・アル=ムフタサル・ミン・アッ=スナン・アン・ラスール・アッラー・ワ・マアリファト・アッ=サヒーフ・ワル=マアルール・ワ・マー・アライヒ・アル=アマルは、通常ジャーミウ・アッ=ティルミズィーまたはスナン・アッ=ティルミズィーと略される。サヒーフ・アル=ブハーリーやサヒーフ・ムスリムが、編者が完全に真正と判断したハディースのみを採録するのに対し、アッ=ティルミズィーは本文そのものの中で各ハディースを公然と等級づけた——サヒーフ、ハサン、ダイーフ、ガリーブ——とし、ハディースを省くのではなく弱い評価の根拠を説明した。彼はまた、法学諸派（マダーヒブ）がどこで見解を分かち、各派がいかなる証拠に拠ったかを示しており、これにより本書はハディース集そのものであると同時に、ハディースに基づく法学的推論の手引きともなっている。
hero.3=スンニ派の伝統ではこれを六書の一つとし、通常サヒーフ・アル=ブハーリー、サヒーフ・ムスリム、スナン・アブー・ダーウードに次ぐものとされる。残る書物の中で正確にどこに位置づけられるか——また第六の席をどの書が占めるか、スナン・イブン・マージャが一般的だが歴史上唯一の答えではない——は長く論じられてきたが決着しておらず、このコーパスに収められた他のスナン諸書についても同様である。この書物に挙げられるハディースの数も同じ理由で一定しない。伝統的な数え方では約4,330件とされ、他では約4,400件とも言われる。その構成についても、46巻、アフマド・ムハンマド・シャーキルによるカイロ版の49章、あるいは五十章と、様々に記述される。このコーパス自身の数はまた別の数である——49巻・3,998件の番号付きハディース。これはこの数が取られたデジタル版そのものの形であって、特定の印刷の伝統を再現するという主張ではない。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-tirmidhi 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスがサヒーフ・アル=ブハーリー、サヒーフ・ムスリム、スナン・アブー・ダーウード、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

