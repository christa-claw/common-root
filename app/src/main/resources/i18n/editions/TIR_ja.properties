fact.2.label=編纂者
fact.2.value=アブー・イーサー・ムハンマド・イブン・イーサー・アッ=ティルミズィー（ヒジュラ暦209–279年 / 西暦824–892年）
fact.3.label=名称
fact.3.value=ジャーミウ・アッ=ティルミズィーまたはスナン・アッ=ティルミズィーとして知られる。正式な書名はアル=ジャーミウ・アル=ムフタサル・ミン・アッ=スナン・アン・ラスール・アッラー・ワ・マアリファト・アッ=サヒーフ・ワル=マアルール・ワ・マー・アライヒ・アル=アマル
fact.4.label=編纂地と時期
fact.4.value=ホラーサーン、イラク、ヒジャーズを巡る旅の中で集められ、その旅はヒジュラ暦235年頃に始まった。アッ=ティルミズィーはヒジュラ暦279年（西暦892年）、テルメズ近郊で没した
fact.5.label=方法
fact.5.value=本文の中で各ハディースをサヒーフ、ハサン、ダイーフ、ガリーブと公然と等級づけ、弱い評価の根拠を説明する。また法学諸派がどこで見解を分かち、各派がいかなる証拠に拠ったかを示す——[[BUK|サヒーフ・アル=ブハーリー]]や[[MUS|サヒーフ・ムスリム]]のように完全に真正と判断したハディースのみを採録するのではなく
fact.6.label=位置づけ
fact.6.value=[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]に次ぐ、スンニ派イスラームの六書（クトゥブ・スィッタ）の一つとされる。残る書物の中での正確な位置づけ、および第六の席をどの書が占めるかは論争中であり決着していない
fact.7.label=ハディースの数
fact.7.value=伝統的な数え方では約4,330件、他では約4,400件とも言われる。その構成も同様に様々に記述される——46巻、アフマド・ムハンマド・シャーキルによるカイロ版の49章、あるいは五十章
fact.8.label=このコーパスでは
fact.8.value=49巻・3,998件の番号付きハディース——これは元データそのものの形であって、特定の印刷の伝統の再現ではない
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-tirmidhi 版から取られ、アラビア語の下に並置の形で示される。どの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語のマトンは古典的なパブリックドメインの本文である。英訳のライセンスはまだ確認中である
