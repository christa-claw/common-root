title=レイナ・バレラ1909 — この版について | Common Root
description=レイナ・バレラ1909。カシオドロ・デ・レイナの1569年のスペイン語を、シプリアーノ・デ・バレラが1602年に改訂した姿のまま二十世紀へ運んだ改訂版であり、このリーダーがスペイン語に対して開く版である。
heroHeading=レイナ・バレラ1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=スペイン語のプロテスタント聖書は、まれなほどの度合いで一冊の書物である。異端審問を前にスペインを去ったカシオドロ・デ・レイナは、亡命の地で翻訳を仕上げ、1569年にバーゼルで刊行した — 扉の熊にちなんで『熊の聖書』と呼ばれる本である。セビーリャ郊外の同じ修道院にいて、同じ脱出をしたシプリアーノ・デ・バレラは、何年もかけてそれを見直し、その成果を1602年にアムステルダムで出した。『水瓶の聖書』である。以後のレイナ・バレラはすべて、その改訂の改訂であり、ハイフンでつないだ一つの名が、同じ部屋で働いたことのない二人を記念しているのはそのためである。
hero.2=これは1909年の改訂版で、英国外国聖書協会とアメリカ聖書協会のもとで準備され、使い続けた人々からはおおむね Versión Antigua、すなわち「古い版」と呼ばれてきた。これに先立つ改訂は1862年のもので、この版は、改訂が普通いちばん手を入れるところにこそ控えめである。レイナとバレラが追いにくくなっていたところでは語を前へ進め、そうでないところはそのままにしてある。旧約はマソラ本文のヘブライ語の上に、新約はテクストゥス・レセプトゥスの上に立つ。レイナのものがそうであったのと同じである。
hero.3=五十年ほどのあいだ、スペイン語圏のプロテスタント世界をほとんど独り占めにし、1960年の改訂版に取って代わられるまで続いた。そして完全に消えたことは一度もない。著作権が切れており、1960年の版はそうではない。だから、誰の許可も要らずに印刷され、ネットに載せられ、引用されるレイナ・バレラとは、この版のことである。本文の全体がこのコーパスに収まり、またそこから写し出せるのも、同じ理由による。
hero.4=このリーダーではスペイン語に五つの聖書があり、インターフェースが開くのはこの版である。これはカタログの偶然ではなく、選び取られた結果である。その言語にある唯一の聖書が開かれるアラビア語や中国語とは違い、スペイン語には他の選択肢があり、この版はその中から選ばれた。系譜の段には典拠が記録されていないため、節の下に開いた段は ≈ で印された原語の底面へまっすぐ落ちる。その底面は、ここでは常より近いところに落ちる — アラビア語聖書と同じ理由による。底面が差し出すギリシャ語はテクストゥス・レセプトゥスであり、レイナの新約はまさにテクストゥス・レセプトゥスから作られたからである。

