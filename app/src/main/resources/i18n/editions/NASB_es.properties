title=New American Standard Bible 2020 — Acerca de esta edición | Common Root
description=La New American Standard Bible: la propia continuación de la Fundación Lockman de la literalidad palabra por palabra de la American Standard Version, traducida de nuevo del hebreo, el arameo y el griego, y ahora en su texto de 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=La New American Standard Bible comenzó como una continuación deliberada, no como un proyecto completamente nuevo. La Fundación Lockman, una organización sin fines de lucro con sede en La Habra, California, inició el trabajo en 1959 para llevar adelante la American Standard Version de 1901 — conservando su fama de fidelidad literal y palabra por palabra al hebreo, el arameo y el griego, mientras modernizaba su inglés anticuado. La Fundación reunió un comité de estudiosos procedentes de universidades y seminarios cristianos y, en su mayoría, de denominaciones evangélicas conservadoras, y la traducción apareció por etapas: el Evangelio de Juan en 1960, los demás Evangelios en 1962, el Nuevo Testamento completo en 1963, los Salmos por separado en 1968, y la Biblia entera en 1971. Esa primera edición completa se basó, para el Antiguo Testamento, en la tercera edición de la Biblia Hebraica de Rudolf Kittel, con los Rollos del Mar Muerto consultados, y para el Nuevo Testamento, en la 23.ª edición del Novum Testamentum Graece de Nestle y Aland.
hero.2=La revisión continuó durante décadas después de esa primera impresión. Siguieron cambios menores de redacción en 1972, 1973 y 1975, luego una revisión más sustancial en 1977 y otra más limitada en 1992. En 1995 la Fundación publicó la Updated Edition — la NASB95, el texto que la mayoría tiene en mente al decir simplemente «la NASB» — consultando la Biblia Hebraica Stuttgartensia y la 26.ª edición de Nestle-Aland. El texto actual es la actualización de 2020, partes de la cual ya habían empezado a aparecer en línea en 2018: trasladó la base textual del Antiguo Testamento a la Biblia Hebraica Stuttgartensia y, para los libros que cubre, a la más reciente Biblia Hebraica Quinta, consultando la Septuaginta, los Rollos del Mar Muerto, los Targumim y otras versiones antiguas donde inciden en una lectura, mientras que el Nuevo Testamento sigue ahora la 28.ª edición de Nestle-Aland, complementada con el aparato más amplio de evidencia de manuscritos griegos de la Editio Critica Maior. El método declarado de los traductores se mantuvo igual en cada revisión: verter el original con toda la literalidad que permita un inglés legible, y donde una traducción estrictamente literal pudiera engañar o leerse de forma antinatural, elegir el modismo más claro y anotar en una nota al pie la redacción más literal — una disciplina que suele citarse como la razón de que esta sea una de las más literales entre las traducciones inglesas de amplio uso de los siglos XX y XXI.
hero.3=A pesar de su nombre y de su deuda declarada con la American Standard Version, la New American Standard Bible es una traducción nueva a partir de los idiomas originales y no una revisión línea por línea de aquella, y por ello el corpus no registra ningún padre para ella: al abrir un peldaño de linaje bajo un versículo de la NASB se va directamente al suelo de la lengua original, marcado con ≈, exactamente igual que para la New International Version. Ambas comparten algo más que esa forma — las dos están licenciadas y no son de dominio público, lo que las distingue de las ediciones inglesas de libre copia en el mismo estante, aunque una interfaz en inglés se abre de forma predeterminada en la New International Version, mientras que la New American Standard Bible se alcanza desde su propia tarjeta en la cuadrícula de traducciones.

