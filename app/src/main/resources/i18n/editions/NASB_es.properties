fact.2.value=Por la Fundación Lockman, de La Habra, California, que inició el proyecto en 1959 como continuación de la tradición de traducción literal de la American Standard Version
fact.3.label=Hecha por
fact.3.value=Un comité de traducción financiado por la Fundación, con estudiosos de universidades y seminarios cristianos y, en su mayoría, de denominaciones evangélicas conservadoras
fact.4.label=Antiguo Testamento de
fact.4.value=La Biblia Hebraica de Rudolf Kittel (3.ª edición) y los Rollos del Mar Muerto para la edición original de 1971; la Biblia Hebraica Stuttgartensia desde la revisión de 1995; el texto de 2020 cita la Biblia Hebraica Stuttgartensia y, donde está disponible, la más reciente Biblia Hebraica Quinta, con la Septuaginta, los Rollos del Mar Muerto, los Targumim y otras versiones antiguas consultadas
fact.5.label=Nuevo Testamento de
fact.5.value=El Novum Testamentum Graece de Nestle y Aland, 23.ª edición, para la edición original de 1971; la 26.ª edición desde la revisión de 1995; la 28.ª edición (NA28) para el texto de 2020, complementada con el aparato de evidencia de manuscritos griegos de la Editio Critica Maior
fact.6.label=Clase de traducción
fact.6.value=Equivalencia formal — traducida con toda la literalidad de los idiomas originales que permite un inglés legible, con la redacción más literal anotada al pie donde se eligió en su lugar un modismo más claro; una traducción nueva del hebreo, el arameo y el griego, no una revisión de una Biblia inglesa anterior, a pesar de sus raíces en el enfoque de la American Standard Version
fact.7.label=Publicada
fact.7.value=El Evangelio de Juan en 1960, los Evangelios en 1962, el Nuevo Testamento en 1963, los Salmos en 1968, la Biblia completa en 1971, cambios textuales menores en 1972, 1973 y 1975, una revisión mayor en 1977, una revisión limitada en 1992, la Updated Edition (NASB95) en 1995, y el texto actual de 2020, partes del cual aparecieron en línea desde 2018
fact.8.label=Licencia
fact.8.value=Licenciada, no de dominio público. Pueden citarse hasta 1.000 versículos en cualquier forma sin permiso escrito, siempre que no formen un libro completo de la Biblia ni más de la mitad de la obra que cita, con un aviso de derechos de autor que mencione 1960, 1971, 1977, 1995 y 2020; cualquier uso mayor requiere el permiso de la Fundación Lockman
fact.9.label=En este corpus
fact.9.value=Licenciada y no de dominio público, como [[NIV|la New International Version]] — la interfaz en inglés se abre de forma predeterminada en esa edición, y esta se alcanza desde su propia tarjeta. No se registra ningún padre en los peldaños de linaje: aunque la Fundación describe el proyecto como una continuación de la literalidad de [[ASV|la American Standard Version]], está traducida de nuevo del hebreo, el arameo y el griego, y no es una revisión de ella ni de ningún otro texto en inglés que se tenga aquí, de modo que un peldaño bajo un versículo de la NASB va directamente al suelo de la lengua original, marcado con ≈
