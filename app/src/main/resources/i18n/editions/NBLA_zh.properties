title=Nueva Biblia de las Américas — 关于本译本 | Common Root
description=Nueva Biblia de las Américas:Lockman基金会对自家 La Biblia de las Américas 所作的拉丁美洲西班牙语修订本,将同样的逐字方法带入整个美洲通用的日常西班牙语。
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas 是 Lockman基金会(The Lockman Foundation)的拉丁美洲西班牙语版本,建立在该基金会1986年早先出版的 La Biblia de las Américas 之上——后者本身是二十二位译者与顾问历时约十五年的成果,采用的逐字翻译理念后来又被带入英语,成为《新美国标准圣经》(New American Standard Bible)。NBLA 并非从希伯来文和希腊文重新翻译而来,而是一次文体修订:一个十二人组成的 Lockman 委员会,将 La Biblia de las Américas 偏向卡斯蒂利亚式的西班牙语,改写为整个拉丁美洲通用的、亲切而现代的西班牙语,用更通用的"ustedes"取代第二人称复数的"vosotros",并对前一文本从希伯来叙事风格逐字搬入的程式化"y"与"sucedió que"等结构作了松化处理。Lockman基金会自己的引用许可声明将成书时间定为2005年。
hero.2=文本依据直接承自 La Biblia de las Américas:旧约以鲁道夫·基特尔(Rudolf Kittel)的《希伯来文圣经》(Biblia Hebraica)为据,并参考死海古卷;新约则大体依据艾伯哈特·内斯特莱(Eberhard Nestle)《新约希腊文本》(Novum Testamentum Graece)第27版,并在涉及具体异文之处留意进一步的抄本证据。如今一些书商与圣经软件目录,已将 Nueva Biblia de las Américas 与基金会2020年对《新美国标准圣经》的修订一并归类,将二者作为服务于同一逐字翻译传统的英语、西班牙语读者的配套译本来推广;不过,按基金会自身的声明,这一译本本身并无晚于2005年的版权年份。
hero.3=本处的西班牙语界面默认打开的是《雷纳-瓦莱拉1909》(Reina Valera 1909)——一部来自完全不同翻译传统、年代早了一个世纪的公共领域文本;而 Nueva Biblia de las Américas 则需从翻译网格中自己的卡片进入。它与那一版本在文本历史上的关联甚少,却与《新美国标准圣经》有许多共同之处——同一基金会、同样的形式对应方法,以及同样授权使用而非公共领域的身份,允许在不构成完整书卷、也不超过所引用作品四分之一的前提下,未经书面许可引用至多500节经文。谱系阶梯中未记录母本:它所修订的文本 La Biblia de las Américas 本身并未收入本语料库,因此 NBLA 经文下方的阶梯会直接通向标记为≈的原文底线。

fact.1.label=语言
fact.1.value=西班牙语
fact.2.label=受命缘起
fact.2.value=加利福尼亚州拉哈布拉的 Lockman基金会——支持《新美国标准圣经》及其自身前身 La Biblia de las Américas(1986年)的同一家非营利机构
fact.3.label=编译者
fact.3.value=一个十二人组成的 Lockman 修订委员会,在 La Biblia de las Américas 译本基础上工作,后者本身是二十二位译者与顾问历时约十五年的成果
fact.4.label=旧约据
fact.4.value=鲁道夫·基特尔的《希伯来文圣经》,并参考死海古卷,承自 La Biblia de las Américas 自身的文本依据
fact.5.label=新约据
fact.5.value=艾伯哈特·内斯特莱的《新约希腊文本》,大体为第27版,并在涉及某一异文之处留意进一步的抄本证据
fact.6.label=翻译取向
fact.6.value=形式对应,与 La Biblia de las Américas 及《新美国标准圣经》采用同样的逐字方法——并非重新翻译,而是一次文体修订,改为整个拉丁美洲通用的亲切、现代西班牙语,将"vosotros"等卡斯蒂利亚式用法替换为"ustedes",并对前一文本从希伯来文逐字搬入的程式化"y"与"sucedió que"等结构重作处理
fact.7.label=出版
fact.7.value=由 Lockman基金会于2005年取得版权;此后一些目录将其与基金会2020年对《新美国标准圣经》的修订一并归类,但2005年仍是其自身版权声明中所列的年份
fact.8.label=授权
fact.8.value=授权使用,非公共领域。只要不构成完整的圣经书卷,也不超过所引用作品的四分之一,即可在未经书面许可的情况下以任何形式引用至多500节经文,并附带标明2005年的版权声明;超出此范围的使用需取得 Lockman基金会的许可
fact.9.label=在本语料库中
fact.9.value=与同一基金会的[[NASB|新美国标准圣经]]一样授权使用,非公共领域。西班牙语界面默认打开来自不相关传统、年代早了一个世纪的公共领域文本[[RVR09|雷纳-瓦莱拉1909]],而本译本则需从自己的卡片进入。谱系阶梯中未记录母本:它是对 La Biblia de las Américas 的一次文体修订,而该译本本身并未收入本语料库,因此 NBLA 经文下方的阶梯会直接通向标记为≈的原文底线。
