title=Yorumsuz Türkçe Çeviri — Om denna utgåva | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): en modern turkisk bibel, översatt från World English Bible av İsmail Serinken i samarbete med eBible.org, licensierad CC BY-ND 4.0 — den turkiska texten som detta korpus öppnar på som standard.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — ordagrant en "okommenterad" eller "otolkad" turkisk översättning — är en modern turkisk bibel färdigställd av İsmail Serinken i samarbete med eBible.org, med upphovsrätt daterad 2023 till 2025. Namnet anger själva metoden: en enkel, ord-för-ord-återgivning som medvetet utesluter förklarande kommentarer och tolkande omskrivning, och som föredrar transparens mot grundtexten framför utjämnad idiomatik.
hero.2=Den underliggande grundtexten är, ärligt sagt, engelska snarare än hebreiska, arameiska eller grekiska: översättningens egen upphovsrättssida beskriver den som återgiven från World English Bible, vilket gör den till en sekundär översättning snarare än en som görs direkt från originalspråken, till skillnad från de flesta andra biblar i detta korpus. Common Root sökte först efter en fri utgåva av den historiska turkiska bibeln från 1941 (Kitabı Mukaddes), som numera är gammal nog för att vara fri från upphovsrätt i Turkiet, men ingen användbar digital källa för den kunde hittas; Yorumsuz Türkçe Çeviri var den enda fritt licensierade turkiska bibeln som fanns tillgänglig. Detta korpus text kommer från eBible.orgs USFM-distribution av den, katalogiserad där som turytc.
hero.3=Dess återgivningsval har en samtida snarare än traditionell prägel: den återger Guds personliga namn som Yahve i stället för det sedvanliga turkiska "RAB" eller "Yehova", med hänvisning till 2 Mosebok 3:14-15, och återger Jesu namn som Yeşua i stället för det vanliga turkiska İsa, medan andra egennamn lämnas i sin vanliga form. Den har den vanliga 66-boks protestantiska kanon, utan deuterokanoniska böcker.
hero.4=Den är den enda turkiska bibeln i detta korpus, så ett turkiskt gränssnitt öppnar på den som standard.

