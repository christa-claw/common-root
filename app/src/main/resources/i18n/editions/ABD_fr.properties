title=Sunan Abi Dawud — À propos de cette édition | Common Root
description=Sunan Abi Dawud : le recueil de hadiths qu'Abu Dawud al-Sijistani a compilé pour sa pertinence en droit islamique, tiré d'environ 500 000 récits qu'il avait examinés et organisé par sujet juridique — le troisième des Six Livres de l'islam sunnite.
heroHeading=Sunan Abi Dawud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani est né vers l'an 202 de l'hégire (817–818 apr. J.-C.) à Sijistan, une province du Khorasan qui se trouve aujourd'hui à la frontière entre l'Iran et l'Afghanistan. Il atteignit Bagdad à dix-huit ans, puis voyagea à travers le Khorasan, l'Irak, le Hijaz, la Syrie, l'Égypte et Nishapur à la recherche de hadiths, étudiant auprès d'environ 300 savants, dont Ahmad ibn Hanbal. Il s'installa à Bassora, où il mourut un vendredi du mois de shawwal de l'an 275 de l'hégire (889 apr. J.-C.) à l'âge de soixante-treize ans, et fut enterré auprès du juriste Sufyan al-Thawri.
hero.2=Son intérêt était spécifiquement juridique : à la différence du Sahih al-Bukhari et du Sahih Muslim, qui couvrent à égalité la croyance, l'histoire et le droit, Abu Dawud a construit son Sunan autour de hadiths touchant au fiqh, l'organisant en livres qui parcourent les sujets dont un juriste a besoin — purification, prière, zakat, jeûne, mariage, héritage, fonction de juge, et le reste. Selon son disciple Ibn Dasah, il examina environ 500 000 récits de hadiths en réunissant la matière. Il établit aussi un critère différent de celui d'al-Bukhari et de Muslim : alors qu'ils n'admettaient que des hadiths qu'ils jugeaient pleinement authentiques, Abu Dawud a inclus certains récits mursal, faibles (da'if) et même munkar lorsqu'aucun hadith plus solide ne traitait un point juridique donné, expliquant sa méthode dans une lettre aux habitants de La Mecque et signalant lui-même les évaluations les plus faibles plutôt que de les laisser sans marque.
hero.3=La tradition sunnite place le Sunan Abi Dawud au troisième rang des Six Livres, après le Sahih al-Bukhari et le Sahih Muslim ; la place exacte qu'il occupe, avec le Jami` at-Tirmidhi, le Sunan an-Nasa'i et le Sunan Ibn Majah, les uns par rapport aux autres parmi les quatre restants, est depuis longtemps débattue sans avoir été tranchée. Les chiffres donnés pour l'ouvrage ne s'accordent pas entre eux d'une manière que personne ne semble avoir résolue : le chiffre d'Ibn Dasah pour ce qu'Abu Dawud a sélectionné est de 4 800 hadiths, tandis que l'édition moderne de référence — établie par Muhammad Muhyiddin Abd al-Hamid et imprimée au Caire en 1935 — en numérote 5 274. Le chiffre propre à ce corpus, 43 livres et 5 274 hadiths, correspond exactement à la numérotation de cette édition du Caire, ce qui le place ici sur un terrain plus solide que le Sahih al-Bukhari ou le Sahih Muslim, où le chiffre de ce corpus ne reproduit aucune tradition imprimée particulière.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-abudawud de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le Sahih al-Bukhari, le Sahih Muslim et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=arabe classique, avec une traduction anglaise sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani (202–275 de l'hégire / 817–889 apr. J.-C.)
fact.3.label=Titre
fact.3.value=connu simplement comme Sunan Abi Dawud ; à la différence du [[BUK|Sahih al-Bukhari]], aucun titre complet distinct n'est attesté pour lui
fact.4.label=Compilé
fact.4.value=réuni au fil de voyages à travers le Khorasan, l'Irak, le Hijaz, la Syrie, l'Égypte et Nishapur ; Abu Dawud s'installa et mourut à Bassora
fact.5.label=Méthode
fact.5.value=organisé par sujet juridique (fiqh) plutôt que par transmetteur ou chronologie ; inclut certains hadiths faibles, mursal et munkar lorsqu'aucun récit plus solide ne traite un point juridique, expressément signalés comme tels
fact.6.label=Rang
fact.6.value=le troisième des Six Livres de l'islam sunnite (Kutub al-Sitta), après le [[BUK|Sahih al-Bukhari]] et le [[MUS|Sahih Muslim]] ; son rang parmi les trois livres restants est débattu plutôt que tranché
fact.7.label=Nombre de hadiths
fact.7.value=4 800 sélectionnés selon le disciple d'Abu Dawud, Ibn Dasah, ou 5 274 dans l'édition de référence de Muhammad Muhyiddin Abd al-Hamid, Le Caire, 1935 ; les sources ne réconcilient pas ces deux chiffres
fact.8.label=Dans ce corpus
fact.8.value=43 livres et 5 274 hadiths numérotés — correspond exactement à la numérotation de l'édition du Caire de 1935
fact.9.label=Traduction anglaise
fact.9.value=tirée de l'édition eng-abudawud de fawazahmed0/hadith-api, montrée en accompagnement sous l'arabe ; la traduction publiée dont elle descend n'a pas encore été établie du côté de ce corpus
fact.10.label=Licence
fact.10.value=le matn arabe est le texte classique du domaine public ; la licence de la traduction anglaise reste en cours de vérification
