title=Baibal Olcim — À propos de cette édition | Common Root
description=Baibal Olcim : la Bible en matu chin, langue minoritaire de l'État Chin, au Myanmar, diffusée par eBible.org comme un texte véritablement dans le domaine public, dont le traducteur et la date de traduction ne sont pas connus.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Le matu chin — aussi appelé matupi chin — est une langue sino-tibétaine parlée par environ 34 000 personnes, concentrées autour de Matupi, dans le sud de l'État Chin, au Myanmar, avec des communautés apparentées de l'autre côté de la frontière, dans l'État indien du Mizoram. Baibal Olcim est la Bible dans cette langue, et c'est le seul texte en matu chin de ce corpus.
hero.2=Ce que la source ne donne pas, c'est qui l'a traduite, ni quand. eBible.org, qui diffuse le texte, indique seulement qu'il relève du domaine public, et le catalogue sous hlt, le code ISO 639-3 du matu chin — aucun traducteur, aucun comité, aucune date de traduction. Cette page laisse les deux champs vides plutôt que de les deviner. Ce même code a ici sa petite histoire : une tentative antérieure d'ajouter à ce corpus une seconde Bible en hindi avait été classée sous hlt à cause d'une abréviation d'apparence semblable, jusqu'à ce que des versets en matu chin, apparaissant là où l'on attendait du hindi, révèlent l'erreur. Cette édition est celle qui a réellement été vérifiée face à la langue que nomme son code.
hero.3=Elle a été ajoutée pour ce qu'elle est, non pour sa longueur : une Bible véritablement dans le domaine public, pas seulement sous licence, dans la langue d'une minorité chrétienne qui a connu une réelle persécution au cours du conflit civil du Myanmar, concentré dans et autour de l'État Chin. Un lecteur conçu pour ne rien exiger de ceux qui l'utilisent, et pour n'en suivre aucun, est exactement fait pour un cas comme celui-ci — ce qui explique aussi en grande partie pourquoi cette page a si peu d'autre chose à mettre dans ses données.

