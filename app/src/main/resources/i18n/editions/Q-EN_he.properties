# The narrative, one paragraph per key, in order.
hero.1=מוחמד מרמדיוק פיקת'ול (1875-1936) היה סופר אנגלי, שהוערך בזמנו בידי ה. ג'. וולס וד. ה. לורנס, לפני שהפך למתרגם של טקסט קדוש. הוא הכריז על התאסלמותו בנובמבר 1917, בעקבות הרצאה בשם "Islam and Progress" שנתן בפני האגודה הספרותית המוסלמית בנוטינג היל, ואמר את השהאדה באותו חודש במשלחת המוסלמית של ווקינג. עשור לאחר מכן היה מנהל בית הספר התיכון צ'דרגאט בהיידראבאד, בשירות הניזאם, ומשם יצא בשנת 1928 לשנת שבתון של שנתיים כדי לעשות את מה שרצה לעשות מאז התאסלמותו: להעביר את הקוראן לאנגלית.
hero.2=הוא לא עשה זאת לבדו ולא בחופזה. בשנת 1929 שהה שלושה חודשים בקהיר, שם תמיכתו של רשיד רידא פתחה לו דלתות, בחיפוש אחר ברכת חכמי אל-אזהר למפעל שחלקם הוזהרו שסיוע בו עלול לעלות להם במשרתם — חלק מאל-אזהר ראה בתרגום הקוראן עצמו עניין חמור. פיקת'ול המשיך בכל זאת ולא חדל להתייעץ איתם. מה שפרסם בשנת 1930, בשם "The Meaning of the Glorious Koran: An Explanatory Translation", נושא את אותה זהירות בכותרתו עצמה: לא "הקוראן באנגלית" אלא הסבר למשמעותו, שכן שום תרגום, לפי השקפתו המוצהרת, לא יכול היה להיות הקוראן עצמו. אלפרד א. קנופף הוציא את המהדורה הראשונה בניו יורק; בעקבותיה הופיעה מהדורה דו־לשונית של בית הדפוס הממשלתי של היידראבאד.
hero.3=The Times Literary Supplement תיאר אותו כ"a great literary achievement", ומקובל לתארו כתרגום האנגלי הראשון של הקוראן שנעשה בידי מוסלמי ששפת אמו הייתה אנגלית — תרגומים אנגליים קודמים, כמו אלה של סייל ורודוול, היו מעשה ידיהם של מזרחנים לא-מוסלמים. תרגומו של פיקת'ול נשאר בדפוס ובשימוש כמעט מאה שנה מאז, אחד ממספר מצומצם של תרגומים אנגליים שקוראים מן השורה, לא רק חוקרים, קוראים בפועל.
hero.4=באוסף זה הוא התרגום המוצג כברירת מחדל מתחת לטקסט הערבי בנוסח העות'מאני — הערבית נשארת הבסיס של כל טור, והאנגלית הזאת מוצגת כפירוש לצידה, מבלי להחליף אותה לעולם. היא נבחרה לתפקיד זה מטעם לא־זוהר במידה שווה לטעם ספרותי: סקירה של התרגומים הזמינים מצאה רק שני תרגומים אנגליים שהם נחלת הכלל באופן חד־משמעי, זה ותרגומו של יוסוף עלי משנת 1934, ולצדם תרגומו הרוסי של סבלוקוב משנת 1878 כשפה שלישית. הטקסט שכאן הוא דיגיטציה של התרגום, שמקורה ב-alquran.cloud ולא בהדפסה מסוימת אחת, ולכן יש לקרוא בו את ניסוחו של פיקת'ול ולא פקסימיליה של מהדורה מסוימת.

