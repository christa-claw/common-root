title=קוראן — פיקת'ול — על המהדורה הזאת | Common Root
description=תרגומו של מוחמד מרמדיוק פיקת'ול משנת 1930, התרגום האנגלי הראשון של הקוראן שנעשה בידי מוסלמי ששפת אמו הייתה אנגלית — נכתב בעת ששירת את הניזאם של היידראבאד ובעצת חכמי אל-אזהר, ובאוסף זה הוא הטקסט האנגלי המוצג כברירת מחדל מתחת לטקסט הערבי.
