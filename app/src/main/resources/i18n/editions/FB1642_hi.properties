title=Biblia 1642 — इस संस्करण के बारे में | Common Root
description=Biblia 1642: फ़िनिश में पहली पूर्ण बाइबल, जिसे चार विद्वानों ने तीन वर्ष में तुर्कू में अनूदित किया और जो स्वीडन की रानी क्रिस्टीना के संरक्षण में छपी।
