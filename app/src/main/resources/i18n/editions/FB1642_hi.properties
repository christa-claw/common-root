# The narrative, one paragraph per key, in order.
hero.1=फ़िनिश में पहली पूर्ण बाइबल। इससे पहले मिकाएल आग्रिकोला का 1548 का नया नियम था और 1550 के दशक में प्रकाशित पुराने नियम के कुछ अंश; इसके बाद एक ऐसी भाषा में पूरी बाइबल थी जो मुश्किल से लिखी गई थी। यह काम चार विद्वानों ने 1638 और 1641 के बीच किया — एस्किल पेत्रेउस, मार्तिनुस स्तोदियुस, हेनरिकुस होफ़मान और ग्रेगोरियुस मात्थाई — तुर्कू के बिशप इसाकुस रोतोवियुस के अधीन, जिन्होंने इस परियोजना को पूरा कराया। फ़िनलैंड उस समय स्वीडन का भाग था, और यह ग्रंथ 1642 में रानी क्रिस्टीना के संरक्षण में प्रकट हुआ। एक पीढ़ी पहले भी प्रयास हुआ था: 1602 में बाइबल अनुवाद समिति नियुक्त की गई, संभवतः तुर्कू के बिशप एरिकुस एरिकी सोरोलाइनेन के नेतृत्व में। लगता है उसने प्रारूप तैयार किए पर उन्हें कभी एक बाइबल में नहीं जोड़ा, और उनका अधिकांश अता-पता खो गया — फिर भी माना जाता है कि उस काम का असर 1642 के अनुवाद पर पड़ा।
hero.2=उन्होंने इब्रानी और यूनानी से अनुवाद किया, लूथर की जर्मन पास रखकर। गुस्ताव वासा की स्वीडिश बाइबल मेज़ पर रखी दूसरी पुस्तक थी; वह इस संग्रह में नहीं है, इसलिए यहाँ शृंखला लूथर को दर्ज करती है — और उनके साथ आग्रिकोला की 1548 की फ़िनिश को, वह आधार-पाठ जिसे समिति संशोधित कर रही थी। 1642 की Biblia का बड़ा प्रभाव स्वयं फ़िनिश भाषा पर पड़ा। जिस भाषा में लिखित गद्य लगभग नहीं था, उसे एक ही ग्रंथ में विधि से लेकर विलाप तक हर चीज़ के लिए शब्दावली और लय मिली — और हर बाद की फ़िनिश बाइबल इसी का पुनरीक्षण या उत्तराधिकारी है, कोई नई शुरुआत नहीं।
hero.3=इस पाठक में 1642 का संस्करण दो फ़िनिश पायदानों के बीच खड़ा है। Kirkkoraamattu 1933/38 से तीन पायदान नीचे, Biblia 1776 के नीचे, यह संस्करण प्रकट होता है; और उसके नीचे दो मूल-स्रोत साथ-साथ — आग्रिकोला की 1548 की फ़िनिश, वह आधार जिसे समिति संशोधित कर रही थी, और मेज़ पर खुली लूथर की 1545 की जर्मन। एक पायदान और नीचे, शृंखला फ़िनिश को सदा के लिए छोड़ चुकी होती है। यहाँ का पाठ Kotus के VKS पुराने साहित्यिक फ़िनिश संग्रह से आया है, इसीलिए जो वर्तनी आप देखते हैं — «tulcon walkeus» — वह 1642 की छपाई की अपनी है, आधुनिक नहीं की गई।

