title=Sunan Ibn Majah — À propos de cette édition | Common Root
description=Sunan Ibn Majah : le dernier des Six Livres de l'islam sunnite, organisé par sujet juridique, dont la place parmi eux est depuis longtemps contestée en raison des hadiths faibles et fabriqués qu'il contient aussi.
heroHeading=Sunan Ibn Majah
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu 'Abdullah Muhammad ibn Yazid Ibn Majah al-Rabi'i al-Qazwini naquit en l'an 209 de l'hégire (824 apr. J.-C.) à Qazwin, aujourd'hui dans le nord-ouest de l'Iran, au sein d'une famille de mawali (clients non arabes) de la tribu de Rabi'ah — Majah, selon un récit, était le surnom de son père plutôt qu'un nom de grand-père ou de mère. Il voyagea à la recherche de hadiths à travers l'Irak, le Hijaz, la Syrie et l'Égypte, étudiant auprès d'un large cercle de savants ; plus d'un quart de son Sunan reposerait, dit-on, sur un seul maître, Ibn Abi Shaybah. Des contemporains tels qu'Abu Ya'la al-Khalili le louèrent comme fiable, éminent, et une autorité unanimement reconnue. Il mourut à Qazwin en l'an 273 de l'hégire (887 apr. J.-C.), bien qu'al-Kattani rapporte aussi l'an 275 (889 apr. J.-C.) ; selon le récit traditionnel, après qu'Ibn Majah lui eut lu le Sunan achevé, Abu Zur'a al-Razi fit remarquer que si les gens possédaient ce livre, les autres recueils de Sunan deviendraient largement superflus.
hero.2=Son Sunan compte, selon le dénombrement d'al-Dhahabi, quelque 1 500 chapitres et environ 4 000 hadiths, organisés par sujet juridique comme le sont les recueils d'[[ABD|Abu Dawud]] et d'[[TIR|at-Tirmidhi]]. Aux côtés de matière saine et acceptable, il comporte aussi des hadiths que des savants ultérieurs ont jugés faibles, dont une trentaine environ généralement considérés comme de pures fabrications — raison pour laquelle certains savants ne comptent que « les Cinq » plutôt que les Six.
hero.3=La tradition sunnite place le Sunan Ibn Majah comme le dernier des Six Livres (Kutub al-Sitta), avec le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]] et le [[NAS|Sunan an-Nasa'i]]. Cette sixième place est elle-même discutée : les Malikites et Ibn al-Athir, entre autres, lui préfèrent le [[MAL|Muwatta Malik]], et certains citent le Sunan d'al-Daraqutni ; on dit généralement que le livre d'Ibn Majah a emporté cette place parce que son contenu recoupe le moins les cinq autres, et non parce qu'il serait jugé le plus sûr des candidats.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-ibnmajah de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]], le [[NAS|Sunan an-Nasa'i]] et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

