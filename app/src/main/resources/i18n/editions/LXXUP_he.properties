readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=זהו תרגומו האנגלי של סר לנסלוט ברנטון לתרגום השבעים, הברית הישנה ביוונית, ובו האנגלית מעודכנת. ברנטון תרגם בעיקר מכתב יד הוותיקן; בית ההוצאה Samuel Bagster and Sons בלונדון הוציא את תרגומו ב־1844 והוציאו שוב עם הספרים החיצוניים ב־1851. ב־2020 עיבד אותו אדם בויד עבור eBible.org והקדיש את שינוייו לנחלת הכלל. הוא לא תרגם אותו מחדש. ההקדמה שלו מונה מה שינה: הכתיב הותאם לאנגלית אמריקנית בת זמננו, כך ש־“shew” נעשה “show”; שמות אנשים ומקומות ניתנו בצורות שהקורא האנגלי מכיר; “begat” ו־“spake” הפכו ל־“begot” ו־“spoke”; מקפים וסימני פיסוק כפולים סודרו; והשירה סודרה כשירה. מה שהשאיר מכוון לא פחות: “thou”, “thee” ו־“ye” עם צורות הפועל הנלוות אליהם, הדקדוק של ברנטון, והפיסוק הכבד שלו מן המאה ה־19.
hero.2=ההבדל ניכר היטב ביותר לצד ברנטון המקורי, שגם הוא באוסף זה. ברנטון כתב שמות עבריים כפי שהיוונית כותבת אותם; העדכון נותן לרוב את הצורה האנגלית. במקום שבו ספר נחמיה של ברנטון נפתח במילים “the words of Neemias the son of Chelcia”, כאן כתוב “Nehemiah the son of Hacaliah”; Elias the Thesbite נעשה Elijah the Tishbite, ו־Emmanuel בישעיהו 7:14 נעשה Immanuel. מתחת לכתיב התרגום עדיין של ברנטון, ולכן הוא עדיין קורא במקום שבו היוונית קוראת. “A virgin shall conceive” בישעיהו 7:14 מתרגם את היוונית parthenos; המזמורים שומרים על המספור היווני, כך שמזמור 22 הוא כאן מזמור הרועה; והארץ בבראשית 1:2 עדיין “unsightly and unfurnished”. גם הכינויים הישנים נשארים: “thou shalt call his name Immanuel”.
hero.3=בקורא זה הוא עומד מחוץ לשלבי השושלת. האוסף אינו רושם לו הורה — לא את היוונית שברנטון תרגם ולא את ברנטון שהוא מעבד — ולכן שלב שנפתח מתחת לאחד מפסוקיו נופל ישירות לרצפת לשונות המקור המסומנת ב־≈, שבברית הישנה היא כתב יד לנינגרד: טקסט עברי, ולא היוונית שממנה נעשה תרגום זה. כדי לרדת מן האנגלית של ברנטון אל היוונית שלו, פִּתחו את ברנטון המקורי, שההורה הרשום שלו הוא תרגום השבעים. על מהדורה זו לא עומד דבר בתורו, ואף שפת ממשק אינה נפתחת עליה; ממשק אנגלי נפתח על New International Version. העותק שלנו צר מן הספר. יש בו 36 ספרים. עזרא ונחמיה הם ספר אחד בן 23 פרקים, כמו ביוונית, ונחמיה מתחיל בפרק 11. קובצי eBible.org שממנו נלקח כוללים גם את הספרים החיצוניים, ונותנים את אסתר ואת דניאל רק בצורותיהם היווניות הארוכות; דבר מכל אלה לא נכלל, ולכן אין כאן אסתר ואין דניאל, וגם לא טוביה או חכמת שלמה.

