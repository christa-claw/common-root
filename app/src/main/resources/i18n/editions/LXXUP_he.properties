title=תרגום השבעים האנגלי של ברנטון בכתיב מעודכן — על מהדורה זו | Common Root
description=תרגום השבעים האנגלי של סר לנסלוט ברנטון משנות 1844 ו־1851, שכתיבו ושמותיו עודכנו בידי אדם בויד ב־2020 — אותו תרגום כמו ברנטון המקורי שלצדו באוסף זה, ו־thou ו־thee נשארו במקום שבו ברנטון שם אותם.
