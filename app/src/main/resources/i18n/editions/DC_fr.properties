title=Doctrine et Alliances — À propos de cette édition | Common Root
description=Doctrine et Alliances : révélations et autres déclarations consignées par Joseph Smith, publiées pour la première fois en 1835 à Kirtland, dans l'Ohio, et lues par les saints des derniers jours comme une écriture aux côtés de la Bible.
heroHeading=Doctrine et Alliances
readerHref=/reader?c1.src=dc

hero.1=Doctrine et Alliances réunit des révélations, des visions et d'autres déclarations que Joseph Smith fils a dit avoir reçues comme des communications directes de Dieu, consignées pour l'essentiel durant les premières années de l'Église, dans l'Ohio, le Missouri et l'État de New York. Une compilation antérieure, intitulée « Livre des commandements pour le gouvernement de l'Église du Christ », était en cours d'impression à l'atelier de l'Église à Independence, dans le Missouri, lorsqu'une foule détruisit l'atelier en juillet 1833 et dispersa les feuillets inachevés avant que le livre ne puisse être terminé ; il ne fut jamais officiellement publié, bien qu'un petit nombre des feuillets non reliés, sauvés alors, aient survécu.
hero.2=Une version augmentée et retitrée, « Doctrine et Alliances de l'Église des saints des derniers jours », suivit en 1835, publiée à Kirtland, dans l'Ohio, et compilée et approuvée par un comité de quatre personnes : Joseph Smith, Oliver Cowdery, Sidney Rigdon et Frederick G. Williams. Cette première édition réunissait sous une même couverture deux types de textes — une série de conférences théologiques données à l'École de Kirtland, présentées comme sa « Doctrine », aux côtés des révélations elles-mêmes consignées, présentées comme ses « Alliances ». Ces conférences, connues depuis sous le nom de Lectures on Faith, furent retirées plus tard du livre — on situe généralement ce retrait à l'édition de 1921 —, laissant les révélations constituer l'ensemble de l'ouvrage.
hero.3=Le livre est organisé en sections numérotées plutôt qu'en livres, chapitres et versets comme une Bible, ce qui reflète sa nature : un ensemble de textes séparés plutôt qu'un seul récit continu. Le contenu comme la numérotation ont changé au fil des éditions du XIXe siècle, dont une édition de 1876, dirigée par Orson Pratt, qui réorganisa des éléments antérieurs et ajouta de nouvelles révélations. L'édition moderne prit sa forme actuelle en 1981, lorsque deux éléments supplémentaires — une vision des degrés de gloire et une vision de la rédemption des morts — furent ajoutés comme sections 137 et 138, avec deux « déclarations officielles » : un manifeste de 1890 mettant fin à l'approbation par l'Église de nouveaux mariages pluraux, et une déclaration de 1978 étendant l'ordination à la prêtrise à tous les membres masculins dignes, sans distinction de race. Un tirage de 2013 mit à jour d'autres éléments de référence. L'édition standard aujourd'hui en usage compte 138 sections et les deux déclarations officielles.
hero.4=Il compte parmi les quatre ouvrages que le mouvement des saints des derniers jours appelle ses écrits canoniques, à côté de la Bible, du [[BOM|Livre de Mormon]] et de la [[PGP|Perle de Grand Prix]]. La Communauté du Christ, une dénomination distincte issue du même mouvement, conserve sa propre Doctrine et Alliances, numérotée et mise à jour indépendamment de celle-ci. Le texte de ce corpus provient de l'export JSON du Mormon Documentation Project, la même source du domaine public que celle utilisée pour le [[BOM|Livre de Mormon]] et la [[PGP|Perle de Grand Prix]], et y est présenté comme un seul livre, « Doctrine et Alliances », chaque section y tenant lieu de chapitre ; il suit la formulation de l'édition standard actuelle et omet les notes en bas de page et les titres de chapitre protégés par le droit d'auteur, ce pourquoi aucune année de publication unique n'est indiquée ici.

