fact.9.label=באוסף זה
fact.9.value=הביבליה הסינית היחידה כאן, ולכן ממשק סיני נפתח עליה כברירת מחדל; בשלבי השושלת לא רשום מקור, אף שתווית השלב שלה נושאת את השנה 1919
