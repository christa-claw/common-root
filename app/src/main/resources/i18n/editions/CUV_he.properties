title=התרגום הסיני המאוחד — על מהדורה זו | Common Root
description=התרגום הסיני המאוחד משנת 1919: עשרים ותשע שנות עבודת ועדה שהניבו את הביבליה שהפרוטסטנטים הסינים קוראים בה עד היום, ואחד הספרים הראשונים שראו אור במנדרינית מדוברת כתובה.
