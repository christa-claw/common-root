# The narrative, one paragraph per key, in order.
hero.1=בשנת 1890 נאספו המיסיונים הפרוטסטנטיים שפעלו בסין בשנחאי והודו בבעיה. כבר היו בנמצא כמה ביבליות סיניות, ואין שתיים מהן עולות בקנה אחד — לא בניסוח, לא בכתיב השמות, ואף לא בשאלה באיזו שכבה של הסינית ראוי לכתוב בכלל. הוועידה החליטה על תרגום אחד שכל מיסיון ישתמש בו, וקראה לו תרגום מאוחד: 和合本, הטקסט המתואם. ומאחר שהסינית הכתובה הייתה אז חצויה בין לשון הספר של המשכילים ובין לשון הדיבור של כל השאר, הזמינו שלושה בבת אחת — שניים בסינית ספרותית, אחד במנדרינית.
hero.2=ועדת המנדרינית עמלה עשרים ותשע שנים. בראשה עמד קלווין ווילסון מייטיר, פרסביטריאני אמריקני שישב בשאנדונג משנת 1863, והוא מת בשנת 1908 והמלאכה לא תמה; הצוות שאסף מחצי תריסר מיסיונים המשיך, וכמוהו המלומדים הסינים שעבדו לצדם, ששמותיהם נשמרו בכתבי המיסיון בהקפדה פחותה בהרבה. הם נטלו את ה־Revised Version האנגלית כטקסט שאותו הם מוסרים, ובדקו אותה מול העברית והיוונית שמתחתיה — דבר המציב את ה־Revised Version שבאוסף זה עצמו שלב אחד מעל ביבליה זו, ואת ה־King James Version שלב נוסף מעליה. שני התרגומים הספרותיים מוזגו לבסוף לאחד. זה שנותר הוא התרגום המנדריני.
hero.3=הוא ראה אור בשנת 1919, והתאריך עשה למענו יותר משכל ועדה יכלה. זו הייתה שנת תנועת הרביעי במאי, שבה החלו סופרי סין ברצינות לנטוש את לשון הספר לטובת לשון הדיבור, והתרגום המאוחד הופיע כאחד הספרים רחבי היריעה הראשונים שנכתבו כך מלכתחילה. תרגום שנועד ליישב מחלוקת בין מיסיונרים נעשה ציון דרך בפרוזה הסינית המודרנית, וניביו מצוטטים בפי אנשים שמעולם לא פתחו ביבליה. מאז הוא נדפס בשתי מהדורות הנבדלות במילה אחת בלבד — אם האל הוא 神 או 上帝 — והריווח הותאם כך ששתי המהדורות עדיין שוברות עמודים באותו מקום.
hero.4=בקורא הזה היא הביבליה הסינית היחידה, וזה מכריע שני דברים בהתנהגותה. העמידו את הממשק על סינית וזו שתיפתח — לא משום שנבחרה, כפי שנבחרה Reina-Valera 1909 לספרדית, אלא משום שהקטלוג אינו מוצא ביבליה אחרת בשפה. ובשלבי השושלת לא רשום לה שום מקור, ולכן שלב מתחת לפסוק יורד היישר אל רצפת שפות המקור המסומנת ב־≈, אף שה־Revised Version שממנה נעשתה עומדת באוסף במרחק טור אחד. תווית השלב שלה כן נושאת שנה, 1919, מה שלא כל מהדורה כאן עושה.

