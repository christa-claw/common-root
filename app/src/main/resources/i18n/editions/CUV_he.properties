fact.4.value=ועדה שנאספה מכמה מיסיונים פרוטסטנטיים; הפרסביטריאני האמריקני קלווין ווילסון מייטיר (1836–1908) עמד בראש צוות המנדרינית עד מותו, ועבד כל העת עם עמיתים סינים
