title=Ленинградский кодекс — Об этом издании | Common Root
description=Ленинградский кодекс: древнейшая полная рукопись еврейской Библии, переписанная в 1008 году и до сих пор служащая основой большинства современных переводов Ветхого Завета.
heroHeading=Ленинградский кодекс
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=Это древнейшая сохранившаяся полная рукопись еврейской Библии. Её переписал книжник по имени Самуил бен Иаков, работавший в Старом Каире; в собственной приписке в конце рукописи он датировал свой труд 1008 годом.
hero.2=Самуил бен Иаков не создавал текст — он его сохранял. Он работал в традиции семьи Бен Ашер, главных знатоков масоры: разработанной системы огласовок, знаков кантилляции и примечаний на полях, которую еврейские учёные оттачивали веками, чтобы закрепить произношение еврейской Библии и уберечь её от порчи. Более древняя и, вероятно, более авторитетная рукопись традиции Бен Ашера сохранилась — Алеппский кодекс, — но большая часть его Торы была утрачена в 1947 году. Ленинградский кодекс ценят именно за то, что он полон и достаточно древен, чтобы стоять у самого истока этой традиции.
hero.3=Название дано по городу, где рукопись оказалась впоследствии: Ленинградом назывался Санкт-Петербург в то время, когда рукопись вошла в западную науку, и это имя закрепилось за ней даже после того, как городу в 1991 году вернули прежнее название. Сегодня кодекс лежит в основе Biblia Hebraica Stuttgartensia — стандартного научного издания еврейской Библии. А значит, почти каждый современный перевод Ветхого Завета почти на любой язык восходит к тщательной работе одного каирского книжника XI века, знают его читатели по имени или нет.

