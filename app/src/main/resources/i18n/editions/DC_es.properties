title=Doctrina y Convenios — Acerca de esta edición | Common Root
description=Doctrina y Convenios: revelaciones y otras declaraciones registradas por Joseph Smith, publicadas por primera vez en 1835 en Kirtland, Ohio, y leídas por los santos de los últimos días como escritura junto a la Biblia.
heroHeading=Doctrina y Convenios
readerHref=/reader?c1.src=dc

hero.1=Doctrina y Convenios reúne revelaciones, visiones y otras declaraciones que Joseph Smith hijo dijo haber recibido como comunicaciones directas de Dios, registradas sobre todo durante los primeros años de la Iglesia en Ohio, Misuri y Nueva York. Una compilación anterior, titulada «Libro de Mandamientos para el Gobierno de la Iglesia de Cristo», se estaba imprimiendo en la imprenta de la Iglesia en Independence, Misuri, cuando una turba destruyó la imprenta en julio de 1833 y dispersó las hojas inconclusas antes de que el libro pudiera completarse; nunca se publicó oficialmente, aunque sobrevive un pequeño número de las hojas sueltas que se rescataron.
hero.2=En 1835 siguió una versión ampliada y retitulada, «Doctrina y Convenios de la Iglesia de los Santos de los Últimos Días», publicada en Kirtland, Ohio, y compilada y aprobada por un comité de cuatro personas: Joseph Smith, Oliver Cowdery, Sidney Rigdon y Frederick G. Williams. Aquella primera edición reunía bajo una sola cubierta dos tipos de material: una serie de conferencias teológicas impartidas en la Escuela de Kirtland, presentadas como su «Doctrina», junto con las revelaciones registradas, presentadas como sus «Convenios». Esas conferencias, conocidas desde entonces como las Lecciones de Fe, se eliminaron más tarde del libro —se suele fechar ese cambio en la edición de 1921—, de modo que las revelaciones quedaron como la totalidad de la obra.
hero.3=El libro está organizado en secciones numeradas, no en los libros, capítulos y versículos de una Biblia, lo que refleja lo que es: un conjunto reunido de textos separados y no un único relato continuo. Tanto el contenido como la numeración cambiaron a lo largo de las ediciones del siglo XIX, incluida una edición de 1876, a cargo de Orson Pratt, que reorganizó material anterior y añadió nuevas revelaciones. La edición moderna alcanzó su forma actual en 1981, cuando se añadieron dos elementos más —una visión de los grados de gloria y una visión de la redención de los muertos— como las secciones 137 y 138, junto con dos «Declaraciones Oficiales»: un manifiesto de 1890 que puso fin al respaldo de la Iglesia a los nuevos matrimonios plurales, y una declaración de 1978 que extendió la ordenación al sacerdocio a todos los miembros varones dignos, sin distinción de raza. Una impresión de 2013 actualizó además el material de referencia. La edición estándar en uso hoy contiene 138 secciones y las dos Declaraciones Oficiales.
hero.4=Es una de las cuatro obras que el movimiento de los Santos de los Últimos Días llama sus libros canónicos, junto a la Biblia, el [[BOM|Libro de Mormón]] y la [[PGP|Perla de Gran Precio]]. La Comunidad de Cristo, una denominación separada que desciende del mismo movimiento, conserva su propia Doctrina y Convenios, numerada y actualizada de manera independiente de esta. El texto de este corpus proviene de la exportación JSON del Mormon Documentation Project, la misma fuente de dominio público utilizada para el [[BOM|Libro de Mormón]] y la [[PGP|Perla de Gran Precio]], y aquí se presenta como un único libro, «Doctrina y Convenios», en el que cada sección hace de capítulo; sigue la redacción de la edición estándar actual y omite las notas al pie y los encabezados de capítulo protegidos por derechos de autor, razón por la cual no se consigna aquí un único año de publicación.

