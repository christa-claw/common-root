title=Emphatic Diaglott (interlineare) — Su questa edizione | Common Root
description=L'Emphatic Diaglott di Benjamin Wilson, del 1864: la glossa inglese parola per parola stampata sotto il greco di Griesbach, poi acquistata e ristampata per sessant'anni dalla Società Torre di Guardia, e il testo su cui di solito si combatte la disputa su Giovanni 1:1.
heroHeading=Emphatic Diaglott (interlineare)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson non era uno studioso di professione. Era direttore di un giornale a Geneva, nell'Illinois, imparò il greco da sé e fra il 1857 e il 1863 pubblicò, un fascicolo per volta, un Nuovo Testamento interlineare che non aveva soltanto tradotto ma anche fabbricato: il nipote lo guardava prendere impronte di cera di ogni pagina composta, appenderle per la notte nell'acido perché vi crescesse una pelle di rame, rinforzare il rame con metallo fuso e stampare il risultato su un torchio a mano mentre il ragazzo inchiostrava la lastra. Il volume finito uscì nel 1864. Per il greco prese il testo che Johann Jakob Griesbach aveva stabilito negli anni 1770, con lezioni tratte dal Codex Vaticanus.
hero.2=Ciò che Wilson stampò in realtà furono due testi inglesi, non uno. Lungo il margine sinistro correva il greco con una glossa letterale parola per parola sotto ciascun termine; lungo il destro la sua traduzione rifinita, l'Emphatic Version. Non sono la stessa cosa, e in Giovanni 1:1 si contraddicono apertamente: la glossa legge «and a god was the Word», l'Emphatic Version «and the LOGOS was God». Entrambe sono di Wilson, stampate nello stesso libro a pochi centimetri l'una dall'altra. Questo corpus contiene la glossa, cioè la colonna che si cita, ed è la ragione per cui sta in una sezione a sé e non nella griglia delle Bibbie. Una glossa registra come è connessa una frase greca — caso per caso, articolo per articolo, nell'ordine delle parole greche. Non è un giudizio su come la frase vada letta in inglese, e il giudizio di Wilson su questo è stampato nella colonna accanto. Chi cita l'una dovrebbe sapere che l'altra esiste.
hero.3=La vita successiva del libro è il motivo per cui i più ne hanno sentito parlare. Wilson morì nel 1900 membro della Church of the Blessed Hope, non di un gruppo che allora esistesse sotto il nome di testimoni di Geova. Nel 1902 Charles Taze Russell, presidente della Watch Tower Bible and Tract Society, ottenne il diritto d'autore dagli eredi di Wilson e col tempo anche le lastre. La Società stampò il Diaglott per i sessant'anni seguenti — ricomponendone i caratteri sui propri torchi nel 1927, tirandone ben oltre centocinquantamila copie, vendendolo due dollari e finendo per regalarlo. Il Diaglott è dunque un libro dei testimoni di Geova per adozione e non per paternità, e la sua abitudine di stampare «Geova» nel Nuovo Testamento, dove gli autori scrivevano κύριος citando le scritture ebraiche, precede di quarant'anni il movimento che rese celebre quell'uso. Il diritto d'autore decadde nel 1952 e da allora il testo è di pubblico dominio.
hero.4=Due cose su di esso in questo lettore vale la pena di sapere prima di usarlo. Griesbach non stampò né Atti 8:37 né Luca 17:36, sicché nessuno dei due è qui; anziché chiudere il vuoto e far salire di uno ogni versetto successivo, la numerazione lascia vuoti quei due posti, così che un rimando cada sullo stesso versetto in questa colonna come in quella accanto. E non gli è registrato alcun antecedente, sicché un piolo della discendenza aperto sotto un versetto del Diaglott porta al pavimento delle lingue originali e non a un'edizione inglese più antica.
hero.5=Si sia precisi su che cosa stampi quel pavimento. Il greco che mostra è il Textus Receptus — la targhetta legge ≈ TR 1550, e quel ≈ è il lettore che dichiara di offrire un testimone del greco e non il testo da cui questa edizione fu fatta. Wilson lavorava su Griesbach. Dove i due concordano, come in Giovanni 1:1, il piolo mostra davvero le parole stesse che sono glossate. Dove divergono, no: Griesbach respinse la clausola trinitaria in 1 Giovanni 5:7, sicché il Diaglott non ne serba traccia, mentre la riga del Textus Receptus sottostante la porta per intero. In un interlineare, la cui premessa intera è che il greco stia lì sulla pagina, quella è l'unica lacuna che convenga conoscere prima di citarne alcunché.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Che cos'è
fact.1.value=la glossa sublineare — l'inglese parola per parola stampato sotto il greco, non la traduzione leggibile di Wilson
fact.2.label=Compilato da
fact.2.value=Benjamin Wilson (1817–1900), studioso da autodidatta e direttore di giornale a Geneva, Illinois
fact.3.label=Testo greco
fact.3.value=la recensione di Griesbach, con lezioni dal Codex Vaticanus (manoscritto Vaticano 1209)
fact.4.label=Pubblicato
fact.4.value=a fascicoli dal 1857; completo in un volume nel 1864, presso Fowler and Wells di New York
fact.5.label=Come fu stampato
fact.5.value=Wilson galvanizzò da sé ogni lastra e tirò la prima edizione su un torchio a mano
fact.6.label=Il nome divino
fact.6.value=stampa «Geova» nel Nuovo Testamento dove gli autori scrivevano κύριος citando la scrittura ebraica — la stessa scelta compiuta dalla [[ASV|American Standard Version]] per tutto l'Antico
fact.7.label=Acquisito da
fact.7.value=la Watch Tower Bible and Tract Society, che ottenne il diritto d'autore nel 1902 sotto Charles Taze Russell, ricompose i caratteri nel 1927 e lo stampò fin dentro gli anni 1960
fact.8.label=Licenza
fact.8.value=pubblico dominio — il diritto d'autore decadde nel 1952, e le ristampe della Torre di Guardia non ne aggiunsero uno nuovo
fact.9.label=Due versetti assenti
fact.9.value=Atti 8:37 e Luca 17:36 non sono in Griesbach e perciò non sono qui; i loro numeri restano vuoti anziché essere richiusi, così che il testo resti allineato versetto per versetto con ogni altra edizione
fact.10.label=Il greco sotto il piolo
fact.10.value=il [[TR|Textus Receptus]], mostrato come ≈ TR 1550 — un testimone del greco, non il testo base di Wilson, che era la recensione di Griesbach; i due concordano in Giovanni 1:1 e si separano in 1 Giovanni 5:7
fact.11.label=In questo corpus
fact.11.value=tenuto in una sezione propria di edizioni interlineari e di studio, in disparte dalle Bibbie di lettura, perché una glossa non sia mai presa per una traduzione; nei pioli della discendenza non è registrato alcun testo base, sicché un piolo si apre diritto sul pavimento delle lingue originali
