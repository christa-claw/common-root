title=رينا-باليرا 1909 — عن هذه الطبعة | Common Root
description=رينا-باليرا 1909: المراجعة التي حملت إسبانية كاسيودورو دي رينا لسنة 1569، كما راجعها سيبريانو دي باليرا سنة 1602، إلى القرن العشرين — وهي الطبعة التي يفتح عليها هذا القارئ للإسبانية.
heroHeading=رينا-باليرا 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=الكتاب المقدس البروتستانتي بالإسبانية كتابٌ واحد إلى حدٍّ غير مألوف. فقد خرج كاسيودورو دي رينا من إسبانيا هرباً من محاكم التفتيش، وأتمّ ترجمته في المنفى، ونشرها في بازل سنة 1569 — وهي Biblia del Oso، المسمّاة بالدبّ الذي على صفحة عنوانها. أما سيبريانو دي باليرا، الذي كان في الدير نفسه خارج إشبيلية وفرّ الفرار نفسه، فقضى سنين يراجعها، ونشر الثمرة في أمستردام سنة 1602، وهي Biblia del Cántaro. وكل رينا-باليرا بعد ذلك مراجعةٌ لمراجعةٍ لتلك، ولذلك يُخلّد اسمٌ موصولٌ بشَرطة رجلين لم يعملا قطّ في غرفة واحدة.
hero.2=وهذه مراجعة سنة 1909، أُعِدّت تحت جمعية الكتاب المقدس البريطانية والأجنبية مع جمعية الكتاب المقدس الأمريكية، ويسمّيها من ظلّوا يستعملونها Versión Antigua، أي الطبعة القديمة. جاءت بعد مراجعة أسبق هي مراجعة سنة 1862، وهي متحفّظة في الشيء الذي تغيّره المراجعات عادةً: يُقدَّم اللفظ حيث صار رينا وباليرا عسيري المتابعة، ويُترك على حاله حيث لم يصيرا كذلك. والعهد القديم قائم على العبرية الماسورية، والجديد على النصّ المتلقَّى، كما كان عند رينا.
hero.3=وقد استأثرت بالعالم البروتستانتي الناطق بالإسبانية نحو خمسين سنة، حتى أزاحتها مراجعة سنة 1960، وما غابت قطّ غياباً تامّاً. فهي خارج حقّ النشر، بخلاف طبعة سنة 1960، ولذلك هي رينا-باليرا التي تُطبع وتُنشر على الشابكة ويُقتبس منها بغير إذنٍ من أحد. ولهذا أيضاً يسع النصَّ كلَّه أن يكون في هذه المجموعة وأن يُنسخ منها.
hero.4=وفي هذا القارئ للإسبانية خمسة كتبٍ مقدسة، وهذا هو الذي تفتح عليه الواجهة. وهو اختيارٌ منتقى لا مصادفةٌ من الفهرس: فبخلاف العربية أو الصينية، حيث يفتح القارئ على الكتاب الوحيد الموجود في اللغة، للإسبانية بدائل، وقد انتُقي هذا من بينها. ولا أصل مسجّل له في درجات النسب، فالدرجة المفتوحة تحت آية تهبط رأساً إلى أرضية اللغات الأصلية المعلَّمة بـ ≈. والأرضية هنا أقرب إلى الصواب من المعتاد، للسبب نفسه الذي في الكتاب المقدس العربي: فاليونانية التي تقدّمها هي النصّ المتلقَّى، ومن النصّ المتلقَّى صُنع عهد رينا الجديد.

