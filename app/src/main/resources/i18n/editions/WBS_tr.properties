fact.3.label=Gözden geçirmenin kaynağı
fact.3.value=1611 tarihli [[KJV|King James Version]], “yaygın çeviri”, o dönem basıldığı biçimiyle — yeniden çevrilmemiş, İngilizce olarak gözden geçirilmiştir; Webster düzeltmeleri için İbranice ve Yunancaya başvurmuştur
fact.4.label=Gözden geçirme türü
fact.4.value=Hafif ve tutucu: eskimiş sözcükler güncelleriyle değiştirilmiş; dilbilgisi düzeltilmiş, kişiler için “who”, şeyler için “its”; sesli okumaya uygunsuz sayılan birkaç sözcük yumuşatılmış; “Holy Ghost” yerine “Holy Spirit”; üslup ve öğretiyle ilgili pasajlar bilerek olduğu gibi bırakılmış
fact.5.label=Yayımlanışı
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, The Holy Bible … in the Common Version, with Amendments of the Language adıyla
fact.6.label=Lisans
fact.6.value=Kamuya açık; bu kopya eBible.org'dan
fact.7.label=Bu derlemede
fact.7.value=66 kitap, Protestan kanonun tamamı, Apokrifa olmadan; İngilizce bölüm ve ayet numaralaması, bu yüzden mezmurlar 150 tanedir ve her mezmurun başlığı ilk ayetine katılmıştır
fact.8.label=Soy
fact.8.value=Kayıtlı öncül yok, üzerinde duran kayıtlı bir şey de yok — basamak doğrudan özgün dil tabanında açılır: Eski Antlaşma'da [[WLC|Leningrad Kodeksi]]'nde, Yeni Antlaşma'da [[TR|Textus Receptus]]'ta; oysa Webster'ın gözden geçirdiği metin [[KJV|King James Version]]'dır
