title=Webster's Bible — Bu Baskı Hakkında | Common Root
description=Noah Webster'ın 1833'te yaptığı ve New Haven, Connecticut'ta yayımlanan King James Version gözden geçirmesi — yaygın İngilizce Kutsal Kitap neredeyse kelimesi kelimesine korunmuş; kullanımdan düşmüş sözcükler değiştirilmiş, dilbilgisi düzeltilmiş ve birkaç ifade sesli okuma için yumuşatılmıştır.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=New Havenlı sözlükçü Noah Webster (1758–1843) en çok 1828 tarihli An American Dictionary of the English Language ile hatırlanır. Beş yıl sonra açık, doğru ve güncel İngilizceye duyduğu aynı özeni, ülkesinin gerçekte okuduğu Kutsal Kitap'a yöneltti. 1833'te New Havenlı Durrie and Peck, aynı yılın eylül ayında imzalanmış bir önsözle The Holy Bible … in the Common Version, with Amendments of the Language'ı yayımladı. Bu yeni bir çeviri değildir. Webster, 1611 tarihli King James Version'ı — “yaygın çeviri”yi — o dönem basıldığı biçimiyle aldı ve yalnızca İngilizcesinin anlaşılmaz ya da dilbilgisine aykırı hâle geldiği yerlerde değiştirdi. Düzeltmelerini yaparken özgün dillere başvurduğunu, ama çevirinin genel üslubunun değiştirilmemesi gerektiğini ve bir mezhebin öğretisini dayandırdığı hiçbir pasajı bilerek değiştirmediğini yazdı.
hero.2=Önsözünde üç tür değişiklik sayar. Tümüyle kullanımdan düşmüş sözcükler, yerleşik kullanımdaki sözcüklere yer bıraktı: King James'in “wotteth not” dediği yerde Yusuf'un efendisi evde ne olduğunu “knoweth not” (Yaratılış 39:8), Elçilerin İşleri 12:4'te de Hirodes Petrus'u “after Easter” değil “after the passover” halkın önüne çıkarmayı tasarlar. Dilbilgisi Webster'ın dönemindeki kullanıma uyduruldu: kişilerden söz edilirken “which” yerine “who”, böylece Rab'bin Duası “Our Father who art in heaven” diye başlar; şeylerden söz edilirken “his” yerine “its”, böylece Yaratılış 1'deki bitkiler tohumunu “after its kind” verir. Ayrıca karma bir dinleyici topluluğu önünde sesli okunmaya uygun bulmadığı az sayıda sözcük daha yumuşaklarıyla değiştirildi. King James'in “Holy Ghost” dediği yerde de “Holy Spirit” yazdı; kopyamızda tek bir “Holy Ghost” bile yoktur. Bunun dışında gözden geçirme hafiftir: okurların çoğu King James metninden ayrıldığını fark etmeden bölüm bölüm okuyabilir.
hero.3=Kopyamız eksiksizdir: Yaratılış'tan Vahiy'e 66 kitap, Apokrifa olmadan, İngilizce bölüm ve ayet numaralamasıyla — her birinin başlığı ilk ayetine katılmış 150 mezmur ve 4. bölümle biten Malaki. King James gibi, kabul görmüş metnin sonraki eleştirel baskıların sorguladığı pasajlarını korur: Markos'un uzun sonu, Elçilerin İşleri 8:37 ve 1. Yuhanna 5:7'deki gökteki üç tanık. Bu okuyucuda tek başına durur. Yine bu derlemede bulunan King James Version'ın bir gözden geçirmesi olmasına karşın derleme onun için hiçbir öncül kaydetmez; bu yüzden ayetlerinden birinin altında açılan bir soy basamağı, Webster'ın gerçekte üzerinde çalıştığı İngilizce metne değil, doğrudan ≈ ile işaretli özgün dil tabanına düşer: Eski Antlaşma'da Leningrad Kodeksi'ne, Yeni Antlaşma'da Textus Receptus'a. Onun üzerinde duran hiçbir şey de kayıtlı değildir. Hiçbir arayüz dili bu baskıda açılmaz; İngilizce arayüz New International Version'da açılır, bu baskıya ise çeviri ızgarasındaki kendi kartından ulaşılır. İkinci bir sütunda King James'in yanına konduğunda, Webster'ın düzeltmelerini ayet ayet gösterir.

