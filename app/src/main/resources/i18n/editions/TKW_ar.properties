title=تكستبيبل 1906 — عن هذه الطبعة | Common Root
description=«تكستبيبل» (Textbibel) كاوتش وفايتسيكر: كتاب مقدس ألماني للعلماء، مترجم من جديد عن العبرية واليونانية، صدر أول مرة في مجلد واحد في توبنغن سنة 1899؛ والنص هنا مؤرَّخ بسنة 1906.
heroHeading=تكستبيبل 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=أستاذان وعهدان. كان كارل فايتسيكر (1822–1899) مؤرخًا للكنيسة في توبنغن، خلف فيها فرديناند كريستيان باور على كرسيه سنة 1861، وكان مستشارًا للجامعة منذ 1889. ظهرت ترجمته للعهد الجديد أول مرة سنة 1875 وبلغت تسع طبعات في حياته، أعدّ آخرها وهو على فراش الموت. وكان إميل كاوتش (1841–1910) عالمًا بالعهد القديم، درّس في لايبزيغ وبازل وتوبنغن قبل أن يستقر في هاله سنة 1888؛ وصدر عهده القديم، الذي ترجمه مع جماعة من زملائه المتخصصين، كاملًا سنة 1894.
hero.2=في سنة 1899، وهي السنة التي توفي فيها فايتسيكر، جُمع العملان في مجلد واحد هو Textbibel des Alten und Neuen Testaments، ونشرته دار J.C.B. Mohr (Paul Siebeck) في توبنغن. والاسم يقول ما هو: النص المجرد، لقرّاء أرادوا أن يعرفوا ماذا تقول العبرية واليونانية، بألمانية زمانهم. ولم يُقصد به قط أن يحل محل لوثر. فقد تجنّب فايتسيكر لغة لوثر عن عمد، وسعى بدلًا من ذلك إلى نقل الأثر الذي تركه الأصل في قرّائه الأوائل؛ ورأى كاتب سيرته أنه يُستبعد أن يصير يومًا كتابًا شعبيًا، ولم يصر. وظل يُعاد طبعه حتى العقد الذي بدأ سنة 1910. والنص الرقمي هنا مؤرَّخ بسنة 1906؛ أما أيّ طبعة كانت تلك، فأمر لم يتحقق منه هذا المشروع.
hero.3=يُقرأ كعلم عصره. اسم الله في العهد القديم هو «Jahwe» — «Jahwe ist mein Hirte» في المزمور 23 — آلاف المرات، حيث يقول لوثر «der Herr». وفي إشعياء 7:14 «ein junges Weib»، أي امرأة شابة. وفي العهد الجديد تنتهي الصلاة الربانية في متى 6:13 بلا التمجيد الختامي، ولا شهود سماويين في يوحنا الأولى 5:7. ويحتفظ العهد القديم بتقسيم الإصحاحات والآيات العبري: عناوين المزامير محسوبة في ترقيم الآيات، فالمزمور 51 فيه 21 آية، وسفر ملاخي ثلاثة إصحاحات لا أربعة. والإملاء أقدم مما يوحي به التاريخ — ففي يوحنا 8:1 «gieng» يسوع إلى جبل الزيتون.
hero.4=في هذا القارئ هو واحد من أربعة كتب مقدسة ألمانية، إلى جانب الإلبرفلدي ونصّي لوثر لسنتي 1545 و1912. ولا تفتح عليه الواجهة الألمانية: فليس للألمانية اختيار منتقى، فيأخذ القارئ أول كتاب مقدس ألماني في الفهرس، وهو الإلبرفلدي. وليس له في درجات النسب أصل مسجّل، وهذا يليق بترجمة صُنعت عن الأصول: فالدرجة المفتوحة تحت الآية تهبط مباشرة إلى أرضية اللغات الأصلية المعلَّمة بـ≈ — مخطوطة لينينغراد في طبعة وستمنستر للعهد القديم، والنص المستلم للعهد الجديد، وهو يوناني لا تتبعه هذه الترجمة، كما تُظهر يوحنا الأولى 5:7.

