title=Дуэ-Реймсская Библия 1899 — Об этом издании | Common Root
description=Дуэ-Реймсская Библия: английский католический перевод, сделанный с латинской Вульгаты в Реймсе в 1582 году и в Дуэ в 1609–10 годах, переработанный епископом Чаллонером, в балтиморской печати 1899 года.
heroHeading=Дуэ-Реймсская Библия 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=В 1568 году группа английских католиков, многие из которых были оксфордцами, лишившимися своих мест, основала во Фландрии, в Дуэ, коллегию под началом Уильяма Аллена. Отчасти она и существовала затем, чтобы дать английскую Библию в католические руки, ибо единственные английские Библии, ходившие тогда, были протестантскими и употреблялись в споре. Грегори Мартин начал переводить в октябре 1578 года со скоростью примерно двух глав в день, и Новый Завет вышел в 1582 году в Реймсе, куда коллегия временно переехала. Мартин умер 28 октября того же года, через несколько недель после выхода своего Нового Завета. Ветхий Завет был готов одновременно и затем лежал ненапечатанным по той простой причине, что коллегии было не на что его напечатать; он вышел наконец двумя томами в 1609 и 1610 годах, когда до Библии короля Иакова оставалось два года.
hero.2=От всякой другой английской Библии в этом собрании её отделяет то, с чего она сделана. Не с еврейского и греческого: с латинской Вульгаты. Тридентский собор объявил Вульгату аутентичным текстом Церкви, а переводчики Дуэ прибавляли, что Иероним работал с рукописями более древними, чем любая доступная им греческая копия, — что для Ветхого Завета около 1600 года не было неразумной мыслью. Возникшая проза тяжело латинизирована, порой до того, что перестаёт быть английской вовсе: молитва Господня просит “supersubstantial bread”, потому что переводчики не хотели усваивать слово, на котором держалось богословие. Это было принципом, а не неумением.
hero.3=К середине восемнадцатого века читать её почти никто уже не мог, и епископ Ричард Чаллонер переработал её между 1749 и 1752 годами — основательно и во многом в сторону Библии короля Иакова, которая к тому времени попросту и была тем, как звучало Писание по-английски. Всякая Библия, продаваемая сегодня как Дуэ-Реймсская, есть текст Чаллонера, а не Мартина. Эта — американская печать 1899 года, издательства John Murphy Company в Балтиморе, с имприматуром кардинала Джеймса Гиббонса; поскольку та печать давно свободна от авторского права, именно её с тех пор сканировали, набирали и воспроизводили, и именно ею на деле является почти всякая цифровая Дуэ-Реймсская Библия.
hero.4=В этой читалке она делает то, чего почти ни одно другое здешнее издание не может. Её записанный источник присутствует в собрании: откройте ступень родословия под стихом Дуэ-Реймсской Библии, и ступенью ниже окажется сама латинская Вульгата, тот текст, с которого она действительно переведена, а не помеченный знаком ≈ пол исходных языков, до которого проваливается большинство изданий. Это ровно тот случай, ради которого механизм ступеней и был построен. Влияние шло и в обратную сторону — реймсский Новый Завет лежал на столах переводчиков короля Иакова, и немалая часть его латинизированной лексики перешла в их работу, — но список родословия хранит только формальные линии правки, так что этот долг там не записан. Стоит отметить одну перевёрнутость: на её метке ступени стоит год 1899, тогда как каталожная карточка не показывает года вовсе. Годы ступеней — отдельный, вручную собранный список, а карточка читает собственные метаданные каталога, и там, где издание есть в одном и нет в другом, эти двое расходятся публично.
hero.5=Предостережение о каноне. Хранящийся здесь текст содержит 72 книги, а не 73, как печатная католическая Библия. Те шесть второканонических книг, которые в нём есть, — Товита, Иудифи, 1-я и 2-я Маккавейские, Премудрости Соломона и Сираха — стоят после Откровения, а не на своих католических местах, и книги Варуха нет вовсе. Это свойство цифрового текста в том виде, в каком он был загружен, а не книги 1899 года, и это значит, что данная колонка будет читаться правильно стих за стихом, но её не следует использовать для проверки того, что входит в католический канон.

