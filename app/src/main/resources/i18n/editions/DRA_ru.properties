fact.1.label=Язык
fact.1.value=английский — католическая традиция
fact.2.label=Переведена с
fact.2.value=латинской Вульгаты, а не с еврейского и греческого — той самой [[VUL|Вульгаты]], которую хранит это собрание
fact.3.label=Новый Завет
fact.3.value=Реймс, 1582 — главным образом труд Грегори Мартина, вместе с Уильямом Алленом, Ричардом Бристоу и Томасом Уортингтоном
fact.4.label=Ветхий Завет
fact.4.value=Дуэ, 1609 и 1610, в двух томах — закончен одновременно с Новым Заветом, но задержан почти на тридцать лет из-за нехватки денег на печать
fact.5.label=Переработал
fact.5.value=епископ Ричард Чаллонер, 1749–1752 — всякая книга, продаваемая сегодня как Дуэ-Реймсская, есть правка Чаллонера, а не текст 1582/1610 годов
fact.6.label=Эта печать
fact.6.value=американское издание 1899 года компании John Murphy, Балтимор, с имприматуром кардинала Джеймса Гиббонса — давно свободное от авторского права и та версия, что ходит в цифровом виде
fact.7.label=Состав здесь
fact.7.value=72 книги: 66 протестантского канона в протестантском порядке, с Товитом, Иудифью, 1-й и 2-й Маккавейскими, Премудростью и Сирахом, добавленными после Откровения. Варуха нет, так что эта колонка не является надёжной проверкой католического канона
fact.8.label=Родословие
fact.8.value=одно из немногих здешних изданий, чей записанный источник сам находится в собрании — ступень под стихом Дуэ-Реймсской Библии открывается на [[VUL|латинскую Вульгату]], а не на пол исходных языков
fact.9.label=В этом собрании
fact.9.value=на её метке ступени стоит год 1899, хотя каталожная карточка оставляет год пустым; годы ступеней — отдельный вручную собранный список, и этим двум позволено расходиться
