title=クルアーン — ピクソール — この版について | Common Root
description=ムハンマド・マーマデューク・ピクソールによる1930年の翻訳。英語を母語とするムスリムによる初の英訳クルアーンであり、ハイデラバードのニザームに仕えながら、アズハルの学者の助言を得て作られた——本コーパスでは、アラビア語本文の下に既定で表示される英訳である。
heroHeading=クルアーン — ピクソール
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=ムハンマド・マーマデューク・ピクソール（1875年-1936年）は、聖典の翻訳者となる前は、当時H・G・ウェルズやD・H・ロレンスにも評価された英国の小説家であった。1917年11月、ノッティングヒルのムスリム文学協会で行った「イスラームと進歩」と題する講演の後、イスラームへの改宗を公に宣言し、同じ月にウォーキング・ムスリム・ミッションでシャハーダを唱えた。その十年後、彼はハイデラバードでニザームに仕え、チャダルガット高等学校の校長を務めていたが、1928年、そこから二年間の休暇を取り、改宗以来やりたいと思っていたことに取り組んだ。クルアーンを英語に移すことである。
hero.2=彼はそれを一人きりで、あるいは急いで行ったのではない。1929年、彼はカイロで三か月を過ごした。ラシード・リダーの支援が道を開き、彼はアズハルの学者たちの祝福を求めた——その計画に協力すれば地位を失う恐れがあると警告されていた学者もいたほどで、アズハルの一部はクルアーンを翻訳することそのものを重大な問題と見ていた。それでもピクソールは進み、学者たちへの相談を続けた。1930年に彼が「The Meaning of the Glorious Koran: An Explanatory Translation」として出版したものは、その慎重さを題名そのものに刻んでいる——「英語のクルアーン」ではなく、その意味の説明である。彼自身が明言した見解によれば、いかなる翻訳もクルアーンそのものにはなり得なかったからである。アルフレッド・A・ノップフがニューヨークで初版を出し、続いてハイデラバード政府印刷所による二言語版が出た。
hero.3=The Times Literary Supplementはこれを「a great literary achievement」と評し、英語を母語とするムスリムによる初の英訳クルアーンとして一般に紹介されている——セールやロドウェルらによるそれ以前の英訳は、ムスリムでない東洋学者の手によるものであった。ピクソールの訳はそれ以来ほぼ一世紀にわたり印刷され、使われ続けてきた、学者だけでなく一般の読者が実際に読む数少ない英訳の一つである。
hero.4=本コーパスでは、これはウスマーン正書体のアラビア語本文の下に既定で表示される翻訳である——アラビア語はどの列でも底本のままであり、この英語はそれに取って代わることなく、常にその横に注釈として示される。この役割に選ばれたのは、文学的な理由と同じくらい、地味な理由からでもある。入手可能な翻訳を調べたところ、明確にパブリックドメインである英訳は二つしか見つからず、本訳と1934年のユースフ・アリー訳、そして第三の言語として1878年のサブルコフによるロシア語訳があるのみだった。ここにある本文は、特定の印刷物によらず、alquran.cloudを通じて得られた当該翻訳のデジタル化であり、したがって特定版の複写としてではなく、ピクソール自身の文言として読まれるべきである。

