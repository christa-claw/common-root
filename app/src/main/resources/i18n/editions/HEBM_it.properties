title=Bibbia ebraica — Su questa edizione | Common Root
description=Tutta la Bibbia in ebraico: l'Antico Testamento masoretico insieme al Nuovo Testamento di Franz Delitzsch del 1877, ritradotto nell'ebraico della Mishnah per lettori che volevano il libro intero in una sola lingua.
heroHeading=Bibbia ebraica — Antico Testamento masoretico e Nuovo Testamento di Delitzsch
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Una Bibbia ebraica da cima a fondo è un oggetto più strano di quanto suoni, perché metà di essa non fu mai scritta in ebraico. L'Antico Testamento è ebraico e lo è sempre stato. Il Nuovo Testamento ci è giunto in greco. Un'edizione come questa è dunque due generi di testo diversi cuciti insieme: un originale, e una traduzione fatta nella direzione opposta a quella consueta — dal greco e di ritorno alla lingua che i suoi autori per lo più parlavano.
hero.2=La metà neotestamentaria è opera di Franz Delitzsch, studioso di Lipsia dell'ebraico e della letteratura rabbinica, incaricato dalla Società biblica britannica e forestiera nel 1873 e giunto a termine nel 1877. Non tradusse nell'ebraico del proprio secolo. Scrisse nell'ebraico della Mishnah e dell'età del Secondo Tempio, sostenendo che un testo del primo secolo dovesse suonare come tale — sicché il risultato si legge meno come una resa in ebraico che come un tentativo di recuperare ciò che le frasi potevano essere prima di essere greche. È tuttora il Nuovo Testamento ebraico a cui si ricorre più spesso.
hero.3=Quale greco avesse sotto fu deciso in parte per lui. Cominciò dal Codice Sinaitico, il manoscritto del quarto secolo trovato pochi decenni prima, e la Società biblica — la cui norma era pubblicare secondo il testo ricevuto — rifiutò di continuare a finanziare una versione costruita su di esso. Delitzsch tornò al Textus Receptus e segnalò le lezioni sinaitiche di rilievo anziché adottarle. Il testo continuò poi a muoversi per tredici anni e dieci edizioni; l'ultima fu portata in tipografia da Gustav Dalman nel 1890, l'anno in cui Delitzsch morì. È una delle ragioni per cui il catalogo lascia in bianco l'anno di questa edizione: le due metà non condividono alcuna data, e la metà che ha date ne ha dieci.
hero.4=In questo lettore è l'edizione su cui si apre un'interfaccia ebraica — una scelta curata, non un caso alfabetico — e scegliere l'ebraico rovescia da destra a sinistra l'intera interfaccia attorno a essa. Sta accanto al Codice di Leningrado senza competere con lui: il Codice è il Tanakh degli studiosi, interamente vocalizzato e accentato e che si ferma dove si ferma l'Antico Testamento, mentre questo è un piano testo consonantico che prosegue fino all'Apocalisse. I pioli della discendenza non le registrano alcun antecedente, sicché un piolo aperto sotto un versetto cade diritto sul pavimento delle lingue originali, ≈ WLC e ≈ TR. Altrove in questo corpus quel pavimento è un'approssimazione, ed è di questo che il ≈ avverte. Qui quasi non lo è: l'Antico Testamento sullo schermo è il testo masoretico, e il Textus Receptus è ciò che Delitzsch aveva davvero davanti.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=ebraico — testo consonantico senza punti vocalici né segni di cantillazione
fact.2.label=Che cos'è
fact.2.value=due testi rilegati come una sola Bibbia: il tradizionale Antico Testamento masoretico, e un Nuovo Testamento ebraico tradotto dal greco nell'Ottocento
fact.3.label=Nuovo Testamento di
fact.3.value=Franz Delitzsch (1813–1890), l'ebraista di Lipsia
fact.4.label=Commissionato da
fact.4.value=la Società biblica britannica e forestiera nel 1873; la traduzione fu terminata nel 1877
fact.5.label=Antico Testamento da
fact.5.value=l'ebraico masoretico stesso — non una traduzione, il che ne fa l'unica edizione qui il cui Antico Testamento è già nella propria lingua originale, come lo è [[WLC|il Codice di Leningrado di Westminster]]
fact.6.label=Nuovo Testamento da
fact.6.value=il greco del [[TR|Textus Receptus]]. Delitzsch era invece partito dal Codice Sinaitico, ma la Società biblica pubblicava secondo il testo ricevuto e non volle finanziare lo scostamento
fact.7.label=Registro
fact.7.value=non è ebraico moderno. Delitzsch scrisse nell'ebraico della Mishnah e dell'età del Secondo Tempio, cercando di restituire al greco il giro di frase che i suoi parlanti avrebbero usato
fact.8.label=Riveduto fino al
fact.8.value=1890, l'ultima edizione portata in tipografia da Gustav Dalman
fact.9.label=Da non confondere con
fact.9.value=il Nuovo Testamento in ebraico moderno pubblicato dalla Società biblica in Israele, traduzione distinta del Novecento e ancora sotto diritti
fact.10.label=Anno nel catalogo
fact.10.value=lasciato in bianco — le due metà non condividono un anno, e il solo Nuovo Testamento fu riveduto lungo tredici anni e dieci edizioni
fact.11.label=In questo corpus
fact.11.value=tutti e 66 i libri, e la scelta predefinita curata per un'interfaccia ebraica — il lettore si apre su questa e non su [[WLC|il Codice di Leningrado di Westminster]], perché questa percorre tutto il Nuovo Testamento fino in fondo
