fact.13.value=الكتاب المقدس كاملًا — كل إصحاح من العهدين — مقروءًا بصوت Microsoft Azure العصبي الاصطناعي ru-RU-DmitryNeural، المُركَّب إصحاحًا إصحاحًا لا آية آية، ليحافظ النص على إيقاع جمله الطبيعي.
fact.14.label=حدود الصوت
fact.14.value=الصوت مُولَّد آليًا لا بقراءة بشرية، فلم تُراجَع نُطق الأسماء والمصطلحات تحريريًا؛ يتتبع سطر القراءة النص ويُبرز كل آية في نمط عرض "الآيات" فقط — وفي الأنماط الأخرى يستمر الصوت دون تمييز.
