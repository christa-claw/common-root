title=الترجمة السينودسية — عن هذه النسخة | Common Root
description=الترجمة السينودسية الروسية لعام 1876: بدأتها جمعية الكتاب المقدس الروسية عام 1813، وأتمّتها أربع أكاديميات لاهوتية أرثوذكسية بقيادة المطران فيلاريت، ولا تزال الكتاب المقدس الذي يقصده معظم الناطقين بالروسية حين يقولون ببساطة "الكتاب المقدس".
heroHeading=الترجمة السينودسية
readerHref=/reader?c1.src=syn

hero.1=بدأ المشروع عام 1813، حين شرعت جمعية الكتاب المقدس الروسية، المُنشأة حديثًا، بدعم من القيصر ألكسندر الأول، في ترجمة روسية يُراد لها أن تقف إلى جانب الكتاب المقدس السلافي الكنسي لا أن تحلّ محله. وظهر عهد جديد خلال سنوات قليلة. ورأى رجال الدين المحافظون في كتاب مقدس باللغة الروسية الدارجة تهديدًا لسلطة النص السلافي، فأغلق نيقولا الأول الجمعية عام 1826 وأوقف العمل ثلاثة عقود.
hero.2=لم تُستأنف الترجمة إلا في عهد ألكسندر الثاني. ففي عام 1858 أجاز المجمع المقدس نسخة روسية جديدة وأسند العمل إلى الأكاديميات اللاهوتية في موسكو وسانت بطرسبرغ وقازان وكييف، وتولى المطران فيلاريت (دروزدوف) متروبوليت موسكو مهمة التحرير الرئيسي والنهائي. وصدر العهد الجديد، المترجم عن النص اليوناني المطبوع المعروف بالنص المستلم (Textus Receptus)، عام 1862. أما العهد القديم فكان نقطة الخلاف الأصعب: إذ أصرّ فيلاريت على الرجوع إلى العبرية نفسها متجاوزًا النص السلافي، وهو ما عارضه المتمسكون بالأساس اليوناني للنص السلافي، ولم يصدر إذن المجمع الرسمي بالترجمة عن النص الماسوري إلا في العام نفسه 1862، حين كان معظم العهد القديم قد تُرجم بالفعل على هذا الأساس.
hero.3=صدر الكتاب المقدس الكامل — العهدان القديم والجديد مجتمعين لأول مرة بين دفتين بهذه الروسية الجديدة لا بالسلافية الكنسية — عام 1876 عن المطبعة السينودسية، ومنها جاءت التسمية الشائعة للترجمة. ولم يخرج عهده القديم عبريًا خالصًا: ففي المواضع التي اختلفت فيها السبعينية التي حفظها التقليد السلافي عن النص الماسوري، كانت القراءة اليونانية تُبقى غالبًا أيضًا، عادة كبديل بين قوسين، بحيث ظل الكتاب المكتمل يحمل دَينًا حقيقيًا للكتاب المقدس اليوناني الذي وقف خلف النص السلافي القديم.
hero.4=ولم يكن له منذ ذلك الحين منافس جاد. فالقراء الأرثوذكس والكاثوليك والمعمدانيون وغيرهم من البروتستانت في روسيا يرجعون جميعًا، بصورة أو بأخرى، إلى النص نفسه، وقد ترك أسلوبه بصمته على الروسية الأدبية كما تركت ترجمة الملك جيمس بصمتها على الإنجليزية. وتضم هذه النسخة في هذه المجموعة 66 سفرًا — القانون البروتستانتي لا القانون الأرثوذكسي الأوسع — وهي الكتاب المقدس الروسي الوحيد هنا، فتُفتح الواجهة الروسية عليها.

