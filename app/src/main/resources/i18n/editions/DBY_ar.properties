fact.3.label=العالِم الرئيس
fact.3.value=جون نلسن دَربي (1800–1882)، بالعمل مع وليم جوزيف لو وبيير شلومبرجيه — ولم يكن المترجم الأوحد لأيٍّ من النسخ التي تحمل اسمه
fact.4.label=العهد الجديد
fact.4.value=صدر أول مرة سنة 1859، وأُعيد طبعه سنة 1872 و1875 و1878
fact.5.label=الكتاب كاملًا
fact.5.value=سنة 1885، نُشر في بو وفيفي — بعد وفاة دَربي بثلاث سنين
fact.6.label=صُنع لأجل
fact.6.value=مجامع الإخوان، ولا سيّما مجامع سويسرا الناطقة بالفرنسية لا مجامع بو نفسها
fact.7.label=نوع الترجمة
fact.7.value=حرفية عن قصد، صُنعت للدرس الخاص لا للقراءة الجهرية؛ والاسم الإلهي يُنقل «l'Éternel» ولا يُترك «le Seigneur»
fact.8.label=النسخ الشقيقة
fact.8.value=الكتاب الألماني لدَربي هو الإلبرفلدية، وهي في هذه المجموعة [[ELB|Elberfelder 1905]]؛ أمّا عهد دَربي القديم الإنجليزي فصُنع من العمل الفرنسي والألماني لا عن إنجليزية دَربي نفسه رأسًا
fact.9.label=المحتوى
fact.9.value=66 سفرًا — القانون البروتستانتي، بلا أسفار قانونية ثانية
fact.10.label=في هذه المجموعة
fact.10.value=الكتاب المقدس الفرنسي الوحيد ههنا، فتفتح عليها الواجهة الفرنسية؛ ولا أصل مسجّل في درجات النسب، وتظهر شارة درجتها بلا سنة وإن كانت بطاقة الفهرس تُظهر 1885
