title=دَربي 1885 (الفرنسية) — عن هذه الطبعة | Common Root
description=كتاب دَربي الفرنسي سنة 1885: ترجمة بو وفيفي، بدأها جون نلسن دَربي وزملاؤه سنة 1859 وتمّت بعد وفاته بثلاث سنين، وهي النسخة التي بُني منها فيما بعد عهده القديم الإنجليزي.
heroHeading=دَربي 1885 (الفرنسية)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=يُذكر جون نلسن دَربي بغير هذا — فقد فارق كنيسة أيرلندا، وأسهم في تأسيس إخوان بليموث، وأشاع الألفية السابقة التدبيرية — غير أنه أنفق شطرًا كبيرًا من عمره في ترجمة الكتاب المقدس، وفعل ذلك بثلاث لغات. والغريب فيه هو الترتيب. فأكثر المترجمين يعملون خارجين من لسانهم هم. أمّا كتاب دَربي الإنجليزي فكان آخر الثلاثة تمامًا، ولم يصنع عهده القديم عن العبرية رأسًا، بل عن النسختين الفرنسية والألمانية اللتين كان قد أنجزهما من قبل مع آخرين.
hero.2=وهذه هي الفرنسية. كان دَربي العالِم الرئيس فيها، ولم يكن قطّ المترجم الأوحد لشيء يحمل اسمه؛ وقد ضمّ الفريق الفرنسي وليم جوزيف لو وبيير شلومبرجيه. صدر العهد الجديد سنة 1859 وأُعيد طبعه ثلاث مرات في العقدين التاليين. وخرج الكتاب كاملًا سنة 1885 في بو وفيفي — ومن هنا الاسم الذي يُعرف به عادةً — على أنّ صفحة العنوان تُضلّل قليلًا: فبو في أقصى جنوب فرنسا، والعمل إنما صُنع في المقام الأول لمجامع الإخوان في سويسرا الناطقة بالفرنسية. وكان دَربي قد مات سنة 1882، فلم يرَ الكتاب تامًّا.
hero.3=الترجمة حرفية عن مبدأ، وقد قال دَربي سبب ذلك صراحةً في مقدمة عهده الجديد الألماني: العالِم يستطيع الرجوع إلى الأصل، فغاية الترجمة أن تضع صورةً له أدقّ ما يمكن في أيدي من لا يستطيعون. وحذّر أيضًا من أنّ النقل الأحرّ يُضيّع معاني قد لا يكون المترجم نفسه قد أدركها. والنتيجة دقيقة غير مُحلّاة، ولم تُقصد قطّ للقراءة الجهرية — أمّا دَربي في وعظه هو فكان يستعمل King James Version.
hero.4=أمران يصلانها بسائر هذه المجموعة. فالكتاب الألماني لدَربي هو الإلبرفلدية، وهي ههنا باسم Elberfelder 1905 — الرجل نفسه، والمبادئ نفسها، وأحد النصّين اللذين رُكّب منهما عهده القديم الإنجليزي، حتى إنّ البطاقتين الفرنسية والألمانية أقرب قرابةً ممّا يوحي به اختلاف لغتيهما. وأمّا معاملتها للاسم الإلهي فتضعها إلى جانب American Standard Version، التي تطبع “Jehovah” ألوف المرات حيث تطبع King James Version “the LORD”؛ وقد اتّخذ دَربي القرار نفسه قبلها، بثلاث لغات. وهي في القارئ الكتابُ المقدس الفرنسي الوحيد، فتفتح عليها الواجهة الفرنسية. ولا أصل مسجّل لها في درجات النسب، وخلافًا لأكثر الطبعات المؤرّخة ههنا لا تحمل شارة درجتها سنةً البتة — فبطاقة الفهرس تُظهر 1885، لكنّ سنوات الدرجات قائمة مستقلّة مرتّبة باليد، وهذه الطبعة ليست فيها بعد.

