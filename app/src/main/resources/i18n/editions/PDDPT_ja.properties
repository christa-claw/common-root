title=Palabra de Dios para Ti — この版について | Common Root
description=Palabra de Dios para Ti：Asociación Bíblica Latinoamericanaが2020年に刊行したスペイン語訳。ヘブライ語の神名を音訳のまま保持し、あらゆる用途に自由に利用できるライセンスで公開されている。
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti──「あなたへの神の言葉」の意──は、Asociación Bíblica Latinoamericanaが2020年に刊行した新しいスペイン語訳である。電子テキストは2022年、フロリダ州に登録された非営利団体であり、eBible.orgとYouVersionを通じてこれを頒布するLatinamerican Textual Bible Foundation, Inc.によって公開された。訳業はフランシスコ・リエバノとジョイス・リエバノに帰せられている。このコーパスのスペイン語インターフェースが既定で開くレイナ・バレラ系列とは異なり、これはカシオドロ・デ・レイナによる十六世紀の訳、あるいはそれに連なるいかなるものの改訂でもない。原語から直接なされた独立した翻訳であり、スペイン語圏アメリカ全域の一般読者に向けられ、許可を求めることなく自由に引用されることを意図している。
hero.2=旧約聖書はBiblia Hebraica Stuttgartensiaに、新約聖書はエーバーハルト・ネストレのNovum Testamentum Graeceの第27版に従っている。ある一つの選択が、その紙面をレイナ以後の大半のスペイン語聖書から分かつ。それらが神聖四文字を「Jehová」と訳すか「Señor」に置き換えるのに対し、Palabra de Dios para Tiはヘブライ語の名そのものを音訳のまま保持する──Yavé、ʼElohim、ʼEL-Shadday──それゆえ創世記は、この版自身の言葉で、こう開く。「En un principio ʼElohim creó los cielos y la tierra.」
hero.3=この読書環境では、[[RVR09|レイナ・バレラ1909]]、[[BES|Biblia en Español Sencillo]]、[[VBL|ヴェルシオン・ビブリア・リブレ]]とともに、四つのスペイン語訳のうちの一つである。インターフェースは依然として既定でレイナ・バレラ1909を開く──これは自分自身のカードから切り替えて至る版である。他の二つと同様、これは新訳であってこのコーパスが収める他の何かの改訂ではないため、系譜の段に母本は記録されていない──その一節の下で段を開くと、≈ 印で示された原語の底面へ直接至る。Asociación Bíblica Latinoamericanaは次経を含むより完全な印刷版も刊行しているが、このコーパスが収めるのは通常の六十六巻からなるプロテスタント正典である。

