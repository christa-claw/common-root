title=Nueva Biblia de las Américas — عن هذه الطبعة | Common Root
description=Nueva Biblia de las Américas: مراجعة The Lockman Foundation الإسبانية اللاتينو-أمريكية لـLa Biblia de las Américas الخاصة بها، تحمل المنهج الحرفي نفسه إلى الإسبانية اليومية المتحدَّثة في الأمريكتين.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=تمثّل Nueva Biblia de las Américas طبعة The Lockman Foundation بالإسبانية اللاتينو-أمريكية، مبنية على La Biblia de las Américas السابقة للمؤسسة من عام 1986 — وهي نفسها نتاج نحو خمسة عشر عامًا من عمل اثنين وعشرين مترجمًا ومستشارًا، وفق فلسفة الترجمة الحرفية نفسها التي انتقلت لاحقًا إلى الإنجليزية باسم New American Standard Bible. وبدلاً من ترجمة جديدة من العبرية والیونانية، فإن NBLA مراجعة في السجل اللغوي: راجعت لجنة من اثني عشر عضوًا من Lockman إسبانية La Biblia de las Américas الأقرب إلى القشتالية، لتصبح الإسبانية المألوفة والحديثة المتحدَّثة في أمريكا اللاتينية كلها، فاستبدلت صيغًا مثل ضمير الجمع المخاطَب "vosotros" بالأكثر انتشارًا "ustedes"، وخفّفت تراكيب مثل "y" الصيغية و"sucedió que" التي كان النص السابق قد نقلها حرفيًا من أسلوب السرد العبري. ويحدد إشعار إذن الاقتباس الخاص بـThe Lockman Foundation تاريخ النص المكتمل بعام 2005.
hero.2=يتبع الأساس النصي La Biblia de las Américas مباشرة: يقوم العهد القديم على Biblia Hebraica لرودولف كيتل، مع الرجوع إلى مخطوطات البحر الميت، ويقوم العهد الجديد عمومًا على الطبعة 27 من Novum Testamentum Graece لإبرهارد نستله، مع الانتباه إلى شواهد مخطوطية إضافية حيث تؤثر على قراءة معينة. وقد صار بعض باعة الكتب وكتالوجات برامج الكتاب المقدس يجمعون الآن Nueva Biblia de las Américas مع مراجعة The Lockman Foundation لعام 2020 لـNew American Standard Bible، مسوّقين الاثنتين كزوج متناسق للقارئين الإنجليزي والإسباني لنفس التقليد الحرفي؛ إلا أن الترجمة نفسها لا تحمل في إشعارات المؤسسة نفسها تاريخ حق نشر لاحقًا لعام 2005.
hero.3=تفتح الواجهة الإسبانية هنا افتراضيًا على Reina Valera 1909، نص حرّ التداول من تقليد ترجمة مختلف تمامًا وأقدم بقرن كامل؛ أما Nueva Biblia de las Américas فتُبلَغ من بطاقتها الخاصة في شبكة الترجمات. وهي تتقاسم تاريخًا نصّيًا قليلًا مع تلك الطبعة، لكنها تتقاسم كثيرًا مع New American Standard Bible — المؤسسة نفسها، ومنهج المكافأة الصورية نفسه، والوضع المرخَّص نفسه لا حرّ التداول، الذي يسمح باقتباس حتى 500 آية دون إذن كتابي، شريطة ألا تشكّل كتابًا كاملًا أو أكثر من ربع العمل المقتبس. ولا أصل مسجَّل لها في درجات النسب: فLa Biblia de las Américas، النص الذي تراجعه، لا يُحفظ هو نفسه في هذه المجموعة، فتنزل الدرجة تحت آية من NBLA مباشرة إلى أرضية اللغة الأصلية الموسومة بـ≈.

fact.1.label=اللغة
fact.1.value=الإسبانية
fact.2.label=مَن أمر بها
fact.2.value=The Lockman Foundation في لا هابرا، كاليفورنيا — المنظمة غير الربحية نفسها التي تقف خلف New American Standard Bible وسابقتها الخاصة La Biblia de las Américas (1986)
fact.3.label=أنجزها
fact.3.value=لجنة مراجعة من اثني عشر عضوًا من Lockman، عملت انطلاقًا من ترجمة La Biblia de las Américas، وهي نفسها عمل اثنين وعشرين مترجمًا ومستشارًا على مدى نحو خمسة عشر عامًا
fact.4.label=العهد القديم عن
fact.4.value=Biblia Hebraica لرودولف كيتل، مع الرجوع إلى مخطوطات البحر الميت، موروثة عن الأساس النصي الخاص بـLa Biblia de las Américas
fact.5.label=العهد الجديد عن
fact.5.value=Novum Testamentum Graece لإبرهارد نستله، عمومًا الطبعة 27، مع الانتباه إلى شواهد مخطوطية إضافية حيث تؤثر على قراءة ما
fact.6.label=نوع الترجمة
fact.6.value=مكافأة صورية، المنهج الحرفي نفسه المتبع في La Biblia de las Américas وNew American Standard Bible — لا ترجمة جديدة، بل مراجعة في السجل اللغوي إلى الإسبانية المألوفة والحديثة المتحدَّثة في أمريكا اللاتينية كلها، باستبدال صيغ قشتالية مثل "vosotros" بـ"ustedes" وإعادة صياغة تراكيب مثل "y" الصيغية و"sucedió que" التي نقلها النص السابق حرفيًا من العبرية
fact.7.label=نُشر
fact.7.value=سُجّل حق النشر عام 2005 لصالح The Lockman Foundation؛ وتجمعها بعض الكتالوجات منذ ذلك الحين مع مراجعة المؤسسة لعام 2020 لـNew American Standard Bible، لكن عام 2005 يبقى العام المذكور في إشعار حق النشر الخاص بها
fact.8.label=الترخيص
fact.8.value=مرخَّصة، لا ملكية عامة. يمكن اقتباس حتى 500 آية بأي صيغة دون إذن كتابي، شريطة ألا تشكّل كتابًا كاملًا من الكتاب المقدس أو أكثر من ربع العمل المقتبس، مع إشعار حق نشر يذكر عام 2005؛ وأي استخدام يتجاوز ذلك يتطلب إذن The Lockman Foundation
fact.9.label=في هذه المجموعة
fact.9.value=مرخَّصة لا ملكية عامة، مثل [[NASB|New American Standard Bible]] من المؤسسة نفسها. تفتح الواجهة الإسبانية افتراضيًا على [[RVR09|Reina Valera 1909]]، نص حرّ التداول من تقليد غير ذي صلة وأقدم بقرن كامل، بينما تُبلَغ هذه الطبعة من بطاقتها الخاصة. ولا أصل مسجَّل لها في درجات النسب: فهي مراجعة في السجل اللغوي لـLa Biblia de las Américas، التي لا تُحفظ هي نفسها في هذه المجموعة، فتنزل الدرجة تحت آية من NBLA مباشرة إلى أرضية اللغة الأصلية الموسومة بـ≈.
