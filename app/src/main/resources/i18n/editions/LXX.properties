title=Brenton Greek Septuagint — About This Edition | Common Root
description=The Septuagint — the Greek Old Testament of the Jewish diaspora and the early Church — in the Greek text Lancelot Brenton printed beside his English in 1851, and the rung beneath the Vulgate and the Russian Synodal in this reader.
heroHeading=Brenton Greek Septuagint
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=The Septuagint is the oldest translation of the Hebrew Bible, and for the first Christian centuries it was simply the Bible. Greek-speaking Jews in Alexandria began it with the five books of the Law, probably in the third century BC, and the other books followed over the next two centuries. The name comes from a story: the Letter of Aristeas tells of seventy-two elders sent from Jerusalem to translate the Law for King Ptolemy II, and “the Seventy” — LXX in Roman numerals — became the name of the whole Greek Old Testament. The writers of the New Testament quote it constantly, the early Church read it, and the Orthodox churches still read it as their Old Testament.
hero.2=It matters for more than its age. The translators worked from Hebrew manuscripts that differed in places from the Masoretic text later made standard — Jeremiah, for one, is markedly shorter in the Greek — so at many points the Septuagint is the oldest evidence for a Hebrew reading that the Hebrew tradition itself did not keep. It also carries books the Hebrew canon does not, among them Tobit, Judith, Wisdom, Sirach and Baruch. And some of its word choices became doctrine: at Isaiah 7:14, where the Hebrew has ʿalmah, a young woman, the Greek has parthenos, a virgin, the word Matthew quotes.
hero.3=The Greek here is the text Sir Lancelot Brenton printed. He published an English translation of the Septuagint in 1844, made principally from Codex Vaticanus, the fourth-century manuscript in the Vatican Library; in 1851 Samuel Bagster of London issued it again with the apocryphal books added and the Greek set beside the English, and it is that Greek this corpus holds. Its Psalms keep the Greek numbering, which the Vulgate here shares: Psalm 22 in both is the shepherd psalm, Psalm 23 in the Hebrew and in most English Bibles. There are 151 psalms; Ezra and Nehemiah stand as a single book; Esther and Daniel are in their longer Greek forms.
hero.4=In this reader it is a rung, not the floor. It stands beneath the Latin Vulgate, because part of the Vulgate came through Greek: its Psalter is the one Jerome made from the Greek of Origen's Hexapla, never displaced by his own translation from the Hebrew, and Wisdom, Sirach and Baruch were left in Old Latin versions made from the Greek. It stands beneath the Russian Synodal, whose Old Testament kept many Septuagint readings from the Slavonic Bible behind it, and beneath Brenton's own English translation. It has no recorded parent of its own: the Hebrew it was made from is not in the corpus, and the Westminster Leningrad Codex, more than a thousand years younger and of the Masoretic line, appears underneath it only as the original-language floor. It is Old Testament only, so under a New Testament verse the rung is skipped — and not every book of the Greek tradition is here: this copy has 45 books, and no books of Maccabees.

