title=Diodati 1885 (İtalyanca) — Bu Baskı Hakkında | Common Root
description=Giovanni Diodati'nin İtalyanca Kutsal Kitap'ı on dokuzuncu yüzyıldan bir biçimde: 1641 metni 1821 revizyonuyla, 1885 tarihli bir baskıda — bu derlemedeki öteki Diodati ile aynı çeviri, yalnızca ayetlere başka türlü bölünmüş.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Bu, Giovanni Diodati'nin çevirisidir — 1576'da doğan, Lucca kökenli aileden Cenevreli; 1607'de Latinceden değil İbranice ve Yunancadan yapılmış ilk İtalyanca Kutsal Kitap'ı yayımlamış ve ölümünden sekiz yıl önce, 1641'de, kendi notlarıyla gözden geçirmişti. Bu derlemedeki öteki Diodati'nin o hikâyeyi anlatan kendi sayfası vardır. Ondan sonraki iki yüzyıl boyunca metin yeniden basılarak yaşadı ve 1808'den itibaren İngiliz ve Yabancı Kutsal Kitap Derneği onu baskı üstüne baskı yayımladı, çünkü İtalyan Protestanlar için basılacak başka bir şey yoktu.
hero.2=Bu dosya o sonraki biçimlerden biridir. Onu Birleşik Kutsal Kitap Dernekleri adına sunan eBible.org, onu Diodati'nin 1641 çevirisinin 1821'de gözden geçirilmiş hâli olarak, 1885 tarihli bir baskıda tanımlar. 1821 revizyonunu kimin yaptığı ve 1885 baskısını hangi matbaanın bastığı bu projece saptanmış değildir, bu yüzden sayfa onların adını vermez. Tarih burada, etiketi Diodati'nin ölüm yılı olan öteki Diodati'deki gibi bir sorun değildir: 1885 baskının kendi tarihidir, katalog onu saklar ve basamak etiketi onu gösterir.
hero.3=Öteki Diodati'nin yanına konunca, her yoklamada ifade aynıdır: Mezmur 23'te “il Signore è il mio pastore”, Yeşaya 7:14'te “la Vergine concepirà”, 1. Yuhanna 5:7'de göksel tanıklar, Rab'bin duasının sonunda övgü cümlesi, Elçilerin İşleri 8:37 eksiksiz. Tanrı'nın adı, Diodati'nin yazdığı gibi “il Signore”, yani Rab'dir; onu “l'Eterno” yapan, bu metnin 1924'te yayımlanan bir revizyonu olan Riveduta'dır. Farklı olan ayet bölümlemesidir. Otuzdan fazla yerde bu kopya İbranice olana yakın başka bir düzeni izler — Yunus'un duası 2:1'de başlar ve bölüm 2:11'e kadar gider, Yeşaya 8'in 23. ayeti vardır, Eyüp 39 ayet 38'e kadar sürer ve Koloseliler 4'ün ilk ayeti 3. bölümün sonunda durur — bu yüzden toplamda yedi ayet eksik sayar. Ayrıca bu kopyada mezmur başlıklarının hiçbiri yoktur: Mezmur 51 doğrudan “Abbi pietà di me, o Dio” ile açılır, oysa öteki Diodati başlığı ilk ayete katar. eBible.org'un bu metni kendi sunuşu başlıkları gösterir; dolayısıyla büyük olasılıkla bu projenin içe aktarımında kaybolmuşlardır, 1885 baskısında eksik değildirler.
hero.4=Bu okuyucuda üç İtalyanca Kutsal Kitap'tan biridir. İtalyanca bir arayüz öteki Diodati'yi, yani Diodati 1649'u açar; İtalyanca için elle yapılmış bir seçim olmadığından katalog sırasında ilk o gelir. Soy basamaklarında bunun için kayıtlı bir kaynak yoktur — aynı çevirinin o öteki kopyası bile — bu yüzden bir ayetin altında açılan basamak doğrudan ≈ ile işaretli kaynak dil tabanına düşer. Öteki Diodati'de olduğu gibi, oradaki Textus Receptus gerçeğe yakındır: Diodati, Beza'nın basılı Yunanca metninden, o aileden bir metinden çalıştı.

