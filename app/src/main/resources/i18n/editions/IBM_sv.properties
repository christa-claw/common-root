title=Sunan Ibn Majah — Om denna utgåva | Common Root
description=Sunan Ibn Majah: den sista av sunniislams Sex böcker, ordnad efter rättsligt ämne, vars plats bland dem länge varit omtvistad på grund av de svaga och förfalskade hadither den också innehåller.
heroHeading=Sunan Ibn Majah
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd Allah Muhammad ibn Yazid Ibn Majah al-Rabi'i al-Qazwini föddes år 209 e.H. (824 e.Kr.) i Qazwin, som i dag ligger i nordvästra Iran, i en familj av mawali (icke-arabiska klienter) av Rabi'ah-stammen — Majah var, enligt en uppgift, hans fars smeknamn och inte namnet på en farfar eller en mor. Han reste i jakt på hadither genom Irak, Hijaz, Syrien och Egypten och studerade hos en vid krets av lärda; mer än en fjärdedel av hans kommande Sunan sägs vila på en enda lärare, Ibn Abi Shaybah. Samtida som Abu Ya'la al-Khalili prisade honom som tillförlitlig, framstående och en enhälligt erkänd auktoritet. Han dog i Qazwin år 273 e.H. (887 e.Kr.), även om al-Kattani också anger år 275 (889 e.Kr.); enligt den traditionella berättelsen anmärkte Abu Zur'a al-Razi, efter att Ibn Majah läst upp det färdiga Sunan för honom, att de andra Sunan-samlingarna till stor del skulle bli överflödiga om människor ägde denna bok.
hero.2=Hans Sunan omfattar, enligt al-Dhahabis räkning, omkring 1 500 kapitel och omkring 4 000 hadither, ordnade efter rättsligt ämne liksom [[ABD|Abu Dawuds]] och [[TIR|at-Tirmidhis]] samlingar. Vid sidan av sund och godtagbar material innehåller den också hadither som senare lärda bedömde som svaga, däribland omkring trettio som allmänt anses vara rena förfalskningar — skälet till att några lärda bara räknar "de Fem" i stället för de Sex.
hero.3=Sunnitisk tradition räknar Sunan Ibn Majah som den sista av Sex böckerna (Kutub al-Sittah), tillsammans med [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]] och [[NAS|Sunan an-Nasa'i]]. Denna sjätte plats är i sig omtvistad: malikiterna och Ibn al-Athir nämner, bland andra, i stället [[MAL|Muwatta Malik]], och några nämner al-Daraqutnis Sunan; Ibn Majahs bok sägs i allmänhet ha fått platsen eftersom dess innehåll överlappar minst med de andra fem, inte eftersom den anses mest tillförlitlig av kandidaterna.
hero.4=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-ibnmajah-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]] och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

