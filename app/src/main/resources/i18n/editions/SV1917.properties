title=Svenska 1917 — About This Edition | Common Root
description=The Church of Sweden's 1917 translation — Gustav V:s bibel — the first Swedish Bible made directly from Hebrew and Greek rather than revised from the one before it, and the only Swedish Bible this corpus holds.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=For three and a half centuries, the Church of Sweden had one Bible, revised but never remade. Gustav Vasa's Bible of 1541, the first complete Bible printed in Swedish, leaned heavily on Martin Luther's German. Gustav II Adolf's Bible of 1618 revised it, and Karl XII:s bibel of 1703 — finished under one king though ordered by his father before him — carried the same inherited Swedish another step forward. None of the three went back to begin again.
hero.2=In 1773 Gustav III appointed a Bible commission to do what none of those revisions had: translate directly from Hebrew and Greek rather than carry the old Swedish forward once more. The commission sat for 144 years. Its result — Sweden's second complete Bible translation, after Gustav Vasa's and before Bibel 2000 — was finished and authorised under Gustav V in 1917, and is still often called Gustav V:s bibel for that reason.
hero.3=The Old Testament rests on the Masoretic Hebrew text, as the editions before it had. The New Testament does not continue their line: it follows the most up-to-date critical Greek text available to the commission by 1917, rather than the Textus Receptus this corpus's Reformation-era Bibles are built on.
hero.4=In this reader it is the only Swedish Bible, so setting the interface to Swedish opens on it — not as a curated pick, the way Reina-Valera 1909 is picked for Spanish, but because the catalogue scan finds nothing else in the language. It has no recorded parent in the lineage rungs, so opening a rung beneath a verse drops straight to the original-language floor marked with ≈. That floor supplies the Textus Receptus for the Greek, and here it sits further from the truth than usual: the commission deliberately left the Textus Receptus behind for a more up-to-date critical text, so the floor beneath a verse of this translation names a Greek text that is not the one it actually followed.

