title=Vulgate clémentine — À propos de cette édition | Common Root
description=La Vulgate clémentine : la révision pontificale de la Bible latine de Jérôme, imprimée à Rome en 1592 et rééditée avec des corrections en 1593 et 1598 — le texte latin de référence de l'Église catholique jusqu'en 1979, et dans ce lecteur un échelon au-dessus de la Vulgate.
heroHeading=Vulgate clémentine
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=En 1546, le concile de Trente déclara la Vulgate Bible latine authentique de l'Église, laissant ouverte une question à laquelle il ne répondit pas : quelle Vulgate ? Onze siècles de copie à la main n'avaient pas laissé deux manuscrits tout à fait semblables, et le concile demanda un texte corrigé. Le pape Sixte V en fournit un en 1590, révisé en bonne partie de sa propre main, sous une bulle qui le déclarait authentique. Il mourut en août de la même année, et en quelques semaines les cardinaux en avaient arrêté la vente. Sous Clément VIII, une commission — Francisco de Toledo parmi les éditeurs, Robert Bellarmin au centre du travail — en prépara le remplaçant, imprimé à Rome en 1592. Des réimpressions de plus petit format en 1593 et 1598 en éliminèrent la plupart des coquilles et y ajoutèrent les prologues de Jérôme et des renvois marginaux.
hero.2=Ce texte fut la Bible latine de référence de l'Église catholique pendant près de quatre siècles, jusqu'à la Nova Vulgata de 1979, et le missel et le bréviaire de 1962 l'emploient encore. C'est la Bible de Jérôme telle que l'Église l'avait reçue, non telle qu'il l'avait laissée. Les Psaumes sont son psautier gallican, révisé sur le grec, et non sa traduction ultérieure depuis l'hébreu ; ils gardent donc la numérotation grecque : le Psaume 22 commence ici par « Dominus regit me », le psaume du berger. En 1 Jean 5,7, il porte le Comma Johanneum, « Pater, Verbum, et Spiritus Sanctus », un ajout latin que les premiers manuscrits grecs n'ont pas. Esther et Daniel figurent sous leurs formes longues, les ajouts grecs étant rassemblés à la fin d'Esther et dans les deux derniers chapitres de Daniel. Le fichier d'eBible.org dont provient cette copie imprime le texte de 1598 avec la Glossa Ordinaria en notes — le commentaire du XIIe siècle issu de l'école d'Anselme de Laon, dans l'édition de Migne de 1880. Les notes ne sont pas passées dans le corpus ; les crochets de certains versets sont ceux de la source.
hero.3=Dans ce lecteur, c'est un échelon avec un seul parent enregistré, la Vulgate latine : ouvrez un échelon sous l'un de ses versets et la Vulgate apparaît. Attendez-vous à ce que les deux se lisent presque mot pour mot de la même façon. La Vulgate de ce corpus est elle-même tirée d'un texte clémentin, si bien que ce qui les sépare est surtout la ponctuation — et les livres qui manquent à cette copie. Elle en a 66, les livres du canon protestant, avec Esther et Daniel sous leurs formes longues. Les fichiers sources contiennent aussi Tobie, Judith, la Sagesse, le Siracide, Baruch et les deux livres des Maccabées, que la Vulgate au-dessous possède tous ; aucun n'est passé, si bien que là où la Vulgate a Tobie, il n'y a rien au-dessus. La Prière de Manassé et 3 et 4 Esdras, que la Clémentine imprimait en appendice, ne sont ni dans la source ni dans le corpus. Rien dans le corpus ne repose à son tour sur cette édition.

