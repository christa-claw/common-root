title=Brentons grekiska Septuaginta — Om denna utgåva | Common Root
description=Septuaginta — den judiska diasporans och den tidiga kyrkans grekiska Gamla testamente — i den grekiska text som Lancelot Brenton tryckte bredvid sin engelska 1851, och stegpinnen under Vulgata och den ryska Synodalöversättningen i denna läsare.
heroHeading=Brentons grekiska Septuaginta
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=Septuaginta är den äldsta översättningen av den hebreiska bibeln, och under de första kristna århundradena var den helt enkelt Bibeln. Grekisktalande judar i Alexandria började med lagens fem böcker, troligen på 200-talet f.Kr., och de övriga böckerna följde under de två närmaste århundradena. Namnet kommer från en berättelse: Aristeasbrevet berättar om sjuttiotvå äldste som sändes från Jerusalem för att översätta lagen åt kung Ptolemaios II, och ”de sjuttio” — LXX med romerska siffror — blev namnet på hela det grekiska Gamla testamentet. Nya testamentets författare citerar det ständigt, den tidiga kyrkan läste det, och de ortodoxa kyrkorna läser det fortfarande som sitt Gamla testamente.
hero.2=Den betyder mer än sin ålder. Översättarna arbetade från hebreiska handskrifter som på sina ställen skilde sig från den masoretiska text som senare blev norm — Jeremia är till exempel märkbart kortare på grekiska — så på många ställen är Septuaginta det äldsta belägget för en hebreisk läsart som den hebreiska traditionen själv inte bevarade. Den innehåller också böcker som den hebreiska kanon saknar, bland dem Tobit, Judit, Vishetens bok, Syraks bok och Baruk. Och en del av dess ordval blev lära: i Jesaja 7:14, där hebreiskan har ʿalmah, en ung kvinna, har grekiskan parthenos, en jungfru — det ord som Matteus citerar.
hero.3=Den grekiska texten här är den som Sir Lancelot Brenton tryckte. Han gav 1844 ut en engelsk översättning av Septuaginta, gjord huvudsakligen efter Codex Vaticanus, handskriften från 300-talet i Vatikanbiblioteket; 1851 gav Samuel Bagster i London ut den på nytt med de apokryfiska böckerna tillagda och grekiskan satt bredvid engelskan, och det är den grekiskan som detta korpus innehåller. Dess psaltare följer den grekiska numreringen, som Vulgata här delar: i båda är Psalm 22 herdepsalmen, Psalm 23 i hebreiskan och i de flesta engelska biblar. Psalmerna är 151; Esra och Nehemja står som en enda bok; Ester och Daniel finns i sina längre grekiska former.
hero.4=I denna läsare är den en stegpinne, inte botten. Den står under den latinska Vulgata, eftersom en del av Vulgata kom via grekiskan: dess psaltare är den som Hieronymus gjorde från grekiskan i Origenes Hexapla och som aldrig ersattes av hans egen översättning från hebreiskan, och Vishetens bok, Syraks bok och Baruk lämnades kvar i gammallatinska översättningar gjorda från grekiskan. Den står under den ryska Synodalöversättningen, vars Gamla testamente behöll många Septuaginta-läsarter från den kyrkoslaviska bibel som låg bakom den, och under Brentons egen engelska översättning. Någon registrerad förlaga har den inte: den hebreiska text den översattes från finns inte i korpuset, och Leningradkodexen, mer än tusen år yngre och av den masoretiska linjen, syns under den bara som grundspråksbotten. Den omfattar bara Gamla testamentet, så under en vers i Nya testamentet hoppas stegpinnen över — och inte alla böcker i den grekiska traditionen finns här: detta exemplar har 45 böcker och ingen av Mackabeerböckerna.

