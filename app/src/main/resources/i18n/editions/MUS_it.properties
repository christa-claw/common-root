title=Sahih Muslim — Su questa edizione | Common Root
description=Sahih Muslim: insieme al Sahih al-Bukhari forma i Sahihayn, le due raccolte che l'islam sunnita colloca subito dopo il Corano; Muslim ibn al-Hajjaj lo compose a partire da hadith raccolti nella penisola arabica, in Egitto, in Iraq e in Siria, ammettendo solo quelli con una catena di trasmettitori affidabili ininterrotta.
heroHeading=Sahih Muslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi nacque a Nishapur, nella provincia abbaside del Khorasan (nell'attuale Iran nord-orientale); le fonti divergono sull'anno, indicando il 202, il 204 o il 206 dell'Egira (circa 817–822 d.C.). Viaggiò nella penisola arabica, in Egitto, in Iraq e in Siria per raccogliere hadith dagli studiosi di ciascun luogo, per poi stabilirsi di nuovo nella sua città natale, dove conobbe al-Bukhari, studiò sotto di lui e ne rimase amico per il resto della vita. Secondo al-Khatib al-Baghdadi, intraprese l'opera a richiesta di un suo studente, Ahmad ibn Salama al-Naysaburi; il titolo originale, al-Musnad al-Sahih al-Mukhtasar, viene di solito abbreviato, come quello di al-Bukhari, in Sahih Muslim. Morì a Nishapur nel 261 dell'Egira (875 d.C.) e fu sepolto nel suo sobborgo di Nasarabad.
hero.2=Ammetteva un hadith solo quando la sua catena di trasmissione risaliva ininterrotta a un compagno di Muhammad, passando a ogni anello per almeno due trasmettitori affidabili; classificava i trasmettitori in tre livelli secondo la memoria e il carattere, ed escludeva quelli la cui onestà fosse stata messa in dubbio. Il suo commentatore al-Nawawi notò un'ulteriore cura: Muslim, scrisse, collocava ogni hadith in un unico luogo appropriato insieme a tutte le sue catene e varianti di formulazione, invece di lasciarle apparire disperse — una presentazione che commentatori successivi hanno contrapposto alla pratica del [[BUK|Sahih al-Bukhari]], che inserisce separatamente le diverse formulazioni di un hadith, ciascuna sotto il capitolo il cui punto essa illustra.
hero.3=Quanti hadith contenga davvero il libro dipende, come per il [[BUK|Sahih al-Bukhari]], da chi conta e da come vengono trattate le ripetizioni. Kâtip Çelebi e Siddiq Hasan Khan arrivarono entrambi a 7.275; Muhammad Fu'ad Abd al-Baqi, contando senza ripetizioni, a 3.033; Mashhur ibn Hasan Al Salman a 7.385, o 7.395 contando i dieci hadith della stessa introduzione di Muslim; altre stime collocano il totale tra circa 5.500 e 7.500. Al-Jawzaqi contò 2.326 hadith condivisi, quasi parola per parola, con il Sahih al-Bukhari. Il numero proprio di questo corpus è ancora un altro: 57 libri e 7.563 hadith numerati, che riflette semplicemente la forma dell'edizione digitale da cui è stato tratto, senza pretendere di riprodurre esattamente una particolare numerazione a stampa.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-muslim di fawazahmed0/hadith-api e allineata hadith per hadith con l'arabo, così che i due possano essere letti in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]] e per le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in fase di revisione piuttosto che semplicemente di pubblico dominio; l'arabo sopra non porta questa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese mostrata sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi (n. 202–206 dell'Egira / c. 817–822 d.C. – m. 261 dell'Egira / 875 d.C.)
fact.3.label=Titolo completo
fact.3.value=al-Musnad al-Sahih al-Mukhtasar — di solito abbreviato in Sahih Muslim
fact.4.label=Compilato
fact.4.value=hadith raccolti nella penisola arabica, in Egitto, in Iraq e in Siria; l'opera stessa completata a Nishapur, nel Khorasan, a richiesta di uno studente
fact.5.label=Metodo
fact.5.value=ammette un hadith solo con una catena ininterrotta di almeno due trasmettitori affidabili a ogni anello fino a un compagno di Muhammad; trasmettitori classificati in tre livelli di affidabilità, esclusi quelli di onestà controversa
fact.6.label=Posizione
fact.6.value=il secondo dei Sei Libri dell'islam sunnita (Kutub al-Sitta); insieme al [[BUK|Sahih al-Bukhari]] forma «i Sahihayn», le due raccolte collocate in autorità subito dopo il Corano; la maggior parte degli studiosi colloca l'intera raccolta di al-Bukhari sopra questa
fact.7.label=Numero di hadith
fact.7.value=le cifre vanno da 3.033 senza ripetizione (Abd al-Baqi) a 7.275–7.395 con ripetizione, secondo il metodo di conteggio; le edizioni a stampa differiscono sia nella numerazione dei capitoli sia in quella degli hadith
fact.8.label=In questo corpus
fact.8.value=57 libri e 7.563 hadith numerati — la forma propria del set di dati di origine, non la riproduzione di una particolare numerazione a stampa
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-muslim di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione a stampa discenda non è ancora confermato da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in fase di revisione
