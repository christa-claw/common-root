title=Nueva Biblia de las Américas — Bu Baskı Hakkında | Common Root
description=Nueva Biblia de las Américas: The Lockman Foundation'ın kendi La Biblia de las Américas'ı üzerine yaptığı Latin Amerika İspanyolcasına gözden geçirme; aynı kelimesi kelimesine yöntemi Amerika kıtalarında konuşulan gündelik İspanyolcaya taşır.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas, The Lockman Foundation'ın Latin Amerika İspanyolcası baskısıdır; Vakfın 1986 tarihli önceki La Biblia de las Américas'ı üzerine kuruludur — bu da kendisi, yirmi iki çevirmen ve danışmanın on beş yıl kadar süren çalışmasının ürünüdür ve daha sonra İngilizceye New American Standard Bible olarak taşınan aynı kelimesi kelimesine çeviri felsefesini izler. İbranice ve Yunancadan yeni bir çeviri olmak yerine, NBLA bir register gözden geçirmesidir: on iki kişilik bir Lockman komitesi, La Biblia de las Américas'ın daha Kastilyan İspanyolcasını, Latin Amerika'nın tümünde konuşulan tanıdık, modern İspanyolcaya yeniden işlemiş; ikinci çoğul şahıs biçimi olan "vosotros"u daha yaygın "ustedes" ile değiştirmiş ve önceki metnin İbranice anlatı üslubundan harfiyen devraldığı kalıplaşmış "y" ve "sucedió que" gibi yapıları yumuşatmıştır. The Lockman Foundation'ın kendi alıntılama izni bildirimi, tamamlanan metni 2005 yılına tarihlendirir.
hero.2=Metin temeli doğrudan La Biblia de las Américas'tan gelir: Eski Antlaşma, Lut Gölü Tomarlarına da başvurularak Rudolf Kittel'in Biblia Hebraica'sına dayanır; Yeni Antlaşma ise genel olarak Eberhard Nestle'nin Novum Testamentum Graece'sinin 27. baskısına dayanır, belirli bir okumayı etkilediği yerlerde ek elyazması kanıtlarına da dikkat edilerek. Bazı kitapçılar ve İncil yazılımı katalogları artık Nueva Biblia de las Américas'ı, Vakfın 2020 tarihli New American Standard Bible gözden geçirmesiyle birlikte gruplandırıyor; ikisini aynı harfî gelenekten İngilizce ve İspanyolca okurlar için eşleşen bir çift olarak pazarlıyor. Ancak çevirinin kendisi, Vakfın kendi bildirimlerinde 2005'ten daha sonraki bir telif hakkı tarihi taşımaz.
hero.3=İspanyolca arayüz burada varsayılan olarak, tamamen ayrı bir çeviri gelenekten gelen ve bir yüzyıl daha eski, özgürce kopyalanabilir bir metin olan Reina Valera 1909'da açılır; Nueva Biblia de las Américas'a ise bunun yerine çeviri ızgarasındaki kendi kartından ulaşılır. Bu baskıyla az metinsel tarih paylaşır, ama New American Standard Bible ile çok şey paylaşır — aynı vakıf, aynı biçimsel eşdeğerlik yöntemi ve tam bir kitap ya da alıntılayan eserin dörtte birinden fazlasını oluşturmamak koşuluyla, yazılı izin olmadan 500 ayete kadar alıntılamaya izin veren aynı lisanslı, kamuya mal olmamış durum. Soy basamaklarında ona kayıtlı bir ebeveyn yoktur: gözden geçirdiği metin olan La Biblia de las Américas bu derlemede tutulmamaktadır, böylece bir NBLA ayetinin altındaki basamak doğrudan ≈ işaretli özgün-dil tabanına iner.

fact.1.label=Dil
fact.1.value=İspanyolca
fact.2.label=Ismarlanışı
fact.2.value=Kaliforniya, La Habra'daki The Lockman Foundation — New American Standard Bible'ın ve kendi öncülü La Biblia de las Américas'ın (1986) ardındaki aynı kâr amacı gütmeyen kuruluş
fact.3.label=Hazırlayanlar
fact.3.value=La Biblia de las Américas'ın çevirisi üzerinden çalışan on iki kişilik bir Lockman gözden geçirme komitesi; bu çeviri de kendisi yirmi iki çevirmen ve danışmanın on beş yıl kadar süren eseridir
fact.4.label=Eski Antlaşma kaynağı
fact.4.value=Rudolf Kittel'in Biblia Hebraica'sı, Lut Gölü Tomarlarına da başvurularak; La Biblia de las Américas'ın kendi metin temelinden devralınmıştır
fact.5.label=Yeni Antlaşma kaynağı
fact.5.value=Eberhard Nestle'nin Novum Testamentum Graece'si, genel olarak 27. baskı; belirli bir okumayı etkilediği yerlerde ek elyazması kanıtlarına dikkat edilerek
fact.6.label=Çeviri türü
fact.6.value=Biçimsel eşdeğerlik, La Biblia de las Américas ve New American Standard Bible ile aynı kelimesi kelimesine yöntem — yeni bir çeviri değil, Latin Amerika'nın tümünde konuşulan tanıdık, modern İspanyolcaya bir register gözden geçirmesi; "vosotros" gibi Kastilyan biçimleri "ustedes" ile değiştirilmiş, önceki metnin İbraniceden harfiyen devraldığı kalıplaşmış "y" ve "sucedió que" gibi yapılar yeniden işlenmiştir
fact.7.label=Yayımlanışı
fact.7.value=The Lockman Foundation tarafından 2005'te telif hakkıyla korunmuştur; bazı kataloglar o zamandan beri onu Vakfın 2020 tarihli New American Standard Bible gözden geçirmesiyle birlikte gruplandırıyor, ama 2005 kendi telif hakkı bildiriminde belirtilen yıl olarak kalır
fact.8.label=Lisans
fact.8.value=Lisanslı, kamu malı değil. Tam bir Kutsal Kitap kitabı oluşturmamak ve alıntılayan eserin dörtte birinden fazlasını aşmamak koşuluyla, 2005'i belirten bir telif hakkı bildirimiyle, yazılı izin olmadan herhangi bir biçimde 500 ayete kadar alıntılanabilir; bunun ötesindeki her kullanım The Lockman Foundation'ın izni gerektirir
fact.9.label=Bu derlemede
fact.9.value=Aynı vakıftan [[NASB|New American Standard Bible]] gibi, kamu malı değil lisanslıdır. İspanyolca arayüz varsayılan olarak, ilişkisiz bir gelenekten gelen ve bir yüzyıl daha eski, özgürce kopyalanabilir bir metin olan [[RVR09|Reina Valera 1909]]'da açılır; bu baskıya ise kendi kartından ulaşılır. Soy basamaklarında ona kayıtlı bir ebeveyn yoktur: bu derlemede tutulmayan La Biblia de las Américas'ın bir register gözden geçirmesidir, böylece bir NBLA ayetinin altındaki basamak doğrudan ≈ işaretli özgün-dil tabanına iner.
