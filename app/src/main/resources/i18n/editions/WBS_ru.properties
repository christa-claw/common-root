title=Webster's Bible — Об этом издании | Common Root
description=Редакция King James Version, выполненная Ноем Уэбстером в 1833 году и изданная в Нью-Хейвене, штат Коннектикут, — общепринятая английская Библия, сохранённая почти слово в слово, с заменой вышедших из употребления слов, исправленной грамматикой и несколькими смягчёнными для чтения вслух выражениями.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Ной Уэбстер (1758–1843), лексикограф из Нью-Хейвена, известен прежде всего словарём An American Dictionary of the English Language 1828 года. Пять лет спустя он обратил ту же заботу о ясном, правильном и современном английском языке на Библию, которую на деле читала его страна. В 1833 году нью-хейвенская фирма Durrie and Peck выпустила The Holy Bible … in the Common Version, with Amendments of the Language с предисловием, подписанным в сентябре того же года. Это не новый перевод. Уэбстер взял King James Version 1611 года — «общепринятую версию» — в том виде, в каком её тогда печатали, и менял её лишь там, где её английский стал тёмным или неграмматичным. Он писал, что, внося поправки, сверялся с языками оригинала, но что общий стиль перевода изменять не следует, и что он сознательно не изменил ни одного места, на котором какая-либо деноминация основывает своё учение.
hero.2=В предисловии он называет три рода изменений. Слова, совершенно вышедшие из употребления, уступили место употребительным: хозяин Иосифа «knoweth not», что есть в доме (Бытие 39:8), там, где у King James стоит «wotteth not», а в Деяниях 12:4 Ирод намерен вывести Петра к народу «after the passover», а не «after Easter». Грамматика приведена в соответствие с употреблением времени Уэбстера: «who» вместо «which», когда речь идёт о лицах, так что молитва Господня начинается словами «Our Father who art in heaven», и «its» вместо «his», когда речь идёт о вещах, так что растения в Бытии 1 приносят семя «after its kind». Наконец, небольшое число слов, которые он счёл неподобающими для чтения вслух перед смешанной аудиторией, заменено более мягкими. Кроме того, он писал «Holy Spirit» там, где у King James стоит «Holy Ghost», и в нашей копии нет ни одного «Holy Ghost». В остальном редакция лёгкая: большинство читателей могло бы читать главу за главой, не замечая, что покинуло текст King James.
hero.3=Наша копия полна: 66 книг, от Бытия до Откровения, без неканонических книг, в английской нумерации глав и стихов — 150 псалмов, надписание каждого из которых слито с его первым стихом, и Книга Малахии, заканчивающаяся главой 4. Вслед за King James она сохраняет места общепринятого текста, которые позднейшие критические издания ставят под сомнение: длинное окончание Марка, Деяния 8:37 и трёх свидетелей на небе в 1-м послании Иоанна 5:7. В этом читателе она стоит особняком. Хотя это редакция King James Version, которая тоже входит в это собрание, собрание не записывает для неё предка, поэтому ступень родословия, открытая под одним из её стихов, падает прямо на пол языков оригинала, помеченный ≈, — в Ветхом Завете это Ленинградский кодекс, в Новом — Textus Receptus, — а не на тот английский текст, с которым на самом деле работал Уэбстер. И ничего не записано как стоящее на ней. Ни один язык интерфейса не открывается на этом издании; английский интерфейс открывается на New International Version, а к этому изданию ведёт его собственная карточка в сетке переводов. Поставленная рядом с King James во второй колонке, она показывает поправки Уэбстера стих за стихом.

