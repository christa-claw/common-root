fact.2.value=Ной Уэбстер (1758–1843), американский лексикограф, составитель словаря An American Dictionary of the English Language (1828)
fact.3.label=Отредактирован с
fact.3.value=[[KJV|King James Version]] 1611 года, «общепринятой версии», в тогдашних изданиях — отредактирован по-английски, а не переведён заново, хотя для своих поправок Уэбстер сверялся с еврейским и греческим текстом
fact.4.label=Род редакции
fact.4.value=Лёгкая и бережная: устаревшие слова заменены употребительными; исправлена грамматика — «who» для лиц и «its» для вещей; смягчены несколько слов, сочтённых неподобающими для чтения вслух; «Holy Spirit» вместо «Holy Ghost»; стиль и вероучительные места намеренно оставлены как были
fact.5.label=Издан
fact.5.value=Нью-Хейвен, Коннектикут: Durrie and Peck, 1833, под названием The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Лицензия
fact.6.value=Общественное достояние; эта копия с eBible.org
fact.7.label=В этом собрании
fact.7.value=66 книг, протестантский канон полностью, без неканонических книг; английская нумерация глав и стихов, так что псалмов 150 и надписание каждого слито с его первым стихом
fact.8.label=Родословие
fact.8.value=Записанного предка нет, и ничего не записано как стоящее на ней, — ступень открывается прямо на полу языков оригинала, [[WLC|Ленинградском кодексе]] в Ветхом Завете и [[TR|Textus Receptus]] в Новом, хотя текст, который редактировал Уэбстер, — это [[KJV|King James Version]]
