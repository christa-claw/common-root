fact.2.label=Übersetzer
fact.2.value=Jonathan Gallagher, dessen theologischer Doktorgrad von der University of St Andrews stammt
fact.3.label=Herausgegeben von
fact.3.value=Free Bible Ministry, gemeinnützig, das auch die in diesem Korpus enthaltene spanische [[VBL|Versión Biblia Libre]] herausbringt
fact.4.label=Übersetzt aus
fact.4.value=dem Hebräischen und dem Nestle–Aland-Neuen-Testament — dem kritischen Text, den die Bibelgesellschaften benutzen
fact.5.label=Verfahren
fact.5.value=aus dem Urtext allein mit lexikalischer Hilfe übersetzt, danach zur Kontrolle mit vorhandenen Ausgaben verglichen — keine Zusammenschau aus ihnen und keine Revision einer älteren englischen Bibel
fact.6.label=Stil
fact.6.value=modernes Englisch ohne Slang und flüchtige Umgangssprache, und ohne den Versuch, die Positionen einer bestimmten Glaubensgemeinschaft wiederzugeben
fact.7.label=Lizenz
fact.7.value=Creative Commons Namensnennung-Weitergabe unter gleichen Bedingungen 4.0 — frei kopieren, drucken und bearbeiten, sofern die Ausgabe genannt wird, Änderungen kenntlich sind und Abgeleitetes dieselbe Lizenz trägt
fact.8.label=Jahr im Katalog
fact.8.value=leer gelassen statt geraten — das Projekt überarbeitet den Text und gibt ihn laufend neu heraus, sodass kein einzelner Druck die Ausgabe ist
fact.9.label=Unter einer Sprosse
fact.9.value=≈ TR, ein Zeuge des Griechischen und nicht der Grundtext dieser Übersetzung; eine kritische griechische Ausgabe fehlt dem Korpus noch, also dient derselbe Platzhalter auch [[NIV|der NIV]], [[NASB|der NASB]] und [[BSB|der BSB]]
fact.10.label=In diesem Korpus
fact.10.value=alle 66 Bücher. Englisch öffnet auf der lizenzierten [[NIV|New International Version]], daher steht diese neben [[BSB|der Berean Standard Bible]] und [[WEB|der World English Bible]] als Englisch, das ein Leser auch wieder hinaustragen darf
