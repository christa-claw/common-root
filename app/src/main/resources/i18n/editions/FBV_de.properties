title=Free Bible Version — Über diese Ausgabe | Common Root
description=Free Bible Version: eine moderne englische Bibel, von Jonathan Gallagher aus dem Hebräischen und dem Nestle–Aland-Griechischen übersetzt und unter einer Share-alike-Lizenz veröffentlicht, sodass jeder sie nachdrucken darf.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Diese Übersetzung verdankt ihr Dasein einer Copyright-Seite. Fast jede moderne englische Bibel trägt eine, und was dort gewöhnlich steht, ist: ein paar hundert Verse dürfen ohne Rückfrage zitiert werden, ein ganzes Buch braucht eine schriftliche Erlaubnis, und den Text vollständig zu veröffentlichen heißt, Lizenzgebühren zu zahlen. Für eine Gemeindeseite oder eine Tonaufnahme kann damit die Sache erledigt sein. Die Free Bible Version wurde gemacht, um die Ausgabe zu sein, der nichts im Weg steht.
hero.2=Sie ist das Werk Jonathan Gallaghers, der einen theologischen Doktorgrad aus St Andrews hat, und sie wird von Free Bible Ministry herausgegeben, einer gemeinnützigen Einrichtung. Das Neue Testament stammt aus dem Nestle–Aland-Griechischen — dem kritischen Text, den die Bibelgesellschaften benutzen —, das Alte Testament aus dem Hebräischen. Das Verfahren, das das Projekt beschreibt, ist der Erwähnung wert, weil es nicht das übliche ist: Übersetzt wird aus dem Urtext allein mit Lexika, und erst danach wird mit vorhandenen Ausgaben verglichen, als Kontrolle gegen Doppelungen und Fehler, nicht als Quelle. Sie ist weder die Revision einer älteren englischen Bibel noch die Zusammenschau neuerer. Ihr erklärtes Ziel ist ein gegenwärtiges Englisch, das Slang und Modewendungen meidet, und sie weigert sich, auf die Positionen einer bestimmten Glaubensgemeinschaft hin zu übersetzen.
hero.3=Die Lizenz ist der eigentliche Punkt. Es ist Creative Commons Namensnennung-Weitergabe unter gleichen Bedingungen 4.0: kopieren, drucken, ins Netz stellen, bearbeiten — solange die Ausgabe genannt wird, Änderungen kenntlich gemacht sind und alles, was daraus gebaut wird, unter denselben Bedingungen erscheint. Das ist ein anderer Handel als Gemeinfreiheit: die Freiheit wird weitergegeben statt hergegeben. Es ist dieselbe Lizenz wie die der spanischen Versión Biblia Libre in diesem Korpus, die aus derselben Arbeit stammt.
hero.4=Für den Leser folgt daraus zweierlei. Der Katalog lässt ihre Jahreszahl leer, weil das Projekt Revisionen veröffentlicht, sobald es sie macht; es gibt keinen datierten Druck, an den dieses Korpus gebunden wäre, und einen zu erfinden wäre schlimmer als die Leerstelle. Und eine unter einem Vers der Free Bible Version geöffnete Sprosse zeigt ≈ TR, den Textus Receptus, als Zeugen markiert und nicht als Vorlage. Daraus ist diese Übersetzung nicht gemacht. Es ist das, was das Korpus derzeit als Griechisch anzubieten hat — eine kritische Ausgabe liegt hier noch nicht vor —, und derselbe Platzhalter erscheint aus demselben Grund unter der New International Version, der New American Standard Bible und der Berean Standard Bible.

