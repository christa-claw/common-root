fact.12.value=जर्मन सीढ़ी का शिखर: एक अभिलिखित पूर्वज, [[LUT1545|Luther Bibel 1545]], और उसके नीचे मूल भाषाओं का फ़र्श। पुनरीक्षकों की 85 टिप्पणियाँ यहाँ फेंकी नहीं गईं, टिप्पणियों के रूप में रखी गई हैं, और वे संस्करण से बँधी हैं — 1912 की व्याख्या 1912 के स्तंभ के नीचे दिखती है और कहीं नहीं। जर्मन अंतराफलक इस पर नहीं खुलता; वह [[ELB|एल्बरफ़ेल्डर]] पर खुलता है, जो सूची में अपने संक्षेप के कारण पहली है, और किसी अन्य कारण से नहीं
