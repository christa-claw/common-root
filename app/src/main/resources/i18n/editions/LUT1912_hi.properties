title=Luther Bibel 1912 — इस संस्करण के बारे में | Common Root
description=लूथर बाइबल का दूसरा कलीसियाई आधिकारिक पुनरीक्षण: जान-बूझकर संयत रखी गई एक पुनर्वाचना, 1910 में पूरी, 1912 में स्वीकृत, और Textus Receptus पर टिका अंतिम लूथर पाठ।
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=एक पुनरीक्षण का पुनरीक्षण। जर्मन कलीसियाओं ने 1892 में, पहले कलीसियाई आधिकारिक पुनरीक्षण के साथ, लूथर बाइबल का एक ही पाठ तय किया था, और कुछ ही वर्षों में उसे अपर्याप्त कहा जाने लगा। शिकायतें पुरानी ही थीं: बहुत अधिक पुरातन शब्द, और ऐसी वर्तनी जो अब किसी की नहीं रह गई थी। निर्णय दूसरी बात ने किया। डूडेन ने जर्मन साम्राज्य को एक बाध्यकारी वर्तनी दी थी जो विद्यालयों में पढ़ाई जाती थी, और उससे हटती हुई लूथर बाइबल को कक्षा के सामने रखना कठिन था। 1906 में जर्मन इवैंजेलिकल कलीसियाई सम्मेलन ने एक और पुनरीक्षण पर सहमति दी और स्पष्ट रूप से निर्देश दिया कि वह कोमल और रक्षक हो। धर्मशास्त्रियों की एक समिति ने 1910 तक हर पुस्तक को देख लिया, और 1912 में सम्मेलन ने परिणाम स्वीकार कर लिया।
hero.2=काम मुश्किल से दो वर्ष से कुछ अधिक चला, और इसी से पता चलता है कि यह किस प्रकार का पुनरीक्षण था। कोई नई लूथर बाइबल बनाने का प्रयत्न नहीं कर रहा था, न भाषाशास्त्रीय रूप से न किसी और रूप में। बाद के एक पुनरीक्षक फ़्रिट्स चिर्श ने इसे मास्टरजी वाला पुनरीक्षण कहकर टाल दिया, और विधि के विषय में यह नाम झूठा नहीं है — वर्तनी को पंक्ति में लाया गया, सबसे स्पष्ट रूप से मृत शब्द बदले गए, शेष में शब्दावली वहीं छोड़ दी गई जहाँ लूथर ने रखी थी। यह नाम जो नहीं देखता वह है इसका टिकाऊपन। आगे आए आंशिक पुनरीक्षणों के दशकों में भी 1912 का पाठ अपनी जगह टिका रहा, और आज भी पढ़ा और बेचा जाता है। इसका एक कारण 1912 की Jubiläumsbibel है, वुर्टेमबर्ग बाइबल संस्थान का व्याख्यात्मक टिप्पणियों सहित शताब्दी संस्करण, जो इस शताब्दी के भीतर तक फ़्रैक्टूर लिपि में पुनर्मुद्रित होता रहा। दूसरा कारण यह है कि कॉपीराइट समाप्त हो चुका है, इसलिए पाठ की प्रतिलिपि बनाने में कुछ नहीं लगता और वह हर जगह मिलता है — यहाँ भी।
hero.3=एक बात सबसे बढ़कर इसे रूढ़िवादी पाठकों में प्रचलित रखती है: यह Textus Receptus पर बनी अंतिम लूथर पुनरीक्षा है, अर्थात् सोलहवीं और सत्रहवीं शताब्दी का यूनानी नया नियम। इसके बाद का सब कुछ समीक्षात्मक पाठ की ओर चला गया। इससे यह संस्करण सीढ़ी में पाँव रखने के लिए असामान्य रूप से स्वच्छ पायदान बन जाता है, क्योंकि इसके नीचे की यूनानी वही यूनानी है जो लूथर के अपने 1545 के संस्करण के नीचे है, और जेनेवा तथा King James के नीचे है — पूरा मीनार एक ही फ़र्श साझा करता है, आधी ऊँचाई पर उसे बदलता नहीं।
hero.4=वंशक्रम के पायदानों में यह संस्करण ठीक Luther Bibel 1545 के ऊपर खड़ा है और इसका अभिलिखित पूर्वज ठीक एक ही है, वही। 1912 की किसी आयत के नीचे एक पायदान खोलिए और उसके नीचे लूथर का अपना 1545 का शब्द प्रकट होगा; एक और खोलिए और सीढ़ी यूनानी के लिए Textus Receptus तक और इब्रानी के लिए वेस्टमिंस्टर लेनिनग्राद कोडेक्स तक पहुँच जाएगी। तीन सौ सड़सठ वर्ष का पुनरीक्षण, आयत दर आयत, दो क्लिक में। यह संस्करण जो नहीं है वह यह: जर्मन अंतराफलक जिस बाइबल पर खुलता है वह यह नहीं — जर्मन के लिए कोई चुना हुआ पूर्वनिर्धारित संस्करण नहीं है, इसलिए पाठक को सूची की पहली जर्मन बाइबल मिलती है, और वह एल्बरफ़ेल्डर है।

