title=चालीस हदीस क़ुदसी — इस संस्करण के बारे में | Common Root
description=चालीस हदीस क़ुदसी — ऐसी बातें जिनका अर्थ, मुसलमानों के अनुसार, ईश्वर से है, जबकि उनके शब्द, हर अन्य हदीस की तरह, मुहम्मद के माध्यम से आए हैं — यहाँ नवावी की चालीस हदीसों के सहवर्ती खंड के रूप में प्रस्तुत।
heroHeading=चालीस हदीस क़ुदसी
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=हदीस क़ुदसी ("पवित्र" या "ईश्वरीय" हदीस) एक सामान्य हदीस से इस आधार पर भिन्न मानी जाती है कि उसका अर्थ कहाँ से माना जाता है: अल-जुर्जानी जैसे विद्वान इसे ईश्वर का वचन बताते हैं, जो मुहम्मद के अपने शब्दों में व्यक्त हुआ — इसके विपरीत क़ुरआन में स्वयं शब्द भी ईश्वर के माने जाते हैं। यह अंतर प्रतिष्ठा का है, विश्वसनीयता का नहीं — किसी हदीस क़ुदसी का सहीह होना आवश्यक नहीं है; इस प्रकार वर्गीकृत कुछ हदीसें ज़ईफ़ (कमज़ोर) या विवादित हैं, और उनका मूल्यांकन अन्य किसी भी हदीस की तरह उन्हीं परंपरा-शृंखला मानकों से किया जाता है।
hero.2=चालीस हदीस क़ुदसी का संग्रह [[NAW|नवावी की चालीस हदीसों]] और उसके व्यापक "चालीस हदीस" (अरबईनिय्यात) शैली की उसी पुरानी परंपरा का अनुसरण करता है, पर यहाँ यह हदीस सामान्यतः के बजाय एक ही श्रेणी तक सीमित है। यही नाम रखने वाला एक व्यापक रूप से प्रचलित अंग्रेज़ी संस्करण — जिसे इज़्ज़दीन इब्राहीम और डेनिस जॉनसन-डेविस ने चुना और अनुवादित किया, जिन्होंने नवावी के संग्रह का सहवर्ती अनुवाद भी तैयार किया था — 1997 में इस्लामिक टेक्स्ट्स सोसाइटी द्वारा एक द्विभाषी अरबी-अंग्रेज़ी खंड के रूप में प्रकाशित हुआ, जिसकी चालीस हदीसें शास्त्रीय हदीस साहित्य के विस्तृत भाग से एकत्र की गईं। क्या इस संग्रह में प्रस्तुत चालीस हदीसें वही चयन हैं, या उसी पारंपरिक नाम के अंतर्गत स्वतंत्र रूप से संकलित एक समूह, यह इस संग्रह की ओर से निर्धारित नहीं किया गया है।
hero.3=यहाँ का अरबी पाठ शास्त्रीय मतन है, जिसे सार्वजनिक अधिकार-क्षेत्र में माना जाता है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-qudsi संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]], [[NAS|सुनन अल-नसाई]], [[IBM|सुनन इब्न माजा]], [[MAL|मुवत्ता मालिक]], [[NAW|नवावी की चालीस हदीसों]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=भाषा
fact.1.value=शास्त्रीय अरबी, रीडर में हर हदीस के नीचे एक अंग्रेज़ी अनुवाद दिखाई देता है
fact.2.label=संकलनकर्ता
fact.2.value=कोई एक शास्त्रीय संकलनकर्ता नहीं है; इस नाम से प्रकाशित एक अंग्रेज़ी संस्करण इज़्ज़दीन इब्राहीम और डेनिस जॉनसन-डेविस द्वारा चुना और अनुवादित किया गया, जिन्होंने शास्त्रीय हदीस साहित्य के विस्तृत भाग से अपनी चालीस हदीसें एकत्र कीं
fact.3.label=नाम
fact.3.value=हदीस क़ुदसी — "पवित्र" या "ईश्वरीय" हदीस, जिसका अर्थ ईश्वर से माना जाता है, जबकि इसके शब्द, क़ुरआन से भिन्न, स्वयं मुहम्मद के हैं
fact.4.label=संकलन स्थान एवं काल
fact.4.value=एक निरंतर पाठ के बजाय व्यापक हदीस साहित्य से संकलित एक संकलन; इब्राहीम/जॉनसन-डेविस का इस नाम से अंग्रेज़ी संस्करण 1997 में प्रकाशित हुआ
fact.5.label=पद्धति
fact.5.value=चयन कैनॉनिकल दर्जे के बजाय क़ुदसी वर्गीकरण के आधार पर; किसी हदीस क़ुदसी का सहीह होना आवश्यक नहीं है — इस प्रकार वर्गीकृत कुछ हदीसें ज़ईफ़ (कमज़ोर) या विवादित हैं
fact.6.label=स्थिति
fact.6.value=यह नाम रखने वाले कई संकलनों में से एक, [[NAW|नवावी की चालीस हदीसों]] जैसी ही दीर्घकालिक चालीस-हदीस (अरबईनिय्यात) परंपरा में
fact.7.label=हदीसों की संख्या
fact.7.value=40
fact.8.label=इस संग्रह में
fact.8.value=1 पुस्तक और 40 क्रमांकित हदीसें
fact.9.label=अंग्रेज़ी अनुवाद
fact.9.value=fawazahmed0/hadith-api के eng-qudsi संस्करण से लिया गया, अरबी के सहवर्ती रूप में दिखाया गया; क्या यह इब्राहीम/जॉनसन-डेविस के अनुवाद से उद्भूत है या किसी स्वतंत्र अनुवाद से, यह इस संग्रह की ओर से पुष्ट नहीं किया गया है
fact.10.label=लाइसेंस
fact.10.value=अरबी मतन वह शास्त्रीय पाठ है जिसे सार्वजनिक अधिकार-क्षेत्र में माना जाता है; अंग्रेज़ी अनुवाद का लाइसेंस अभी भी समीक्षाधीन है
