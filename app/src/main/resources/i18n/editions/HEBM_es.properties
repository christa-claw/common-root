title=Biblia hebrea — Acerca de esta edición | Common Root
description=La Biblia entera en hebreo: el Antiguo Testamento masorético junto con el Nuevo Testamento de Franz Delitzsch de 1877, vertido de nuevo al hebreo de la Mishná para lectores que querían el libro completo en una sola lengua.
heroHeading=Biblia hebrea — Antiguo Testamento masorético y Nuevo Testamento de Delitzsch
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Una Biblia hebrea de cabo a rabo es un objeto más extraño de lo que suena, porque la mitad de ella nunca se escribió en hebreo. El Antiguo Testamento es hebreo y siempre lo fue. El Nuevo Testamento nos ha llegado en griego. De modo que una edición como esta son dos clases distintas de texto cosidas juntas: un original, y una traducción hecha en dirección contraria a la habitual — desde el griego y de vuelta a la lengua que sus autores hablaban en su mayoría.
hero.2=La mitad neotestamentaria es obra de Franz Delitzsch, hebraísta de Leipzig y conocedor de la literatura rabínica, a quien la Sociedad Bíblica Británica y Extranjera encargó el trabajo en 1873 y que lo terminó en 1877. No tradujo al hebreo de su propio siglo. Escribió en el hebreo de la Mishná y del período del Segundo Templo, con el argumento de que un texto del siglo I debía sonar como tal — de suerte que el resultado se lee menos como un traslado al hebreo que como un intento de recobrar lo que las frases pudieron ser antes de ser griegas. Sigue siendo el Nuevo Testamento hebreo al que más a menudo se acude.
hero.3=Qué griego tuvo debajo se decidió en parte por él. Empezó por el Códice Sinaítico, el manuscrito del siglo IV hallado unas décadas antes, y la Sociedad Bíblica — cuya norma era publicar según el texto recibido — se negó a seguir financiando una versión levantada sobre él. Delitzsch volvió al Textus Receptus y anotó las lecturas sinaíticas de peso en lugar de adoptarlas. El texto siguió luego moviéndose trece años y diez ediciones; la última la llevó a la imprenta Gustav Dalman en 1890, el año en que Delitzsch murió. Esa es una razón de que el catálogo deje en blanco el año de esta edición: las dos mitades no comparten fecha, y la mitad que tiene fechas tiene diez.
hero.4=En este lector es la edición con que abre una interfaz hebrea — una elección curada, no un azar alfabético — y elegir el hebreo vuelve toda la interfaz de derecha a izquierda en torno a ella. Se sitúa al lado del Códice de Leningrado sin competir con él: el Códice es el Tanaj erudito, plenamente puntuado y acentuado, y se detiene donde se detiene el Antiguo Testamento, mientras que este es un texto consonántico llano que continúa hasta el Apocalipsis. Los peldaños de linaje no le registran antecedente alguno, así que un peldaño abierto bajo un versículo cae derecho al suelo de lenguas originales, ≈ WLC y ≈ TR. En el resto de este corpus ese suelo es una aproximación, y eso es lo que el ≈ advierte. Aquí casi no lo es: el Antiguo Testamento en pantalla es el texto masorético, y el Textus Receptus es lo que Delitzsch tenía de verdad delante.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lengua
fact.1.value=hebreo — texto consonántico sin puntos vocálicos ni signos de cantilación
fact.2.label=Qué es
fact.2.value=dos textos encuadernados como una sola Biblia: el Antiguo Testamento masorético tradicional, y un Nuevo Testamento hebreo traducido del griego en el siglo XIX
fact.3.label=Nuevo Testamento por
fact.3.value=Franz Delitzsch (1813–1890), el hebraísta de Leipzig
fact.4.label=Encargado por
fact.4.value=la Sociedad Bíblica Británica y Extranjera en 1873; la traducción quedó terminada en 1877
fact.5.label=Antiguo Testamento a partir de
fact.5.value=el propio hebreo masorético — no una traducción, lo que hace de esta la única edición de aquí cuyo Antiguo Testamento está ya en su lengua original, como lo está [[WLC|el Códice de Leningrado de Westminster]]
fact.6.label=Nuevo Testamento a partir de
fact.6.value=el griego del [[TR|Textus Receptus]]. Delitzsch empezó en cambio por el Códice Sinaítico, pero la Sociedad Bíblica publicaba según el texto recibido y no quiso financiar el apartamiento
fact.7.label=Registro
fact.7.value=no es hebreo moderno. Delitzsch escribió en el hebreo de la Mishná y del período del Segundo Templo, tratando de devolver al griego el modo de decir que sus hablantes habrían usado
fact.8.label=Revisado hasta
fact.8.value=1890, la última edición llevada a la imprenta por Gustav Dalman
fact.9.label=No confundir con
fact.9.value=el Nuevo Testamento en hebreo moderno publicado por la Sociedad Bíblica en Israel, una traducción aparte del siglo XX todavía con derechos vigentes
fact.10.label=Año en el catálogo
fact.10.value=dejado en blanco — las dos mitades no comparten año, y solo el Nuevo Testamento fue revisado a lo largo de trece años y diez ediciones
fact.11.label=En este corpus
fact.11.value=los 66 libros, y el valor curado por omisión para una interfaz hebrea — el lector abre en esta y no en [[WLC|el Códice de Leningrado de Westminster]], porque esta recorre todo el camino a través del Nuevo Testamento
