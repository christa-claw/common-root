title=Vulgata Clementina — Acerca de esta edición | Common Root
description=La Vulgata Clementina: la revisión pontificia de la Biblia latina de Jerónimo, impresa en Roma en 1592 y reeditada con correcciones en 1593 y 1598 — el texto latino normativo de la Iglesia católica hasta 1979 y, en este lector, un peldaño por encima de la Vulgata.
heroHeading=Vulgata Clementina
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=En 1546 el Concilio de Trento declaró la Vulgata la Biblia latina auténtica de la Iglesia, y dejó así una pregunta que no respondió: ¿qué Vulgata? Once siglos de copia a mano no habían dejado dos manuscritos del todo iguales, y Trento pidió un texto corregido. El papa Sixto V lo proporcionó en 1590, revisado en buena parte por él mismo, con una bula que lo declaraba auténtico. Murió en agosto de ese año, y en pocas semanas los cardenales habían detenido su venta. Bajo Clemente VIII una comisión — con Francisco de Toledo entre los editores y Roberto Belarmino en el centro del trabajo — preparó su sustituto, impreso en Roma en 1592. Reimpresiones de menor formato en 1593 y 1598 eliminaron la mayoría de sus erratas y añadieron los prólogos de Jerónimo y referencias marginales.
hero.2=Ese texto fue la Biblia latina normativa de la Iglesia católica durante casi cuatro siglos, hasta la Nova Vulgata de 1979, y el misal y el breviario de 1962 todavía lo usan. Es la Biblia de Jerónimo tal como la Iglesia la había recibido, no tal como él la dejó. Los Salmos son su salterio galicano, revisado sobre el griego, no su traducción posterior desde el hebreo, de modo que conservan la numeración griega: el Salmo 22 comienza aquí con «Dominus regit me», el salmo del pastor. En 1 Juan 5:7 trae el Comma Johanneum, «Pater, Verbum, et Spiritus Sanctus», una adición latina que los primeros manuscritos griegos no tienen. Ester y Daniel aparecen en sus formas largas, con las adiciones griegas reunidas al final de Ester y como los dos últimos capítulos de Daniel. El archivo de eBible.org del que procede esta copia imprime el texto de 1598 con la Glossa Ordinaria como notas — el comentario del siglo XII de la escuela de Anselmo de Laon, en la edición de Migne de 1880. Las notas no pasaron al corpus; los corchetes de algunos versículos son de la propia fuente.
hero.3=En este lector es un peldaño con un único antecesor registrado, la Vulgata latina: abra un peldaño bajo cualquiera de sus versículos y aparece la Vulgata. Cabe esperar que ambas se lean casi palabra por palabra igual. La Vulgata de este corpus procede ella misma de un texto clementino, así que lo que las separa es sobre todo la puntuación — y los libros que faltan en esta copia. Tiene 66, los libros del canon protestante, con Ester y Daniel en sus formas largas. Los archivos de origen contienen también Tobías, Judit, Sabiduría, Eclesiástico, Baruc y los dos libros de los Macabeos, que la Vulgata de debajo tiene todos; ninguno llegó, así que donde la Vulgata tiene Tobías no hay nada encima. La Oración de Manasés y 3 y 4 Esdras, que la Clementina imprimió en un apéndice, no están ni en la fuente ni en el corpus. Nada en el corpus se apoya a su vez en esta edición.

