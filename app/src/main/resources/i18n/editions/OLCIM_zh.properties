title=Baibal Olcim — 关于本版本 | Common Root
description=Baibal Olcim：马图钦语（缅甸钦邦的一种少数民族语言）圣经，由eBible.org以真正的公有领域文本形式发布，其译者与翻译年代均未见记载。
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=马图钦语——又称马图比钦语——是一种汉藏语系语言，约有34,000名使用者，主要分布在缅甸钦邦南部的马图比一带，另有相关族群分布在边境另一侧的印度米佐拉姆邦。Baibal Olcim是这一语言的圣经译本，也是本语料库中唯一的马图钦语文本。
hero.2=记录没有说明的是译者是谁、译于何时。发布此文本的eBible.org只说明它属于公有领域，并将其编入hlt——马图钦语的ISO 639-3语言代码之下——没有译者，没有委员会，也没有翻译年代。本页宁可将两者都留白，也不去猜测。同一个代码在这里还有一段小小的来历：此前曾有一次尝试，想为本语料库添加第二部印地语圣经，却因缩写相似而被误归入了hlt之下，直到马图钦语的经文出现在本该是印地语的地方，才发现了这个错误。这一版本才是真正核对过其代码所指语言的那一版。
hero.3=收录它，是因为它本身的价值，而不是篇幅：这是一部真正属于公有领域的圣经，而不仅仅是获得授权的圣经，使用的语言属于一个在缅甸内部冲突中——这冲突集中于钦邦及其周边地区——真正遭受过迫害的基督徒少数群体。一款对使用者不作任何要求、也不追踪任何人的阅读器，正是为这样的情形而生——这也在很大程度上说明了为什么这个页面在事实栏中几乎没有更多内容可写。

