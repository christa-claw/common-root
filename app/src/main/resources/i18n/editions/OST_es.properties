title=Biblia de Ostervald (francés) — Acerca de esta edición | Common Root
description=La Biblia de Ostervald: la revisión, obra de un pastor de Neuchâtel, de la Biblia protestante francesa de Ginebra, publicada por primera vez en 1744, aquí en una revisión posterior con ortografía francesa moderna.
heroHeading=Biblia de Ostervald
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald nació en Neuchâtel en 1663 y murió allí en 1747. Fue ordenado en su ciudad natal en 1683 y pasó la mayor parte de su vida al servicio de su iglesia, primero como diácono y desde 1699 como pastor, y además enseñó teología. Su Biblia no es una traducción nueva del hebreo y el griego, sino una revisión de la Biblia protestante francesa de Ginebra, la versión que las iglesias reformadas de lengua francesa leían desde el siglo XVI. El texto revisado de Ostervald se publicó por primera vez en 1744, tres años antes de su muerte, y se reimprimió y revisó durante más de dos siglos; también fue bien conocido en Gran Bretaña.
hero.2=La redacción de este corpus no es el francés de 1744. El siglo XVIII escribía «étoit» donde el francés moderno escribe «était»; esta copia tiene «était» en todas partes y «étoit» ni una sola vez, así que procede de una de las revisiones posteriores que conservaron el nombre de Ostervald. La más conocida es la revisión publicada por la Société biblique de France en 1881, cuyo Nuevo Testamento fue obra de Ch. L. Frossard, y ese texto se actualizó todavía en 1996. eBible.org, la fuente de esta copia, nombra solo «Ostervald» y no la revisión, de modo que esta página tampoco nombra ninguna. Algunos rasgos se ven en casi cada página. El nombre divino es «l'Éternel», el Eterno, como en Segond y en el Darby francés: «L'Éternel est mon berger; je n'aurai point de disette» en el Salmo 23. Isaías 7:14 conserva «la vierge sera enceinte» — la virgen — donde Segond pone la joven. Y el Nuevo Testamento conserva lecturas del Textus Receptus que las ediciones críticas suprimen: 1 Juan 5:7 tiene los tres testigos celestiales, «le Père, la Parole, et le Saint-Esprit», que faltan en el Segond que tiene al lado.
hero.3=En este lector es una de tres Biblias francesas, junto a Segond y el Darby francés. Una interfaz en francés no abre en ella: el francés no tiene elección curada, así que el lector toma la primera Biblia francesa en el orden del catálogo, que es Darby. En los peldaños de linaje no consta antecedente alguno — la Biblia de Ginebra que revisa no está en este corpus —, de modo que un peldaño abierto bajo un versículo baja derecho al suelo de lenguas originales marcado con ≈: para el Antiguo Testamento el Códice de Leningrado y para el Nuevo el Textus Receptus, la tradición griega que esta Biblia sigue de verdad. Su peldaño lleva el año 1744, el de la revisión del propio Ostervald y no el de la redacción que se muestra. Póngala junto a Segond para ver dos siglos de lengua bíblica protestante francesa lado a lado.

