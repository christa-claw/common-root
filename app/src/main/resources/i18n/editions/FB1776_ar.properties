title=Biblia 1776 — عن هذه الطبعة | Common Root
description=Biblia 1776: كتاب الكنيسة المقدّس في فنلندا قرنًا ونصف قرن، وأول كتاب مقدّس فنلندي طُبع للقراءة في البيت، وما زال هو الكتاب الذي تعنيه الفنلندية حين تقول «Biblia».
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=مع الشكر لمن أرسلوا تصويبات لهذه الصفحة.

# The narrative, one paragraph per key, in order.
hero.1=ثالث كتاب مقدّس في فنلندا، وهو الذي رسخ. إنه تنقيح لا ترجمة جديدة: يعود الخط عبر تنقيح فلورينوس لسنتَي 1683–85 إلى Biblia سنة 1642، أول كتاب مقدّس فنلندي كامل. وقد تولّى المراجعة أندرس (أنتي) ليتسيليوس، الذي كان قد أصدر طبعة خاصة به سنة 1758. ما غيّرته طبعة 1776 هو الإملاء، ومعه المدى. كانت أول كتاب مقدّس فنلندي بإملاء محدَّث، وأول ما طُبع للاستعمال المنزلي لا للمنبر وحده. والكتاب الذي تستطيع أسرة أن تملكه شيء آخر غير الكتاب الذي تملكه رعية. لم تكن الطبعتان الواقعتان بينهما مسألة إملاء فحسب. فمن أعدّ طبعة 1685، هنريك فلورينوس عميد بايميو، كان يعرف العبرية واليونانية وصحّح المضمون كما صحّح اللغة — فتحرّكت الصياغة أكثر ممّا تحرّك الرسم — ويُرى أنّ الطبعات الوسيطة أنجزت عملًا ترجميًّا عن اللغات الأصلية لا مجرّد تهذيب لنصّ 1642. فمن يقارن 1642 بـ1776 إنّما ينظر عبر تنقيحين، لا عبر تغيّر في الإملاء.
hero.2=ظل في استعمال الكنيسة قرنًا ونصف قرن حتى حلّت محله Kirkkoraamattu 1933/38، ولم تتوقف قراءته حين توقف كونه رسميًا. فقد احتفظت به حركتان من حركات الإحياء داخل الكنيسة الإنجيلية اللوثرية في فنلندا — اللستاديون وجماعة rukoilevaiset — ولا تزالان تستعملانه. لهذا تشير كلمة Biblia وحدها في الفنلندية إلى هذه الطبعة لا إلى ما قبلها أو ما بعدها، ولهذا يُسمى الكتاب أيضًا Vanha kirkkoraamattu، أي كتاب الكنيسة القديم.
hero.3=في هذا القارئ هو منتصف السلسلة الفنلندية. افتح درجة واحدة تحت آية من Kirkkoraamattu 1933/38 فتظهر هذه الطبعة؛ وافتح درجة تحتها فتظهر Biblia سنة 1642. غير أن الدرجتين تُقرآن على وجهين مختلفين. فمترجمو 1933/38 عملوا من العبرية واليونانية، فالدرجة التي فوق خلافةٌ داخل كتاب كنيسة واحدة لا اشتقاق. أما التي تحت فاشتقاق حقيقي: 1776 تنقيح لـ1642، والكلمات على جانبَي تلك الخطوة موضوعة لتُقارن.
hero.4=تنبيه بشأن النصّ المعروض هنا: إنّه ليس طبعة سنة 1776. فما تقرأه منحدر من نصّ رقميّ في الملك العام، سوّى إملاءَه قلمٌ متأخّر ولم يُدوَّن تاريخُ تحريره — ففي آياته البالغة 31 102 آية يَرِد الحرف w في آية واحدة فقط، بينما يرد في 26 862 آية من بيبليا 1642، وكتابة w موضع v هي أوضح علامات الإملاء الذي طُبعت به طبعة 1776. أي أنّ طبعة 1776 حدّثت إملاء 1642، ثم حُدِّث هذا النصّ مرّة أخرى بعدها، فبات أبعد عن الكتاب المطبوع ممّا كانت 1776 عن 1642. سأل باحثان في الفنلندية الأدبية القديمة عن أيّ نسخة هذه قبل أن يسألا شيئًا آخر، وكان السؤال في محلّه. أمّا طبعة 1776 نفسها فمحفوظة صورًا للصفحات في مجموعة العهد السويدي بالمكتبة الوطنية الفنلندية؛ وإحلال نصّ أمين محلّ هذا عملٌ نودّ القيام به.

