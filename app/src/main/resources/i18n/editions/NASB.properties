title=New American Standard Bible 2020 — About This Edition | Common Root
description=The New American Standard Bible: the Lockman Foundation's own continuation of the American Standard Version's word-for-word literalism, translated afresh from the Hebrew, Aramaic and Greek and now in its 2020 text.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=The New American Standard Bible began as a deliberate continuation rather than a wholly new project. The Lockman Foundation, a nonprofit based in La Habra, California, launched the work in 1959 to carry the American Standard Version of 1901 forward — keeping its reputation for literal, word-for-word fidelity to the Hebrew, Aramaic and Greek while modernizing its dated English. The Foundation assembled a committee of scholars drawn from Christian colleges, seminaries and mostly conservative evangelical denominations, and the translation appeared in stages: the Gospel of John in 1960, the other Gospels in 1962, the complete New Testament in 1963, Psalms separately in 1968, and the whole Bible in 1971. That first complete edition worked from the third edition of Rudolf Kittel's Biblia Hebraica for the Old Testament, with the Dead Sea Scrolls consulted, and from the 23rd edition of Nestle and Aland's Novum Testamentum Graece for the New.
hero.2=Revision continued for decades after that first printing. Minor wording changes followed in 1972, 1973 and 1975, then a more substantial revision in 1977 and a further limited one in 1992. In 1995 the Foundation issued the Updated Edition — NASB95, the text most people mean when they simply say “the NASB” — consulting the Biblia Hebraica Stuttgartensia and the 26th edition of Nestle-Aland. The current text is the 2020 update, portions of which had already begun appearing online in 2018: it moved the Old Testament textual base to the Biblia Hebraica Stuttgartensia and, for the books it covers, the newer Biblia Hebraica Quinta, consulting the Septuagint, the Dead Sea Scrolls, the Targums and other ancient versions where they bear on a reading, while the New Testament now follows the 28th edition of Nestle-Aland supplemented by the Editio Critica Maior's fuller apparatus of Greek manuscript evidence. The translators' stated method held across every revision: render the original as literally as English allows, and where a strictly literal rendering would mislead or read unnaturally, choose the clearer idiom and footnote the more literal wording instead — a discipline regularly cited as making this one of the most literal of the widely used twentieth- and twenty-first-century English translations.
hero.3=Despite its name and its declared debt to the American Standard Version, the New American Standard Bible is a fresh translation from the original languages rather than a line-by-line revision of it, and the corpus records no parent for it accordingly: open a lineage rung beneath an NASB verse and it goes straight to the original-language floor marked ≈, exactly as it does for the New International Version. The two share more than that shape — both are licensed rather than public domain, standing apart from the free-to-copy English editions on the same shelf, though an English interface opens on the New International Version by default, with the New American Standard Bible reached from its own card in the translation grid.

fact.1.label=Language
fact.1.value=English
fact.2.label=Commissioned by
fact.2.value=The Lockman Foundation of La Habra, California, which launched the project in 1959 as a continuation of the American Standard Version's tradition of literal translation
fact.3.label=Made by
fact.3.value=A translation committee sponsored by the Foundation, drawing scholars from Christian colleges and seminaries and mostly conservative evangelical denominations
fact.4.label=Old Testament from
fact.4.value=Rudolf Kittel's Biblia Hebraica (3rd edition) and the Dead Sea Scrolls for the 1971 original; the Biblia Hebraica Stuttgartensia from the 1995 revision; the 2020 text cites the Biblia Hebraica Stuttgartensia and, where available, the Biblia Hebraica Quinta, with the Septuagint, the Dead Sea Scrolls, the Targums and other ancient versions consulted
fact.5.label=New Testament from
fact.5.value=Nestle and Aland's Novum Testamentum Graece, 23rd edition, for the 1971 original; the 26th edition from the 1995 revision; the 28th edition (NA28) for the 2020 text, supplemented by the Editio Critica Maior's apparatus of Greek manuscript evidence
fact.6.label=Kind of translation
fact.6.value=Formal equivalence — translated as literally from the original languages as readable English allows, with the more literal rendering footnoted where a clearer idiom was chosen instead; a fresh translation from the Hebrew, Aramaic and Greek rather than a revision of an earlier English Bible, despite its roots in the American Standard Version's approach
fact.7.label=Published
fact.7.value=The Gospel of John in 1960, the Gospels in 1962, the New Testament in 1963, Psalms in 1968, the complete Bible in 1971, minor textual changes in 1972, 1973 and 1975, a major revision in 1977, a limited revision in 1992, the Updated Edition (NASB95) in 1995, and the current 2020 text, portions of which appeared online from 2018
fact.8.label=Licence
fact.8.value=Licensed, not public domain. Up to 1,000 verses may be quoted in any form without written permission, provided they do not form a complete Bible book or more than half of the quoting work, with a copyright notice naming 1960, 1971, 1977, 1995 and 2020; anything beyond that needs the Lockman Foundation's permission
fact.9.label=In this corpus
fact.9.value=Licensed rather than public domain, like [[NIV|the New International Version]] — the English interface opens on that edition by default, and this one is reached from its own card. No parent is recorded in the lineage rungs: although the Foundation describes the project as a continuation of [[ASV|the American Standard Version]]'s literalism, it is translated afresh from the Hebrew, Aramaic and Greek rather than a revision of that or any other English text held here, so a rung beneath an NASB verse goes straight to the original-language floor marked ≈
