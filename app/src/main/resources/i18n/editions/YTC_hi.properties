title=Yorumsuz Türkçe Çeviri — इस संस्करण के बारे में | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): एक आधुनिक तुर्की बाइबिल, जिसे इस्माइल सेरिनकेन ने World English Bible से eBible.org के साथ मिलकर अनुवादित किया, CC BY-ND 4.0 के अंतर्गत लाइसेंस-प्राप्त — वह तुर्की पाठ जिस पर यह संग्रह डिफ़ॉल्ट रूप से खुलता है।
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — शब्दशः एक "बिना व्याख्या" या "बिना टिप्पणी" वाला तुर्की अनुवाद — एक आधुनिक तुर्की बाइबिल है, जिसे इस्माइल सेरिनकेन ने eBible.org के साथ मिलकर पूर्ण किया, जिसका कॉपीराइट 2023 से 2025 तक दर्शाया गया है। नाम स्वयं पद्धति को बताता है: एक सरल, शब्द-दर-शब्द प्रस्तुति, जो जान-बूझकर व्याख्यात्मक टिप्पणियों और अर्थान्वयात्मक पुनर्लेखन को छोड़ देती है, और परिष्कृत मुहावरे की बजाय मूल पाठ के प्रति पारदर्शिता को प्राथमिकता देती है।
hero.2=वह मूल पाठ, सच कहें तो, अंग्रेज़ी है, हिब्रू, अरामी या यूनानी नहीं: अनुवाद का अपना कॉपीराइट पृष्ठ इसे World English Bible से प्रस्तुत किया गया बताता है, जो इसे एक द्वितीयक अनुवाद बनाता है, न कि मूल भाषाओं से सीधे किया गया अनुवाद, जबकि इस संग्रह की अधिकांश अन्य बाइबिलें ऐसी नहीं हैं। Common Root ने पहले 1941 की ऐतिहासिक तुर्की बाइबिल (Kitabı Mukaddes) के किसी मुक्त संस्करण की खोज की, जो अब तुर्की में सार्वजनिक क्षेत्र में आने के लिए पर्याप्त पुरानी है, लेकिन उसके लिए कोई उपयोगी डिजिटल स्रोत नहीं मिल सका; Yorumsuz Türkçe Çeviri उपलब्ध एकमात्र मुक्त-लाइसेंस-प्राप्त तुर्की बाइबिल थी। इस संग्रह का पाठ eBible.org के USFM वितरण से लिया गया है, जहाँ इसे turytc के रूप में सूचीबद्ध किया गया है।
hero.3=इसकी अनुवाद पद्धति परंपरागत के बजाय समकालीन छाप रखती है: यह ईश्वर के निजी नाम को प्रचलित तुर्की "RAB" या "Yehova" के स्थान पर Yahve के रूप में प्रस्तुत करती है, निर्गमन 3:14-15 का हवाला देते हुए, और यीशु के नाम को परिचित तुर्की İsa के स्थान पर Yeşua के रूप में प्रस्तुत करती है, जबकि अन्य विशिष्ट नामों को उनके सामान्य रूप में ही छोड़ देती है। इसमें मानक 66-पुस्तक प्रोटेस्टेंट सिद्धांत-सूची है, जिसमें कोई द्वितीयक-विहित पुस्तकें नहीं हैं।
hero.4=यह इस संग्रह की एकमात्र तुर्की बाइबिल है, इसलिए तुर्की इंटरफ़ेस डिफ़ॉल्ट रूप से इस पर खुलता है।

