title=Webster's Bible — Om denna utgåva | Common Root
description=Noah Websters revidering från 1833 av King James Version, utgiven i New Haven i Connecticut — den allmänna engelska bibeln bevarad nästan ord för ord, med föråldrade ord utbytta, grammatiken rättad och några uttryck mildrade för högläsning.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), lexikografen från New Haven, är framför allt ihågkommen för An American Dictionary of the English Language från 1828. Fem år senare vände han samma omsorg om klar, korrekt och samtida engelska mot den bibel som hans land faktiskt läste. År 1833 gav Durrie and Peck i New Haven ut The Holy Bible … in the Common Version, with Amendments of the Language, med ett förord undertecknat i september samma år. Det är ingen ny översättning. Webster tog King James Version från 1611 — ”den allmänna översättningen” — sådan den då trycktes, och ändrade den bara där dess engelska hade blivit dunkel eller ogrammatisk. Han skrev att han hade rådfrågat grundspråken när han gjorde sina rättelser, men att översättningens allmänna stil inte borde ändras, och att han inte medvetet hade ändrat något ställe som ett samfund grundade sin lära på.
hero.2=I förordet nämner han tre slags ändringar. Ord som helt fallit ur bruk fick ge vika för ord i gott bruk: Josefs husbonde ”knoweth not” vad som finns i huset (1 Mos 39:8) där King James har ”wotteth not”, och i Apostlagärningarna 12:4 tänker Herodes föra fram Petrus ”after the passover”, inte ”after Easter”. Grammatiken anpassades till språkbruket på Websters tid: ”who” i stället för ”which” när det syftar på personer, så att Herrens bön börjar ”Our Father who art in heaven”, och ”its” i stället för ”his” när det syftar på ting, så att växterna i 1 Mosebok 1 bär frö ”after its kind”. Dessutom ersattes ett litet antal ord som han ansåg olämpliga att läsa högt inför en blandad åhörarskara med mildare. Han skrev också ”Holy Spirit” där King James har ”Holy Ghost”, och vår kopia har inte ett enda ”Holy Ghost”. Utöver detta är revideringen lätt: de flesta läsare kunde läsa kapitel efter kapitel utan att märka att de hade lämnat King James-texten.
hero.3=Vår kopia är fullständig: 66 böcker, från Första Moseboken till Uppenbarelseboken, utan apokryferna, i engelsk kapitel- och versindelning — 150 psalmer, där varje psalms överskrift löper in i dess första vers, och Malaki som slutar med kapitel 4. Liksom King James behåller den de ställen ur den mottagna texten som senare textkritiska utgåvor ifrågasätter: Markus längre slut, Apostlagärningarna 8:37 och de tre vittnena i himlen i Första Johannesbrevet 5:7. I denna läsare står den för sig själv. Fast den är en revidering av King James Version, som också finns i detta korpus, har korpuset ingen förlaga noterad för den, så en härstamningens stegpinne öppnad under en av dess verser faller rakt ned på grundspråksgolvet märkt med ≈ — Leningradkodexen i Gamla testamentet och Textus Receptus i Nya — i stället för på den engelska text som Webster faktiskt arbetade med. Ingenting är heller noterat som stående på den. Inget gränssnittsspråk öppnar på denna utgåva; ett engelskt gränssnitt öppnar på New International Version, och denna nås från sitt eget kort i översättningsrutnätet. Lagd bredvid King James i en andra kolumn visar den Websters rättelser vers för vers.

