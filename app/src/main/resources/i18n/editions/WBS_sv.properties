fact.2.label=Revisor
fact.2.value=Noah Webster (1758–1843), amerikansk lexikograf, upphovsman till An American Dictionary of the English Language (1828)
fact.3.label=Reviderad från
fact.3.value=[[KJV|King James Version]] från 1611, ”den allmänna översättningen”, sådan den då trycktes — reviderad på engelska, inte nyöversatt, fast Webster rådfrågade hebreiskan och grekiskan för sina rättelser
fact.4.label=Typ av revidering
fact.4.value=Lätt och försiktig: föråldrade ord utbytta mot gängse; grammatiken rättad, ”who” om personer och ”its” om ting; några ord som ansågs olämpliga för högläsning mildrade; ”Holy Spirit” i stället för ”Holy Ghost”; stilen och de lärorelaterade ställena avsiktligt lämnade orörda
fact.5.label=Utgiven
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, som The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Licens
fact.6.value=I det fria; denna kopia från eBible.org
fact.7.label=I detta korpus
fact.7.value=66 böcker, den protestantiska kanon i sin helhet, utan apokryferna; engelsk kapitel- och versindelning, så att psalmerna är 150 och varje psalms överskrift löper in i dess första vers
fact.8.label=Härstamning
fact.8.value=Ingen noterad förlaga och ingenting noterat som stående på den — en stegpinne öppnar rakt på grundspråksgolvet, [[WLC|Leningradkodexen]] i Gamla testamentet och [[TR|Textus Receptus]] i Nya, fast den text Webster reviderade är [[KJV|King James Version]]
