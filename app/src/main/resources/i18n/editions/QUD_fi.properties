title=Neljäkymmentä hadith qudsia — Tietoja tästä laitoksesta | Common Root
description=Neljäkymmentä hadith qudsia — lausumia, joiden merkityksen muslimit katsovat olevan Jumalalta, mutta joiden sanamuoto, kuten muissakin hadithissa, on välittynyt Muhammadin kautta — luettuna tässä an-Nawawin neljänkymmenen hadithin rinnakkaisteoksena.
heroHeading=Neljäkymmentä hadith qudsia
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Hadith qudsi ("pyhä" tai "jumalallinen" hadith) eroaa tavallisesta hadithista siinä, mistä sen merkityksen katsotaan olevan peräisin: oppineet, kuten al-Jurjani, kuvaavat sitä Jumalan sanoiksi, jotka on ilmaistu Muhammadin omin sanamuodoin, toisin kuin Koraani, jonka itse sanamuodon katsotaan olevan Jumalan. Tämä ero koskee asemaa, ei luotettavuutta — hadith qudsin ei tarvitse olla sahih (luotettava); osa tällä tavoin luokitelluista on da'if (heikkoja) tai kiistanalaisia, ja niitä arvioidaan samoin välitysketjun perustein kuin mitä tahansa muuta hadithia.
hero.2=Neljänkymmenen hadith qudsin kerääminen seuraa samaa vanhaa tapaa kuin [[NAW|an-Nawawin neljäkymmentä hadithia]] ja laajempi neljänkymmenen hadithin laji (arba'iniyyat), johon se kuuluu, mutta tässä rajoittuen yhteen hadith-luokkaan kaiken hadithin sijaan. Laajalti levinnyt englanninkielinen laitos juuri tällä nimellä — Ezzeddin Ibrahimin ja Denys Johnson-Daviesin valitsema ja kääntämä, ja he myös laativat rinnakkaiskäännöksen an-Nawawin kokoelmasta — julkaistiin Islamic Texts Societyn kustantamana 1997 kaksikielisenä arabia-englanti-niteenä, jonka neljäkymmentä hadithia on koottu laajalti klassisesta hadith-kirjallisuudesta. Sitä, ovatko tämän aineiston tarjoamat neljäkymmentä hadithia juuri tämä valikoima vai itsenäisesti koottu kokoelma, joka on julkaistu samalla perinteisellä nimellä, ei ole tämän aineiston puolesta ratkaistu.
hero.3=Arabiankielinen teksti tässä on klassinen matn, ja sen katsotaan olevan vapaasti käytettävissä. Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-qudsi-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää teoksissa [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]] ja [[NAW|an-Nawawin neljäkymmentä hadithia]] sekä Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

