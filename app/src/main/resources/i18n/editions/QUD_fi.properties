fact.3.label=Nimi
fact.3.value=Hadith qudsi — "pyhä" tai "jumalallinen" hadith, jonka merkityksen katsotaan olevan Jumalalta, vaikka sanamuoto on Muhammadin omaa, toisin kuin Koraanissa
fact.4.label=Koottu
fact.4.value=Antologia, koottu laajemmasta hadith-kirjallisuudesta yhden yhtenäisen tekstin sijaan; Ibrahimin ja Johnson-Daviesin tällä nimellä julkaisema englanninkielinen laitos ilmestyi 1997
fact.5.label=Menetelmä
fact.5.value=Valinta perustuu qudsi-luokitukseen, ei kanoniseen asemaan; hadith qudsin ei tarvitse olla sahih (luotettava) — osa näin luokitelluista on da'if (heikkoja) tai kiistanalaisia
fact.6.label=Asema
fact.6.value=Yksi useista tällä nimellä kulkevista antologioista, samassa pitkäaikaisessa neljänkymmenen hadithin perinteessä (arba'iniyyat) kuin [[NAW|an-Nawawin neljäkymmentä hadithia]]
