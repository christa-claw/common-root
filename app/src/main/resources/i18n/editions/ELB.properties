fact.13.label=In this corpus
fact.13.value=The Bible a German interface opens on: German has no curated default edition, so the reader takes the first German Bible in the catalogue, and ELB sorts ahead of [[LUT1545|Luther 1545]] and [[LUT1912|Luther 1912]] on nothing but its abbreviation. No parent is recorded in the lineage rungs — the 1871 Elberfelder it was corrected down from is not in the corpus — so a rung opens on the original-language floor. It carries no year on either side: the About card leaves the year column blank, and the hand-kept list of rung years has no entry for it either, so a rung chip for ELB shows the abbreviation and nothing else — the quiet case, where [[DRA|the Douay-Rheims]] is the loud one and the two lists contradict each other in public
