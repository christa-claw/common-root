title=Jami` at-Tirmidhi — Tietoja tästä laitoksesta | Common Root
description=Jami` at-Tirmidhi: hadith-kokoelma, jonka Abu Isa at-Tirmidhi rakensi arvioimalla avoimesti jokaisen hadithin vahvuuden ja kirjaamalla lainoppineiden siitä käymät oikeudelliset kiistat — luettuna sunni-islamin Kuuteen kirjaan.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi syntyi noin vuonna 209 AH (824 jaa.) lähellä Termeziä, Khurasanissa, nykyisin Uzbekistanin ja Afganistanin rajalla. Hän alkoi opiskella hadithia noin kahdenkymmenen vuoden iässä ja matkusti vuodesta 235 AH alkaen Khurasanin, Irakin ja Hidjazin halki niitä etsimässä, opiskellen ensisijaisesti Muhammad al-Bukharin johdolla — hänen pääopettajansa — sekä Muslim ibn al-Hajjajin, Abu Dawud al-Sijistanin, Qutaybah ibn Sa'idin ja Ali ibn Hujrin johdolla. Hän sokeutui elämänsä loppupuolella, mistä juontuu hänen lisänimensä "ad-Darir" ("Sokea"). Hän palasi Termezin seudulle, jossa hän kuoli 13. rajabina vuonna 279 AH (9. lokakuuta 892 jaa.) noin seitsemänkymmenen vuoden iässä.
hero.2=Hänen koko nimensä, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, lyhennetään tavallisesti Jami' at-Tirmidhiksi tai Sunan at-Tirmidhiksi. Siinä missä Sahih al-Bukhari ja Sahih Muslim hyväksyvät vain hadithit, jotka niiden kokoajat arvioivat täysin aidoiksi, at-Tirmidhi arvioi jokaisen hadithin avoimesti itse tekstissä — sahih, hasan, da'if tai gharib — ja selitti heikomman arvioinnin perusteet sen sijaan, että olisi jättänyt hadithin pois; hän myös esitti, missä lainopilliset koulukunnat (madhahib) olivat eri mieltä ja mihin todisteisiin kumpikin puoli vetosi, mikä tekee kirjasta yhtä lailla oppaan hadith-perustaiseen oikeudelliseen päättelyyn kuin hadith-kokoelman sinänsä.
hero.3=Sunnimuslimien perinne lukee sen Kuuteen kirjaan, yleensä Sahih al-Bukharin, Sahih Muslimin ja Sunan Abi Dawudin jälkeen; sitä, mille sijalle se tarkalleen asettuu jäljellä olevien kirjojen joukossa — ja mikä kokoelma täyttää kuudennen paikan, Sunan Ibn Majahin ollessa tavallinen mutta ei ainoa historiallisesti esitetty vastaus — on kauan kiistelty ratkaisematta, kuten muidenkin tämän aineiston Sunan-kokoelmien kohdalla. Kirjalle annettu hadith-määrä vaihtelee samasta syystä: noin 4 330 perinteisen laskutavan mukaan, muualla mainittuna noin 4 400; myös sen rakennetta kuvataan vaihtelevasti 46 kirjana, 49 lukuna Ahmad Muhammad Shakirin Kairon laitoksessa, tai viitenäkymmenenä lukuna. Tämän aineiston oma luku on vielä yksi luku lisää: 49 kirjaa ja 3 998 numeroitua hadithia, mikä on sen digitaalisen laitoksen muoto, josta se on otettu, ei väite minkään yksittäisen painoperinteen toistamisesta.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä. Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-tirmidhi-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää Sahih al-Bukharissa, Sahih Muslimissa, Sunan Abi Dawudissa ja Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=klassista arabiaa, englanninkielinen käännös näkyy lukijassa jokaisen hadithin alla
fact.2.label=Kokoaja
fact.2.value=Abu Isa Muhammad ibn Isa at-Tirmidhi (209–279 AH / 824–892 jaa.)
fact.3.label=Nimi
fact.3.value=tunnetaan nimellä Jami' at-Tirmidhi tai Sunan at-Tirmidhi; koko nimi al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal
fact.4.label=Koottu
fact.4.value=koottu matkoilla Khurasanin, Irakin ja Hidjazin halki, alkaen noin vuodesta 235 AH; at-Tirmidhi kuoli lähellä Termeziä vuonna 279 AH (892 jaa.)
fact.5.label=Menetelmä
fact.5.value=arvioi jokaisen hadithin avoimesti sahih-, hasan-, da'if- tai gharib-luokkaan ja selittää heikomman arvioinnin perusteet, ja esittää, missä lainopilliset koulukunnat ovat eri mieltä ja mihin todisteisiin kumpikin vetoaa — sen sijaan, että hyväksyisi vain täysin aidoksi arvioidut hadithit, kuten [[BUK|Sahih al-Bukhari]] ja [[MUS|Sahih Muslim]] tekevät
fact.6.label=Asema
fact.6.value=luetaan sunni-islamin Kuuteen kirjaan (Kutub al-Sittah), yleensä [[BUK|Sahih al-Bukharin]], [[MUS|Sahih Muslimin]] ja [[ABD|Sunan Abi Dawudin]] jälkeen; sen tarkka sija jäljellä olevien kirjojen joukossa, ja mikä kirja täyttää kuudennen paikan, on kiistanalainen eikä ratkaistu
fact.7.label=Hadith-määrä
fact.7.value=noin 4 330 perinteisen laskutavan mukaan, muualla mainittuna noin 4 400; myös sen rakennetta kuvataan vaihtelevasti 46 kirjana, 49 lukuna Ahmad Muhammad Shakirin Kairon laitoksessa, tai viitenäkymmenenä lukuna
fact.8.label=Tässä aineistossa
fact.8.value=49 kirjaa ja 3 998 numeroitua hadithia — lähdeaineiston oma muoto, ei minkään yksittäisen painoperinteen toisto
fact.9.label=Englanninkielinen käännös
fact.9.value=otettu fawazahmed0/hadith-api:n eng-tirmidhi-laitoksesta, näytetään arabiankielisen tekstin rinnalla; mistä julkaistusta käännöksestä se on peräisin, ei ole tämän aineiston puolesta vielä varmistettu
fact.10.label=Käyttöoikeus
fact.10.value=arabiankielinen matn on klassinen, vapaasti käytettävä teksti; englanninkielisen käännöksen käyttöoikeus on edelleen tarkistuksessa
