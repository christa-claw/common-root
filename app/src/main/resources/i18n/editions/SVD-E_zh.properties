title=史密斯与范戴克译本（eBible文本） — 关于此版本 | Common Root
description=史密斯与范戴克1865年的阿拉伯文圣经，收录于eBible.org依据美国圣经公会源文件、以公有领域发布的全标音电子文本。
heroHeading=史密斯与范戴克译本 — 全标音文本
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=此本与[[SVD|史密斯与范戴克译本]]译文相同——即伊莱·史密斯在贝鲁特开始、范戴克于1865年与阿拉伯文学者布特鲁斯·布斯塔尼、纳西夫·雅齐吉与优素福·阿西尔一同完成的阿拉伯文圣经——只是据另一电子文件排印。译文相同；此版本之所以存在，缘由就在这份文件。
hero.2=1865年的圣经人人可自由取用，但其电子抄本仍是某人的劳作，而范戴克文本在网上以诸多来历不明的抄本流传，有些甚至就誊写本身主张版权。来历无法追溯的文本不能放心付印，故此版采用一份来历可以追溯的抄本：由eBible.org发布、声明属公有领域者，译者标明为叙利亚差会，来源贡献者为美国圣经公会。该文件标注日期为2020-08-03。
hero.3=此本全标音。每个词都带有短元音及其余诵读符号，而本阅读器所收的另一范戴克文本大半未标音。这使排版更慢，诵读更易，标音之页行间所需空间也更多，因此此版印本较同一未标音文本更长。
hero.4=若问题在于此文本能否付印，当选此版；至于屏上阅读，两部范戴克文本皆可胜任。

