title=Free Bible Version — Tietoja tästä laitoksesta | Common Root
description=Free Bible Version: Jonathan Gallagherin hepreasta ja Nestle–Alandin kreikasta tekemä nykyenglanninkielinen käännös, joka on julkaistu share-alike-lisenssillä niin, että kuka tahansa saa painaa sen uudelleen.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Tämä käännös on olemassa tekijänoikeussivun takia. Lähes jokaisessa nykyenglanninkielisessä Raamatussa sellainen on, ja tavallisesti siinä sanotaan, että muutamia satoja jakeita saa lainata kysymättä, että kokonaiseen kirjaan tarvitaan kirjallinen lupa ja että koko tekstin julkaiseminen tarkoittaa rojaltien maksamista. Seurakunnan verkkosivulle tai äänitteelle se voi olla asian loppu. Free Bible Version tehtiin siksi, että olisi laitos, jonka tiellä ei ole mitään.
hero.2=Sen on tehnyt Jonathan Gallagher, jolla on teologian tohtorin tutkinto St Andrewsin yliopistosta, ja sen julkaisee voittoa tavoittelematon Free Bible Ministry. Uusi testamentti tulee Nestle–Alandin kreikasta — siitä kriittisestä tekstistä, jota raamattuseurat käyttävät — ja Vanha testamentti hepreasta. Työtapa, jonka hanke itse kuvaa, kannattaa sanoa ääneen, koska se ei ole tavanomainen: käännös tehdään alkutekstistä pelkkien sanakirjojen avulla, ja vasta sitten sitä verrataan olemassa oleviin laitoksiin — tarkistuksena päällekkäisyyksien ja virheiden varalta, ei lähteenä. Se ei ole vanhemman englanninkielisen Raamatun tarkistus eikä uudempien yhdistelmä. Päämääräksi se ilmoittaa nykyenglannin, joka välttää slangia ja muodikkaita sanontoja, ja se kieltäytyy kääntämästä minkään yksittäisen uskonyhteisön kantojen suuntaan.
hero.3=Lisenssi on koko asian ydin. Se on Creative Commons Nimeä-JaaSamoin 4.0: kopioi, paina, pane verkkosivulle, muokkaa — kunhan laitos mainitaan nimeltä, muutokset merkitään ja se, mitä siitä rakennetaan, julkaistaan samoin ehdoin. Se on eri kauppa kuin vapaa käyttö: vapaus annetaan eteenpäin sen sijaan että se luovutettaisiin pois. Sama lisenssi on tämän aineiston espanjankielisellä Versión Biblia Librellä, joka tulee samalta työltä.
hero.4=Lukijalle tästä seuraa kaksi asiaa. Luettelo jättää sen vuosiluvun tyhjäksi, koska hanke julkaisee tarkistuksia sitä mukaa kuin niitä tekee; ei ole yhtä päivättyä painosta, johon tämä aineisto olisi kiinnitetty, ja sellaisen keksiminen olisi tyhjää pahempi. Ja Free Bible Versionin jakeen alta avattu askelma näyttää merkinnän ≈ TR, Textus Receptus, merkittynä todistajaksi eikä kantatekstiksi. Siitä tätä käännöstä ei ole tehty. Se on se, mitä aineisto tällä hetkellä pystyy tarjoamaan kreikaksi — kriittistä laitosta ei täällä vielä ole — ja sama sijainen ilmestyy samasta syystä New International Versionin, New American Standard Biblen ja Berean Standard Biblen alle.

