fact.7.value=Creative Commons Nimeä-JaaSamoin 4.0 — kopioi, paina ja muokkaa vapaasti, kunhan laitos mainitaan nimeltä, muutokset merkitään ja johdannainen kantaa saman lisenssin
fact.8.label=Vuosi luettelossa
fact.8.value=jätetty tyhjäksi ennemmin kuin arvattu — hanke tarkistaa tekstiä ja julkaisee sen uudelleen sitä mukaa, joten mikään yksi painos ei ole se laitos
fact.9.label=Askelman alla
fact.9.value=≈ TR, todistaja kreikasta eikä tämän käännöksen kantateksti; kriittistä kreikkalaista laitosta ei aineistossa vielä ole, joten sama sijainen palvelee [[NIV|NIV:tä]], [[NASB|NASB:tä]] ja [[BSB|BSB:tä]]
fact.10.label=Tässä aineistossa
fact.10.value=kaikki 66 kirjaa. Englanti avautuu lisenssinvaraiseen [[NIV|New International Versioniin]], joten tämä on [[BSB|Berean Standard Biblen]] ja [[WEB|World English Biblen]] rinnalla sitä englantia, jonka lukija saa kantaa täältä myös ulos
