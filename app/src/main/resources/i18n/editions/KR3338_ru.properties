title=Kirkkoraamattu 1933/38 — Об этом издании | Common Root
description=Kirkkoraamattu 1933/38: финская церковная Библия, заново переведённая с еврейского и греческого и принятая двумя половинами, в 1933 и 1938 годах, после того как комитет проработал над нею около семидесяти лет.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=Имя — это две даты, потому что книга пришла двумя половинами. Евангелическо-лютеранская церковь Финляндии приняла Ветхий Завет в 1933 году, а Новый — в 1938-м, и по-фински её с тех пор называют церковной Библией 1933/38 годов. Эти конечные даты скрывают, как далеко позади лежало начало: переводческий комитет был назначен в 1861 году. Около семидесяти лет и не одно поколение переводчиков отделяют поручение от готовой Библии.
hero.2=Комитет создал новый перевод, а не пересмотр. Он работал с еврейским текстом Ветхого Завета и греческим Нового — не через латинских, немецких или шведских посредников и не по финской Библии, уже бывшей в употреблении. И всё же он был сознательным преемником той Библии, Biblia 1776, которая полтора столетия была текстом церкви, и удержал немало её лексики и поступи. Это наследство и объясняет, почему Библия, законченная в 1938 году, звучала для первых своих читателей уже старинно и почему она до сих пор несёт торжественный строй финского Писания. Официальной церковной Библией она оставалась до 1992 года.
hero.3=В этой читалке у неё две роли. Поставьте интерфейс на финский — откроется именно это издание: собственный порядок каталога выдал бы вам Biblia 1776, так что финский выбор по умолчанию сделан намеренно, а не случайностью алфавита. Она же — верхняя ступень финской цепи: откройте ступень под стихом KR3338, и под ним появится Biblia 1776. Читайте эту ступень как преемство внутри Библии одной церкви, а не как источник, ибо у переводчиков 1933/38 годов перед глазами были еврейский и греческий, а не текст 1776 года. Ниже Biblia 1776 цепь продолжается: Biblia 1642 года, которую пересматривает издание 1776 года, затем финский Агриколы 1548 года, который тот комитет пересмотрел в свой черёд, и немецкий Лютера 1545 года, раскрытый рядом с ними за работой. Лишь под ними лестница достигает еврейского и греческого.

