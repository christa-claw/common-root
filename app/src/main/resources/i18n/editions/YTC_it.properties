title=Yorumsuz Türkçe Çeviri — Informazioni su questa edizione | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): una bibbia turca moderna, tradotta dalla World English Bible da İsmail Serinken in collaborazione con eBible.org, con licenza CC BY-ND 4.0 — il testo turco su cui questo corpus si apre per impostazione predefinita.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — letteralmente una traduzione turca "senza commento" o "non glossata" — è una bibbia turca moderna completata da İsmail Serinken in collaborazione con eBible.org, con diritti d'autore datati dal 2023 al 2025. Il nome stesso dichiara il metodo: una resa semplice, parola per parola, che lascia deliberatamente fuori le glosse esplicative e la parafrasi interpretativa, preferendo la trasparenza verso il testo di base a un idioma levigato.
hero.2=Quel testo di base è, detto onestamente, l'inglese e non l'ebraico, l'aramaico o il greco: la stessa pagina dei diritti d'autore della traduzione la descrive come resa dalla World English Bible, il che la rende una traduzione secondaria piuttosto che una fatta direttamente dalle lingue originali, a differenza della maggior parte delle altre bibbie di questo corpus. Common Root ha cercato prima un'edizione aperta della storica bibbia turca del 1941 (Kitabı Mukaddes), ormai sufficientemente antica da essere di pubblico dominio in Turchia, ma non è stato possibile trovarne una fonte digitale utilizzabile; la Yorumsuz Türkçe Çeviri era l'unica bibbia turca disponibile con licenza aperta. Il testo di questo corpus proviene dalla distribuzione USFM di eBible.org, lì catalogata come turytc.
hero.3=Le sue scelte di resa hanno un'impronta contemporanea piuttosto che tradizionale: rende il nome personale di Dio come Yahve invece del consueto "RAB" o "Yehova" turco, citando Esodo 3,14-15, e rende il nome di Gesù come Yeşua invece del familiare İsa turco, lasciando gli altri nomi propri nella loro forma ordinaria. Segue il canone protestante standard di 66 libri, senza libri deuterocanonici.
hero.4=È l'unica bibbia turca di questo corpus, quindi un'interfaccia turca si apre su di essa per impostazione predefinita.

