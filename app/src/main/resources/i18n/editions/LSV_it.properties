fact.9.label=In questo corpus
fact.9.value=Su licenza e non di pubblico dominio, insieme a [[NIV|la New International Version]] e [[NASB|la New American Standard Bible]] — su licenza e non liberamente copiabile, sebbene a condizioni notevolmente più permissive di entrambe. Nei pioli di discendenza non è registrato alcun genitore: è presentata come una revisione della Literal Translation di Robert Young, che non è essa stessa custodita in questo corpus, cosìché un piolo sotto un versetto della LSV scende direttamente al fondo della lingua originale, segnato con ≈. L'interfaccia inglese si apre per impostazione predefinita sulla New International Version; questa edizione si raggiunge dalla propria scheda.
