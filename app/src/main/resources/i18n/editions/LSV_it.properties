title=Literal Standard Version — Informazioni su questa edizione | Common Root
description=La Literal Standard Version: la revisione del 2020 che Covenant Press ha fatto della Literal Translation di Robert Young, del XIX secolo, puntando alla resa inglese più sistematicamente letterale dell'ebraico, dell'aramaico e del greco che un inglese leggibile consenta.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=La Literal Standard Version si presenta come una revisione importante della Literal Translation di Robert Young, la Bibbia inglese del XIX secolo di estrema letteralità, pubblicata per la prima volta nel 1862 e rivista da Young stesso nel 1887 e nel 1898. Covenant Press, il ramo editoriale della Covenant Christian Coalition, iniziò la nuova revisione all'inizio del 2018 con l'obiettivo dichiarato di mantenere l'impegno di Young per la letteralità parola per parola, aggiornandone però l'inglese e correggendo i punti in cui la ricerca manoscritta e lessicale più recente aveva fatto progressi. Il lavoro fu completato e pubblicato il 2 febbraio 2020; il copyright statunitense fu registrato nel gennaio di quell'anno, e le edizioni in e-book seguirono nel maggio dello stesso anno. I singoli traduttori non sono indicati nell'edizione pubblicata; come enti committenti figurano Covenant Press e la Covenant Christian Coalition.
hero.2=Per l'Antico Testamento, la LSV segue il Testo Masoretico, con una notevole influenza della Settanta e un ricorso occasionale ai Rotoli del Mar Morto quando le loro lezioni apparivano sufficientemente chiare da preferire. Per il Nuovo Testamento segue il Textus Receptus e il Testo Maggioritario, adottando lezioni della tradizione alessandrina solo in casi specifici e dichiarati, non come politica generale. I traduttori hanno fissato tre principi guida: conservare il tempo verbale dell'originale ove l'inglese lo consenta, rendere una data parola originale sempre con la stessa parola inglese ove la coerenza lo permetta, e mantenere l'ordine originale delle parole salvo dove la leggibilità in inglese richieda davvero un cambiamento. Il nome divino dell'Antico Testamento viene trascritto invece di essere reso con un titolo come "SIGNORE", in linea con la preferenza generale di questa traduzione per mostrare al lettore le scelte proprie del testo originale piuttosto che smussarle.
hero.3=Il legame con questo corpus è di natura testuale più che genealogica: il Nuovo Testamento della Literal Standard Version si basa sul Textus Receptus e sul Testo Maggioritario, la stessa base greca che questo corpus conserva separatamente e per intero come Textus Receptus — il testo alla base della King James Version e, in generale, della tradizione dell'epoca della Riforma. Nessun piolo di discendenza collega le due edizioni, poiché la LSV è presentata come una revisione della Literal Translation di Young, non del Textus Receptus in sé né di alcun testo qui custodito; un piolo aperto sotto un versetto della LSV scende perciò direttamente al fondo della lingua originale, segnato con ≈. È pubblicata con licenza Creative Commons Attribuzione-Condividi allo stesso modo 4.0, invece di essere ceduta al pubblico dominio, il che la pone, insieme alla New International Version e alla New American Standard Bible, tra le edizioni su licenza e non liberamente copiabili — sebbene a condizioni notevolmente più permissive di entrambe. L'interfaccia inglese si apre per impostazione predefinita sulla New International Version; questa edizione si raggiunge dalla propria scheda.

