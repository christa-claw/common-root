title=Textbibel 1906 — Über diese Ausgabe | Common Root
description=Die Textbibel von Kautzsch und Weizsäcker: eine Gelehrtenbibel, neu aus dem Hebräischen und Griechischen übersetzt, 1899 in Tübingen erstmals in einem Band erschienen; der Text hier ist auf 1906 datiert.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Zwei Professoren, zwei Testamente. Carl Weizsäcker (1822–1899) war Kirchenhistoriker in Tübingen, wo er 1861 Ferdinand Christian Baur auf dem Lehrstuhl nachfolgte und ab 1889 Kanzler der Universität war. Seine Übersetzung des Neuen Testaments erschien zuerst 1875 und erlebte zu seinen Lebzeiten neun Auflagen, deren letzte er noch auf dem Sterbebett vorbereitete. Emil Kautzsch (1841–1910) war Alttestamentler; er lehrte in Leipzig, Basel und Tübingen, bevor er 1888 nach Halle ging. Sein Altes Testament, übersetzt mit einer Gruppe von Fachkollegen, lag 1894 vollständig vor.
hero.2=1899, im Todesjahr Weizsäckers, wurden beide in einem Band vereinigt, der Textbibel des Alten und Neuen Testaments, verlegt bei J.C.B. Mohr (Paul Siebeck) in Tübingen. Der Name sagt, was sie ist: der bloße Text, für Leser, die wissen wollten, was das Hebräische und das Griechische sagen, im Deutsch ihrer eigenen Zeit. Luther ersetzen sollte sie nie. Weizsäcker mied bewusst Luthers Sprache und suchte stattdessen den Eindruck wiederzugeben, den das Original auf seine ersten Leser machte; sein Biograph hielt es für unwahrscheinlich, dass sie je ein Volksbuch werde, und sie wurde es nicht. Nachgedruckt wurde sie bis in die 1910er Jahre. Der digitale Text hier ist auf 1906 datiert; welche Auflage dieser Druck war, hat dieses Projekt nicht ermittelt.
hero.3=Sie liest sich wie die Wissenschaft ihrer Stunde. Der Gottesname im Alten Testament lautet „Jahwe“ — „Jahwe ist mein Hirte“ in Psalm 23 —, tausendfach, wo Luther „der Herr“ hat. Jesaja 7,14 hat „ein junges Weib“. Im Neuen Testament endet das Vaterunser in Matthäus 6,13 ohne die Doxologie, und 1. Johannes 5,7 kennt keine himmlischen Zeugen. Das Alte Testament behält die hebräische Kapitel- und Verszählung: Psalmüberschriften werden mitgezählt, sodass Psalm 51 21 Verse hat, und Maleachi hat drei Kapitel statt vier. Die Rechtschreibung ist älter, als das Datum vermuten lässt — in Johannes 8,1 „gieng“ Jesus auf den Ölberg.
hero.4=In diesem Leser ist sie eine von vier deutschen Bibeln, neben der Elberfelder und Luthers Texten von 1545 und 1912. Eine deutsche Oberfläche geht nicht auf ihr auf: Für das Deutsche ist keine Standardausgabe hinterlegt, also nimmt der Leser die erste deutsche Bibel im Katalog, und das ist die Elberfelder. In den Sprossen der Übersetzungslinie ist für sie kein Vorläufer verzeichnet, was zu einer Übersetzung aus den Urtexten passt: Eine unter einem Vers geöffnete Sprosse fällt direkt auf den mit ≈ markierten Boden der Ursprachen — den Westminster Leningrad Codex für das Alte Testament und für das Neue den Textus receptus, ein Griechisch, dem diese Übersetzung nicht folgt, wie 1. Johannes 5,7 zeigt.

