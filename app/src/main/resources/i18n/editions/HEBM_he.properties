fact.4.label=הוזמנה בידי
fact.4.value=חברת התנ"ך הבריטית והזרה ב־1873; התרגום הושלם ב־1877
fact.5.label=הברית הישנה מתוך
fact.5.value=העברית המסורתית עצמה — לא תרגום, וזה עושה אותה למהדורה היחידה כאן שהברית הישנה שלה כבר עומדת בלשון המקור שלה, כפי ש[[WLC|כתב יד לנינגרד של ווסטמינסטר]] עומד
fact.6.label=הברית החדשה מתוך
fact.6.value=היוונית של [[TR|הטקסטוס רצפטוס]]. דליטש פתח דווקא בקודקס הסינאיטי, אך חברת התנ"ך הוציאה לאור על פי הנוסח המקובל ולא הסכימה לממן את הסטייה
fact.7.label=משלב
fact.7.value=אין זו עברית מודרנית. דליטש כתב בעברית המשנה ובעברית ימי הבית השני, וביקש להשיב ליוונית את הניב שדובריה היו נוקטים
fact.8.label=הוגהה עד
fact.8.value=1890, והמהדורה האחרונה הובאה לדפוס בידי גוסטב דלמן
fact.9.label=אין לבלבל עם
fact.9.value=הברית החדשה בעברית בת זמננו שהוציאה החברה לכתבי הקודש בישראל, תרגום נפרד מן המאה העשרים שעדיין מוגן בזכויות יוצרים
fact.10.label=השנה בקטלוג
fact.10.value=הושארה ריקה — שתי המחציות אינן חולקות שנה, והברית החדשה לבדה הוגהה לאורך שלוש עשרה שנים ועשר מהדורות
fact.11.label=באוסף זה
fact.11.value=כל 66 הספרים, וברירת המחדל הנבחרת לממשק עברי — הקורא נפתח על זו ולא על [[WLC|כתב יד לנינגרד של ווסטמינסטר]], משום שזו עוברת את כל הדרך דרך הברית החדשה
