# The narrative, one paragraph per key, in order.
hero.1=ביבליה עברית מכריכה לכריכה היא חפץ מוזר יותר משהוא נשמע, שכן מחציתה מעולם לא נכתבה בעברית. הברית הישנה עברית והייתה כזאת תמיד. הברית החדשה הגיעה אלינו ביוונית. מהדורה כזאת היא אפוא שני סוגים שונים של נוסח שנתפרו יחד: מקור, ותרגום שנעשה בכיוון ההפוך מן הרגיל — מן היוונית ובחזרה אל הלשון שכותביו דיברו על פי רוב.
hero.2=מחצית הברית החדשה היא מעשה ידיו של פרנץ דליטש, חוקר עברית וספרות חז"ל מלייפציג, שחברת התנ"ך הבריטית והזרה הזמינה ממנו את המלאכה ב־1873 והוא סיים אותה ב־1877. הוא לא תרגם לעברית של המאה שלו. הוא כתב בעברית המשנה ובעברית של ימי הבית השני, מתוך טענה שנוסח מן המאה הראשונה צריך להישמע כמותו — ולפיכך התוצאה נקראת פחות כהעברה לעברית ויותר כניסיון להשיב את מה שהמשפטים אולי היו לפני שהיו יווניים. זו עדיין הברית החדשה העברית שאליה פונים לרוב.
hero.3=באיזו יוונית עבד הוכרע בחלקו עבורו. הוא פתח בקודקס הסינאיטי, כתב היד מן המאה הרביעית שנמצא כמה עשורים קודם לכן, וחברת התנ"ך — שמדיניותה הייתה להוציא לאור על פי הנוסח המקובל — סירבה להוסיף ולממן נוסח הבנוי עליו. דליטש חזר אל הטקסטוס רצפטוס וציין את הגרסאות הסינאיטיות המשמעותיות במקום לאמץ אותן. הנוסח הוסיף לנוע שלוש עשרה שנים ועשר מהדורות, והאחרונה בהן הובאה לדפוס בידי גוסטב דלמן ב־1890, השנה שבה מת דליטש. זו אחת הסיבות לכך שהקטלוג מותיר את שנת המהדורה הזאת ריקה: שתי המחציות אינן חולקות תאריך, ולמחצית שיש לה תאריכים יש עשרה מהם.
hero.4=בקורא הזה זו המהדורה שממשק עברי נפתח עליה — בחירה נבחרת ולא מקרה אלפביתי — ובחירה בעברית הופכת את הממשק כולו מימין לשמאל סביבה. היא עומדת לצד כתב יד לנינגרד בלי להתחרות בו: כתב היד הוא התנ"ך המדעי, מנוקד וממוטעם במלואו ונפסק במקום שבו נפסקת הברית הישנה, ואילו זה נוסח עיצורים פשוט הממשיך עד חזון יוחנן. שלבי השושלת אינם רושמים לה מקור, ולכן שלב הנפתח מתחת לפסוק צונח היישר אל רצפת שפות המקור, ≈ WLC ו־≈ TR. במקומות אחרים באוסף הזה אותה רצפה היא קירוב, וזה מה שהסימן ≈ מזהיר מפניו. כאן היא כמעט אינה כזאת: הברית הישנה שעל המסך היא נוסח המסורה עצמו, והטקסטוס רצפטוס הוא מה שדליטש באמת החזיק לפניו.

