title=מקרא בעברית — על מהדורה זו | Common Root
description=כל הביבליה בעברית: הברית הישנה על פי נוסח המסורה יחד עם הברית החדשה של פרנץ דליטש משנת 1877, שהוחזרה לעברית המשנה למען קוראים שרצו את הספר כולו בלשון אחת.
