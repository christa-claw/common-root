title=史密斯与范戴克译本 — 关于此版本 | Common Root
description=史密斯与范戴克的阿拉伯文圣经：由伊莱·史密斯在贝鲁特开始，1865 年由范戴克完成，参与其事的有复兴运动学者布特鲁斯·布斯塔尼、纳西夫·雅齐吉与优素福·阿西尔；至今仍是流传最广的阿拉伯文圣经。
heroHeading=史密斯与范戴克译本
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=贝鲁特的美国差会约在 1847 年着手此译，而开端者并未收尾。伊莱·史密斯在黎凡特住了二十年，对这门语言熟到足以与人争辩；他一直做到 1857 年去世。范戴克接手并做到底——新约于 1860 年告成，旧约晚五年，于 1865 年完成。书上的两个名字，是同一桩工作的两半。
hero.2=不在书脊上的名字同样有分量。范戴克的阿拉伯文正是从布特鲁斯·布斯塔尼和纳西夫·雅齐吉那里学来的，二人都与他一同译经，谢赫优素福·阿西尔也是，他通篇过了一遍阿拉伯文的词语与文气。这三位并非传教事业的助手。他们属于复兴运动的核心人物，而译成之书读来是阿拉伯文的散文，而不是披着阿拉伯外衣的译文。此书之所以比出资的差会活得更久，缘由在此。
hero.3=这既是学问，也是印刷术上的一桩功绩。贝鲁特的美国印刷所用一套专为差会刻制、1843 年竣工的阿拉伯字体排印此书，那套字至今仍称「美国体」，史密斯曾参与塑形。阿拉伯文难以排得妥帖——字母相连，连则变形——而一部在页面上看着对的圣经，为其见容所做的，胜过任何辩论。自那以后已发行数以百万计，读者兼及新教与科普特两方；对多数阿拉伯语基督徒而言，圣经本来就是这个声口。
hero.4=在本阅读器中，它是唯一的阿拉伯文圣经，这就决定了它的表现。将界面设为阿拉伯文，打开的便是它——并非因为经过挑选，像雷纳-瓦莱拉1909之于西班牙文那样，而是因为目录在界面语言中寻找圣经，恰好只找到一部。它也是此处仅有的两部自右向左行文的版本之一，另一部是现代希伯来文圣经。谱系阶梯中未为它记录母本，因此在某节之下展开的阶梯会径直落到以 ≈ 标记的原文语言底层——而这在此处比通常更贴近实情，因为该底层所供的希腊文正是公认经文，而它的新约正是据公认经文译出的。

