title=Brentons engelska Septuaginta — Om denna utgåva | Common Root
description=Sir Lancelot Brentons engelska översättning av det grekiska Gamla testamentet, först utgiven i London 1844 och på nytt med apokryferna 1851 — i mer än ett sekel den engelska Septuagintan, och i denna läsare stegpinnen ovanför den grekiska text den översattes från.
heroHeading=Brentons engelska Septuaginta
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) var son till en amiral i Royal Navy, Sir Jahleel Brenton, och prästvigdes i Church of England 1830, två år efter sin examen vid Oriel College i Oxford. Han stannade inte länge. I Oxford hade han träffat John Nelson Darby, och mot slutet av 1831 hade han lämnat statskyrkan för att grunda ett fristående kapell i Bath; 1835 var kapellet knutet till Plymouthbröderna, den rörelse som Darby då formade. Darbys egna biblar finns också i detta korpus, på franska och på engelska. År 1844 ärvde Brenton sin fars baronetvärdighet, och samma år gav Samuel Bagster and Sons i London ut hans översättning av Septuaginta. Han dog på Isle of Wight 1862, barnlös, den siste baroneten av sin gren.
hero.2=Den var inte den första engelska Septuagintan — Charles Thomson hade gett ut en i Philadelphia 1808 — men den var den som bestod: i mer än halvtannat sekel, tills New English Translation of the Septuagint kom 2007, läste en engelskspråkig läsare som ville ha det grekiska Gamla testamentet i stället för det hebreiska Brenton. Han översatte främst från Codex Vaticanus, handskriften från 300-talet i Vatikanbiblioteket. Den första utgåvan uteslöt apokryferna; utgåvan 1851 lade till dem, och det är texten från 1851 som denna kopia återger. Bagsters grekisk-engelska utgåvor satte grekiskan bredvid engelskan, och den grekiskan finns i detta korpus som en egen utgåva. Eftersom engelskan följer grekiskan läser den där grekiskan läser: psalmerna behåller den grekiska numreringen, så att Psalm 22 här är herdepsalmen, och i Jesaja 7:14 återger “a virgin shall conceive” det grekiska parthenos, inte det hebreiska ʿalmah.
hero.3=I denna läsare är den en stegpinne med en enda, bokstavlig förlaga: den grekiska Septuagintan under den är den text Brenton översatte, tryckt av hans eget förlag bredvid hans engelska. Öppna en stegpinne under en av dess verser så visas grekiskan, med Leningradkodexen under den som grundspråksbotten. Ingenting i korpuset står i sin tur på den. Vår kopia är smalare än boken. Den har 37 böcker, de som också den hebreiska kanon har under sina vanliga namn. Filerna från eBible.org som den hämtades ur innehåller också apokryferna — Tobit, Judit, Vishetens bok, Syraks bok, Baruk, fyra Mackabeerböcker och mer — och ger Ester och Daniel enbart i deras längre grekiska form. Inget av detta kom med in i korpuset, så här finns varken Ester eller Daniel, och där grekiskan under har Tobit eller Vishetens bok finns ingen engelska ovanför. Esra och Nehemja står som två böcker, där grekiskan under har en. En stavningsuppdatering av samma översättning, Adam Boyds Updated Brenton från 2020, finns i korpuset som en egen utgåva.

