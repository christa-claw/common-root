title=Yorumsuz Türkçe Çeviri — Tietoa tästä laitoksesta | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): nykyturkkilainen Raamattu, jonka İsmail Serinken käänsi World English Bible -tekstistä yhteistyössä eBible.orgin kanssa, lisensoitu CC BY-ND 4.0 -lisenssillä — turkinkielinen teksti, jonka tämä aineisto avaa oletuksena.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — kirjaimellisesti "selittämätön" tai "kommentoimaton" turkinkielinen käännös — on nykyaikainen turkinkielinen Raamattu, jonka İsmail Serinken sai valmiiksi yhteistyössä eBible.orgin kanssa, tekijänoikeudet vuosilta 2023–2025. Nimi itsessään kertoo menetelmän: pelkistetty, sana sanalta etenevä käännös, joka jättää tietoisesti pois selittävät kommentit ja tulkitsevan paraphraasin, suosien avoimuutta alkutekstiä kohtaan sujuvan idiomin sijaan.
hero.2=Se alkuteksti on, rehellisesti sanottuna, englanti, ei heprea, aramea tai kreikka: käännöksen oma tekijänoikeussivu kuvaa sen käännetyksi World English Bible -tekstistä, mikä tekee siitä välillisen käännöksen, ei alkukielistä suoraan tehtyä, toisin kuin useimmat tämän aineiston muut raamatunkäännökset. Common Root etsi ensin avointa laitosta historiallisesta vuoden 1941 turkinkielisestä Raamatusta (Kitabı Mukaddes), joka on nykyään riittävän vanha ollakseen tekijänoikeudettomassa asemassa Turkissa, mutta sille ei löytynyt käyttökelpoista digitaalista lähdettä; Yorumsuz Türkçe Çeviri oli ainoa avoimesti lisensoitu turkinkielinen Raamattu saatavilla. Tämän aineiston teksti on peräisin eBible.orgin USFM-jakelusta siitä, luetteloituna sinne tunnuksella turytc.
hero.3=Sen käännösratkaisut ovat luonteeltaan nykyaikaisia, ei perinteisiä: se antaa Jumalan persoonanimen muodossa Yahve totutun turkkilaisen "RAB":n tai "Yehovan" sijaan, viitaten kohtaan 2. Moos. 3:14–15, ja antaa Jeesuksen nimen muodossa Yeşua tutun turkkilaisen İsan sijaan, jättäen muut erisnimet tavanomaiseen muotoonsa. Siinä on vakiomuotoinen 66 kirjan protestanttinen kaanon, ei deuterokanonisia kirjoja.
hero.4=Se on tämän aineiston ainoa turkinkielinen Raamattu, joten turkinkielinen käyttöliittymä avautuu siihen oletuksena.

