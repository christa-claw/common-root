title=Young's Literal Translation — À propos de cette édition | Common Root
description=La traduction littérale de la Bible de Robert Young, publiée pour la première fois à Édimbourg en 1862, révisée par Young en 1887 puis par ses éditeurs en 1898 : une Bible anglaise qui garde les temps, l'ordre des mots et, autant qu'elle le peut, le vocabulaire de l'hébreu et du grec, même là où l'anglais peine à suivre.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) était imprimeur et libraire à Édimbourg. Il apprit seul l'hébreu et plusieurs autres langues orientales pendant son apprentissage d'imprimeur, dirigea une imprimerie missionnaire à Surat, en Inde, de 1856 à 1861, et reste connu avant tout pour deux livres : la concordance Analytical Concordance to the Bible et cette traduction. Il publia la Literal Translation à Édimbourg en 1862, puis une édition révisée en 1887. Dix ans après sa mort, en janvier 1898, ses éditeurs firent paraître une troisième édition, révisée une fois encore « selon ses lignes actuelles » ; c'est le texte de ce corpus. Young traduisit l'Ancien Testament à partir de l'hébreu massorétique reçu et le Nouveau Testament à partir du texte grec reçu, le Textus Receptus, et déclara nettement qu'il ne tenterait d'établir un texte nouveau ni de l'un ni de l'autre : la traduction, écrivait-il, est une tâche distincte de la critique textuelle, et peu de gens sont qualifiés pour les deux.
hero.2=Tout son but est de laisser un lecteur anglais voir la grammaire de l'original. Young tenait qu'une version qui donne un présent là où l'original a un passé, ou « an a for a the », un article indéfini pour un défini, met de côté l'inspiration verbale, et il traduisit en conséquence. Les formes verbales hébraïques passent en temps anglais, si bien que le récit court souvent au présent : la Genèse s'ouvre sur « In the beginning of God's preparing the heavens and the earth — » et poursuit « and God saith, ‘Let light be;’ and light is. » Les mots ajoutés pour le sens figurent entre crochets : « Jehovah [is] my shepherd, I do not lack. » Il chercha à donner à chaque mot hébreu ou grec un seul équivalent anglais chaque fois qu'il le pouvait, et ainsi l'hébreu olam et le grec aiōn deviennent « age » et « age-during » plutôt que « ever » et « eternal » ; en Matthieu 25:46, les justes s'en vont « to life age-during ». Le nom divin est rendu dans tout l'Ancien Testament par « Jehovah ».
hero.3=Notre copie est complète : 66 livres, de la Genèse à l'Apocalypse, sans les apocryphes, dans la numérotation anglaise des chapitres et des versets — 150 psaumes, dont le titre est fondu dans le premier verset, et Malachie qui s'achève au chapitre 4. Traduction du texte reçu, elle porte les passages que les éditions critiques ultérieures mettent en doute, de la finale longue de Marc aux trois témoins dans le ciel de 1 Jean 5:7, que ce texte place entre crochets, comme il le fait de tout Actes 8:37. Dans ce lecteur, elle se tient seule. Le corpus ne lui enregistre aucun parent, si bien qu'un échelon de filiation ouvert sous l'un de ses versets tombe directement sur le sol des langues originales marqué ≈ : le Codex de Léningrad dans l'Ancien Testament et le Textus Receptus dans le Nouveau. Ce sol est proche de ce que Young lui-même traduisit, l'hébreu massorétique et le grec reçu, mais pas dans les mêmes impressions. Rien n'est non plus enregistré comme reposant sur elle. La Literal Standard Version de 2020, elle aussi dans ce corpus, se présente comme une révision majeure de l'œuvre de Young, mais le corpus n'enregistre pas ce lien, de sorte que les échelons sous la LSV ne mènent pas ici. Aucune langue d'interface ne s'ouvre sur cette édition ; une interface en anglais s'ouvre sur la New International Version, et l'on atteint celle-ci par sa propre carte dans la grille des traductions.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=Anglais
fact.2.label=Traducteur
fact.2.value=Robert Young (1822–1888), imprimeur, libraire et linguiste autodidacte d'Édimbourg, auteur de l'Analytical Concordance to the Bible
fact.3.label=Ancien Testament d'après
fact.3.value=Le texte hébreu massorétique reçu — la tradition à laquelle appartient aussi [[WLC|le Codex de Léningrad]] de ce corpus
fact.4.label=Nouveau Testament d'après
fact.4.value=Le texte grec reçu, [[TR|le Textus Receptus]] — conservé, écrivait Young, « non parce qu'on le tient pour parfait », mais parce que traduction et critique textuelle sont des tâches distinctes
fact.5.label=Genre de traduction
fact.5.value=Strictement littérale : les temps de l'original gardés même là où l'anglais sonne étrange, si bien que le récit court souvent au présent ; un mot anglais pour chaque mot de l'original autant que possible, olam et aiōn devenant « age » et « age-during » ; les mots ajoutés pour le sens entre crochets ; le nom divin rendu par « Jehovah »
fact.6.label=Publiée
fact.6.value=Édimbourg, 1862 ; révisée par Young, 1887 ; troisième édition, révisée de nouveau par ses éditeurs, Édimbourg, janvier 1898 — le texte présent ici
fact.7.label=Licence
fact.7.value=Domaine public ; cette copie provient d'eBible.org
fact.8.label=Dans ce corpus
fact.8.value=66 livres, le canon protestant au complet, sans les apocryphes ; numérotation anglaise des chapitres et des versets, si bien que les psaumes sont au nombre de 150 et que le titre de chacun est fondu dans son premier verset
fact.9.label=Filiation
fact.9.value=Aucun parent enregistré, et rien d'enregistré comme reposant sur elle — un échelon s'ouvre directement sur le sol des langues originales, [[WLC|le Codex de Léningrad]] dans l'Ancien Testament et [[TR|le Textus Receptus]] dans le Nouveau ; [[LSV|la Literal Standard Version]] de 2020 révise l'œuvre de Young, mais le corpus n'enregistre pas ce lien
