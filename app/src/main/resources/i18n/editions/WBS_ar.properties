title=Webster's Bible — عن هذه الطبعة | Common Root
description=مراجعة نوح وبستر لـKing James Version عام 1833، الصادرة في نيو هيفن بولاية كونيتيكت — الكتاب المقدس الإنجليزي المتداول محفوظًا كلمةً بكلمة تقريبًا، مع استبدال الألفاظ المهجورة وتصحيح النحو وتلطيف بضعة تعابير للقراءة الجهرية.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=يُذكر نوح وبستر (1758–1843)، المعجمي من نيو هيفن، قبل كل شيء بمعجمه An American Dictionary of the English Language الصادر عام 1828. وبعد خمس سنوات وجّه الحرص نفسه على إنجليزية واضحة صحيحة معاصرة إلى الكتاب المقدس الذي كانت بلاده تقرؤه فعلًا. ففي عام 1833 أصدرت دار Durrie and Peck في نيو هيفن كتاب The Holy Bible … in the Common Version, with Amendments of the Language، بمقدمة موقَّعة في سبتمبر من ذلك العام. وهي ليست ترجمة جديدة. فقد أخذ وبستر King James Version الصادرة عام 1611 — «الترجمة المتداولة» — كما كانت تُطبع آنذاك، ولم يغيّرها إلا حيث صارت إنجليزيتها غامضة أو مخالفة للنحو. وكتب أنه رجع إلى اللغات الأصلية في تعديلاته، لكن الأسلوب العام للترجمة لا ينبغي أن يُغيَّر، وأنه لم يغيّر عن علم أي موضع تبني عليه طائفة عقيدتها.
hero.2=تذكر مقدمته ثلاثة أنواع من التغيير. فالألفاظ التي هُجرت تمامًا أفسحت المجال لألفاظ شائعة الاستعمال: فسيّد يوسف «knoweth not» ما في البيت (التكوين 39:8) حيث تقول King James «wotteth not»، وفي أعمال الرسل 12:4 ينوي هيرودس أن يُخرج بطرس إلى الشعب «after the passover» لا «after Easter». وجرى تقويم النحو على استعمال عصر وبستر: «who» بدل «which» حين يعود على الأشخاص، فتبدأ الصلاة الربانية بـ«Our Father who art in heaven»، و«its» بدل «his» حين يعود على الأشياء، فتُخرج نباتات التكوين 1 بزرها «after its kind». ثم استُبدلت بألفاظ ألطف كلماتٌ قليلة رأى أنها لا تليق بالقراءة الجهرية أمام جمهور مختلط. وكتب أيضًا «Holy Spirit» حيث تقول King James «Holy Ghost»، وليس في نسختنا «Holy Ghost» واحدة. وفيما عدا ذلك فالمراجعة خفيفة: يستطيع أكثر القرّاء أن يقرؤوا أصحاحًا بعد أصحاح دون أن يلاحظوا أنهم فارقوا نص King James.
hero.3=نسختنا كاملة: 66 سفرًا من التكوين إلى الرؤيا، من غير الأسفار القانونية الثانية، بترقيم الأصحاحات والآيات الإنجليزي — 150 مزمورًا أُدمج عنوان كل منها في آيته الأولى، وملاخي ينتهي عند الأصحاح 4. وعلى غرار King James تحتفظ بمقاطع النص المتلقّى التي تشكّك فيها الطبعات النقدية اللاحقة: الخاتمة الطويلة لإنجيل مرقس، وأعمال الرسل 8:37، والشهود الثلاثة في السماء في 1 يوحنا 5:7. وهي في هذا القارئ قائمة بذاتها. فمع أنها مراجعة لـKing James Version، الموجودة أيضًا في هذه المجموعة، لا تسجّل المجموعة لها أصلًا، ولذا فإن درجة نسب تُفتح تحت إحدى آياتها تسقط مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈ — مخطوطة لينينغراد في العهد القديم، وTextus Receptus في العهد الجديد — لا إلى النص الإنجليزي الذي عمل عليه وبستر فعلًا. ولا شيء مسجَّل أيضًا على أنه قائم عليها. ولا تُفتح على هذه الطبعة أي لغة من لغات الواجهة؛ فالواجهة الإنجليزية تُفتح على New International Version، ويُوصل إلى هذه الطبعة من بطاقتها الخاصة في شبكة الترجمات. وإذا وُضعت بجانب King James في عمود ثانٍ أظهرت تعديلات وبستر آيةً آية.

