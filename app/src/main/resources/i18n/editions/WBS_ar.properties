fact.3.label=مراجَعة عن
fact.3.value=[[KJV|King James Version]] الصادرة عام 1611، «الترجمة المتداولة»، كما كانت تُطبع آنذاك — رُوجعت بالإنجليزية ولم تُترجم من جديد، وإن رجع وبستر إلى العبرية واليونانية في تعديلاته
fact.4.label=نوع المراجعة
fact.4.value=خفيفة ومحافظة: ألفاظ مهجورة استُبدلت بألفاظ متداولة؛ ونحو مصحَّح، «who» للأشخاص و«its» للأشياء؛ وبضع كلمات عُدّت غير لائقة بالقراءة الجهرية لُطِّفت؛ و«Holy Spirit» بدل «Holy Ghost»؛ أما الأسلوب والمواضع العقدية فتُركت عمدًا على حالها
fact.5.label=نُشر
fact.5.value=نيو هيفن، كونيتيكت: Durrie and Peck، 1833، بعنوان The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=الترخيص
fact.6.value=ملك عام؛ وهذه النسخة من eBible.org
fact.7.label=في هذه المجموعة
fact.7.value=66 سفرًا، القانون البروتستانتي كاملًا، من غير الأسفار القانونية الثانية؛ بترقيم الأصحاحات والآيات الإنجليزي، فعدد المزامير 150، وعنوان كل مزمور مدمج في آيته الأولى
fact.8.label=النسب
fact.8.value=لا أصل مسجَّل، ولا شيء مسجَّل على أنه قائم عليها — تُفتح الدرجة مباشرة على أرضية اللغات الأصلية، [[WLC|مخطوطة لينينغراد]] في العهد القديم و[[TR|النص المتلقّى]] في العهد الجديد، مع أن النص الذي راجعه وبستر هو [[KJV|King James Version]]
