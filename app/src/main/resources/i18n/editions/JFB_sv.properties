title=Japanska Freedom Bible — Om denna utgåva | Common Root
description=Japanska Freedom Bible (フリーダム・バイブル): en fullständig japansk bibel i 66 böcker som eBible.org sprider som ett översättningsutkast utan upphovsrätt — den enda japanska bibeln i detta korpus, så det japanska gränssnittet öppnar på den.
heroHeading=Japanska Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=Japanska Freedom Bible — på japanska フリーダム・バイブル — är en fullständig japansk bibel som sprids av eBible.org, som anger sig själv som översättningens officiella distributör. Den är mycket ny: källfilerna i detta korpus är daterade den 19 augusti 2026, och årtalet 2026 på dess kort är de filernas datum. eBible anger inget särskilt utgivningsdatum, och inget påstås här heller.
hero.2=Mycket om den är inte känt, och det bör sägas rakt ut. eBibles sidor nämner ingen översättare, ingen kommitté och inget förlag, och de säger inte vad översättningen är gjord från — direkt från hebreiskan och grekiskan, eller via någon annan modern översättning. Dess egen upphovsrättssida kallar den ett översättningsutkast (翻訳の草案) och ber om förslag till förbättringar, så texten här är en ögonblicksbild av ett pågående arbete och inte en fastslagen utgåva.
hero.3=Klart är däremot dess rättsliga ställning: samma sida slår fast att ingen upphovsrätt gäller för översättningen och märker den som fri (public domain). Därför är det den som är den japanska texten här — den var den enda fullständiga japanska bibeln på eBible som var fri från upphovsrätt. Den äldre japanska bibel som hade kunnat ge den en släktlinje, Meijitidens översättning som fullbordades 1887 och sedan länge ligger i det fria, finns inte att få från den källan.
hero.4=I detta korpus omfattar den den protestantiska kanons 66 böcker, 31 098 verser, utan deuterokanoniska böcker. Ingen förlaga är registrerad för den, så en stegpinne som öppnas under en av dess verser leder direkt ned till urspråksbotten som är märkt med ≈: hebreiskan och grekiskan som visas där är vittnen, inte ett påstående om vad den är översatt från — och när källan är okänd är det också den ärliga läsningen. Den är den enda japanska bibeln i korpuset, så ett japanskt gränssnitt öppnar på den som standard.

