title=Tyndale New Testament 1534 — About This Edition | Common Root
description=William Tyndale's New Testament, the first English translation made from the Greek and the first printed, in his own revision of 1534 — the wording beneath the Geneva Bible and the King James Version.
heroHeading=Tyndale New Testament 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=In Tyndale's England an English Bible was still against the law. The Constitutions of Oxford of 1409 forbade anyone to translate Scripture into English, or to read such a translation, without a bishop's approval. William Tyndale asked the Bishop of London, Cuthbert Tunstall, for that approval in 1523, was turned away, and the next year left England to do the work without it. With Erasmus's Greek New Testament in front of him, and Luther's German and the Latin Vulgate beside it, he made the first English New Testament translated from the Greek, and the first ever printed. A first attempt at Cologne in 1525 was broken off by a raid on the printer; the complete book came from Peter Schöffer's press at Worms in 1526 and was smuggled into England, where the bishops bought up copies and burned them.
hero.2=The text here is Tyndale's own revision, printed at Antwerp in 1534, in which he went back over the Greek, corrected his first version and added prologues and notes. It was an argument as much as a translation. Thomas More attacked him for writing “congregation” where the Church said church, “elder” where it said priest, and “love” where it said charity, and all three choices stand in this text: Matthew 16:18 reads “apon this rocke I wyll bylde my congregacion”. Tyndale revised once more in 1535, was arrested in Antwerp that May, and in 1536 was condemned as a heretic, strangled and burned at Vilvoorde, outside Brussels.
hero.3=In this reader he is found underneath. The Tyndale is a recorded rung beneath both the Geneva Bible and the King James Version, and so, further down the ladder, beneath the Revised Version, the American Standard Version and the World English Bible that stand on the King James. Step down from a King James verse past the Geneva and much of the time the wording barely moves — which is the point; at 1 Corinthians 13:13 it does, where Tyndale and the Geneva say love and the King James says charity. Beneath Tyndale there is no recorded parent. He worked from Erasmus's Greek, but the Textus Receptus held here is the edition of 1550, a generation after him, and the Luther here is the Bible of 1545 rather than the New Testament of 1522 he used, so the ladder drops straight to the original-language floor. Only the New Testament is here, in his own spelling: Matthew opens “This is the boke of the generacion of Iesus Christ”.

