fact.13.label=Dans ce corpus
fact.13.value=la bible sur laquelle s'ouvre une interface allemande : l'allemand n'a pas d'édition par défaut choisie, donc le lecteur prend la première bible allemande du catalogue, et ELB passe devant [[LUT1545|Luther 1545]] et [[LUT1912|Luther 1912]] sur rien d'autre que son sigle. Aucun ascendant n'est enregistré dans les échelons de filiation — l'Elberfelder de 1871 dont elle est sortie à force de corrections n'est pas dans le corpus — de sorte qu'un échelon ouvre sur le sol des langues originales. Elle ne porte non plus d'année d'aucun côté : la fiche du catalogue laisse la colonne de l'année vide, et la liste des années d'échelon, tenue à la main, ne la connaît pas davantage, si bien qu'une pastille d'échelon pour ELB n'affiche que le sigle — le cas silencieux, là où [[DRA|la Douay-Rheims]] est le cas bruyant et où les deux listes se contredisent en public
