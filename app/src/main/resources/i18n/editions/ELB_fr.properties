title=Elberfelder 1905 — À propos de cette édition | Common Root
description=La Bible d'Elberfeld : la traduction allemande commencée en 1855 par John Nelson Darby, Carl Brockhaus et Julius Anton von Poseck, l'une des premières en allemand à quitter le Textus Receptus — ici dans le tirage de 1905.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Le nom est un lieu. Elberfeld est une ville de la vallée de la Wupper, rattachée à Wuppertal depuis 1929, et c'est là que l'essentiel du travail s'est fait. Trois hommes l'ont commencé : John Nelson Darby, Carl Brockhaus et Julius Anton von Poseck, tous liés à la branche allemande du mouvement des Frères. Le Nouveau Testament parut en 1855, les Psaumes en 1859 et l'Ancien Testament en 1871, publiés sous le nom de personne mais comme traduits du texte original « par quelques chrétiens ».
hero.2=Ce qui la distinguait, c'était le grec en dessous. Presque toute bible allemande alors en circulation reposait encore sur le Textus Receptus ; celle-ci rompit avec lui et recueillit les leçons du Codex Sinaiticus et du Codex Vaticanus à mesure que ces manuscrits paraissaient, au milieu du dix-neuvième siècle. L'Ancien Testament fut fait sur l'hébreu massorétique. Le principe de traduction était l'exactitude avant l'élégance : un allemand qui suit l'hébreu et le grec d'assez près pour en être raide, chaque mot ajouté pour le sens signalé comme ajouté, et aucun intertitre, au motif que les textes originaux n'en ont pas. On la compte encore parmi les versions allemandes les plus proches de la lettre qu'elles portent.
hero.3=Voici le tirage de 1905, le premier composé en caractères latins et non en fraktur ; du petit corps de cette fonte lui vient le nom de Perlbibel. Ce ne fut pas une traduction nouvelle. Jusqu'à la mort de Rudolf Brockhaus en 1932, l'Elberfelder fut relue et corrigée d'un tirage à l'autre — Alfred Rochat répondant de l'Ancien Testament, Emil Dönges du Nouveau — de sorte qu'une date nomme ici un tirage dans un texte en mouvement plutôt qu'une édition achevée. Ce qui se vend aujourd'hui comme Elberfelder est le plus souvent autre chose encore : une commission issue du même mouvement a passé vingt-cinq ans à la réviser et a publié le résultat en 1975 et en 1985. Cette révision a ôté « Jehova » de l'Ancien Testament et mis « HERR » à sa place. Ce texte-ci imprime toujours « Jehova », ce qui le range aux côtés de l'American Standard Version et de la propre bible française de Darby.
hero.4=Sa place dans cette collection est un peu à l'écart. L'allemand n'a pas d'édition par défaut choisie dans le lecteur, si bien qu'une interface allemande ouvre la première bible allemande du catalogue, et c'est celle-ci — devant les deux bibles de Luther par ordre alphabétique et pour rien d'autre. Dans les échelons de filiation, elle est seule. Les deux Luther forment une chaîne, celle de 1912 révisée sur celle de 1545 et celle de 1545 reposant sur le grec et l'hébreu, tandis que l'Elberfelder n'a aucun ascendant enregistré, parce que l'Elberfelder de 1871 dont elle est sortie à force de corrections n'est pas dans ce corpus. Un échelon sous un verset de l'Elberfelder descend donc tout droit sur le sol des langues originales marqué ≈, quand bien même la bible française de Darby, à une colonne de là, est ici sa plus proche parente.

