title=Diodati 1649 (İtalyanca) — Bu Baskı Hakkında | Common Root
description=Giovanni Diodati'nin İtalyanca Kutsal Kitabı: 1607'de Cenevre'de basıldı, Vulgata'dan değil İbranice ile Yunancadan yapılan ilk İtalyanca çeviridir, 1641'de kendi notlarıyla gözden geçirildi — ve dosyadaki yılın neden onun öldüğü yıl olduğu.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati 1576'da Cenevre'de, dinlerinden vazgeçmektense İtalya'yı bırakmış Luccalı bir tüccar ailesinde doğdu. Soyca İtalyan, yetişmece Cenevreliydi ve bu kitabın var olmasının bütün nedeni tam da bu birleşimdir: Reform'un ulaşmadığı ülkenin dili ondaydı ve Reform'un matbaası olmuş şehirde duruyordu. Theodore Beza onu yirmi bir yaşındayken İbranice kürsüsüne aday gösterdi. 1606'da ilahiyat profesörü, 1608'de papaz oldu ve ertesi yıl ilahiyat kürsüsünde Beza'nın yerine geçti; 1618'de Cenevre delegesi olarak Dort Sinodu'na gitti ve tutanaklarını kaleme almakla görevlendirilen altı kişiden biri oldu.
hero.2=İtalyanca Kutsal Kitabı 1607'de Cenevre'de basıldı. İtalya'nın daha önce de halk dilinde Kutsal Kitapları olmuştu — Malermi'ninki 1471, Brucioli'ninki 1532 — ama bunlar Latinceden çalışıyor ya da ona ağır biçimde yaslanıyordu. Diodati İbraniceye ve Yunancaya gitti; Yeni Antlaşma için bu, Beza'nın bir kuşak önce aynı şehirde yayımladığı Yunanca metin demekti. 1641'de kendi açıklayıcı notlarını ekleyerek gözden geçirilmiş bir baskı çıkardı ve yeniden basımlar bundan iner. O, İtalyan Protestan Kutsal Kitabı oldu ve öyle kaldı — neredeyse hiç Protestan okuru olmayan bir ülkede bu, dört yüzyıl boyunca onu çok az sayıda insanın taşıdığı anlamına geliyordu. Kutsal Kitabı Fransızcaya da çevirdi, 1644'te; o çevirinin daha zayıf olduğu genellikle kabul edilir ve kendisi de büyük olasılıkla itiraz etmezdi.
hero.3=Karttaki yıl bir cümleyi hak ediyor, çünkü ortada yıl yok. Bu metin sayısal ortamda “Diodati 1649” etiketiyle dolaşıyor; 1649 ise bir baskı değil, Diodati'nin öldüğü yıldır. Bir şey ifade eden iki tarih şudur: çevirinin ilk çıktığı 1607 ve onu gözden geçirdiği 1641. Eldeki herhangi bir sayısal dosyanın bunlardan hangisini gerçekten temsil ettiği bu projede saptanmış değildir; bu yüzden katalog, arkasında duramayacağı bir sayıyı basmaktansa yıl sütununu boş bırakır. Ad, geldiği gibi korunmuştur, çünkü insanlar onu arayacaktır.
hero.4=Bu okuyucuda tek İtalyanca Kutsal Kitap odur, dolayısıyla arayüzü İtalyancaya almak onu açar — İspanyolca için Reina-Valera 1909 seçilmiş olduğu gibi elle seçildiği için değil, katalog taraması bu dilde başka bir şey bulamadığı için. Soy basamaklarında ona kayıtlı bir kaynak yoktur, bu yüzden bir ayetin altında açılan basamak doğruca ≈ ile imlenen özgün diller tabanına iner. O taban Yunanca için Textus Receptus'u verir ve burada bu, alışılmadık biçimde gerçeğe yakındır: bu derlemedeki çoğu baskı için Receptus, çevirmenlerin gerçekte kullandığı eleştirel bir metnin yerine durur; oysa Diodati gerçekten de o aileden basılı bir Yunanca metinden çalışıyordu. Basamak etiketi yıl taşımaz, bu da karttaki boşlukla uyuşur.

