title=American Standard Version — この版について | Common Root
description=1901年のアメリカン・スタンダード・バージョン：郵便のやり取りを通じて二十年かけてキング・ジェイムズ・バージョンを校訂した学者たちによるリバイズド・バージョンのアメリカ版であり、リバイズド・スタンダード・バージョン、ニュー・アメリカン・スタンダード・バイブル、ワールド・イングリッシュ・バイブルの親でもある。
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=アメリカン・スタンダード・バージョンは、もともと他人の企てとして始まった。1870年にイングランド国教会がキング・ジェイムズ・バージョンの改訂に乗り出したとき、アメリカの学者たちにも参加を呼びかけ、彼らはそれに応じた——大西洋を挟んだ文通によって、二十年近くにわたって。両者の意見が分かれたところでは、イギリス側委員会の読み方が本文に入り、アメリカ側の好みは付録に回された。そしてアメリカ側は、自分たちの版を出すのを十四年間差し控えることに同意した。英語のリバイズド・バージョンは1881年と1885年に世に出た。アメリカ版は1901年にこれに続き、付録の読み方は、その編者たちがかねてから望んでいた場所——本文——へと引き上げられた。
hero.2=これは学者による、学者のための翻訳であり、読めばそれとわかる。改訂者たちは、英語が許すかぎりヘブライ語とギリシャ語の語順に忠実であろうとし、そのためアメリカン・スタンダード・バージョンは正確である一方、長く読むと硬い文章になっている。もっとも目立つ判断は神の御名についてのものである。キング・ジェイムズ・バージョンが大文字で「the LORD」と印刷した箇所に、アメリカン・スタンダード・バージョンは「Jehovah」（エホバ）と印刷し、それは旧約聖書全体を通じて数千回に及ぶ。新約聖書では、テクストゥス・レセプトゥスではなく改訂者たち自身のギリシャ語本文に従っており、そのためキング・ジェイムズ訳の訳者たちが依拠した読みで、より古い写本には見られないもの——ヨハネの第一の手紙5章7節の三位一体を示す一節もその一つ——は、脚注に回されるか、省かれている。
hero.3=アメリカン・スタンダード・バージョンが礼拝で使われる聖書になることはついになかった。それが成ったのは親のほうだった。1952年のリバイズド・スタンダード・バージョンはこれの改訂であり、このコーパスにも収められているニュー・アメリカン・スタンダード・バイブルもそうであり、現代綴りでアメリカン・スタンダード・バージョンをパブリックドメインへと運んだワールド・イングリッシュ・バイブルもそうである。だからこそ、これはこのリーダーの系譜の段の中で、ちょうど今ある位置——このコーパスが持つ最長の連鎖の中ほど——に座っているのである。アメリカン・スタンダード・バージョンの一節の下で段を開けば、その底本となったリバイズド・バージョンが現れ、その下にはキング・ジェイムズ・バージョンとジュネーヴ聖書が続き、≈ 印で示された原語の底面まで下る。ワールド・イングリッシュ・バイブルの一節の下で段を開けば、ここへと戻ってくる。

