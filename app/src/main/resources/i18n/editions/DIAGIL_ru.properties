title=Emphatic Diaglott (подстрочник) — Об этом издании | Common Root
description=Emphatic Diaglott Бенджамина Уилсона 1864 года: пословный английский подстрочник, напечатанный под греческим текстом Грисбаха, впоследствии купленный и шестьдесят лет переиздававшийся Обществом Сторожевой башни, — и тот текст, вокруг которого обычно ведётся спор об Ин. 1:1.
heroHeading=Emphatic Diaglott (подстрочник)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Бенджамин Уилсон не был учёным по профессии. Он был газетным редактором в Женеве, штат Иллинойс, выучил греческий сам и между 1857 и 1863 годами выпускал частями подстрочный Новый Завет, который не только перевёл, но и изготовил: племянник видел, как он снимал восковые оттиски с каждой набранной полосы, вешал их на ночь в кислоту, чтобы наросла медная плёнка, подливал под медь литой металл и печатал получившееся на ручном станке, пока мальчик накатывал краску. Готовый том вышел в 1864 году. Греческий он взял из текста, установленного Иоганном Якобом Грисбахом в 1770-е годы, с чтениями из Ватиканского кодекса.
hero.2=На деле Уилсон напечатал два английских текста, а не один. По левому краю страницы шёл греческий с буквальным пословным английским подстрочником под каждым словом; по правому — его собственный отделанный перевод, Emphatic Version. Это не одно и то же, и в Ин. 1:1 они прямо расходятся: подстрочник читает «and a god was the Word», Emphatic Version — «and the LOGOS was God». Оба принадлежат Уилсону и напечатаны в одной книге в нескольких сантиметрах друг от друга. В этом собрании лежит подстрочник, тот самый столбец, который цитируют, — и потому он помещён в отдельный раздел, а не в сетку Библий. Подстрочник записывает, как сложена греческая фраза: падеж за падежом, артикль за артиклем, в греческом порядке слов. Он не есть суждение о том, как фразу следует читать по-английски, а собственное суждение Уилсона об этом напечатано в соседнем столбце. Кто цитирует одно, тому стоит знать, что есть и другое.
hero.3=Позднейшая жизнь книги и есть причина, по которой о ней слышало большинство. Уилсон умер в 1900 году членом Church of the Blessed Hope, а не какой-либо группы, существовавшей тогда под именем Свидетелей Иеговы. В 1902 году Чарльз Тейз Расселл, президент Общества Сторожевой башни, получил авторские права от наследников Уилсона, а со временем и сами стереотипы. Общество печатало «Диаглотт» следующие шестьдесят лет: заново набрало текст на собственных станках в 1927 году, отпечатало далеко за сто пятьдесят тысяч экземпляров, продавало по два доллара, а в конце концов стало раздавать даром. Так что «Диаглотт» — книга Свидетелей Иеговы по усыновлению, а не по авторству, и его обыкновение печатать «Иегова» в Новом Завете там, где писавшие ставили κύριος, цитируя еврейские Писания, появилось на четыре десятилетия раньше движения, прославившего эту практику. Авторское право истекло в 1952 году, и с тех пор текст в общественном достоянии.
hero.4=Две вещи о нём в этой читалке стоит знать до того, как им пользоваться. Грисбах не печатал ни Деян. 8:37, ни Лк. 17:36, так что здесь нет ни того, ни другого; вместо того чтобы сомкнуть пробел и сдвинуть каждый следующий стих на единицу вверх, нумерация оставляет эти два места пустыми, так что ссылка попадает в этом столбце на тот же стих, что и в соседнем. И предшественника ему не записано, так что ступень родословия, открытая под стихом «Диаглотта», ведёт на пол языков оригинала, а не к более старому английскому изданию.
hero.5=Будьте точны в том, что этот пол печатает. Греческий, который он показывает, — это Textus Receptus: на метке стоит ≈ TR 1550, и это ≈ есть способ читалки сказать, что она предлагает свидетеля греческого текста, а не тот текст, с которого сделано это издание. Уилсон работал по Грисбаху. Там, где оба согласны, как в Ин. 1:1, ступень и правда показывает те самые слова, которые разбираются. Там, где они расходятся, — нет: Грисбах отверг тринитарную вставку в 1 Ин. 5:7, так что в «Диаглотте» от неё не осталось и следа, тогда как строка Textus Receptus внизу несёт её целиком. Для подстрочника, вся предпосылка которого в том, что греческий тут же, на странице, это единственный пробел, о котором стоит знать, прежде чем из него цитировать.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Что это такое
fact.1.value=подстрочная глосса — пословный английский, напечатанный под греческим, а не удобочитаемый перевод Уилсона
fact.2.label=Составитель
fact.2.value=Бенджамин Уилсон (1817–1900), самоучка-исследователь и газетный редактор в Женеве, штат Иллинойс
fact.3.label=Греческий текст
fact.3.value=рецензия Грисбаха, с чтениями из Ватиканского кодекса (ватиканская рукопись 1209)
fact.4.label=Издано
fact.4.value=частями с 1857 года; целиком одним томом в 1864 году, у Fowler and Wells в Нью-Йорке
fact.5.label=Как напечатано
fact.5.value=Уилсон сам гальванизировал каждую пластину и отпечатал первое издание на ручном станке
fact.6.label=Божественное имя
fact.6.value=печатает «Иегова» в Новом Завете там, где писавшие ставили κύριος, цитируя еврейское Писание, — то же решение, какое [[ASV|American Standard Version]] приняла по всему Ветхому Завету
fact.7.label=Приобретено
fact.7.value=Обществом Сторожевой башни, получившим авторские права в 1902 году при Чарльзе Тейзе Расселле, заново набравшим текст в 1927 году и печатавшим его до 1960-х годов
fact.8.label=Лицензия
fact.8.value=общественное достояние — авторское право истекло в 1952 году, а переиздания Сторожевой башни нового не добавили
fact.9.label=Двух стихов нет
fact.9.value=Деян. 8:37 и Лк. 17:36 отсутствуют у Грисбаха и потому отсутствуют здесь; их номера оставлены пустыми, а не сомкнуты, так что текст по-прежнему совпадает стих в стих с любым другим изданием
fact.10.label=Греческий под ступенью
fact.10.value=[[TR|Textus Receptus]], показанный как ≈ TR 1550, — свидетель греческого текста, а не основа Уилсона, которой была рецензия Грисбаха; оба согласны в Ин. 1:1 и расходятся в 1 Ин. 5:7
fact.11.label=В этом собрании
fact.11.value=держится в собственном разделе подстрочных и учебных изданий, в стороне от читательских Библий, чтобы подстрочник никогда не приняли за перевод; в ступенях родословия основа не записана, так что ступень открывается прямо на пол языков оригинала
