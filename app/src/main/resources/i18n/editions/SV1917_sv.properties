title=Svenska 1917 — Om denna utgåva | Common Root
description=Svenska kyrkans översättning från 1917 — Gustav V:s bibel — den första svenska bibeln som gjordes direkt från hebreiska och grekiska i stället för att revideras från den föregående, och den enda svenska bibeln detta korpus rymmer.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=I tre och ett halvt sekel hade Svenska kyrkan en enda bibel, reviderad men aldrig omgjord. Gustav Vasas bibel från 1541, den första fullständiga bibeln tryckt på svenska, lutade sig tungt mot Martin Luthers tyska. Gustav II Adolfs bibel från 1618 reviderade den, och Karl XII:s bibel från 1703 — färdigställd under en kung fast beställd av hans far före honom — förde samma ärvda svenska ett steg vidare. Ingen av de tre började om från början.
hero.2=År 1773 utsåg Gustav III en bibelkommission att göra det ingen av dessa revisioner hade gjort: översätta direkt från hebreiska och grekiska i stället för att föra den gamla svenskan vidare en gång till. Kommissionen satt i 144 år. Dess resultat — Sveriges andra fullständiga bibelöversättning, efter Gustav Vasas och före Bibel 2000 — färdigställdes och fastställdes under Gustav V 1917, och kallas därför ännu ofta Gustav V:s bibel.
hero.3=Gamla testamentet vilar på den masoretiska hebreiskan, liksom utgåvorna före den. Nya testamentet fortsätter inte deras linje: det följer den mest ajourförda kritiska grekiska text kommissionen hade tillgång till vid 1917, i stället för den Textus Receptus som detta korpus reformationstida biblar bygger på.
hero.4=I denna läsare är den den enda svenska bibeln, så att ställa gränssnittet på svenska öppnar den — inte som ett kurerat val, så som Reina-Valera 1909 är vald för spanskan, utan för att katalogsökningen inte finner något annat på språket. Ingen förlaga är registrerad för den i härstamningens stegpinnar, så en stegpinne öppnad under en vers faller rakt ned på det med ≈ markerade grundspråksgolvet. Det golvet levererar Textus Receptus för grekiskan, och här ligger det längre från sanningen än vanligt: kommissionen lämnade medvetet Textus Receptus bakom sig för en mer ajourförd kritisk text, så att golvet under en vers i denna översättning namnger en grekisk text som inte är den den faktiskt följde.

