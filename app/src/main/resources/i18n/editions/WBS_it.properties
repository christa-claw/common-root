fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Revisore
fact.2.value=Noah Webster (1758–1843), lessicografo americano, autore di An American Dictionary of the English Language (1828)
fact.3.label=Rivista da
fact.3.value=[[KJV|La King James Version]] del 1611, «la versione comune», così come allora si stampava — rivista in inglese, non tradotta di nuovo, anche se Webster consultò l'ebraico e il greco per le sue correzioni
fact.4.label=Tipo di revisione
fact.4.value=Leggera e prudente: parole antiquate sostituite da parole correnti; grammatica corretta, «who» per le persone e «its» per le cose; alcune parole ritenute inadatte alla lettura ad alta voce addolcite; «Holy Spirit» al posto di «Holy Ghost»; lo stile e i passi dottrinali lasciati di proposito come erano
fact.5.label=Pubblicata
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, come The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Licenza
fact.6.value=Pubblico dominio; questa copia da eBible.org
fact.7.label=In questo corpus
fact.7.value=66 libri, il canone protestante completo, senza gli apocrifi; numerazione inglese di capitoli e versetti, così che i salmi sono 150 e il titolo di ciascuno è incorporato nel suo primo versetto
fact.8.label=Discendenza
fact.8.value=Nessun genitore registrato e nulla registrato come poggiante su di essa — un piolo si apre dritto sul pavimento delle lingue originali, [[WLC|il Codice di Leningrado]] nell'Antico Testamento e [[TR|il Textus Receptus]] nel Nuovo, anche se il testo rivisto da Webster è [[KJV|la King James Version]]
