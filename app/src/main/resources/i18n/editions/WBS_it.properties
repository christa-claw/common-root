title=Webster's Bible — Su questa edizione | Common Root
description=La revisione della King James Version compiuta da Noah Webster nel 1833 e pubblicata a New Haven, nel Connecticut — la Bibbia inglese comune conservata quasi parola per parola, con le parole cadute in disuso sostituite, la grammatica corretta e alcune espressioni addolcite per la lettura ad alta voce.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), il lessicografo di New Haven, è ricordato soprattutto per An American Dictionary of the English Language del 1828. Cinque anni dopo rivolse la stessa cura per un inglese chiaro, corretto e attuale alla Bibbia che il suo paese leggeva davvero. Nel 1833 Durrie and Peck di New Haven pubblicarono The Holy Bible … in the Common Version, with Amendments of the Language, con una prefazione firmata nel settembre di quell'anno. Non è una nuova traduzione. Webster prese la King James Version del 1611 — «la versione comune» — così come allora si stampava, e la modificò solo dove il suo inglese era diventato oscuro o sgrammaticato. Scrisse di aver consultato le lingue originali nel fare le sue correzioni, ma che lo stile generale della versione non andava alterato, e di non aver cambiato consapevolmente alcun passo su cui una confessione fondasse la propria dottrina.
hero.2=La sua prefazione indica tre tipi di cambiamento. Le parole del tutto uscite dall'uso lasciarono il posto a parole di buon uso: il padrone di Giuseppe «knoweth not» che cosa c'è in casa (Genesi 39:8) dove la King James ha «wotteth not», e in Atti 12:4 Erode intende far comparire Pietro «after the passover», non «after Easter». La grammatica fu adeguata all'uso dei tempi di Webster: «who» al posto di «which» quando si riferisce a persone, così che il Padre nostro comincia «Our Father who art in heaven», e «its» al posto di «his» quando si riferisce a cose, così che le piante di Genesi 1 portano seme «after its kind». Infine, un piccolo numero di parole che giudicava inadatte a essere lette ad alta voce davanti a un uditorio misto furono sostituite da altre più delicate. Scrisse inoltre «Holy Spirit» dove la King James ha «Holy Ghost», e la nostra copia non contiene neppure un «Holy Ghost». Per il resto la revisione è leggera: la maggior parte dei lettori potrebbe leggere un capitolo dopo l'altro senza accorgersi di aver lasciato il testo della King James.
hero.3=La nostra copia è completa: 66 libri, dalla Genesi all'Apocalisse, senza gli apocrifi, nella numerazione inglese di capitoli e versetti — 150 salmi, con il titolo di ciascuno incorporato nel primo versetto, e Malachia che termina al capitolo 4. Come la King James, conserva i passi del testo ricevuto che le edizioni critiche successive mettono in dubbio: la finale lunga di Marco, Atti 8:37 e i tre testimoni in cielo di 1 Giovanni 5:7. In questo lettore sta da sola. Benché sia una revisione della King James Version, anch'essa in questo corpus, il corpus non le registra alcun genitore, così che un piolo di discendenza aperto sotto uno dei suoi versetti cade dritto sul pavimento delle lingue originali contrassegnato con ≈ — il Codice di Leningrado nell'Antico Testamento e il Textus Receptus nel Nuovo — e non sul testo inglese su cui Webster lavorò davvero. Nulla risulta registrato come poggiante su di essa. Nessuna lingua dell'interfaccia si apre su questa edizione; un'interfaccia inglese si apre sulla New International Version, e a questa si arriva dalla sua scheda nella griglia delle traduzioni. Accostata alla King James in una seconda colonna, mostra le correzioni di Webster versetto per versetto.

