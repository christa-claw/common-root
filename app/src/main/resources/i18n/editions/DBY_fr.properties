title=Darby 1885 (français) — À propos de cette édition | Common Root
description=La Bible Darby française de 1885 : la traduction de Pau et Vevey, commencée en 1859 par John Nelson Darby et ses collaborateurs et achevée trois ans après sa mort, et la version à partir de laquelle fut ensuite construit son Ancien Testament anglais.
heroHeading=Darby 1885 (français)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=On se souvient de John Nelson Darby pour autre chose — il quitta l'Église d'Irlande, contribua à fonder les Frères de Plymouth et mit en circulation le prémillénarisme dispensationaliste —, mais il passa une grande part de sa vie à traduire la Bible, et il le fit en trois langues. Ce qu'il y a d'inhabituel chez lui, c'est l'ordre. La plupart des traducteurs travaillent en partant de leur propre langue. Sa Bible anglaise fut la dernière des trois à être achevée, et son Ancien Testament ne fut pas établi par lui directement sur l'hébreu, mais sur les versions française et allemande qu'il avait déjà produites avec d'autres.
hero.2=Voici la française. Darby en fut le savant principal, mais jamais le seul traducteur de quoi que ce soit qui porte son nom ; l'équipe française comptait William Joseph Lowe et Pierre Schlumberger. Le Nouveau Testament parut en 1859 et fut réédité trois fois au cours des deux décennies suivantes. La Bible complète sortit en 1885 à Pau et à Vevey — d'où le nom sous lequel on la désigne d'ordinaire —, quoique la page de titre induise un peu en erreur : Pau est à l'extrême sud de la France, et le travail fut fait surtout pour les assemblées de frères de la Suisse romande. Darby était mort en 1882 ; il n'a donc jamais vu le livre achevé.
hero.3=La traduction est littérale par principe, et Darby en a dit franchement la raison dans la préface de son Nouveau Testament allemand : le savant peut consulter l'original, de sorte que le but d'une traduction est d'en mettre la représentation la plus exacte possible entre les mains de ceux qui ne le peuvent pas. Il avertissait aussi qu'un rendu plus libre perd des sens que le traducteur lui-même n'a peut-être pas saisis. Le résultat est exact et sans grâce, et n'a jamais été destiné à la lecture à haute voix — dans sa propre prédication, Darby se servait de la King James Version.
hero.4=Deux choses la rattachent au reste de ce corpus. La Bible Darby allemande est l'Elberfelder, présente ici sous le nom d'Elberfelder 1905 — le même homme, les mêmes principes, et l'un des deux textes à partir desquels fut assemblé son Ancien Testament anglais, de sorte que ces deux fiches, la française et l'allemande, sont plus proches parentes que leurs langues différentes ne le laissent croire. Et son traitement du nom divin la place à côté de l'American Standard Version, qui imprime “Jehovah” des milliers de fois là où la King James Version imprime “the LORD” ; Darby a pris la même décision le premier, en trois langues. Dans le lecteur, c'est la seule bible française, si bien qu'une interface en français s'ouvre sur elle. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation et, à la différence de la plupart des éditions datées présentes ici, sa pastille d'échelon ne porte aucune année — la fiche du catalogue indique 1885, mais les années d'échelon forment une liste distincte tenue à la main, et cette édition n'y figure pas encore.

