title=Geneva Bible 1599 — About This Edition | Common Root
description=The Geneva Bible: made by English Protestants exiled in Geneva, the first English Bible with numbered verses and marginal notes, read by Shakespeare's generation and the parent rung beneath the King James Version.
heroHeading=Geneva Bible 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=This Bible was made abroad, by people who could not safely stay at home. When Mary I came to the throne in 1553 and England returned to Rome, a few hundred Protestants left; a number of them settled in Calvin's Geneva, where they had presses, Hebrew and Greek scholarship, and no bishop to answer to. William Whittingham published a New Testament there in 1557. A team under Anthony Gilby worked through the Old Testament, and the complete Bible was printed at Geneva by Rowland Hall in 1560, two years after Mary's death, when most of the exiles had already gone home.
hero.2=What they produced changed what an English Bible looked like. It was the first to number every verse, so a reader could be pointed to a line rather than to a chapter. It was set in Roman type instead of blackletter, and issued small enough and cheap enough to be owned rather than chained to a lectern. And the margins were full: cross-references, glosses on hard words, maps, and notes explaining what a passage meant. That last part is why it was loved and why it was resented. The notes are Reformed, sharply so in places, and they tell the reader what to think about kings as readily as about doctrine.
hero.3=The date on this edition needs a word of caution, because the Geneva Bible was not one book but a text reprinted for eighty years while its parts changed. In 1576 Laurence Tomson replaced the New Testament with his own revision, made against Theodore Beza's Greek edition of 1565, and from 1587 that is the New Testament most Geneva Bibles carry. In 1599 Franciscus Junius's notes on Revelation were added. “1599” therefore names a configuration — Tomson's New Testament plus Junius on Revelation — more precisely than it names a year of printing, and Bibles bearing that date went on being printed after it. That is why the catalogue card leaves the year blank while the rung chip, which needs something short to show, reads GNV 1599.
hero.4=Its position in this collection is a hinge. The longest lineage chain here runs World English Bible to American Standard Version to Revised Version to King James Version, and then to this: open one more rung beneath a King James verse and the Geneva wording appears underneath it, which is the plainest way to see how much of the King James is inherited rather than composed. Beneath the Geneva there is nothing further in English — only the Greek and the Hebrew, the Textus Receptus and the Westminster Leningrad Codex, where the ladder reaches its floor. The text is given as the edition has it, spelling and all, so Genesis 1:1 says heauen; Psalm superscriptions and the colophon to Hebrews run inline at the start of the first verse, as those printings set them, and have been left there rather than tidied out.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Language
fact.1.value=English — Elizabethan, in its original spelling
fact.2.label=Made by
fact.2.value=English Protestants who had fled Mary I's reign and settled in Geneva — William Whittingham did the New Testament of 1557, and a team under Anthony Gilby the Old
fact.3.label=First complete edition
fact.3.value=1560, printed at Geneva by Rowland Hall
fact.4.label=Old Testament from
fact.4.value=The Masoretic Hebrew — [[WLC|the Westminster Leningrad Codex]] is this corpus's witness to that text
fact.5.label=New Testament from
fact.5.value=The Greek of the [[TR|Textus Receptus]] line; from 1576 Laurence Tomson's revision, made against Beza's Greek edition of 1565, displaced Whittingham's New Testament in most printings
fact.6.label=What “1599” names
fact.6.value=Printings carrying Tomson's New Testament together with Franciscus Junius's notes on Revelation, which entered the Geneva Bible that year
fact.7.label=Firsts
fact.7.value=The first English Bible with numbered verses throughout, set in Roman type rather than blackletter, and carrying a full apparatus of marginal notes — a study Bible before the term existed
fact.8.label=Objected to by
fact.8.value=James I, who thought the marginal notes seditious — a complaint that helped set [[KJV|the King James Version]] in motion
fact.9.label=Year in the catalogue
fact.9.value=Blank on the About card, though the rung chip reads GNV 1599 — the Geneva Bible was reprinted from 1560 into the 1640s with its New Testament and its notes changing under the one name
fact.10.label=In this corpus
fact.10.value=All 66 books, no Apocrypha, spelling unmodernised — Genesis 1:1 reads “the heauen and the earth”
fact.11.label=Under a rung
fact.11.value=[[TR|Textus Receptus]] and [[WLC|Westminster Leningrad Codex]]; the Geneva is itself the first rung beneath [[KJV|the King James Version]]
