title=Diodati 1649 (italienska) — Om denna utgåva | Common Root
description=Giovanni Diodatis italienska bibel: tryckt i Genève 1607, den första gjord ur hebreiskan och grekiskan i stället för ur Vulgatan, reviderad med hans egna noter 1641 — och varför årtalet på filen är hans dödsår.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati föddes i Genève 1576 i en köpmanssläkt från Lucca som lämnat Italien hellre än gett upp sin tro. Han var italienare till börden och genevare till skolningen, och just den kombinationen är hela skälet till att denna bok finns: han hade språket i det land som reformationen inte nått, och han stod i den stad som blivit reformationens tryckeri. Theodor Beza förde fram honom till lärostolen i hebreiska vid tjugoett års ålder. Han blev professor i teologi 1606, pastor 1608 och efterträdde Beza på den teologiska lärostolen året därpå; 1618 for han till synoden i Dordrecht som Genèves ombud och var en av sex män som utsågs att föra dess protokoll.
hero.2=Hans italienska bibel trycktes i Genève 1607. Italien hade haft biblar på folkspråket förut — Malermis 1471, Bruciolis 1532 — men de arbetade ur latinet eller lutade sig tungt mot det. Diodati gick till hebreiskan och grekiskan, och för Nya testamentet innebar det den grekiska text Beza hade utgett i samma stad en generation tidigare. År 1641 gav han ut en reviderad upplaga med egna förklarande noter, och det är den versionen eftertrycken härstammar ur. Den blev, och har förblivit, den italienska protestantiska bibeln — vilket i ett land med nästan ingen protestantisk läsekrets betydde att den i fyra sekler burits av mycket få människor. Han översatte bibeln till franska också, 1644; den räknas allmänt som den svagare, och han hade förmodligen inte invänt.
hero.3=Årtalet på katalogkortet förtjänar en mening, för det finns inget. Texten cirkulerar digitalt under namnet ”Diodati 1649”, och 1649 är ingen utgåva — det är året Diodati dog. De två årtal som betyder något är 1607, då översättningen först kom ut, och 1641, då han reviderade den. Vilket av dem en given digital fil faktiskt återger har detta projekt inte fastställt, så katalogen lämnar årskolumnen tom hellre än trycker en siffra den inte kan stå för. Namnet behålls som det kom, eftersom det är det folk söker på.
hero.4=I denna läsare är den den enda italienska bibeln, så att ställa gränssnittet på italienska öppnar den — inte som ett kurerat val, så som Reina-Valera 1909 är vald för spanskan, utan för att katalogsökningen inte finner något annat på språket. I härstamningens stegpinnar har den ingen registrerad förlaga, så en stegpinne under en vers faller rakt ned till det ≈-markerade originalspråksgolvet. Det golvet levererar Textus Receptus för grekiskan, och här ligger det ovanligt nära sanningen: för de flesta utgåvor i detta korpus står Receptus i stället för en kritisk text översättarna faktiskt använde, men Diodati arbetade verkligen ur en tryckt grekisk text av den familjen. Dess stegpinne bär inget år, vilket svarar mot det tomma fältet på kortet.

