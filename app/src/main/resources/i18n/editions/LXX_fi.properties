title=Brentonin kreikkalainen Septuaginta — Tietoja tästä laitoksesta | Common Root
description=Septuaginta, juutalaisen diasporan ja varhaisen kirkon kreikkalainen Vanha testamentti, siinä kreikankielisessä tekstissä, jonka Lancelot Brenton painoi englanninnoksensa rinnalle 1851 — ja tässä lukuohjelmassa askelma Vulgatan ja venäläisen Synodaalikäännöksen alla.
heroHeading=Brentonin kreikkalainen Septuaginta
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=Septuaginta on heprealaisen Raamatun vanhin käännös, ja ensimmäisinä kristillisinä vuosisatoina se yksinkertaisesti oli Raamattu. Kreikkaa puhuneet juutalaiset Aleksandriassa aloittivat sen Lain viidestä kirjasta todennäköisesti 200-luvulla eaa., ja muut kirjat seurasivat kahden seuraavan vuosisadan aikana. Nimi tulee kertomuksesta: Aristeaan kirje kertoo seitsemästäkymmenestäkahdesta vanhimmasta, jotka lähetettiin Jerusalemista kääntämään Laki kuningas Ptolemaios II:lle, ja ”Seitsemänkymmentä” — roomalaisin numeroin LXX — tuli koko kreikkalaisen Vanhan testamentin nimeksi. Uuden testamentin kirjoittajat lainaavat sitä jatkuvasti, varhainen kirkko luki sitä, ja ortodoksiset kirkot lukevat sitä yhä Vanhana testamenttinaan.
hero.2=Sen merkitys ei rajoitu ikään. Kääntäjät työskentelivät hepreankielisistä käsikirjoituksista, jotka poikkesivat paikoin myöhemmin vakiintuneesta masoreettisesta tekstistä — Jeremian kirja esimerkiksi on kreikaksi selvästi lyhyempi — joten monin kohdin Septuaginta on vanhin todiste sellaisesta heprealaisesta luennasta, jota heprealainen perinne itse ei säilyttänyt. Siinä on myös kirjoja, joita heprealaisessa kaanonissa ei ole, muiden muassa Tobit, Judit, Viisauden kirja, Siirakin kirja ja Baruk. Ja jotkin sen sanavalinnat muuttuivat opiksi: Jesajan 7:14 kohdalla, jossa heprean sana ʿalmah tarkoittaa nuorta naista, kreikassa on parthenos, neitsyt — sana, jota Matteus lainaa.
hero.3=Tämä kreikankielinen teksti on se, jonka Sir Lancelot Brenton painoi. Hän julkaisi Septuagintan englanninkielisen käännöksen vuonna 1844, pääasiassa Codex Vaticanuksen pohjalta — se on Vatikaanin kirjastossa säilytettävä 300-luvun käsikirjoitus; vuonna 1851 lontoolainen Samuel Bagster julkaisi sen uudelleen, apokryfikirjat lisättyinä ja kreikka englannin rinnalle asetettuna, ja juuri tuo kreikka on tässä aineistossa. Sen psalmit noudattavat kreikkalaista numerointia, joka on myös täällä olevalla Vulgatalla: kummassakin psalmi 22 on paimenpsalmi, heprealaisessa tekstissä ja useimmissa englanninkielisissä Raamatuissa psalmi 23. Psalmeja on 151; Esra ja Nehemia ovat yhtenä kirjana; Ester ja Daniel ovat pidemmissä kreikkalaisissa muodoissaan.
hero.4=Tässä lukuohjelmassa se on askelma, ei pohja. Se on latinalaisen Vulgatan alla, koska osa Vulgatasta tuli kreikan kautta: sen psalttari on se, jonka Hieronymus teki Origeneen Hexaplan kreikasta ja jota hänen oma heprean pohjalta tekemänsä käännöksensä ei koskaan syrjäyttänyt, ja Viisauden kirja, Siirakin kirja ja Baruk jätettiin kreikasta tehtyihin vanhalatinalaisiin käännöksiin. Se on venäläisen Synodaalikäännöksen alla, jonka Vanha testamentti säilytti monia Septuagintan luentoja taustallaan olleesta kirkkoslaavilaisesta Raamatusta, sekä Brentonin oman englanninnoksen alla. Omaa kirjattua edeltäjää sillä ei ole: heprealainen teksti, josta se käännettiin, ei ole aineistossa, ja Leningradin koodeksi, yli tuhat vuotta nuorempi ja masoreettista perinnettä, näkyy sen alla vain alkukielisenä pohjana. Se on pelkkä Vanha testamentti, joten Uuden testamentin jakeen kohdalla askelma ohitetaan — eikä kaikkia kreikkalaisen perinteen kirjoja ole mukana: tässä kappaleessa on 45 kirjaa, eikä yhtään Makkabealaiskirjaa.

