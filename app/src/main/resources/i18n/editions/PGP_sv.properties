title=Den kostbara pärlan — Om denna utgåva | Common Root
description=Den kostbara pärlan: ett urval av Joseph Smiths uppenbarelser, översättningar och berättelser, först sammanställt 1851 som en missionsbroschyr i Liverpool, England, och antaget som skrift av sistadagarsheliga 1880.
heroHeading=Den kostbara pärlan
readerHref=/reader?c1.src=pgp

hero.1=Den kostbara pärlan började som en missionsbroschyr, inte som en helig skrift. År 1851 sammanställde Franklin D. Richards, då president för kyrkans europeiska mission, den i Liverpool, England, och samlade skrifter av Joseph Smith som hade tryckts i kyrkans tidiga tidningar eller bara spridits i små upplagor, så att medlemmarna i Storbritannien kunde ha dem samlade på ett ställe. Titeln kommer från liknelsen i Matteus 13:45–46 om köpmannen som säljer allt han äger för att köpa en enda kostbar pärla.
hero.2=En andra utgåva, redigerad och omordnad av Orson Pratt, gavs ut i Salt Lake City 1878, och den 10 oktober 1880 antog en generalkonferens i kyrkan den genom omröstning som skrift. En revision från 1902, huvudsakligen utarbetad av James E. Talmage, delade in texten i kapitel och verser och tog bort de uppenbarelser som den delade med Läran och förbunden; en utgåva från 1921 sattes i dubbla spalter. År 1976 lades ytterligare två uppenbarelser till — en syn av det celestiala riket och Joseph F. Smiths syn av de dödas återlösning — och 1979 flyttade kyrkan dem till Läran och förbunden, vars utgåva från 1981 trycker dem som avsnitt 137 och 138.
hero.3=Den nuvarande utgåvan har fem delar. Urval ur Moses bok och Joseph Smith – Matteus är utdrag ur Joseph Smiths revidering av King James-bibeln, påbörjad 1830: det första en utvidgad skildring av Första Moseboks inledande kapitel, inramad av syner som gavs åt Mose; det andra en omarbetning av Matteus 23:39 och kapitel 24. Abrahams bok är den text som Smith sade sig ha översatt från egyptiska papyrusrullar som förvärvades i Kirtland, Ohio, 1835; den publicerades 1842 i Times and Seasons i Nauvoo, Illinois, tillsammans med tre illustrationer som i dag kallas faksimil 1, 2 och 3. Joseph Smith – Historia är hämtad ur den skildring av hans tidiga liv och syner som han utarbetade 1838, och Trosartiklarna är tretton trosutsagor ur ett brev från 1842 till tidningsredaktören John Wentworth i Chicago.
hero.4=Abrahams bok är den del som oftast ifrågasatts. Större delen av papyrusrullarna ansågs länge förstörd, troligen i branden i Chicago 1871, men tio fragment som en gång hade tillhört Joseph Smith dök upp vid Metropolitan Museum of Art i New York, som överlämnade dem till kyrkan 1967. Forskare identifierar fragmenten som delar av vanliga egyptiska begravningstexter, skrivna mellan tredje århundradet f.Kr. och första århundradet e.Kr., och kyrkans egen publicerade essä om boken medger att inget av tecknen på dem nämner Abrahams namn eller någon händelse som boken återger.
hero.5=Tillsammans med Bibeln, Mormons bok och Läran och förbunden är den ett av de fyra standardverken i Jesu Kristi Kyrka av Sista Dagars Heliga; Community of Christ, den andra stora kyrkan som härstammar från Joseph Smiths rörelse, räknar den inte till sina skrifter. Texten i detta korpus kommer från Mormon Documentation Projects fria JSON-export, samma källa som Mormons bok och Läran och förbunden här, och behåller de fem delarna som fem böcker: Moses med åtta kapitel, Abraham med fem och de tre sista med ett vardera. De tre faksimilen och de förklaringar som trycks med dem är inte verstext och ingår därför inte. Liksom sina två följeslagare återger den dagens standardutgåvas ordalydelse snarare än någon enskild historisk tryckning, därför anges inget utgivningsår här.

