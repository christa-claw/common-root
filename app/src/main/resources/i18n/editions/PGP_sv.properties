fact.2.label=Utförd av
fact.2.value=Joseph Smith d.y. (1805–1844): uppenbarelser, hans revidering av King James-bibeln, en översättning som han sade sig ha gjort från egyptiska papyrusrullar, hans egen historia och en trosbekännelse; först samlad i en volym av Franklin D. Richards
fact.3.label=Utgiven
fact.3.value=1851, Liverpool, England, som missionsbroschyr sammanställd av Franklin D. Richards; andra utgåvan 1878, Salt Lake City, redigerad av Orson Pratt; antagen som skrift av en generalkonferens den 10 oktober 1880
fact.4.label=Struktur
fact.4.value=Fem delar — Urval ur Moses bok, Abrahams bok, Joseph Smith – Matteus, Joseph Smith – Historia och Trosartiklarna — indelade i kapitel och verser sedan revisionen 1902; i vårt korpus är varje del en egen bok
fact.5.label=Ställning
fact.5.value=Ett av de fyra standardverken i Jesu Kristi Kyrka av Sista Dagars Heliga, vid sidan av Bibeln, [[BOM|Mormons bok]] och [[DC|Läran och förbunden]]; Community of Christ räknar den inte som skrift
fact.6.label=I detta korpus
fact.6.value=Texten följer dagens standardordalydelse, hämtad från Mormon Documentation Projects fria JSON-export — samma källa som för [[BOM|Mormons bok]] och [[DC|Läran och förbunden]]; utdragen ur Moses och Matteus bearbetar texten i [[KJV|King James Version]], som också finns i korpuset; faksimilen och deras förklaringar är utelämnade, och inget enskilt tryckår anges här
fact.7.label=Licens
fact.7.value=Fri från upphovsrätt, enligt dataansvariges egen uppgift; det moderna upphovsrättsskyddade studiematerialet ingår inte
