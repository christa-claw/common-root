title=Lehre und Bündnisse — Über diese Ausgabe | Common Root
description=Lehre und Bündnisse: Offenbarungen und andere Erklärungen, die Joseph Smith aufzeichnete, erstmals 1835 in Kirtland, Ohio, veröffentlicht und von Heiligen der Letzten Tage neben der Bibel als Schrift gelesen.
heroHeading=Lehre und Bündnisse
readerHref=/reader?c1.src=dc

hero.1=Lehre und Bündnisse sammelt Offenbarungen, Visionen und andere Erklärungen, die Joseph Smith jr. nach eigener Aussage als unmittelbare Mitteilungen Gottes empfangen hatte, aufgezeichnet vor allem während der frühesten Jahre der Kirche in Ohio, Missouri und New York. Eine frühere Zusammenstellung mit dem Titel „Book of Commandments for the Government of the Church of Christ" wurde in der Druckerei der Kirche in Independence, Missouri, gedruckt, als ein Mob die Druckerei im Juli 1833 zerstörte und die unvollständigen Bogen zerstreute, bevor das Buch fertiggestellt werden konnte; es wurde nie offiziell herausgegeben, auch wenn eine kleine Zahl der damals geretteten, ungebundenen Bogen erhalten blieb.
hero.2=Eine erweiterte, umbenannte Fassung, „Doctrine and Covenants of the Church of the Latter Day Saints", folgte 1835, veröffentlicht in Kirtland, Ohio, zusammengestellt und gebilligt von einem vierköpfigen Komitee: Joseph Smith, Oliver Cowdery, Sidney Rigdon und Frederick G. Williams. Diese erste Ausgabe vereinte zwei Arten von Material unter einem Einband — eine Reihe theologischer Vorträge, die an der Kirtland School gehalten wurden und als ihre „Lehre" präsentiert wurden, neben den aufgezeichneten Offenbarungen selbst, präsentiert als ihre „Bündnisse". Diese Vorträge, seither als Lectures on Faith bekannt, wurden später aus dem Buch entfernt — meist auf die Ausgabe von 1921 datiert —, sodass die Offenbarungen das gesamte Werk bildeten.
hero.3=Das Buch ist in nummerierte Abschnitte gegliedert statt in die Bücher, Kapitel und Verse einer Bibel — was dem entspricht, was es ist: eine zusammengetragene Sammlung einzelner Texte statt einer einzigen durchgehenden Erzählung. Sowohl der Inhalt als auch die Nummerierung änderten sich über die Ausgaben des 19. Jahrhunderts hinweg, darunter eine Ausgabe von 1876 unter Orson Pratt, die früheres Material neu ordnete und weitere Offenbarungen hinzufügte. Die moderne Ausgabe erhielt ihre heutige Gestalt 1981, als zwei weitere Stücke — eine Vision der Herrlichkeitsgrade und eine Vision von der Erlösung der Toten — als Abschnitte 137 und 138 hinzugefügt wurden, zusammen mit zwei „Offiziellen Erklärungen": einem Manifest von 1890, das die Billigung neuer Mehrehen durch die Kirche beendete, und einer Erklärung von 1978, die die Priestertumsordinierung auf alle würdigen männlichen Mitglieder unabhängig von ihrer Hautfarbe ausweitete. Ein Druck von 2013 aktualisierte weiteres Nachschlagematerial. Die heute gebräuchliche Standardausgabe umfasst 138 Abschnitte und die beiden Offiziellen Erklärungen.
hero.4=Es gilt als eines der vier Werke, die die Bewegung der Heiligen der Letzten Tage ihre Standardwerke nennt, neben der Bibel, dem [[BOM|Buch Mormon]] und der [[PGP|Köstlichen Perle]]. Die Community of Christ, eine eigenständige Konfession, die aus derselben Bewegung hervorging, führt ihre eigene Lehre und Bündnisse, unabhängig von dieser nummeriert und aktualisiert. Der Text in diesem Korpus stammt aus dem JSON-Export des Mormon Documentation Project, derselben gemeinfreien Quelle, die auch für das [[BOM|Buch Mormon]] und die [[PGP|Köstliche Perle]] verwendet wird, und wird hier als ein einziges Buch, „Lehre und Bündnisse", wiedergegeben, in dem jeder Abschnitt als Kapitel steht; er folgt dem Wortlaut der aktuellen Standardausgabe und lässt die urheberrechtlich geschützten Fußnoten und Kapitelüberschriften aus, weshalb hier kein einzelnes Erscheinungsjahr angegeben wird.

