fact.12.value=Högst upp på den tyska stegen: en upptecknad föregångare, [[LUT1545|Luther Bibel 1545]], och under den grundspråkens golv. Dess 85 revisorsnoter bärs här som kommentarer i stället för att kastas, och de är utgåvebundna — en glosa från 1912 visas under en kolumn från 1912 och ingen annanstans. Den är inte vad ett tyskt gränssnitt går upp på; det är [[ELB|Elberfelder]], först i katalogen efter sin förkortning och av inget annat skäl
