title=Luther Bibel 1912 — Om denna utgåva | Common Root
description=Den andra kyrkliga revisionen av Luthers bibel: en avsiktligt varsam genomgång, avslutad 1910, antagen 1912, och den sista Luthertexten som vilar på Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=En revision av en revision. De tyska kyrkorna hade 1892 enats om en enda text av Luthers bibel, den första kyrkliga revisionen, och inom några år kallades den otillräcklig. Invändningarna var de gamla: för många arkaismer och en stavning som inte längre var någons. Den andra punkten fällde avgörandet. Duden hade gett det tyska kejsarriket en bindande rättstavning som lärdes ut i skolorna, och en Lutherbibel som avvek från den var besvärlig att lägga fram inför en klass. År 1906 samtyckte den tyska evangeliska kyrkokonferensen till ännu en revision och föreskrev uttryckligen att den skulle vara skonsam och bevarande. En kommission av teologer gick igenom varje biblisk bok till 1910, och 1912 antog konferensen resultatet.
hero.2=Arbetet tog knappt mer än två år, vilket säger vilken sorts revision det var. Ingen försökte göra en ny Lutherbibel, varken filologiskt eller annars. En senare revisor, Fritz Tschirch, avfärdade den som en skolmästaraktig revision, och om metoden har ordet inte fel — stavningen lagd till rätta, de uppenbart döda orden utbytta, ordalydelsen i övrigt lämnad där Luther hade den. Vad ordet missar är hur väl den höll. Genom de decennier av delrevisioner som följde stod 1912 års text kvar, och den läses och säljs än. En del av det är 1912 års Jubiläumsbibel, det württembergska bibelinstitutets hundraårsutgåva med förklarande noter, omtryckt i fraktur långt in i detta sekel. En del är att upphovsrätten har löpt ut, så texten kostar ingenting att återge och dyker upp överallt — också här.
hero.3=En sak framför andra håller den i bruk bland konservativa läsare: den är den sista Lutherrevisionen byggd på Textus Receptus, det grekiska Nya testamentet från 1500- och 1600-talen. Allt därefter gick över till den kritiska texten. Det gör denna utgåva till en ovanligt ren stegpinne att stå på i en stege, eftersom grekiskan under den är samma grekiska som ligger under Luthers egen utgåva från 1545 och under Genèvebibeln och under King James — hela tornet delar ett golv i stället för att byta ut det halvvägs upp.
hero.4=I släktledets stegpinnar står denna utgåva omedelbart ovanför Luther Bibel 1545 och har exakt en upptecknad föregångare, nämligen den. Öppna en stegpinne under en vers från 1912 och Luthers egen lydelse från 1545 träder fram under den; öppna en till och stegen når Textus Receptus för grekiskan och Westminster Leningrad Codex för hebreiskan. Trehundrasextiosju års revision, vers för vers, i två klick. Vad denna utgåva inte är: den bibel ett tyskt gränssnitt går upp på — för tyskan finns ingen vald förvalsutgåva, så läsaren får den första tyska bibeln i katalogen, och det är Elberfelder.

