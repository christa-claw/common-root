title=Kirkkoraamattu 1933/38 — על מהדורה זו | Common Root
description=ביבליית הכנסייה הפינית Kirkkoraamattu 1933/38: תורגמה מחדש מן העברית ומן היוונית ואומצה בשתי מחציות, בשנת 1933 ובשנת 1938, לאחר שוועדה עמלה עליה כשבעים שנה.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=השם הוא שני תאריכים, משום שהספר הגיע בשתי מחציות. הכנסייה האוונגלית הלותרנית של פינלנד קיבלה את הברית הישנה בשנת 1933 ואת הברית החדשה בשנת 1938, ומאז קוראים לה בפינית ביבליית הכנסייה של 1933/38. שני התאריכים שבסוף מסתירים כמה רחוקה הייתה ההתחלה: ועדת התרגום מונתה כבר בשנת 1861. כשבעים שנה, ויותר מדור אחד של מתרגמים, מפרידים בין ההזמנה ובין הביבליה המוגמרת.
hero.2=מה שהוועדה הוציאה תחת ידה היה תרגום חדש ולא תיקון. היא עבדה מן העברית של הברית הישנה ומן היוונית של החדשה — לא דרך מתווכים לטיניים, גרמניים או שוודיים, ולא מתוך הביבליה הפינית שכבר הייתה בשימוש. ואף על פי כן הייתה במודע יורשתה של אותה ביבליה, Biblia 1776, שהייתה נוסח הכנסייה מאה וחמישים שנה, והיא שמרה הרבה מאוצר המילים ומן המקצב של הספר הישן. ירושה זו היא הסיבה לכך שביבליה שהושלמה בשנת 1938 נשמעה כבר ארכאית לקוראיה הראשונים, ולכך שהיא נושאת עד היום את המשלב החגיגי של הכתובים בפינית. היא נשארה ביבליית הכנסייה הרשמית עד שנת 1992.
hero.3=בקורא הזה היא ממלאת שני תפקידים. הגדירו את הממשק לפינית וזו המהדורה שנפתחת — סדר הקטלוג עצמו היה נותן לכם את Biblia 1776, ולכן ברירת המחדל הפינית היא בחירה מכוונת ולא מקרה של סדר האלף־בית. היא גם השלב העליון בשרשרת השושלת הפינית: פִּתחו שלב מתחת לפסוק מ־KR3338 ותופיע מתחתיו Biblia 1776. קִראו את השלב הזה כרצף ירושה בתוך הביבליה של כנסייה אחת ולא כמקור, שכן לפני מתרגמי 1933/38 עמדו העברית והיוונית ולא נוסח 1776. מתחת ל־Biblia 1776 השרשרת נמשכת: מהדורת Biblia משנת 1642, שמהדורת 1776 מתקנת, ואחריה הפינית של אגריקולה משנת 1548, שאותה ועדה תיקנה בתורה, והגרמנית של לותר משנת 1545, פתוחה לצדם בשעת עבודתם. רק מתחת לאלה מגיע הסולם אל העברית ואל היוונית.

