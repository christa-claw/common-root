title=Revised Version — عن هذه الطبعة | Common Root
description=الترجمة الإنجليزية المنقَّحة: التنقيح الوحيد لِـ King James Version الذي أذنت به كنيسة إنجلترا يوماً، وقد صدر على ثلاث دفعات بين 1881 و1894 — وهو هنا الدرجة بين King James Version وAmerican Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=الترجمة المنقَّحة هي التنقيح الوحيد لِـ King James Version الذي كلَّفت به كنيسة إنجلترا فعلاً. قرَّره مجمع كانتربري سنة 1870 وعيَّن لجنتين، واحدة لكلِّ عهد، ضمَّتا أكثر من خمسين عالماً بريطانياً من طوائف عدَّة — لا من الأنجليكان وحدهم، وكان ذلك في نفسه جديداً وموضع جدال. ودُعي علماء أمريكيون إلى المشاركة بالمراسلة، فشاركوا. وكانت التعليمات محافظة: لا تُغيَّر Authorised Version إلا حيث تقتضي ذلك لغات الأصل منقولةً نقلاً أميناً. صدر العهد الجديد سنة 1881، والعهد القديم سنة 1885، وصدرت الأبوكريفا، وهي آخر ما عُمل عليه، سنة 1894.
hero.2=لم تمنع التعليمات المحافظة لجنة العهد الجديد من اتخاذ أبعد قرارات الكتاب أثراً. فهم لم يعملوا على Textus Receptus. كان ويستكوت وهورت عضوين في تلك اللجنة، وظلَّا يعرضان عليها نصَّهما اليوناني في تجارب الطبع كلَّما تقدَّم العمل؛ والذي استقرَّ عليه المنقِّحون كان نصَّهم الانتقائي هم، لا نصَّ ويستكوت وهورت بعينه، لكنه انتقل انتقالاً حاسماً نحو المخطوطات الأنشيالية الأقدم. ضع هذه الطبعة إلى جانب King James Version في عمودين، ويظهر الانتقال للتوِّ. ففي رسالة يوحنا الأولى 5:7 يقرأ عمود King James ”For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one“، ويقرأ هذا العمود ”And it is the Spirit that beareth witness, because the Spirit is the truth“.
hero.3=أما ما لم يغيِّره المنقِّحون البريطانيون فهو بعينه ما كان الأمريكيون أشدَّ رغبةً في تغييره. ففي المزمور 23:1 لا تزال هذه الطبعة تطبع ”The LORD is my shepherd“، تماماً كما تفعل King James Version؛ بينما تطبع American Standard Version التي فوقها ”Jehovah is my shepherd“. ولا يرد الاسم هنا إلا حيث طبعته King James Version نفسها — ففي خروج 6:3 تقرآن معاً ”by my name JEHOVAH“ — وكان حملُه عبر العهد القديم كلِّه تفضيلاً أمريكياً أُحيل إلى الملحق بموجب اتفاق الأربعة عشر عاماً، ولم يُطلق في المتن إلا سنة 1901. وقراءة العمودين معاً هي أقصر الطرق إلى رؤية ما حجزه ذلك الاتفاق فعلاً. ويظهر فرق ثانٍ في هيئة الجمل لا في ألفاظها: فقد قطع المنقِّحون مع صفِّ آيةٍ في كلِّ سطر وصفُّوا النثر فقرات، وأثر ذلك باقٍ هنا في آياتٍ تبدأ بحرفٍ صغير لأنها تواصل جملة — ”and I appeared unto Abraham“ في خروج 6:3، حيث يبدأ عمود King James بـ ”And I appeared“.
hero.4=تترك بطاقة هذه الطبعة السنة فارغة، وذلك هو الجواب الأمين لا ثغرة. فالترجمة المنقَّحة لم تُنشر مرَّة واحدة بل ثلاثاً، والنصُّ هنا هو نصُّ الثمانين سِفراً: ستَّة وستُّون سِفراً تُضاف إليها أربعة عشر سِفراً من الأبوكريفا، و36,873 آية في الجملة، ما يعني أنه يحمل مادَّة لم تكن موجودة مطبوعة قبل 1894. وقيد المجموعة يختمه بسنة 1885، وهي السنة التي أكمل فيها العهد القديم الكتاب المقدَّس بمعناه الخاصِّ، وهي السنة التي تعرضها شارة درجة النسب. أما من أيِّ طبعةٍ ينحدر النصُّ فغير مقيَّد — وهي الثغرة نفسها التي تتركها المجموعة مفتوحة عند King James Version وعند Biblia الفنلندية لسنة 1776. ويلاحظ أيضاً أن لا واجهة تُفتح على هذه الطبعة؛ فالواجهة الإنجليزية تُفتح على New International Version، وإلى هذه ينتقل المرء.

