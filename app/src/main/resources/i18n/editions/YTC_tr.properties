title=Yorumsuz Türkçe Çeviri — Bu Baskı Hakkında | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): İsmail Serinken'in eBible.org ile birlikte World English Bible'dan çevirdiği modern bir Türkçe Kutsal Kitap, CC BY-ND 4.0 ile lisanslı — bu derlemenin varsayılan olarak açıldığı Türkçe metin.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — harfiyen "yorumsuz" ya da "açıklamasız" bir Türkçe çeviri — İsmail Serinken'in eBible.org ile birlikte tamamladığı, telif hakkı 2023'ten 2025'e tarihlenen modern bir Türkçe Kutsal Kitaptır. Adın kendisi yöntemi ilan eder: açıklayıcı dipnotları ve yorumlayıcı serbest anlatımı bilerek dışarıda bırakan, pürüzsüzleştirilmiş bir ifadeye kıyasla temel metne karşı şeffaflığı tercih eden, yalın, kelime kelime bir aktarım.
hero.2=Bu temel metin, dürüstçe söylemek gerekirse, İbranice, Aramice veya Yunanca değil, İngilizcedir: çevirinin kendi telif hakkı sayfası onu World English Bible'dan aktarılmış olarak tanımlar; bu da onu özgün dillerden doğrudan yapılmış bir çeviri değil, ikincil bir çeviri yapar — bu derlemedeki diğer Kutsal Kitapların çoğunun aksine. Common Root önce, artık Türkiye'de kamu malı olacak kadar eski olan 1941 tarihli tarihsel Türkçe Kutsal Kitabın (Kitabı Mukaddes) açık bir baskısını aradı, ancak onun için kullanılabilir bir dijital kaynak bulunamadı; Yorumsuz Türkçe Çeviri, bulunabilen tek özgürce lisanslı Türkçe Kutsal Kitaptı. Bu derlemenin metni, eBible.org'un USFM dağıtımından gelir, orada turytc olarak katalogludur.
hero.3=Aktarım seçimleri geleneksel değil, çağdaş bir nitelik taşır: Tanrı'nın özel adını, alışılmış Türkçe "RAB" veya "Yehova" yerine, Çıkış 3:14-15'e atıfla Yahve olarak verir, ve İsa'nın adını, tanıdık Türkçe İsa yerine Yeşua olarak verir; diğer özel adları ise olağan biçimlerinde bırakır. Standart 66 kitaplık Protestan kanonunu izler, deuterokanonik kitap içermez.
hero.4=Bu derlemedeki tek Türkçe Kutsal Kitaptır, bu nedenle bir Türkçe arayüz varsayılan olarak onun üzerinde açılır.

