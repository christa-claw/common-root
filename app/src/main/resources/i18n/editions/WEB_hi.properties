title=World English Bible — इस संस्करण के बारे में | Common Root
description=World English Bible: 1901 के American Standard Version का आधुनिक अंग्रेज़ी संशोधन, जिसे 1994 में Michael Paul Johnson ने आरम्भ किया, जिसका नया नियम यूनानी बहुमत-पाठ के अनुरूप किया गया, और जिसे जान-बूझकर सार्वजनिक अधिकार-क्षेत्र में रखा गया।
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=World English Bible एक कॉपीराइट समस्या के कारण है। 1994 में Michael Paul Johnson ने, जो पूर्णकालिक नौकरी से बचे घंटों में बाइबिल का अनुवाद करने वाले एक अभियंता थे, हिसाब लगाया कि ऐसी आधुनिक अंग्रेज़ी बाइबिल पूरी करने में उन्हें कितना समय लगेगा जिसे कोई भी स्वतंत्र रूप से प्रतिलिपि कर सके — और उत्तर उन्हें अच्छा नहीं लगा। उन्होंने शून्य से अनुवाद करना छोड़ दिया और 1901 के American Standard Version से फिर आरम्भ किया: सटीक, सम्मानित, और किंग जेम्स संस्करण के विपरीत (जो इंग्लैंड और वेल्स में आज भी राजमुकुट के अधिकार-पत्र से भारित है) पूर्णतः कॉपीराइट-मुक्त। उनके अपने लिखे एक प्रोग्राम ने ASV का पाठ छानकर वे शब्द खोजे जिन्हें कोई आधुनिक बाइबिल नहीं बरतती, प्रतिस्थापन सुझाए, और लगभग पंद्रह मिनट में बदल डाले। जो प्रोग्राम न कर सका — शब्द-क्रम, विराम-चिह्न, उद्धरण-चिह्न — वह आगे के वर्षों में हाथ से हुआ, और पाठ 1997 से आगे संशोधनों में छपता और फिर-फिर छपता रहा।
hero.2=दो बातें इसे उस संस्करण से अलग करती हैं जिसका यह संशोधन है। पहली है यूनानी। ASV का नया नियम संशोधकों के समीक्षात्मक पाठ का अनुसरण करता था, जो आगे चलकर नेस्ले-आलंड संस्करण बना उसके निकट; World English Bible को इसके बजाय बैज़ेंटाइन बहुमत-पाठ के अनुरूप किया गया, अतः यह न अपने मूल का पाठ है और न वह Textus Receptus जिसे किंग जेम्स के अनुवादकों ने बरता। दूसरी है ईश्वर का नाम। ASV ने “Jehovah” छापा; World English Bible “Yahweh” छापती है, और उत्पत्ति 2:4 पर एक पाद-टिप्पणी उस पाठक को यह चुनाव समझाती है जो “the LORD” की अपेक्षा रखता है। ब्रिटिश संस्करण “LORD” पर लौट जाता है — इस संग्रह की प्रति अमेरिकी है, सो पढ़ने को “Yahweh” ही मिलता है। इन दो निर्णयों से परे यह अपने मूल की ही तरह रूप-समतुल्यता का अनुवाद बनी रहती है: इब्रानी और यूनानी शब्द-क्रम का वही निकट अनुसरण, पर ऐसी वर्तनी और व्याकरण में जिन्हें अब व्याख्या नहीं चाहिए।
hero.3=पाठक में यह एक पत्ती है, और इस संग्रह की सबसे लम्बी शाखा की इकलौती। World English Bible के किसी पद के नीचे एक पायदान खोलिए, तो उसके नीचे American Standard Version प्रकट होती है, और उसके नीचे Revised Version, किंग जेम्स संस्करण और जिनेवा बाइबिल, नीचे उस मूल-भाषा तल तक जो ≈ से चिह्नित है। संग्रह में कुछ भी अपनी बारी में World English Bible पर नहीं टिकता। यह उस शाखा का सबसे चौड़ा पाठ भी है: American Standard Version में अपोक्रिफ़ा नहीं था, अतः World English Bible के अपोक्रिफ़ा अलग से बनाए गए — किंग जेम्स के अपोक्रिफ़ा और ब्रेंटन के अंग्रेज़ी सेप्टुआजिंट से — और हमारी प्रति अस्सी पुस्तकें उठाती है जहाँ उसके नीचे की ASV छियासठ उठाती है; इनमें 3 और 4 मक्काबी तथा भजन 151 हैं, जो किंग जेम्स के अपोक्रिफ़ा में नहीं। बारूक, जो उसमें है, हमारी प्रति में नहीं है। परिचय पृष्ठ इस संस्करण का वर्ष-स्तम्भ खाली छोड़ता है, और ठीक ही: कोई एक प्रकाशन-वर्ष है ही नहीं। संग्रह 2000 अंकित करता है ताकि पायदान-चिप्पियों के पास क्रम लगाने को कुछ हो।

