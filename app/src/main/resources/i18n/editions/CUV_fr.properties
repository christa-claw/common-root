title=Chinese Union Version — À propos de cette édition | Common Root
description=La Chinese Union Version de 1919 : vingt-neuf ans de travail en commission qui ont donné la bible que lisent encore les protestants chinois, et l'un des tout premiers livres publiés en mandarin vernaculaire écrit.
heroHeading=Version chinoise de l'Union
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=En 1890, les missions protestantes travaillant en Chine se réunirent à Shanghai et convinrent d'un problème. Il existait déjà plusieurs bibles chinoises, et il n'y en avait pas deux qui s'accordent : ni sur la formulation, ni sur l'orthographe des noms, ni même sur le registre de chinois où écrire. La conférence décida d'une traduction unique dont toutes les missions se serviraient, et l'appela version de l'union : 和合本, le texte harmonisé. Comme le chinois écrit était alors partagé entre la langue lettrée des instruits et la langue parlée de tous les autres, on en commanda trois à la fois — deux en chinois lettré, une en mandarin.
hero.2=Il fallut vingt-neuf ans à la commission du mandarin. Calvin Wilson Mateer, presbytérien américain installé au Shandong depuis 1863, la présida et mourut en 1908 l'ouvrage inachevé ; le panel qu'il avait réuni à partir d'une demi-douzaine de missions poursuivit, de même que les lettrés chinois qui travaillaient à leurs côtés et dont les archives missionnaires ont gardé les noms avec bien moins de soin. Ils prirent la Revised Version anglaise pour le texte qu'ils rendaient et la vérifièrent sur l'hébreu et le grec qui la portent — ce qui place la Revised Version du corpus lui-même un échelon en amont de cette bible, et la King James Version un échelon au-dessus d'elle. Les deux versions lettrées furent finalement fondues en une seule. C'est la version en mandarin qui a survécu.
hero.3=Elle parut en 1919, et la date fit pour elle plus qu'aucune commission n'aurait pu. C'était l'année du Mouvement du 4 Mai, où les écrivains chinois se mirent pour de bon à quitter la langue lettrée pour la langue vernaculaire, et la version de l'union arriva comme l'un des tout premiers livres d'ampleur déjà écrits ainsi. Une traduction destinée à trancher une querelle entre missionnaires devint un jalon de la prose chinoise moderne, et ses tournures sont citées par des gens qui n'ont jamais ouvert une bible. Elle est imprimée depuis en deux éditions qui diffèrent d'un seul mot — Dieu est-il 神 ou 上帝 —, l'espacement étant ajusté pour que les deux éditions coupent encore les pages au même endroit.
hero.4=Dans ce lecteur, elle est la seule bible chinoise, ce qui règle deux choses de son comportement. Mettez l'interface en chinois et c'est elle qui s'ouvre : non qu'on l'ait choisie, comme la Reina-Valera 1909 a été choisie pour l'espagnol, mais parce que le catalogue ne trouve pas d'autre bible dans la langue. Et dans les échelons de filiation, aucun ascendant n'est enregistré pour elle, de sorte qu'un échelon sous un verset descend droit au sol des langues originales marqué d'un ≈, alors même que la Revised Version dont elle est faite se tient dans le corpus à une colonne de là. Sa pastille d'échelon porte en revanche une année, 1919, ce que ne fait pas toute édition d'ici.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=chinois — mandarin vernaculaire (官話 / baihua), non le chinois lettré
fact.2.label=Nom propre
fact.2.value=和合本 (héhéběn) — la version « harmonisée » ou « unie »
fact.3.label=Commandée par
fact.3.value=la Conférence générale des missionnaires protestants de Shanghai de 1890
fact.4.label=Traduite par
fact.4.value=une commission tirée de plusieurs missions protestantes ; le presbytérien américain Calvin Wilson Mateer (1836-1908) présida le panel du mandarin jusqu'à sa mort, travaillant tout du long avec des collègues chinois
fact.5.label=Parue
fact.5.value=en 1919, après vingt-neuf ans de travail
fact.6.label=Base textuelle
fact.6.value=la Revised Version anglaise comme base de travail, vérifiée sur l'hébreu et le grec — la même [[RV|Revised Version]] que détient ce corpus
fact.7.label=Deux éditions
fact.7.value=l'édition Shen (神版) et l'édition Shangdi (上帝版), qui ne diffèrent que par le mot chinois portant « Dieu »
fact.8.label=Révision ultérieure
fact.8.value=la Revised Chinese Union Version, Nouveau Testament en 2006 et bible complète en 2010 — non ce texte
fact.9.label=Dans ce corpus
fact.9.value=la seule bible chinoise d'ici, si bien qu'une interface en chinois ouvre sur elle par défaut ; aucun ascendant n'est enregistré dans les échelons de filiation, mais sa pastille d'échelon porte bien l'année 1919
