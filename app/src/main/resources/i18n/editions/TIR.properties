title=Jami` at-Tirmidhi — About This Edition | Common Root
description=Jami` at-Tirmidhi: the hadith collection Abu Isa al-Tirmidhi built around openly grading each report's strength and recording the legal arguments jurists drew from it, counted among Sunni Islam's Six Books.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi was born around 209 AH (824 CE) near Termez, in Khurasan on what is now the Uzbekistan–Afghanistan border. He began studying hadith around the age of twenty and travelled from 235 AH through Khurasan, Iraq, and the Hijaz in search of them, studying principally under Muhammad al-Bukhari — his main teacher — as well as under Muslim ibn al-Hajjaj, Abu Dawud al-Sijistani, Qutaybah ibn Sa'id, and Ali ibn Hujr. He went blind in his later years, which is the origin of his epithet "ad-Darir" ("the Blind"). He returned to the Termez area, where he died on 13 Rajab 279 AH (9 October 892 CE) at about seventy.
hero.2=His full title, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, is usually shortened to Jami' at-Tirmidhi or Sunan at-Tirmidhi. Where Sahih al-Bukhari and Sahih Muslim admit only hadith their compilers judged fully authenticated, at-Tirmidhi graded each hadith openly within the text itself — sahih, hasan, da'if, or gharib — and explained the grounds for a weaker grading rather than omitting the hadith; he also set out where the legal schools (madhahib) differed and the evidence each side drew on, making the book as much a guide to hadith-based legal reasoning as a hadith collection in its own right.
hero.3=Sunni tradition counts it among the Six Books (Kutub al-Sittah), generally after Sahih al-Bukhari, Sahih Muslim, and Sunan Abi Dawud; exactly where it ranks among the remaining books — and which collection fills the sixth slot, Sunan Ibn Majah being the common answer but not the only one historically offered — is argued rather than settled, as it is for the other Sunan collections in this corpus. The hadith count given for the book varies for the same reason: about 4,330 by the traditional reckoning, cited elsewhere as roughly 4,400; descriptions of its structure disagree too, speaking variously of 46 books, Ahmad Muhammad Shakir's twentieth-century Cairo edition's 49 chapters, or fifty chapters. This corpus's own count is a further figure again: 49 books and 3,998 numbered hadith, the shape of the digital edition it was drawn from rather than a claim to reproduce any one print numbering.
hero.4=The Arabic text here is the classical matn, in the public domain. Beneath it in the reader sits an English translation, drawn from the fawazahmed0/hadith-api's eng-tirmidhi edition and aligned hadith-for-hadith with the Arabic so the two can be read as a pair — the same companion arrangement this corpus uses for Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud, and its Qur'an translations. Which published English translation that file itself descends from has not been pinned down on this corpus's side, which is why its licence is marked under review rather than public domain outright; the Arabic above it carries no such uncertainty.

