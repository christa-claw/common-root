title=Biblia 1642 — Su questa edizione | Common Root
description=Biblia 1642: la prima Bibbia completa in finlandese, tradotta in tre anni da quattro studiosi a Turku e stampata sotto il patrocinio della regina Cristina di Svezia.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
thanks=Con un ringraziamento a chi ha inviato correzioni a questa pagina.

# The narrative, one paragraph per key, in order.
hero.1=La prima Bibbia completa in finlandese. Prima di essa c'era il Nuovo Testamento di Mikael Agricola del 1548 e parti dell'Antico pubblicate negli anni 1550; dopo di essa c'era una Bibbia intera in una lingua che era stata scritta a stento. Quattro studiosi fecero il lavoro fra il 1638 e il 1641 — Eskil Petraeus, Martinus Stodius, Henricus Hoffman e Gregorius Matthaei — sotto Isaacus Rothovius, vescovo di Turku, che portò a termine il progetto. La Finlandia faceva parte della Svezia, e il volume apparve nel 1642 sotto il patrocinio della regina Cristina. Un tentativo era stato fatto una generazione prima: nel 1602 fu nominata una commissione per la traduzione della Bibbia, probabilmente sotto Ericus Erici Sorolainen, vescovo di Turku. Pare che producesse abbozzi ma non li riunisse mai in una Bibbia, e la loro sorte è in gran parte ignota, benché si ritenga che quel lavoro abbia influito sulla traduzione del 1642.
hero.2=Tradussero dall'ebraico e dal greco con il tedesco di Lutero accanto. La Bibbia svedese di Gustavo Vasa era l'altro libro sul tavolo; non è in questo corpus, così la catena qui registra il Lutero — e, accanto a lui, il finlandese di Agricola del 1548, il testo di base che il comitato rivedeva. L'effetto maggiore della Biblia del 1642 ricadde sul finlandese stesso. Una lingua quasi senza prosa scritta ricevette, in un solo volume, un lessico e una cadenza per tutto, dalla legge al lamento, e ogni Bibbia finlandese successiva ne è una revisione o un'erede e non un nuovo inizio.
hero.3=In questo lettore la 1642 sta fra due pioli finlandesi. Tre pioli sotto la Kirkkoraamattu 1933/38, al di sotto della Biblia 1776, compare questa edizione, e sotto di essa due genitori fianco a fianco — il finlandese di Agricola del 1548, la base che il comitato rivedeva, e il tedesco di Lutero del 1545, aperto sul tavolo. Un piolo più giù la catena ha lasciato il finlandese per sempre. Il testo viene dal corpus VKS del Kotus di antico finlandese letterario, ed è per questo che la grafia che vedete — «tulcon walkeus» — è quella propria della stampa del 1642 e non è modernizzata.

