title=Douay-Rheims 1899 — Su questa edizione | Common Root
description=La Bibbia di Douay-Rheims: la traduzione cattolica inglese fatta dalla Vulgata latina a Reims nel 1582 e a Douai nel 1609-10, riveduta dal vescovo Challoner, nella stampa di Baltimora del 1899.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=Nel 1568 un gruppo di cattolici inglesi, molti dei quali uomini di Oxford che non potevano più conservare i propri incarichi, fondò un collegio a Douai, nelle Fiandre, sotto William Allen. Parte della sua ragion d'essere era mettere una Bibbia inglese in mani cattoliche, perché le uniche Bibbie inglesi allora in circolazione erano protestanti e venivano usate nella polemica. Gregory Martin cominciò a tradurre nell'ottobre del 1578 al ritmo di circa due capitoli al giorno, e il Nuovo Testamento fu pubblicato nel 1582 a Reims, dove il collegio si era temporaneamente trasferito. Martin morì il 28 ottobre di quello stesso anno, poche settimane dopo la comparsa del suo Nuovo Testamento. L'Antico Testamento era pronto nello stesso momento e rimase poi non stampato, per la semplice ragione che il collegio non poteva permettersi di stamparlo; uscì infine in due volumi nel 1609 e nel 1610, quando alla Bibbia di re Giacomo mancavano due anni.
hero.2=Ciò che la distingue da ogni altra Bibbia inglese di questo corpus è ciò da cui fu fatta. Non dall'ebraico e dal greco: dalla Vulgata latina. Il Concilio di Trento aveva dichiarato la Vulgata testo autentico della Chiesa, e i traduttori di Douai aggiungevano che Girolamo aveva lavorato su manoscritti più antichi di qualsiasi copia greca a loro disposizione — il che, per l'Antico Testamento, non era una cosa irragionevole da pensare intorno al 1600. La prosa che ne risultò è pesantemente latineggiante, a volte al punto di non essere affatto inglese: il Padre nostro chiede “supersubstantial bread”, perché i traduttori non volevano naturalizzare una parola su cui poggiava la teologia. Fu una scelta, non un'incapacità.
hero.3=Verso la metà del Settecento quasi nessuno riusciva più a leggerla, e il vescovo Richard Challoner la rivide fra il 1749 e il 1752 — pesantemente, e in larga misura in direzione della Bibbia di re Giacomo, che ormai era semplicemente il suono della Scrittura in inglese. Ogni Bibbia venduta oggi come Douay-Rheims è il testo di Challoner e non quello di Martin. Questa è la stampa americana del 1899, della John Murphy Company di Baltimora, con l'imprimatur del cardinale James Gibbons; poiché quella stampa è da tempo libera da diritti, è quella che da allora è stata scansionata, digitata e riprodotta, ed è ciò che quasi ogni Douay-Rheims digitale in realtà è.
hero.4=In questo lettore essa fa qualcosa che quasi nessun'altra edizione qui presente può fare. Il suo antecedente registrato è presente nel corpus: si apra un piolo di discendenza sotto un versetto della Douay-Rheims e il piolo sottostante è la Vulgata latina stessa, il testo da cui fu effettivamente tradotta, invece del pavimento delle lingue originali contrassegnato con ≈ verso cui la maggior parte delle edizioni precipita. È esattamente il caso per cui il meccanismo dei pioli è stato costruito. L'influsso corse anche nell'altro senso — il Nuovo Testamento di Reims era sui tavoli dei traduttori di re Giacomo, e una buona parte del suo lessico latineggiante passò nella loro opera — ma l'elenco della discendenza registra solo le linee formali di revisione, sicché quel debito lì non è annotato. Un rovesciamento da notare: il suo segno di piolo mostra l'anno 1899 mentre la scheda di catalogo non mostra alcun anno. Gli anni dei pioli sono un elenco curato a mano e la scheda legge i metadati propri del catalogo, e dove un'edizione figura nell'uno e non nell'altro i due si contraddicono in pubblico.
hero.5=Un'avvertenza sul canone. Il testo qui conservato ha 72 libri, non i 73 di una Bibbia cattolica a stampa. I sei libri deuterocanonici che porta — Tobia, Giuditta, 1 e 2 Maccabei, Sapienza e Siracide — stanno dopo l'Apocalisse anziché ai loro posti cattolici, e Baruc manca del tutto. È una proprietà del testo digitale così come è stato acquisito, non del libro del 1899, e significa che questa colonna si leggerà correttamente versetto per versetto ma non dovrebbe essere usata per verificare che cosa contenga il canone cattolico.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=inglese — la tradizione cattolica
fact.2.label=Tradotta da
fact.2.value=la Vulgata latina, non l'ebraico e il greco — la stessa [[VUL|Vulgata]] che questo corpus custodisce
fact.3.label=Nuovo Testamento
fact.3.value=Reims, 1582 — principalmente opera di Gregory Martin, con William Allen, Richard Bristow e Thomas Worthington
fact.4.label=Antico Testamento
fact.4.value=Douai, 1609 e 1610, in due volumi — terminato insieme al Nuovo Testamento ma trattenuto quasi trent'anni per mancanza di denaro con cui stamparlo
fact.5.label=Riveduta da
fact.5.value=il vescovo Richard Challoner, 1749-1752 — ogni libro venduto oggi come Douay-Rheims è la revisione di Challoner, non il testo del 1582/1610
fact.6.label=Questa stampa
fact.6.value=l'edizione americana del 1899 della John Murphy Company, Baltimora, con l'imprimatur del cardinale James Gibbons — da tempo fuori copyright, ed è la versione che circola in forma digitale
fact.7.label=Contenuto qui
fact.7.value=72 libri: i 66 del canone protestante nell'ordine protestante, con Tobia, Giuditta, 1 e 2 Maccabei, Sapienza e Siracide aggiunti dopo l'Apocalisse. Baruc non c'è, sicché questa colonna non è una verifica attendibile del canone cattolico
fact.8.label=Discendenza
fact.8.value=una delle poche edizioni qui il cui antecedente registrato si trova esso stesso nel corpus — un piolo sotto un versetto della Douay-Rheims si apre su [[VUL|la Vulgata latina]] anziché sul pavimento delle lingue originali
fact.9.label=In questo corpus
fact.9.value=il suo segno di piolo porta l'anno 1899 anche se la scheda di catalogo lascia l'anno vuoto; gli anni dei pioli sono un elenco curato a parte, e i due possono divergere
