title=ルター聖書1545年 — この版について | Common Root
description=ルターの Ausgabe letzter Hand（最後の手による版）：マルティン・ルター自身が校訂した最後の版である1545年のヴィッテンベルク聖書であり、彼の死後に標準となった本文。
heroHeading=ルター聖書1545年
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=ルターの最初の聖書ではなく、最後の聖書である。彼がヴァルトブルクで作った新約聖書は1522年に、完全な聖書は1534年に世に出た。その後もさらに十年にわたって改訂を続け、ハンス・ルフトが1545年にヴィッテンベルクで印刷した版こそ、ルター自身が最後まで見届けた版である。ドイツ語ではこれを Ausgabe letzter Hand、最後の手による版と呼ぶ。彼は翌年の2月に世を去り、この本文がその後のルター聖書を測る基準となった。
hero.2=彼はラテン語からではなく原語から訳した。新約聖書にはエラスムスの印刷されたギリシャ語を、旧約聖書にはマソラ本文のヘブライ語を用いて、難しい箇所については一群のヴィッテンベルクの同僚たちと議論を交わした。その結果生まれたものは、ドイツ語にとって、一世紀後の1642年のBibliaがフィンランド語に対して果たしたのとほぼ同じ役割を果たした。方言が多く、定まった書き言葉の散文をほとんど持たなかった言語に、誰もが読める単一の文体が与えられ、そこから現代の書き言葉が育っていった。
hero.3=ここで二つの系譜連鎖が合流する。ルター聖書1912年はこの版の直上に位置し、その改訂版である。フィンランド語の系譜でも三段上にあるBiblia 1642がそうであるのは、トゥルクの委員会がルターの聖書を開いたまま作業したためである。その下では梯子は底面に達する——ギリシャ語にはテクストゥス・レセプトゥス、ヘブライ語にはウェストミンスター・レニングラード写本——そしてこれらの段は ≈ 印ではなく実の段である。エラスムスのギリシャ語とマソラ本文のヘブライ語こそ、ルターが実際にそこから翻訳した本文であって、後から立てられた証人ではないからである。

