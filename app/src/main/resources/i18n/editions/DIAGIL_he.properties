title=Emphatic Diaglott (בין השיטין) — על מהדורה זו | Common Root
description=ה־Emphatic Diaglott של בנג'מין ווילסון משנת 1864: הביאור האנגלי מילה במילה שנדפס מתחת ליוונית של גריסבך, שנקנה לימים והודפס שישים שנה בידי חברת המצפה, והנוסח שסביבו נטוש בדרך כלל הוויכוח על יוחנן 1:1.
heroHeading=Emphatic Diaglott (בין השיטין)
