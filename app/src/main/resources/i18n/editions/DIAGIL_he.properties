# The narrative, one paragraph per key, in order.
hero.1=בנג'מין ווילסון לא היה חוקר מקצועי. הוא היה עורך עיתון בג'נבה שבאילינוי, למד יוונית בעצמו, ובין 1857 ל־1863 הוציא לאור, חלק אחר חלק, ברית חדשה בין־שיטית שלא רק תרגם אלא גם ייצר: אחיינו ראה אותו נוטל הטבעות שעווה של כל עמוד סדר, תולה אותן בחומצה למשך הלילה כדי שתגדל עליהן קרום נחושת, מגבה את הנחושת במתכת יצוקה ומדפיס את התוצאה במכבש יד בעוד הנער מדיו את הלוח. הכרך המוגמר הופיע ב־1864. את היוונית שלו נטל מן הנוסח שיוהאן יאקוב גריסבך קבע בשנות 1770, עם גרסאות מתוך הקודקס הוותיקני.
hero.2=מה שווילסון הדפיס למעשה היה שני נוסחים אנגליים ולא אחד. לאורך שולי העמוד השמאליים רצה היוונית ומתחת לכל מילה ביאור מילולי מילה במילה; לאורך הימניים תרגומו המלוטש שלו, ה־Emphatic Version. אלה אינם היינו הך, וביוחנן 1:1 הם סותרים זה את זה במפורש — הביאור גורס «and a god was the Word», וה־Emphatic Version «and the LOGOS was God». שניהם של ווילסון, מודפסים באותו ספר במרחק סנטימטרים אחדים. אוסף זה מחזיק את הביאור, הוא הטור שמצטטים, וזו הסיבה שהוא יושב במדור משלו ולא ברשת המקראות. ביאור רושם כיצד מורכב משפט יווני — יחסה אחר יחסה, תווית אחר תווית, בסדר המילים היווני. אין הוא הכרעה בשאלה כיצד יש לקרוא את המשפט באנגלית, והכרעתו של ווילסון עצמו בעניין מודפסת בטור שלצדו. מי שמצטט את האחד ראוי שידע כי האחר קיים.
hero.3=חייו המאוחרים של הספר הם הסיבה שרוב האנשים שמעו עליו. ווילסון מת ב־1900 כחבר ב־Church of the Blessed Hope, ולא בשום קבוצה שהתקיימה אז בשם עדי יהוה. ב־1902 רכש צ'ארלס טייז ראסל, נשיא חברת המצפה למקרא ולחוברות, את זכות היוצרים מיורשיו של ווילסון, ועם הזמן גם את הלוחות. החברה הדפיסה את ה־Diaglott בשישים השנים שלאחר מכן — סידרה את האותיות מחדש במכבשיה שלה ב־1927, הוציאה הרבה למעלה ממאה וחמישים אלף עותקים, מכרה אותו בשני דולרים ולבסוף חילקה אותו חינם. כך שה־Diaglott הוא ספר של עדי יהוה מכוח אימוץ ולא מכוח מחבּרוּת, ומנהגו להדפיס «יהוה» בברית החדשה, במקום שהכותבים כתבו κύριος בציטטם את כתבי הקודש העבריים, הקדים בארבעה עשורים את התנועה שהפכה את המנהג למפורסם. זכות היוצרים פקעה ב־1952 ומאז הוא בנחלת הכלל.
hero.4=שני דברים עליו בקורא הזה כדאי לדעת לפני השימוש בו. גריסבך לא הדפיס את מעשי השליחים 8:37 ולא את לוקס 17:36, ולפיכך אין כאן לא את זה ולא את זה; במקום לסגור את הפער ולהעלות כל פסוק מאוחר יותר במספר אחד, המספור מותיר את שני המקומות ריקים, כך שהפניה נוחתת על אותו פסוק בטור הזה כמו בטור שלצדו. וכן לא רשום לו קודם, ולכן שלב שושלת הנפתח מתחת לפסוק של ה־Diaglott מוביל אל רצפת לשונות המקור ולא אל מהדורה אנגלית ישנה יותר.
hero.5=היו מדויקים בשאלה מה אותה רצפה מדפיסה. היוונית שהיא מציגה היא הנוסח המקובל — התווית קוראת ≈ TR 1550, ואותו ≈ הוא הקורא האומר שהוא מציע עֵד ליוונית ולא את הנוסח שממנו נעשתה מהדורה זו. ווילסון עבד על פי גריסבך. במקום שהשניים מסכימים, כמו ביוחנן 1:1, השלב אמנם מראה בדיוק את המילים המבוארות. במקום שהם נחלקים, לא: גריסבך דחה את הפסוקית השילושית ביוחנן א' 5:7, ולפיכך אין בה ב־Diaglott זכר, ואילו שורת הנוסח המקובל שמתחת נושאת אותה במלואה. בטקסט בין־שיטי, שכל הנחת היסוד שלו היא שהיוונית נמצאת שם ממש על העמוד, זהו הפער האחד שכדאי להכיר לפני שמצטטים ממנו.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=מה זה
fact.1.value=הביאור התת־שיטי — האנגלית מילה במילה המודפסת מתחת ליוונית, לא תרגומו הקריא של ווילסון
fact.2.label=ערך
fact.2.value=בנג'מין ווילסון (1817–1900), חוקר אוטודידקט ועורך עיתון בג'נבה שבאילינוי
fact.3.label=הנוסח היווני
fact.3.value=מהדורתו של גריסבך, עם גרסאות מן הקודקס הוותיקני (כתב יד ותיקני 1209)
fact.4.label=יצא לאור
fact.4.value=בחלקים משנת 1857; שלם בכרך אחד ב־1864, בהוצאת Fowler and Wells מניו יורק
fact.5.label=כיצד נדפס
fact.5.value=ווילסון יצר בעצמו כל לוח בגלוונו והדפיס את המהדורה הראשונה במכבש יד
fact.6.label=השם המפורש
fact.6.value=מדפיס «יהוה» בברית החדשה במקום שהכותבים כתבו κύριος בציטטם מכתבי הקודש העבריים — אותה הכרעה שקיבלה [[ASV|American Standard Version]] לאורך כל הברית הישנה
fact.7.label=נרכש בידי
fact.7.value=חברת המצפה למקרא ולחוברות, שקיבלה את זכות היוצרים ב־1902 בימי צ'ארלס טייז ראסל, סידרה מחדש את האותיות ב־1927 והדפיסה אותו עד שנות 1960
fact.8.label=רישיון
fact.8.value=נחלת הכלל — זכות היוצרים פקעה ב־1952, והדפסות המצפה החוזרות לא הוסיפו חדשה
fact.9.label=שני פסוקים חסרים
fact.9.value=מעשי השליחים 8:37 ולוקס 17:36 אינם אצל גריסבך ולכן אינם כאן; מספריהם נותרים ריקים ואינם נסגרים, כך שהטקסט מוסיף להתיישר פסוק מול פסוק עם כל מהדורה אחרת
fact.10.label=היוונית שמתחת לשלב
fact.10.value=[[TR|הנוסח המקובל]], המוצג כ־≈ TR 1550 — עֵד ליוונית, לא נוסח הבסיס של ווילסון, שהיה מהדורת גריסבך; השניים מסכימים ביוחנן 1:1 ונפרדים ביוחנן א' 5:7
fact.11.label=באוסף זה
fact.11.value=מוחזק במדור משלו של מהדורות בין־שיטיות ומהדורות לימוד, בנפרד ממקראות הקריאה, כדי שביאור לא ייחשב לעולם לתרגום; לא רשום לו מקור בשלבי השושלת, ולכן שלב נפתח היישר אל רצפת לשונות המקור
