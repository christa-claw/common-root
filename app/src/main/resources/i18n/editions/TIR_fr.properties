title=Jami` at-Tirmidhi — À propos de cette édition | Common Root
description=Jami` at-Tirmidhi : le recueil de hadiths qu'Abu Isa at-Tirmidhi a construit en qualifiant ouvertement la force de chaque récit et en consignant les arguments juridiques que les juristes en ont tirés — compté parmi les Six Livres de l'islam sunnite.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi est né vers l'an 209 de l'hégire (824 apr. J.-C.) près de Termez, au Khorasan, à ce qui est aujourd'hui la frontière entre l'Ouzbékistan et l'Afghanistan. Il commença à étudier les hadiths vers l'âge de vingt ans et voyagea à partir de l'an 235 de l'hégire à travers le Khorasan, l'Irak et le Hijaz pour les rechercher, étudiant principalement auprès de Muhammad al-Bukhari — son principal maître — ainsi qu'auprès de Muslim ibn al-Hajjaj, Abu Dawud al-Sijistani, Qutaybah ibn Sa'id et Ali ibn Hujr. Il devint aveugle sur ses vieux jours, d'où son surnom « ad-Darir » (« l'Aveugle »). Il retourna dans la région de Termez, où il mourut le 13 rajab de l'an 279 de l'hégire (9 octobre 892 apr. J.-C.) à l'âge d'environ soixante-dix ans.
hero.2=Son titre complet, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, est habituellement abrégé en Jami' at-Tirmidhi ou Sunan at-Tirmidhi. Alors que le Sahih al-Bukhari et le Sahih Muslim n'admettent que des hadiths que leurs compilateurs jugeaient pleinement authentiques, at-Tirmidhi qualifiait ouvertement chaque hadith dans le texte même — sahih, hasan, da'if ou gharib — et expliquait les raisons d'une qualification plus faible plutôt que d'omettre le hadith ; il exposait aussi les points sur lesquels les écoles juridiques (madhahib) divergeaient et les preuves invoquées par chaque partie, ce qui fait de l'ouvrage autant un guide du raisonnement juridique fondé sur le hadith qu'un recueil de hadiths en soi.
hero.3=La tradition sunnite le compte parmi les Six Livres, généralement après le Sahih al-Bukhari, le Sahih Muslim et le Sunan Abi Dawud ; la place exacte qu'il occupe parmi les livres restants — et quel recueil occupe la sixième place, le Sunan Ibn Majah étant la réponse la plus courante mais pas la seule proposée historiquement — est depuis longtemps débattue sans avoir été tranchée, comme pour les autres recueils Sunan de ce corpus. Le nombre de hadiths donné pour l'ouvrage varie pour la même raison : environ 4 330 selon le compte traditionnel, cité ailleurs comme environ 4 400 ; sa structure est elle aussi décrite diversement, comme 46 livres, 49 chapitres dans l'édition du Caire d'Ahmad Muhammad Shakir, ou cinquante chapitres. Le chiffre propre à ce corpus est encore un autre chiffre : 49 livres et 3 998 hadiths numérotés, la forme de l'édition numérique dont il a été tiré, non une prétention à reproduire une tradition imprimée particulière.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-tirmidhi de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le Sahih al-Bukhari, le Sahih Muslim, le Sunan Abi Dawud et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=arabe classique, avec une traduction anglaise sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Abu Isa Muhammad ibn Isa at-Tirmidhi (209–279 de l'hégire / 824–892 apr. J.-C.)
fact.3.label=Titre
fact.3.value=connu comme Jami' at-Tirmidhi ou Sunan at-Tirmidhi ; titre complet al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal
fact.4.label=Compilé
fact.4.value=réuni au fil de voyages à travers le Khorasan, l'Irak et le Hijaz, entamés vers l'an 235 de l'hégire ; at-Tirmidhi mourut près de Termez en l'an 279 de l'hégire (892 apr. J.-C.)
fact.5.label=Méthode
fact.5.value=qualifie ouvertement chaque hadith de sahih, hasan, da'if ou gharib et explique les raisons d'une qualification plus faible, et expose les points sur lesquels les écoles juridiques divergent et les preuves invoquées par chacune — plutôt que de n'admettre que des hadiths jugés pleinement authentiques, comme le font le [[BUK|Sahih al-Bukhari]] et le [[MUS|Sahih Muslim]]
fact.6.label=Rang
fact.6.value=compté parmi les Six Livres de l'islam sunnite (Kutub al-Sitta), généralement après le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]] et le [[ABD|Sunan Abi Dawud]] ; son rang exact parmi les livres restants, et lequel occupe la sixième place, est débattu plutôt que tranché
fact.7.label=Nombre de hadiths
fact.7.value=environ 4 330 selon le compte traditionnel, cité ailleurs comme environ 4 400 ; sa structure est elle aussi décrite diversement, comme 46 livres, 49 chapitres dans l'édition du Caire d'Ahmad Muhammad Shakir, ou cinquante chapitres
fact.8.label=Dans ce corpus
fact.8.value=49 livres et 3 998 hadiths numérotés — la forme des données sources elles-mêmes, non une reproduction d'une tradition imprimée particulière
fact.9.label=Traduction anglaise
fact.9.value=tirée de l'édition eng-tirmidhi de fawazahmed0/hadith-api, montrée en accompagnement sous l'arabe ; la traduction publiée dont elle descend n'a pas encore été établie du côté de ce corpus
fact.10.label=Licence
fact.10.value=le matn arabe est le texte classique du domaine public ; la licence de la traduction anglaise reste en cours de vérification
