title=Textbibel 1906 — Acerca de esta edición | Common Root
description=La Textbibel de Kautzsch y Weizsäcker: una Biblia alemana de eruditos, traducida de nuevo del hebreo y del griego y publicada por primera vez en un solo volumen en Tubinga en 1899; el texto de aquí está fechado en 1906.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Dos profesores, dos Testamentos. Carl Weizsäcker (1822–1899) fue historiador de la Iglesia en Tubinga, donde sucedió a Ferdinand Christian Baur en la cátedra en 1861 y fue canciller de la universidad desde 1889. Su traducción del Nuevo Testamento apareció por primera vez en 1875 y tuvo nueve ediciones en vida suya, la última preparada en su lecho de muerte. Emil Kautzsch (1841–1910) fue un estudioso del Antiguo Testamento que enseñó en Leipzig, Basilea y Tubinga antes de establecerse en Halle en 1888; su Antiguo Testamento, traducido con un grupo de colegas especialistas, apareció completo en 1894.
hero.2=En 1899, el año en que murió Weizsäcker, ambos se reunieron en un solo volumen, la Textbibel des Alten und Neuen Testaments, publicada en Tubinga por J.C.B. Mohr (Paul Siebeck). El nombre dice lo que es: el texto desnudo, para lectores que querían saber lo que dicen el hebreo y el griego, en el alemán de su propio tiempo. Nunca pretendió sustituir a Lutero. Weizsäcker evitó deliberadamente el lenguaje de Lutero y buscó en cambio transmitir la impresión que el original causó en sus primeros lectores; su biógrafo juzgó improbable que llegara a ser un libro del pueblo, y no lo fue. Siguió reimprimiéndose hasta entrada la década de 1910. El texto digital de aquí está fechado en 1906; qué edición fue esa impresión es algo que este proyecto no ha establecido.
hero.3=Se lee como la erudición de su momento. El nombre divino en el Antiguo Testamento es «Jahwe» —«Jahwe ist mein Hirte» en el Salmo 23—, miles de veces, donde Lutero tiene «der Herr». Isaías 7:14 tiene «ein junges Weib», una mujer joven. En el Nuevo Testamento el padrenuestro de Mateo 6:13 termina sin la doxología, y 1 Juan 5:7 no tiene testigos celestiales. El Antiguo Testamento conserva los capítulos y versículos hebreos: los títulos de los salmos cuentan en la numeración, de modo que el Salmo 51 tiene 21 versículos, y Malaquías tiene tres capítulos en lugar de cuatro. La ortografía es más antigua de lo que sugiere la fecha: en Juan 8:1 Jesús «gieng» al monte de los Olivos.
hero.4=En este lector es una de cuatro Biblias alemanas, junto a la Elberfelder y los textos de Lutero de 1545 y 1912. Una interfaz en alemán no abre en ella: el alemán no tiene elección curada, así que el lector toma la primera Biblia alemana del catálogo, que es la Elberfelder. En los peldaños de linaje no consta antecedente alguno para ella, lo cual conviene a una traducción hecha de los originales: un peldaño abierto bajo un versículo cae directamente al suelo de lenguas originales marcado con ≈ — el Códice de Leningrado de Westminster para el Antiguo Testamento y, para el Nuevo, el Textus Receptus, un griego que esta traducción no sigue, como muestra 1 Juan 5:7.

