title=Библия Остервальда (французская) — Об этом издании | Common Root
description=Библия Остервальда: пересмотр французской протестантской Женевской Библии, выполненный пастором из Невшателя, впервые изданный в 1744 году; здесь — в позднейшей редакции с современной французской орфографией.
heroHeading=Библия Остервальда
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Жан-Фредерик Остервальд родился в Невшателе в 1663 году и умер там же в 1747 году. Он был рукоположён в родном городе в 1683 году и почти всю жизнь служил в его церкви — сначала диаконом, с 1699 года пастором, — а также преподавал богословие. Его Библия — не новый перевод с еврейского и греческого, а пересмотр французской протестантской Библии Женевы, того перевода, который франкоязычные реформатские церкви читали с XVI века. Пересмотренный Остервальдом текст впервые вышел в 1744 году, за три года до его смерти, и более двух столетий переиздавался и редактировался; хорошо знали его и в Британии.
hero.2=Текст в этом собрании — не французский язык 1744 года. В XVIII веке писали «étoit» там, где современный французский пишет «était»; в этой копии повсюду «était» и ни разу «étoit», так что она восходит к одной из позднейших редакций, сохранивших имя Остервальда. Самая известная из них — редакция, изданная Société biblique de France в 1881 году, Новый Завет в которой выполнил Ш. Л. Фроссар, и этот текст обновлялся ещё в 1996 году. eBible.org, откуда взята эта копия, называет лишь «Ostervald», но не редакцию, поэтому и эта страница её не называет. Некоторые черты видны почти на каждой странице. Имя Божие — «l'Éternel», Вечный, как у Сегона и во французском Дарби: «L'Éternel est mon berger; je n'aurai point de disette» в Псалме 23. Исаия 7:14 сохраняет «la vierge sera enceinte» — дева, — где у Сегона молодая женщина. А Новый Завет сохраняет чтения Textus Receptus, которые критические издания опускают: в 1 Иоанна 5:7 стоят три небесных свидетеля, «le Père, la Parole, et le Saint-Esprit», которых нет у Сегона рядом.
hero.3=В этой читалке она — одна из трёх французских Библий, рядом с Сегоном и французским Дарби. Французский интерфейс открывает не её: для французского нет отобранного вручную выбора, поэтому читалка берёт первую французскую Библию в порядке каталога, а это Дарби. В ступенях родословия источник для неё не записан — Женевской Библии, которую она пересматривает, в этом собрании нет, — так что ступень, открытая под стихом, уходит прямо на пол исходных языков, помеченный знаком ≈: для Ветхого Завета это Ленинградский кодекс, для Нового — Textus Receptus, та греческая традиция, которой эта Библия действительно следует. Метка ступени у неё несёт год 1744 — год пересмотра самого Остервальда, а не показанного текста. Откройте её рядом с Сегоном, чтобы увидеть бок о бок два столетия французского протестантского библейского языка.

