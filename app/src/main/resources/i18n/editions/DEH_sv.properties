title=Shah Waliullah Dehlawis fyrtio hadither — Om denna utgåva | Common Root
description=Shah Waliullah Dehlawis fyrtio hadither: fyrtio hadither som den delhibaserade 1700-talslärde sade sig ha hört direkt av sin egen lärare under ett studieår i Medina, bevarade tillsammans med sina överföringskedjor — den mest kända samlingen av detta slag från den indiska subkontinenten.
heroHeading=Shah Waliullah Dehlawis fyrtio hadither
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Shah Waliullah Dehlawi — fullt ut Qutb al-Din Ahmad ibn 'Abd al-Rahim al-'Umari al-Dihlawi — föddes den 21 februari 1703 i Phulat, nära Muzaffarnagar, och växte upp i Delhi, där hans far, Shah Abdur Rahim, hade grundat Madrasah-i Rahimiyah. Han ska ha lärt sig Koranen utantill vid sju års ålder och avslutat sin tids vanliga studiegång vid femton, och efterträdde sin far som föreståndare för madrasan två år senare. Åren 1730–31 gjorde han hajj och tillbringade därefter omkring ett år i Medina med att studera hadith — främst under Abu Tahir al-Kurdi (även återgivet al-Kurani), med ytterligare studier under Muhammad Wafdullah al-Maliki och shejk Taj al-Din al-Qal'i — innan han återvände till Delhi den 16 december 1732. Han dog där den 20 augusti 1762 (29 muharram 1176 AH) och begravdes bredvid sin far. Bland hans övriga verk finns Hujjat Allah al-Baligha, allmänt räknat som hans viktigaste bok, Al-Fawz al-Kabir, och Futuh al-Haramayn, hans egen skildring av resan som förde honom till Hijaz.
hero.2=Al-Arba'in fortsätter samma "fyrtio hadith"-tradition (arba'iniyyat) som [[NAW|An-Nawawis fyrtio hadither]] och [[QUD|Fyrtio heliga hadither]], en tradition som går tillbaka till en hadith som lovar den som bevarar fyrtio hadither om religionen en plats bland de lärda på Domedagen — en hadith som de flesta kritiker själva klassar som da'if (svag) — och till en första, numera förlorad samling som tillskrivs Abdullah ibn al-Mubarak (d. 797). Den skiljer sig från de två andra i vad den samlar: i stället för hadither valda efter ämne eller status ur den vidare litteraturen beskriver dess engelska förlag den som fyrtio hadither som Shah Waliullah sade sig ha hört direkt av sin egen lärare i Medina, var och en bevarad tillsammans med den överföringskedja (sanad) genom vilken han tog emot den — en personlig överföringsuppteckning från det studieår som, enligt hans sons uppgift, förändrade hur han undervisade och skrev efter att han återvänt till Delhi.
hero.3=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-dehlawi-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]], [[NAW|Forty Hadith of an-Nawawi]] och [[QUD|Forty Hadith Qudsi]] samt sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Språk
fact.1.value=Klassisk arabiska, med en engelsk översättning under varje hadith i läsaren
fact.2.label=Sammanställare
fact.2.value=Shah Waliullah Dehlawi (1703–1762)
fact.3.label=Namn
fact.3.value=Känd på arabiska som Al-Arba'in ("De fyrtio"); en modern engelsk utgåva med titeln Forty Hadith of Shah Wali-Allah gavs ut av Turath Publishing 2015, översatt av Safaruk Zaman Chowdhury
fact.4.label=Sammanställd
fact.4.value=Efter att Shah Waliullah återvänt till Delhi den 16 december 1732, efter en hajj gjord 1730–31 och omkring ett år av hadithstudier i Medina, främst under Abu Tahir al-Kurdi (även återgivet al-Kurani)
fact.5.label=Metod
fact.5.value=Enligt dess engelska förlag är var och en av de fyrtio haditherna en som Shah Waliullah sade sig ha hört direkt av sin egen lärare, bevarad tillsammans med den överföringskedja (sanad) genom vilken han tog emot den — en personlig överföringsuppteckning snarare än ett urval gjort efter ämne eller status
fact.6.label=Ställning
fact.6.value=Den mest kända "fyrtio hadith"-samlingen (arba'iniyyat) från den indiska subkontinenten; fortsätter en genre vars första kända, numera förlorade exempel tillskrivs Abdullah ibn al-Mubarak (d. 797) och som även gav upphov till [[NAW|An-Nawawis fyrtio hadither]] och [[QUD|Fyrtio heliga hadither]]
fact.7.label=Antal hadither
fact.7.value=40
fact.8.label=I detta korpus
fact.8.value=1 bok och 40 numrerade hadither
fact.9.label=Engelsk översättning
fact.9.value=Hämtad från fawazahmed0/hadith-apins eng-dehlawi-utgåva, visad som följetext till arabiskan; i datamängden anges översättaren som okänd, och om det är Turath Publishings/Chowdhurys översättning eller en fristående sådan är inte bekräftat från detta korpus sida
fact.10.label=Licens
fact.10.value=Den arabiska matnen är den fritt tillgängliga klassiska texten; den engelska översättningens licens är fortfarande under granskning
