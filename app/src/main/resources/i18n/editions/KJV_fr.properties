title=King James Version — À propos de cette édition | Common Root
description=La King James Version de 1611 : quarante-sept traducteurs en six compagnies, chargés de réviser la Bishops' Bible plutôt que de repartir de zéro — et, dans ce corpus, le texte à quatre-vingts livres qui porte encore les apocryphes de la première impression.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Elle commença comme une concession lors d'une réunion consacrée à autre chose. À la conférence de Hampton Court de 1604, convoquée par Jacques Ier pour entendre les griefs puritains sur le livre de prières, la proposition d'une nouvelle traduction fut avancée et le roi la reprit à son compte. Quarante-sept savants furent nommés et répartis en six compagnies — deux à Westminster, deux à Oxford, deux à Cambridge —, chacune avec sa portion de la Bible et un jeu de règles pour travailler. La première de ces règles est celle qui compte le plus à la lecture : ils devaient suivre la Bishops' Bible de 1568 et ne la modifier que dans la mesure où l'original l'exigeait. Ceci fut commandé comme une révision et non comme une traduction neuve, et cela se lit ainsi. Robert Barker, imprimeur du roi, publia le livre achevé à Londres en 1611.
hero.2=Ce que les règles ne disaient pas, et que les traducteurs firent tout de même, ce fut de remonter sans cesse en deçà de la Bishops' Bible. L'anglais dont ils héritaient avait été fait par d'autres — Tyndale avant tout, et la Bible de Genève qu'une génération entière de lecteurs anglais possédait réellement et lisait chez elle. Ce corpus enregistre cette dette au lieu de la laisser à l'introduction : les textes sources de la King James Version sont ici [[GNV|la Bible de Genève]], avec le texte grec reçu et l'hébreu massorétique au-dessous. Ouvrez un échelon de filiation sous un verset de la King James, et c'est Genève qui remonte. Les deux sont, verset après verset, si proches que la question intéressante cesse d'être si Genève a servi et devient où les compagnies de 1611 ont choisi de s'en écarter — ce qu'il est désormais possible de regarder plutôt que de croire.
hero.3=Une différence entre cette King James et la plupart des autres tient à ce qu'elle contient. Le texte compte ici quatre-vingts livres et 36 820 versets : l'Ancien et le Nouveau Testament et les quatorze livres des apocryphes imprimés entre eux, comme le volume de 1611 les imprimait. Presque toute bible King James vendue aujourd'hui en a soixante-six. Le corpus garde la forme longue, et l'effet se voit le long de la chaîne qu'enregistre la filiation : [[GNV|la Bible de Genève]] a ici soixante-six livres, celle-ci quatre-vingts, [[RV|la Revised Version]] au-dessus quatre-vingts, et [[ASV|l'American Standard Version]] au-dessus d'elle de nouveau soixante-six. Qu'une édition imprime ou non les apocryphes est une décision que chacune a prise pour elle-même, et les mettre dans une même colonne rend le motif lisible.
hero.4=Soyons précis sur ce que signifie l'année portée sur la fiche. Elle dit 1611, et c'est la date de la traduction : ce n'est pas une affirmation sur l'impression qu'est ce texte. L'anglais est ici modernisé dans l'orthographe : la Genèse commence « In the beginning God created the heaven and the earth », là où les feuilles de 1611 lisaient « In the beginning God created the Heauen, and the Earth ». Voici donc la King James telle que des imprimeurs postérieurs l'ont normalisée, et l'impression particulière dont elle descend n'est pas enregistrée — la même lacune honnête que le corpus laisse pour [[FB1776|Biblia 1776]]. Pour lire les choix des traducteurs, cela ne change rien ; pour citer le livre de 1611 comme objet, cela change tout. Notons aussi que ce n'est pas l'édition qu'ouvre une interface en anglais : c'est [[NIV|la New International Version]], et la King James est une édition vers laquelle on bascule.

