title=Tyndales Neues Testament 1534 — Über diese Ausgabe | Common Root
description=William Tyndales Neues Testament, die erste aus dem Griechischen übersetzte und die erste gedruckte englische Übersetzung, in seiner eigenen Revision von 1534 — der Wortlaut unter der Genfer Bibel und der King James Version.
heroHeading=Tyndales Neues Testament 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=Zu Tyndales Zeit war eine englische Bibel in England noch verboten. Die Konstitutionen von Oxford aus dem Jahr 1409 untersagten es, die Schrift ohne bischöfliche Genehmigung ins Englische zu übersetzen oder eine solche Übersetzung zu lesen. William Tyndale bat 1523 den Bischof von London, Cuthbert Tunstall, um diese Genehmigung, wurde abgewiesen und verließ im folgenden Jahr England, um die Arbeit ohne sie zu tun. Mit dem griechischen Neuen Testament des Erasmus vor sich, Luthers Deutsch und der lateinischen Vulgata daneben, schuf er das erste aus dem Griechischen übersetzte englische Neue Testament und das erste, das überhaupt gedruckt wurde. Ein erster Versuch in Köln 1525 wurde durch eine Razzia in der Druckerei abgebrochen; das vollständige Buch kam 1526 aus der Presse Peter Schöffers in Worms und wurde nach England geschmuggelt, wo die Bischöfe Exemplare aufkauften und verbrannten.
hero.2=Der Text hier ist Tyndales eigene Revision, 1534 in Antwerpen gedruckt: Er ging das Griechische noch einmal durch, verbesserte seine erste Fassung und fügte Vorreden und Anmerkungen hinzu. Sie war ebenso sehr Streitschrift wie Übersetzung. Thomas More griff ihn an, weil er „Gemeinde“ (congregation) schrieb, wo die Kirche Kirche sagte, „Ältester“ (elder), wo sie Priester sagte, und „Liebe“ (love), wo sie charity sagte – und alle drei Entscheidungen stehen in diesem Text: Matthäus 16,18 lautet „apon this rocke I wyll bylde my congregacion“. Tyndale überarbeitete den Text 1535 ein weiteres Mal, wurde im Mai desselben Jahres in Antwerpen verhaftet und 1536 als Ketzer verurteilt, erdrosselt und in Vilvoorde bei Brüssel verbrannt.
hero.3=In diesem Reader findet man ihn ganz unten. Tyndale ist als Sprosse unter der Genfer Bibel und unter der King James Version verzeichnet und damit, weiter unten auf der Leiter, auch unter der Revised Version, der American Standard Version und der World English Bible, die auf der King James stehen. Steigt man von einem King-James-Vers an der Genfer Bibel vorbei hinab, bewegt sich der Wortlaut oft kaum – und genau darum geht es; bei 1. Korinther 13,13 bewegt er sich, wo Tyndale und die Genfer Bibel love sagen und die King James charity. Unter Tyndale ist keine Vorlage verzeichnet. Er arbeitete nach dem Griechisch des Erasmus, doch der hier vorhandene Textus Receptus ist die Ausgabe von 1550, eine Generation nach ihm, und der Luther hier ist die Bibel von 1545, nicht das Neue Testament von 1522, das er benutzte; so führt die Leiter direkt auf den Boden der Ursprachen. Enthalten ist nur das Neue Testament, in seiner eigenen Schreibung: Matthäus beginnt „This is the boke of the generacion of Iesus Christ“.

