title=American Standard Version — על מהדורה זו | Common Root
description=מהדורת American Standard Version משנת 1901: המהדורה האמריקנית של Revised Version, פרי עבודתם של חוקרים שבמשך עשרים שנה תיקנו בדואר את תרגום המלך ג'יימס, ומקורן של Revised Standard Version, של New American Standard Bible ושל World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=בראשיתה הייתה American Standard Version מפעל של אחרים. כאשר יצאה כנסיית אנגליה בשנת 1870 לתקן את תרגום המלך ג'יימס, הזמינה חוקרים אמריקנים להשתתף, והם השתתפו — בהתכתבות, מעבר לאוקיינוס האטלנטי, קרוב לשני עשורים. במקום שבו נחלקו שני הצדדים נכנסה גרסת הוועדה הבריטית אל הפנים והעדפת האמריקנים אל נספח, והאמריקנים הסכימו להימנע ממהדורה משלהם ארבע עשרה שנה. המהדורה האנגלית Revised Version הופיעה בשנת 1881 ובשנת 1885. המהדורה האמריקנית באה אחריה בשנת 1901, וגרסאות הנספח הועלו אל הפנים, במקום שעורכיהן רצו אותן מלכתחילה.
hero.2=זהו תרגום שעשו חוקרים לחוקרים, וכך גם הוא נקרא. המתקנים דבקו בסדר המילים העברי והיווני ככל שהאנגלית סבלה זאת, ומכאן ש־American Standard Version מדויקת, ובקטעים ארוכים נוקשה. החלטתה הגלויה ביותר נוגעת לשם האל: במקום שבו הדפיס תרגום המלך ג'יימס “the LORD” באותיות רבתי קטנות, מדפיסה American Standard Version “Jehovah”, אלפי פעמים, לאורך כל הברית הישנה. בברית החדשה היא הולכת אחר היוונית של המתקנים ולא אחר טקסטוס רצפטוס, ולכן גרסאות שהיו לפני מתרגמי המלך ג'יימס ואינן בכתבי היד הקדומים יותר — ובהן המשפט השילושי באיגרת יוחנן א׳ 5:7 — מצויות בהערה או נעדרות.
hero.3=מעולם לא נעשתה American Standard Version ביבליית ספסלים. מה שנעשתה הוא מקור. המהדורה Revised Standard Version משנת 1952 הייתה תיקון שלה; וכך גם New American Standard Bible, המצויה אף היא באוסף זה; וכך גם World English Bible, שנשאה אותה אל נחלת הכלל בכתיב מודרני. משום כך היא עומדת במקום שהיא עומדת בשלבי השושלת של הקורא — באמצע השרשרת הארוכה ביותר שיש באוסף. פִּתחו שלב מתחת לפסוק מ־ASV ותופיע מתחתיו Revised Version שממנה נעשתה, ומתחתיה תרגום המלך ג'יימס וביבליית ז'נבה, עד לרצפת שפות המקור המסומנת ב־≈. פִּתחו שלב מתחת לפסוק מ־World English Bible ותשובו לכאן.

