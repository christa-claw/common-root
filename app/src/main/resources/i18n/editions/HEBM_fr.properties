title=Bible hébraïque — À propos de cette édition | Common Root
description=La Bible entière en hébreu : l'Ancien Testament massorétique avec le Nouveau Testament de Franz Delitzsch de 1877, retraduit dans l'hébreu de la Mishna pour des lecteurs qui voulaient le livre entier dans une seule langue.
heroHeading=Bible hébraïque — Ancien Testament massorétique et Nouveau Testament de Delitzsch
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Une bible hébraïque d'un bout à l'autre est un objet plus étrange qu'il n'y paraît, car la moitié n'en a jamais été écrite en hébreu. L'Ancien Testament est hébreu et l'a toujours été. Le Nouveau Testament nous est parvenu en grec. Une édition comme celle-ci, c'est donc deux sortes de textes cousues ensemble : un original, et une traduction faite dans le sens inverse de l'ordinaire — depuis le grec et vers la langue que ses auteurs parlaient pour la plupart.
hero.2=La moitié néotestamentaire est l'œuvre de Franz Delitzsch, savant de Leipzig versé dans l'hébreu et dans la littérature rabbinique, à qui la Société biblique britannique et étrangère commanda le travail en 1873 et qui l'acheva en 1877. Il ne traduisit pas dans l'hébreu de son propre siècle. Il écrivit dans l'hébreu de la Mishna et de l'époque du Second Temple, au motif qu'un texte du premier siècle doit sonner comme tel — si bien que le résultat se lit moins comme une mise en hébreu que comme une tentative de retrouver ce que les phrases avaient pu être avant d'être grecques. C'est encore le Nouveau Testament hébreu vers lequel on se tourne le plus souvent.
hero.3=Quel grec il eut sous les yeux fut décidé en partie pour lui. Il partit du Codex Sinaiticus, le manuscrit du quatrième siècle découvert quelques décennies plus tôt, et la Société biblique — dont la règle était de publier d'après le texte reçu — refusa de continuer à financer une version bâtie dessus. Delitzsch revint au Textus Receptus et signala les leçons sinaïtiques importantes au lieu de les adopter. Le texte continua ensuite de bouger treize ans et dix éditions durant ; la dernière fut conduite à l'impression par Gustav Dalman en 1890, l'année de la mort de Delitzsch. C'est une raison pour laquelle le catalogue laisse vide l'année de cette édition : les deux moitiés ne partagent aucune date, et celle qui a des dates en a dix.
hero.4=Dans ce lecteur, c'est l'édition sur laquelle s'ouvre une interface hébraïque — un choix retenu, non un hasard alphabétique — et choisir l'hébreu retourne toute l'interface de droite à gauche autour d'elle. Elle se tient à côté du Codex de Léningrad sans lui faire concurrence : le Codex est le Tanakh savant, entièrement vocalisé et accentué, et s'arrête où s'arrête l'Ancien Testament, tandis que celle-ci est un texte consonantique nu qui se poursuit jusqu'à l'Apocalypse. Les échelons de filiation ne lui enregistrent aucun ascendant, de sorte qu'un échelon ouvert sous un verset tombe tout droit sur le sol des langues originales, ≈ WLC et ≈ TR. Ailleurs dans ce corpus, ce sol est une approximation, et c'est ce dont le ≈ avertit. Ici, il ne l'est presque pas : l'Ancien Testament à l'écran est le texte massorétique, et le Textus Receptus est bien ce que Delitzsch avait devant lui.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=hébreu — texte consonantique sans points-voyelles ni signes de cantillation
fact.2.label=Ce que c'est
fact.2.value=deux textes reliés en une seule bible : l'Ancien Testament massorétique traditionnel, et un Nouveau Testament hébreu traduit du grec au dix-neuvième siècle
fact.3.label=Nouveau Testament par
fact.3.value=Franz Delitzsch (1813–1890), l'hébraïsant de Leipzig
fact.4.label=Commandé par
fact.4.value=la Société biblique britannique et étrangère en 1873 ; la traduction fut achevée en 1877
fact.5.label=Ancien Testament d'après
fact.5.value=l'hébreu massorétique lui-même — non une traduction, ce qui en fait la seule édition d'ici dont l'Ancien Testament soit déjà dans sa langue d'origine, comme l'est [[WLC|le Codex de Leningrad de Westminster]]
fact.6.label=Nouveau Testament d'après
fact.6.value=le grec du [[TR|Textus Receptus]]. Delitzsch était parti du Codex Sinaiticus, mais la Société biblique publiait d'après le texte reçu et refusa de financer l'écart
fact.7.label=Registre
fact.7.value=ce n'est pas de l'hébreu moderne. Delitzsch a écrit dans l'hébreu de la Mishna et de l'époque du Second Temple, cherchant à rendre au grec la tournure qu'auraient employée ceux qui le parlaient
fact.8.label=Révisé jusqu'en
fact.8.value=1890, la dernière édition conduite à l'impression par Gustav Dalman
fact.9.label=À ne pas confondre avec
fact.9.value=le Nouveau Testament en hébreu moderne publié par la Société biblique en Israël, traduction distincte du vingtième siècle encore sous droits
fact.10.label=Année au catalogue
fact.10.value=laissée vide — les deux moitiés ne partagent pas d'année, et le Nouveau Testament seul a été révisé sur treize ans et dix éditions
fact.11.label=Dans ce corpus
fact.11.value=les 66 livres, et le choix par défaut retenu pour une interface hébraïque — le lecteur ouvre sur celle-ci et non sur [[WLC|le Codex de Leningrad de Westminster]], parce que celle-ci va jusqu'au bout du Nouveau Testament
