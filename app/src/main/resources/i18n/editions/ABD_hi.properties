title=सुनन अबू दाऊद — इस संस्करण के बारे में | Common Root
description=सुनन अबू दाऊद: वह हदीस-संग्रह जिसे अबू दाऊद अल-सिजिस्तानी ने इस्लामी विधिशास्त्र से उसके संबंध के कारण संकलित किया, लगभग 500,000 परखी गई रिवायतों में से चुना गया और विधिक विषय के अनुसार व्यवस्थित — सुन्नी इस्लाम की छह पुस्तकों में तीसरी।
heroHeading=सुनन अबू दाऊद
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=अबू दाऊद सुलैमान इब्न अल-अशअस अल-अज़्दी अल-सिजिस्तानी का जन्म हिजरी संवत् 202 (817–818 ई.) के आसपास सिजिस्तान में हुआ, जो ख़ुरासान का एक प्रांत था और आज ईरान-अफ़ग़ानिस्तान सीमा पर स्थित है। वे अठारह वर्ष की आयु में बग़दाद पहुँचे, और फिर हदीस की खोज में ख़ुरासान, इराक़, हिजाज़, सीरिया, मिस्र और नीशापुर होते हुए यात्रा की, तथा लगभग 300 विद्वानों से शिक्षा प्राप्त की, जिनमें अहमद इब्न हनबल भी शामिल थे। वे बसरा में बस गए, जहाँ हिजरी संवत् 275 (889 ई.) के शव्वाल माह में एक शुक्रवार को तिहत्तर वर्ष की आयु में उनका निधन हुआ, और उन्हें फ़क़ीह सुफ़यान अल-थौरी के निकट दफ़नाया गया।
hero.2=उनकी रुचि विशेष रूप से विधिक थी: सहीह अल-बुख़ारी और सहीह मुस्लिम के विपरीत, जो आस्था, इतिहास और विधि को समान रूप से समेटते हैं, अबू दाऊद ने अपने सुनन को फ़िक़्ह से संबंधित हदीसों के इर्द-गिर्द रचा, और इसे ऐसी पुस्तकों में व्यवस्थित किया जो एक फ़क़ीह को आवश्यक विषयों से गुज़रती हैं — शुद्धि, नमाज़, ज़कात, रोज़ा, विवाह, विरासत, न्यायाधीशी और शेष। उनके शिष्य इब्न दासा के अनुसार, सामग्री एकत्र करते समय उन्होंने लगभग 500,000 हदीस-रिवायतों की परख की। उन्होंने अल-बुख़ारी और मुस्लिम से भिन्न एक कसौटी भी स्थापित की: जहाँ उन दोनों ने केवल उन्हीं हदीसों को स्वीकार किया जिन्हें वे पूर्णतः प्रामाणिक मानते थे, वहीं अबू दाऊद ने कुछ मुरसल, दुर्बल (ज़ईफ़) और यहाँ तक कि मुन्कर रिवायतों को भी शामिल किया जब किसी विधिक बिंदु पर कोई अधिक सशक्त हदीस उपलब्ध नहीं थी, और मक्का के निवासियों को लिखे एक पत्र में अपनी पद्धति स्पष्ट की, तथा दुर्बल आकलनों को अचिह्नित छोड़ने के बजाय स्वयं चिह्नित किया।
hero.3=सुन्नी परंपरा सुनन अबू दाऊद को छह पुस्तकों में तीसरा स्थान देती है, सहीह अल-बुख़ारी और सहीह मुस्लिम के बाद; बाक़ी चार में यह, जामिʿ अल-तिर्मिज़ी, सुनन अल-नसाई और सुनन इब्न माजा एक-दूसरे के सापेक्ष ठीक किस स्थान पर आते हैं, यह लंबे समय से विवाद का विषय रहा है, निर्णीत नहीं। इस पुस्तक के लिए दी गई संख्याएँ आपस में इस तरह मेल नहीं खातीं कि किसी ने इसे सुलझाया प्रतीत न हो: अबू दाऊद द्वारा चुनी गई सामग्री के लिए इब्न दासा की संख्या 4,800 हदीसें है, जबकि आधुनिक मानक संस्करण — जिसे मुहम्मद मुह्यिद्दीन अब्द अल-हमीद ने संपादित किया और जो 1935 में काहिरा में मुद्रित हुआ — 5,274 क्रमांकित करता है। इस संग्रह की अपनी संख्या, 43 पुस्तकें और 5,274 हदीसें, उस काहिरा संस्करण के क्रमांकन से ठीक मेल खाती है, जो इसे यहाँ सहीह अल-बुख़ारी या सहीह मुस्लिम की तुलना में अधिक ठोस आधार पर रखती है, जहाँ इस संग्रह की संख्या किसी एक विशेष मुद्रण-परंपरा को नहीं दोहराती।
hero.4=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-abudawud संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह सहीह अल-बुख़ारी, सहीह मुस्लिम और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

