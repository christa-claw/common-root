title=سنن ابن ماجه — عن هذه الطبعة | Common Root
description=سنن ابن ماجه: آخر الكتب الستة عند أهل السنة، وهو مرتب بحسب الموضوع الفقهي، ومكانته بينها مثار جدل قديم بسبب ما فيه أيضاً من أحاديث ضعيفة وموضوعة.
heroHeading=سنن ابن ماجه
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد أبو عبد الله محمد بن يزيد ابن ماجه الربعي القزويني سنة 209 هـ (824 م) في قزوين، التي تقع اليوم في شمال غرب إيران، في أسرة من موالي قبيلة ربيعة — وماجه، بحسب رواية، كان لقب أبيه لا اسم جد أو أم. رحل في طلب الحديث عبر العراق والحجاز والشام ومصر، ودرس على دائرة واسعة من العلماء؛ ويُقال إن أكثر من ربع سننه المقبل استند إلى شيخ واحد، وهو ابن أبي شيبة. وأثنى عليه معاصروه، مثل أبي يعلى الخليلي، بوصفه ثقة وجليلاً وحجة متفقاً عليها. توفي في قزوين سنة 273 هـ (887 م)، وإن كان الكتاني يسجل أيضاً سنة 275 هـ (889 م)؛ وبحسب الرواية التقليدية، لما قرأ ابن ماجه سننه الذي أتمّه على أبي زرعة الرازي، قال أبو زرعة إن الناس لو كان عندهم هذا الكتاب لاستغنوا في معظمه عن سائر كتب السنن.
hero.2=من بين نحو خمسة عشر عملاً يُنسب إليه، سننه هذا يبلغ، بحسب عدّ الذهبي، نحو 1,500 باب ونحو 4,000 حديث، مرتب بحسب الموضوع الفقهي كما كتابا [[ABD|أبي داود]] و[[TIR|الترمذي]]. وإلى جانب ما فيه من مادة صحيحة ومقبولة، يحمل أيضاً أحاديث حكم عليها علماء لاحقون بالضعف، منها نحو ثلاثين يُتّفق عموماً على أنها موضوعة محضة — وهذا هو السبب في أن بعض العلماء لا يعدّون إلا "الخمسة" بدل الستة.
hero.3=تضع التقاليد السنية سنن ابن ماجه آخر الكتب الستة (الكتب السنة)، إلى جانب [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] و[[NAS|سنن النسائي]]. وهذا الموضع السادس نفسه مختلف فيه: فالمالكية وابن الأثير، من بين آخرين، يسمّون بدلاً منه [[MAL|موطأ مالك]]، ويسمّي بعضهم سنن الدارقطني؛ ويُقال عموماً إن كتاب ابن ماجه حصل على هذا الموضع لأن محتواه أقل تداخلاً مع الخمسة الأخرى، لا لأنه يُحكم عليه بأنه أوثق المرشحين.
hero.4=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-ibnmajah في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] و[[NAS|سنن النسائي]] وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

