title=Palabra de Dios para Ti — Об этом издании | Common Root
description=Palabra de Dios para Ti: испанский перевод, изданный в 2020 году Asociación Bíblica Latinoamericana, который сохраняет еврейские имена Бога транслитерированными и свободно лицензирован для любого использования.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — «Слово Божие для тебя» — свежий испанский перевод, изданный в 2020 году Asociación Bíblica Latinoamericana; электронный текст вышел в 2022 году через Latinamerican Textual Bible Foundation, Inc., некоммерческую организацию, зарегистрированную во Флориде, которая распространяет его на eBible.org и YouVersion. Он приписывается переводчикам Франсиско Льевано и Джойс Льевано. В отличие от линии Рейны-Валеры, на которую по умолчанию открывается испанский интерфейс этого собрания, это не пересмотр перевода Касиодоро де Рейны XVI века и не чего-либо, восходящего к нему; это самостоятельный перевод, сделанный непосредственно с языков оригинала, адресованный обычным читателям по всей испаноязычной Америке и предназначенный для свободного цитирования без спроса разрешения.
hero.2=Ветхий завет следует Biblia Hebraica Stuttgartensia, а Новый завет — 27-му изданию Novum Testamentum Graece Эберхарда Нестле. Один выбор отличает его страницы от большинства испанских Библий после Рейны: там, где те передают Тетраграмматон как «Jehová» или заменяют его на «Señor», Palabra de Dios para Ti сохраняет сами еврейские имена, транслитерированные — Yavé, ʼElohim, ʼEL-Shadday, — так что Бытие открывается, собственными словами этого издания, строкой «En un principio ʼElohim creó los cielos y la tierra».
hero.3=В этой читалке это одно из четырёх испанских изданий, наряду с [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] и [[VBL|Versión Biblia Libre]]. Интерфейс по-прежнему открывает по умолчанию Рейну-Валеру 1909 года; к этому изданию переходят с его собственной карточки. Как и два других, это свежий перевод, а не пересмотр чего-либо ещё, что есть в собрании, так что основы для него не записано в ступенях родословия — ступень, открытая под одним из его стихов, падает прямо на помеченный знаком ≈ пол языков оригинала. Asociación Bíblica Latinoamericana также выпускает более полное печатное издание с неканоническими книгами; текст, который держит это собрание, — обычный протестантский канон из шестидесяти шести книг.

