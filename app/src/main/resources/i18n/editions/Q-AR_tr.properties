title=Kur'an — Osmanlı mushaf metni — Bu Baskı Hakkında | Common Root
description=Hafs an Asım kıraatiyle Kur'an; 1924 Kahire baskısından bu yana dünyadaki basılı Kur'anların çoğunun dayandığı metin — ve bu derlemede, King Fahd Kompleksi'nin kendi nüshasıyla ayet ayet karşılaştırılmış ve 6.236 ayetinin tamamında ünsüz iskeletinde tam uyuşan bir metin.
heroHeading=Kur'an — Osmanlı mushaf metni
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=Bu metnin temelindeki kıraatin adlandırılmış bir aktarım zinciri var. Hafs bin Süleyman el-Kûfî (ö. 796) onu, Küfe'nin okuyucularından biri olan ve kıraati İbn Mücahid tarafından sonradan yedi kıraat arasına alınan hocası Âsım bin Ebü'n-Necûd'dan aktardı (Âsım 745'te vefat etti). Âsım'dan Hafs — "Âsım'dan, Hafs" — Müslümanların aynı vahyin eşit derecede yetkili aktarımları saydığı birkaç kıraatten biridir; tek kıraat değildir, ama açık farkla en çok basılanıdır. Ezher âlimlerinden oluşan bir kurul, 1907'den itibaren Kral I. Fuad döneminde çalışarak Bulak'taki Emiri Matbaası'nın 10 Temmuz 1924'te bastığı standart Mısır Kur'an'ını hazırladığında, baskıya geçirdikleri kıraat buydu. Bugün her yerde satılan Kur'anların çoğu, King Fahd Kompleksi'nin kendi baskısı da dahil, o baskının izinden gider.
hero.2=Bu derlemede yer alan metin, alquran.cloud'un quran-uthmani baskısı aracılığıyla, Tanzil Projesi'nin aynı Hafs metnini sayısallaştırmasından alınmıştır. Okuyucuda üç çeviriyle eşleşir: Pickthall'ın İngilizce çevirisi (1930), Yusuf Ali'nin İngilizce çevirisi (1934) ve Sablukov'un Rusça çevirisi (1878) — üçünden birini bunun yanında açtığınızda, çevirisi her ayetin altında görünür. Okuyucu Kur'an'ı iki sıralamada da sunar: aynı geleneğin belirlediği klasik mushaf sıralaması ve her surenin ne zaman vahyedildiğine göre âlimlerin yeniden kurduğu sıralama.
hero.3=Harfi harfine korunma, bu metin hakkında yapılan iddialardan biridir, bu yüzden burada varsayılmak yerine denetlenir. King Fahd Kutsal Kur'an Basım Kompleksi'nin kendi Hafs baskısıyla ayet ayet karşılaştırıldığında, iki metin de ünsüz iskeletinde — herhangi bir hareke eklenmeden önceki çıplak harflerde — 6.236 ayetinin tamamında uyuşur. Bulunan her fark, harekelerin ve durak işaretlerinin nasıl gösterildiğiyle, hemzenin yazılışıyla ve iki tarafın kelime sınırını farklı çizdiği sekiz yerle sınırlıdır; bunların hiçbiri metnin kendisindeki bir harfe dokunmaz. Bu, bu derlemenin 1776 Fince İncili için kabul etmek zorunda olduğu belirsizliğin tam tersidir; orada metnin hangi baskıdan geldiği basitçe bilinmemektedir.
hero.4=Bu uyumun kanıtlamadığı iki şeyi açıkça söylemekte fayda var. Bu bir köken iddiası değildir — Kompleksin metniyle uyuşmak, ikisinin aynı metin olduğunu gösterir, birinin diğerinden kopyalandığını değil. Ve bir izin de değildir: 2026 Ağustos'un sonunda Komplekse gönderilen ve kendi rivayet dosyalarını göstermek için izin isteyen bir talep, bu yazının yazıldığı sırada yanıtlanmamıştı. Karşılaştırmanın kendisinin kısaca anlaşmazlık gösterdiği tek ayet olan 19:3'ün, referans dosyasının okunma biçimindeki bir kusurdan kaynaklandığı, iki Kur'an'ın hiçbirinden kaynaklanmadığı ortaya çıktı — düzeltildiğinde tam olarak uyuşuyor. Referans nüshanın kendisi, Kompleksin kelime işlemci dosyasının bir yeniden yapılandırmasıdır, resmi dijital yayını değildir; bu, karşılaştırmanın resmi olarak yayımlanmış bir veri kümesiyle tam anlamıyla bir karşılaştırma olmadığı tek yönüdür.

