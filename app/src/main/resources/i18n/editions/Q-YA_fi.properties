title=Koraani — Yusuf Ali — Tietoja tästä laitoksesta | Common Root
description=Abdullah Yusuf Alin käännös, jonka julkaisi neljässä osassa vuosina 1934–1937 intialainen virkamies, josta tuli islamin tutkija — yksi vain kahdesta englanninkielisestä Koraanin käännöksestä, joka todettiin kiistattomasti vapaasti käytettäväksi, ja tässä aineistossa toinen englanninkielinen rinnakkaiskäännös Pickthallin käännöksen ohella.
heroHeading=Koraani — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872–1953) syntyi Bombayssa ja kävi koulunsa ensin Wilson Collegessa, missä uskonnollinen opetus koulunkäynnin ohella sai hänet opettelemaan Koraanin ulkoa poikana. Ensiluokan kandidaatin tutkinto englantilaisesta kirjallisuudesta Bombayn yliopistosta vuonna 1891 toi hänelle Presidencyn apurahan Britanniaan, missä hän opiskeli oikeustiedettä St John's Collegessa Cambridgessa, valmistuen kandidaatiksi ja oikeustieteen kandidaatiksi vuonna 1895 ja palaten samana vuonna Intiaan virkaan Intian siviilihallinnossa.
hero.2=Hän vietti lähes kaksi vuosikymmentä siviilihallinnon palveluksessa — tuomarin ja verovirkailijan tehtävissä, sitten oikeuden tuomarina ja myöhemmin Intian hallituksen valtiovarainministeriön apulaissekretäärinä — ennen kuin erosi virastaan vuonna 1914 ja asettui Britanniaan. Siellä hänestä tuli Wokingin Shah Jehan -moskeijan ja Itä-Lontoon moskeijarahaston luottamusmies, hänet nimitettiin CBE-arvoon vuonna 1917 sota-aikaisesta työstään, ja hän luennoi hindustania Itämaisten tutkimusten koulussa. Hän palasi Intiaan 1920- ja 1930-luvuilla Lahoren Islamia Collegen rehtoriksi, ja juuri näinä vuosina, yli vuosikymmenen työn tuloksena, hän kirjoitti Koraanin englanniksi omin selittävin huomautuksin.
hero.3=Käännös ilmestyi kolmessakymmenessä sarjaosassa vuosina 1934–1937, ensimmäinen 4. huhtikuuta 1934, nimellä "The Holy Qur'an: Text, Translation and Commentary", kustantajana Shaik Muhammad Ashraf Lahoresta; yhteen osaan koottu laitos seurasi vuonna 1938, ja tarkistettu laitos vuosina 1939–1940. Pickthallin käännöksen ohella siitä tuli yksi kahdesta luetuimmasta englanninkielisestä Koraanin käännöksestä 1900-luvulla, tunnettu ennen kaikkea alaviitteidensä laajuudesta, ja sitä on julkaistu uudelleen, paikoin toisten käsissä muokattuna, noin kolmessakymmenessä myöhemmässä painoksessa — mukaan lukien Amana Publicationsin Pohjois-Amerikassa vuodesta 1977 levittämä laitos ja Saudi-Arabian tukema 1980-luvun tarkistus.
hero.4=Tässä digitoitu teksti, saatu alquran.cloudin kautta, on käännös itsessään, ei Yusuf Alin siihen liittyvä selitysosa, ja se tarjotaan tässä aineistossa toisena englanninkielisenä rinnakkaiskäännöksenä [[Q-AR|uthmani-arabiankielisen tekstin]] alla, [[Q-EN|Pickthallin vuoden 1930 käännöksen]] ohella. Se oli yksi vain kahdesta englanninkielisestä käännöksestä, jotka käytettävissä olevien käännösten katsaus löysi kiistattomasti vapaasti käytettäviksi — tämä ja Pickthallin — vaikka "kiistattomasti" kaipaa tässä tapauksessa varauksen: teos on vapaasti käytettävissä Euroopan unionissa ja Pakistanissa, jossa Yusuf Ali kuoli ja jossa teos ensin julkaistiin, mutta Yhdysvalloissa vuonna 1996 rekisteröidyn muodollisen tekijänoikeuden katsotaan olevan voimassa vuoteen 2033.

