title=Koraani — Pickthall — Tietoja tästä laitoksesta | Common Root
description=Muhammad Marmaduke Pickthallin vuoden 1930 käännös, ensimmäinen englanninkielinen Koraanin käännös, jonka teki äidinkielenään englantia puhuva muslimi — syntyi Hyderabadin nizamin palveluksessa al-Azharin oppineiden neuvoin, ja on tässä aineistossa englanti, joka näkyy oletuksena arabiankielisen tekstin alla.
heroHeading=Koraani — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) oli englantilainen kirjailija, jota aikanaan arvostivat H. G. Wells ja D. H. Lawrence, ennen kuin hänestä tuli pyhien kirjoitusten kääntäjä. Hän julisti kääntymisensä islamiin marraskuussa 1917, pidettyään Nottin Hillin muslimien kirjallisuusseuralle esityksen otsikolla "Islam and Progress", ja antoi uskontunnustuksen samana kuukautena Wokingin muslimilähetyksessä. Vuosikymmen myöhemmin hän toimi Chadarghatin lukion rehtorina Hyderabadissa, nizamin palveluksessa, ja juuri sieltä hän vuonna 1928 otti kahden vuoden virkavapauden tehdäkseen sen, mitä oli halunnut tehdä kääntymisestään lähtien: kääntää Koraanin englanniksi.
hero.2=Hän ei tehnyt sitä yksin eikä hätäisesti. Vuonna 1929 hän vietti kolme kuukautta Kairossa, missä Rashid Ridan tuki avasi ovia, hakeakseen al-Azharin oppineiden siunausta hankkeelle, jonka osa heistä oli varoitettu voivan maksaa heille heidän asemansa — osa al-Azharissa piti itse Koraanin kääntämistä vakavana asiana. Pickthall jatkoi siitä huolimatta ja kuuli heitä yhä. Se, mitä hän julkaisi vuonna 1930 nimellä "The Meaning of the Glorious Koran: An Explanatory Translation", kantaa tätä varovaisuutta jo otsikossaan: ei "Koraani englanniksi" vaan selitys sen merkityksestä, sillä mikään käännös ei hänen oman näkemyksensä mukaan voinut olla itse Koraani. Alfred A. Knopf julkaisi ensipainoksen New Yorkissa; sitä seurasi kaksikielinen painos Hyderabadin hallituksen kirjapainosta.
hero.3=The Times Literary Supplement kutsui sitä "suureksi kirjalliseksi saavutukseksi", ja sitä kuvataan yleisesti ensimmäiseksi englanninkieliseksi Koraanin käännökseksi, jonka teki muslimi, jonka äidinkieli oli englanti — aiemmat englanninkieliset versiot, kuten Salen ja Rodwellin, olivat ei-muslimien orientalistien työtä. Pickthallin käännös on pysynyt painossa ja käytössä lähes vuosisadan ajan sen jälkeen, yksi harvoista englanninkielisistä käännöksistä, joita tavalliset lukijat, ei vain tutkijat, todella lukevat.
hero.4=Tässä aineistossa se on käännös, joka näkyy oletuksena uthmani-arabiankielisen tekstin alla — arabia pysyy jokaisen sarakkeen pohjana, ja tämä englanti näytetään selityksenä sen rinnalla, ei sitä korvaamassa. Se valittiin tähän rooliin yhtä paljon arkisesta syystä kuin kirjallisesta: käytettävissä olevien käännösten katsaus löysi vain kaksi englanninkielistä käännöstä, jotka olivat kiistattomasti vapaasti käytettäviä, tämän ja Yusuf Alin vuoden 1934 käännöksen, sekä Sablukovin venäjänkielisen käännöksen vuodelta 1878 kolmanneksi kieleksi. Tässä oleva teksti on käännöksen digitointi, saatu alquran.cloudin kautta eikä mistään yksittäisestä painoksesta, niin se kannattaa lukea Pickthallin sanamuotona eikä tietyn painoksen jäljennöksenä.

