title=סמית' וּוָן דייק — על מהדורה זו | Common Root
description=הביבליה הערבית של סמית' ווָן דייק: הוחלה בידי אֵלַי סמית' בביירות והושלמה בידי קורנליוס ון דייק בשנת 1865 בסיועם של אנשי הנהדה בֻּטרוס אל-בֻּסתאני, נאצִיף אל-יאזִ'ג'י ויוּסֻף אל-אסִיר; עד היום הביבליה הערבית הנקראת ביותר.
heroHeading=סמית' וּוָן דייק
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=המיסיון האמריקני בביירות פתח בתרגום הזה סביב שנת 1847, ומי שהתחיל אותו לא סיים אותו. אֵלַי סמית' בילה שני עשורים בלבנט וידע את הלשון די הצורך כדי להתווכח עליה; הוא עמל על הנוסח עד מותו בשנת 1857. קורנליוס ון אלן ון דייק נטל את המלאכה והביא אותה עד תומה — הברית החדשה הושלמה בשנת 1860, והברית הישנה חמש שנים אחריה, בשנת 1865. שני השמות שעל הספר הם שני חצאיה של עבודה אחת.
hero.2=השמות שאינם על הגב שוקלים לא פחות. ון דייק למד את ערביתו מבֻּטרוס אל-בֻּסתאני ומנאצִיף אל-יאזִ'ג'י, ושניהם עבדו עמו על התרגום, וכמוהם השייח' יוּסֻף אל-אסִיר, שעבר על הערבית לעניין הניב והמשלב. שלושת אלה לא היו עוזרים במפעל מיסיונרי. הם נמנו עם דמויות המפתח של הנהדה, התחייה הספרותית הערבית, ומה שיצא נקרא כפרוזה ערבית ולא כתרגום המחופש לערבית. משום כך האריך הספר ימים יותר מן המיסיון שמימן אותו.
hero.3=זה היה הישג של דפוס לא פחות מהישג של למדנות. הדפוס האמריקני בביירות סידר אותו באות ערבית שנחרטה עבור המיסיון והושלמה בשנת 1843, אותו גופן הקרוי עד היום אל-אמריקאני, ולעיצובו היה סמית' שותף. ערבית קשה לסדר כראוי — האותיות נקשרות, ובהיקשרן משנות את צורתן — וביבליה שנראתה נכון על הדף עשתה לקבלתה יותר משעשה טיעון. מיליוני עותקים יצאו מאז, לקוראים פרוטסטנטים וקופטים כאחד, ולרוב הנוצרים דוברי הערבית כך פשוט נשמעת הביבליה.
hero.4=בקורא הזה זו הביבליה הערבית היחידה, וזה מה שקובע את התנהגותה. אם מעמידים את הממשק על ערבית, היא שנפתחת — לא משום שנבחרה, כדרך שריינה-ולרה 1909 נבחרה לספרדית, אלא משום שהקטלוג מחפש ביבליה בלשון הממשק ומוצא אחת בדיוק. היא גם אחת משתי מהדורות בלבד כאן שנוסחן רץ מימין לשמאל, והאחרת היא הביבליה העברית בת ימינו. בשלבי השושלת לא רשום לה מקור, כך ששלב הנפתח מתחת לפסוק צונח היישר אל רצפת לשונות המקור המסומנת ב־≈ — וכאן הדבר קולע קרוב מן הרגיל, שכן היוונית שאותה רצפה מספקת היא הטקסטוס רצפטוס, ומן הטקסטוס רצפטוס נעשתה בריתה החדשה.

