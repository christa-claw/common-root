title=Vulgata Clementina — Su questa edizione | Common Root
description=La Vulgata Clementina: la revisione pontificia della Bibbia latina di Girolamo, stampata a Roma nel 1592 e ripubblicata con correzioni nel 1593 e nel 1598 — il testo latino di riferimento della Chiesa cattolica fino al 1979 e, in questo lettore, un piolo sopra la Vulgata.
heroHeading=Vulgata Clementina
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=Nel 1546 il Concilio di Trento dichiarò la Vulgata Bibbia latina autentica della Chiesa, lasciando aperta una domanda a cui non rispose: quale Vulgata? Undici secoli di copiatura a mano non avevano lasciato due manoscritti del tutto uguali, e il concilio chiese un testo corretto. Papa Sisto V ne fornì uno nel 1590, rivisto in buona parte da lui stesso, con una bolla che lo dichiarava autentico. Morì nell'agosto dello stesso anno, e nel giro di poche settimane i cardinali ne avevano fermato la vendita. Sotto Clemente VIII una commissione — Francisco de Toledo tra i curatori, Roberto Bellarmino al centro del lavoro — ne preparò il sostituto, stampato a Roma nel 1592. Ristampe di formato minore nel 1593 e nel 1598 ne eliminarono la maggior parte dei refusi e vi aggiunsero i prologhi di Girolamo e rimandi a margine.
hero.2=Quel testo fu la Bibbia latina di riferimento della Chiesa cattolica per quasi quattro secoli, fino alla Nova Vulgata del 1979, e il messale e il breviario del 1962 lo usano ancora. È la Bibbia di Girolamo come la Chiesa l'aveva ricevuta, non come lui l'aveva lasciata. I Salmi sono il suo salterio gallicano, rivisto sul greco, non la sua traduzione successiva dall'ebraico, e perciò conservano la numerazione greca: il Salmo 22 comincia qui con «Dominus regit me», il salmo del pastore. In 1 Giovanni 5,7 riporta il Comma Johanneum, «Pater, Verbum, et Spiritus Sanctus», un'aggiunta latina che i primi manoscritti greci non hanno. Ester e Daniele compaiono nelle loro forme lunghe, con le aggiunte greche raccolte alla fine di Ester e come gli ultimi due capitoli di Daniele. Il file di eBible.org da cui proviene questa copia stampa il testo del 1598 con la Glossa Ordinaria come note — il commento del XII secolo nato dalla scuola di Anselmo di Laon, nell'edizione di Migne del 1880. Le note non sono entrate nel corpus; le parentesi quadre di alcuni versetti sono della fonte stessa.
hero.3=In questo lettore è un piolo con un solo genitore registrato, la Vulgata latina: apri un piolo sotto uno qualsiasi dei suoi versetti e compare la Vulgata. C'è da aspettarsi che le due si leggano quasi parola per parola allo stesso modo. La Vulgata di questo corpus è a sua volta tratta da un testo clementino, così ciò che le separa è soprattutto la punteggiatura — e i libri che mancano a questa copia. Ne ha 66, i libri del canone protestante, con Ester e Daniele nelle loro forme lunghe. I file di origine contengono anche Tobia, Giuditta, Sapienza, Siracide, Baruc e i due libri dei Maccabei, che la Vulgata sottostante ha tutti; nessuno è arrivato, così dove la Vulgata ha Tobia sopra non c'è nulla. La Preghiera di Manasse e 3 e 4 Esdra, che la Clementina stampava in appendice, non sono né nella fonte né nel corpus. Nulla nel corpus poggia a sua volta su questa edizione.

