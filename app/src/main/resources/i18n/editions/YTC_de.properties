title=Yorumsuz Türkçe Çeviri — Über diese Ausgabe | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): eine moderne türkische Bibel, von İsmail Serinken in Zusammenarbeit mit eBible.org aus der World English Bible übersetzt, lizenziert unter CC BY-ND 4.0 — der türkische Text, auf den dieses Korpus standardmäßig öffnet.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — wörtlich eine „unkommentierte" oder „ungedeutete" türkische Übersetzung — ist eine moderne türkische Bibel, die İsmail Serinken in Zusammenarbeit mit eBible.org fertigstellte, mit Urheberrechtsvermerk von 2023 bis 2025. Der Name selbst benennt die Methode: eine schlichte, Wort-für-Wort-Wiedergabe, die bewusst erklärende Glossen und deutende Umschreibung auslässt und Transparenz zum zugrunde liegenden Text einer geglätteten Idiomatik vorzieht.
hero.2=Dieser zugrunde liegende Text ist, ehrlich gesagt, Englisch und nicht Hebräisch, Aramäisch oder Griechisch: Die eigene Urheberrechtsseite der Übersetzung beschreibt sie als aus der World English Bible wiedergegeben, was sie zu einer sekundären Übersetzung macht statt einer unmittelbar aus den Originalsprachen, anders als die meisten anderen Bibeln in diesem Korpus. Common Root suchte zunächst nach einer offenen Ausgabe der historischen türkischen Bibel von 1941 (Kitabı Mukaddes), die inzwischen alt genug ist, um in der Türkei gemeinfrei zu sein, doch es ließ sich keine brauchbare digitale Quelle dafür finden; die Yorumsuz Türkçe Çeviri war die einzige offen lizenzierte türkische Bibel, die verfügbar war. Der Text dieses Korpus stammt aus der USFM-Distribution von eBible.org, dort katalogisiert als turytc.
hero.3=Ihre Wiedergabe-Entscheidungen tragen einen zeitgenössischen statt traditionellen Zug: Sie gibt Gottes Eigennamen als Yahve wieder statt des gewohnten türkischen „RAB" oder „Yehova", unter Berufung auf 2. Mose 3,14-15, und gibt Jesu Namen als Yeşua wieder statt des vertrauten türkischen İsa, während sie andere Eigennamen in ihrer gewöhnlichen Form lässt. Sie folgt dem gewöhnlichen 66-Bücher-Kanon der protestantischen Bibel, ohne deuterokanonische Bücher.
hero.4=Sie ist die einzige türkische Bibel in diesem Korpus, sodass eine türkische Oberfläche standardmäßig auf ihr öffnet.

