title=Bible in Basic English — À propos de cette édition | Common Root
description=La Bible in Basic English, traduite de l'hébreu et du grec par un comité dirigé par S. H. Hooke et publiée par Cambridge University Press — le Nouveau Testament en 1941, la Bible entière en 1949 — dans le Basic English de C. K. Ogden, fort de 850 mots, auxquels 150 autres furent ajoutés pour la poésie et pour la Bible.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=Le Basic English fut l'œuvre de C. K. Ogden, de l'Orthological Institute : une liste de 850 mots anglais, proposée comme langue auxiliaire internationale. La Bible in Basic English fut réalisée par un comité placé sous la direction de S. H. Hooke (1874–1968), le spécialiste de l'Ancien Testament devenu en 1930 professeur Samuel Davidson d'études vétérotestamentaires à l'université de Londres, en collaboration avec l'Orthological Institute. Elle fut traduite de l'hébreu et du grec, et non simplifiée à partir d'une version anglaise antérieure, puis le texte en Basic fut revu en détail par un comité formé par les Syndics de Cambridge University Press. Aux 850 mots d'Ogden, les traducteurs en ajoutèrent 100 qui aident pour la poésie et 50 nécessaires à la Bible, soit 150 en tout. Cambridge University Press publia le Nouveau Testament en 1941 et la Bible entière en 1949 ; un tirage de 1965 fut diffusé aux États-Unis sans mention de copyright, et c'est pourquoi le texte y est dans le domaine public.
hero.2=Le résultat se lit simplement et uniformément, dans les limites de ce vocabulaire restreint. La Genèse s'ouvre sur « At the first God made the heaven and the earth. » Le Psaume 23 commence par « The Lord takes care of me as his sheep; I will not be without any good thing. » L'Évangile de Jean s'ouvre sur « From the first he was the Word, and the Word was in relation with God and was God, » et Jean 3:16 se lit « For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life. » Le nom divin est partout « the Lord », sauf dans huit versets où il est rendu par « Yahweh », parmi lesquels Exode 6:3, où Dieu dit qu'Abraham, Isaac et Jacob « had no knowledge of my name Yahweh », et Psaume 83:18. Là où l'hébreu était trop incertain pour être traduit, les traducteurs ont mis des points à sa place, et dans notre copie quelques versets, entre autres Job 34:29–33 et Job 36:16–20, ne sont rien d'autre que « ... ».
hero.3=Notre copie contient 66 livres, de la Genèse à l'Apocalypse, sans les apocryphes, dans la numérotation des chapitres et des versets de la King James et de la Revised Version — 150 psaumes, et Malachie qui s'achève au chapitre 4. Elle ne porte aucun titre de psaume : le Psaume 51 commence à « Have pity on me, O God ». Le Nouveau Testament n'est pas une traduction du texte reçu. Seize versets que les éditions critiques omettent, parmi lesquels Matthieu 17:21, Actes 8:37 et Romains 16:24, ne sont conservés ici que comme des places vides marquées [], et 1 Jean 5:7 n'a pas les trois témoins dans le ciel ; le récit de la femme adultère, Jean 7:53–8:11, est entre crochets, tandis que la finale longue de Marc est conservée. Dans ce lecteur, elle se tient seule. Le corpus ne lui enregistre aucun parent, si bien qu'un échelon de filiation ouvert sous l'un de ses versets tombe directement sur le sol des langues originales marqué ≈ : le Codex de Léningrad dans l'Ancien Testament et le Textus Receptus dans le Nouveau, un texte grec que cette traduction ne suit pas en ces seize endroits. Rien n'est non plus enregistré comme reposant sur elle. Aucune langue d'interface ne s'ouvre sur cette édition ; une interface en anglais s'ouvre sur la New International Version, et l'on atteint celle-ci par sa propre carte dans la grille des traductions.

