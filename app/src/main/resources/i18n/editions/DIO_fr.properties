title=Diodati 1649 (italien) — À propos de cette édition | Common Root
description=La bible italienne de Giovanni Diodati : publiée à Genève en 1607, la première faite sur l'hébreu et le grec plutôt que sur la Vulgate, révisée avec ses propres notes en 1641 — et pourquoi la date portée sur le fichier est l'année de sa mort.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati naquit à Genève en 1576, dans une famille de marchands de Lucques qui avaient quitté l'Italie plutôt que de renoncer à leur religion. Il était italien de souche et genevois de formation, et c'est précisément cette combinaison qui explique l'existence de ce livre : il avait la langue du pays que la Réforme n'avait pas atteint, et il se tenait dans la ville qui en était devenue l'imprimerie. Théodore de Bèze le proposa pour la chaire d'hébreu à vingt et un ans. Il devint professeur de théologie en 1606, pasteur en 1608, et succéda à Bèze dans la chaire de théologie l'année suivante ; en 1618 il se rendit au synode de Dordrecht comme délégué de Genève et fut l'un des six hommes chargés d'en rédiger les actes.
hero.2=Sa bible italienne fut imprimée à Genève en 1607. L'Italie avait déjà eu des bibles en langue vulgaire — celle de Malermi en 1471, celle de Brucioli en 1532 —, mais elles travaillaient sur le latin ou s'y appuyaient lourdement. Diodati alla à l'hébreu et au grec, et pour le Nouveau Testament cela signifiait le texte grec que Bèze avait édité dans la même ville une génération plus tôt. En 1641 il donna une édition révisée accompagnée de ses propres notes explicatives, et c'est de celle-là que descendent les réimpressions. Elle devint, et est restée, la bible protestante italienne — ce qui, dans un pays presque sans lectorat protestant, revenait à dire qu'elle fut portée quatre siècles durant par très peu de gens. Il traduisit aussi la bible en français, en 1644 ; on tient généralement celle-là pour la plus faible, et il n'aurait probablement pas plaidé le contraire.
hero.3=La date portée sur la fiche mérite une phrase, car il n'y en a pas. Ce texte circule sous l'étiquette « Diodati 1649 », et 1649 n'est pas une édition — c'est l'année de la mort de Diodati. Les deux dates qui signifient quelque chose sont 1607, quand la traduction parut pour la première fois, et 1641, quand il la révisa. Laquelle des deux un fichier numérique donné représente réellement, ce projet ne l'a pas établi, et le catalogue laisse donc la colonne de l'année vide plutôt que d'imprimer un chiffre dont il ne peut répondre. Le nom est conservé tel qu'il est arrivé, parce que c'est celui que l'on cherchera.
hero.4=Dans ce lecteur, elle est la seule bible italienne, de sorte que mettre l'interface en italien ouvre sur elle — non par choix curaté, comme la Reina-Valera 1909 est choisie pour l'espagnol, mais parce que le balayage du catalogue ne trouve rien d'autre dans la langue. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation, si bien qu'un échelon ouvert sous un verset descend droit au sol des langues originales marqué d'un ≈. Ce sol fournit le Textus Receptus pour le grec, et ici cela approche la vérité de façon inhabituelle : pour la plupart des éditions de ce corpus le Receptus tient lieu d'un texte critique que les traducteurs ont réellement employé, mais Diodati travaillait bel et bien sur un texte grec imprimé de cette famille. Sa pastille d'échelon ne porte pas d'année, ce qui répond au blanc de la fiche.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=italien
fact.2.label=Traducteur
fact.2.value=Giovanni Diodati (1576–1649), né à Genève dans une famille de marchands protestants qui avaient quitté Lucques plutôt que de renoncer à leur religion
fact.3.label=Première publication
fact.3.value=1607, à Genève — la première bible italienne faite sur l'hébreu et le grec plutôt que sur le latin
fact.4.label=Édition révisée
fact.4.value=1641, avec les notes propres de Diodati ; c'est sous cette forme que le texte fut réimprimé pendant les trois siècles suivants
fact.5.label=Pourquoi l'étiquette porte 1649
fact.5.value=1649 est l'année de la mort de Diodati, non celle d'une édition — la date voyage avec le texte numérique, et la fiche du catalogue laisse la colonne de l'année vide plutôt que d'en affirmer une
fact.6.label=Le grec derrière le Nouveau Testament
fact.6.value=les éditions de Bèze, faites à Genève une génération plus tôt — au sein de cette famille de textes grecs imprimés que ce corpus tient pour le [[TR|Textus Receptus]]
fact.7.label=Également de lui
fact.7.value=une bible française, 1644, généralement tenue pour la plus faible des deux — le français n'était pas la langue dans laquelle il pensait
fact.8.label=Contenu
fact.8.value=66 livres — le canon protestant, sans deutérocanoniques
fact.9.label=Dans ce corpus
fact.9.value=la seule bible italienne ici, si bien qu'une interface en italien s'ouvre sur elle ; aucun ascendant n'est enregistré dans les échelons de filiation, et sa pastille d'échelon s'affiche sans année
