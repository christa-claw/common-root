title=Qur'an — Sablukov — About This Edition | Common Root
description=Gordiy Sablukov's Russian translation, published in Kazan in 1878 and usually described as the first Russian rendering of the Qur'an made directly from the Arabic rather than through a French or English intermediary — and, in this corpus, the Russian companion shown beneath the Uthmani Arabic text.
heroHeading=Qur'an — Sablukov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordiy Semyonovich Sablukov (1803-1880) trained for the Russian Orthodox clergy, graduating from the Orenburg Theological Seminary in 1826 and the Moscow Theological Academy in 1830. He spent the next two decades, from 1830 to 1849, teaching history and Eastern languages at the Saratov Theological Seminary — where, in the mid-1840s, one of his pupils was the future radical writer Nikolai Chernyshevsky — before moving in 1849 to the Kazan Theological Academy's missionary department, teaching Eastern and classical languages there until 1862.
hero.2=Russian translations of the Qur'an went back to 1716, when Pyotr Postnikov produced one at Peter the Great's order — but from André du Ryer's French, not from the Arabic, as was Aleksei Kolmakov's of 1792, made from George Sale's English. Sablukov's, published in Kazan in 1878 as "Коран, законодательная книга мохаммеданского вероучения" ("The Qur'an, the Legislative Book of the Mohammedan Creed"), is usually credited as the first Russian Qur'an translation made directly from the Arabic original, the product of his years teaching Eastern languages at Kazan.
hero.3=He followed it the next year with a companion volume of notes, "Приложения к переводу Корана" (1879), and later two further studies connected to it: "Сведения о Коране" ("Information about the Qur'an," 1884) and an earlier comparative tract on Christian and Muslim teaching concerning the names of God (1873). His translation has stayed among the more widely circulated Russian versions ever since, even after later renderings — among them Ignaty Krachkovsky's posthumously published one — became better known in Soviet and post-Soviet academic use.
hero.4=What is digitised here, via alquran.cloud's ru.sablukov edition, is offered in this corpus as the Russian companion to [[Q-AR|the Uthmani Arabic text]], alongside the English of [[Q-EN|Pickthall]] (1930) and [[Q-YA|Yusuf Ali]] (1934) — the three translations a survey of available renderings found unambiguously free to use, one per language besides Arabic.

