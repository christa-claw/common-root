fact.2.value=Robert Young (1822–1888), impresor, librero y lingüista autodidacta de Edimburgo, compilador de la Analytical Concordance to the Bible
fact.3.label=Antiguo Testamento de
fact.3.value=El texto hebreo masorético recibido, la tradición a la que pertenece también [[WLC|el Códice de Leningrado]] de este corpus
fact.4.label=Nuevo Testamento de
fact.4.value=El texto griego recibido, [[TR|el Textus Receptus]], conservado, escribió Young, «no porque se lo tenga por perfecto», sino porque la traducción y la crítica textual son tareas distintas
fact.5.label=Clase de traducción
fact.5.value=Estrictamente literal: los tiempos del original se mantienen aun donde el inglés suena extraño, de modo que el relato discurre a menudo en presente; una palabra inglesa por cada palabra del original en lo posible, con olam y aiōn como «age» y «age-during»; las palabras añadidas por el sentido, entre corchetes; el nombre divino como «Jehovah»
fact.6.label=Publicada
fact.6.value=Edimburgo, 1862; revisada por Young, 1887; tercera edición, revisada de nuevo por sus editores, Edimburgo, enero de 1898: el texto que hay aquí
fact.7.label=Licencia
fact.7.value=Dominio público; esta copia, de eBible.org
fact.8.label=En este corpus
fact.8.value=66 libros, el canon protestante completo, sin los apócrifos; numeración inglesa de capítulos y versículos, de modo que los salmos son 150 y el título de cada uno va incorporado a su primer versículo
fact.9.label=Linaje
fact.9.value=Sin antecesor registrado y sin nada registrado que se apoye en ella: un peldaño se abre directamente en el suelo de lenguas originales, [[WLC|el Códice de Leningrado]] en el Antiguo Testamento y [[TR|el Textus Receptus]] en el Nuevo; [[LSV|la Literal Standard Version]] de 2020 revisa la obra de Young, pero el corpus no registra el vínculo
