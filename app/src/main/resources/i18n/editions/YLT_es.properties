title=Young's Literal Translation — Acerca de esta edición | Common Root
description=La traducción literal de la Biblia de Robert Young, publicada por primera vez en Edimburgo en 1862, revisada por Young en 1887 y por sus editores en 1898: una Biblia inglesa que conserva los tiempos verbales, el orden de las palabras y, en lo posible, el vocabulario del hebreo y del griego, incluso donde al inglés le cuesta seguirlos.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) fue impresor y librero en Edimburgo. Aprendió por su cuenta hebreo y varias otras lenguas orientales mientras hacía su aprendizaje de impresor, dirigió una imprenta misionera en Surat, en la India, de 1856 a 1861, y se le recuerda sobre todo por dos libros: la concordancia Analytical Concordance to the Bible y esta traducción. Publicó la Literal Translation en Edimburgo en 1862 y una edición revisada en 1887. Diez años después de su muerte, en enero de 1898, sus editores sacaron una tercera edición, revisada una vez más «según sus líneas actuales»; ese es el texto de este corpus. Young tradujo el Antiguo Testamento del hebreo masorético recibido y el Nuevo Testamento del texto griego recibido, el Textus Receptus, y dijo claramente que no intentaría formar un texto nuevo de ninguno de los dos: la traducción, escribió, es una tarea distinta de la crítica textual, y pocos están capacitados para ambas.
hero.2=Todo su propósito es dejar que un lector inglés vea la gramática del original. Young sostenía que una versión que da un presente donde el original tiene un pasado, o «an a for a the», un artículo indefinido por uno definido, deja de lado la inspiración verbal, y tradujo en consecuencia. Las formas verbales hebreas pasan como tiempos ingleses, de modo que el relato discurre a menudo en presente: el Génesis empieza «In the beginning of God's preparing the heavens and the earth —» y sigue «and God saith, ‘Let light be;’ and light is.» Las palabras añadidas por el sentido van entre corchetes: «Jehovah [is] my shepherd, I do not lack.» Procuró dar a cada palabra hebrea o griega un único equivalente inglés siempre que pudo, y por eso el hebreo olam y el griego aiōn se vuelven «age» y «age-during» en lugar de «ever» y «eternal»; en Mateo 25:46 los justos van «to life age-during». El nombre divino aparece en todo el Antiguo Testamento como «Jehovah».
hero.3=Nuestra copia está completa: 66 libros, de Génesis a Apocalipsis, sin los apócrifos, en la numeración inglesa de capítulos y versículos: 150 salmos, con el título de cada salmo incorporado a su primer versículo, y Malaquías que termina en el capítulo 4. Como traducción del texto recibido, contiene los pasajes que las ediciones críticas posteriores ponen en duda, desde el final largo de Marcos hasta los tres testigos en el cielo de 1 Juan 5:7, que este texto pone entre corchetes, igual que todo Hechos 8:37. En este lector se sostiene por sí misma. El corpus no le registra ningún antecesor, de modo que un peldaño del linaje abierto bajo uno de sus versículos cae directamente al suelo de lenguas originales marcado con ≈: el Códice de Leningrado en el Antiguo Testamento y el Textus Receptus en el Nuevo. Ese suelo está cerca de lo que el propio Young tradujo, el hebreo masorético y el griego recibido, aunque no en las mismas impresiones. Tampoco hay nada registrado que se apoye en ella. La Literal Standard Version de 2020, también en este corpus, se presenta como una revisión mayor de la obra de Young, pero el corpus no registra ese vínculo, así que los peldaños bajo la LSV no conducen aquí. Ningún idioma de la interfaz se abre en esta edición; una interfaz en inglés se abre en la New International Version, y a esta se llega desde su propia tarjeta en la cuadrícula de traducciones.

