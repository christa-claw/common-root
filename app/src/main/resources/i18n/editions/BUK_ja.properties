title=サヒーフ・アル=ブハーリー — この版について | Common Root
description=サヒーフ・アル=ブハーリー——スンニ派イスラームがクルアーンに次ぐ権威を認めるハディース集。ムハンマド・アル=ブハーリーが自ら検証した約600,000件の伝承の中から、信頼できる伝達者による切れ目のない伝達経路を備えたものだけを採録して編んだ。
heroHeading=サヒーフ・アル=ブハーリー
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=ムハンマド・イブン・イスマーイール・アル=ブハーリーは、主にメッカの聖モスクとメディナの予言者モスクという二つのモスクでこの集成を編み、故郷ブハラにおいてヒジュラ暦232年（西暦846年）頃に完成させた。生涯の最後およそ二十年は、旅を続けながらこれをさらに改訂することに費やしたという。正式な書名、al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi は、通常サヒーフ・アル=ブハーリーと略される——「アル=ブハーリーの信頼できる[集成]」という意味である。アル=ブハーリー自身は、自ら検証した約600,000件のハディース伝承の中からこれを選び出したと語ったと伝えられ、ある伝承を採録するのは、彼の判断で、元の出処まで信頼できる伝達者が切れ目なく連なる経路を備えている場合に限られたという。
hero.2=この基準こそが、この書物が持つ重みの理由である。サヒーフ・アル=ブハーリーはスンニ派イスラームの六書（クトゥブ・スィッタ）の第一に数えられ、方法と評価の両面で最も近い競争相手であるサヒーフ・ムスリムと合わせて、両者はサヒーハイン——「二つの信頼できるもの」——と呼ばれる。大半のスンニ派学者は、アル=ブハーリーの集成を他のどのハディース集よりも上に置き、権威においてクルアーンそのものに次ぐ位置に置いているが、少数の学者はサヒーフ・ムスリムの優位をかわりに主張してきた。資料は伝達者や年代ではなく主題によって整理されており（学者たちはこれをムサンナフと呼ぶ）、儀礼的な清めと礼拝から、商取引、婚姻、先行する預言者たちの生涯、そして終末の時のしるしに至る諸巻（クトゥブ）に分けられている。
hero.3=この書物に実際にいくつのハディースが含まれるかは、どの印刷の伝統で数えるかによって変わる。今日もっとも多く引用される数字7,563は、編者ムハンマド・フアード・アブドゥルバーキーが二十世紀にこの本文に与えた番号づけに由来し、あるハディースが別の章のもとで繰り返されるたびに改めて数える方式である。重複を取り除くと、イブン・ハジャル・アル=アスカラーニーは2,602と数えた。他の学者たちはさらに別の総数を提案している。このコーパス自身の数はまた三番目の数字であり、98巻・7,589件の番号付きハディースというのは、単にそれが取られたデジタル版そのものの形であって、どれか特定の印刷番号づけを正確に再現するという主張ではない。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-bukhari 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスがクルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=ムハンマド・イブン・イスマーイール・アル=ブハーリー（ヒジュラ暦194–256年 / 西暦810–870年）
fact.3.label=正式な書名
fact.3.value=al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi——通常サヒーフ・アル=ブハーリーと略される
fact.4.label=編纂地と時期
fact.4.value=主にメッカの聖モスクとメディナの予言者モスクで編まれ、ブハラにおいてヒジュラ暦232年（西暦846年）頃に完成
fact.5.label=方法
fact.5.value=アル=ブハーリーが信頼できると判断した伝達者の切れ目ない経路を備えたハディースのみを採録する。自ら検証した約600,000件の伝承の中から集成を選び出したと伝えられる
fact.6.label=位置づけ
fact.6.value=スンニ派イスラームの六書（クトゥブ・スィッタ）の第一書。[[MUS|サヒーフ・ムスリム]]とともに「サヒーハイン」を成し、権威においてクルアーンに次ぐ二つの集成とされる
fact.7.label=ハディースの数
fact.7.value=広く使われるアブドゥルバーキー番号づけでは重複を含め7,563件、重複を除くイブン・ハジャル・アル=アスカラーニーの数え方では2,602件；印刷版は章とハディースの番号づけの両方で異なる
fact.8.label=このコーパスでは
fact.8.value=98巻・7,589件の番号付きハディース——これは元となったデータセット自体の形であり、特定の印刷番号づけの再現ではない
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-bukhari 版から取られ、アラビア語の下に並置の形で示される。どの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語のマトンは古典的なパブリックドメインの本文である。英訳のライセンスはまだ確認中である
