title=Kirkkoraamattu 1933/38 — Bu Baskı Hakkında | Common Root
description=Kirkkoraamattu 1933/38: Fin kilise Kutsal Kitabı; İbraniceden ve Yunancadan yeniden çevrildi ve iki yarım hâlinde, 1933'te ve 1938'de kabul edildi — bir komisyon yaklaşık yetmiş yıl üzerinde çalıştıktan sonra.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=Ad iki tarihtir, çünkü kitap iki yarım hâlinde geldi. Finlandiya Evanjelik Luteryen Kilisesi Eski Antlaşma'yı 1933'te, Yeni Antlaşma'yı 1938'de kabul etti; Fince onu o gün bugündür 1933/38 kilise Kutsal Kitabı diye anar. Sondaki bu tarihler başlangıcın ne kadar geride kaldığını gizler: çeviri komisyonu daha 1861'de kurulmuştu. Yaklaşık yetmiş yıl ve birden fazla çevirmen kuşağı, görevlendirmeyi tamamlanmış Kutsal Kitap'tan ayırır.
hero.2=Komisyonun ortaya koyduğu şey bir gözden geçirme değil, yeni bir çeviriydi. Eski Antlaşma'nın İbranicesinden ve Yeni Antlaşma'nın Yunancasından çalıştı — Latince, Almanca ya da İsveççe aracılarla değil, o sırada zaten kullanımda olan Fince Kutsal Kitap'tan da değil. Yine de bilinçli olarak onun, bir buçuk yüzyıl boyunca kilisenin metni olan Biblia 1776'nın ardılıydı ve eski kitabın söz varlığından ve tartımından hayli şey korudu. 1938'de tamamlanmış bir Kutsal Kitap'ın daha ilk okurlarına eskimiş gelmesinin ve bugün hâlâ Fince kutsal metnin ağırbaşlı üslubunu taşımasının nedeni bu mirastır. 1992'ye dek resmî kilise Kutsal Kitabı olarak kaldı.
hero.3=Bu okuyucuda iki iş görür. Arayüzü Fince yapın, açılan baskı budur — kataloğun kendi sıralaması size bunun yerine Biblia 1776'yı verirdi; dolayısıyla Fince varsayılanı alfabenin rastlantısı değil, bilinçli bir seçimdir. Aynı zamanda Fin soy zincirinin en üst basamağıdır: KR3338 ayetinin altında bir basamak açın, altında Biblia 1776 belirir. O basamağı bir kaynak olarak değil, aynı kilisenin Kutsal Kitabı içindeki ardıllık olarak okuyun; çünkü 1933/38 çevirmenlerinin önünde İbranice ile Yunanca vardı, 1776 metni değil. Biblia 1776'nın altında zincir sürer: 1776'nın gözden geçirdiği 1642 tarihli Biblia, sonra o komisyonun kendi sırasında gözden geçirdiği Agricola'nın 1548 tarihli Fincesi ve çalışırken yanlarında açık duran Luther'in 1545 tarihli Almancası. Merdiven İbranice ile Yunancaya ancak bunların altında ulaşır.

