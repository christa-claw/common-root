title=Svenska 1917 — इस संस्करण के विषय में | Common Root
description=स्वीडिश चर्च का 1917 का अनुवाद — Gustav V:s bibel — पहली स्वीडिश बाइबिल जो पिछली से संशोधित होने के बजाय सीधे इब्रानी और यूनानी से बनाई गई, और इस संग्रह की एकमात्र स्वीडिश बाइबिल।
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=साढ़े तीन शतकों तक स्वीडिश चर्च के पास एक ही बाइबिल थी, जो संशोधित तो हुई पर कभी नए सिरे से नहीं बनी। गुस्ताव वासा की 1541 की बाइबिल, स्वीडिश में छपी पहली पूर्ण बाइबिल, मार्टिन लूथर की जर्मन पर भारी रूप से टिकी थी। गुस्ताव द्वितीय एडोल्फ़ की 1618 की बाइबिल ने उसे संशोधित किया, और 1703 का Karl XII:s bibel — जो एक राजा के शासनकाल में पूरा हुआ यद्यपि उससे पहले उसके पिता ने इसका आदेश दिया था — उसी विरासत में मिली स्वीडिश को एक पग और आगे ले गया। तीनों में से किसी ने भी नए सिरे से आरम्भ नहीं किया।
hero.2=1773 में गुस्ताव तृतीय ने एक बाइबिल आयोग नियुक्त किया कि वह वह करे जो उन संशोधनों में से किसी ने नहीं किया था: पुरानी स्वीडिश को एक बार फिर आगे ले जाने के बजाय सीधे इब्रानी और यूनानी से अनुवाद करना। आयोग 144 वर्ष तक बैठा रहा। उसका परिणाम — गुस्ताव वासा के बाद और Bibel 2000 से पहले स्वीडन का दूसरा पूर्ण बाइबिल अनुवाद — गुस्ताव पंचम के शासनकाल में 1917 में पूरा और प्रमाणित हुआ, और इसी कारण इसे अब भी अक्सर Gustav V:s bibel कहा जाता है।
hero.3=पुराना नियम, अपने पहले के संस्करणों की भाँति, मासोरेटिक इब्रानी पाठ पर टिका है। नया नियम उनकी रेखा को आगे नहीं बढ़ाता: यह उस टेक्स्टस रेसेप्टुस के बजाय, जिस पर इस संग्रह की सुधार-युगीन बाइबिलें टिकी हैं, आयोग के पास 1917 तक उपलब्ध सबसे अद्यतन समीक्षात्मक यूनानी पाठ का अनुसरण करता है।
hero.4=इस पाठक में यह एकमात्र स्वीडिश बाइबिल है, इसलिए अंतरफलक को स्वीडिश पर रखने से यही खुलती है — इसलिए नहीं कि इसे चुना गया हो, जैसे स्पेनिश के लिए Reina-Valera 1909 चुनी गई है, बल्कि इसलिए कि सूची की छानबीन को उस भाषा में और कुछ नहीं मिलता। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं, अतः किसी पद के नीचे खुला पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है। वह तल यूनानी के लिए टेक्स्टस रेसेप्टुस देता है, और यहाँ यह सामान्य से अधिक सत्य से दूर पड़ता है: आयोग ने एक अधिक अद्यतन समीक्षात्मक पाठ के लिए जानबूझकर टेक्स्टस रेसेप्टुस को पीछे छोड़ दिया, अतः इस अनुवाद के किसी पद के नीचे का तल एक ऐसे यूनानी पाठ का नाम लेता है जो वह पाठ नहीं है जिसका इसने वास्तव में अनुसरण किया।

