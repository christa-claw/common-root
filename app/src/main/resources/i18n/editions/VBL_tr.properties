title=Versión Biblia Libre — Bu Baskı Hakkında | Common Root
description=Versión Biblia Libre: Free Bible Ministry'nin, Jonathan Gallagher ve Shelly Barrios de Avila tarafından İngilizce Free Bible Version'ın İspanyolca kardeşi olarak çevrilen ve her türlü kullanım için serbestçe lisanslanmış İspanyolca Kutsal Kitabı.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — "Kutsal Kitabın Özgür Sürümü" — İngilizce Free Bible Version'ın İspanyolca kardeşidir; aynı yayıncı, Maryland'in Laurel kentinde kâr amaç gütmeyen bir kuruluş olan Free Bible Ministry tarafından yayımlanır. Yeni Antlaşması, Gustavo Sanabria ve Rebekah Põldaas'ın katkıda bulunanlar olarak yer aldığı, çevirmenler Jonathan Gallagher ve Shelly Barrios de Avila'ya mal edilir ve 2018–2020 tarihli telif hakkını Gallagher ile Barrios de Avila adına taşır. İngilizce kardeşi gibi, telif hakkı sayfasını kullanımın önünde bir engel olmaktan çıkarmak için var olmuştur: metin, herkes tarafından telif ücreti ödenmeden ve izin istenmeden kopyalanabilir, basılabilir, çevrimiçi yayımlanabilir veya uyarlanabilir.
hero.2=Yayımlanan önsöz, Yeni Antlaşma'nın temelini açıkça belgeler — doğrudan Kutsal Kitap derneklerinin kullandığı eleştirel metin olan Yunanca Nestle–Aland metninden çevrilmiştir — ancak bu derlemenin taşıdığı baskı altmış altı kitaplık tam Protestan kanonu olmasına karşın, Eski Antlaşma için ayrıca bir kaynak metin adlandırmaz. Malzemelerin bir boşluk bıraktığı yerde, burada da bir tahminle doldurulmak yerine boş bırakılmıştır.
hero.3=Bu okuyucuda beş İspanyolca baskıdan biridir. İspanyolca arayüz varsayılan olarak hâlâ, bambaşka ve yüzyıllar daha eski bir gelenekten gelen kamu malı bir metin olan [[RVR09|Reina-Valera 1909]]'u açar; bu baskıya ise [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] ve [[NBLA|Nueva Biblia de las Américas]] ile birlikte kendi kartından ulaşılır. Bunların hiçbirinin gözden geçirilmesi değildir, bu yüzden soy basamaklarında ona kayıtlı bir kaynak metin yoktur — Versión Biblia Libre'nin bir ayetinin altında açılan bir basamak, doğrudan ≈ ile imlenen özgün diller tabanına iner. Bu derlemedeki en yakın akrabası hiç de İspanyolca değildir: aynı kuruluşun aynı lisans altındaki İngilizce çevirisi [[FBV|Free Bible Version]].

