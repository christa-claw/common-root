title=Baibal Olcim — Informazioni su questa edizione | Common Root
description=Baibal Olcim: la Bibbia in matu chin, lingua minoritaria dello Stato Chin, in Myanmar, distribuita da eBible.org come testo genuinamente di pubblico dominio, di cui non sono noti né il traduttore né la data di traduzione.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Il matu chin — detto anche matupi chin — è una lingua sino-tibetana parlata da circa 34.000 persone, concentrate intorno a Matupi, nel sud dello Stato Chin, in Myanmar, con comunità imparentate al di là del confine, nello Stato indiano del Mizoram. Baibal Olcim è la Bibbia in questa lingua, ed è l'unico testo in matu chin presente in questo corpus.
hero.2=Ciò che la fonte non fornisce è chi l'abbia tradotta, né quando. eBible.org, che distribuisce il testo, dichiara solo che è di pubblico dominio, e lo cataloga sotto hlt, il codice ISO 639-3 del matu chin — nessun traduttore, nessun comitato, nessuna data di traduzione. Questa pagina lascia entrambe le cose in bianco piuttosto che indovinarle. Lo stesso codice ha qui una sua piccola storia: un precedente tentativo di aggiungere a questo corpus una seconda Bibbia in hindi fu archiviato sotto hlt per la somiglianza della sigla, finché versetti in matu chin comparsi dove ci si aspettava l'hindi non rivelarono l'errore. Questa edizione è quella che è stata davvero verificata rispetto alla lingua indicata dal suo codice.
hero.3=È stata aggiunta per ciò che è, non per la sua lunghezza: una Bibbia genuinamente di pubblico dominio, non solo concessa in licenza, nella lingua di una minoranza cristiana che ha subito una persecuzione reale nel conflitto civile del Myanmar, concentrato nello Stato Chin e nei suoi dintorni. Un lettore costruito per non chiedere nulla a chi lo usa, e per non tracciare nessuno di loro, è pensato esattamente per un caso come questo — il che spiega anche in gran parte perché questa pagina abbia così poco altro da mettere tra i suoi dati.

