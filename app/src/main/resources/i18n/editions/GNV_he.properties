fact.8.label=התנגד לה
fact.8.value=ג'יימס הראשון, שראה בהערות השוליים הסתה — תלונה שסייעה להניע את [[KJV|תרגום המלך ג'יימס]]
fact.9.label=שנה בקטלוג
fact.9.value=ריקה בכרטיס «אודות», אף שתווית השלב נוקבת GNV 1599 — ביבליית ז'נבה נדפסה מחדש מ־1560 ועד שנות ה־1640, כשהברית החדשה וההערות מתחלפות תחת שם אחד
fact.10.label=באוסף זה
fact.10.value=כל 66 הספרים, בלי ספרים חיצוניים, הכתיב לא עודכן — בראשית א׳:א׳ נקרא “the heauen and the earth”
fact.11.label=תחת שלב
