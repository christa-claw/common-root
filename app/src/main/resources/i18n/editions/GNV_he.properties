title=ביבליית ז'נבה 1599 — על מהדורה זו | Common Root
description=ביבליית ז'נבה: נעשתה בידי פרוטסטנטים אנגלים בגלות בז'נבה, הביבליה האנגלית הראשונה עם מספור פסוקים מלא והערות שוליים, שקרא דורו של שייקספיר, והשלב שמתחת לתרגום המלך ג'יימס.
heroHeading=ביבליית ז'נבה 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=הביבליה הזאת נעשתה בחוץ לארץ, בידי אנשים שלא יכלו להישאר בבית בבטחה. כשעלתה מרי הראשונה לכס המלכות ב־1553 ואנגליה שבה אל רומא, עזבו כמה מאות פרוטסטנטים; אחדים מהם התיישבו בז'נבה של קלווין, שהיו בה בתי דפוס, למדנות עברית ויוונית, ולא היה בה בישוף שיש לתת לו דין וחשבון. ויליאם ויטינגהאם פרסם שם ברית חדשה ב־1557. צוות בראשות אנתוני גילבי עבר על הברית הישנה, והביבליה השלמה נדפסה בז'נבה בידי רולנד הול ב־1560, שנתיים לאחר מות מרי, כשרוב הגולים כבר שבו לביתם.
hero.2=מה שהם עשו שינה את מראֶהָ של ביבליה אנגלית. זו הייתה הראשונה שמיספרה כל פסוק, כך שאפשר היה להפנות קורא לשורה ולא לפרק. היא נסדרה באות רומית ולא בגותית, ויצאה קטנה וזולה די הצורך כדי שתהיה בבעלות אדם ולא כבולה בשלשלת לעמוד הקריאה. והשוליים היו מלאים: הפניות, ביאורים למילים קשות, מפות, והערות המסבירות מה פירושו של קטע. דווקא האחרון הוא הסיבה שאהבו אותה ושהתמרמרו עליה. ההערות רפורמיות, ובמקומות אף חדות, והן אומרות לקורא מה לחשוב על מלכים באותה נכונות שבה הן אומרות לו מה לחשוב על עיקרי אמונה.
hero.3=התאריך שעל מהדורה זו מחייב הסתייגות, שכן ביבליית ז'נבה לא הייתה ספר אחד אלא נוסח שנדפס מחדש שמונים שנה בעוד חלקיו מתחלפים. ב־1576 החליף לורנס טומסון את הברית החדשה בהגהה משלו, שנעשתה מול מהדורת תיאודור בזא היוונית של 1565, ומ־1587 זוהי הברית החדשה שרוב ביבליות ז'נבה נושאות. ב־1599 נוספו הערותיו של פרנציסקוס יוניוס לחזון יוחנן. “1599”, אפוא, מציין הרכב — הברית החדשה של טומסון יחד עם יוניוס על חזון יוחנן — יותר משהוא מציין שנת דפוס, וביבליות הנושאות תאריך זה הוסיפו להידפס אחריו. משום כך משאיר כרטיס הקטלוג את השנה ריקה, בעוד תווית השלב, הזקוקה למשהו קצר להצגה, נוקבת GNV 1599.
hero.4=מקומה באוסף הזה הוא ציר. שרשרת השושלת הארוכה ביותר כאן עוברת מ־World English Bible אל American Standard Version, אל Revised Version, אל תרגום המלך ג'יימס, ומשם אל זו: פִּתחו שלב אחד נוסף מתחת לפסוק מתרגום המלך ג'יימס, ונוסח ז'נבה יופיע מתחתיו — הדרך הפשוטה ביותר לראות כמה מתרגום המלך ג'יימס הוא ירושה ולא חיבור. מתחת לז'נבה אין עוד דבר באנגלית — רק היוונית והעברית, Textus Receptus וכתב יד לנינגרד של ווסטמינסטר, ששם מגיע הסולם לרצפתו. הנוסח ניתן כפי שהמהדורה נושאת אותו, כתיב ועוד, כך שבראשית א׳:א׳ אומר heauen; כותרות המזמורים והקולופון של האיגרת אל העברים רצים בתוך פתח הפסוק הראשון, כפי שסידרו אותם אותם דפוסים, והושארו שם ולא נוקו החוצה.

