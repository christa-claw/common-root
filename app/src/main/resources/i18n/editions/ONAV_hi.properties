title=खुला नया अरबी संस्करण — इस संस्करण के विषय में | Common Root
description=Biblica का खुला नया अरबी संस्करण: एक आधुनिक अरबी बाइबिल, जिसका प्रतिलिप्यधिकार 1988, 1997 और 2012 का है, Creative Commons अनुज्ञप्ति के अधीन प्रकाशित, जो इसे श्रेय के साथ साझा करने, अनुकूलित करने और मुद्रित करने की अनुमति देती है।
heroHeading=Biblica का खुला नया अरबी संस्करण
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=यह एक आधुनिक अरबी अनुवाद है, [[SVD|स्मिथ एवं वान डाइक]] से भिन्न पाठ, न कि उसकी एक और प्रतिलिपि। इसे Biblica, Inc. द्वारा प्रकाशित किया जाता है, जिसकी प्रतिलिप्यधिकार सूचना तीन वर्ष धारण करती है: 1988, 1997 और 2012। पाठ का अपना प्रतिलिप्यधिकार पृष्ठ इसका पुराना नाम देता है, Ketab El Hayat Majani।
hero.2=इस पाठक में इसे जो विशिष्ट बनाता है वह इसकी अनुज्ञप्ति है। Biblica ने इसे Creative Commons एट्रिब्यूशन-शेयरअलाइक 4.0 अनुज्ञप्ति के अधीन एक "खुले" पाठ के रूप में प्रकाशित किया: कोई भी इसे प्रतिलिपि कर सकता है, अनुकूलित कर सकता है और मुद्रित कर सकता है, बशर्ते Biblica को श्रेय दिया जाए और इससे बनाई गई कोई भी चीज़ उन्हीं शर्तों पर साझा की जाए। Biblica जो श्रेय-पंक्ति माँगता है वह है: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible"। अधिकांश आधुनिक अनुवाद इस प्रकार प्रस्तुत नहीं किए जाते, और इसीलिए यह यहाँ है।
hero.3=अनुज्ञप्ति की एक शर्त जानने योग्य है। अपरिवर्तित पाठ Biblica का नाम धारण कर सकता है। पुनर्व्यवस्थित पाठ नहीं कर सकता: इस साइट के घटना-क्रम और लेखन-क्रम संस्करण पुस्तकों को भिन्न अनुक्रम में रखते हैं, जिसे हम अनुकूलन मानते हैं, इसलिए वे कहते हैं कि पाठ को पुनर्व्यवस्थित किया गया है और Biblica के नाम को शीर्षक के रूप में उपयोग नहीं करते।
hero.4=फ़ाइल पूर्णतः स्वरांकित है। इसके स्रोत का एक विवरण: प्रेरितों के काम 15:25 और 26 एक ही पद के रूप में मुद्रित हैं, इसलिए यह संग्रह उन्हें पद 25 के अधीन साथ रखता है और वहाँ कोई अलग पद 26 नहीं है।

