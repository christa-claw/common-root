title=Koranen — uthmani — Om denna utgåva | Common Root
description=Koranen i läsarten hafs efter asim, texten som ligger till grund för de flesta tryckta koraner i världen sedan Kairoutgåvan 1924 — och i detta korpus en text som jämförts vers för vers med King Fahd-komplexets eget exemplar och visat sig överensstämma i konsonantstommen i samtliga dess 6 236 verser.
heroHeading=Koranen — uthmani
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=Läsarten bakom denna text har en namngiven kedja. Hafs ibn Sulaiman al-Kufi (d. 796) förde den vidare från sin lärare, Asim ibn Abi al-Najud, en av Kufas läsare vars recitation Ibn Mujahid senare kanoniserade bland de sju (Asim dog 745). Hafs efter Asim — "Hafs, enligt Asim" — är en av flera läsarter som muslimer håller för lika auktoritativa återgivningar av samma uppenbarelse; den är inte den enda, men den är i särklass den mest tryckta. När en kommitté av al-Azhar-lärda, verksam från 1907 under kung Fuad I, tog fram den egyptiska standardkoranen som Amiri-tryckeriet i Bulaq gav ut den 10 juli 1924, var det denna läsart de fastställde i trycket. De flesta koraner som säljs var som helst idag, inklusive King Fahd-komplexets egen, följer den utgåvans exempel.
hero.2=Vad som finns i detta korpus hämtas, via alquran.clouds utgåva quran-uthmani, från Tanzilprojektets digitalisering av samma hafs-text. Den parar i läsaren med tre översättningar: Pickthalls engelska från 1930, Yusuf Alis engelska från 1934 och Sablukovs ryska från 1878 — öppna någon av de tre bredvid den här, och dess återgivning visas under varje vers. Läsaren erbjuder också Koranen i två ordningar: den kanoniska mushaf-ordningen som samma tradition fastställde, och den ordning forskare rekonstruerar för när varje sura uppenbarades.
hero.3=Att bevaras bokstavstroget är i sig ett av de påståenden som görs om denna text, så här kontrolleras det snarare än antas. Jämförd vers för vers med King Fahd-komplexets eget hafs-exemplar för tryckning av den ärorika Koranen, är de två texterna överens om konsonantstommen — de bara bokstäverna, innan någon vokaltecken läggs till — i samtliga dess 6 236 verser. Varje funnen skillnad begränsas till hur vokaler och pausmärken anges, till stavningen av hamza och till åtta ställen där de två sidorna drar en ordgräns olika; inget av det rör en enda bokstav i texten självt. Det är motsatsen till den osäkerhet detta korpus måste medge för den finska Bibeln från 1776, där man helt enkelt inte vet vilken tryckning texten härstammar från.
hero.4=Två saker som den överensstämmelsen inte visar är värda att säga rent ut. Det är inte ett påstående om härkomst — att stämma med komplexets text visar att de två är samma text, inte att den ena kopierades från den andra. Och det är inte ett tillstånd: en begäran som skickades till komplexet i slutet av augusti 2026, med en förfrågan om tillstånd att visa dess egna riwaya-filer, hade inte besvarats vid den här texten skrevs. Den enda vers där själva jämförelsen kort tycktes vara oenig, 19:3, visade sig vara ett fel i hur referensfilen lästs, inte i någon av koranerna — rättat stämmer det exakt. Själva referenskopian är en rekonstruktion av komplexets ordbehandlingsfil, inte dess officiella digitala utgåva, vilket är den enda aspekt där detta inte helt är en jämförelse med ett officiellt publicerat dataset.

