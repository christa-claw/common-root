fact.2.label=Läsart (qira'ah)
fact.2.value=Hafs efter Asim — förd vidare av Hafs ibn Sulaiman (d. 796) från Asim ibn Abi al-Najud i Kufa (d. 745); en av de fjorton erkända återgivningarna, och den som de flesta tryckta koraner i världen följer
fact.3.label=Standardiserad tryckt form
fact.3.value=Kairoutgåvan 1924 — en kommitté av al-Azhar-lärda, verksam från 1907 under kung Fuad I, tryckt av Amiri-tryckeriet i Bulaq den 10 juli 1924; förlagan som de flesta senare tryckningar, inklusive King Fahd-komplexets egen, följer
fact.4.label=Texten som används här
fact.4.value=alquran.clouds utgåva quran-uthmani, vars arabiska text kommer från Tanzilprojektets digitalisering
fact.5.label=Jämförd med
fact.5.value=King Fahd-komplexets eget hafs-exemplar för tryckning av den ärorika Koranen, vers för vers: överens om konsonantstommen i samtliga dess 6 236 verser, med varje skillnad begränsad till vokalbeteckning, hamza-stavning och åtta fall av ordindelning
fact.6.label=Vad den överensstämmelsen inte visar
fact.6.value=härkomst — överensstämmelse är inte härstamning — och inte heller tillstånd: en begäran till komplexet om att visa dess egna filer, skickad i slutet av augusti 2026, hade inte besvarats vid den här texten skrevs
fact.7.label=Parallellöversättningar i detta korpus
fact.7.value=[[Q-EN|Pickthalls engelska]] (1930), [[Q-YA|Yusuf Alis engelska]] (1934) och [[Q-SAB|Sablukovs ryska]] (1878) — tre översättningar som paras med denna grundtext under varje vers
fact.8.label=I detta korpus
fact.8.value=den enda arabiska text som varje [[Q-EN|översättning]] här paras med; i kontrast [[FB1776|den finska Bibeln från 1776]], där man helt enkelt inte vet vilken tryckning texten härstammar från
fact.9.label=Licens
