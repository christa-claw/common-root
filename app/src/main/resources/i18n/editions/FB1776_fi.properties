# The narrative, one paragraph per key, in order.
hero.1=Suomen kolmas Raamattu ja se, joka jäi. Kyse on tarkistuksesta eikä uudesta käännöksestä: linja kulkee Florinuksen vuosien 1683–85 laitoksen kautta vuoden 1642 Bibliaan, ensimmäiseen täydelliseen suomenkieliseen Raamattuun. Tarkistuksen teki Anders (Antti) Lizelius, joka oli toimittanut jo vuoden 1758 raamatunlaitoksen. Vuoden 1776 laitos muutti oikeinkirjoituksen ja sen mukana ulottuvuuden. Se oli ensimmäinen suomalainen Raamattu uudistetussa ortografiassa ja ensimmäinen kotikäyttöön painettu eikä vain saarnastuolia varten tehty. Raamattu, jonka perhe voi omistaa, on toinen esine kuin Raamattu, jonka seurakunta omistaa. Väliin jäävissä laitoksissa ei ollut kyse pelkästä oikeinkirjoituksesta. Vuoden 1685 laitoksen valmisti Paimion rovasti Henrik Florinus, joka osasi hepreaa ja kreikkaa ja korjasi yhtä lailla asiasisältöä kuin kieltä — sanamuodot liikkuivat enemmän kuin kirjoitusasu — ja väliin jäävien laitosten katsotaan tehneen käännöstyötä myös alkukielistä käsin eikä vain siistineen vuoden 1642 tekstiä. Vuosien 1642 ja 1776 vertailija katsoo siis kahden tarkistuksen yli, ei pelkän ortografian muutoksen yli.
hero.2=Se pysyi kirkon käytössä puolitoista vuosisataa, kunnes Kirkkoraamattu 1933/38 korvasi sen, eikä sen lukeminen loppunut siihen, että se lakkasi olemasta virallinen. Kaksi Suomen evankelis-luterilaisen kirkon sisäistä herätysliikettä, lestadiolaiset ja rukoilevaiset, pitivät sen ja käyttävät sitä yhä. Siksi pelkkä sana Biblia osoittaa suomessa tähän eikä mihinkään vanhempaan tai uudempaan laitokseen, ja siksi kirjaa kutsutaan myös Vanhaksi kirkkoraamatuksi.
hero.3=Tässä lukijassa se on suomalaisen ketjun keskikohta. Avaa yksi askelma Kirkkoraamattu 1933/38:n jakeen alta, niin tämä laitos tulee näkyviin; avaa yksi tämän alta, niin vuoden 1642 Biblia tulee. Askelmat on kuitenkin luettava eri tavoin. Vuosien 1933/38 kääntäjät työskentelivät hepreasta ja kreikasta, joten yllä oleva askelma on saman kirkon Raamatun seuraantoa eikä johtamista. Alla oleva askelma on aitoa: 1776 on vuoden 1642 tarkistus, ja sen askeleen molemmin puolin olevat sanat on tarkoitettu verrattaviksi.
hero.4=Yksi varaus tällä sivustolla olevasta tekstistä: se ei ole vuoden 1776 painatus. Tässä oleva teksti polveutuu vapaasti käytettävästä digitaalisesta tekstistä, jonka oikeinkirjoituksen on normaalistanut myöhempi käsi ja jonka toimitushistoriaa ei ole tallessa — sen 31 102 jakeesta täsmälleen yhdessä esiintyy kirjain w, kun vuoden 1642 Bibliassa niitä on 26 862, ja juuri w v:n asemesta on selvin merkki siitä ortografiasta, jolla vuoden 1776 Raamattu painettiin. Vuoden 1776 laitos siis nykyaikaisti vuoden 1642 oikeinkirjoituksen, ja tämä teksti on sen jälkeen nykyaikaistettu uudelleen, mikä vie sen kauemmas painetusta kirjasta kuin 1776 oli vuodesta 1642. Kaksi vanhan kirjasuomen tutkijaa kysyi ensimmäiseksi, mikä versio tämä on, ja kysymys oli oikea. Vuoden 1776 painatus on tallella sivukuvina Kansalliskirjaston Ruotsin ajan kokoelmassa; uskollisen tekstin saaminen tämän tilalle on työ, jonka tekisimme mielellämme.

