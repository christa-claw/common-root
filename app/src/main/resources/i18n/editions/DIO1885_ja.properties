title=ディオダティ聖書1885年（イタリア語） — この版について | Common Root
description=ジョヴァンニ・ディオダティのイタリア語聖書の19世紀の姿：1641年の本文を1821年に改訂したもので、1885年の日付をもつ版に収められている——このコーパスのもう一つのディオダティと同じ翻訳だが、節の分け方が異なる。
heroHeading=ディオダティ聖書1885年
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=これはジョヴァンニ・ディオダティの翻訳である——ルッカ出身の家系に属するジュネーヴ人で、1576年に生まれ、1607年にラテン語ではなくヘブライ語とギリシャ語から訳した最初のイタリア語聖書を刊行し、没する8年前の1641年に自らの注を付して改訂した。このコーパスのもう一つのディオダティには、その経緯を語る独自のページがある。彼の死後2世紀にわたって本文は再版によって生き延び、1808年からは英国内外聖書協会が版を重ねて刊行した。イタリアのプロテスタントにとって、ほかに印刷するものがなかったからである。
hero.2=このファイルはそうした後の姿の一つである。合同聖書協会に代わってこれを提供している eBible.org は、これをディオダティの1641年の翻訳を1821年に改訂したもので、1885年の日付をもつ版だと説明している。1821年の改訂を誰が行い、1885年の版をどの印刷所が刷ったのかは、本プロジェクトでは確定していないため、このページではその名を挙げない。年代は、ラベルがディオダティの没年であるもう一つのディオダティの場合のような問題にはならない。1885はこの版自身の年であり、カタログがそれを保持し、段のチップもそれを表示する。
hero.3=もう一つのディオダティと並べると、どの抜き取り検査でも文言は同じである。詩編23編は「il Signore è il mio pastore」、イザヤ書7:14は「la Vergine concepirà」、ヨハネの手紙一5:7には天の証人があり、主の祈りの終わりには頌栄があり、使徒言行録8:37は完全な形で残る。神名はディオダティが書いたとおり「il Signore」、すなわち「主」である。これを「l'Eterno」に改めたのは、1924年に刊行されたこの本文の改訂版、リヴェドゥータ訳であった。異なるのは節の区分である。30か所以上で、この写しはヘブライ語に近い別の方式に従っている——ヨナの祈りは2:1から始まり章は2:11まで続き、イザヤ書8章には第23節があり、ヨブ記39章は第38節まで続き、コロサイの信徒への手紙4章の第1節は3章の末尾に置かれている——ため、全体で節が7つ少ない。さらにこの写しには詩編の表題が一つもない。詩編51編はいきなり「Abbi pietà di me, o Dio」で始まるが、もう一つのディオダティでは表題が第1節に組み込まれている。eBible.org 自身によるこの本文の提示には表題があるので、表題は1885年の刷りに欠けていたのではなく、本プロジェクトの取り込みの際に失われた可能性が最も高い。
hero.4=この読書環境において、これは3つのイタリア語聖書の一つである。イタリア語のインターフェースが開くのはもう一つのディオダティ、すなわちディオダティ1649であり、イタリア語には選定された既定の版がないため、カタログ順でそれが最初に来るからである。系譜の段にはこの版の母本が記録されていない——同じ翻訳のもう一つの写しさえ記録されていない——ため、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る。もう一つのディオダティと同じく、そこにあるテクストゥス・レセプトゥスは事実に近い。ディオダティはベザの活字ギリシャ語本文、すなわちその系統の本文に拠って訳したからである。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=イタリア語
fact.2.label=翻訳者
fact.2.value=ジョヴァンニ・ディオダティ（1576–1649）。ルッカ出身のプロテスタントの家系にジュネーヴで生まれた
fact.3.label=初版
fact.3.value=1607年、ジュネーヴ。1641年にディオダティ自身が注を付して改訂
fact.4.label=この姿
fact.4.value=ディオダティの1641年の本文を1821年に改訂したもので、1885年の日付をもつ版——eBible.org の説明による。改訂者と印刷者はここでは確定していない
fact.5.label=新約聖書の底にあるギリシャ語
fact.5.value=ベザの校訂本——このコーパスが[[TR|テクストゥス・レセプトゥス]]として収める活字ギリシャ語本文の系統に属する
fact.6.label=神名
fact.6.value=「il Signore」——主——もう一つのディオダティと同じ。[[RIV1927|リヴェドゥータ訳]]がのちに「l'Eterno」に改めた
fact.7.label=節の区分
fact.7.value=[[DIO|ディオダティ1649]]とは30か所以上で異なり、ヘブライ語の方式に近い。全体で節が7つ少ない
fact.8.label=詩編の表題
fact.8.value=この写しには一つもない——取り込みの際に失われた可能性が高い。eBible.org による同じ本文の提示には表題がある
fact.9.label=内容
fact.9.value=66巻——プロテスタント正典、第二正典なし。詩編はヘブライ語の番号付け
fact.10.label=ライセンス
fact.10.value=パブリックドメイン。このコピーは eBible.org から、合同聖書協会の提供による
fact.11.label=このコーパスでは
fact.11.value=[[DIO|ディオダティ1649]]、[[RIV1927|リヴェドゥータ訳1927]]と並ぶ3つのイタリア語聖書の一つ。イタリア語のインターフェースが開くのはディオダティ1649。系譜の段には母本が記録されておらず、その段のチップは1885と表示される
