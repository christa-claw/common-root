fact.2.label=Realizzata da
fact.2.value=Joseph Smith jr. (1805–1844), che disse di averlo tradotto "per il dono e il potere di Dio" da una serie di tavole metalliche antiche; dettò il testo a degli scribi, principalmente Oliver Cowdery, con tratti più brevi e precedenti trascritti da Martin Harris ed Emma Smith
fact.3.label=Pubblicata
fact.3.value=1830, Palmyra, New York; stampata da Egbert B. Grandin, circa 5.000 copie
fact.4.label=Struttura
fact.4.value=15 libri, dal Primo Libro di Nefi al Libro di Moroni, chiamati secondo i compilatori nefiti e jarediti a cui ciascuno è attribuito; l'edizione del 1830 non aveva numeri di versetto, e le attuali divisioni in capitoli e versetti risalgono all'edizione del 1879 preparata da Orson Pratt
fact.5.label=Posizione
fact.5.value=Una delle quattro opere canoniche del movimento dei santi degli ultimi giorni, insieme alla Bibbia, a [[DC|Dottrina e Alleanze]] e alla [[PGP|Perla di Gran Prezzo]]
fact.6.label=In questo corpus
fact.6.value=Il testo e la divisione in versetti seguono la formulazione standard attuale, con le correzioni tipografiche dell'edizione del 2013, tratti dall'esportazione JSON di pubblico dominio del Mormon Documentation Project; le sue note a piè di pagina, i riassunti dei capitoli e l'introduzione, protetti da copyright, sono omessi — ragione per cui qui non si indica un anno di stampa unico
