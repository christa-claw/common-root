title=Libro di Mormon — Su questa edizione | Common Root
description=Il Libro di Mormon: il resoconto di antichi profeti d'America dettato da Joseph Smith nel 1830, stampato a Palmyra, New York, e letto dai santi degli ultimi giorni come scrittura complementare alla Bibbia.
heroHeading=Libro di Mormon
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith disse di aver tradotto questo libro "per il dono e il potere di Dio" da una serie di tavole metalliche antiche, che affermò di aver ritrovato nel 1827 vicino alla fattoria della sua famiglia, alla periferia di Palmyra, New York, e di aver poi restituito al messaggero che gliele aveva mostrate. I testimoni della dettatura lo descrivono mentre osservava una pietra di veggente — nelle fasi più avanzate del lavoro, una pietra che poneva dentro un cappello per bloccare la luce, non solo la coppia di pietre fissate a un pettorale tradizionalmente chiamate Urim e Thummim, che si dice fossero arrivate insieme alle tavole — pronunciando il testo a voce alta mentre uno scriba lo scriveva. Oliver Cowdery ne trascrisse così la maggior parte in circa due mesi, nel 1829, principalmente nella fattoria della famiglia Whitmer a Fayette, New York; Martin Harris e la moglie di Joseph, Emma Smith, avevano fatto da scribi per tratti più brevi e precedenti.
hero.2=Il manoscritto andò in stampa entro l'anno. Smith ottenne il copyright sull'opera nel giugno 1829, e la stampa iniziò nella bottega di Egbert B. Grandin a Palmyra, dove il tipografo John H. Gilbert aggiunse la punteggiatura e la divisione in paragrafi che il manoscritto dettato non aveva. Il libro completato uscì nel marzo 1830: circa 5.000 copie, l'intera tiratura di Grandin.
hero.3=È diviso in quindici libri, dal Primo Libro di Nefi al Libro di Moroni, ciascuno chiamato secondo il profeta compilatore a cui è attribuita la sua redazione. Nessuna delle copie del 1830 aveva un solo numero di versetto: il testo scorreva come paragrafi continui entro capitoli molto più lunghi di quelli che i lettori vedono oggi. Le attuali divisioni in capitoli e versetti risalgono a un'edizione del 1879 preparata da Orson Pratt, che accorciò anche i capitoli e aggiunse le prime note a piè di pagina. Edizioni successive ne rimodellarono ulteriormente la presentazione: un comitato guidato da George F. Richards la compose su due colonne nel 1920 e aggiunse riassunti dei capitoli e una guida alla pronuncia; un'edizione del 1981 aggiornò i riferimenti incrociati, le intestazioni dei capitoli e altro materiale di consultazione; e una stampa del 2013 corresse incongruenze tipografiche insinuatesi nelle lastre di stampa dal 1981.
hero.4=È una delle quattro opere che il movimento dei santi degli ultimi giorni chiama le proprie opere canoniche, insieme alla Bibbia, a [[DC|Dottrina e Alleanze]] e alla [[PGP|Perla di Gran Prezzo]]. Il testo di questo corpus proviene dall'esportazione JSON del Mormon Documentation Project, che il suo responsabile ha dichiarato di pubblico dominio; segue il testo e la divisione in versetti dell'edizione standard attuale, con le correzioni tipografiche della stampa del 2013, e omette le note a piè di pagina, i riassunti dei capitoli e l'introduzione, ancora protetti da copyright. Poiché ciò che qui si conserva è proprio questo testo standard attuale e non una particolare stampa storica, non le viene attribuito un anno di pubblicazione unico.

