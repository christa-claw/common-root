fact.13.value=Raamattu, jonka saksankielinen käyttöliittymä avaa: saksalle ei ole valittua oletuslaitosta, joten lukuohjelma ottaa luettelon ensimmäisen saksankielisen Raamatun, ja ELB on [[LUT1545|Luther 1545:n]] ja [[LUT1912|Luther 1912:n]] edellä pelkän lyhenteensä nojalla. Polveutumisaskelmiin ei ole kirjattu kantatekstiä — vuoden 1871 Elberfelder, jonka korjaamisesta se on syntynyt, ei ole aineistossa — joten askelma avautuu alkukielten pohjaan. Vuosilukua se ei kanna kummallakaan puolella: luettelokortti jättää vuosisarakkeen tyhjäksi eikä käsin koottu askelmavuosien luettelo tunne sitä, joten ELB:n askelmamerkinnässä ei lue muuta kuin lyhenne — hiljainen tapaus, kun taas [[DRA|Douay-Rheims]] on äänekäs ja siinä nuo kaksi luetteloa ovat julkisesti eri mieltä
