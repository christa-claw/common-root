title=Elberfelder 1905 — Tietoja tästä laitoksesta | Common Root
description=Elberfelderin Raamattu: saksankielinen käännös, jonka John Nelson Darby, Carl Brockhaus ja Julius Anton von Poseck aloittivat vuonna 1855 ja joka oli ensimmäisiä saksankielisiä Textus Receptuksesta luopuneita — tässä vuoden 1905 painoksena.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Nimi on paikka. Elberfeld on kaupunki Wupperin laaksossa, vuodesta 1929 osa Wuppertalia, ja siellä työ pääosin tehtiin. Sen aloitti kolme miestä: John Nelson Darby, Carl Brockhaus ja Julius Anton von Poseck, kaikki sidoksissa veljesliikkeen saksalaiseen haaraan. Uusi testamentti ilmestyi 1855, Psalmit 1859 ja Vanha testamentti 1871 — ei kenenkään nimissä, vaan “muutamien kristittyjen” alkutekstistä kääntämänä.
hero.2=Erotuksen teki sen alla oleva kreikka. Lähes jokainen silloin liikkeellä ollut saksankielinen Raamattu nojasi yhä Textus Receptukseen; tämä irtautui siitä ja otti mukaan Codex Sinaiticuksen ja Codex Vaticanuksen lukutavat sitä mukaa kuin nuo käsikirjoitukset tulivat painosta 1800-luvun puolivälissä. Vanha testamentti tehtiin masoreettisesta hepreasta. Kääntämisen periaate oli tarkkuus ennen kauneutta: saksaa, joka seuraa hepreaa ja kreikkaa niin läheltä että jäykistyy, jokainen merkityksen vuoksi lisätty sana merkittynä lisätyksi, eikä jaksootsikoita lainkaan, koska alkuteksteissä niitä ei ole. Sitä pidetään yhä yhtenä niistä saksankielisistä laitoksista, jotka ovat lähimpänä allaan olevaa sanamuotoa.
hero.3=Tämä on vuoden 1905 painos, ensimmäinen antiikvalla fraktuuran sijasta ladottu; kirjasimen pienuuden vuoksi sitä kutsutaan nimellä Perlbibel. Se ei ollut uusi käännös. Rudolf Brockhausin kuolemaan 1932 asti Elberfelderiä käytiin läpi ja korjattiin painoksesta painokseen — Alfred Rochat vastasi Vanhasta testamentista, Emil Dönges Uudesta — joten vuosiluku nimeää tässä painoksen liikkuvassa tekstissä eikä valmista laitosta. Se, mitä tänään myydään Elberfelderinä, on useimmiten taas jotakin muuta: saman liikkeen asettama toimikunta käytti kaksikymmentäviisi vuotta sen tarkistamiseen ja julkaisi tuloksen 1975 ja 1985. Tuo tarkistus poisti nimen “Jehova” Vanhasta testamentista ja pani sen tilalle sanan “HERR”. Tämä teksti painaa yhä “Jehova”, mikä asettaa sen American Standard Versionin ja Darbyn oman ranskalaisen Raamatun rinnalle.
hero.4=Sen paikka tässä kokoelmassa on hieman syrjässä. Saksalle ei ole lukuohjelmassa valittua oletuslaitosta, joten saksankielinen käyttöliittymä avaa luettelon ensimmäisen saksankielisen Raamatun, ja se on tämä — molempien Luther-Raamattujen edellä aakkosjärjestyksen eikä minkään muun nojalla. Polveutumisaskelmissa se seisoo yksin. Kaksi Lutheria muodostavat ketjun, 1912 on tarkistettu vuoden 1545 tekstistä ja 1545 lepää kreikan ja heprean varassa, kun taas Elberfelderillä ei ole kirjattua kantatekstiä, koska vuoden 1871 Elberfelder, jonka korjaamisesta se on syntynyt, ei ole tässä aineistossa. Askelma Elberfelderin jakeen alla vie siksi suoraan ≈-merkittyyn alkukielten pohjaan, vaikka ranskalainen Darbyn Raamattu yhden palstan päässä on sen lähin sukulainen täällä.

