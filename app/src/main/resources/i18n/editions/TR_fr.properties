title=Textus Receptus — À propos de cette édition | Common Root
description=Le Textus Receptus : le Nouveau Testament grec imprimé qui se tient derrière Luther, Tyndale et la Bible du roi Jacques, établi pour la première fois par Érasme en 1516 et nommé d'après une formule publicitaire de 1633.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Toute bible de la Réforme présente dans cette collection descend d'un livre imprimé à Bâle en 1516. Érasme de Rotterdam voulait mettre le Nouveau Testament grec sous presse avant quiconque, et il travailla vite — à partir de la poignée de manuscrits tardifs qu'il pouvait atteindre à Bâle, dont aucun n'était particulièrement ancien. Là où il manquait à son exemplaire de l'Apocalypse son dernier feuillet, il retraduisit en grec les six derniers versets depuis la Vulgate latine. Ces versets entrèrent dans l'imprimé et y demeurèrent quatre siècles.
hero.2=Le texte fut corrigé et réédité pendant cent ans encore — par Érasme lui-même, puis par Robert Estienne à Paris et Théodore de Bèze à Genève. La quatrième édition d'Estienne, en 1551, fit une chose dont les conséquences dépassent de loin l'érudition : elle découpa le texte en versets numérotés. Ce sont les numéros de verset encore imprimés dans presque toutes les bibles du monde, et ceux que ce lecteur permet de désactiver.
hero.3=Le nom vint en dernier, et il vint du commerce. En 1633, les frères Elzevier de Leyde vantaient leur édition en disant que le lecteur avait désormais « le texte reçu par tous » — textus receptus. C'était l'affirmation d'un libraire, non un verdict savant, mais elle est restée. Quand des manuscrits plus anciens réapparurent au XIXe siècle, des éditeurs de Tischendorf à Westcott et Hort bâtirent sur eux des textes nouveaux, et les traductions modernes suivent ceux-là. Le Textus Receptus demeure ici pour la raison qui fait son importance : c'est ce que Luther, Tyndale, les traducteurs de Genève et les comités du roi Jacques avaient réellement sous les yeux, et donc le texte contre lequel il faut lire leurs formulations.

