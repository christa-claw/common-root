title=क़ुरआन — पिकथॉल — इस संस्करण के बारे में | Common Root
description=मुहम्मद मार्माड्यूक पिकथॉल का 1930 का अनुवाद, अंग्रेज़ी मातृभाषा वाले किसी मुसलमान द्वारा किया गया पहला अंग्रेज़ी क़ुरआन अनुवाद — हैदराबाद के निज़ाम की सेवा में रहते हुए और अल-अज़हर के विद्वानों की सलाह से तैयार हुआ, और इस संग्रह में यह वह अंग्रेज़ी पाठ है जो डिफ़ॉल्ट रूप से अरबी पाठ के नीचे दिखाया जाता है।
heroHeading=क़ुरआन — पिकथॉल
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=मुहम्मद मार्माड्यूक पिकथॉल (1875-1936) पवित्र ग्रंथ के अनुवादक बनने से पहले एक अंग्रेज़ उपन्यासकार थे, जिनकी प्रशंसा उनके समय में एच. जी. वेल्स और डी. एच. लॉरेंस ने की थी। उन्होंने नवंबर 1917 में, नॉटिंग हिल की मुस्लिम लिटरेरी सोसाइटी के सामने "इस्लाम एंड प्रोग्रेस" शीर्षक से दिए गए भाषण के बाद, इस्लाम में अपने धर्मांतरण की घोषणा की, और उसी महीने वोकिंग मुस्लिम मिशन में कलिमा पढ़ा। एक दशक बाद वे हैदराबाद में निज़ाम की सेवा में चदरघाट हाई स्कूल के प्रिंसिपल थे, और वहीं से उन्होंने 1928 में दो साल की छुट्टी ली, ताकि वह कर सकें जो वे अपने धर्मांतरण के समय से करना चाहते थे: क़ुरआन को अंग्रेज़ी में उतारना।
hero.2=उन्होंने यह न तो एकांत में किया न ही जल्दबाज़ी में। 1929 में उन्होंने काहिरा में तीन महीने बिताए, जहाँ रशीद रिदा के समर्थन ने उनके लिए द्वार खोले, और वे एक ऐसी परियोजना पर अल-अज़हर के विद्वानों का आशीर्वाद चाहते थे जिसमें मदद करने की कीमत कुछ विद्वानों को उनकी नौकरी से चुकानी पड़ सकती थी — अल-अज़हर के एक हिस्से की नज़र में क़ुरआन का अनुवाद करना अपने आप में एक गंभीर मामला था। पिकथॉल इसके बावजूद आगे बढ़े और उनसे सलाह लेना जारी रखा। 1930 में उन्होंने जो "The Meaning of the Glorious Koran: An Explanatory Translation" के नाम से प्रकाशित किया, वह यह सावधानी अपने शीर्षक में ही रखता है: "अंग्रेज़ी में क़ुरआन" नहीं, बल्कि उसके अर्थ की एक व्याख्या, क्योंकि उनके अपने कथित विचार में कोई भी अनुवाद स्वयं क़ुरआन नहीं हो सकता था। अल्फ़्रेड ए. नॉफ़ ने पहला संस्करण न्यूयॉर्क में प्रकाशित किया; इसके बाद हैदराबाद की सरकारी प्रेस से एक द्विभाषी संस्करण आया।
hero.3=द टाइम्स लिटरेरी सप्लीमेंट ने इसे "a great literary achievement" कहा, और इसे सामान्यतः उस पहले अंग्रेज़ी क़ुरआन अनुवाद के रूप में वर्णित किया जाता है जो अंग्रेज़ी मातृभाषा वाले किसी मुसलमान द्वारा किया गया — सेल और रॉडवेल जैसे पहले के अंग्रेज़ी संस्करण, ग़ैर-मुस्लिम प्राच्यविदों का काम थे। पिकथॉल का अनुवाद तब से लगभग एक सदी तक छपता और उपयोग में रहा है, उन थोड़े से अंग्रेज़ी अनुवादों में से एक जिन्हें सामान्य पाठक, न कि केवल विद्वान, वास्तव में पढ़ते हैं।
hero.4=इस संग्रह में यह वह अनुवाद है जो डिफ़ॉल्ट रूप से उस्मानी अरबी पाठ के नीचे दिखाया जाता है — अरबी हर स्तंभ का आधार बनी रहती है, और यह अंग्रेज़ी उसके साथ, उसे कभी बदले बिना, एक व्याख्या के रूप में दिखाई जाती है। इसे इस भूमिका के लिए जितना साहित्यिक, उतना ही एक साधारण कारण से चुना गया: उपलब्ध अनुवादों के एक सर्वेक्षण में केवल दो अंग्रेज़ी अनुवाद स्पष्ट रूप से सार्वजनिक अधिकार-क्षेत्र में पाए गए, यह और 1934 का यूसुफ़ अली का अनुवाद, साथ ही तीसरी भाषा के लिए 1878 का सब्लुकोव का रूसी अनुवाद। यहाँ दिया गया पाठ अनुवाद का एक डिजिटलीकरण है, जो किसी एक विशेष मुद्रण से नहीं बल्कि alquran.cloud के माध्यम से लिया गया है, इसलिए इसे पिकथॉल के शब्दों के रूप में पढ़ा जाना चाहिए, किसी विशेष संस्करण की प्रतिलिपि के रूप में नहीं।

