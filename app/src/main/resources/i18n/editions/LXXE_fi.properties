title=Brentonin englanninkielinen Septuaginta — Tietoja tästä laitoksesta | Common Root
description=Sir Lancelot Brentonin englanninnos kreikkalaisesta Vanhasta testamentista, julkaistu ensin Lontoossa 1844 ja uudelleen apokryfikirjoineen 1851 — yli vuosisadan ajan se englanninkielinen Septuaginta, ja tässä lukijassa askelma sen kreikan yläpuolella, josta se käännettiin.
heroHeading=Brentonin englanninkielinen Septuaginta
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) oli kuninkaallisen laivaston amiraalin, Sir Jahleel Brentonin, poika, ja hänet vihittiin Englannin kirkon papiksi 1830, kaksi vuotta sen jälkeen kun hän oli valmistunut Oxfordin Oriel Collegesta. Kauan hän ei kirkossa viipynyt. Oxfordissa hän oli tavannut John Nelson Darbyn, ja vuoden 1831 loppuun mennessä hän oli eronnut valtiokirkosta perustaakseen Bathiin itsenäisen kappelin; vuoteen 1835 mennessä kappeli oli liittynyt Plymouthin veljiin, liikkeeseen jota Darby tuolloin muovasi. Darbyn omat Raamatut ovat nekin tässä aineistossa, ranskaksi ja englanniksi. Vuonna 1844 Brenton peri isänsä baronetin arvon, ja samana vuonna lontoolainen Samuel Bagster and Sons julkaisi hänen Septuaginta-käännöksensä. Hän kuoli Wightin saarella 1862 lapsettomana, sukuhaaransa viimeisenä baronettina.
hero.2=Se ei ollut ensimmäinen englanninkielinen Septuaginta — Charles Thomson oli julkaissut sellaisen Philadelphiassa 1808 — mutta se oli se joka kesti: yli puolentoista vuosisadan ajan, kunnes New English Translation of the Septuagint ilmestyi 2007, englantia lukeva joka halusi kreikkalaisen Vanhan testamentin heprealaisen sijaan luki Brentonia. Hän käänsi pääasiassa Codex Vaticanuksesta, Vatikaanin kirjaston 300-luvun käsikirjoituksesta. Ensimmäisestä laitoksesta apokryfikirjat puuttuivat; vuoden 1851 laitos lisäsi ne, ja juuri vuoden 1851 tekstiä tämä kappale toistaa. Bagsterin kreikkalais-englantilaiset laitokset asettivat kreikan englannin rinnalle, ja tuo kreikka on tässä aineistossa omana laitoksenaan. Koska englanti seuraa kreikkaa, se lukee niin kuin kreikka lukee: psalmit noudattavat kreikkalaista numerointia, joten psalmi 22 on tässä paimenpsalmi, ja Jesajan 7:14 kohdalla “a virgin shall conceive” kääntää kreikan sanan parthenos, ei heprean sanaa ʿalmah.
hero.3=Tässä lukijassa se on askelma, jolla on yksi kirjaimellinen edeltäjä: sen alla oleva kreikkalainen Septuaginta on se teksti jonka Brenton käänsi, hänen oman kustantajansa painamana hänen englantinsa rinnalle. Avaa askelma jonkin sen jakeen alta, ja kreikka ilmestyy, ja sen alle Leningradin koodeksi alkukielisenä pohjana. Mikään aineistossa ei puolestaan seiso sen päällä. Meidän kappaleemme on kirjaa suppeampi. Siinä on 37 kirjaa, ne jotka myös heprealaisessa kaanonissa ovat tavallisilla nimillään. eBible.orgin tiedostot, joista se on otettu, sisältävät myös apokryfikirjat — Tobitin, Juditin, Viisauden kirjan, Siirakin, Barukin, neljä Makkabealaiskirjaa ja muuta — ja antavat Esterin ja Danielin vain niiden pidemmässä kreikkalaisessa muodossa. Mikään näistä ei tullut aineistoon, joten tässä ei ole Esteriä eikä Danielia, ja siellä missä alla oleva kreikka sisältää Tobitin tai Viisauden kirjan, sen yläpuolella ei ole englantia. Esra ja Nehemia ovat kahtena kirjana, siinä missä alla oleva kreikka on yksi. Saman käännöksen oikeinkirjoitusta ajantasaistava laitos, Adam Boydin Updated Brenton vuodelta 2020, on aineistossa omana laitoksenaan.

