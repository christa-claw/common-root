title=النسخة العربية الجديدة المفتوحة — عن هذه الطبعة | Common Root
description=النسخة العربية الجديدة المفتوحة من Biblica: كتاب مقدّس عربي حديث، حقوق نشره لسنوات 1988 و1997 و2012، صدر برخصة Creative Commons تسمح بمشاركته وتعديله وطبعه مع نسبته إلى ناشره.
heroHeading=النسخة العربية الجديدة المفتوحة من Biblica
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=هذه ترجمة عربية حديثة، نصّ مختلف عن [[SVD|سميث وفان دايك]] لا نسخة أخرى منه. تنشرها Biblica, Inc.، التي يحمل إشعار حقوقها ثلاث سنين: 1988 و1997 و2012. وتذكر صفحة حقوق النشر في النصّ نفسه اسمه الأقدم، "كتاب الحياة مجاني".
hero.2=وما يميّزه في هذا القارئ رخصته. فقد نشرته Biblica نصّاً "مفتوحاً" برخصة Creative Commons نسب المصنف-المشاركة بالمثل 4.0: فلكلّ أحدٍ أن ينسخه ويعدّله ويطبعه، بشرط أن تُنسب إلى Biblica وأن يُشارَك كلّ ما يُبنى عليه بالشروط نفسها. وعبارة النسب التي تطلبها Biblica هي: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". ومعظم الترجمات الحديثة لا تُقدَّم على هذا الوجه، ولذلك كان هذا النصّ هنا.
hero.3=وللرخصة شرطٌ يستحقّ أن يُعرف. فالنصّ غير المعدَّل يجوز أن يحمل اسم Biblica. أمّا النصّ المُعاد ترتيبه فلا يجوز له ذلك: فطبعتا ترتيب الأحداث وترتيب الكتابة في هذا الموقع تضعان الكتب في تسلسل مختلف، وهو ما نعدّه تعديلاً، فتذكران أنّ النصّ أُعيد ترتيبه ولا تستعملان اسم Biblica عنواناً.
hero.4=والملفّ مشكَّل بالكامل. ومن تفاصيل مصدره أنّ أعمال الرسل 15: 25 و26 طُبعتا آيةً واحدة، فيحتفظ هذا الجمع بهما معاً تحت الآية 25 ولا توجد عنده آية 26 مستقلّة.

