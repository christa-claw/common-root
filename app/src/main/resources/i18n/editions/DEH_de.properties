title=Die vierzig Hadithe des Shah Waliullah Dehlawi — Über diese Ausgabe | Common Root
description=Die vierzig Hadithe des Shah Waliullah Dehlawi: vierzig Hadithe, die der Delhier Gelehrte des 18. Jahrhunderts eigenen Angaben zufolge während eines Studienjahres in Medina unmittelbar von seinem eigenen Lehrer hörte, überliefert zusammen mit ihren Überliefererketten — die bekannteste Sammlung dieser Art vom indischen Subkontinent.
heroHeading=Die vierzig Hadithe des Shah Waliullah Dehlawi
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Shah Waliullah Dehlawi — vollständig Qutb al-Din Ahmad ibn 'Abd al-Rahim al-'Umari al-Dihlawi — wurde am 21. Februar 1703 in Phulat bei Muzaffarnagar geboren und wuchs in Delhi auf, wo sein Vater, Shah Abdur Rahim, die Madrasah-i Rahimiyah gegründet hatte. Er soll den Koran im Alter von sieben Jahren auswendig gelernt und mit fünfzehn den damals üblichen Lehrplan abgeschlossen haben; zwei Jahre später folgte er seinem Vater als Leiter der Madrasa nach. In den Jahren 1730–31 unternahm er die Haddsch und verbrachte danach etwa ein Jahr in Medina mit dem Studium des Hadith — vor allem bei Abu Tahir al-Kurdi (auch al-Kurani wiedergegeben), mit weiterem Studium bei Muhammad Wafdullah al-Maliki und Scheich Taj al-Din al-Qal'i —, bevor er am 16. Dezember 1732 nach Delhi zurückkehrte. Er starb dort am 20. August 1762 (29. Muharram 1176 AH) und wurde neben seinem Vater beigesetzt. Zu seinen weiteren Werken zählen Hujjat Allah al-Baligha, allgemein als sein wichtigstes Buch betrachtet, Al-Fawz al-Kabir und Futuh al-Haramayn, sein eigener Bericht über die Reise, die ihn in den Hedschas führte.
hero.2=Al-Arba'in setzt dieselbe "Vierzig-Hadith"-Gattung (arba'iniyyat) fort wie [[NAW|Die vierzig Hadithe des an-Nawawi]] und [[QUD|Die vierzig heiligen Hadithe]] — eine Gattung, die auf ein Hadith zurückgeht, das demjenigen, der vierzig Hadithe der Religion bewahrt, am Jüngsten Tag einen Platz unter den Gelehrten verspricht, ein Hadith, das die meisten Kritiker selbst als da'if (schwach) einstufen, sowie auf eine erste, heute verlorene Sammlung, die Abdullah ibn al-Mubarak (gest. 797) zugeschrieben wird. Von den beiden anderen unterscheidet sie sich in dem, was sie versammelt: Statt Hadithe, die nach Thema oder Rang aus der breiteren Literatur ausgewählt wurden, beschreibt ihr englischer Verlag sie als vierzig Hadithe, die Shah Waliullah eigenen Angaben zufolge unmittelbar von seinem eigenen Lehrer in Medina hörte, jedes zusammen mit der Überliefererkette (sanad) bewahrt, durch die er es empfing — eine persönliche Überlieferungsaufzeichnung aus dem Studienjahr, das nach dem Bericht seines Sohnes veränderte, wie er nach seiner Rückkehr nach Delhi lehrte und schrieb.
hero.3=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-dehlawi-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]], [[NAW|Forty Hadith of an-Nawawi]] und [[QUD|Forty Hadith Qudsi]] sowie seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

