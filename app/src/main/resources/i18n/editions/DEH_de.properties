fact.1.label=Sprache
fact.1.value=Klassisches Arabisch, mit einer englischen Übersetzung unter jedem Hadith im Reader
fact.2.label=Zusammengestellt von
fact.2.value=Shah Waliullah Dehlawi (1703–1762)
fact.3.label=Titel
fact.3.value=Auf Arabisch bekannt als Al-Arba'in ("Die Vierzig"); eine moderne englische Ausgabe unter dem Titel Forty Hadith of Shah Wali-Allah erschien 2015 bei Turath Publishing, übersetzt von Safaruk Zaman Chowdhury
fact.4.label=Zusammengestellt
fact.4.value=Nachdem Shah Waliullah am 16. Dezember 1732 nach Delhi zurückgekehrt war, im Anschluss an eine Haddsch 1730–31 und etwa ein Jahr Hadith-Studium in Medina, vor allem bei Abu Tahir al-Kurdi (auch al-Kurani wiedergegeben)
fact.5.label=Methode
fact.5.value=Laut ihrem englischen Verlag ist jedes der vierzig Hadithe eines, das Shah Waliullah eigenen Angaben zufolge unmittelbar von seinem eigenen Lehrer hörte, bewahrt zusammen mit der Überliefererkette (sanad), durch die er es empfing — eine persönliche Überlieferungsaufzeichnung statt einer nach Thema oder Rang getroffenen Auswahl
fact.6.label=Stellung
fact.6.value=Die bekannteste "Vierzig-Hadith"-Sammlung (arba'iniyyat) vom indischen Subkontinent; setzt eine Gattung fort, deren erstes bekanntes, heute verlorenes Beispiel Abdullah ibn al-Mubarak (gest. 797) zugeschrieben wird und aus der auch [[NAW|Die vierzig Hadithe des an-Nawawi]] und [[QUD|Die vierzig heiligen Hadithe]] hervorgingen
fact.7.label=Hadith-Anzahl
fact.7.value=40
fact.8.label=In diesem Korpus
fact.8.value=1 Buch und 40 numerierte Hadithe
fact.9.label=Englische Übersetzung
fact.9.value=Entnommen der eng-dehlawi-Ausgabe der fawazahmed0/hadith-api, als Begleittext zum Arabischen gezeigt; der Datensatz nennt den Übersetzer unbekannt, und ob es sich um die Übersetzung von Turath Publishing/Chowdhury oder eine eigenständige handelt, ist von Seiten dieses Korpus nicht bestätigt
fact.10.label=Lizenz
fact.10.value=Der arabische Matn ist der gemeinfreie klassische Text; die Lizenz der englischen Übersetzung ist noch in Prüfung
