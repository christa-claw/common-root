title=Риведута 1927 (итальянская) — Об этом издании | Common Root
description=Риведута: итальянская Библия Джованни Диодати, пересмотренная по еврейскому и греческому тексту комитетом во главе с вальденским богословом Джованни Луцци и изданная в Риме в 1924 году Британским и иностранным библейским обществом, — и почему в файле стоит 1927.
heroHeading=Риведута 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Джованни Луцци родился в 1856 году в Нижнем Энгадине, в швейцарском кантоне Граубюнден, и младенцем был увезён в Лукку, когда семья переселилась туда на следующий год. Он вырос итальянцем, учился на Вальденском богословском факультете во Флоренции — в школе старой протестантской церкви Италии, — потом преподавал там богословие и служил пастором в городе. Последние годы он провёл снова в Швейцарии, в Поскьяво, и умер там в 1948 году.
hero.2=Риведута началась в 1906 году, когда Британское и иностранное библейское общество, уже целый век печатавшее для итальянских читателей перевод Диодати XVII века, поручило группе его пересмотреть и поставило во главе Луцци. Он надеялся сделать её общей Библией вместе с католическими учёными; Ватикан отказался, и работа продолжилась как протестантская редакция. Полная Библия вышла в Риме в 1924 году, и на титульном листе она названа версией, пересмотренной по подлиннику, — «riveduta», пересмотренная; так её с тех пор и зовут. Это не новый перевод: в основе лежит текст Диодати, заново сверенный с еврейским и греческим. Она стала Библией итальянских протестантов на бо́льшую часть XX века, а её наследницу, Nuova Riveduta, издало Женевское библейское общество в 1994 году. Луцци сделал и собственный перевод с примечаниями, в двенадцати томах, выходивших во Флоренции с 1921 года; это другой труд, а не этот текст.
hero.3=Редакция видна на странице. Имя Божие в Ветхом Завете — «l'Eterno», Вечный: «L'Eterno è il mio pastore» в Псалме 23, — там, где у Диодати «il Signore». Исаия 7:14 читается «la giovane», молодая женщина, там, где у Диодати «la Vergine». В Новом Завете она отходит от Textus Receptus там, где отходят позднейшие критические издания: в 1 Иоанна 5:7 нет небесных свидетелей, молитва Господня в Матфея 6:13 кончается без славословия, а Деяния 8:37 оставлены, но в квадратных скобках. Псалмы идут по еврейской нумерации, и надписание псалма слито с его первым стихом — Псалом 23 открывается словами «Salmo di Davide.», — так что в Псалме 51 19 стихов, как в английских Библиях. Что до даты: 1927 — это год, который несёт цифровой текст и который хранит каталог, поэтому метка ступени показывает 1927. Сама Риведута вышла в 1924 году, а какое позднейшее издание воспроизводит этот файл, проект не установил.
hero.4=В этой читалке она одна из трёх итальянских Библий, рядом с двумя экземплярами Диодати. Итальянский интерфейс открывает не её: для итальянского нет отобранного вручную выбора, поэтому читалка берёт первую итальянскую Библию в порядке каталога, а это Диодати 1649. В ступенях родословия для неё не записан источник — даже Диодати, хотя Риведута есть редакция Диодати и Диодати есть в собрании, — так что ступень, открытая под стихом, сразу падает на отмеченное ≈ дно языков оригинала: Вестминстерский Ленинградский кодекс для Ветхого Завета, а для Нового — Textus Receptus, тот самый греческий текст, от которого эта редакция отошла.

