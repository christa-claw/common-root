title=スミス・ヴァンダイク訳（eBible本文） — この版について | Common Root
description=スミスとヴァンダイクの1865年のアラビア語聖書を、eBible.orgがアメリカン・バイブル・ソサイエティの原本ファイルからパブリックドメインとして公開する完全に母音符号を付した電子本文で収めたもの。
heroHeading=スミス・ヴァンダイク訳 — 完全に母音符号を付した本文
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=これは[[SVD|スミス・ヴァンダイク訳]]と同じ翻訳である——ベイルートでイーライ・スミスが起こし、1865年にコルネリウス・ヴァンダイクが、アラビア語の学者ブトルス・アル＝ブスターニー、ナースィフ・アル＝ヤーズィジー、ユースフ・アル＝アスィールとともに完成させたアラビア語聖書——ただし異なる電子ファイルから組まれている。翻訳は同じであり、この版が存在する理由はこのファイルにある。
hero.2=1865年の聖書は誰にとっても自由だが、その電子的な写しもまた誰かの仕事であり、ヴァンダイク本文は出自の定かでない多くの写しとしてウェブ上に流通している。写し自体に著作権があると主張して提供されているものもある。出自を追跡できない本文は安心して印刷できないため、この版は出自を追跡できる写しを使う——eBible.orgが公開し、パブリックドメインと宣言し、翻訳者としてシリア伝道団、原本の提供者としてアメリカン・バイブル・ソサイエティを挙げているものである。このファイルの日付は2020-08-03である。
hero.3=これは完全に母音符号を付されている。この読書環境にあるもう一つのヴァンダイク本文がほとんど無母音であるのに対し、こちらはすべての語がその短母音と他の読み方記号を備えている。そのため組版は遅くなり、朗読はしやすくなる。そして母音を付した頁は行間をより多く必要とするため、この版の印刷本は、同じ本文を無母音にした場合より長くなる。
hero.4=本文を印刷してよいかどうかが問題となる場合に選ぶべきはこの版である。画面上で読むだけなら、どちらのヴァンダイク本文でも用は足りる。

