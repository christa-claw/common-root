title=Diodati 1649 (italienisch) — Über diese Ausgabe | Common Root
description=Giovanni Diodatis italienische Bibel: 1607 in Genf gedruckt, die erste aus dem Hebräischen und Griechischen statt aus der Vulgata gearbeitete, 1641 mit eigenen Anmerkungen revidiert — und warum die Jahreszahl auf der Datei sein Todesjahr ist.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati wurde 1576 in Genf geboren, in eine Kaufmannsfamilie aus Lucca, die Italien verlassen hatte, statt ihren Glauben aufzugeben. Er war italienischer Herkunft und Genfer Schulung, und genau diese Verbindung ist der ganze Grund, weshalb es dieses Buch gibt: er hatte die Sprache des Landes, das die Reformation nicht erreicht hatte, und er stand in der Stadt, die zu ihrer Druckerei geworden war. Theodor Beza brachte ihn mit einundzwanzig Jahren für den Lehrstuhl für Hebräisch in Vorschlag. 1606 wurde er Professor der Theologie, 1608 Pfarrer, und im Jahr darauf folgte er Beza auf dem theologischen Lehrstuhl; 1618 ging er als Genfer Abgesandter zur Synode von Dordrecht und war einer von sechs Männern, die deren Akten aufzusetzen hatten.
hero.2=Seine italienische Bibel wurde 1607 in Genf gedruckt. Italien hatte schon zuvor Bibeln in der Volkssprache gehabt — Malermis von 1471, Bruciolis von 1532 —, doch die arbeiteten aus dem Lateinischen oder stützten sich schwer darauf. Diodati ging an das Hebräische und das Griechische, und für das Neue Testament hieß das den griechischen Text, den Beza eine Generation früher in derselben Stadt herausgegeben hatte. 1641 gab er eine revidierte Ausgabe mit eigenen erklärenden Anmerkungen heraus, und von dieser stammen die Nachdrucke ab. Sie wurde die italienische protestantische Bibel und ist es geblieben — was in einem Land mit fast keiner protestantischen Leserschaft bedeutete, dass sie vier Jahrhunderte lang von sehr wenigen Menschen getragen wurde. Er übersetzte die Bibel auch ins Französische, 1644; jene gilt allgemein als die schwächere, und er hätte wohl nicht widersprochen.
hero.3=Die Jahreszahl auf der Karte ist einen Satz wert, denn es gibt keine. Dieser Text läuft digital unter der Bezeichnung „Diodati 1649“ um, und 1649 ist keine Ausgabe — es ist das Jahr, in dem Diodati starb. Die beiden Jahreszahlen, die etwas besagen, sind 1607, als die Übersetzung zuerst erschien, und 1641, als er sie revidierte. Welche davon eine gegebene digitale Datei tatsächlich wiedergibt, hat dieses Projekt nicht festgestellt, und so lässt der Katalog die Jahresspalte leer, statt eine Zahl zu drucken, für die er nicht einstehen kann. Der Name bleibt, wie er ankam, denn danach wird gesucht.
hero.4=In diesem Leser ist sie die einzige italienische Bibel, sodass die Oberfläche auf Italienisch gestellt auf ihr öffnet — nicht als kuratierte Wahl, wie die Reina-Valera 1909 fürs Spanische gewählt ist, sondern weil der Katalogdurchgang in der Sprache nichts anderes findet. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden fällt. Dieser Boden liefert fürs Griechische den Textus Receptus, und hier kommt das der Wahrheit ungewöhnlich nahe: bei den meisten Ausgaben dieses Korpus steht der Receptus für einen kritischen Text ein, den die Übersetzer wirklich benutzt haben, Diodati aber arbeitete tatsächlich aus einem gedruckten griechischen Text dieser Familie. Ihr Sprossen-Chip trägt keine Jahreszahl, was der Leerstelle auf der Karte entspricht.

