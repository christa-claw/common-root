fact.1.label=Sprache
fact.1.value=italienisch
fact.2.label=Übersetzer
fact.2.value=Giovanni Diodati (1576–1649), in Genf geboren, aus einer protestantischen Kaufmannsfamilie, die Lucca verlassen hatte, statt ihren Glauben aufzugeben
fact.3.label=Erstmals erschienen
fact.3.value=1607, in Genf — die erste italienische Bibel, die aus dem Hebräischen und dem Griechischen statt aus dem Lateinischen gearbeitet wurde
fact.4.label=Revidierte Ausgabe
fact.4.value=1641, mit Diodatis eigenen Anmerkungen; in dieser Gestalt wurde der Text die folgenden drei Jahrhunderte nachgedruckt
fact.5.label=Warum die Bezeichnung 1649 sagt
fact.5.value=1649 ist Diodatis Todesjahr, nicht das Jahr einer Ausgabe — die Zahl reist mit dem digitalen Text mit, und die Katalogkarte lässt die Jahresspalte lieber leer, als eine zu behaupten
fact.6.label=Griechisch hinter dem Neuen Testament
fact.6.value=Bezas Ausgaben, eine Generation früher in Genf gemacht — innerhalb jener Familie gedruckter griechischer Texte, die dieses Korpus als [[TR|Textus Receptus]] führt
fact.7.label=Ebenfalls von ihm
fact.7.value=eine französische Bibel, 1644, allgemein als die schwächere der beiden gerechnet — Französisch war nicht die Sprache, in der er dachte
fact.8.label=Umfang
fact.8.value=66 Bücher — der protestantische Kanon, ohne Deuterokanonische
fact.9.label=In diesem Korpus
fact.9.value=die einzige italienische Bibel hier, sodass eine italienische Oberfläche auf ihr öffnet; in den Abstammungssprossen ist keine Vorlage verzeichnet, und ihr Sprossen-Chip erscheint ohne Jahr
