title=Updated Brenton English Septuagint — About This Edition | Common Root
description=Sir Lancelot Brenton's English Septuagint of 1844 and 1851 with its spelling and names brought up to date by Adam Boyd in 2020 — the same translation as the original Brenton beside it in this corpus, with thou and thee left where Brenton put them.
heroHeading=Updated Brenton English Septuagint
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=This is Sir Lancelot Brenton's English translation of the Septuagint, the Greek Old Testament, with its English brought up to date. Brenton translated principally from Codex Vaticanus; Samuel Bagster and Sons of London published his version in 1844 and reissued it with the Apocrypha in 1851. In 2020 Adam Boyd revised it for eBible.org and dedicated his changes to the public domain. He did not translate it again. His introduction lists what he changed: spelling made modern American, so that “shew” becomes “show”; names of people and places given the forms English readers know; “begat” and “spake” turned into “begot” and “spoke”; hyphens and doubled punctuation tidied; and poetry set out as poetry. What he kept is just as deliberate: “thou”, “thee” and “ye” and the verb forms that go with them, Brenton's grammar, and his heavy nineteenth-century punctuation.
hero.2=The difference shows best beside the original Brenton, which is in this corpus too. Brenton spelled Hebrew names the way the Greek spells them; the update usually gives the English form. Where Brenton's Nehemiah opens with “the words of Neemias the son of Chelcia”, this one has “Nehemiah the son of Hacaliah”; Elias the Thesbite becomes Elijah the Tishbite, and Emmanuel at Isaiah 7:14 becomes Immanuel. Beneath the spelling the translation is still Brenton's, so it still reads where the Greek reads. “A virgin shall conceive” at Isaiah 7:14 renders the Greek parthenos; the Psalms keep the Greek numbering, so Psalm 22 here is the shepherd psalm; and the earth of Genesis 1:2 is still “unsightly and unfurnished”. The old pronouns stay too: “thou shalt call his name Immanuel”.
hero.3=In this reader it stands outside the lineage rungs. The corpus records no parent for it — neither the Greek Brenton translated nor the Brenton it revises — so a rung opened beneath one of its verses drops straight to the original-language floor marked with ≈, which for the Old Testament is the Westminster Leningrad Codex: a Hebrew text, not the Greek this translation was made from. To step from Brenton's English down into his Greek, open the original Brenton, whose recorded parent is the Septuagint. Nothing stands on this edition in turn, and no interface language opens on it; an English interface opens on the New International Version. Our copy is narrower than the book. It has 36 books. Ezra and Nehemiah are a single book of 23 chapters, as they are in the Greek, with Nehemiah beginning at chapter 11. The eBible.org files it was taken from also carry the Apocrypha, and give Esther and Daniel only in their longer Greek forms; none of those were taken in, so there is no Esther and no Daniel here, and no Tobit or Wisdom either.

