# The narrative, one paragraph per key, in order.
hero.1=このコーパスにある宗教改革期の聖書はすべて、1516年にバーゼルで印刷された一冊の書物にさかのぼる。ロッテルダムのエラスムスは、誰よりも先にギリシャ語新約聖書を活字にしたいと望み、速さを優先して仕事を進めた——バーゼルで手に入れられたわずかな後代の写本、しかもどれも特に古いものではなかった。彼の手元にあったヨハネの黙示録の写本は最後の一葉を欠いていたため、その最後の六節をラテン語ウルガータから逆にギリシャ語へ訳し戻した。その六節は印刷に入り、そのまま四世紀にわたって残り続けた。
hero.2=この本文はその後百年にわたって訂正され、版を重ねた——エラスムス自身によって、続いてパリのロベール・エティエンヌ、ジュネーヴのテオドール・ベザによって。エティエンヌの1551年の第四版は、学術の範囲を大きく超える結果をもたらす仕事をした。本文を番号付きの節に分けたのである。それが今日、世界中のほぼすべての聖書に印刷されている節番号であり、このリーダーで表示を切ることができるのもその番号である。
hero.3=名前がついたのは最後であり、それは宣伝文句から生まれた。1633年、ライデンのエルゼビア兄弟は自らの版を、読者が今こそ「万人に受け入れられた本文」——textus receptus——を手にしたという一文で売り出した。それは学術的な判定ではなく書籍商の宣伝だったが、その名は定着した。十九世紀になってより古い写本が見つかると、ティッシェンドルフからウェストコットとホートに至る校訂者たちはそれらに基づいて新しい本文を作り上げ、現代の翻訳の多くはそちらに従っている。それでもテクストゥス・レセプトゥスがここに残されているのには理由がある。ルター、ティンダル、ジュネーヴの訳者たち、そしてキング・ジェイムズの委員たちが実際に目の前にしていたのはこの本文であり、彼らの訳語はこれを基準にして読まれなければならないからである。

