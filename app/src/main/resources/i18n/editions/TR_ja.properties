title=テクストゥス・レセプトゥス — この版について | Common Root
description=テクストゥス・レセプトゥス：ルター訳、ティンダル訳、キング・ジェイムズ・バージョンの背後にある印刷されたギリシャ語新約聖書。1516年にエラスムスが最初に校訂し、1633年の出版広告の一文からその名を得た。
heroHeading=テクストゥス・レセプトゥス
