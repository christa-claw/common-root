title=ديودَاتي 1885 (الإيطالية) — عن هذه الطبعة | Common Root
description=كتاب جوفاني ديودَاتي المقدس بالإيطالية في صورة من القرن التاسع عشر: نصه لسنة 1641 في مراجعة سنة 1821، ضمن طبعة مؤرخة بسنة 1885 — الترجمة نفسها التي في ديودَاتي الآخر في هذه المجموعة، مقسومةً إلى آيات على نحو آخر.
heroHeading=ديودَاتي 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=هذه ترجمة جوفاني ديودَاتي — الجنيفي ذي الأصل اللوكّي، المولود سنة 1576، الذي نشر سنة 1607 أول كتاب مقدس إيطالي مترجَم عن العبرية واليونانية لا عن اللاتينية، ونقّحه بحواشٍ من عنده سنة 1641، قبل وفاته بثماني سنوات. ولديودَاتي الآخر في هذه المجموعة صفحة خاصة تروي تلك القصة. وطوال قرنين بعده عاش النص بإعادة الطبع، ومنذ سنة 1808 أصدرته جمعية الكتاب المقدس البريطانية والأجنبية طبعةً بعد طبعة، إذ لم يكن للبروتستانت الإيطاليين شيء آخر يُطبع.
hero.2=وهذا الملف إحدى تلك الصور اللاحقة. فموقع eBible.org، الذي يقدّمه نيابة عن جمعيات الكتاب المقدس المتحدة، يصفه بأنه ترجمة ديودَاتي لسنة 1641 منقّحةً سنة 1821، في طبعة مؤرخة بسنة 1885. أما من صنع مراجعة سنة 1821 وأيّ مطبعة طبعت طبعة سنة 1885، فأمر لم يثبته هذا المشروع، ولذا لا تسمّيهما الصفحة. وليس التاريخ هنا مشكلة كما هو في ديودَاتي الآخر، الذي تسميته سنة وفاة ديودَاتي: فـ1885 تاريخ الطبعة نفسها، يخزنه الفهرس، وتُظهره شارة الدرجة.
hero.3=إذا وُضع إلى جانب ديودَاتي الآخر، فالعبارة واحدة في كل عيّنة: «il Signore è il mio pastore» في المزمور 23، و«la Vergine concepirà» في إشعياء 7:14، والشهود السماويون في 1 يوحنا 5:7، والتمجيد في ختام الصلاة الربانية، وأعمال الرسل 8:37 كاملة. والاسم الإلهي «il Signore»، أي الرب، كما كتبه ديودَاتي؛ والريفيدوتا، وهي تنقيح لهذا النص صدر سنة 1924، هي التي غيّرته إلى «l'Eterno». أما ما يختلف فهو تقسيم الآيات. ففي أكثر من ثلاثين موضعًا تتبع هذه النسخة نظامًا آخر قريبًا من العبري — تبدأ صلاة يونان عند 2:1 ويمتد الأصحاح إلى 2:11، ولإشعياء 8 آية 23، ويمتد أيوب 39 إلى الآية 38، وتقع الآية الأولى من كولوسي 4 في آخر الأصحاح 3 — فهي تعدّ سبع آيات أقل في المجموع. ثم إن هذه النسخة خالية من عناوين المزامير كلها: يبدأ المزمور 51 مباشرة بـ«Abbi pietà di me, o Dio»، حيث يدمج ديودَاتي الآخر العنوان في الآية الأولى. وعرضُ eBible.org نفسه لهذا النص يُظهر العناوين، فالأرجح أنها ضاعت في استيراد هذا المشروع لا أنها غائبة عن طبعة سنة 1885.
hero.4=وهو في هذا القارئ واحد من ثلاثة كتب مقدسة إيطالية. وتفتح الواجهة الإيطالية على ديودَاتي الآخر، ديودَاتي 1649، الذي يأتي أولًا في ترتيب الفهرس، إذ ليس للإيطالية اختيار منتقى. وليس له في درجات النسب أصل مسجّل — ولا حتى تلك النسخة الأخرى من الترجمة نفسها — فالدرجة المفتوحة تحت الآية تهبط مباشرة إلى أرضية اللغات الأصلية المعلَّمة بـ≈. وكما في ديودَاتي الآخر، فالنص المستلم هناك قريب من الحقيقة: فقد عمل ديودَاتي على يونانية بيزا المطبوعة، وهي نص من تلك الأسرة.

