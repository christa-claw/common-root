fact.11.label=في هذه المجموعة
fact.11.value=واحد من ثلاثة كتب مقدسة إيطالية، إلى جانب [[DIO|ديودَاتي 1649]] و[[RIV1927|ريفيدوتا 1927]]؛ تفتح الواجهة الإيطالية على ديودَاتي 1649؛ ولا أصل مسجّل في درجات النسب، وتُظهر شارة درجته 1885
