title=Corano — Sablukov — Informazioni su questa edizione | Common Root
description=La traduzione russa di Gordij Sablukov, pubblicata a Kazan nel 1878 e solitamente descritta come la prima traduzione russa del Corano fatta direttamente dall'arabo piuttosto che tramite un intermediario francese o inglese — e in questo corpus la traduzione russa di accompagnamento mostrata sotto il testo arabo uthmani.
heroHeading=Corano — Sablukov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordij Semenovič Sablukov (1803-1880) si formò per il clero ortodosso russo, laureandosi al Seminario Teologico di Orenburg nel 1826 e all'Accademia Teologica di Mosca nel 1830. Trascorse i due decenni successivi, dal 1830 al 1849, insegnando storia e lingue orientali al Seminario Teologico di Saratov — dove, a metà degli anni Quaranta dell'Ottocento (1840), tra i suoi allievi vi fu il futuro scrittore radicale Nikolaj Černyševskij — prima di passare nel 1849 al dipartimento missionario dell'Accademia Teologica di Kazan, dove insegnò lingue orientali e classiche fino al 1862.
hero.2=Le traduzioni russe del Corano risalgono al 1716, quando Pëtr Postnikov ne realizzò una per ordine di Pietro il Grande — ma dal francese di André du Ryer, non dall'arabo, così come quella di Aleksej Kolmakov del 1792, fatta dall'inglese di George Sale. Quella di Sablukov, pubblicata a Kazan nel 1878 come "Коран, законодательная книга мохаммеданского вероучения" ("Il Corano, il libro legislativo della fede mohammedana"), è generalmente considerata la prima traduzione russa del Corano fatta direttamente dall'originale arabo, frutto dei suoi anni di insegnamento delle lingue orientali a Kazan.
hero.3=L'anno seguente la fece seguire da un volume di note di accompagnamento, "Приложения к переводу Корана" (1879), e più tardi da altri due studi collegati: "Сведения о Коране" ("Informazioni sul Corano", 1884) e un trattato comparativo precedente sull'insegnamento cristiano e musulmano riguardo ai nomi di Dio (1873). La sua traduzione è rimasta da allora una delle versioni russe più diffuse, anche dopo che traduzioni più recenti — tra cui quella di Ignatij Kračkovskij, pubblicata postuma — divennero più note nell'uso accademico sovietico e post-sovietico.
hero.4=Ciò che è stato digitalizzato qui, nell'edizione ru.sablukov di alquran.cloud, è offerto in questo corpus come la traduzione russa di accompagnamento [[Q-AR|al testo arabo uthmani]], insieme alle traduzioni inglesi di [[Q-EN|Pickthall]] (1930) e di [[Q-YA|Yusuf Ali]] (1934) — le tre traduzioni che una rassegna delle traduzioni disponibili trovò inequivocabilmente libere da diritti, una per lingua oltre all'arabo.

