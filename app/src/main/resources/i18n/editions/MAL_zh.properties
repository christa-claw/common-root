title=马立克穆瓦塔 — 关于此版本 | Common Root
description=马立克穆瓦塔：伊玛目马立克·伊本·艾奈斯在麦地那编成的法律与圣训合编之作，早于逊尼派六大圣训集约一个世纪，有时被认为应取代伊本·马哲圣训集在六大圣训集中的位置。
heroHeading=马立克穆瓦塔
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=马立克·伊本·艾奈斯·伊本·马立克·艾布·阿米尔·艾斯巴赫·麦地那人，以库尼亚"艾布·阿卜杜拉"著称，约于希吉拉历93年（公元711年）生于麦地那，于希吉拉历179年（公元795年）卒于麦地那，葬于白格尔公墓。他师从希沙姆·伊本·欧尔瓦、伊本·希哈布·祖赫里、贾法尔·萨迪克和纳菲尔·毛拉·伊本·欧麦尔等学者，终生在麦地那授徒讲学，获"伊玛目·达尔·希吉拉"（"迁徙之城的伊玛目"）和"伊斯兰长老"（谢赫·伊斯兰）等尊称。他成为马立克学派的创始人——逊尼派四大教法学派之一；他最著名的学生，穆罕默德·伊本·伊德里斯·沙斐仪——后来创立沙斐仪学派——称马立克之书"除古兰经外，大地上最可靠之书"。据称阿拔斯王朝哈里发曼苏尔曾想将此书定为帝国唯一的法律依据；马立克本人婉拒了。
hero.2=据传统记载，《穆瓦塔》（意为"通行之路"）历时约四十年，于阿拔斯王朝早期编成；其名据称源于马立克曾将书稿呈示麦地那七十位法学家，众人皆表示认同（瓦塔阿）。此书将归于先知的圣训与其门弟子及再传弟子的法律言论，以及马立克本人的教法裁决合编为一体——据一种评价，这是现存最早以此方式融合圣训与教法（菲格赫）的著作，早于六大圣训集约一个世纪。关于其篇幅，因版本和计数方式不同而有别：一个常被引用的圣训数字约为1,720则，而据称马立克从他所能获得的100,000则传述中，精选出不足1,900则。
hero.3=《穆瓦塔》至少有十六种已知传本。成为标准参考本的——尤其为马立克学派所用——是叶哈雅·伊本·叶哈雅·莱西的传本；艾哈迈德·伊本·艾比·拜克尔·祖赫里的另一传本则长约五至十个百分点。单就莱西传本而言，已有约百部注释著作。由于《穆瓦塔》早于逊尼派六大圣训集，部分学者——马立克派和伊本·艾西尔等人——主张应是《穆瓦塔》而非[[IBM|伊本·马哲圣训集]]列入这一经典名单；而一般认为，伊本·马哲的《圣训集》之所以保住此位，是因为其内容与其余五部重复最少，而非因其被判定为更可靠。
hero.4=此处的阿拉伯语文本是公有领域的古典正文（matn）。阅读器中其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-malik版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]、[[TIR|提尔米济圣训实录]]、[[NAS|奈萨仪圣训集]]、[[IBM|伊本·马哲圣训集]]及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

