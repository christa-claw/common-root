title=Agricola 1548 — Su questa edizione | Common Root
description=Il finlandese di Mikael Agricola: il Nuovo Testamento del 1548, il Salterio del 1551 e i profeti — la prima Scrittura stampata in finlandese, e l'inizio stesso del finlandese scritto.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Con un ringraziamento a chi ha inviato correzioni a questa pagina.

# The narrative, one paragraph per key, in order.
hero.1=Il più antico finlandese a stampa che esista. Quando Mikael Agricola pubblicò Se Wsi Testamenti nel 1548, il finlandese non era quasi mai passato per una tipografia: il suo abbecedario di pochi anni prima era stato, semplicemente, il primo libro finlandese. Fra i due uscì ancora il libro di preghiere del 1544, un'opera di mole notevole che conteneva già traduzioni di salmi. Per stampare la Scrittura dovette prima decidere come si scrivesse la lingua, e quelle decisioni — l'ortografia, i prestiti, la cadenza — sono il punto in cui comincia il finlandese scritto. Il Nuovo Testamento costò a lui e alla sua cerchia di Turku più di un decennio; il Salterio seguì nel 1551, e le selezioni dai profeti e dai libri di Mosè nel 1551 e nel 1552. Il suo fu però il primo finlandese a stampa, non il primo scritto: quattro manoscritti — il Codex Westh, il codice B 28 di Uppsala, il messale di Kangasala e il frammento di Uppsala — recano passi biblici in finlandese, e Kauko Pirinen dimostrò nel 1988, confrontandoli con le loro fonti svedesi, che parte di essi è più antica di quanto Agricola abbia stampato, forse scritta già negli anni Trenta del Cinquecento.
hero.2=Non tradusse mai l'intera Bibbia, e questo lettore non finge il contrario. Il Nuovo Testamento e tutti i 150 salmi sono completi; i profeti e i libri di Mosè compaiono in selezione. C'è anche ciò che rese altrove: il suo libro di preghiere del 1544 e la sua Käsikirja e la sua Messu del 1549 recano testo biblico proprio — fra cui i capitoli della Genesi stampati sotto il titolo "Genesist mutomat Lughut" — e 685 versetti vengono di lì. Si usano soltanto dove i volumi scritturali non hanno un versetto a quell'indirizzo, e soltanto dove il testo procede continuo invece di stare come citazione isolata dentro una preghiera. Così la Genesi c'è dopo tutto, in parte: capitoli 1–4, 22, 28 e 32. Giudici, Rut, 1 Cronache ed Ester mancano del tutto. Un Antico Testamento finlandese completo dovette aspettare la Biblia del 1642, un piolo più su.
hero.3=In questo lettore Agricola è il piolo finlandese più antico. Aprite un piolo sotto un versetto della Biblia 1642 e il suo testo compare accanto al tedesco di Lutero — le due fonti che il comitato del 1642 aveva davvero aperte. Sotto Agricola stesso la catena lascia il finlandese per sempre: egli lavorava sul greco di Erasmo e sul latino che Erasmo stampava accanto, sul tedesco di Lutero e sulla Vulgata. Tre di essi sono registrati qui come suoi genitori; il latino di Erasmo e la Bibbia svedese di Gustavo Vasa del 1541, che pure usava, non sono in questo corpus. Il testo è quello del corpus VKS di Kotus, nella grafia della stampa del 1548: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". La Scrittura in svedese era a stampa dal 1526, quando uscì il Nuovo Testamento svedese, sicché una versione svedese gli fu disponibile fin dall'inizio.

