title=Versión Biblia Libre — Acerca de esta edición | Common Root
description=Versión Biblia Libre: una Biblia en español de Free Bible Ministry, traducida por Jonathan Gallagher y Shelly Barrios de Avila como la hermana en español de la Free Bible Version en inglés, y licenciada libremente para cualquier uso.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre es la hermana en español de la Free Bible Version en inglés, publicada por el mismo editor, Free Bible Ministry, una entidad sin ánimo de lucro con sede en Laurel, Maryland. Su Nuevo Testamento se atribuye a los traductores Jonathan Gallagher y Shelly Barrios de Avila, con Gustavo Sanabria y Rebekah Põldaas como colaboradores, y lleva derechos de autor fechados en 2018–2020 a nombre de Gallagher y Barrios de Avila. Como su hermana en inglés, existe para quitar la página de derechos de autor como obstáculo para su uso: el texto puede copiarse, imprimirse, publicarse en línea o adaptarse por cualquiera, sin regalías y sin permiso que pedir.
hero.2=Los preliminares publicados documentan con claridad la base del Nuevo Testamento —traducido directamente del texto griego de Nestle–Aland, el texto crítico que emplean las sociedades bíblicas— pero no nombran por separado un texto base para el Antiguo Testamento, aun cuando la edición que contiene este corpus es el canon protestante completo de sesenta y seis libros. Donde los materiales dejan un vacío, aquí también se deja, en lugar de llenarlo con una suposición.
hero.3=En este lector es una de cinco ediciones españolas. La interfaz en español sigue abriendo por defecto la [[RVR09|Reina-Valera 1909]], un texto de dominio público de una tradición enteramente distinta y siglos más antigua; esta edición se alcanza en cambio desde su propia tarjeta, junto con [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] y [[NBLA|Nueva Biblia de las Américas]]. No es una revisión de ninguna de ellas, de modo que no se le registra ningún texto base en los peldaños del linaje: un peldaño abierto bajo un versículo de la Versión Biblia Libre cae directamente al suelo de lenguas originales marcado con ≈. Su pariente más cercano en este corpus no es español en absoluto: [[FBV|la Free Bible Version]], la traducción al inglés del mismo ministerio, bajo la misma licencia.

