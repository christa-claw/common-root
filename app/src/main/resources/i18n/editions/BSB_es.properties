title=Berean Standard Bible — Acerca de esta edición | Common Root
description=La Berean Standard Bible: una traducción al inglés moderno hecha por los equipos de Bible Hub y Discovery Bible a partir del hebreo masorético y de un Nuevo Testamento griego editado por ellos mismos — y luego cedida al dominio público.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=La Berean Standard Bible es una de las traducciones más recientes de esta colección y una de las más transparentes sobre su propio trabajo. La hicieron los equipos de Bible Hub y Discovery Bible bajo un comité asesor, y apareció primero con otro nombre: Berean Study Bible. Aquello causaba una confusión constante, porque una study Bible suele significar una Biblia rellena de comentario y notas, cosa que esta no es. Se le cambió el nombre; la abreviatura se quedó.
hero.2=La mayoría de las traducciones parten de un Nuevo Testamento griego editado por otros. Este proyecto construyó primero el suyo. La Berean Greek Bible toma como base Nestle 1904 —elegido, dicen sus editores, por ser el texto crítico más exacto que ya está en dominio público— y lo coteja con Nestle–Aland, el Nuevo Testamento griego de la SBL, Tischendorf, Westcott–Hort, el texto bizantino y el Textus Receptus, anotando al pie donde discrepan. De ahí se tradujo el inglés. El Antiguo Testamento viene del hebreo masorético, consultando los rollos del mar Muerto, la Septuaginta y otros testigos antiguos donde inciden en una lectura. Ese mismo trabajo se publicó luego por capas: un interlineal palabra por palabra, una edición rígidamente literal y esta legible, de modo que el lector pueda ir del griego al inglés paso a paso en vez de fiarse de la palabra de los traductores. Eso sitúa además a la Berean al otro lado de una divisoria que este corpus deja ver: la Biblia de Ginebra y la King James Version descienden aquí del Textus Receptus, y esta no.
hero.3=Lo último que el proyecto hizo con el texto fue regalarlo. Los textos bereanos se cedieron al dominio público en abril de 2023, y por eso la Biblia entera puede estar en este corpus y volver a copiarse fuera de él. Si se pone la interfaz del lector en inglés, lo que se abre es la New International Version, que está aquí con licencia; la Berean es el inglés moderno a su lado que cualquiera puede citar, imprimir y redistribuir. En los peldaños del linaje se comporta como la Biblia en Español Sencillo. No se le registra ningún texto base, porque es una traducción nueva y no la revisión de nada que el corpus contenga, así que un peldaño abierto bajo un versículo bereano cae directamente al suelo de lenguas originales marcado con ≈ y no a una Biblia inglesa más antigua. El catálogo también deja en blanco su año. No es un descuido: el texto se sigue revisando conforme llegan correcciones, y los años aquí son elegidos y no adivinados, de modo que una edición sin una sola impresión fechada no recibe fecha.

