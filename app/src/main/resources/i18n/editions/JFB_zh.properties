title=日语 Freedom Bible — 关于此版本 | Common Root
description=日语 Freedom Bible（フリーダム・バイブル）：一部完整的 66 卷日语圣经，由 eBible.org 作为未设版权的翻译草稿发布——本语料库中唯一的日语圣经，因此日语界面默认打开它。
heroHeading=日语 Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=日语 Freedom Bible——日文名フリーダム・バイブル——是一部完整的日语圣经，由 eBible.org 发布；eBible.org 自称是该译本的官方发布方。它非常新：本语料库所存的源文件日期为 2026 年 8 月 19 日，其卡片上的 2026 年即这些文件的日期。eBible 没有另行给出出版日期，本页也不作任何断言。
hero.2=关于它，许多情况并无记载，这一点值得直说。eBible 的页面没有列出译者、委员会或出版者，也没有说明译本据何译出——是直接译自希伯来文和希腊文，还是经由另一部现代译本转译。它自己的版权页称之为翻译草稿（翻訳の草案），并欢迎提出改进建议；因此这里的文本是一项进行中工作的快照，而非定本。
hero.3=明确的是它的法律地位：同一页面声明该译本未设版权，并将其标为公有领域。正因如此，它成了本语料库的日语文本——它是 eBible 上唯一一部不受版权约束的完整日语圣经。本可为它提供谱系的较早日语圣经，即 1887 年完成、早已进入公有领域的明治时期译本，无法从该来源获得。
hero.4=在本语料库中，它收有新教正典的 66 卷，共 31,098 节，不含次经。它没有记录任何底本，因此在它的某一节下展开一级，便直接到达以 ≈ 标示的原文底层：那里显示的希伯来文和希腊文是见证，而非关于它据何译出的断言——既然其来源不明，这正是诚实的读法。它是语料库中唯一的日语圣经，因此日语界面默认打开它。

