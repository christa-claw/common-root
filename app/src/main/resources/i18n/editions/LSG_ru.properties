title=Луи Сегон 1910 (французская) — Об этом издании | Common Root
description=Библия Сегона в редакции 1910 года: перевод женевского пастора с еврейского и греческого, впервые напечатанный целиком в 1880 году, пересмотренный для Британского и иностранного библейского общества и на целый век ставший обычной Библией франкоязычных протестантов.
heroHeading=Луи Сегон 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Луи Сегон родился в 1810 году в Пленпале, тогда у самых ворот Женевы, и умер в Женеве в 1885 году. Он изучал богословие на протестантском факультете в Страсбурге, в двадцать шесть лет получил степень доктора богословия и двадцать четыре года был пастором сельского прихода Шен-Бужри, прежде чем обратиться к преподаванию еврейского языка и Ветхого Завета. Достопочтенная компания пасторов Женевы поручила ему заново перевести Ветхий Завет с еврейского, и его перевод вышел в издании, датированном 1874 годом. Затем он по собственному почину перевёл Новый Завет — по критическому греческому тексту Константина Тишендорфа, а не по Textus Receptus, — и в 1880 году вся Библия вышла в одном томе, напечатанная в Оксфорде.
hero.2=Это не совсем тот текст, который издал Сегон. После его смерти Британское и иностранное библейское общество поручило пересмотреть его группе французских и швейцарских пасторов и богословов, и редакция вышла в 1910 году. Их правка тяготела к словарю протестантской ортодоксии — священники стали «sacrificateurs», старым протестантским словом, а не «prêtres»; в этой копии «sacrificateur» встречается повсюду, а «prêtre» редко. Именно этот текст 1910 года стал справочной Библией французского протестантизма на большую часть двадцатого века и до сих пор остаётся среди самых читаемых у франкоязычных евангельских христиан. У него и длинный род позднейших редакций: «Colombe» 1978 года, Nouvelle Édition de Genève 1979 года и Segond 21 в 2007 году. Некоторые черты видны почти на каждой странице. Имя Божие передано как «l'Éternel», Вечный, как у Остервальда и во французском Дарби, что стоит рядом в этом собрании: «L'Éternel est mon berger» в Псалме 23. А Исаия 7:14 читается «la jeune fille deviendra enceinte» — молодая женщина, а не дева, — именно такого рода передача, за которую некоторые консервативные протестанты обвиняли Сегона в ослаблении мессианских пророчеств.
hero.3=В Псалтири книга следует еврейскому тексту: нумерация еврейская, так что Псалом 23 — это псалом о пастыре, и где надписание псалма в еврейском — стих, оно стих и здесь: в Псалме 51 — 21 стих, на два больше, чем в King James Version. Иоиль и Малахия, напротив, сохраняют деление на главы латинской и английской традиции — три главы и четыре. В этой читалке она одна из трёх французских Библий, рядом с Остервальдом и французским Дарби. Французский интерфейс открывает не её: для французского нет отобранного вручную выбора, поэтому читалка берёт первую французскую Библию в порядке каталога, а это Дарби. В ступенях родословия источник для неё не записан, так что ступень, открытая под стихом, уходит прямо на пол исходных языков, помеченный знаком ≈ — для Ветхого Завета это Ленинградский кодекс, рукопись масоретской традиции, а не печатный еврейский текст времён Сегона, а для Нового — Textus Receptus, то есть именно тот греческий текст, которому он решил не следовать. Метка ступени у неё несёт год 1910.

