title=İbranice Kutsal Kitap — Bu Baskı Hakkında | Common Root
description=Kutsal Kitabın tamamı İbranice: Masoretik Eski Antlaşma ile Franz Delitzsch'in 1877 tarihli Yeni Antlaşması; kitabı bütünüyle tek bir dilde isteyen okurlar için Mişna İbranicesine geri çevrilmiş.
heroHeading=İbranice Kutsal Kitap — Masoretik Eski Antlaşma ve Delitzsch'in Yeni Antlaşması
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Baştan sona İbranice bir Kutsal Kitap, kulağa geldiğinden daha yabancı bir nesnedir; çünkü yarısı hiçbir zaman İbranice yazılmadı. Eski Antlaşma İbranicedir ve hep öyleydi. Yeni Antlaşma ise Yunanca olarak geldi. Dolayısıyla bunun gibi bir baskı, birbirine dikilmiş iki ayrı türden metindir: bir özgün metin ve alışılmışın tersi yönde yapılmış bir çeviri — Yunanca'dan geriye, yazarlarının çoğunlukla konuştuğu dile.
hero.2=Yeni Antlaşma yarısı, İbranice ve rabbinik yazın uzmanı Leipzigli Franz Delitzsch'in işidir; İngiliz ve Yabancı Kutsal Kitap Kurumu 1873'te ısmarladı, o da 1877'de bitirdi. Kendi yüzyılının İbranicesine çevirmedi. Mişna'nın ve İkinci Tapınak döneminin İbranicesiyle yazdı; gerekçesi, birinci yüzyıldan bir metnin öyle de tınlaması gerektiğiydi — böylece ortaya çıkan şey, İbraniceye bir aktarımdan çok, cümlelerin Yunanca olmadan önce ne olabileceğini geri kazanma denemesi gibi okunur. Bugün de en sık başvurulan İbranice Yeni Antlaşma odur.
hero.3=Hangi Yunanca metinden çalışacağına bir ölçüde onun yerine karar verildi. Birkaç on yıl önce bulunmuş dördüncü yüzyıl elyazması Codex Sinaiticus'tan başladı; ama ilkesi kabul görmüş metinden yayımlamak olan Kutsal Kitap Kurumu, onun üzerine kurulmuş bir sürümü fonlamayı sürdürmeyi reddetti. Delitzsch Textus Receptus'a döndü ve önemli Sina okuyuşlarını benimsemek yerine kenara işaretledi. Metin bundan sonra on üç yıl ve on baskı boyunca hareket hâlinde kaldı; sonuncusunu 1890'da, Delitzsch'in öldüğü yıl, Gustav Dalman baskıya hazırladı. Kataloğun bu baskının yılını boş bırakmasının bir sebebi budur: iki yarı hiçbir tarihi paylaşmaz ve tarihi olan yarının on tanesi vardır.
hero.4=Bu okuyucuda, İbranice arayüzün üzerinde açıldığı baskı budur — seçilmiş bir tercih, alfabetik bir rastlantı değil — ve İbraniceyi seçmek, onun çevresinde bütün arayüzü sağdan sola döndürür. Leningrad Kodeksi'yle yarışmadan onun yanında durur: Kodeks, tümüyle harekeli ve ezgi işaretli, Eski Antlaşma nerede biterse orada duran bilimsel Tanah'tır; buradaki ise Vahiy'e kadar süren yalın bir ünsüz metnidir. Soy basamaklarında ona hiçbir kaynak kaydedilmemiştir, bu yüzden bir ayetin altında açılan basamak doğruca özgün dil tabanına düşer, ≈ WLC ve ≈ TR. Bu derlemenin başka yerlerinde o taban bir yaklaşıklıktır ve ≈ işaretinin uyardığı şey budur. Burada neredeyse öyle değildir: ekrandaki Eski Antlaşma Masoretik metnin kendisidir ve Textus Receptus da Delitzsch'in gerçekten önünde duran şeydir.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Dil
fact.1.value=İbranice — harekesiz ve ezgi işaretsiz ünsüz metni
fact.2.label=Bu nedir
fact.2.value=tek bir Kutsal Kitap olarak ciltlenmiş iki metin: geleneksel Masoretik Eski Antlaşma ve on dokuzuncu yüzyılda Yunanca'dan çevrilmiş İbranice bir Yeni Antlaşma
fact.3.label=Yeni Antlaşma'yı çeviren
fact.3.value=Franz Delitzsch (1813–1890), Leipzigli İbranice bilgini
fact.4.label=Ismarlayan
fact.4.value=İngiliz ve Yabancı Kutsal Kitap Kurumu, 1873'te; çeviri 1877'de tamamlandı
fact.5.label=Eski Antlaşma şundan
fact.5.value=Masoretik İbranicenin kendisinden — bir çeviri değil; bu da onu, Eski Antlaşması hâlihazırda kendi özgün dilinde olan buradaki tek baskı yapar, tıpkı [[WLC|Westminster Leningrad Kodeksi]] gibi
fact.6.label=Yeni Antlaşma şundan
fact.6.value=[[TR|Textus Receptus]]'un Yunancasından. Delitzsch bunun yerine Codex Sinaiticus'tan başlamıştı, ama Kutsal Kitap Kurumu kabul görmüş metinden yayımlıyordu ve bu ayrılığı fonlamak istemedi
fact.7.label=Dil katmanı
fact.7.value=modern İbranice değil. Delitzsch, Mişna'nın ve İkinci Tapınak döneminin İbranicesiyle yazdı; Yunanca'ya, onu konuşanların kullanmış olacağı deyişi geri vermeye çalıştı
fact.8.label=Şu yıla dek gözden geçirildi
fact.8.value=1890; son baskıyı Gustav Dalman baskıya hazırladı
fact.9.label=Şununla karıştırılmamalı
fact.9.value=İsrail'deki Kutsal Kitap Kurumu'nun yayımladığı modern İbranice Yeni Antlaşma; o, yirminci yüzyıla ait ayrı ve hâlâ telif altındaki bir çeviridir
fact.10.label=Katalogdaki yıl
fact.10.value=boş bırakıldı — iki yarı ortak bir yıl taşımaz ve yalnızca Yeni Antlaşma on üç yıl ile on baskı boyunca gözden geçirildi
fact.11.label=Bu derlemede
fact.11.value=66 kitabın tamamı ve İbranice arayüz için seçilmiş varsayılan — okuyucu [[WLC|Westminster Leningrad Kodeksi]] yerine bunun üzerinde açılır, çünkü bu, Yeni Antlaşma'nın sonuna kadar gider
