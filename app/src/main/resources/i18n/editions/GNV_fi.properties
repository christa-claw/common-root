title=Geneven Raamattu 1599 — Tietoja tästä laitoksesta | Common Root
description=Geneven Raamattu: Genevessä maanpaossa olleiden englantilaisten protestanttien tekemä, ensimmäinen englanninkielinen Raamattu, jossa on jaenumerointi ja reunahuomautukset — Shakespearen sukupolven lukema ja Kuningas Jaakon käännöksen alapuolinen askelma.
heroHeading=Geneven Raamattu 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Tämä Raamattu tehtiin ulkomailla, ihmisten toimesta, jotka eivät voineet turvallisesti jäädä kotiin. Kun Maria I nousi valtaistuimelle 1553 ja Englanti palasi Roomaan, muutama sata protestanttia lähti; osa heistä asettui Calvinin Geneveen, jossa oli painokoneita, heprean ja kreikan oppineisuutta eikä piispaa, jolle vastata. William Whittingham julkaisi siellä Uuden testamentin 1557. Anthony Gilbyn johtama ryhmä kävi läpi Vanhan testamentin, ja täydellisen Raamatun painoi Genevessä Rowland Hall vuonna 1560, kaksi vuotta Marian kuoleman jälkeen, kun useimmat pakolaiset olivat jo palanneet kotiin.
hero.2=Se, mitä he tuottivat, muutti englanninkielisen Raamatun ulkonäön. Se oli ensimmäinen, jossa jokainen jae oli numeroitu, joten lukija voitiin ohjata riville eikä lukuun. Se ladottiin antiikvalla fraktuuran sijaan ja julkaistiin niin pienenä ja halpana, että sen saattoi omistaa sen sijaan että se olisi ollut kahlittuna lukupulpettiin. Ja marginaalit olivat täynnä: ristiviitteitä, selityksiä vaikeista sanoista, karttoja ja huomautuksia siitä, mitä kohta tarkoitti. Juuri viimeksi mainittu on syy siihen, että sitä rakastettiin ja että se herätti närää. Selitykset ovat reformoituja, paikoin terävästi, ja ne kertovat lukijalle yhtä auliisti mitä ajatella kuninkaista kuin mitä ajatella opista.
hero.3=Tämän laitoksen vuosiluku vaatii varauksen, sillä Geneven Raamattu ei ollut yksi kirja vaan kahdeksankymmentä vuotta uudelleen painettu teksti, jonka osat vaihtuivat. Vuonna 1576 Laurence Tomson korvasi Uuden testamentin omalla tarkistuksellaan, joka oli tehty Theodore Bezan vuoden 1565 kreikankielistä laitosta vasten, ja vuodesta 1587 juuri se on se Uusi testamentti, joka useimmissa Geneven Raamatuissa on. Vuonna 1599 lisättiin Franciscus Juniuksen selitykset Ilmestyskirjaan. “1599” nimeää siis kokoonpanon — Tomsonin Uusi testamentti ja Junius Ilmestyskirjasta — täsmällisemmin kuin painovuoden, ja tuota vuosilukua kantavia Raamattuja painettiin senkin jälkeen. Siksi luettelokortti jättää vuoden tyhjäksi, kun taas askelmamerkintä, joka tarvitsee jotakin lyhyttä näytettäväksi, lukee GNV 1599.
hero.4=Sen asema tässä kokoelmassa on sarana. Pisin polveutumisketju täällä kulkee World English Biblestä American Standard Versioniin, siitä Revised Versioniin ja Kuningas Jaakon käännökseen, ja sitten tähän: avaa yksi askelma lisää Kuningas Jaakon jakeen alta, ja Geneven sanamuoto ilmestyy sen alle — yksinkertaisin tapa nähdä, kuinka paljon Kuningas Jaakosta on perittyä eikä sepitettyä. Geneven alla ei ole enää mitään englanniksi — vain kreikka ja heprea, Textus Receptus ja Westminsterin Leningradin koodeksi, joissa tikkaat saavuttavat pohjansa. Teksti annetaan sellaisena kuin laitoksessa se on, kirjoitusasuineen kaikkineen, joten 1. Moos. 1:1 sanoo heauen; psalmien päällekirjoitukset ja Heprealaiskirjeen loppusanat kulkevat sisäkkäin ensimmäisen jakeen alussa, kuten nuo painokset ne asettivat, ja ne on jätetty sinne siivoamatta pois.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=englanti — elisabetiaanista, alkuperäisessä kirjoitusasussaan
fact.2.label=Tekijät
fact.2.value=Maria I:n hallituskautta paenneet englantilaiset protestantit, jotka asettuivat Geneveen — William Whittingham teki vuoden 1557 Uuden testamentin ja Anthony Gilbyn johtama ryhmä Vanhan
fact.3.label=Ensimmäinen täydellinen laitos
fact.3.value=1560, painoi Genevessä Rowland Hall
fact.4.label=Vanha testamentti
fact.4.value=masoreettisesta hepreasta — [[WLC|Westminsterin Leningradin koodeksi]] on tämän aineiston todistaja kyseisestä tekstistä
fact.5.label=Uusi testamentti
fact.5.value=[[TR|Textus Receptuksen]] linjan kreikasta; vuodesta 1576 Laurence Tomsonin tarkistus, joka tehtiin Bezan vuoden 1565 kreikankielistä laitosta vasten, syrjäytti Whittinghamin Uuden testamentin useimmissa painoksissa
fact.6.label=Mitä “1599” nimeää
fact.6.value=painoksia, joissa on Tomsonin Uusi testamentti ja Franciscus Juniuksen Ilmestyskirjan selitykset, jotka tulivat Geneven Raamattuun sinä vuonna
fact.7.label=Ensimmäisiä
fact.7.value=ensimmäinen englanninkielinen Raamattu, jossa kaikki jakeet on numeroitu, joka ladottiin antiikvalla fraktuuran sijaan ja jossa on täysi reunahuomautusten koneisto — tutkimusraamattu ennen kuin sanaa oli olemassa
fact.8.label=Vastusti
fact.8.value=Jaakko I, jonka mielestä reunahuomautukset olivat kapinallisia — valitus, joka osaltaan pani liikkeelle [[KJV|Kuningas Jaakon käännöksen]]
fact.9.label=Vuosi luettelossa
fact.9.value=tyhjä Tietoja-kortissa, vaikka askelmamerkinnässä lukee GNV 1599 — Geneven Raamattua painettiin uudelleen vuodesta 1560 aina 1640-luvulle asti sen Uuden testamentin ja selitysten vaihtuessa saman nimen alla
fact.10.label=Tässä aineistossa
fact.10.value=kaikki 66 kirjaa, ei apokryfeja, kirjoitusasu nykyaikaistamatta — 1. Moos. 1:1 kuuluu “the heauen and the earth”
fact.11.label=Askelman alla
fact.11.value=[[TR|Textus Receptus]] ja [[WLC|Westminsterin Leningradin koodeksi]]; Geneven Raamattu on itse ensimmäinen askelma [[KJV|Kuningas Jaakon käännöksen]] alla
