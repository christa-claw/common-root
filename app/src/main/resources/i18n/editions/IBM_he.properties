title=סונן אבן מאג'ה — על מהדורה זו | Common Root
description=סונן אבן מאג'ה: האחרון מבין ששת הספרים של האסלאם הסוני, מסודר לפי נושא הלכתי, אשר מעמדו ביניהם שנוי במחלוקת זה זמן רב בשל חדית׳ חלשים ומזויפים הכלולים בו גם כן.
heroHeading=סונן אבן מאג'ה
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=אבו עבד אללה מחמד בן יזיד אבן מאג'ה אלרבעי אלקזוויני נולד בשנת 209 להג'רה (824 לספירה) בקזווין, השוכנת כיום בצפון-מערב איראן, למשפחת מַוָאלי (לקוחות לא-ערבים) משבט רביעה — מאג'ה, לפי מסורת אחת, היה כינוי אביו ולא שם של סב או של אם. הוא נסע בחיפוש אחר חדית׳ בעיראק, אלחיג'אז, סוריה ומצרים, ולמד אצל מעגל רחב של חכמים; למעלה מרביע מהסונן העתידי שלו מיוחס, כך נאמר, למורה אחד בלבד, אבן אבי שייבה. בני דורו, כגון אבו יעלא אלח'לילי, שיבחו אותו כנאמן, בולט וכסמכות המוסכמת על הכול. הוא מת בקזווין בשנת 273 להג'רה (887 לספירה), אם כי אלכתאני מציין גם את שנת 275 (889 לספירה); לפי המסורת, לאחר שאבן מאג'ה קרא לו את הסונן המושלם, אמר אבו זרעה אלראזי כי אילו היה ברשות אנשים ספר זה, יתר אוספי הסונן היו מתייתרים ברובם.
hero.2=מתוך כחמישה-עשר חיבורים המיוחסים לו, הסונן שלו מונה, לפי מניינו של אלד'הבי, כ-1,500 פרקים וכ-4,000 חדית׳, מסודרים לפי נושא הלכתי כמו האוספים של [[ABD|אבו דאווד]] ו[[TIR|אלתרמד'י]]. לצד חומר תקין ומקובל הוא נושא גם חדית׳ שחכמים מאוחרים יותר שפטו כחלשים, ובהם כשלושים המוסכמים בדרך כלל כזיופים גמורים — הסיבה שבגללה חכמים מסוימים מונים רק את "החמישה" ולא את הששה.
hero.3=המסורת הסונית מונה את סונן אבן מאג'ה כאחרון ששת הספרים (כתב אלסתה), לצד [[BUK|צחיח אלבוכ'ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג'אמע אלתרמד'י]] ו[[NAS|סונן אלנסאאי]]. המקום השישי הזה עצמו שנוי במחלוקת: המאלכים ואבן אלאת'יר, בין אחרים, מונים במקומו את ה[[MAL|מואטא של מאלכ]], ויש המונים את סונן אלדארקוטני; הספר של אבן מאג'ה, כך נהוג לומר, קיבל את המקום הזה מפני שתוכנו חופף הכי פחות לחמישה האחרים, לא מפני שהוא נחשב לנאמן ביותר מבין המועמדים.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-ibnmajah של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אלבוכ'ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג'אמע אלתרמד'י]], [[NAS|סונן אלנסאאי]] ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

