title=Louis Segond 1910 (français) — À propos de cette édition | Common Root
description=La Bible Segond dans sa révision de 1910 : la traduction d'un pasteur genevois depuis l'hébreu et le grec, imprimée complète pour la première fois en 1880, révisée pour la Société biblique britannique et étrangère, et pendant un siècle la Bible courante des protestants francophones.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond naquit en 1810 à Plainpalais, alors aux portes de Genève, et mourut à Genève en 1885. Il étudia la théologie à la faculté protestante de Strasbourg, devint docteur en théologie à vingt-six ans et fut pendant vingt-quatre ans pasteur de la paroisse villageoise de Chêne-Bougeries avant de se tourner vers l'enseignement de l'hébreu et de l'Ancien Testament. La Vénérable Compagnie des pasteurs de Genève le chargea de traduire à nouveau l'Ancien Testament depuis l'hébreu, et sa version parut dans une édition datée de 1874. Il traduisit ensuite de sa propre initiative le Nouveau Testament, d'après le texte grec critique de Constantin Tischendorf et non le Textus Receptus, et en 1880 la Bible entière parut en un seul volume, imprimée à Oxford.
hero.2=Ce n'est pas tout à fait le texte que Segond publia. Après sa mort, la Société biblique britannique et étrangère le fit réviser par un groupe de pasteurs et de théologiens français et suisses, et la révision parut en 1910. Leurs changements penchaient vers le vocabulaire de l'orthodoxie protestante — les prêtres devinrent des « sacrificateurs », le vieux mot protestant, plutôt que des « prêtres » ; dans cette copie, « sacrificateur » est partout et « prêtre » rare. C'est ce texte de 1910 qui devint la Bible de référence du protestantisme français pendant la plus grande partie du XXe siècle, et il reste parmi les plus lus des évangéliques francophones. Il a aussi une longue descendance de révisions : la « Colombe » de 1978, la Nouvelle Édition de Genève de 1979 et la Segond 21 en 2007. Quelques traits se voient presque à chaque page. Le nom divin est « l'Éternel », comme chez Ostervald et dans la Darby française qui se trouve à côté dans ce corpus : « L'Éternel est mon berger » au Psaume 23. Et Ésaïe 7:14 porte « la jeune fille deviendra enceinte » — la jeune femme, non la vierge —, exactement le genre de rendu pour lequel certains protestants conservateurs accusèrent Segond d'affaiblir les prophéties messianiques.
hero.3=Dans les Psaumes, le livre suit l'hébreu : la numérotation est l'hébraïque, si bien que le Psaume 23 est celui du berger, et là où le titre d'un psaume est un verset en hébreu, il l'est ici aussi — le Psaume 51 compte 21 versets, deux de plus que dans la King James Version. Joël et Malachie, en revanche, gardent la division en chapitres de la tradition latine et anglaise, trois chapitres et quatre. Dans ce lecteur, elle est l'une des trois bibles françaises, à côté d'Ostervald et de la Darby française. Une interface en français ne s'ouvre pas sur elle : le français n'a pas de choix curaté, si bien que le lecteur prend la première bible française dans l'ordre du catalogue, qui est la Darby. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation, si bien qu'un échelon ouvert sous un verset descend droit au sol des langues originales marqué d'un ≈ — pour l'Ancien Testament le Codex de Léningrad, un manuscrit de la tradition massorétique et non un hébreu imprimé du temps de Segond, et pour le Nouveau le Textus Receptus, c'est-à-dire précisément le grec qu'il avait choisi de ne pas suivre. Sa pastille d'échelon porte l'année 1910.

