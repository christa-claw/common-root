title=Nuovo Testamento di Tyndale 1534 — Informazioni su questa edizione | Common Root
description=Il Nuovo Testamento di William Tyndale, la prima traduzione inglese condotta sul greco e la prima stampata, nella sua revisione del 1534 — il testo che sta sotto la Bibbia di Ginevra e la King James Version.
heroHeading=Nuovo Testamento di Tyndale 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=Ai tempi di Tyndale una Bibbia inglese era ancora fuorilegge. Le Costituzioni di Oxford del 1409 vietavano di tradurre la Scrittura in inglese, o di leggerne una traduzione, senza l'approvazione di un vescovo. William Tyndale chiese quell'approvazione al vescovo di Londra, Cuthbert Tunstall, nel 1523, fu respinto e l'anno seguente lasciò l'Inghilterra per fare il lavoro senza di essa. Con il Nuovo Testamento greco di Erasmo davanti, e accanto il tedesco di Lutero e la Vulgata latina, realizzò il primo Nuovo Testamento inglese tradotto dal greco, e il primo mai stampato. Un primo tentativo a Colonia nel 1525 fu interrotto da un'irruzione nella tipografia; il libro completo uscì dai torchi di Peter Schöffer a Worms nel 1526 e fu introdotto di contrabbando in Inghilterra, dove i vescovi ne compravano le copie per bruciarle.
hero.2=Il testo qui presente è la revisione dello stesso Tyndale, stampata ad Anversa nel 1534, in cui riprese il greco, corresse la prima versione e aggiunse prologhi e note. Era una presa di posizione quanto una traduzione. Tommaso Moro lo attaccò per aver scritto «congregazione» (congregation) dove la Chiesa diceva chiesa, «anziano» (elder) dove diceva sacerdote e «amore» (love) dove diceva carità, e tutte e tre le scelte sono in questo testo: Matteo 16,18 recita «apon this rocke I wyll bylde my congregacion». Tyndale rivide ancora una volta nel 1535, fu arrestato ad Anversa nel maggio di quell'anno e nel 1536 condannato come eretico, strangolato e bruciato a Vilvoorde, presso Bruxelles.
hero.3=In questo lettore lo si trova in basso. Il Tyndale è un piolo registrato sotto la Bibbia di Ginevra e sotto la King James Version, e quindi, più giù lungo la scala, anche sotto la Revised Version, la American Standard Version e la World English Bible, che poggiano sulla King James. Scendendo da un versetto della King James oltre la Ginevra, spesso il testo si muove appena — ed è proprio questo il punto; in 1 Corinzi 13,13 si muove, dove Tyndale e la Ginevra dicono love e la King James dice charity. Sotto Tyndale non è registrato alcun genitore. Lavorava sul greco di Erasmo, ma il Textus Receptus qui presente è l'edizione del 1550, di una generazione successiva, e il Lutero qui presente è la Bibbia del 1545, non il Nuovo Testamento del 1522 di cui si servì; così la scala scende direttamente al fondo delle lingue originali. È presente solo il Nuovo Testamento, nella sua grafia: Matteo comincia «This is the boke of the generacion of Iesus Christ».

