fact.1.label=Lingua
fact.1.value=Inglese — inglese della prima età Tudor, nella grafia originale
fact.2.label=Traduttore
fact.2.value=William Tyndale, che lavorò in esilio sul continente dopo che il vescovo di Londra gli ebbe negato la licenza nel 1523
fact.3.label=Prima edizione
fact.3.value=1526, Worms, dai torchi di Peter Schöffer — il primo Nuovo Testamento stampato in inglese
fact.4.label=Questo testo
fact.4.value=La revisione dello stesso Tyndale, stampata ad Anversa nel 1534
fact.5.label=Tradotto da
fact.5.value=Il Nuovo Testamento greco di Erasmo, con accanto il Nuovo Testamento tedesco di Lutero del 1522 e la Vulgata — [[TR|il Textus Receptus]] è il testimone di quel greco in questo corpus
fact.6.label=Parole contestate
fact.6.value=«Congregation» per church, «elder» per priest, «love» per charity — le scelte che Tommaso Moro attaccò
fact.7.label=In questo corpus
fact.7.value=Solo i 27 libri del Nuovo Testamento, 7954 versetti, grafia non modernizzata
