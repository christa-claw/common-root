fact.9.label=Sotto questo piolo
fact.9.value=Nessun genitore registrato — la scala scende direttamente al fondo delle lingue originali, dove [[TR|il Textus Receptus]] sta come testimone del greco e non come un libro che Tyndale ebbe in mano
