title=Clementine Vulgate — About This Edition | Common Root
description=The Clementine Vulgate: the papal revision of Jerome's Latin Bible, printed in Rome in 1592 and reissued with corrections in 1593 and 1598 — the Catholic Church's standard Latin text until 1979, and in this reader a rung above the Vulgate.
heroHeading=Clementine Vulgate
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=In 1546 the Council of Trent declared the Vulgate the authentic Latin Bible of the Church, which left a question it did not answer: which Vulgate? Eleven centuries of copying by hand had left no two manuscripts quite alike, and Trent asked for a corrected text. Pope Sixtus V supplied one in 1590, much of it revised by himself, under a bull declaring it authentic. He died that August, and within weeks the cardinals had stopped its sale. Under Clement VIII a commission — Francisco de Toledo among the editors, Robert Bellarmine at the centre of the work — produced its replacement, printed in Rome in 1592. Smaller reprints in 1593 and 1598 removed most of its misprints and added Jerome's prologues and marginal references.
hero.2=That text was the standard Latin Bible of the Catholic Church for nearly four centuries, until the Nova Vulgata of 1979, and the 1962 missal and breviary still use it. It is Jerome's Bible as the Church had received it rather than as he left it. The Psalms are his Gallican psalter, revised from the Greek, not his later translation from the Hebrew, so they keep the Greek numbering: Psalm 22 here begins “Dominus regit me”, the shepherd psalm. At 1 John 5:7 it carries the Johannine Comma, “Pater, Verbum, et Spiritus Sanctus”, a Latin addition the early Greek manuscripts do not have. Esther and Daniel come in their longer forms, with the Greek additions gathered at the end of Esther and as the last two chapters of Daniel. The eBible.org file this copy comes from prints the 1598 text with the Glossa Ordinaria as notes — the twelfth-century commentary from the school of Anselm of Laon, in Migne's edition of 1880. The notes did not come into the corpus; the square brackets in some verses are the source's own.
hero.3=In this reader it is a rung with one recorded parent, the Latin Vulgate: open a rung beneath any of its verses and the Vulgate appears. Expect the two to read almost word for word alike. The Vulgate in this corpus is itself drawn from a Clementine text, so what separates them is mostly punctuation — and the books this copy lacks. It has 66, the books of the Protestant canon, with Esther and Daniel in their longer forms. The source files also carry Tobit, Judith, Wisdom, Sirach, Baruch and the two books of Maccabees, all of which the Vulgate beneath has; none of them came through, so where the Vulgate has Tobit there is nothing above it. The Prayer of Manasseh and 3 and 4 Esdras, which the Clementine printed in an appendix, are in neither the source nor the corpus. Nothing in the corpus stands on this edition in turn.

