title=Septante grecque de Brenton — À propos de cette édition | Common Root
description=La Septante — l'Ancien Testament grec de la diaspora juive et de l'Église ancienne — dans le texte grec que Lancelot Brenton imprima en regard de son anglais en 1851, et l'échelon placé sous la Vulgate et la Bible synodale russe dans ce lecteur.
heroHeading=Septante grecque de Brenton
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=La Septante est la plus ancienne traduction de la Bible hébraïque, et pendant les premiers siècles chrétiens elle fut tout simplement la Bible. Des Juifs de langue grecque d'Alexandrie la commencèrent par les cinq livres de la Loi, probablement au IIIe siècle av. J.-C., et les autres livres suivirent au cours des deux siècles suivants. Le nom vient d'un récit : la Lettre d'Aristée raconte que soixante-douze anciens furent envoyés de Jérusalem pour traduire la Loi pour le roi Ptolémée II, et « les Soixante-dix » — LXX en chiffres romains — devint le nom de tout l'Ancien Testament grec. Les auteurs du Nouveau Testament la citent sans cesse, l'Église ancienne la lisait, et les Églises orthodoxes la lisent encore comme leur Ancien Testament.
hero.2=Son intérêt dépasse son ancienneté. Les traducteurs travaillaient sur des manuscrits hébreux qui différaient par endroits du texte massorétique devenu plus tard la norme — Jérémie, par exemple, est nettement plus court en grec —, si bien qu'en bien des passages la Septante est le plus ancien témoin d'une leçon hébraïque que la tradition hébraïque elle-même n'a pas conservée. Elle contient aussi des livres que le canon hébreu ne connaît pas, parmi lesquels Tobie, Judith, la Sagesse, le Siracide et Baruch. Et certains de ses choix de mots devinrent doctrine : en Isaïe 7,14, là où l'hébreu porte ʿalmah, une jeune femme, le grec porte parthenos, une vierge — le mot que cite Matthieu.
hero.3=Le grec présenté ici est le texte qu'imprima Sir Lancelot Brenton. Il publia en 1844 une traduction anglaise de la Septante, faite principalement d'après le Codex Vaticanus, le manuscrit du IVe siècle conservé à la Bibliothèque vaticane ; en 1851, Samuel Bagster, à Londres, la réédita en y ajoutant les livres apocryphes et en plaçant le grec en regard de l'anglais, et c'est ce grec que contient ce corpus. Ses psaumes gardent la numérotation grecque, que partage la Vulgate présente ici : dans l'une et l'autre, le psaume 22 est celui du berger, le psaume 23 de l'hébreu et de la plupart des Bibles anglaises. Il y a 151 psaumes ; Esdras et Néhémie forment un seul livre ; Esther et Daniel figurent sous leurs formes grecques plus longues.
hero.4=Dans ce lecteur, elle est un échelon, non le socle. Elle se trouve sous la Vulgate latine, parce qu'une partie de la Vulgate est passée par le grec : son psautier est celui que Jérôme fit sur le grec des Hexaples d'Origène et que sa propre traduction sur l'hébreu ne supplanta jamais, et la Sagesse, le Siracide et Baruch restèrent dans des versions vieilles-latines faites sur le grec. Elle se trouve sous la Bible synodale russe, dont l'Ancien Testament garda de nombreuses leçons de la Septante héritées de la Bible slavonne qui la précédait, et sous la propre traduction anglaise de Brenton. Elle n'a pas de parent enregistré : l'hébreu sur lequel elle fut faite n'est pas dans le corpus, et le Codex de Léningrad, plus jeune de plus de mille ans et de la lignée massorétique, n'apparaît sous elle que comme socle des langues originales. Elle ne contient que l'Ancien Testament ; sous un verset du Nouveau Testament, l'échelon est donc sauté — et tous les livres de la tradition grecque ne sont pas là : cet exemplaire compte 45 livres et aucun livre des Maccabées.

