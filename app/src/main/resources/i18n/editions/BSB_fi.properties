title=Berean Standard Bible — Tietoja tästä laitoksesta | Common Root
description=Berean Standard Bible: Bible Hubin ja Discovery Biblen työryhmien tekemä nykyenglanninkielinen käännös, joka on tehty masoreettisesta hepreasta ja työryhmien itsensä toimittamasta kreikkalaisesta Uudesta testamentista — ja sitten annettu pois vapaaseen käyttöön.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible on tämän kokoelman uusimpia käännöksiä ja avoimimpia sen suhteen, miten se on tehty. Sen takana ovat Bible Hubin ja Discovery Biblen työryhmät neuvoa-antavan toimikunnan alaisuudessa, ja se ilmestyi ensin toisella nimellä, Berean Study Bible. Se aiheutti jatkuvaa sekaannusta, sillä study Bible tarkoittaa yleensä Raamattua, joka on paisutettu selityksillä ja viitteillä — mitä tämä ei ole. Käännös nimettiin uudelleen; lyhenne jäi ennalleen.
hero.2=Useimmat käännökset lähtevät liikkeelle jonkun toisen toimittamasta kreikkalaisesta Uudesta testamentista. Tämä hanke teki ensin omansa. Berean Greek Bible ottaa pohjakseen Nestlen vuoden 1904 laitoksen — valittuna siksi, kuten sen toimittajat sanovat, että se on tarkin kriittinen teksti, joka jo on vapaassa käytössä — ja vertaa sitä Nestle–Alandiin, SBL:n kreikkalaiseen Uuteen testamenttiin, Tischendorfiin, Westcott–Hortiin, bysanttilaiseen tekstiin ja Textus Receptukseen alaviitaten kohdat, joissa ne eroavat. Englanti käännettiin siitä. Vanha testamentti tulee masoreettisesta hepreasta, ja Kuolleenmeren kääröt, Septuaginta ja muut varhaiset todistajat on otettu huomioon siellä, missä ne vaikuttavat lukutapaan. Sama työ julkaistiin sitten kerroksittain: sanasanaisena interlineaarina, jäykän kirjaimellisena laitoksena ja tänä luettavana — niin että lukija pääsee kreikasta englantiin askel kerrallaan sen sijaan, että uskoisi kääntäjiä sanasta. Se asettaa Bereanin myös sen rajan toiselle puolelle, jonka tämä aineisto tekee näkyväksi: Geneven Raamattu ja King James Version polveutuvat täällä Textus Receptuksesta, tämä ei.
hero.3=Viimeinen asia, jonka hanke tekstilleen teki, oli antaa se pois. Berean-tekstit luovutettiin vapaaseen käyttöön huhtikuussa 2023, ja juuri siksi koko Raamattu voi olla tässä aineistossa ja siitä voi kopioida vapaasti ulos. Kun lukuohjelman käyttöliittymä asetetaan englanniksi, avautuu New International Version, joka on täällä lisenssillä; Berean on sen rinnalla se nykyenglanti, jota kuka tahansa saa lainata, painaa ja levittää. Polveutumisaskelmissa se käyttäytyy kuin Biblia en Español Sencillo. Sille ei ole kirjattu kantatekstiä, koska se on tuore käännös eikä minkään tässä aineistossa olevan tekstin tarkistus, joten Berean-jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan eikä vanhempaan englanninkieliseen Raamattuun. Luettelo jättää myös sen vuosiluvun tyhjäksi. Se ei ole huolimattomuutta — tekstiä tarkistetaan yhä sitä mukaa kuin korjauksia tulee, ja vuosiluvut ovat täällä harkittuja eivätkä arvattuja, joten laitos, jolla ei ole yhtä päivättyä painosta, ei saa vuotta.

