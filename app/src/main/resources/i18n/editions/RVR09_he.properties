title=ריינה-ולרה 1909 — על מהדורה זו | Common Root
description=ריינה-ולרה 1909: העדכון שנשא אל המאה העשרים את הספרדית של קסיודורו דה ריינה משנת 1569, כפי שסיפריאנו דה ולרה עדכן אותה בשנת 1602 — והמהדורה שקורא זה נפתח עליה לספרדית.
heroHeading=ריינה-ולרה 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=הביבליה הפרוטסטנטית בספרדית היא, במידה בלתי רגילה, ספר אחד. קסיודורו דה ריינה, שיצא מספרד מפני האינקוויזיציה, השלים את תרגומו בגלות ופרסם אותו בבאזל בשנת 1569 — היא Biblia del Oso, הקרויה על שם הדוב שבשער. סיפריאנו דה ולרה, שהיה באותו מנזר מחוץ לסביליה וברח אותה בריחה, עבר עליה שנים ופרסם את הפרי באמסטרדם בשנת 1602, היא Biblia del Cántaro. כל ריינה-ולרה שמאז היא עדכון של עדכון של אותו ספר, ומשום כך שם המחובר במקף מנציח שני אנשים שמעולם לא עבדו באותו חדר.
hero.2=זהו העדכון משנת 1909, שהוכן תחת החברה הבריטית והחוץ-ארצית לכתבי הקודש יחד עם החברה האמריקנית לכתבי הקודש, ומי שהוסיפו להשתמש בו קראו לו בדרך כלל Versión Antigua, המהדורה הישנה. הוא בא אחרי עדכון מוקדם יותר, זה של שנת 1862, והוא זהיר דווקא בדבר שעדכונים נוהגים לשנות: הלשון מקודמת במקום שריינה וולרה נעשו קשים למעקב, ומונחת לנפשה במקום שלא. הברית הישנה עומדת על העברית המסורתית והחדשה על הטקסטוס רצפטוס, כשם שעמדה של ריינה.
hero.3=כחמישים שנה החזיק בעולם הפרוטסטנטי דובר הספרדית כמעט לעצמו, עד שהעדכון משנת 1960 דחק אותו, ומעולם לא נעלם כליל. הוא חופשי מזכויות יוצרים, מה שהעדכון משנת 1960 איננו, ולכן זו ריינה-ולרה שמדפיסים, מעלים לרשת ומצטטים בלי רשותו של איש. זו גם הסיבה שהנוסח כולו יכול לשבת באוסף הזה ולהיות מועתק ממנו החוצה.
hero.4=בקורא הזה יש לספרדית חמש ביבליות, ועליה נפתח הממשק. זו בחירה מוקפדת ולא מקרה של הקטלוג: שלא כערבית או כסינית, שבהן הקורא נפתח על הביבליה היחידה הקיימת בלשון, לספרדית יש חלופות וזו נבחרה מביניהן. בשלבי השושלת לא רשום לה מקור, כך ששלב הנפתח מתחת לפסוק צונח היישר אל רצפת לשונות המקור המסומנת ב־≈. הרצפה קולעת כאן קרוב מן הרגיל, מאותו טעם עצמו שבביבליה הערבית: היוונית שהיא מספקת היא הטקסטוס רצפטוס, ומן הטקסטוס רצפטוס נעשתה הברית החדשה של ריינה.

