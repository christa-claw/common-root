title=Codex Leningradensis — Über diese Ausgabe | Common Root
description=Der Codex Leningradensis: die älteste vollständig erhaltene Handschrift der hebräischen Bibel, abgeschrieben 1008 n. Chr. und bis heute der Grundtext hinter den meisten modernen Übersetzungen des Alten Testaments.
heroHeading=Codex Leningradensis
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=Dies ist die älteste vollständig erhaltene Handschrift der hebräischen Bibel. Abgeschrieben hat sie ein Schreiber namens Samuel ben Jakob, der in Alt-Kairo arbeitete und sein Werk in einer eigenen Notiz am Ende der Handschrift auf das Jahr 1008 n. Chr. datierte.
hero.2=Samuel ben Jakob erfand keinen Text, er bewahrte einen. Er arbeitete in der Tradition der Familie Ben Ascher, der führenden Autorität für die Masora — jenes ausgefeilte System aus Vokalzeichen, Kantillationszeichen und Randbemerkungen, das jüdische Gelehrte über Jahrhunderte verfeinert hatten, um die Aussprache der hebräischen Bibel festzuhalten und den Text vor Verderbnis zu schützen. Eine ältere und wohl maßgeblichere Ben-Ascher-Handschrift ist zwar erhalten — der Codex von Aleppo —, doch ein großer Teil seines Tora-Abschnitts ging 1947 verloren. Gerade deshalb ist der Codex Leningradensis so kostbar: Er ist vollständig und alt genug, um unmittelbar an der Quelle dieser Tradition zu stehen.
hero.3=Seinen Namen trägt er nach der Stadt, in der er später landete: Leningrad, wie Sankt Petersburg hieß, als die Handschrift in die westliche Forschung gelangte — ein Name, der ihr blieb, auch nachdem die Stadt 1991 ihren eigenen zurückerhielt. Heute liegt er der Biblia Hebraica Stuttgartensia zugrunde, der wissenschaftlichen Standardausgabe der hebräischen Bibel. Das heißt: Fast jede moderne Übersetzung des Alten Testaments, in fast jeder Sprache, geht auf die sorgfältige Abschrift dieses einen Kairoer Schreibers aus dem 11. Jahrhundert zurück — ob ihre Leser seinen Namen je erfahren oder nicht.

