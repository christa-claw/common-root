title=Chinesische Unionsübersetzung, Text von 1919 — Über diese Ausgabe | Common Root
description=Die Chinesische Unionsübersetzung, wie sie 1919 erstmals veröffentlicht wurde, mit den alten Zeichenformen und der ursprünglichen Zeichensetzung, transkribiert von Chinese Wikisource, mit ihren Fußnoten.
heroHeading=Chinesische Unionsübersetzung — der Text von 1919
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Dies ist die [[CUV|Chinesische Unionsübersetzung]], wie sie 1919 gedruckt wurde: die Mandarin-Bibel, an der Missionare und chinesische Gelehrte neunundzwanzig Jahre arbeiteten und die in den Zeichenformen jenes Jahres niedergelegt wurde. Die andere Unionsübersetzung in diesem Lesegerät ist der Text, wie er heute gelesen wird, mit moderner Zeichensetzung und modernen Zeichenformen. Diese hier bewahrt die Seite von 1919.
hero.2=Den Unterschied sieht man an den Zeichen. Der Text von 1919 verwendet Formen, die spätere Drucke aufgegeben haben — 爲, wo heutige Ausgaben 為 haben, ebenso 愼, 册, 槪 — und er ist durchweg in traditionellen Zeichen gedruckt. Seine Zeichensetzung ist die aus dem Druck von 1919 übertragene, nicht die moderne Zeichensetzung späterer Ausgaben. Wo das Buch von 1919 aufeinanderfolgende Verse als einen einzigen Abschnitt druckte, tut diese Ausgabe dasselbe: Die Versnummerierung bleibt erhalten, und der Text steht beim ersten Vers des Abschnitts.
hero.3=Der Text stammt aus der von Chinese Wikisource erstellten Transkription und ist die Shen-Ausgabe (神版), in der Gott 神 heißt, nicht 上帝. Die Fußnoten des Buches von 1919 sind erhalten und erscheinen in diesem Lesegerät als Anmerkungen zu den Versen, zu denen sie gehören.
hero.4=Er wurde hinzugefügt, damit eine chinesische Bibel aus einem Text gedruckt werden kann, dessen Datum und Herkunft bekannt sind. Ein Druck von 1919 ist längst urheberrechtsfrei. Die interpunktierten Texte, die ihm folgten, ab 1988, sind eine eigene Frage, und deshalb werden die beiden getrennt gehalten.

