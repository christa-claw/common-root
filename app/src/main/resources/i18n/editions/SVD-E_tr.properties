title=Smith & Van Dyck (eBible metni) — Bu baskı hakkında | Common Root
description=Smith ve Van Dyck'in 1865 tarihli Arapça Kutsal Kitabı, eBible.org'un Amerikan Kutsal Kitap Derneği'nin kaynak dosyasından kamu malı olarak yayımladığı tam harekelenmiş elektronik metinde.
heroHeading=Smith & Van Dyck — tam harekelenmiş metin
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Bu, [[SVD|Smith & Van Dyck]] ile aynı çeviridir — Beyrut'ta Eli Smith'in başlattığı ve 1865'te Cornelius Van Dyck'in Arap âlimler Butrus el-Bustani, Nasif el-Yazici ve Yusuf el-Asir ile tamamladığı Arapça Kutsal Kitap — yalnızca farklı bir elektronik dosyadan dizilmiştir. Çeviri aynıdır; bu baskının var olma sebebi dosyadır.
hero.2=1865 tarihli bir Kutsal Kitap herkes için özgürdür, ama onun elektronik bir kopyası da birinin işidir ve Van Dyck metni internette kaynağı belirsiz çok sayıda kopya halinde dolaşır. Bazıları, transkripsiyonun kendisi üzerinde telif hakkı iddiasıyla sunulur. Kökeni izlenemeyen bir metin güvenle basılamaz, bu yüzden bu baskı kökeni izlenebilen bir kopyayı kullanır: eBible.org'un yayımladığı, kamu malı ilan edilen, çevirmen olarak Suriye Misyonu'nu ve kaynağın katkıcısı olarak Amerikan Kutsal Kitap Derneği'ni gösteren kopyayı. Dosya 2020-08-03 tarihlidir.
hero.3=Tam harekelenmiştir. Bu okuyucudaki diğer Van Dyck metninin büyük ölçüde harekesiz olduğu yerde, her sözcük kısa seslilerini ve öteki okuma işaretlerini taşır. Bu, dizgiyi yavaşlatır ve sesli okumayı kolaylaştırır; harekeli bir sayfa satırlar arasında daha çok yer ister, dolayısıyla bu baskının basılı bir nüshası aynı metnin harekesiz halinden daha uzun çıkar.
hero.4=Soru metnin basılıp basılamayacağıysa, seçilecek baskı budur. Ekrandan okumak için iki Van Dyck metninden hangisi olursa aynı işi görür.

