title=Genèvebibeln 1599 — Om denna utgåva | Common Root
description=Genèvebibeln: gjord av engelska protestanter i landsflykt i Genève, den första engelska bibeln med numrerade verser och marginalnoter, läst av Shakespeares generation och stegpinnen under King James Version.
heroHeading=Genèvebibeln 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Den här bibeln gjordes utomlands, av människor som inte tryggt kunde stanna hemma. När Maria I besteg tronen 1553 och England återvände till Rom lämnade några hundra protestanter landet; en del av dem bosatte sig i Calvins Genève, där det fanns tryckpressar, hebreisk och grekisk lärdom och ingen biskop att svara inför. William Whittingham gav ut ett Nya testamente där 1557. Ett lag under Anthony Gilby arbetade sig genom Gamla testamentet, och den fullständiga bibeln trycktes i Genève av Rowland Hall 1560, två år efter Marias död, när de flesta landsflyktiga redan hade återvänt hem.
hero.2=Det de åstadkom förändrade hur en engelsk bibel såg ut. Den var den första som numrerade varje vers, så att en läsare kunde hänvisas till en rad i stället för till ett kapitel. Den sattes med antikva i stället för fraktur och gavs ut liten nog och billig nog för att ägas i stället för att kedjas fast vid en läspulpet. Och marginalerna var fulla: korsreferenser, förklaringar av svåra ord, kartor och noter om vad ett stycke betydde. Det sista är skälet till att den älskades och till att den väckte förtret. Noterna är reformerta, skarpt på sina ställen, och de talar om för läsaren vad han ska tänka om kungar lika villigt som om lära.
hero.3=Årtalet på denna utgåva behöver en reservation, för Genèvebibeln var inte en bok utan en text som trycktes om i åttio år medan dess delar byttes ut. År 1576 ersatte Laurence Tomson Nya testamentet med sin egen revision, gjord mot Theodore Bezas grekiska utgåva av 1565, och från 1587 är det det Nya testamente de flesta Genèvebiblar bär. År 1599 lades Franciscus Junius noter till Uppenbarelseboken till. “1599” betecknar alltså en sammansättning — Tomsons Nya testamente plus Junius om Uppenbarelseboken — mer än ett tryckår, och biblar med det årtalet fortsatte att tryckas efteråt. Därför lämnar katalogkortet året tomt medan stegpinnens etikett, som behöver något kort att visa, läser GNV 1599.
hero.4=Dess plats i denna samling är ett gångjärn. Den längsta härstamningskedjan här går från World English Bible till American Standard Version till Revised Version till King James Version, och därefter till denna: öppna en stegpinne till under en King James-vers och Genèves ordalydelse träder fram under den, vilket är det enklaste sättet att se hur mycket av King James som är ärvt snarare än författat. Under Genève finns inget mer på engelska — bara grekiskan och hebreiskan, Textus Receptus och Westminster Leningradkodex, där stegen når sin botten. Texten återges som utgåvan har den, stavning och allt, så 1 Mos. 1:1 säger heauen; psalmöverskrifterna och kolofonen till Hebreerbrevet löper inuti början av första versen, så som de tryckningarna satte dem, och har fått stå kvar där i stället för att städas bort.

