title=American Standard Version — इस संस्करण के बारे में | Common Root
description=1901 का American Standard Version: Revised Version का अमेरिकी संस्करण, उन विद्वानों की कृति जिन्होंने बीस वर्ष डाक द्वारा किंग जेम्स संस्करण को सुधारने में बिताए, और Revised Standard Version, New American Standard Bible तथा World English Bible का मूल।
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=American Standard Version की शुरुआत किसी और की परियोजना के रूप में हुई। जब 1870 में इंग्लैंड के चर्च ने किंग जेम्स संस्करण के संशोधन का काम उठाया, तो उसने अमेरिकी विद्वानों को भी सम्मिलित होने का न्योता दिया, और वे सम्मिलित हुए — पत्राचार से, अटलांटिक के आर-पार, लगभग दो दशकों तक। जहाँ दोनों पक्षों में मतभेद हुआ, वहाँ ब्रिटिश समिति का पाठ मूल में गया और अमेरिकी पसंद परिशिष्ट में, और अमेरिकियों ने चौदह वर्ष तक अपना अलग संस्करण न निकालने पर सहमति दी। अंग्रेज़ी Revised Version 1881 और 1885 में प्रकट हुई। अमेरिकी संस्करण 1901 में उसके बाद आया, और परिशिष्ट के पाठ मूल में ऊपर चढ़ा दिए गए, जहाँ उसके सम्पादक उन्हें सदा से रखना चाहते थे।
hero.2=यह विद्वानों द्वारा विद्वानों के लिए किया गया अनुवाद है, और पढ़ने में भी वैसा ही लगता है। संशोधक इब्रानी और यूनानी शब्द-क्रम के उतने ही निकट रहे जितना अंग्रेज़ी सह सकी, जिससे American Standard Version सटीक है और लम्बे-लम्बे हिस्सों में कड़ी। इसका सबसे प्रत्यक्ष निर्णय ईश्वर के नाम को लेकर है: जहाँ किंग जेम्स संस्करण छोटे बड़े अक्षरों में “the LORD” छापता था, वहाँ American Standard Version “Jehovah” छापता है — हज़ारों बार, पूरे पुराने नियम में। नए नियम में यह टेक्स्टस रिसेप्टस के बजाय संशोधकों की यूनानी का अनुसरण करता है, इसलिए जो पाठ किंग जेम्स के अनुवादकों के पास थे और पुरानी हस्तलिपियों में नहीं हैं — उनमें 1 यूहन्ना 5:7 का त्रित्व-वाक्य भी — या तो पाद-टिप्पणी में हैं या अनुपस्थित।
hero.3=American Standard Version कभी गिरजे की बेंच की बाइबिल नहीं बना। जो वह बना, वह मूल बना। 1952 का Revised Standard Version उसी का संशोधन था; New American Standard Bible भी, जो इस संग्रह में भी है; और World English Bible भी, जो उसे आधुनिक वर्तनी में सार्वजनिक अधिकार-क्षेत्र में ले आई। यही कारण है कि पाठक की वंश-पायदानों में वह वहीं बैठता है जहाँ बैठता है — इस संग्रह की सबसे लम्बी शृंखला के बीच। ASV के किसी पद के नीचे एक पायदान खोलिए, तो जिस Revised Version से वह बना वह उसके नीचे प्रकट होती है, और उसके नीचे किंग जेम्स संस्करण और जिनेवा बाइबिल, नीचे उस मूल-भाषा तल तक जो ≈ से चिह्नित है। World English Bible के किसी पद के नीचे एक पायदान खोलिए, तो आप यहीं लौट आते हैं।

