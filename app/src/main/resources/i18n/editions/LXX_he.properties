# The narrative, one paragraph per key, in order.
hero.1=תרגום השבעים הוא התרגום הקדום ביותר של המקרא העברי, ובמאות הנוצריות הראשונות הוא היה פשוט כתבי הקודש. יהודים דוברי יוונית באלכסנדריה פתחו בו בחמשת חומשי התורה, כנראה במאה השלישית לפני הספירה, ושאר הספרים באו אחריהם במהלך שתי המאות הבאות. השם בא מסיפור: איגרת אריסטיאס מספרת על שבעים ושניים זקנים שנשלחו מירושלים לתרגם את התורה בשביל המלך תלמי השני, ו"השבעים" — LXX בספרות רומיות — נעשה שמו של המקרא היווני כולו. מחברי הברית החדשה מצטטים אותו בלי הרף, הכנסייה הקדומה קראה בו, והכנסיות האורתודוקסיות קוראות בו עד היום כבברית הישנה שלהן.
hero.2=חשיבותו גדולה מגילו. המתרגמים עבדו מכתבי יד עבריים שנבדלו במקומות מסוימים מנוסח המסורה שהתקבע מאוחר יותר — ספר ירמיהו, למשל, קצר בהרבה ביוונית — ולכן במקומות רבים תרגום השבעים הוא העדות הקדומה ביותר לקריאה עברית שהמסורת העברית עצמה לא שימרה. יש בו גם ספרים שאינם בקאנון העברי, ובהם טוביה, יהודית, חכמת שלמה, בן סירא וברוך. וכמה מבחירות המילים שלו נעשו לעיקרי אמונה: בישעיהו 7:14, במקום שבו העברית אומרת "העלמה", היוונית אומרת parthenos, בתולה — המילה שמתי מצטט.
hero.3=הנוסח היווני כאן הוא זה שהדפיס סר לנסלוט ברנטון. בשנת 1844 הוא פרסם תרגום אנגלי של תרגום השבעים, שנעשה בעיקר על פי הקודקס הוותיקני, כתב יד מן המאה הרביעית השמור בספריית הוותיקן; בשנת 1851 הוציא אותו סמואל בגסטר מלונדון מחדש, בתוספת הספרים החיצוניים ועם היוונית לצד האנגלית, ואת היוונית ההיא מכיל אוסף זה. המזמורים בו שומרים על המספור היווני, שהוולגטה שכאן שותפה לו: בשתיהן מזמור 22 הוא מזמור הרועה, שהוא מזמור 23 בעברית וברוב התנ"כים האנגליים. יש בו 151 מזמורים; עזרא ונחמיה הם ספר אחד; אסתר ודניאל מופיעים בצורותיהם היווניות הארוכות.
hero.4=בקורא הזה הוא שלב ולא רצפה. הוא נמצא מתחת לוולגטה הלטינית, משום שחלק מן הוולגטה הגיע דרך היוונית: ספר התהלים שלה הוא זה שהירונימוס עשה מן היוונית של ההקספלה של אוריגנס, ושתרגומו שלו מן העברית מעולם לא דחק אותו, וחכמת שלמה, בן סירא וברוך נותרו בתרגומים לטיניים עתיקים שנעשו מן היוונית. הוא נמצא מתחת לתרגום הסינודלי הרוסי, שהברית הישנה שלו שימרה קריאות רבות של תרגום השבעים מן הביבליה הסלאבונית שקדמה לו, ומתחת לתרגום האנגלי של ברנטון עצמו. אין לו הורה רשום משלו: הנוסח העברי שממנו תורגם אינו באוסף, וכתב יד לנינגרד, הצעיר ממנו ביותר מאלף שנה ושייך לקו המסורה, מופיע מתחתיו רק כרצפת שפות המקור. הוא כולל רק את הברית הישנה, ולכן מתחת לפסוק מן הברית החדשה השלב הזה מדולג — ולא כל ספרי המסורת היוונית נמצאים כאן: בעותק הזה 45 ספרים, ואין בו אף אחד מספרי המקבים.

