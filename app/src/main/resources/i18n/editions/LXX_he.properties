title=תרגום השבעים היווני של ברנטון — על מהדורה זו | Common Root
description=תרגום השבעים — המקרא היווני של יהדות התפוצות ושל הכנסייה הקדומה — בנוסח היווני שלנסלוט ברנטון הדפיס לצד תרגומו האנגלי בשנת 1851, והשלב שמתחת לוולגטה ולתרגום הסינודלי הרוסי בקורא הזה.
heroHeading=תרגום השבעים היווני של ברנטון
