title=Chinese Union Version — Über diese Ausgabe | Common Root
description=Die Chinese Union Version von 1919: neunundzwanzig Jahre Kommissionsarbeit, aus denen die Bibel hervorging, die chinesische Protestanten bis heute lesen — und eines der ersten Bücher überhaupt, das in geschriebenem umgangssprachlichem Mandarin erschien.
heroHeading=Chinesische Unionsübersetzung
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=Im Jahr 1890 kamen die in China arbeitenden protestantischen Missionen in Schanghai zusammen und gestanden ein Problem ein. Es gab bereits mehrere chinesische Bibeln, und keine zwei stimmten überein — nicht im Wortlaut, nicht in der Schreibung der Namen und nicht einmal darin, in welcher Sprachform überhaupt zu schreiben sei. Die Konferenz beschloss eine einzige Übersetzung, die jede Mission benutzen sollte, und nannte sie eine Unionsübersetzung: 和合本, den zusammengeführten Text. Weil das geschriebene Chinesisch damals zwischen der Schriftsprache der Gebildeten und der gesprochenen Sprache aller übrigen geteilt war, gab man drei zugleich in Auftrag — zwei in Schriftchinesisch, eine in Mandarin.
hero.2=Die Mandarin-Kommission brauchte neunundzwanzig Jahre. Calvin Wilson Mateer, ein amerikanischer Presbyterianer, der seit 1863 in Shandong lebte, führte den Vorsitz und starb 1908 über der unvollendeten Arbeit; das von ihm aus einem halben Dutzend Missionen zusammengestellte Gremium machte weiter, ebenso die chinesischen Gelehrten, die an ihrer Seite arbeiteten und deren Namen die Missionsakten weit weniger sorgfältig bewahrt haben. Sie nahmen die englische Revised Version als den Text, den sie wiedergaben, und prüften ihn am Hebräischen und Griechischen dahinter — was die eigene Revised Version dieses Korpus einen Schritt oberhalb dieser Bibel ansetzt und die King James Version noch einen darüber. Die beiden schriftchinesischen Fassungen wurden schließlich zu einer verschmolzen. Die Mandarinfassung ist die, die überlebt hat.
hero.3=Sie erschien 1919, und die Jahreszahl hat mehr für sie getan, als eine Kommission es vermocht hätte. Es war das Jahr der Bewegung des vierten Mai, als chinesische Schriftsteller im Ernst begannen, die Schriftsprache zugunsten der Umgangssprache aufzugeben, und die Unionsübersetzung kam als eines der allerersten umfangreichen Bücher heraus, die bereits so geschrieben waren. Aus einer Übersetzung, die einen Streit unter Missionaren beilegen sollte, wurde ein Markstein moderner chinesischer Prosa, und ihre Wendungen zitieren Leute, die nie eine Bibel aufgeschlagen haben. Sie wird seither in zwei Ausgaben gedruckt, die sich in einem einzigen Wort unterscheiden — ob Gott 神 oder 上帝 heißt —, wobei der Ausschluss so angepasst ist, dass beide Ausgaben noch immer seitengleich umbrechen.
hero.4=In diesem Leser ist sie die einzige chinesische Bibel, und das entscheidet zweierlei über ihr Verhalten. Stellt man die Oberfläche auf Chinesisch, so öffnet sich diese — nicht weil sie gewählt wurde, wie die Reina-Valera 1909 für das Spanische gewählt wurde, sondern weil der Katalog keine andere Bibel in dieser Sprache findet. Und in den Abstammungssprossen ist für sie keine Vorlage verzeichnet, sodass eine Sprosse unter einem Vers geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden führt, obwohl die Revised Version, aus der sie gemacht wurde, im Korpus eine Spalte weiter steht. Ihr Sprossen-Chip trägt allerdings eine Jahreszahl, 1919, was nicht jede Ausgabe hier tut.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=Chinesisch — umgangssprachliches Mandarin (官話 / baihua), nicht Schriftchinesisch
fact.2.label=Eigener Name
fact.2.value=和合本 (héhéběn) — die „zusammengeführte“ oder „vereinigte“ Fassung
fact.3.label=In Auftrag gegeben von
fact.3.value=der Generalkonferenz protestantischer Missionare in Schanghai 1890
fact.4.label=Übersetzt von
fact.4.value=einer Kommission aus mehreren protestantischen Missionen; der amerikanische Presbyterianer Calvin Wilson Mateer (1836–1908) leitete das Mandarin-Gremium bis zu seinem Tod und arbeitete durchweg mit chinesischen Kollegen
fact.5.label=Erschienen
fact.5.value=1919, nach neunundzwanzig Jahren Arbeit
fact.6.label=Textgrundlage
fact.6.value=die englische Revised Version als Arbeitsgrundlage, geprüft am Hebräischen und Griechischen — dieselbe [[RV|Revised Version]], die dieses Korpus führt
fact.7.label=Zwei Ausgaben
fact.7.value=die Shen-Ausgabe (神版) und die Shangdi-Ausgabe (上帝版), die sich allein darin unterscheiden, welches chinesische Wort „Gott“ trägt
fact.8.label=Spätere Revision
fact.8.value=die Revised Chinese Union Version, Neues Testament 2006 und vollständige Bibel 2010 — nicht dieser Text
fact.9.label=In diesem Korpus
fact.9.value=die einzige chinesische Bibel hier, sodass eine chinesische Oberfläche sie von sich aus öffnet; in den Abstammungssprossen ist keine Vorlage verzeichnet, ihr Sprossen-Chip trägt aber die Jahreszahl 1919
