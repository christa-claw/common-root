title=Yorumsuz Türkçe Çeviri — About This Edition | Common Root
description=The Yorumsuz Türkçe Çeviri (YTC): a modern Turkish Bible translated from the World English Bible by İsmail Serinken and eBible.org, licensed CC BY-ND 4.0 — the Turkish text this corpus opens on by default.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — literally an "uncommented" or "unglossed" Turkish translation — is a modern Turkish Bible completed by İsmail Serinken in cooperation with eBible.org, copyrighted 2023 to 2025. The name itself states its method: a plain, word-by-word rendering that deliberately leaves out explanatory glosses and interpretive paraphrase, favoring transparency to the underlying text over smoothed idiom.
hero.2=That underlying text, stated honestly, is English rather than Hebrew, Aramaic or Greek: the translation's own copyright page describes it as rendered from the World English Bible, making it a secondary translation rather than one drawn directly from the original languages, unlike most other Bibles in this corpus. Common Root looked first for an open edition of the historic 1941 Turkish Bible (Kitabı Mukaddes), old enough by now to be in the public domain in Turkey, but no usable digital source for it could be found; the Yorumsuz Türkçe Çeviri was the only openly licensed Turkish Bible available. This corpus's text comes from eBible.org's USFM distribution of it, catalogued there as turytc.
hero.3=Its rendering choices carry a contemporary rather than traditional cast: it gives God's personal name as Yahve rather than the customary Turkish "RAB" or "Yehova", citing Exodus 3:14-15, and gives Jesus's name as Yeşua rather than the familiar Turkish İsa, while leaving other proper names in their ordinary forms. It holds the standard 66-book Protestant canon, with no deuterocanonical books.
hero.4=It is the only Turkish Bible in this corpus, so a Turkish interface opens on it by default.

