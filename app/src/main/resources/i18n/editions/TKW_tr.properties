title=Textbibel 1906 — Bu Baskı Hakkında | Common Root
description=Kautzsch ve Weizsäcker'in Textbibel'i: İbranice ve Grekçeden yeniden çevrilmiş, ilk kez 1899'da Tübingen'de tek cilt olarak yayımlanmış bilginler için bir Almanca Kutsal Kitap; buradaki metin 1906 tarihlidir.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=İki profesör, iki Antlaşma. Carl Weizsäcker (1822–1899) Tübingen'de bir kilise tarihçisiydi; 1861'de kürsüde Ferdinand Christian Baur'un yerine geçti ve 1889'dan itibaren üniversitenin şansölyesi oldu. Yeni Antlaşma çevirisi ilk kez 1875'te çıktı ve onun sağlığında dokuz baskı yaptı; sonuncusunu ölüm döşeğinde hazırladı. Emil Kautzsch (1841–1910) bir Eski Antlaşma bilginiydi; 1888'de Halle'ye yerleşmeden önce Leipzig, Basel ve Tübingen'de ders verdi. Bir grup uzman meslektaşıyla birlikte çevirdiği Eski Antlaşma 1894'te eksiksiz olarak yayımlandı.
hero.2=Weizsäcker'in öldüğü yıl olan 1899'da ikisi tek bir ciltte birleştirildi: Tübingen'de J.C.B. Mohr (Paul Siebeck) tarafından yayımlanan Textbibel des Alten und Neuen Testaments. Adı ne olduğunu söyler: İbranice ve Grekçenin ne dediğini kendi çağlarının Almancasıyla bilmek isteyen okurlar için yalın metin. Luther'in yerini almak gibi bir amacı hiç olmadı. Weizsäcker bilerek Luther'in dilinden uzak durdu ve bunun yerine özgün metnin ilk okurlarında bıraktığı izlenimi vermeye çalıştı; biyografi yazarı onun bir gün halkın kitabı olmasını olası görmedi ve olmadı da. 1910'lu yıllara kadar yeniden basılmaya devam etti. Buradaki dijital metin 1906 tarihlidir; o baskının kaçıncı baskı olduğu bu projece belirlenmemiştir.
hero.3=Çağının bilimi gibi okunur. Eski Antlaşma'da Tanrı'nın adı “Jahwe”dir — Mezmur 23'te “Jahwe ist mein Hirte” — Luther'in “der Herr” dediği yerlerde binlerce kez. Yeşaya 7:14'te “ein junges Weib”, yani genç bir kadın vardır. Yeni Antlaşma'da Matta 6:13'teki Rab'bin duası övgü bölümü olmadan biter ve 1. Yuhanna 5:7'de göksel tanıklar yoktur. Eski Antlaşma İbranice bölüm ve ayet düzenini korur: mezmur başlıkları ayet numaralarına dahildir, bu yüzden Mezmur 51'de 21 ayet vardır ve Malaki dört değil üç bölümdür. Yazım, tarihin düşündürdüğünden daha eskidir — Yuhanna 8:1'de İsa Zeytin Dağı'na “gieng”.
hero.4=Bu okuyucuda, Elberfelder ve Luther'in 1545 ve 1912 metinleri yanında dört Almanca Kutsal Kitap'tan biridir. Almanca bir arayüz bunu açmaz: Almanca için elle yapılmış bir seçim yoktur, bu yüzden okuyucu katalogdaki ilk Almanca Kutsal Kitap'ı alır, o da Elberfelder'dir. Soy basamaklarında bunun için kayıtlı bir kaynak yoktur; bu, özgün dillerden yapılmış bir çeviriye uygundur: bir ayetin altında açılan basamak doğrudan ≈ ile işaretli kaynak dil tabanına düşer — Eski Antlaşma için Westminster Leningrad Kodeksi, Yeni için Textus Receptus; 1. Yuhanna 5:7'nin gösterdiği gibi bu çevirinin izlemediği bir Grekçe.

