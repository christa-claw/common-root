title=Versión Biblia Libre — Tietoja tästä laitoksesta | Common Root
description=Versión Biblia Libre: Free Bible Ministryn espanjankielinen Raamattu, jonka ovat kääntäneet Jonathan Gallagher ja Shelly Barrios de Avila englanninkielisen Free Bible Versionin espanjankielisenä sisarlaitoksena, ja joka on lisensoitu vapaasti kaikkeen käyttöön.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — "Raamatun vapaa versio" — on englanninkielisen Free Bible Versionin espanjankielinen sisarlaitos, jonka julkaisee sama kustantaja, Free Bible Ministry, Marylandin Laurelissa toimiva voittoa tavoittelematon järjestö. Sen Uusi testamentti on merkitty kääntäjien Jonathan Gallagherin ja Shelly Barrios de Avilan nimiin, Gustavo Sanabrian ja Rebekah Põldaasin toimiessa avustajina, ja sen tekijänoikeus on päivätty vuosille 2018–2020 Gallagherin ja Barrios de Avilan nimiin. Kuten englanninkielinen sisarensa, se on olemassa poistaakseen tekijänoikeussivun käytön esteenä: tekstin saa kuka tahansa kopioida, painaa, julkaista verkossa tai muokata, ilman rojalteja ja ilman kysyttävää lupaa.
hero.2=Julkaistu alkuteksti kertoo selvästi Uuden testamentin pohjan — käännetty suoraan kreikkalaisesta Nestle–Aland-tekstistä, siitä kriittisestä tekstistä, jota raamattuseurat käyttävät — mutta ei nimeä erikseen Vanhan testamentin lähdetekstia, vaikka tässä aineistossa oleva laitos on täydellinen, kuusikymmentäkuusi kirjaa käsittävä protestanttinen kaanon. Missä materiaalit jättävät aukon, se jätetään tännekin pikemminkin kuin täytetään arvauksella.
hero.3=Tässä lukuohjelmassa se on yksi viidestä espanjankielisestä laitoksesta. Espanjankielinen käyttöliittymä avautuu yhä oletuksena [[RVR09|Reina-Valera 1909:ään]], vapaan käytön tekstiin aivan erillisestä, vuosisatoja vanhemmasta perinteestä; tähän laitokseen siirrytään sen sijaan sen omalta kortilta, yhdessä [[BES|Biblia en Español Sencillon]], [[PDDPT|Palabra de Dios para Tin]] ja [[NBLA|Nueva Biblia de las Américasin]] kanssa. Se ei ole minkään niistä tarkistus, joten sille ei ole kirjattu kantatekstia polveutumisaskelmissa — Versión Biblia Libren jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan. Sen läheisin sukulainen tässä aineistossa ei ole lainkaan espanjankielinen: [[FBV|Free Bible Version]], saman järjestön englanninkielinen käännös, samalla lisenssillä.

