title=Young's Literal Translation — About This Edition | Common Root
description=Robert Young's Literal Translation of the Bible, first published in Edinburgh in 1862, revised by Young in 1887 and by his publishers in 1898 — an English Bible that keeps the tenses, the word order and, as far as it can, the vocabulary of the Hebrew and the Greek, even where English strains to follow.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) was an Edinburgh printer and bookseller who taught himself Hebrew and several other Eastern languages while he served his apprenticeship, ran a mission press at Surat in India from 1856 to 1861, and is remembered above all for two books: the Analytical Concordance to the Bible and this translation. He published the Literal Translation in Edinburgh in 1862 and issued a revised edition in 1887. Ten years after his death his publishers brought out a third edition, revised once more “on its present lines”, in January 1898; that is the text in this corpus. Young translated the Old Testament from the received Masoretic Hebrew and the New Testament from the Greek Received Text, the Textus Receptus, and said plainly that he would not try to make a new text of either: translation, he wrote, is a different task from textual criticism, and few are qualified for both.
hero.2=The whole aim is to let an English reader see the grammar of the original. Young held that a version which gives a present tense where the original has a past, or “an a for a the”, sets verbal inspiration aside, and he translated accordingly. The Hebrew verb forms come through as English tenses, so the narrative often runs in the present: Genesis opens “In the beginning of God's preparing the heavens and the earth —” and goes on “and God saith, ‘Let light be;’ and light is.” Words supplied for the sense stand in square brackets: “Jehovah [is] my shepherd, I do not lack.” He tried to give each Hebrew or Greek word a single English equivalent wherever he could, and so the Hebrew olam and the Greek aiōn become “age” and “age-during” rather than “ever” and “eternal”; at Matthew 25:46 the righteous go away “to life age-during”. The divine name stands throughout the Old Testament as “Jehovah”.
hero.3=Our copy is complete: 66 books, Genesis to Revelation, without the Apocrypha, in the English chapter and verse numbering — 150 Psalms, each psalm's title run into its first verse, and Malachi ending at chapter 4. Being a Received-Text translation, it carries the passages later critical editions question, from the longer ending of Mark to the three witnesses in heaven at 1 John 5:7, which this text sets in square brackets, as it does the whole of Acts 8:37. In this reader it stands on its own. The corpus records no parent for it, so a lineage rung opened beneath one of its verses goes straight to the original-language floor marked ≈: the Westminster Leningrad Codex in the Old Testament and the Textus Receptus in the New. That floor is close to what Young himself translated, the Masoretic Hebrew and the Received Greek, though not in the same printings. Nothing is recorded as standing on it either. The Literal Standard Version of 2020, also in this corpus, presents itself as a major revision of Young's work, but the corpus does not record that link, so the rungs beneath the LSV do not lead here. No interface language opens on this edition; an English interface opens on the New International Version, and this one is reached from its own card in the translation grid.

