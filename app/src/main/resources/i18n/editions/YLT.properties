fact.5.value=Strictly literal: the original's tenses kept even where English reads oddly, so that narrative often runs in the present; one English word for each original word as far as possible, olam and aiōn becoming “age” and “age-during”; words supplied for the sense in square brackets; the divine name as “Jehovah”
