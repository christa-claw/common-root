title=Nueva Biblia de las Américas — על המהדורה הזו | Common Root
description=Nueva Biblia de las Américas: עיבוד לספרדית לטינו-אמריקאית שעשתה The Lockman Foundation ל-La Biblia de las Américas שלה עצמה, המעביר את אותה שיטה מילה-במילה לספרדית היומיומית המדוברת ברחבי האמריקות.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas היא המהדורה הספרדית-לטינו-אמריקאית של The Lockman Foundation, הבנויה על La Biblia de las Américas הקודמת של הקרן משנת 1986 — שהיא עצמה תוצר של כחמש עשרה שנות עבודה של עשרים ושניים מתרגמים ויועצים, לפי אותה פילוסופיית תרגום מילה-במילה שהועברה מאוחר יותר לאנגלית כ-New American Standard Bible. במקום תרגום חדש מהעברית והיוונית, NBLA היא עיבוד של רובד לשוני: ועדה של שנים-עשר חברים מ-Lockman עיבדה את הספרדית הנוטה יותר לקסטיליאנית של La Biblia de las Américas לספרדית המוכרת והמודרנית המדוברת בכל רחבי אמריקה הלטינית, החליפה צורות כגון כינוי הגוף השני ברבים "vosotros" ב-"ustedes" הנפוץ יותר, והקלה על מבנים כגון ה-"y" הנוסחתי וה-"sucedió que" שהטקסט הקודם נשא במילוליות מסגנון הסיפור העברי. הודעת רשות הציטוט של The Lockman Foundation עצמה מתארכת את הטקסט המוגמר לשנת 2005.
hero.2=הבסיס הטקסטואלי עוקב ישירות מ-La Biblia de las Américas: הברית הישנה מבוססת על ה-Biblia Hebraica של רודולף קיטל, עם עיון במגילות מדבר יהודה, והברית החדשה מבוססת בדרך כלל על המהדורה ה-27 של Novum Testamentum Graece של אברהרד נסטלה, בתשומת לב לעדויות כתבי יד נוספות היכן שהן משפיעות על נוסח מסוים. חלק מהחנויות וקטלוגי תוכנות המקרא מקבצים כיום את Nueva Biblia de las Américas יחד עם עיבוד הקרן משנת 2020 ל-New American Standard Bible, ומשווקים את שתיהן כזוג מתואם לקוראי אנגלית וספרדית מאותה מסורת מילולית; אולם התרגום עצמו אינו נושא בהודעות הקרן עצמה תאריך זכויות יוצרים מאוחר מ-2005.
hero.3=מנשק הספרדית כאן נפתח כברירת מחדל על Reina Valera 1909, טקסט נחלת הכלל ממסורת תרגום שונה כליל ומבוגר במאה שנה; ל-Nueva Biblia de las Américas מגיעים במקום זאת מכרטיסה שלה ברשת התרגומים. היא חולקת היסטוריה טקסטואלית מצומצמת עם מהדורה זו, אך הרבה עם New American Standard Bible — אותה קרן, אותה שיטת שוויון פורמלי, ואותו מעמד של ברישיון ולא נחלת הכלל, המתיר ציטוט של עד 500 פסוקים ללא רשות כתובה, בתנאי שאינם מרכיבים ספר שלם או יותר מרבע מהיצירה המצטטת. בשלבי השושלת לא רשום לה מקור: La Biblia de las Américas, הטקסט שאותו היא מעבדת, אינו מוחזק בעצמו באוסף זה, כך שהשלב מתחת לפסוק מ-NBLA יורד ישירות לרצפת לשון המקור המסומנת ב-≈.

