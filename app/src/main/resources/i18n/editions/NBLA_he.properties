fact.2.value=The Lockman Foundation מלה-הברה, קליפורניה — אותו גוף ללא מטרות רבח שעומד מאחורי New American Standard Bible ומאחורי קודמתה שלה, La Biblia de las Américas (1986)
fact.3.label=נעשתה בידי
fact.3.value=ועדת עיבוד של שנים-עשר חברים מ-Lockman, שעבדה מתוך תרגום La Biblia de las Américas, שהוא עצמו עבודת עשרים ושניים מתרגמים ויועצים במשך כחמש עשרה שנה
fact.4.label=הברית הישנה מתוך
fact.4.value=ה-Biblia Hebraica של רודולף קיטל, עם עיון במגילות מדבר יהודה, שהועברה מהבסיס הטקסטואלי של La Biblia de las Américas עצמה
fact.5.label=הברית החדשה מתוך
fact.5.value=Novum Testamentum Graece של אברהרד נסטלה, בדרך כלל המהדורה ה-27, בתשומת לב לעדויות כתבי יד נוספות היכן שהן משפיעות על נוסח
fact.6.label=סוג התרגום
fact.6.value=שוויון פורמלי, אותה שיטה מילה-במילה כמו La Biblia de las Américas ו-New American Standard Bible — לא תרגום חדש, אלא עיבוד של רובד לשוני לספרדית המוכרת והמודרנית המדוברת בכל רחבי אמריקה הלטינית, תוך החלפת צורות קסטיליאניות כגון "vosotros" ב-"ustedes" ועיבוד מבנים כגון ה-"y" הנוסחתי וה-"sucedió que" שהטקסט הקודם נשא במילוליות מהעברית
fact.7.label=פורסמה
fact.7.value=זכויות היוצרים נרשמו ב-2005 עבור The Lockman Foundation; קטלוגים מסוימים מקבצים אותה מאז יחד עם עיבוד הקרן משנת 2020 ל-New American Standard Bible, אך 2005 נותרת השנה הנקובה בהודעת זכויות היוצרים שלה עצמה
fact.8.label=רישיון
fact.8.value=ברישיון, לא נחלת הכלל. ניתן לצטט עד 500 פסוקים בכל צורה ללא רשות כתובה, בתנאי שאינם מרכיבים ספר מקרא שלם או יותר מרבע מהיצירה המצטטת, עם הודעת זכויות יוצרים הנוקבת ב-2005; כל שימוש מעבר לכך דורש רשות מ-The Lockman Foundation
fact.9.label=באוסף זה
fact.9.value=ברישיון ולא נחלת הכלל, כמו [[NASB|New American Standard Bible]] מאותה קרן. מנשק הספרדית נפתח כברירת מחדל על [[RVR09|Reina Valera 1909]], טקסט נחלת הכלל ממסורת לא קשורה ומבוגר במאה שנה, בעוד שלמהדורה זו מגיעים מכרטיסה שלה. בשלבי השושלת לא רשום לה מקור: היא עיבוד של רובד לשוני ל-La Biblia de las Américas, שאינו מוחזק בעצמו באוסף זה, כך שהשלב מתחת לפסוק מ-NBLA יורד ישירות לרצפת לשון המקור המסומנת ב-≈.
