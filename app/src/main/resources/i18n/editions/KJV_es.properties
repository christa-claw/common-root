title=King James Version — Acerca de esta edición | Common Root
description=La King James Version de 1611: cuarenta y siete traductores en seis compañías, con el encargo de revisar la Bishops' Bible y no de empezar de nuevo — y, en este corpus, el texto de ochenta libros que aún lleva los apócrifos que tuvo la primera impresión.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Empezó como una concesión en una reunión sobre otra cosa. En la Conferencia de Hampton Court de 1604, convocada por Jacobo I para oír las quejas puritanas sobre el libro de oración, se planteó la propuesta de una nueva traducción y el rey la hizo suya. Se nombró a cuarenta y siete eruditos y se los dividió en seis compañías —dos en Westminster, dos en Oxford, dos en Cambridge—, cada una con su parte de la Biblia y un cuerpo de reglas con que trabajar. La primera de esas reglas es la que más importa al leerla: debían seguir la Bishops' Bible de 1568 y alterarla solo en la medida en que el original lo exigiera. Esto se encargó como revisión y no como traducción nueva, y así se lee. Robert Barker, impresor del rey, publicó el libro terminado en Londres en 1611.
hero.2=Lo que las reglas no decían, y los traductores hicieron de todos modos, fue volver una y otra vez más atrás de la Bishops' Bible. El inglés que heredaron lo habían hecho otros: Tyndale ante todo, y la Biblia de Ginebra, que toda una generación de lectores ingleses poseía de veras y leía en casa. Este corpus registra esa deuda en lugar de dejarla para la introducción: los textos base de la King James Version son aquí [[GNV|la Biblia de Ginebra]], con el texto griego recibido y el hebreo masorético por debajo. Abra un peldaño del linaje bajo un versículo de la King James y lo que sube es Ginebra. Las dos están, versículo tras versículo, tan cerca que la pregunta interesante deja de ser si se usó Ginebra y pasa a ser dónde decidieron apartarse de ella las compañías de 1611 —cosa que ahora puede mirarse en vez de creerse.
hero.3=Una diferencia entre esta King James y la mayoría de las demás es cuestión de qué contiene. El texto abarca aquí ochenta libros y 36.820 versículos: el Antiguo y el Nuevo Testamento y los catorce libros de los apócrifos impresos entre ambos, tal como los imprimió el volumen de 1611. Casi toda Biblia King James que hoy se vende tiene sesenta y seis. El corpus conserva la forma larga, y el efecto se ve a lo largo de la cadena que el linaje registra: [[GNV|la Biblia de Ginebra]] tiene aquí sesenta y seis libros, esta ochenta, [[RV|la Revised Version]] por encima ochenta, y [[ASV|la American Standard Version]] por encima de aquella sesenta y seis otra vez. Que una edición imprima los apócrifos es una decisión que cada una tomó por su cuenta, y ponerlas en una misma columna hace legible el patrón.
hero.4=Conviene ser preciso sobre lo que significa el año de la ficha. Dice 1611, y esa es la fecha de la traducción: no es una afirmación sobre qué impresión es este texto. El inglés de aquí está modernizado en la ortografía: el Génesis empieza «In the beginning God created the heaven and the earth», donde los pliegos de 1611 leían «In the beginning God created the Heauen, and the Earth». Así que esta es la King James tal como la normalizaron impresores posteriores, y la impresión concreta de la que desciende no está registrada —el mismo hueco honrado que el corpus deja para [[FB1776|Biblia 1776]]—. Para leer las decisiones de los traductores no cambia nada; para citar el libro de 1611 como objeto lo cambia todo. Nótese además que esta no es la edición que abre una interfaz en inglés: esa es [[NIV|la New International Version]], y la King James es una a la que uno cambia.

