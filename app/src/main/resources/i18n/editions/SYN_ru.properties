title=Синодальный перевод — Об этом издании | Common Root
description=Русская Синодальная Библия 1876 года: перевод, начатый Российским библейским обществом в 1813 году, завершённый четырьмя духовными академиями под руководством митрополита Филарета, и до сих пор та Библия, которую большинство русскоязычных читателей имеют в виду, говоря просто «Библия».
heroHeading=Синодальный перевод
readerHref=/reader?c1.src=syn

hero.1=Работа началась в 1813 году, когда недавно основанное Российское библейское общество, действуя при поддержке императора Александра I, взялось за русский перевод, призванный встать рядом с церковнославянской Библией, а не заменить её. В течение нескольких лет появился Новый Завет. Консервативное духовенство увидело в Библии на разговорном русском языке угрозу авторитету церковнославянского текста, и в 1826 году Николай I закрыл Общество и остановил работу на три десятилетия.
hero.2=Перевод возобновился лишь при Александре II. В 1858 году Святейший Синод санкционировал новый русский перевод и поручил работу духовным академиям Москвы, Санкт-Петербурга, Казани и Киева, а митрополит Московский Филарет (Дроздов) стал его главным и последним редактором. Новый Завет, переведённый с греческого печатного текста, известного как Textus Receptus, вышел в 1862 году. Ветхий Завет оказался более трудным вопросом: Филарет настаивал на обращении за церковнославянским текстом к самому еврейскому оригиналу, чему противились те, кто держался греческой основы церковнославянского текста, и официальное разрешение Синода переводить с масоретского текста было дано лишь в том же 1862 году, когда большая часть Ветхого Завета была уже переведена именно на этой основе.
hero.3=Полная Библия — Ветхий и Новый Заветы, впервые соединённые под одной обложкой на этом новом русском языке, а не на церковнославянском — вышла в 1876 году в Синодальной типографии, откуда и происходит обиходное название перевода. Его Ветхий Завет вышел не чисто еврейским: там, где Септуагинта, которую хранила церковнославянская традиция, расходилась с масоретским текстом, греческое чтение нередко тоже сохранялось, обычно как вариант в скобках, так что в итоговой книге сохранился настоящий долг перед греческой Библией, стоявшей за прежним церковнославянским текстом.
hero.4=С тех пор у него не было серьёзных соперников. Православные, католики, баптисты и другие протестанты в России читают так или иначе один и тот же текст, и его слог отметил русскую литературную речь так же, как Библия короля Якова отметила английскую. В этом собрании он насчитывает 66 книг — протестантский канон, а не более полный православный, — и это единственная русская Библия здесь, поэтому на русском языке интерфейс открывается именно на нём.

