fact.13.value=Вся Библия — каждая глава обоих Заветов — начитана синтетическим голосом Microsoft Azure ru-RU-DmitryNeural, озвученным по главам, а не по стихам, чтобы проза сохраняла естественный ритм предложений.
fact.14.label=Ограничения аудио
fact.14.value=Текст начитан машиной, а не диктором, поэтому произношение имён и терминов не проверялось редактором; строка чтения следует за текстом и подсвечивает каждый стих только в режиме отображения «Стихи» — в остальных режимах звук воспроизводится, но без подсветки.
