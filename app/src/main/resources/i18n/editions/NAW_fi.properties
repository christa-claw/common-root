title=An-Nawawin neljäkymmentä hadithia — Tietoja tästä laitoksesta | Common Root
description=An-Nawawin neljäkymmentä hadithia: imam an-Nawawin valitsemat 42 hadithia, joista kukin on tarkoitettu uskon "suureksi perustaksi" (qa'ida azima) — neljänkymmenen hadithin lajin luetuin teos.
heroHeading=An-Nawawin neljäkymmentä hadithia
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Sharaf an-Nawawi syntyi muharram-kuussa vuonna 631 AH (lokakuussa 1233) Nawassa, lähellä Daraa'ta Syyriassa, ja muutti kahdeksantoistavuotiaana Damaskokseen opiskelemaan. Vuonna 665 AH (1267) hänet nimitettiin Damaskoksen Ashrafiyya Dar al-Hadithin johtajaksi, tehtävä, jota hän hoiti kuolemaansa saakka; hän kuoli Nawassa vuonna 676 AH (1277) nelissäkymmenissä ja haudattiin siellä. Shafiilaisena lainoppineena hän kirjoitti tuona lyhyenä elämänä runsaasti — muiden teostensa joukossa ovat Riyad al-Salihin, Sahih Muslimin kommentaari Al-Minhaj, al-Majmu' Sharh al-Muhadhab, Minhaj al-Talibin ja Kitab al-Adhkar.
hero.2=Al-Arba'in al-Nawawiyya jatkaa vanhempaa "neljänkymmenen hadithin" (arba'iniyyat) perinnettä, jonka lähtökohtana on hadith, joka lupaa sille, joka säilyttää yhteisölleen neljäkymmentä uskoon liittyvää hadithia, paikan oppineiden joukossa tuomiopäivänä — hadith, jonka useimmat kriitikot itse luokittelevat heikoksi (da'if). Ensimmäinen tällainen, nykyisin kadonnut kokoelma, on liitetty Abdullah ibn al-Mubarakiin (k. 797); monet oppineet seurasivat omilla kokoelmillaan. An-Nawawi valitsi hadithia, joita hän pitteli luotettavina, suurimman osan [[BUK|Sahih al-Bukharista]] ja [[MUS|Sahih Muslimista]], ja kukin niistä havainnollisti sitä, mitä hän kutsui uskon "suureksi perustaksi" (qa'ida azima) — ja nimestään huolimatta kokoelma käsittää nykyasussaan neljäkymmentäkaksi hadithia. Siitä tuli lajinsa luetuin esimerkki, ja siitä kirjoitettiin kymmeniä kommentaareja, kuuluisimpana Ibn Rajab al-Hanbalin Jami' al-'Ulum wal-Hikam; se luetaan sunnalaisen islamin luetuimpiin teoksiin Koraanin jälkeen.
hero.3=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-nawawi-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää teoksissa [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]] ja [[MAL|Muwatta Malik]] sekä Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=Klassista arabiaa, englanninkielinen käännös näkyy lukijassa jokaisen hadithin alla
fact.2.label=Kokoaja
fact.2.value=Yahya ibn Sharaf an-Nawawi (631–676 AH / 1233–1277)
fact.3.label=Nimi
fact.3.value=Tunnetaan nimellä al-Arba'in al-Nawawiyya ("an-Nawawin neljäkymmentä hadithia"); nimestään huolimatta kokoelma käsittää neljäkymmentäkaksi hadithia
fact.4.label=Koottu
fact.4.value=Suurimmaksi osaksi [[BUK|Sahih al-Bukharista]] ja [[MUS|Sahih Muslimista]], kun an-Nawawi johti Damaskoksen Ashrafiyya Dar al-Hadithia (665 AH / 1267) kuolemaansa saakka Nawassa, Syyriassa, vuonna 676 AH (1277)
fact.5.label=Menetelmä
fact.5.value=Kukin hadith valittu sen vuoksi, että se oli an-Nawawin sanoin uskon "suuri perusta" (qa'ida azima); jatkaa vanhempaa neljänkymmenen hadithin lajia (arba'iniyyat), jonka ensimmäinen, nykyisin kadonnut esimerkki on liitetty Abdullah ibn al-Mubarakiin (k. 797)
fact.6.label=Asema
fact.6.value=Luetaan laajalti sunnalaisen islamin luetuimpiin teoksiin Koraanin jälkeen; kymmenien kommentaarien aihe, kuuluisimpana Ibn Rajab al-Hanbalin Jami' al-'Ulum wal-Hikam
fact.7.label=Hadith-määrä
fact.7.value=42 nimestä huolimatta; tämän aineiston lähdelaitos numeroi samoin
fact.8.label=Tässä aineistossa
fact.8.value=1 kirja ja 42 numeroitua hadithia
fact.9.label=Englanninkielinen käännös
fact.9.value=Otettu fawazahmed0/hadith-api:n eng-nawawi-laitoksesta, näytetään arabiankielisen tekstin rinnalla; mistä painetusta käännöksestä se on peräisin, ei ole tämän aineiston puolesta vielä varmistettu
fact.10.label=Käyttöoikeus
fact.10.value=Arabiankielinen matn on klassinen, vapaasti käytettävä teksti; englanninkielisen käännöksen käyttöoikeus on edelleen tarkistuksessa
