title=Textbibel 1906 — Su questa edizione | Common Root
description=La Textbibel di Kautzsch e Weizsäcker: una Bibbia tedesca di studiosi, tradotta di nuovo dall'ebraico e dal greco e pubblicata per la prima volta in un solo volume a Tubinga nel 1899; il testo qui è datato 1906.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Due professori, due Testamenti. Carl Weizsäcker (1822–1899) fu storico della Chiesa a Tubinga, dove nel 1861 succedette a Ferdinand Christian Baur sulla cattedra e dal 1889 fu cancelliere dell'università. La sua traduzione del Nuovo Testamento apparve per la prima volta nel 1875 ed ebbe nove edizioni mentre era in vita, l'ultima preparata sul letto di morte. Emil Kautzsch (1841–1910) fu uno studioso dell'Antico Testamento che insegnò a Lipsia, Basilea e Tubinga prima di stabilirsi a Halle nel 1888; il suo Antico Testamento, tradotto con un gruppo di colleghi specialisti, uscì completo nel 1894.
hero.2=Nel 1899, l'anno in cui morì Weizsäcker, i due furono riuniti in un solo volume, la Textbibel des Alten und Neuen Testaments, pubblicata a Tubinga da J.C.B. Mohr (Paul Siebeck). Il nome dice che cos'è: il testo nudo, per lettori che volevano sapere che cosa dicono l'ebraico e il greco, nel tedesco del loro tempo. Non volle mai sostituire Lutero. Weizsäcker evitò di proposito la lingua di Lutero e cercò invece di rendere l'impressione che l'originale fece sui suoi primi lettori; il suo biografo riteneva improbabile che diventasse mai un libro popolare, e non lo diventò. Continuò a essere ristampata fino agli anni 1910. Il testo digitale qui è datato 1906; quale edizione fosse quella stampa non è stato stabilito da questo progetto.
hero.3=Si legge come la scienza del suo tempo. Il nome divino nell'Antico Testamento è «Jahwe» — «Jahwe ist mein Hirte» al Salmo 23 —, migliaia di volte, dove Lutero ha «der Herr». Isaia 7:14 ha «ein junges Weib», una giovane donna. Nel Nuovo Testamento il Padre nostro di Matteo 6:13 termina senza la dossologia, e 1 Giovanni 5:7 non ha testimoni celesti. L'Antico Testamento mantiene capitoli e versetti ebraici: i titoli dei salmi rientrano nella numerazione, così il Salmo 51 ha 21 versetti, e Malachia ha tre capitoli invece di quattro. L'ortografia è più antica di quanto la data lasci pensare — in Giovanni 8:1 Gesù «gieng» al monte degli Ulivi.
hero.4=In questo lettore è una di quattro Bibbie tedesche, accanto all'Elberfelder e ai testi di Lutero del 1545 e del 1912. Un'interfaccia tedesca non si apre su di essa: il tedesco non ha una scelta curata, così il lettore prende la prima Bibbia tedesca del catalogo, che è l'Elberfelder. Nei pioli della discendenza non è registrato per essa alcun antecedente, il che si addice a una traduzione fatta sugli originali: un piolo aperto sotto un versetto scende diritto al fondo delle lingue originali segnato con ≈ — il Codice di Leningrado di Westminster per l'Antico Testamento e, per il Nuovo, il Textus Receptus, un greco che questa traduzione non segue, come mostra 1 Giovanni 5:7.

