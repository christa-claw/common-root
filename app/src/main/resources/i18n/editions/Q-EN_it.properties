title=Corano — Pickthall — Informazioni su questa edizione | Common Root
description=La traduzione del 1930 di Muhammad Marmaduke Pickthall, la prima traduzione inglese del Corano opera di un musulmano di madrelingua inglese — prodotta al servizio del nizam di Hyderabad e con il consiglio degli studiosi di al-Azhar, e in questo corpus l'inglese mostrato di default sotto il testo arabo.
heroHeading=Corano — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) fu un romanziere inglese, ammirato ai suoi tempi da H. G. Wells e D. H. Lawrence, prima di diventare traduttore di scrittura sacra. Dichiarò la sua conversione all'islam nel novembre 1917, dopo una conferenza intitolata "Islam and Progress" tenuta alla Muslim Literary Society di Notting Hill, e pronunciò la shahada quello stesso mese alla Woking Muslim Mission. Un decennio più tardi era preside del Chadarghat High School a Hyderabad, al servizio del nizam, e fu da lì che nel 1928 prese un anno sabbatico di due anni per fare ciò che aveva voluto fare fin dalla sua conversione: tradurre il Corano in inglese.
hero.2=Non lo fece da solo né in fretta. Nel 1929 passò tre mesi al Cairo, dove l'appoggio di Rashid Rida gli aprì delle porte, cercando la benedizione degli studiosi di al-Azhar per un progetto che ad alcuni di loro era stato detto avrebbe potuto costare loro il posto — una parte di al-Azhar riteneva grave la traduzione del Corano in sé. Pickthall proseguì comunque e continuò a consultarli. Ciò che pubblicò nel 1930, come "The Meaning of the Glorious Koran: An Explanatory Translation", porta questa cautela già nel titolo: non "il Corano in inglese" ma una spiegazione del suo significato, poiché nessuna traduzione, secondo la sua stessa opinione dichiarata, poteva essere il Corano stesso. Alfred A. Knopf pubblicò la prima edizione a New York; seguì un'edizione bilingue della tipografia del governo di Hyderabad.
hero.3=Il Times Literary Supplement la definì "a great literary achievement", ed è di solito descritta come la prima traduzione inglese del Corano opera di un musulmano di madrelingua inglese — le versioni inglesi precedenti, tra cui quelle di Sale e Rodwell, erano opera di orientalisti non musulmani. Quella di Pickthall è rimasta in stampa e in uso per quasi un secolo da allora, una delle poche traduzioni inglesi che i lettori comuni, non solo gli studiosi, leggono davvero.
hero.4=In questo corpus è la traduzione mostrata di default sotto il testo arabo uthmani — l'arabo resta la base di ogni colonna, e questo inglese è mostrato come commento accanto ad esso, senza mai sostituirlo. Fu scelta per questo ruolo per un motivo tanto poco glamour quanto letterario: una rassegna delle traduzioni disponibili trovò solo due versioni inglesi inequivocabilmente di pubblico dominio, questa e quella di Yusuf Ali del 1934, più quella russa di Sablukov del 1878 per una terza lingua. Il testo qui è una digitalizzazione della traduzione, ottenuta tramite alquran.cloud e non legata a una particolare stampa, perciò va letto come la formulazione di Pickthall e non come il facsimile di un'edizione determinata.

