title=Palabra de Dios para Ti — Acerca de esta edición | Common Root
description=Palabra de Dios para Ti: una traducción al español publicada en 2020 por la Asociación Bíblica Latinoamericana, que conserva transliterados los nombres hebreos de Dios y está licenciada libremente para cualquier uso.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti es una traducción nueva al español, publicada en 2020 por la Asociación Bíblica Latinoamericana; un texto electrónico se publicó en 2022 a través de la Latinamerican Textual Bible Foundation, Inc., una organización sin fines de lucro registrada en Florida que la distribuye en eBible.org y YouVersion. Se atribuye a los traductores Francisco Liévano y Joyce Liévano. A diferencia de la línea Reina-Valera, sobre la que se abre por defecto la interfaz en español de este corpus, no es una revisión de la traducción de Casiodoro de Reina del siglo XVI ni de nada que descienda de ella; es una traducción independiente, hecha directamente de las lenguas originales, dirigida a lectores comunes de toda la América hispanohablante y pensada para citarse libremente, sin pedir permiso.
hero.2=El Antiguo Testamento sigue la Biblia Hebraica Stuttgartensia y el Nuevo Testamento la 27.ª edición del Novum Testamentum Graece de Eberhard Nestle. Una elección distingue sus páginas de la mayoría de las Biblias en español posteriores a Reina: donde estas vierten el Tetragrámaton como "Jehová" o lo sustituyen por "Señor", Palabra de Dios para Ti conserva los propios nombres hebreos, transliterados — Yavé, ʼElohim, ʼEL-Shadday —, de modo que el Génesis abre, en las propias palabras de esta edición, "En un principio ʼElohim creó los cielos y la tierra."
hero.3=En este lector es una de cuatro ediciones españolas, junto con [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] y [[VBL|Versión Biblia Libre]]. La interfaz sigue abriendo por defecto la Reina-Valera 1909; esta es una edición a la que se llega desde su propia tarjeta. Como las otras dos, es una traducción nueva y no la revisión de nada más que el corpus contenga, de modo que no se le registra ningún texto base en los peldaños del linaje: un peldaño abierto bajo uno de sus versículos cae directamente al suelo de lenguas originales marcado con ≈. La Asociación Bíblica Latinoamericana edita también una versión impresa más completa con los libros deuterocanónicos; el texto que contiene este corpus es el canon protestante habitual de sesenta y seis libros.

