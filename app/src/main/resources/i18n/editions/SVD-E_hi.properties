title=स्मिथ एवं वान डाइक (eBible पाठ) — इस संस्करण के विषय में | Common Root
description=स्मिथ और वान डाइक की 1865 की अरबी बाइबिल, उस पूर्णतः स्वरांकित इलेक्ट्रॉनिक पाठ में जिसे eBible.org अमेरिकन बाइबिल सोसाइटी की मूल फ़ाइल से सार्वजनिक सम्पदा के रूप में प्रकाशित करता है।
heroHeading=स्मिथ एवं वान डाइक — पूर्णतः स्वरांकित पाठ
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=यह वही अनुवाद है जो [[SVD|स्मिथ एवं वान डाइक]] है — वह अरबी बाइबिल जो बेरूत में एली स्मिथ ने आरम्भ की और कॉर्नेलियस वान डाइक ने 1865 में, अरबी विद्वानों बुत्रुस अल-बुस्तानी, नासिफ़ अल-याज़िजी और यूसुफ़ अल-असीर के साथ, सम्पन्न की — केवल एक भिन्न इलेक्ट्रॉनिक फ़ाइल से सेट किया गया। अनुवाद वही है; फ़ाइल ही इस संस्करण के अस्तित्व का कारण है।
hero.2=1865 की बाइबिल किसी के लिए भी स्वतन्त्र है, परन्तु उसकी इलेक्ट्रॉनिक प्रतिलिपि भी किसी का श्रम है, और वान डाइक पाठ वेब पर अनिश्चित मूल की अनेक प्रतियों में प्रचलित है। कुछ प्रतिलेखन पर ही स्वत्वाधिकार के दावे के साथ प्रस्तुत की जाती हैं। जिस पाठ का मूल अनुरेखित नहीं किया जा सकता, उसे विश्वासपूर्वक मुद्रित नहीं किया जा सकता, इसलिए यह संस्करण उस प्रतिलिपि का उपयोग करता है जिसका मूल अनुरेखित किया जा सकता है: वह जिसे eBible.org प्रकाशित करता है, सार्वजनिक सम्पदा घोषित, जो सीरियन मिशन को अनुवादक और अमेरिकन बाइबिल सोसाइटी को स्रोत का सहयोगी नामित करती है। फ़ाइल की तारीख़ 2020-08-03 है।
hero.3=यह पूर्णतः स्वरांकित है। हर शब्द अपने ह्रस्व स्वर और अन्य वाचन-चिह्न धारण करता है, जहाँ इस पाठक का दूसरा वान डाइक पाठ अधिकांशतः अचिह्नित है। इससे सेटिंग धीमी और मुखर पठन सरल हो जाता है, और स्वरांकित पृष्ठ को पंक्तियों के बीच अधिक स्थान चाहिए, इसलिए इस संस्करण की मुद्रित प्रतिलिपि वही पाठ बिना स्वरांकन की तुलना में अधिक लम्बी बैठती है।
hero.4=यही वह संस्करण है जो चुनना चाहिए जब प्रश्न यह हो कि पाठ मुद्रित किया जा सकता है या नहीं। स्क्रीन पर पढ़ने के लिए, दोनों में से कोई भी वान डाइक समान रूप से उपयुक्त है।

