title=Nouveau Testament de Tyndale 1534 — À propos de cette édition | Common Root
description=Le Nouveau Testament de William Tyndale, première traduction anglaise faite sur le grec et première imprimée, dans sa propre révision de 1534 — le texte qui se trouve sous la Bible de Genève et la King James Version.
heroHeading=Nouveau Testament de Tyndale 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=Du temps de Tyndale, une Bible anglaise était encore illégale. Les Constitutions d'Oxford de 1409 interdisaient de traduire l'Écriture en anglais, ou de lire une telle traduction, sans l'approbation d'un évêque. William Tyndale demanda cette approbation à l'évêque de Londres, Cuthbert Tunstall, en 1523, essuya un refus et quitta l'Angleterre l'année suivante pour faire le travail sans elle. Avec le Nouveau Testament grec d'Érasme sous les yeux, l'allemand de Luther et la Vulgate latine à côté, il réalisa le premier Nouveau Testament anglais traduit du grec, et le premier jamais imprimé. Une première tentative à Cologne en 1525 fut interrompue par une descente chez l'imprimeur ; le livre complet sortit des presses de Peter Schöffer à Worms en 1526 et fut introduit clandestinement en Angleterre, où les évêques en rachetèrent des exemplaires pour les brûler.
hero.2=Le texte présenté ici est la révision de Tyndale lui-même, imprimée à Anvers en 1534 : il y reprit le grec, corrigea sa première version et ajouta des prologues et des notes. C'était un plaidoyer autant qu'une traduction. Thomas More l'attaqua pour avoir écrit « assemblée » (congregation) là où l'Église disait église, « ancien » (elder) là où elle disait prêtre, et « amour » (love) là où elle disait charité — et ces trois choix figurent dans ce texte : Matthieu 16,18 se lit « apon this rocke I wyll bylde my congregacion ». Tyndale révisa encore une fois en 1535, fut arrêté à Anvers en mai de la même année et, en 1536, condamné comme hérétique, étranglé et brûlé à Vilvorde, près de Bruxelles.
hero.3=Dans ce lecteur, on le trouve tout en bas. Le Tyndale est un échelon enregistré sous la Bible de Genève et sous la King James Version, et donc, plus bas sur l'échelle, sous la Revised Version, l'American Standard Version et la World English Bible qui reposent sur la King James. Quand on descend d'un verset de la King James en passant la Genève, le texte bouge souvent à peine — et c'est tout l'intérêt ; en 1 Corinthiens 13,13 il bouge, là où Tyndale et la Genève disent love et la King James charity. Sous Tyndale, aucun parent n'est enregistré. Il travaillait sur le grec d'Érasme, mais le Textus Receptus présent ici est l'édition de 1550, postérieure d'une génération, et le Luther présent ici est la Bible de 1545, non le Nouveau Testament de 1522 dont il se servit ; l'échelle descend donc directement au socle des langues originales. Seul le Nouveau Testament est présent, dans sa propre orthographe : Matthieu commence par « This is the boke of the generacion of Iesus Christ ».

