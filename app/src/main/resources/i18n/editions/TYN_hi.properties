title=टिंडेल का नया नियम 1534 — इस संस्करण के बारे में | Common Root
description=विलियम टिंडेल का नया नियम — यूनानी से किया गया पहला अंग्रेज़ी अनुवाद और छपने वाला पहला — उनके अपने 1534 के संशोधन में: वह पाठ जो जिनेवा बाइबिल और किंग जेम्स संस्करण के नीचे है।
heroHeading=टिंडेल का नया नियम 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=टिंडेल के इंग्लैंड में अंग्रेज़ी बाइबिल अब भी क़ानून के विरुद्ध थी। 1409 के ऑक्सफ़ोर्ड संविधानों ने किसी बिशप की स्वीकृति के बिना धर्मशास्त्र का अंग्रेज़ी में अनुवाद करना, या ऐसा अनुवाद पढ़ना, वर्जित कर दिया था। विलियम टिंडेल ने 1523 में लंदन के बिशप कथबर्ट टनस्टॉल से यह स्वीकृति माँगी, उन्हें मना कर दिया गया, और अगले वर्ष वे उसके बिना यह काम करने के लिए इंग्लैंड छोड़कर चले गए। सामने इरैस्मस का यूनानी नया नियम, और बगल में लूथर का जर्मन अनुवाद और लातीनी वुल्गाता रखकर, उन्होंने यूनानी से अनूदित पहला अंग्रेज़ी नया नियम बनाया — और पहला, जो कभी छपा। 1525 में कोलोन में पहला प्रयास छापाख़ाने पर छापे के कारण बीच में रुक गया; पूरी पुस्तक 1526 में वर्म्स में पीटर शॉफ़र के छापाख़ाने से निकली और चोरी-छिपे इंग्लैंड पहुँचाई गई, जहाँ बिशप उसकी प्रतियाँ ख़रीदकर जला देते थे।
hero.2=यहाँ का पाठ टिंडेल का अपना संशोधन है, जो 1534 में एंटवर्प में छपा: इसमें उन्होंने यूनानी को फिर से देखा, अपने पहले संस्करण को सुधारा और भूमिकाएँ तथा टिप्पणियाँ जोड़ीं। यह जितना अनुवाद था, उतना ही एक पक्ष लेना भी। थॉमस मोर ने उन पर इसलिए हमला किया कि जहाँ चर्च “चर्च” कहता था वहाँ उन्होंने “मंडली” (congregation) लिखा, जहाँ वह “पुरोहित” कहता था वहाँ “प्राचीन” (elder), और जहाँ वह charity कहता था वहाँ “प्रेम” (love) — और ये तीनों चुनाव इस पाठ में मौजूद हैं: मत्ती 16:18 में लिखा है “apon this rocke I wyll bylde my congregacion”। टिंडेल ने 1535 में एक बार फिर संशोधन किया, उसी वर्ष मई में एंटवर्प में गिरफ़्तार हुए, और 1536 में विधर्मी ठहराए जाकर ब्रसेल्स के पास विल्वोर्डे में गला घोंटकर मारे और जलाए गए।
hero.3=इस रीडर में वे सबसे नीचे मिलते हैं। टिंडेल जिनेवा बाइबिल और किंग जेम्स संस्करण, दोनों के नीचे एक दर्ज पायदान हैं, और इसलिए, सीढ़ी में और नीचे, किंग जेम्स पर टिके Revised Version, American Standard Version और World English Bible के नीचे भी। किंग जेम्स के किसी पद से जिनेवा को पार करते हुए नीचे उतरें, तो अक्सर शब्द मुश्किल से हिलते हैं — और बात यही है; 1 कुरिन्थियों 13:13 पर वे हिलते हैं, जहाँ टिंडेल और जिनेवा love कहते हैं और किंग जेम्स charity। टिंडेल के नीचे कोई दर्ज जनक नहीं है। उन्होंने इरैस्मस के यूनानी पर काम किया था, लेकिन यहाँ का टेक्स्टस रिसेप्टस 1550 का संस्करण है, उनसे एक पीढ़ी बाद का, और यहाँ का लूथर 1545 की बाइबिल है, न कि 1522 का नया नियम जिसका उन्होंने उपयोग किया; इसलिए सीढ़ी सीधे मूल भाषाओं के तल पर उतर जाती है। यहाँ केवल नया नियम है, उनकी अपनी वर्तनी में: मत्ती आरम्भ होता है “This is the boke of the generacion of Iesus Christ” से।

