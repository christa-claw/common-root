fact.9.value=कोई दर्ज जनक नहीं — सीढ़ी सीधे मूल भाषाओं के तल पर उतरती है, जहाँ [[TR|टेक्स्टस रिसेप्टस]] यूनानी के साक्षी के रूप में खड़ा है, न कि ऐसी पुस्तक के रूप में जो टिंडेल के हाथ में रही हो
