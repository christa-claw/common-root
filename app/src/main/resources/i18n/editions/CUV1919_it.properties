title=Versione cinese dell'Unione, testo del 1919 — Su questa edizione | Common Root
description=La versione cinese dell'Unione come fu pubblicata per la prima volta nel 1919, con le vecchie forme dei caratteri e la punteggiatura originale, trascritta da Chinese Wikisource, con le sue note a piè di pagina.
heroHeading=Versione cinese dell'Unione — il testo del 1919
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Questa è la [[CUV|versione cinese dell'Unione]] come fu stampata nel 1919: la Bibbia in mandarino alla quale missionari ed eruditi cinesi lavorarono per ventinove anni, fissata nelle forme di quell'anno. L'altra versione dell'Unione presente in questo lettore è il testo come si legge oggi, con punteggiatura moderna e scelte di caratteri moderne. Questa conserva la pagina del 1919.
hero.2=Si può vedere la differenza nei caratteri. Il testo del 1919 usa forme che le stampe successive hanno abbandonato — 爲 dove le edizioni odierne hanno 為, così come 愼, 册, 槪 — ed è stampato per intero in caratteri tradizionali. La sua punteggiatura è quella trascritta dalla stampa del 1919, non la punteggiatura moderna delle edizioni successive. Dove il libro del 1919 stampava versetti consecutivi come un unico passo, questa edizione fa lo stesso: la numerazione dei versetti è conservata, e il testo si colloca sul primo versetto della serie.
hero.3=Il testo proviene dalla trascrizione realizzata da Chinese Wikisource, ed è l'edizione Shen (神版), nella quale Dio è 神, non 上帝. Le note a piè di pagina del libro del 1919 sono conservate, e appaiono in questo lettore come annotazioni sui versetti a cui appartengono.
hero.4=È stato aggiunto perché si possa stampare una Bibbia cinese partendo da un testo la cui data e origine sono note. Una stampa del 1919 è da tempo fuori diritti. I testi punteggiati che la seguirono, dal 1988 in avanti, sono una questione distinta, motivo per cui i due sono tenuti separati.

