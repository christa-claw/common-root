title=Leningradkodexen — Om denna utgåva | Common Root
description=Leningradkodexen: världens äldsta fullständiga handskrift av den hebreiska Bibeln, avskriven år 1008 e.Kr. och alltjämt grundtexten bakom de flesta moderna översättningar av Gamla testamentet.
heroHeading=Leningradkodexen
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=Detta är den äldsta bevarade fullständiga handskriften av den hebreiska Bibeln. Den skrevs av en skrivare vid namn Samuel ben Jakob, verksam i Gamla Kairo, som i en egen notis sist i handskriften daterade sitt arbete till år 1008 e.Kr.
hero.2=Samuel ben Jakob uppfann ingen text; han bevarade en. Han arbetade i Ben Asher-släktens tradition, de främsta auktoriteterna på masoran — det utarbetade systemet av vokaltecken, kantillationstecken och marginalanteckningar som judiska lärde under århundraden hade förfinat för att fastställa den hebreiska Bibelns uttal och skydda den mot förvanskning. En äldre och förmodligen mer auktoritativ Ben Asher-handskrift finns bevarad — Aleppokodexen — men större delen av dess Tora-avdelning gick förlorad 1947. Leningradkodexen är dyrbar just därför att den är fullständig och gammal nog att stå alldeles vid källan till den traditionen.
hero.3=Namnet kommer från den stad där handskriften senare hamnade: Leningrad, som Sankt Petersburg hette när handskriften kom in i den västerländska forskningen, ett namn som blev kvar även sedan staden själv fick tillbaka sitt 1991. I dag ligger den till grund för Biblia Hebraica Stuttgartensia, standardutgåvan av den hebreiska Bibeln för forskare — vilket innebär att nästan varje modern översättning av Gamla testamentet, på nästan varje språk, går tillbaka på denne ende kairoskrivares omsorgsfulla avskrift från 1000-talet, vare sig läsarna någonsin får veta hans namn eller inte.

