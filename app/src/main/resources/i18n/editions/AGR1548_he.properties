# The narrative, one paragraph per key, in order.
hero.1=הפינית המודפסת העתיקה ביותר שיש. כשפרסם מיקאל אגריקולה את Se Wsi Testamenti בשנת 1548, פינית כמעט מעולם לא סודרה בדפוס — ספר האלף־בית שלו עצמו, שיצא שנים אחדות קודם לכן, היה הספר הפיני הראשון בכלל. ביניהם יצא לאור גם ספר התפילה של 1544, חיבור גדול בהיקפו שכבר נכללו בו תרגומי מזמורים. כדי להדפיס את כתבי הקודש היה עליו להחליט תחילה כיצד נכתבת השפה, וההחלטות ההן — הכתיב, מילות השאילה, הקצב — הן המקום שבו מתחילה הפינית הכתובה. הברית החדשה עלתה לו ולחוגו בטורקו יותר מעשור; ספר תהלים בא ב־1551, ומבחרים מן הנביאים ומחומשי משה ב־1551 וב־1552. אך הפינית שלו הייתה הפינית הראשונה בדפוס, לא הראשונה שנכתבה: ארבעה כתבי יד — קודקס ווסט, כתב יד אופסלה B 28, המיסאל מקנגסאלה וקטע אופסלה — נושאים קטעי מקרא בפינית, וקאוקו פירינן הראה ב־1988, בהשוואתם למקורותיהם השוודיים, שחלקם קדומים מכל מה שאגריקולה הדפיס, ואולי נכתבו כבר בשנות ה־30 של המאה ה־16.
hero.2=את התנ"ך כולו מעולם לא תרגם, והקורא הזה אינו מעמיד פנים אחרת. הברית החדשה וכל 150 המזמורים שלמים; הנביאים וחומשי משה מופיעים במבחר. גם מה שתרגם במקומות אחרים נמצא כאן: ספר התפילה שלו מ־1544 וכן ה־Käsikirja וה־Messu מ־1549 נושאים טקסט מקראי משלהם — ובכללו פרקי בראשית שנדפסו תחת הכותרת "Genesist mutomat Lughut" — ומשם באו 685 פסוקים. הם משמשים רק במקום שבו לכרכי המקרא אין פסוק באותה כתובת, ורק במקום שבו הטקסט רץ ברצף ואינו ציטוט בודד בתוך תפילה. כך שבראשית בכל זאת כאן, בחלקה: פרקים 1–4, 22, 28 ו־32. שופטים, רות, דברי הימים א ואסתר חסרים לגמרי. מקרא עברי־פיני שלם נאלץ להמתין לביבליה של 1642, שלב אחד למעלה.
hero.3=בקורא הזה אגריקולה הוא השלב הפיני העתיק ביותר. פתחו שלב אחד מתחת לפסוק בביבליה 1642, וטקסט שלו יופיע לצד הגרמנית של לותר — שני המקורות שוועדת 1642 באמת החזיקה פתוחים. מתחת לאגריקולה עצמו השרשרת עוזבת את הפינית לתמיד: הוא עבד עם היוונית של ארסמוס ועם הלטינית שארסמוס הדפיס לצידה, עם הגרמנית של לותר ועם הוולגטה. שלושה מהם רשומים כאן כהוריו; הלטינית של ארסמוס והמקרא השוודי השלם של גוסטב ואסה משנת 1541, שגם בו נעזר, אינם באוסף זה. הנוסח הוא של קורפוס ה־VKS של Kotus, בכתיב הדפוס של 1548: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". כתבי הקודש בשוודית היו בדפוס מאז 1526, עם צאת הברית החדשה השוודית, ולכן נוסח שוודי עמד לרשותו מלכתחילה.

