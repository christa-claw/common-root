title=Louis Segond 1910 (französisch) — Über diese Ausgabe | Common Root
description=Die Segond-Bibel in ihrer Revision von 1910: die Übersetzung eines Genfer Pfarrers aus dem Hebräischen und Griechischen, erstmals vollständig gedruckt 1880, für die Britische und Ausländische Bibelgesellschaft revidiert und ein Jahrhundert lang die Standardbibel der französischsprachigen Protestanten.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond wurde 1810 in Plainpalais geboren, damals gleich vor den Toren Genfs, und starb 1885 in Genf. Er studierte Theologie an der protestantischen Fakultät in Straßburg, wurde mit sechsundzwanzig Jahren zum Doktor der Theologie promoviert und war vierundzwanzig Jahre lang Pfarrer der Dorfgemeinde Chêne-Bougeries, bevor er sich dem Unterricht in Hebräisch und Altem Testament zuwandte. Die Ehrwürdige Compagnie des Pasteurs von Genf beauftragte ihn, das Alte Testament neu aus dem Hebräischen zu übersetzen, und seine Fassung erschien in einer auf 1874 datierten Ausgabe. Danach übersetzte er aus eigenem Antrieb das Neue Testament, nach dem kritischen griechischen Text Constantin Tischendorfs und nicht nach dem Textus Receptus, und 1880 erschien die ganze Bibel in einem Band, gedruckt in Oxford.
hero.2=Dies ist nicht ganz der Text, den Segond veröffentlichte. Nach seinem Tod ließ die Britische und Ausländische Bibelgesellschaft ihn von einer Gruppe französischer und Schweizer Pfarrer und Theologen revidieren, und die Revision erschien 1910. Ihre Änderungen neigten zum Wortschatz der protestantischen Orthodoxie — Priester wurden zu „sacrificateurs“, dem alten protestantischen Wort, statt „prêtres“; in dieser Abschrift steht „sacrificateur“ überall und „prêtre“ selten. Dieser Text von 1910 wurde für den größten Teil des zwanzigsten Jahrhunderts die Referenzbibel des französischen Protestantismus und gehört bis heute zu den meistgelesenen unter französischsprachigen Evangelikalen. Er hat auch eine lange Familie späterer Revisionen: die „Colombe“ von 1978, die Nouvelle Édition de Genève von 1979 und Segond 21 im Jahr 2007. Einige Züge zeigen sich auf fast jeder Seite. Der Gottesname ist „l'Éternel“, der Ewige, wie bei Ostervald und in der französischen Darby, die in diesem Korpus daneben steht: „L'Éternel est mon berger“ in Psalm 23. Und Jesaja 7:14 lautet „la jeune fille deviendra enceinte“ — die junge Frau, nicht die Jungfrau — genau die Art Wiedergabe, für die manche konservative Protestanten Segond vorwarfen, die messianischen Weissagungen abzuschwächen.
hero.3=In den Psalmen folgt das Buch dem Hebräischen: die Zählung ist die hebräische, sodass Psalm 23 der Hirtenpsalm ist, und wo die Überschrift eines Psalms im Hebräischen ein Vers ist, ist sie es auch hier — Psalm 51 hat 21 Verse, zwei mehr als in der King James Version. Joel und Maleachi dagegen behalten die Kapiteleinteilung der lateinischen und englischen Überlieferung, drei Kapitel und vier. In diesem Leser ist sie eine von drei französischen Bibeln, neben Ostervald und der französischen Darby. Eine französische Oberfläche öffnet nicht auf ihr: fürs Französische gibt es keine kuratierte Wahl, also nimmt der Leser die erste französische Bibel in Katalogreihenfolge, und das ist Darby. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden fällt — für das Alte Testament der Codex Leningradensis, eine Handschrift der masoretischen Überlieferung und kein gedruckter hebräischer Text aus Segonds Zeit, für das Neue der Textus Receptus, also genau das Griechisch, dem er nicht folgen wollte. Ihr Sprossen-Chip trägt das Jahr 1910.

