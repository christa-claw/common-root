title=Smith & Van Dyck — Sobre esta edición | Common Root
description=La Biblia árabe de Smith y Van Dyck: comenzada por Eli Smith en Beirut y acabada por Cornelius Van Dyck en 1865 con los sabios de la Nahda Butrus al-Bustani, Nasif al-Yaziji y Yusuf al-Asir; sigue siendo la Biblia árabe más leída.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=La misión norteamericana de Beirut emprendió esta traducción hacia 1847, y quien la empezó no la terminó. Eli Smith había pasado dos decenios en el Levante y sabía la lengua lo bastante como para discutir sobre ella; trabajó en el texto hasta su muerte, en 1857. Cornelius Van Alen Van Dyck la tomó a su cargo y la llevó a término: el Nuevo Testamento quedó listo en 1860 y el Antiguo cinco años después, en 1865. Los dos nombres del libro son las dos mitades de un mismo trabajo.
hero.2=Los nombres que no están en el lomo pesan otro tanto. Van Dyck había aprendido su árabe con Butrus al-Bustani y Nasif al-Yaziji, y ambos trabajaron con él en la traducción, lo mismo que el jeque Yusuf al-Asir, que repasó el árabe en cuanto a giro y estilo. Aquellos tres no eran auxiliares de una empresa misionera. Figuraban entre las cabezas de la Nahda, el renacimiento literario árabe, y lo que salió se lee como prosa árabe y no como una traducción vestida de árabe. Por eso el libro sobrevivió a la misión que lo pagó.
hero.3=Fue una hazaña de imprenta tanto como de erudición. La American Press de Beirut lo compuso en un tipo árabe cortado para la misión y acabado en 1843, la letra que todavía se llama al-Amerikani y en cuya forma intervino Smith. El árabe es difícil de componer bien —las letras se enlazan y al enlazarse cambian de figura— y una Biblia que se veía correcta en la página hizo por su acogida más de lo que habría hecho cualquier argumento. Desde entonces han salido millones de ejemplares, a lectores protestantes y coptos por igual, y para la mayoría de los cristianos de lengua árabe la Biblia suena sencillamente así.
hero.4=En este lector es la única Biblia árabe, y eso decide su comportamiento. Si se pone la interfaz en árabe, es esta la que se abre: no porque se la haya escogido, como se escogió la Reina-Valera 1909 para el español, sino porque el catálogo busca una Biblia en la lengua de la interfaz y encuentra exactamente una. Es además una de solo dos ediciones de aquí cuyo texto corre de derecha a izquierda; la otra es la Biblia hebrea moderna. En los peldaños del linaje no se le registra ningún texto base, de modo que un peldaño abierto bajo un versículo cae directamente al suelo de lenguas originales marcado con ≈, lo cual acierta aquí más de cerca que de costumbre, pues el griego que ese suelo aporta es el Textus Receptus, y del Textus Receptus se hizo su Nuevo Testamento.

