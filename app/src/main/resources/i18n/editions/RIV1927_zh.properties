title=里韦杜塔修订本 1927（意大利文）— 关于此版本 | Common Root
description=里韦杜塔修订本（Riveduta）：乔瓦尼·迪奥达蒂的意大利文圣经，由瓦勒度派神学家乔瓦尼·卢齐主持的委员会依希伯来文和希腊文修订，1924 年由大英圣书公会在罗马出版——以及文件为何标作 1927。
heroHeading=里韦杜塔修订本 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=乔瓦尼·卢齐 1856 年生于瑞士格劳宾登州的下恩加丁，次年全家移居卢卡，他还在襁褓中便被带到那里。他在意大利长大，就读于佛罗伦萨的瓦勒度派神学院——意大利那支古老新教教会的学府——后来在那里教授神学，并在该城任牧师。晚年他回到瑞士，住在波斯基亚沃，1948 年在那里去世。
hero.2=里韦杜塔修订本始于 1906 年。大英圣书公会当时已为意大利读者印行迪奥达蒂的 17 世纪译本整整 1 个世纪，这一年它组织一批人修订此译本，由卢齐领衔。他曾希望与天主教学者合作，做成一部共同的圣经；梵蒂冈拒绝了，工作遂作为新教的修订继续进行。全本圣经 1924 年在罗马出版，扉页称之为依原文修订的译本——“riveduta”，即“修订的”，此后便以此为名。它不是新译本：底子是迪奥达蒂的译文，重新对照希伯来文和希腊文校过。在 20 世纪的大部分时间里，它是意大利新教徒的圣经；它的后继者《新修订本》（Nuova Riveduta）由日内瓦圣经公会于 1994 年出版。卢齐另有一部自己的译本，附有注释，共 12 卷，自 1921 年起在佛罗伦萨陆续出版；那是另一部著作，并非此文本。
hero.3=修订的痕迹在页面上看得见。旧约中的神名作“l'Eterno”，即“永恒者”——诗篇 23 篇作“L'Eterno è il mio pastore”——而迪奥达蒂作“il Signore”。以赛亚书 7:14 作“la giovane”，即“少女”，迪奥达蒂作“la Vergine”（童女）。在新约里，凡后来的校勘本离开公认文本之处，它也离开：约翰一书 5:7 没有天上的见证，马太福音 6:13 的主祷文不带颂荣句结尾，使徒行传 8:37 保留，但置于方括号内。诗篇采用希伯来编号，诗篇的标题并入第一节——诗篇 23 篇以“Salmo di Davide.”开头——因此诗篇 51 篇有 19 节，与英文圣经相同。至于年份：1927 是这份数字文本所带、目录所存的年份，所以它的阶梯标签显示 1927。里韦杜塔修订本本身于 1924 年出版，这份文件复制的是后来哪一次印本，本项目尚未查明。
hero.4=在本阅读器中，它是三部意大利文圣经之一，另两部是迪奥达蒂译本的两个副本。意大利文界面并不在它上面开启：意大利文没有选定的默认版本，所以阅读器按目录顺序取第一部意大利文圣经，那就是迪奥达蒂 1649。谱系阶梯中未为它记录任何母本——连迪奥达蒂也没有，尽管里韦杜塔正是迪奥达蒂的修订本，而迪奥达蒂也在本语料库中——所以在某一节之下展开的阶梯径直落到以 ≈ 标示的原文底层：旧约是威斯敏斯特列宁格勒抄本，新约是公认文本，恰恰是这次修订所离开的那种希腊文。

