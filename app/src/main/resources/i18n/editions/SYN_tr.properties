fact.14.label=Ses kısıtlamaları
fact.14.value=Bir insan tarafından değil makine tarafından üretildiği için isimlerin ve terimlerin telaffuzu editör tarafından denetlenmemiştir; okuma satırı metni takip eder ve her ayeti yalnızca "Ayetler" görüntüleme modunda vurgular — diğer modlarda ses yine çalar, yalnızca vurgu olmadan.
