title=Sinodal Çeviri — Bu Baskı Hakkında | Common Root
description=1876 tarihli Rusça Sinodal Çeviri: 1813'te Rus İncil Derneği tarafından başlatıldı, Metropolit Filaret önderliğinde dört Ortodoks ilahiyat akademisi tarafından tamamlandı ve bugün hâlâ çoğu Rusça konuşanın sadece "İncil" dediği metindir.
heroHeading=Sinodal Çeviri
readerHref=/reader?c1.src=syn

hero.1=Çalışma 1813'te, yeni kurulan Rus İncil Derneği'nin, Çar I. Aleksandr'ın desteğiyle, Kilise Slavcası İncil'in yerine değil onun yanında duracak bir Rusça çeviriye girişmesiyle başladı. Birkaç yıl içinde bir Yeni Ahit ortaya çıktı. Muhafazakâr din adamları, konuşma dilindeki Rusça bir İncil'de Kilise Slavcası metnin otoritesine yönelik bir tehdit gördüler ve 1826'da I. Nikolay Derneği kapatarak çalışmayı otuz yıl boyunca durdurdu.
hero.2=Çeviri ancak II. Aleksandr döneminde yeniden başladı. 1858'de Kutsal Sinod yeni bir Rusça baskıyı onayladı ve işi Moskova, Sankt-Peterburg, Kazan ve Kiev ilahiyat akademilerine verdi; Moskova Metropoliti Filaret (Drozdov) bu çalışmanın yönetici ve son editörü oldu. Textus Receptus olarak bilinen basılı Yunanca metinden çevrilen Yeni Ahit, 1862'de yayımlandı. Eski Ahit ise daha zor bir tartışma konusuydu: Filaret, Kilise Slavcası metnin ötesine geçip doğrudan İbranice'ye dayanılmasında ısrar etti; buna, Kilise Slavcası metnin Yunanca temelinden yana olanlar karşı çıktı ve Sinod'un Masoretik metinden çeviri için resmî izni ancak aynı 1862 yılında geldi — o sırada Eski Ahit'in büyük bölümü zaten bu temelde çevrilmişti.
hero.3=Eski ve Yeni Ahit'in Kilise Slavcası yerine bu yeni Rusça içinde ilk kez tek bir kapak altında bir araya geldiği tam İncil, 1876'da, çeviriye alışılagelen adını veren Sinod Matbaası'ndan çıktı. Eski Ahit'i salt İbranice olarak ortaya çıkmadı: Kilise Slavcası geleneğinin taşıdığı Septuaginta, Masoretik metinden ayrıldığı yerlerde, Yunanca okuma genellikle yine de korundu, çoğunlukla parantez içinde bir seçenek olarak; böylece tamamlanan kitap, eski Kilise Slavcası metnin arkasındaki Yunanca İncil'e karşı gerçek bir borcu hâlâ taşır.
hero.4=O günden beri ciddi bir rakibi olmadı. Rusya'daki Ortodoks, Katolik, Baptist ve diğer Protestan okuyucuların hepsi bir biçimde aynı metne başvurur ve üslubu, Kral James İncil'inin İngilizceyi etkilediği gibi yazılı Rusçayı da etkilemiştir. Bu derlemede 66 kitaptan oluşur — daha geniş Ortodoks kanonu değil, Protestan kanonu — ve buradaki tek Rusça İncil odur, bu yüzden Rusça arayüz onunla açılır.

