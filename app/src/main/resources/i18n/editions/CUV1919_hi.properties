title=चीनी संयुक्त अनुवाद, 1919 का पाठ — इस संस्करण के बारे में | Common Root
description=चीनी संयुक्त अनुवाद जैसा वह पहली बार 1919 में प्रकाशित हुआ था, पुराने अक्षर-रूपों और मूल विराम-चिह्नों के साथ, चाइनीज़ विकिस्रोत द्वारा लिप्यंतरित, उसकी पाद-टिप्पणियों सहित।
heroHeading=चीनी संयुक्त अनुवाद — 1919 का पाठ
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=यह [[CUV|चीनी संयुक्त अनुवाद]] है जैसा वह 1919 में छापा गया था: वह मंदारिन बाइबिल जिस पर मिशनरियों और चीनी विद्वानों ने उनतीस वर्षों तक काम किया और जिसे उस वर्ष के अक्षर-रूपों में दर्ज किया गया। इस पाठक में मौजूद दूसरा संयुक्त अनुवाद वह पाठ है जैसा आज पढ़ा जाता है, आधुनिक विराम-चिह्नों और आधुनिक अक्षर-चयन के साथ। यह वाला 1919 के पृष्ठ को बनाए रखता है।
hero.2=अंतर अक्षरों में देखा जा सकता है। 1919 का पाठ उन रूपों का उपयोग करता है जिन्हें बाद की छपाइयों ने छोड़ दिया — 爲, जहाँ आज के संस्करणों में 為 है, तथा 愼, 册, 槪 — और यह आरंभ से अंत तक परंपरागत अक्षरों में छपा है। इसके विराम-चिह्न 1919 की छपाई से लिप्यंतरित हैं, बाद के संस्करणों के आधुनिक विराम-चिह्न नहीं। जहाँ 1919 की पुस्तक ने लगातार पदों को एक ही अनुच्छेद के रूप में छापा था, वहाँ यह संस्करण भी वैसा ही करता है: पद-संख्या बनी रहती है, और पाठ उस क्रम के पहले पद पर रहता है।
hero.3=यह पाठ चाइनीज़ विकिस्रोत द्वारा तैयार किए गए लिप्यंतरण से लिया गया है, और यह शेन संस्करण (神版) है, जिसमें ईश्वर को 神 कहा गया है, 上帝 नहीं। 1919 की पुस्तक की पाद-टिप्पणियाँ बनाए रखी गई हैं, और इस पाठक में वे उन पदों पर टिप्पणियों के रूप में दिखाई देती हैं जिनसे वे संबंधित हैं।
hero.4=इसे इसलिए जोड़ा गया ताकि एक चीनी बाइबिल ऐसे पाठ से छापी जा सके जिसकी तारीख और उत्पत्ति ज्ञात है। 1919 की छपाई कॉपीराइट से बाहर हो चुकी है, और लंबे समय से। उसके बाद आए विरामांकित पाठ, 1988 और उसके बाद के, एक अलग मसला हैं, और इसीलिए दोनों को अलग रखा गया है।

