title=Louis Segond 1910 (French) — About This Edition | Common Root
description=The Segond Bible in its 1910 revision: a Genevan pastor's translation from the Hebrew and Greek, first printed whole in 1880, revised for the British and Foreign Bible Society, and for a century the standard Bible of French-speaking Protestants.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond was born in 1810 at Plainpalais, then just outside Geneva, and died in Geneva in 1885. He studied theology at the Protestant faculty in Strasbourg, took his doctorate in theology at twenty-six, and spent twenty-four years as pastor of the village parish of Chêne-Bougeries before turning to teaching Hebrew and the Old Testament. The Venerable Company of Pastors of Geneva commissioned him to translate the Old Testament afresh from the Hebrew, and his version appeared in an edition dated 1874. He then translated the New Testament on his own initiative, working from the critical Greek text of Constantin Tischendorf rather than the Textus Receptus, and in 1880 the whole Bible came out in one volume, printed at Oxford.
hero.2=This is not quite the text Segond published. After his death the British and Foreign Bible Society had it revised by a group of French and Swiss pastors and theologians, and the revision appeared in 1910. Their changes leaned toward the vocabulary of Protestant orthodoxy — priests became “sacrificateurs”, the old Protestant word, rather than “prêtres”; in this copy “sacrificateur” is everywhere and “prêtre” rare. It is this 1910 text that became the reference Bible of French Protestantism for most of the twentieth century and is still among the most read by French-speaking evangelicals. It also has a long family of later revisions: the “Colombe” of 1978, the Nouvelle Édition de Genève of 1979, and Segond 21 in 2007. A few features show on almost every page. The divine name is “l'Éternel”, as in Ostervald and the French Darby beside it in this corpus: “L'Éternel est mon berger” at Psalm 23. And Isaiah 7:14 reads “la jeune fille deviendra enceinte” — the young woman, not the virgin — the kind of rendering for which some conservative Protestants accused Segond of weakening the messianic prophecies.
hero.3=The book follows the Hebrew in its Psalms: the numbering is the Hebrew one, so Psalm 23 is the shepherd psalm, and where a psalm's heading is a verse in the Hebrew it is a verse here too — Psalm 51 has 21 verses, two more than in the King James Version. Joel and Malachi, on the other hand, keep the chapter divisions of the Latin and English tradition, three chapters and four. In this reader it is one of three French Bibles, beside Ostervald and the French Darby. A French interface does not open on it: French has no curated pick, so the reader takes the first French Bible in catalogue order, which is Darby. No parent is recorded for it in the lineage rungs, so a rung opened under a verse drops straight to the original-language floor marked with ≈ — the Westminster Leningrad Codex for the Old Testament, a manuscript of the Masoretic tradition rather than a printed Hebrew of Segond's day, and the Textus Receptus for the New, which is precisely the Greek he chose not to follow. Its rung chip carries the year 1910.

