title=Baibal Olcim — Acerca de esta edición | Common Root
description=Baibal Olcim: la Biblia en matu chin, una lengua minoritaria del estado Chin de Myanmar, distribuida por eBible.org como un texto genuinamente de dominio público cuyo traductor y fecha de traducción no constan.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=El matu chin —también llamado matupi chin— es una lengua sino-tibetana hablada por unas 34.000 personas, concentradas en torno a Matupi, en el sur del estado Chin de Myanmar, con comunidades emparentadas al otro lado de la frontera, en el estado indio de Mizoram. Baibal Olcim es la Biblia en esta lengua, y es el único texto en matu chin de este corpus.
hero.2=Lo que el registro no da es quién la tradujo, ni cuándo. eBible.org, que distribuye el texto, solo indica que es de dominio público y lo cataloga bajo hlt, el código ISO 639-3 del matu chin —sin traductor, sin comité, sin fecha de traducción—. Esta página deja ambas cosas en blanco antes que adivinarlas. Ese mismo código tiene aquí su propia pequeña historia: un intento anterior de añadir una segunda Biblia en hindi a este corpus se archivó bajo hlt por el parecido de la abreviatura, hasta que la aparición de versículos en matu chin donde se esperaban en hindi descubrió el error. Esta edición es la que de verdad se cotejó con la lengua que nombra su código.
hero.3=Se añadió por lo que es, no por su extensión: una Biblia genuinamente de dominio público, no solo licenciada, en la lengua de una minoría cristiana que ha sufrido una persecución real en el conflicto civil de Myanmar, concentrado en el estado Chin y sus alrededores. Un lector construido para no exigir nada a quienes lo usan, y para no rastrear a ninguno de ellos, es exactamente para un caso como este, lo cual explica también buena parte de por qué esta página tiene tan poco más que poner en sus datos.

