title=Коран — Юсуф Али — Об этом издании | Common Root
description=Перевод Абдуллы Юсуфа Али, изданный в четырёх томах между 1934 и 1937 годами индийским чиновником, ставшим исламским учёным, — один из всего двух английских переводов Корана, безусловно признанных общественным достоянием, и в этом собрании второй английский перевод-спутник рядом с переводом Пиктхолла.
heroHeading=Коран — Юсуф Али
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Абдулла Юсуф Али (1872-1953) родился в Бомбее и получил первоначальное образование в тамошнем Уилсон-колледже, где религиозное воспитание наряду со школьным заставило его мальчиком выучить Коран наизусть. Диплом бакалавра первого класса по английской литературе, полученный в Бомбейском университете в 1891 году, принёс ему стипендию Presidency для поездки в Британию, где он изучал право в колледже Святого Иоанна в Кембридже, окончив его со степенью бакалавра и дипломом юриста в 1895 году и в том же году вернувшись в Индию на должность в индийской гражданской службе.
hero.2=Почти два десятилетия он провёл на гражданской службе — мировым судьёй и налоговым чиновником, затем судьёй, а позже заместителем секретаря финансового департамента правительства Индии, — прежде чем в 1914 году подал в отставку и поселился в Британии. Там он стал попечителем мечети Шах-Джехан в Уокинге и фонда мечети Восточного Лондона, в 1917 году был удостоен звания CBE за работу во время войны и читал лекции по хиндустани в School of Oriental Studies. В 1920-х и 1930-х годах он вернулся в Индию директором Islamia College в Лахоре, и именно в эти годы, после более чем десятилетия труда, он переложил Коран на английский язык со своими собственными пояснительными примечаниями.
hero.3=Перевод выходил тридцатью выпусками между 1934 и 1937 годами, первый — 4 апреля 1934 года, под названием "The Holy Qur'an: Text, Translation and Commentary", изданный Shaik Muhammad Ashraf из Лахора; за ним в 1938 году последовало сводное однотомное издание, а в 1939-1940 годах — пересмотренное издание. Наряду с переводом Пиктхолла он стал одним из двух самых читаемых английских переводов Корана XX века, известным прежде всего обширностью своих примечаний, и с тех пор переиздавался, местами переработанный другими руками, примерно в тридцати последующих тиражах — включая издание, распространявшееся в Северной Америке издательством Amana Publications с 1977 года, и редакцию 1980-х годов, выпущенную при саудовской поддержке.
hero.4=То, что оцифровано здесь через alquran.cloud, — это сам текст перевода, а не сопровождающий его комментарий Юсуфа Али; в этом собрании он предлагается как второй английский перевод-спутник [[Q-AR|усманского арабского текста]], рядом с [[Q-EN|переводом Пиктхолла]] 1930 года. Это был один из всего двух английских переводов, которые обзор доступных переводов признал безусловно свободными для использования — этот и перевод Пиктхолла, — хотя слово "безусловно" здесь требует оговорки: произведение является общественным достоянием в Европейском союзе и в Пакистане, где Юсуф Али умер и где произведение было впервые опубликовано, но формальное авторское право, зарегистрированное в США в 1996 году, считается там действующим до 2033 года.

