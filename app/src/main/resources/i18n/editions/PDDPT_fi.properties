title=Palabra de Dios para Ti — Tietoja tästä laitoksesta | Common Root
description=Palabra de Dios para Ti: Asociación Bíblica Latinoamericanan vuonna 2020 julkaisema espanjankielinen käännös, joka säilyttää heprealaiset jumalannimet translitteroituina ja on lisensoitu vapaasti kaikkeen käyttöön.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — "Jumalan sana sinulle" — on tuore espanjankielinen käännös, jonka julkaisi vuonna 2020 Asociación Bíblica Latinoamericana; sähköinen teksti ilmestyi vuonna 2022 Latinamerican Textual Bible Foundation, Inc:n kautta, floridalaisen voittoa tavoittelemattoman järjestön, joka levittää sitä eBible.orgissa ja YouVersionissa. Käännös on merkitty Francisco Liévanon ja Joyce Liévanon nimiin. Toisin kuin Reina-Valera-linja, johon tämän aineiston espanjankielinen käyttöliittymä oletuksena avautuu, se ei ole Casiodoro de Reinan 1500-luvun käännöksen eikä minkään siitä polveutuvan tarkistus; se on itsenäinen käännös, tehty suoraan alkukielistä, suunnattu tavallisille lukijoille kautta espanjankielisen Amerikan ja tarkoitettu lainattavaksi vapaasti, kysymättä lupaa.
hero.2=Vanha testamentti seuraa Biblia Hebraica Stuttgartensiaa ja Uusi testamentti Eberhard Nestlen Novum Testamentum Graecen 27. painosta. Yksi valinta erottaa sen sivut useimmista Reinan jälkeisistä espanjankielisistä raamatuista: siinä missä ne kääntävät JHWH:n muotoon "Jehová" tai korvaavat sen muodolla "Señor", Palabra de Dios para Ti säilyttää heprealaiset nimet itsensä, translitteroituina — Yavé, ʼElohim, ʼEL-Shadday — niin että 1. Mooseksen kirja alkaa, tämän laitoksen omin sanoin, "En un principio ʼElohim creó los cielos y la tierra."
hero.3=Tässä lukuohjelmassa se on yksi neljästä espanjankielisestä laitoksesta yhdessä [[RVR09|Reina-Valera 1909:n]], [[BES|Biblia en Español Sencillon]] ja [[VBL|Versión Biblia Libren]] kanssa. Käyttöliittymä avautuu yhä oletuksena Reina-Valera 1909:ään; tämä on laitos, jolle siirrytään sen omalta kortilta. Kuten kaksi muutakin, se on tuore käännös eikä minkään tässä aineistossa olevan tekstin tarkistus, joten sille ei ole kirjattu kantatekstiä polveutumisaskelmissa — sen jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan. Asociación Bíblica Latinoamericana julkaisee myös laajemman painetun laitoksen, joka sisältää deuterokanoniset kirjat; tämän aineiston teksti on protestanttisen kaanonin tavanomaiset kuusikymmentäkuusi kirjaa.

