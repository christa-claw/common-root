title=和合本 — この版について | Common Root
description=1919年の和合本：二十九年にわたる委員会の作業から生まれた、今なお多くの中国プロテスタントが読む聖書であり、成文化された口語北京官話で出版された最初期の書物の一つである。
heroHeading=和合本
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=1890年、中国で活動するプロテスタント諸伝道団は上海に集まり、一つの問題を認めた。すでに複数の中国語聖書が存在していたが、どの二つを取っても一致しなかった——訳語も、人名の表記も、どの中国語の文体で書くかさえも。会議は、すべての伝道団が用いる単一の翻訳を作ることを決議し、それを「和合本」と呼んだ——調和させた本文である。当時の書き言葉の中国語は、教育を受けた者の文言と、それ以外のすべての人々の口語とに分かれていたため、彼らは同時に三種類を委嘱した——文言によるものを二種類、官話によるものを一種類である。
hero.2=官話版の委員会は二十九年を要した。1863年から山東にいたアメリカ長老派のカルヴィン・ウィルソン・メイティアがこれを主宰し、1908年、仕事を終えぬまま世を去った。彼が半ダースほどの伝道団から集めた委員団はそのまま作業を続け、共に働いた中国人学者たちも同様であったが、その名は伝道団の記録にはるかに雑にしか残されていない。彼らは英語のリバイズド・バージョンを訳出の底本とし、その背後にあるヘブライ語とギリシャ語に照らして確認した——これにより、このコーパス自身のリバイズド・バージョンはこの聖書の一段上流に位置し、キング・ジェイムズ・バージョンはさらにその上に位置することになる。二つの文言訳はやがて一つに統合された。生き残ったのは官話訳だった。
hero.3=これは1919年に出版され、その年は委員会の力だけでは成し得なかったことをこの書にもたらした。それは五四運動の年であり、中国の書き手たちが文言を捨てて本気で口語に向かい始めた年であった。和合本は、すでにその口語で書かれた最初期の本格的な書物の一つとして登場した。宣教師同士の議論に決着をつけるはずだった翻訳は、近代中国語散文の金字塔となり、その言い回しは聖書を一度も開いたことのない人々にさえ引用される。それ以来、たった一語だけが異なる二つの版で印刷され続けている——神を「神」と記すか「上帝」と記すかであり、両版が同じページ割りになるよう字間が調整されている。
hero.4=この読書環境において、これは唯一の中国語聖書であり、そのことが二つのことを決めている。インターフェースを中国語に設定するとこれが開く——スペイン語のためにレイナ・バレラ1909が選ばれたような選定によってではなく、カタログを見ても他にこの言語の聖書が見当たらないためである。そして系譜の段には母本が記録されておらず、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る——もっとも、これが依拠したリバイズド・バージョンはこのコーパスの中で一列隣に座っているにもかかわらずである。その段のチップには、ここにあるすべての版が持つわけではない年、1919年が付されている。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=中国語——口語の官話（官話／baihua）であり、文言ではない
fact.2.label=正式名称
fact.2.value=和合本（héhéběn）——「調和」または「合一」を意味する版
fact.3.label=委嘱者
fact.3.value=1890年、上海における在華プロテスタント宣教師総会
fact.4.label=翻訳者
fact.4.value=複数のプロテスタント伝道団から集められた委員会。アメリカ長老派のカルヴィン・ウィルソン・メイティア（1836–1908）が死去するまで官話委員団を主宰し、終始中国人の同労者たちと働いた
fact.5.label=出版
fact.5.value=1919年、二十九年にわたる作業の末に
fact.6.label=底本
fact.6.value=作業の基盤とした英語のリバイズド・バージョンを、ヘブライ語とギリシャ語に照らして確認した——このコーパスが収める同じ[[RV|リバイズド・バージョン]]である
fact.7.label=二つの版
fact.7.value=神版（神版）と上帝版（上帝版）——「神」をどの中国語で表すかだけが異なる
fact.8.label=後の改訂
fact.8.value=和合本修訂版、新約2006年・全巻2010年——ここに収める本文ではない
fact.9.label=このコーパスでは
fact.9.value=ここにある唯一の中国語聖書であり、中国語インターフェースは既定でこれを開く。系譜の段には母本が記録されていないが、その段のチップには1919年という年が付されている
fact.10.label=音声
fact.10.value=聖書全体——新旧両約のすべての章——が、マイクロソフト・アジュール（Microsoft Azure）のニューラル音声zh-CN-YunxiNeuralによって読み上げられている。節ごとではなく章ごとに合成されており、散文が自然な文のリズムを保っている。
fact.11.label=音声の制限
fact.11.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
