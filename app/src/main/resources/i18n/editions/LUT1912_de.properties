fact.12.value=Die oberste Sprosse der deutschen Leiter: ein verzeichneter Vorläufer, [[LUT1545|Luther Bibel 1545]], und darunter der urtextliche Grund. Ihre 85 Anmerkungen der Bearbeiter sind hier als Kommentare erhalten statt verworfen, und sie sind ausgabengebunden — eine Anmerkung von 1912 erscheint unter einer Spalte von 1912 und sonst nirgends. Sie ist nicht das, worauf eine deutsche Oberfläche aufgeht; das ist [[ELB|die Elberfelder]], die erste im Katalog nach ihrem Kürzel und aus keinem anderen Grund
