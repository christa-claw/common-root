title=Luther Bibel 1912 — Über diese Ausgabe | Common Root
description=Die zweite kirchenamtliche Revision der Lutherbibel: eine bewusst schonende Durchsicht, 1910 abgeschlossen, 1912 angenommen, und der letzte Luthertext, der auf dem Textus receptus ruht.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Eine Revision einer Revision. Die deutschen Kirchen hatten sich 1892 mit der ersten kirchenamtlichen Revision auf eine einheitliche Textfassung der Lutherbibel geeinigt, und schon wenige Jahre später hieß es, sie greife zu kurz. Die Einwände waren die alten: zu viele Archaismen und eine Rechtschreibung, die niemandes mehr war. Der zweite Punkt gab den Ausschlag. Mit dem Duden galt im Deutschen Reich erstmals eine verbindliche Orthografie, die in den Schulen gelehrt wurde, und eine Lutherbibel, die davon abwich, war im Unterricht schwer zu halten. 1906 stimmte die Deutsche Evangelische Kirchenkonferenz einer erneuten Revision zu und beschloss ausdrücklich ein schonendes und bewahrendes Vorgehen. Eine Kommission von Theologen arbeitete bis 1910 sämtliche biblischen Bücher durch, und 1912 nahm die Kirchenkonferenz das Ergebnis an.
hero.2=Die Arbeit dauerte kaum mehr als zwei Jahre, was schon sagt, um welche Art von Revision es sich handelte. Eine neue Lutherbibel war weder philologisch noch sonstwie beabsichtigt. Ein späterer Bearbeiter, Fritz Tschirch, tat sie als schulmeisterliche Revision ab, und über das Verfahren sagt das Wort nichts Falsches — die Rechtschreibung angeglichen, die offenkundig abgestorbenen Wörter ersetzt, der Wortlaut im Übrigen dort belassen, wo Luther ihn hatte. Was das Wort übersieht, ist die Beständigkeit. Durch die Jahrzehnte der Teilrevisionen hindurch blieb der Text von 1912 stehen, und er wird bis heute gelesen und verkauft. Ein Teil davon ist die Jubiläumsbibel von 1912, die Ausgabe der Privilegierten Württembergischen Bibelanstalt zum hundertjährigen Bestehen, mit erklärenden Anmerkungen versehen und bis weit in dieses Jahrhundert in Fraktur nachgedruckt. Ein Teil ist die erloschene Urheberschaft, die den Text überall kostenlos verfügbar macht — auch hier.
hero.3=Eines vor allem hält ihn in konservativen Kreisen in Gebrauch: er ist die letzte Lutherrevision, die den Textus receptus zugrunde legt, die im 16. und 17. Jahrhundert verbreitete Gestalt des griechischen Neuen Testaments. Alles danach ging zum kritischen Text über. Das macht diese Ausgabe zu einer ungewöhnlich sauberen Sprosse in einer Leiter, denn das Griechische unter ihr ist dasselbe Griechische, das unter Luthers eigener Ausgabe von 1545 liegt, unter der Genfer Bibel und unter der King James — der ganze Turm teilt einen Grund, statt ihn auf halber Höhe auszutauschen.
hero.4=In den Sprossen der Übersetzungslinie steht diese Ausgabe unmittelbar über der Luther Bibel 1545 und hat genau einen verzeichneten Vorläufer, nämlich diese. Öffnet man unter einem Vers von 1912 eine Sprosse, erscheint darunter Luthers eigener Wortlaut von 1545; öffnet man eine weitere, erreicht die Leiter den Textus receptus für das Griechische und den Westminster Leningrad Codex für das Hebräische. Dreihundertsiebenundsechzig Jahre Revision, Vers für Vers, in zwei Klicks. Was diese Ausgabe nicht ist: die Bibel, auf der eine deutsche Oberfläche aufgeht — für das Deutsche ist keine Standardausgabe hinterlegt, also nimmt der Leser die erste deutsche Bibel im Katalog, und das ist die Elberfelder.

