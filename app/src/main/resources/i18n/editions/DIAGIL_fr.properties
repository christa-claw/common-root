title=Emphatic Diaglott (interlinéaire) — À propos de cette édition | Common Root
description=L'Emphatic Diaglott de Benjamin Wilson, 1864 : la glose anglaise mot à mot imprimée sous le grec de Griesbach, rachetée ensuite et rééditée soixante ans durant par la Société Watch Tower, et le texte autour duquel se mène d'ordinaire la dispute sur Jean 1:1.
heroHeading=Emphatic Diaglott (interlinéaire)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson n'était pas un savant de métier. Il était rédacteur de journal à Geneva, dans l'Illinois, apprit le grec seul et fit paraître entre 1857 et 1863, par livraisons, un Nouveau Testament interlinéaire qu'il n'avait pas seulement traduit mais fabriqué : son neveu le regardait prendre des empreintes de cire de chaque page composée, les suspendre une nuit dans l'acide pour y faire croître une peau de cuivre, adosser le cuivre à du métal coulé et imprimer le résultat sur une presse à bras pendant que l'enfant encrait la planche. Le volume achevé parut en 1864. Pour son grec il prit le texte que Johann Jakob Griesbach avait établi dans les années 1770, avec des leçons tirées du Codex Vaticanus.
hero.2=Ce que Wilson imprima en réalité, ce fut deux textes anglais et non un seul. Le long de la marge gauche courait le grec avec, sous chaque mot, une glose littérale mot à mot ; le long de la droite, sa propre traduction polie, l'Emphatic Version. Ce ne sont pas les mêmes, et en Jean 1:1 elles se contredisent ouvertement : la glose porte « and a god was the Word », l'Emphatic Version « and the LOGOS was God ». Les deux sont de Wilson, imprimées dans le même livre à quelques centimètres l'une de l'autre. Ce corpus contient la glose, la colonne que l'on cite, et c'est la raison pour laquelle elle figure dans une section à part et non dans la grille des bibles. Une glose enregistre comment une phrase grecque est assemblée — cas par cas, article par article, dans l'ordre des mots grecs. Elle n'est pas un jugement sur la manière dont la phrase doit se lire en anglais, et le jugement propre de Wilson là-dessus est imprimé dans la colonne d'à côté. Qui cite l'une devrait savoir que l'autre existe.
hero.3=La vie ultérieure du livre est la raison pour laquelle la plupart en ont entendu parler. Wilson mourut en 1900 membre de la Church of the Blessed Hope, et non d'un groupe qui eût alors existé sous le nom de Témoins de Jéhovah. En 1902, Charles Taze Russell, président de la Watch Tower Bible and Tract Society, obtint le droit d'auteur des héritiers de Wilson, puis avec le temps les planches également. La Société imprima le Diaglott les soixante années suivantes — recomposant les caractères sur ses propres presses en 1927, tirant bien plus de cent cinquante mille exemplaires, le vendant deux dollars et finissant par le donner. Le Diaglott est donc un livre des Témoins de Jéhovah par adoption et non par écriture, et son habitude d'imprimer « Jéhovah » dans le Nouveau Testament, là où les auteurs écrivaient κύριος en citant les écritures hébraïques, a précédé de quarante ans le mouvement qui a rendu cet usage célèbre. Le droit d'auteur s'est éteint en 1952 et le texte est depuis dans le domaine public.
hero.4=Deux choses à son sujet dans ce lecteur méritent d'être sues avant de s'en servir. Griesbach n'a imprimé ni Actes 8:37 ni Luc 17:36, de sorte que ni l'un ni l'autre ne se trouve ici ; plutôt que de refermer la lacune et de remonter d'un rang chaque verset suivant, la numérotation laisse les deux places vides, si bien qu'une référence tombe sur le même verset dans cette colonne que dans celle d'à côté. Et aucun antécédent ne lui est enregistré : un échelon de filiation ouvert sous un verset du Diaglott mène donc au sol des langues originales et non à une édition anglaise plus ancienne.
hero.5=Soyons précis sur ce que ce sol imprime. Le grec qu'il montre est le Textus Receptus — la pastille indique ≈ TR 1550, et ce ≈ est le lecteur qui dit offrir un témoin du grec et non le texte d'après lequel cette édition a été faite. Wilson travaillait d'après Griesbach. Là où les deux s'accordent, comme en Jean 1:1, l'échelon montre bel et bien les mots mêmes qui sont glosés. Là où ils diffèrent, non : Griesbach a rejeté la clause trinitaire de 1 Jean 5:7, si bien que le Diaglott n'en garde aucune trace, tandis que la ligne du Textus Receptus au-dessous la porte tout entière. Sur un interlinéaire, dont toute la prémisse est que le grec est là, sur la page, c'est la seule lacune qu'il vaille la peine de connaître avant d'en citer quoi que ce soit.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Ce que c'est
fact.1.value=la glose sublinéaire — l'anglais mot à mot imprimé sous le grec, non la traduction lisible de Wilson
fact.2.label=Établi par
fact.2.value=Benjamin Wilson (1817–1900), savant autodidacte et rédacteur de journal à Geneva, Illinois
fact.3.label=Texte grec
fact.3.value=la recension de Griesbach, avec des leçons du Codex Vaticanus (manuscrit du Vatican 1209)
fact.4.label=Paru
fact.4.value=en livraisons à partir de 1857 ; complet en un volume en 1864, chez Fowler and Wells de New York
fact.5.label=Mode d'impression
fact.5.value=Wilson galvanoplastia lui-même chaque planche et tira la première édition sur une presse à bras
fact.6.label=Le nom divin
fact.6.value=imprime « Jéhovah » dans le Nouveau Testament là où les auteurs écrivaient κύριος en citant l'Écriture hébraïque — la même décision que [[ASV|l'American Standard Version]] a prise dans tout l'Ancien
fact.7.label=Acquis par
fact.7.value=la Watch Tower Bible and Tract Society, qui obtint le droit d'auteur en 1902 sous Charles Taze Russell, recomposa les caractères en 1927 et l'imprima jusque dans les années 1960
fact.8.label=Licence
fact.8.value=domaine public — le droit d'auteur s'est éteint en 1952, et les réimpressions de la Watch Tower n'en ont ajouté aucun
fact.9.label=Deux versets absents
fact.9.value=Actes 8:37 et Luc 17:36 ne sont pas chez Griesbach et ne sont donc pas ici ; leurs numéros sont laissés vides plutôt que refermés, de sorte que le texte reste aligné verset pour verset avec toute autre édition
fact.10.label=Le grec sous l'échelon
fact.10.value=le [[TR|Textus Receptus]], affiché comme ≈ TR 1550 — un témoin du grec, non le texte de base de Wilson, qui était la recension de Griesbach ; les deux s'accordent en Jean 1:1 et se séparent en 1 Jean 5:7
fact.11.label=Dans ce corpus
fact.11.value=tenu dans sa propre section d'éditions interlinéaires et d'étude, à l'écart des bibles de lecture, pour qu'une glose ne soit jamais prise pour une traduction ; aucun texte source n'est enregistré dans les échelons de filiation, de sorte qu'un échelon s'ouvre droit sur le sol des langues originales
