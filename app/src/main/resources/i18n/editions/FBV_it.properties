fact.4.value=l'ebraico e il Nuovo Testamento greco di Nestle–Aland — il testo critico di cui si servono le società bibliche
fact.5.label=Metodo
fact.5.value=tradotta dal testo originale con il solo soccorso dei lessici, poi confrontata con le versioni esistenti a titolo di controllo — non una loro sintesi né la revisione di una Bibbia inglese più antica
fact.6.label=Stile
fact.6.value=inglese moderno senza gergo né colloquialismi di passaggio, e senza alcun tentativo di rendere le posizioni di una particolare comunità di fede
fact.7.label=Licenza
fact.7.value=Creative Commons Attribuzione-Condividi allo stesso modo 4.0 — copiare, stampare e adattare liberamente, purché la versione sia nominata, i cambiamenti segnalati e il derivato porti la stessa licenza
fact.8.label=Anno nel catalogo
fact.8.value=lasciato in bianco anziché indovinato — il progetto rivede il testo e lo ripubblica via via, sicché nessuna singola stampa è l'edizione
fact.9.label=Sotto un piolo
fact.9.value=≈ TR, testimone del greco più che testo base di questa traduzione; nel corpus non figura ancora alcuna edizione critica greca, sicché lo stesso supplente serve [[NIV|alla NIV]], [[NASB|alla NASB]] e [[BSB|alla BSB]]
fact.10.label=In questo corpus
fact.10.value=tutti e 66 i libri. L'inglese si apre sulla [[NIV|New International Version]] concessa in licenza, sicché questa sta accanto alla [[BSB|Berean Standard Bible]] e alla [[WEB|World English Bible]] come l'inglese che un lettore può portarsi via
