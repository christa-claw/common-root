title=Free Bible Version — Su questa edizione | Common Root
description=Free Bible Version: una Bibbia inglese moderna tradotta dall'ebraico e dal greco di Nestle–Aland da Jonathan Gallagher, pubblicata con una licenza di condivisione allo stesso modo perché chiunque possa ristamparla.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Questa traduzione esiste a causa di una pagina di copyright. Quasi ogni Bibbia inglese moderna ne porta una, e ciò che vi si legge di solito è che qualche centinaio di versetti si può citare senza chiedere nulla, che un libro intero richiede un permesso scritto e che pubblicare il testo per intero significa pagare diritti. Per il sito di una comunità o per una registrazione la faccenda può finire lì. La Free Bible Version è stata fatta per essere la versione davanti alla quale non c'è nulla.
hero.2=È opera di Jonathan Gallagher, che ha un dottorato in teologia conseguito a St Andrews, ed è pubblicata da Free Bible Ministry, un ente senza scopo di lucro. Il Nuovo Testamento viene dal greco di Nestle–Aland — il testo critico di cui si servono le società bibliche — e l'Antico dall'ebraico. Il metodo che il progetto descrive merita di essere dichiarato, perché non è quello consueto: si traduce dal testo originale con i soli lessici, e solo dopo si confronta con le versioni esistenti, come controllo contro doppioni ed errori e non come fonte. Non è la revisione di una Bibbia inglese più antica né la sintesi di altre più recenti. Il suo scopo dichiarato è un inglese contemporaneo che eviti il gergo e i giri di frase alla moda, e rifiuta di tradurre nella direzione delle posizioni di una particolare comunità di fede.
hero.3=La licenza è il punto della cosa. È Creative Commons Attribuzione-Condividi allo stesso modo 4.0: copiatela, stampatela, mettetela su un sito, adattatela, purché la versione sia nominata, i cambiamenti segnalati e ciò che se ne ricava esca alle stesse condizioni. È un patto diverso dal pubblico dominio — la libertà si tramanda invece di essere ceduta — ed è la stessa licenza della Versión Biblia Libre spagnola presente in questo corpus, che viene dallo stesso ministero.
hero.4=Per il lettore ne discendono due cose. Il catalogo lascia in bianco il suo anno, perché il progetto pubblica le revisioni man mano che le fa; non c'è una stampa datata a cui questo corpus sia ancorato, e inventarne una sarebbe peggio del bianco. E un piolo aperto sotto un versetto della Free Bible Version mostra ≈ TR, il Textus Receptus, segnato come testimone e non come testo base. Non è di lì che questa traduzione è stata fatta. È ciò che il corpus può oggi offrire come greco — nessuna edizione critica vi è ancora conservata — e lo stesso supplente compare, per la stessa ragione, sotto la New International Version, la New American Standard Bible e la Berean Standard Bible.

