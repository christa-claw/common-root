fact.1.label=Sprache
fact.1.value=Englisch
fact.2.label=Übersetzer
fact.2.value=Robert Young (1822–1888), Drucker, Buchhändler und Autodidakt der Sprachen in Edinburgh, Verfasser der Analytical Concordance to the Bible
fact.3.label=Altes Testament nach
fact.3.value=Dem überlieferten masoretischen hebräischen Text — der Überlieferung, zu der auch [[WLC|der Codex Leningradensis]] in diesem Korpus gehört
fact.4.label=Neues Testament nach
fact.4.value=Dem griechischen empfangenen Text, [[TR|dem Textus Receptus]] — beibehalten, schrieb Young, „nicht weil er für vollkommen gehalten wird“, sondern weil Übersetzung und Textkritik getrennte Aufgaben sind
fact.5.label=Art der Übersetzung
fact.5.value=Streng wörtlich: die Zeitformen des Originals auch dort beibehalten, wo das Englische seltsam klingt, sodass die Erzählung oft im Präsens läuft; ein englisches Wort für jedes Wort des Originals, so weit möglich, sodass olam und aiōn zu „age“ und „age-during“ werden; des Sinnes wegen ergänzte Wörter in eckigen Klammern; der Gottesname als „Jehovah“
fact.6.label=Veröffentlicht
fact.6.value=Edinburgh, 1862; von Young überarbeitet, 1887; dritte Ausgabe, von seinen Verlegern erneut überarbeitet, Edinburgh, Januar 1898 — der hier vorliegende Text
fact.7.label=Lizenz
fact.7.value=Gemeinfrei; diese Abschrift von eBible.org
fact.8.label=In diesem Korpus
fact.8.value=66 Bücher, der protestantische Kanon vollständig, ohne die Apokryphen; englische Kapitel- und Verszählung, sodass die Psalmen 150 zählen und die Überschrift jedes Psalms in seinen ersten Vers hineingezogen ist
fact.9.label=Abstammung
fact.9.value=Keine verzeichnete Vorlage und nichts als auf ihr stehend verzeichnet – eine Sprosse öffnet geradewegs auf den Ursprachenboden, im Alten Testament auf [[WLC|den Codex Leningradensis]], im Neuen auf [[TR|den Textus Receptus]]; [[LSV|die Literal Standard Version]] von 2020 überarbeitet Youngs Werk, doch das Korpus verzeichnet die Verbindung nicht
