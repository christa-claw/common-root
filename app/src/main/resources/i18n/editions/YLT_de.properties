title=Young's Literal Translation — Über diese Ausgabe | Common Root
description=Robert Youngs wörtliche Bibelübersetzung, zuerst 1862 in Edinburgh erschienen, 1887 von Young selbst und 1898 von seinen Verlegern überarbeitet — eine englische Bibel, die die Zeitformen, die Wortstellung und, so weit es geht, den Wortschatz des Hebräischen und Griechischen bewahrt, auch wo das Englische kaum mitkommt.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) war Drucker und Buchhändler in Edinburgh. Während seiner Lehre als Drucker brachte er sich selbst Hebräisch und mehrere andere orientalische Sprachen bei, leitete von 1856 bis 1861 eine Missionsdruckerei in Surat in Indien und ist vor allem durch zwei Bücher in Erinnerung geblieben: die Konkordanz Analytical Concordance to the Bible und diese Übersetzung. Die Literal Translation veröffentlichte er 1862 in Edinburgh, eine überarbeitete Ausgabe 1887. Zehn Jahre nach seinem Tod, im Januar 1898, brachten seine Verleger eine dritte Ausgabe heraus, noch einmal überarbeitet „auf ihren bisherigen Grundlinien“; das ist der Text in diesem Korpus. Young übersetzte das Alte Testament aus dem überlieferten masoretischen Hebräisch und das Neue Testament aus dem griechischen empfangenen Text, dem Textus Receptus, und sagte offen, dass er von keinem der beiden einen neuen Text herstellen wolle: Übersetzung, schrieb er, sei eine andere Aufgabe als Textkritik, und nur wenige seien für beides befähigt.
hero.2=Das ganze Ziel ist, einen englischen Leser die Grammatik des Originals sehen zu lassen. Young hielt dafür, dass eine Übersetzung, die ein Präsens gibt, wo das Original eine Vergangenheit hat, oder „an a for a the“, den unbestimmten Artikel statt des bestimmten, die Verbalinspiration beiseiteschiebt, und übersetzte entsprechend. Die hebräischen Verbformen kommen als englische Zeitformen herüber, sodass die Erzählung oft im Präsens läuft: Genesis beginnt mit „In the beginning of God's preparing the heavens and the earth —“ und fährt fort „and God saith, ‘Let light be;’ and light is.“ Wörter, die des Sinnes wegen ergänzt sind, stehen in eckigen Klammern: „Jehovah [is] my shepherd, I do not lack.“ Er versuchte, jedem hebräischen oder griechischen Wort, wo immer er konnte, eine einzige englische Entsprechung zu geben, und so werden das hebräische olam und das griechische aiōn zu „age“ und „age-during“ statt zu „ever“ und „eternal“; in Matthäus 25:46 gehen die Gerechten hin „to life age-during“. Der Gottesname steht im ganzen Alten Testament als „Jehovah“.
hero.3=Unsere Abschrift ist vollständig: 66 Bücher von Genesis bis zur Offenbarung, ohne die Apokryphen, in der englischen Kapitel- und Verszählung — 150 Psalmen, bei denen die Überschrift jeweils in den ersten Vers hineingezogen ist, und Maleachi, das mit Kapitel 4 endet. Als Übersetzung des empfangenen Textes enthält sie die Stellen, die spätere textkritische Ausgaben in Frage stellen, vom längeren Markusschluss bis zu den drei Zeugen im Himmel in 1. Johannes 5:7, die dieser Text in eckige Klammern setzt, ebenso wie den ganzen Vers Apostelgeschichte 8:37. In diesem Reader steht sie für sich. Das Korpus verzeichnet für sie keine Vorlage, sodass eine Abstammungssprosse, die man unter einem ihrer Verse öffnet, geradewegs auf den mit ≈ markierten Ursprachenboden fällt: im Alten Testament den Codex Leningradensis, im Neuen den Textus Receptus. Dieser Boden liegt nahe an dem, was Young selbst übersetzte, dem masoretischen Hebräisch und dem empfangenen Griechisch, wenn auch nicht in denselben Drucken. Auf ihr ist ihrerseits nichts als stehend verzeichnet. Die Literal Standard Version von 2020, ebenfalls in diesem Korpus, versteht sich als grundlegende Überarbeitung von Youngs Werk, doch das Korpus verzeichnet diese Verbindung nicht, sodass die Sprossen unter der LSV nicht hierher führen. Keine Oberflächensprache öffnet auf dieser Ausgabe; eine englische Oberfläche öffnet auf der New International Version, und diese hier erreicht man über ihre eigene Karte im Übersetzungsraster.

