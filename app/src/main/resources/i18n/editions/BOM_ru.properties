fact.2.label=Кем сделана
fact.2.value=Джозеф Смит младший (1805–1844), который говорил, что перевёл её «даром и силой Божьей» с набора древних металлических листов; он диктовал текст писцам, главным образом Оливеру Каудери, а более короткие, ранние отрывки записывали Мартин Харрис и Эмма Смит
fact.3.label=Издана
fact.3.value=1830, Палмайра, штат Нью-Йорк; напечатана Эгбертом Б. Грандином, около 5 000 экземпляров
fact.4.label=Структура
fact.4.value=15 книг, от Первой книги Нефия до книги Морония, названных по именам нефийских и иаредийских летописцев, которым приписывается составление каждой из них; в издании 1830 года не было номеров стихов, а нынешнее деление на главы и стихи восходит к изданию 1879 года, подготовленному Орсоном Праттом
fact.5.label=Положение
fact.5.value=Одно из четырёх канонических писаний движения святых последних дней, наряду с Библией, [[DC|Учением и Заветами]] и [[PGP|Драгоценной Жемчужиной]]
fact.6.label=В этом собрании
fact.6.value=Текст и деление на стихи следуют нынешней стандартной формулировке, с типографскими исправлениями издания 2013 года, из JSON-экспорта Mormon Documentation Project, объявленного общественным достоянием; его защищённые авторским правом подстрочные примечания, краткие содержания глав и предисловие не включены — поэтому здесь не указан единый год издания
fact.7.label=Лицензия
fact.7.value=Общественное достояние, по заявлению ответственного за данные; современный защищённый авторским правом учебный аппарат не включён
