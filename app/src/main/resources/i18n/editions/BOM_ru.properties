title=Книга Мормона — Об этом издании | Common Root
description=Книга Мормона: записанный под диктовку Джозефа Смита в 1830 году рассказ о древних пророках Америки, напечатанный в Палмайре, штат Нью-Йорк, и читаемый святыми последних дней как писание, дополняющее Библию.
heroHeading=Книга Мормона
readerHref=/reader?c1.src=bom

hero.1=Джозеф Смит говорил, что перевёл эту книгу «даром и силой Божьей» с набора древних металлических листов, которые, по его словам, он нашёл в 1827 году рядом с фермой своей семьи под Палмайрой, штат Нью-Йорк, и позже вернул посланнику, который их ему показал. Свидетели диктовки описывают, как он рассматривал камень провидца — на более поздних этапах работы камень, который он клал в шляпу, чтобы отгородиться от света, а не только пару камней, закреплённых на нагруднике и традиционно называемых Урим и Туммим, которые, как говорят, прибыли вместе с листами, — и произносил текст вслух, пока писец записывал его. Оливер Каудери записал таким образом большую часть текста за примерно два месяца в 1829 году, главным образом на ферме семьи Уитмер в Фейетте, штат Нью-Йорк; Мартин Харрис и жена Джозефа, Эмма Смит, выступали писцами на более коротких, более ранних этапах.
hero.2=Рукопись пошла в печать в том же году. В июне 1829 года Смит оформил авторское право на произведение, и печать началась в типографии Эгберта Б. Грандина в Палмайре, где типограф Джон Х. Гилберт добавил пунктуацию и разбивку на абзацы, которых не было в продиктованной рукописи. Готовая книга вышла в марте 1830 года: около 5 000 экземпляров — весь тираж Грандина.
hero.3=Книга разделена на пятнадцать книг, от Первой книги Нефия до книги Морония, каждая из которых названа по имени пророка-летописца, которому приписывается её составление. Ни в одном экземпляре 1830 года не было ни одного номера стиха — текст шёл сплошными абзацами внутри глав, намного длиннее тех, что видят сегодняшние читатели. Нынешнее деление на главы и стихи восходит к изданию 1879 года, подготовленному Орсоном Праттом, который также сократил главы и добавил первые подстрочные примечания. Последующие издания ещё больше изменили оформление: комитет под руководством Джорджа Ф. Ричардса набрал текст в две колонки в 1920 году и добавил краткие содержания глав и руководство по произношению; издание 1981 года обновило перекрёстные ссылки, заголовки глав и прочий справочный материал; а издание 2013 года исправило типографские несоответствия, накопившиеся в печатных формах начиная с 1981 года.
hero.4=Она входит в число четырёх произведений, которые движение святых последних дней называет своими каноническими писаниями, наряду с Библией, [[DC|Учением и Заветами]] и [[PGP|Драгоценной Жемчужиной]]. Текст в этом собрании взят из JSON-экспорта Mormon Documentation Project, который его ответственный объявил общественным достоянием; он следует формулировкам и делению на стихи нынешнего стандартного издания, с типографскими исправлениями издания 2013 года, и не включает подстрочные примечания, краткие содержания глав и предисловие, которые остаются защищены авторским правом. Поскольку здесь хранится именно этот нынешний стандартный текст, а не какое-то отдельное историческое издание, для него не указывается единый год публикации.

