# The narrative, one paragraph per key, in order.
hero.1=मालिक इब्न अनस इब्न मालिक इब्न अबी आमिर अल-असबही अल-मदनी, जो कुन्या अबू अब्द अल्लाह से जाने जाते हैं, का जन्म हिजरी संवत् 93 (711 ई.) के आसपास मदीना में हुआ और उनका निधन वहीं हिजरी संवत् 179 (795 ई.) में हुआ; उन्हें अल-बक़ीअ क़ब्रिस्तान में दफ़नाया गया। उन्होंने हिशाम इब्न उरवा, इब्न शिहाब अल-ज़ुहरी, जाफ़र अल-सादिक़ और नाफ़िअ मौला इब्न उमर जैसे विद्वानों से शिक्षा प्राप्त की, और अपने बचे हुए जीवन भर मदीना में शिक्षा दी, जिससे उन्हें इमाम दार अल-हिजरा ("प्रवास के शहर के इमाम") और शेख़ अल-इस्लाम जैसी उपाधियाँ मिलीं। वे मालिकी संप्रदाय के प्रवर्तक बने, जो सुन्नी इस्लाम के चार प्रमुख विधिशास्त्रीय संप्रदायों में से एक है; उनके सबसे प्रमुख शिष्य, मुहम्मद इब्न इदरीस अल-शाफ़ई — जिन्होंने बाद में शाफ़ई संप्रदाय की स्थापना की — ने मालिक की पुस्तक को "क़ुरआन के बाद पृथ्वी पर सबसे विश्वसनीय पुस्तक" कहा। कहा जाता है कि अब्बासी ख़लीफ़ा अल-मंसूर इसे साम्राज्य का एकमात्र विधिक स्रोत बनाना चाहते थे; मालिक ने स्वयं इसे अस्वीकार कर दिया।
hero.2=अल-मुवत्ता ("सुगम मार्ग") परंपरा के अनुसार अब्बासी काल के आरंभ में लगभग चालीस वर्षों में रचित हुआ; कहा जाता है कि इसका नाम इस बात से आया कि मालिक ने यह पाठ मदीना के सत्तर न्यायशास्त्रियों को दिखाया, और उन सभी ने इस पर सहमति (वत्ता) जताई। यह पैग़म्बर से संबद्ध हदीसों को उनके साथियों और उसके बाद की पीढ़ी के विधिक कथनों के साथ, और मालिक के अपने निर्णयों के साथ, जोड़ता है — एक आकलन के अनुसार, यह इस प्रकार हदीस और फ़िक़्ह को मिलाने वाला सबसे प्राचीन बचा हुआ ग्रंथ है, जो छह पुस्तकों से लगभग एक शताब्दी पहले का है। इसके आकार के आँकड़े संस्करण और गणना पद्धति के अनुसार भिन्न हैं: वास्तविक हदीसों के लिए एक सामान्यतः उद्धृत आँकड़ा लगभग 1,720 है, जबकि कहा जाता है कि मालिक ने उन्हें उपलब्ध बताई गई 100,000 रिवायतों में से लगभग 1,900 से कुछ कम का चयन किया।
hero.3=अल-मुवत्ता के कम से कम सोलह संस्करण ज्ञात हैं। जो मानक संदर्भ बना, विशेष रूप से मालिकी संप्रदाय के लिए, वह याह्या इब्न याह्या अल-लैथी का संस्करण है; अहमद इब्न अबी बक्र अल-ज़ुहरी का एक प्रतिस्पर्धी संस्करण इससे लगभग पाँच से दस प्रतिशत अधिक लंबा है। अल-लैथी के संस्करण पर ही लगभग सौ टीकाएँ मौजूद हैं। क्योंकि यह सुन्नी इस्लाम की छह पुस्तकों से पहले का है, कुछ विद्वान — जिनमें मालिकी संप्रदाय और इब्न अल-अथीर शामिल हैं — मानते हैं कि [[IBM|सुनन इब्न माजा]] के बदले अल-मुवत्ता को इस प्रामाणिक सूची में होना चाहिए; सामान्यतः कहा जाता है कि सुनन इब्न माजा ने यह स्थान इसलिए बरकरार रखा क्योंकि इसकी विषयवस्तु अन्य पाँच के साथ सबसे कम मेल खाती है, न कि इसलिए कि इसे अधिक विश्वसनीय माना जाता है।
hero.4=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-malik संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]], [[NAS|सुनन अल-नसाई]], [[IBM|सुनन इब्न माजा]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

