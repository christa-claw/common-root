title=मुवत्ता मालिक — इस संस्करण के बारे में | Common Root
description=मुवत्ता मालिक: इमाम मालिक इब्न अनस का मदीना से विधिशास्त्र और हदीस का संग्रह, जो सुन्नी इस्लाम की छह पुस्तकों से लगभग एक शताब्दी पहले का है और जिसे कभी-कभी उनके बीच सुनन इब्न माजा के स्थान पर रखने का सुझाव दिया जाता है।
heroHeading=मुवत्ता मालिक
