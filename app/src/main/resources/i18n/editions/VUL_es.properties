title=Vulgata latina — Acerca de esta edición | Common Root
description=La Vulgata latina: la traducción de Jerónimo, encargada en 382 y terminada hacia 405, que llevó la Biblia por Europa occidental durante mil años y fue el primer libro que imprimió Gutenberg.
heroHeading=Vulgata latina
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=A finales del siglo IV los evangelios latinos que circulaban en Occidente se contradecían entre sí, copia tras copia, y el papa Dámaso I pidió a su secretario Jerónimo que los pusiera en orden. Jerónimo empezó por una revisión. Acabó dedicándole más de veinte años, la mayoría en Belén, y produciendo algo que nadie había pedido.
hero.2=La decisión que lo cambió todo fue traducir el Antiguo Testamento del hebreo y no de la Septuaginta griega que la Iglesia había usado siempre. Jerónimo llamó al principio “hebraica veritas” — la verdad hebrea — y fue polémico: Agustín le escribió preocupado por que las congregaciones se amotinaran cuando las lecturas familiares cambiaran bajo sus pies. Jerónimo lo hizo de todos modos. El resultado explica por qué una Biblia latina, precisamente, está más cerca del hebreo que la Biblia griega que leían los primeros cristianos.
hero.3=Fue la Biblia de Europa occidental durante un milenio, un recorrido más largo que el de cualquier traducción anterior o posterior. De ella tradujo Wyclif al inglés, y de ella trabajaron también los traductores de la Douay-Rheims — de modo que la Douay-Rheims de este corpus es su descendiente directa, y los peldaños de esa edición apuntan aquí. Fue además el primer libro extenso impreso con tipos móviles: la Biblia que Gutenberg compuso en Maguncia hacia 1455 era este texto.

