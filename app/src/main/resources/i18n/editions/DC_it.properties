title=Dottrina e Alleanze — Su questa edizione | Common Root
description=Dottrina e Alleanze: rivelazioni e altre dichiarazioni messe per scritto da Joseph Smith, pubblicate per la prima volta nel 1835 a Kirtland, in Ohio, e lette dai santi degli ultimi giorni come scrittura accanto alla Bibbia.
heroHeading=Dottrina e Alleanze
readerHref=/reader?c1.src=dc

hero.1=Dottrina e Alleanze raccoglie rivelazioni, visioni e altre dichiarazioni che Joseph Smith jr. disse di aver ricevuto come comunicazioni dirette da Dio, messe per scritto per lo più durante i primi anni della Chiesa, in Ohio, Missouri e New York. Una raccolta precedente, intitolata «Libro dei comandamenti per il governo della Chiesa di Cristo», era in corso di stampa presso la tipografia della Chiesa a Independence, nel Missouri, quando una folla distrusse la tipografia nel luglio 1833 e disperse i fogli incompiuti prima che il libro potesse essere terminato; non fu mai pubblicato ufficialmente, sebbene sia sopravvissuto un piccolo numero dei fogli sciolti recuperati allora.
hero.2=Seguì nel 1835 una versione ampliata e rititolata, «Dottrina e Alleanze della Chiesa dei santi degli ultimi giorni», pubblicata a Kirtland, in Ohio, e compilata e approvata da un comitato di quattro persone: Joseph Smith, Oliver Cowdery, Sidney Rigdon e Frederick G. Williams. Quella prima edizione riuniva sotto un'unica copertina due tipi di materiale: una serie di lezioni teologiche tenute alla Scuola di Kirtland, presentate come la sua «Dottrina», insieme alle rivelazioni stesse messe per scritto, presentate come le sue «Alleanze». Quelle lezioni, note in seguito come Lectures on Faith, furono poi eliminate dal libro — un cambiamento generalmente datato all'edizione del 1921 — lasciando le rivelazioni come l'intera opera.
hero.3=Il libro è organizzato in sezioni numerate, non nei libri, capitoli e versetti di una Bibbia, il che rispecchia ciò che è: un insieme di testi separati e non un unico racconto continuo. Sia il contenuto che la numerazione cambiarono nel corso delle edizioni del XIX secolo, tra cui un'edizione del 1876, a cura di Orson Pratt, che riorganizzò materiale precedente e aggiunse nuove rivelazioni. L'edizione moderna raggiunse la sua forma attuale nel 1981, quando altri due elementi — una visione dei gradi di gloria e una visione della redenzione dei morti — furono aggiunti come sezioni 137 e 138, insieme a due «dichiarazioni ufficiali»: un manifesto del 1890 che pose fine all'approvazione da parte della Chiesa di nuovi matrimoni plurimi, e una dichiarazione del 1978 che estese l'ordinazione al sacerdozio a tutti i membri maschi degni, senza distinzione di razza. Una stampa del 2013 aggiornò ulteriore materiale di consultazione. L'edizione standard oggi in uso comprende 138 sezioni e le due dichiarazioni ufficiali.
hero.4=È una delle quattro opere che il movimento dei santi degli ultimi giorni chiama le proprie opere canoniche, insieme alla Bibbia, al [[BOM|Libro di Mormon]] e alla [[PGP|Perla di Gran Prezzo]]. La Community of Christ, una denominazione distinta discesa dallo stesso movimento, mantiene una propria Dottrina e Alleanze, numerata e aggiornata indipendentemente da questa. Il testo di questo corpus proviene dall'esportazione JSON del Mormon Documentation Project, la stessa fonte di pubblico dominio usata per il [[BOM|Libro di Mormon]] e la [[PGP|Perla di Gran Prezzo]], e qui è presentato come un unico libro, «Dottrina e Alleanze», in cui ogni sezione fa da capitolo; segue la formulazione dell'edizione standard attuale e omette le note a piè di pagina e le intestazioni dei capitoli protette da copyright, motivo per cui qui non è indicato un anno di pubblicazione unico.

fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Realizzata da
fact.2.value=Rivelazioni e altre dichiarazioni che Joseph Smith jr. (1805–1844) disse di aver ricevuto come comunicazioni dirette da Dio; un piccolo numero di elementi successivi, in particolare le due dichiarazioni ufficiali, proviene dai suoi successori come presidenti della Chiesa
fact.3.label=Pubblicata
fact.3.value=1835, Kirtland, Ohio, ad ampliamento del Libro dei comandamenti del 1833, rimasto incompiuto; compilata e approvata da un comitato formato da Joseph Smith, Oliver Cowdery, Sidney Rigdon e Frederick G. Williams
fact.4.label=Struttura
fact.4.value=138 sezioni numerate più due dichiarazioni ufficiali, invece di libri, capitoli e versetti; nel nostro corpus ogni sezione fa da capitolo all'interno di un unico libro, «Dottrina e Alleanze»
fact.5.label=Posizione
fact.5.value=Una delle quattro opere canoniche del movimento dei santi degli ultimi giorni, insieme alla Bibbia, al [[BOM|Libro di Mormon]] e alla [[PGP|Perla di Gran Prezzo]]
fact.6.label=In questo corpus
fact.6.value=Il testo segue la formulazione standard attuale, tratta dall'esportazione JSON di pubblico dominio del Mormon Documentation Project — la stessa fonte del [[BOM|Libro di Mormon]] e della [[PGP|Perla di Gran Prezzo]]; le sue note a piè di pagina e intestazioni dei capitoli, protette da copyright, sono omesse — ragione per cui qui non si indica un anno di stampa unico
fact.7.label=Licenza
fact.7.value=Di pubblico dominio, secondo quanto dichiarato dal responsabile dei dati; l'apparato di studio moderno protetto da copyright non è incluso
