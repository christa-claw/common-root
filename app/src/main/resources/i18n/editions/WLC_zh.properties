title=列宁格勒抄本 — 关于本版本 | Common Root
description=列宁格勒抄本：现存最古老的完整希伯来圣经抄本，抄成于公元1008年，至今仍是大多数现代旧约译本所依据的底本。
heroHeading=列宁格勒抄本
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=这是现存最古老的完整希伯来圣经抄本。抄写者名叫撒母耳·本·雅各，在旧开罗工作；他在抄本末尾的题记中，把自己完成这项工作的时间定在公元1008年。
hero.2=撒母耳·本·雅各并非在创制经文，而是在保存经文。他承袭本·亚设家族的传统——他们是马所拉方面最权威的学者。所谓马所拉，是一套精密的元音符号、诵读符号与旁注体系，犹太学者花了数百年不断打磨，为的是固定希伯来圣经的读法，防止经文在传抄中走样。本·亚设传统中确有一部更古老、也可以说更权威的抄本留存至今，即阿勒颇抄本，但其中妥拉部分的大半在1947年散失。列宁格勒抄本之所以珍贵，正因为它是完整的，而且古老到足以立于这一传统的源头。
hero.3=它的名字来自后来收藏它的城市：抄本进入西方学界时，圣彼得堡名为列宁格勒；即便1991年该城恢复原名，这个名字仍留在抄本上。今天它是《斯图加特希伯来文圣经》（Biblia Hebraica Stuttgartensia）的底本，而后者是希伯来圣经的标准学术版本——这意味着几乎每一种语言里几乎每一部现代旧约译本，追溯上去都通向这位十一世纪开罗抄写员一笔一画的谨慎工作，无论读者是否知道他的名字。

