title=Douay-Rheims 1899 — Acerca de esta edición | Common Root
description=La Biblia de Douay-Rheims: la traducción católica inglesa hecha de la Vulgata latina en Reims en 1582 y en Douai en 1609–10, revisada por el obispo Challoner, en la impresión de Baltimore de 1899.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=En 1568 un grupo de católicos ingleses, muchos de ellos hombres de Oxford que ya no podían conservar sus cátedras, fundó un colegio en Douai, en Flandes, bajo William Allen. Parte de su razón de ser era poner una Biblia inglesa en manos católicas, porque las únicas Biblias inglesas entonces en circulación eran protestantes y se usaban en la controversia. Gregory Martin empezó a traducir en octubre de 1578 a un ritmo de unos dos capítulos diarios, y el Nuevo Testamento se publicó en 1582 en Reims, adonde el colegio se había trasladado temporalmente. Martin murió el 28 de octubre de aquel año, semanas después de aparecer su Nuevo Testamento. El Antiguo Testamento estaba listo al mismo tiempo y quedó luego sin imprimir, por la simple razón de que el colegio no podía costear la impresión; salió al fin en dos volúmenes en 1609 y 1610, cuando faltaban dos años para la Versión del Rey Jacobo.
hero.2=Lo que la separa de cualquier otra Biblia inglesa de este corpus es aquello de lo que se hizo. No del hebreo y del griego: de la Vulgata latina. El Concilio de Trento había declarado la Vulgata texto auténtico de la Iglesia, y los traductores de Douai añadían que Jerónimo había trabajado sobre manuscritos más antiguos que cualquier copia griega a su alcance — lo cual, para el Antiguo Testamento, no era algo descabellado de pensar hacia 1600. La prosa resultante es densamente latinizada, a veces hasta el punto de no ser inglés en absoluto: el padrenuestro pide “supersubstantial bread”, porque los traductores no querían naturalizar una palabra sobre la que descansaba la teología. Fue criterio, no incapacidad.
hero.3=A mediados del siglo XVIII casi nadie podía leerla, y el obispo Richard Challoner la revisó entre 1749 y 1752 — a fondo, y en buena medida en dirección a la Versión del Rey Jacobo, que para entonces era sencillamente a lo que sonaba la escritura sagrada en inglés. Toda Biblia que hoy se vende como Douay-Rheims es el texto de Challoner y no el de Martin. Esta es la impresión americana de 1899, de la John Murphy Company de Baltimore, con el imprimátur del cardenal James Gibbons; como esa impresión hace mucho que está libre de derechos, es la que se ha escaneado, tecleado y reproducido desde entonces, y es lo que casi toda Douay-Rheims digital realmente es.
hero.4=En este lector hace algo que casi ninguna otra edición de aquí puede hacer. Su antecedente registrado está presente en el corpus: abra un peldaño de linaje bajo un versículo de la Douay-Rheims y el peldaño de abajo es la Vulgata latina misma, el texto del que de hecho se tradujo, en lugar del suelo de lenguas originales marcado con ≈ al que caen la mayoría de las ediciones. Ese es precisamente el caso para el que se construyó el mecanismo de peldaños. La influencia corrió también en sentido contrario — el Nuevo Testamento de Reims estaba sobre las mesas de los traductores del Rey Jacobo, y buena parte de su vocabulario latinizado pasó a su obra — pero la lista de linaje solo guarda líneas formales de revisión, de modo que esa deuda no queda registrada allí. Conviene notar una inversión: su etiqueta de peldaño muestra el año 1899 mientras la ficha del catálogo no muestra año alguno. Los años de peldaño son una lista curada a mano y la ficha lee los propios metadatos del catálogo, y allí donde una edición está en una y no en la otra, ambas discrepan en público.
hero.5=Una advertencia sobre el canon. El texto que aquí se guarda tiene 72 libros, no los 73 de una Biblia católica impresa. Los seis libros deuterocanónicos que sí lleva — Tobías, Judit, 1 y 2 Macabeos, Sabiduría y Eclesiástico — van después del Apocalipsis en vez de en sus posiciones católicas, y Baruc falta por completo. Es una propiedad del texto digital tal como se incorporó, no del libro de 1899, y significa que esta columna se leerá correctamente versículo a versículo pero no debe usarse para comprobar qué contiene el canon católico.

