fact.1.label=Lengua
fact.1.value=inglés — la tradición católica
fact.2.label=Traducida de
fact.2.value=la Vulgata latina, no del hebreo y el griego — la misma [[VUL|Vulgata]] que guarda este corpus
fact.3.label=Nuevo Testamento
fact.3.value=Reims, 1582 — principalmente obra de Gregory Martin, con William Allen, Richard Bristow y Thomas Worthington
fact.4.label=Antiguo Testamento
fact.4.value=Douai, 1609 y 1610, en dos volúmenes — terminado a la vez que el Nuevo Testamento pero retenido casi treinta años por falta de dinero para imprimirlo
fact.5.label=Revisada por
fact.5.value=el obispo Richard Challoner, 1749–1752 — todo libro que hoy se vende como Douay-Rheims es la revisión de Challoner, no el texto de 1582/1610
fact.6.label=Esta impresión
fact.6.value=la edición americana de 1899 de la John Murphy Company, Baltimore, con el imprimátur del cardenal James Gibbons — hace mucho libre de derechos, y la versión que circula digitalmente
fact.7.label=Contenido aquí
fact.7.value=72 libros: los 66 del canon protestante en orden protestante, con Tobías, Judit, 1 y 2 Macabeos, Sabiduría y Eclesiástico añadidos tras el Apocalipsis. Baruc no está, de modo que esta columna no es una comprobación fiable del canon católico
fact.8.label=Linaje
fact.8.value=una de las pocas ediciones de aquí cuyo antecedente registrado está él mismo en el corpus — un peldaño bajo un versículo de la Douay-Rheims abre en [[VUL|la Vulgata latina]] y no en el suelo de lenguas originales
fact.9.label=En este corpus
fact.9.value=su etiqueta de peldaño lleva el año 1899 aunque la ficha del catálogo deja el año en blanco; los años de peldaño son una lista curada aparte, y se permite que ambas discrepen
