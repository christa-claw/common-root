fact.11.label=Лицензия
fact.11.value=общественное достояние
fact.12.label=В этом собрании
fact.12.value=Вершина немецкой лестницы: один записанный предшественник, [[LUT1545|Luther Bibel 1545]], а под ним пол языков подлинника. Её 85 примечаний правщиков несутся здесь как комментарии, а не отброшены, и они привязаны к изданию — глосса 1912 года показывается под столбцом 1912 года и нигде более. Не на ней открывается немецкая оболочка; на ней открывается [[ELB|Эльберфельдская]], первая в каталоге по своему сокращению и ни по какой иной причине
