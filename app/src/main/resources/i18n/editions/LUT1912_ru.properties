fact.7.value=Правописание выровнено по Дудену, самые очевидно устаревшие слова заменены; буква в остальном оставлена такой, какой была у Лютера
fact.8.label=Новый Завет с
fact.8.value=[[TR|Textus Receptus]] — последняя лютеровская редакция, на нём стоящая, ибо всякая позднейшая перешла к критическому греческому тексту
fact.9.label=Ветхий Завет с
