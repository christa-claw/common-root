title=Luther Bibel 1912 — Об этом издании | Common Root
description=Вторая церковная редакция Лютеровой Библии: намеренно осторожный пересмотр, законченный в 1910 году, принятый в 1912-м, и последний лютеровский текст, стоящий на Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Правка правки. Немецкие церкви сошлись на едином тексте Лютеровой Библии в 1892 году, в первой церковной редакции, и уже через несколько лет её называли недостаточной. Упрёки были прежние: слишком много архаизмов и правописание, которое больше никому не принадлежало. Решило дело второе. Дуден дал Германской империи обязательную орфографию, которой учили в школах, и Лютерова Библия, от неё отступавшая, плохо годилась для того, чтобы положить её перед классом. В 1906 году Немецкая евангелическая церковная конференция согласилась на новый пересмотр и прямо предписала вести его бережно и сохраняюще. Комиссия богословов прошла все книги к 1910 году, и в 1912-м конференция приняла итог.
hero.2=Работа заняла едва больше двух лет, и это говорит, какого рода был пересмотр. Никто не пытался сделать новую Лютерову Библию — ни филологически, ни как-либо иначе. Позднейший правщик Фриц Чирх отмахнулся от неё как от школьнической правки, и о способе слово сказано не ложно: правописание выровнено, самые очевидно отмершие слова заменены, буква в остальном оставлена там, где её положил Лютер. Чего слово не видит — насколько хорошо она устояла. Сквозь десятилетия частичных правок, что последовали, текст 1912 года остался на месте, и его читают и продают доныне. Отчасти тому причиной Jubiläumsbibel 1912 года, юбилейное издание Вюртембергского библейского института с пояснительными примечаниями, переиздававшееся фрактурой далеко вглубь нынешнего века. Отчасти — истёкшее авторское право: воспроизвести текст ничего не стоит, и оттого он попадается повсюду — в том числе здесь.
hero.3=Одно прежде прочего держит её в ходу у консервативных читателей: это последняя лютеровская редакция, построенная на Textus Receptus, греческом Новом Завете XVI и XVII веков. Всё, что после, перешло к критическому тексту. Оттого это издание — необычайно чистая ступень, на которую можно встать в лестнице, ведь греческий под ним тот же греческий, что лежит под собственным изданием Лютера 1545 года, под Женевской и под King James: вся башня делит один пол, вместо того чтобы менять его на полпути.
hero.4=В ступенях родословия это издание стоит прямо над Luther Bibel 1545 и имеет ровно одного записанного предшественника — именно её. Откройте ступень под стихом 1912 года, и под ним явится собственная буква Лютера 1545 года; откройте ещё одну, и лестница достигнет Textus Receptus для греческого и Ленинградского кодекса для еврейского. Триста шестьдесят семь лет правки, стих за стихом, в два щелчка. Чем это издание не является, так это Библией, на которой открывается немецкая оболочка: для немецкого не выбрано издание по умолчанию, и читатель получает первую немецкую Библию каталога, а это Эльберфельдская.

