title=Webster's Bible — Acerca de esta edición | Common Root
description=La revisión de la King James Version hecha por Noah Webster en 1833 y publicada en New Haven, Connecticut: la Biblia inglesa común conservada casi palabra por palabra, con las palabras caídas en desuso sustituidas, la gramática corregida y unas pocas expresiones suavizadas para la lectura en voz alta.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), el lexicógrafo de New Haven, es recordado sobre todo por An American Dictionary of the English Language, de 1828. Cinco años después volcó el mismo afán por un inglés claro, correcto y actual sobre la Biblia que su país leía de hecho. En 1833 Durrie and Peck, de New Haven, publicaron The Holy Bible … in the Common Version, with Amendments of the Language, con un prefacio firmado en septiembre de ese año. No es una traducción nueva. Webster tomó la King James Version de 1611, «la versión común», tal como se imprimía entonces, y la cambió solo donde su inglés se había vuelto oscuro o incorrecto. Escribió que había consultado las lenguas originales al hacer sus enmiendas, pero que el estilo general de la versión no debía alterarse, y que no había cambiado a sabiendas ningún pasaje sobre el que una denominación fundara su doctrina.
hero.2=Su prefacio nombra tres clases de cambios. Las palabras completamente en desuso dieron paso a palabras de buen uso: el amo de José «knoweth not» lo que hay en la casa (Génesis 39:8) donde la King James dice «wotteth not», y en Hechos 12:4 Herodes piensa sacar a Pedro «after the passover», no «after Easter». La gramática se ajustó al uso de la época de Webster: «who» en lugar de «which» cuando se refiere a personas, de modo que el padrenuestro empieza «Our Father who art in heaven», e «its» en lugar de «his» cuando se refiere a cosas, de modo que las plantas de Génesis 1 dan semilla «after its kind». Además, un pequeño número de palabras que juzgó impropias para leerse en voz alta ante un auditorio mixto fueron sustituidas por otras más suaves. También escribió «Holy Spirit» donde la King James dice «Holy Ghost», y nuestra copia no tiene ni un solo «Holy Ghost». Fuera de esto, la revisión es ligera: la mayoría de los lectores podría leer capítulo tras capítulo sin notar que ha dejado el texto de la King James.
hero.3=Nuestra copia está completa: 66 libros, de Génesis a Apocalipsis, sin los apócrifos, en la numeración inglesa de capítulos y versículos: 150 salmos, con el título de cada salmo incorporado a su primer versículo, y Malaquías que termina en el capítulo 4. Como la King James, conserva los pasajes del texto recibido que las ediciones críticas posteriores ponen en duda: el final largo de Marcos, Hechos 8:37 y los tres testigos en el cielo de 1 Juan 5:7. En este lector se sostiene por sí misma. Aunque es una revisión de la King James Version, que también está en este corpus, el corpus no le registra ningún antecesor, de modo que un peldaño del linaje abierto bajo uno de sus versículos cae directamente al suelo de lenguas originales marcado con ≈ —el Códice de Leningrado en el Antiguo Testamento y el Textus Receptus en el Nuevo— y no al texto inglés sobre el que Webster trabajó realmente. Tampoco hay nada registrado que se apoye en ella. Ningún idioma de la interfaz se abre en esta edición; una interfaz en inglés se abre en la New International Version, y a esta se llega desde su propia tarjeta en la cuadrícula de traducciones. Puesta junto a la King James en una segunda columna, muestra las enmiendas de Webster versículo a versículo.

