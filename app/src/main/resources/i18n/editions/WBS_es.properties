fact.1.label=Lengua
fact.1.value=Inglés
fact.2.label=Revisor
fact.2.value=Noah Webster (1758–1843), lexicógrafo estadounidense, autor de An American Dictionary of the English Language (1828)
fact.3.label=Revisada a partir de
fact.3.value=[[KJV|La King James Version]] de 1611, «la versión común», tal como se imprimía entonces: revisada en inglés, no traducida de nuevo, aunque Webster consultó el hebreo y el griego para sus enmiendas
fact.4.label=Tipo de revisión
fact.4.value=Ligera y conservadora: palabras en desuso sustituidas por otras actuales; gramática corregida, «who» para personas e «its» para cosas; unas pocas palabras tenidas por impropias para la lectura en voz alta, suavizadas; «Holy Spirit» en lugar de «Holy Ghost»; el estilo y los pasajes doctrinales, dejados intactos a propósito
fact.5.label=Publicada
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, como The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Licencia
fact.6.value=Dominio público; esta copia, de eBible.org
fact.7.label=En este corpus
fact.7.value=66 libros, el canon protestante completo, sin los apócrifos; numeración inglesa de capítulos y versículos, de modo que los salmos son 150 y el título de cada uno va incorporado a su primer versículo
fact.8.label=Linaje
fact.8.value=Sin antecesor registrado y sin nada registrado que se apoye en ella: un peldaño se abre directamente en el suelo de lenguas originales, [[WLC|el Códice de Leningrado]] en el Antiguo Testamento y [[TR|el Textus Receptus]] en el Nuevo, aunque el texto que Webster revisó es [[KJV|la King James Version]]
