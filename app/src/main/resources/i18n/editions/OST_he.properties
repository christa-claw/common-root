title=מקרא אוסטרוואלד (צרפתית) — על מהדורה זו | Common Root
description=מקרא אוסטרוואלד: עריכה מחודשת, בידי כומר מנשאטל, של המקרא הפרוטסטנטי הצרפתי של ז׳נבה, שיצאה לאור לראשונה ב־1744, וכאן בנוסח מתוקן מאוחר יותר בכתיב צרפתי מודרני.
heroHeading=מקרא אוסטרוואלד
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=ז׳אן־פרדריק אוסטרוואלד נולד בנשאטל ב־1663 ומת בה ב־1747. הוא הוסמך לכמורה בעיר הולדתו ב־1683 ושירת את רוב חייו בכנסייתה, תחילה כדיאקון ומ־1699 ככומר, ולימד גם תאולוגיה. המקרא שלו אינו תרגום חדש מן העברית ומן היוונית אלא עריכה מחודשת של המקרא הפרוטסטנטי הצרפתי של ז׳נבה, התרגום שקהילות הכנסייה הרפורמית דוברות הצרפתית קראו בו מאז המאה השש־עשרה. הנוסח המתוקן של אוסטרוואלד יצא לאור לראשונה ב־1744, שלוש שנים לפני מותו, ונדפס ותוקן שוב ושוב במשך יותר ממאתיים שנה; הוא היה מוכר היטב גם בבריטניה.
hero.2=הנוסח שבאוסף זה אינו הצרפתית של 1744. במאה השמונה־עשרה כתבו „étoit” במקום שהצרפתית של ימינו כותבת „était”; בעותק זה כתוב „était” בכל מקום ו„étoit” אף לא פעם אחת, ולכן הוא בא מאחד הנוסחים המתוקנים המאוחרים ששמרו על שמו של אוסטרוואלד. הידוע שבהם הוא הנוסח שהוציאה לאור Société biblique de France ב־1881, שהברית החדשה שבו היא מעשה ידיו של Ch. L. Frossard, ונוסח זה עודכן עוד ב־1996. eBible.org, מקור העותק, מציין רק „Ostervald” ולא את הנוסח המתוקן, ולכן גם דף זה אינו נוקב באחד. כמה תכונות ניכרות כמעט בכל עמוד. השם המפורש הוא „l'Éternel”, הנצחי, כמו אצל סגון ובדארבי הצרפתי: „L'Éternel est mon berger; je n'aurai point de disette” בתהלים 23. ישעיהו 7:14 שומר על „la vierge sera enceinte” — הבתולה — במקום שאצל סגון העלמה. והברית החדשה שומרת על גרסאות של הנוסח המקובל שהמהדורות הביקורתיות משמיטות: באיגרת יוחנן הראשונה 5:7 מופיעים שלושת העדים שבשמים, „le Père, la Parole, et le Saint-Esprit”, החסרים אצל סגון שלצדו.
hero.3=בקורא הזה הוא אחד משלושה ספרי מקרא צרפתיים, לצד סגון והדארבי הצרפתי. ממשק בצרפתית אינו נפתח עליו: לצרפתית אין בחירה מוקפדת, ולכן הקורא לוקח את ספר המקרא הצרפתי הראשון בסדר הקטלוג, והוא דארבי. בשלבי השושלת לא רשום לו שום מקור — מקרא ז׳נבה שהוא מתקן אינו באוסף זה — ולכן שלב הנפתח מתחת לפסוק יורד היישר אל רצפת שפות המקור המסומנת ב־≈: לתנ״ך כתב יד לנינגרד, ולברית החדשה הנוסח המקובל, המסורת היוונית שהמקרא הזה אכן הולך אחריה. תווית השלב שלו נושאת את השנה 1744, שנת התיקון של אוסטרוואלד עצמו ולא שנת הנוסח המוצג. פתחו אותו לצד סגון כדי לראות זו לצד זו מאתיים שנה של לשון המקרא הפרוטסטנטית הצרפתית.

