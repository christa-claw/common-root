title=克莱孟本武加大译本 — 关于此版本 | Common Root
description=克莱孟本武加大译本：教廷对哲罗姆拉丁文圣经的修订本，1592年在罗马印行，1593年和1598年经校正再版——直到1979年都是天主教会的标准拉丁文本；在本阅读器中，它是武加大译本之上的一级。
heroHeading=克莱孟本武加大译本
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=1546年，特利腾大公会议宣布武加大译本为教会真正的拉丁文圣经，却留下一个它没有回答的问题：哪一部武加大译本？11个世纪的手工抄写，已经使任何2份抄本都不尽相同，于是大公会议要求一部校正过的文本。教宗西斯笃五世在1590年提供了一部，其中很大一部分由他亲自修订，并以一道诏书宣布其为真本。他在同年8月去世，几周之内，枢机们便停止了它的发售。在克莱孟八世治下，一个委员会——编者中有弗朗西斯科·德·托莱多，工作的核心人物是罗伯托·白敏——编成了它的替代本，1592年在罗马印行。1593年和1598年开本较小的重印本去除了其中大部分印刷错误，并加入了哲罗姆的序言和页边参照。
hero.2=这一文本在将近4个世纪里都是天主教会的标准拉丁文圣经，直到1979年的新武加大译本为止；1962年的弥撒经书和日课经至今仍在使用它。它是教会所接受的哲罗姆圣经，而非哲罗姆本人留下的样子。其中的诗篇是他的高卢诗篇集，依希腊文修订，而不是他后来从希伯来文所作的翻译，因此保留了希腊文的编号：这里的诗篇第22篇以“Dominus regit me”开头，即牧者之诗。约翰一书5:7载有约翰短句，“Pater, Verbum, et Spiritus Sanctus”，这是早期希腊文抄本所没有的拉丁文增补。以斯帖记和但以理书采用较长的形式，希腊文增补部分集中在以斯帖记末尾，并成为但以理书的最后2章。本副本所取自的 eBible.org 文件，印出了1598年的文本，并以《标准注疏》（Glossa Ordinaria）为注释——这是出自拉昂的安瑟伦学派的12世纪注释，采用米涅1880年的版本。这些注释没有进入语料库；部分经节中的方括号是来源本身就有的。
hero.3=在本阅读器中，它是一级只有一个记录在案的母本的文本，即拉丁文武加大译本：在它任何一节下展开一级，武加大译本便会出现。可以预期两者几乎逐字相同。本语料库中的武加大译本本身也取自一部克莱孟本文本，因此区分两者的主要是标点——以及这份副本缺少的书卷。它有66卷，即新教正典的各卷，以斯帖记和但以理书为较长的形式。源文件中还有多俾亚传、友弟德传、智慧篇、德训篇、巴路克书和马加伯上下2卷，其下的武加大译本全都有；但它们一卷也未能导入，所以凡武加大译本有多俾亚传之处，其上都空无一物。克莱孟本印在附录中的玛拿西祷言和以斯拉记第3、第4卷，既不在来源中，也不在语料库中。语料库中没有任何文本反过来立于这一版本之上。

