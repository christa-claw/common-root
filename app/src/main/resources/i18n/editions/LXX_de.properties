title=Brentons griechische Septuaginta — Über diese Ausgabe | Common Root
description=Die Septuaginta – das griechische Alte Testament der jüdischen Diaspora und der frühen Kirche – in dem griechischen Text, den Lancelot Brenton 1851 neben seinem Englisch druckte, und in diesem Reader die Sprosse unter der Vulgata und der russischen Synodalübersetzung.
heroHeading=Brentons griechische Septuaginta
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=Die Septuaginta ist die älteste Übersetzung der hebräischen Bibel, und in den ersten christlichen Jahrhunderten war sie schlicht die Bibel. Griechischsprachige Juden in Alexandria begannen mit den fünf Büchern der Tora, wahrscheinlich im 3. Jahrhundert v. Chr., und die übrigen Bücher folgten in den nächsten zwei Jahrhunderten. Der Name stammt aus einer Erzählung: Der Aristeasbrief berichtet von zweiundsiebzig Ältesten, die aus Jerusalem gesandt wurden, um das Gesetz für König Ptolemaios II. zu übersetzen, und „die Siebzig“ – LXX in römischen Ziffern – wurde zum Namen des ganzen griechischen Alten Testaments. Die Verfasser des Neuen Testaments zitieren sie ständig, die frühe Kirche las sie, und die orthodoxen Kirchen lesen sie bis heute als ihr Altes Testament.
hero.2=Ihre Bedeutung geht über ihr Alter hinaus. Die Übersetzer arbeiteten nach hebräischen Handschriften, die stellenweise von dem später maßgeblich gewordenen masoretischen Text abwichen – Jeremia etwa ist im Griechischen deutlich kürzer –, sodass die Septuaginta an vielen Stellen das älteste Zeugnis für eine hebräische Lesart ist, die die hebräische Überlieferung selbst nicht bewahrt hat. Sie enthält außerdem Bücher, die der hebräische Kanon nicht kennt, darunter Tobit, Judit, die Weisheit, Jesus Sirach und Baruch. Und manche ihrer Wortentscheidungen wurden zur Lehre: In Jesaja 7,14, wo das Hebräische ʿalmah hat, eine junge Frau, hat das Griechische parthenos, eine Jungfrau – das Wort, das Matthäus zitiert.
hero.3=Der griechische Text hier ist der, den Sir Lancelot Brenton druckte. Er veröffentlichte 1844 eine englische Übersetzung der Septuaginta, hauptsächlich nach dem Codex Vaticanus, der Handschrift des 4. Jahrhunderts in der Vatikanischen Bibliothek; 1851 gab Samuel Bagster in London sie erneut heraus, um die apokryphen Bücher ergänzt und mit dem Griechischen neben dem Englischen, und dieses Griechisch ist es, das dieses Korpus enthält. Seine Psalmen behalten die griechische Zählung, die die Vulgata hier teilt: In beiden ist Psalm 22 der Hirtenpsalm, Psalm 23 im Hebräischen und in den meisten englischen Bibeln. Es gibt 151 Psalmen; Esra und Nehemia stehen als ein einziges Buch; Ester und Daniel liegen in ihren längeren griechischen Fassungen vor.
hero.4=In diesem Reader ist sie eine Sprosse, nicht der Boden. Sie steht unter der lateinischen Vulgata, weil ein Teil der Vulgata über das Griechische kam: Ihr Psalter ist der, den Hieronymus aus dem Griechischen der Hexapla des Origenes schuf und den seine eigene Übersetzung aus dem Hebräischen nie verdrängte, und Weisheit, Jesus Sirach und Baruch blieben in altlateinischen Übersetzungen aus dem Griechischen stehen. Sie steht unter der russischen Synodalübersetzung, deren Altes Testament viele Lesarten der Septuaginta aus der kirchenslawischen Bibel dahinter bewahrte, und unter Brentons eigener englischer Übersetzung. Eine eigene verzeichnete Vorlage hat sie nicht: Der hebräische Text, aus dem sie übersetzt wurde, ist nicht im Korpus, und der Codex Leningradensis, mehr als tausend Jahre jünger und aus der masoretischen Linie, erscheint unter ihr nur als Boden der Ursprachen. Sie umfasst nur das Alte Testament, unter einem Vers des Neuen Testaments wird die Sprosse also übersprungen – und nicht jedes Buch der griechischen Überlieferung ist hier: Dieses Exemplar hat 45 Bücher und kein Makkabäerbuch.

