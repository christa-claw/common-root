fact.9.value=Lizenziert unter Bedingungen der Weitergabe unter gleichen Bedingungen statt der Gemeinfreiheit übergeben, damit neben [[NIV|der New International Version]] und [[NASB|der New American Standard Bible]] stehend als lizenziert statt frei kopierbar — allerdings zu deutlich großzügigeren Bedingungen als beide. In den Abstammungssprossen ist keine Vorlage verzeichnet: Sie wird als Überarbeitung von Robert Youngs Literal Translation vorgestellt, die selbst nicht in diesem Korpus gehalten wird, sodass eine Sprosse unter einem LSV-Vers geradewegs zum Boden der Originalsprache hinunterführt, markiert mit ≈. Die englische Oberfläche öffnet standardmäßig mit der New International Version; diese Ausgabe wird über ihre eigene Karte erreicht.
