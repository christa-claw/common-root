fact.6.value=Formale Äquivalenz, vorgestellt als grundlegende Überarbeitung von Robert Youngs Literal Translation von 1898 — drei erklärte Grundsätze: das Verbtempus des Originals so weit wie möglich bewahren, ein gegebenes Wort, soweit Konsistenz es erlaubt, stets mit demselben englischen Wort wiedergeben, und die ursprüngliche Wortfolge beibehalten, außer wo die Lesbarkeit im Englischen etwas anderes erfordert; der Gottesname des Alten Testaments wird transliteriert statt mit einem Titel wie "HERR" wiedergegeben
