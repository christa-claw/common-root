title=Literal Standard Version — Über diese Ausgabe | Common Root
description=Die Literal Standard Version: Covenant Press' Überarbeitung von 2020 der Literal Translation von Robert Young aus dem 19. Jahrhundert, mit dem Ziel der durchgängig wortgetreuesten englischen Wiedergabe des Hebräischen, Aramäischen und Griechischen, die lesbares Englisch erlaubt.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Die Literal Standard Version bezeichnet sich selbst als grundlegende Überarbeitung von Robert Youngs Literal Translation, der äußerst wörtlichen englischen Bibel aus dem 19. Jahrhundert, die 1862 erstmals erschien und von Young selbst 1887 und 1898 überarbeitet wurde. Covenant Press, der Verlagszweig der Covenant Christian Coalition, begann die neue Überarbeitung Anfang 2018 mit dem erklärten Ziel, Youngs Verpflichtung zur wortgetreuen Wörtlichkeit zu bewahren, dabei aber das Englisch zu modernisieren und Stellen zu korrigieren, an denen neuere Handschriften- und lexikalische Forschung weitergekommen war. Die Arbeit wurde abgeschlossen und am 2. Februar 2020 veröffentlicht; das US-Copyright wurde im Januar jenes Jahres eingetragen, E-Book-Ausgaben folgten im Mai desselben Jahres. Die einzelnen Übersetzer werden in der veröffentlichten Ausgabe nicht genannt; als Trägerorganisationen werden Covenant Press und die Covenant Christian Coalition angegeben.
hero.2=Für das Alte Testament folgt die LSV dem Masoretischen Text, mit erheblichem Einfluss der Septuaginta und gelegentlichem Rückgriff auf die Schriftrollen vom Toten Meer, wo deren Lesarten klar genug schienen, um ihnen den Vorzug zu geben. Für das Neue Testament folgt sie dem Textus Receptus und dem Mehrheitstext, wobei alexandrinische Lesarten nur in bestimmten, ausdrücklich genannten Fällen übernommen werden, nicht als allgemeine Regel. Die Übersetzer stellten drei Leitprinzipien auf: das Verbtempus des Originals so weit wie möglich zu bewahren, ein gegebenes Originalwort, soweit Konsistenz möglich ist, mit demselben englischen Wort wiederzugeben, und die ursprüngliche Wortfolge zu bewahren, außer wo die Lesbarkeit im Englischen eine Änderung wirklich erfordert. Der Gottesname des Alten Testaments wird transliteriert statt mit einem Titel wie "HERR" wiedergegeben, ganz im Sinne der allgemeinen Vorliebe dieser Übersetzung, dem Leser die eigenen Entscheidungen des Originaltexts zu zeigen, statt sie zu glätten.
hero.3=Die Verbindung zu diesem Korpus ist eher textlich als genealogisch: Das Neue Testament der Literal Standard Version stützt sich auf den Textus Receptus und den Mehrheitstext, dieselbe griechische Grundlage, die dieses Korpus getrennt und vollständig als Textus Receptus bewahrt — den Text, der der King James Version und der Tradition der Reformationszeit allgemein zugrunde liegt. Keine Abstammungssprosse verbindet die beiden Ausgaben, da die LSV als Überarbeitung von Youngs Literal Translation vorgestellt wird und nicht des Textus Receptus selbst oder irgendeines hier gehaltenen Textes; eine Sprosse unter einem LSV-Vers führt daher direkt zum Boden der Originalsprache, markiert mit ≈. Sie erscheint unter einer Creative-Commons-Lizenz Namensnennung – Weitergabe unter gleichen Bedingungen 4.0, statt der Gemeinfreiheit übergeben zu sein, womit sie neben der New International Version und der New American Standard Bible als lizenziert statt frei kopierbar steht — allerdings zu deutlich großzügigeren Bedingungen als beide. Die englische Oberfläche öffnet standardmäßig mit der New International Version; diese Ausgabe wird über ihre eigene Karte erreicht.

