title=القرآن — بيكثال — عن هذه الطبعة | Common Root
description=ترجمة محمد مرمديوك بيكثال لعام 1930، أول ترجمة إنجليزية للقرآن يقوم بها مسلم لغته الأم الإنجليزية — أُنتجت وهو في خدمة نظام حيدر أباد وبمشورة علماء الأزهر، وهي في هذه المجموعة النص الإنجليزي الذي يُعرض افتراضيًا تحت النص العربي.
heroHeading=القرآن — بيكثال
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=كان محمد مرمديوك بيكثال (1875-1936) روائيًا إنجليزيًا أُعجب به في زمنه هـ. ج. ويلز ود. هـ. لورانس، قبل أن يصبح مترجمًا لنص مقدّس. أعلن اعتناقه الإسلام في نوفمبر 1917، بعد محاضرة بعنوان "الإسلام والتقدّم" أمام الجمعية الأدبية الإسلامية في نوتينغ هيل، ونطق الشهادة في ذلك الشهر نفسه في بعثة ووكينغ الإسلامية. وبعد عقد من الزمن كان مديرًا لمدرسة تشادارغات الثانوية في حيدر أباد، في خدمة النظام، ومن هناك أخذ في عام 1928 إجازة تفرّغ لمدة سنتين ليفعل ما أراد أن يفعله منذ اعتناقه الإسلام: أن يُترجم القرآن إلى الإنجليزية.
hero.2=لم يفعل ذلك وحيدًا ولا على عجل. في عام 1929 قضى ثلاثة أشهر في القاهرة، حيث فتح له دعم رشيد رضا أبوابًا، طالبًا بركة علماء الأزهر على مشروع حُذِّر بعضهم من أن المساعدة فيه قد تكلفهم مناصبهم — فقد رأى جزء من الأزهر أن ترجمة القرآن نفسها أمر خطير. ومع ذلك تابع بيكثال واستمر في مشاورتهم. وما نشره في عام 1930 بعنوان "The Meaning of the Glorious Koran: An Explanatory Translation" يحمل هذا الحذر في عنوانه نفسه: ليس "القرآن بالإنجليزية" بل شرحًا لمعناه، لأن أي ترجمة، في رأيه الذي صرّح به، لا يمكن أن تكون القرآن نفسه. أصدرت دار ألفرد أ. نوبف الطبعة الأولى في نيويورك؛ تلتها طبعة ثنائية اللغة من المطبعة الحكومية في حيدر أباد.
hero.3=وصفتها ملحق التايمز الأدبي بأنها "a great literary achievement"، وتوصف عادة بأنها أول ترجمة إنجليزية للقرآن يقوم بها مسلم لغته الأم الإنجليزية — فالترجمات الإنجليزية السابقة، مثل ترجمتَي سيل ورودويل، كانت عمل مستشرقين غير مسلمين. وبقيت ترجمة بيكثال مطبوعة ومستخدمة قرابة قرن منذ ذلك الحين، وهي من بين القليل من الترجمات الإنجليزية التي يقرؤها القراء العاديون فعلًا، لا الباحثون فقط.
hero.4=في هذه المجموعة هي الترجمة التي تُعرض افتراضيًا تحت النص العربي بالرسم العثماني — يبقى العربي أساس كل عمود، وتُعرض هذه الإنجليزية كشرح إلى جانبه، دون أن تحلّ محله أبدًا. واختيرت لهذا الدور لسبب غير لافت بقدر ما هو أدبي: فمسح للترجمات المتاحة لم يجد سوى ترجمتين إنجليزيتين لا شك في أنهما حرّتا التداول، هذه وترجمة يوسف علي لعام 1934، إضافة إلى ترجمة سابلوكوف الروسية لعام 1878 كلغة ثالثة. والنص هنا هو رقمنة للترجمة، مأخوذة عبر alquran.cloud لا من طبعة واحدة بعينها، فينبغي أن يُقرأ على أنه صياغة بيكثال لا نسخة طبق الأصل عن طبعة معينة.

