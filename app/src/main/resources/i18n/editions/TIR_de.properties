title=Jami` at-Tirmidhi — Über diese Ausgabe | Common Root
description=Jami` at-Tirmidhi: die Hadith-Sammlung, die Abu Isa at-Tirmidhi um die offene Bewertung der Stärke jeder Überlieferung und die Aufzeichnung der von Rechtsgelehrten daraus gezogenen juristischen Argumente aufbaute — gezählt zu den Sechs Büchern des sunnitischen Islam.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi wurde um das Jahr 209 n. H. (824 n. Chr.) in der Nähe von Termez geboren, in Khorasan, an der heutigen Grenze zwischen Usbekistan und Afghanistan. Er begann mit etwa zwanzig Jahren, Hadithe zu studieren, und reiste ab 235 n. H. durch Khorasan, den Irak und den Hijaz, um sie zu sammeln, wobei er hauptsächlich bei Muhammad al-Bukhari studierte — seinem wichtigsten Lehrer — sowie bei Muslim ibn al-Hajjaj, Abu Dawud al-Sijistani, Qutaybah ibn Sa'id und Ali ibn Hujr. In seinen späteren Jahren erblindete er, worauf sein Beiname „ad-Darir" („der Blinde") zurückgeht. Er kehrte in die Gegend von Termez zurück, wo er am 13. Radschab des Jahres 279 n. H. (9. Oktober 892 n. Chr.) im Alter von etwa siebzig Jahren starb.
hero.2=Sein vollständiger Titel, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, wird gewöhnlich zu Jami' at-Tirmidhi oder Sunan at-Tirmidhi verkürzt. Während Sahih al-Bukhari und Sahih Muslim nur Hadithe zulassen, die ihre Verfasser als voll authentisch beurteilten, bewertete at-Tirmidhi jeden Hadith offen innerhalb des Textes selbst — sahih, hasan, da'if oder gharib — und erläuterte die Gründe für eine schwächere Einstufung, statt den Hadith auszulassen; er legte außerdem dar, wo die Rechtsschulen (Madhahib) unterschiedlicher Meinung waren und auf welche Belege sich jede Seite stützte, was das Buch ebenso sehr zu einem Leitfaden für hadithgestütztes Rechtsdenken macht wie zu einer Hadith-Sammlung für sich.
hero.3=Die sunnitische Tradition zählt es zu den Sechs Büchern, gewöhnlich nach Sahih al-Bukhari, Sahih Muslim und Sunan Abi Dawud; wo genau es unter den verbleibenden Büchern einzuordnen ist — und welche Sammlung den sechsten Platz einnimmt, wobei Sunan Ibn Majah die übliche, aber nicht die einzige historisch vorgeschlagene Antwort ist — wird seit langem diskutiert, ohne entschieden zu sein, ebenso wie bei den übrigen Sunan-Sammlungen dieses Korpus. Die für das Buch angegebene Hadith-Zahl schwankt aus demselben Grund: etwa 4.330 nach der traditionellen Zählung, anderswo mit etwa 4.400 angegeben; auch seine Gliederung wird unterschiedlich beschrieben, als 46 Bücher, als 49 Kapitel in Ahmad Muhammad Shakirs Kairoer Ausgabe, oder als fünfzig Kapitel. Die eigene Zahl dieses Korpus ist noch eine weitere Zahl: 49 Bücher und 3.998 Hadithe, die Form der digitalen Ausgabe, der sie entnommen wurde, nicht der Anspruch, eine einzelne Drucktradition wiederzugeben.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-tirmidhi-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

