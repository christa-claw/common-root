title=Джами ат-Тирмизи — Об этом издании | Common Root
description=Джами ат-Тирмизи: сборник хадисов, который Абу Иса ат-Тирмизи построил на открытой оценке достоверности каждого сообщения и записи правовых доводов, которые из него выводили правоведы — входит в число суннитских Шести книг.
heroHeading=Джами ат-Тирмизи
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Абу Иса Мухаммад ибн Иса ат-Тирмизи родился около 209 года хиджры (824 года н. э.) близ Термеза, в Хорасане, на территории современной границы Узбекистана и Афганистана. Он начал изучать хадисы примерно в двадцать лет и с 235 года хиджры путешествовал по Хорасану, Ираку и Хиджазу в их поисках, обучаясь главным образом у Мухаммада аль-Бухари — своего главного учителя, — а также у Муслима ибн аль-Хаджжаджа, Абу Дауда ас-Сиджистани, Кутайбы ибн Саида и Али ибн Худжра. В последние годы жизни он ослеп, отсюда его прозвище «ад-Дарир» («слепой»). Он вернулся в окрестности Термеза, где умер 13 раджаба 279 года хиджры (9 октября 892 года н. э.) в возрасте около семидесяти лет.
hero.2=Его полное название, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, обычно сокращают до Джами ат-Тирмизи или Сунан ат-Тирмизи. В то время как Сахих аль-Бухари и Сахих Муслима допускают лишь хадисы, которые их составители считали полностью достоверными, ат-Тирмизи открыто оценивал каждый хадис прямо в тексте — сахих, хасан, да'иф или гариб — и объяснял основания для более слабой оценки, а не опускал хадис; он также указывал, в чём расходились правовые школы (мадхабы) и на какие доводы опиралась каждая сторона, что делает книгу не только сборником хадисов, но и руководством по правовым рассуждениям на их основе.
hero.3=Суннитская традиция относит её к Шести книгам, обычно после Сахиха аль-Бухари, Сахиха Муслима и Сунана Абу Дауда; на каком именно месте она стоит среди оставшихся книг — и какой сборник занимает шестое место, причём Сунан Ибн Маджа — обычный, но не единственный исторически предлагавшийся ответ, — долго обсуждалось, но не было решено, как и для других сборников Сунан в этом собрании. Число хадисов, приводимое для книги, по той же причине расходится: около 4 330 по традиционному счёту, в других местах указывается около 4 400; её структуру также описывают по-разному — как 46 книг, как 49 глав в каирском издании Ахмада Мухаммада Шакира, или как пятьдесят глав. Собственное число этого собрания — ещё одно, отдельное число: 49 книг и 3 998 пронумерованных хадисов, форма той цифровой публикации, из которой они взяты, а не претензия на воспроизведение какой-либо отдельной печатной традиции.
hero.4=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-tirmidhi сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для Сахиха аль-Бухари, Сахиха Муслима, Сунана Абу Дауда и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

