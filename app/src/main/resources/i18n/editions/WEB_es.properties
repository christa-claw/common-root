title=World English Bible — Acerca de esta edición | Common Root
description=La World English Bible: revisión al inglés moderno de la American Standard Version de 1901, comenzada en 1994 por Michael Paul Johnson, con el Nuevo Testamento ajustado al texto mayoritario griego y puesta deliberadamente en el dominio público.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=La World English Bible existe por un problema de derechos de autor. En 1994 Michael Paul Johnson, ingeniero que traducía la Biblia en las horas que le dejaba un empleo de jornada completa, calculó cuánto tardaría en terminar una Biblia en inglés moderno que cualquiera pudiera copiar libremente, y la respuesta no le gustó. Dejó de traducir desde cero y volvió a empezar desde la American Standard Version de 1901 — exacta, respetada y, a diferencia de la Versión del Rey Jacobo (aún gravada en Inglaterra y Gales por las cartas patentes de la Corona), enteramente libre de derechos. Un programa que él mismo escribió recorrió la ASV en busca de palabras que ninguna Biblia moderna usaba, propuso sustituciones y las aplicó en unos quince minutos. Todo lo que el programa no podía hacer — el orden de palabras, la puntuación, las comillas — se hizo a mano en los años siguientes, y el texto se publicó, y se volvió a publicar en revisiones, desde 1997 en adelante.
hero.2=Dos cosas la separan de la edición que revisa. La primera es el griego. El Nuevo Testamento de la ASV seguía el texto crítico de los revisores, cercano a lo que sería la edición de Nestle-Aland; la World English Bible se ajustó en cambio al texto mayoritario bizantino, de modo que no es ni el texto de su tronco ni el Textus Receptus que usaron los traductores del Rey Jacobo. La segunda es el nombre divino. La ASV imprimió “Jehovah”; la World English Bible imprime “Yahweh”, con una nota en Génesis 2:4 que explica la elección al lector que espera “the LORD”. La edición británica vuelve a “LORD” — el ejemplar de este corpus es el americano, así que “Yahweh” es lo que se lee. Fuera de esas dos decisiones sigue siendo una traducción de equivalencia formal a la manera de su tronco: el mismo seguimiento estrecho del orden de palabras hebreo y griego, en una ortografía y una gramática que ya no piden glosa.
hero.3=En el lector es una hoja, y la única de la rama más larga del corpus. Abra un peldaño bajo un versículo de la World English Bible y aparecerá debajo la American Standard Version, y bajo ella la Revised Version, la Versión del Rey Jacobo y la Biblia de Ginebra, hasta el suelo de las lenguas originales marcado con ≈. Nada en el corpus se apoya a su vez en la World English Bible. Es además el texto más ancho de esa rama: la American Standard Version no tenía libros apócrifos, de modo que los de la World English Bible se hicieron aparte, a partir de los apócrifos del Rey Jacobo y de la Septuaginta inglesa de Brenton, y nuestro ejemplar lleva ochenta libros donde la ASV que tiene debajo lleva sesenta y seis — entre ellos 3 y 4 Macabeos y el Salmo 151, que los apócrifos del Rey Jacobo no tienen. Baruc, que sí tienen, falta en nuestro ejemplar. La página Acerca de deja en blanco la columna del año de esta edición, y con razón: no hay un año de publicación único. El corpus estampa 2000 para que las fichas de los peldaños tengan por qué ordenarse.

