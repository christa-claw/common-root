title=New International Version — Über diese Ausgabe | Common Root
description=Die New International Version: die englische Bibel, mit der dieser Reader standardmäßig öffnet, direkt aus den Originalsprachen übersetzt vom Committee on Bible Translation und erstmals 1978 vollständig fertiggestellt — hier in ihrem Text von 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Es begann mit der Unzufriedenheit einer Konfession. 1955 drängte der Geschäftsmann Howard Long, zusammen mit dem Pfarrer Peter De Jong, die Christian Reformed Church, eine Bibel in zeitgemäßem Englisch herauszugeben, und 1957 setzte die CRC einen Ausschuss ein, der die Idee prüfen sollte. Die National Association of Evangelicals hatte im selben Jahr ein eigenes, ähnliches Vorhaben begonnen. Die beiden Körperschaften schlossen sich zusammen: Ein gemeinsamer Ausschuss verschickte 1964 Einladungen zu einer Übersetzungskonferenz, die im August 1965 am Trinity Christian College in Palos Heights, Illinois, zusammentrat und beschloss, „einen fortlaufenden Ausschuss von fünfzehn" zu bilden, um die Arbeit weiterzuführen. Aus diesem ständigen Ausschuss wurde das Committee on Bible Translation. 1967 übernahm die New York Bible Society — seither in Biblica umbenannt — die Trägerschaft und stellte die Gelehrten ein, die die Übersetzung anfertigen sollten.
hero.2=Nichts hier stammt von einer älteren englischen Bibel ab. Während King James Version, Revised Version, American Standard Version und World English Bible in diesem Korpus eine einzige Kette von Überarbeitungen bilden, wurde die New International Version neu und unmittelbar aus dem Hebräischen, Aramäischen und Griechischen übersetzt: das Alte Testament aus dem masoretischen hebräischen Text, unter Berücksichtigung der Schriftrollen vom Toten Meer, der Septuaginta und anderer früher Zeugen; das Neue Testament aus dem eklektischen kritischen griechischen Text, wie ihn die Ausgaben der United Bible Societies und von Nestle-Aland vertreten — nicht aus dem Textus Receptus, auf dem hier die Genfer Bibel und die King James Version ruhen. Der Ausschuss von fünfzehn wuchs binnen etwa eines Jahrzehnts zu einem Projekt heran, das auf mehr als hundert Gelehrte aus mehreren englischsprachigen Ländern und vielen Konfessionen zurückgriff. Ihr erklärtes Ziel war eine Übersetzung, die der Genauigkeit des Urtexts treu blieb, ohne sich wie eine Wort-für-Wort-Abschrift davon zu lesen — ein Gleichgewicht, das gewöhnlich als dynamische Äquivalenz eingeordnet wird, zwischen einer streng wörtlichen Wiedergabe und einer freien Umschreibung.
hero.3=Das Neue Testament erschien zuerst, 1973; die vollständige Bibel folgte am 27. Oktober 1978; eine leichte Überarbeitung kam 1984. Der Text änderte sich grundlegender 2011, als eine umfassendere Überarbeitung sowohl die Ausgabe von 1984 als auch die Today's New International Version von 2005 ersetzte und beide zugunsten des einen Textes zurückzog, der seither Bestand hat. Dieser Text von 2011 ist der, welcher in diesem Korpus vorliegt — dasselbe Jahr, das die Katalogkarte zeigt. Biblica, Inc. hält durchgehend das Urheberrecht; Zondervan verlegt sie in den Vereinigten Staaten, Hodder & Stoughton im Vereinigten Königreich.
hero.4=Ihr Platz in diesem Reader ist auf stille Weise zentral. Stellt man die Oberfläche auf Englisch, öffnet sich diese Ausgabe — die Seiten zur King James Version und zur Revised Version in diesem Korpus sagen selbst dasselbe und verweisen hierher als die Ausgabe, von der man wegwechselt, nicht die, bei der man landet. Weil sie nichts überarbeitete, verzeichnet der Korpus für sie keine Vorlage: Öffnet man eine Abstammungssprosse unter einem Vers der New International Version, führt sie geradewegs zum Boden der Originalsprache hinunter, markiert mit ≈, ebenso wie bei der Berean Standard Bible — mit einem Unterschied, den man kennen sollte. Der griechische Zeuge dieses Bodens ist der Textus Receptus, und der Textus Receptus ist nicht das, woraus das Neue Testament dieser Übersetzung tatsächlich gemacht wurde — der Boden steht stellvertretend für „das griechische Urtext" im Allgemeinen, nicht für den eigenen Arbeitstext dieses Ausschusses. Eine weitere Sache hebt sie von den meisten ihrer englischen Nachbarn ab: Sie ist lizenziert, nicht gemeinfrei, in demselben Status wie die New American Standard Bible 2020, während die Berean Standard Bible, die Genfer Bibel, die King James Version, die Revised Version und die World English Bible alle frei kopiert werden dürfen.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=Englisch
fact.2.label=In Auftrag gegeben
fact.2.value=Von einem gemeinsamen Ausschuss der Christian Reformed Church und der National Association of Evangelicals, der im August 1965 eine Konferenz am Trinity Christian College in Palos Heights, Illinois, einberief
fact.3.label=Erstellt von
fact.3.value=Dem Committee on Bible Translation — anfangs fünfzehn Gelehrte, die Zahl wuchs später auf über hundert Gelehrte aus mehreren englischsprachigen Ländern und vielen Konfessionen, über etwa ein Jahrzehnt
fact.4.label=Altes Testament nach
fact.4.value=Dem masoretischen hebräischen Text, unter Berücksichtigung der Schriftrollen vom Toten Meer, der Septuaginta und anderer früher Zeugen
fact.5.label=Neues Testament nach
fact.5.value=Dem eklektischen kritischen griechischen Text, wie ihn die Ausgaben der United Bible Societies und von Nestle-Aland vertreten — nicht [[TR|dem Textus Receptus]], auf dem hier [[GNV|die Genfer Bibel]] und [[KJV|die King James Version]] ruhen
fact.6.label=Art der Übersetzung
fact.6.value=Gleicht die Genauigkeit einer wörtlichen Wiedergabe mit natürlichem, idiomatischem Englisch aus, statt sich an eines der beiden Extreme zu halten — gewöhnlich als dynamische Äquivalenz eingeordnet; eine neue Übersetzung aus den Originalsprachen, keine Überarbeitung der King-James-Tradition
fact.7.label=Veröffentlicht
fact.7.value=Das Neue Testament 1973; die vollständige Bibel am 27. Oktober 1978; eine leichte Überarbeitung 1984; der heutige, gründlicher überarbeitete Text 2011, der sowohl die Ausgabe von 1984 als auch die Today's New International Version von 2005 zurückzog
fact.8.label=Verlag
fact.8.value=Biblica, Inc., das das Urheberrecht hält; Zondervan in den Vereinigten Staaten, Hodder & Stoughton im Vereinigten Königreich
fact.9.label=Lizenz
fact.9.value=Lizenziert, nicht gemeinfrei. Bis zu 500 Verse dürfen ohne schriftliche Genehmigung zitiert werden, sofern sie weder ein vollständiges Buch der Bibel noch mehr als 25 % des Werks ausmachen und ein Urheberrechtsvermerk beigefügt wird; alles darüber hinaus braucht Biblicas Genehmigung
fact.10.label=In diesem Korpus
fact.10.value=Die Bibel, mit der eine englische Oberfläche standardmäßig öffnet — [[KJV|die King James Version]] und [[RV|die Revised Version]] stellen hier beide fest, dass sie es nicht ist. In den Abstammungssprossen ist keine Vorlage verzeichnet: Eine Sprosse unter einem NIV-Vers führt geradewegs zum Boden der Originalsprache, markiert mit ≈, ebenso wie bei [[BSB|der Berean Standard Bible]] — nur dass der griechische Zeuge dieses Bodens [[TR|der Textus Receptus]] ist, der nicht der Text ist, aus dem das Neue Testament dieser Übersetzung tatsächlich gemacht wurde. Lizenziert statt gemeinfrei, im selben Status wie die New American Standard Bible 2020, steht sie damit abseits von gemeinfreien Nachbarn wie [[KJV|der King James Version]], [[RV|der Revised Version]] und [[WEB|der World English Bible]]
