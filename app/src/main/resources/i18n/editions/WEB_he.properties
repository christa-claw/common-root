# The narrative, one paragraph per key, in order.
hero.1=World English Bible קיימת בשל בעיה של זכויות יוצרים. בשנת 1994 חישב Michael Paul Johnson, מהנדס שתרגם את המקרא בשעות שהותירה לו משרה מלאה, כמה זמן יידרש לו להשלים ביבליה באנגלית בת־זמננו שכל אדם יוכל להעתיק בחופשיות — והתשובה לא מצאה חן בעיניו. הוא חדל לתרגם מבראשית והתחיל מחדש מן American Standard Version משנת 1901: מדויקת, נכבדת, ובניגוד לתרגום המלך ג'יימס (שבאנגליה ובוויילס עודנו מוכבד בכתב הזיכיון של הכתר) חופשית לגמרי מזכויות יוצרים. תוכנית שכתב בעצמו סרקה את נוסח ASV אחר מילים שאין ביבליה בת־זמננו משתמשת בהן, הציעה תחליפים וביצעה את ההחלפות בכחמש עשרה דקות. כל מה שהתוכנית לא יכלה לו — סדר המילים, הפיסוק, המירכאות — נעשה ביד בשנים שלאחר מכן, והנוסח יצא, ושב ויצא בתיקונים, משנת 1997 ואילך.
hero.2=שני דברים מפרידים בינה לבין המהדורה שהיא מתקנת. הראשון הוא היוונית. הברית החדשה של ASV הלכה אחר הנוסח הביקורתי של המתקנים, הקרוב למה שעתיד היה להיות מהדורת נסטלה–אלנד; ואילו World English Bible הותאמה לנוסח הרוב הביזנטי, ועל כן אין היא לא נוסח מקורהּ ולא Textus Receptus שבו השתמשו מתרגמי המלך ג'יימס. השני הוא שם האל. ASV הדפיסה “Jehovah”; World English Bible מדפיסה “Yahweh”, והערה בבראשית ב, ד מסבירה את הבחירה לקורא המצפה ל“the LORD”. המהדורה הבריטית שבה אל “LORD” — העותק שבאוסף זה הוא האמריקאי, ולכן “Yahweh” הוא הנקרא. מעבר לשתי ההכרעות הללו נותרת היא תרגום של שקילות צורנית כדרך מקורהּ: אותה היצמדות לסדר המילים העברי והיווני, בכתיב ובדקדוק שאינם עוד טעונים ביאור.
hero.3=בקורא היא עלה, והיחיד שעל הענף הארוך ביותר באוסף. פִּתחו שלב מתחת לפסוק מ־World English Bible ותופיע מתחתיו American Standard Version, ומתחתיה Revised Version, תרגום המלך ג'יימס וביבליית ז'נבה, עד לרצפת שפות המקור המסומנת ב־≈. אין באוסף דבר שעומד בתורו על World English Bible. היא גם הרחב שבנוסחי אותו ענף: ל־American Standard Version לא היו ספרים חיצוניים, ולפיכך נעשו אלה של World English Bible בנפרד, מן האפוקריפה של המלך ג'יימס ומתרגום השבעים האנגלי של ברנטון, והעותק שלנו נושא שמונים ספרים במקום ששישים ושישה נושאת ASV שמתחתיו — ובהם מקבים ג' ומקבים ד' ומזמור 151, שאינם באפוקריפה של המלך ג'יימס. ספר ברוך, שישנו בה, חסר בעותק שלנו. עמוד המידע מותיר את טור השנה של מהדורה זו ריק, ובדין: שנת הוצאה אחת אין. האוסף מטביע 2000 כדי שיהיה לתגי השלבים לפי מה להסתדר.

