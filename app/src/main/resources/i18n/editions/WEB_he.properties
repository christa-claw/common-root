title=World English Bible — על מהדורה זו | Common Root
description=World English Bible: תיקון באנגלית בת־זמננו של American Standard Version משנת 1901, שהחל בו Michael Paul Johnson בשנת 1994, שהברית החדשה שבו הותאמה לנוסח הרוב היווני, והוא הועמד במתכוון בנחלת הכלל.
heroHeading=World English Bible
