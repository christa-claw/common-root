title=Textbibel 1906 — Om denna utgåva | Common Root
description=Kautzschs och Weizsäckers Textbibel: en lärd tysk bibel, översatt på nytt från hebreiskan och grekiskan och först utgiven i ett band i Tübingen 1899; texten här är daterad 1906.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Två professorer, två testamenten. Carl Weizsäcker (1822–1899) var kyrkohistoriker i Tübingen, där han efterträdde Ferdinand Christian Baur på lärostolen 1861 och var universitetets kansler från 1889. Hans översättning av Nya testamentet kom första gången 1875 och gick i nio upplagor under hans livstid, den sista förberedd på dödsbädden. Emil Kautzsch (1841–1910) var gammaltestamentlig forskare och undervisade i Leipzig, Basel och Tübingen innan han slog sig ner i Halle 1888; hans Gamla testamente, översatt tillsammans med en grupp fackkolleger, förelåg komplett 1894.
hero.2=År 1899, samma år som Weizsäcker dog, förenades de två i ett band, Textbibel des Alten und Neuen Testaments, utgivet i Tübingen av J.C.B. Mohr (Paul Siebeck). Namnet säger vad den är: den nakna texten, för läsare som ville veta vad hebreiskan och grekiskan säger, på sin egen tids tyska. Den var aldrig tänkt att ersätta Luther. Weizsäcker undvek medvetet Luthers språk och försökte i stället återge det intryck originalet gjorde på sina första läsare; hans biograf fann det osannolikt att den någonsin skulle bli en folkbok, och det blev den inte. Den trycktes om in på 1910-talet. Den digitala texten här är daterad 1906; vilken upplaga det trycket var har detta projekt inte fastställt.
hero.3=Den läser som sin tids forskning. Gudsnamnet i Gamla testamentet är ”Jahwe” – ”Jahwe ist mein Hirte” i Psalm 23 – tusentals gånger, där Luther har ”der Herr”. Jesaja 7:14 har ”ein junges Weib”, en ung kvinna. I Nya testamentet slutar Herrens bön i Matteus 6:13 utan doxologin, och 1 Johannesbrevet 5:7 har inga himmelska vittnen. Gamla testamentet behåller den hebreiska kapitel- och versindelningen: psalmernas överskrifter räknas in i versnumren, så Psalm 51 har 21 verser, och Malaki har tre kapitel i stället för fyra. Stavningen är äldre än årtalet antyder – i Johannes 8:1 ”gieng” Jesus till Oljeberget.
hero.4=I denna läsare är den en av fyra tyska biblar, bredvid Elberfelder och Luthers texter från 1545 och 1912. Ett tyskt gränssnitt öppnar inte på den: tyskan har inget kurerat val, så läsaren tar den första tyska bibeln i katalogen, och det är Elberfelder. Ingen förlaga är registrerad för den i härstamningens stegpinnar, vilket passar en översättning gjord från grundtexterna: en stegpinne som öppnas under en vers faller rakt ner till grundspråksgolvet märkt med ≈ – Westminster Leningradkodexen för Gamla testamentet och, för Nya, Textus Receptus, en grekisk text som denna översättning inte följer, vilket 1 Johannesbrevet 5:7 visar.

