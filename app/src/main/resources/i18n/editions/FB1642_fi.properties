# The narrative, one paragraph per key, in order.
hero.1=Ensimmäinen täydellinen Raamattu suomeksi. Sitä ennen oli Mikael Agricolan Uusi testamentti vuodelta 1548 ja 1550-luvulla julkaistuja osia Vanhasta; sen jälkeen oli kokonainen Raamattu kielellä, jota oli tuskin kirjoitettu. Neljä oppinutta teki työn vuosina 1638–1641 — Eskil Petraeus, Martinus Stodius, Henricus Hoffman ja Gregorius Matthaei — Turun piispan Isaacus Rothoviuksen alaisuudessa, joka ajoi hankkeen läpi. Suomi kuului Ruotsiin, ja teos ilmestyi vuonna 1642 kuningatar Kristiinan suojeluksessa. Yritys oli tehty jo sukupolvea aiemmin: vuonna 1602 asetettiin raamatunkäännöskomitea, jota todennäköisesti johti Turun piispa Ericus Erici Sorolainen. Se sai ilmeisesti aikaan suomennosluonnoksia, mutta niitä ei koskaan koottu Raamatuksi, ja niiden kohtalo on suureksi osaksi historian hämärässä — työn arvellaan silti vaikuttaneen vuoden 1642 käännökseen.
hero.2=He käänsivät hepreasta ja kreikasta Lutherin saksa vierellään. Kustaa Vaasan ruotsalainen Raamattu oli toinen pöydällä ollut kirja; se ei ole tässä aineistossa, joten ketju merkitsee tähän Lutherin — ja hänen rinnalleen Agricolan suomen vuodelta 1548, pohjatekstin jota komitea muokkasi. Vuoden 1642 Biblian suurempi vaikutus kohdistui itse suomen kieleen. Kieli, jolla ei ollut juuri lainkaan kirjoitettua proosaa, sai yhdessä niteessä sanaston ja poljennon kaikkeen laista valitusvirteen — ja jokainen myöhempi suomalainen Raamattu on sen tarkistus tai seuraaja eikä uusi alku.
hero.3=Tässä lukijassa vuoden 1642 Biblia on kahden suomalaisen askelman välissä. Kolme askelmaa Kirkkoraamattu 1933/38:n alapuolella, Biblia 1776:n alla, tämä laitos ilmestyy, ja sen alla kaksi vanhempaa rinnakkain — Agricolan suomi vuodelta 1548, pohja jota komitea muokkasi, ja Lutherin saksa vuodelta 1545, joka oli pöydällä auki. Askelmaa alempana ketju on jättänyt suomen lopullisesti. Teksti on peräisin Kotuksen VKS-korpuksesta, ja siksi näkemäsi kirjoitusasu — ”tulcon walkeus” — on vuoden 1642 painoksen oma eikä nykyaikaistettu.

