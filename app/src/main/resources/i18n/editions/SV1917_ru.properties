title=Svenska 1917 — Об этом издании | Common Root
description=Перевод Шведской церкви 1917 года — Gustav V:s bibel — первая шведская Библия, сделанная прямо с иврита и греческого, а не пересмотренная из предыдущей, и единственная шведская Библия, которую хранит это собрание.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Три с половиной столетия у Шведской церкви была одна Библия — пересматриваемая, но никогда не переделываемая заново. Библия Густава Васы 1541 года, первая полная Библия, напечатанная на шведском, тяжело опиралась на немецкий текст Мартина Лютера. Библия Густава II Адольфа 1618 года пересмотрела её, а Karl XII:s bibel 1703 года — завершённая при одном короле, хотя заказанная ещё его отцом до него, — продвинула тот же унаследованный шведский текст ещё на шаг. Ни одна из трёх не начинала заново.
hero.2=В 1773 году Густав III назначил библейскую комиссию сделать то, чего не сделал ни один из тех пересмотров: переводить прямо с иврита и греческого, а не продвигать старый шведский текст ещё раз. Комиссия работала 144 года. Её результат — второй полный перевод Библии в Швеции, после перевода Густава Васы и до Bibel 2000, — был завершён и утверждён при Густаве V в 1917 году, и поэтому его до сих пор часто называют Gustav V:s bibel.
hero.3=Ветхий Завет опирается на масоретский еврейский текст, как и издания до него. Новый Завет не продолжает их линию: он следует самому современному критическому греческому тексту, какой был у комиссии к 1917 году, а не Textus Receptus, на котором строятся Библии эпохи Реформации, хранящиеся в этом собрании.
hero.4=В этой читалке это единственная шведская Библия, так что шведский интерфейс открывает именно её — не как отобранный вручную выбор, каким для испанского отобрана Reina-Valera 1909, а потому, что перебор каталога не находит на этом языке ничего другого. В ступенях родословия источник для неё не записан, так что ступень, открытая под стихом, уходит прямо на пол исходных языков, помеченный знаком ≈. Этот пол даёт для греческого Textus Receptus, и здесь это дальше от истины, чем обычно: комиссия сознательно оставила Textus Receptus позади ради более современного критического текста, так что пол под стихом этого перевода называет греческий текст, который не тот, что он на деле использовал.

