title=Freedom Bible היפנית — על מהדורה זו | Common Root
description=Freedom Bible היפנית (フリーダム・バイブル): מקרא יפני שלם בן 66 ספרים, ש־eBible.org מפיץ כטיוטת תרגום שלא הוטלו עליה זכויות יוצרים — המקרא היפני היחיד באוסף זה, ולכן הממשק היפני נפתח עליו.
heroHeading=Freedom Bible היפנית
readerHref=/reader?c1.src=jfb

hero.1=Freedom Bible היפנית — ביפנית フリーダム・バイブル — היא מקרא יפני שלם המופץ על ידי eBible.org, המציג את עצמו כמפיץ הרשמי של התרגום. היא חדשה מאוד: קובצי המקור שבאוסף זה מתוארכים ל־19 באוגוסט 2026, וה־2026 שעל הכרטיס שלה הוא תאריך הקבצים האלה. eBible אינו מציין תאריך הוצאה נפרד, וגם כאן אין טוענים לתאריך כזה.
hero.2=הרבה ממה שנוגע לה אינו מתועד, וראוי לומר זאת בפשטות. דפי eBible אינם נוקבים בשם מתרגם, ועדה או מוציא לאור, ואינם אומרים ממה נעשה התרגום — ישירות מן העברית והיוונית, או בתיווכו של תרגום מודרני אחר. דף זכויות היוצרים שלה עצמה מכנה אותה טיוטת תרגום (翻訳の草案) ומזמין הצעות לשיפורה, כך שהטקסט כאן הוא תמונת מצב של עבודה בתהליך ולא מהדורה מקובעת.
hero.3=מה שברור הוא מעמדה המשפטי: אותו דף קובע שלא הוטלו זכויות יוצרים על התרגום, ומסמן אותו כנחלת הכלל. משום כך היא הטקסט היפני כאן — היא הייתה המקרא היפני השלם היחיד ב־eBible שאינו כפוף לזכויות יוצרים. המקרא היפני הקדום יותר, שיכול היה להעניק לה שושלת — תרגום תקופת מייג'י שהושלם ב־1887 וזה מכבר הוא נחלת הכלל — אינו זמין מאותו מקור.
hero.4=באוסף זה היא כוללת את 66 ספרי הקנון הפרוטסטנטי, 31,098 פסוקים, בלי ספרים דויטרוקנוניים. לא נרשם לה טקסט אב, ולכן פתיחת שלב מתחת לאחד מפסוקיה מובילה היישר לרצפת שפות המקור המסומנת ב־≈: העברית והיוונית המוצגות שם הן עדים, ולא טענה לגבי מה שממנו תורגמה — וכשמקורה אינו ידוע, זוהי הקריאה הישרה. היא המקרא היפני היחיד באוסף, ולכן ממשק יפני נפתח עליה כברירת מחדל.

