title=Vulgata latina — Su questa edizione | Common Root
description=La Vulgata latina: la traduzione di Girolamo, commissionata nel 382 e terminata intorno al 405, che portò la Bibbia attraverso l'Europa occidentale per mille anni e fu il primo libro stampato da Gutenberg.
heroHeading=Vulgata latina
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=Verso la fine del IV secolo i vangeli latini che circolavano in Occidente si contraddicevano l'uno con l'altro, copia dopo copia, e papa Damaso I chiese al suo segretario Girolamo di metterli in ordine. Girolamo cominciò da una revisione. Finì per dedicarvi più di vent'anni, la maggior parte a Betlemme, e per produrre qualcosa che nessuno aveva chiesto.
hero.2=La scelta che fece la differenza fu tradurre l'Antico Testamento dall'ebraico anziché dalla Settanta greca che la Chiesa aveva sempre usato. Girolamo chiamò il principio “hebraica veritas” — la verità ebraica — e fu controverso: Agostino gli scrisse preoccupato che le comunità si ribellassero vedendo mutare sotto di loro letture familiari. Girolamo lo fece comunque. È per questo che una Bibbia latina, proprio essa, sta più vicina all'ebraico della Bibbia greca che leggevano i primi cristiani.
hero.3=Divenne la Bibbia dell'Europa occidentale per un millennio, una durata più lunga di quella di qualsiasi traduzione prima o dopo. Da essa Wyclif tradusse in inglese, e su di essa lavorarono anche i traduttori della Douay-Rheims — la Douay-Rheims di questo corpus ne è dunque la discendente diretta, e i gradini di quell'edizione riportano qui. Fu inoltre il primo libro di mole stampato a caratteri mobili: la Bibbia che Gutenberg compose a Magonza intorno al 1455 era questo testo.

