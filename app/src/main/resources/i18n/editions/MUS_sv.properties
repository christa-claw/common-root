title=Sahih Muslim — Om denna utgåva | Common Root
description=Sahih Muslim: tillsammans med Sahih al-Bukhari bildar det Sahihayn, de två samlingar som sunniislam rankar näst efter Koranen; Muslim ibn al-Hajjaj sammanställde det från hadither insamlade på den arabiska halvön, i Egypten, Irak och Syrien, och tog bara med dem som hade en obruten kedja av tillförlitliga uppgiftslämnare.
heroHeading=Sahih Muslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi föddes i Nishapur, i den abbasidiska provinsen Khorasan (i dagens nordöstra Iran); källorna skiljer sig åt om året, med uppgifter om 202, 204 eller 206 e.H. (ungefär 817–822 e.Kr.). Han reste genom den arabiska halvön, Egypten, Irak och Syrien för att samla hadither från lärda på varje plats, och slog sig därefter ner igen i sin hemstad, där han träffade al-Bukhari, studerade under honom och förblev hans vän resten av livet. Enligt al-Khatib al-Baghdadi påbörjade han verket på begäran av en elev, Ahmad ibn Salama al-Naysaburi; dess ursprungliga titel, al-Musnad al-Sahih al-Mukhtasar, förkortas vanligen, liksom al-Bukharis, till Sahih Muslim. Han dog i Nishapur år 261 e.H. (875 e.Kr.) och begravdes i förstaden Nasarabad.
hero.2=Han tog bara med en hadith när dess överföringskedja var obruten tillbaka till en följeslagare till Muhammed, med minst två tillförlitliga uppgiftslämnare i varje led; han delade in uppgiftslämnarna i tre nivåer efter minne och karaktär och lade åt sidan de vars hederlighet ifrågasatts. Hans kommentator al-Nawawi lyfte fram en ytterligare omsorg: Muslim, skrev han, placerar varje hadith på en enda lämplig plats tillsammans med alla dess kedjor och formuleringsvarianter, i stället för att låta dem framstå spridda — en framställning som senare kommentatorer har ställt mot [[BUK|Sahih al-Bukharis]] praxis att placera en hadiths olika formuleringar separat, var och en under det kapitel vars poäng formuleringen belyser.
hero.3=Hur många hadither boken egentligen innehåller beror, liksom för [[BUK|Sahih al-Bukhari]], på vem som räknar och hur upprepningar hanteras. Kâtip Çelebi och Siddiq Hasan Khan kom båda fram till 7 275; Muhammad Fu'ad Abd al-Baqi, utan att räkna upprepningar, till 3 033; Mashhur ibn Hasan Al Salman till 7 385, eller 7 395 om man räknar med de tio hadither som finns i Muslims egen inledning; andra uppskattningar lägger totalen någonstans mellan ungefär 5 500 och 7 500. Al-Jawzaqi räknade 2 326 hadither som delas, nästan ordagrant, med Sahih al-Bukhari. Korpusets egen siffra är ännu en: 57 böcker och 7 563 numrerade hadither, vilket helt enkelt återger formen hos den digitala utgåva den hämtats från, utan anspråk på att exakt återge någon enskild tryckt numrering.
hero.4=Den arabiska texten här är den klassiska matn, fri från upphovsrätt. Under den i läsaren finns en engelsk översättning, hämtad från fawazahmed0/hadith-apis eng-muslim-utgåva och sammanställd hadith för hadith med arabiskan så att de två kan läsas som ett par — samma följeslagarordning som denna korpus använder för [[BUK|Sahih al-Bukhari]] och för sina koranöversättningar. Vilken publicerad engelsk översättning denna fil själv härstammar från har inte fastställts från korpusens sida, varför dess licens anges som under granskning snarare än rätt och slätt fri från upphovsrätt; arabiskan ovan bär inte denna osäkerhet.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Språk
fact.1.value=klassisk arabiska, med en engelsk översättning som visas under varje hadith i läsaren
fact.2.label=Sammanställare
fact.2.value=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi (f. 202–206 e.H. / ca 817–822 e.Kr. – d. 261 e.H. / 875 e.Kr.)
fact.3.label=Fullständig titel
fact.3.value=al-Musnad al-Sahih al-Mukhtasar — förkortas vanligen Sahih Muslim
fact.4.label=Sammanställd
fact.4.value=hadither insamlade på den arabiska halvön, i Egypten, Irak och Syrien; verket självt färdigställt i Nishapur, Khorasan, på begäran av en elev
fact.5.label=Metod
fact.5.value=tar bara med en hadith med en obruten kedja av minst två tillförlitliga uppgiftslämnare i varje led tillbaka till en följeslagare till Muhammed; uppgiftslämnare indelade i tre tillförlitlighetsnivåer, de med ifrågasatt hederlighet uteslutna
fact.6.label=Ställning
fact.6.value=den andra av sunniislams Sex böcker (Kutub al-Sittah); tillsammans med [[BUK|Sahih al-Bukhari]] kallad "Sahihayn" — de två samlingarna rankade näst efter endast Koranen i auktoritet; de flesta lärda rankar al-Bukharis samling som helhet högre än denna
fact.7.label=Antal hadither
fact.7.value=siffrorna sträcker sig från 3 033 utan upprepning (Abd al-Baqi) till 7 275–7 395 med upprepning, beroende på räknesätt; tryckta utgåvor skiljer sig åt i både kapitel- och hadithnumrering
fact.8.label=I detta korpus
fact.8.value=57 böcker och 7 563 numrerade hadither — formen hos själva källdatasetet, inte en återgivning av någon enskild tryckt numrering
fact.9.label=Engelsk översättning
fact.9.value=hämtad från fawazahmed0/hadith-apis eng-muslim-utgåva, visad som följeslagare under arabiskan; vilken tryckta översättning den härstammar från är ännu inte bekräftat från korpusens sida
fact.10.label=Licens
fact.10.value=den arabiska matn är den fria klassiska texten; den engelska översättningens licens är fortfarande under granskning
