title=الدرة الكريمة — عن هذه الطبعة | Common Root
description=الدرة الكريمة: مختارات من رؤى جوزيف سميث وترجماته ورواياته، جُمعت أول مرة عام 1851 في كتيّب تبشيري في ليفربول بإنجلترا، وقبلها قديسو الأيام الأخيرة كتابًا مقدسًا عام 1880.
heroHeading=الدرة الكريمة
readerHref=/reader?c1.src=pgp

hero.1=بدأت الدرة الكريمة كتيّبًا تبشيريًا لا كتابًا مقدسًا. ففي عام 1851 جمعها فرانكلين د. ريتشاردز، رئيس البعثة الأوروبية للكنيسة آنذاك، في ليفربول بإنجلترا، فضمّ فيها كتابات لجوزيف سميث كانت قد نُشرت في صحف الكنيسة الأولى أو لم تُتداول إلا في نسخ قليلة، ليجدها أعضاء الكنيسة في بريطانيا مجموعة في موضع واحد. ويرجع عنوانها إلى المثل الوارد في إنجيل متى 13:45–46 عن التاجر الذي يبيع كل ما يملك ليشتري لؤلؤة واحدة كثيرة الثمن.
hero.2=صدرت طبعة ثانية حرّرها أورسون برات وأعاد ترتيبها في سولت ليك سيتي عام 1878، وفي 10 أكتوبر 1880 قبلها مؤتمر عام للكنيسة بالتصويت كتابًا مقدسًا. ثم قسّمت مراجعةُ عام 1902، التي أعدّها جيمس إ. تالماج في المقام الأول، النصَّ إلى إصحاحات وآيات، وحذفت الرؤى المشتركة بينها وبين العقيدة والعهود؛ وجاءت طبعة 1921 في عمودين. وفي عام 1976 أُضيفت رؤيتان أخريان — رؤيا الملكوت السماوي ورؤيا جوزيف ف. سميث عن فداء الموتى — ثم نقلتهما الكنيسة عام 1979 إلى العقيدة والعهود، التي تطبعهما طبعتها لعام 1981 بوصفهما القسمين 137 و138.
hero.3=تتألف الطبعة الحالية من خمسة أجزاء. فـ«مختارات من سفر موسى» و«جوزيف سميث — متى» مقتطفات من مراجعة جوزيف سميث لكتاب الملك جيمس المقدس، التي بدأها عام 1830: الأول سردٌ موسّع للإصحاحات الأولى من سفر التكوين في إطار رؤى أُعطيت لموسى، والثاني إعادة صياغة لمتى 23:39 والإصحاح 24. أما «سفر إبراهيم» فهو النص الذي قال سميث إنه ترجمه عن برديات مصرية اقتُنيت في كيرتلاند بولاية أوهايو عام 1835، ونُشر عام 1842 في صحيفة Times and Seasons في نوفو بولاية إلينوي مع ثلاثة رسوم تُسمّى اليوم النُسخ المطابقة 1 و2 و3. ويُستمد «جوزيف سميث — التاريخ» من الرواية التي أعدّها عام 1838 عن سنواته الأولى ورؤاه، أما «بنود الإيمان» فهي ثلاثة عشر بيانًا عقديًا من رسالة كتبها عام 1842 إلى محرّر الصحيفة في شيكاغو جون وينتوورث.
hero.4=و«سفر إبراهيم» هو الجزء الأكثر تعرّضًا للتشكيك. فقد ظُنّ طويلًا أن معظم البرديات قد أُتلف، على الأرجح في حريق شيكاغو عام 1871، غير أن عشر قطع كانت يومًا في حوزة جوزيف سميث ظهرت في متحف المتروبوليتان للفنون في نيويورك، الذي نقلها إلى الكنيسة عام 1967. ويعدّ الباحثون هذه القطع أجزاء من نصوص جنائزية مصرية مألوفة، كُتبت بين القرن الثالث قبل الميلاد والقرن الأول الميلادي، كما تقرّ المقالة التي نشرتها الكنيسة نفسها عن السفر بأن أيًّا من الرموز المكتوبة عليها لا يذكر اسم إبراهيم ولا أي حدث يرويه السفر.
hero.5=وهي، مع الكتاب المقدس وكتاب مورمون والعقيدة والعهود، أحد الأعمال القانونية الأربعة لكنيسة يسوع المسيح لقديسي الأيام الأخيرة؛ أما «طائفة المسيح» (Community of Christ)، الكنيسة الكبيرة الأخرى المنحدرة من حركة جوزيف سميث، فلا تعدّها من كتبها المقدسة. والنص في هذه المجموعة مأخوذ من تصدير JSON الخاص بـ Mormon Documentation Project، وهو في الملكية العامة، والمصدر نفسه لكتاب مورمون والعقيدة والعهود هنا، ويحتفظ بالأجزاء الخمسة بوصفها خمسة أسفار: موسى في ثمانية إصحاحات، وإبراهيم في خمسة، والثلاثة الأخيرة في إصحاح واحد لكل منها. أما النسخ المطابقة الثلاث والشروح المطبوعة معها فليست نصًا مقسّمًا إلى آيات، ولذلك لم تُدرج. ومثل رفيقيه، يتبع صياغة الطبعة القياسية الحالية لا أي طبعة تاريخية بعينها، ولهذا لا تُذكر هنا سنة نشر.

fact.1.label=اللغة
fact.1.value=الإنجليزية
fact.2.label=من صنعه
fact.2.value=جوزيف سميث الابن (1805–1844): رؤى، ومراجعته لكتاب الملك جيمس المقدس، وترجمة قال إنه أجراها عن برديات مصرية، وتاريخه الشخصي، وبيان عقدي؛ وأول من جمعها في مجلد واحد فرانكلين د. ريتشاردز
fact.3.label=نُشر
fact.3.value=1851، ليفربول، إنجلترا، في كتيّب تبشيري جمعه فرانكلين د. ريتشاردز؛ الطبعة الثانية 1878، سولت ليك سيتي، بتحرير أورسون برات؛ قبلها مؤتمر عام كتابًا مقدسًا في 10 أكتوبر 1880
fact.4.label=البنية
fact.4.value=خمسة أجزاء — مختارات من سفر موسى، وسفر إبراهيم، وجوزيف سميث — متى، وجوزيف سميث — التاريخ، وبنود الإيمان — مقسّمة إلى إصحاحات وآيات منذ مراجعة 1902؛ وفي مجموعتنا يُعامل كل جزء سفرًا مستقلًا
fact.5.label=المكانة
fact.5.value=أحد الأعمال القانونية الأربعة لكنيسة يسوع المسيح لقديسي الأيام الأخيرة، إلى جانب الكتاب المقدس و[[BOM|كتاب مورمون]] و[[DC|العقيدة والعهود]]؛ ولا تعدّها طائفة المسيح كتابًا مقدسًا
fact.6.label=في هذه المجموعة
fact.6.value=يتبع النص الصياغة القياسية الحالية من تصدير JSON الخاص بـ Mormon Documentation Project المعلن في الملكية العامة — المصدر نفسه لـ[[BOM|كتاب مورمون]] و[[DC|العقيدة والعهود]]؛ وتعيد مقتطفات موسى ومتى صياغة نص [[KJV|ترجمة الملك جيمس]]، الموجودة في المجموعة أيضًا؛ وقد أُسقطت النسخ المطابقة وشروحها، ولا تُذكر هنا سنة طبع بعينها
fact.7.label=الرخصة
fact.7.value=في الملكية العامة، حسب تصريح القائم على البيانات؛ لا تشمل المواد الدراسية الحديثة المحمية بحقوق النشر
