title=Сахих Муслим — Об этом издании | Common Root
description=Сахих Муслим: вместе с Сахихом аль-Бухари образует «ас-Сахихайн», два сборника, которые суннитский ислам ставит сразу после Корана; Муслим ибн аль-Хаджжадж составил его из хадисов, собранных на Аравийском полуострове, в Египте, Ираке и Сирии, принимая только те, что имели безупречную цепочку надёжных передатчиков.
heroHeading=Сахих Муслим
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Абу-ль-Хусейн Муслим ибн аль-Хаджжадж аль-Кушайри ан-Нишапури родился в Нишапуре, в аббасидской провинции Хорасан (на территории современного северо-восточного Ирана); источники расходятся в указании года — называют 202, 204 или 206 год хиджры (примерно 817–822 года н. э.). Он путешествовал по Аравийскому полуострову, Египту, Ираку и Сирии, собирая хадисы у учёных каждой из этих земель, а затем вновь обосновался в родном городе, где встретил аль-Бухари, учился у него и оставался его другом до конца жизни. По словам аль-Хатиба аль-Багдади, он взялся за эту книгу по просьбе одного из учеников, Ахмада ибн Саламы ан-Нишапури; её первоначальное название, аль-Мусанад ас-Сахих аль-Мухтасар, обычно сокращают, как и название книги аль-Бухари, до Сахих Муслим. Он умер в Нишапуре в 261 году хиджры (875 году н. э.) и был похоронен в его предместье Насарабад.
hero.2=Он принимал хадис только тогда, когда цепочка его передачи была безупречной вплоть до сподвижника Мухаммада, проходя на каждом звене через не менее чем двух надёжных передатчиков; он разделил передатчиков на три уровня по памяти и нравственным качествам и отложил в сторону тех, чья честность вызывала сомнения. Его комментатор ан-Навави отметил ещё одну особую тщательность: Муслим, как он писал, помещает каждый хадис в одном подходящем месте вместе со всеми его цепочками и вариантами формулировок, а не оставляет их разбросанными — изложение, которое позднейшие комментаторы противопоставляли практике [[BUK|Сахиха аль-Бухари]], помещающего разные формулировки одного хадиса отдельно, каждую под той главой, точку которой данная формулировка иллюстрирует.
hero.3=Сколько хадисов фактически содержит книга, зависит, как и в случае [[BUK|Сахиха аль-Бухари]], от того, кто считает и как учитываются повторы. Катиб Челеби и Сиддик Хасан Хан оба пришли к числу 7 275; Мухаммад Фуад Абд аль-Баки, считая без повторов, — к 3 033; Машхур ибн Хасан Аль Салман — к 7 385, или к 7 395, если добавить десять хадисов из собственного введения Муслима; другие оценки помещают итог где-то между 5 500 и 7 500. Аль-Джаузаки насчитал 2 326 хадисов, совпадающих, почти слово в слово, с Сахихом аль-Бухари. Собственное число этого собрания — ещё одно, иное: 57 книг и 7 563 пронумерованных хадиса, что просто отражает форму того цифрового издания, из которого они взяты, а не претензию на точное воспроизведение какой-либо одной печатной нумерации.
hero.4=Арабский текст здесь — классический матн, общественное достояние. Под ним в читалке расположен английский перевод, взятый из издания eng-muslim проекта fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом так, что оба можно читать как пару — то же парное расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]] и для своих переводов Корана. От какого опубликованного английского перевода происходит сам этот файл, со стороны этого собрания не установлено, поэтому его лицензия отмечена как находящаяся на рассмотрении, а не прямо как общественное достояние; арабский текст выше такой неопределённости не несёт.

