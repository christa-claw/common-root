fact.1.label=Язык
fact.1.value=классический арабский, с английским переводом, показанным под каждым хадисом в читалке
fact.2.label=Составитель
fact.2.value=Абу-ль-Хусейн Муслим ибн аль-Хаджжадж аль-Кушайри ан-Нишапури (род. 202–206 года хиджры / ок. 817–822 года н. э. — ум. 261 года хиджры / 875 года н. э.)
fact.3.label=Полное название
fact.3.value=аль-Мусанад ас-Сахих аль-Мухтасар — обычно сокращаемое до Сахих Муслим
fact.4.label=Составлен
fact.4.value=хадисы собраны на Аравийском полуострове, в Египте, Ираке и Сирии; сама книга завершена в Нишапуре, Хорасан, по просьбе ученика
fact.5.label=Метод
fact.5.value=принимает хадис только с безупречной цепочкой не менее чем из двух надёжных передатчиков на каждом звене вплоть до сподвижника Мухаммада; передатчики разделены на три уровня надёжности, те, чья честность вызывала сомнения, исключены
fact.6.label=Положение
fact.6.value=вторая из суннитских Шести книг (Кутуб ас-Ситта); вместе с [[BUK|Сахихом аль-Бухари]] образует «ас-Сахихайн» — два сборника, стоящих по авторитетности сразу после Корана; большинство учёных ставят сборник аль-Бухари в целом выше этого
fact.7.label=Число хадисов
fact.7.value=цифры варьируются от 3 033 без повторов (Абд аль-Баки) до 7 275–7 395 с повторами, в зависимости от способа подсчёта; печатные издания расходятся как в нумерации глав, так и хадисов
fact.8.label=В этом собрании
fact.8.value=57 книг и 7 563 пронумерованных хадиса — форма самого исходного набора данных, а не воспроизведение какой-либо одной печатной нумерации
fact.9.label=Английский перевод
fact.9.value=взят из издания eng-muslim проекта fawazahmed0/hadith-api, показан как сопровождение под арабским текстом; от какого печатного перевода он происходит, со стороны этого собрания пока не подтверждено
fact.10.label=Лицензия
fact.10.value=арабский матн — общественное достояние, классический текст; лицензия английского перевода пока находится на рассмотрении
