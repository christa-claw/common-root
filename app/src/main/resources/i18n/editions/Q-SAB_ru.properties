title=Коран — Саблуков — Об этом издании | Common Root
description=Русский перевод Гордия Саблукова, изданный в Казани в 1878 году и обычно называемый первым русским переводом Корана, выполненным непосредственно с арабского, а не через французское или английское посредство, — и в этом собрании русский перевод-спутник, показанный под усманским арабским текстом.
heroHeading=Коран — Саблуков
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Гордий Семёнович Саблуков (1803-1880) готовился к русскому православному духовному служению, окончив Оренбургскую духовную семинарию в 1826 году и Московскую духовную академию в 1830 году. Следующие два десятилетия, с 1830 по 1849 год, он преподавал историю и восточные языки в Саратовской духовной семинарии — где в середине 1840-х годов среди его учеников был будущий радикальный писатель Николай Чернышевский, — прежде чем в 1849 году перейти в миссионерское отделение Казанской духовной академии, где преподавал восточные и классические языки до 1862 года.
hero.2=Русские переводы Корана восходят к 1716 году, когда Пётр Постников по приказу Петра Великого выполнил перевод — но с французского Андре дю Рийе, а не с арабского, как и перевод Алексея Колмакова 1792 года, сделанный с английского перевода Джорджа Сейла. Перевод Саблукова, изданный в Казани в 1878 году под названием "Коран, законодательная книга мохаммеданского вероучения", обычно считается первым русским переводом Корана, выполненным непосредственно с арабского оригинала, — плодом его многолетнего преподавания восточных языков в Казани.
hero.3=На следующий год он дополнил его сопутствующим томом примечаний, "Приложения к переводу Корана" (1879), а позже — ещё двумя связанными с ним исследованиями: "Сведения о Коране" (1884) и более ранним сравнительным трактатом о христианском и мусульманском учении об именах Бога (1873). Его перевод с тех пор остаётся одной из более распространённых русских версий, даже после того как более поздние переводы — в том числе посмертно изданный перевод Игнатия Крачковского — стали более известны в советском и постсоветском академическом обиходе.
hero.4=То, что оцифровано здесь в издании ru.sablukov сервиса alquran.cloud, предлагается в этом собрании как русский перевод-спутник [[Q-AR|усманского арабского текста]], рядом с английскими переводами [[Q-EN|Пиктхолла]] (1930) и [[Q-YA|Юсуфа Али]] (1934) — тремя переводами, которые обзор доступных переводов признал безусловно свободными для использования, по одному на язык, помимо арабского.

