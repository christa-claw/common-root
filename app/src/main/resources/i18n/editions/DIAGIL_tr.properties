title=Emphatic Diaglott (satır arası) — Bu Baskı Hakkında | Common Root
description=Benjamin Wilson'ın 1864 tarihli Emphatic Diaglott'u: Griesbach'ın Yunancasının altına basılmış sözcüğü sözcüğüne İngilizce şerh; sonradan Gözcü Kulesi Cemiyeti'nce satın alınıp altmış yıl yeniden basıldı ve Yuhanna 1:1 tartışmasının çoğunlukla üstünde döndüğü metin oldu.
heroHeading=Emphatic Diaglott (satır arası)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson meslekten bir bilgin değildi. Illinois, Geneva'da gazete editörüydü; Yunancayı kendi kendine öğrendi ve 1857 ile 1863 arasında, parça parça, yalnızca çevirmekle kalmayıp imal de ettiği satır arası bir Yeni Antlaşma yayımladı: yeğeni, dizilmiş her sayfanın balmumu kalıbını alışını, bir bakır zar oluşsun diye onları gece boyu asit içinde asılı bırakışını, bakırın arkasını dökme madenle destekleyişini ve çocuk kalıbı mürekkepleyip dururken sonucu el presinde basışını seyretmişti. Tamamlanan cilt 1864'te çıktı. Yunanca için Johann Jakob Griesbach'ın 1770'lerde kurduğu metni, Codex Vaticanus'tan alınmış okumalarla birlikte kullandı.
hero.2=Wilson'ın gerçekte bastığı bir değil iki İngilizce metindi. Sayfanın solunda Yunanca, her sözcüğün altında birebir sözcüğü sözcüğüne İngilizce şerhle akıyordu; sağında ise kendi düzeltilmiş çevirisi, Emphatic Version. Bunlar aynı şey değildir ve Yuhanna 1:1'de açıkça çelişirler — şerh «and a god was the Word», Emphatic Version «and the LOGOS was God» der. İkisi de Wilson'ındır, aynı kitapta birkaç santim arayla basılmıştır. Bu derleme şerhi barındırır, yani insanların alıntıladığı sütunu; onun Kutsal Kitaplar ızgarasında değil de kendi bölümünde durmasının sebebi budur. Şerh, bir Yunanca cümlenin nasıl kurulduğunu kaydeder — hâl hâl, harf-i tarif harf-i tarif, Yunanca sözcük düzeninde. Cümlenin İngilizcede nasıl okunması gerektiğine dair bir hüküm değildir; Wilson'ın bu konudaki kendi hükmü yandaki sütunda basılıdır. Birini alıntılayanın, ötekinin var olduğunu bilmesi gerekir.
hero.3=Kitabın sonraki hayatı, çoğu kişinin ondan haberdar olmasının sebebidir. Wilson 1900'de, o sırada Yehova'nın Şahitleri adıyla var olan herhangi bir topluluğun değil, Church of the Blessed Hope'un üyesi olarak öldü. 1902'de Gözcü Kulesi Kitap ve Broşür Cemiyeti'nin başkanı Charles Taze Russell, telif hakkını Wilson'ın mirasçılarından, zamanla da kalıpları aldı. Cemiyet Diaglott'u sonraki altmış yıl boyunca bastı — 1927'de metni kendi preslerinde yeniden dizdi, yüz elli binin hayli üzerinde nüsha çekti, iki dolara sattı ve sonunda bedava dağıttı. Yani Diaglott, yazarlıkla değil sahiplenmeyle bir Yehova'nın Şahitleri kitabıdır; ve yazarların İbranice kutsal yazılardan alıntı yaparken κύριος yazdığı yerlerde Yeni Antlaşma'ya «Yehova» basma alışkanlığı, bu uygulamayı ünlendiren hareketten kırk yıl önce gelmiştir. Telif hakkı 1952'de düştü ve metin o günden beri kamu malıdır.
hero.4=Bu okuyucuda onunla ilgili iki şeyi kullanmadan önce bilmekte yarar var. Griesbach ne Elçilerin İşleri 8:37'yi ne de Luka 17:36'yı bastı, dolayısıyla ikisi de burada yok; boşluğu kapatıp sonraki her ayeti bir yukarı kaydırmak yerine numaralandırma bu iki yeri boş bırakır, böylece bir gönderme bu sütunda da yandakinde de aynı ayete düşer. Ayrıca ona kayıtlı bir öncel yoktur; bir Diaglott ayetinin altında açılan soy basamağı, daha eski bir İngilizce baskıya değil, özgün diller tabanına gider.
hero.5=O tabanın ne bastığı konusunda kesin olun. Gösterdiği Yunanca Textus Receptus'tur — etikette ≈ TR 1550 yazar ve o ≈, okuyucunun «bu baskının yapıldığı metni değil, Yunancaya bir tanık sunuyorum» deyişidir. Wilson Griesbach'tan çalıştı. İkisinin uyuştuğu yerde, Yuhanna 1:1'de olduğu gibi, basamak gerçekten de şerh edilen sözcüklerin ta kendisini gösterir. Ayrıldıkları yerde göstermez: Griesbach 1. Yuhanna 5:7'deki Üçlübirlik cümlesini reddetti, bu yüzden Diaglott'ta ondan eser yoktur; altındaki Textus Receptus satırı ise onu tam olarak taşır. Bütün önermesi Yunancanın sayfada, orada olması olan bir satır arası metinde, alıntı yapmadan önce bilinmeye değer tek boşluk budur.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Bu nedir
fact.1.value=satır altı şerh — Yunancanın altına basılan sözcüğü sözcüğüne İngilizce; Wilson'ın okunabilir çevirisi değil
fact.2.label=Derleyen
fact.2.value=Benjamin Wilson (1817–1900), kendi kendini yetiştirmiş bilgin ve Illinois, Geneva'da gazete editörü
fact.3.label=Yunanca metin
fact.3.value=Griesbach'ın resensiyonu, Codex Vaticanus'tan (Vatikan yazması 1209) okumalarla
fact.4.label=Yayımlanışı
fact.4.value=1857'den itibaren fasikküller hâlinde; 1864'te tek cilt olarak eksiksiz, New York'ta Fowler and Wells tarafından
fact.5.label=Nasıl basıldı
fact.5.value=Wilson her kalıbı kendi galvanoplasti yöntemiyle çıkardı ve ilk baskıyı el presinde çekti
fact.6.label=İlahi ad
fact.6.value=yazarların İbranice kutsal yazıdan alıntı yaparken κύριος yazdığı yerlerde Yeni Antlaşma'ya «Yehova» basar — [[ASV|American Standard Version]]'ın Eski Antlaşma boyunca verdiği kararın aynısı
fact.7.label=Devralan
fact.7.value=Gözcü Kulesi Kitap ve Broşür Cemiyeti; telif hakkını 1902'de Charles Taze Russell döneminde aldı, metni 1927'de yeniden dizdi ve 1960'lara dek bastı
fact.8.label=Lisans
fact.8.value=kamu malı — telif hakkı 1952'de düştü ve Gözcü Kulesi yeniden basımları yeni bir hak eklemedi
fact.9.label=Eksik iki ayet
fact.9.value=Elçilerin İşleri 8:37 ile Luka 17:36 Griesbach'ta yoktur, bu yüzden burada da yoktur; numaraları kapatılmak yerine boş bırakılır, böylece metin başka her baskıyla ayet ayet hizalı kalır
fact.10.label=Basamağın altındaki Yunanca
fact.10.value=≈ TR 1550 olarak gösterilen [[TR|Textus Receptus]] — Yunancaya bir tanık; Wilson'ın kaynak metni değil, ki o Griesbach'ın resensiyonuydu; ikisi Yuhanna 1:1'de uyuşur, 1. Yuhanna 5:7'de ayrılır
fact.11.label=Bu derlemede
fact.11.value=bir şerhin asla çeviri sanılmaması için, okuma amaçlı Kutsal Kitaplardan ayrı, kendi Satır Arası ve İnceleme Baskıları bölümünde tutulur; soy basamaklarında kayıtlı bir kaynak metni yoktur, bu yüzden basamak doğrudan özgün diller tabanına açılır
