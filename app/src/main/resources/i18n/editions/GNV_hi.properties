title=जिनेवा बाइबिल 1599 — इस संस्करण के बारे में | Common Root
description=जिनेवा बाइबिल: जिनेवा में निर्वासित अंग्रेज़ प्रोटेस्टेंटों द्वारा तैयार, पूरे पाठ में पद-संख्याओं और हाशिये की टिप्पणियों वाली पहली अंग्रेज़ी बाइबिल, शेक्सपियर की पीढ़ी की पढ़ी हुई, और किंग जेम्स संस्करण के नीचे का पायदान।
heroHeading=जिनेवा बाइबिल 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=यह बाइबिल विदेश में बनी, उन लोगों के हाथों जो सुरक्षित रूप से अपने घर नहीं रह सकते थे। 1553 में जब मेरी प्रथम गद्दी पर बैठीं और इंग्लैंड रोम की ओर लौटा, तब कुछ सौ प्रोटेस्टेंट देश छोड़ गए; उनमें से कुछ काल्विन के जिनेवा में बस गए, जहाँ छापेखाने थे, इब्रानी और यूनानी की विद्वत्ता थी, और कोई बिशप नहीं था जिसे उत्तर देना पड़े। विलियम व्हिटिंघम ने वहाँ 1557 में एक नया नियम प्रकाशित किया। एंथनी गिल्बी के नेतृत्व वाले दल ने पुराना नियम पूरा किया, और सम्पूर्ण बाइबिल 1560 में जिनेवा में रोलैंड हॉल द्वारा छापी गई — मेरी की मृत्यु के दो वर्ष बाद, जब अधिकांश निर्वासित लौट चुके थे।
hero.2=उन्होंने जो बनाया उसने अंग्रेज़ी बाइबिल का रूप ही बदल दिया। यह पहली बाइबिल थी जिसमें हर पद को संख्या दी गई, ताकि पाठक को अध्याय की नहीं, पंक्ति की ओर संकेत किया जा सके। यह गॉथिक के बजाय रोमन टाइप में छपी, और इतनी छोटी तथा इतनी सस्ती निकली कि इसे व्याख्यान-मंच से बाँधने के बजाय अपने पास रखा जा सके। और हाशिये भरे हुए थे: सन्दर्भ, कठिन शब्दों की व्याख्याएँ, मानचित्र, और यह बताने वाली टिप्पणियाँ कि किसी अंश का अर्थ क्या है। यही अन्तिम बात है जिसके कारण इसे चाहा गया और जिसके कारण इससे चिढ़ भी हुई। टिप्पणियाँ सुधारवादी हैं, कहीं-कहीं तीखी, और वे पाठक को राजाओं के विषय में क्या सोचना चाहिए यह उतनी ही सहजता से बताती हैं जितनी सहजता से सिद्धान्त के विषय में।
hero.3=इस संस्करण की तिथि पर एक चेतावनी आवश्यक है, क्योंकि जिनेवा बाइबिल एक पुस्तक नहीं थी, बल्कि अस्सी वर्षों तक पुनर्मुद्रित होता एक पाठ था जिसके अंग बदलते रहे। 1576 में लॉरेंस टॉमसन ने नए नियम के स्थान पर अपना संशोधन रखा, जो थियोडोर बेज़ा के 1565 के यूनानी संस्करण पर किया गया था, और 1587 से अधिकांश जिनेवा बाइबिलों में वही नया नियम मिलता है। 1599 में प्रकाशितवाक्य पर फ़्रांसिस्कस युनियस की टिप्पणियाँ जोड़ी गईं। अतः “1599” किसी मुद्रण-वर्ष से अधिक एक संयोजन का नाम है — टॉमसन का नया नियम और प्रकाशितवाक्य पर युनियस — और उस तिथि वाली बाइबिलें उसके बाद भी छपती रहीं। इसीलिए सूची-कार्ड वर्ष को रिक्त छोड़ता है, जबकि पायदान चिह्न, जिसे दिखाने के लिए कुछ संक्षिप्त चाहिए, GNV 1599 पढ़ता है।
hero.4=इस संग्रह में इसका स्थान एक कब्ज़े जैसा है। यहाँ की सबसे लम्बी वंश-शृंखला World English Bible से American Standard Version, फिर Revised Version, फिर किंग जेम्स संस्करण तक जाती है, और उसके बाद इस तक: किंग जेम्स के किसी पद के नीचे एक पायदान और खोलिए, तो उसके नीचे जिनेवा का पाठ प्रकट होता है — यह देखने का सबसे सीधा तरीक़ा कि किंग जेम्स में कितना विरासत में मिला है और कितना रचा गया है। जिनेवा के नीचे अंग्रेज़ी में और कुछ नहीं है — केवल यूनानी और इब्रानी, Textus Receptus और वेस्टमिंस्टर लेनिनग्राद संहिता, जहाँ सीढ़ी अपने तल तक पहुँच जाती है। पाठ वैसा ही दिया गया है जैसा संस्करण में है, वर्तनी सहित, इसलिए उत्पत्ति 1:1 में heauen लिखा मिलता है; भजनों के शीर्षक और इब्रानियों का पुष्पिका-वाक्य पहले पद के आरम्भ में ही चलते हैं, जैसा उन छपाइयों में था, और उन्हें हटाया नहीं गया।

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=भाषा
fact.1.value=अंग्रेज़ी — एलिज़ाबेथकालीन, अपनी मूल वर्तनी में
fact.2.label=किसने बनाई
fact.2.value=मेरी प्रथम के शासन से भागकर जिनेवा में बसे अंग्रेज़ प्रोटेस्टेंट — 1557 का नया नियम विलियम व्हिटिंघम ने और पुराना नियम एंथनी गिल्बी के दल ने किया
fact.3.label=पहला पूर्ण संस्करण
fact.3.value=1560, जिनेवा में रोलैंड हॉल द्वारा मुद्रित
fact.4.label=पुराना नियम
fact.4.value=मसोरेटिक इब्रानी से — [[WLC|वेस्टमिंस्टर लेनिनग्राद संहिता]] इस संग्रह में उसी पाठ की साक्षी है
fact.5.label=नया नियम
fact.5.value=[[TR|टेक्स्टस रेसेप्टुस]] परंपरा की यूनानी से; 1576 से लॉरेंस टॉमसन का संशोधन, जो बेज़ा के 1565 के यूनानी संस्करण पर किया गया था, अधिकांश छपाइयों में व्हिटिंघम के नए नियम की जगह ले गया
fact.6.label=“1599” किसका नाम है
fact.6.value=उन छपाइयों का जिनमें टॉमसन का नया नियम और प्रकाशितवाक्य पर फ़्रांसिस्कस युनियस की टिप्पणियाँ साथ हैं, जो उसी वर्ष जिनेवा बाइबिल में आईं
fact.7.label=पहल
fact.7.value=पूरे पाठ में पद-संख्याओं वाली पहली अंग्रेज़ी बाइबिल, गॉथिक के बजाय रोमन टाइप में, और हाशिये की टिप्पणियों के पूरे तंत्र के साथ — “अध्ययन बाइबिल” शब्द के बनने से पहले की अध्ययन बाइबिल
fact.8.label=आपत्ति करने वाले
fact.8.value=जेम्स प्रथम, जिन्हें हाशिये की टिप्पणियाँ राजद्रोही लगीं — यह शिकायत [[KJV|किंग जेम्स संस्करण]] को गति देने में सहायक बनी
fact.9.label=सूची में वर्ष
fact.9.value=“परिचय” कार्ड पर रिक्त, यद्यपि पायदान चिह्न पर GNV 1599 लिखा है — जिनेवा बाइबिल 1560 से 1640 के दशक तक पुनर्मुद्रित होती रही और उसका नया नियम तथा टिप्पणियाँ एक ही नाम के नीचे बदलती रहीं
fact.10.label=इस संग्रह में
fact.10.value=सभी 66 पुस्तकें, अपोक्रिफ़ा नहीं, वर्तनी अपरिवर्तित — उत्पत्ति 1:1 में “the heauen and the earth”
fact.11.label=पायदान के नीचे
fact.11.value=[[TR|टेक्स्टस रेसेप्टुस]] और [[WLC|वेस्टमिंस्टर लेनिनग्राद संहिता]]; जिनेवा बाइबिल स्वयं [[KJV|किंग जेम्स संस्करण]] के नीचे का पहला पायदान है
