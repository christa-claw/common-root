title=Sunan Ibn Majah — Acerca de esta edición | Common Root
description=Sunan Ibn Majah: el último de los Seis Libros del islam suní, organizado por tema jurídico, cuyo lugar entre ellos se discute desde antiguo por los hadices débiles y fabricados que también contiene.
heroHeading=Sunan Ibn Majah
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abdullah Muhammad ibn Yazid Ibn Majah al-Rabi'i al-Qazwini nació en el año 209 d. H. (824 d. C.) en Qazwin, hoy en el noroeste de Irán, en una familia de mawali (clientes no árabes) de la tribu de Rabi'ah —Majah, según un relato, era el apodo de su padre y no un nombre de abuelo ni de madre—. Viajó en busca de hadices por Iraq, el Hiyaz, Siria y Egipto, estudiando con un amplio círculo de eruditos; más de un cuarto de su futuro Sunan se apoyaría, según se dice, en un solo maestro, Ibn Abi Shaybah. Contemporáneos como Abu Ya'la al-Khalili lo elogiaron como fiable, destacado y una autoridad unánimemente reconocida. Murió en Qazwin en el año 273 d. H. (887 d. C.), aunque al-Kattani también registra el año 275 (889 d. C.); según el relato tradicional, después de que Ibn Majah le leyera el Sunan terminado, Abu Zur'a al-Razi observó que si la gente poseyera este libro, las demás colecciones de Sunan resultarían en gran medida innecesarias.
hero.2=Su Sunan abarca, según el cómputo de al-Dhahabi, unos 1.500 capítulos y unos 4.000 hadices, organizados por tema jurídico como las colecciones de [[ABD|Abu Dawud]] y de [[TIR|at-Tirmidhi]]. Junto a material válido y aceptable, contiene también hadices que eruditos posteriores juzgaron débiles, entre ellos una treintena aproximadamente que se consideran generalmente pura fabricación —razón por la que algunos eruditos cuentan solo "los Cinco" en vez de los Seis.
hero.3=La tradición suní sitúa el Sunan Ibn Majah como el último de los Seis Libros (Kutub al-Sitta), junto con el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]] y el [[NAS|Sunan an-Nasa'i]]. Ese sexto lugar se discute a su vez: los malikíes e Ibn al-Athir, entre otros, prefieren en su lugar el [[MAL|Muwatta Malik]], y algunos citan el Sunan de al-Daraqutni; se suele decir que el libro de Ibn Majah se quedó con el puesto porque su contenido se solapa menos con los otros cinco, no porque se le juzgue el más fiable de los candidatos.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-ibnmajah de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]], el [[NAS|Sunan an-Nasa'i]] y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

