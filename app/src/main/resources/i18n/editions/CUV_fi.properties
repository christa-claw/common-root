title=Chinese Union Version — Tietoja tästä laitoksesta | Common Root
description=Vuoden 1919 Chinese Union Version: kaksikymmentäyhdeksän vuotta komiteatyötä, jonka tuloksena syntyi Raamattu, jota kiinalaiset protestantit yhä lukevat — ja yksi ensimmäisistä kirjoitetulla puhekielisellä mandariinilla julkaistuista kirjoista.
heroHeading=Kiinan yhdistetty käännös
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=Vuonna 1890 Kiinassa toimineet protestanttiset lähetysjärjestöt kokoontuivat Shanghaihin ja myönsivät ongelman. Kiinankielisiä Raamattuja oli jo useita, eikä mikään niistä ollut toisen kanssa yhtä mieltä — ei sanamuodoista, ei nimien kirjoitusasusta, ei edes siitä, millä kielen tasolla kirjoittaa. Kokous päätti yhdestä käännöksestä, jota jokainen lähetys käyttäisi, ja antoi sille nimen yhdistetty käännös: 和合本, yhteen sovitettu teksti. Koska kirjoitettu kiina jakautui tuolloin sivistyneistön kirjakieleen ja kaikkien muiden puhekieleen, tilattiin kolme yhtä aikaa — kaksi kirjakiinaksi, yksi mandariiniksi.
hero.2=Mandariinikomitealta kului kaksikymmentäyhdeksän vuotta. Puheenjohtajana oli Calvin Wilson Mateer, amerikkalainen presbyteeri, joka oli ollut Shandongissa vuodesta 1863, ja hän kuoli 1908 työn ollessa kesken; hänen kokoamansa, puolentoista tusinan lähetysjärjestön miehistä koottu ryhmä jatkoi, samoin kuin heidän rinnallaan työskennelleet kiinalaiset oppineet, joiden nimiä lähetyskertomukset säilyttivät paljon huolimattomammin. He ottivat käännettäväkseen englantilaisen Revised Versionin ja tarkistivat sen sen taustalla olevaa hepreaa ja kreikkaa vasten — mikä asettaa aineiston oman Revised Versionin yhden askeleen tämän Raamatun yläpuolelle ja King James Versionin vielä yhden sen yläpuolelle. Kaksi kirjakiinaista laitosta yhdistettiin lopulta yhdeksi. Mandariininkielinen on se, joka jäi elämään.
hero.3=Se julkaistiin 1919, ja vuosiluku teki sen hyväksi enemmän kuin mikään komitea olisi voinut. Se oli neljännen toukokuuta liikkeen vuosi, jolloin kiinalaiset kirjoittajat alkoivat toden teolla hylätä kirjakielen puhekielen hyväksi, ja yhdistetty käännös ilmestyi yhtenä ensimmäisistä laajoista kirjoista, jotka oli jo valmiiksi kirjoitettu niin. Lähetyssaarnaajien keskinäisen kiistan ratkaisemiseksi tarkoitetusta käännöksestä tuli modernin kiinalaisen proosan merkkipaalu, ja sen sanontoja lainaavat ihmiset, jotka eivät ole koskaan avanneet Raamattua. Sitä on siitä lähtien painettu kahtena laitoksena, jotka eroavat toisistaan yhdessä sanassa — onko Jumala 神 vai 上帝 — ja välistys on säädetty niin, että molemmat laitokset taittuvat yhä sivu sivulta samoin.
hero.4=Tässä lukuohjelmassa se on ainoa kiinankielinen Raamattu, mikä ratkaisee sen käyttäytymisestä kaksi asiaa. Aseta käyttöliittymä kiinaksi, ja tämä on se, joka avautuu — ei siksi että se olisi valittu, niin kuin Reina-Valera 1909 on valittu espanjalle, vaan siksi ettei luettelo löydä kielestä toista Raamattua. Ja polveutumisaskelmissa sillä ei ole kirjattua kantatekstiä, joten jakeen alla oleva askelma vie suoraan ≈-merkittyyn alkukielten pohjaan, vaikka Revised Version, josta se tehtiin, on aineistossa yhden palstan päässä. Askelmamerkintänsä se kuitenkin kantaa vuosiluvun kanssa, 1919, mitä eivät kaikki täkäläiset laitokset tee.

