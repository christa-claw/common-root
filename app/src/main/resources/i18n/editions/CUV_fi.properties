fact.1.label=Kieli
fact.1.value=kiina — puhekielinen mandariini (官話 / baihua), ei kirjakiina
fact.2.label=Omakielinen nimi
fact.2.value=和合本 (héhéběn) — “yhteen sovitettu” eli “yhdistetty” käännös
fact.3.label=Tilaaja
fact.3.value=Shanghain protestanttisten lähetyssaarnaajien yleiskokous 1890
fact.4.label=Kääntäjät
fact.4.value=useasta protestanttisesta lähetysjärjestöstä koottu komitea; amerikkalainen presbyteeri Calvin Wilson Mateer (1836–1908) johti mandariiniryhmää kuolemaansa asti, kiinalaisten työtovereidensa kanssa koko ajan
fact.5.label=Julkaistu
fact.5.value=1919, kahdenkymmenenyhdeksän vuoden työn jälkeen
fact.6.label=Tekstipohja
fact.6.value=englantilainen Revised Version työpohjana, tarkistettuna hepreaa ja kreikkaa vasten — sama [[RV|Revised Version]], joka on tässä aineistossa
fact.7.label=Kaksi laitosta
fact.7.value=Shen-laitos (神版) ja Shangdi-laitos (上帝版), jotka eroavat vain siinä, kumpi kiinan sana kantaa merkitystä “Jumala”
fact.8.label=Myöhempi tarkistus
fact.8.value=Revised Chinese Union Version, Uusi testamentti 2006 ja koko Raamattu 2010 — ei tämä teksti
fact.9.label=Tässä aineistossa
fact.9.value=ainoa kiinankielinen Raamattu täällä, joten kiinankielinen käyttöliittymä avaa sen oletuksena; polveutumisaskelmiin ei ole kirjattu kantatekstiä, mutta askelmamerkintä kantaa vuosiluvun 1919
