title=Yorumsuz Türkçe Çeviri — この版について | Common Root
description=Yorumsuz Türkçe Çeviri(YTC):イスマイル・セリンケンがeBible.orgと共同でワールド・イングリッシュ・バイブルから翻訳した現代トルコ語訳聖書。CC BY-ND 4.0の下でライセンスされ、このコーパスが標準で開くトルコ語テキストである。
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri——文字どおりには「注釈のない」あるいは「解説のない」トルコ語訳——は、イスマイル・セリンケンがeBible.orgと共同で完成させた現代トルコ語訳聖書であり、著作権表示は2023年から2025年にわたる。その名称自体が方法を宣言している。説明的な注釈や解釈的な言い換えを意図的に排し、整えられた慣用句よりも底本への透明性を重んじる、素朴な逐語的な訳である。
hero.2=その底本は、正直に言えば、ヘブライ語・アラム語・ギリシャ語ではなく英語である。この翻訳自身の著作権ページは、それがワールド・イングリッシュ・バイブルから訳出されたと記しており、これによって本訳は原語から直接訳されたものではなく、二次的な翻訳となる——このコーパスにある他の大半の聖書とは異なる点である。Common Rootはまず、今ではトルコでパブリックドメインとなるほど古い、1941年の歴史的トルコ語聖書(Kitabı Mukaddes)の公開版を探したが、使用可能な電子的な底本は見つからなかった。Yorumsuz Türkçe Çeviriは、当時入手できた唯一の自由ライセンスのトルコ語聖書であった。このコーパスのテキストはeBible.orgのUSFM配布版によるもので、そこではturytcとして目録化されている。
hero.3=その訳出の選択は、伝統的というより現代的な性格を帯びている。神の固有の名を、慣例的なトルコ語の「RAB」や「Yehova」ではなくYahveとして与え、出エジプト記3:14-15を根拠としている。また、イエスの名を、慣れ親しまれたトルコ語のİsaではなくYeşuaとして与えており、他の固有名詞はそのまま通常の形で残している。標準的な66書からなるプロテスタント正典に従い、第二正典は含まない。
hero.4=本訳はこのコーパスで唯一のトルコ語訳聖書であり、そのためトルコ語インターフェースは標準でこの版を開く。

