title=Hebrew Bible — About This Edition | Common Root
description=The whole Bible in Hebrew: the Masoretic Old Testament together with Franz Delitzsch's New Testament of 1877, translated back into the Hebrew of the Mishnah for readers who wanted the book entire in one language.
heroHeading=Hebrew Bible — Masoretic Old Testament and Delitzsch New Testament
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=A Bible in Hebrew from cover to cover is a stranger object than it sounds, because half of it was never written in Hebrew. The Old Testament is Hebrew and always was. The New Testament came down in Greek. So an edition like this one is two different kinds of text stitched together: an original, and a translation made in the opposite direction from the usual — out of Greek and back into the language its writers mostly spoke.
hero.2=The New Testament half is the work of Franz Delitzsch, a Leipzig scholar of Hebrew and of rabbinic literature, commissioned by the British and Foreign Bible Society in 1873 and finished in 1877. He did not translate into the Hebrew of his own century. He wrote in the Hebrew of the Mishnah and of the Second Temple period, on the argument that a first-century text should sound like one — so the result reads less as a rendering into Hebrew than as an attempt to recover what the sentences might have been before they were Greek. It is still the Hebrew New Testament most often reached for.
hero.3=Which Greek he worked from was decided partly for him. He began from Codex Sinaiticus, the fourth-century manuscript found a few decades earlier, and the Bible Society — whose policy was to publish from the received text — declined to carry on funding a version built on it. Delitzsch went back to the Textus Receptus and marked the significant Sinaitic readings rather than adopting them. The text then kept moving for thirteen years and ten editions, the last of them seen through the press by Gustav Dalman in 1890, the year Delitzsch died. That is one reason the catalogue leaves this edition's year blank: the two halves share no date, and the half that has dates has ten of them.
hero.4=In this reader it is the edition a Hebrew interface opens on — a curated choice, not alphabetical accident — and selecting Hebrew flips the whole interface right to left around it. It sits beside the Westminster Leningrad Codex rather than competing with it: the Codex is the scholarly Tanakh, fully pointed and cantillated and stopping where the Old Testament stops, while this is a plain consonantal text that continues through Revelation. The lineage rungs record no parent for it, so a rung opened beneath a verse drops straight to the original-language floor, ≈ WLC and ≈ TR. Elsewhere in this corpus that floor is an approximation, which is what the ≈ is warning about. Here it very nearly is not: the Old Testament on screen is the Masoretic text, and the Textus Receptus is what Delitzsch actually had in front of him.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Language
fact.1.value=Hebrew — consonantal text without vowel points or cantillation marks
fact.2.label=What it is
fact.2.value=Two texts bound as one Bible: the traditional Masoretic Old Testament, and a Hebrew New Testament translated from the Greek in the nineteenth century
fact.3.label=New Testament by
fact.3.value=Franz Delitzsch (1813–1890), the Leipzig Hebraist
fact.4.label=Commissioned by
fact.4.value=The British and Foreign Bible Society in 1873; the translation was finished in 1877
fact.5.label=Old Testament from
fact.5.value=The Masoretic Hebrew itself — not a translation, which makes this the one edition here whose Old Testament is already in its original language, as [[WLC|the Westminster Leningrad Codex]] is
fact.6.label=New Testament from
fact.6.value=The Greek of the [[TR|Textus Receptus]]. Delitzsch began instead from Codex Sinaiticus, but the Bible Society published from the received text and would not fund the departure
fact.7.label=Register
fact.7.value=Not modern Hebrew. Delitzsch wrote in the Hebrew of the Mishnah and the Second Temple period, trying to give the Greek back the idiom its speakers would have used
fact.8.label=Revised until
fact.8.value=1890, the last edition seen through the press by Gustav Dalman
fact.9.label=Not to be confused with
fact.9.value=The Modern Hebrew New Testament issued by the Bible Society in Israel, a separate twentieth-century translation still in copyright
fact.10.label=Year in the catalogue
fact.10.value=Left blank — the two halves share no year, and the New Testament alone was revised across thirteen years and ten editions
fact.11.label=In this corpus
fact.11.value=All 66 books, and the curated default for a Hebrew interface — the reader opens on this rather than on [[WLC|the Westminster Leningrad Codex]], because this one runs the whole way through the New Testament
