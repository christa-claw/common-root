title=Codex de Léningrad — À propos de cette édition | Common Root
description=Le Codex de Léningrad : le plus ancien manuscrit complet de la Bible hébraïque, copié en 1008 et toujours le texte de base de la plupart des traductions modernes de l'Ancien Testament.
heroHeading=Codex de Léningrad
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=C'est le plus ancien manuscrit complet de la Bible hébraïque qui nous soit parvenu. Il a été copié par un scribe nommé Samuel ben Jacob, qui travaillait au Vieux Caire et qui, dans une note de sa main à la fin du manuscrit, a daté son travail de l'an 1008.
hero.2=Samuel ben Jacob n'inventait pas un texte, il en conservait un. Il travaillait dans la tradition de la famille Ben Asher, les plus grandes autorités en matière de massore — ce système élaboré de points-voyelles, de signes de cantillation et de notes marginales que les savants juifs avaient mis des siècles à affiner pour fixer la prononciation de la Bible hébraïque et la préserver de toute altération. Un manuscrit Ben Asher plus ancien, et sans doute plus autorisé, a bien survécu — le Codex d'Alep — mais une grande partie de sa section de la Torah a disparu en 1947. Si le Codex de Léningrad est précieux, c'est précisément parce qu'il est complet et assez ancien pour se tenir à la source même de cette tradition.
hero.3=Il tient son nom de la ville où il a fini par se trouver : Léningrad, nom que portait Saint-Pétersbourg lorsque le manuscrit est entré dans l'érudition occidentale, et qui lui est resté même après que la ville eut repris le sien en 1991. Il est aujourd'hui à la base de la Biblia Hebraica Stuttgartensia, l'édition savante de référence de la Bible hébraïque — ce qui veut dire que presque toute traduction moderne de l'Ancien Testament, dans presque toutes les langues, remonte au travail patient de ce seul scribe cairote du XIe siècle, que ses lecteurs connaissent son nom ou non.

