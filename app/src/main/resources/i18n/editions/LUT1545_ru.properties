title=Luther Bibel 1545 — Об этом издании | Common Root
description=Ausgabe letzter Hand Лютера: виттенбергская Библия 1545 года, последнее издание, которое Мартин Лютер выправил сам, и текст, ставший образцом после его смерти.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Не первая Библия Лютера, а последняя. Новый Завет, сделанный им в Вартбурге, вышел в 1522 году, полная Библия — в 1534; он правил её ещё десятилетие, и издание, которое Ханс Луфт напечатал в Виттенберге в 1545 году, — последнее, доведённое Лютером до конца собственной рукой. По-немецки его называют Ausgabe letzter Hand, издание последней руки. Он умер в феврале следующего года, и этот текст стал мерой, по которой равнялись позднейшие лютеровские Библии.
hero.2=Он работал с подлинниками, а не с латынью: печатный греческий Эразма для Нового Завета, масоретский еврейский для Ветхого, с кругом виттенбергских коллег для разбора трудных мест. Вышедшее сделало для немецкого примерно то, что Библия 1642 года сделает для финского столетием позже. Язык многих говоров и малой устоявшейся прозы получил единый строй, доступный чтению всех, и из него выросла современная письменная норма.
hero.3=Здесь встречаются две цепи. Luther Bibel 1912 стоит прямо над этим изданием, будучи его правкой. Так же стоит и Библия 1642 года, тремя ступенями выше по финской линии, потому что комиссия в Турку работала с раскрытым Лютером. Ниже лестница достигает дна — Textus Receptus для греческого, Ленинградский кодекс для еврейского, — и эти ступени сплошные, а не помечены знаком ≈, потому что греческий Эразма и масоретский еврейский суть то, с чего Лютер действительно переводил, а не свидетели, подставленные позже.

