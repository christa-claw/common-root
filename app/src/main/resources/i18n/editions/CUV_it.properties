title=Chinese Union Version — Su questa edizione | Common Root
description=La Chinese Union Version del 1919: ventinove anni di lavoro di commissione da cui è uscita la Bibbia che i protestanti cinesi leggono ancora, e uno dei primi libri mai pubblicati in mandarino vernacolo scritto.
heroHeading=Versione cinese dell'Unione
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=Nel 1890 le missioni protestanti attive in Cina si riunirono a Shanghai e ammisero un problema. Bibbie cinesi ce n'erano già parecchie, e non ce n'erano due che andassero d'accordo: né sulla formulazione, né sulla grafia dei nomi, né tanto meno su quale registro del cinese adoperare. La conferenza deliberò un'unica traduzione di cui ogni missione si sarebbe servita, e la chiamò versione dell'unione: 和合本, il testo armonizzato. Poiché il cinese scritto era allora spaccato fra la lingua letteraria dei colti e la lingua parlata di tutti gli altri, ne commissionarono tre in una volta — due in cinese letterario, una in mandarino.
hero.2=Alla commissione del mandarino occorsero ventinove anni. La presiedette Calvin Wilson Mateer, presbiteriano americano che stava nello Shandong dal 1863, e morì nel 1908 con l'opera incompiuta; il gruppo che aveva messo insieme da una mezza dozzina di missioni tirò avanti, e con esso i dotti cinesi che lavoravano al loro fianco e i cui nomi le carte missionarie hanno conservato con assai minor cura. Presero la Revised Version inglese come il testo che stavano rendendo e la riscontrarono sull'ebraico e sul greco che le stanno sotto — il che colloca la Revised Version del corpus stesso un piolo a monte di questa Bibbia, e la King James Version un piolo più su. Le due versioni letterarie furono alla fine fuse in una sola. La versione in mandarino è quella che è sopravvissuta.
hero.3=Uscì nel 1919, e la data fece per lei più di quanto avrebbe potuto qualunque commissione. Fu l'anno del Movimento del Quattro Maggio, quando gli scrittori cinesi cominciarono sul serio ad abbandonare la lingua letteraria per il vernacolo, e la versione dell'unione arrivò come uno dei primissimi libri di mole già scritti in quel modo. Una traduzione fatta per chiudere una lite fra missionari divenne una pietra miliare della prosa cinese moderna, e i suoi giri di frase li citano persone che non hanno mai aperto una Bibbia. Da allora si stampa in due edizioni che differiscono per una sola parola — se Dio sia 神 oppure 上帝 —, con la spaziatura regolata perché entrambe le edizioni spezzino ancora le pagine allo stesso punto.
hero.4=In questo lettore è l'unica Bibbia cinese, e questo decide due cose del suo comportamento. Si metta l'interfaccia in cinese ed è questa che si apre: non perché sia stata scelta, come per lo spagnolo è stata scelta la Reina-Valera 1909, ma perché il catalogo non trova altra Bibbia in quella lingua. E nei pioli della discendenza non le è registrato alcun antecedente, sicché un piolo sotto un versetto scende dritto al pavimento delle lingue originali segnato con ≈, per quanto la Revised Version da cui è stata fatta stia nel corpus a una colonna di distanza. Il suo segno di piolo porta invece un anno, 1919, cosa che non fa ogni edizione di qui.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=cinese — mandarino vernacolo (官話 / baihua), non cinese letterario
fact.2.label=Nome proprio
fact.2.value=和合本 (héhéběn) — la versione “armonizzata” ovvero “unita”
fact.3.label=Commissionata da
fact.3.value=la Conferenza generale dei missionari protestanti di Shanghai del 1890
fact.4.label=Tradotta da
fact.4.value=una commissione tratta da più missioni protestanti; il presbiteriano americano Calvin Wilson Mateer (1836-1908) presiedette il gruppo del mandarino fino alla morte, lavorando per tutto il tempo con colleghi cinesi
fact.5.label=Pubblicata
fact.5.value=nel 1919, dopo ventinove anni di lavoro
fact.6.label=Base testuale
fact.6.value=la Revised Version inglese come base di lavoro, riscontrata sull'ebraico e sul greco — la stessa [[RV|Revised Version]] che questo corpus custodisce
fact.7.label=Due edizioni
fact.7.value=l'edizione Shen (神版) e l'edizione Shangdi (上帝版), che differiscono soltanto per quale parola cinese porti “Dio”
fact.8.label=Revisione posteriore
fact.8.value=la Revised Chinese Union Version, Nuovo Testamento nel 2006 e Bibbia intera nel 2010 — non questo testo
fact.9.label=In questo corpus
fact.9.value=l'unica Bibbia cinese qui, sicché un'interfaccia in cinese vi si apre per impostazione predefinita; nei pioli della discendenza non è registrato alcun antecedente, ma il suo segno di piolo porta l'anno 1919
