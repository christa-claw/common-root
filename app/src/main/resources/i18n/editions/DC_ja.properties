title=教義と聖約 — この版について | Common Root
description=教義と聖約：ジョセフ・スミスが記録した啓示およびその他の言明。1835年にオハイオ州カートランドで最初に出版され、末日聖徒によって聖書とともに聖典として読まれている。
heroHeading=教義と聖約
readerHref=/reader?c1.src=dc

hero.1=教義と聖約は、ジョセフ・スミス・ジュニアが神からの直接の伝達として受けたと述べた啓示、幻、その他の言明を収めたものであり、おもに教会最初期のオハイオ州、ミズーリ州、ニューヨーク州において記録された。「キリストの教会の統治のための戒めの書」と題された以前の編纂物は、ミズーリ州インディペンデンスの教会の印刷所で印刷中であったが、1833年7月に暴徒が印刷所を破壊し、書物が完成する前に未完成の紙葉を散逸させた。この書物は正式に刊行されることはなかったが、当時救出された製本前の紙葉のうち少数が今日まで残っている。
hero.2=増補され改題された「末日聖徒イエス・キリスト教会の教義と聖約」が1835年に続いて刊行され、オハイオ州カートランドで出版された。これはジョセフ・スミス、オリバー・カウドリ、シドニー・リグドン、フレデリック・G・ウィリアムズの四人からなる委員会によって編纂され、承認された。この最初の版は、一つの表紙のもとに二種類の資料をまとめていた——カートランド・スクールで行われた一連の神学講義で、書の「教義」として示されたものと、記録された啓示そのもので、書の「聖約」として示されたものである。これらの講義は、その後Lectures on Faithとして知られるようになったが、のちに書から取り除かれた——この変更はおおむね1921年版に由来するとされる——その結果、啓示が作品全体を成すこととなった。
hero.3=この書は、聖書のような書・章・節ではなく、番号を付した「セクション」に分けられている。これはこの書の性質、すなわち一つの連続した物語ではなく、別々の文書を集めたものであることを反映している。内容も番号付けも19世紀の諸版を通じて変化し、オーソン・プラットによる1876年版は以前の資料を再編成し、新たな啓示を加えた。現代版は1981年に現在の形となり、栄光の諸段階に関する幻と死者の贖いに関する幻という二つの項目がさらに第137節と第138節として加えられ、これに「公式宣言」二件——1890年の、新たな複数婚への教会の承認を終わらせた宣言と、1978年の、人種にかかわらずすべての資格ある男性会員に神権任命を拡大した宣言——が加わった。2013年版はさらに参考資料を更新した。現在使われている標準版は138のセクションと二つの公式宣言を収めている。
hero.4=この書は、末日聖徒運動が「標準聖典」と呼ぶ四つの書の一つであり、聖書、[[BOM|モルモン書]]、[[PGP|高価な真珠]]とともに数えられる。同じ運動から分かれた別教派であるCommunity of Christは、これとは別に独自の番号付けと更新を行う独自の教義と聖約を保持している。この資料体に収められている本文は、Mormon Documentation ProjectのJSONエクスポートに由来し、これは[[BOM|モルモン書]]や[[PGP|高価な真珠]]にも用いられている同じパブリックドメインの資料体であり、ここでは「教義と聖約」という一つの書として、各セクションが章に相当する形で示されている。本文は現行の標準版の文言に従い、著作権で保護されている脚注と章の見出しは含まれていない。そのため、単一の出版年はここに記していない。

