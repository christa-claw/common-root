fact.2.label=制作者
fact.2.value=ジョセフ・スミス・ジュニア（1805–1844）が神からの直接の伝達として受けたと述べた啓示およびその他の言明。のちの少数の項目、とくに二つの公式宣言は、教会会長としての後継者たちによるものである
fact.3.label=出版
fact.3.value=1835年、オハイオ州カートランド。未完成であった1833年の戒めの書を増補したもので、ジョセフ・スミス、オリバー・カウドリ、シドニー・リグドン、フレデリック・G・ウィリアムズからなる委員会が編纂し、承認した
fact.4.label=構成
fact.4.value=書・章・節ではなく、番号を付した138のセクションと二つの公式宣言。この資料体では、各セクションが「教義と聖約」という一つの書の中の章に相当する
fact.5.label=位置づけ
fact.5.value=末日聖徒運動の四つの標準聖典の一つで、聖書、[[BOM|モルモン書]]、[[PGP|高価な真珠]]とともに数えられる
fact.6.label=このコーパスでは
fact.6.value=本文は、Mormon Documentation Projectがパブリックドメインと宣言したJSONエクスポートに由来する現行の標準的な文言に従っている——これは[[BOM|モルモン書]]や[[PGP|高価な真珠]]と同じ資料体である。著作権で保護されている脚注と章の見出しは含まれていない——そのためここでは単一の出版年を示していない
