title=布伦顿英文七十士译本 — 关于本版本 | Common Root
description=兰斯洛特·布伦顿爵士所译的希腊文旧约英译本，1844年首次在伦敦出版，1851年连同次经再版——100多年间，它就是英语世界的七十士译本；在本阅读器中，它是其所据希腊文本之上的一级。
heroHeading=布伦顿英文七十士译本
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=兰斯洛特·查尔斯·李·布伦顿（1807–1862）是英国皇家海军将领杰赫利尔·布伦顿爵士之子，在牛津大学奥里尔学院毕业2年后，于1830年在英格兰教会领受圣职。他在其中并未久留。他在牛津结识了约翰·纳尔逊·达秘，到1831年底已离开国教会，在巴斯创立了一所独立礼拜堂；到1835年，这所礼拜堂已与普利茅斯弟兄会相连，而这一运动当时正由达秘塑造。达秘本人的圣经译本也收在本语料库中，有法文本，也有英文本。1844年，布伦顿承袭了父亲的准男爵爵位，同年，伦敦的塞缪尔·巴格斯特父子公司出版了他的七十士译本译文。1862年他在怀特岛去世，没有子嗣，是这一支的最后一位准男爵。
hero.2=它并不是第一部英文七十士译本——查尔斯·汤姆森已于1808年在费城出版过一部——但流传下来的是它：在150多年里，直到2007年 New English Translation of the Septuagint 问世，凡是想读希腊文旧约而非希伯来文旧约的英语读者，读的都是布伦顿。他主要依据梵蒂冈抄本翻译，那是梵蒂冈图书馆所藏的4世纪抄本。第一版没有收入次经；1851年版加入了次经，本副本所重现的正是1851年的文本。巴格斯特的希英对照版把希腊文排在英文旁边，而那份希腊文在本语料库中是另一个独立版本。由于英文紧随希腊文，希腊文怎么读，它就怎么读：诗篇保留希腊文编号，所以这里的第22篇是牧者之诗；以赛亚书7:14 的“a virgin shall conceive”译的是希腊文 parthenos，而不是希伯来文 ʿalmah。
hero.3=在本阅读器中，它是一级只有一个母本、而且是字面意义上的母本的文本：其下的希腊文七十士译本，正是布伦顿所译的文本，由他自己的出版商与他的英文并排印行。在它的某一节下展开一级，希腊文便会出现，再往下是作为原文底层的列宁格勒抄本。语料库中没有任何文本反过来立于它之上。我们的副本比原书窄。它有37卷，即希伯来正典中同样以通常名称出现的那些书卷。它所取自的 eBible.org 文件还包含次经——多俾亚传、友弟德传、智慧篇、德训篇、巴路克书、4卷马加比书等——并且以斯帖记和但以理书只以较长的希腊文形式给出。这些都没有进入本语料库，所以这里既没有以斯帖记，也没有但以理书；在下层希腊文有多俾亚传或智慧篇的地方，其上没有英文。以斯拉记与尼希米记在这里是2卷，而下层希腊文中是1卷。同一译本的拼写更新版，即亚当·博伊德2020年的 Updated Brenton，作为独立版本收在本语料库中。

