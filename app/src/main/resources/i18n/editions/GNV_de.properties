fact.1.label=Sprache
fact.1.value=Englisch — elisabethanisch, in ursprünglicher Schreibung
fact.2.label=Gemacht von
fact.2.value=englischen Protestanten, die vor der Regierung Marias I. geflohen waren und sich in Genf niederließen — William Whittingham besorgte das Neue Testament von 1557, eine Gruppe unter Anthony Gilby das Alte
fact.3.label=Erste vollständige Ausgabe
fact.3.value=1560, in Genf gedruckt von Rowland Hall
fact.4.label=Altes Testament aus
fact.4.value=dem masoretischen Hebräisch — [[WLC|der Westminster Leningrad Codex]] ist in diesem Korpus der Zeuge dieses Textes
fact.5.label=Neues Testament aus
fact.5.value=dem Griechischen der [[TR|Textus-Receptus]]-Linie; ab 1576 verdrängte Laurence Tomsons Revision, gegen Bezas griechische Ausgabe von 1565 gearbeitet, Whittinghams Neues Testament in den meisten Drucken
fact.6.label=Was „1599“ benennt
fact.6.value=Drucke mit Tomsons Neuem Testament samt Franciscus Junius' Anmerkungen zur Offenbarung, die in jenem Jahr in die Genfer Bibel kamen
fact.7.label=Neuerungen
fact.7.value=die erste englische Bibel mit durchgehend nummerierten Versen, in Antiqua statt Fraktur gesetzt und mit einem vollständigen Apparat von Marginalien versehen — eine Studienbibel, bevor es das Wort dafür gab
fact.8.label=Beanstandet von
fact.8.value=Jakob I., der die Marginalien für aufrührerisch hielt — eine Beschwerde, die [[KJV|die King-James-Bibel]] mit in Gang setzte
fact.9.label=Jahr im Katalog
fact.9.value=leer auf der Über-Karte, obwohl der Sprossen-Chip GNV 1599 anzeigt — die Genfer Bibel wurde von 1560 bis in die 1640er Jahre nachgedruckt, wobei ihr Neues Testament und ihre Anmerkungen unter demselben Namen wechselten
fact.10.label=In diesem Korpus
fact.10.value=alle 66 Bücher, keine Apokryphen, Schreibung nicht modernisiert — 1. Mose 1,1 lautet „the heauen and the earth“
fact.11.label=Unter einer Sprosse
fact.11.value=[[TR|Textus Receptus]] und [[WLC|Westminster Leningrad Codex]]; die Genfer Bibel ist selbst die erste Sprosse unter [[KJV|der King-James-Bibel]]
