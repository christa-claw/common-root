title=Genfer Bibel 1599 — Über diese Ausgabe | Common Root
description=Die Genfer Bibel: von englischen Protestanten im Genfer Exil gemacht, die erste englische Bibel mit durchgehend nummerierten Versen und Marginalien, gelesen von Shakespeares Generation und die Sprosse unter der King-James-Bibel.
heroHeading=Genfer Bibel 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Diese Bibel entstand im Ausland, gemacht von Menschen, die nicht gefahrlos zu Hause bleiben konnten. Als Maria I. 1553 den Thron bestieg und England nach Rom zurückkehrte, verließen einige Hundert Protestanten das Land; ein Teil von ihnen ließ sich in Calvins Genf nieder, wo es Druckerpressen gab, hebräische und griechische Gelehrsamkeit und keinen Bischof, dem Rechenschaft zu geben war. William Whittingham veröffentlichte dort 1557 ein Neues Testament. Eine Gruppe unter Anthony Gilby arbeitete sich durch das Alte Testament, und die vollständige Bibel wurde 1560 in Genf von Rowland Hall gedruckt, zwei Jahre nach Marias Tod, als die meisten Exilanten längst heimgekehrt waren.
hero.2=Was sie hervorbrachten, veränderte das Aussehen einer englischen Bibel. Sie war die erste, die jeden Vers nummerierte, so dass ein Leser auf eine Zeile statt auf ein Kapitel verwiesen werden konnte. Sie wurde in Antiqua statt in Fraktur gesetzt und klein und billig genug herausgebracht, um besessen statt an ein Lesepult gekettet zu werden. Und die Ränder waren voll: Querverweise, Erklärungen schwieriger Wörter, Karten und Anmerkungen dazu, was eine Stelle bedeutete. Gerade das Letzte ist der Grund, warum sie geliebt und warum sie übelgenommen wurde. Die Anmerkungen sind reformiert, stellenweise scharf, und sie sagen dem Leser ebenso bereitwillig, was er über Könige zu denken hat, wie das, was er über die Lehre zu denken hat.
hero.3=Die Jahreszahl dieser Ausgabe verlangt einen Vorbehalt, denn die Genfer Bibel war kein Buch, sondern ein achtzig Jahre lang nachgedruckter Text, dessen Teile sich änderten. 1576 ersetzte Laurence Tomson das Neue Testament durch seine eigene Revision, gegen Theodore Bezas griechische Ausgabe von 1565 gearbeitet, und ab 1587 ist es dieses Neue Testament, das die meisten Genfer Bibeln tragen. 1599 kamen Franciscus Junius' Anmerkungen zur Offenbarung hinzu. „1599“ benennt also eher eine Zusammenstellung — Tomsons Neues Testament samt Junius zur Offenbarung — als ein Druckjahr, und Bibeln mit dieser Jahreszahl wurden auch danach noch gedruckt. Darum lässt die Katalogkarte das Jahr leer, während der Sprossen-Chip, der etwas Kurzes zum Anzeigen braucht, GNV 1599 liest.
hero.4=Ihr Platz in dieser Sammlung ist ein Scharnier. Die längste Abstammungskette hier führt von der World English Bible über die American Standard Version und die Revised Version zur King-James-Bibel und von dort hierher: Öffnet man unter einem King-James-Vers eine Sprosse weiter, erscheint darunter der Genfer Wortlaut — die einfachste Art zu sehen, wie viel an der King-James-Bibel ererbt und nicht verfasst ist. Unter der Genfer folgt nichts Englisches mehr — nur das Griechische und das Hebräische, Textus Receptus und Westminster Leningrad Codex, wo die Leiter ihren Boden erreicht. Der Text steht so, wie die Ausgabe ihn hat, Schreibung und alles, also sagt 1. Mose 1,1 heauen; die Psalmenüberschriften und der Kolophon zum Hebräerbrief laufen im Anfang des ersten Verses mit, wie jene Drucke sie setzten, und sind dort belassen statt herausgeputzt worden.

