title=Jami` at-Tirmidhi — Acerca de esta edición | Common Root
description=Jami` at-Tirmidhi: la colección de hadices que Abu Isa at-Tirmidhi construyó calificando abiertamente la fuerza de cada relato y registrando los argumentos jurídicos que los juristas extrajeron de ella — contada entre los Seis Libros del islam suní.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi nació hacia el año 209 d. H. (824 d. C.) cerca de Termez, en Jorasán, en lo que hoy es la frontera entre Uzbekistán y Afganistán. Comenzó a estudiar hadices hacia los veinte años y viajó a partir del año 235 d. H. por Jorasán, Iraq y el Hiyaz en su busca, estudiando principalmente con Muhammad al-Bukhari —su principal maestro— así como con Muslim ibn al-Hajjaj, Abu Dawud al-Sijistani, Qutaybah ibn Sa'id y Ali ibn Hujr. Quedó ciego en sus últimos años, de donde proviene su sobrenombre «ad-Darir» («el Ciego»). Regresó a la zona de Termez, donde murió el 13 de rayab del año 279 d. H. (9 de octubre de 892 d. C.) a los setenta años aproximadamente.
hero.2=Su título completo, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, se abrevia habitualmente como Jami' at-Tirmidhi o Sunan at-Tirmidhi. Mientras que Sahih al-Bukhari y Sahih Muslim solo admiten hadices que sus compiladores juzgaron plenamente auténticos, at-Tirmidhi calificó cada hadiz abiertamente dentro del propio texto —sahih, hasan, da'if o gharib— y explicó los motivos de una calificación más débil en lugar de omitir el hadiz; también expuso en qué puntos diferían las escuelas jurídicas (madhahib) y qué pruebas invocaba cada parte, lo que convierte al libro tanto en una guía del razonamiento jurídico basado en hadices como en una colección de hadices en sí misma.
hero.3=La tradición suní lo cuenta entre los Seis Libros, generalmente después de Sahih al-Bukhari, Sahih Muslim y Sunan Abi Dawud; el lugar exacto que ocupa entre los libros restantes —y qué colección ocupa el sexto puesto, siendo Sunan Ibn Majah la respuesta habitual pero no la única propuesta históricamente— se ha discutido largamente sin llegar a zanjarse, como ocurre con las demás colecciones Sunan de este corpus. El número de hadices que se da para el libro varía por la misma razón: unos 4.330 según el cómputo tradicional, citado en otros lugares como unos 4.400; también su estructura se describe de formas distintas, como 46 libros, 49 capítulos en la edición de El Cairo de Ahmad Muhammad Shakir, o cincuenta capítulos. La cifra propia de este corpus es todavía otra cifra más: 49 libros y 3.998 hadices numerados, la forma de la edición digital de la que se tomó, no una pretensión de reproducir ninguna tradición impresa concreta.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-tirmidhi de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud y sus traducciones del Corán. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

