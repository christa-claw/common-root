fact.6.label=Posición
fact.6.value=contado entre los Seis Libros del islam suní (Kutub al-Sitta), generalmente después de [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]] y [[ABD|Sunan Abi Dawud]]; su rango exacto entre los libros restantes, y cuál ocupa el sexto puesto, se discute sin estar resuelto
