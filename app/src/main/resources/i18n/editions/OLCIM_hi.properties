title=Baibal Olcim — इस संस्करण के बारे में | Common Root
description=Baibal Olcim: मातू चिन भाषा में बाइबिल, म्यांमार के चिन राज्य की एक अल्पसंख्यक भाषा, जिसे eBible.org द्वारा सचमुच सार्वजनिक अधिकार-क्षेत्र (public domain) के पाठ के रूप में वितरित किया जाता है, जिसके अनुवादक और अनुवाद-तिथि दर्ज नहीं हैं।
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=मातू चिन — जिसे मातुपी चिन भी कहा जाता है — एक चीनी-तिब्बती भाषा है, जिसे लगभग 34,000 लोग बोलते हैं, जो म्यांमार के चिन राज्य के दक्षिणी भाग में मातुपी के आसपास केंद्रित हैं, और सीमा के उस पार भारत के मिज़ोरम राज्य में संबंधित समुदाय हैं। Baibal Olcim इसी भाषा में बाइबिल है, और यह इस संग्रह का एकमात्र मातू चिन पाठ है।
hero.2=अभिलेख जो नहीं बताता, वह यह है कि इसका अनुवाद किसने किया, या कब। इस पाठ को वितरित करने वाला eBible.org केवल इतना बताता है कि यह सार्वजनिक अधिकार-क्षेत्र में है, और इसे hlt के अंतर्गत सूचीबद्ध करता है, जो मातू चिन के लिए ISO 639-3 कोड है — न कोई अनुवादक, न कोई समिति, न अनुवाद की कोई तिथि। यह पृष्ठ अनुमान लगाने के बजाय दोनों को खाली छोड़ देता है। इसी कोड का यहाँ अपना एक छोटा-सा इतिहास है: इस संग्रह में एक दूसरी हिन्दी बाइबिल जोड़ने के एक पहले के प्रयास को एक मिलते-जुलते संक्षिप्त रूप के कारण गलती से hlt के अंतर्गत दर्ज कर दिया गया था, जब तक कि जहाँ हिन्दी की अपेक्षा थी वहाँ मातू चिन की आयतें सामने आने से यह गलती उजागर नहीं हुई। यह संस्करण वही है जिसे वास्तव में उस भाषा के विरुद्ध जाँचा गया, जिसका नाम इसका कोड लेता है।
hero.3=इसे इसकी लंबाई के लिए नहीं, बल्कि यह जो है उसके लिए जोड़ा गया: केवल लाइसेंस-प्राप्त नहीं, बल्कि सचमुच सार्वजनिक अधिकार-क्षेत्र की बाइबिल, एक ऐसे ईसाई अल्पसंख्यक की भाषा में, जिसने म्यांमार के गृह-संघर्ष के बीच, जो चिन राज्य और उसके आसपास केंद्रित है, वास्तविक उत्पीड़न झेला है। एक ऐसा रीडर जो अपने उपयोगकर्ताओं से कुछ नहीं माँगता और उनमें से किसी का पीछा नहीं करता, ठीक ऐसे ही मामले के लिए बनाया गया है — और यही काफी हद तक यह भी बताता है कि इस पृष्ठ के तथ्यों में डालने के लिए और इतना कम क्यों है।

