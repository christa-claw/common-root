title=क़ुरआन — उस्मानी पाठ — इस संस्करण के बारे में | Common Root
description=क़ुरआन हफ़्स अज़ असिम की क़िरअत में, वह पाठ जिस पर दुनिया में अधिकांश मुद्रित क़ुरआन 1924 के काहिरा संस्करण के बाद से टिके हैं — और इस संग्रह में एक ऐसा पाठ जिसे आयत-दर-आयत किंग फ़हद परिसर की अपनी प्रति से मिलाया गया और जो इसकी सभी 6,236 आयतों में व्यंजन-ढाँचे में पूर्णतः मेल खाता पाया गया।
heroHeading=क़ुरआन — उस्मानी पाठ
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=इस पाठ के पीछे की क़िरअत की एक नामित श्रृंखला है। हफ़्स इब्न सुलैमान अल-कूफ़ी (मृ. 796) ने इसे अपने गुरु आसिम इब्न अबी अन-नजूद से प्राप्त किया, जो कूफ़ा के उन पाठकों में से एक थे जिनकी क़िरअत को इब्न मुजाहिद ने बाद में सात में शामिल किया (आसिम की मृत्यु 745 में हुई)। हफ़्स अज़ असिम — "हफ़्स, असिम से" — उन कई क़िरअतों में से एक है जिन्हें मुसलमान एक ही वह्य की समान रूप से प्रामाणिक परंपराएँ मानते हैं; यह एकमात्र नहीं है, पर यह निश्चित रूप से सबसे अधिक मुद्रित है। जब अल-अज़हर के विद्वानों की एक समिति, जो 1907 से राजा फ़ुआद प्रथम के अधीन कार्यरत थी, ने वह मानक मिस्री क़ुरआन तैयार किया जिसे बुलाक़ की अमीरी प्रेस ने 10 जुलाई 1924 को प्रकाशित किया, तो यही क़िरअत उन्होंने टंकण में स्थिर की। आज कहीं भी बिकने वाले अधिकांश क़ुरआन, जिनमें किंग फ़हद परिसर का अपना संस्करण भी शामिल है, उस संस्करण का ही अनुसरण करते हैं।
hero.2=इस संग्रह में जो है, वह alquran.cloud के quran-uthmani संस्करण के माध्यम से, उसी हफ़्स पाठ के तंज़ील प्रोजेक्ट द्वारा किए गए डिजिटलीकरण से लिया गया है। रीडर में यह तीन अनुवादों के साथ जोड़ा जाता है: पिकथॉल का अंग्रेज़ी अनुवाद (1930), यूसुफ़ अली का अंग्रेज़ी अनुवाद (1934), और सब्लुकोव का रूसी अनुवाद (1878) — इन तीनों में से किसी को भी इसके साथ खोलें, और उसका अनुवाद हर आयत के नीचे दिखाई देता है। रीडर क़ुरआन को दो क्रमों में भी प्रस्तुत करता है: इस्लाम की परंपरा द्वारा स्थिर पारंपरिक मुसहफ़ क्रम, और वह क्रम जो विद्वान हर सूरा के अवतरण के समय के लिए पुनर्निर्मित करते हैं।
hero.3=शब्दशः संरक्षण स्वयं इस पाठ के बारे में किए गए दावों में से एक है, इसलिए इसे यहाँ मान लेने के बजाय जाँचा गया है। किंग फ़हद ग्लोरियस क़ुरआन प्रिंटिंग परिसर के अपने हफ़्स संस्करण से आयत-दर-आयत मिलाने पर, दोनों पाठ व्यंजन-ढाँचे में — किसी भी स्वर चिह्न जोड़े जाने से पहले के नंगे अक्षरों में — इसकी सभी 6,236 आयतों में मेल खाते हैं। जो भी अंतर मिला, वह स्वरों और विराम-चिह्नों के अंकन, हमज़ा की वर्तनी, और आठ स्थानों तक सीमित है जहाँ दोनों पक्ष शब्द-सीमा को अलग ढंग से खींचते हैं; इनमें से कोई भी पाठ के किसी एक अक्षर को प्रभावित नहीं करता। यह उस अनिश्चितता के विपरीत है जो इस संग्रह को 1776 की फ़िनिश बाइबिल के मामले में स्वीकार करनी पड़ती है, जहाँ यह सीधे तौर पर पता ही नहीं है कि पाठ किस मुद्रण से आया है।
hero.4=दो बातें जो यह मेल स्थापित नहीं करता, उन्हें स्पष्ट रूप से कहना उचित है। यह वंश का दावा नहीं है — परिसर के पाठ से मेल खाना दिखाता है कि दोनों एक ही पाठ हैं, यह नहीं कि एक दूसरे से नक़ल किया गया। और यह अनुमति भी नहीं है: अगस्त 2026 के अंत में परिसर को भेजा गया एक आवेदन, जिसमें उसकी अपनी रिवायत फ़ाइलें दिखाने की अनुमति माँगी गई थी, इस लेखन के समय तक अनुत्तरित था। वह एकमात्र आयत जहाँ स्वयं तुलना ने संक्षेप में असहमति दिखाई, 19:3, संदर्भ फ़ाइल को पढ़ने के तरीके में एक त्रुटि निकली, न कि किसी भी क़ुरआन में — सुधारने पर यह पूरी तरह मेल खाती है। संदर्भ प्रति स्वयं परिसर की वर्ड-प्रोसेसर फ़ाइल का एक पुनर्निर्माण है, उसका आधिकारिक डिजिटल प्रकाशन नहीं — और यही एकमात्र पहलू है जिसमें यह पूरी तरह आधिकारिक रूप से प्रकाशित डेटासेट से की गई तुलना नहीं है।

