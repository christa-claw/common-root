# The narrative, one paragraph per key, in order.
hero.1=בשלהי המאה הרביעית סתרו זה את זה כתבי הבשורה הלטיניים שרווחו במערב, העתקה אחר העתקה, והאפיפיור דמסוס הראשון ביקש ממזכירו הירונימוס ליישב ביניהם. הירונימוס פתח בהגהה. בסופו של דבר הקדיש לכך יותר מעשרים שנה, רובן בבית לחם, והוציא תחת ידו דבר שאיש לא ביקש.
hero.2=ההכרעה שעשתה את ההבדל הייתה לתרגם את הברית הישנה מן העברית ולא מן תרגום השבעים היווני שהכנסייה נהגה בו מאז ומתמיד. הירונימוס כינה את העיקרון “hebraica veritas” — האמת העברית — והוא היה שנוי במחלוקת: אוגוסטינוס כתב אליו בדאגה שמא יתקוממו הקהילות כשגרסאות מוכרות ישתנו תחתיהן. הירונימוס עשה זאת בכל זאת. זו הסיבה שדווקא מקרא לטיני קרוב לעברית יותר מן המקרא היווני שקראו הנוצרים הראשונים.
hero.3=הוא היה מקראה של מערב אירופה במשך אלף שנה, תקופה ארוכה משל כל תרגום לפניו ואחריו. ממנו תרגם ויקליף לאנגלית, וממנו עבדו גם מתרגמי דואי-ריימס — כך שמהדורת דואי-ריימס שבאוסף זה היא צאצאית ישירה שלו, ושלבי אותה מהדורה מפנים לכאן. הוא גם היה הספר הגדול הראשון שנדפס באותיות נעות: המקרא שסידר גוטנברג במיינץ בסביבות 1455 היה טקסט זה.

