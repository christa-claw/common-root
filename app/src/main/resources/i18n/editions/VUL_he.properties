description=הוולגטה הלטינית: תרגומו של הירונימוס, שהוזמן בשנת 382 והושלם בסביבות 405, נשא את המקרא ברחבי מערב אירופה אלף שנה והיה הספר הראשון שהדפיס גוטנברג.
