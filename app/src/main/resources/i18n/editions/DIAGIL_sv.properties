title=Emphatic Diaglott (interlinjär) — Om denna utgåva | Common Root
description=Benjamin Wilsons Emphatic Diaglott från 1864: den ord-för-ord-engelska glosan tryckt under Griesbachs grekiska, senare köpt och omtryckt i sextio år av Vakttornssällskapet, och den text som striden om Joh. 1:1 vanligen förs kring.
heroHeading=Emphatic Diaglott (interlinjär)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson var ingen yrkeslärd. Han var tidningsredaktör i Geneva i Illinois, lärde sig grekiska på egen hand och gav mellan 1857 och 1863 ut, ett häfte i taget, ett interlinjärt Nya testamente som han inte bara hade översatt utan också tillverkat: hans brorson såg honom ta vaxavtryck av varje sida sats, hänga dem i syra över natten för att låta ett skinn av koppar växa fram, backa kopparn med gjutmetall och trycka resultatet på en handpress medan pojken svärtade plåten. Den färdiga volymen kom 1864. Sin grekiska tog han ur den text Johann Jakob Griesbach hade fastställt på 1770-talet, med läsarter hämtade ur Codex Vaticanus.
hero.2=Vad Wilson faktiskt tryckte var två engelska texter, inte en. Längs sidans vänstra kant löpte grekiskan med en bokstavlig ord-för-ord-glosa på engelska under varje ord; längs den högra hans egen putsade översättning, Emphatic Version. De är inte desamma, och vid Joh. 1:1 säger de rakt emot varandra — glosan lyder ”and a god was the Word”, Emphatic Version ”and the LOGOS was God”. Bägge är Wilsons, tryckta i samma bok med några centimeters mellanrum. Detta korpus rymmer glosan, den spalt folk citerar, och det är skälet till att den sitter i en egen avdelning och inte i biblarnas rutnät. En glosa antecknar hur en grekisk mening är hopfogad — kasus för kasus, artikel för artikel, i grekisk ordföljd. Den är inget avgörande om hur meningen bör läsas på engelska, och Wilsons eget avgörande om den saken står tryckt i spalten bredvid. Den som citerar det ena bör veta att det andra finns.
hero.3=Bokens senare liv är skälet till att de flesta har hört talas om den. Wilson dog 1900 som medlem i Church of the Blessed Hope, inte i någon grupp som då fanns under namnet Jehovas vittnen. År 1902 förvärvade Charles Taze Russell, ordförande i Vakttornets bibel- och traktatsällskap, upphovsrätten av Wilsons arvingar och med tiden också plåtarna. Sällskapet tryckte Diaglott i sextio år framåt — satte om texten på sina egna pressar 1927, körde av långt över etthundrafemtiotusen exemplar, sålde den för två dollar och gav till slut bort den. Diaglott är alltså en Jehovas vittnen-bok genom adoption och inte genom författarskap, och dess vana att trycka ”Jehova” i Nya testamentet, där skribenterna skrev κύριος när de citerade de hebreiska skrifterna, var fyra decennier äldre än den rörelse som gjorde bruket känt. Upphovsrätten löpte ut 1952 och den har varit public domain sedan dess.
hero.4=Två saker om den i denna läsare är värda att veta innan man använder den. Griesbach tryckte varken Apg. 8:37 eller Luk. 17:36, så ingendera finns här; i stället för att sluta luckan och flytta upp varje senare vers ett steg lämnar numreringen de två platserna tomma, så att en hänvisning landar på samma vers i denna spalt som i den bredvid. Och ingen förlaga är noterad för den, så en stegpinne öppnad under en Diaglott-vers går till grundspråksgolvet och inte till en äldre engelsk utgåva.
hero.5=Var noga med vad det golvet trycker. Grekiskan det visar är Textus Receptus — brickan läser ≈ TR 1550, och det ≈ är läsaren som säger att den erbjuder ett vittne till grekiskan och inte den text denna utgåva gjordes ur. Wilson arbetade efter Griesbach. Där de två är eniga, som vid Joh. 1:1, visar stegpinnen faktiskt just de ord som glosas. Där de skiljer sig gör den det inte: Griesbach förkastade den trinitariska satsen i 1 Joh. 5:7, så Diaglott har inte ett spår av den, medan Textus Receptus-raden därunder bär den i sin helhet. På en interlinjär, vars hela förutsättning är att grekiskan står där på sidan, är det den enda lucka som är värd att känna till innan man citerar ur den.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Vad detta är
fact.1.value=den underliggande glosan — den ord-för-ord-engelska som är tryckt under grekiskan, inte Wilsons läsbara översättning
fact.2.label=Sammanställd av
fact.2.value=Benjamin Wilson (1817–1900), självlärd lärd och tidningsredaktör i Geneva i Illinois
fact.3.label=Grekisk text
fact.3.value=Griesbachs recension, med läsarter ur Codex Vaticanus (Vatikanhandskrift 1209)
fact.4.label=Utgiven
fact.4.value=i häften från 1857; komplett i en volym 1864, av Fowler and Wells i New York
fact.5.label=Tryckt hur
fact.5.value=Wilson galvanoplasterade varje plåt själv och körde av första upplagan på en handpress
fact.6.label=Gudsnamnet
fact.6.value=trycker ”Jehova” i Nya testamentet där skribenterna skrev κύριος när de citerade hebreisk skrift — samma beslut som [[ASV|American Standard Version]] fattade genom hela Gamla testamentet
fact.7.label=Förvärvad av
fact.7.value=Vakttornets bibel- och traktatsällskap, som fick upphovsrätten 1902 under Charles Taze Russell, satte om texten 1927 och tryckte den in på 1960-talet
fact.8.label=Licens
fact.8.value=public domain — upphovsrätten löpte ut 1952, och Vakttornets omtryck lade ingen ny till
fact.9.label=Två verser saknas
fact.9.value=Apg. 8:37 och Luk. 17:36 står inte hos Griesbach och står därför inte här; deras nummer lämnas tomma i stället för att slutas till, så att texten fortfarande ligger vers mot vers med varje annan utgåva
fact.10.label=Grekiskan under stegpinnen
fact.10.value=[[TR|Textus Receptus]], visad som ≈ TR 1550 — ett vittne till grekiskan, inte Wilsons grundtext, som var Griesbachs recension; de två är eniga vid Joh. 1:1 och skiljs åt vid 1 Joh. 5:7
fact.11.label=I detta korpus
fact.11.value=hålls i en egen avdelning för interlinjära och studieutgåvor, skild från läsbiblarna, så att en glosa aldrig tas för en översättning; ingen förlaga är noterad i stegpinnarna, så en stegpinne öppnar rakt ned på grundspråksgolvet
