fact.4.label=סוג העיבוד
fact.4.value=קל ושמרני: מילים מיושנות הוחלפו במילים שבשימוש; הדקדוק תוקן, «who» לבני אדם ו־«its» לדברים; כמה מילים שנחשבו בלתי הולמות לקריאה בקול רוככו; «Holy Spirit» במקום «Holy Ghost»; הסגנון והקטעים הנוגעים לעיקרי האמונה הושארו בכוונה כמות שהם
fact.5.label=פורסמה
