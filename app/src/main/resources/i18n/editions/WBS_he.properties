fact.8.label=שושלת
fact.8.value=אין הורה רשום, ואין דבר הרשום כעומד עליו — השלב נפתח ישירות על רצפת לשונות המקור, [[WLC|כתב יד לנינגרד]] בברית הישנה ו־[[TR|הנוסח המקובל]] בברית החדשה, אף שהטקסט שובסטר עיבד הוא [[KJV|ה־King James Version]]
