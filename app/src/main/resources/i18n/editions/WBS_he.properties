title=Webster's Bible — על מהדורה זו | Common Root
description=העיבוד של נוח ובסטר ל־King James Version משנת 1833, שיצא לאור בניו הייבן שבקונטיקט — המקרא האנגלי המקובל, שנשמר כמעט מילה במילה, ובו מילים שיצאו מכלל שימוש הוחלפו, הדקדוק תוקן וכמה ביטויים רוככו לקריאה בקול.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=נוח ובסטר (1758–1843), המילונאי מניו הייבן, זכור בעיקר בזכות An American Dictionary of the English Language משנת 1828. חמש שנים לאחר מכן הפנה את אותה הקפדה על אנגלית בהירה, נכונה ועדכנית אל המקרא שארצו קראה בפועל. בשנת 1833 הוציאו Durrie and Peck בניו הייבן לאור את The Holy Bible … in the Common Version, with Amendments of the Language, ובו הקדמה חתומה בספטמבר של אותה שנה. אין זה תרגום חדש. ובסטר נטל את ה־King James Version משנת 1611 — «הנוסח המקובל» — כפי שנדפס אז, ושינה אותו רק במקום שבו האנגלית שלו נעשתה סתומה או שגויה דקדוקית. הוא כתב שנועץ בלשונות המקור בעת שערך את תיקוניו, אך שאין לשנות את סגנונו הכללי של התרגום, ושלא שינה ביודעין שום קטע שעליו מבססת עדה כלשהי את משנתה.
hero.2=בהקדמתו הוא מונה שלושה סוגי שינויים. מילים שיצאו כליל מכלל שימוש פינו מקומן למילים שבשימוש: אדוני יוסף «knoweth not» מה בבית (בראשית 39:8) במקום שבו ב־King James כתוב «wotteth not», ובמעשי השליחים 12:4 מתכוון הורדוס להוציא את פטרוס אל העם «after the passover» ולא «after Easter». הדקדוק הותאם לשימוש בימי ובסטר: «who» במקום «which» כשמדובר בבני אדם, כך שתפילת האדון נפתחת במילים «Our Father who art in heaven», ו־«its» במקום «his» כשמדובר בדברים, כך שהצמחים בבראשית 1 מוציאים זרע «after its kind». ולבסוף, מספר קטן של מילים שלדעתו אינן הולמות קריאה בקול לפני קהל מעורב הוחלפו במילים עדינות יותר. הוא גם כתב «Holy Spirit» במקום שבו ב־King James כתוב «Holy Ghost», ובעותק שלנו אין אף «Holy Ghost» אחד. מעבר לזה העיבוד קל: רוב הקוראים יכולים לקרוא פרק אחר פרק בלי להבחין שעזבו את נוסח ה־King James.
hero.3=העותק שלנו שלם: 66 ספרים, מבראשית ועד ההתגלות, בלי הספרים החיצוניים, בחלוקת הפרקים והפסוקים האנגלית — 150 מזמורים, שכותרת כל אחד מהם משולבת בפסוק הראשון שלו, ומלאכי המסתיים בפרק 4. בדומה ל־King James, הוא שומר על קטעי הנוסח המקובל שהמהדורות הביקורתיות המאוחרות מטילות בהם ספק: הסיום הארוך של מרקוס, מעשי השליחים 8:37 ושלושת העדים בשמים ביוחנן א׳ 5:7. בקורא זה הוא עומד לבדו. אף שהוא עיבוד של ה־King James Version, שגם היא באוסף זה, האוסף אינו רושם לו הורה, ולכן שלב שושלת שנפתח מתחת לאחד מפסוקיו נופל ישירות לרצפת לשונות המקור המסומנת ב־≈ — כתב יד לנינגרד בברית הישנה והטקסטוס רצפטוס בברית החדשה — ולא אל הטקסט האנגלי שעליו עבד ובסטר בפועל. גם דבר אינו רשום כעומד עליו. אף שפת ממשק אינה נפתחת על מהדורה זו; ממשק אנגלי נפתח על New International Version, ולמהדורה זו מגיעים מן הכרטיס שלה ברשת התרגומים. כשמניחים אותו לצד ה־King James בעמודה שנייה, הוא מראה את תיקוני ובסטר פסוק אחר פסוק.

