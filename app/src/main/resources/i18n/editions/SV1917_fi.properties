title=Svenska 1917 — Tietoa tästä laitoksesta | Common Root
description=Ruotsin kirkon vuoden 1917 käännös — Gustav V:s bibel — ensimmäinen ruotsinkielinen Raamattu, joka tehtiin suoraan hebreasta ja kreikasta sen sijaan, että se olisi tarkistettu edellisestä, ja ainoa ruotsinkielinen Raamattu, joka tässä aineistossa on.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Kolmensadanviidenkymmenen vuoden ajan Ruotsin kirkolla oli yksi Raamattu, tarkistettu mutta ei koskaan uudelleen tehty. Kustaa Vaasan Raamattu vuodelta 1541, ensimmäinen täydellinen ruotsiksi painettu Raamattu, nojasi vahvasti Martti Lutherin saksaan. Kustaa II Aadolfin Raamattu vuodelta 1618 tarkisti sitä, ja Karl XII:s bibel vuodelta 1703 — valmistunut yhden kuninkaan aikana, vaikka hänen isänsä oli sen tilannut ennen häntä — vei saman peritun ruotsin askelen eteenpäin. Mikään kolmesta ei palannut aloittamaan alusta.
hero.2=Vuonna 1773 Kustaa III nimitti raamatunkäännöskomission tekemään sitä, mitä mikään niistä tarkistuksista ei ollut tehnyt: kääntämään suoraan hebreasta ja kreikasta sen sijaan, että vanhaa ruotsia olisi viety vielä kerran eteenpäin. Komissio istui 144 vuotta. Sen tulos — Ruotsin toinen täydellinen Raamatun käännös, Kustaa Vaasan jälkeen ja ennen Bibel 2000:ta — valmistui ja vahvistettiin Kustaa V:n aikana vuonna 1917, ja sitä kutsutaan siksi yhä usein nimellä Gustav V:s bibel.
hero.3=Vanha testamentti nojaa masoreettiseen hepreaan, niin kuin sitä edeltäneet laitokset. Uusi testamentti ei jatka niiden linjaa: se noudattaa sitä ajantasaisinta kriittistä kreikkalaista tekstiä, joka komissiolla oli käytössään vuoteen 1917 mennessä, sen Textus Receptuksen sijaan, jolle tämän aineiston reformaatioajan Raamatut rakentuvat.
hero.4=Tässä lukuohjelmassa se on ainoa ruotsinkielinen Raamattu, joten käyttöliittymän asettaminen ruotsiksi avaa sen — ei valittuna poimintana, niin kuin Reina-Valera 1909 on poimittu espanjalle, vaan siksi ettei luettelon haku löydä kielestä mitään muuta. Sille ei ole kirjattu kantatekstiä polveutumisaskelmiin, joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan. Tuo pohja tarjoaa kreikaksi Textus Receptuksen, ja tässä se on totuudesta kauempana kuin tavallisesti: komissio jätti Textus Receptuksen tarkoituksella taakseen ajantasaisemman kriittisen tekstin vuoksi, joten tämän käännöksen jakeen alla oleva pohja nimeää kreikkalaisen tekstin, joka ei ole se, jota käännös todella seurasi.

