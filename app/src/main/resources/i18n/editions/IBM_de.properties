fact.2.value=Abu 'Abdullah Muhammad ibn Yazid Ibn Majah al-Qazwini (209–273 n. H. / 824–887 n. Chr.)
fact.3.label=Titel
fact.3.value=bekannt als Sunan Ibn Majah
fact.4.label=Zusammengestellt
fact.4.value=gesammelt auf Reisen durch den Irak, den Hijaz, Syrien und Ägypten; Ibn Majah ließ sich in Qazwin nieder und starb dort im Jahr 273 n. H. (887 n. Chr.)
fact.5.label=Methode
fact.5.value=nach Rechtsthema geordnet, wie [[ABD|Sunan Abi Dawud]] und [[TIR|Jami` at-Tirmidhi]]; umfasst nach al-Dhahabis Zählung etwa 1.500 Kapitel
fact.6.label=Stellung
fact.6.value=zählt als das letzte der Sechs Bücher des sunnitischen Islam (Kutub al-Sittah), nach [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]] und [[NAS|Sunan an-Nasa'i]] — ein umstrittener sechster Platz, den manche statt dessen [[MAL|Muwatta Malik]] oder dem Sunan al-Daraqutnis zuschreiben
fact.7.label=Hadith-Anzahl
fact.7.value=etwa 4.000, nach al-Dhahabis Zählung, darunter rund dreißig, die allgemein als Fälschungen gelten; die Quellenausgabe dieses Korpus zählt 4.343
fact.8.label=In diesem Korpus
