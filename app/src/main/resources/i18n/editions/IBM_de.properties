title=Sunan Ibn Majah — Über diese Ausgabe | Common Root
description=Sunan Ibn Majah: das letzte der Sechs Bücher des sunnitischen Islam, nach Rechtsthema geordnet, dessen Platz unter ihnen seit langem umstritten ist wegen der schwachen und gefälschten Hadithe, die es ebenfalls enthält.
heroHeading=Sunan Ibn Majah
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu 'Abdullah Muhammad ibn Yazid Ibn Majah al-Rabi'i al-Qazwini wurde im Jahr 209 n. H. (824 n. Chr.) in Qazwin geboren, das heute im Nordwesten Irans liegt, in eine Familie von Mawali (nicht-arabischen Klienten) des Stammes der Rabi'ah — Majah war, einer Überlieferung zufolge, der Spitzname seines Vaters und nicht der Name eines Großvaters oder einer Mutter. Er reiste auf der Suche nach Hadithen durch den Irak, den Hijaz, Syrien und Ägypten und studierte bei einem weiten Kreis von Gelehrten; mehr als ein Viertel seines späteren Sunan soll auf einen einzigen Lehrer zurückgehen, Ibn Abi Shaybah. Zeitgenossen wie Abu Ya'la al-Khalili lobten ihn als zuverlässig, bedeutend und als einvernehmlich anerkannte Autorität. Er starb in Qazwin im Jahr 273 n. H. (887 n. Chr.), wobei al-Kattani auch das Jahr 275 (889 n. Chr.) verzeichnet; der traditionellen Überlieferung zufolge bemerkte Abu Zur'a al-Razi, nachdem Ibn Majah ihm das vollendete Sunan vorgelesen hatte, dass die anderen Sunan-Sammlungen weitgehend überflüssig würden, wenn die Menschen dieses Buch besäßen.
hero.2=Sein Sunan umfasst, nach der Zählung al-Dhahabis, etwa 1.500 Kapitel und rund 4.000 Hadithe, nach Rechtsthema geordnet wie die Sammlungen [[ABD|Abu Dawuds]] und [[TIR|at-Tirmidhis]]. Neben einwandfreiem und akzeptablem Material enthält es auch Hadithe, die spätere Gelehrte als schwach beurteilten, darunter rund dreißig, die allgemein als regelrechte Fälschungen gelten — der Grund, warum manche Gelehrte nur „die Fünf“ statt der Sechs zählen.
hero.3=Die sunnitische Tradition zählt Sunan Ibn Majah als das letzte der Sechs Bücher (Kutub al-Sittah), zusammen mit [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]] und [[NAS|Sunan an-Nasa'i]]. Dieser sechste Platz ist selbst umstritten: die Malikiten und Ibn al-Athir nennen, unter anderen, stattdessen [[MAL|Muwatta Malik]], und manche nennen das Sunan al-Daraqutnis; Ibn Majahs Buch habe den Platz allgemein deshalb erhalten, weil sein Inhalt sich am wenigsten mit den anderen fünf überschneidet, nicht weil es als das verlässlichste der Kandidaten gilt.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-ibnmajah-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]] und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

