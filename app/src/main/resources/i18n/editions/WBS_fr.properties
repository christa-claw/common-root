title=Webster's Bible — À propos de cette édition | Common Root
description=La révision de la King James Version faite par Noah Webster en 1833 et publiée à New Haven, dans le Connecticut — la Bible anglaise commune conservée presque mot pour mot, les mots tombés en désuétude remplacés, la grammaire corrigée et quelques expressions adoucies pour la lecture à voix haute.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), le lexicographe de New Haven, est resté célèbre avant tout pour An American Dictionary of the English Language de 1828. Cinq ans plus tard, il porta le même souci d'un anglais clair, correct et actuel sur la Bible que son pays lisait réellement. En 1833, Durrie and Peck, à New Haven, publièrent The Holy Bible … in the Common Version, with Amendments of the Language, avec une préface signée en septembre de la même année. Ce n'est pas une traduction nouvelle. Webster prit la King James Version de 1611 — « la version commune » — telle qu'on l'imprimait alors, et ne la modifia que là où son anglais était devenu obscur ou fautif. Il écrivit qu'il avait consulté les langues originales pour ses corrections, mais que le style général de la version ne devait pas être altéré, et qu'il n'avait sciemment changé aucun passage sur lequel une confession fondait sa doctrine.
hero.2=Sa préface distingue trois sortes de changements. Les mots entièrement sortis de l'usage cédèrent la place à des mots de bon usage : le maître de Joseph « knoweth not » ce qui est dans la maison (Genèse 39:8) là où la King James a « wotteth not », et en Actes 12:4 Hérode entend faire comparaître Pierre « after the passover », non « after Easter ». La grammaire fut alignée sur l'usage du temps de Webster : « who » au lieu de « which » quand il s'agit de personnes, si bien que le Notre Père commence par « Our Father who art in heaven », et « its » au lieu de « his » quand il s'agit de choses, si bien que les plantes de Genèse 1 portent leur semence « after its kind ». Enfin, un petit nombre de mots qu'il jugeait impropres à être lus à voix haute devant un auditoire mêlé furent remplacés par d'autres plus doux. Il écrivit aussi « Holy Spirit » là où la King James a « Holy Ghost », et notre copie ne contient pas un seul « Holy Ghost ». Pour le reste, la révision est légère : la plupart des lecteurs pourraient lire chapitre après chapitre sans remarquer qu'ils ont quitté le texte de la King James.
hero.3=Notre copie est complète : 66 livres, de la Genèse à l'Apocalypse, sans les apocryphes, dans la numérotation anglaise des chapitres et des versets — 150 psaumes, dont le titre est fondu dans le premier verset, et Malachie qui s'achève au chapitre 4. Comme la King James, elle garde les passages du texte reçu que les éditions critiques ultérieures mettent en doute : la finale longue de Marc, Actes 8:37 et les trois témoins dans le ciel de 1 Jean 5:7. Dans ce lecteur, elle se tient seule. Bien qu'elle soit une révision de la King James Version, elle aussi dans ce corpus, le corpus ne lui enregistre aucun parent, si bien qu'un échelon de filiation ouvert sous l'un de ses versets tombe directement sur le sol des langues originales marqué ≈ — le Codex de Léningrad dans l'Ancien Testament et le Textus Receptus dans le Nouveau — et non sur le texte anglais sur lequel Webster a réellement travaillé. Rien n'est non plus enregistré comme reposant sur elle. Aucune langue d'interface ne s'ouvre sur cette édition ; une interface en anglais s'ouvre sur la New International Version, et l'on atteint celle-ci par sa propre carte dans la grille des traductions. Placée à côté de la King James dans une deuxième colonne, elle montre les corrections de Webster verset par verset.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=Anglais
fact.2.label=Réviseur
fact.2.value=Noah Webster (1758–1843), lexicographe américain, auteur d'An American Dictionary of the English Language (1828)
fact.3.label=Révisée d'après
fact.3.value=[[KJV|La King James Version]] de 1611, « la version commune », telle qu'on l'imprimait alors — révisée en anglais, non retraduite, bien que Webster ait consulté l'hébreu et le grec pour ses corrections
fact.4.label=Genre de révision
fact.4.value=Légère et prudente : mots désuets remplacés par des mots courants ; grammaire corrigée, « who » pour les personnes et « its » pour les choses ; quelques mots jugés impropres à la lecture à voix haute adoucis ; « Holy Spirit » au lieu de « Holy Ghost » ; le style et les passages doctrinaux délibérément laissés tels quels
fact.5.label=Publiée
fact.5.value=New Haven, Connecticut : Durrie and Peck, 1833, sous le titre The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Licence
fact.6.value=Domaine public ; cette copie provient d'eBible.org
fact.7.label=Dans ce corpus
fact.7.value=66 livres, le canon protestant au complet, sans les apocryphes ; numérotation anglaise des chapitres et des versets, si bien que les psaumes sont au nombre de 150 et que le titre de chacun est fondu dans son premier verset
fact.8.label=Filiation
fact.8.value=Aucun parent enregistré, et rien d'enregistré comme reposant sur elle — un échelon s'ouvre directement sur le sol des langues originales, [[WLC|le Codex de Léningrad]] dans l'Ancien Testament et [[TR|le Textus Receptus]] dans le Nouveau, bien que le texte révisé par Webster soit [[KJV|la King James Version]]
