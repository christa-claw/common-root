title=القرآن — سابلوكوف — عن هذه الطبعة | Common Root
description=ترجمة غورديي سابلوكوف الروسية، التي نُشرت في قازان سنة 1878 وتوصف عادةً بأنها أول ترجمة روسية للقرآن أُخذت مباشرة من العربية لا عبر وسيط فرنسي أو إنجليزي — وهي في هذه المجموعة الترجمة الروسية المرافقة الظاهرة تحت النصّ العربي العثماني.
heroHeading=القرآن — سابلوكوف
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=تدرّب غورديي سيمينوفيتش سابلوكوف (1803-1880) لسلك الكهنوت الأرثوذكسي الروسي، فتخرّج من مدرسة أورنبورغ اللاهوتية سنة 1826 ومن أكاديمية موسكو اللاهوتية سنة 1830. وقضى العقدين التاليين، من 1830 إلى 1849، معلّماً للتاريخ واللغات الشرقية في مدرسة ساراتوف اللاهوتية — حيث كان من بين طلابه في منتصف الأربعينيات (1840) الكاتب الراديكالي المستقبلي نيكولاي تشرنيشفسكي — قبل أن ينتقل سنة 1849 إلى القسم التبشيري في أكاديمية قازان اللاهوتية، فدرّس فيه اللغات الشرقية والكلاسيكية حتى سنة 1862.
hero.2=تعود الترجمات الروسية للقرآن إلى سنة 1716، حين أنجز بيوتر بوستنيكوف واحدةً بأمر بطرس الأكبر — لكن عن الفرنسية لأندريه دو رُيير، لا عن العربية، وكذلك ترجمة ألكسي كولماكوف سنة 1792، المأخوذة عن الإنجليزية لجورج سيل. أما ترجمة سابلوكوف، التي نُشرت في قازان سنة 1878 بعنوان "Коран, законодательная книга мохаммеданского вероучения" ("القرآن، الكتاب التشريعي للعقيدة المحمدية")، فتُنسب عادةً إليها صفة أول ترجمة روسية للقرآن أُخذت مباشرة من الأصل العربي، وهي ثمرة سنواته في تدريس اللغات الشرقية في قازان.
hero.3=وتبعها في السنة التالية بمجلد مرافق من الحواشي، "Приложения к переводу Корана" (1879)، ثم بدراستين لاحقتين مرتبطتين بها: "Сведения о Коране" ("معلومات عن القرآن"، 1884)، ورسالة مقارنة أقدم عن تعليم المسيحيين والمسلمين بخصوص أسماء الله (1873). وبقيت ترجمته من بين النسخ الروسية الأكثر انتشاراً منذ ذلك الحين، حتى بعد أن صارت ترجمات لاحقة — من بينها ترجمة إغناطي كراتشكوفسكي التي نُشرت بعد وفاته — أكثر شهرة في الاستخدام الأكاديمي السوفييتي وما بعد السوفييتي.
hero.4=وما رُقمن هنا، عبر طبعة alquran.cloud المسمّاة ru.sablukov، يُقدَّم في هذه المجموعة ترجمةً روسية مرافقة لـ[[Q-AR|النصّ العربي العثماني]]، إلى جانب الإنجليزية لـ[[Q-EN|بيكثال]] (1930) و[[Q-YA|يوسف علي]] (1934) — الترجمات الثلاث التي وجدها استقصاء للترجمات المتاحة حرّة التداول بلا شكّ، واحدة لكل لغة عدا العربية.

