fact.2.label=من صنعه
fact.2.value=وحيٌ وبيانات أخرى قال جوزيف سميث الابن (1805–1844) إنه تلقّاها كاتصالات مباشرة من الله؛ وأتى عدد قليل من البنود اللاحقة، أبرزها الإعلانان الرسميان، من خلفائه في رئاسة الكنيسة
fact.3.label=نُشر
fact.3.value=1835، كيرتلاند، أوهايو، توسيعًا لكتاب الوصايا غير المكتمل عام 1833؛ جمعته واعتمدته لجنة من جوزيف سميث وأوليفر كاودري وسيدني ريغدون وفريدريك ج. ويليامز
fact.4.label=البنية
fact.4.value=138 قسمًا مرقّمًا إلى جانب إعلانين رسميين، بدلًا من الكتب والفصول والآيات؛ وتُقدَّم كل أقسامه في مجموعتنا كفصول ضمن كتاب واحد بعنوان "العقيدة والعهود"
fact.5.label=المكانة
fact.5.value=أحد الأعمال القانونية الأربعة لحركة قديسي الأيام الأخيرة، إلى جانب الكتاب المقدس و[[BOM|كتاب مورمون]] و[[PGP|الدرة الكريمة]]
fact.6.label=في هذه المجموعة
fact.6.value=يتبع النص الصياغة القياسية الحالية المأخوذة من تصدير JSON الخاص بـ Mormon Documentation Project والمعلَن أنه في الملكية العامة — وهو نفس المصدر المستخدم لـ[[BOM|كتاب مورمون]] و[[PGP|الدرة الكريمة]] — وتُستثنى حواشيه وعناوين فصوله المحمية بحقوق النشر، ولهذا لا تُذكر هنا سنة طبع واحدة
fact.7.label=الرخصة
fact.7.value=في الملكية العامة، حسب تصريح القائم على البيانات؛ لا تشمل المواد الدراسية الحديثة المحمية بحقوق النشر
