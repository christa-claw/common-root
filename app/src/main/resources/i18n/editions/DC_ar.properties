title=العقيدة والعهود — عن هذه الطبعة | Common Root
description=العقيدة والعهود: وحيٌ وبيانات أخرى دوّنها جوزيف سميث، نُشرت أول مرة عام 1835 في كيرتلاند بولاية أوهايو، ويقرأها قديسو الأيام الأخيرة بوصفها كتابًا مقدسًا إلى جانب الكتاب المقدس.
heroHeading=العقيدة والعهود
readerHref=/reader?c1.src=dc

hero.1=تجمع العقيدة والعهود وحيًا ورؤى وبيانات أخرى قال جوزيف سميث الابن إنه تلقّاها كاتصالات مباشرة من الله، دُوّن معظمها خلال سنوات الكنيسة الأولى في أوهايو وميزوري ونيويورك. وكان هناك تجميع سابق بعنوان "كتاب الوصايا لحكم كنيسة المسيح" قيد الطبع في مطبعة الكنيسة في إندبندنس بولاية ميزوري، حين دمّر حشدٌ غاضب المطبعة في يوليو 1833 وبعثر الصفحات غير المكتملة قبل إتمام الكتاب؛ ولم يُنشر رسميًا أبدًا، رغم نجاة عدد قليل من الصفحات المنقَّذة غير المجلّدة.
hero.2=تلاه عام 1835 كتاب موسّع أُعيدت تسميته "عقيدة وعهود كنيسة قديسي الأيام الأخيرة"، نُشر في كيرتلاند بولاية أوهايو، وجمعته واعتمدته لجنة من أربعة أشخاص: جوزيف سميث، وأوليفر كاودري، وسيدني ريغدون، وفريدريك ج. ويليامز. وقد جمعت تلك الطبعة الأولى نوعين من المواد تحت غلاف واحد — سلسلة من المحاضرات اللاهوتية قُدّمت في مدرسة كيرتلاند، وعُرضت بوصفها "العقيدة"، إلى جانب الوحي المدوَّن نفسه، المعروض بوصفه "العهود". وحُذفت هذه المحاضرات، المعروفة منذ ذلك الحين بـ"محاضرات في الإيمان"، من الكتاب لاحقًا — ويُحدَّد ذلك غالبًا بطبعة عام 1921 — فبقي الوحي هو الكتاب كله.
hero.3=يُنظَّم الكتاب في أقسام مرقّمة بدلًا من الكتب والفصول والآيات التي يُنظَّم بها الكتاب المقدس، وهو ما يعكس طبيعته: مجموعة من النصوص المتفرقة لا سردًا واحدًا متصلًا. وتغيّر المحتوى والترقيم كلاهما عبر طبعات القرن التاسع عشر، بما فيها طبعة عام 1876 بإشراف أورسون برات أعادت تنظيم مواد سابقة وأضافت وحيًا جديدًا. وبلغت الطبعة الحديثة شكلها الحالي عام 1981، حين أُضيف بندان آخران — رؤية لدرجات المجد ورؤية لفداء الموتى — كالقسمين 137 و138، إلى جانب "إعلانين رسميين": بيان عام 1890 أنهى تأييد الكنيسة لعقود تعدد الزوجات الجديدة، وإعلان عام 1978 وسّع سيامة الكهنوت لتشمل جميع الأعضاء الذكور المستحقين بصرف النظر عن العرق. وأضافت طبعة عام 2013 تحديثات أخرى على المواد المرجعية. وتضم الطبعة القياسية المستخدمة اليوم 138 قسمًا والإعلانين الرسميين.
hero.4=يُعدّ هذا الكتاب أحد أربعة مؤلفات تسمّيها حركة قديسي الأيام الأخيرة "الأعمال القانونية" الخاصة بها، إلى جانب الكتاب المقدس و[[BOM|كتاب مورمون]] و[[PGP|الدرة الكريمة]]. وتحتفظ "طائفة المسيح" (Community of Christ)، وهي كنيسة منفصلة منحدرة من الحركة نفسها، بنسختها الخاصة من العقيدة والعهود، مرقّمة ومحدَّثة بشكل مستقل عن هذه. والنص في هذه المجموعة مأخوذ من تصدير JSON الخاص بـ Mormon Documentation Project، وهو نفس المصدر المتاح للملكية العامة المستخدم لـ[[BOM|كتاب مورمون]] و[[PGP|الدرة الكريمة]]، ويُقدَّم هنا ككتاب واحد بعنوان "العقيدة والعهود" يمثّل كل قسم فيه فصلًا؛ وهو يحمل صياغة الطبعة القياسية الحالية ويستثني الحواشي وعناوين الفصول المحمية بحقوق النشر، وهذا ما يجعله بلا سنة نشر واحدة مذكورة هنا.

