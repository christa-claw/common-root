fact.1.label=语言
fact.1.value=英语
fact.2.label=编成者
fact.2.value=Michael Paul Johnson，以及数百位志愿校对者与来信者；由 Rainbow Missions 出版，经 eBible.org 流布
fact.3.label=出版
fact.3.value=并无单一年份——1994年起始，自1997年起以修订本陆续刊行，如今除更正外已定稿；关于页的年份栏因此留空
fact.4.label=修订自
fact.4.value=[[ASV|1901年的 American Standard Version]]，选它是因为它准确且完全不受版权束缚
fact.5.label=旧约依据
fact.5.value=马所拉希伯来文本，采 Biblia Hebraica Stuttgartensia 版
fact.6.label=新约依据
fact.6.value=拜占庭多数文本——既非其源头的校勘希腊文本，也非[[TR|Textus Receptus]]
fact.7.label=特点
fact.7.value=旧约通篇以“Yahweh”为神名，而 American Standard Version 印作“Jehovah”，[[KJV|钦定本]]印作“the LORD”
fact.8.label=授权
fact.8.value=依译者本意置于公有领域——这正是此事得以开端的全部缘由
fact.9.label=在本语料库中
fact.9.value=最长谱系链的叶——WEB → ASV → RV → KJV → GNV——也是其中最宽的文本，八十卷对 American Standard Version 的六十六卷
