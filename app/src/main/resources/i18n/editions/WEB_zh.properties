title=World English Bible — 关于此版本 | Common Root
description=World English Bible：1901年 American Standard Version 的现代英语修订本，1994年由 Michael Paul Johnson 起始，新约依希腊多数文本校订，并有意置于公有领域。
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=World English Bible 的存在源于一个版权难题。1994年，工程师 Michael Paul Johnson 利用全职工作之余的时间翻译圣经；他推算过要多久才能完成一部任何人都可自由复制的现代英语圣经，而答案令他不满。他停下从头翻译的工作，改从1901年的 American Standard Version 重新开始——它准确、受人敬重，且不像钦定本（在英格兰与威尔士至今仍受王室特许状约束）那样，它完全不受版权束缚。他自己写的一个程序扫过 ASV 的文本，找出现代圣经不再使用的词，提出替换方案，并在约十五分钟内完成替换。程序做不到的一切——语序、标点、引号——则在其后数年间由人手完成，文本自1997年起陆续刊行，并一再以修订本重刊。
hero.2=有两点使它不同于它所修订的版本。其一是希腊文。ASV 的新约依循修订者的校勘本，接近后来的 Nestle-Aland 版；World English Bible 则改依拜占庭多数文本，因此它既不是其源头的文本，也不是钦定本译者所用的 Textus Receptus。其二是神名。ASV 印作“Jehovah”；World English Bible 印作“Yahweh”，并在创世记2:4加注，向期待“the LORD”的读者解释这一选择。英国版改回“LORD”——本语料库所收为美国版，故读到的是“Yahweh”。除这两项决定之外，它仍是其源头那样的形式对应译本：同样紧贴希伯来文与希腊文的语序，只是拼写与语法已无需注解。
hero.3=在阅读器中它是一片叶，也是本语料库最长一枝上唯一的叶。在 World English Bible 的某一节下展开一级，American Standard Version 便出现在其下，再往下是 Revised Version、钦定本与日内瓦圣经，直至以 ≈ 标示的原文底层。语料库中没有任何文本反过来立于 World English Bible 之上。它也是这一枝上最宽的文本：American Standard Version 没有次经，因此 World English Bible 的次经是另行编成的，取自钦定本次经与 Brenton 的英译七十士译本；我们这一部收八十卷，而其下的 ASV 收六十六卷——其中包括钦定本次经所无的《马加比三书》《马加比四书》与《诗篇151篇》。钦定本次经所有的《巴录书》，我们这一部却缺。关于页将此版本的年份栏留空，这是对的：并无单一的出版年份。语料库标注2000年，只为让级次标签有可排序之据。

