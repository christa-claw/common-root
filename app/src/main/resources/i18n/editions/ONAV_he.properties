title=הגרסה הערבית החדשה הפתוחה — על מהדורה זו | Common Root
description=הגרסה הערבית החדשה הפתוחה של Biblica: ביבליה ערבית מודרנית, שזכויות היוצרים בה לשנים 1988, 1997 ו-2012, שפורסמה ברישיון Creative Commons המתיר לחלוק אותה, לעבדה ולהדפיסה בציון מקור.
heroHeading=הגרסה הערבית החדשה הפתוחה של Biblica
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=זהו תרגום ערבי מודרני, נוסח שונה מ[[SVD|סמית' וּוָן דייק]] ולא עותק נוסף שלו. הוא מתפרסם בידי Biblica, Inc., שהודעת זכויות היוצרים שלה נושאת שלוש שנים: 1988, 1997 ו-2012. עמוד זכויות היוצרים של הנוסח עצמו נותן את שמו הישן יותר, Ketab El Hayat Majani.
hero.2=מה שמייחד אותו בקורא הזה הוא רישיונו. Biblica פרסמה אותו כנוסח "פתוח" ברישיון Creative Commons ייחוס-שיתוף זהה 4.0: כל אדם רשאי להעתיקו, לעבדו ולהדפיסו, בתנאי ש-Biblica תיזכה ושכל הנבנה ממנו ישותף באותם תנאים. נוסח הזיכוי ש-Biblica מבקשת הוא: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". רוב התרגומים המודרניים אינם מוצעים כך, ולכן הוא נמצא כאן.
hero.3=לרישיון תנאי אחד ששווה להכיר. לנוסח שלא שונה מותר לשאת את שם Biblica. לנוסח שסודר מחדש אין היתר כזה: מהדורות סדר האירועים וסדר הכתיבה באתר זה מציבות את הספרים ברצף אחר, ואנו מתייחסים לכך כעיבוד, ולכן הן מציינות שהנוסח סודר מחדש ואינן משתמשות בשם Biblica כתואר.
hero.4=הקובץ מנוקד במלואו. פרט אחד ממקורו: מעשי השליחים ט"ו, 25-26 מודפסים כפסוק אחד, כך שהאוסף מחזיק אותם יחד תחת פסוק 25 ואין בו פסוק 26 נפרד.

