title=الأربعون حديثاً قدسياً — عن هذه الطبعة | Common Root
description=أربعون حديثاً قدسياً، يرى المسلمون أن معناها من عند الله وأن لفظها، كسائر الأحاديث، جاء على لسان محمد — تُقرأ هنا بوصفها مجلداً مرافقاً للأربعين النووية.
heroHeading=الأربعون حديثاً قدسياً
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=يتميز الحديث القدسي عن الحديث العادي بمصدر معناه: يصفه علماء مثل الجرجاني بأنه كلام الله في المعنى، مُعبَّر عنه بلفظ محمد نفسه، بخلاف القرآن الذي يُعدّ لفظه نفسه من عند الله. وهذا فرق في المكانة لا في الصحة — فالحديث القدسي لا يلزم أن يكون صحيحاً؛ فبعض ما يُصنَّف على هذا النحو ضعيف أو مختلف فيه، ويُحكم عليه بمعايير سلاسل الرواية ذاتها التي يُحكم بها على أي حديث آخر.
hero.2=وجمع أربعين حديثاً قدسياً يتبع نفس العادة القديمة التي اتبعتها [[NAW|الأربعون النووية]] ونوع "الأربعينيات" الحديثية الأوسع الذي تنتمي إليه، لكنه هنا محصور في فئة واحدة من الحديث لا الحديث عموماً. وقد نشرت الجمعية الإسلامية للنصوص (Islamic Texts Society) سنة 1997 طبعة إنجليزية منتشرة بهذا الاسم تحديداً — اختارها وترجمها عزّ الدين إبراهيم ودينيس جونسون-ديفيز، وهما من ترجم أيضاً الأربعين النووية — في مجلد عربي-إنجليزي، جامعاً أربعين حديثاً من مختلف كتب الحديث الكلاسيكية. ولم يتحدد من جهة هذه المجموعة ما إذا كانت الأربعون حديثاً المعروضة هنا هي نفس تلك المختارة، أم مجموعة أُخرى جُمعت باستقلال ونُشرت تحت نفس الاسم التقليدي.
hero.3=والنص العربي هنا هو المتن الكلاسيكي، ويُعدّ ملكاً عاماً. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-qudsi في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] و[[NAS|سنن النسائي]] و[[IBM|سنن ابن ماجه]] و[[MAL|موطأ مالك]] و[[NAW|الأربعون النووية]] وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=العربية الكلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=لا يوجد مؤلف كلاسيكي واحد؛ وقد اختار عزّ الدين إبراهيم ودينيس جونسون-ديفيز طبعة إنجليزية منشورة بهذا الاسم وترجماها، جامعين أربعين حديثاً من مختلف كتب الحديث الكلاسيكية
fact.3.label=الاسم
fact.3.value=حديث قدسي — أي حديث "مقدَّس" أو "إلهي"، يُعدّ معناه من عند الله مع أن لفظه لفظ محمد نفسه، بخلاف القرآن
fact.4.label=مكان وزمان التأليف
fact.4.value=مجموعة منتخبة من كتب الحديث الأوسع لا نص واحد متصل؛ وقد نُشرت طبعة إبراهيم/جونسون-ديفيز الإنجليزية بهذا الاسم سنة 1997
fact.5.label=المنهج
fact.5.value=اختيار كل حديث لتصنيفه قدسياً لا لمكانته في الصحة؛ فالحديث القدسي لا يلزم أن يكون صحيحاً — وبعض ما يُصنَّف كذلك ضعيف أو مختلف فيه
fact.6.label=المكانة
fact.6.value=واحدة من عدة مجموعات تحمل هذا الاسم، ضمن تقليد "الأربعينيات" الحديثية القديم نفسه الذي تنتمي إليه [[NAW|الأربعون النووية]]
fact.7.label=عدد الأحاديث
fact.7.value=أربعون
fact.8.label=في هذه المجموعة
fact.8.value=كتاب واحد و40 حديثاً مرقَّماً
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-qudsi في fawazahmed0/hadith-api، تظهر مرافقة للعربية؛ ولم يتأكد من جهة هذه المجموعة ما إذا كانت تعود إلى ترجمة إبراهيم/جونسون-ديفيز أو إلى ترجمة أخرى مستقلة
fact.10.label=الرخصة
fact.10.value=المتن العربي نص كلاسيكي يُعدّ ملكاً عاماً؛ ورخصة الترجمة الإنجليزية لا تزال قيد المراجعة
