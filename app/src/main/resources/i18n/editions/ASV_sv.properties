title=American Standard Version — Om denna utgåva | Common Root
description=1901 års American Standard Version: den amerikanska utgåvan av Revised Version, gjord av forskare som i tjugo år hade rättat King James Version per post, och stamform till Revised Standard Version, New American Standard Bible och World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=American Standard Version började som någon annans projekt. När Engelska kyrkan 1870 satte i gång att revidera King James Version bjöd den in amerikanska forskare att delta, och det gjorde de — per brev, tvärs över Atlanten, under närmare två decennier. Där de båda sidorna var oense gick den brittiska kommitténs läsart in i texten och den amerikanska önskan in i ett appendix, och amerikanerna gick med på att hålla inne med en egen utgåva i fjorton år. Den engelska Revised Version kom ut 1881 och 1885. Den amerikanska utgåvan följde 1901, med appendixets läsarter uppflyttade i texten där utgivarna hela tiden velat ha dem.
hero.2=Det är en översättning gjord av forskare för forskare, och den läses som en sådan. Revisorerna höll sig så nära hebreiskans och grekiskans ordföljd som engelskan tålde, vilket gör American Standard Version exakt och, i långa stycken, styv. Dess mest synliga beslut gäller gudsnamnet: där King James Version tryckte “the LORD” med kapitäler trycker American Standard Version “Jehovah”, tusentals gånger, genom hela Gamla testamentet. I Nya testamentet följer den revisorernas grekiska i stället för Textus Receptus, så läsarter som King James-översättarna hade men som äldre handskrifter saknar — den trinitariska satsen i 1 Joh. 5:7 bland dem — står i not eller är borta.
hero.3=American Standard Version blev aldrig någon bänkbibel. Vad den blev var en stamform. Revised Standard Version från 1952 var en revision av den; det var New American Standard Bible också, som finns i detta korpus; och det är World English Bible, som förde American Standard Version vidare till det fria med modern stavning. Därför står den där den står bland läsarens stegpinnar — mitt i den längsta kedja korpuset har. Öppna en stegpinne under en ASV-vers och Revised Version som den gjordes av träder fram under den, och under den King James Version och Genèvebibeln, ned till urspråksbotten som är märkt med ≈. Öppna en stegpinne under en vers ur World English Bible och du kommer tillbaka hit.

