title=Diodati 1885 (italienska) — Om denna utgåva | Common Root
description=Giovanni Diodatis italienska bibel i en form från artonhundratalet: hans text från 1641, reviderad 1821, i en utgåva daterad 1885 — samma översättning som den andra Diodati i detta korpus, men annorlunda indelad i verser.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Detta är Giovanni Diodatis översättning — genèvaren av luccesisk släkt, född 1576, som 1607 gav ut den första italienska bibeln översatt från hebreiskan och grekiskan i stället för latinet, och reviderade den med egna anmärkningar 1641, åtta år innan han dog. Den andra Diodati i detta korpus har en egen sida som berättar den historien. I två sekel efter honom levde texten genom att tryckas om, och från 1808 gav Brittiska och utländska bibelsällskapet ut den i upplaga efter upplaga, eftersom det för italienska protestanter inte fanns något annat att trycka.
hero.2=Denna fil är en av de senare formerna. eBible.org, som tillhandahåller den för Förenade bibelsällskapens räkning, beskriver den som Diodatis översättning från 1641, reviderad 1821, i en utgåva daterad 1885. Vem som gjorde revisionen 1821 och vilket tryckeri som tryckte utgåvan 1885 är inget som detta projekt har fastställt, så sidan nämner dem inte. Årtalet är inte det problem det är hos den andra Diodati, vars etikett är året då Diodati dog: 1885 är utgåvans eget årtal, katalogen lagrar det, och stegpinnen visar det.
hero.3=Ställd bredvid den andra Diodati är ordalydelsen densamma i varje stickprov: ”il Signore è il mio pastore” i Psalm 23, ”la Vergine concepirà” i Jesaja 7:14, de himmelska vittnena i 1 Joh 5:7, lovprisningen i slutet av Herrens bön, Apostlagärningarna 8:37 i sin helhet. Gudsnamnet är ”il Signore”, Herren, så som Diodati skrev det; det var Riveduta, en revision av denna text utgiven 1924, som ändrade det till ”l'Eterno”. Det som skiljer är versindelningen. På mer än trettio ställen följer denna kopia ett annat system, nära det hebreiska — Jonas bön börjar vid 2:1 och kapitlet går till 2:11, Jesaja 8 har en 23:e vers, Job 39 fortsätter till vers 38, och den första versen i Kolosserbrevet 4 står i slutet av kapitel 3 — så den räknar sju verser färre sammanlagt. Och denna kopia saknar alla psalmöverskrifter: Psalm 51 börjar direkt med ”Abbi pietà di me, o Dio”, där den andra Diodati bakar in överskriften i första versen. eBible.orgs egen presentation av texten visar överskrifterna, så de gick troligen förlorade vid detta projekts import och saknas inte i 1885 års tryck.
hero.4=I denna läsare är den en av tre italienska biblar. Ett italienskt gränssnitt öppnar på den andra Diodati, Diodati 1649, som kommer först i katalogordning, eftersom italienskan inte har något kurerat val. Ingen förlaga är registrerad för den i härstamningens stegpinnar — inte ens den andra kopian av samma översättning — så en stegpinne som öppnas under en vers faller rakt ner till grundspråksgolvet märkt med ≈. Liksom hos den andra Diodati ligger Textus Receptus där nära sanningen: Diodati arbetade från Bezas tryckta grekiska, en text av den familjen.

