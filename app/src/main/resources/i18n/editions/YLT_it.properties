title=Young's Literal Translation — Informazioni su questa edizione | Common Root
description=La traduzione letterale della Bibbia di Robert Young, pubblicata per la prima volta a Edimburgo nel 1862, riveduta da Young nel 1887 e dai suoi editori nel 1898: una Bibbia inglese che conserva i tempi verbali, l'ordine delle parole e, per quanto può, il lessico dell'ebraico e del greco, anche dove l'inglese fatica a seguirli.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) fu tipografo e libraio a Edimburgo. Imparò da sé l'ebraico e diverse altre lingue orientali durante l'apprendistato di tipografo, diresse una tipografia missionaria a Surat, in India, dal 1856 al 1861, ed è ricordato soprattutto per due libri: la concordanza Analytical Concordance to the Bible e questa traduzione. Pubblicò la Literal Translation a Edimburgo nel 1862 e un'edizione riveduta nel 1887. Dieci anni dopo la sua morte, nel gennaio 1898, i suoi editori fecero uscire una terza edizione, riveduta ancora una volta «secondo le sue linee attuali»; è il testo di questo corpus. Young tradusse l'Antico Testamento dall'ebraico masoretico ricevuto e il Nuovo Testamento dal testo greco ricevuto, il Textus Receptus, e disse chiaramente che non avrebbe tentato di formare un testo nuovo di nessuno dei due: la traduzione, scrisse, è un compito diverso dalla critica testuale, e pochi sono qualificati per entrambe.
hero.2=Tutto il suo scopo è lasciare che un lettore inglese veda la grammatica dell'originale. Young sosteneva che una versione che dà un presente dove l'originale ha un passato, o «an a for a the», un articolo indeterminativo per un determinativo, mette da parte l'ispirazione verbale, e tradusse di conseguenza. Le forme verbali ebraiche passano come tempi inglesi, così che il racconto scorre spesso al presente: la Genesi si apre con «In the beginning of God's preparing the heavens and the earth —» e prosegue «and God saith, ‘Let light be;’ and light is.» Le parole aggiunte per il senso stanno tra parentesi quadre: «Jehovah [is] my shepherd, I do not lack.» Cercò di dare a ogni parola ebraica o greca un unico equivalente inglese ogni volta che poté, e così l'ebraico olam e il greco aiōn diventano «age» e «age-during» invece di «ever» ed «eternal»; in Matteo 25:46 i giusti se ne vanno «to life age-during». Il nome divino compare in tutto l'Antico Testamento come «Jehovah».
hero.3=La nostra copia è completa: 66 libri, dalla Genesi all'Apocalisse, senza gli apocrifi, nella numerazione inglese di capitoli e versetti — 150 salmi, con il titolo di ciascuno incorporato nel primo versetto, e Malachia che termina al capitolo 4. In quanto traduzione del testo ricevuto, contiene i passi che le edizioni critiche successive mettono in dubbio, dalla finale lunga di Marco ai tre testimoni in cielo di 1 Giovanni 5:7, che questo testo pone tra parentesi quadre, come fa con tutto Atti 8:37. In questo lettore sta da sola. Il corpus non le registra alcun genitore, così che un piolo di discendenza aperto sotto uno dei suoi versetti cade dritto sul pavimento delle lingue originali contrassegnato con ≈: il Codice di Leningrado nell'Antico Testamento e il Textus Receptus nel Nuovo. Quel pavimento è vicino a ciò che Young stesso tradusse, l'ebraico masoretico e il greco ricevuto, anche se non nelle stesse stampe. Nulla risulta registrato come poggiante su di essa. La Literal Standard Version del 2020, anch'essa in questo corpus, si presenta come una revisione importante dell'opera di Young, ma il corpus non registra questo legame, perciò i pioli sotto la LSV non portano qui. Nessuna lingua dell'interfaccia si apre su questa edizione; un'interfaccia inglese si apre sulla New International Version, e a questa si arriva dalla sua scheda nella griglia delle traduzioni.

