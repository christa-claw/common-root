fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Traduttore
fact.2.value=Robert Young (1822–1888), tipografo, libraio e linguista autodidatta di Edimburgo, compilatore della Analytical Concordance to the Bible
fact.3.label=Antico Testamento da
fact.3.value=Il testo ebraico masoretico ricevuto — la tradizione a cui appartiene anche [[WLC|il Codice di Leningrado]] di questo corpus
fact.4.label=Nuovo Testamento da
fact.4.value=Il testo greco ricevuto, [[TR|il Textus Receptus]] — mantenuto, scrisse Young, «non perché lo si ritenga perfetto», ma perché traduzione e critica testuale sono compiti distinti
fact.5.label=Tipo di traduzione
fact.5.value=Rigorosamente letterale: i tempi dell'originale mantenuti anche dove l'inglese suona strano, così che il racconto scorre spesso al presente; una parola inglese per ogni parola dell'originale per quanto possibile, con olam e aiōn resi «age» e «age-during»; le parole aggiunte per il senso tra parentesi quadre; il nome divino come «Jehovah»
fact.6.label=Pubblicata
fact.6.value=Edimburgo, 1862; riveduta da Young, 1887; terza edizione, riveduta di nuovo dai suoi editori, Edimburgo, gennaio 1898 — il testo presente qui
fact.7.label=Licenza
fact.7.value=Pubblico dominio; questa copia da eBible.org
fact.8.label=In questo corpus
fact.8.value=66 libri, il canone protestante completo, senza gli apocrifi; numerazione inglese di capitoli e versetti, così che i salmi sono 150 e il titolo di ciascuno è incorporato nel suo primo versetto
fact.9.label=Discendenza
fact.9.value=Nessun genitore registrato e nulla registrato come poggiante su di essa — un piolo si apre dritto sul pavimento delle lingue originali, [[WLC|il Codice di Leningrado]] nell'Antico Testamento e [[TR|il Textus Receptus]] nel Nuovo; [[LSV|la Literal Standard Version]] del 2020 rivede l'opera di Young, ma il corpus non registra il legame
