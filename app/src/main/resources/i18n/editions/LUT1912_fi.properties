fact.12.value=Saksalaisten tikkaiden ylin askelma: yksi merkitty edeltäjä, [[LUT1545|Luther Bibel 1545]], ja sen alla alkukielten lattia. Sen 85 tarkistajan huomautusta on säilytetty täällä kommentteina eikä pudotettu, ja ne ovat laitoskohtaisia — vuoden 1912 selitys näkyy vuoden 1912 palstan alla eikä missään muualla. Se ei ole se, jolle saksankielinen käyttöliittymä avautuu; se on [[ELB|Elberfelder]], luettelossa ensimmäinen lyhenteensä perusteella eikä mistään muusta syystä
