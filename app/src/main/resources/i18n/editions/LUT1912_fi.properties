title=Luther Bibel 1912 — Tietoja tästä laitoksesta | Common Root
description=Lutherin Raamatun toinen kirkollinen tarkistus: tietoisen varovainen läpikäynti, joka valmistui 1910, hyväksyttiin 1912 ja jäi viimeiseksi Luther-tekstiksi Textus Receptuksen varassa.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Tarkistuksen tarkistus. Saksan kirkot olivat sopineet Lutherin Raamatun yhdestä tekstistä vuonna 1892, ensimmäisessä kirkollisessa tarkistuksessa, ja muutamassa vuodessa sitä sanottiin riittämättömäksi. Moitteet olivat vanhat: liikaa arkaismeja ja oikeinkirjoitus joka ei enää ollut kenenkään. Jälkimmäinen ratkaisi asian. Duden oli antanut Saksan keisarikunnalle sitovan oikeinkirjoituksen, jota kouluissa opetettiin, ja siitä poikkeava Luther-Raamattu oli hankala asettaa luokan eteen. Vuonna 1906 Saksan evankelinen kirkkokonferenssi päätti uudesta tarkistuksesta ja määräsi sen tehtäväksi hellävaroen ja säilyttäen. Teologien komitea kävi läpi jokaisen kirjan vuoteen 1910 mennessä, ja 1912 konferenssi hyväksyi tuloksen.
hero.2=Työ kesti tuskin kahta vuotta enempää, mikä kertoo millaisesta tarkistuksesta oli kyse. Kukaan ei yrittänyt tehdä uutta Luther-Raamattua, ei filologisesti eikä muutenkaan. Myöhempi tarkistaja Fritz Tschirch kuittasi sen koulumestarimaiseksi tarkistukseksi, eikä nimitys ole menetelmästä väärässä — oikeinkirjoitus yhdenmukaistettiin, ilmeisimmin kuolleet sanat vaihdettiin, sanamuoto jätettiin muuten sinne mihin Luther oli sen pannut. Mitä nimitys ei huomaa, on se miten hyvin teksti kesti. Osittaisten tarkistusten vuosikymmenten läpi vuoden 1912 teksti pysyi paikallaan, ja sitä luetaan ja myydään yhä. Osaksi siitä on kiittäminen vuoden 1912 Jubiläumsbibeliä, Württembergin raamattulaitoksen satavuotislaitosta selittävine huomautuksineen, jota painettiin fraktuuralla pitkälle tälle vuosisadalle. Osaksi se on rauennut tekijänoikeus: tekstin jäljentäminen ei maksa mitään, ja siksi sitä on kaikkialla — myös täällä.
hero.3=Yksi asia ennen muita pitää sen käytössä konservatiivisten lukijoiden parissa: se on viimeinen Luther-tarkistus joka rakentuu Textus Receptukselle, 1500- ja 1600-luvun kreikkalaiselle Uudelle testamentille. Kaikki sen jälkeen siirtyi kriittiseen tekstiin. Se tekee tästä laitoksesta epätavallisen puhtaan askelman tikkaissa, sillä sen alla oleva kreikka on sama kreikka joka on Lutherin oman vuoden 1545 laitoksen alla ja Geneven ja King Jamesin alla — koko torni jakaa saman lattian sen sijaan että se vaihdettaisiin puolimatkassa.
hero.4=Linjan askelmissa tämä laitos on suoraan Luther Bibel 1545:n yläpuolella, ja sillä on täsmälleen yksi merkitty edeltäjä, juuri se. Avaa askelma vuoden 1912 jakeen alta, niin Lutherin oma vuoden 1545 sanamuoto ilmestyy sen alle; avaa toinen, niin tikkaat ulottuvat Textus Receptukseen kreikan osalta ja Westminster Leningrad Codexiin heprean osalta. Kolmesataakuusikymmentäseitsemän vuotta tarkistusta, jae jakeelta, kahdella klikkauksella. Mitä tämä laitos ei ole, on se Raamattu jolle saksankielinen käyttöliittymä avautuu — saksalle ei ole valittua oletusta, joten lukija saa luettelon ensimmäisen saksalaisen Raamatun, ja se on Elberfelder.

