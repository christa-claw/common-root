title=布伦顿希腊文七十士译本 — 关于本版本 | Common Root
description=七十士译本——犹太散居群体与早期教会的希腊文旧约——采用兰斯洛特·布伦顿1851年与其英译并排印行的希腊文本；在本阅读器中，它是武加大译本与俄文教会公会译本之下的一级。
heroHeading=布伦顿希腊文七十士译本
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=七十士译本是希伯来圣经最古老的译本，在基督教最初的几个世纪里，它就是圣经本身。亚历山大城说希腊语的犹太人从律法五书开始翻译，大约在公元前3世纪，其余各卷在此后2个世纪中陆续译出。这个名称来自一个故事：《亚里斯提亚书信》讲述有72位长老从耶路撒冷被派去，为国王托勒密二世翻译律法，于是“七十士”——罗马数字写作 LXX——成了整部希腊文旧约的名称。新约作者不断引用它，早期教会诵读它，东正教会至今仍以它为自己的旧约。
hero.2=它的意义不只在于古老。译者所依据的希伯来文抄本，在一些地方与后来定为标准的马所拉文本不同——例如耶利米书的希腊文本就明显较短——因此在许多地方，七十士译本是某种希伯来文读法的最古老见证，而希伯来传统本身并未保存这种读法。它还包含希伯来正典所没有的书卷，其中有多俾亚传、友弟德传、智慧篇、德训篇和巴路克书。它的一些措辞还成了教义：以赛亚书7:14，希伯来文作 ʿalmah，意为“少女”，希腊文作 parthenos，意为“童女”——马太所引用的正是这个词。
hero.3=这里的希腊文本是兰斯洛特·布伦顿爵士所印行的。他于1844年出版了七十士译本的英译本，主要依据梵蒂冈抄本——藏于梵蒂冈图书馆的一部4世纪抄本；1851年，伦敦的塞缪尔·巴格斯特重新出版该书，增补了次经各卷，并把希腊文与英文并排排印，本语料库所收的正是这一希腊文本。其诗篇保留希腊文编号，与这里的武加大译本相同：两者的第22篇都是牧者之诗，在希伯来文本和大多数英文圣经中则是第23篇。诗篇共151篇；以斯拉记与尼希米记合为一卷；以斯帖记和但以理书采用较长的希腊文形式。
hero.4=在本阅读器中，它是一级梯阶，而不是底层。它位于拉丁文武加大译本之下，因为武加大译本有一部分是经由希腊文而来的：其诗篇是哲罗姆依据俄利根《六文本合参》中的希腊文译出的，始终未被他本人从希伯来文译出的版本取代；智慧篇、德训篇和巴路克书则保留了从希腊文译出的古拉丁文译本。它位于俄文教会公会译本之下，后者的旧约从其背后的教会斯拉夫文圣经中保留了许多七十士译本的读法；它也位于布伦顿本人的英译本之下。它自身没有记录在案的母本：它所据以翻译的希伯来文本不在本语料库中，而列宁格勒抄本晚于它1000多年，属于马所拉一系，在它之下仅作为原文语言的底层出现。它只有旧约，因此在新约经文之下会跳过这一级——而且希腊文传统中的书卷并非都在这里：这一本共45卷，没有任何一卷马加比书。

