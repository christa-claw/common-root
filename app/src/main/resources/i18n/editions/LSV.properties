title=Literal Standard Version — About This Edition | Common Root
description=The Literal Standard Version: Covenant Press's 2020 revision of Robert Young's nineteenth-century Literal Translation, aiming for the most consistently word-for-word English rendering of the Hebrew, Aramaic and Greek that readable English allows.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=The Literal Standard Version describes itself as a major revision of Robert Young's Literal Translation, the extremely literal nineteenth-century English Bible first published in 1862 and revised by Young himself in 1887 and 1898. Covenant Press, the publishing arm of the Covenant Christian Coalition, began the new revision in early 2018 with the stated aim of keeping Young's commitment to word-for-word literalism while updating its English and correcting places where later manuscript and lexical scholarship had moved on. The work was completed and released on February 2, 2020; United States copyright was registered that January, and e-book editions followed in May of the same year. The individual translators are not named in the published edition; Covenant Press and the Covenant Christian Coalition are credited as the sponsoring bodies.
hero.2=For the Old Testament, the LSV follows the Masoretic Text, with substantial influence from the Septuagint and occasional recourse to the Dead Sea Scrolls where their readings seemed clear enough to prefer. For the New Testament it follows the Textus Receptus and the Majority Text, adopting Alexandrian-tradition readings only in specific, stated instances rather than as a general policy. The translators set out three governing principles: preserve the verb tense of the original wherever English allows, render a given original word with the same English word wherever consistency is possible, and keep the original word order except where English readability genuinely requires a change. The Old Testament's divine name is transliterated rather than rendered by a title such as "LORD," in keeping with the translation's general preference for showing readers the original text's own choices rather than smoothing them away.
hero.3=The corpus connection worth noting is textual rather than genealogical: the Literal Standard Version's New Testament draws on the Textus Receptus and the Majority Text, the same Greek base this corpus holds separately and in full as the Textus Receptus — the text behind the King James Version and the Reformation-era tradition generally. No lineage rung connects the two editions, since the LSV is presented as a revision of Young's Literal Translation rather than of the Textus Receptus itself or of any text held here; a rung opened beneath an LSV verse accordingly goes straight to the original-language floor, marked ≈. It is released under a Creative Commons Attribution-ShareAlike 4.0 licence rather than dedicated to the public domain, which puts it alongside the New International Version and the New American Standard Bible as licensed rather than freely copyable — though under markedly more permissive terms than either. The English interface opens on the New International Version by default; this edition is reached from its own card in the translation grid.

