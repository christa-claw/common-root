title=教义和圣约 — 关于此版本 | Common Root
description=《教义和圣约》：约瑟·斯密记录的启示及其他言论，于1835年首次在俄亥俄州柯特兰出版，被末世圣徒视为与《圣经》并列的经典。
heroHeading=教义和圣约
readerHref=/reader?c1.src=dc

hero.1=《教义和圣约》收录了启示、灵视及其他言论，小约瑟·斯密说这些是他直接从神那里领受的信息，主要记录于教会最初几年间，地点在俄亥俄州、密苏里州和纽约州。一部更早的编纂，题为《治理基督教会的诫命书》，当时正在密苏里州独立城的教会印刷所印刷，1833年7月一群暴徒摧毁了印刷所，在书籍完成之前将未完成的页张四散毁损；该书从未正式出版，但当时抢救出的少量未装订页张留存至今。
hero.2=经过扩充并重新命名的《末世圣徒教会教义和圣约》于1835年问世，出版于俄亥俄州柯特兰，由约瑟·斯密、奥利弗·考德里、西德尼·里格登和弗雷德里克·G·威廉姆斯四人组成的委员会编纂并核准。那一版将两类文献合订于一册之中——一系列在柯特兰学校讲授的神学讲座，列为该书的"教义"部分，以及记录下来的启示本身，列为该书的"圣约"部分。这些讲座后来被称为《信心讲座》，之后从书中删去——这一变动通常定在1921年版——此后启示便构成了全书的内容。
hero.3=全书按编号的"篇"划分，而非像《圣经》那样分为卷、章、节，这反映了它的性质：一批各自独立的文本的汇编，而非单一连续的叙事。书中的内容与编号都在19世纪的各版之间发生过变化，其中1876年由奥森·普拉特主持的一版重新整理了早先的内容，并加入了新的启示。现代版本于1981年定型，当时又加入了两项内容——关于荣耀等级的灵视和关于死者救赎的灵视——分别列为第137篇和第138篇，同时加入了两份"正式声明"：1890年的声明终止了教会对新多配偶婚姻的认可，1978年的声明将圣职授予扩展至所有不论种族、够资格的男性成员。2013年版又更新了其他参考资料。如今通行的标准版收录138篇及两份正式声明。
hero.4=它是末世圣徒运动所称的四部标准经典之一，与《圣经》、《[[BOM|摩尔门经]]》及《[[PGP|无价珍珠]]》并列。源自同一运动的另一个独立教派基督社区（Community of Christ）保有自己的《教义和圣约》，编号与更新均与此版本各自独立。本语料库中的文本来自Mormon Documentation Project的JSON数据导出，与《[[BOM|摩尔门经]]》及《[[PGP|无价珍珠]]》所用的公共领域来源相同，在此以一部名为《教义和圣约》的单一书卷呈现，其中每一篇充当一章；文本遵循现行标准版本的措辞，省去了仍受版权保护的脚注与章节标题，因此未为其标注单一的出版年份。

