title=Riveduta 1927 (italia) — Tietoja tästä laitoksesta | Common Root
description=Riveduta: Giovanni Diodatin italiankielinen Raamattu tarkistettuna hepreaa ja kreikkaa vasten valdolaisen teologin Giovanni Luzzin johtamassa komiteassa, julkaistu Roomassa 1924 Brittiläisen ja ulkomaisen raamattuseuran toimesta — ja miksi tiedostossa lukee 1927.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi syntyi 1856 Ala-Engadinissa, Sveitsin Graubündenin kantonissa, ja hänet vietiin vauvana Luccaan, kun perhe muutti sinne seuraavana vuonna. Hän kasvoi italialaiseksi, opiskeli valdolaisessa teologisessa tiedekunnassa Firenzessä — Italian vanhan protestanttisen kirkon oppilaitoksessa — ja opetti myöhemmin siellä teologiaa sekä toimi kaupungissa pappina. Viimeiset vuotensa hän vietti jälleen Sveitsissä, Poschiavossa, ja kuoli siellä 1948.
hero.2=Riveduta sai alkunsa 1906, kun Brittiläinen ja ulkomainen raamattuseura, joka oli jo sadan vuoden ajan painanut Diodatin seitsemänneltätoista vuosisadalta peräisin olevaa käännöstä italialaisille lukijoille, asetti ryhmän tarkistamaan sitä ja Luzzin sen johtoon. Hän oli toivonut, että siitä tulisi yhteinen Raamattu katolisten oppineiden kanssa; Vatikaani kieltäytyi, ja työ jatkui protestanttisena tarkistuksena. Koko Raamattu ilmestyi Roomassa 1924, ja nimiölehti kuvasi sitä alkutekstiä vasten tarkistetuksi laitokseksi — ”riveduta”, tarkistettu, ja sillä nimellä se on tunnettu siitä asti. Se ei ole uusi käännös: pohjalla on Diodatin teksti, tarkistettuna uudelleen hepreaa ja kreikkaa vasten. Siitä tuli Italian protestanttien Raamattu lähes koko kahdennenkymmenennen vuosisadan ajaksi, ja sen jälkeläisen, Nuova Rivedutan, julkaisi Geneven raamattuseura 1994. Luzzi teki myös oman, selityksin varustetun käännöksen kahtenatoista niteenä, joita julkaistiin Firenzessä vuodesta 1921 alkaen; se on eri teos eikä tämä teksti.
hero.3=Tarkistus näkyy sivulla. Jumalan nimi on Vanhassa testamentissa ”l'Eterno”, Iankaikkinen — ”L'Eterno è il mio pastore” psalmissa 23 — kun Diodatilla on ”il Signore”. Jesajan 7:14 kuuluu ”la giovane”, nuori nainen, kun Diodatilla on ”la Vergine”. Uudessa testamentissa se poikkeaa Textus Receptuksesta siellä, missä myöhemmät kriittiset laitokset poikkeavat: 1. Joh. 5:7 on ilman taivaallisia todistajia, Isä meidän -rukous Matteuksen 6:13:ssa päättyy ilman ylistystä, ja Apostolien tekojen 8:37 on säilytetty mutta hakasulkeissa. Psalmit noudattavat heprealaista numerointia, ja psalmin otsikko on liitetty sen ensimmäiseen jakeeseen — psalmi 23 alkaa sanoin ”Salmo di Davide.” — joten psalmissa 51 on 19 jaetta, kuten englantilaisissa raamatuissa. Entä vuosiluku: 1927 on vuosi, jonka digitaalinen teksti kantaa ja jonka luettelo tallentaa, joten sen askelmamerkintä näyttää 1927. Itse Riveduta ilmestyi 1924, eikä tämä hanke ole selvittänyt, mitä myöhempää painosta tiedosto toistaa.
hero.4=Tässä lukuohjelmassa se on yksi kolmesta italiankielisestä Raamatusta, kahden Diodati-kappaleen rinnalla. Italiankielinen käyttöliittymä ei avaa sitä: italialle ei ole valittu omaa käännöstä, joten lukuohjelma ottaa luettelojärjestyksessä ensimmäisen italiankielisen Raamatun, joka on Diodati 1649. Polveutumisaskelmiin ei ole kirjattu sille kantatekstiä — ei edes Diodatia, vaikka Riveduta on Diodatin tarkistus ja Diodati on aineistossa — joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukieliseen pohjaan: Vanhassa testamentissa Westminsterin Leningradin koodeksiin ja Uudessa Textus Receptukseen, juuri siihen kreikkaan, josta tämä tarkistus siirtyi pois.

