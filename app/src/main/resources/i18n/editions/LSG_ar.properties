fact.9.value=66 سفرًا — القانون البروتستانتي، بلا أسفار قانونية ثانية؛ والمزامير بالترقيم العبري، مع عدّ العناوين آيات
fact.10.label=الترخيص
fact.10.value=ملك عام؛ وهذه النسخة من eBible.org
fact.11.label=في هذه المجموعة
fact.11.value=واحد من ثلاثة كتب مقدسة فرنسية، إلى جانب أوسترفالد و[[DBY|داربي الفرنسية]]؛ والواجهة الفرنسية تفتح على داربي لا عليه؛ وليس له في درجات النسب أصل مسجّل، وشارة درجته تُظهر 1910
