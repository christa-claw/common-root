fact.2.value=لويس سيغون (1810–1885)، قسّ كنيسة جنيف في شين-بوجري، ثم مدرّس العبرية والعهد القديم
fact.3.label=بتكليف من
fact.3.value=جماعة القساوسة الموقّرة في جنيف، للعهد القديم؛ أما العهد الجديد فتولّاه بنفسه
fact.4.label=أول نشر
fact.4.value=العهد القديم في طبعة مؤرَّخة بـ 1874؛ والكتاب المقدس كاملًا في مجلّد واحد، أكسفورد، 1880
fact.5.label=هذه المراجعة
fact.5.value=1910، لجمعية الكتاب المقدس البريطانية والأجنبية، على يد جماعة من القساوسة واللاهوتيين الفرنسيين والسويسريين
fact.6.label=مترجم عن
fact.6.value=عبرية العهد القديم وآراميّته — التقليد الذي تحفظه هذه المجموعة باسم [[WLC|مخطوطة لينينغراد]] — وعن العهد الجديد اليوناني النقدي لتيشندورف، لا [[TR|النص المستلم]]
fact.7.label=الاسم الإلهي
fact.7.value=«l'Éternel» — الأزلي — في العهد القديم كله
fact.8.label=مراجعات لاحقة
fact.8.value=منها «Colombe» (1978)، وNouvelle Édition de Genève (1979)، وSegond 21 (2007)
