title=لويس سيغون 1910 (الفرنسية) — عن هذه الطبعة | Common Root
description=كتاب سيغون المقدس في مراجعة 1910: ترجمة قسّ جنيفيّ عن العبرية واليونانية، طُبعت كاملةً أول مرة في 1880، ورُوجعت لجمعية الكتاب المقدس البريطانية والأجنبية، وظلّت قرنًا كاملًا الكتاب المقدس المعتاد عند البروتستانت الناطقين بالفرنسية.
heroHeading=لويس سيغون 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=وُلد لويس سيغون في 1810 في بلانبالي، وكانت يومئذ خارج جنيف مباشرة، وتوفي في جنيف في 1885. درس اللاهوت في الكلية البروتستانتية في ستراسبورغ، ونال الدكتوراه في اللاهوت في السادسة والعشرين، وظلّ أربعًا وعشرين سنة قسًّا لرعية قرية شين-بوجري قبل أن ينصرف إلى تدريس العبرية والعهد القديم. وكلّفته جماعة القساوسة الموقّرة في جنيف بأن يترجم العهد القديم من العبرية ترجمة جديدة، فصدرت ترجمته في طبعة مؤرَّخة بـ 1874. ثم ترجم العهد الجديد بمبادرة منه، معتمدًا النص اليوناني النقدي لقسطنطين تيشندورف لا النص المستلم، وفي 1880 صدر الكتاب المقدس كله في مجلّد واحد، مطبوعًا في أكسفورد.
hero.2=وليس هذا تمامًا النص الذي نشره سيغون. فبعد وفاته عهدت جمعية الكتاب المقدس البريطانية والأجنبية بمراجعته إلى جماعة من القساوسة واللاهوتيين الفرنسيين والسويسريين، وصدرت المراجعة في 1910. ومالت تعديلاتهم إلى مفردات الأرثوذكسية البروتستانتية — فصار الكهنة «sacrificateurs»، وهي الكلمة البروتستانتية القديمة، لا «prêtres»؛ وفي هذه النسخة ترد «sacrificateur» في كل مكان و«prêtre» نادرًا. وهذا النص نفسه، نص 1910، هو الذي صار الكتاب المقدس المرجعي للبروتستانتية الفرنسية طوال معظم القرن العشرين، ولا يزال من أكثر ما يقرؤه الإنجيليون الناطقون بالفرنسية. وله أيضًا سلالة طويلة من المراجعات اللاحقة: «Colombe» سنة 1978، وNouvelle Édition de Genève سنة 1979، وSegond 21 سنة 2007. وتظهر بعض السمات في كل صفحة تقريبًا. فالاسم الإلهي «l'Éternel»، أي الأزلي، كما عند أوسترفالد وفي داربي الفرنسية التي تجاورها في هذه المجموعة: «L'Éternel est mon berger» في المزمور 23. ويقرأ إشعياء 7:14 «la jeune fille deviendra enceinte» — الفتاة الشابة لا العذراء — وهو بالضبط ضرب الترجمة الذي اتّهم بسببه بعضُ البروتستانت المحافظين سيغونَ بإضعاف النبوءات المسيانية.
hero.3=وفي المزامير يتبع الكتاب العبرية: فالترقيم عبري، فيكون المزمور 23 مزمور الراعي، وحيث يكون عنوان المزمور آيةً في العبرية يكون آيةً هنا أيضًا — فللمزمور 51 عدد 21 آية، بزيادة آيتين على King James Version. أما يوئيل وملاخي فيحتفظان بتقسيم الإصحاحات في التقليد اللاتيني والإنجليزي، ثلاثة إصحاحات وأربعة. وهو في هذا القارئ واحد من ثلاثة كتب مقدسة فرنسية، إلى جانب أوسترفالد وداربي الفرنسية. والواجهة الفرنسية لا تفتح عليه: فليس للفرنسية اختيار منتقى، فيأخذ القارئ أول كتاب مقدس فرنسي في ترتيب الفهرس، وهو داربي. وليس له في درجات النسب أصل مسجّل، فالدرجة المفتوحة تحت الآية تهبط رأسًا إلى أرضية اللغات الأصلية المعلَّمة بـ ≈ — وهي للعهد القديم مخطوطة لينينغراد، مخطوطة من التقليد الماسوري لا نص عبري مطبوع من زمن سيغون، وللعهد الجديد النص المستلم، أي اليونانية التي اختار ألّا يتبعها بالذات. وشارة درجته تحمل السنة 1910.

