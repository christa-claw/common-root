fact.1.label=Lingua
fact.1.value=arabo coranico, nell'ortografia uthmani standard
fact.2.label=Lettura (qira'ah)
fact.2.value=Hafs da Asim — trasmessa da Hafs ibn Sulayman (m. 796) da Asim ibn Abi al-Najud di Kufa (m. 745); una delle quattordici trasmissioni riconosciute, e quella che segue la maggior parte dei Corani stampati nel mondo
fact.3.label=Forma stampata standard
fact.3.value=l'edizione del Cairo del 1924 — una commissione di studiosi di al-Azhar, al lavoro dal 1907 sotto re Fuad I, stampata dalla Stamperia Amiri di Bulaq il 10 luglio 1924; il modello seguito dalla maggior parte delle stampe successive, incluso quello dello stesso Complesso Re Fahd
fact.4.label=Testo qui utilizzato
fact.4.value=l'edizione quran-uthmani di alquran.cloud, il cui testo arabo deriva dalla digitalizzazione del Progetto Tanzil
fact.5.label=Confrontato con
fact.5.value=la copia hafs dello stesso Complesso Re Fahd per la stampa del Corano glorioso, versetto per versetto: concorda sullo scheletro consonantico in tutti i suoi 6.236 versetti, con ogni differenza limitata alla notazione vocalica, all'ortografia della hamza e a otto casi di divisione delle parole
fact.6.label=Ciò che questa concordanza non dimostra
fact.6.value=la discendenza — concordare non è discendere — né una licenza: una richiesta al Complesso per mostrare i propri file, inviata a fine agosto 2026, non aveva ricevuto risposta al momento in cui si scrive
fact.7.label=Traduzioni di confronto in questo corpus
fact.7.value=[[Q-EN|quella inglese di Pickthall]] (1930), [[Q-YA|quella inglese di Yusuf Ali]] (1934) e [[Q-SAB|quella russa di Sablukov]] (1878) — tre traduzioni che si accompagnano a questo testo base sotto ogni versetto
fact.8.label=In questo corpus
fact.8.value=l'unico testo arabo a cui si accompagna qui ogni [[Q-EN|traduzione]]; in contrasto, [[FB1776|la Bibbia finlandese del 1776]], dove semplicemente non si sa da quale stampa il testo discenda
fact.9.label=Licenza
fact.9.value=di pubblico dominio — l'arabo coranico è trattato come non appartenente a nessuno; i termini della nostra fonte chiedono solo che la riproduzione mantenga intatta l'ortografia uthmani
