title=Corano — testo uthmani — Informazioni su questa edizione | Common Root
description=Il Corano nella lettura hafs da asim, il testo su cui si basa la maggior parte dei Corani stampati nel mondo fin dall'edizione del Cairo del 1924 — e, in questo corpus, un testo confrontato versetto per versetto con la copia dello stesso Complesso Re Fahd, risultato concordante nello scheletro consonantico in tutti i suoi 6.236 versetti.
heroHeading=Corano — testo uthmani
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=La lettura su cui si fonda questo testo ha una catena di trasmissione nota. Hafs ibn Sulayman al-Kufi (m. 796) la trasmise dal suo maestro, Asim ibn Abi al-Najud, uno dei lettori di Kufa la cui recitazione Ibn Mujahid canonizzò più tardi tra le sette (Asim morì nel 745). Hafs da Asim — "Hafs, secondo Asim" — è una delle diverse letture che i musulmani considerano trasmissioni egualmente autorevoli della stessa rivelazione; non è l'unica, ma è di gran lunga la più stampata. Quando una commissione di studiosi di al-Azhar, al lavoro dal 1907 sotto re Fuad I, produsse il Corano egiziano standard che la Stamperia Amiri di Bulaq pubblicò il 10 luglio 1924, fu questa lettura a essere fissata nei caratteri. La maggior parte dei Corani venduti oggi ovunque, incluso quello dello stesso Complesso Re Fahd, segue l'esempio di quell'edizione.
hero.2=Ciò che si trova in questo corpus proviene, tramite l'edizione quran-uthmani di alquran.cloud, dalla digitalizzazione fatta dal Progetto Tanzil di quello stesso testo hafs. Nel lettore si accompagna a tre traduzioni: quella inglese di Pickthall del 1930, quella inglese di Yusuf Ali del 1934 e quella russa di Sablukov del 1878 — apra una delle tre accanto a questa, e la sua resa appare sotto ogni versetto. Il lettore offre anche il Corano in due ordini: la sequenza canonica del mushaf fissata da questa stessa tradizione, e l'ordine che gli studiosi ricostruiscono per il momento in cui ciascuna sura fu rivelata.
hero.3=La conservazione lettera per lettera è essa stessa una delle affermazioni fatte su questo testo, perciò qui viene verificata piuttosto che presupposta. Confrontato versetto per versetto con la copia hafs dello stesso Complesso Re Fahd per la stampa del Corano glorioso, i due testi concordano sullo scheletro consonantico — le lettere nude, prima che sia aggiunto alcun segno vocalico — in tutti i suoi 6.236 versetti. Ogni differenza trovata si limita al modo in cui sono annotate le vocali e i segni di pausa, all'ortografia della hamza e a otto punti in cui le due parti tracciano diversamente il confine tra parole; nessuna riguarda una sola lettera del testo stesso. È l'opposto dell'incertezza che questo corpus deve ammettere per la Bibbia finlandese del 1776, dove semplicemente non si sa da quale stampa il testo discenda.
hero.4=Due cose che questa concordanza non dimostra vale la pena dirle chiaramente. Non è un'affermazione di discendenza — concordare con il testo del Complesso mostra che i due sono lo stesso testo, non che l'uno sia stato copiato dall'altro. E non è una licenza: una richiesta inviata al Complesso a fine agosto 2026, per chiedere il permesso di mostrare i propri file delle riwayat, non aveva ricevuto risposta al momento in cui si scrive. L'unico versetto in cui il confronto stesso mostrò brevemente un disaccordo, il 19:3, si è rivelato un difetto nel modo in cui è stato letto il file di riferimento, non in nessuno dei due Corani — corretto, corrisponde esattamente. La copia di riferimento stessa è una ricostruzione del file del programma di videoscrittura del Complesso, non la sua pubblicazione digitale ufficiale, il che è il solo aspetto in cui questo non è del tutto un confronto con un insieme di dati pubblicato ufficialmente.

