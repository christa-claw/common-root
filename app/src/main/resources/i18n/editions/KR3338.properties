title=Kirkkoraamattu 1933/38 — About This Edition | Common Root
description=Kirkkoraamattu 1933/38: the Finnish church Bible, translated afresh from Hebrew and Greek and adopted in two halves, in 1933 and 1938, after a committee had worked on it for some seventy years.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338
thanks=With thanks to those who sent corrections to this page.

# The narrative, one paragraph per key, in order.
hero.1=The name is two dates, because the book arrived in two halves. The Evangelical Lutheran Church of Finland accepted the Old Testament in 1933 and the New Testament in 1938, and Finnish has called it the 1933/38 Kirkkoraamattu ever since. Those dates at the end conceal how far back the beginning lay: the translation committee had been appointed in 1861. Some seventy years, and more than one generation of translators, separate the commission from the finished Bible.
hero.2=What the committee produced was a new translation rather than a revision. It worked from the Hebrew of the Old Testament and the Greek of the New — not from Latin, German or Swedish intermediaries, and not from the Finnish Bible already in use. But it was still consciously the successor to that Bible, the Biblia of 1776 that had been the church's text for a century and a half, and it kept a good deal of the older book's vocabulary and cadence. That inheritance is why a Bible finished in 1938 already sounded archaic to its first readers, and why it still carries the solemn register of Finnish scripture. It remained the official church Bible until 1992.
hero.3=In this reader it does two jobs. Set the interface to Finnish and this is the edition that opens — the catalogue's own ordering would hand you Biblia 1776 instead, so the Finnish default is a deliberate pick rather than an accident of the alphabet. It is also the top rung of the Finnish lineage chain: open one rung beneath a KR3338 verse and Biblia 1776 appears under it. Read that rung as succession within one church's Bible rather than as a source, because the 1933/38 translators had the Hebrew and the Greek in front of them, not the 1776 text. Beneath Biblia 1776 the chain keeps going: the Biblia of 1642, which 1776 revises, then Agricola's Finnish of 1548, which that committee revised in turn, and Luther's German of 1545, open beside them as they worked. Only below those does the ladder reach the Hebrew and the Greek.

