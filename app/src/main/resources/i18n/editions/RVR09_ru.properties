title=Рейна-Валера 1909 — Об этом издании | Common Root
description=Рейна-Валера 1909: пересмотр, перенёсший в двадцатый век испанский язык Касиодоро де Рейны 1569 года в том виде, в каком его пересмотрел Сиприано де Валера в 1602-м, — и издание, на котором эта читалка открывается для испанского.
heroHeading=Рейна-Валера 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=Испанская протестантская Библия в необычной мере есть одна книга. Касиодоро де Рейна, покинувший Испанию от инквизиции, закончил свой перевод в изгнании и издал его в Базеле в 1569 году — Biblia del Oso, названную так по медведю на титульном листе. Сиприано де Валера, бывший в том же монастыре под Севильей и совершивший тот же побег, годами проходил её и издал плод в Амстердаме в 1602 году, Biblia del Cántaro. Всякая Рейна-Валера с тех пор — пересмотр пересмотра той книги, и потому имя через дефис поминает двух людей, никогда не работавших в одной комнате.
hero.2=Это пересмотр 1909 года, подготовленный под Британским и иностранным библейским обществом вместе с Американским библейским обществом и обыкновенно называемый теми, кто им пользовался, Versión Antigua — старым изданием. Ему предшествовал более ранний пересмотр 1862 года, и он осторожен как раз в том, что пересмотры обычно меняют: слово подвигается вперёд там, где Рейну и Валеру стало трудно читать, и оставляется в покое там, где не стало. Ветхий Завет стоит на масоретском еврейском, а Новый на Textus Receptus, как стоял и у Рейны.
hero.3=Лет пятьдесят он держал испаноязычный протестантский мир почти безраздельно, пока его не потеснил пересмотр 1960 года, и совсем он не исчез никогда. Он свободен от авторского права, чего о пересмотре 1960 года не скажешь, — и потому именно эту Рейну-Валеру печатают, выкладывают и цитируют без чьего-либо позволения. По той же причине весь текст может находиться в этом собрании и копироваться из него обратно.
hero.4=В этой читалке у испанского пять Библий, и интерфейс открывается именно на этой. Это отобранный выбор, а не случайность каталога: в отличие от арабского или китайского, где читалка открывается на единственной Библии, какая на языке есть, у испанского есть из чего выбирать, и эта выбрана среди прочих. В ступенях родословия основы для неё не записано, так что ступень, открытая под стихом, падает прямо на помеченный знаком ≈ пол языков оригинала. Пол здесь ближе к истине, чем обыкновенно, по той же причине, что и у арабской Библии: греческий, который он подаёт, есть Textus Receptus, а из Textus Receptus сделан Новый Завет Рейны.

