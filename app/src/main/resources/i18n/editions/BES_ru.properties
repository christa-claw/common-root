title=Biblia en Español Sencillo — Об этом издании | Common Root
description=Biblia en Español Sencillo: испанская Библия на простом языке, издаваемая AudioBiblia.org с 2018 года, написанная столько же для слуха, сколько для чтения, и выпущенная под лицензией, позволяющей копировать её кому угодно.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Четыре столетия протестантская Библия по-испански была, по сути, одной книгой в череде пересмотров: перевод Касиодоро де Рейны 1569 года в той правке, какую сделал Сиприано де Валера в 1602 году, и длинный ряд изданий Рейны-Валеры вслед за ними. Biblia en Español Sencillo к ним не относится. Это новый перевод, сделанный на нынешнем испанском и намеренно простой, изданный AudioBiblia.org: Новый Завет вместе с Псалтирью и Притчами в 2018 году, Ветхий Завет закончен в октябре 2019 года. Перевод приписывается Ирме Флорес, а издатели называют его консервативным и евангельским.
hero.2=Отличает его происхождение. Это работа звукового библейского служения, и текст вместе с полной записью глава за главой создавались сообща, а не так, чтобы одно вычитывалось из другого. Заявленная цель была одна и та же для обоих: Библия, которую легко понять и которую можно свободно и законно копировать и распространять. Эта вторая половина не побочная. Перевод несёт лицензию Creative Commons «Атрибуция», указывающую AudioBiblia.org и Ирму Флорес, а не оговорённые права издательства, — потому весь текст и может лежать в этом собрании и ставиться стих за стихом рядом с чем угодно в нём.
hero.3=В этой читалке это одно из четырёх испанских изданий. Если поставить интерфейс на испанский, читалка по-прежнему открывает Рейну-Валеру 1909 года; к этому изданию переключаются. В ступенях родословия оно ведёт себя иначе. Поскольку это свежий перевод, а не пересмотр чего-либо, что есть в собрании, основы для него не записано — и ступень, открытая под стихом Biblia en Español Sencillo, падает прямо на помеченный знаком ≈ пол языков оригинала, а не, как в английской цепи, на более старое издание той же книги. Поставьте её лучше во вторую колонку против Рейны-Валеры 1909 года: смотреть стоит на расстояние между двумя регистрами.

