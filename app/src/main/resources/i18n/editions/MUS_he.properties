fact.6.value=השני שבין ששת הספרים (כתב אלסתה) של האסלאם הסוני; יחד עם [[BUK|צחיח אל-בוכ'ארי]] מהווה את 'אלצחיחיין' — שני האוספים הניצבים בסמכות מיד אחרי הקוראן; רוב החכמים מציבים את אוספו של אל-בוכ'ארי בכללותו מעל זה
fact.7.label=מספר החדית׳
