title=צחיח מוסלם — על מהדורה זו | Common Root
description=צחיח מוסלם: יחד עם צחיח אל-בוכ'ארי מהווה את ה'צחיחיין', שני האוספים שהאסלאם הסוני מציב מיד אחרי הקוראן; מוסלם בן אל-חג'אג' קיבץ אותו מחדית'ים שנאספו בחצי האי ערב, מצרים, עיראק וסוריה, וקיבל רק את אלה שהיה להם שרשרת מוסרים אמינים בלתי שבורה.
heroHeading=צחיח מוסלם
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=אבו אל-חוסיין מוסלם בן אל-חג'אג' אל-קושיירי אל-ניסאבורי נולד בניסאבור, בפרובינקיה העבאסית חוראסאן (בצפון-מזרח איראן של זמננו); המקורות חלוקים בנוגע לשנה, ומציינים 202, 204 או 206 להג'רה (בקירוב 817–822 לספירה). הוא נסע בחצי האי ערב, מצרים, עיראק וסוריה כדי לאסוף חדית'ים מחכמי כל מקום, ולאחר מכן השתקע שוב בעיר מולדתו, שם פגש את אל-בוכ'ארי, למד תחתיו ונותר חברו לשארית חייו. לפי אלח'טיב אלבגדאדי, הוא יזם את החיבור לבקשת תלמיד, אחמד בן סלמה אל-ניסאבורי; שמו המקורי, אלמוסנד אלצחיח אלמוח'תצר, מקוצר בדרך כלל, כמו שמו של אל-בוכ'ארי, לצחיח מוסלם. הוא נפטר בניסאבור בשנת 261 להג'רה (875 לספירה) ונקבר בפרבר נצראבאד.
hero.2=הוא קיבל חדית' רק כאשר שרשרת העברתו הייתה בלתי שבורה עד לחבר של מוחמד, ועברה בכל חוליה דרך שני מוסרים אמינים לפחות; הוא חילק את המוסרים לשלוש דרגות לפי זיכרון ואופי, והשאיר בצד את מי שיושרו הועמד בספק. הפרשן שלו, אלנוואוי, ציין דקדקנות נוספת: מוסלם, כתב, מציב כל חדית' במקום אחד מתאים יחד עם כל שרשראותיו וגרסאות נוסחו, במקום להשאירם מפוזרים — הצגה שפרשנים מאוחרים יותר העמידו בניגוד לדרכו של [[BUK|צחיח אל-בוכ'ארי]], המציב את הנוסחים השונים של חדית' בנפרד, כל אחד תחת הפרק שאת נקודתו הנוסח מבהיר.
hero.3=כמה חדית'ים מכיל הספר בפועל תלוי, כמו ב[[BUK|צחיח אל-בוכ'ארי]], במי שסופר וכיצד מתייחסים לחזרות. קאטיב צ'לבי וסידיק חסן ח'אן הגיעו שניהם ל-7,275; מוחמד פואד עבד אלבאקי, בספירה בלי חזרות, ל-3,033; משהור בן חסן אל סלמאן ל-7,385, או 7,395 בהוספת עשרת החדית'ים שבהקדמתו של מוסלם עצמו; הערכות אחרות ממקמות את הסכום הכולל אי שם בין כ-5,500 ל-7,500. אלג'וזקי מנה 2,326 חדית'ים משותפים, כמעט מילה במילה, עם צחיח אל-בוכ'ארי. המספר העצמי של האוסף הזה הוא מספר נוסף משלו: 57 ספרים ו-7,563 חדית' ממוספרים, שהוא פשוט צורת המהדורה הדיגיטלית שממנה נלקח, ולא טענה לשחזור מדויק של מספור מודפס מסוים כלשהו.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. מתחתיו בקורא מופיע תרגום לאנגלית, הנלקח ממהדורת eng-muslim של fawazahmed0/hadith-api ומותאם חדית' לחדית' לערבית כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אל-בוכ'ארי]] ועבור תרגומי הקוראן שלו. מאיזה תרגום לאנגלית שפורסם קובץ זה עצמו נובע לא נקבע מצד האוסף הזה, ומשום כך הרישיון שלו מסומן כנמצא בבדיקה ולא כנחלת הכלל באופן ישיר; הערבית שלמעלה אינה נושאת אי-ודאות זו.

