fact.9.value=Lisenssinvarainen eikä vapaaseen käyttöön luovutettu, samoin kuin [[NIV|New International Version]] ja [[NASB|New American Standard Bible]] — lisenssinvarainen, ei vapaasti kopioitava, kuitenkin huomattavasti sallivammilla ehdoilla kuin kumpikaan niistä. Polveutumisaskelmiin ei ole kirjattu isää: se esitetään Robert Youngin Literal Translationin tarkistuksena, jota ei itsessään pidetä tässä aineistossa, niin että askelma LSV-jakeen alla johtaa suoraan alkukielen pohjalle, merkittynä ≈. Englanninkielinen käyttöliittymä avautuu oletuksena New International Versioniin; tämä laitos tavoitetaan omalta kortiltaan.
