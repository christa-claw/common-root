title=Literal Standard Version — Tietoa tästä laitoksesta | Common Root
description=Literal Standard Version: Covenant Pressin vuoden 2020 tarkistus Robert Youngin 1800-luvun Literal Translationista, pyrkien mahdollisimman johdonmukaisesti sanatarkkaan englanninkieliseen vastineeseen hebrean, aramean ja kreikan tekstille sen verran kuin luettava englanti sallii.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version esittää itsensä perustavanlaatuisena tarkistuksena Robert Youngin Literal Translationista, äärimmäisen kirjaimellisesta 1800-luvun englanninkielisestä Raamatusta, joka ilmestyi ensin 1862 ja jonka Young itse tarkisti 1887 ja 1898. Covenant Press, Covenant Christian Coalitionin kustantamo, aloitti uuden tarkistuksen alkuvuonna 2018 ilmoitetulla tavoitteella säilyttää Youngin sitoumus sanatarkkaan kirjaimellisuuteen mutta nykyaikaistaa sen englantia ja korjata kohtia, joissa myöhempi käsikirjoitus- ja sanastotutkimus oli edistynyt. Työ saatiin valmiiksi ja julkaistiin 2. helmikuuta 2020; Yhdysvaltain tekijänoikeus rekisteröitiin samana tammikuuna, ja e-kirjalaitokset seurasivat toukokuussa samana vuonna. Yksittäisiä kääntäjiä ei mainita julkaistussa laitoksessa; tilaajiksi mainitaan Covenant Press ja Covenant Christian Coalition.
hero.2=Vanhan testamentin osalta LSV seuraa masoreettista tekstiä, Septuagintan huomattavalla vaikutuksella ja satunnaisella turvautumisella Kuolleenmeren kääröihin, kun niiden lukutavat vaikuttivat riittävän selvinä suosittaviksi. Uuden testamentin osalta se seuraa Textus Receptusta ja enemmistötekstiä, ottaen aleksandrialaisen perinteen lukutapoja käyttöön vain erikseen mainituissa tapauksissa, ei yleisenä periaatteena. Kääntäjät asettivat kolme ohjaavaa periaatetta: säilyttää alkutekstin verbin aikamuoto niin pitkälti kuin mahdollista, kääntää annettu alkukielinen sana samalla englanninkielisellä sanalla niin pitkälti kuin johdonmukaisuus sallii, ja säilyttää alkuperäinen sanajärjestys, paitsi missä englannin luettavuus todella vaatii muutosta. Vanhan testamentin Jumalan nimi translitteroidaan sen sijaan, että se käännettäisiin arvonimellä kuten "HERRA", mikä on linjassa käännöksen yleisen taipumuksen kanssa näyttää lukijalle alkutekstin omat valinnat niitä tasoittamatta.
hero.3=Tämän aineiston kannalta yhteys on ennemmin tekstuaalinen kuin polveutumissuhde: Literal Standard Versionin Uusi testamentti nojaa Textus Receptukseen ja enemmistötekstiin, samaan kreikkalaiseen pohjaan, jonka tämä aineisto säilyttää erikseen ja kokonaisuudessaan omana Textus Receptus -laitoksenaan — tekstiin, jolle King James Version ja yleisesti reformaatioajan perinne pohjautuvat. Mikään polveutumisaskelma ei yhdistä näitä kahta laitosta, sillä LSV esitetään Youngin Literal Translationin tarkistuksena, ei Textus Receptuksen itsensä tai minkään tässä pidetyn tekstin tarkistuksena; askelma LSV-jakeen alla johtaa siksi suoraan alkukielen pohjalle, merkittynä ≈. Se julkaistaan Creative Commons Nimeä-JaaSamoin 4.0 -lisenssillä sen sijaan, että se olisi luovutettu vapaaseen käyttöön, minkä myötä se asettuu New International Versionin ja New American Standard Biblen rinnalle lisenssinvaraisena, ei vapaasti kopioitavana — kuitenkin huomattavasti sallivammilla ehdoilla kuin kumpikaan niistä. Englanninkielinen käyttöliittymä avautuu oletuksena New International Versioniin; tämä laitos tavoitetaan omalta kortiltaan.

