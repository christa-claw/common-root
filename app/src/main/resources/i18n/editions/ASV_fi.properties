title=American Standard Version — Tietoja tästä laitoksesta | Common Root
description=Vuoden 1901 American Standard Version: Revised Versionin amerikkalainen laitos, jonka tekivät tutkijat, jotka olivat korjanneet Kuningas Jaakon käännöstä kirjeitse kaksikymmentä vuotta, ja Revised Standard Versionin, New American Standard Biblen ja World English Biblen kantamuoto.
