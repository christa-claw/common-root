# The narrative, one paragraph per key, in order.
hero.1=American Standard Version alkoi jonkun toisen hankkeena. Kun Englannin kirkko ryhtyi vuonna 1870 tarkistamaan Kuningas Jaakon käännöstä, se kutsui amerikkalaisia tutkijoita mukaan, ja nämä tulivat — kirjeitse, Atlantin yli, lähes kahden vuosikymmenen ajan. Siellä missä osapuolet olivat eri mieltä, brittikomitean lukutapa meni tekstiin ja amerikkalaisten mieltymys liitteeseen, ja amerikkalaiset suostuivat pidättymään omasta laitoksestaan neljäntoista vuoden ajan. Englantilainen Revised Version ilmestyi 1881 ja 1885. Amerikkalainen laitos seurasi 1901, ja liitteen lukutavat oli nostettu tekstiin, jonne sen toimittajat olivat ne aina halunneet.
hero.2=Se on tutkijoiden tutkijoille tekemä käännös, ja se myös kuulostaa siltä. Tarkistajat pysyttelivät niin lähellä heprean ja kreikan sanajärjestystä kuin englanti salli, mikä tekee American Standard Versionista täsmällisen ja pitkillä matkoilla kankean. Näkyvin ratkaisu koskee Jumalan nimeä: siellä missä Kuningas Jaakon käännös painoi versaalein “the LORD”, American Standard Version painaa “Jehovah”, tuhansia kertoja, kautta koko Vanhan testamentin. Uudessa testamentissa se seuraa tarkistajien kreikkaa eikä Textus Receptusta, joten lukutavat jotka Kuningas Jaakon kääntäjillä olivat mutta joita vanhemmissa käsikirjoituksissa ei ole — kolminaisuuslause 1. Joh. 5:7 niiden joukossa — ovat alaviitteessä tai poissa.
hero.3=American Standard Versionista ei tullut kirkonpenkin Raamattua. Siitä tuli kantamuoto. Vuoden 1952 Revised Standard Version oli sen tarkistus; niin oli New American Standard Bible, joka on myös tässä aineistossa; ja niin on World English Bible, joka vei American Standard Versionin vapaaseen käyttöön nykyoikeinkirjoituksella. Siksi se on siinä missä on lukijan sukuaskelmissa — aineiston pisimmän ketjun keskellä. Avaa askelma ASV-jakeen alta, ja Revised Version, josta se tehtiin, ilmestyy sen alle, ja sen alla Kuningas Jaakon käännös ja Geneven Raamattu, alas alkukielten pohjaan, joka on merkitty ≈-merkillä. Avaa askelma World English Biblen jakeen alta, ja saavut takaisin tänne.

