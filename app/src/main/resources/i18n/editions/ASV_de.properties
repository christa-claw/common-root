title=American Standard Version — Über diese Ausgabe | Common Root
description=Die American Standard Version von 1901: die amerikanische Ausgabe der Revised Version, gemacht von Gelehrten, die zwanzig Jahre lang die King-James-Bibel auf dem Postweg berichtigt hatten, und die Stammform der Revised Standard Version, der New American Standard Bible und der World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=Die American Standard Version begann als das Vorhaben anderer. Als die Kirche von England 1870 daranging, die King-James-Bibel zu revidieren, lud sie amerikanische Gelehrte zur Mitarbeit ein, und die kamen — brieflich, über den Atlantik hinweg, fast zwei Jahrzehnte lang. Wo die beiden Seiten uneins waren, ging die Lesart des britischen Ausschusses in den Text und die amerikanische Vorliebe in einen Anhang, und die Amerikaner sagten zu, vierzehn Jahre lang keine eigene Ausgabe herauszubringen. Die englische Revised Version erschien 1881 und 1885. Die amerikanische Ausgabe folgte 1901, mit den Lesarten des Anhangs hinaufgerückt in den Text, wo ihre Herausgeber sie immer haben wollten.
hero.2=Es ist eine Übersetzung von Gelehrten für Gelehrte, und sie liest sich auch so. Die Revisoren blieben der hebräischen und griechischen Wortstellung so nah, wie das Englische es zuließ, was die American Standard Version genau und über weite Strecken steif macht. Ihre sichtbarste Entscheidung betrifft den Gottesnamen: wo die King-James-Bibel „the LORD“ in Kapitälchen setzte, druckt die American Standard Version „Jehovah“, tausendfach, durch das ganze Alte Testament. Im Neuen Testament folgt sie dem Griechischen der Revisoren statt dem Textus Receptus, sodass Lesarten, die den King-James-Übersetzern vorlagen und älteren Handschriften fehlen — die trinitarische Formel in 1. Joh 5,7 darunter — in der Fußnote stehen oder fehlen.
hero.3=Eine Kirchenbankbibel ist die American Standard Version nie geworden. Geworden ist sie eine Stammform. Die Revised Standard Version von 1952 war eine Revision von ihr; die New American Standard Bible ebenso, die auch in diesem Korpus steht; und ebenso die World English Bible, die die American Standard Version in moderner Schreibung gemeinfrei weitertrug. Darum steht sie, wo sie steht, in den Sprossen des Lesers — in der Mitte der längsten Kette, die dieses Korpus hat. Öffnet man unter einem ASV-Vers eine Sprosse, erscheint darunter die Revised Version, aus der sie gemacht wurde, und darunter die King-James-Bibel und die Genfer Bibel, hinab bis zum Ursprachenboden, der mit ≈ bezeichnet ist. Öffnet man eine Sprosse unter einem Vers der World English Bible, kommt man hierher zurück.

