fact.2.label=编者
fact.2.value=约瑟·斯密（1805–1844）：启示、他对英王钦定本《圣经》的修订、他称译自埃及纸草的译本、他本人的历史以及一份信仰陈述；最早由富兰克林·D·理查兹汇编为一册
fact.3.label=出版
fact.3.value=1851年，英国利物浦，作为传道小册子，由富兰克林·D·理查兹汇编；第二版1878年，盐湖城，由奥森·普瑞编辑；1880年10月10日由教会总会大会接受为经典
fact.4.label=结构
fact.4.value=共5部分——《摩西书选》、《亚伯拉罕书》、《约瑟·斯密——马太福音》、《约瑟·斯密——历史》和《信条》——自1902年修订版起分为章节；本语料库将每一部分作为一卷书
fact.5.label=地位
fact.5.value=耶稣基督后期圣徒教会的4部标准经典之一，与《圣经》、《[[BOM|摩尔门经]]》及《[[DC|教义和圣约]]》并列；基督社区不将其视为经典
fact.6.label=在本语料库中
fact.6.value=文本遵循现行标准措辞，取自Mormon Documentation Project宣布为公共领域的JSON数据导出——与《[[BOM|摩尔门经]]》及《[[DC|教义和圣约]]》来源相同；摩西与马太部分的摘录改写的是[[KJV|King James Version]]的文本，本语料库亦收有该版本；摹真本及其说明未予收录，此处也不标注单一的印行年份
fact.7.label=许可
fact.7.value=公共领域，据数据维护者声明；现代受版权保护的研习资料未包含在内
