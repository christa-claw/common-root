title=无价珍珠 — 关于此版本 | Common Root
description=《无价珍珠》：约瑟·斯密的启示、翻译与记述选集，1851年首次在英国利物浦作为传道小册子汇编，1880年被末世圣徒接受为经典。
heroHeading=无价珍珠
readerHref=/reader?c1.src=pgp

hero.1=《无价珍珠》最初是一本传道小册子，而非一部经典。1851年，时任教会欧洲传道部会长的富兰克林·D·理查兹在英国利物浦将其汇编成册，收集了约瑟·斯密那些曾刊登于早期教会报刊、或仅以少量印本流传的著作，使英国的成员能在一处读到它们。书名出自《马太福音》13:45–46的比喻：一位商人变卖一切所有，买下一颗无价的珍珠。
hero.2=由奥森·普瑞编辑并重新编排的第二版于1878年在盐湖城出版；1880年10月10日，教会总会大会经表决将其接受为经典。1902年的修订版主要由詹姆斯·E·塔尔梅奇编订，将正文分为章节，并删去了与《教义和圣约》重复的启示；1921年的版本改为双栏排印。1976年又增补了2篇启示——关于高荣国度的异象，以及约瑟·F·斯密关于救赎死者的异象；1979年教会将这2篇移入《教义和圣约》，其1981年版将它们列为第137篇和第138篇。
hero.3=现行版本由5部分组成。《摩西书选》和《约瑟·斯密——马太福音》摘自约瑟·斯密于1830年开始的对英王钦定本《圣经》的修订：前者是对《创世记》开篇各章的扩充叙述，以赐给摩西的异象为框架；后者是对《马太福音》23:39及第24章的改写。《亚伯拉罕书》是斯密称自己从1835年在俄亥俄州柯特兰购得的埃及纸草翻译而来的文本；它于1842年刊登在伊利诺伊州诺伍的《时代与季节》（Times and Seasons）上，附有3幅插图，今称摹真本第1、2、3号。《约瑟·斯密——历史》取自他在1838年撰写的、关于其早年生活与异象的记述；《信条》则是出自1842年致芝加哥报纸编辑约翰·温特沃斯一封信中的13条信仰陈述。
hero.4=《亚伯拉罕书》是最常受到质疑的部分。大部分纸草长期被认为已经损毁，很可能毁于1871年的芝加哥大火，但曾为约瑟·斯密所有的10块残片后来在纽约大都会艺术博物馆被发现，该馆于1967年将其移交给教会。学者认定这些残片属于常见的埃及丧葬文献，写成于公元前3世纪至公元1世纪之间；教会本身发表的关于此书的文章也承认，残片上的文字没有一处提到亚伯拉罕的名字，也没有提到书中所记的任何事件。
hero.5=它与《圣经》、《摩尔门经》和《教义和圣约》同为耶稣基督后期圣徒教会的4部标准经典之一；源自约瑟·斯密运动的另一大教会——基督社区（Community of Christ）——并不将其列为经典。本语料库中的文本来自Mormon Documentation Project的公共领域JSON数据导出，与本站的《摩尔门经》和《教义和圣约》来源相同，并将5个部分保留为5卷书：《摩西书》8章，《亚伯拉罕书》5章，其余3部分各1章。3幅摹真本及随之印行的说明不属于经文正文，因此未予收录。与另外2部一样，它采用现行标准版本的措辞，而非某一次历史印本，因此此处不标注出版年份。

