title=Nueva Biblia de las Américas — Informazioni su questa edizione | Common Root
description=La Nueva Biblia de las Américas: la revisione in spagnolo latinoamericano che The Lockman Foundation ha fatto della propria La Biblia de las Américas, portando lo stesso metodo parola per parola nello spagnolo quotidiano parlato in tutte le Americhe.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=La Nueva Biblia de las Américas è l'edizione in spagnolo latinoamericano di The Lockman Foundation, costruita sulla precedente La Biblia de las Américas del 1986 — essa stessa frutto di circa quindici anni di lavoro di ventidue traduttori e consulenti, secondo la stessa filosofia di traduzione parola per parola portata più tardi in inglese come New American Standard Bible. Piuttosto che una nuova traduzione dall'ebraico e dal greco, la NBLA è una revisione di registro: un comitato di dodici membri di Lockman ha rielaborato lo spagnolo, più orientato al castigliano, di La Biblia de las Américas nello spagnolo familiare e moderno parlato in tutta l'America Latina, sostituendo forme come il "vosotros" di seconda persona plurale con il più diffuso "ustedes" e alleggerendo costruzioni come il "y" formulare e il "sucedió que" che il testo precedente aveva ripreso letteralmente dallo stile narrativo ebraico. Lo stesso avviso sul permesso di citazione di The Lockman Foundation data il testo finito al 2005.
hero.2=La base testuale discende direttamente da La Biblia de las Américas: l'Antico Testamento si basa sulla Biblia Hebraica di Rudolf Kittel, con i Rotoli del Mar Morto consultati, e il Nuovo Testamento generalmente sulla 27ª edizione del Novum Testamentum Graece di Eberhard Nestle, con attenzione a ulteriori testimonianze manoscritte dove incidono su una lettura particolare. Alcuni librai e cataloghi di software biblico raggruppano oggi la Nueva Biblia de las Américas insieme alla revisione del 2020 della New American Standard Bible della Fondazione, commercializzando le due come una coppia abbinata per lettori di inglese e spagnolo della stessa tradizione letterale; la traduzione in sé, tuttavia, non porta negli avvisi della Fondazione alcuna data di copyright successiva al 2005.
hero.3=L'interfaccia spagnola qui si apre per impostazione predefinita sulla Reina Valera 1909, un testo di pubblico dominio proveniente da una tradizione di traduzione interamente diversa e più antico di un secolo; la Nueva Biblia de las Américas si raggiunge invece dalla propria scheda nella griglia delle traduzioni. Condivide poca storia testuale con quell'edizione, ma molta con la New American Standard Bible — la stessa fondazione, lo stesso metodo di equivalenza formale e lo stesso stato su licenza piuttosto che di pubblico dominio, che consente di citare fino a 500 versetti senza permesso scritto, purché non costituiscano un libro completo né più di un quarto dell'opera citante. Nei pioli di discendenza non è registrato alcun genitore: La Biblia de las Américas, il testo che essa revisiona, non è essa stessa custodita in questo corpus, cosìché un piolo sotto un versetto della NBLA scende direttamente al fondo della lingua originale, segnato con ≈.

fact.1.label=Lingua
fact.1.value=Spagnolo
fact.2.label=Commissionata
fact.2.value=The Lockman Foundation, di La Habra, in California — la stessa organizzazione non profit dietro la New American Standard Bible e la propria predecessora, La Biblia de las Américas (1986)
fact.3.label=Realizzata da
fact.3.value=Un comitato di revisione di dodici membri di Lockman, che ha lavorato a partire dalla traduzione di La Biblia de las Américas, essa stessa opera di ventidue traduttori e consulenti in circa quindici anni
fact.4.label=Antico Testamento da
fact.4.value=La Biblia Hebraica di Rudolf Kittel, con i Rotoli del Mar Morto consultati, ereditata dalla stessa base testuale di La Biblia de las Américas
fact.5.label=Nuovo Testamento da
fact.5.value=Il Novum Testamentum Graece di Eberhard Nestle, generalmente la 27ª edizione, con attenzione a ulteriori testimonianze manoscritte quando incidono su una lettura
fact.6.label=Tipo di traduzione
fact.6.value=Equivalenza formale, lo stesso metodo parola per parola di La Biblia de las Américas e della New American Standard Bible — non una traduzione nuova, ma una revisione di registro nello spagnolo familiare e moderno parlato in tutta l'America Latina, sostituendo forme castigliane come "vosotros" con "ustedes" e rielaborando costruzioni come il "y" formulare e il "sucedió que" che il testo precedente riprendeva letteralmente dall'ebraico
fact.7.label=Pubblicata
fact.7.value=Protetta da copyright nel 2005 da The Lockman Foundation; alcuni cataloghi la raggruppano da allora insieme alla revisione del 2020 della New American Standard Bible della Fondazione, ma il 2005 resta l'anno indicato nel proprio avviso di copyright
fact.8.label=Licenza
fact.8.value=Su licenza, non di pubblico dominio. Fino a 500 versetti possono essere citati in qualsiasi forma senza permesso scritto, purché non costituiscano un libro biblico completo né più di un quarto dell'opera citante, con un avviso di copyright che indichi il 2005; qualsiasi uso più ampio richiede il permesso di The Lockman Foundation
fact.9.label=In questo corpus
fact.9.value=Su licenza e non di pubblico dominio, come [[NASB|la New American Standard Bible]] della stessa fondazione. L'interfaccia spagnola si apre per impostazione predefinita su [[RVR09|la Reina Valera 1909]], un testo di pubblico dominio proveniente da una tradizione non collegata e più antico di un secolo, mentre questa edizione si raggiunge dalla propria scheda. Nei pioli di discendenza non è registrato alcun genitore: è una revisione di registro di La Biblia de las Américas, che non è essa stessa custodita in questo corpus, cosìché un piolo sotto un versetto della NBLA scende direttamente al fondo della lingua originale, segnato con ≈.
