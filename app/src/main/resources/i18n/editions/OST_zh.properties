title=奥斯特瓦尔德圣经（法文）— 关于此版本 | Common Root
description=奥斯特瓦尔德圣经：一位纳沙泰尔牧师对日内瓦法文新教圣经的修订本，1744 年首次出版；此处为后来一次采用现代法文拼写的修订本。
heroHeading=奥斯特瓦尔德圣经
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=让-弗雷德里克·奥斯特瓦尔德 1663 年生于纳沙泰尔，1747 年卒于该地。他 1683 年在家乡受按立，一生大部分时间在当地教会事奉，先任执事，1699 年起任牧师，同时讲授神学。他的圣经并不是从希伯来文和希腊文重新翻译的新译本，而是日内瓦法文新教圣经的修订本——讲法语的归正会自 16 世纪起所读的那个译本。奥斯特瓦尔德修订的文本于 1744 年首次出版，在他去世前 3 年，此后 2 个多世纪里不断重印、修订；它在英国也广为人知。
hero.2=本语料库中的文字并不是 1744 年的法文。18 世纪写作 “étoit” 的地方，现代法文写作 “était”；本副本通篇作 “était”，一次也没有 “étoit”，因此它出自后来某一次保留了奥斯特瓦尔德之名的修订。其中最著名的是法国圣经公会（Société biblique de France）于 1881 年出版的修订本，其新约由 Ch. L. Frossard 完成，而这一文本直到 1996 年仍有更新。本副本的来源 eBible.org 只写“Ostervald”，没有指明是哪一次修订，因此本页也不指明。有几个特点几乎每页可见。神的名字作 “l'Éternel”，即“永恒者”，与瑟贡本和法文达秘圣经相同：诗篇 23 篇作 “L'Éternel est mon berger; je n'aurai point de disette”。以赛亚书 7:14 保留 “la vierge sera enceinte”——童女——而瑟贡本作年轻女子。新约则保留了公认文本中被校勘本删去的读法：约翰一书 5:7 有天上的 3 位见证者，“le Père, la Parole, et le Saint-Esprit”，而并列的瑟贡本没有。
hero.3=在本阅读器中，它是 3 部法文圣经之一，与瑟贡本和法文达秘圣经并列。法文界面并不在它上面开启：法文没有选定的默认版本，所以阅读器按目录顺序取第一部法文圣经，那就是达秘圣经。谱系阶梯中未为它记录任何母本——它所修订的日内瓦圣经不在本语料库中——所以在某一节之下展开的阶梯径直落到以 ≈ 标示的原文底层：旧约是列宁格勒抄本，新约是公认文本，也正是这部圣经实际依从的希腊文传统。它的阶梯标签带有年份 1744，那是奥斯特瓦尔德本人修订的年份，而不是所显示文字的年份。把它与瑟贡本并排打开，便可并列看到 2 个世纪的法文新教圣经语言。

