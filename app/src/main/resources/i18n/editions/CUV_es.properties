title=Chinese Union Version — Acerca de esta edición | Common Root
description=La Chinese Union Version de 1919: veintinueve años de trabajo en comisión que dieron la Biblia que aún leen los protestantes chinos, y uno de los primeros libros publicados jamás en mandarín vernáculo escrito.
heroHeading=Versión Unión China
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=En 1890 las misiones protestantes que trabajaban en China se reunieron en Shanghái y admitieron un problema. Había ya varias Biblias chinas, y no había dos que coincidieran: ni en la redacción, ni en la grafía de los nombres, ni siquiera en qué registro del chino escribir. La conferencia resolvió hacer una sola traducción que todas las misiones usaran, y la llamó versión unión: 和合本, el texto armonizado. Como el chino escrito estaba entonces partido entre la lengua literaria de los instruidos y la lengua hablada de todos los demás, encargaron tres a la vez: dos en chino literario, una en mandarín.
hero.2=A la comisión del mandarín le llevó veintinueve años. La presidió Calvin Wilson Mateer, presbiteriano norteamericano que estaba en Shandong desde 1863, y murió en 1908 con la obra sin acabar; el panel que él había reunido de media docena de misiones siguió adelante, y con él los eruditos chinos que trabajaban a su lado y cuyos nombres los registros misioneros guardaron con mucho menos cuidado. Tomaron la Revised Version inglesa como el texto que vertían y la cotejaron con el hebreo y el griego que hay detrás — lo cual sitúa la Revised Version del propio corpus un paso aguas arriba de esta Biblia, y la King James Version un paso por encima de aquélla. Las dos versiones literarias acabaron fundiéndose en una. La versión en mandarín es la que sobrevivió.
hero.3=Se publicó en 1919, y la fecha hizo por ella más de lo que ninguna comisión habría podido. Fue el año del Movimiento del Cuatro de Mayo, cuando los escritores chinos empezaron de veras a abandonar la lengua literaria por la vernácula, y la versión unión llegó como uno de los primerísimos libros de fuste ya escritos así. Una traducción destinada a zanjar una disputa entre misioneros se volvió un hito de la prosa china moderna, y sus giros los citan personas que no han abierto nunca una Biblia. Desde entonces se imprime en dos ediciones que difieren en una sola palabra — si Dios es 神 o 上帝 —, con el espaciado ajustado para que ambas sigan quebrando las páginas en el mismo sitio.
hero.4=En este lector es la única Biblia china, y eso decide dos cosas de su comportamiento. Ponga la interfaz en chino y es ésta la que abre: no porque se la haya escogido, como se escogió la Reina-Valera 1909 para el español, sino porque el catálogo no encuentra otra Biblia en la lengua. Y en los peldaños de linaje no consta antecedente alguno, de modo que un peldaño bajo un versículo baja derecho al suelo de lenguas originales marcado con ≈, aunque la Revised Version de la que se hizo esté en el corpus a una columna de distancia. Su peldaño sí lleva año, 1919, cosa que no hace toda edición de aquí.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lengua
fact.1.value=chino — mandarín vernáculo (官話 / baihua), no chino literario
fact.2.label=Nombre propio
fact.2.value=和合本 (héhéběn) — la versión “armonizada” o “unida”
fact.3.label=Encargada por
fact.3.value=la Conferencia General de Misioneros Protestantes de Shanghái de 1890
fact.4.label=Traducida por
fact.4.value=una comisión formada con varias misiones protestantes; el presbiteriano norteamericano Calvin Wilson Mateer (1836–1908) presidió el panel del mandarín hasta su muerte, trabajando en todo momento con colegas chinos
fact.5.label=Publicada
fact.5.value=1919, tras veintinueve años de trabajo
fact.6.label=Base textual
fact.6.value=la Revised Version inglesa como base de trabajo, cotejada con el hebreo y el griego — la misma [[RV|Revised Version]] que guarda este corpus
fact.7.label=Dos ediciones
fact.7.value=la edición Shen (神版) y la edición Shangdi (上帝版), que sólo difieren en qué palabra china lleva “Dios”
fact.8.label=Revisión posterior
fact.8.value=la Revised Chinese Union Version, Nuevo Testamento de 2006 y Biblia completa de 2010 — no este texto
fact.9.label=En este corpus
fact.9.value=la única Biblia china de aquí, así que una interfaz en chino abre en ella por defecto; en los peldaños de linaje no consta antecedente, aunque su peldaño sí lleva el año 1919
