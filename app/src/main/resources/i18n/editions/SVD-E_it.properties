title=Smith & Van Dyck (testo eBible) — Su questa edizione | Common Root
description=La Bibbia araba di Smith e Van Dyck del 1865, nel testo elettronico completamente vocalizzato pubblicato da eBible.org come pubblico dominio, a partire dal file sorgente dell'American Bible Society.
heroHeading=Smith & Van Dyck — il testo completamente vocalizzato
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Questa è la stessa traduzione di [[SVD|Smith & Van Dyck]] — la Bibbia araba che Eli Smith iniziò a Beirut e Cornelius Van Dyck compì nel 1865, con i dotti arabi Butrus al-Bustani, Nasif al-Yaziji e Yusuf al-Asir — composta da un file elettronico diverso. La traduzione è la stessa; il file è la ragione per cui questa edizione esiste.
hero.2=Una Bibbia del 1865 è libera per chiunque, ma una copia elettronica di essa è anch'essa il lavoro di qualcuno, e il testo di Van Dyck circola sul web in molte copie di origine incerta. Alcune sono offerte con una pretesa di copyright sulla trascrizione stessa. Un testo la cui origine non si può rintracciare non può essere stampato con sicurezza, perciò questa edizione usa una copia la cui origine si può rintracciare: quella pubblicata da eBible.org, dichiarata di pubblico dominio, che indica la Missione siriana come traduttrice e l'American Bible Society come contributrice della fonte. Il file porta la data 2020-08-03.
hero.3=È completamente vocalizzato. Ogni parola porta le sue vocali brevi e gli altri segni di lettura, mentre l'altro testo di Van Dyck in questo lettore è in gran parte privo di vocalizzazione. Ciò lo rende più lento da comporre e più facile da leggere ad alta voce, e una pagina vocalizzata richiede più spazio tra le righe, cosicché una copia stampata di questa edizione risulta più lunga dello stesso testo non vocalizzato.
hero.4=È l'edizione da scegliere quando la domanda è se il testo possa essere stampato. Per la lettura a schermo, entrambi i testi di Van Dyck servono allo stesso modo.

