title=Synodalöversättningen — Om denna utgåva | Common Root
description=Den ryska synodalöversättningen från 1876: påbörjad 1813 av Ryska bibelsällskapet, fullbordad av de fyra ortodoxa teologiska akademierna under metropolit Filaret, och fortfarande den bibel som de flesta rysktalande menar när de bara säger "Bibeln".
heroHeading=Synodalöversättningen
readerHref=/reader?c1.src=syn

hero.1=Arbetet inleddes 1813, när det nystartade Ryska bibelsällskapet, med stöd av tsar Alexander I, gav sig i kast med en rysk översättning som var tänkt att stå vid sidan av den kyrkslaviska bibeln, inte ersätta den. Inom några år kom ett Nya testamente. Konservativa präster såg i en bibel på talad ryska ett hot mot den kyrkslaviska textens auktoritet, och 1826 upplöste Nikolaj I sällskapet och stoppade arbetet i tre decennier.
hero.2=Översättningen återupptogs först under Alexander II. År 1858 godkände Heliga synoden en ny rysk utgåva och lade arbetet i händerna på de teologiska akademierna i Moskva, Sankt Petersburg, Kazan och Kiev, med Moskvas metropolit Filaret (Drozdov) som ledande och slutgiltig redaktör. Nya testamentet, översatt från den grekiska trycktext som kallas Textus Receptus, utkom 1862. Gamla testamentet var den svårare tvistefrågan: Filaret krävde att man skulle gå bakom den kyrkslaviska texten till hebreiskan själv, något som motarbetades av dem som höll fast vid den kyrkslaviska textens grekiska grund, och synodens formella tillstånd att översätta från den masoretiska texten kom först samma år, 1862 — då större delen av Gamla testamentet redan var översatt på den grunden ändå.
hero.3=Hela Bibeln — Gamla och Nya testamentet samlade för första gången i en volym på denna nya ryska i stället för på kyrkoslaviska — utkom 1876 från Synodaltryckeriet, varifrån översättningens vanliga namn kommer. Dess Gamla testamente blev inte rent hebreiskt: där Septuaginta, som den kyrkslaviska traditionen bevarat, skilde sig från den masoretiska texten, behölls ofta den grekiska läsarten också, vanligen som ett alternativ inom parentes, så att den färdiga boken fortfarande bär en verklig skuld till den grekiska bibel som stod bakom den äldre kyrkslaviska texten.
hero.4=Den har inte haft någon allvarlig rival sedan dess. Ortodoxa, katolska, baptistiska och andra protestantiska läsare i Ryssland vänder sig alla, i en eller annan form, till samma text, och dess stil har satt sin prägel på litterär ryska ungefär som King James-bibeln har präglat engelskan. I detta korpus omfattar den 66 böcker, den protestantiska kanon snarare än den vidare ortodoxa, och den är den enda ryska bibeln här, så ett ryskt gränssnitt öppnas på den.

