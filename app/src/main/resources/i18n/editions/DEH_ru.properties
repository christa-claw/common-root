title=Сорок хадисов Шаха Валиуллы Дехлави — Об этом издании | Common Root
description=Сорок хадисов Шаха Валиуллы Дехлави: сорок хадисов, которые, по словам делийского учёного XVIII века, он услышал непосредственно от своего наставника за год учёбы в Медине, сохранённые вместе с их цепочками передачи — самый известный сборник такого рода с индийского субконтинента.
heroHeading=Сорок хадисов Шаха Валиуллы Дехлави
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Шах Валиулла Дехлави — полностью Кутб ад-Дин Ахмад ибн Абд ар-Рахим аль-Умари ад-Дихлави — родился 21 февраля 1703 года в Пхулате, близ Музаффарнагара, и воспитывался в Дели, где его отец, Шах Абдур Рахим, основал медресе «Рахимийя». Говорят, что он выучил Коран наизусть в семь лет и завершил обычную для своего времени программу обучения в пятнадцать, а через два года сменил отца на посту главы медресе. В 1730–31 годах он совершил хадж, а затем провёл около года в Медине, изучая хадисы — главным образом у Абу Тахира аль-Курди (также пишется аль-Курани), а также у Мухаммада Вафдуллаха аль-Малики и шейха Таджа ад-Дина аль-Калъи — прежде чем вернуться в Дели 16 декабря 1732 года. Он умер там 20 августа 1762 года (29 мухаррама 1176 года хиджры) и был похоронен рядом с отцом. Среди его других трудов — Худжжат Аллах аль-Балига, обычно считаемый его важнейшей книгой, Аль-Фауз аль-Кабир и Футух аль-Харамайн, его собственный рассказ о путешествии, приведшем его в Хиджаз.
hero.2=«Аль-Арбаин» продолжает ту же традицию «сорока хадисов» (арбаинийят), что и [[NAW|Сорок хадисов ан-Навави]] и [[QUD|Сорок священных хадисов]] — традицию, восходящую к хадису, обещающему тому, кто сохранит для своей общины сорок хадисов о религии, место среди учёных в День Суда (хадис, который большинство критиков само относит к слабым, да'иф), а также к первому, ныне утраченному сборнику, приписываемому Абдуллаху ибн аль-Мубараку (ум. 797). От этих двух он отличается тем, что собирает: вместо хадисов, отобранных по теме или значимости из широкой литературы, его английский издатель описывает его как сорок хадисов, которые Шах Валиулла, по его словам, услышал непосредственно от своего наставника в Медине, каждый из которых сохранён вместе с цепочкой передачи (санад), по которой он его получил — личная запись передачи за тот год учёбы, который, по словам его сына, изменил то, как он учил и писал после возвращения в Дели.
hero.3=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-dehlawi сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]], [[MUS|Сахиха Муслима]], [[ABD|Сунана Абу Дауда]], [[TIR|Джами ат-Тирмизи]], [[NAS|Сунана ан-Насаи]], [[IBM|Сунана Ибн Маджи]], [[MAL|Муватты Малика]], [[NAW|Сорок хадисов ан-Навави]] и [[QUD|Сорок священных хадисов]], а также своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=Классический арабский, с английским переводом под каждым хадисом в читалке
fact.2.label=Составитель
fact.2.value=Шах Валиулла Дехлави (1703–1762)
fact.3.label=Название
fact.3.value=Известен по-арабски как «Аль-Арбаин» («Сорок»); современное английское издание под названием Forty Hadith of Shah Wali-Allah было опубликовано издательством Turath Publishing в 2015 году в переводе Safaruk Zaman Chowdhury
fact.4.label=Составлен
fact.4.value=После того как Шах Валиулла вернулся в Дели 16 декабря 1732 года, совершив хадж в 1730–31 годах и проведя около года, изучая хадисы в Медине, главным образом у Абу Тахира аль-Курди (также пишется аль-Курани)
fact.5.label=Метод
fact.5.value=По словам английского издателя, каждый из сорока хадисов — это хадис, который Шах Валиулла, по его словам, услышал непосредственно от своего наставника, сохранённый вместе с цепочкой передачи (санад), по которой он его получил — личная запись передачи, а не подборка по теме или значимости
fact.6.label=Положение
fact.6.value=Самый известный сборник «сорока хадисов» (арбаинийят) с индийского субконтинента; продолжает жанр, первый известный, ныне утраченный пример которого приписывается Абдуллаху ибн аль-Мубараку (ум. 797) и в рамках которого также появились [[NAW|Сорок хадисов ан-Навави]] и [[QUD|Сорок священных хадисов]]
fact.7.label=Число хадисов
fact.7.value=40
fact.8.label=В этом собрании
fact.8.value=1 книга и 40 пронумерованных хадисов
fact.9.label=Английский перевод
fact.9.value=Взят из издания eng-dehlawi сервиса fawazahmed0/hadith-api, показан как сопровождение к арабскому тексту; в наборе данных переводчик указан как неизвестный, и не подтверждено со стороны этого собрания, идёт ли речь о переводе Turath Publishing/Chowdhury или о самостоятельном переводе
fact.10.label=Лицензия
fact.10.value=Арабский матн — это классический текст, находящийся в общественном достоянии; лицензия английского перевода пока находится на проверке
