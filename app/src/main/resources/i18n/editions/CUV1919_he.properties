# The narrative, one paragraph per key, in order.
hero.1=זהו [[CUV|התרגום הסיני המאוחד]] כפי שנדפס ב-1919: תנ״ך המנדרינית שעליו עמלו מיסיונרים וחכמים סינים במשך עשרים ותשע שנים, ושנקבע בצורות התווים של אותה שנה. התרגום המאוחד האחר שבקורא הזה הוא הנוסח כפי שהוא נקרא כיום, בפיסוק מודרני ובבחירת תווים מודרנית. זה שלפנינו משמר את עמוד 1919.
hero.2=את ההבדל אפשר לראות בתווים. נוסח 1919 משתמש בצורות שמהדורות מאוחרות יותר זנחו — 爲 במקום שבו במהדורות של היום יש 為, וכך גם 愼, 册, 槪 — והוא מודפס כולו באותיות מסורתיות. הפיסוק שבו הוא זה שהועתק מהדפוס של 1919, לא הפיסוק המודרני של המהדורות המאוחרות. במקום שבו ספר 1919 הדפיס פסוקים רצופים כקטע אחד, כך עושה גם המהדורה הזאת: מספור הפסוקים נשמר, והטקסט מופיע בפסוק הראשון של הרצף.
hero.3=הנוסח מבוסס על התעתיק שנעשה בידי ויקיטקסט הסיני, וזוהי מהדורת שֶׁן (神版), שבה האל נקרא 神 ולא 上帝. הערות השוליים של ספר 1919 נשמרו, ומופיעות בקורא הזה כהערות על הפסוקים שאליהם הן שייכות.
hero.4=הוא נוסף כדי שניתן יהיה להדפיס תנ״ך סיני מנוסח שתאריכו ומקורו ידועים. דפוס 1919 חרג מזכויות היוצרים זה מכבר. הנוסחים המפוסקים שבאו אחריו, מ-1988 ואילך, הם שאלה נפרדת, ומשום כך השניים נשמרים מובדלים.

