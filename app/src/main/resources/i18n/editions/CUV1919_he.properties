title=התרגום הסיני המאוחד, נוסח 1919 — על מהדורה זו | Common Root
description=התרגום הסיני המאוחד כפי שראה אור לראשונה ב-1919, בצורות התווים הישנות ובפיסוק המקורי, בתעתיק של ויקיטקסט הסיני, על הערות השוליים שבו.
