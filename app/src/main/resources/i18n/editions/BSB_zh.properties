title=Berean Standard Bible — 关于此版本 | Common Root
description=Berean Standard Bible：由 Bible Hub 与 Discovery Bible 团队依据马所拉希伯来文本、以及他们自行校订的希腊文新约所作的现代英文译本，其后被无偿捐入公有领域。
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible 是本语料库中最新的译本之一，也是对自身工序最为坦白的一部。它由 Bible Hub 与 Discovery Bible 背后的团队在一个顾问委员会之下完成，最初以另一个名字问世：Berean Study Bible。这引起了持续的误会，因为 study Bible 通常指一部塞满注释与说明的圣经，而它并非如此。译本改了名；缩写照旧。
hero.2=多数译本都从别人校订好的希腊文新约起步。这个项目先造了自己的。Berean Greek Bible 以 Nestle 1904 为底本——编者说，选它是因为它是已经进入公有领域的最精确的校勘本——再与 Nestle–Aland、SBL 希腊文新约、蒂申多夫、韦斯科特与霍特、拜占庭文本以及公认经文逐一比对，凡有分歧处均出脚注。英文即由此译出。旧约出自马所拉希伯来文本，凡关涉读法之处，参酌死海古卷、七十士译本及其他早期见证。同一份工作随后分层出版：一部逐字对照的行间本、一部刻板直译的版本，以及这一部可读的本子，好让读者能从希腊文一步步走到英文，而不必只听译者一面之词。这也把 Berean 放在了本语料库所显明的一道分界的另一侧：日内瓦圣经与钦定本在此皆出自公认经文，而它不是。
hero.3=项目对这部文本所做的最后一件事，是把它送出去。Berean 诸本于2023年4月被捐入公有领域，整部圣经因此得以留在本语料库中，并可再从中复制出去。把阅读器界面设为英文，打开的是 New International Version，它在此为授权使用；Berean 则是与之并列、任何人都可引用、印刷与转发的现代英文。在谱系阶梯中，它的表现与 Biblia en Español Sencillo 相同。它没有记录在案的母本，因为它是全新的翻译，而非对本语料库所收任何文本的修订，所以在 Berean 经文之下展开的一级阶梯会直接落到以 ≈ 标示的原文底层，而不是落到更早的英文圣经上。目录也把它的年份留白。这并非疏漏——文本仍随勘误陆续修订，而此处的年份是经过考订而非猜测的，因此没有单一确切印次的版本便不给年份。

