title=Kirkkoraamattu 1933/38 — عن هذه الطبعة | Common Root
description=كتاب الكنيسة الفنلندية المقدس Kirkkoraamattu 1933/38: تُرجم من جديد عن العبرية واليونانية وأُقرّ على نصفين، سنة 1933 وسنة 1938، بعد أن عملت عليه لجنة نحو سبعين سنة.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=الاسم تاريخان، لأن الكتاب وصل على نصفين. أقرّت الكنيسة الإنجيلية اللوثرية في فنلندا العهد القديم سنة 1933 والعهد الجديد سنة 1938، وبالفنلندية يُسمّى منذ ذلك الحين كتاب الكنيسة المقدس لسنتي 1933/38. وهذان التاريخان في آخر الطريق يخفيان كم كانت البداية بعيدة: فقد عُيّنت لجنة الترجمة سنة 1861. نحو سبعين سنة، وأكثر من جيل من المترجمين، تفصل التكليف عن الكتاب المنجز.
hero.2=ما أنتجته اللجنة ترجمة جديدة لا تنقيح. عملت على عبرية العهد القديم ويونانية العهد الجديد — لا عبر وسائط لاتينية أو ألمانية أو سويدية، ولا عن الكتاب الفنلندي الذي كان مستعملًا بالفعل. ومع ذلك كانت عن وعي خليفة ذلك الكتاب، Biblia 1776، الذي ظل نص الكنيسة قرنًا ونصف قرن، وقد أبقت كثيرًا من مفردات الكتاب الأقدم وإيقاعه. وهذا الميراث هو سبب أن كتابًا أُنجز سنة 1938 بدا لأول قرائه عتيقًا بالفعل، وسبب أنه ما زال يحمل السجل الجليل للكتاب الفنلندي. وظل الكتاب الرسمي للكنيسة حتى سنة 1992.
hero.3=في هذا القارئ له وظيفتان. اضبط الواجهة على الفنلندية، فهذه هي الطبعة التي تُفتح — إذ إن ترتيب الفهرس نفسه كان سيعطيك Biblia 1776، فاختيار الفنلندية الافتراضي قصدٌ لا مصادفةَ ترتيب أبجدي. وهو أيضًا أعلى درجة في سلسلة النسب الفنلندية: افتح درجة تحت آية من KR3338، فتظهر تحتها Biblia 1776. واقرأ تلك الدرجة تعاقبًا داخل كتاب كنيسة واحدة لا مصدرًا، فإن مترجمي 1933/38 كان أمامهم العبرية واليونانية لا نص سنة 1776. وتحت Biblia 1776 تمضي السلسلة: طبعة Biblia سنة 1642 التي تنقّحها طبعة سنة 1776، ثم فنلندية أغريكولا سنة 1548 التي نقّحتها تلك اللجنة بدورها، وألمانية لوثر سنة 1545 مفتوحة إلى جانبهم وهم يعملون. ولا يبلغ السلّم العبرية واليونانية إلا تحت هذه.

