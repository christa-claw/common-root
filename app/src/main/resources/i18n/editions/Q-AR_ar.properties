title=القرآن — الرسم العثماني — عن هذه الطبعة | Common Root
description=القرآن برواية حفص عن عاصم، النصّ الذي تقوم عليه أكثر النسخ المطبوعة في العالم منذ طبعة القاهرة سنة 1924 — وهو في هذه المجموعة نصٌّ قُورن آية بآية بنسخة مجمع الملك فهد نفسها، فوُجد موافقاً لها في الرسم القرآني في جميع آياته البالغة 6,236.
heroHeading=القرآن — الرسم العثماني
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=لهذه القراءة التي يقوم عليها هذا النصّ سلسلة معروفة. نقلها حفص بن سليمان الكوفي (ت. 796) عن شيخه عاصم بن أبي النجود، أحد قرّاء الكوفة الذين جمع ابن مجاهد قراءتهم بعد ذلك في السبع (توفي عاصم سنة 745). وقراءة حفص عن عاصم — أي "حفص، عن عاصم" — واحدة من قراءات عدّة يَعُدّها المسلمون نقولاً متساوية في الحجّية لوحيٍ واحد؛ ولا تنفرد بذلك، لكنّها أكثرها طباعة بلا منازع. فحين أنجزت لجنة من علماء الأزهر، عاملةً منذ سنة 1907 في عهد الملك فؤاد الأول، المصحف المصري المعياري الذي طبعته المطبعة الأميرية ببولاق في 10 يوليو 1924، كانت هذه القراءة هي التي ثبّتوها في الحرف. وعلى أثر تلك الطبعة يسير اليوم أكثر ما يُباع من مصاحف في أي مكان، ومنها طبعة مجمع الملك فهد نفسه.
hero.2=والنصّ الذي في هذه المجموعة مأخوذ، عبر طبعة alquran.cloud المسمّاة quran-uthmani، من رقمنة مشروع تنزيل لذلك النصّ نفسه برواية حفص. ويُقرَن في القارئ بثلاث ترجمات: ترجمة بيكثال الإنجليزية سنة 1930، وترجمة يوسف علي الإنجليزية سنة 1934، وترجمة سابلوكوف الروسية سنة 1878 — فافتح أيّاً من الثلاث إلى جانب هذا النصّ، وتظهر ترجمته تحت كلّ آية. ويعرض القارئ القرآن أيضاً بترتيبين: ترتيب المصحف المتوارث الذي ثبّتته هذه القراءة نفسها، والترتيب الذي يستنبطه العلماء لزمن نزول كلّ سورة.
hero.3=وحفظ النصّ حرفاً بحرف من الدعاوى التي تُقال عن هذا الكتاب نفسه، فهو هنا مُحقَّق لا مفترَض. وبمقارنته آية بآية بنسخة مجمع الملك فهد لطباعة المصحف الشريف من رواية حفص، يتّفق النصّان في الرسم القرآني — الحروف العارية قبل أي تشكيل — في جميع آياته البالغة 6,236. وكل خلاف وُجد محصور في طريقة ضبط الحركات وعلامات الوقف، وفي رسم الهمزة، وفي ثمانية مواضع يفصل فيها الجانبان الكلمات على نحو مختلف؛ ولا يمسّ شيء من ذلك حرفاً واحداً من النصّ نفسه. وهذا عكس ما تضطر هذه المجموعة إلى الاعتراف به في صفحة الكتاب المقدس الفنلندي لعام 1776، حيث لا يُعرف أصلاً أيّ طبعة ينتمي إليها النصّ.
hero.4=وثمّة أمران لا يُثبتهما هذا التوافق، ويحسن قولهما بصراحة. فهو ليس دعوى انتساب — فموافقة نصّ المجمع تدلّ على أن النصّين واحد، لا على أن أحدهما نُسخ من الآخر. وليس إذناً أيضاً: فطلبٌ أُرسل إلى المجمع في أواخر أغسطس 2026 يستأذنهم في عرض ملفّات رواياتهم لم يَرِد عليه جواب حتى كتابة هذه السطور. أمّا الآية الوحيدة التي بدا فيها خلافٌ عابر في أثناء المقارنة نفسها، وهي 19:3، فتبيّن أنّ سببها خللٌ في قراءة الملف المرجعي، لا في أيٍّ من النصّين — وبعد تصحيحه يتطابق النصّان تماماً. والنسخة المرجعية نفسها إعادة بناء لملفّ معالج النصوص الذي يملكه المجمع، لا إصداراً رقمياً رسمياً منه، وهذا هو الوجه الوحيد الذي لا تُقارَن فيه هذه المقارنة بمجموعة بيانات منشورة رسمياً.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=العربية القرآنية، بالرسم العثماني المعتمد
fact.2.label=القراءة
fact.2.value=حفص عن عاصم — نقلها حفص بن سليمان (ت. 796) عن شيخه عاصم بن أبي النجود الكوفي (ت. 745)؛ واحدة من القراءات الأربع عشرة المعتمدة، وأكثرها طباعة في مصاحف العالم
fact.3.label=الصورة المطبوعة المعيارية
fact.3.value=طبعة القاهرة سنة 1924 — أنجزتها لجنة من علماء الأزهر، عاملةً منذ سنة 1907 في عهد الملك فؤاد الأول، وطبعتها المطبعة الأميرية ببولاق في 10 يوليو 1924؛ وعلى نموذجها تسير أكثر الطبعات اللاحقة، ومنها طبعة مجمع الملك فهد نفسه
fact.4.label=النصّ المستخدم هنا
fact.4.value=طبعة alquran.cloud المسمّاة quran-uthmani، وعربيّتها مأخوذة من رقمنة مشروع تنزيل
fact.5.label=قُورن بـ
fact.5.value=نسخة مجمع الملك فهد لطباعة المصحف الشريف من رواية حفص، آية بآية: يتّفقان في الرسم القرآني في جميع آياته البالغة 6,236، وكل خلاف محصور في ضبط الحركات ورسم الهمزة وثمانية مواضع في فصل الكلمات
fact.6.label=ما لا يُثبته هذا التوافق
fact.6.value=الانتساب — فالموافقة لا تعني النسب — ولا الإذن: فطلبٌ إلى المجمع للإذن بعرض ملفّاته، أُرسل في أواخر أغسطس 2026، لم يَرِد عليه جواب حتى كتابة هذه السطور
fact.7.label=ما يُقرَن به في هذه المجموعة
fact.7.value=[[Q-EN|ترجمة بيكثال الإنجليزية]] سنة 1930، و[[Q-YA|ترجمة يوسف علي الإنجليزية]] سنة 1934، و[[Q-SAB|ترجمة سابلوكوف الروسية]] سنة 1878 — ثلاث ترجمات تُقرَن بهذا النصّ الأصل تحت كل آية
fact.8.label=في هذه المجموعة
fact.8.value=النصّ العربي الذي تُقرَن به كل [[Q-EN|ترجمة]] هنا؛ وفي المقابل [[FB1776|الكتاب المقدس الفنلندي لعام 1776]]، حيث لا يُعرف أصلاً أيّ طبعة ينتمي إليها النصّ
fact.9.label=الترخيص
fact.9.value=حرّة التداول — تُعامَل العربية القرآنية بصفتها لا تخصّ أحداً؛ وشروط مصدرنا نفسه لا تطلب غير أن تحفظ إعادة النشر الرسم العثماني كما هو
