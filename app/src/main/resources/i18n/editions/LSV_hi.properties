fact.9.value=[[NIV|New International Version]] और [[NASB|New American Standard Bible]] की तरह लाइसेंस-प्राप्त, सार्वजनिक स्वामित्व में नहीं — लाइसेंस-प्राप्त, मुफ़्त प्रतिलिपि योग्य नहीं, यद्यपि दोनों से स्पष्टतः कहीं अधिक उदार शर्तों पर। वंशावली की सीढ़ियों में इसके लिए कोई मूल स्रोत दर्ज नहीं है: इसे रॉबर्ट यंग के Literal Translation के संशोधन के रूप में प्रस्तुत किया गया है, जो स्वयं इस संग्रह में नहीं रखा गया है, इसलिए LSV की किसी आयत के नीचे की सीढ़ी सीधे ≈ चिह्नित मूल-भाषा तल तक पहुँचती है। अंग्रेज़ी इंटरफ़ेस डिफ़ॉल्ट रूप से New International Version पर खुलता है; इस संस्करण तक इसके अपने कार्ड से पहुँचा जाता है।
