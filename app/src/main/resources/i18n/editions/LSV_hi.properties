title=Literal Standard Version — इस संस्करण के बारे में | Common Root
description=Literal Standard Version: Covenant Press द्वारा रॉबर्ट यंग के उन्नीसवीं सदी के Literal Translation का 2020 का संशोधन, जो पढ़ी जा सकने वाली अंग्रेज़ी की सीमा में हिब्रू, अरामी और यूनानी का सबसे सुसंगत शब्दशः अंग्रेज़ी रूपांतर देने का प्रयास करता है।
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version स्वयं को रॉबर्ट यंग के Literal Translation के एक बड़े संशोधन के रूप में प्रस्तुत करता है — उन्नीसवीं सदी का वह अत्यंत शब्दशः अंग्रेज़ी बाइबल अनुवाद जो पहली बार 1862 में प्रकाशित हुआ और जिसे यंग ने स्वयं 1887 और 1898 में संशोधित किया। Covenant Christian Coalition की प्रकाशन शाखा Covenant Press ने 2018 की शुरुआत में इस नए संशोधन का काम आरम्भ किया, जिसका घोषित उद्देश्य यंग की शब्द-दर-शब्द शब्दशः निष्ठा को बनाए रखते हुए उसकी अंग्रेज़ी को आधुनिक बनाना और उन स्थानों को सुधारना था जहाँ बाद के हस्तलिपि और शब्दकोश-सम्बन्धी शोध ने प्रगति की थी। यह कार्य 2 फ़रवरी 2020 को पूर्ण हुआ और प्रकाशित हुआ; अमेरिकी कॉपीराइट उस वर्ष के जनवरी में दर्ज हुआ, और ई-बुक संस्करण उसी वर्ष मई में आए। प्रकाशित संस्करण में व्यक्तिगत अनुवादकों के नाम नहीं दिए गए हैं; प्रायोजक संस्थाओं के रूप में Covenant Press और Covenant Christian Coalition का उल्लेख है।
hero.2=पुराने नियम के लिए LSV मासोरेटिक पाठ का अनुसरण करता है, जिस पर सेप्टुआजिंट का उल्लेखनीय प्रभाव है, और कभी-कभी मृत सागर की पुस्तकों (Dead Sea Scrolls) का सहारा लिया गया है जब उनकी पाठ-भिन्नताएँ पर्याप्त स्पष्ट प्रतीत हुईं। नए नियम के लिए यह टेक्स्टस रिसेप्टस और बहुसंख्य पाठ (Majority Text) का अनुसरण करता है, और अलेक्सान्द्रियाई परम्परा की पाठ-भिन्नताओं को केवल विशेष एवं घोषित मामलों में अपनाता है, सामान्य नीति के रूप में नहीं। अनुवादकों ने तीन मार्गदर्शक सिद्धांत निर्धारित किए: जहाँ तक अंग्रेज़ी अनुमति दे मूल के क्रिया-काल को बनाए रखना, जहाँ तक संगति सम्भव हो किसी दिए गए मूल शब्द को एक ही अंग्रेज़ी शब्द से अनुवादित करना, और मूल शब्द-क्रम को बनाए रखना सिवाय उन स्थानों के जहाँ अंग्रेज़ी की पढ़नीयता वास्तव में परिवर्तन माँगे। पुराने नियम के ईश्वरीय नाम का लिप्यंतरण किया गया है, न कि उसे "प्रभु" जैसी किसी उपाधि से अनुवादित किया गया है, जो इस अनुवाद की इस सामान्य प्राथमिकता के अनुरूप है कि पाठक को मूल पाठ की अपनी ही चुनी हुई बातें दिखाई जाएँ, न कि उन्हें सहज बना दिया जाए।
hero.3=इस संग्रह से इसका सम्बन्ध वंशावली जैसा नहीं, बल्कि पाठ-सम्बन्धी है: Literal Standard Version का नया नियम टेक्स्टस रिसेप्टस और बहुसंख्य पाठ पर आधारित है — वही यूनानी आधार जिसे यह संग्रह अलग से और पूरी तरह टेक्स्टस रिसेप्टस के नाम से रखता है — वह पाठ जिस पर किंग जेम्स वर्शन और सामान्यतः सुधार-काल की परम्परा आधारित है। इन दो संस्करणों के बीच कोई वंशावली सीढ़ी नहीं जोड़ती, क्योंकि LSV को यंग के Literal Translation के संशोधन के रूप में प्रस्तुत किया गया है, न कि स्वयं टेक्स्टस रिसेप्टस या यहाँ रखे किसी अन्य पाठ के संशोधन के रूप में; इसलिए LSV की किसी आयत के नीचे खोली गई सीढ़ी सीधे ≈ चिह्नित मूल-भाषा तल तक जाती है। यह सार्वजनिक स्वामित्व में सौंपे जाने के बजाय Creative Commons एट्रिब्यूशन-शेयरअलाइक 4.0 लाइसेंस के अन्तर्गत प्रकाशित है, जो इसे New International Version और New American Standard Bible के साथ लाइसेंस-प्राप्त — मुफ़्त प्रतिलिपि योग्य नहीं — संस्करणों में रखता है, यद्यपि दोनों से स्पष्टतः कहीं अधिक उदार शर्तों पर। अंग्रेज़ी इंटरफ़ेस डिफ़ॉल्ट रूप से New International Version पर खुलता है; इस संस्करण तक इसके अपने कार्ड से पहुँचा जाता है।

