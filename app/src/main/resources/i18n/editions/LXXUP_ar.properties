title=السبعينية الإنجليزية لبرنتون المحدَّثة — عن هذه الطبعة | Common Root
description=السبعينية الإنجليزية للسير لانسلوت برنتون من عامي 1844 و1851، وقد حدّث آدم بويد إملاءها وأسماءها عام 2020 — الترجمة نفسها التي يحملها برنتون الأصلي الموضوع بجانبها في هذه المجموعة، مع ترك thou وthee حيث وضعهما برنتون.
heroHeading=السبعينية الإنجليزية لبرنتون المحدَّثة
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=هذه ترجمة السير لانسلوت برنتون الإنجليزية للسبعينية، أي العهد القديم اليوناني، وقد حُدِّثت إنجليزيتها. ترجم برنتون أساسًا عن المخطوطة الفاتيكانية؛ ونشرت دار Samuel Bagster and Sons في لندن ترجمته عام 1844 ثم أعادت إصدارها مع الأسفار المنحولة عام 1851. وفي عام 2020 راجعها آدم بويد لموقع eBible.org ووهب تعديلاته للملك العام. لم يترجمها من جديد. وتعدّد مقدّمته ما غيّره: الإملاء رُدَّ إلى الإنجليزية الأمريكية الحديثة، فحلّت «show» محلّ «shew»؛ وأسماء الأشخاص والأماكن أُعطيت الصيغ التي يعرفها القارئ الإنجليزي؛ و«begat» و«spake» صارتا «begot» و«spoke»؛ ورُتّبت الشرطات وعلامات الترقيم المزدوجة؛ ونُضِّد الشعر شعرًا. وما أبقاه مقصود بالقدر نفسه: «thou» و«thee» و«ye» مع صيغ الأفعال المصاحبة لها، ونحو برنتون، وترقيمه الثقيل الموروث من القرن التاسع عشر.
hero.2=يظهر الفرق على أوضحه بجانب برنتون الأصلي، وهو أيضًا في هذه المجموعة. كان برنتون يكتب الأسماء العبرية كما تكتبها اليونانية؛ أما التحديث فيعطي في الغالب الصيغة الإنجليزية. فحيث يبدأ سفر نحميا عند برنتون بعبارة «the words of Neemias the son of Chelcia»، نجد هنا «Nehemiah the son of Hacaliah»؛ ويحلّ Elijah the Tishbite محلّ Elias the Thesbite، ويحلّ Immanuel محلّ Emmanuel في إشعياء 7:14. وتحت الإملاء تبقى الترجمة ترجمة برنتون، ولذلك تقرأ حيث تقرأ اليونانية. فعبارة «A virgin shall conceive» في إشعياء 7:14 تنقل اليونانية parthenos؛ والمزامير تحتفظ بالترقيم اليوناني، فالمزمور 22 هنا هو مزمور الراعي؛ والأرض في التكوين 1:2 ما زالت «unsightly and unfurnished». وتبقى الضمائر القديمة أيضًا: «thou shalt call his name Immanuel».
hero.3=تقف في هذا القارئ خارج درجات النسب. فالمجموعة لا تسجّل لها أصلًا — لا اليونانية التي ترجمها برنتون ولا برنتون الذي تراجعه — ولذا فإن درجة تُفتح تحت إحدى آياتها تسقط مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈، وهي في العهد القديم مخطوطة لينينغراد: نصّ عبري، لا اليونانية التي صُنعت منها هذه الترجمة. ولكي تنزل من إنجليزية برنتون إلى يونانيته، افتح برنتون الأصلي، الذي أصله المسجَّل هو السبعينية. ولا يقوم شيء بدوره على هذه الطبعة، ولا تُفتح عليها أي لغة من لغات الواجهة؛ فالواجهة الإنجليزية تُفتح على New International Version. ونسختنا أضيق من الكتاب. فيها 36 سفرًا. عزرا ونحميا سفر واحد من 23 أصحاحًا، كما في اليونانية، ويبدأ نحميا عند الأصحاح 11. وملفات eBible.org التي أُخذت منها تحمل أيضًا الأسفار المنحولة، ولا تعطي أستير ودانيال إلا في صيغتيهما اليونانيتين الأطول؛ ولم يُدرج شيء من ذلك، فلا أستير هنا ولا دانيال، ولا طوبيا ولا الحكمة كذلك.

