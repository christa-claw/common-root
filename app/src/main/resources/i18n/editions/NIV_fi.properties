fact.3.label=Tekijät
fact.3.value=Raamatunkäännöslautakunta — alussa viisitoista tutkijaa, joiden joukko kasvoi myöhemmin yli sataan tutkijaan useista englanninkielisistä maista ja monista kirkkokunnista, noin vuosikymmenen aikana
fact.4.label=Vanha testamentti pohjautuu
fact.4.value=Masoreettiseen hepreankieliseen tekstiin, Kuolleenmeren kääröjä, Septuagintaa ja muita varhaisia todistajia huomioon ottaen
fact.5.label=Uusi testamentti pohjautuu
fact.5.value=Eklektiseen kriittiseen kreikkalaiseen tekstiin, jota edustavat United Bible Societiesin ja Nestle-Alandin laitokset — ei [[TR|Textus Receptukseen]], jonka päällä tässä aineistossa lepäävät [[GNV|Geneven Raamattu]] ja [[KJV|King James Version]]
fact.6.label=Käännöstyyppi
fact.6.value=Tasapainottaa kirjaimellisen käännöksen tarkkuutta luonnollisella, idiomaattisella englannilla sen sijaan, että pitäytyisi kummassakaan ääripäässä — luokitellaan tavallisesti dynaamiseksi vastaavuudeksi; uusi käännös alkukielistä, ei King Jamesin perinteen tarkistus
fact.7.label=Julkaistu
fact.7.value=Uusi testamentti 1973; koko Raamattu 27. lokakuuta 1978; lievä tarkistus 1984; nykyinen, perusteellisemmin tarkistettu teksti 2011, joka vei pois käytöstä sekä vuoden 1984 painoksen että vuoden 2005 Today's New International Versionin
fact.8.label=Kustantaja
fact.8.value=Biblica, Inc., joka omistaa tekijänoikeudet; Zondervan Yhdysvalloissa, Hodder & Stoughton Yhdistyneessä kuningaskunnassa
fact.9.label=Lisenssi
fact.9.value=Lisensoitu, ei vapaasti käytettävä. Enintään 500 jaetta saa lainata ilman kirjallista lupaa, kunhan ne eivät muodosta kokonaista Raamatun kirjaa eivätkä enempää kuin 25 % teoksesta, ja mukana on tekijänoikeusmaininta; sitä laajempi käyttö vaatii Biblican luvan
fact.10.label=Tässä aineistossa
fact.10.value=Raamattu, jonka englanninkielinen käyttöliittymä avaa oletuksena — [[KJV|King James Version]] ja [[RV|Revised Version]] toteavat tässä molemmat, että ne eivät ole se. Polveutumisaskelmiin ei ole kirjattu isää: askelman avaaminen NIV-jakeen alta johtaa suoraan alkukielen pohjalle, merkittynä ≈, samoin kuin [[BSB|Berean Standard Biblelle]] — paitsi että tämän pohjan kreikankielinen todistaja on [[TR|Textus Receptus]], joka ei ole se teksti, josta tämän käännöksen Uusi testamentti todella on tehty. Lisensoituna, ei vapaasti käytettävänä, samalla asemalla kuin New American Standard Bible 2020, se erottuu vapaasti käytettävistä naapureistaan, kuten [[KJV|King James Versionista]], [[RV|Revised Versionista]] ja [[WEB|World English Biblestä]]
