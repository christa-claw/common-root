title=New International Version — Tietoa tästä laitoksesta | Common Root
description=New International Version: englanninkielinen Raamattu, jonka tämä lukuohjelma avaa oletuksena, Raamatunkäännöslautakunnan alkukielistä kääntämä ja ensimmäisen kerran valmiiksi saatu 1978 — tässä vuoden 2011 tekstinä.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Se alkoi yhden kirkkokunnan tyytymättömyydestä. Vuonna 1955 liikemies Howard Long painosti yhdessä pastori Peter De Jongin kanssa Christian Reformed Churchia tuottamaan Raamatun nykyaikaisella englannilla, ja 1957 kirkkokunta asetti asiaa tutkivan toimikunnan. National Association of Evangelicals oli aloittanut omaa vastaavaa hankettaan samana vuonna. Kaksi järjestöä yhdistivät voimansa: yhteinen toimikunta lähetti 1964 kutsuja käännöskonferenssiin, joka kokoontui elokuussa 1965 Trinity Christian Collegessa Palos Heightsissa, Illinoisissa, ja päätti perustaa "jatkuvan viidentoista hengen toimikunnan" viemään työtä eteenpäin. Tästä pysyvästä toimikunnasta tuli Raamatunkäännöslautakunta (Committee on Bible Translation). Vuonna 1967 New York Bible Society — nykyiseltä nimeltään Biblica — otti hankkeen johtoonsa ja palkkasi kääntämisen tekevät tutkijat.
hero.2=Mikään tässä ei polveudu vanhemmasta englanninkielisestä Raamatusta. Siinä missä King James Version, Revised Version, American Standard Version ja World English Bible muodostavat tässä aineistossa yhden tarkistusten ketjun, New International Version käännettiin uudestaan suoraan hebreasta, aramealaisesta ja kreikasta: Vanha testamentti masoreettisesta hepreankielisestä tekstistä, Kuolleenmeren kääröjä, Septuagintaa ja muita varhaisia todistajia huomioon ottaen; Uusi testamentti siitä eklektisestä kriittisestä kreikkalaisesta tekstistä, jota edustavat United Bible Societiesin ja Nestle-Alandin laitokset — ei siitä Textus Receptuksesta, jonka päällä tässä aineistossa lepäävät Geneven Raamattu ja King James. Viidentoista hengen toimikunta kasvoi noin vuosikymmenen kuluessa hankkeeksi, jossa oli mukana yli sata tutkijaa useista englanninkielisistä maista ja monista kirkkokunnista. Heidän tavoitteenaan oli käännös, joka pitäytyy alkutekstin sanatarkkuudessa lukemalla silti luonnollisemmin kuin sana sanasta tehty jäljennös — tasapaino, joka luokitellaan tavallisesti dynaamiseksi vastaavuudeksi, tiukan kirjaimellisen käännöksen ja väljän paraphraasin välimaastoon.
hero.3=Uusi testamentti ilmestyi ensin, 1973; koko Raamattu seurasi 27. lokakuuta 1978; lievä tarkistus tehtiin 1984. Teksti muuttui perusteellisemmin 2011, kun laajempi tarkistus korvasi sekä vuoden 1984 painoksen että vuoden 2005 Today's New International Versionin ja vei molemmat pois käytöstä sen tekstin hyväksi, joka on ollut voimassa siitä lähtien. Tämä vuoden 2011 teksti on se, joka on tässä aineistossa — sama vuosi, jonka luettelokortti näyttää. Biblica, Inc. omistaa tekijänoikeudet koko ajan; Zondervan julkaisee sen Yhdysvalloissa ja Hodder & Stoughton Yhdistyneessä kuningaskunnassa.
hero.4=Sen paikka tässä lukuohjelmassa on hiljaisella tavalla keskeinen. Aseta käyttöliittymän kieleksi englanti, ja tämä on se, joka avautuu — King James Versionin ja Revised Versionin sivut tässä aineistossa toteavat itse saman, viitaten tähän laitokseen siihen, josta vaihdetaan pois, ei siihen, jolle tullaan. Koska se ei tarkistanut mitään aiempaa, aineisto ei kirjaa sille isää: polveutumisaskelman avaaminen New International Version -jakeen alta johtaa suoraan alkukielen pohjalle, merkittynä ≈, samoin kuin Berean Standard Biblelle — yhtä eroa lukuun ottamatta. Tämän pohjan kreikankielinen todistaja on Textus Receptus, ja Textus Receptus ei ole se, mistä tämän käännöksen Uusi testamentti todella on tehty — pohja edustaa "alkukielistä kreikkaa" yleisesti, ei tämän toimikunnan omaa työtekstiä. Yksi asia erottaa sen vielä useimmista englanninkielisistä naapureistaan: se on lisenssinvarainen, ei vapaasti käytettävä, samalla asemalla kuin New American Standard Bible 2020, kun taas Berean Standard Bible, Geneven Raamattu, King James Version, Revised Version ja World English Bible saa kaikki kopioida vapaasti.

