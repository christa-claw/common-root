title=Riveduta 1927 (italiano) — Acerca de esta edición | Common Root
description=La Riveduta: la Biblia italiana de Giovanni Diodati revisada sobre el hebreo y el griego por un comité dirigido por el teólogo valdense Giovanni Luzzi, publicada en Roma en 1924 por la Sociedad Bíblica Británica y Extranjera — y por qué el archivo dice 1927.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi nació en 1856 en la Baja Engadina, en el cantón suizo de los Grisones, y fue llevado a Lucca de niño de pecho cuando su familia emigró allí al año siguiente. Creció italiano, estudió en la Facultad Valdense de Teología de Florencia — la escuela de la antigua iglesia protestante de Italia — y más tarde enseñó teología allí y fue pastor en la ciudad. Pasó sus últimos años de nuevo en Suiza, en Poschiavo, y allí murió en 1948.
hero.2=La Riveduta empezó en 1906, cuando la Sociedad Bíblica Británica y Extranjera, que llevaba un siglo imprimiendo para los lectores italianos la traducción de Diodati del siglo XVII, encargó a un grupo su revisión y puso a Luzzi al frente. Él había esperado hacer de ella una Biblia común con eruditos católicos; el Vaticano se negó, y el trabajo siguió como revisión protestante. La Biblia completa apareció en Roma en 1924, descrita en su portada como una versión revisada sobre el texto original — «riveduta», revisada, y así se la conoce desde entonces. No es una traducción nueva: debajo está el texto de Diodati, cotejado de nuevo con el hebreo y el griego. Fue la Biblia de los protestantes italianos durante la mayor parte del siglo XX, y su heredera, la Nuova Riveduta, la publicó la Sociedad Bíblica de Ginebra en 1994. Luzzi hizo además una traducción propia, anotada, en doce volúmenes publicados en Florencia a partir de 1921; es otra obra y no este texto.
hero.3=La revisión se nota en la página. El nombre divino en el Antiguo Testamento es «l'Eterno», el Eterno — «L'Eterno è il mio pastore» en el Salmo 23 — donde Diodati tiene «il Signore». Isaías 7:14 dice «la giovane», la joven, donde Diodati tiene «la Vergine». En el Nuevo Testamento se aparta del Textus Receptus allí donde lo hacen las ediciones críticas posteriores: 1 Juan 5:7 no tiene los testigos celestiales, el padrenuestro de Mateo 6:13 termina sin la doxología, y Hechos 8:37 se conserva pero entre corchetes. Los Salmos siguen la numeración hebrea, y el título de cada salmo va unido a su primer versículo — el Salmo 23 empieza «Salmo di Davide.» —, de modo que el Salmo 51 tiene 19 versículos, como en las Biblias inglesas. En cuanto a la fecha: 1927 es el año que lleva el texto digital y el que guarda el catálogo, así que su peldaño muestra 1927. La Riveduta misma apareció en 1924, y qué impresión posterior reproduce este archivo no es algo que este proyecto haya establecido.
hero.4=En este lector es una de tres Biblias italianas, junto a dos copias de Diodati. Una interfaz en italiano no abre en ella: el italiano no tiene elección curada, así que el lector toma la primera Biblia italiana en el orden del catálogo, que es Diodati 1649. En los peldaños de linaje no consta antecedente alguno para ella — ni siquiera Diodati, aunque la Riveduta es una revisión de Diodati y Diodati está en el corpus —, de modo que un peldaño abierto bajo un versículo cae directamente al suelo de lenguas originales marcado con ≈: el Códice de Leningrado de Westminster para el Antiguo Testamento, y para el Nuevo el Textus Receptus, que es precisamente el griego del que esta revisión se apartó.

