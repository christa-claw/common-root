title=Emphatic Diaglott (Interlinear) — About This Edition | Common Root
description=Benjamin Wilson's Emphatic Diaglott of 1864: the word-for-word English gloss printed beneath Griesbach's Greek, later bought and reprinted for sixty years by the Watch Tower Society, and the text the John 1:1 argument is usually fought over.
heroHeading=Emphatic Diaglott (Interlinear)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson was not a professional scholar. He was a newspaper editor in Geneva, Illinois, who taught himself Greek, and between 1857 and 1863 he issued, a section at a time, an interlinear New Testament that he had not only translated but manufactured: his nephew watched him take wax impressions of each page of type, hang them in acid overnight to grow a skin of copper, back the copper with cast metal, and print the result on a hand press while the boy inked the plate. The finished volume appeared in 1864. For his Greek he used the text Johann Jakob Griesbach had established in the 1770s, with readings drawn from Codex Vaticanus.
hero.2=What Wilson actually printed was two English texts, not one. Down the left of the page ran the Greek with a literal word-for-word English gloss beneath each word; down the right ran his own polished translation, the Emphatic Version. They are not the same, and at John 1:1 they disagree outright — the gloss reads “and a god was the Word”, the Emphatic Version “and the LOGOS was God”. Both are Wilson's, printed in the same book, three inches apart. This corpus holds the gloss, which is the column people quote, and that is the reason it sits in a section of its own rather than in the grid of Bibles. A gloss records how a Greek sentence is put together — case by case, article by article, in Greek word order. It is not a judgement about how the sentence should be read in English, and Wilson's own judgement about that is printed in the next column. Anyone citing the one should know the other exists.
hero.3=The book's later life is the reason most people have heard of it. Wilson died in 1900 a member of the Church of the Blessed Hope, not of any group that then existed under the name Jehovah's Witnesses. In 1902 Charles Taze Russell, president of the Watch Tower Bible and Tract Society, obtained the copyright from Wilson's heirs and in time the plates as well. The Society printed the Diaglott for the next sixty years — resetting the type on its own presses in 1927, running off well over a hundred and fifty thousand copies, selling it for two dollars and eventually giving it away. So the Diaglott is a Jehovah's Witness book by adoption rather than by authorship, and its habit of printing “Jehovah” in the New Testament, where the writers wrote κύριος while quoting the Hebrew scriptures, arrived four decades before the movement that made the practice famous. The copyright lapsed in 1952 and it has been public domain since.
hero.4=Two things about it in this reader are worth knowing before you use it. Griesbach did not print Acts 8:37 or Luke 17:36, so neither is here; rather than close the gap and shift every later verse up by one, the numbering leaves the two places empty, so a reference still lands on the same verse in this column as in the one beside it. And no antecedent is recorded for it, so opening a lineage rung beneath a Diaglott verse goes to the original-language floor rather than to an older English edition.
hero.5=Be precise about what that floor prints. The Greek it shows is the Textus Receptus — the chip reads ≈ TR 1550, and that ≈ is the reader saying it is offering a witness to the Greek rather than the text this edition was made from. Wilson worked from Griesbach. Where the two agree, as they do at John 1:1, the rung does show the very words being glossed. Where they differ it does not: Griesbach rejected the Trinitarian clause at 1 John 5:7, so the Diaglott has no trace of it, while the Textus Receptus line underneath carries it in full. On an interlinear, whose whole premise is that the Greek is right there on the page, that is the one gap worth knowing about before you quote from it.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=What this is
fact.1.value=The sublinear gloss — the word-for-word English printed beneath the Greek, not Wilson's readable translation
fact.2.label=Compiled by
fact.2.value=Benjamin Wilson (1817–1900), a self-taught scholar and newspaper editor in Geneva, Illinois
fact.3.label=Greek text
fact.3.value=Griesbach's recension, with readings from Codex Vaticanus (Vatican MS 1209)
fact.4.label=Published
fact.4.value=In parts from 1857; complete in one volume in 1864, by Fowler and Wells of New York
fact.5.label=Printed how
fact.5.value=Wilson electrotyped every plate himself and ran the first edition off on a hand press
fact.6.label=Divine name
fact.6.value=Prints “Jehovah” in the New Testament where the writers wrote κύριος while quoting Hebrew scripture — the same decision the [[ASV|American Standard Version]] made across the Old
fact.7.label=Acquired by
fact.7.value=The Watch Tower Bible and Tract Society, which obtained the copyright in 1902 under Charles Taze Russell, reset the type in 1927, and printed it into the 1960s
fact.8.label=Licence
fact.8.value=Public domain — the copyright lapsed in 1952, and the Watch Tower reprints added no new one
fact.9.label=Two verses absent
fact.9.value=Acts 8:37 and Luke 17:36 are not in Griesbach, so they are not here; their numbers are left empty rather than closed up, so the text still lines up verse-for-verse with every other edition
fact.10.label=The Greek under the rung
fact.10.value=The [[TR|Textus Receptus]], shown as ≈ TR 1550 — a witness to the Greek, not Wilson's base text, which was Griesbach's recension; the two agree at John 1:1 and part company at 1 John 5:7
fact.11.label=In this corpus
fact.11.value=Kept in its own Interlinear & Study Editions section, apart from the reading Bibles, so a gloss is never taken for a translation; no parent is recorded in the lineage rungs, so a rung opens straight onto the original-language floor
