title=Baibal Olcim — Om denna utgåva | Common Root
description=Baibal Olcim: Bibeln på matu chin, ett minoritetsspråk i Myanmars Chinstat, spridd av eBible.org som en genuint fri (public domain) text vars översättare och översättningsår inte är kända.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Matu chin — även kallat matupi chin — är ett sino-tibetanskt språk som talas av omkring 34 000 personer, koncentrerade kring Matupi i södra delen av Myanmars Chinstat, med besläktade samhällen på andra sidan gränsen i den indiska delstaten Mizoram. Baibal Olcim är Bibeln på detta språk, och det är den enda matu-chin-texten i detta korpus.
hero.2=Det källan inte ger är vem som översatte den, eller när. eBible.org, som sprider texten, anger bara att den är fri (public domain), och katalogför den under hlt, ISO 639-3-koden för matu chin — ingen översättare, ingen kommitté, inget översättningsår. Den här sidan lämnar båda tomma hellre än att gissa. Samma kod har sin egen lilla historia här: ett tidigare försök att lägga till en andra hindisk Bibel i detta korpus arkiverades under hlt på grund av en liknande förkortning, tills matu-chin-verser som dök upp där hindi förväntades avslöjade misstaget. Denna utgåva är den som faktiskt kontrollerades mot det språk som dess kod namnger.
hero.3=Den lades till för vad den är, inte för sin längd: en genuint fri (public domain) Bibel, inte bara licensierad, på språket för en kristen minoritet som har utsatts för verklig förföljelse under Myanmars inbördeskonflikt, koncentrerad i och kring Chinstaten. En läsare byggd för att inte kräva något av dem som använder den, och för att inte spåra någon av dem, är precis till för ett fall som detta — vilket också till stor del förklarar varför den här sidan har så litet annat att sätta i sina fakta.

