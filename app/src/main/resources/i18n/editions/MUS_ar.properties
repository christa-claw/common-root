title=صحيح مسلم — عن هذه الطبعة | Common Root
description=صحيح مسلم: يشكّل مع صحيح البخاري "الصحيحين"، الكتابين اللذين يضعهما أهل السنة في المرتبة الثانية بعد القرآن مباشرة؛ جمعه مسلم بن الحجاج من أحاديث جمعها في الجزيرة العربية ومصر والعراق والشام، فلم يقبل منها إلا ما كان له سند متصل من رواة ثقات.
heroHeading=صحيح مسلم
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد أبو الحسين مسلم بن الحجاج القشيري النيسابوري في نيسابور، في ولاية خراسان العباسية (في شمال شرق إيران حالياً)؛ وتختلف المصادر في سنة مولده، فتذكر 202 أو 204 أو 206 هـ (نحو 817–822 م). طاف في الجزيرة العربية ومصر والعراق والشام يجمع الحديث عن علماء كل بلد، ثم استقر في مدينته، حيث لقي البخاري ودرس عليه وبقي صديقه بقية حياته. وبحسب الخطيب البغدادي، فإنه ألّف الكتاب بطلب من أحد طلابه، أحمد بن سلمة النيسابوري؛ وعنوانه الأصلي، المسند الصحيح المختصر، يُختصر عادة، كما في حالة البخاري، إلى صحيح مسلم. توفي في نيسابور سنة 261 هـ (875 م) ودُفن في ضاحيتها نصرآباد.
hero.2=لم يكن مسلم يقبل حديثاً إلا إذا كان سنده متصلاً إلى صحابي من صحابة النبي، مروياً في كل حلقة منه عن طريق راويين ثقتين على الأقل؛ وقسّم الرواة إلى ثلاث طبقات بحسب الحفظ والعدالة، ونحّى من طُعن في صدقه منهم. وقد لاحظ شارحه النووي دقة أخرى: فمسلم، كما كتب، "يضع كل حديث في موضعه المناسب، مع جميع أسانيده وألفاظه المختلفة"، بدل أن تتناثر هذه الألفاظ في مواضع متفرقة — وهو عرضٌ قارن به شراح لاحقون طريقة [[BUK|صحيح البخاري]] الذي يضع ألفاظ الحديث المختلفة في مواضع متفرقة، كل لفظ تحت الباب الذي يخدم المعنى الذي يوضحه.
hero.3=ويختلف عدد الأحاديث التي يحتويها الكتاب فعلاً، كما في [[BUK|صحيح البخاري]]، باختلاف من يعدّها وكيف يُعامل التكرار. فقد توصل كاتب جلبي وصديق حسن خان كلاهما إلى 7,275؛ وتوصل محمد فؤاد عبد الباقي، حين عدّ بلا تكرار، إلى 3,033؛ وتوصل مشهور بن حسن آل سلمان إلى 7,385، أو 7,395 بعد إضافة الأحاديث العشرة في مقدمة مسلم نفسها؛ وتتراوح تقديرات أخرى بين نحو 5,500 و7,500. وعدّ الجوزقي 2,326 حديثاً مشتركاً، شبه الحرفي، مع صحيح البخاري. أما رقم هذه المجموعة نفسها فهو رقم آخر مختلف: 57 كتاباً و7,563 حديثاً مرقَّماً، وهو مجرد شكل الطبعة الرقمية التي أُخذت منها، لا دعوى بإعادة طبعة مطبوعة واحدة بعينها بدقة.
hero.4=النص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من إصدار eng-muslim التابع لـ fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو ترتيب الترافق نفسه الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] وفي ترجمات القرآن. ولم يتحدد على صعيد هذه المجموعة أي ترجمة إنجليزية منشورة ينحدر منها هذا الملف، ولهذا وُسمت رخصته بأنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما النص العربي أعلاه فلا يحمل هذا الغموض.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=عربية كلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=أبو الحسين مسلم بن الحجاج القشيري النيسابوري (و. 202–206 هـ / نحو 817–822 م – ت. 261 هـ / 875 م)
fact.3.label=الاسم الكامل
fact.3.value=المسند الصحيح المختصر — يُختصر عادة إلى صحيح مسلم
fact.4.label=مكان وزمان التأليف
fact.4.value=جُمعت أحاديثه من الجزيرة العربية ومصر والعراق والشام؛ واكتمل الكتاب نفسه في نيسابور بخراسان، بطلب من أحد طلابه
fact.5.label=المنهج
fact.5.value=لا يقبل حديثاً إلا بسند متصل عن راويين ثقتين على الأقل في كل حلقة وصولاً إلى صحابي؛ ويُصنَّف الرواة في ثلاث طبقات بحسب الثقة، ويُستثنى من طُعن في صدقه
fact.6.label=المكانة
fact.6.value=ثاني كتب السنة الستة عند أهل السنة (الكتب الستة)؛ ومع [[BUK|صحيح البخاري]] يشكّل "الصحيحين"، الكتابين اللذين يأتيان في السلطة بعد القرآن مباشرة؛ ويضع أغلب العلماء مجموع كتاب البخاري فوق هذا الكتاب
fact.7.label=عدد الأحاديث
fact.7.value=تتراوح الأرقام بين 3,033 بلا تكرار (عبد الباقي) و7,275–7,395 بالتكرار، بحسب طريقة العدّ؛ وتختلف الطبعات المطبوعة في ترقيم الأبواب والأحاديث معاً
fact.8.label=في هذه المجموعة
fact.8.value=57 كتاباً و7,563 حديثاً مرقَّماً — وهو شكل مجموعة البيانات المصدرية نفسها، لا إعادة إنتاج لترقيم مطبوع معيّن
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من إصدار eng-muslim التابع لـ fawazahmed0/hadith-api، وتُعرض مترافقة مع العربية؛ ولم تتأكد على صعيد هذه المجموعة الترجمة المطبوعة التي تنحدر منها
fact.10.label=الرخصة
fact.10.value=المتن العربي نص كلاسيكي ملك عام؛ ورخصة الترجمة الإنجليزية لا تزال قيد المراجعة
