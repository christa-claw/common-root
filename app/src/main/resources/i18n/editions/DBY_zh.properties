fact.6.label=为谁而作
fact.6.value=弟兄会众，主要是法语瑞士的会众，而非波城本地的
fact.7.label=翻译方式
fact.7.value=有意直译，为个人研读而非朗读而作；神名作«l'Éternel»，不留作«le Seigneur»
fact.8.label=姊妹版本
fact.8.value=德文达秘圣经即埃尔伯费尔德本，在本语料库中作[[ELB|Elberfelder 1905]]；英文达秘旧约是据法文与德文的成果做成的，并非径直出于达秘自己的英文
fact.9.label=内容
fact.9.value=66 卷——新教正典，无次经
fact.10.label=在本语料库中
fact.10.value=此处唯一的法文圣经，所以法文界面在它上面开启；谱系阶梯中未记录任何母本，而目录卡片虽显示 1885，它的阶梯标签仍不带年份
