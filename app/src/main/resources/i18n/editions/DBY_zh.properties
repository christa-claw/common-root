title=达秘圣经 1885（法文）— 关于此版本 | Common Root
description=1885 年的法文达秘圣经：波城—沃韦译本，1859 年由约翰·纳尔逊·达秘及其同工着手，在他去世三年后完成；他的英文旧约日后即由此本建成。
heroHeading=达秘圣经 1885（法文）
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=人们记得约翰·纳尔逊·达秘的是别的事——他离开爱尔兰教会，参与创立普利茅斯弟兄会，并使时代论前千禧年主义流传开来——但他一生中有很长时间在翻译圣经，而且用三种语言翻译。他不寻常之处在于次序。多数译者是从自己的母语向外做工。达秘的英文圣经是三部中最后完成的，其旧约并非由他径直译自希伯来文，而是取自他先前与他人合作已经完成的法文本与德文本。
hero.2=这一部就是法文本。达秘是主要的学者，却从来不是任何署他名之书的唯一译者；法文班子里有威廉·约瑟夫·洛和皮埃尔·施伦贝格尔。新约于 1859 年问世，其后二十年间三次重印。全本圣经于 1885 年在波城与沃韦出版——它通常的名称即由此而来——不过扉页略有误导：波城在法国最南端，而这项工作主要是为法语瑞士的弟兄会众做的。达秘已于 1882 年去世，因此不曾见到成书。
hero.3=这译本出于原则而直译，达秘在其德文新约的序言中把理由说得明白：有学问的人可以查考原文，所以翻译的用意，是把尽可能准确的原文映象交到不能查考的人手里。他还告诫说，较自由的译法会失去译者自己也未必察觉的意思。其结果准确而不加修饰，本来也从未打算供人朗读——达秘自己讲道时用的是 King James Version。
hero.4=有两件事把它系于本语料库其余各本。德文达秘圣经就是埃尔伯费尔德本，在此作 Elberfelder 1905——同一个人，同样的原则，也是他的英文旧约据以拼合的两个底本之一，所以法文与德文这两张卡片的亲缘，比它们不同的语言所显示的更近。而它处置神名的方式，使它与 American Standard Version 并列：后者数千处印“Jehovah”，而 King James Version 在同样的地方印“the LORD”；达秘先作了同样的决定，并且是用三种语言。在阅读器里它是唯一的法文圣经，所以法文界面在它上面开启。谱系阶梯中未为它记录任何母本；而且与此处多数带年份的版本不同，它的阶梯标签根本不带年份——目录卡片显示 1885，但阶梯年份是另一份手工维护的清单，这一版本尚未列入其中。

