title=الأربعون لشاه ولي الله الدهلوي — عن هذه الطبعة | Common Root
description=الأربعون لشاه ولي الله الدهلوي: أربعون حديثاً قال العالم الدلهوي من القرن الثامن عشر إنه سمعها مباشرة من شيخه خلال عام من الدراسة في المدينة المنورة، محفوظة مع أسانيدها — أشهر مجموعة من هذا النوع من شبه القارة الهندية.
heroHeading=الأربعون لشاه ولي الله الدهلوي
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد شاه ولي الله الدهلوي — واسمه كاملاً قطب الدين أحمد بن عبد الرحيم العمري الدهلوي — في 21 فبراير 1703 في فولت، قرب مظفر نجر، ونشأ في دلهي، حيث كان والده شاه عبد الرحيم قد أسس المدرسة الرحيمية. ويُقال إنه حفظ القرآن في السابعة من عمره، وأتمّ المنهج المعتاد في عصره في الخامسة عشرة، وخلف والده على رئاسة المدرسة بعد ذلك بعامين. وفي 1730–1731 أدّى الحج، ثم مكث نحو عام في المدينة المنورة يدرس الحديث — أساساً على يد أبي طاهر الكردي (ويُكتب أيضاً الكوراني)، مع دراسة أخرى على يد محمد وفد الله المالكي والشيخ تاج الدين القلعي — قبل أن يعود إلى دلهي في 16 ديسمبر 1732. وتوفي هناك في 20 أغسطس 1762 (29 محرم 1176 هـ)، ودُفن إلى جانب والده. ومن مؤلفاته الأخرى حجة الله البالغة، التي تُعدّ عموماً أهم كتبه، والفوز الكبير، وفتوح الحرمين، وهو روايته الخاصة عن الرحلة التي أخذته إلى الحجاز.
hero.2=تستمر الأربعون في تقليد "الأربعينيات" الحديثية نفسه الذي تنتمي إليه [[NAW|الأربعون النووية]] و[[QUD|الأربعون القدسية]]، وهو تقليد يرجع إلى حديث يَعِد من يحفظ لأمته أربعين حديثاً من أمر دينها بمكانة بين العلماء يوم القيامة — حديث يصفه أكثر النقاد بأنه ضعيف في ذاته — وإلى أول مجموعة من هذا النوع، وقد ضاعت، وهي منسوبة إلى عبد الله بن المبارك (ت 797 م). وتختلف هذه المجموعة عن تلك الاثنتين في طبيعة ما تجمعه: فبدلاً من أحاديث مختارة بحسب الموضوع أو الرتبة من عموم الأدب الحديثي، يصفها ناشرها الإنجليزي بأنها أربعون حديثاً قال شاه ولي الله إنه سمعها مباشرة من شيخه في المدينة المنورة، كل واحد منها محفوظ مع سنده الذي أخذه به — سجلّ شخصي للرواية من عام الدراسة الذي غيّر، بحسب رواية ابنه، طريقته في التعليم والتأليف بعد عودته إلى دلهي.
hero.3=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-dehlawi في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] و[[NAS|سنن النسائي]] و[[IBM|سنن ابن ماجه]] و[[MAL|موطأ مالك]] و[[NAW|الأربعون النووية]] و[[QUD|الأربعون القدسية]] وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=العربية الكلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=شاه ولي الله الدهلوي (1703–1762)
fact.3.label=الاسم
fact.3.value=معروفة بالعربية باسم الأربعون؛ وصدرت طبعة إنجليزية حديثة بعنوان Forty Hadith of Shah Wali-Allah عن دار Turath Publishing سنة 2015، ترجمة Safaruk Zaman Chowdhury
fact.4.label=مكان وزمان التأليف
fact.4.value=بعد أن عاد شاه ولي الله إلى دلهي في 16 ديسمبر 1732، إثر حج أدّاه في 1730–1731 ونحو عام من دراسة الحديث في المدينة المنورة، أساساً على يد أبي طاهر الكردي (ويُكتب أيضاً الكوراني)
fact.5.label=المنهج
fact.5.value=بحسب ناشرها الإنجليزي، كل واحد من الأربعين حديثاً هو حديث قال شاه ولي الله إنه سمعه مباشرة من شيخه، محفوظاً مع سنده الذي أخذه به — سجلّ شخصي للرواية لا اختيار بحسب الموضوع أو الرتبة
fact.6.label=المكانة
fact.6.value=أشهر مجموعة "أربعينيات" حديثية من شبه القارة الهندية؛ تستمر في تقليد أول مَن جمع مثله، وقد ضاعت مجموعته، هو عبد الله بن المبارك (ت 797 م)، والذي أنتج أيضاً [[NAW|الأربعون النووية]] و[[QUD|الأربعون القدسية]]
fact.7.label=عدد الأحاديث
fact.7.value=40
fact.8.label=في هذه المجموعة
fact.8.value=كتاب واحد و40 حديثاً مرقَّماً
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-dehlawi في fawazahmed0/hadith-api، تظهر مرافقة للعربية؛ وتصف البيانات مترجمها بأنه مجهول، ولم يتأكد من جهة هذه المجموعة إن كانت هي ترجمة Turath Publishing وChowdhury أو ترجمة مستقلة
fact.10.label=الرخصة
fact.10.value=المتن العربي نص كلاسيكي ملك عام؛ ورخصة الترجمة الإنجليزية لا تزال قيد المراجعة
