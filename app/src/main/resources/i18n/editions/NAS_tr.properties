title=Sünen-i Nesâî — Bu Baskı Hakkında | Common Root
description=Sünen-i Nesâî: Ahmed bin Şuayb en-Nesâî'nin daha büyük eseri es-Sünenü'l-Kübrâ'dan kısaltarak oluşturduğu, İbn Hacer tarafından Altı Kitap'tan iki Sahih'ten sonra en az zayıf hadise sahip olan kitap olarak gösterilen hadis derlemesi.
heroHeading=Sünen-i Nesâî
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Ebu Abdurrahman Ahmed bin Şuayb bin Ali en-Nesâî, hicri 214–215 (miladi 829–830) yılı civarında, bugün Türkmenistan'da bulunan Horasan şehri Nesa'da doğdu. Yaklaşık on beş yaşında hadis aramak için seyahate başladı; önce Kuteybe bin Said'den ders aldı — yanında Bağlan'da bir yıldan fazla kaldı — ardından Irak, Hicaz, Suriye ve Mısır üzerinden seyahatine devam ederek İshak bin Râhveyh ve [[ABD|Sünen-i Ebu Davud]]'un derleyicisi Ebu Davud es-Sicistani gibi âlimlerden ders aldı. Mısır'a yerleşti, orada ders verdi ve Hâfızü'l-Hadis olarak tanındı; sonraki biyografi yazarları onun gerçekten Muhammed el-Buhari'den doğrudan ders alıp almadığı konusunda hemfikir değildir, çünkü el-Mizzi ikisinin hiçbir zaman karşılaşmadığını öne sürmüştür. Hayatının sonlarında Kahire'den Mekke'ye giderken Şam'da durdu; geleneksel anlatıma göre, Peygamber'in ashabının faziletleri üzerine verdiği bir ders, şehrin Ali karşıtı duygularının ortasında düşmanca bir kalabalığı kışkırttı; bundan kısa bir süre sonra, hicri 303 (miladi 915) yılında, orada aldığı yaralardan öldü. Gömüldüğü yer konusunda rivayetler farklıdır — bir rivayete göre Mekke'de Safa ile Merve arasında, diğerine göre ise Filistin'deki Remle'de.
hero.2=Kendisine atfedilen yaklaşık on beş eserden altısı hadisle ilgilidir. Bunların en büyüğü olan es-Sünenü'l-Kübrâ'yı daha sonra kendisi, es-Sünenü's-Suğrâ ("küçük Sünen") veya el-Müctebâ ("seçilmiş") olarak bilinen daha kısa bir seçkiye indirdi — bugün basitçe Sünen-i Nesâî adıyla kastedilen eser budur. Bu seçimi kimin tam olarak yaptığı ve kimin isteği üzerine yapıldığı, bu sayfa için başvurulan kaynaklarda kayıtlı değildir. Bu eserde en-Nesâî, [[ABD|Ebu Davud]] ve [[TIR|et-Tirmizî]]'nin yaptığı gibi hadisleri hukuki konuya göre düzenledi. Fakih İbn Hacer el-Askalani daha sonra bu eseri, iki Sahih'ten sonra Altı Kitap içinde en az zayıf (zaif) hadis ve güvenilmez ravi içeren ve hiç uydurma (mevdu) hadis barındırmayan kitap olarak öne çıkardı.
hero.3=Sünni gelenek Sünen-i Nesâî'yi [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]] ve [[TIR|Câmiu't-Tirmizî]] ile birlikte Altı Kitap (Kütüb-i Sitte) arasında sayar; altıncı kitap ise Sünen-i İbn Mâce ile diğer adaylar arasında tartışmalıdır. Dört Sünen derlemesi arasında tam olarak nerede durduğu tartışmalı olup çözülmemiştir: bazı kaynaklar onu, yalnızca iki Sahih'ten sonra, altısı arasında üçüncü en güvenilir eser olarak adlandırır; bu derlemenin kendi [[ABD|Sünen-i Ebu Davud]] ve [[TIR|Câmiu't-Tirmizî]] sayfaları ise Ebu Davud'un kitabını üçüncü sıraya koyan daha yaygın sıralamayı yansıtır. Kendisi için verilen hadis sayısı da benzer şekilde değişir: el-Müctebâ için yaygın olarak zikredilen bir rakama göre, tekrarlar dahil 5.758, bu derlemenin aldığı kaynak baskı ise 5.765 olarak numaralandırır — kaynaklar bu iki rakamı uzlaştırmaz.
hero.4=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-nasai baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]] ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

