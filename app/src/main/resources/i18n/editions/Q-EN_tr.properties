title=Kur'an — Pickthall — Bu Baskı Hakkında | Common Root
description=Muhammad Marmaduke Pickthall'ın 1930 çevirisi, anadili İngilizce olan bir Müslüman tarafından yapılan ilk İngilizce Kur'an çevirisi — Haydarabad Nizamı'na hizmet ederken ve Ezher âlimlerinin görüşleriyle hazırlanmıştır; bu derlemede ise Arapça metnin altında varsayılan olarak gösterilen İngilizce çeviridir.
heroHeading=Kur'an — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936), kutsal metin çevirmeni olmadan önce, döneminde H. G. Wells ve D. H. Lawrence tarafından takdir edilen İngiliz bir romancıydı. Kasım 1917'de, Notting Hill'deki Muslim Literary Society'de verdiği "Islam and Progress" başlıklı bir konuşmanın ardından İslam'a geçtiğini açıkladı ve aynı ay Woking Muslim Mission'da şehadet getirdi. On yıl sonra Haydarabad'da, Nizam'a hizmet ederken Chadarghat Lisesi'nin müdürüydü ve 1928'de, İslam'a girişinden beri yapmak istediği şeyi yapmak için oradan iki yıllık bir izin aldı: Kur'an'ı İngilizceye çevirmek.
hero.2=Bunu ne tek başına ne de aceleyle yaptı. 1929'da, Reşid Rıza'nın desteğinin kapılar açtığı Kahire'de üç ay geçirdi; bazılarının bu işe yardım etmenin görevlerine mal olabileceği konusunda uyarıldığı bir projeye Ezher âlimlerinin onayını almaya çalışıyordu — Ezher'in bir kısmı Kur'an'ı çevirmeyi başlı başına ağır bir mesele olarak görüyordu. Pickthall buna rağmen devam etti ve onlara danışmayı sürdürdü. 1930'da "The Meaning of the Glorious Koran: An Explanatory Translation" adıyla yayımladığı eser, bu ihtiyatı başlığında bile taşır: "İngilizce Kur'an" değil, anlamının bir açıklaması — çünkü kendi beyan ettiği görüşüne göre hiçbir çeviri Kur'an'ın kendisi olamazdı. Alfred A. Knopf ilk baskıyı New York'ta yayımladı; ardından Haydarabad hükümet matbaasından iki dilli bir baskı geldi.
hero.3=The Times Literary Supplement bunu "a great literary achievement" olarak adlandırdı ve genellikle anadili İngilizce olan bir Müslüman tarafından yapılan ilk İngilizce Kur'an çevirisi olarak tanımlanır — Sale ve Rodwell gibi daha önceki İngilizce çeviriler, Müslüman olmayan şarkiyatçıların eseriydi. Pickthall'ın çevirisi, o zamandan beri yaklaşık bir asır boyunca basılı ve kullanımda kalmıştır; sıradan okurların, sadece akademisyenlerin değil, gerçekten okuduğu az sayıdaki İngilizce çeviriden biridir.
hero.4=Bu derlemede, Osmanlı mushaf metninin altında varsayılan olarak gösterilen çeviri budur — Arapça her sütunun temeli olarak kalır ve bu İngilizce, onun yerini hiçbir zaman almadan, yanında bir açıklama olarak gösterilir. Bu rol için, edebi olduğu kadar sıradan bir nedenle de seçildi: mevcut çevirilerin bir taraması, açıkça kamuya açık olan yalnızca iki İngilizce çeviri buldu — bu çeviri ve Yusuf Ali'nin 1934 tarihli çevirisi — ve üçüncü bir dil için Sablukov'un 1878 tarihli Rusça çevirisi. Buradaki metin, herhangi bir tek baskıya değil, alquran.cloud üzerinden elde edilen çevirinin bir dijitalleştirmesidir; bu nedenle belirli bir baskının tıpkıbasımı olarak değil, Pickthall'ın ifadesi olarak okunmalıdır.

