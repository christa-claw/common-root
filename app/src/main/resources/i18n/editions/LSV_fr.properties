title=Literal Standard Version — À propos de cette édition | Common Root
description=La Literal Standard Version : la révision de 2020 par Covenant Press de la Literal Translation de Robert Young, datant du XIXe siècle, visant la traduction anglaise la plus constamment littérale de l'hébreu, de l'araméen et du grec que permet un anglais lisible.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=La Literal Standard Version se présente comme une révision majeure de la Literal Translation de Robert Young, la Bible anglaise du XIXe siècle d'une littéralité extrême, parue pour la première fois en 1862 et révisée par Young lui-même en 1887 puis en 1898. Covenant Press, la maison d'édition de la Covenant Christian Coalition, a entrepris cette nouvelle révision au début de 2018 avec l'objectif déclaré de préserver l'engagement de Young envers la littéralité mot à mot tout en modernisant son anglais et en corrigeant les endroits où l'érudition manuscrite et lexicale plus récente avait progressé. Le travail a été achevé et publié le 2 février 2020 ; le copyright américain a été déposé en janvier de cette même année, et les éditions numériques ont suivi en mai. Les traducteurs individuels ne sont pas nommés dans l'édition publiée ; Covenant Press et la Covenant Christian Coalition sont créditées comme organismes commanditaires.
hero.2=Pour l'Ancien Testament, la LSV suit le texte massorétique, avec une influence substantielle de la Septante et un recours occasionnel aux manuscrits de la mer Morte lorsque leurs leçons semblaient suffisamment claires pour être préférées. Pour le Nouveau Testament, elle suit le Textus Receptus et le texte majoritaire, n'adoptant les leçons de tradition alexandrine que dans des cas précis et déclarés, non comme règle générale. Les traducteurs ont posé trois principes directeurs : préserver le temps verbal de l'original partout où l'anglais le permet, rendre un mot original donné par le même mot anglais chaque fois que la cohérence le permet, et conserver l'ordre des mots de l'original sauf lorsque la lisibilité de l'anglais exige réellement un changement. Le nom divin de l'Ancien Testament est translittéré plutôt que rendu par un titre tel que « SEIGNEUR », conformément à la préférence générale de cette traduction pour montrer au lecteur les choix propres du texte original plutôt que de les lisser.
hero.3=Le lien avec ce corpus est d'ordre textuel plutôt que généalogique : le Nouveau Testament de la Literal Standard Version s'appuie sur le Textus Receptus et le texte majoritaire, la même base grecque que ce corpus conserve séparément et intégralement sous le nom de Textus Receptus — le texte à l'origine de la King James Version et, plus généralement, de la tradition de l'époque de la Réforme. Aucun échelon de lignée ne relie les deux éditions, la LSV étant présentée comme une révision de la Literal Translation de Young, et non du Textus Receptus lui-même ni d'aucun texte détenu ici ; un échelon ouvert sous un verset de la LSV descend donc directement au socle de la langue originale, marqué ≈. Elle est publiée sous licence Creative Commons Attribution-Partage dans les Mêmes Conditions 4.0 plutôt que versée au domaine public, ce qui la place, aux côtés de la New International Version et de la New American Standard Bible, parmi les éditions sous licence plutôt que librement copiables — mais selon des conditions nettement plus permissives que les deux autres. L'interface anglaise s'ouvre par défaut sur la New International Version ; cette édition est atteinte depuis sa propre fiche.

