fact.9.value=Sous licence plutôt que dans le domaine public, aux côtés de [[NIV|la New International Version]] et de [[NASB|la New American Standard Bible]] — sous licence plutôt que librement copiable, mais selon des conditions nettement plus permissives que ces deux éditions. Aucun parent n'est inscrit dans les échelons de lignée : elle est présentée comme une révision de la Literal Translation de Robert Young, qui n'est pas elle-même détenue dans ce corpus, si bien qu'un échelon sous un verset de la LSV descend directement au socle de la langue originale, marqué ≈. L'interface anglaise s'ouvre par défaut sur la New International Version ; cette édition est atteinte depuis sa propre fiche.
