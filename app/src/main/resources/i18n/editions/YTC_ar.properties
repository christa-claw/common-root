title=Yorumsuz Türkçe Çeviri — عن هذه الطبعة | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): كتاب مقدّس تركي حديث، ترجمه إسماعيل سرينكن عن World English Bible بالتعاون مع eBible.org، مرخّص بـ CC BY-ND 4.0 — النصّ التركي الذي تفتح عليه هذه المجموعة افتراضيًا.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — وتعني حرفيًا ترجمة تركية "غير مُعلَّقة" أو "من غير شرح" — هو كتاب مقدّس تركي حديث أنجزه إسماعيل سرينكن بالتعاون مع eBible.org، بحقوق نشر مؤرَّخة من 2023 إلى 2025. والاسم نفسه يعلن المنهج: نقل بسيط كلمة بكلمة، يستثني عمدًا الشروح التفسيرية والصياغة التأويلية، مفضّلًا الشفافية تجاه النصّ الأصلي على الصياغة الاصطلاحية الملسَّاة.
hero.2=وذلك النصّ الأصلي هو، بصراحة، الإنجليزية لا العبرية أو الآرامية أو اليونانية: فصفحة حقوق النشر الخاصة بالترجمة نفسها تصفها بأنّها منقولة عن World English Bible، وهذا يجعلها ترجمة ثانوية لا ترجمة منقولة مباشرة عن اللغات الأصلية، على خلاف أكثر الكتب المقدّسة الأخرى في هذه المجموعة. وقد بحث Common Root أولًا عن طبعة حرّة من الكتاب المقدّس التركي التاريخي لسنة 1941 (Kitabı Mukaddes)، الذي بلغ الآن من القِدم ما يكفي لدخوله الملكية العامة في تركيا، لكن لم يُعثر على مصدر رقمي قابل للاستخدام منه؛ فكانت Yorumsuz Türkçe Çeviri الكتاب المقدّس التركي الوحيد المتاح بترخيص حرّ. ونصّ هذه المجموعة مأخوذ من توزيع USFM الخاصّ بـ eBible.org، المفهرَس هناك باسم turytc.
hero.3=وتحمل خيارات نقلها طابعًا معاصرًا لا تقليديًا: فهي تنقل اسم الله الخاصّ بصيغة Yahve بدلًا من "RAB" أو "Yehova" التركيَّين المعتادَين، مستشهدةً بخروج 3:14-15، وتنقل اسم يسوع بصيغة Yeşua بدلًا من İsa التركي المألوف، فيما تترك بقية الأسماء الخاصّة على صورتها العادية. وتحمل القانون البروتستانتي المعتاد المكوَّن من 66 سفرًا، من غير أسفار قانونية ثانية.
hero.4=وهي الكتاب المقدّس التركي الوحيد في هذه المجموعة، فتفتح عليه الواجهة التركية افتراضيًا.

