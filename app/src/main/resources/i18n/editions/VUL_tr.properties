title=Latince Vulgata — Bu Baskı Hakkında | Common Root
description=Latince Vulgata: Hieronymus'un 382'de ısmarlanan ve 405 dolaylarında tamamlanan çevirisi; Kutsal Kitap'ı bin yıl boyunca Batı Avrupa'da taşıdı ve Gutenberg'in bastığı ilk kitap oldu.
heroHeading=Latince Vulgata
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=Dördüncü yüzyılın sonlarında Batı'da dolaşan Latince İncil metinleri nüshadan nüshaya birbirini tutmuyordu; Papa I. Damasus da kâtibi Hieronymus'tan bunları düzene sokmasını istedi. Hieronymus işe bir gözden geçirmeyle başladı. Sonunda buna yirmi yıldan fazlasını, çoğunu Beytlehem'de olmak üzere verdi ve kimsenin istemediği bir şey ortaya koydu.
hero.2=Farkı yaratan karar, Eski Ahit'i Kilise'nin öteden beri kullandığı Yunanca Septuaginta'dan değil, İbraniceden çevirmesiydi. Hieronymus bu ilkeye “hebraica veritas” — İbrani hakikati — adını verdi ve ilke tartışma yarattı: Augustinus ona, tanıdık okuyuşlar ayaklarının altında değişirken cemaatlerin ayaklanacağından kaygılandığını yazdı. Hieronymus yine de yaptı. Sonuç şudur: bir Latince Kutsal Kitap, hem de o, ilk Hristiyanların okuduğu Yunanca Kutsal Kitap'tan İbraniceye daha yakın durur.
hero.3=Bin yıl boyunca Batı Avrupa'nın Kutsal Kitabı oldu; bu, ondan önceki ya da sonraki hiçbir çevirinin erişemediği bir süredir. Wycliffe İngilizceye ondan çevirdi, Douay-Rheims çevirmenleri de onun üzerinden çalıştı — dolayısıyla bu derlemedeki Douay-Rheims onun doğrudan soyundan gelir ve o baskının basamakları buraya geri işaret eder. Ayrıca hareketli harflerle basılan ilk büyük kitaptı: Gutenberg'in 1455 dolaylarında Mainz'de dizdiği Kutsal Kitap bu metindi.

