title=Sunan Abi Dawud — Su questa edizione | Common Root
description=Sunan Abi Dawud: la raccolta di hadith che Abu Dawud al-Sijistani compilò per la sua rilevanza nel diritto islamico, tratta da circa 500.000 racconti che aveva esaminato e organizzata per argomento giuridico — la terza dei Sei Libri dell'islam sunnita.
heroHeading=Sunan Abi Dawud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani nacque verso l'anno 202 dell'Egira (817–818 d.C.) a Sijistan, una provincia del Khorasan che oggi si trova al confine tra Iran e Afghanistan. Giunse a Baghdad a diciotto anni, e viaggiò poi attraverso il Khorasan, l'Iraq, l'Hijaz, la Siria, l'Egitto e Nishapur in cerca di hadith, studiando con circa 300 studiosi, fra cui Ahmad ibn Hanbal. Si stabilì a Bassora, dove morì un venerdì del mese di shawwal dell'anno 275 dell'Egira (889 d.C.) a settantatré anni, e fu sepolto accanto al giurista Sufyan al-Thawri.
hero.2=Il suo interesse era specificamente giuridico: a differenza del Sahih al-Bukhari e del Sahih Muslim, che abbracciano in egual misura credo, storia e diritto, Abu Dawud costruì il suo Sunan attorno a hadith riguardanti il fiqh, organizzandolo in libri che percorrono gli argomenti di cui un giurista ha bisogno — purificazione, preghiera, zakat, digiuno, matrimonio, eredità, funzione di giudice e il resto. Secondo il suo discepolo Ibn Dasah, nel raccogliere il materiale esaminò circa 500.000 racconti di hadith. Stabilì inoltre un criterio diverso da quello di al-Bukhari e Muslim: mentre questi ammettevano solo hadith che giudicavano pienamente autentici, Abu Dawud incluse alcuni racconti mursal, debiti (da'if) e persino munkar quando nessun hadith più solido trattava un determinato punto giuridico, spiegando il proprio metodo in una lettera agli abitanti della Mecca e segnalando egli stesso le valutazioni più debili invece di lasciarle senza indicazione.
hero.3=La tradizione sunnita colloca il Sunan Abi Dawud al terzo posto tra i Sei Libri, dopo il Sahih al-Bukhari e il Sahih Muslim; dove esattamente esso, il Jami` at-Tirmidhi, il Sunan an-Nasa'i e il Sunan Ibn Majah si collochino l'uno rispetto all'altro tra i restanti quattro è da lungo tempo discusso senza essere stato risolto. Le cifre date per il libro non coincidono fra loro in un modo che nessuno sembra aver spiegato: la cifra di Ibn Dasah per ciò che Abu Dawud selezionò è di 4.800 hadith, mentre l'edizione moderna di riferimento — curata da Muhammad Muhyiddin Abd al-Hamid e stampata al Cairo nel 1935 — ne numera 5.274. La cifra propria di questo corpus, 43 libri e 5.274 hadith, corrisponde esattamente alla numerazione di quell'edizione del Cairo, il che la pone qui su un terreno più solido rispetto al Sahih al-Bukhari o al Sahih Muslim, dove la cifra di questo corpus non riproduce nessuna particolare tradizione a stampa.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-abudawud di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il Sahih al-Bukhari, il Sahih Muslim e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani (202–275 dell'Egira / 817–889 d.C.)
fact.3.label=Titolo
fact.3.value=noto semplicemente come Sunan Abi Dawud; a differenza del [[BUK|Sahih al-Bukhari]], non è registrato per esso un titolo completo distinto
fact.4.label=Compilato
fact.4.value=raccolto durante viaggi attraverso il Khorasan, l'Iraq, l'Hijaz, la Siria, l'Egitto e Nishapur; Abu Dawud si stabilì e morì a Bassora
fact.5.label=Metodo
fact.5.value=organizzato per argomento giuridico (fiqh) piuttosto che per trasmettitore o cronologia; include alcuni hadith debiti, mursal e munkar quando nessun racconto più solido tratta un punto giuridico, espressamente segnalati come tali
fact.6.label=Posizione
fact.6.value=il terzo dei Sei Libri dell'islam sunnita (Kutub al-Sitta), dopo il [[BUK|Sahih al-Bukhari]] e il [[MUS|Sahih Muslim]]; la sua posizione fra i restanti tre libri è discussa piuttosto che risolta
fact.7.label=Numero di hadith
fact.7.value=4.800 selezionati secondo il discepolo di Abu Dawud, Ibn Dasah, oppure 5.274 nell'edizione di riferimento di Muhammad Muhyiddin Abd al-Hamid, Il Cairo, 1935; le fonti non riconciliano queste due cifre
fact.8.label=In questo corpus
fact.8.value=43 libri e 5.274 hadith numerati — corrisponde esattamente alla numerazione dell'edizione del Cairo del 1935
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-abudawud di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione pubblicata discenda non è ancora stato stabilito da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
