title=Versión Biblia Libre — Об этом издании | Common Root
description=Versión Biblia Libre: испанская Библия от Free Bible Ministry, переведённая Джонатаном Галлахером и Шелли Барриос де Авила как испанская сестра английской Free Bible Version, и свободно лицензированная для любого использования.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — «свободная версия Библии» — испаноязычная сестра английской Free Bible Version, изданная тем же издателем, Free Bible Ministry, некоммерческой организацией со штаб-квартирой в Лорел, штат Мэриленд. Её Новый завет приписывается переводчикам Джонатану Галлахеру и Шелли Барриос де Авила, при участии Густаво Санабрии и Ребекки Пёлдаас в качестве соавторов, и несёт авторское право, датированное 2018–2020 годами, на имя Галлахера и Барриос де Авила. Как и её английская сестра, она существует для того, чтобы убрать страницу авторских прав как препятствие для использования: текст может быть скопирован, напечатан, выложен в сеть или переработан кем угодно, без гонораров и без необходимости спрашивать разрешения.
hero.2=Опубликованный предисловный материал ясно излагает основу Нового завета — переведённого непосредственно с греческого текста Нестле–Аланда, того критического текста, которым пользуются библейские общества, — но отдельно не называет исходный текст для Ветхого завета, хотя издание, которое держит это собрание, представляет собой полный, из шестидесяти шести книг, протестантский канон. Там, где материалы оставляют пробел, он остаётся и здесь, вместо того чтобы заполняться догадкой.
hero.3=В этой читалке это одно из пяти испанских изданий. Испанский интерфейс по-прежнему открывает по умолчанию [[RVR09|Reina-Valera 1909]], общедоступный текст совершенно иной, многовековой традиции; к этому же изданию переходят с его собственной карточки, наряду с [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] и [[NBLA|Nueva Biblia de las Américas]]. Оно не является пересмотром ни одного из них, так что основы для него не записано в ступенях родословия — ступень, открытая под одним из стихов Versión Biblia Libre, падает прямо на помеченный знаком ≈ пол языков оригинала. Её ближайший родственник в этом собрании вовсе не испанский: [[FBV|Free Bible Version]], английский перевод того же служения, под той же лицензией.

