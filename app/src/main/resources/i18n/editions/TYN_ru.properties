title=Новый Завет Тиндейла 1534 — Об этом издании | Common Root
description=Новый Завет Уильяма Тиндейла — первый английский перевод, сделанный с греческого, и первый напечатанный, в его собственной редакции 1534 года: текст, лежащий под Женевской Библией и Библией короля Иакова.
heroHeading=Новый Завет Тиндейла 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=В Англии времён Тиндейла английская Библия всё ещё была вне закона. Оксфордские конституции 1409 года запрещали переводить Писание на английский или читать такой перевод без одобрения епископа. Уильям Тиндейл просил этого одобрения у лондонского епископа Катберта Тонстолла в 1523 году, получил отказ и на следующий год покинул Англию, чтобы сделать работу без него. Перед ним лежал греческий Новый Завет Эразма, рядом — немецкий перевод Лютера и латинская Вульгата; так появился первый английский Новый Завет, переведённый с греческого, и первый, который вообще был напечатан. Первая попытка в Кёльне в 1525 году сорвалась из-за налёта на типографию; полная книга вышла из печатни Петера Шёффера в Вормсе в 1526 году и тайно ввозилась в Англию, где епископы скупали экземпляры и сжигали их.
hero.2=Здесь представлена собственная редакция Тиндейла, напечатанная в Антверпене в 1534 году: он заново прошёл греческий текст, исправил первую версию и добавил предисловия и примечания. Это было столько же выступлением в споре, сколько переводом. Томас Мор нападал на него за то, что он писал «собрание» (congregation) там, где Церковь говорила «церковь», «старейшина» (elder) там, где она говорила «священник», и «любовь» (love) там, где она говорила charity, — и все три выбора стоят в этом тексте: Матфея 16:18 звучит как «apon this rocke I wyll bylde my congregacion». Тиндейл ещё раз пересмотрел перевод в 1535 году, в мае того же года был арестован в Антверпене, а в 1536 году осуждён как еретик, задушен и сожжён в Вилворде под Брюсселем.
hero.3=В этой читалке его находишь в самом низу. Тиндейл записан ступенью под Женевской Библией и под Библией короля Иакова, а значит, ниже по лестнице, и под Revised Version, American Standard Version и World English Bible, которые стоят на Библии короля Иакова. Если спуститься от стиха Библии короля Иакова мимо Женевской Библии, формулировка часто почти не меняется — в этом и суть; в 1 Коринфянам 13:13 она меняется: у Тиндейла и в Женевской Библии love, а в Библии короля Иакова charity. Под Тиндейлом записанного предка нет. Он работал по греческому тексту Эразма, но Textus Receptus в этом собрании — издание 1550 года, на поколение позже его, а Лютер здесь — Библия 1545 года, а не Новый Завет 1522 года, которым он пользовался, поэтому лестница сразу опускается к основанию языков оригинала. Здесь только Новый Завет, в его собственном правописании: Евангелие от Матфея начинается словами «This is the boke of the generacion of Iesus Christ».

