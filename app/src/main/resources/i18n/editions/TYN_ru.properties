fact.9.label=Под этой ступенью
fact.9.value=Записанного предка нет — лестница сразу опускается к основанию языков оригинала, где [[TR|Textus Receptus]] стоит как свидетель греческого текста, а не как книга, которую Тиндейл держал в руках
