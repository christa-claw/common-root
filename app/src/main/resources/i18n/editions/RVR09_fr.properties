title=Reina Valera 1909 — À propos de cette édition | Common Root
description=Reina-Valera 1909 : la révision qui a porté au vingtième siècle l'espagnol de Casiodoro de Reina de 1569, tel que Cipriano de Valera l'avait révisé en 1602, et l'édition sur laquelle ce lecteur ouvre pour l'espagnol.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=La bible protestante espagnole est, à un degré peu commun, un seul livre. Casiodoro de Reina, qui avait quitté l'Espagne devant l'Inquisition, acheva sa traduction en exil et la publia à Bâle en 1569 : la Biblia del Oso, ainsi nommée d'après l'ours de sa page de titre. Cipriano de Valera, qui avait été dans le même monastère aux portes de Séville et avait fait la même évasion, la reprit pendant des années et publia le résultat à Amsterdam en 1602, la Biblia del Cántaro. Toute Reina-Valera depuis lors est la révision d'une révision de celle-là, et c'est pourquoi un nom à trait d'union commémore deux hommes qui n'ont jamais travaillé dans la même pièce.
hero.2=Voici la révision de 1909, préparée sous la Société biblique britannique et étrangère avec la Société biblique américaine, et couramment appelée Versión Antigua — l'ancienne version — par ceux qui ont continué de s'en servir. Elle succédait à une révision antérieure, celle de 1862, et elle est prudente sur ce que les révisions changent d'ordinaire : la lettre est avancée là où Reina et Valera étaient devenus difficiles à suivre, et laissée tranquille là où ils ne l'étaient pas. L'Ancien Testament repose sur l'hébreu massorétique et le Nouveau sur le Textus Receptus, comme celui de Reina.
hero.3=Elle a tenu le monde protestant hispanophone presque à elle seule une cinquantaine d'années, jusqu'à ce que la révision de 1960 la supplante, et elle n'a jamais tout à fait disparu. Elle est libre de droits, ce que la révision de 1960 n'est pas, de sorte que c'est cette Reina-Valera que l'on imprime, met en ligne et cite sans la permission de personne. C'est aussi pourquoi le texte entier peut figurer dans ce corpus et en être recopié.
hero.4=Dans ce lecteur, l'espagnol compte cinq bibles, et c'est sur celle-ci que l'interface ouvre. Il s'agit d'un choix retenu et non d'un hasard du catalogue : à la différence de l'arabe ou du chinois, où le lecteur ouvre sur la seule bible existant dans la langue, l'espagnol a des solutions de rechange et celle-ci a été prise parmi elles. Dans les échelons de filiation aucun texte source ne lui est enregistré, de sorte qu'un échelon ouvert sous un verset tombe droit sur le sol des langues originales marqué d'un ≈. Le sol vise ici de plus près que d'ordinaire, pour la même raison que sur la bible arabe : le grec qu'il fournit est le Textus Receptus, et c'est du Textus Receptus que le Nouveau Testament de Reina a été fait.

