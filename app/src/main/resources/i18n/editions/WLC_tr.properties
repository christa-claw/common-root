title=Leningrad Kodeksi — Bu baskı hakkında | Common Root
description=Leningrad Kodeksi: İbranice Kutsal Kitap'ın günümüze ulaşan en eski tam elyazması; MS 1008'de istinsah edildi ve modern Eski Antlaşma çevirilerinin çoğunun temel metni olmayı sürdürüyor.
heroHeading=Leningrad Kodeksi
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=Bu, İbranice Kutsal Kitap'ın günümüze ulaşan en eski tam elyazmasıdır. Eski Kahire'de çalışan Samuel ben Yakup adlı bir yazıcı tarafından istinsah edilmiş, yazıcı elyazmasının sonuna düştüğü kendi notunda işini MS 1008 yılına tarihlemiştir.
hero.2=Samuel ben Yakup bir metin icat etmiyordu; bir metni koruyordu. Masora konusunda dönemin en yetkin otoritesi sayılan Ben Aşer ailesinin geleneği içinde çalıştı. Masora, Yahudi bilginlerin İbranice Kutsal Kitap'ın okunuşunu sabitlemek ve metni bozulmaya karşı korumak için yüzyıllar boyunca inceltikleri ayrıntılı sesli harf, ezgi işareti ve kenar notu dizgesidir. Ben Aşer geleneğinden daha eski ve tartışmasız daha yetkeli bir elyazması da günümüze ulaşmıştır — Halep Kodeksi — ne var ki Tevrat bölümünün büyük kısmı 1947'de kayboldu. Leningrad Kodeksi tam da bu yüzden değerlidir: eksiksizdir ve bu geleneğin tam kaynağında duracak kadar eskidir.
hero.3=Adını sonradan bulunduğu şehirden alır: elyazması Batı biliminin gündemine girdiğinde Sankt Peterburg'un adı Leningrad'dı ve şehir 1991'de kendi adına döndükten sonra da bu ad elyazmasının üzerinde kaldı. Bugün, İbranice Kutsal Kitap'ın ölçünlü bilimsel basımı olan Biblia Hebraica Stuttgartensia'nın temelinde bu kodeks yatıyor — yani hemen her dildeki hemen her modern Eski Antlaşma çevirisi, okurları adını hiç duymamış olsa bile, on birinci yüzyılda yaşamış tek bir Kahireli yazıcının titiz istinsahına dayanıyor.

