title=King James Version — عن هذه الطبعة | Common Root
description=King James Version سنة 1611: سبعة وأربعون مترجماً في ستّ لجان، أُمروا بتنقيح Bishops' Bible لا بالبدء من جديد — وفي هذه المجموعة النصّ ذو الثمانين سِفراً الذي ما زال يحمل أسفار الأبوكريفا كما حملتها الطبعة الأولى.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=بدأت تنازلاً في اجتماع عُقد لأمر آخر. ففي مؤتمر هامبتون كورت سنة 1604، الذي دعا إليه جيمس الأول ليسمع شكاوى التطهيريين بشأن كتاب الصلاة، طُرح اقتراح ترجمة جديدة فتبنّاه الملك. وعُيّن سبعة وأربعون عالماً وقُسّموا ستّ لجان — اثنتان في وستمنستر، واثنتان في أكسفورد، واثنتان في كمبردج — لكلٍّ قسمها من الكتاب المقدّس ولائحة قواعد تعمل بها. وأوّل تلك القواعد هو الأهمّ عند القراءة: أن يتّبعوا Bishops' Bible سنة 1568 وألّا يغيّروها إلّا بقدر ما يقتضي الأصل. فقد طُلب هذا العمل تنقيحاً لا ترجمة جديدة، وهكذا يُقرأ. ونشر روبرت باركر، طابع الملك، الكتاب التامّ في لندن سنة 1611.
hero.2=وما لم تقله القواعد، وفعله المترجمون على كلّ حال، هو أن يمتدّوا مراراً إلى ما وراء Bishops' Bible. فالإنجليزية التي ورثوها صنعها آخرون — تِنْدِل قبل الجميع، وكتاب جنيف المقدّس الذي امتلكه جيل من القرّاء الإنجليز فعلاً وقرأه في بيوته. وهذه المجموعة تسجّل ذلك الدَّين بدل أن تتركه للمقدّمة: فأصل King James Version المسجّل هنا هو [[GNV|كتاب جنيف المقدّس]]، وتحته النصّ اليوناني المتلقّى والعبرية المسورية. افتح درجة نَسَب تحت آية من King James يطلع لك جنيف. والاثنان متقاربان آيةً بآية إلى حدّ أنّ السؤال الطريف يكفّ عن كونه: هل استُعمل جنيف؟ ويصير: أين اختارت لجان سنة 1611 أن تفارقه؟ — وهذا شيء صار في وسعك أن تنظر إليه بدل أن تأخذه تسليماً.
hero.3=وأحد الفروق بين هذه الـKing James وأكثر سواها يخصّ ما فيها. فالنصّ هنا ثمانون سِفراً و36,820 آية: العهدان القديم والجديد وأسفار الأبوكريفا الأربعة عشر مطبوعةً بينهما، كما طبعها مجلّد سنة 1611. وكادت كلّ King James تُباع اليوم أن تكون ستّة وستّين سِفراً. تحتفظ المجموعة بالشكل الأطول، وأثر ذلك بادٍ على امتداد السلسلة المسجّلة: [[GNV|كتاب جنيف المقدّس]] هنا ستّة وستّون سِفراً، وهذه ثمانون، و[[RV|الترجمة المنقَّحة]] فوقها ثمانون، و[[ASV|American Standard Version]] فوقها ستّة وستّون من جديد. وطبعُ الأبوكريفا من عدمه قرارٌ اتّخذته كلّ طبعة على حدة، ووضعها في عمود واحد يجعل النمط مقروءاً.
hero.4=وكن دقيقاً في معنى السنة المذكورة على البطاقة. فيها 1611، وهي تاريخ الترجمة — لا دعوى بأنّ هذا النصّ هو تلك الطبعة بعينها. والإنجليزية هنا محدَّثة الإملاء: يبدأ سفر التكوين «In the beginning God created the heaven and the earth»، حيث كانت ملازم سنة 1611 تقرأ «In the beginning God created the Heauen, and the Earth». فهذه إذاً King James كما وحّدها طابعون لاحقون، والطبعة المعيّنة التي انحدرت عنها غير مسجّلة — الثغرة الصادقة نفسها التي تتركها المجموعة لـ[[FB1776|Biblia 1776]]. ولا فرق في ذلك لقراءة اختيارات المترجمين؛ وفيه كلّ الفرق لاقتباس كتاب سنة 1611 بوصفه أثراً. ولاحظ أيضاً أنّ هذه ليست الطبعة التي تفتح بها الواجهة الإنجليزية: تلك [[NIV|New International Version]]، وKing James طبعة يُنتقل إليها.

