title=Berean Standard Bible — Om denna utgåva | Common Root
description=Berean Standard Bible: en modern engelsk översättning gjord av lagen bakom Bible Hub och Discovery Bible ur den masoretiska hebreiskan och ett grekiskt Nya testamente som de gav ut själva — och sedan skänkt bort till public domain.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible är en av de nyaste översättningarna i denna samling och en av de mest öppna om sitt eget hantverk. Den gjordes av lagen bakom Bible Hub och Discovery Bible under en rådgivande kommitté, och den kom först ut under ett annat namn: Berean Study Bible. Det vållade ständig förvirring, eftersom en study Bible i regel betyder en bibel utfylld med kommentarer och noter, vilket denna inte är. Översättningen döptes om; förkortningen blev kvar.
hero.2=De flesta översättningar utgår från ett grekiskt Nya testamente som någon annan har gett ut. Detta projekt byggde först sitt eget. Berean Greek Bible tar Nestle 1904 som grund — vald, säger utgivarna, för att den är den mest exakta kritiska text som redan är fri — och kollationerar den mot Nestle–Aland, SBL:s grekiska Nya testamente, Tischendorf, Westcott–Hort, den bysantinska texten och Textus Receptus, med noter där de går isär. Engelskan översattes ur den. Gamla testamentet kommer från den masoretiska hebreiskan, med Dödahavsrullarna, Septuaginta och andra tidiga vittnen rådfrågade där de rör en läsart. Samma arbete gavs sedan ut i skikt: en ord-för-ord-interlinjär, en styvt bokstavlig utgåva och denna läsbara, så att en läsare kan gå från grekiskan till engelskan ett steg i taget i stället för att ta översättarna på orden. Det ställer också Berean på andra sidan om en skiljelinje som detta korpus gör synlig: Genèvebibeln och King James Version härstammar här från Textus Receptus, denna gör det inte.
hero.3=Det sista projektet gjorde med texten var att ge bort den. Berean-texterna överläts till public domain i april 2023, och det är därför hela Bibeln kan ligga i detta korpus och kopieras ut ur det igen. Ställer man läsarens gränssnitt på engelska öppnar New International Version, som finns här på licens; Berean är den moderna engelska bredvid den som vem som helst får citera, trycka och sprida vidare. I stegpinnarna beter den sig som Biblia en Español Sencillo. Ingen förlaga är noterad för den, eftersom den är en ny översättning och inte en revision av något som korpuset rymmer, så en stegpinne öppnad under en Berean-vers faller rakt ned på det med ≈ markerade grundspråksgolvet i stället för till en äldre engelsk bibel. Katalogen lämnar också dess årtal tomt. Det är inget förbiseende — texten revideras fortfarande allteftersom rättelser kommer in, och årtalen här är valda snarare än gissade, så en utgåva utan en enda daterad tryckning får inget årtal.

