title=الترجمة الصينية الموحَّدة، نص 1919 — عن هذه الطبعة | Common Root
description=الترجمة الصينية الموحَّدة كما نُشرت أولًا سنة 1919، بأشكال الحروف القديمة وعلامات الترقيم الأصلية، منقولةً عن نسخة ويكي مصدر الصينية بحواشيها.
heroHeading=الترجمة الصينية الموحَّدة — نص 1919
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=هذه هي [[CUV|الترجمة الصينية الموحَّدة]] كما طُبعت سنة 1919: الكتاب المقدَّس بالمندرين الذي عمل عليه المرسلون والعلماء الصينيون تسعٍ وعشرين سنة، مدوَّنًا بأشكال تلك السنة. والترجمة الموحَّدة الأخرى في هذا القارئ هي النص كما يُقرأ اليوم، بعلامات ترقيم حديثة واختيارات حروف حديثة. وهذه تحتفظ بصفحة 1919.
hero.2=يمكن أن تلاحظ الفرق في الحروف. يستخدم نص 1919 أشكالًا تخلَّت عنها الطبعات اللاحقة — 爲 حيث تكتب الطبعات اليوم 為، وكذلك 愼 و册 و槪 — وهو مطبوع بالحروف الصينية التقليدية بكامله. وعلامات ترقيمه كما نُقلت من طبعة 1919، لا علامات الترقيم الحديثة للطبعات اللاحقة. وحيث طبع كتاب 1919 آياتٍ متتابعة كفقرة واحدة، تفعل هذه الطبعة ذلك أيضًا: يُحفظ ترقيم الآيات، ويقع النص عند الآية الأولى من السلسلة.
hero.3=النص مأخوذ من النسخة المنقولة التي أعدَّها ويكي مصدر الصيني، وهو طبعة شِن (神版)، التي يكون فيها اسم الإله 神 لا 上帝. حواشي كتاب 1919 محفوظة، وتظهر في هذا القارئ كملاحظات على الآيات التي تخصها.
hero.4=أُضيف هذا النص لكي يمكن طبع كتاب مقدَّس صيني من نص معروف تاريخه ومصدره. وطبعة 1919 خارجة عن حقوق النشر منذ زمن طويل. أما النصوص المنقَّطة التي تلتها، في 1988 وما بعدها، فمسألة مستقلة، ولذلك يُفصل بينهما.

