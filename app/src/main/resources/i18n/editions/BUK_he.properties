title=צחיח אל-בוכ'ארי — על מהדורה זו | Common Root
description=צחיח אל-בוכ'ארי: אוסף החדית׳ שהאסלאם הסוני מציב במעלה השנייה בסמכות, מיד אחרי הקוראן; מוחמד אל-בוכ'ארי לקטו מתוך כ-600,000 מסורות שבדק, וקיבל רק את אלו שנשאו שרשרת רצופה של מוסרים שנחשבו מהימנים.
heroHeading=צחיח אל-בוכ'ארי
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=מוחמד בן איסמאעיל אל-בוכ'ארי לקט את האוסף הזה ברובו בשני מסגדים — המסגד הקדוש במכה ומסגד הנביא במדינה — והשלימו בעיר מולדתו בוכרה, בסביבות שנת 232 להג'רה (846 לספירה); כעשרים השנים האחרונות של חייו הקדיש בעיקר להמשך עריכתו במהלך מסעותיו. שמו המלא, אלג'אמע אלמוסנד אלצחיח אלמוח'תצר מן אומור רסול אללה וסוננהי ואיאמהי, מקוצר בדרך כלל לצחיח אל-בוכ'ארי — '[האוסף] המהימן של אל-בוכ'ארי'. מסופר שאל-בוכ'ארי עצמו אמר שבחר אותו מתוך כ-600,000 מסורות חדית׳ שבדק, ולא קיבל מסורת אלא אם נשאה, לפי שיקול דעתו, שרשרת רצופה של מוסרים מהימנים עד מקורה המקורי.
hero.2=קנה המידה הזה הוא הסיבה למשקל שנושא הספר. צחיח אל-בוכ'ארי נחשב לראשון שבין ששת הספרים (כתב אלסתה) של האסלאם הסוני, ויחד עם צחיח מוסלם — מתחרהו הקרוב ביותר בשיטה ובמעמד — נקראים השניים 'אלצחיחיין', 'שני המהימנים'. רוב חכמי הסוני מציבים את אוסף אל-בוכ'ארי מעל כל ספר חדית׳ אחר, ובסמכות מיד אחרי הקוראן עצמו, אף שמיעוט מהחכמים טען בעבר לבכורתו של צחיח מוסלם במקום זאת. החומר מסודר לפי נושא ולא לפי המוסר או הכרונולוגיה (מה שהחכמים מכנים מוצנף), והוא מחולק לספרים (כֻּתֻּב) הנעים מטהרה פולחנית ותפילה אל מסחר ונישואין וחיי נביאים קודמים וסימני השעה האחרונה.
hero.3=מספר החדית׳ שהספר מכיל בפועל תלוי במסורת הדפוס שסופרת אותם. המספר המוזכר ביותר כיום, 7,563, מגיע מהמספור שהעורך מוחמד פואד עבד אלבאקי העניק לטקסט במאה העשרים, והוא סופר חדית׳ מחדש בכל פעם שהוא חוזר בפרק אחר; בהשמטת החזרות, מנה אבן חג'ר אלעסקלאני 2,602. חכמים אחרים הציעו עוד סכומים אחרים. המספר העצמי של האוסף הזה הוא מספר שלישי משלו: 98 ספרים ו-7,589 חדית׳ ממוספרים, שהוא פשוט צורת המהדורה הדיגיטלית שממנה נלקח, ולא טענה לשחזור מדויק של מספור מודפס מסוים כלשהו.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-bukhari של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו בתרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

