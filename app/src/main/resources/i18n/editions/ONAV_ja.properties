title=オープン・ニュー・アラビック・バージョン — この版について | Common Root
description=Biblicaによるオープン・ニュー・アラビック・バージョン。1988年、1997年、2012年の著作権を持つ現代アラビア語聖書で、クレジットを示したうえでの共有・改変・印刷を許すクリエイティブ・コモンズ・ライセンスのもとで公開されている。
heroHeading=Biblica のオープン・ニュー・アラビック・バージョン
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=これは現代アラビア語訳であり、[[SVD|スミス・ヴァンダイク訳]]とは別の本文であって、その写しではない。発行元はBiblica, Inc.であり、その著作権表示は1988年、1997年、2012年の三つの年を記す。本文自身の著作権ページには、その古い名称ケタブ・エル・ハヤト・マジャニが記されている。
hero.2=この読書環境でこれを特徴づけるのはそのライセンスである。Biblicaはこれをクリエイティブ・コモンズ 表示 - 継承 4.0ライセンスのもとで「オープン」な本文として公開した。Biblicaの名を示し、そこから作られたものを同じ条件のもとで共有するかぎり、誰でもこれを複製し、改変し、印刷することができる。Biblicaが求めるクレジット表記は次の通りである：「The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible」。現代の翻訳の大半はこのような形では提供されておらず、それがここに収められている理由である。
hero.3=このライセンスには知っておく価値のある一つの条件がある。改変されていない本文はBiblicaの名を記すことができる。並べ替えられた本文はそれができない——この版元の出来事順の配列と執筆順の配列は書物を異なる順序に置くため、私たちはこれを改変として扱い、したがってこれらは本文が並べ替えられたことを示し、Biblicaの名を題名として用いない。
hero.4=このファイルは完全に母音符号を付されている。その底本の一つの細部として、使徒の働き15章25節と26節が一つの節として印刷されているため、本コーパスもこの二つを第25節のもとにまとめ、そこに別の第26節を持たない。

