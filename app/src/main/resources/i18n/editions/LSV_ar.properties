title=Literal Standard Version — عن هذه الطبعة | Common Root
description=Literal Standard Version: مراجعة Covenant Press عام 2020 لترجمة Literal Translation لروبرت يونغ من القرن التاسع عشر، سعيًا إلى أكثر مقابل إنجليزي حرفي ومتّسق للعبرية والآرامية والیونانية تسمح به إنجليزية مقروءة.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=تقدّم Literal Standard Version نفسها كمراجعة كبرى لترجمة Literal Translation لروبرت يونغ، الترجمة الإنجليزية شديدة الحرفية من القرن التاسع عشر التي نُشرت أول مرة عام 1862 وراجعها يونغ نفسه عامي 1887 و1898. بدأت Covenant Press، الذراع النشرية لـCovenant Christian Coalition، هذه المراجعة الجديدة في أوائل 2018 بهدف معلَن هو الحفاظ على التزام يونغ بالحرفية كلمة بكلمة مع تحديث لغته الإنجليزية وتصحيح المواضع التي تقدّمت فيها الدراسات اللاحقة للمخطوطات والمعاجم. اكتمل العمل ونُشر في 2 فبراير 2020؛ سُجّل حق النشر الأمريكي في يناير من تلك السنة، وتبعته إصدارات الكتاب الإلكتروني في مايو من نفس السنة. لا يُذكر المترجمون الأفراد في الطبعة المنشورة؛ وتُذكر Covenant Press وCovenant Christian Coalition بصفتهما الجهتين الراعيتين.
hero.2=بالنسبة للعهد القديم، تتبع LSV النص الماسوري، مع تأثير كبير للسبعينية ورجوع عرضي إلى مخطوطات البحر الميت حين بدت قراءاتها واضحة بما يكفي لتفضيلها. وبالنسبة للعهد الجديد، تتبع النص المقبول (Textus Receptus) والنص الأغلبي، مع تبني قراءات التقليد الإسكندراني فقط في حالات محددة ومصرَّح بها، لا كسياسة عامة. وضع المترجمون ثلاثة مبادئ توجيهية: الحفاظ على زمن الفعل في الأصل متى سمحت الإنجليزية بذلك، وترجمة الكلمة الأصلية المعطاة بالكلمة الإنجليزية نفسها متى سمح الاتساق بذلك، والحفاظ على ترتيب كلمات الأصل إلا حين تتطلب مقروئية الإنجليزية تغييرًا حقيقيًا. يُنقَل الاسم الإلهي في العهد القديم بالحرفين لا بلقب مثل "الرب"، تماشيًا مع تفضيل هذه الترجمة العام لإظهار خيارات النص الأصلي نفسها للقارئ بدل تسويتها.
hero.3=الصلة بهذه المجموعة نصّية أكثر من كونها نسبية: يعتمد العهد الجديد في Literal Standard Version على النص المقبول والنص الأغلبي، وهما نفس الأساس اليوناني الذي تحتفظ به هذه المجموعة بشكل مستقل وكامل باسم النص المقبول — النص الذي تقوم عليه King James Version وتقليد عصر الإصلاح عمومًا. ولا تصل درجة نسب بين الطبعتين، لأن LSV تُقدَّم كمراجعة لترجمة يونغ لا كمراجعة للنص المقبول نفسه أو لأي نص آخر محفوظ هنا؛ فتنزل الدرجة تحت آية من LSV مباشرة إلى أرضية اللغة الأصلية الموسومة بـ≈. تُنشر بترخيص Creative Commons نسب المُصنَّف - الترخيص بالمثل 4.0 بدل أن تُسلَّم للملكية العامة، وهذا يضعها إلى جانب New International Version و New American Standard Bible كطبعة مرخَّصة لا حرّة التداول — لكن بشروط أكثر تيسيرًا بوضوح من كلتيهما. تفتح الواجهة الإنجليزية افتراضيًا على New International Version، وتُبلَغ هذه الطبعة من بطاقتها الخاصة.

