fact.9.label=في هذه المجموعة
fact.9.value=مرخَّصة لا حرّة التداول، إلى جانب [[NIV|New International Version]] و[[NASB|New American Standard Bible]] — مرخَّصة، لا حرّة التداول، لكن بشروط أكثر تيسيرًا بوضوح من كلتيهما. ولا أصل مسجَّل لها في درجات النسب: فهي تُقدَّم كمراجعة لترجمة Literal Translation لروبرت يونغ، التي لا تُحفظ هي نفسها في هذه المجموعة، فتنزل الدرجة تحت آية من LSV مباشرة إلى أرضية اللغة الأصلية الموسومة بـ≈. تفتح الواجهة الإنجليزية افتراضيًا على New International Version، وتُبلَغ هذه الطبعة من بطاقتها الخاصة.
