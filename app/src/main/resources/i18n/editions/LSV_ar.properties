fact.6.value=مكافأة صورية، تُقدَّم كمراجعة كبرى لترجمة Literal Translation لروبرت يونغ عام 1898 — ثلاثة مبادئ مصرَّح بها: الحفاظ على زمن فعل الأصل حيثما أمكن، وترجمة كلمة معطاة بالكلمة الإنجليزية نفسها حيثما سمح الاتساق، والحفاظ على ترتيب كلمات الأصل إلا حيث تتطلب مقروئية الإنجليزية خلاف ذلك؛ يُنقَل الاسم الإلهي في العهد القديم بالحرفين لا بلقب مثل "الرب"
