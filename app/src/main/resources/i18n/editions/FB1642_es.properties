title=Biblia 1642 — Acerca de esta edición | Common Root
description=Biblia 1642: la primera Biblia completa en finés, traducida en tres años por cuatro eruditos en Turku e impresa bajo el patrocinio de la reina Cristina de Suecia.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
thanks=Con agradecimiento a quienes enviaron correcciones a esta página.

# The narrative, one paragraph per key, in order.
hero.1=La primera Biblia completa en finés. Antes de ella existía el Nuevo Testamento de Mikael Agricola de 1548 y partes del Antiguo publicadas en la década de 1550; después de ella existía una Biblia entera en una lengua que apenas se había escrito. Cuatro eruditos hicieron el trabajo entre 1638 y 1641 — Eskil Petraeus, Martinus Stodius, Henricus Hoffman y Gregorius Matthaei — bajo Isaacus Rothovius, obispo de Turku, que sacó adelante el proyecto. Finlandia formaba parte de Suecia, y el volumen apareció en 1642 bajo el patrocinio de la reina Cristina. Se había intentado una generación antes: en 1602 se nombró una comisión de traducción bíblica, probablemente bajo Ericus Erici Sorolainen, obispo de Turku. Al parecer produjo borradores, pero nunca los reunió en una Biblia, y su paradero se ha perdido en buena parte, aunque se cree que aquel trabajo influyó en la traducción de 1642.
hero.2=Tradujeron del hebreo y del griego con el alemán de Lutero al lado. La Biblia sueca de Gustavo Vasa era el otro libro sobre la mesa; no está en este corpus, de modo que la cadena registra aquí el Lutero — y, junto a él, el finés de Agricola de 1548, el texto base que el comité revisaba. El efecto mayor de la Biblia de 1642 recayó sobre el finés mismo. Una lengua casi sin prosa escrita recibió, en un solo volumen, un vocabulario y una cadencia para todo, de la ley al lamento, y cada Biblia finesa posterior es una revisión o una sucesora suya y no un comienzo nuevo.
hero.3=En este lector, la de 1642 está entre dos peldaños fineses. Tres peldaños por debajo de la Kirkkoraamattu 1933/38, bajo la Biblia 1776, aparece esta edición, y debajo de ella dos padres lado a lado: el finés de Agricola de 1548, la base que el comité revisaba, y el alemán de Lutero de 1545, abierto sobre la mesa. Un peldaño más abajo, la cadena ha dejado el finés para siempre. El texto proviene del corpus VKS del Kotus de finés literario antiguo, y por eso la grafía que ve — «tulcon walkeus» — es la propia de la impresión de 1642 y no está modernizada.

