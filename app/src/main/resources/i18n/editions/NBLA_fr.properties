title=Nueva Biblia de las Américas — À propos de cette édition | Common Root
description=La Nueva Biblia de las Américas : la révision en espagnol latino-américain que The Lockman Foundation a faite de sa propre La Biblia de las Américas, portant la même méthode mot à mot dans l'espagnol courant parlé dans toutes les Amériques.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=La Nueva Biblia de las Américas est l'édition en espagnol latino-américain de The Lockman Foundation, construite sur sa précédente La Biblia de las Américas de 1986 — elle-même le fruit d'environ quinze années de travail de vingt-deux traducteurs et consultants, selon la même philosophie de traduction mot à mot portée plus tard en anglais sous le nom de New American Standard Bible. Plutôt qu'une traduction nouvelle à partir de l'hébreu et du grec, la NBLA est une révision de registre : un comité de douze membres de Lockman a retravaillé l'espagnol, plus proche du castillan, de La Biblia de las Américas, dans l'espagnol familier et moderne parlé à travers l'Amérique latine, remplaçant des formes telles que le "vosotros" de la deuxième personne du pluriel par le "ustedes" plus répandu, et allégeant des tournures comme le "y" formulaire et le "sucedió que" que le texte antérieur avait repris littéralement du style narratif hébreu. L'avis de permission de citation de The Lockman Foundation date lui-même le texte achevé de 2005.
hero.2=La base textuelle découle directement de La Biblia de las Américas : l'Ancien Testament repose sur la Biblia Hebraica de Rudolf Kittel, avec les manuscrits de la mer Morte consultés, et le Nouveau Testament, en général, sur la 27e édition du Novum Testamentum Graece d'Eberhard Nestle, avec attention portée à d'autres témoignages manuscrits lorsqu'ils influent sur une leçon particulière. Certains libraires et catalogues de logiciels bibliques regroupent aujourd'hui la Nueva Biblia de las Américas avec la révision de 2020 de la New American Standard Bible de la Fondation, commercialisant les deux comme une paire assortie pour les lecteurs anglophones et hispanophones de la même tradition littérale ; la traduction elle-même, cependant, ne porte dans les avis de la Fondation aucune date de copyright postérieure à 2005.
hero.3=L'interface espagnole s'ouvre ici par défaut sur la Reina Valera 1909, un texte du domaine public issu d'une tradition de traduction entièrement distincte et antérieur d'un siècle ; la Nueva Biblia de las Américas est atteinte à la place depuis sa propre fiche dans la grille de traductions. Elle partage peu d'histoire textuelle avec cette édition, mais beaucoup avec la New American Standard Bible — la même fondation, la même méthode d'équivalence formelle, et le même statut sous licence plutôt que dans le domaine public, permettant de citer jusqu'à 500 versets sans permission écrite, à condition qu'ils ne forment pas un livre complet ni plus d'un quart de l'ouvrage citant. Aucun parent n'est inscrit dans les échelons de lignée : La Biblia de las Américas, le texte qu'elle révise, n'est pas elle-même détenue dans ce corpus, si bien qu'un échelon sous un verset de la NBLA descend directement au socle de la langue originale, marqué ≈.

fact.1.label=Langue
fact.1.value=Espagnol
fact.2.label=Commandée
fact.2.value=The Lockman Foundation, de La Habra, en Californie — la même organisation à but non lucratif derrière la New American Standard Bible et sa propre prédécesseure, La Biblia de las Américas (1986)
fact.3.label=Réalisée par
fact.3.value=Un comité de révision de douze membres de Lockman, travaillant à partir de la traduction de La Biblia de las Américas, elle-même l'œuvre de vingt-deux traducteurs et consultants sur une quinzaine d'années
fact.4.label=Ancien Testament d'après
fact.4.value=La Biblia Hebraica de Rudolf Kittel, avec les manuscrits de la mer Morte consultés, héritée de la base textuelle même de La Biblia de las Américas
fact.5.label=Nouveau Testament d'après
fact.5.value=Le Novum Testamentum Graece d'Eberhard Nestle, en général la 27e édition, avec attention portée à d'autres témoignages manuscrits lorsqu'ils influent sur une leçon
fact.6.label=Genre de traduction
fact.6.value=Équivalence formelle, la même méthode mot à mot que La Biblia de las Américas et la New American Standard Bible — non pas une traduction nouvelle, mais une révision de registre vers l'espagnol familier et moderne parlé à travers l'Amérique latine, remplaçant des formes castillanes comme "vosotros" par "ustedes" et retravaillant des tournures comme le "y" formulaire et le "sucedió que" que le texte antérieur reprenait littéralement de l'hébreu
fact.7.label=Publiée
fact.7.value=Protégée par copyright en 2005 par The Lockman Foundation ; certains catalogues la regroupent depuis avec la révision de 2020 de la New American Standard Bible de la Fondation, mais 2005 reste l'année indiquée dans son propre avis de copyright
fact.8.label=Licence
fact.8.value=Sous licence, non dans le domaine public. Jusqu'à 500 versets peuvent être cités sous toute forme sans permission écrite, à condition qu'ils ne forment pas un livre biblique complet ni plus d'un quart de l'ouvrage citant, avec un avis de copyright mentionnant 2005 ; tout usage plus large nécessite la permission de The Lockman Foundation
fact.9.label=Dans ce corpus
fact.9.value=Sous licence et non dans le domaine public, comme [[NASB|la New American Standard Bible]] de la même fondation. L'interface espagnole s'ouvre par défaut sur [[RVR09|la Reina Valera 1909]], un texte du domaine public issu d'une tradition non apparentée et antérieur d'un siècle, cette édition étant atteinte depuis sa propre fiche. Aucun parent n'est inscrit dans les échelons de lignée : elle constitue une révision de registre de La Biblia de las Américas, qui n'est pas elle-même détenue dans ce corpus, si bien qu'un échelon sous un verset de la NBLA descend directement au socle de la langue originale, marqué ≈.
