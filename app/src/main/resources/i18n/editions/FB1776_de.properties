title=Biblia 1776 — Über diese Ausgabe | Common Root
description=Biblia 1776: eineinhalb Jahrhunderte lang die finnische Kirchenbibel, die erste für den Hausgebrauch gedruckte finnische Bibel und noch heute das Buch, das das finnische Wort „Biblia“ meint.
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=Mit Dank an alle, die Korrekturen zu dieser Seite geschickt haben.

# The narrative, one paragraph per key, in order.
hero.1=Finnlands dritte Bibel und diejenige, die blieb. Sie ist eine Revision und keine Neuübersetzung: die Linie führt über die Revision des Florinus von 1683–85 zurück zur Biblia von 1642, der ersten vollständigen finnischen Bibel. Die Durchsicht besorgte Anders (Antti) Lizelius, der schon 1758 eine eigene Bibelausgabe herausgegeben hatte. Was die Ausgabe von 1776 änderte, war die Rechtschreibung und damit die Reichweite. Sie war die erste finnische Bibel in modernisierter Orthographie und die erste, die für den Hausgebrauch gedruckt wurde und nicht nur für das Lesepult. Eine Bibel, die eine Familie besitzen kann, ist ein anderer Gegenstand als eine Bibel, die eine Gemeinde besitzt. Bei den Ausgaben dazwischen ging es nicht bloß um die Schreibung. Henrik Florinus, Propst von Paimio, der die von 1685 besorgte, konnte Hebräisch und Griechisch und besserte den Inhalt ebenso wie die Sprache — der Wortlaut bewegte sich weiter als die Orthographie — und den dazwischenliegenden Ausgaben wird zugeschrieben, auch aus den Ursprachen übersetzt und nicht nur 1642 geglättet zu haben. Wer 1642 mit 1776 vergleicht, blickt also über zwei Revisionen hinweg, nicht über einen Wechsel der Rechtschreibung.
hero.2=Sie blieb eineinhalb Jahrhunderte im kirchlichen Gebrauch, bis die Kirkkoraamattu 1933/38 sie ersetzte, und sie wurde weiter gelesen, nachdem sie aufgehört hatte amtlich zu sein. Zwei Erweckungsbewegungen innerhalb der Evangelisch-Lutherischen Kirche Finnlands, die Laestadianer und die rukoilevaiset, behielten sie und benutzen sie noch heute. Darum verweist das bloße Wort Biblia im Finnischen hierher und nicht auf eine ältere oder neuere Ausgabe, und darum heißt das Buch auch Vanha kirkkoraamattu, die alte Kirchenbibel.
hero.3=In diesem Leser ist sie die Mitte der finnischen Kette. Öffnen Sie eine Sprosse unter einem Vers der Kirkkoraamattu 1933/38, so erscheint diese Ausgabe; öffnen Sie eine unter dieser, so erscheint die Biblia von 1642. Die beiden Sprossen sind allerdings unterschiedlich zu lesen. Die Übersetzer von 1933/38 arbeiteten aus dem Hebräischen und dem Griechischen, die Sprosse darüber ist also Nachfolge innerhalb der Bibel einer Kirche und keine Ableitung. Die Sprosse darunter ist echte Abstammung: 1776 ist eine Revision von 1642, und die Wörter auf beiden Seiten dieses Schrittes sollen verglichen werden.
hero.4=Ein Vorbehalt zum Text auf dieser Website: Er ist nicht der Druck von 1776. Was hier steht, geht auf einen gemeinfreien digitalen Text zurück, dessen Schreibung von späterer Hand normalisiert wurde und dessen Editionsgeschichte nicht überliefert ist — von seinen 31 102 Versen enthält genau einer den Buchstaben w, während die Biblia von 1642 deren 26 862 hat, und w für v ist das deutlichste Kennzeichen der Orthographie, in der 1776 gedruckt wurde. 1776 modernisierte also die Schreibung von 1642, und dieser Text wurde seither ein zweites Mal modernisiert, was ihn weiter vom gedruckten Buch entfernt, als 1776 von 1642 entfernt war. Zwei Fachleute für das alte finnische Schrifttum fragten zuerst, welche Fassung dies sei, und die Frage war die richtige. Der Druck von 1776 selbst ist als Seitenbilder in der Sammlung der schwedischen Zeit der Finnischen Nationalbibliothek erhalten; an seiner Stelle einen treuen Text zu bieten, ist eine Arbeit, die wir gern täten.

