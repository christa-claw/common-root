title=I quaranta hadith di Shah Waliullah Dehlawi — Su questa edizione | Common Root
description=I quaranta hadith di Shah Waliullah Dehlawi: quaranta hadith che questo studioso di Delhi del XVIII secolo disse di aver sentito direttamente dal proprio maestro durante un anno di studio a Medina, conservati insieme alle rispettive catene di trasmissione — la raccolta più nota di questo tipo proveniente dal subcontinente indiano.
heroHeading=I quaranta hadith di Shah Waliullah Dehlawi
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Shah Waliullah Dehlawi — per intero Qutb al-Din Ahmad ibn 'Abd al-Rahim al-'Umari al-Dihlawi — nacque il 21 febbraio 1703 a Phulat, vicino a Muzaffarnagar, e crebbe a Delhi, dove suo padre, Shah Abdur Rahim, aveva fondato la Madrasah-i Rahimiyah. Si dice che memorizzò il Corano a sette anni e completò il curriculum consueto della sua epoca a quindici, succedendo al padre come capo della madrasa due anni dopo. Nel 1730–31 compì il hajj, poi passò circa un anno a Medina a studiare hadith — soprattutto sotto Abu Tahir al-Kurdi (reso anche al-Kurani), con ulteriori studi sotto Muhammad Wafdullah al-Maliki e lo sceicco Taj al-Din al-Qal'i — prima di tornare a Delhi il 16 dicembre 1732. Morì lì il 20 agosto 1762 (29 muharram 1176 AH) e fu sepolto accanto al padre. Tra le sue altre opere figurano Hujjat Allah al-Baligha, generalmente considerato il suo libro più importante, Al-Fawz al-Kabir, e Futuh al-Haramayn, il suo stesso racconto del viaggio che lo portò nel Hijaz.
hero.2=Al-Arba'in continua la stessa tradizione di "quaranta hadith" (arba'iniyyat) di [[NAW|I quaranta hadith di an-Nawawi]] e [[QUD|I quaranta hadith sacri]], una tradizione che risale a un hadith che promette a chi conserva quaranta hadith sulla religione un posto tra i dotti nel Giorno del Giudizio — un hadith che la maggior parte dei critici classifica essa stessa come da'if (debole) — e a una prima raccolta, oggi perduta, attribuita ad Abdullah ibn al-Mubarak (m. 797). Si differenzia da quelle due per ciò che raccoglie: invece di hadith scelti per tema o rango canonico dalla letteratura più ampia, il suo editore inglese la descrive come quaranta hadith che Shah Waliullah disse di aver sentito direttamente dal proprio maestro a Medina, ciascuno conservato insieme alla catena di trasmissione (sanad) con cui lo ricevette — un registro personale di trasmissione da quell'anno di studio che, secondo il racconto di suo figlio, cambiò il suo modo di insegnare e scrivere una volta tornato a Delhi.
hero.3=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-dehlawi di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]], il [[NAS|Sunan an-Nasa'i]], il [[IBM|Sunan Ibn Majah]], il [[MAL|Muwatta Malik]], [[NAW|I quaranta hadith di an-Nawawi]] e [[QUD|I quaranta hadith sacri]], e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=Arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Shah Waliullah Dehlawi (1703–1762)
fact.3.label=Titolo
fact.3.value=Noto in arabo come Al-Arba'in ("I quaranta"); un'edizione inglese moderna intitolata Forty Hadith of Shah Wali-Allah fu pubblicata da Turath Publishing nel 2015, tradotta da Safaruk Zaman Chowdhury
fact.4.label=Compilato
fact.4.value=Dopo che Shah Waliullah tornò a Delhi il 16 dicembre 1732, in seguito a un hajj compiuto nel 1730–31 e a circa un anno di studio dell'hadith a Medina, soprattutto sotto Abu Tahir al-Kurdi (reso anche al-Kurani)
fact.5.label=Metodo
fact.5.value=Secondo il suo editore inglese, ciascuno dei quaranta hadith è uno che Shah Waliullah disse di aver sentito direttamente dal proprio maestro, conservato insieme alla catena di trasmissione (sanad) con cui lo ricevette — un registro personale di trasmissione piuttosto che una selezione fatta per tema o rango canonico
fact.6.label=Posizione
fact.6.value=La raccolta di "quaranta hadith" (arba'iniyyat) più nota del subcontinente indiano; prosegue un genere il cui primo esempio noto, oggi perduto, è attribuito ad Abdullah ibn al-Mubarak (m. 797) e che ha prodotto anche [[NAW|I quaranta hadith di an-Nawawi]] e [[QUD|I quaranta hadith sacri]]
fact.7.label=Numero di hadith
fact.7.value=40
fact.8.label=In questo corpus
fact.8.value=1 libro e 40 hadith numerati
fact.9.label=Traduzione inglese
fact.9.value=Tratta dall'edizione eng-dehlawi di fawazahmed0/hadith-api, mostrata in accompagnamento all'arabo; il set di dati indica un traduttore ignoto, e non è confermato da parte di questo corpus se si tratti della traduzione di Turath Publishing/Chowdhury o di una indipendente
fact.10.label=Licenza
fact.10.value=Il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
