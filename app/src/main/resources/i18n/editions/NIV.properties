fact.1.label=Language
fact.1.value=English
fact.2.label=Commissioned
fact.2.value=By a joint committee of the Christian Reformed Church and the National Association of Evangelicals, who convened a conference at Trinity Christian College in Palos Heights, Illinois, in August 1965
fact.3.label=Made by
fact.3.value=The Committee on Bible Translation — fifteen scholars at the outset, drawing eventually on more than a hundred scholars from several English-speaking countries and many denominations, over roughly a decade
fact.4.label=Old Testament from
fact.4.value=The Masoretic Hebrew text, with the Dead Sea Scrolls, the Septuagint and other early witnesses consulted
fact.5.label=New Testament from
fact.5.value=The eclectic critical Greek text represented in the United Bible Societies and Nestle-Aland editions — not [[TR|the Textus Receptus]] that stands beneath [[GNV|the Geneva Bible]] and [[KJV|the King James Version]] here
fact.6.label=Kind of translation
fact.6.value=Balances the accuracy of a literal rendering with natural, idiomatic English rather than holding to either end — usually classed as dynamic equivalence; a fresh translation from the original languages, not a revision of the King James tradition
fact.7.label=Published
fact.7.value=The New Testament in 1973; the complete Bible on 27 October 1978; a light revision in 1984; the current, more thoroughly revised text in 2011, which retired both the 1984 printing and the 2005 Today's New International Version
fact.8.label=Publisher
fact.8.value=Biblica, Inc., which holds the copyright; Zondervan in the United States, Hodder & Stoughton in the United Kingdom
fact.9.label=Licence
fact.9.value=Licensed, not public domain. Up to 500 verses may be quoted without written permission, provided they do not form a complete Bible book or more than 25% of the work, with a copyright acknowledgment; anything beyond that needs Biblica's permission
fact.10.label=In this corpus
fact.10.value=The Bible an English interface opens on by default — [[KJV|the King James Version]] and [[RV|the Revised Version]] both note here that they are not it. No parent is recorded in the lineage rungs: a rung beneath an NIV verse goes straight to the original-language floor marked ≈, as it does for [[BSB|the Berean Standard Bible]] — except that floor's Greek witness is [[TR|the Textus Receptus]], which is not the text this translation's New Testament was actually made from. Licensed rather than public domain, like the New American Standard Bible 2020, it stands apart from public-domain neighbours such as [[KJV|the King James Version]], [[RV|the Revised Version]] and [[WEB|the World English Bible]]
