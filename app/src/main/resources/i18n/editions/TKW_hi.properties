title=टेक्स्टबीबल 1906 — इस संस्करण के बारे में | Common Root
description=काउत्श और वाइत्सज़ेकर की टेक्स्टबीबल (Textbibel): विद्वानों की एक जर्मन बाइबिल, इब्रानी और यूनानी से नए सिरे से अनूदित, पहली बार 1899 में ट्यूबिंगन में एक खंड में प्रकाशित; यहाँ का पाठ 1906 का दिनांकित है।
heroHeading=टेक्स्टबीबल 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=दो प्राध्यापक, दो नियम। कार्ल वाइत्सज़ेकर (1822–1899) ट्यूबिंगन में कलीसिया के इतिहासकार थे, जहाँ 1861 में उन्होंने फ़र्डिनांड क्रिस्टियान बाउर की पीठ सँभाली और 1889 से विश्वविद्यालय के कुलाधिपति रहे। नए नियम का उनका अनुवाद पहली बार 1875 में छपा और उनके जीवनकाल में उसके नौ संस्करण निकले; अंतिम संस्करण उन्होंने मृत्युशय्या पर तैयार किया। एमिल काउत्श (1841–1910) पुराने नियम के विद्वान थे, जिन्होंने 1888 में हाले में बसने से पहले लाइपज़िग, बाज़ेल और ट्यूबिंगन में पढ़ाया; विशेषज्ञ सहकर्मियों के एक समूह के साथ अनूदित उनका पुराना नियम 1894 में पूरा प्रकाशित हुआ।
hero.2=1899 में, जिस वर्ष वाइत्सज़ेकर का निधन हुआ, दोनों को एक खंड में जोड़ दिया गया — Textbibel des Alten und Neuen Testaments, जिसे ट्यूबिंगन में J.C.B. Mohr (Paul Siebeck) ने प्रकाशित किया। नाम बताता है कि यह क्या है: केवल पाठ, उन पाठकों के लिए जो अपने समय की जर्मन में जानना चाहते थे कि इब्रानी और यूनानी क्या कहती हैं। इसका उद्देश्य कभी लूथर की जगह लेना नहीं था। वाइत्सज़ेकर ने जान-बूझकर लूथर की भाषा से दूरी रखी और इसके बजाय वह प्रभाव पहुँचाने का प्रयास किया जो मूल ने अपने पहले पाठकों पर डाला था; उनके जीवनीकार को यह असंभाव्य लगा कि यह कभी जनसाधारण की पुस्तक बनेगी, और यह बनी भी नहीं। 1910 के दशक तक इसका पुनर्मुद्रण होता रहा। यहाँ का डिजिटल पाठ 1906 का दिनांकित है; वह मुद्रण कौन-सा संस्करण था, यह इस परियोजना ने स्थापित नहीं किया है।
hero.3=यह अपने समय की विद्वत्ता जैसी पढ़ी जाती है। पुराने नियम में ईश्वर का नाम “Jahwe” है — भजन 23 में “Jahwe ist mein Hirte” — हज़ारों बार, जहाँ लूथर “der Herr” रखते हैं। यशायाह 7:14 में “ein junges Weib” है, अर्थात एक युवती। नए नियम में मत्ती 6:13 की प्रभु की प्रार्थना स्तुति-वचन के बिना समाप्त होती है, और 1 यूहन्ना 5:7 में स्वर्गीय गवाह नहीं हैं। पुराना नियम इब्रानी अध्याय और पद विभाजन रखता है: भजनों के शीर्षक पद-संख्या में गिने जाते हैं, इसलिए भजन 51 में 21 पद हैं, और मलाकी में चार नहीं, तीन अध्याय हैं। वर्तनी तिथि के संकेत से पुरानी है — यूहन्ना 8:1 में यीशु जैतून पहाड़ पर “gieng”।
hero.4=इस पाठक में यह चार जर्मन बाइबिलों में से एक है, एल्बरफ़ेल्डर और लूथर के 1545 और 1912 के पाठों के साथ। जर्मन अंतरफलक इस पर नहीं खुलता: जर्मन के लिए कोई चुनी हुई डिफ़ॉल्ट नहीं है, इसलिए पाठक सूची की पहली जर्मन बाइबिल लेता है, और वह एल्बरफ़ेल्डर है। वंश-पायदानों में इसके लिए कोई मूल अभिलिखित नहीं है, जो मूल ग्रंथों से किए गए अनुवाद के अनुरूप है: किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषा तल पर पहुँचता है — पुराने नियम के लिए वेस्टमिंस्टर लेनिनग्राद कोडेक्स, और नए के लिए टेक्स्टस रिसेप्टस, एक ऐसी यूनानी जिसका यह अनुवाद अनुसरण नहीं करता, जैसा 1 यूहन्ना 5:7 दिखाता है।

