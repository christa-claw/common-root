title=الكتاب المقدس العبري — عن هذه الطبعة | Common Root
description=الكتاب المقدس كله بالعبرية: العهد القديم الماسوري مع العهد الجديد الذي وضعه فرانتس دليتش سنة 1877، معادًا إلى عبرية المشناة لقرّاء أرادوا الكتاب كاملًا بلسان واحد.
heroHeading=الكتاب المقدس العبري — العهد القديم الماسوري والعهد الجديد لدليتش
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=كتاب مقدس عبري من دفّته إلى دفّته شيء أغرب مما يبدو في السمع، لأنّ نصفه لم يُكتب بالعبرية قط. فالعهد القديم عبري وكان كذلك دائمًا. وأما العهد الجديد فبلغنا باليونانية. فطبعة كهذه إذن نوعان مختلفان من النص خيط أحدهما إلى الآخر: أصل، وترجمة صُنعت في الاتجاه المعاكس للمعتاد — من اليونانية رجوعًا إلى اللسان الذي كان كاتبوها يتكلمونه في الأغلب.
hero.2=والنصف الخاص بالعهد الجديد هو عمل فرانتس دليتش، عالم لايبتسيغ بالعبرية وبالأدب الحاخامي، كلّفته به جمعية الكتاب المقدس البريطانية والأجنبية سنة 1873 وفرغ منه سنة 1877. ولم يترجم إلى عبرية قرنه هو. بل كتب بعبرية المشناة وحقبة الهيكل الثاني، محتجًا بأنّ نصًّا من القرن الأول ينبغي أن يكون له رنين ذلك القرن — حتى إنّ الحاصل يُقرأ لا كنقل إلى العبرية بقدر ما يُقرأ كمحاولة لاستعادة ما عساها كانت عليه الجمل قبل أن تصير يونانية. وهو إلى اليوم العهد الجديد العبري الذي يُرجع إليه أكثر من غيره.
hero.3=وأمّا أيّ يونانية عمل عنها فقد قُضي فيها عنه في بعض الأمر. فقد بدأ من المخطوط السينائي، مخطوط القرن الرابع الذي عُثر عليه قبل عقود قليلة، فأبت جمعية الكتاب المقدس — وسياستها أن تنشر عن النص المستلم — أن تمضي في تمويل ترجمة مبنية عليه. فعاد دليتش إلى النص المستلم وأشار إلى القراءات السينائية ذات الشأن بدل أن يأخذ بها. ثم ظلّ النص متحركًا ثلاث عشرة سنة وعشر طبعات، تولّى آخرها في المطبعة غوستاف دالمان سنة 1890، وهي السنة التي مات فيها دليتش. وهذا أحد أسباب ترك الفهرس سنةَ هذه الطبعة فارغة: فالنصفان لا يشتركان في تاريخ، والنصف الذي له تواريخ له عشرة منها.
hero.4=وفي هذا القارئ هي الطبعة التي تفتح عليها الواجهة العبرية — اختيار منتقى لا مصادفة أبجدية — واختيار العبرية يقلب الواجهة كلها من اليمين إلى اليسار حولها. وهي تقف إلى جانب مخطوطة لينينغراد من غير أن تزاحمها: فالمخطوطة هي التناخ العلمي، مشكولة تمام الشكل وموسومة بعلامات الترتيل، وتقف حيث يقف العهد القديم؛ أما هذه فنصّ ساكن بسيط يمضي حتى سفر الرؤيا. ولم تُسجَّل لها في درجات النسب أيّ أصل، فدرجة تُفتح تحت آية تهبط رأسًا إلى أرضية اللغات الأصلية، ≈ WLC و≈ TR. وفي سائر هذه المجموعة تكون تلك الأرضية تقريبًا، وذلك ما تنبّه إليه علامة ≈. أما ههنا فتكاد لا تكون كذلك: فالعهد القديم على الشاشة هو النص الماسوري نفسه، والنص المستلم هو ما كان بين يدَي دليتش حقًّا.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=العبرية — نصّ ساكن بلا علامات تشكيل ولا علامات ترتيل
fact.2.label=ما هذا
fact.2.value=نصّان مجلّدان ككتاب مقدس واحد: العهد القديم الماسوري المتوارث، وعهد جديد عبري تُرجم عن اليونانية في القرن التاسع عشر
fact.3.label=العهد الجديد بقلم
fact.3.value=فرانتس دليتش (1813–1890)، عالم العبرية في لايبتسيغ
fact.4.label=كلّفت به
fact.4.value=جمعية الكتاب المقدس البريطانية والأجنبية سنة 1873؛ وفرغت الترجمة سنة 1877
fact.5.label=العهد القديم عن
fact.5.value=العبرية الماسورية نفسها — لا ترجمة، وهو ما يجعل هذه الطبعة الوحيدة ههنا التي عهدها القديم قائم أصلًا بلغته الأصلية، كما هي [[WLC|مخطوط لينينغراد ويستمنستر]]
fact.6.label=العهد الجديد عن
fact.6.value=يونانية [[TR|النص المستلم]]. وقد بدأ دليتش من المخطوط السينائي بدلًا منه، لكنّ الجمعية كانت تنشر عن النص المستلم ولم تشأ تمويل هذا الخروج
fact.7.label=المستوى اللغوي
fact.7.value=ليست العبرية الحديثة. كتب دليتش بعبرية المشناة وحقبة الهيكل الثاني، ساعيًا أن يردّ إلى اليونانية الأسلوب الذي كان أهلها ليستعملوه
fact.8.label=رُوجعت حتى
fact.8.value=سنة 1890، وقد تولّى الطبعة الأخيرة في المطبعة غوستاف دالمان
fact.9.label=لا تُخلط بـ
fact.9.value=العهد الجديد بالعبرية الحديثة الصادر عن جمعية الكتاب المقدس في إسرائيل، وهو ترجمة أخرى من القرن العشرين ما زالت في حماية حقوق النشر
fact.10.label=السنة في الفهرس
fact.10.value=متروكة فارغة — فالنصفان لا يشتركان في سنة، والعهد الجديد وحده رُوجع على مدى ثلاث عشرة سنة وعشر طبعات
fact.11.label=في هذه المجموعة
fact.11.value=الأسفار الستة والستون كلها، وهي الطبعة المنتقاة الافتراضية للواجهة العبرية — يفتح القارئ عليها لا على [[WLC|مخطوط لينينغراد ويستمنستر]]، لأنها تمضي الطريق كله عبر العهد الجديد
