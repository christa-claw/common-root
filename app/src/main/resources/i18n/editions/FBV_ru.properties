title=Free Bible Version — Об этом издании | Common Root
description=Free Bible Version: современная английская Библия, переведённая с еврейского и с греческого Нестле–Аланда Джонатаном Галлахером и выпущенная под лицензией «с сохранением условий», так что перепечатать её вправе любой.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Этот перевод существует из-за страницы с копирайтом. Она есть почти в каждой современной английской Библии, и говорится на ней обыкновенно вот что: несколько сотен стихов можно цитировать не спрашивая, на целую книгу нужно письменное разрешение, а издать текст целиком — значит платить отчисления. Для приходского сайта или для звукозаписи на этом дело и кончается. Free Bible Version была сделана затем, чтобы стать изданием, перед которым не стоит ничего.
hero.2=Это труд Джонатана Галлахера, доктора богословия из Сент-Эндрюса, а выпускает его некоммерческая организация Free Bible Ministry. Новый Завет идёт с греческого Нестле–Аланда — того критического текста, которым пользуются библейские общества, — Ветхий с еврейского. Способ работы, который описывает сам проект, стоит назвать, потому что он не обычный: перевод делается с подлинника с одними только словарями, и лишь потом сверяется с существующими изданиями — как проверка на совпадения и ошибки, а не как источник. Это не пересмотр более старой английской Библии и не свод более новых. Заявленная цель — современный английский без сленга и модных оборотов, и переводить в сторону положений какой-либо отдельной религиозной общины издание отказывается.
hero.3=Лицензия и есть суть дела. Это Creative Commons «С указанием авторства — На тех же условиях 4.0»: копируйте, печатайте, выкладывайте на сайт, перерабатывайте — лишь бы издание было названо, изменения помечены, а всё построенное на нём выходило на тех же условиях. Это иная сделка, чем общественное достояние: свобода передаётся дальше, а не отдаётся насовсем. Та же лицензия и у испанской Versión Biblia Libre в этом собрании, которая происходит от того же служения.
hero.4=Для читателя отсюда следуют две вещи. Каталог оставляет её год пустым, потому что проект выпускает пересмотры по мере того, как их делает; ни к какому датированному тиражу это собрание не привязано, а выдумать его было бы хуже пустоты. И ступень, открытая под стихом Free Bible Version, показывает ≈ TR, Textus Receptus, помеченный как свидетель, а не как основа. Не с него сделан этот перевод. Это то, что собрание сейчас способно предложить в качестве греческого — критического издания здесь пока нет, — и та же замена появляется по той же причине под New International Version, New American Standard Bible и Berean Standard Bible.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=английский — современный американский
fact.2.label=Переводчик
fact.2.value=Джонатан Галлахер, чья докторская степень по богословию получена в Университете Сент-Эндрюса
fact.3.label=Издано
fact.3.value=Free Bible Ministry, некоммерческой организацией, которая выпускает и испанскую [[VBL|Versión Biblia Libre]], имеющуюся в этом собрании
fact.4.label=Переведено с
fact.4.value=еврейского и греческого Нового Завета Нестле–Аланда — того критического текста, которым пользуются библейские общества
fact.5.label=Способ работы
fact.5.value=переведено с подлинника с одной лишь словарной помощью, а затем сверено с существующими изданиями как проверка — не свод из них и не пересмотр более старой английской Библии
fact.6.label=Слог
fact.6.value=современный английский без сленга и мимолётной разговорности, без попытки передать положения какой-либо отдельной религиозной общины
fact.7.label=Лицензия
fact.7.value=Creative Commons «С указанием авторства — На тех же условиях 4.0» — свободно копировать, печатать и перерабатывать при условии, что издание названо, изменения помечены, а производное несёт ту же лицензию
fact.8.label=Год в каталоге
fact.8.value=оставлен пустым, а не угадан — проект правит текст и переиздаёт его по ходу дела, так что ни один тираж не является изданием
fact.9.label=Под ступенью
fact.9.value=≈ TR, свидетель греческого, а не основа этого перевода; критического греческого издания в собрании пока нет, поэтому та же замена служит [[NIV|NIV]], [[NASB|NASB]] и [[BSB|BSB]]
fact.10.label=В этом собрании
fact.10.value=все 66 книг. Английский открывается на лицензионной [[NIV|New International Version]], так что это издание стоит рядом с [[BSB|Berean Standard Bible]] и [[WEB|World English Bible]] как тот английский, который читатель вправе унести с собой
