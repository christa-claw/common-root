title=New International Version — Om denna utgåva | Common Root
description=New International Version: den engelska bibel som denna läsare öppnar på som standard, översatt direkt från originalspråken av Committee on Bible Translation och först färdigställd 1978 — här i sin text från 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Det började med ett samfunds otillfredsställelse. År 1955 drev affärsmannen Howard Long, tillsammans med pastor Peter De Jong, på Christian Reformed Church att ta fram en bibel på samtida engelska, och 1957 tillsatte samfundet en kommitté för att utreda frågan. National Association of Evangelicals hade samma år startat ett liknande eget projekt. De två sammanslöt sina krafter: en gemensam kommitté skickade 1964 ut inbjudningar till en översättningskonferens, som samlades i augusti 1965 vid Trinity Christian College i Palos Heights, Illinois, och beslöt att bilda "en fortlöpande kommitté på femton" för att driva arbetet vidare. Denna stående kommitté blev Committee on Bible Translation. År 1967 tog New York Bible Society — numera omdöpt till Biblica — över som huvudman och anställde de forskare som skulle utföra översättningen.
hero.2=Ingenting här härstammar från en äldre engelsk bibel. Medan King James Version, Revised Version, American Standard Version och World English Bible i detta korpus bildar en enda kedja av revideringar, översattes New International Version på nytt direkt från hebreiska, arameiska och grekiska: Gamla testamentet från den masoretiska hebreiska texten, med Dödahavsrullarna, Septuaginta och andra tidiga vittnen beaktade; Nya testamentet från den eklektiska kritiska grekiska text som representeras av United Bible Societies- och Nestle-Aland-utgåvorna — inte den Textus Receptus som ligger under Genèvebibeln och King James här. Kommittén på femton växte, under ungefär ett decennium, till ett projekt som drog nytta av mer än hundra forskare från flera engelsktalande länder och många samfund. Deras uttalade mål var en översättning som höll fast vid grundtextens exakthet utan att läsas som en ord-för-ord-avskrift av den — en balans som vanligen klassas som dynamisk motsvarighet, mellan en strikt ordagrann återgivning och en lös omskrivning.
hero.3=Nya testamentet kom först, 1973; hela bibeln följde den 27 oktober 1978; en lätt revidering kom 1984. Texten förändrades mer genomgripande 2011, då en mer omfattande revidering ersatte både 1984 års tryckning och 2005 års Today's New International Version och drog tillbaka båda till förmån för den enda text som har stått sedan dess. Det är den texten från 2011 som finns i detta korpus — det år som katalogkortet visar. Biblica, Inc. innehar upphovsrätten hela tiden; Zondervan ger ut den i USA och Hodder & Stoughton i Storbritannien.
hero.4=Dess plats i den här läsaren är central på ett stillsamt sätt. Ställ gränssnittet på engelska, och det är detta som öppnas — sidorna om King James Version och Revised Version i detta korpus säger själva detsamma och pekar hit som den utgåva man byter bort från, inte den man landar på. Eftersom den inte reviderade något, antecknar korpuset ingen förälder för den: öppnar man en härstamningsstegpinne under en vers i New International Version går den rakt ner till botten med originalspråket, markerad ≈, precis som för Berean Standard Bible — med en skillnad värd att känna till. Den bottens grekiska vittne är Textus Receptus, och Textus Receptus är inte det som denna översättnings Nya testamente verkligen gjordes från — botten står i stället för "den ursprungliga grekiskan" i allmänhet, inte för denna kommittés egen arbetstext. En sak till skiljer den från de flesta av dess engelska grannar: den är licensierad, inte fri att kopiera, i samma ställning som New American Standard Bible 2020, medan Berean Standard Bible, Genèvebibeln, King James Version, Revised Version och World English Bible alla får kopieras fritt.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Språk
fact.1.value=Engelska
fact.2.label=Beställd av
fact.2.value=En gemensam kommitté från Christian Reformed Church och National Association of Evangelicals, som sammankallade en konferens vid Trinity Christian College i Palos Heights, Illinois, i augusti 1965
fact.3.label=Utförd av
fact.3.value=Committee on Bible Translation — femton forskare från början, som med tiden kom att omfatta mer än hundra forskare från flera engelsktalande länder och många samfund, under ungefär ett decennium
fact.4.label=Gamla testamentet från
fact.4.value=Den masoretiska hebreiska texten, med Dödahavsrullarna, Septuaginta och andra tidiga vittnen beaktade
fact.5.label=Nya testamentet från
fact.5.value=Den eklektiska kritiska grekiska text som representeras av United Bible Societies- och Nestle-Aland-utgåvorna — inte [[TR|Textus Receptus]], som ligger under [[GNV|Genèvebibeln]] och [[KJV|King James Version]] här
fact.6.label=Typ av översättning
fact.6.value=Balanserar en ordagrann återgivnings exakthet med naturlig, idiomatisk engelska i stället för att hålla fast vid den ena eller andra ytterligheten — klassas vanligen som dynamisk motsvarighet; en ny översättning från originalspråken, inte en revidering av King James-traditionen
fact.7.label=Utgiven
fact.7.value=Nya testamentet 1973; hela bibeln den 27 oktober 1978; en lätt revidering 1984; den nuvarande, mer grundligt reviderade texten 2011, som drog tillbaka både 1984 års tryckning och 2005 års Today's New International Version
fact.8.label=Förlag
fact.8.value=Biblica, Inc., som innehar upphovsrätten; Zondervan i USA, Hodder & Stoughton i Storbritannien
fact.9.label=Licens
fact.9.value=Licensierad, inte fri att kopiera. Upp till 500 verser får citeras utan skriftligt tillstånd, förutsatt att de inte utgör en hel bibelbok eller mer än 25 % av verket, med ett upphovsrättserkännande; allt därutöver kräver Biblicas tillstånd
fact.10.label=I detta korpus
fact.10.value=Bibeln som ett engelskt gränssnitt öppnar som standard — [[KJV|King James Version]] och [[RV|Revised Version]] konstaterar båda här att de inte är det. Ingen förälder är antecknad i härstamningsstegen: en stegpinne under en NIV-vers går rakt ner till botten med originalspråket, markerad ≈, precis som för [[BSB|Berean Standard Bible]] — förutom att den bottens grekiska vittne är [[TR|Textus Receptus]], som inte är den text denna översättnings Nya testamente verkligen gjordes från. Licensierad snarare än fri att kopiera, i samma ställning som New American Standard Bible 2020, skiljer den sig från fritt kopierbara grannar som [[KJV|King James Version]], [[RV|Revised Version]] och [[WEB|World English Bible]]
