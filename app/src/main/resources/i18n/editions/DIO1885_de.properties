title=Diodati 1885 (italienisch) — Über diese Ausgabe | Common Root
description=Giovanni Diodatis italienische Bibel in einer Gestalt des neunzehnten Jahrhunderts: sein Text von 1641 in der Revision von 1821, in einer auf 1885 datierten Ausgabe — dieselbe Übersetzung wie die andere Diodati in diesem Korpus, nur anders in Verse geteilt.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Dies ist Giovanni Diodatis Übersetzung — des Genfers aus Luccheser Familie, geboren 1576, der 1607 die erste italienische Bibel aus dem Hebräischen und Griechischen statt aus dem Lateinischen herausbrachte und sie 1641, acht Jahre vor seinem Tod, mit eigenen Anmerkungen revidierte. Die andere Diodati in diesem Korpus hat eine eigene Seite, die diese Geschichte erzählt. Zwei Jahrhunderte nach ihm lebte der Text vom Nachdruck, und ab 1808 brachte ihn die Britische und Ausländische Bibelgesellschaft in einer Auflage nach der anderen heraus, weil es für italienische Protestanten nichts anderes zu drucken gab.
hero.2=Diese Datei ist eine jener späteren Gestalten. eBible.org, das sie im Auftrag der Vereinigten Bibelgesellschaften bereitstellt, beschreibt sie als Diodatis Übersetzung von 1641, revidiert 1821, in einer auf 1885 datierten Ausgabe. Wer die Revision von 1821 vornahm und welche Druckerei die Ausgabe von 1885 druckte, hat dieses Projekt nicht festgestellt, daher nennt die Seite sie nicht. Das Datum ist nicht das Problem, das es bei der anderen Diodati ist, deren Bezeichnung das Todesjahr Diodatis trägt: 1885 ist das eigene Jahr der Ausgabe, der Katalog speichert es, und der Sprossen-Chip zeigt es.
hero.3=Neben die andere Diodati gestellt, ist der Wortlaut in jeder Stichprobe derselbe: „il Signore è il mio pastore“ in Psalm 23, „la Vergine concepirà“ in Jesaja 7:14, die himmlischen Zeugen in 1. Johannes 5:7, die Doxologie am Ende des Vaterunsers, Apostelgeschichte 8:37 vollständig. Der Gottesname ist „il Signore“, der Herr, wie Diodati ihn schrieb; erst die Riveduta, eine 1924 erschienene Revision dieses Textes, änderte ihn in „l'Eterno“. Was abweicht, ist die Verseinteilung. An mehr als dreißig Stellen folgt diese Abschrift einem anderen, dem hebräischen nahen Schema — Jonas Gebet beginnt bei 2:1 und das Kapitel reicht bis 2:11, Jesaja 8 hat einen 23. Vers, Hiob 39 läuft bis Vers 38 weiter, und der erste Vers von Kolosser 4 steht am Ende von Kapitel 3 —, sodass sie insgesamt sieben Verse weniger zählt. Und diese Abschrift hat keine einzige Psalmüberschrift: Psalm 51 beginnt gleich mit „Abbi pietà di me, o Dio“, wo die andere Diodati die Überschrift in den ersten Vers zieht. eBible.orgs eigene Darstellung dieses Textes zeigt die Überschriften, also sind sie höchstwahrscheinlich beim Import dieses Projekts verloren gegangen und fehlen nicht im Druck von 1885.
hero.4=In diesem Leser ist sie eine von drei italienischen Bibeln. Eine italienische Oberfläche öffnet auf der anderen Diodati, Diodati 1649, die in Katalogreihenfolge zuerst kommt, da es für Italienisch keine kuratierte Wahl gibt. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet — nicht einmal jene andere Abschrift derselben Übersetzung —, sodass eine unter einem Vers geöffnete Sprosse direkt auf den mit ≈ markierten Boden der Ursprachen fällt. Wie bei der anderen Diodati liegt der Textus Receptus dort nahe an der Wahrheit: Diodati arbeitete nach Bezas gedrucktem Griechisch, einem Text dieser Familie.

