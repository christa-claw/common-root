title=Biblia en Español Sencillo — About This Edition | Common Root
description=The Biblia en Español Sencillo: a plain-Spanish Bible published by AudioBiblia.org from 2018, written to be heard as much as read, and licensed so that anyone may copy it.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=For four centuries the Protestant Bible in Spanish has been, in effect, one book in successive revisions: Casiodoro de Reina's translation of 1569, as Cipriano de Valera revised it in 1602, and the long line of Reina-Valera editions that followed. The Biblia en Español Sencillo is not one of them. It is a new translation, made in current Spanish and deliberately plain, published by AudioBiblia.org — the New Testament together with Psalms and Proverbs in 2018, the Old Testament finished in October 2019. The translation is credited to Irma Flores, and its publishers describe it as a conservative and evangelical one.
hero.2=What sets it apart is where it came from. It is the work of an audio-Bible ministry, and the text and a complete chapter-by-chapter recording were produced together rather than one being read out of the other. The stated aim was the same for both: a Bible that is easy to understand, and that can be copied and shared freely and legally. That second half is not incidental. The translation carries a Creative Commons Attribution licence, crediting AudioBiblia.org and Irma Flores, rather than a publisher's reserved rights — which is why the whole text can sit in this corpus and be put verse by verse beside anything else in it.
hero.3=In this reader it is one of four Spanish editions. Set the interface to Spanish and the reader still opens Reina-Valera 1909; this is an edition you switch to. It also behaves differently in the lineage rungs. Because it is a fresh translation rather than a revision of anything the corpus holds, no parent is recorded for it — so opening a rung beneath a Biblia en Español Sencillo verse takes you straight to the original-language floor marked with ≈, not, as in the English chain, to an older edition of the same book. Put it in the second column against Reina-Valera 1909 instead, and the distance between the two registers is the thing worth looking at.

