title=Smith & Van Dyck — Tietoa tästä laitoksesta | Common Root
description=Smithin ja Van Dyckin arabiankielinen Raamattu: Eli Smithin Beirutissa aloittama, Cornelius Van Dyckin vuonna 1865 päätökseen viemä työ, jossa olivat mukana nahda-ajan oppineet Butrus al-Bustani, Nasif al-Yaziji ja Yusuf al-Asir — yhä luetuin arabiankielinen Raamattu.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=Beirutin amerikkalainen lähetysasema aloitti tämän käännöksen noin vuonna 1847, eikä sen aloittaja saanut sitä valmiiksi. Eli Smith oli viettänyt Levantissa kaksi vuosikymmentä ja osasi kieltä kyllin hyvin väitelläkseen siitä; hän työskenteli tekstin parissa kuolemaansa saakka vuonna 1857. Cornelius Van Alen Van Dyck otti työn haltuunsa ja vei sen loppuun — Uusi testamentti valmistui vuonna 1860, Vanha testamentti viisi vuotta myöhemmin, vuonna 1865. Kirjan kaksi nimeä ovat yhden ja saman urakan kaksi puoliskoa.
hero.2=Selkämyksestä puuttuvat nimet painavat yhtä paljon. Van Dyck oli oppinut arabiansa Butrus al-Bustanilta ja Nasif al-Yazijilta, ja molemmat tekivät käännöstä hänen kanssaan, samoin sheikki Yusuf al-Asir, joka kävi arabian läpi sanonnan ja tyylin kannalta. Nuo kolme eivät olleet lähetystyön apulaisia. He kuuluivat nahdan, arabialaisen kirjallisen uudistuksen, keskeisiin hahmoihin, ja tulos lukeutuu arabialaiseksi proosaksi eikä arabian vaatteisiin puetuksi käännökseksi. Siksi kirja eli pitempään kuin sen maksanut lähetys.
hero.3=Se oli yhtä lailla kirjapainotaidon kuin oppineisuuden saavutus. Beirutin American Press latoi sen lähetystä varten leikatulla arabialaisella kirjasintyypillä, joka valmistui vuonna 1843 ja tunnetaan yhä nimellä al-Amerikani; Smith oli ollut sitä muovaamassa. Arabiaa on vaikea latoa hyvin — kirjaimet liittyvät toisiinsa ja muuttavat liittyessään muotoaan — ja sivulla oikean näköinen Raamattu teki vastaanoton hyväksi enemmän kuin väittely olisi tehnyt. Kappaleita on sittemmin levinnyt miljoonia sekä protestanttisille että koptilaisille lukijoille, ja useimmille arabiankielisille kristityille Raamattu yksinkertaisesti kuulostaa tältä.
hero.4=Tässä lukuohjelmassa se on ainoa arabiankielinen Raamattu, ja se ratkaisee sen käyttäytymisen. Kun käyttöliittymä asetetaan arabiaksi, juuri tämä avautuu — ei siksi, että se olisi valittu, niin kuin Reina-Valera 1909 valittiin espanjalle, vaan siksi, että luettelo etsii Raamattua käyttöliittymän kielellä ja löytää täsmälleen yhden. Se on myös toinen kahdesta täkäläisestä laitoksesta, joiden teksti kulkee oikealta vasemmalle; toinen on nykyheprealainen Raamattu. Polveutumisaskelmiin sille ei ole kirjattu kantatekstiä, joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan — mikä osuu tässä lähemmäs kuin tavallisesti, sillä pohjan tarjoama kreikka on Textus Receptus, ja juuri Textus Receptuksesta sen Uusi testamentti tehtiin.

