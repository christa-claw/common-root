title=スナン・アブー・ダーウード — この版について | Common Root
description=スナン・アブー・ダーウード——イスラーム法との関わりからアブー・ダーウード・アッ=シジスターニーが編纂したハディース集。自ら検証した約500,000件の伝承の中から選び、法学上の主題別に編まれた——スンニ派イスラームの六書のうち第三書。
heroHeading=スナン・アブー・ダーウード
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=アブー・ダーウード・スライマーン・イブン・アル=アシュアス・アル=アズディー・アッ=シジスターニーは、ヒジュラ暦202年（西暦817〜818年）頃、ホラーサーン地方のシジスターン（現在のイランとアフガニスタンの国境地帯）に生まれた。十八歳でバグダードに至り、その後ハディースを求めてホラーサーン、イラク、ヒジャーズ、シリア、エジプト、ニシャープールを遍歴し、アフマド・イブン・ハンバルを含む約300人の学者のもとで学んだ。バスラに定住し、ヒジュラ暦275年シャウワール月の金曜日（西暦889年）に七十三歳で没し、法学者スフヤーン・アッ=サウリーのかたわらに葬られた。
hero.2=彼の関心は特に法学的なものだった。信仰・歴史・法を等しく扱うサヒーフ・アル=ブハーリーやサヒーフ・ムスリムとは異なり、アブー・ダーウードは自身のスナンをフィクフ（法学）に関わるハディースを中心に組み立て、法学者が必要とする主題——清め、礼拝、ザカート、斎戒、婚姻、遺産、裁判職ほか——を貫く諸巻に編んだ。弟子イブン・ダーサによれば、彼は資料を集める過程で約500,000件のハディース伝承を検証した。また、アル=ブハーリーやムスリムとは異なる基準も設けた。彼らが完全に真正と判断したハディースのみを採録したのに対し、アブー・ダーウードは、ある法学上の論点を扱うより強い伝承が存在しない場合には、ムルサル（伝達経路に欠落のある）伝承や弱い（ダイーフ）伝承、さらにはムンカル（重大な疑義のある）伝承さえも採録し、その方法をメッカの住民に宛てた書簡の中で説明し、そうした弱い評価を無印のままにせず自ら明示した。
hero.3=スンニ派の伝統では、スナン・アブー・ダーウードはサヒーフ・アル=ブハーリーとサヒーフ・ムスリムに次ぐ六書の第三書とされる。それが、ジャーミウ・アッ=ティルミズィー、スナン・アン=ナサーイー、スナン・イブン・マージャとともに、残る四書の中で互いにどのように位置づけられるかは、長く論じられてきたが決着していない。この書物に挙げられる数字は、誰も解決していないらしい形で互いに一致しない。イブン・ダーサの伝えるアブー・ダーウードが選んだ数は4,800件であるのに対し、ムハンマド・ムヒーウッディーン・アブドゥルハミードが編集し1935年にカイロで印刷された現代の標準版は5,274件と番号づけている。このコーパス自身の数、43巻・5,274件は、そのカイロ版の番号づけと正確に一致しており、これはサヒーフ・アル=ブハーリーやサヒーフ・ムスリム——そこではこのコーパスの数がどの特定の印刷の伝統とも一致しない——よりも、ここではより確かな根拠に立っていることになる。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-abudawud 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスがサヒーフ・アル=ブハーリー、サヒーフ・ムスリム、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=アブー・ダーウード・スライマーン・イブン・アル=アシュアス・アル=アズディー・アッ=シジスターニー（ヒジュラ暦202–275年 / 西暦817–889年）
fact.3.label=名称
fact.3.value=単にスナン・アブー・ダーウードとして知られる。[[BUK|サヒーフ・アル=ブハーリー]]とは異なり、別個の正式な書名は記録されていない
fact.4.label=編纂地と時期
fact.4.value=ホラーサーン、イラク、ヒジャーズ、シリア、エジプト、ニシャープールを巡る旅の中で集められた。アブー・ダーウードはバスラに定住し、同地で没した
fact.5.label=方法
fact.5.value=伝達者や年代ではなく法学上の主題（フィクフ）によって整理されている。ある法学上の論点を扱うより強い伝承がない場合には、弱い・ムルサル・ムンカルのハディースを一部採録し、明示的にそのように示している
fact.6.label=位置づけ
fact.6.value=[[BUK|サヒーフ・アル=ブハーリー]]と[[MUS|サヒーフ・ムスリム]]に次ぐ、スンニ派イスラームの六書（クトゥブ・スィッタ）の第三書。残る三書の中での位置づけは論争中であり決着していない
fact.7.label=ハディースの数
fact.7.value=アブー・ダーウードの弟子イブン・ダーサによれば選ばれたのは4,800件、ムハンマド・ムヒーウッディーン・アブドゥルハミードによる標準版（カイロ、1935年）では5,274件。両者の数字は文献上調整されていない
fact.8.label=このコーパスでは
fact.8.value=43巻・5,274件の番号付きハディース——1935年のカイロ版の番号づけと正確に一致する
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-abudawud 版から取られ、アラビア語の下に並置の形で示される。どの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語のマトンは古典的なパブリックドメインの本文である。英訳のライセンスはまだ確認中である
