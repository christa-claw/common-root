title=סונן אבו דאווד — על מהדורה זו | Common Root
description=סונן אבו דאווד: אוסף החדית׳ שאבו דאווד אל-סיג'סתאני ליקט בשל חשיבותו להלכה האסלאמית, מתוך כ-500,000 מסורות שבדק, מאורגן לפי נושא הלכתי — השלישי בששת הספרים של האסלאם הסוני.
heroHeading=סונן אבו דאווד
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=אבו דאווד סולימאן בן אל-אשעת' אל-אזדי אל-סיג'סתאני נולד בסביבות שנת 202 להג'רה (817–818 לספירה) בסיג'סתאן, פרובינציה בחוראסאן השוכנת כיום על הגבול בין איראן לאפגניסטן. הוא הגיע לבגדאד בגיל שמונה-עשרה, ולאחר מכן נסע בחוראסאן, עיראק, אלחיג'אז, סוריה, מצרים ונישאפור בחיפוש אחר חדית׳, ולמד אצל כ-300 חכמים, ובהם אחמד בן חנבל. הוא התיישב בבצרה, שם מת ביום שישי בחודש שוואל בשנת 275 להג'רה (889 לספירה) בגיל שבעים ושלוש, ונקבר לצד הפוסק סופיאן אל-ת'ורי.
hero.2=עניינו היה הלכתי במובהק: בשונה מצחיח אל-בוכ'ארי ומצחיח מוסלם, החולשים באותה מידה על אמונה, היסטוריה והלכה, אבו דאווד בנה את הסונן שלו סביב חדית׳ הנוגעים לפִקְה, וסידרו בספרים העוברים בנושאים שפוסק הלכה נדרש להם — טהרה, תפילה, זכאת, צום, נישואין, ירושה, שיפוט וכן הלאה. לפי תלמידו אבן דאסה, בדק כ-500,000 מסורות חדית׳ באיסוף החומר. הוא גם קבע קנה מידה שונה משל אל-בוכ'ארי ומוסלם: במקום שבו הם קיבלו רק חדית׳ שראו בו מהימן באופן מלא, אבו דאווד כלל כמה מסורות מורסל, חלשות (צ'עיף) ואף מונכר כאשר לא נמצא חדית׳ חזק יותר העוסק בנקודה הלכתית נתונה, והסביר את שיטתו במכתב לתושבי מכה, וסימן בעצמו את הדירוגים החלשים יותר במקום להשאירם ללא סימון.
hero.3=המסורת הסונית מונה את סונן אבו דאווד כשלישי בין ששת הספרים, אחרי צחיח אל-בוכ'ארי וצחיח מוסלם; היכן בדיוק הוא, ג'אמע אלתרמד'י, סונן אלנסאא'י וסונן אבן מאג'ה מתמקמים זה ביחס לזה בין ארבעת הנותרים, נדון זה זמן רב מבלי שהוכרע. המספרים הנתונים לספר אינם מתיישבים זה עם זה באופן שנראה שאיש לא פתר: המספר של אבן דאסה למה שבחר אבו דאווד הוא 4,800 חדית׳, בעוד שהמהדורה הסטנדרטית המודרנית — שנערכה בידי מוחמד מֻחְיִ אלדין עבד אלחמיד ונדפסה בקהיר בשנת 1935 — ממספרת 5,274. המספר העצמי של האוסף הזה, 43 ספרים ו-5,274 חדית׳, תואם במדויק את המספור של מהדורת קהיר ההיא, מה שמציב אותו כאן על קרקע מוצקה יותר מצחיח אל-בוכ'ארי או צחיח מוסלם, שבהם המספר של האוסף הזה אינו משחזר מסורת דפוס מסוימת אחת.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-abudawud של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור צחיח אל-בוכ'ארי, צחיח מוסלם ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

