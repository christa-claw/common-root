fact.6.value=השלישי בששת הספרים של האסלאם הסוני (כתב אלסתה), אחרי [[BUK|צחיח אל-בוכ'ארי]] ו[[MUS|צחיח מוסלם]]; מעמדו בין שלושת הספרים הנותרים שנוי במחלוקת ולא הוכרע
fact.7.label=מספר החדית׳
fact.7.value=4,800 נבחרים לפי תלמידו של אבו דאווד, אבן דאסה, או 5,274 במהדורה הסטנדרטית של מוחמד מֻחְיִ אלדין עבד אלחמיד, קהיר, 1935; המקורות אינם מיישבים בין שני המספרים
fact.8.label=באוסף זה
fact.8.value=43 ספרים ו-5,274 חדית׳ ממוספרים — תואם במדויק את מספור מהדורת קהיר משנת 1935
fact.9.label=תרגום לאנגלית
fact.9.value=נלקח ממהדורת eng-abudawud של fawazahmed0/hadith-api, מוצג כלוויה תחת הערבית; מאיזה תרגום מתפרסם הוא נובע לא נקבע עדיין מצד האוסף הזה
fact.10.label=רישיון
fact.10.value=המתן הערבי הוא הטקסט הקלאסי נחלת הכלל; רישיון התרגום לאנגלית עדיין בבדיקה
