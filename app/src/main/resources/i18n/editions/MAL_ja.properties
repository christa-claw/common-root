title=ムワッタ・マーリク — この版について | Common Root
description=ムワッタ・マーリク——イマーム・マーリク・イブン・アナスがメディナで編んだ法学とハディースの集成。スンニ派イスラームの六書より約一世紀早く、六書においてスナン・イブン・マージャの位置に代わるべきだと提案されることもある。
heroHeading=ムワッタ・マーリク
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=マーリク・イブン・アナス・イブン・マーリク・イブン・アビー・アーミル・アル=アスバヒー・アル=マダニーは、クンヤ（尊称）「アブー・アブド・アッラー」として知られ、ヒジュラ暦93年（西暦711年）頃にメディナに生まれ、ヒジュラ暦179年（西暦795年）に同地で没し、バキーア墓地に葬られた。彼はヒシャーム・イブン・ウルワ、イブン・シハーブ・アッ=ズフリー、ジャアファル・アッ=サーディク、ナーフィウ・マウラー・イブン・ウマルらの学者に師事し、生涯メディナで教え続け、「イマーム・ダール・アル=ヒジュラ」（「移住の都のイマーム」）や「シャイフ・アル=イスラーム」といった称号を得た。彼はスンニ派四大法学派の一つ、マーリク派の名祖となった。彼の最も著名な弟子であるムハンマド・イブン・イドリース・アッ=シャーフィイー——後にシャーフィイー学派を創始した——は、マーリクの書を「クルアーンに次いで地上でもっとも健全な書」と評した。アッバース朝カリフ・アル=マンスールは、この書を帝国唯一の法的典拠にしようとしたと伝えられるが、マーリク自身はこれを辞退した。
hero.2=『ムワッタ』（「踏み慣らされた道」）は、伝統によれば、アッバース朝初期に約四十年をかけて編まれた。その名は、マーリクが本文をメディナの七十人の法学者に示し、全員がそれに同意した（ワタア）ことに由来するとされる。この書は預言者に帰せられるハディースと、その教友たちおよび次の世代の法学的見解、さらにマーリク自身の裁定を一つに組み合わせている——ある評価によれば、ハディースとフィクフをこのように融合させた現存最古の著作であり、六書より約一世紀早い。その規模を示す数字は、伝本と数え方によって異なる。ハディースそのものの数としてよく引用される数字は約1,720件であり、一方でマーリクは、彼が入手できたとされる100,000の伝承の中から、1,900件に満たない数を選んだとされる。
hero.3=『ムワッタ』には少なくとも十六の伝本が知られている。特にマーリク派にとって標準的な典拠となったのは、ヤフヤー・イブン・ヤフヤー・アル=ライスィーの伝本である。アフマド・イブン・アビー・バクル・アッ=ズフリーによる対抗する伝本は、これより五から十パーセントほど長い。アル=ライスィーの伝本だけでも、約百の注釈書が存在する。『ムワッタ』がスンニ派の六書より古いことから、一部の学者——マーリク派やイブン・アル=アスィールを含む——は、[[IBM|スナン・イブン・マージャ]]ではなく『ムワッタ』こそがその正典の一覧に属すべきだと論じる。イブン・マージャの『スナン』がその席を保ったのは、一般に、他の五書との内容の重複がもっとも少なかったためとされ、より健全と判定されたからではないとされる。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-malik 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]、[[IBM|スナン・イブン・マージャ]]、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=マーリク・イブン・アナス・アル=アスバヒー・アル=マダニー（ヒジュラ暦93〜179年 / 西暦711〜795年）
fact.3.label=名称
fact.3.value=『ムワッタ』（「踏み慣らされた道」）として知られる
fact.4.label=編纂地と時期
fact.4.value=アッバース朝初期に約四十年をかけて編まれ、改訂された。マーリクは生涯メディナで教え、ヒジュラ暦179年（西暦795年）に同地で没した
fact.5.label=方法
fact.5.value=預言者に帰せられるハディースと、教友および次世代の裁定、マーリク自身の法学的見解を組み合わせている。六書より約一世紀早い
fact.6.label=位置づけ
fact.6.value=スンニ派の正典である六書より古い。一部の学者——マーリク派やイブン・アル=アスィールを含む——は、[[IBM|スナン・イブン・マージャ]]ではなくこの書を第六書とすべきだと論じる——この論争は、本頁が参照した資料の範囲では決着していない
fact.7.label=ハディースの数
fact.7.value=よく引用される数字では、ハディースそのものは約1,720件。マーリクは入手できたとされる100,000の伝承の中から1,900件に満たない数を選んだとされる。このコーパスの底本の版では1,858件と番号づけられている
fact.8.label=このコーパスでは
fact.8.value=62巻・1,858件の番号付きハディース
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-malik 版から取られ、アラビア語の下に並置の形で示される。どの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語のマトンは古典的なパブリックドメインの本文である。英訳のライセンスはまだ確認中である
