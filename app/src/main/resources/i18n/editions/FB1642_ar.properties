title=Biblia 1642 — عن هذه الطبعة | Common Root
description=Biblia 1642: أول كتاب مقدّس كامل بالفنلندية، ترجمه أربعة علماء في توركو في ثلاث سنوات، وطُبع تحت رعاية الملكة كريستينا ملكة السويد.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
thanks=مع الشكر لمن أرسلوا تصويبات لهذه الصفحة.

# The narrative, one paragraph per key, in order.
hero.1=أول كتاب مقدّس كامل بالفنلندية. قبله كان العهد الجديد لميكائيل أغريكولا سنة 1548 وأجزاء من العهد القديم نُشرت في خمسينيات القرن السادس عشر؛ وبعده صار هناك كتاب كامل بلغة لم تكن قد كُتبت إلا بالكاد. أنجز العمل أربعة علماء بين 1638 و1641 — إسكيل بتريوس، ومارتينوس ستوديوس، وهنريكوس هوفمان، وغريغوريوس ماتّاي — تحت إشراف إيساكوس روتوفيوس أسقف توركو الذي دفع المشروع إلى نهايته. وكانت فنلندا جزءًا من السويد، فصدر المجلد سنة 1642 تحت رعاية الملكة كريستينا. وقد جرت محاولة قبل جيل: ففي سنة 1602 عُيّنت لجنة لترجمة الكتاب المقدّس، يُرجَّح أنّ أسقف توركو إريكوس إريتشي سورولاينن ترأّسها. ويبدو أنّها أنجزت مسوّدات لكنها لم تجمعها قطّ في كتاب مقدّس، ومصيرها مجهول في معظمه — وإن كان يُظَنّ أنّ ذلك العمل ترك أثره في ترجمة 1642.
hero.2=ترجموا عن العبرية واليونانية وألمانية لوثر إلى جانبهم. وكان الكتاب المقدّس السويدي لغوستاف فاسا هو الكتاب الآخر على الطاولة؛ وهو ليس في هذه المجموعة، فلذلك تسجّل السلسلة هنا لوثر — وإلى جانبه فنلندية أغريكولا سنة 1548، النص الأساس الذي كانت اللجنة تنقّحه. أما الأثر الأكبر لـBiblia 1642 فوقع على الفنلندية نفسها. فلغة لم يكن لها نثر مكتوب يُذكر نالت في مجلد واحد معجمًا وإيقاعًا لكل شيء، من القانون إلى المرثية — وكل كتاب مقدّس فنلندي لاحق تنقيح لها أو خلَف، لا بداية جديدة.
hero.3=في هذا القارئ تقف طبعة 1642 بين درجتين فنلنديتين. على بُعد ثلاث درجات تحت Kirkkoraamattu 1933/38، وتحت Biblia 1776، تظهر هذه الطبعة، وتحتها أبوان جنبًا إلى جنب — فنلندية أغريكولا سنة 1548، الأساس الذي كانت اللجنة تنقّحه، وألمانية لوثر سنة 1545 المفتوحة على الطاولة. وعلى بُعد درجة أخرى تكون السلسلة قد غادرت الفنلندية بلا رجعة. والنص هنا مأخوذ من مدونة VKS للفنلندية الأدبية القديمة في مركز Kotus، ولذلك فالإملاء الذي تراه — «tulcon walkeus» — هو إملاء طبعة 1642 نفسها غير محدَّث.

