title=Agricola 1548 — Om denna utgåva | Common Root
description=Mikael Agricolas finska: Nya testamentet 1548, Psaltaren 1551 och profeterna — den första tryckta finska bibeltexten och början på det skrivna finska språket.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Tack till dem som skickat rättelser till den här sidan.

# The narrative, one paragraph per key, in order.
hero.1=Den äldsta tryckta finska som finns. När Mikael Agricola gav ut Se Wsi Testamenti 1548 hade finska nästan aldrig satts i tryck — hans egen ABC-bok några år tidigare var över huvud taget den första finska boken. Däremellan kom ännu bönboken från 1544 — ett omfångsrikt verk som redan innehöll psaltaröversättningar. För att kunna trycka skriften måste han först avgöra hur språket skulle skrivas, och de besluten — stavningen, lånorden, rytmen — är där det skrivna finska språket börjar. Nya testamentet tog honom och hans Åbokrets över ett årtionde; Psaltaren följde 1551, och urval ur profeterna och Moseböckerna 1551 och 1552. Hans finska var dock den första tryckta finskan, inte den första skrivna: fyra handskrifter — Codex Westh, Uppsalakodex B 28, missalet från Kangasala och Uppsalafragmentet — innehåller finska bibelställen, och Kauko Pirinen visade 1988, genom att jämföra dem med deras svenska förlagor, att delar av dem är äldre än något Agricola tryckte, kanske nedskrivna redan på 1530-talet.
hero.2=Hela Bibeln översatte han aldrig, och denna läsare låtsas inte annat. Nya testamentet och alla 150 psalmer är fullständiga; profeterna och Moseböckerna finns i urval. Också det han återgav på annat håll finns här: hans bönbok från 1544 och hans Käsikirja och Messu från 1549 bär egen bibeltext — däribland de kapitel ur Första Moseboken som trycktes under rubriken "Genesist mutomat Lughut" — och 685 verser kommer därifrån. De används bara där skriftbanden saknar vers på samma ställe, och bara där texten löper sammanhängande i stället för att stå som ett enstaka citat inuti en bön. Så Första Moseboken finns ändå med, delvis: kapitel 1–4, 22, 28 och 32. Domarboken, Rut, Första Krönikeboken och Ester saknas helt. Ett fullständigt finskt Gamla testamente fick vänta på Biblian av 1642, en stegpinne högre upp.
hero.3=I denna läsare är Agricola den äldsta finska stegpinnen. Öppna en stegpinne under en vers i Biblia 1642, och hans text visar sig bredvid Luthers tyska — de två källor som 1642 års kommitté faktiskt hade uppslagna. Under Agricola själv lämnar kedjan finskan för gott: han arbetade med Erasmus grekiska och det latin Erasmus tryckte bredvid den, med Luthers tyska och med Vulgata. Tre av dem är här upptecknade som hans föräldrar; Erasmus latin och Gustav Vasas svenska bibel från 1541, som han också använde, finns inte i detta korpus. Texten är Kotus VKS-korpusens, i 1548 års trycks egen stavning: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". Svensk bibeltext hade funnits i tryck sedan 1526, då det svenska Nya testamentet utkom, så en svensk version fanns till hands från första början.

