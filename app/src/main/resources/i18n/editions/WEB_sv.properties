title=World English Bible — Om denna utgåva | Common Root
description=World English Bible: en revision av 1901 års American Standard Version till modern engelska, påbörjad 1994 av Michael Paul Johnson, med Nya testamentet anpassat till den grekiska majoritetstexten och medvetet lagd i det fria.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=World English Bible finns till på grund av ett upphovsrättsproblem. År 1994 räknade Michael Paul Johnson, en ingenjör som översatte Bibeln på de timmar ett heltidsarbete lämnade över, ut hur lång tid det skulle ta honom att bli färdig med en modern engelsk bibel som vem som helst fritt fick kopiera, och tyckte inte om svaret. Han slutade översätta från grunden och började om från 1901 års American Standard Version — exakt, aktad och, till skillnad från King James Version (som i England och Wales alltjämt är belastad av kronans patentbrev), helt fri från upphovsrätt. Ett program han själv skrev gick igenom ASV efter ord som ingen modern bibel använde, föreslog ersättningar och genomförde bytena på ungefär femton minuter. Allt som programmet inte klarade — ordföljd, skiljetecken, anföringstecken — gjordes för hand under de följande åren, och texten gavs ut, och gavs ut på nytt i revisioner, från 1997 och framåt.
hero.2=Två saker skiljer den från utgåvan den reviderar. Den första är grekiskan. ASV:s Nya testamente följde revisorernas kritiska text, nära det som skulle bli Nestle–Alands utgåva; World English Bible anpassades i stället till den bysantinska majoritetstexten, och är alltså varken sin stamforms text eller den Textus Receptus som King James-översättarna använde. Den andra är gudsnamnet. ASV tryckte “Jehovah”; World English Bible trycker “Yahweh”, med en not vid 1 Mos 2:4 som förklarar valet för den läsare som väntar sig “the LORD”. Den brittiska utgåvan återgår till “LORD” — exemplaret i detta korpus är det amerikanska, så “Yahweh” är vad man läser. Bortom dessa två beslut förblir den en översättning med formell motsvarighet i stamformens manér: samma nära följsamhet mot hebreiskans och grekiskans ordföljd, i stavning och grammatik som inte längre behöver förklaras.
hero.3=I läsaren är den ett löv, och det enda på korpusets längsta gren. Öppna en stegpinne under en vers ur World English Bible och American Standard Version träder fram under den, och under den Revised Version, King James Version och Genèvebibeln, ned till urspråksbotten som är märkt med ≈. Ingenting i korpuset står i sin tur på World English Bible. Den är också grenens vidaste text: American Standard Version hade inga apokryfer, så World English Bibles egna gjordes separat, ur King James apokryfer och Brentons engelska Septuaginta, och vårt exemplar bär åttio böcker där ASV under den bär sextiosex — bland dem 3 och 4 Mackabéerboken och Psalm 151, som King James apokryfer saknar. Baruk, som de har, saknas i vårt exemplar. Om-sidan lämnar denna utgåvas årskolumn tom, och med rätta: något enskilt utgivningsår finns inte. Korpuset stämplar 2000 för att stegpinnarnas brickor ska ha något att sortera efter.

