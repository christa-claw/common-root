title=Louis Segond 1910 (Fransızca) — Bu Baskı Hakkında | Common Root
description=Segond Kutsal Kitabı'nın 1910 revizyonu: Cenevreli bir papazın İbranice ve Yunancadan yaptığı çeviri; ilk kez 1880'de tam olarak basıldı, İngiliz ve Yabancı Kutsal Kitap Derneği için gözden geçirildi ve bir yüzyıl boyunca Fransızca konuşan Protestanların standart Kutsal Kitabı oldu.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond 1810'da, o zamanlar Cenevre'nin hemen dışında kalan Plainpalais'de doğdu ve 1885'te Cenevre'de öldü. Strazburg'daki Protestan fakültesinde teoloji okudu, yirmi altı yaşında teoloji doktoru oldu ve İbranice ile Eski Antlaşma öğretmeye geçmeden önce yirmi dört yıl boyunca Chêne-Bougeries köy cemaatinin papazlığını yaptı. Cenevre'nin Saygıdeğer Papazlar Heyeti, Eski Antlaşma'yı İbraniceden yeniden çevirme görevini ona verdi ve çevirisi 1874 tarihli bir baskıyla çıktı. Ardından Yeni Antlaşma'yı kendi girişimiyle çevirdi; Textus Receptus'u değil, Constantin Tischendorf'un eleştirel Yunanca metnini esas aldı. 1880'de Kutsal Kitap'ın tamamı Oxford'da basılmış tek bir cilt olarak yayımlandı.
hero.2=Bu, Segond'un yayımladığı metnin tıpkısı değildir. Ölümünden sonra İngiliz ve Yabancı Kutsal Kitap Derneği metni bir grup Fransız ve İsviçreli papaza ve teoloğa gözden geçirtti; revizyon 1910'da çıktı. Değişiklikleri Protestan ortodoksisinin sözcük dağarcığına doğru eğildi — kâhinler “prêtres” değil, eski Protestan sözcüğü olan “sacrificateurs” oldu; bu kopyada “sacrificateur” her yerde, “prêtre” ise seyrektir. Fransız Protestanlığının yirminci yüzyılın büyük bölümü boyunca başvuru Kutsal Kitabı olan, bugün de Fransızca konuşan evanjelikler arasında en çok okunanlardan biri olarak kalan, işte bu 1910 metnidir. Sonraki revizyonlardan oluşan uzun bir ailesi de vardır: 1978 tarihli “Colombe”, 1979 tarihli Nouvelle Édition de Genève ve 2007'de Segond 21. Bazı özellikler neredeyse her sayfada görülür. Tanrı'nın adı, Ostervald'da ve bu derlemede yanında duran Fransızca Darby'de olduğu gibi “l'Éternel”, yani Ebedî Olan'dır: Mezmur 23'te “L'Éternel est mon berger”. Yeşaya 7:14 ise “la jeune fille deviendra enceinte” diye okunur — bakire değil, genç kadın — bazı muhafazakâr Protestanların Segond'u Mesih'le ilgili peygamberlikleri zayıflatmakla suçlamasına yol açan türden bir çeviri.
hero.3=Mezmurlarda kitap İbraniceyi izler: numaralandırma İbranice olandır, dolayısıyla Mezmur 23 çoban mezmurudur ve bir mezmurun başlığı İbranicede bir ayet sayıldığı yerde burada da ayettir — Mezmur 51'de 21 ayet vardır, King James Version'dakinden iki fazla. Yoel ve Malaki ise Latin ve İngiliz geleneğinin bölüm ayrımını korur: üç bölüm ve dört. Bu okuyucuda Ostervald ve Fransızca Darby'nin yanında yer alan üç Fransızca Kutsal Kitap'tan biridir. Fransızca bir arayüz bunu açmaz: Fransızca için elle yapılmış bir seçim yoktur, bu yüzden okuyucu katalog sırasındaki ilk Fransızca Kutsal Kitap'ı alır, o da Darby'dir. Soy basamaklarında ona kayıtlı bir kaynak yoktur, bu yüzden bir ayetin altında açılan basamak doğruca ≈ ile imlenen özgün diller tabanına iner — Eski Antlaşma için Leningrad Kodeksi, yani Segond'un zamanındaki basılı bir İbranice metin değil, Masoretik geleneğe ait bir el yazması; Yeni Antlaşma için ise Textus Receptus, yani tam da onun izlememeyi seçtiği Yunanca. Basamak etiketi 1910 yılını taşır.

