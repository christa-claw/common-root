title=Freedom Bible اليابانية — عن هذه الطبعة | Common Root
description=Freedom Bible اليابانية (フリーダム・バイブル): كتاب مقدّس ياباني كامل في 66 سفرًا، يوزّعه موقع eBible.org مسوّدةَ ترجمةٍ لم يُوضع عليها حقّ نشر — وهو الكتاب المقدّس الياباني الوحيد في هذه المجموعة، ولذلك تُفتح عليه الواجهة اليابانية.
heroHeading=Freedom Bible اليابانية
readerHref=/reader?c1.src=jfb

hero.1=Freedom Bible اليابانية — واسمها باليابانية フリーダム・バイブル — كتاب مقدّس ياباني كامل يوزّعه موقع eBible.org، الذي يصف نفسه بأنه الموزّع الرسمي لهذه الترجمة. وهي حديثة جدًّا: فملفات المصدر التي تحفظها هذه المجموعة مؤرّخة في 19 أغسطس 2026، والسنة 2026 المكتوبة على بطاقتها هي تاريخ تلك الملفات. ولا يذكر eBible تاريخ نشر مستقلًّا، ولا يُدّعى هنا أيّ تاريخ.
hero.2=كثير من أمرها غير مدوَّن، ومن الحسن أن يقال ذلك صراحة. فصفحات eBible لا تسمّي مترجمًا ولا لجنة ولا ناشرًا، ولا تذكر النصّ الذي تُرجمت عنه: أمن العبرية واليونانية مباشرة، أم بوساطة ترجمة حديثة أخرى. وصفحة حقوق النشر الخاصّة بها تسمّيها مسوّدة ترجمة (翻訳の草案) وتدعو إلى اقتراح تحسينات عليها، فالنصّ هنا لقطة من عمل جارٍ لا طبعة مستقرّة.
hero.3=أمّا الواضح فوضعها القانوني: إذ تنصّ الصفحة نفسها على أنه لم يُوضع على الترجمة حقّ نشر، وتصنّفها في الملك العام. ولهذا كانت هي النصّ الياباني هنا، فقد كانت الكتاب المقدّس الياباني الكامل الوحيد على eBible الخالي من حقوق النشر. أمّا الكتاب المقدّس الياباني الأقدم الذي كان يمكن أن يمنحها نسبًا، أي ترجمة عصر ميجي التي اكتملت عام 1887 ودخلت الملك العام منذ زمن بعيد، فغير متاح من ذلك المصدر.
hero.4=وهي في هذه المجموعة تضمّ أسفار القانون البروتستانتي الـ66، في 31,098 آية، من غير الأسفار القانونية الثانية. ولم يُسجَّل لها أصل، فإذا فُتحت درجة تحت آية من آياتها أفضت مباشرة إلى قاع اللغات الأصلية المعلَّم بالرمز ≈: والعبرية واليونانية الظاهرتان هناك شاهدان، لا دعوى بشأن ما تُرجمت عنه — ومع جهالة مصدرها، فتلك هي القراءة الأمينة. وهي الكتاب المقدّس الياباني الوحيد في المجموعة، ولذلك تُفتح عليها الواجهة اليابانية افتراضيًا.

