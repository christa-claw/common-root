# The narrative, one paragraph per key, in order.
hero.1=המקרא השלישי של פינלנד, והוא זה שהתקבע. זו מהדורה מתוקנת ולא תרגום חדש: הקו חוזר, דרך תיקונו של פלורינוס משנות 1683–85, אל ה־Biblia של 1642, המקרא הפיני השלם הראשון. את ההגהה ערך אנדרס (אנטי) ליזליוס, שכבר ב־1758 הוציא מהדורת מקרא משלו. מה ששינתה מהדורת 1776 הוא הכתיב, ועמו טווח ההגעה. זו הייתה המהדורה הפינית הראשונה בכתיב מחודש, והראשונה שנדפסה לשימוש ביתי ולא לדוכן בלבד. מקרא שמשפחה יכולה להחזיק בו הוא חפץ אחר ממקרא שקהילה מחזיקה בו. המהדורות שבאמצע לא היו עניין של כתיב בלבד. הנריק פלורינוס, הפרוסט מפיימיו, שהכין את מהדורת 1685, ידע עברית ויוונית ותיקן את התוכן לא פחות מן הלשון — הניסוח זז יותר מן הכתיב — ומקובל לראות במהדורות הביניים עבודת תרגום גם מלשונות המקור, ולא סידור בעלמא של נוסח 1642. המשווה בין 1642 ל־1776 מביט אפוא מעבר לשתי הגהות, לא מעבר לשינוי כתיב.
hero.2=היא החזיקה בשימוש הכנסייה מאה וחמישים שנה, עד שהחליפה אותה Kirkkoraamattu 1933/38, ולא חדלו לקרוא בה כשחדלה להיות רשמית. שתי תנועות התעוררות בתוך הכנסייה האוונגלית־לותרנית של פינלנד — הלסטדיאנים וה־rukoilevaiset — שמרו עליה ומשתמשים בה עד היום. משום כך המילה Biblia לבדה מצביעה בפינית לכאן ולא למהדורה קדומה או מאוחרת יותר, ומשום כך נקרא הספר גם Vanha kirkkoraamattu, מקרא הכנסייה הישן.
hero.3=בקורא הזה היא אמצע השרשרת הפינית. פִּתחו שלב אחד מתחת לפסוק מתוך Kirkkoraamattu 1933/38 ותופיע מהדורה זו; פתחו שלב אחד מתחתיה ותופיע ה־Biblia של 1642. אלא ששני השלבים נקראים אחרת. מתרגמי 1933/38 עבדו מן העברית ומן היוונית, ולכן השלב שמעל הוא ירושה בתוך מקרא של כנסייה אחת ולא גזירה ממנו. השלב שמתחת הוא גזירה של ממש: 1776 היא תיקון של 1642, והמילים משני עברי הצעד הזה נועדו להשוואה.
hero.4=הסתייגות אחת בנוגע לנוסח שבאתר הזה: אין הוא הדפוס של 1776. מה שמובא כאן משתלשל מנוסח דיגיטלי שברשות הרבים, שכתיבו נורמל בידי מהדיר מאוחר ותולדות ההגהה שלו אינן מתועדות — מתוך 31,102 פסוקיו יש בדיוק אחד שמופיעה בו האות w, ואילו בביבליה של 1642 יש 26,862 כאלה, ו־w במקום v הוא הסימן המובהק ביותר של הכתיב שבו נדפסה מהדורת 1776. כלומר, 1776 עדכנה את כתיב 1642, והנוסח שכאן עודכן מאז פעם נוספת, וכך הוא רחוק מן הספר המודפס יותר משהייתה 1776 רחוקה מ־1642. שני חוקרי הפינית הספרותית העתיקה שאלו תחילה איזו גרסה זו, והשאלה הייתה הנכונה. הדפוס של 1776 עצמו שמור כתצלומי עמודים באוסף התקופה השוודית של הספרייה הלאומית של פינלנד; להעמיד במקומו נוסח נאמן היא עבודה שהיינו רוצים לעשות.

