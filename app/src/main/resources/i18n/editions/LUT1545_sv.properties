title=Luther Bibel 1545 — Om denna utgåva | Common Root
description=Luthers Ausgabe letzter Hand: Wittenbergbibeln från 1545, den sista utgåvan Martin Luther själv granskade, och den text som blev normerande efter hans död.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Inte Luthers första bibel, utan hans sista. Det Nya testamente han gjorde på Wartburg utkom 1522 och hela bibeln 1534; han fortsatte revidera i ännu ett decennium, och den utgåva Hans Lufft tryckte i Wittenberg 1545 är den sista Luther själv förde till slut. På tyska kallas den Ausgabe letzter Hand, den sista handens utgåva. Han dog i februari därpå, och denna text blev det mått mot vilket senare Lutherbiblar ställdes.
hero.2=Han arbetade från grundtexterna och inte från latinet: Erasmus tryckta grekiska för Nya testamentet, den masoretiska hebreiskan för det Gamla, med en krets kollegor i Wittenberg att dryfta de svåra ställena med. Vad som blev av det gjorde för tyskan ungefär vad Biblia 1642 skulle göra för finskan ett sekel senare. Ett språk med många dialekter och lite fast prosa fick ett tonläge alla kunde läsa, och det moderna skriftspråket växte ur det.
hero.3=Två kedjor möts här. Luther Bibel 1912 står omedelbart ovanför denna utgåva, då den är en revision av den. Så gör också Biblia 1642, tre steg upp i den finska linjen, eftersom Åbokommittén arbetade med Luther uppslagen. Under den når stegen sin botten — Textus Receptus för grekiskan, Westminster Leningrad Codex för hebreiskan — och dessa steg är fyllda och inte märkta med ≈, eftersom Erasmus grekiska och den masoretiska hebreiskan är vad Luther faktiskt översatte från och inte vittnen insatta i efterhand.

