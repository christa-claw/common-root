title=Çince Birlik Çevirisi, 1919 metni — Bu Baskı Hakkında | Common Root
description=Çince Birlik Çevirisi'nin 1919'da ilk basıldığı haliyle, eski karakter biçimleri ve özgün noktalamayla, Çince Vikikaynak tarafından yazıya geçirilmiş, dipnotlarıyla birlikte metni.
heroHeading=Çince Birlik Çevirisi — 1919 metni
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Bu, [[CUV|Çince Birlik Çevirisi]]'nin 1919'da basıldığı haliyledir: misyonerlerin ve Çinli bilginlerin yirmi dokuz yıl boyunca üzerinde çalıştığı ve o yılın yazı biçimleriyle kayda geçirilen Mandarince İncil. Bu okuyucudaki diğer Birlik Çevirisi, bugün okunduğu haliyle metindir, modern noktalama ve modern karakter seçimleriyle. Bu baskı ise 1919 sayfasını korur.
hero.2=Farkı karakterlerde görebilirsiniz. 1919 metni, sonraki baskıların bıraktığı biçimleri kullanır — bugünkü baskılarda 為 olan yerde 爲, ayrıca 愼, 册, 槪 — ve baştan sona geleneksel karakterlerle basılmıştır. Noktalaması, 1919 baskısından aktarıldığı gibidir, sonraki baskıların modern noktalaması değildir. 1919 kitabının art arda gelen ayetleri tek bir parça olarak bastığı yerlerde bu baskı da aynısını yapar: ayet numaralandırması korunur ve metin dizinin ilk ayetinde yer alır.
hero.3=Metin, Çince Vikikaynak tarafından hazırlanan yazıya geçirmeye dayanır ve Shen baskısıdır (神版), burada Tanrı 上帝 değil 神'dir. 1919 kitabının dipnotları korunmuştur ve bu okuyucuda ait oldukları ayetlere ilişkin notlar olarak görünür.
hero.4=Bu, tarihi ve kökeni bilinen bir metinden Çince bir İncil basılabilsin diye eklenmiştir. 1919 baskısı çok uzun zamandır telif hakkından çıkmıştır. Onu izleyen, 1988 ve sonrasının noktalamalı metinleri ayrı bir meseledir; bu yüzden ikisi birbirinden ayrı tutulur.

