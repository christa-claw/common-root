title=Biblia en Español Sencillo — इस संस्करण के बारे में | Common Root
description=Biblia en Español Sencillo: AudioBiblia.org द्वारा 2018 से प्रकाशित सरल स्पेनी बाइबिल, जो पढ़ी जाने जितनी ही सुनी जाने के लिए लिखी गई और ऐसी अनुज्ञप्ति के साथ दी गई कि कोई भी इसकी नकल कर सके।
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=चार शताब्दियों तक स्पेनी में प्रोटेस्टेंट बाइबिल व्यवहार में एक ही पुस्तक रही, बस क्रमशः संशोधित होती हुई: कासियोदोरो दे रेइना का 1569 का अनुवाद, जैसा सिप्रियानो दे वालेरा ने उसे 1602 में संशोधित किया, और उसके बाद रेइना-वालेरा संस्करणों की लंबी शृंखला। Biblia en Español Sencillo उनमें से नहीं है। यह एक नया अनुवाद है, आज की स्पेनी में और जानबूझकर सरल, जिसे AudioBiblia.org प्रकाशित करता है — नया नियम भजन संहिता और नीतिवचन के साथ 2018 में, पुराना नियम अक्टूबर 2019 में पूरा। अनुवाद का श्रेय इर्मा फ़्लोरेस को दिया जाता है, और इसके प्रकाशक इसे रूढ़िवादी और सुसमाचारवादी बताते हैं।
hero.2=इसे अलग करती है इसकी उत्पत्ति। यह एक श्रव्य-बाइबिल सेवाकार्य की कृति है, और पाठ तथा अध्याय-दर-अध्याय की पूरी रिकॉर्डिंग साथ-साथ तैयार हुए, न कि एक को दूसरे से पढ़कर। दोनों के लिए घोषित उद्देश्य एक ही था: ऐसी बाइबिल जो समझने में सहज हो और जिसे स्वतंत्र और वैध रूप से नकल कर बाँटा जा सके। यह दूसरा आधा हिस्सा गौण नहीं है। अनुवाद पर प्रकाशक के आरक्षित अधिकारों के बजाय Creative Commons Attribution अनुज्ञप्ति है, जो AudioBiblia.org और इर्मा फ़्लोरेस को श्रेय देती है — यही कारण है कि पूरा पाठ इस संग्रह में रह सकता है और इसमें रखी किसी भी अन्य कृति के बगल में आयत-दर-आयत रखा जा सकता है।
hero.3=इस पाठक में यह चार स्पेनी संस्करणों में से एक है। अंतरफलक को स्पेनी पर रखने पर पाठक फिर भी रेइना-वालेरा 1909 ही खोलता है; यह वह संस्करण है जिस पर आप स्वयं जाते हैं। वंश-पायदानों में भी इसका बर्ताव अलग है। चूँकि यह एक ताज़ा अनुवाद है, इस संग्रह की किसी कृति का संशोधन नहीं, इसका कोई मूल अभिलिखित नहीं है — इसलिए Biblia en Español Sencillo के किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है, न कि, जैसा अंग्रेज़ी शृंखला में होता है, उसी पुस्तक के किसी पुराने संस्करण पर। इसके बजाय इसे दूसरे स्तंभ में रेइना-वालेरा 1909 के सामने रखिए, और देखने योग्य बात इन दोनों शैलियों के बीच की दूरी है।

