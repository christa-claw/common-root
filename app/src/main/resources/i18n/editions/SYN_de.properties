fact.13.value=Die vollständige Bibel — jedes Kapitel beider Testamente — vorgelesen von Microsoft Azures neuronaler Text-zu-Sprache-Stimme ru-RU-DmitryNeural, kapitelweise statt versweise synthetisiert, damit die Prosa ihren natürlichen Satzrhythmus behält.
fact.14.label=Einschränkungen der Audioausgabe
fact.14.value=Maschinell erzeugt, keine menschliche Lesung, daher wurde die Aussprache von Namen und Fachbegriffen redaktionell nicht geprüft; die Lesezeile folgt dem Text und hebt jeden Vers nur im Anzeigemodus „Verse“ hervor — in den anderen Modi läuft das Audio weiter, nur ohne Hervorhebung.
