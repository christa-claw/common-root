title=Synodalübersetzung — Über diese Ausgabe | Common Root
description=Die russische Synodalübersetzung von 1876: 1813 von der Russischen Bibelgesellschaft begonnen, von den vier orthodoxen theologischen Akademien unter Metropolit Filaret vollendet, und bis heute die Bibel, die die meisten russischsprachigen Menschen schlicht „die Bibel“ nennen.
heroHeading=Synodalübersetzung
readerHref=/reader?c1.src=syn

hero.1=Das Vorhaben begann 1813, als die neu gegründete Russische Bibelgesellschaft mit Unterstützung von Zar Alexander I. eine russische Übersetzung in Angriff nahm, die neben der kirchenslawischen Bibel stehen sollte, nicht an ihre Stelle treten. Innerhalb weniger Jahre erschien ein Neues Testament. Konservative Geistliche sahen in einer Bibel in der gesprochenen russischen Sprache eine Bedrohung für die Autorität des kirchenslawischen Textes, und 1826 löste Nikolaus I. die Gesellschaft auf und stoppte die Arbeit für drei Jahrzehnte.
hero.2=Die Übersetzung wurde erst unter Alexander II. wieder aufgenommen. 1858 genehmigte der Heilige Synod eine neue russische Fassung und übertrug die Arbeit den theologischen Akademien von Moskau, Sankt Petersburg, Kasan und Kiew, mit Metropolit Filaret (Drosdow) von Moskau als leitendem und abschließendem Redakteur. Das Neue Testament, übersetzt aus dem griechischen Drucktext, der als Textus receptus bekannt ist, erschien 1862. Das Alte Testament war der schwierigere Streitpunkt: Filaret drängte darauf, hinter den kirchenslawischen Text auf das Hebräische selbst zurückzugehen, wogegen sich Geistliche wehrten, die am griechisch begründeten kirchenslawischen Text festhielten, und die förmliche Erlaubnis des Synods, aus dem masoretischen Text zu übersetzen, kam erst im selben Jahr 1862 — da war der größte Teil des Alten Testaments ohnehin schon auf dieser Grundlage übersetzt.
hero.3=Die vollständige Bibel — Altes und Neues Testament erstmals in diesem neuen Russisch statt im Kirchenslawischen unter einem Einband vereint — erschien 1876 in der Synodaldruckerei, von der der gebräuchliche Name der Übersetzung stammt. Ihr Altes Testament kam nicht rein hebräisch heraus: Wo die Septuaginta, die die kirchenslawische Tradition bewahrt hatte, vom masoretischen Text abwich, wurde die griechische Lesart oft trotzdem beibehalten, meist als Variante in Klammern, sodass das fertige Buch der griechischen Bibel hinter dem älteren kirchenslawischen Text noch immer wirklich verpflichtet ist.
hero.4=Seitdem hatte sie keinen ernsthaften Rivalen mehr. Orthodoxe, katholische, baptistische und andere protestantische Leser in Russland greifen alle zu einer Form desselben Textes, und ihr Stil hat das literarische Russisch ebenso geprägt wie die King-James-Bibel das Englische. In diesem Korpus umfasst sie 66 Bücher, den protestantischen Kanon statt des umfassenderen orthodoxen, und sie ist die einzige russische Bibel hier, sodass eine russische Oberfläche mit ihr öffnet.

