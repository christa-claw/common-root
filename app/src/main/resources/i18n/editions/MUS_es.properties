title=Sahih Muslim — Acerca de esta edición | Common Root
description=Sahih Muslim: junto con Sahih al-Bukhari forma los Sahihayn, las dos colecciones que el islam suní sitúa justo después del Corán; Muslim ibn al-Hajjaj lo reunió a partir de hadices recopilados en la península arábiga, Egipto, Irak y Siria, admitiendo solo aquellos con una cadena de transmisores fiables sin interrupción.
heroHeading=Sahih Muslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi nació en Nishapur, en la provincia abasí de Jorasán (en el actual noreste de Irán); las fuentes difieren sobre el año, dando 202, 204 o 206 d. H. (hacia 817–822 d. C.). Viajó por la península arábiga, Egipto, Irak y Siria para recoger hadices de los eruditos de cada lugar, y después se asentó de nuevo en su ciudad natal, donde conoció a al-Bukhari, estudió con él y siguió siendo su amigo el resto de su vida. Según al-Jatib al-Bagdadi, emprendió la obra a petición de un alumno, Ahmad ibn Salama al-Naysaburi; su título original, al-Musnad al-Sahih al-Mukhtasar, suele abreviarse, como el de al-Bukhari, en Sahih Muslim. Murió en Nishapur en 261 d. H. (875 d. C.) y fue enterrado en su suburbio de Nasarabad.
hero.2=Solo admitía un hadiz cuando su cadena de transmisión llegaba sin interrupción hasta un compañero de Mahoma, pasando en cada eslabón por al menos dos transmisores fiables; clasificaba a los transmisores en tres niveles según la memoria y el carácter, y dejaba de lado a quienes tenían la honradez cuestionada. Su comentarista al-Nawawi destacó un cuidado adicional: Muslim, escribió, sitúa cada hadiz en un único lugar apropiado junto con todas sus cadenas y variantes de redacción, en vez de dejarlas dispersas — una presentación que comentaristas posteriores han contrastado con la práctica de [[BUK|Sahih al-Bukhari]] de colocar por separado las distintas formulaciones de un hadiz, cada una bajo el capítulo cuyo punto ilustra.
hero.3=Cuántos hadices contiene en realidad el libro depende, como en [[BUK|Sahih al-Bukhari]], de quién cuenta y cómo se tratan las repeticiones. Kâtip Çelebi y Siddiq Hasan Khan llegaron ambos a 7.275; Muhammad Fu'ad Abd al-Baqi, contando sin repetición, a 3.033; Mashhur ibn Hasan Al Salman a 7.385, o 7.395 contando los diez hadices de la propia introducción de Muslim; otras estimaciones sitúan el total entre unos 5.500 y 7.500. Al-Jawzaqi contó 2.326 hadices compartidos, casi palabra por palabra, con Sahih al-Bukhari. El número propio de este corpus es otro más: 57 libros y 7.563 hadices numerados, que es simplemente la forma de la edición digital de la que se tomó, sin pretender reproducir con exactitud ninguna numeración impresa concreta.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-muslim de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe para poder leer ambos como pareja — la misma disposición de acompañamiento que este corpus usa para [[BUK|Sahih al-Bukhari]] y para sus traducciones del Corán. De qué traducción al inglés publicada desciende este archivo no se ha determinado por parte de este corpus, por lo que su licencia se marca como en revisión y no directamente como de dominio público; el árabe de arriba no tiene esa incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=árabe clásico, con una traducción al inglés que se muestra bajo cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi (n. 202–206 d. H. / h. 817–822 d. C. – m. 261 d. H. / 875 d. C.)
fact.3.label=Título completo
fact.3.value=al-Musnad al-Sahih al-Mukhtasar — abreviado habitualmente como Sahih Muslim
fact.4.label=Compilado
fact.4.value=Hadices recopilados en la península arábiga, Egipto, Irak y Siria; el libro mismo terminado en Nishapur, Jorasán, a petición de un alumno
fact.5.label=Método
fact.5.value=Admite un hadiz solo con una cadena ininterrumpida de al menos dos transmisores fiables en cada eslabón hasta un compañero de Mahoma; transmisores clasificados en tres niveles de fiabilidad, excluidos los de honradez discutida
fact.6.label=Posición
fact.6.value=segundo de los Seis Libros del islam suní (Kutub al-Sitta); junto con [[BUK|Sahih al-Bukhari]] forma «los Sahihayn», las dos colecciones situadas en autoridad inmediatamente después del Corán; la mayoría de los eruditos sitúa la colección de al-Bukhari en su conjunto por encima de esta
fact.7.label=Número de hadices
fact.7.value=las cifras van de 3.033 sin repetición (Abd al-Baqi) a 7.275–7.395 con repetición, según el método de recuento; las ediciones impresas difieren tanto en la numeración de capítulos como en la de hadices
fact.8.label=En este corpus
fact.8.value=57 libros y 7.563 hadices numerados — la forma propia del conjunto de datos de origen, no una reproducción de ninguna numeración impresa concreta
fact.9.label=Traducción al inglés
fact.9.value=tomada de la edición eng-muslim de fawazahmed0/hadith-api, mostrada como acompañamiento bajo el árabe; de qué traducción impresa desciende aún no se ha confirmado por parte de este corpus
fact.10.label=Licencia
fact.10.value=el matn árabe es el texto clásico de dominio público; la licencia de la traducción al inglés sigue en revisión
