title=مخطوطة لينينغراد — عن هذه الطبعة | Common Root
description=مخطوطة لينينغراد: أقدم مخطوطة كاملة باقية للكتاب المقدّس العبري، نُسخت سنة 1008 م، وما زالت النص الأساس وراء معظم ترجمات العهد القديم الحديثة.
heroHeading=مخطوطة لينينغراد
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=هذه أقدم مخطوطة كاملة باقية للكتاب المقدّس العبري. نسخها كاتب اسمه صموئيل بن يعقوب، كان يعمل في القاهرة القديمة، وأرّخ عمله بنفسه في حاشية آخر المخطوطة إلى سنة 1008 م.
hero.2=لم يكن صموئيل بن يعقوب يبتكر نصًّا، بل كان يحفظ نصًّا. عمل ضمن تقليد أسرة بن أشير، أعلى المراجع في «المسورة» — ذلك النظام الدقيق من علامات التشكيل وعلامات التنغيم والحواشي الهامشية الذي أمضى العلماء اليهود قرونًا في صقله لتثبيت نطق الكتاب المقدّس العبري وحمايته من التحريف. وقد بقيت مخطوطة أقدم من تقليد بن أشير، وربما أرفع سندًا — هي مخطوطة حلب — غير أن معظم قسم التوراة فيها فُقد سنة 1947. ومخطوطة لينينغراد نفيسة لهذا السبب بالذات: إنها كاملة، وقديمة بما يكفي لتقف عند منبع ذلك التقليد.
hero.3=أخذت اسمها من المدينة التي استقرّت فيها لاحقًا: لينينغراد، وهو اسم سانت بطرسبرغ يوم دخلت المخطوطة في البحث الغربي، واسم لازمها حتى بعد أن استعادت المدينة اسمها سنة 1991. واليوم تقوم عليها «بيبليا هيبرايكا شتوتغارتنسيا»، الطبعة العلمية المعيارية للكتاب المقدّس العبري — ما يعني أن كل ترجمة حديثة للعهد القديم تقريبًا، وبكل لغة تقريبًا، تعود إلى نسخ متأنٍّ قام به كاتب قاهري واحد في القرن الحادي عشر، عرف قُرّاؤها اسمه أم لم يعرفوه.

