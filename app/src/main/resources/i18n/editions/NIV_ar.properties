title=New International Version — عن هذه الطبعة | Common Root
description=New International Version: الكتاب المقدّس الإنجليزي الذي يفتح عليه هذا القارئ افتراضيًا، ترجمته لجنة ترجمة الكتاب المقدّس عن اللغات الأصلية مباشرةً، واكتمل لأول مرة سنة 1978 — وهنا بنصّه الصادر سنة 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=بدأت بعدم رضا طائفة واحدة. سنة 1955 ضغط رجل الأعمال هوارد لونغ، مع القسّ بيتر دي يونغ، على كنيسة Christian Reformed Church لتصدر كتابًا مقدّسًا بإنجليزية معاصرة، وفي 1957 أقرّت الكنيسة لجنة لدراسة الفكرة. وكانت رابطة National Association of Evangelicals قد بدأت مشروعًا مشابهًا خاصًا بها في نفس السنة. فاجتمعت الهيئتان: فأرسلت لجنة مشتركة سنة 1964 دعواتٍ إلى مؤتمر ترجمة، عُقد في أغسطس 1965 في Trinity Christian College بمدينة Palos Heights في ولاية إلينوي، وقرّر تشكيل "لجنة دائمة من خمسة عشر" لمتابعة العمل. وأصبحت هذه اللجنة الدائمة لجنة ترجمة الكتاب المقدّس (Committee on Bible Translation). وفي 1967 تولّت New York Bible Society — المعروفة اليوم باسم Biblica — رعاية المشروع واستأجرت العلماء الذين قاموا بالترجمة.
hero.2=لا شيء هنا ينحدر من كتاب مقدّس إنجليزي أقدم. فبينما تشكّل King James Version و Revised Version و American Standard Version و World English Bible في هذه المجموعة سلسلة واحدة من المراجعات، تُرجمت New International Version من جديد مباشرةً عن العبرية والآرامية واليونانية: العهد القديم عن النص العبري الماسوريّ، مع الرجوع إلى مخطوطات البحر الميت والسبعينية وشواهد قديمة أخرى؛ والعهد الجديد عن النص اليوناني النقدي المنتخب الذي تمثّله طبعات United Bible Societies و Nestle-Aland — لا عن النص المتلقّى الذي تقوم عليه هنا كتاب جنيف المقدّس و King James Version. ونمت لجنة الخمسة عشر، على مدى نحو عشر سنين، إلى مشروع يستعين بأكثر من مئة عالم من عدّة بلاد ناطقة بالإنجليزية وطوائف كثيرة. وكان هدفهم المعلَن ترجمة تحافظ على دقّة الأصل من غير أن تُقرأ كنسخة حرفية كلمة بكلمة منه — توازنٌ يُصنَّف عادة ضمن التكافؤ الدينامي، بين الترجمة الحرفية الصارمة والصياغة الحرّة المرسلة.
hero.3=ظهر العهد الجديد أولًا، سنة 1973؛ وتبعه الكتاب المقدّس كاملًا في 27 أكتوبر 1978؛ وجاءت مراجعة خفيفة سنة 1984. وتغيّر النصّ تغييرًا أعمق سنة 2011، حين حلّت مراجعة أوسع محلّ طبعة 1984 وطبعة Today's New International Version لعام 2005 معًا، وأحالت كليهما إلى التقاعد لصالح النصّ الواحد الذي ظلّ مستقرًا منذ ذلك الحين. وهذا نصّ 2011 هو ما تحمله هذه المجموعة — وهي السنة التي تظهر على بطاقة الفهرس. وتحتفظ Biblica, Inc. بحقوق النشر طوال الوقت؛ وتنشره Zondervan في الولايات المتحدة و Hodder & Stoughton في المملكة المتحدة.
hero.4=مكانتها في هذا القارئ مركزيّة بطريقة هادئة. اضبط الواجهة على الإنجليزية، وهذا ما يُفتح — فصفحتا King James Version و Revised Version في هذه المجموعة تقولان ذلك بنفسيهما، مشيرتين إلى هذه الطبعة بوصفها تلك التي يُنتقَل عنها لا تلك التي يُستقَرّ عليها. وبما أنّها لم تراجع شيئًا، لا تسجّل المجموعة لها أصلًا: فتح درجة من درجات النسب تحت آية من New International Version يُنزل مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈، كما يحدث مع Berean Standard Bible — مع فارق واحد يستحق أن يُعرف. فشاهد تلك الأرضية اليوناني هو النص المتلقّى، والنص المتلقّى ليس ما تُرجم عنه العهد الجديد لهذه الترجمة في الحقيقة — فالأرضية تقوم بديلاً عن "اليونانية الأصلية" بعامّة، لا سجلًا للنصّ الذي عملت عليه هذه اللجنة بعينها. وثمّة أمر آخر يميّزها عن أكثر جاراتها الإنجليزية: فهي مرخّصة لا حرّة التداول، في وضعٍ واحد مع New American Standard Bible 2020، بينما تُنسخ Berean Standard Bible وكتاب جنيف المقدّس و King James Version و Revised Version و World English Bible بحريّة تامّة.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الإنجليزية
fact.2.label=مَن أمر بها
fact.2.value=لجنة مشتركة من Christian Reformed Church و National Association of Evangelicals، عقدت مؤتمرًا في Trinity Christian College بـ Palos Heights في إلينوي، في أغسطس 1965
fact.3.label=أنجزها
fact.3.value=لجنة ترجمة الكتاب المقدّس — خمسة عشر عالمًا في البداية، توسّعت فيما بعد إلى أكثر من مئة عالم من عدّة بلاد ناطقة بالإنجليزية وطوائف كثيرة، على مدى نحو عشر سنين
fact.4.label=العهد القديم عن
fact.4.value=النص العبري الماسوريّ، مع الرجوع إلى مخطوطات البحر الميت والسبعينية وشواهد قديمة أخرى
fact.5.label=العهد الجديد عن
fact.5.value=النص اليوناني النقدي المنتخب الذي تمثّله طبعات United Bible Societies و Nestle-Aland — لا [[TR|النص المتلقّى]] الذي تقوم عليه هنا [[GNV|كتاب جنيف المقدّس]] و [[KJV|King James Version]]
fact.6.label=نوع الترجمة
fact.6.value=توازن بين دقّة الترجمة الحرفية والإنجليزية الطبيعية الاصطلاحية، من غير التزام بأحد الطرفين — تُصنَّف عادة ضمن التكافؤ الدينامي؛ ترجمة جديدة عن اللغات الأصلية، لا مراجعة لتقليد King James
fact.7.label=نُشر
fact.7.value=العهد الجديد سنة 1973؛ والكتاب المقدّس كاملًا في 27 أكتوبر 1978؛ ومراجعة خفيفة سنة 1984؛ والنصّ الحالي، المراجَع مراجعة أعمق، سنة 2011، الذي أحال إلى التقاعد طبعة 1984 وطبعة Today's New International Version لعام 2005 معًا
fact.8.label=الناشر
fact.8.value=Biblica, Inc.، التي تحتفظ بحقوق النشر؛ وتنشره Zondervan في الولايات المتحدة، و Hodder & Stoughton في المملكة المتحدة
fact.9.label=الترخيص
fact.9.value=مرخّصة، لا حرّة التداول. يجوز اقتباس حتى 500 آية من غير إذن خطّي، بشرط ألّا تشكّل سفرًا كاملًا من الكتاب المقدّس وألّا تزيد عن 25% من العمل، مع ذكر حقوق النشر؛ وما زاد عن ذلك يحتاج إذن Biblica
fact.10.label=في هذه المجموعة
fact.10.value=الكتاب المقدّس الذي تفتح عليه الواجهة الإنجليزية افتراضيًا — تقول صفحتا [[KJV|King James Version]] و [[RV|الترجمة المنقَّحة]] هنا كلتاهما أنّهما ليستاه. ولا أصل مسجَّل لها في درجات النسب: فتح درجة تحت آية من NIV يُنزل مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈، كما يحدث مع [[BSB|Berean Standard Bible]] — إلّا أنّ شاهد تلك الأرضية اليوناني هو [[TR|النص المتلقّى]]، وهو ليس النصّ الذي تُرجم عنه العهد الجديد لهذه الترجمة في الحقيقة. وبوصفها مرخّصة لا حرّة التداول، في وضعٍ واحد مع New American Standard Bible 2020، فإنّها تنفرد عن جاراتها الحرّة التداول مثل [[KJV|King James Version]] و [[RV|الترجمة المنقَّحة]] و [[WEB|World English Bible]]
