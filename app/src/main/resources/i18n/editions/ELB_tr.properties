title=Elberfelder 1905 — Bu Baskı Hakkında | Common Root
description=Elberfeld Kutsal Kitabı: 1855'te John Nelson Darby, Carl Brockhaus ve Julius Anton von Poseck'in başlattığı Almanca çeviri; Textus Receptus'tan ayrılan ilk Almanca çevirilerden biri — burada 1905 baskısıyla.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Ad bir yerin adıdır. Elberfeld, Wupper vadisinde bir kenttir, 1929'dan beri Wuppertal'in bir parçasıdır ve işin büyük bölümü orada yapıldı. Üç kişi başlattı: John Nelson Darby, Carl Brockhaus ve Julius Anton von Poseck; üçü de Kardeşler hareketinin Alman koluna bağlıydı. Yeni Antlaşma 1855'te, Mezmurlar 1859'da, Eski Antlaşma 1871'de çıktı — kimsenin adı altında değil, özgün metinden “bazı Hristiyanlar” tarafından çevrilmiş olarak yayımlandılar.
hero.2=Onu ayıran, altındaki Yunanca'ydı. O sırada dolaşımdaki hemen her Almanca Kutsal Kitap hâlâ Textus Receptus üzerinde duruyordu; bu, ondan koptu ve Codex Sinaiticus ile Codex Vaticanus'un okuyuşlarını, o elyazmaları on dokuzuncu yüzyılın ortalarında yayımlandıkça içine aldı. Eski Antlaşma Masoretik İbraniceden yapıldı. Çeviri ilkesi zarafetten önce kesinlikti: İbranice ile Yunanca'yı katılaşacak kadar yakından izleyen bir Almanca, anlam için eklenen her sözcük eklenmiş olarak işaretli ve hiç bölüm başlığı yok — gerekçesi, özgün metinlerde de bulunmadığıydı. Altındaki söze en yakın duran Almanca sürümler arasında hâlâ sayılır.
hero.3=Bu, 1905 baskısıdır; Fraktur yerine Latin harfleriyle dizilen ilk baskı. O puntonun küçüklüğünden ötürü Perlbibel diye anılır. Yeni bir çeviri değildi. Rudolf Brockhaus'un 1932'deki ölümüne dek Elberfelder baskıdan baskıya gözden geçirildi ve düzeltildi — Eski Antlaşma'dan Alfred Rochat, Yeni'den Emil Dönges sorumluydu — dolayısıyla buradaki bir tarih, bitmiş bir baskıyı değil, hareket hâlindeki bir metnin içindeki bir basımı adlandırır. Bugün Elberfelder adıyla satılan ise çoğunlukla yine başka bir şeydir: aynı hareketten bir kurul onu gözden geçirmeye yirmi beş yıl harcadı ve sonucu 1975 ile 1985'te yayımladı. O gözden geçirme “Jehova”yı Eski Antlaşma'dan çıkarıp yerine “HERR” koydu. Buradaki metin hâlâ “Jehova” basar; bu da onu American Standard Version'ın ve Darby'nin kendi Fransızca Kutsal Kitabı'nın yanına yerleştirir.
hero.4=Bu derlemedeki yeri biraz kenarda kalır. Almanca için okuyucuda seçilmiş bir varsayılan baskı yoktur, bu yüzden Almanca arayüz katalogdaki ilk Almanca Kutsal Kitabı açar ve o da budur — her iki Luther Kutsal Kitabı'nın önünde, yalnızca alfabetik sıra yüzünden ve başka hiçbir sebeple. Soy basamaklarında tek başına durur. İki Luther bir zincir kurar: 1912, 1545'ten gözden geçirilmiştir ve 1545 Yunanca ile İbranice üzerine oturur; Elberfelder'in ise kayıtlı bir kaynağı yoktur, çünkü sürekli düzeltmelerle içinden çıktığı 1871 Elberfelder'i bu derlemede bulunmaz. Bir Elberfelder ayetinin altındaki basamak bu yüzden doğruca ≈ işaretli özgün dil tabanına iner — oysa bir sütun ötede duran Fransızca Darby Kutsal Kitabı buradaki en yakın akrabasıdır.

