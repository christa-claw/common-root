fact.13.label=Bu derlemede
fact.13.value=Almanca arayüzün açtığı Kutsal Kitap: Almanca için seçilmiş bir varsayılan baskı yoktur, bu yüzden okuyucu katalogdaki ilk Almanca Kutsal Kitabı alır ve ELB, [[LUT1545|Luther 1545]] ile [[LUT1912|Luther 1912]]'nin önüne yalnızca kısaltması yüzünden geçer. Soy basamaklarında kayıtlı bir kaynak yoktur — sürekli düzeltmelerle içinden çıktığı 1871 Elberfelder'i derlemede bulunmaz — dolayısıyla bir basamak özgün dil tabanına açılır. İki yandan da bir yıl taşımaz: katalog kartı yıl sütununu boş bırakır, elle tutulan basamak yılları listesi de onu tanımaz; böylece ELB için bir basamak etiketi kısaltmadan başka bir şey göstermez — sessiz durum. Gürültülü olan [[DRA|Douay-Rheims]]'tir; orada iki liste birbiriyle açıkça çelişir
