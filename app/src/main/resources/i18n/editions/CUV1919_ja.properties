title=和合本、1919年本文 — この版について | Common Root
description=和合本が1919年に初めて刊行された当時の本文で、当時の字形と原本の句読点を保ち、中文ウィキソースによって転写され、その脚注を含む。
heroHeading=和合本 — 1919年本文
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=これは1919年に印刷された当時の[[CUV|和合本]]である——宣教師と中国人学者が二十九年をかけて取り組み、その年の字形で定められた官話訳聖書である。この読書環境にあるもう一つの和合本は、今日読まれている本文であり、現代の句読点と現代の字形選択を用いている。こちらは1919年のページを保っている。
hero.2=その違いは字形に見える。1919年の本文は、後の印刷が捨てた字形を用いている——今日の版で為となっている箇所が爲であり、ほかに愼、册、槪もそうである——そして全体が繁体字で組まれている。句読点も1919年の印刷から転写したままであり、後の版の現代的な句読点ではない。1919年の原本が連続する節を一つの段落として印刷している箇所では、この版もそれに従う——節番号はそのまま保たれ、本文はその段落の最初の節に置かれる。
hero.3=本文は中文ウィキソースによる転写に基づき、神版（神版）であって、そこでは神は神であり、上帝ではない。1919年版の脚注はそのまま保たれ、この読書環境では該当する節への注として表示される。
hero.4=これが加えられたのは、日付と出自の分かっている本文から中国語聖書を印刷できるようにするためである。1919年の印刷はとうに著作権が切れている。それに続く句読本——1988年以降のもの——は別の問題であり、それゆえ両者は区別して保たれている。

