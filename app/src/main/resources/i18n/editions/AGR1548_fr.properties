title=Agricola 1548 — À propos de cette édition | Common Root
description=Le finnois de Mikael Agricola : le Nouveau Testament de 1548, le Psautier de 1551 et les prophètes — la première Écriture imprimée en finnois, et le commencement du finnois écrit.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Avec nos remerciements à celles et ceux qui ont envoyé des corrections à cette page.

# The narrative, one paragraph per key, in order.
hero.1=Le plus ancien finnois imprimé qui soit. Quand Mikael Agricola publia Se Wsi Testamenti en 1548, le finnois n'avait presque jamais été composé en caractères — son propre abécédaire, paru quelques années plus tôt, fut tout simplement le premier livre finnois. Entre les deux parut encore le livre de prières de 1544, un ouvrage considérable qui contenait déjà des traductions de psaumes. Pour imprimer l'Écriture, il lui fallut d'abord décider comment la langue s'écrirait, et ces décisions — l'orthographe, les emprunts, la cadence — sont le commencement du finnois écrit. Le Nouveau Testament lui coûta, à lui et à son cercle de Turku, plus d'une décennie ; le Psautier suivit en 1551, puis des choix de prophètes et des livres de Moïse en 1551 et 1552. Le sien fut pourtant le premier finnois imprimé, non le premier finnois écrit : quatre manuscrits — le Codex Westh, le codex B 28 d'Uppsala, le missel de Kangasala et le fragment d'Uppsala — portent des passages bibliques en finnois, et Kauko Pirinen a montré en 1988, en les comparant à leurs sources suédoises, qu'une partie en est plus ancienne que tout ce qu'Agricola a imprimé, peut-être écrite dès les années 1530.
hero.2=Il n'a jamais traduit la Bible entière, et ce lecteur ne prétend pas le contraire. Le Nouveau Testament et les 150 psaumes sont complets ; les prophètes et les livres de Moïse figurent en extraits. Ce qu'il a rendu ailleurs est ici aussi : son livre de prières de 1544 et ses Käsikirja et Messu de 1549 portent leur propre texte biblique — dont les chapitres de la Genèse imprimés sous le titre "Genesist mutomat Lughut" — et 685 versets en proviennent. Ils ne servent que là où les volumes scripturaires n'ont pas de verset à cette adresse, et seulement là où le texte se suit au lieu de tenir en une citation isolée au sein d'une prière. La Genèse est donc bien là, en partie : chapitres 1–4, 22, 28 et 32. Les Juges, Ruth, 1 Chroniques et Esther manquent entièrement. Un Ancien Testament finnois complet dut attendre la Biblia de 1642, un barreau plus haut.
hero.3=Dans ce lecteur, Agricola est le plus ancien barreau finnois. Ouvrez un barreau sous un verset de la Biblia 1642 : son texte paraît à côté de l'allemand de Luther — les deux sources que le comité de 1642 avait réellement ouvertes. Sous Agricola lui-même, la chaîne quitte le finnois pour de bon : il travaillait sur le grec d'Érasme et sur le latin qu'Érasme imprimait en regard, sur l'allemand de Luther et sur la Vulgate. Trois d'entre eux sont consignés ici comme ses parents ; le latin d'Érasme et la Bible suédoise de Gustave Vasa de 1541, dont il se servait aussi, ne sont pas dans ce corpus. Le texte est celui du corpus VKS de Kotus, dans la graphie de l'impression de 1548 : "Algusa oli Sana / Ja se Sana oli Jumalan tykene". L'Écriture en suédois était imprimée depuis 1526, année où parut le Nouveau Testament suédois : une version suédoise lui était donc accessible dès le début.

