title=Kirkkoraamattu 1933/38 — Über diese Ausgabe | Common Root
description=Kirkkoraamattu 1933/38: die finnische Kirchenbibel, neu aus dem Hebräischen und Griechischen übersetzt und in zwei Hälften angenommen, 1933 und 1938, nachdem ein Ausschuss rund siebzig Jahre daran gearbeitet hatte.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=Der Name sind zwei Jahreszahlen, denn das Buch kam in zwei Hälften. Die Evangelisch-Lutherische Kirche Finnlands nahm das Alte Testament 1933 an und das Neue Testament 1938, und auf Finnisch heißt sie seither die Kirchenbibel von 1933/38. Diese Jahreszahlen am Ende verbergen, wie weit zurück der Anfang lag: der Übersetzungsausschuss war 1861 eingesetzt worden. Rund siebzig Jahre und mehr als eine Übersetzergeneration trennen den Auftrag von der fertigen Bibel.
hero.2=Was der Ausschuss hervorbrachte, war eine Neuübersetzung und keine Revision. Er arbeitete aus dem Hebräischen des Alten und dem Griechischen des Neuen Testaments — nicht über lateinische, deutsche oder schwedische Zwischenglieder und nicht aus der finnischen Bibel, die bereits in Gebrauch war. Und doch war sie bewusst deren Nachfolgerin, der Biblia 1776, die anderthalb Jahrhunderte lang der Text der Kirche gewesen war, und sie behielt viel vom Wortschatz und Fall des älteren Buches. Dieses Erbe ist der Grund, warum eine 1938 fertiggestellte Bibel ihren ersten Lesern schon altertümlich klang und warum sie noch immer den feierlichen Ton der finnischen Schrift trägt. Sie blieb bis 1992 die offizielle Kirchenbibel.
hero.3=In diesem Leser tut sie zweierlei. Stellt man die Oberfläche auf Finnisch, öffnet sich diese Ausgabe — die Ordnung des Katalogs selbst gäbe einem stattdessen die Biblia 1776, die finnische Voreinstellung ist also eine bewusste Wahl und kein Zufall des Alphabets. Sie ist außerdem die oberste Sprosse der finnischen Abstammungskette: Öffnet man unter einem KR3338-Vers eine Sprosse, erscheint darunter die Biblia 1776. Diese Sprosse ist als Nachfolge innerhalb der Bibel einer Kirche zu lesen und nicht als Quelle, denn die Übersetzer von 1933/38 hatten das Hebräische und das Griechische vor sich, nicht den Text von 1776. Unter der Biblia 1776 läuft die Kette weiter: die Biblia von 1642, die 1776 überarbeitet, dann Agricolas Finnisch von 1548, das jener Ausschuss seinerseits überarbeitete, und Luthers Deutsch von 1545, das ihnen bei der Arbeit aufgeschlagen danebenlag. Erst darunter erreicht die Leiter das Hebräische und das Griechische.

