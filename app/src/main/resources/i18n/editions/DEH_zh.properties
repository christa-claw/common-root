fact.3.label=名称
fact.3.value=阿拉伯语称为《四十》（阿尔巴因）；2015年Turath Publishing出版了题为Forty Hadith of Shah Wali-Allah的现代英译本，译者为Safaruk Zaman Chowdhury
fact.4.label=编纂地点与时间
fact.4.value=沙阿·瓦利乌拉于1730至1731年朝觐后，在麦地那求学圣训约一年——主要师从阿布·塔希尔·库尔迪（又作库拉尼）——1732年12月16日返回德里之后
fact.5.label=方法
fact.5.value=据其英译本出版方所述，这四十则圣训每一则都是沙阿·瓦利乌拉称自己直接从本人导师处听得的圣训，连同他接受时的传述链（圣德）一并保存——这是一份个人传述记录，而非按主题或等级作出的选择
fact.6.label=地位
fact.6.value=出自印度次大陆的"四十圣训"（阿尔巴伊尼亚特）汇编中最为人知的一部；延续了这一体裁，其最早且已失传的范例归于阿卜杜拉·伊本·穆巴拉克（卒于797年），该体裁亦产生了[[NAW|纳瓦维四十圣训]]与[[QUD|四十圣训（神圣版）]]
fact.7.label=圣训数量
