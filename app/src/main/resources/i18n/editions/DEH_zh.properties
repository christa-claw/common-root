title=德赫拉维四十圣训 — 关于此版本 | Common Root
description=德赫拉维四十圣训：这位十八世纪德里学者称自己在麦地那求学一年期间直接从本人导师那里听得的四十则圣训，连同其传述链一并保存——这是出自印度次大陆同类汇编中最为人知的一部。
heroHeading=德赫拉维四十圣训
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=沙阿·瓦利乌拉·德赫拉维——全名库特布丁·艾哈迈德·伊本·阿卜杜·拉希姆·欧马里·德赫拉维——于1703年2月21日生于穆扎法尔纳加尔附近的普拉特，在德里长大，其父沙阿·阿卜杜·拉希姆曾在当地创办拉希米耶宗教学院。据说他七岁便能背诵《古兰经》全文，十五岁完成当时的通行学业，两年后接替父亲担任该学院院长。1730至1731年间，他赴麦加朝觐，随后在麦地那求学圣训约一年——主要师从阿布·塔希尔·库尔迪（又作库拉尼），并随穆罕默德·瓦夫杜拉·马利基及谢赫·塔吉丁·盖拉伊进一步求学——随后于1732年12月16日返回德里。他于1762年8月20日（希吉拉历1176年穆哈兰姆月29日）在德里去世，葬于父亲墓旁。他的其他著作包括通常被视为其最重要著作的《真主的至理证据》、《大成功》，以及记述他前往希贾兹之旅的《两圣地纪行》。
hero.2=《四十》延续了与[[NAW|纳瓦维四十圣训]]和[[QUD|四十圣训（神圣版）]]相同的"四十圣训"（阿尔巴伊尼亚特）传统——这一传统追溯至一则圣训，承诺为本民族保存四十则宗教圣训者将在审判日跻身学者之列（这则圣训本身多数批评者判定为达伊夫，即弱），以及追溯至归于阿卜杜拉·伊本·穆巴拉克（卒于797年）的最早汇编，该汇编现已失传。它与前两部作品在汇编对象上有所不同：其英译本出版方将其描述为四十则圣训，并非按主题或等级从更广泛的圣训文献中选出，而是沙阿·瓦利乌拉称自己在麦地那直接从本人导师处听得的四十则圣训，每则都连同他接受时的传述链（圣德，sanad）一并保存——这是那一年求学经历留下的个人传述记录，据其子所述，这段经历改变了他返回德里后讲学与著述的方式。
hero.3=此处的阿拉伯语文本是公有领域的古典正文（matn）。阅读器中其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-dehlawi版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]、[[TIR|提尔米济圣训实录]]、[[NAS|奈萨仪圣训集]]、[[IBM|伊本·马哲圣训集]]、[[MAL|马立克穆瓦塔]]、[[NAW|纳瓦维四十圣训]]、[[QUD|四十圣训（神圣版）]]及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

