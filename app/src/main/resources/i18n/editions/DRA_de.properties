title=Douay-Rheims 1899 — Über diese Ausgabe | Common Root
description=Die Douay-Rheims-Bibel: die englische katholische Übersetzung, 1582 in Reims und 1609–10 in Douai aus der lateinischen Vulgata gemacht, von Bischof Challoner überarbeitet, im Baltimorer Druck von 1899.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=1568 richtete eine Gruppe englischer Katholiken, viele von ihnen Oxforder, die ihre Stellen nicht länger halten konnten, unter William Allen ein Kolleg in Douai in Flandern ein. Zu seinen Zwecken gehörte, eine englische Bibel in katholische Hände zu bringen, denn die einzigen englischen Bibeln, die damals im Umlauf waren, waren protestantische und wurden im Streitgespräch verwendet. Gregory Martin begann im Oktober 1578 zu übersetzen, mit etwa zwei Kapiteln am Tag, und das Neue Testament erschien 1582 in Reims, wohin das Kolleg vorübergehend umgezogen war. Martin starb am 28. Oktober desselben Jahres, Wochen nachdem sein Neues Testament erschienen war. Das Alte Testament war zur selben Zeit fertig und blieb dann ungedruckt liegen, aus dem schlichten Grund, dass das Kolleg den Druck nicht bezahlen konnte; es kam zuletzt 1609 und 1610 in zwei Bänden heraus, als die King-James-Bibel noch zwei Jahre entfernt war.
hero.2=Was sie von jeder anderen englischen Bibel in diesem Korpus unterscheidet, ist das, woraus sie gemacht wurde. Nicht aus dem Hebräischen und dem Griechischen: aus der lateinischen Vulgata. Das Konzil von Trient hatte die Vulgata zum authentischen Text der Kirche erklärt, und die Douaier Übersetzer führten überdies an, Hieronymus habe aus Handschriften gearbeitet, die älter seien als jede ihnen zugängliche griechische Abschrift — was für das Alte Testament um 1600 kein unvernünftiger Gedanke war. Die entstandene Prosa ist schwer latinisiert, bisweilen bis zu dem Punkt, gar kein Englisch mehr zu sein: das Vaterunser bittet um „supersubstantial bread“, weil die Übersetzer ein Wort nicht einbürgern wollten, auf dem die Theologie ruhte. Das war Grundsatz, nicht Unvermögen.
hero.3=Um die Mitte des achtzehnten Jahrhunderts konnte sie fast niemand mehr lesen, und Bischof Richard Challoner überarbeitete sie zwischen 1749 und 1752 — gründlich und weitgehend in Richtung der King-James-Bibel, die damals schlicht war, wie englische Schrift klang. Jede heute als Douay-Rheims verkaufte Bibel ist Challoners Text und nicht Martins. Diese hier ist der amerikanische Druck von 1899 der John Murphy Company aus Baltimore, mit dem Imprimatur von Kardinal James Gibbons; weil dieser Druck seit Langem urheberrechtsfrei ist, wurde eben er seither gescannt, abgetippt und wiedergegeben, und er ist das, was nahezu jede digitale Douay-Rheims tatsächlich ist.
hero.4=In diesem Leser leistet sie etwas, was hier fast keine andere Ausgabe kann. Ihre verzeichnete Vorlage ist im Korpus vorhanden: Öffnet man unter einem Douay-Rheims-Vers eine Sprosse, so ist die Sprosse darunter die lateinische Vulgata selbst, der Text, aus dem sie tatsächlich übersetzt wurde, statt des mit ≈ gekennzeichneten Ursprachenbodens, auf den die meisten Ausgaben durchfallen. Genau für diesen Fall wurde der Sprossenmechanismus gebaut. Der Einfluss lief auch in die andere Richtung — das Reimser Neue Testament lag auf den Tischen der King-James-Übersetzer, und ein gutes Stück seines latinisierten Wortschatzes ging in ihre Arbeit über —, doch die Abstammungsliste führt nur förmliche Revisionslinien, und so ist diese Schuld dort nicht verzeichnet. Eine Umkehrung ist zu vermerken: Ihr Sprossen-Chip zeigt das Jahr 1899, während die Katalogkarte überhaupt kein Jahr zeigt. Die Sprossenjahre sind eine von Hand gepflegte Liste, und die Karte liest die Metadaten des Katalogs selbst; wo eine Ausgabe in der einen steht und in der anderen nicht, widersprechen sich die beiden öffentlich.
hero.5=Eine Warnung zum Kanon. Der hier verwahrte Text hat 72 Bücher, nicht die 73 einer gedruckten katholischen Bibel. Die sechs deuterokanonischen Bücher, die er führt — Tobit, Judit, 1 und 2 Makkabäer, Weisheit und Jesus Sirach —, stehen nach der Offenbarung statt an ihren katholischen Plätzen, und Baruch fehlt ganz. Das ist eine Eigenschaft des digitalen Textes, wie er eingelesen wurde, nicht des Buches von 1899, und es bedeutet, dass diese Spalte Vers für Vers richtig zu lesen ist, aber nicht dazu benutzt werden sollte, zu prüfen, was der katholische Kanon enthält.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=Englisch — die katholische Überlieferung
fact.2.label=Übersetzt aus
fact.2.value=der lateinischen Vulgata, nicht aus dem Hebräischen und Griechischen — derselben [[VUL|Vulgata]], die dieses Korpus führt
fact.3.label=Neues Testament
fact.3.value=Reims, 1582 — vor allem das Werk Gregory Martins, mit William Allen, Richard Bristow und Thomas Worthington
fact.4.label=Altes Testament
fact.4.value=Douai, 1609 und 1610, in zwei Bänden — zur selben Zeit fertig wie das Neue Testament, aber fast dreißig Jahre zurückgehalten, weil das Geld zum Drucken fehlte
fact.5.label=Überarbeitet von
fact.5.value=Bischof Richard Challoner, 1749–1752 — jedes heute als Douay-Rheims verkaufte Buch ist Challoners Überarbeitung, nicht der Text von 1582/1610
fact.6.label=Dieser Druck
fact.6.value=die amerikanische Ausgabe von 1899 der John Murphy Company, Baltimore, mit dem Imprimatur von Kardinal James Gibbons — seit Langem urheberrechtsfrei und die Fassung, die digital umläuft
fact.7.label=Inhalt hier
fact.7.value=72 Bücher: die 66 des protestantischen Kanons in protestantischer Ordnung, mit Tobit, Judit, 1 und 2 Makkabäer, Weisheit und Jesus Sirach nach der Offenbarung angehängt. Baruch fehlt, so dass diese Spalte keine verlässliche Probe auf den katholischen Kanon ist
fact.8.label=Abstammung
fact.8.value=eine der wenigen Ausgaben hier, deren verzeichnete Vorlage selbst im Korpus liegt — eine Sprosse unter einem Douay-Rheims-Vers öffnet auf [[VUL|die lateinische Vulgata]] statt auf den Ursprachenboden
fact.9.label=In diesem Korpus
fact.9.value=ihr Sprossen-Chip trägt das Jahr 1899, obwohl die Katalogkarte das Jahr leer lässt; die Sprossenjahre sind eine eigene, gepflegte Liste, und die beiden dürfen sich widersprechen
