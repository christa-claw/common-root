title=American Standard Version — Su questa edizione | Common Root
description=L'American Standard Version del 1901: l'edizione americana della Revised Version, opera di studiosi che avevano passato vent'anni a correggere per lettera la Bibbia di re Giacomo, e il ceppo della Revised Standard Version, della New American Standard Bible e della World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=L'American Standard Version nacque come impresa altrui. Quando nel 1870 la Chiesa d'Inghilterra si mise a rivedere la Bibbia di re Giacomo, invitò a parteciparvi studiosi americani, ed essi parteciparono — per corrispondenza, attraverso l'Atlantico, per quasi due decenni. Dove le due parti divergevano, la lezione del comitato britannico entrava nel testo e la preferenza americana in un'appendice, e gli americani si impegnarono a non pubblicare un'edizione propria per quattordici anni. La Revised Version inglese uscì nel 1881 e nel 1885. L'edizione americana seguì nel 1901, con le lezioni dell'appendice risalite nel testo, dove i loro curatori le avevano sempre volute.
hero.2=È una traduzione fatta da studiosi per studiosi, e si legge come tale. I revisori rimasero fedeli all'ordine delle parole ebraico e greco quanto l'inglese tollerasse, il che rende l'American Standard Version esatta e, per lunghi tratti, rigida. La sua scelta più visibile riguarda il nome divino: dove la Bibbia di re Giacomo stampava “the LORD” in maiuscoletto, l'American Standard Version stampa “Jehovah”, migliaia di volte, per tutto l'Antico Testamento. Nel Nuovo Testamento segue il greco dei revisori anziché il Textus Receptus, sicché le lezioni che i traduttori di re Giacomo avevano e che i manoscritti più antichi non hanno — fra queste la clausola trinitaria di 1 Gv 5,7 — stanno in nota o mancano.
hero.3=L'American Standard Version non divenne mai una bibbia da banco di chiesa. Divenne un ceppo. La Revised Standard Version del 1952 ne fu una revisione; lo fu anche la New American Standard Bible, presente pure in questo corpus; e lo è la World English Bible, che la portò nel pubblico dominio in grafia moderna. Per questo sta dove sta fra i pioli del lettore — al centro della catena più lunga che il corpus possieda. Si apra un piolo sotto un versetto dell'ASV e comparirà sotto di esso la Revised Version da cui fu fatta, e sotto quella la Bibbia di re Giacomo e la Bibbia di Ginevra, giù fino al fondo delle lingue originali segnato con ≈. Si apra un piolo sotto un versetto della World English Bible e si torna qui.

