title=Sahih al-Bukhari — Om denna utgåva | Common Root
description=Sahih al-Bukhari: den hadithsamling som sunnimuslimer rankar som näst mest auktoritativ efter Koranen, sammanställd av Muhammad al-Bukhari ur omkring 600 000 berättelser han granskat, med endast de som bars av en obruten kedja av tillförlitliga uppgiftslämnare.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismail al-Bukhari sammanställde denna samling till stor del vid två moskéer — den Heliga moskén i Mecka och Profetens moské i Medina — och fullbordade den i sin hemstad Bukhara omkring år 232 e.H. (846 e.Kr.); han ägnade ungefär de sista två decennierna av sitt liv åt att vidare granska den under sina resor. Dess fullständiga titel, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, förkortas vanligen till Sahih al-Bukhari — "den tillförlitliga [samlingen] av al-Bukhari." Al-Bukhari själv ska ha sagt att han valde ut den ur omkring 600 000 hadith-berättelser han hade granskat, och godtog en berättelse endast när den, enligt hans bedömning, bars av en obruten kedja av tillförlitliga uppgiftslämnare tillbaka till sin ursprungliga källa.
hero.2=Den måttstocken är skälet till den tyngd boken har. Sahih al-Bukhari räknas som den första av sunniislams Sex böcker (Kutub al-Sittah), och tillsammans med Sahih Muslim — dess närmaste rival i metod och anseende — kallas de två Sahihayn, "de två tillförlitliga". De flesta sunnitiska lärda rankar al-Bukharis samling över varje annan hadithbok och i auktoritet näst efter endast Koranen själv, även om en minoritet av lärda i stället har hävdat Sahih Muslims företräde. Materialet är ordnat tematiskt snarare än efter uppgiftslämnare eller kronologi (det som lärda kallar en musannaf), indelat i böcker (kutub) som löper från rituell rening och bön genom handel och äktenskap till tidigare profeters liv och den yttersta stundens tecken.
hero.3=Hur många hadither boken egentligen innehåller beror på vilken tryckttradition som räknar. Den siffra som oftast citeras i dag, 7 563, kommer från den numrering utgivaren Muhammad Fu'ad Abd al-Baqi gav texten på 1900-talet, och den räknar en hadith på nytt varje gång den upprepas under ett annat kapitel; rensad från upprepningar räknade Ibn Hajar al-Asqalani 2 602. Andra lärda har föreslagit ytterligare andra totalsummor. Detta korpus egen siffra är ännu en tredje: 98 böcker och 7 589 numrerade hadither, vilket helt enkelt är formen hos den digitala utgåva den är hämtad från, inte ett anspråk på att återge någon enskild tryckt numrering exakt.
hero.4=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-bukhari-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

