title=الفولغاتا الكليمنتية — عن هذه الطبعة | Common Root
description=الفولغاتا الكليمنتية: المراجعة البابوية لكتاب جيروم المقدس اللاتيني، طُبعت في روما سنة 1592 وأُعيد إصدارها مصحَّحة في 1593 و1598 — النص اللاتيني المعتمد في الكنيسة الكاثوليكية حتى 1979، وفي هذا القارئ درجة فوق الفولغاتا.
heroHeading=الفولغاتا الكليمنتية
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=في سنة 1546 أعلن المجمع التريدنتيني أن الفولغاتا هي الكتاب المقدس اللاتيني الأصيل للكنيسة، فترك بذلك سؤالًا لم يُجب عنه: أيّ فولغاتا؟ فأحد عشر قرنًا من النسخ باليد لم تُبقِ مخطوطتين متطابقتين تمامًا، وطلب المجمع نصًّا مصحَّحًا. فقدّم البابا سيكستوس الخامس نصًّا سنة 1590، راجع كثيرًا منه بنفسه، مع مرسوم بابوي يعلنه أصيلًا. ومات في أغسطس من السنة نفسها، وفي غضون أسابيع كان الكرادلة قد أوقفوا بيعه. وفي عهد كليمنت الثامن أعدّت لجنة بديله — وكان فرانثيسكو دي توليدو بين محرّريها، وروبرتو بيلارمينو في قلب العمل — وطُبع في روما سنة 1592. ثم أزالت طبعتان أصغر حجمًا في 1593 و1598 معظم أخطائه المطبعية، وأضافتا مقدمات جيروم وإحالات في الهوامش.
hero.2=ظل هذا النص الكتاب المقدس اللاتيني المعتمد في الكنيسة الكاثوليكية قرابة أربعة قرون، حتى النسخة الفولغاتية الجديدة (Nova Vulgata) سنة 1979، ولا يزال كتاب القداس وكتاب الصلوات الصادران سنة 1962 يستعملانه. إنه كتاب جيروم المقدس كما تسلّمته الكنيسة، لا كما تركه هو. فالمزامير فيه هي مزاميره الغاليّة، المراجَعة على اليونانية، لا ترجمته اللاحقة عن العبرية، ولذلك تحتفظ بالترقيم اليوناني: فالمزمور 22 هنا يبدأ بعبارة “Dominus regit me”، مزمور الراعي. وفي رسالة يوحنا الأولى 5:7 يرد “الفاصل اليوحنّاوي” (Comma Johanneum): “Pater, Verbum, et Spiritus Sanctus”، وهو إضافة لاتينية لا تعرفها المخطوطات اليونانية المبكرة. ويأتي سفرا أستير ودانيال في صيغتيهما الأطول، وقد جُمعت الإضافات اليونانية في آخر أستير وفي الفصلين الأخيرين من دانيال. أما ملف eBible.org الذي أُخذت منه هذه النسخة فيطبع نص 1598 ومعه “الشرح المعتاد” (Glossa Ordinaria) حواشيَ — وهو تفسير من القرن الثاني عشر صدر عن مدرسة أنسلم اللاوني، في طبعة مينيه سنة 1880. ولم تدخل الحواشي إلى المجموعة؛ أما الأقواس المعقوفة في بعض الآيات فهي من المصدر نفسه.
hero.3=هي في هذا القارئ درجة لها أصل مسجَّل واحد، هو الفولغاتا اللاتينية: افتح درجة تحت أيّ آية من آياتها فتظهر الفولغاتا. وتوقّع أن يُقرأ النصّان متطابقين تقريبًا كلمةً بكلمة. فالفولغاتا في هذه المجموعة مأخوذة هي نفسها من نصّ كليمنتي، فلا يفرّق بينهما في الغالب إلا الترقيم — والأسفار التي تنقص هذه النسخة. ففيها 66 سفرًا، هي أسفار القانون البروتستانتي، وأستير ودانيال في صيغتيهما الأطول. وتحمل ملفات المصدر أيضًا طوبيا ويهوديت والحكمة ويشوع بن سيراخ وباروخ وسفرَي المكابيين، وكلها موجودة في الفولغاتا التي تحتها؛ لكن أيًّا منها لم يصل، فحيث يكون في الفولغاتا سفر طوبيا لا يوجد فوقه شيء. أما صلاة منسّى وسفرا عزرا الثالث والرابع، اللذان طبعتهما الكليمنتية في ملحق، فليست في المصدر ولا في المجموعة. ولا يقوم شيء في المجموعة بدوره على هذه الطبعة.

