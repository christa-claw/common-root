title=Japonca Freedom Bible — Bu Baskı Hakkında | Common Root
description=Japonca Freedom Bible (フリーダム・バイブル): eBible.org'un telif hakkı konmamış bir çeviri taslağı olarak dağıttığı, 66 kitaptan oluşan eksiksiz bir Japonca Kutsal Kitap — bu derlemedeki tek Japonca Kutsal Kitap, bu yüzden Japonca arayüz onunla açılır.
heroHeading=Japonca Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=Japonca Freedom Bible — Japonca adıyla フリーダム・バイブル — eBible.org'un dağıttığı eksiksiz bir Japonca Kutsal Kitap'tır; eBible.org kendisini çevirinin resmî dağıtıcısı olarak tanıtır. Çok yenidir: bu derlemenin elindeki kaynak dosyalar 19 Ağustos 2026 tarihlidir ve kartındaki 2026 o dosyaların tarihidir. eBible ayrı bir yayın tarihi vermez; burada da böyle bir tarih ileri sürülmez.
hero.2=Onun hakkında pek çok şey kayıtlı değildir ve bunu açıkça söylemek gerekir. eBible'ın sayfaları ne bir çevirmen, ne bir kurul, ne de bir yayıncı adı verir; çevirinin neyden yapıldığını da söylemez — doğrudan İbranice ve Grekçeden mi, yoksa başka bir çağdaş çeviri aracılığıyla mı. Kendi telif sayfası onu bir çeviri taslağı (翻訳の草案) olarak niteler ve iyileştirme önerileri ister; dolayısıyla buradaki metin, yerleşmiş bir baskı değil, süren bir çalışmanın anlık görüntüsüdür.
hero.3=Açık olan, hukuki durumudur: aynı sayfa çeviriye hiçbir telif hakkı konmadığını belirtir ve onu kamu malı olarak işaretler. Buradaki Japonca metnin o olmasının nedeni budur — eBible'da telif hakkından bağımsız tek eksiksiz Japonca Kutsal Kitap oydu. Ona bir soy çizgisi kazandırabilecek daha eski Japonca Kutsal Kitap, yani 1887'de tamamlanan ve çoktan kamu malı olan Meiji dönemi çevirisi, o kaynaktan edinilemiyor.
hero.4=Bu derlemede Protestan kanonunun 66 kitabını, 31.098 ayeti içerir; deuterokanonik kitap yoktur. Onun için kayıtlı bir ana metin bulunmadığından, ayetlerinden birinin altında bir basamak açıldığında doğrudan ≈ ile işaretli özgün dil tabanına inilir: orada görünen İbranice ve Grekçe tanıktır, neyden çevrildiğine dair bir iddia değil — kaynağı bilinmediğine göre dürüst okuma da budur. Derlemedeki tek Japonca Kutsal Kitap olduğundan, Japonca bir arayüz varsayılan olarak onunla açılır.

