title=Freedom Bible japonesa — Acerca de esta edición | Common Root
description=La Freedom Bible japonesa (フリーダム・バイブル): una Biblia japonesa completa de 66 libros que eBible.org distribuye como borrador de traducción sin derechos de autor — la única Biblia japonesa de este corpus, por lo que la interfaz japonesa se abre en ella.
heroHeading=Freedom Bible japonesa
readerHref=/reader?c1.src=jfb

hero.1=La Freedom Bible japonesa — en japonés, フリーダム・バイブル — es una Biblia japonesa completa distribuida por eBible.org, que se presenta como distribuidor oficial de la traducción. Es muy reciente: los archivos fuente que guarda este corpus llevan fecha del 19 de agosto de 2026, y el 2026 de su tarjeta es la fecha de esos archivos. eBible no da una fecha de publicación aparte, y aquí tampoco se afirma ninguna.
hero.2=Mucho de ella no consta, y conviene decirlo sin rodeos. Las páginas de eBible no nombran traductor, comité ni editorial, ni dicen de qué se hizo la traducción: directamente del hebreo y el griego, o a través de otra traducción moderna. Su propia página de derechos la llama borrador de traducción (翻訳の草案) e invita a proponer mejoras, de modo que el texto de aquí es una instantánea de una obra en curso y no una edición fijada.
hero.3=Lo que sí está claro es su situación legal: esa misma página declara que la traducción no tiene derechos de autor y la marca como de dominio público. Por eso es el texto japonés de este corpus: era la única Biblia japonesa completa de eBible libre de derechos. La Biblia japonesa más antigua que podría haberle dado un linaje, la traducción de la era Meiji terminada en 1887 y desde hace mucho de dominio público, no está disponible en esa fuente.
hero.4=En este corpus contiene los 66 libros del canon protestante, 31.098 versículos, sin libros deuterocanónicos. No tiene registrado ningún texto base, así que al abrir un peldaño bajo uno de sus versículos se llega directamente al suelo de las lenguas originales, marcado con ≈: el hebreo y el griego que allí aparecen son testigos, no una afirmación sobre aquello de lo que se tradujo; y siendo desconocida su fuente, esa es la lectura honesta. Es la única Biblia japonesa del corpus, por lo que una interfaz en japonés se abre en ella por defecto.

