title=Latinska Vulgata — Om denna utgåva | Common Root
description=Latinska Vulgata: Hieronymus översättning, beställd 382 och färdig omkring 405, som bar Bibeln genom Västeuropa i tusen år och blev den första bok Gutenberg tryckte.
heroHeading=Latinska Vulgata
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=Vid slutet av 300-talet gick de latinska evangelierna i väst isär från avskrift till avskrift, och påve Damasus I bad sin sekreterare Hieronymus att reda ut dem. Hieronymus började med en revision. Han kom att ägna mer än tjugo år åt arbetet, de flesta av dem i Betlehem, och åstadkomma något ingen hade bett om.
hero.2=Det avgörande var att han översatte Gamla testamentet från hebreiskan i stället för från den grekiska Septuaginta som kyrkan alltid hade använt. Hieronymus kallade principen “hebraica veritas” — den hebreiska sanningen — och den var omstridd: Augustinus skrev till honom och oroade sig för att församlingarna skulle göra uppror när välkända formuleringar ändrades under dem. Hieronymus gjorde det ändå. Resultatet är skälet till att en latinsk bibel, av allt, står närmare hebreiskan än den grekiska bibel de första kristna läste.
hero.3=Den blev Västeuropas bibel i ett årtusende, en längre tid än någon översättning före eller efter. Det var ur den Wycliffe översatte till engelska, och ur den arbetade också Douay-Rheims översättare — så Douay-Rheims i detta korpus är dess direkta ättling, och den utgåvans stegpinnar pekar tillbaka hit. Den var också den första större bok som trycktes med rörliga typer: bibeln som Gutenberg satte i Mainz omkring 1455 var denna text.

