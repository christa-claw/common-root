# The narrative, one paragraph per key, in order.
hero.1=शाह वलीउल्लाह देहलवी — पूरा नाम क़ुतुबुद्दीन अहमद इब्न अब्दुर्रहीम अल-उमरी अद-देहलवी — का जन्म 21 फ़रवरी 1703 को मुज़फ़्फ़रनगर के निकट फुलत में हुआ, और उनका पालन-पोषण दिल्ली में हुआ, जहाँ उनके पिता, शाह अब्दुर्रहीम, ने मदरसा-ए-रहीमिया की स्थापना की थी। कहा जाता है कि उन्होंने सात वर्ष की आयु तक क़ुरआन कंठस्थ कर लिया और पंद्रह वर्ष की आयु तक अपने समय का सामान्य पाठ्यक्रम पूरा कर लिया, और दो वर्ष बाद अपने पिता के स्थान पर मदरसे के प्रमुख बने। 1730–31 में उन्होंने हज किया, फिर मदीना में लगभग एक वर्ष बिताकर हदीस का अध्ययन किया — मुख्यतः अबू ताहिर अल-कुर्दी (जिन्हें अल-कुरानी भी कहा जाता है) के अधीन, तथा मुहम्मद वफ़्दुल्लाह अल-मालिकी और शेख़ ताजुद्दीन अल-क़ल'ई के अधीन आगे अध्ययन किया — इससे पहले कि वे 16 दिसंबर 1732 को दिल्ली लौटे। उनकी मृत्यु वहाँ 20 अगस्त 1762 (1176 हिजरी के 29 मुहर्रम) को हुई, और उन्हें अपने पिता के निकट दफ़नाया गया। उनकी अन्य रचनाओं में हुज्जतुल्लाह अल-बालिग़ा शामिल है, जिसे सामान्यतः उनकी सबसे महत्वपूर्ण पुस्तक माना जाता है, अल-फ़ौज़ अल-कबीर, तथा फ़ुतूह अल-हरमैन, जो उस यात्रा का उनका अपना वर्णन है जो उन्हें हिजाज़ ले गई।
hero.2=अल-अरबईन उसी "चालीस हदीस" (अरबईनिय्यात) परंपरा को आगे बढ़ाती है जिसे [[NAW|नवावी की चालीस हदीसें]] और [[QUD|चालीस पवित्र हदीसें]] भी आगे बढ़ाती हैं — एक परंपरा जो उस हदीस तक जाती है जो धर्म से जुड़ी चालीस हदीसें अपने समुदाय के लिए संरक्षित रखने वाले को क़यामत के दिन विद्वानों में स्थान देने का वादा करती है — एक हदीस जिसे अधिकांश आलोचक स्वयं ज़ईफ़ (कमज़ोर) मानते हैं — और उस पहले, अब लुप्त संग्रह तक जो अब्दुल्लाह इब्न अल-मुबारक (मृ. 797) से जोड़ा जाता है। यह उन दोनों से इस बात में भिन्न है कि यह क्या इकट्ठा करती है: व्यापक साहित्य से विषय या श्रेणी के आधार पर चुनी गई हदीसों के बजाय, इसके अंग्रेज़ी प्रकाशक इसे चालीस हदीसों के रूप में वर्णित करते हैं जिन्हें शाह वलीउल्लाह ने कहा कि उन्होंने मदीना में अपने ही गुरु से सीधे सुना, हर एक को उस संचरण-शृंखला (सनद) के साथ संरक्षित रखा गया जिसके माध्यम से उन्होंने उसे प्राप्त किया — अध्ययन के उस वर्ष का एक व्यक्तिगत संचरण-अभिलेख, जिसने, उनके पुत्र के अनुसार, दिल्ली लौटने के बाद उनके पढ़ाने और लिखने के तरीके को बदल दिया।
hero.3=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-dehlawi संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]], [[NAS|सुनन अल-नसाई]], [[IBM|सुनन इब्न माजा]], [[MAL|मुवत्ता मालिक]], [[NAW|नवावी की चालीस हदीसें]] और [[QUD|चालीस पवित्र हदीसें]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

