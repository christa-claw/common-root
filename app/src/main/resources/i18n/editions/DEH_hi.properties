fact.6.label=स्थिति
fact.6.value=भारतीय उपमहाद्वीप से "चालीस हदीस" (अरबईनिय्यात) का सबसे प्रसिद्ध संग्रह; उस शैली को आगे बढ़ाती है जिसका पहला ज्ञात — अब लुप्त — उदाहरण अब्दुल्लाह इब्न अल-मुबारक (मृ. 797) से जोड़ा जाता है और जिसने [[NAW|नवावी की चालीस हदीसें]] और [[QUD|चालीस पवित्र हदीसें]] को भी उत्पन्न किया
