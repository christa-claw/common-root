title=Bible de Genève 1599 — À propos de cette édition | Common Root
description=La Bible de Genève : faite par des protestants anglais exilés à Genève, première Bible anglaise à versets numérotés et à notes marginales, lue par la génération de Shakespeare et échelon sous la Bible du roi Jacques.
heroHeading=Bible de Genève 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Cette Bible a été faite à l'étranger, par des gens qui ne pouvaient pas rester chez eux sans danger. Quand Marie Ire monta sur le trône en 1553 et que l'Angleterre revint à Rome, quelques centaines de protestants partirent ; certains s'installèrent dans la Genève de Calvin, où il y avait des presses, une érudition hébraïque et grecque, et aucun évêque devant qui répondre. William Whittingham y publia un Nouveau Testament en 1557. Une équipe dirigée par Anthony Gilby parcourut l'Ancien Testament, et la Bible complète fut imprimée à Genève par Rowland Hall en 1560, deux ans après la mort de Marie, alors que la plupart des exilés étaient déjà rentrés.
hero.2=Ce qu'ils produisirent changea l'aspect d'une Bible anglaise. Ce fut la première à numéroter chaque verset, de sorte qu'on pouvait renvoyer un lecteur à une ligne plutôt qu'à un chapitre. Elle fut composée en romain et non en gothique, et publiée assez petite et assez bon marché pour être possédée plutôt qu'enchaînée à un lutrin. Et les marges étaient pleines : renvois, gloses des mots difficiles, cartes et notes expliquant ce qu'un passage voulait dire. C'est ce dernier point qui explique qu'on l'ait aimée et qu'on la lui ait reprochée. Les notes sont réformées, vivement par endroits, et elles disent au lecteur ce qu'il faut penser des rois aussi volontiers que ce qu'il faut penser de la doctrine.
hero.3=La date de cette édition demande une mise en garde, car la Bible de Genève ne fut pas un livre mais un texte réimprimé pendant quatre-vingts ans tandis que ses parties changeaient. En 1576, Laurence Tomson remplaça le Nouveau Testament par sa propre révision, faite sur l'édition grecque de Théodore de Bèze de 1565, et à partir de 1587 c'est ce Nouveau Testament que portent la plupart des Bibles de Genève. En 1599 vinrent s'ajouter les notes de Franciscus Junius sur l'Apocalypse. « 1599 » désigne donc une configuration — le Nouveau Testament de Tomson plus Junius sur l'Apocalypse — plus exactement qu'une année d'impression, et des Bibles portant cette date continuèrent d'être imprimées ensuite. C'est pourquoi la fiche du catalogue laisse l'année vide tandis que la pastille d'échelon, qui a besoin de quelque chose de court à afficher, indique GNV 1599.
hero.4=Sa place dans cette collection est une charnière. La plus longue chaîne de filiation qu'on trouve ici va de la World English Bible à l'American Standard Version, à la Revised Version, à la Bible du roi Jacques, puis à celle-ci : ouvrez un échelon de plus sous un verset du roi Jacques et la formulation de Genève apparaît en dessous, ce qui est la façon la plus nette de voir combien la Bible du roi Jacques est héritée plutôt que composée. Sous la Genève il n'y a plus rien en anglais — seulement le grec et l'hébreu, le Textus Receptus et le Codex de Leningrad de Westminster, où l'échelle touche son sol. Le texte est donné tel que l'édition le porte, orthographe comprise, si bien que Genèse 1:1 dit heauen ; les titres des psaumes et le colophon de l'Épître aux Hébreux courent à l'intérieur du début du premier verset, comme ces impressions les composaient, et on les y a laissés au lieu de les nettoyer.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=anglais — élisabéthain, dans son orthographe d'origine
fact.2.label=Réalisée par
fact.2.value=des protestants anglais qui avaient fui le règne de Marie Ire et s'étaient établis à Genève — William Whittingham a fait le Nouveau Testament de 1557, et une équipe dirigée par Anthony Gilby l'Ancien
fact.3.label=Première édition complète
fact.3.value=1560, imprimée à Genève par Rowland Hall
fact.4.label=Ancien Testament d'après
fact.4.value=l'hébreu massorétique — [[WLC|le Codex de Leningrad de Westminster]] est le témoin de ce texte dans ce corpus
fact.5.label=Nouveau Testament d'après
fact.5.value=le grec de la lignée du [[TR|Textus Receptus]] ; à partir de 1576, la révision de Laurence Tomson, faite sur l'édition grecque de Bèze de 1565, a supplanté le Nouveau Testament de Whittingham dans la plupart des tirages
fact.6.label=Ce que désigne « 1599 »
fact.6.value=les tirages portant le Nouveau Testament de Tomson avec les notes de Franciscus Junius sur l'Apocalypse, entrées cette année-là dans la Bible de Genève
fact.7.label=Premières
fact.7.value=la première Bible anglaise à numéroter tous les versets, composée en romain plutôt qu'en gothique et pourvue d'un appareil complet de notes marginales — une bible d'étude avant que le mot existe
fact.8.label=Contestée par
fact.8.value=Jacques Ier, qui jugeait les notes marginales séditieuses — un grief qui a contribué à mettre en route [[KJV|la Bible du roi Jacques]]
fact.9.label=Année au catalogue
fact.9.value=vide sur la fiche À propos, bien que la pastille d'échelon indique GNV 1599 — la Bible de Genève a été réimprimée de 1560 jusque dans les années 1640, son Nouveau Testament et ses notes changeant sous un même nom
fact.10.label=Dans ce corpus
fact.10.value=les 66 livres, sans apocryphes, orthographe non modernisée — Genèse 1:1 porte « the heauen and the earth »
fact.11.label=Sous un échelon
fact.11.value=[[TR|Textus Receptus]] et [[WLC|Codex de Leningrad de Westminster]] ; la Genève est elle-même le premier échelon sous [[KJV|la Bible du roi Jacques]]
