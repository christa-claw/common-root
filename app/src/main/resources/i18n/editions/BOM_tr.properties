title=Mormon Kitabı — Bu Baskı Hakkında | Common Root
description=Mormon Kitabı: Joseph Smith'in 1830'da ağzından dökülerek yazıya geçirilen, Amerika'daki eski peygamberlerin kaydı; Palmyra, New York'ta basılmıştır ve Son Gün Azizleri tarafından İncil'i tamamlayan bir kutsal metin olarak okunur.
heroHeading=Mormon Kitabı
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith, bu kitabı "Tanrı'nın lütfu ve gücüyle" bir dizi eski metal levhadan tercüme ettiğini söylemiştir; bu levhaları 1827'de, ailesinin Palmyra, New York yakınlarındaki çiftliğinin yanında bulduğunu ve daha sonra kendisine bunları gösteren elçiye geri verdiğini belirtmiştir. Ağızdan yazıya geçirme sürecine tanık olanlar, onun bir gören taşını incelediğini anlatır — çalışmanın daha sonraki aşamalarında, ışığı kesmek için bir şapkanın içine koyduğu bir taş; yalnızca geleneksel olarak Urim ve Tummim denen ve levhalarla birlikte geldiği söylenen, bir göğüslüğe bağlı taş çiftini değil — ve bir yazman metni yazarken o metni yüksek sesle söylemiştir. Oliver Cowdery, 1829'da yaklaşık iki ay boyunca bunun büyük bölümünü bu şekilde yazıya geçirmiştir, esasen New York'un Fayette kasabasındaki Whitmer ailesinin çiftliğinde; Martin Harris ve Joseph'in eşi Emma Smith ise daha kısa, daha önceki aşamalarda yazmanlık yapmıştır.
hero.2=Elyazması aynı yıl içinde baskıya girmiştir. Smith, Haziran 1829'da eserin telif hakkını almış, baskı ise Palmyra'da Egbert B. Grandin'in matbaasında başlamıştır; dizgici John H. Gilbert, ağızdan yazıya geçirilen metinde bulunmayan noktalama işaretlerini ve paragraf bölümlerini eklemiştir. Tamamlanan kitap Mart 1830'da ortaya çıkmıştır: Grandin'in tüm baskısı olan yaklaşık 5.000 nüsha.
hero.3=Kitap, Birinci Nefi Kitabı'ndan Moroni Kitabı'na kadar on beş kitaba ayrılmıştır; her biri, derlemesinin kendisine atfedildiği peygamber kayıt tutucunun adını taşır. 1830 baskısının hiçbir nüshasında tek bir ayet numarası bulunmamaktaydı — metin, bugünkü okuyucuların gördüğünden çok daha uzun bölümler içinde sürekli paragraflar halinde akıyordu. Bugün kullanılan bölüm ve ayet ayrımları, Orson Pratt tarafından hazırlanan 1879 baskısına dayanır; Pratt ayrıca bölümleri kısaltmış ve ilk dipnotları eklemiştir. Sonraki baskılar sunumu daha da değiştirmiştir: George F. Richards başkanlığındaki bir komite, 1920'de metni iki sütun halinde dizmiş ve bölüm özetleri ile bir telaffuz kılavuzu eklemiştir; 1981 baskısı çapraz referansları, bölüm başlıklarını ve diğer kaynak malzemeleri güncellemiştir; 2013 baskısı ise 1981'den beri baskı kalıplarına sızan dizgi tutarsızlıklarını düzeltmiştir.
hero.4=Bu kitap, Son Gün Azizleri hareketinin standart eserleri olarak adlandırdığı dört eserden biridir; İncil, [[DC|Öğreti ve Antlaşmalar]] ve [[PGP|Değerli İnci]] ile birlikte anılır. Bu derlemedeki metin, Mormon Documentation Project'in JSON dışa aktarımından alınmıştır; bu verinin sorumlusu onu kamu malı olarak ilan etmiştir. Metin, 2013 baskısının dizgi düzeltmeleriyle birlikte, bugünkü standart baskının ifadelerini ve ayet ayrımını izler; hâlâ telif hakkı altında olan dipnotları, bölüm özetlerini ve girişi dışarıda bırakır. Burada saklanan şey, belirli bir tarihsel baskı değil, tam olarak bu güncel standart metin olduğundan, onun için tek bir yayın yılı belirtilmemiştir.

