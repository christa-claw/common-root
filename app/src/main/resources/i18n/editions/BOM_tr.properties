fact.2.value=Joseph Smith Jr. (1805–1844); kitabı "Tanrı'nın lütfu ve gücüyle" bir dizi eski metal levhadan tercüme ettiğini söylemiştir; metni yazmanlara, esasen Oliver Cowdery'ye, ağızdan yazıya geçirmiştir; daha kısa, daha önceki aşamaları Martin Harris ve Emma Smith yazıya geçirmiştir
fact.3.label=Yayımlanma
fact.3.value=1830, Palmyra, New York; Egbert B. Grandin tarafından basılmıştır, yaklaşık 5.000 nüsha
fact.4.label=Yapı
fact.4.value=Birinci Nefi Kitabı'ndan Moroni Kitabı'na kadar 15 kitap; her biri, derlemesinin atfedildiği Nefi ya da Yared kayıt tutucusunun adını taşır; 1830 baskısında ayet numarası yoktu, bugünkü bölüm ve ayet ayrımları Orson Pratt'ın 1879 baskısına dayanır
fact.5.label=Konum
fact.5.value=Son Gün Azizleri hareketinin dört standart eserinden biri; İncil, [[DC|Öğreti ve Antlaşmalar]] ve [[PGP|Değerli İnci]] ile birlikte anılır
fact.6.label=Bu derlemede
fact.6.value=Metin ve ayet ayrımı, 2013 baskısının dizgi düzeltmeleriyle birlikte, bugünkü standart ifadeleri izler; Mormon Documentation Project'in kamu malı olarak ilan edilmiş JSON dışa aktarımından alınmıştır; telif hakkı altındaki dipnotları, bölüm özetlerini ve girişi dışarıda bırakılmıştır — bu nedenle burada tek bir baskı yılı belirtilmemiştir
