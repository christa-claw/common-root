fact.10.label=音声の制限
fact.10.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
