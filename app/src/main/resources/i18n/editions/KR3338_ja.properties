title=Kirkkoraamattu 1933/38 — この版について | Common Root
description=Kirkkoraamattu 1933/38：フィンランドの教会聖書であり、ヘブライ語とギリシャ語から改めて翻訳され、委員会がおよそ七十年にわたって取り組んだのち、1933年と1938年の二回に分けて採択された。
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=この名称が二つの年号であるのは、この書物が二つの半分に分かれて世に出たからである。フィンランド福音ルター派教会は1933年に旧約聖書を、1938年に新約聖書を受け入れ、フィンランド語では以来これを「1933/38年教会聖書」と呼んできた。末尾のこれらの年号は、始まりがどれほど遡るかを覆い隠している——翻訳委員会が任命されたのは1861年のことだった。委嘱から完成した聖書までのあいだには、およそ七十年と、一世代を超える翻訳者たちが横たわっている。
hero.2=委員会が作り上げたのは改訂ではなく新訳だった。旧約聖書はヘブライ語から、新約聖書はギリシャ語から訳出し——ラテン語やドイツ語、スウェーデン語の仲立ちを経ることも、当時すでに使われていたフィンランド語聖書に拠ることもしなかった。それでもなお、この委員会は意識して Biblia 1776 の後継者であろうとした。一世紀半にわたって教会の聖典であり続けたその聖書の語彙と調子を、少なからず保持したのである。1938年に完成した聖書が最初の読者たちの耳にすでに古めかしく響いた理由、そして今なおフィンランド語聖典の荘重な語り口を保っている理由は、この継承にある。公式の教会聖書であり続けたのは1992年までだった。
hero.3=この読書環境において、これは二つの役割を担っている。インターフェースをフィンランド語に設定すると開くのはこの版であり——カタログ自体の並び順に従えば代わりに Biblia 1776 が渡されるはずなので、フィンランド語での既定はアルファベット順の偶然ではなく、意図された選択である。またこれはフィンランド語系譜連鎖の最上段でもある。KR3338 の一節の下で段を一つ開けば、その下に Biblia 1776 が現れる。この段は典拠としてではなく、同じ教会の聖書の内部での継承として読むべきである。1933/38年の翻訳者たちが前にしていたのはヘブライ語とギリシャ語であって、1776年の本文ではなかったからである。Biblia 1776 の下でも連鎖は続く——1776年がその改訂元とする Biblia 1642、その委員会がさらに改訂したアグリコラの1548年のフィンランド語、そして彼らが作業のかたわらに広げていたルターの1545年のドイツ語である。ヘブライ語とギリシャ語に梯子が届くのは、それらのさらに下でしかない。

