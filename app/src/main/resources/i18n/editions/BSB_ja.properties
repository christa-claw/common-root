title=ベレアン・スタンダード聖書 — この版について | Common Root
description=ベレアン・スタンダード聖書:Bible HubとDiscovery Bibleのチームが、マソラ本文のヘブライ語と、彼ら自身が校訂したギリシャ語新約聖書とから作った現代英語訳であり、その後パブリックドメインへと手放された。
heroHeading=ベレアン・スタンダード聖書
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=ベレアン・スタンダード聖書は、この文集の中でも最も新しい翻訳の一つであり、その成り立ちについて最も率直に語っている翻訳の一つでもある。これはバイブル・ハブとディスカバリー・バイブルの背後にいるチームが、諮問委員会のもとで作り上げたものであり、当初は別の名前——ベレアン・スタディ・バイブル——で世に出た。この名は絶え間ない混同を招いた。「スタディバイブル」とは通常、注解や注釈を詰め込んだ聖書を意味するが、これはそうではなかったからである。訳名は改められたが、略号はそのまま残った。
hero.2=たいていの翻訳は、誰か他の人が校訂したギリシャ語新約聖書から出発する。この計画は、まず自分たち自身のものを作った。ベレアン・ギリシャ語聖書はネストレ1904年版を底本とし——編者たちの言によれば、それがすでにパブリックドメインにある最も正確な校訂本文だからという理由で——さらにこれをネストレ・アーラント、SBLギリシャ語新約聖書、ティッシェンドルフ、ウェストコットとホート、ビザンティン本文、そしてテクストゥス・レセプトゥスと照合し、意見が分かれる箇所には脚注を付けた。英語はそこから訳された。旧約聖書はマソラ本文のヘブライ語に由来し、死海文書、七十人訳、その他の初期の証言も、読みに関わる箇所では参照されている。同じ仕事はその後、何層にもわたって公刊された——逐語訳のインターリニア版、硬く直訳的な版、そしてこの読みやすい版であり、読者は翻訳者の言葉をそのまま受け取るのではなく、ギリシャ語から英語へと一段階ずつたどれるようになっている。これはまた、このコーパスが目に見える形にしているある分岐点の向こう側にベレアン訳を置いてもいる——ここに収められたジュネーヴ聖書とキング・ジェイムズ・バージョンはテクストゥス・レセプトゥスの系譜に連なるが、これはそうではない。
hero.3=この計画が本文に対して最後に行ったのは、それを手放すことだった。ベレアンの本文は2023年4月にパブリックドメインへと献呈され、それゆえにこそ聖書全体がこのコーパスに収まり、そこから複製して取り出すこともできる。リーダーのインターフェースを英語に設定すると開くのはニュー・インターナショナル・バージョンであり、これはライセンスのもとでここに置かれている。ベレアン訳はその隣にある現代英語であり、誰でも引用し、印刷し、再配布してよい。系譜の段では、これはやさしいスペイン語聖書と同じふるまいをする。母本は記録されていない。これはこのコーパスが持つ何かの改訂ではなく、新たに作られた翻訳だからであり、そのためベレアンの一節の下で段を開くと、より古い英語聖書にではなく、≈ 印で示された原語の底面へと直接至る。カタログはこの版の年も空欄のままにしている。それは見落としではない——本文は訂正が入るたびに今も改められており、ここでの年は推測ではなく吟味されたものだけを載せているため、単一の確定した印刷年を持たない版には年が付かない。

