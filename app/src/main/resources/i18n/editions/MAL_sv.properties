title=Muwatta Malik — Om denna utgåva | Common Root
description=Muwatta Malik: imam Malik ibn Anas's rätts- och hadithkompendium från Medina, som föregår sunniislams Sex böcker med omkring ett sekel och ibland föreslås inta Sunan Ibn Majahs plats bland dem.
heroHeading=Muwatta Malik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Malik ibn Anas ibn Malik ibn Abi 'Amir al-Asbahi al-Madani, känd under kunyan Abu Abd Allah, föddes omkring år 93 e.H. (711 e.Kr.) i Medina och dog där år 179 (795 e.Kr.); han begravdes på kyrkogården al-Baqi'. Han studerade hos lärda som Hisham ibn Urwah, Ibn Shihab al-Zuhri, Ja'far al-Sadiq och Nafi' Mawla Ibn Umar och undervisade i Medina resten av sitt liv, och fick titlar som Imam Dar al-Hijra ("imamen i utvandringens stad") och Shaykh al-Islam. Han blev namngivare för den malikitiska rättsskolan, en av sunniislams fyra stora rättsskolor; hans mest framstående lärjunge, Muhammad ibn Idris al-Shafi'i — som senare grundade den shafiitiska rättsskolan — kallade Maliks bok "den mest tillförlitliga på jorden efter Koranen". Den abbasidiske kalifen al-Mansur ska ha velat göra den till rikets enda rättskälla; Malik själv avböjde.
hero.2=Al-Muwatta ("den väl upptrampade vägen") sammanställdes, enligt traditionen, under omkring fyrtio år under den tidiga abbasidperioden; namnet sägs komma från att Malik visade texten för sjuttio rättslärda i Medina, som alla var överens (wata'a) om den. Den förenar hadither som tillskrivs profeten med rättsliga uttalanden från hans följeslagare och från den följande generationen, tillsammans med Maliks egna avgöranden — enligt en bedömning det äldsta bevarade verket som på detta sätt smälter samman hadith och fiqh, omkring ett sekel före Sex böckerna. Uppgifterna om dess omfång varierar med versionen och räknesättet: en ofta citerad siffra för de egentliga hadith-erna är omkring 1 720, medan Malik sägs ha valt ut strax under 1 900 berättelser ur de 100 000 som ska ha varit tillgängliga för honom.
hero.3=Minst sexton versioner av al-Muwatta är kända. Den som blev standardreferensen, särskilt för den malikitiska rättsskolan, är Yahya ibn Yahya al-Laythis; en konkurrerande version av Ahmad ibn Abi Bakr al-Zuhri är omkring fem till tio procent längre. Omkring hundra kommentarer finns bara till al-Laythis version. Eftersom den föregår sunniislams Sex böcker hävdar några lärda — malikiterna och Ibn al-Athir bland dem — att det är al-Muwatta, och inte [[IBM|Sunan Ibn Majah]], som hör till den kanoniska listan; Ibn Majahs Sunan sägs i allmänhet ha behållit platsen eftersom dess innehåll överlappar minst med de andra fem, inte eftersom den anses mer tillförlitlig.
hero.4=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-malik-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]] och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

