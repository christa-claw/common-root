title=Sunan an-Nasa'i — À propos de cette édition | Common Root
description=Sunan an-Nasa'i : le recueil de hadiths qu'Ahmad ibn Shu'ayb al-Nasa'i a tiré de son ouvrage plus vaste, le Sunan al-Kubra, désigné par Ibn Hajar comme celui des Six Livres contenant le moins de hadiths faibles après les deux Sahihs.
heroHeading=Sunan an-Nasa'i
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali al-Nasa'i est né vers l'an 214–215 de l'hégire (829–830 apr. J.-C.) à Nasa, une ville du Khorasan qui se trouve aujourd'hui au Turkménistan. Il commença à voyager à la recherche de hadiths vers l'âge de quinze ans, étudiant d'abord auprès de Qutaybah ibn Sa'id — chez qui il passa plus d'un an à Baghlan — avant de continuer à travers l'Irak, le Hijaz, la Syrie et l'Égypte, où il étudia auprès de savants tels qu'Ishaq ibn Rahwayh et Abu Dawud al-Sijistani, compilateur du [[ABD|Sunan Abi Dawud]]. Il s'installa en Égypte, y enseigna et devint connu comme Hafiz al-Hadith ; les biographes ultérieurs ne s'accordent pas sur le fait qu'il ait réellement étudié directement auprès de Muhammad al-Bukhari, al-Mizzi soutenant que les deux hommes ne se rencontrèrent jamais. Voyageant du Caire vers La Mecque à la fin de sa vie, il s'arrêta à Damas, où, selon le récit traditionnel, un exposé qu'il donna sur les vertus des compagnons du Prophète provoqua une foule hostile dans le climat anti-alide de la ville ; il mourut peu après, en l'an 303 de l'hégire (915 apr. J.-C.), des blessures qu'il y reçut. Les récits diffèrent sur le lieu de sa sépulture — entre Safa et Marwa, à La Mecque, selon une tradition, ou à Ramla, en Palestine, selon une autre.
hero.2=Sur les quelque quinze ouvrages qui lui sont attribués, six portent sur le hadith. Le plus volumineux, le Sunan al-Kubra, il le réduisit lui-même plus tard à une sélection plus courte connue comme le Sunan al-Sughra (« le petit Sunan ») ou al-Mujtaba (« le choisi ») — l'ouvrage que l'on désigne aujourd'hui par le simple titre de Sunan an-Nasa'i. Qui a exactement opéré cette sélection, et à la demande de qui, n'est pas consigné dans les sources consultées pour cette page. Dans cet ouvrage, al-Nasa'i organisa les hadiths par sujet juridique, comme le firent [[ABD|Abu Dawud]] et [[TIR|at-Tirmidhi]]. Le juriste Ibn Hajar al-Asqalani le distingua plus tard comme celui qui, après les deux Sahihs, contient le moins de hadiths faibles (da'if) et de transmetteurs peu fiables parmi les Six Livres, et aucun hadith fabriqué (mawdu') du tout.
hero.3=La tradition sunnite compte le Sunan an-Nasa'i parmi les Six Livres (Kutub al-Sitta), avec le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]] et le [[TIR|Jami` at-Tirmidhi]], ainsi qu'un sixième livre disputé entre le Sunan Ibn Majah et d'autres candidats. La place exacte qu'il occupe parmi les quatre recueils de Sunan est débattue plutôt que tranchée : certaines sources le disent le troisième en autorité des six, juste après les deux Sahihs, tandis que les pages de ce corpus consacrées au [[ABD|Sunan Abi Dawud]] et au [[TIR|Jami` at-Tirmidhi]] reflètent l'ordre le plus courant, qui place le livre d'Abu Dawud au troisième rang. Le nombre de hadiths qu'on lui attribue varie de la même manière : 5 758, répétitions comprises, selon un chiffre largement cité pour l'al-Mujtaba, contre 5 765 dans l'édition dont ce corpus est tiré — les sources ne réconcilient pas ces deux chiffres.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-nasai de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]] et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=arabe classique, avec une traduction anglaise sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i (215–303 de l'hégire / 830–915 apr. J.-C.)
fact.3.label=Titre
fact.3.value=connu comme Sunan an-Nasa'i, Sunan al-Sughra (« le petit Sunan ») ou al-Mujtaba (« le choisi ») — une sélection ultérieure tirée du propre ouvrage plus vaste d'al-Nasa'i, le Sunan al-Kubra
fact.4.label=Compilé
fact.4.value=réuni au fil de voyages à travers l'Irak, le Hijaz, la Syrie et l'Égypte, entamés vers l'âge de quinze ans ; al-Nasa'i s'installa en Égypte et mourut à Damas en l'an 303 de l'hégire (915 apr. J.-C.)
fact.5.label=Méthode
fact.5.value=organisé par sujet juridique, comme le [[ABD|Sunan Abi Dawud]] et le [[TIR|Jami` at-Tirmidhi]] ; réduit à partir du Sunan al-Kubra plus vaste d'al-Nasa'i par un procédé que les sources consultées ici ne consignent pas
fact.6.label=Rang
fact.6.value=compté parmi les Six Livres de l'islam sunnite (Kutub al-Sitta) ; certaines sources le placent au troisième rang, après le [[BUK|Sahih al-Bukhari]] et le [[MUS|Sahih Muslim]], tandis que les pages de ce corpus sur le [[ABD|Sunan Abi Dawud]] et le [[TIR|Jami` at-Tirmidhi]] reflètent l'ordre le plus courant, qui place le livre d'Abu Dawud au troisième rang — le rang exact est débattu plutôt que tranché
fact.7.label=Nombre de hadiths
fact.7.value=5 758, répétitions comprises, selon un chiffre largement cité pour l'al-Mujtaba ; l'édition source de ce corpus en numérote 5 765 — les sources ne réconcilient pas ces deux chiffres
fact.8.label=Dans ce corpus
fact.8.value=52 livres et 5 765 hadiths numérotés
fact.9.label=Traduction anglaise
fact.9.value=tirée de l'édition eng-nasai de fawazahmed0/hadith-api, montrée en accompagnement sous l'arabe ; la traduction publiée dont elle descend n'a pas encore été établie du côté de ce corpus
fact.10.label=Licence
fact.10.value=le matn arabe est le texte classique du domaine public ; la licence de la traduction anglaise reste en cours de vérification
