title=Septuaginta greca di Brenton — Informazioni su questa edizione | Common Root
description=La Septuaginta — l'Antico Testamento greco della diaspora ebraica e della Chiesa antica — nel testo greco che Lancelot Brenton stampò accanto al suo inglese nel 1851, e in questo lettore il piolo sotto la Vulgata e la Bibbia Sinodale russa.
heroHeading=Septuaginta greca di Brenton
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=La Septuaginta, o versione dei Settanta, è la più antica traduzione della Bibbia ebraica, e nei primi secoli cristiani fu semplicemente la Bibbia. Ebrei di lingua greca ad Alessandria la cominciarono con i cinque libri della Legge, probabilmente nel III secolo a.C., e gli altri libri seguirono nei due secoli successivi. Il nome viene da un racconto: la Lettera di Aristea narra di settantadue anziani mandati da Gerusalemme a tradurre la Legge per il re Tolomeo II, e «i Settanta» — LXX in numeri romani — divenne il nome dell'intero Antico Testamento greco. Gli autori del Nuovo Testamento la citano di continuo, la Chiesa antica la leggeva, e le Chiese ortodosse la leggono ancora come loro Antico Testamento.
hero.2=La sua importanza va oltre la sua età. I traduttori lavorarono su manoscritti ebraici che in alcuni punti differivano dal testo masoretico divenuto poi normativo — Geremia, per esempio, è nettamente più breve in greco —, così che in molti passi la Septuaginta è la più antica testimonianza di una lezione ebraica che la tradizione ebraica stessa non ha conservato. Contiene inoltre libri che il canone ebraico non ha, fra cui Tobia, Giuditta, Sapienza, Siracide e Baruc. E alcune sue scelte lessicali divennero dottrina: in Isaia 7,14, dove l'ebraico ha ʿalmah, una giovane donna, il greco ha parthenos, una vergine — la parola che cita Matteo.
hero.3=Il greco qui presente è il testo stampato da Sir Lancelot Brenton. Nel 1844 pubblicò una traduzione inglese della Septuaginta, condotta principalmente sul Codex Vaticanus, il manoscritto del IV secolo conservato nella Biblioteca Vaticana; nel 1851 Samuel Bagster, a Londra, la ripubblicò con l'aggiunta dei libri apocrifi e con il greco accanto all'inglese, ed è quel greco che contiene questo corpus. I suoi salmi seguono la numerazione greca, condivisa dalla Vulgata qui presente: in entrambe il salmo 22 è quello del pastore, il salmo 23 dell'ebraico e della maggior parte delle Bibbie inglesi. I salmi sono 151; Esdra e Neemia formano un unico libro; Ester e Daniele sono nelle loro forme greche più lunghe.
hero.4=In questo lettore è un piolo, non il fondo. Sta sotto la Vulgata latina, perché una parte della Vulgata è passata attraverso il greco: il suo salterio è quello che Girolamo fece sul greco delle Esapla di Origene e che la sua stessa traduzione dall'ebraico non soppiantò mai, e Sapienza, Siracide e Baruc rimasero in versioni vetero-latine fatte sul greco. Sta sotto la Bibbia Sinodale russa, il cui Antico Testamento conservò molte lezioni della Septuaginta ereditate dalla Bibbia slava che la precedeva, e sotto la traduzione inglese dello stesso Brenton. Non ha un genitore registrato: l'ebraico da cui fu tradotta non è nel corpus, e il Codice di Leningrado, più giovane di oltre mille anni e della linea masoretica, compare sotto di essa solo come fondo delle lingue originali. Contiene solo l'Antico Testamento, quindi sotto un versetto del Nuovo Testamento il piolo viene saltato — e non tutti i libri della tradizione greca sono qui: questo esemplare ha 45 libri e nessun libro dei Maccabei.

