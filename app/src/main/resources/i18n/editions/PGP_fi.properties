fact.2.label=Tekijät
fact.2.value=Joseph Smith nuorempi (1805–1844): ilmoituksia, hänen King James -raamatun tarkistuksensa, käännös, jonka hän sanoi tehneensä egyptiläisistä papyruksista, hänen oma historiansa ja uskonlausuma; yhdeksi niteeksi kokosi ensimmäisenä Franklin D. Richards
fact.3.label=Julkaistu
fact.3.value=1851, Liverpool, Englanti, lähetystyön lehtisenä, kokoajana Franklin D. Richards; toinen laitos 1878, Salt Lake City, toimittajana Orson Pratt; yleiskonferenssi hyväksyi sen pyhäksi kirjoitukseksi 10. lokakuuta 1880
fact.4.label=Rakenne
fact.4.value=Viisi osaa — Valintoja Mooseksen kirjasta, Abrahamin kirja, Joseph Smith – Matteus, Joseph Smith – Historia ja Uskonkappaleet — jaettu lukuihin ja jakeisiin vuoden 1902 tarkistetusta laitoksesta lähtien; aineistossamme kukin osa on oma kirjansa
fact.5.label=Asema
fact.5.value=Yksi Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkon neljästä standarditeoksesta, Raamatun, [[BOM|Mormonin kirjan]] ja [[DC|Opin ja liittojen kirjan]] ohella; Community of Christ ei pidä sitä pyhänä kirjoituksena
fact.6.label=Tässä aineistossa
fact.6.value=Teksti noudattaa nykyistä standardisanamuotoa Mormon Documentation Project -hankkeen yleisomistukseen julistetusta JSON-aineistosta — samasta lähteestä kuin [[BOM|Mormonin kirja]] ja [[DC|Opin ja liittojen kirja]]; Mooseksen ja Matteuksen otteet muokkaavat [[KJV|King James Versionin]] tekstiä, joka sekin on aineistossa; faksimilet ja niiden selitykset on jätetty pois, eikä tässä esitetä yksittäistä painovuotta
fact.7.label=Käyttöoikeus
fact.7.value=Yleisomistuksessa, aineiston ylläpitäjän mukaan; nykyaikaista tekijänoikeuden alaista opetusaineistoa ei ole mukana
