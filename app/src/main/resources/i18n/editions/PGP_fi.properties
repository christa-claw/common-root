title=Kallisarvoinen helmi — Tietoja tästä laitoksesta | Common Root
description=Kallisarvoinen helmi: valikoima Joseph Smithin ilmoituksia, käännöksiä ja kertomuksia, koottu ensimmäisen kerran 1851 lähetystyön lehtiseksi Liverpoolissa Englannissa ja hyväksytty myöhempien päivien pyhien pyhäksi kirjoitukseksi 1880.
heroHeading=Kallisarvoinen helmi
readerHref=/reader?c1.src=pgp

hero.1=Kallisarvoinen helmi sai alkunsa lähetystyön lehtisenä eikä pyhänä kirjoituksena. Vuonna 1851 Franklin D. Richards, tuolloin kirkon Euroopan lähetyskentän johtaja, kokosi sen Liverpoolissa Englannissa. Hän keräsi yhteen Joseph Smithin kirjoituksia, jotka olivat ilmestyneet kirkon varhaisissa lehdissä tai levinneet vain vähäisinä määrinä, jotta Britannian jäsenillä olisi ne samoissa kansissa. Nimi tulee Matteuksen evankeliumin vertauksesta 13:45–46, jossa kauppias myy kaiken omistamansa ostaakseen yhden kallisarvoisen helmen.
hero.2=Toinen laitos, jonka Orson Pratt toimitti ja järjesti uudelleen, julkaistiin Salt Lake Cityssä vuonna 1878, ja 10. lokakuuta 1880 kirkon yleiskonferenssi hyväksyi sen äänestämällä pyhäksi kirjoitukseksi. Vuoden 1902 tarkistettu laitos, jonka valmisteli pääasiassa James E. Talmage, jakoi tekstin lukuihin ja jakeisiin ja jätti pois ne ilmoitukset, jotka sisältyivät myös Opin ja liittojen kirjaan; vuoden 1921 laitos ladottiin kahteen palstaan. Vuonna 1976 kirjaan lisättiin kaksi uutta ilmoitusta — näky selestisestä valtakunnasta ja Joseph F. Smithin näky kuolleiden lunastuksesta — ja vuonna 1979 kirkko siirsi ne Opin ja liittojen kirjaan, jonka vuoden 1981 laitoksessa ne ovat pykälinä 137 ja 138.
hero.3=Nykyisessä laitoksessa on viisi osaa. Valintoja Mooseksen kirjasta sekä Joseph Smith – Matteus ovat otteita Joseph Smithin vuonna 1830 aloittamasta King James -raamatun tarkistuksesta: edellinen on laajennettu kertomus 1. Mooseksen kirjan alkuluvuista Moosekselle annettujen näkyjen kehyksessä, jälkimmäinen Matteuksen evankeliumin jakeen 23:39 ja luvun 24 uudelleenmuotoilu. Abrahamin kirja on teksti, jonka Smith sanoi kääntäneensä egyptiläisistä papyruksista, jotka hankittiin Kirtlandissa Ohiossa vuonna 1835; se julkaistiin vuonna 1842 Times and Seasons -lehdessä Nauvoossa Illinoisissa yhdessä kolmen kuvan kanssa, joita nykyään kutsutaan faksimileiksi 1, 2 ja 3. Joseph Smith – Historia on otettu hänen vuonna 1838 laatimastaan kertomuksesta varhaisvuosistaan ja näyistään, ja Uskonkappaleet ovat kolmetoista uskon lausumaa kirjeestä, jonka hän lähetti vuonna 1842 chicagolaiselle lehdentoimittajalle John Wentworthille.
hero.4=Abrahamin kirja on osa, joka on useimmin asetettu kyseenalaiseksi. Suurimman osan papyruksista uskottiin pitkään tuhoutuneen, todennäköisesti Chicagon palossa vuonna 1871, mutta kymmenen aikanaan Joseph Smithin hallussa ollutta katkelmaa löytyi Metropolitan Museum of Artista New Yorkista, joka luovutti ne kirkolle vuonna 1967. Tutkijat tunnistavat katkelmat osiksi tavanomaisia egyptiläisiä hautatekstejä, jotka on kirjoitettu 3. vuosisadan eaa. ja 1. vuosisadan jaa. välisenä aikana, ja kirkon oma kirjasta julkaisema kirjoitus myöntää, ettei yksikään katkelmien merkeistä mainitse Abrahamin nimeä eikä mitään kirjassa kerrottua tapahtumaa.
hero.5=Raamatun, Mormonin kirjan ja Opin ja liittojen kirjan ohella se on yksi Myöhempien Aikojen Pyhien Jeesuksen Kristuksen Kirkon neljästä standarditeoksesta; Community of Christ, toinen suuri Joseph Smithin liikkeestä periytyvä kirkko, ei lue sitä pyhiin kirjoituksiinsa. Tämän aineiston teksti on peräisin Mormon Documentation Project -hankkeen yleisomistukseen julistetusta JSON-aineistosta, samasta lähteestä kuin täällä olevat Mormonin kirja ja Opin ja liittojen kirja, ja se säilyttää viisi osaa viitenä kirjana: Mooseksen kirjassa on kahdeksan lukua, Abrahamin kirjassa viisi ja kolmessa viimeisessä yksi kussakin. Kolme faksimilea ja niiden yhteyteen painetut selitykset eivät ole jaetekstiä, joten ne eivät ole mukana. Kahden sisarteoksensa tavoin se noudattaa nykyisen standardilaitoksen sanamuotoa eikä mitään yksittäistä historiallista painosta, minkä takia sille ei tässä esitetä julkaisuvuotta.

