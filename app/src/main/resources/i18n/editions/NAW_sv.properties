fact.2.label=Sammanställare
fact.2.value=Yahya ibn Sharaf an-Nawawi (631–676 AH / 1233–1277)
fact.3.label=Namn
fact.3.value=Känd som al-Arba'in al-Nawawiyya ("An-Nawawis fyrtio hadither"); trots namnet omfattar samlingen fyrtiotvå hadither
fact.4.label=Sammanställd
fact.4.value=Mestadels från [[BUK|Sahih al-Bukhari]] och [[MUS|Sahih Muslim]], medan an-Nawawi ledde Ashrafiyya Dar al-Hadith i Damaskus (665 AH / 1267) fram till sin död i Nawa, Syrien, år 676 AH (1277)
fact.5.label=Metod
fact.5.value=Varje hadith vald som det an-Nawawi kallade en "stor grundpelare" (qa'ida azima) i religionen; en fortsättning på en äldre fyrtio-hadith-genre (arba'iniyyat) vars första, numera förlorade, exempel tillskrivs Abdullah ibn al-Mubarak (d. 797)
fact.6.label=Ställning
fact.6.value=Räknas allmänt bland de mest lästa verken inom sunniislam efter Koranen själv; föremål för dussintals kommentarer, mest känd Ibn Rajab al-Hanbalis Jami' al-'Ulum wal-Hikam
fact.7.label=Antal hadither
fact.7.value=42, trots namnet; detta korpus källutgåva räknar likaså
fact.8.label=I detta korpus
fact.8.value=1 bok och 42 numrerade hadither
