title=An-Nawawis fyrtio hadither — Om denna utgåva | Common Root
description=An-Nawawis fyrtio hadither: 42 hadither utvalda av imam an-Nawawi, var och en tänkt som en "stor grundpelare" (qa'ida azima) i religionen — det mest lästa verket i fyrtio-hadith-genren.
heroHeading=An-Nawawis fyrtio hadither
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Sharaf an-Nawawi föddes i muharram år 631 AH (oktober 1233) i Nawa nära Daraa i Syrien och flyttade vid arton års ålder till Damaskus för att studera. År 665 AH (1267) utsågs han till föreståndare för Ashrafiyya Dar al-Hadith i Damaskus, en post han innehade till sin död i Nawa år 676 AH (1277), i mitten av fyrtioårsåldern; han begravdes där. Som shafiitisk jurist skrev han flitigt under detta korta liv — bland hans andra verk finns Riyad al-Salihin, en kommentar till Sahih Muslim känd som Al-Minhaj, al-Majmu' Sharh al-Muhadhab, Minhaj al-Talibin och Kitab al-Adhkar.
hero.2=Al-Arba'in al-Nawawiyya fortsätter en äldre tradition av "fyrtio hadith"-samlingar (arba'iniyyat), vars utgångspunkt är en hadith som lovar den som bevarar fyrtio hadither om religionen en plats bland de lärda på Domedagen — en hadith som de flesta kritiker själva klassar som da'if (svag). Den första sådana samlingen, numera förlorad, tillskrivs Abdullah ibn al-Mubarak (d. 797); många lärda följde med egna samlingar. An-Nawawi valde hadither han bedömde som säkra, mestadels från [[BUK|Sahih al-Bukhari]] och [[MUS|Sahih Muslim]], var och en som exempel på det han kallade en "stor grundpelare" (qa'ida azima) i religionen — och trots namnet omfattar samlingen i sin nuvarande form fyrtiotvå hadither. Den blev det mest lästa exemplet i genren, fick dussintals kommentarer, mest känd Ibn Rajab al-Hanbalis Jami' al-'Ulum wal-Hikam, och räknas bland de mest lästa verken inom sunniislam efter Koranen själv.
hero.3=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-nawawi-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]] och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

