title=Revised Version — Bu Baskı Hakkında | Common Root
description=İngiliz Revised Version: İngiltere Kilisesi'nin şimdiye dek yetki verdiği tek King James Version gözden geçirmesi; 1881 ile 1894 arasında üç taksitte yayımlandı — ve burada King James Version ile American Standard Version arasındaki basamak.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=Revised Version, İngiltere Kilisesi'nin gerçekten ısmarladığı tek King James Version gözden geçirmesidir. Canterbury Konvokasyonu 1870'te buna karar verdi ve her Ahit için birer tane olmak üzere iki heyet atadı; bu heyetlerde çeşitli mezheplerden elliden fazla İngiliz âlim bir araya geldi — yalnızca Anglikanlar değil, ki bu başlı başına yeniydi ve tartışıldı. Amerikalı âlimler mektupla katılmaya çağrıldı ve katıldılar. Talimat ihtiyatlıydı: Authorised Version yalnızca sadakatle aktarılmış asıl dillerin gerektirdiği yerlerde değiştirilecekti. Yeni Ahit 1881'de, Eski Ahit 1885'te, en son üzerinde çalışılan apokrifa ise 1894'te çıktı.
hero.2=İhtiyatlı talimat, Yeni Ahit heyetinin kitaptaki en sonuç doğurucu kararı almasına engel olmadı. Textus Receptus üzerinden çalışmadılar. Westcott ile Hort o heyette oturuyordu ve iş ilerledikçe kendi Yunanca metinlerini prova halinde heyetin önüne koydular; gözden geçirenlerin karar kıldığı şey, tam olarak Westcott ile Hort'unki değil, kendi seçmeci metinleriydi, ama bu metin kesin biçimde daha eski unsiyal yazmalara doğru kaydı. Bu baskıyı King James Version'ın yanına iki sütun halinde koyun, kayma hemen görünür. 1. Yuhanna 5:7'de King James sütunu “For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one” okur, bu sütun ise “And it is the Spirit that beareth witness, because the Spirit is the truth” okur.
hero.3=İngiliz gözden geçirenlerin değiştirmediği şey, tam da Amerikalıların en çok değişmesini istediği şeydir. Mezmur 23:1'de bu baskı hâlâ “The LORD is my shepherd” basar, tıpkı King James Version gibi; üstündeki American Standard Version ise “Jehovah is my shepherd” basar. Ad burada yalnızca King James Version'ın kendisinin bastığı yerde geçer — Mısır'dan Çıkış 6:3'te ikisi de “by my name JEHOVAH” okur — ve adı bütün Eski Ahit boyunca taşımak Amerikan tercihiydi; on dört yıllık anlaşma uyarınca eke havale edildi ve metne ancak 1901'de bırakıldı. İki sütunu birlikte okumak, o anlaşmanın fiilen neyi geri tuttuğunu görmenin en kısa yoludur. İkinci bir fark, cümlelerin lafzından çok biçiminde belirir: gözden geçirenler satır başına bir ayet dizgisiyle bağı kopardılar ve düzyazıyı paragraflar halinde dizdiler; izi burada, bir cümleyi sürdürdükleri için küçük harfle başlayan ayetlerde kalmıştır — Mısır'dan Çıkış 6:3'teki “and I appeared unto Abraham”, oysa King James sütunu “And I appeared” diye başlar.
hero.4=Bu baskının kartı yılı boş bırakır ve bu, bir eksiklik değil, dürüst cevaptır. Revised Version bir kez değil üç kez yayımlandı ve buradaki metin seksen kitaplık olanıdır: altmış altı kitap ve onlara eklenen apokrifanın on dördü, toplam 36.873 ayet; yani 1894'ten önce basılı olarak var olmayan malzemeyi taşır. Derlemenin kaydı ona 1885 damgasını vurur — Eski Ahit'in Kitabımukaddes'i tamamladığı yıl — ve soy basamağı rozetinin gösterdiği yıl da budur. Metnin hangi baskıdan indiği kayıtlı değildir — derlemenin King James Version için ve 1776 tarihli Fin Biblia'sı için açık bıraktığı aynı boşluk. Şuna da dikkat edin: hiçbir arayüz bu baskıyla açılmaz; İngilizce arayüz New International Version ile açılır, buna ise geçilir.

