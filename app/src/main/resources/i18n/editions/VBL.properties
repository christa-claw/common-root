title=Versión Biblia Libre — About This Edition | Common Root
description=Versión Biblia Libre: a Spanish Bible from Free Bible Ministry, translated by Jonathan Gallagher and Shelly Barrios de Avila as the Spanish sibling of the English Free Bible Version, and freely licensed for any use.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — "the Free Version of the Bible" — is the Spanish-language sibling of the English Free Bible Version, issued by the same publisher, Free Bible Ministry, a not-for-profit based in Laurel, Maryland. Its New Testament is credited to the translators Jonathan Gallagher and Shelly Barrios de Avila, with Gustavo Sanabria and Rebekah Põldaas as contributors, and carries a copyright dated 2018–2020 to Gallagher and Barrios de Avila. Like its English sibling, it exists to remove the copyright page as an obstacle to use: the text may be copied, printed, posted online, or adapted by anyone, with no royalty and no permission to ask for.
hero.2=The published front matter documents the New Testament's basis plainly — translated directly from the Nestle–Aland Greek text, the critical text the Bible Societies use — but does not separately name a source text for the Old Testament, even though the edition held in this corpus is the complete, sixty-six-book Protestant canon. Where the materials leave a gap, it is left here too, rather than filled with a guess.
hero.3=In this reader it is one of five Spanish editions. The Spanish interface still opens by default on [[RVR09|Reina-Valera 1909]], a public-domain text from an entirely separate, centuries-older tradition; this edition is reached instead from its own card, alongside [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] and [[NBLA|Nueva Biblia de las Américas]]. It is not a revision of any of them, so no parent is recorded for it in the lineage rungs — a rung opened beneath a Versión Biblia Libre verse goes straight to the original-language floor marked ≈. Its closest relative in this corpus is not Spanish at all: [[FBV|the Free Bible Version]], the English translation from the same ministry, under the same licence.

