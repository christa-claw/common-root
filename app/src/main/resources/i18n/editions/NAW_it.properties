title=I quaranta hadith di an-Nawawi — Su questa edizione | Common Root
description=I quaranta hadith di an-Nawawi: 42 hadith scelti dall'imam an-Nawawi, ciascuno pensato come un "grande fondamento" (qa'ida azima) della religione — l'opera più letta del genere dei quaranta hadith.
heroHeading=I quaranta hadith di an-Nawawi
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Sharaf an-Nawawi nacque nel mese di muharram dell'anno 631 AH (ottobre 1233) a Nawa, vicino a Daraa, in Siria, e si trasferì a diciotto anni a Damasco per studiare. Nel 665 AH (1267) fu nominato a capo della Dar al-Hadith al-Ashrafiyya di Damasco, incarico che mantenne fino alla morte, avvenuta a Nawa nel 676 AH (1277), a metà dei quarant'anni; qui fu sepolto. Giurista sciafiita, scrisse copiosamente in quella breve vita — tra le sue altre opere figurano Riyad al-Salihin, un commento al Sahih Muslim noto come Al-Minhaj, al-Majmu' Sharh al-Muhadhab, Minhaj al-Talibin e Kitab al-Adhkar.
hero.2=Al-Arba'in al-Nawawiyya continua una tradizione più antica di raccolte di "quaranta hadith" (arba'iniyyat), la cui premessa è un hadith che promette a chi conserva quaranta hadith sulla religione un posto tra i dotti nel Giorno del Giudizio — un hadith che la maggior parte dei critici classifica essa stessa come da'if (debole). La prima raccolta di questo genere, oggi perduta, è attribuita ad Abdullah ibn al-Mubarak (m. 797); molti dotti ne fecero poi di proprie. An-Nawawi scelse hadith che giudicava solidi, perlopiù dal [[BUK|Sahih al-Bukhari]] e dal [[MUS|Sahih Muslim]], ciascuno a illustrare ciò che egli chiamava un "grande fondamento" (qa'ida azima) della religione — e nonostante il nome, la raccolta come si presenta oggi conta quarantadue hadith. Divenne l'esempio più letto del genere, ricevette decine di commenti, il più celebre il Jami' al-'Ulum wal-Hikam di Ibn Rajab al-Hanbali, e si conta tra le opere più lette dell'islam sunnita dopo il Corano stesso.
hero.3=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-nawawi di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]], il [[NAS|Sunan an-Nasa'i]], il [[IBM|Sunan Ibn Majah]], il [[MAL|Muwatta Malik]] e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=Arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Yahya ibn Sharaf an-Nawawi (631–676 AH / 1233–1277)
fact.3.label=Titolo
fact.3.value=Noto come al-Arba'in al-Nawawiyya ("i quaranta hadith di an-Nawawi"); nonostante il nome, la raccolta conta quarantadue hadith
fact.4.label=Compilato
fact.4.value=Perlopiù dal [[BUK|Sahih al-Bukhari]] e dal [[MUS|Sahih Muslim]], mentre an-Nawawi dirigeva la Dar al-Hadith al-Ashrafiyya di Damasco (665 AH / 1267) fino alla morte a Nawa, in Siria, nel 676 AH (1277)
fact.5.label=Metodo
fact.5.value=Ogni hadith scelto come ciò che an-Nawawi chiamava un "grande fondamento" (qa'ida azima) della religione; prosegue un genere più antico di quaranta hadith (arba'iniyyat) il cui primo esempio noto, oggi perduto, è attribuito ad Abdullah ibn al-Mubarak (m. 797)
fact.6.label=Posizione
fact.6.value=Largamente contato tra le opere più lette dell'islam sunnita dopo il Corano stesso; oggetto di decine di commenti, il più celebre il Jami' al-'Ulum wal-Hikam di Ibn Rajab al-Hanbali
fact.7.label=Numero di hadith
fact.7.value=42, nonostante il nome; l'edizione fonte di questo corpus li conta allo stesso modo
fact.8.label=In questo corpus
fact.8.value=1 libro e 42 hadith numerati
fact.9.label=Traduzione inglese
fact.9.value=Tratta dall'edizione eng-nawawi di fawazahmed0/hadith-api, mostrata in accompagnamento all'arabo; da quale traduzione a stampa discenda non è ancora confermato da parte di questo corpus
fact.10.label=Licenza
fact.10.value=Il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
