title=Louis Segond 1910 (francese) — Su questa edizione | Common Root
description=La Bibbia Segond nella revisione del 1910: la traduzione di un pastore ginevrino dall'ebraico e dal greco, stampata per intero la prima volta nel 1880, riveduta per la Società Biblica Britannica e Forestiera e per un secolo la Bibbia corrente dei protestanti francofoni.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond nacque nel 1810 a Plainpalais, allora alle porte di Ginevra, e morì a Ginevra nel 1885. Studiò teologia alla facoltà protestante di Strasburgo, si addottorò in teologia a ventisei anni e fu per ventiquattro anni pastore della parrocchia di villaggio di Chêne-Bougeries prima di volgersi all'insegnamento dell'ebraico e dell'Antico Testamento. La Venerabile Compagnia dei Pastori di Ginevra gli affidò il compito di tradurre di nuovo l'Antico Testamento dall'ebraico, e la sua versione uscì in un'edizione datata 1874. Poi tradusse di sua iniziativa il Nuovo Testamento, sul testo greco critico di Constantin Tischendorf e non sul Textus Receptus, e nel 1880 uscì l'intera Bibbia in un solo volume, stampata a Oxford.
hero.2=Questo non è proprio il testo che Segond pubblicò. Dopo la sua morte la Società Biblica Britannica e Forestiera lo fece rivedere da un gruppo di pastori e teologi francesi e svizzeri, e la revisione uscì nel 1910. I loro cambiamenti piegavano verso il lessico dell'ortodossia protestante — i sacerdoti divennero «sacrificateurs», la vecchia parola protestante, anziché «prêtres»; in questa copia «sacrificateur» è ovunque e «prêtre» raro. Fu questo testo del 1910 a diventare la Bibbia di riferimento del protestantesimo francese per gran parte del Novecento, e resta tra le più lette dagli evangelici francofoni. Ha anche una lunga famiglia di revisioni successive: la «Colombe» del 1978, la Nouvelle Édition de Genève del 1979 e la Segond 21 nel 2007. Alcuni tratti si vedono quasi a ogni pagina. Il nome divino è «l'Éternel», l'Eterno, come in Ostervald e nella Darby francese che le sta accanto in questo corpus: «L'Éternel est mon berger» al Salmo 23. E Isaia 7:14 legge «la jeune fille deviendra enceinte» — la giovane donna, non la vergine — proprio il genere di resa per cui alcuni protestanti conservatori accusarono Segond di indebolire le profezie messianiche.
hero.3=Nei Salmi il libro segue l'ebraico: la numerazione è quella ebraica, sicché il Salmo 23 è quello del pastore, e dove il titolo di un salmo è un versetto in ebraico lo è anche qui — il Salmo 51 ha 21 versetti, due più che nella King James Version. Gioele e Malachia, invece, mantengono la divisione in capitoli della tradizione latina e inglese, tre capitoli e quattro. In questo lettore è una di tre Bibbie francesi, accanto a Ostervald e alla Darby francese. Un'interfaccia in francese non si apre su di essa: il francese non ha una scelta curata, così il lettore prende la prima Bibbia francese nell'ordine del catalogo, che è la Darby. Nei pioli della discendenza non le è registrato alcun antecedente, sicché un piolo aperto sotto un versetto scende dritto al pavimento delle lingue originali segnato con ≈ — per l'Antico Testamento il Codice di Leningrado, un manoscritto della tradizione masoretica e non un ebraico a stampa dell'epoca di Segond, e per il Nuovo il Textus Receptus, cioè proprio il greco che egli scelse di non seguire. Il suo segno di piolo porta l'anno 1910.

