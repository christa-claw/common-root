fact.2.label=翻訳者
fact.2.value=ルイ・スゴン（1810–1885）。シェーヌ＝ブジュリのジュネーヴ教会の牧師で、のちにヘブライ語と旧約聖書の教師
fact.3.label=委嘱者
fact.3.value=ジュネーヴの尊敬すべき牧師団（旧約聖書について）。新約聖書は彼が自ら引き受けた
fact.4.label=初版
fact.4.value=旧約聖書は1874年の日付をもつ版。聖書全巻は1巻本で、オックスフォード、1880年
fact.5.label=この改訂
fact.5.value=1910年、英国内外聖書協会のために、フランスとスイスの牧師・神学者のグループによる
fact.6.label=翻訳の底本
fact.6.value=旧約聖書のヘブライ語・アラム語本文（このコーパスが[[WLC|レニングラード写本]]として収める伝統）と、ティッシェンドルフの校訂ギリシャ語新約聖書。[[TR|テクストゥス・レセプトゥス]]ではない
fact.7.label=神名
fact.7.value=「l'Éternel」（永遠なる者）。旧約聖書全体を通じて
fact.8.label=後の改訂版
fact.8.value=「Colombe」（1978年）、Nouvelle Édition de Genève（1979年）、Segond 21（2007年）など
fact.9.label=内容
fact.9.value=66巻——プロテスタントの正典であり、外典は含まない。詩編はヘブライ語式の番号付けで、表題も節として数える
fact.10.label=ライセンス
fact.10.value=パブリックドメイン。このコピーは eBible.org から
fact.11.label=このコーパスでは
fact.11.value=オステルヴァルト訳、[[DBY|フランス語ダービー訳]]と並ぶ3つのフランス語聖書の一つ。フランス語のインターフェースが開くのはダービー訳であり、これではない。系譜の段には母本が記録されておらず、段のチップには1910年と表示される
