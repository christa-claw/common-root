title=ルイ・スゴン訳聖書1910年（フランス語） — この版について | Common Root
description=1910年改訂版のスゴン訳聖書。ジュネーヴの牧師がヘブライ語とギリシャ語から訳し、1880年に初めて全巻が印刷され、英国内外聖書協会のために改訂され、1世紀にわたりフランス語圏プロテスタントの標準的な聖書であった。
heroHeading=ルイ・スゴン訳聖書1910年
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=ルイ・スゴンは1810年、当時はジュネーヴのすぐ外にあったプランパレに生まれ、1885年にジュネーヴで没した。ストラスブールのプロテスタント神学部で神学を学び、26歳で神学博士となり、24年間シェーヌ＝ブジュリの村の教区で牧師を務めたのち、ヘブライ語と旧約聖書の教育に転じた。ジュネーヴの尊敬すべき牧師団は彼に旧約聖書をヘブライ語から新たに訳すよう委嘱し、その訳は1874年の日付をもつ版として世に出た。その後、彼は自らの発意で新約聖書を訳したが、底本はテクストゥス・レセプトゥスではなく、コンスタンティン・ティッシェンドルフの校訂ギリシャ語本文であった。そして1880年、聖書全体が1巻にまとめられ、オックスフォードで印刷された。
hero.2=これはスゴンが出版した本文そのものではない。彼の死後、英国内外聖書協会がフランスとスイスの牧師・神学者のグループに改訂を依頼し、その改訂版が1910年に出た。改訂はプロテスタント正統主義の語彙へと傾いた——祭司は「prêtres」ではなく、古いプロテスタントの語である「sacrificateurs」となった。このコピーでは「sacrificateur」がいたるところに現れ、「prêtre」はまれである。この1910年の本文こそが、20世紀の大半を通じてフランス・プロテスタントの基準となる聖書となり、今もフランス語圏の福音派で最もよく読まれる聖書の一つである。その後の改訂版の系統も長い。1978年の「Colombe」、1979年のNouvelle Édition de Genève、そして2007年のSegond 21である。いくつかの特徴はほぼどのページにも見える。神名は「l'Éternel」（永遠なる者）であり、オステルヴァルト訳や、このコーパスで隣に並ぶフランス語ダービー訳と同じである。詩編23編は「L'Éternel est mon berger」となっている。そしてイザヤ書7:14は「la jeune fille deviendra enceinte」——処女ではなく若い女——と読む。一部の保守的なプロテスタントが、スゴンはメシア預言を弱めたと非難したのは、まさにこの種の訳であった。
hero.3=詩編について、この本はヘブライ語に従っている。番号付けはヘブライ語式で、詩編23編が羊飼いの詩編であり、ヘブライ語で表題が1節に数えられる箇所では、ここでも1節となる——詩編51編は21節あり、キング・ジェイムズ・バージョンより2節多い。一方ヨエル書とマラキ書は、ラテン語・英語の伝統の章分けを保っており、それぞれ3章と4章である。この読書環境において、これはオステルヴァルト訳、フランス語ダービー訳と並ぶ3つのフランス語聖書の一つである。フランス語のインターフェースはこれを開かない。フランス語には選定された既定の版がないため、読書環境はカタログ順で最初のフランス語聖書を取り、それはダービー訳だからである。系譜の段には母本が記録されていないため、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る——旧約ではレニングラード写本、すなわちスゴンの時代の活字ヘブライ語本文ではなくマソラ伝統の写本であり、新約ではテクストゥス・レセプトゥス、まさに彼が従わないことを選んだギリシャ語本文である。その段のチップには1910年の年が付いている。

