title=Emphatic Diaglott (interlineal) — Acerca de esta edición | Common Root
description=El Emphatic Diaglott de Benjamin Wilson, de 1864: la glosa inglesa palabra por palabra impresa debajo del griego de Griesbach, después comprada y reimpresa durante sesenta años por la Sociedad Watch Tower, y el texto sobre el que suele librarse la discusión de Juan 1:1.
heroHeading=Emphatic Diaglott (interlineal)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson no era un erudito de oficio. Era director de un periódico en Geneva, Illinois, aprendió griego por su cuenta y entre 1857 y 1863 fue publicando, por entregas, un Nuevo Testamento interlineal que no solo había traducido sino fabricado: su sobrino lo vio tomar impresiones en cera de cada página de tipos, colgarlas toda la noche en ácido para que criaran una piel de cobre, respaldar el cobre con metal fundido e imprimir el resultado en una prensa de mano mientras el muchacho entintaba la plancha. El volumen terminado apareció en 1864. Para el griego usó el texto que Johann Jakob Griesbach había establecido en la década de 1770, con lecturas tomadas del Códice Vaticano.
hero.2=Lo que Wilson imprimió en realidad fueron dos textos ingleses, no uno. Por el margen izquierdo de la página corría el griego con una glosa literal palabra por palabra debajo de cada término; por el derecho, su propia traducción pulida, la Emphatic Version. No son lo mismo, y en Juan 1:1 se contradicen abiertamente: la glosa dice «and a god was the Word», y la Emphatic Version «and the LOGOS was God». Ambas son de Wilson, impresas en el mismo libro a unos centímetros de distancia. Este corpus contiene la glosa, que es la columna que la gente cita, y esa es la razón de que esté en una sección propia y no en la rejilla de las Biblias. Una glosa registra cómo está armada una frase griega —caso por caso, artículo por artículo, en el orden griego de las palabras—. No es un juicio sobre cómo debe leerse la frase en inglés, y el juicio del propio Wilson al respecto está impreso en la columna de al lado. Quien cite la una debería saber que la otra existe.
hero.3=La vida posterior del libro es la razón de que la mayoría haya oído hablar de él. Wilson murió en 1900 siendo miembro de la Church of the Blessed Hope, no de ningún grupo que existiera entonces con el nombre de testigos de Jehová. En 1902 Charles Taze Russell, presidente de la Watch Tower Bible and Tract Society, obtuvo el derecho de autor de los herederos de Wilson y con el tiempo también las planchas. La Sociedad imprimió el Diaglott durante los sesenta años siguientes: recompuso los tipos en sus propias prensas en 1927, tiró bastante más de ciento cincuenta mil ejemplares, lo vendió a dos dólares y acabó regalándolo. Así que el Diaglott es un libro de los testigos de Jehová por adopción y no por autoría, y su costumbre de imprimir «Jehová» en el Nuevo Testamento, donde los escritores pusieron κύριος al citar las escrituras hebreas, llegó cuatro décadas antes que el movimiento que hizo célebre esa práctica. El derecho de autor caducó en 1952 y desde entonces está en dominio público.
hero.4=Dos cosas sobre él en este lector conviene saber antes de usarlo. Griesbach no imprimió Hechos 8:37 ni Lucas 17:36, de modo que ninguno está aquí; en lugar de cerrar el hueco y subir un puesto a cada versículo posterior, la numeración deja vacíos esos dos lugares, para que una referencia caiga en el mismo versículo en esta columna que en la de al lado. Y no se le registra antecedente alguno, así que abrir un peldaño del linaje bajo un versículo del Diaglott lleva al suelo de lenguas originales y no a una edición inglesa más antigua.
hero.5=Conviene ser preciso sobre lo que imprime ese suelo. El griego que muestra es el Textus Receptus —la etiqueta dice ≈ TR 1550, y ese ≈ es el lector diciendo que ofrece un testigo del griego y no el texto del que se hizo esta edición—. Wilson trabajó a partir de Griesbach. Donde ambos coinciden, como en Juan 1:1, el peldaño sí muestra las mismísimas palabras glosadas. Donde difieren, no: Griesbach rechazó la cláusula trinitaria de 1 Juan 5:7, de modo que el Diaglott no conserva rastro de ella, mientras que la línea del Textus Receptus de debajo la lleva entera. En un interlineal, cuya premisa entera es que el griego está ahí mismo en la página, esa es la única laguna que vale la pena conocer antes de citarlo.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Qué es esto
fact.1.value=la glosa sublineal — el inglés palabra por palabra impreso debajo del griego, no la traducción legible de Wilson
fact.2.label=Compilado por
fact.2.value=Benjamin Wilson (1817–1900), erudito autodidacta y director de periódico en Geneva, Illinois
fact.3.label=Texto griego
fact.3.value=la recensión de Griesbach, con lecturas del Códice Vaticano (manuscrito Vaticano 1209)
fact.4.label=Publicado
fact.4.value=por entregas desde 1857; completo en un volumen en 1864, por Fowler and Wells de Nueva York
fact.5.label=Cómo se imprimió
fact.5.value=Wilson galvanotipió él mismo cada plancha y tiró la primera edición en una prensa de mano
fact.6.label=El nombre divino
fact.6.value=imprime «Jehová» en el Nuevo Testamento donde los escritores pusieron κύριος al citar la escritura hebrea — la misma decisión que tomó [[ASV|la American Standard Version]] a lo largo del Antiguo
fact.7.label=Adquirido por
fact.7.value=la Watch Tower Bible and Tract Society, que obtuvo el derecho de autor en 1902 bajo Charles Taze Russell, recompuso los tipos en 1927 y lo imprimió hasta entrada la década de 1960
fact.8.label=Licencia
fact.8.value=dominio público — el derecho de autor caducó en 1952, y las reimpresiones de la Watch Tower no añadieron ninguno nuevo
fact.9.label=Faltan dos versículos
fact.9.value=Hechos 8:37 y Lucas 17:36 no están en Griesbach, y por eso no están aquí; sus números se dejan vacíos en vez de cerrarse, de modo que el texto sigue alineado versículo a versículo con cualquier otra edición
fact.10.label=El griego bajo el peldaño
fact.10.value=el [[TR|Textus Receptus]], mostrado como ≈ TR 1550 — un testigo del griego, no el texto base de Wilson, que era la recensión de Griesbach; ambos coinciden en Juan 1:1 y se separan en 1 Juan 5:7
fact.11.label=En este corpus
fact.11.value=guardado en su propia sección de ediciones interlineales y de estudio, aparte de las Biblias de lectura, para que una glosa no se tome nunca por una traducción; no se registra texto base en los peldaños del linaje, así que un peldaño abre directamente sobre el suelo de lenguas originales
