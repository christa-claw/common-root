title=World English Bible — À propos de cette édition | Common Root
description=La World English Bible : révision en anglais moderne de l'American Standard Version de 1901, commencée en 1994 par Michael Paul Johnson, dont le Nouveau Testament a été conformé au texte majoritaire grec, et délibérément placée dans le domaine public.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=La World English Bible doit son existence à un problème de droit d'auteur. En 1994, Michael Paul Johnson, ingénieur qui traduisait la Bible sur les heures que lui laissait un emploi à plein temps, calcula le temps qu'il lui faudrait pour achever une Bible en anglais moderne que chacun pourrait copier librement, et la réponse ne lui plut pas. Il cessa de traduire à partir de rien et recommença à partir de l'American Standard Version de 1901 — exacte, respectée et, à la différence de la Bible du roi Jacques (encore grevée en Angleterre et au pays de Galles par les lettres patentes de la Couronne), entièrement libre de droits. Un programme qu'il écrivit lui-même parcourut l'ASV à la recherche des mots qu'aucune Bible moderne n'employait, proposa des remplacements et effectua les substitutions en un quart d'heure environ. Tout ce que le programme ne savait pas faire — l'ordre des mots, la ponctuation, les guillemets — fut fait à la main dans les années suivantes, et le texte parut, et reparut en révisions, à partir de 1997.
hero.2=Deux choses la séparent de l'édition qu'elle révise. La première est le grec. Le Nouveau Testament de l'ASV suivait le texte critique des réviseurs, proche de ce qui allait devenir l'édition Nestle-Aland ; la World English Bible fut au contraire conformée au texte majoritaire byzantin, si bien qu'elle n'est ni le texte de sa souche ni le Textus Receptus dont usaient les traducteurs du roi Jacques. La seconde est le nom divin. L'ASV imprimait « Jehovah » ; la World English Bible imprime « Yahweh », avec une note à Genèse 2:4 qui explique ce choix au lecteur qui attend « the LORD ». L'édition britannique revient à « LORD » — l'exemplaire de ce corpus est l'américain, c'est donc « Yahweh » que l'on lit. Hors de ces deux décisions, elle reste une traduction d'équivalence formelle à la manière de sa souche : le même suivi étroit de l'ordre des mots hébreu et grec, dans une orthographe et une grammaire qui ne demandent plus de glose.
hero.3=Dans le lecteur, c'est une feuille, et la seule de la plus longue branche du corpus. Ouvrez un échelon sous un verset de la World English Bible et l'American Standard Version apparaît en dessous, et sous elle la Revised Version, la Bible du roi Jacques et la Bible de Genève, jusqu'au sol des langues originales marqué d'un ≈. Rien dans le corpus ne repose à son tour sur la World English Bible. C'est aussi le texte le plus large de cette branche : l'American Standard Version n'avait pas d'apocryphes, ceux de la World English Bible furent donc établis à part, d'après les apocryphes du roi Jacques et la Septante anglaise de Brenton, et notre exemplaire porte quatre-vingts livres là où l'ASV qui est en dessous en porte soixante-six — dont 3 et 4 Maccabées et le Psaume 151, que les apocryphes du roi Jacques n'ont pas. Baruch, qu'ils ont, manque à notre exemplaire. La page À propos laisse vide la colonne de l'année pour cette édition, et à juste titre : il n'y a pas d'année de publication unique. Le corpus estampille 2000 pour que les pastilles des échelons aient de quoi se classer.

