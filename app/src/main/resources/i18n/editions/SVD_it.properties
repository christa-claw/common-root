title=Smith & Van Dyck — Su questa edizione | Common Root
description=La Bibbia araba di Smith e Van Dyck: iniziata da Eli Smith a Beirut e compiuta da Cornelius Van Dyck nel 1865 con i dotti della Nahda Butrus al-Bustani, Nasif al-Yaziji e Yusuf al-Asir; resta la Bibbia araba più letta.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=La missione americana di Beirut avviò questa traduzione verso il 1847, e chi la cominciò non la finì. Eli Smith aveva passato due decenni nel Levante e conosceva la lingua abbastanza da discuterne; lavorò al testo fino alla morte, nel 1857. Cornelius Van Alen Van Dyck la rilevò e la portò a termine: il Nuovo Testamento fu pronto nel 1860, l'Antico cinque anni dopo, nel 1865. I due nomi sul libro sono le due metà di un unico lavoro.
hero.2=I nomi che non stanno sul dorso pesano altrettanto. Van Dyck aveva imparato il suo arabo da Butrus al-Bustani e da Nasif al-Yaziji, e l'uno e l'altro lavorarono con lui alla traduzione, come vi lavorò lo shaykh Yusuf al-Asir, che rivide l'arabo per l'idiotismo e lo stile. Quei tre non erano aiutanti di un'impresa missionaria. Erano fra le figure centrali della Nahda, il risveglio letterario arabo, e ciò che ne uscì si legge come prosa araba e non come una traduzione travestita da araba. Per questo il libro sopravvisse alla missione che l'aveva pagato.
hero.3=Fu un'impresa tipografica non meno che erudita. L'American Press di Beirut lo compose in un carattere arabo inciso per la missione e compiuto nel 1843, quella lettera che ancora si chiama al-Amerikani e alla cui forma Smith aveva messo mano. L'arabo è difficile da comporre bene — le lettere si legano e legandosi mutano figura — e una Bibbia che sulla pagina aveva l'aspetto giusto fece per la propria accoglienza più di quanto avrebbe fatto un argomento. Ne sono usciti da allora milioni di esemplari, verso lettori protestanti e copti allo stesso modo, e per la maggior parte dei cristiani di lingua araba la Bibbia suona semplicemente così.
hero.4=In questo lettore è l'unica Bibbia araba, e ciò decide come si comporta. Se si mette l'interfaccia in arabo, è questa ad aprirsi: non perché sia stata scelta, come fu scelta la Reina-Valera 1909 per lo spagnolo, ma perché il catalogo cerca una Bibbia nella lingua dell'interfaccia e ne trova esattamente una. È inoltre una delle sole due edizioni qui il cui testo corre da destra a sinistra; l'altra è la Bibbia ebraica moderna. Nei pioli della discendenza non le è registrato alcun testo base, sicché un piolo aperto sotto un versetto cade diritto sul pavimento delle lingue originali contrassegnato con ≈ — cosa che qui coglie più da vicino del solito, perché il greco che quel pavimento offre è il Textus Receptus, e dal Textus Receptus il suo Nuovo Testamento fu fatto.

