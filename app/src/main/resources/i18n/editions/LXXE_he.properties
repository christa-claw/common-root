title=תרגום השבעים האנגלי של ברנטון — על מהדורה זו | Common Root
description=תרגומו האנגלי של סר לנסלוט ברנטון לברית הישנה היוונית, שראה אור לראשונה בלונדון ב־1844 ושוב, עם הספרים החיצוניים, ב־1851 — במשך יותר ממאה שנה תרגום השבעים האנגלי, ובקורא זה השלב שמעל הנוסח היווני שממנו תורגם.
