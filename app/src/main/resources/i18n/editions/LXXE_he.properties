# The narrative, one paragraph per key, in order.
hero.1=לנסלוט צ'ארלס לי ברנטון (1807–1862) היה בנו של אדמירל בצי המלכותי, סר ג'הליל ברנטון, והוסמך לכמורה בכנסייה האנגליקנית ב־1830, שנתיים אחרי שסיים את לימודיו בקולג' אוריאל באוקספורד. הוא לא נשאר בה זמן רב. באוקספורד פגש את ג'ון נלסון דארבי, ועד סוף 1831 כבר עזב את הכנסייה הממוסדת כדי לייסד קפלה עצמאית בבאת'; עד 1835 הייתה הקפלה קשורה לאחים מפלימות', התנועה שדארבי עיצב אז. גם התרגומים של דארבי עצמו נמצאים באוסף זה, בצרפתית ובאנגלית. ב־1844 ירש ברנטון את תואר הברונט מאביו, ובאותה שנה הוציאה הוצאת סמואל באגסטר ובניו בלונדון את תרגומו לתרגום השבעים. הוא מת באי וייט ב־1862, ערירי, הברונט האחרון בשושלתו.
hero.2=זה לא היה תרגום השבעים האנגלי הראשון — צ'ארלס תומסון פרסם אחד בפילדלפיה ב־1808 — אבל זה היה התרגום ששרד: במשך יותר ממאה וחמישים שנה, עד שהופיע ב־2007 ה־New English Translation of the Septuagint, קורא אנגלית שרצה את הברית הישנה היוונית ולא העברית קרא את ברנטון. הוא תרגם בעיקר מן הקודקס הוותיקני, כתב היד מן המאה הרביעית שבספריית הוותיקן. המהדורה הראשונה השמיטה את הספרים החיצוניים; מהדורת 1851 הוסיפה אותם, ונוסח 1851 הוא שהעותק הזה משחזר. מהדורותיו היווניות־אנגליות של באגסטר העמידו את היוונית לצד האנגלית, והיוונית הזאת נמצאת באוסף כמהדורה נפרדת. מאחר שהאנגלית הולכת אחר היוונית, היא קוראת היכן שהיוונית קוראת: המזמורים שומרים על המספור היווני, כך שמזמור 22 כאן הוא מזמור הרועה, ובישעיהו 7:14 “a virgin shall conceive” מתרגם את המילה היוונית parthenos, לא את העברית ʿalmah.
hero.3=בקורא זה הוא שלב בעל הורה אחד, ובמובן המילולי: תרגום השבעים היווני שמתחתיו הוא הנוסח שברנטון תרגם, שהודפס בידי המו"ל שלו עצמו לצד האנגלית שלו. פִּתחו שלב מתחת לאחד מפסוקיו ותופיע היוונית, ומתחתיה כתב יד לנינגרד כרצפת שפות המקור. דבר באוסף אינו עומד בתורו עליו. העותק שלנו צר מן הספר. יש בו 37 ספרים, אלה שגם בקאנון העברי נמצאים בשמותיהם הרגילים. קובצי eBible.org שממנו נלקח כוללים גם את הספרים החיצוניים — טוביה, יהודית, חכמת שלמה, בן סירא, ברוך, ארבעה ספרי מקבים ועוד — ומביאים את אסתר ואת דניאל רק בצורותיהם היווניות הארוכות. דבר מכל אלה לא הגיע לאוסף, ולכן אין כאן אסתר ואין דניאל, ובמקום שהיוונית שמתחת כוללת את טוביה או את חכמת שלמה אין מעליה אנגלית. עזרא ונחמיה עומדים כשני ספרים, במקום שבו ביוונית שמתחת הם ספר אחד. עדכון כתיב של אותו תרגום, ה־Updated Brenton של אדם בויד מ־2020, נמצא באוסף כמהדורה בפני עצמה.

