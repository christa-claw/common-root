title=奈萨仪圣训集 — 关于此版本 | Common Root
description=奈萨仪圣训集：艾哈迈德·伊本·舒艾卜·奈萨仪从其更大部的《大圣训集》中精选而成的圣训集，被伊本·哈贾尔认为是六大圣训集中除两部实录之外弱传圣训最少的一部。
heroHeading=奈萨仪圣训集
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=艾布·阿卜杜·拉赫曼·艾哈迈德·伊本·舒艾卜·伊本·阿里·奈萨仪大约于希吉拉历214—215年（公元829—830年）生于奈萨，呼罗珊的一座城镇，今属土库曼斯坦。他大约十五岁时开始游历以求学圣训，先师从古太拜·伊本·赛义德——曾在巴格兰随其求学一年有余——此后又游历伊拉克、希贾兹、叙利亚和埃及，师从包括伊斯哈格·伊本·拉赫瓦耶和《[[ABD|艾布·达乌德圣训集]]》编纂者艾布·达乌德·西吉斯坦尼等学者。他最终定居埃及，在当地授徒讲学，并以"哈菲兹·哈迪斯"（圣训记忆大师）著称；后世传记作者对他是否曾直接受教于穆罕默德·布哈里意见不一，艾兹米便主张二人从未谋面。晚年他从开罗出发前往麦加途中，在大马士革停留，按传统记载，他在那里就先知门弟子的美德发表的一次讲话，在该城反阿里情绪高涨之际激起了敌意人群；他不久后便去世，时为希吉拉历303年（公元915年），死因正是那次所受的伤。各说法对其安葬地点不一——一说葬于麦加萨法与麦尔卧之间，另一说葬于巴勒斯坦的拉姆拉。
hero.2=在归于他名下的约十五部著作中，六部与圣训有关。其中最大的一部《大圣训集》，他后来亲自将其精简为一部更简短的选本，称为《小圣训集》（意为"较小的圣训集"）或《穆吉塔巴》（意为"精选之作"）——如今单称"奈萨仪圣训集"所指的正是此书。至于究竟是何人、应何人之请而作此精选，本页所据资料并无记载。书中，奈萨仪按法学主题编排圣训，正如[[ABD|艾布·达乌德]]和[[TIR|提尔米济]]所做的那样。法学家伊本·哈贾尔·阿斯卡拉尼后来特别指出，此书在两部实录之后，是六大圣训集中弱传（达伊夫）圣训和不可靠传述人最少的一部，且完全没有伪造（毛杜）的圣训。
hero.3=逊尼派传统将奈萨仪圣训集列入六大圣训集（库图布·西塔），与[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]及[[TIR|提尔米济圣训实录]]并列，第六部则在伊本·马哲圣训集与其他候选之间尚存争议。至于它在四部圣训集（逊奈）中究竟排在何位，学界争论而未有定论：有些资料称它是六部中仅次于两部实录的第三权威之作，而本语料库自身关于[[ABD|艾布·达乌德圣训集]]和[[TIR|提尔米济圣训实录]]的页面，则反映了更常见的排序，即把艾布·达乌德之书列为第三。该书所载圣训数量也同样存在分歧：据一个广为引用的《穆吉塔巴》数字，共5,758则，含重复传述，而本语料库所据版本则编号至5,765则——两者在文献中并未得到调和。
hero.4=这里的阿拉伯语文本是公有领域的古典正文（matn）。在阅读器中，其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-nasai版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]、[[TIR|提尔米济圣训实录]]及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

