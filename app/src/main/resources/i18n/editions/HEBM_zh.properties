title=希伯来文圣经 — 关于此版本 | Common Root
description=整部圣经的希伯来文本：马所拉旧约，加上弗兰茨·德里慈 1877 年的新约——为要一部通体只用一种语言的圣经的读者，译回米示拿希伯来文。
heroHeading=希伯来文圣经 — 马所拉旧约与德里慈新约
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=一部从头到尾都是希伯来文的圣经，比听上去更为奇特，因为它有一半从来不曾用希伯来文写成。旧约是希伯来文的，向来如此。新约则以希腊文传下。所以像这样的一个版本，是两种截然不同的文本缝在一处：一个是原文，一个是朝着与通常相反的方向所作的翻译——从希腊文译回它的作者们大多所说的那种语言。
hero.2=新约的这一半出自弗兰茨·德里慈之手。他是莱比锡的希伯来文与拉比文献学者，1873 年受英国及海外圣经公会之托，1877 年完成。他并未译成自己那个世纪的希伯来文。他用米示拿与第二圣殿时期的希伯来文来写，理由是一世纪的文本理应听起来像一世纪的文本——因此其成果读来与其说是译入希伯来文，不如说是试图寻回这些句子在成为希腊文之前可能的模样。它至今仍是最常被取用的希伯来文新约。
hero.3=他依据哪一种希腊文，有一部分是别人替他定的。他起初依据西奈抄本——那部数十年前才被发现的四世纪写本——而圣经公会的方针是依公认文本出版，于是拒绝继续资助一部建立在西奈抄本之上的译本。德里慈退回公认文本，把重要的西奈读法标注出来，而不予采纳。此后这文本又流动了十三年、经十次修订版；最后一次由古斯塔夫·达尔曼于 1890 年送付印刷，那一年德里慈去世。这也是目录把此版本的年份留空的一个缘由：两半没有共同的日期，而有日期的那一半，日期有十个。
hero.4=在本阅读器中，这是希伯来文界面所打开的版本——是经过挑选的抉择，并非字母顺序的偶然——而选择希伯来文，会让整个界面围绕它由右向左翻转。它与列宁格勒抄本并列而不与之相争：抄本是学术用的塔纳赫，元音符号与诵读符号俱全，止于旧约所止之处；而这一部是朴素的辅音文本，一路延续到启示录。谱系阶梯中没有为它记录任何母本，因此在一节经文之下展开的阶梯径直落到原文底层，≈ WLC 与 ≈ TR。在本语料库的别处，那个底层是一种近似，而 ≈ 所警示的正是这一点。在此处它几乎不是：屏幕上的旧约就是马所拉文本，而公认文本正是德里慈当年确实摆在眼前的东西。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=语言
fact.1.value=希伯来文——不带元音符号与诵读符号的辅音文本
fact.2.label=这是什么
fact.2.value=装订为一部圣经的两种文本：传统的马所拉旧约，以及十九世纪由希腊文译成的希伯来文新约
fact.3.label=新约译者
fact.3.value=弗兰茨·德里慈（1813–1890），莱比锡的希伯来文学者
fact.4.label=委托者
fact.4.value=英国及海外圣经公会，1873 年；译事于 1877 年完成
fact.5.label=旧约出自
fact.5.value=马所拉希伯来文本身——并非翻译，这使它成为此处唯一一部旧约已然处于其原文语言中的版本，正如[[WLC|威斯敏斯特列宁格勒抄本]]一样
fact.6.label=新约出自
fact.6.value=[[TR|公认文本]]的希腊文。德里慈原本是从西奈抄本着手的，但圣经公会依公认文本出版，不肯资助这一偏离
fact.7.label=语体
fact.7.value=并非现代希伯来文。德里慈用米示拿与第二圣殿时期的希伯来文写作，力图把希腊文还原为其说话者本会使用的语调
fact.8.label=修订至
fact.8.value=1890 年，最后一版由古斯塔夫·达尔曼送付印刷
fact.9.label=不可混同于
fact.9.value=以色列圣经公会出版的现代希伯来文新约，那是二十世纪另一部仍在版权保护期内的译本
fact.10.label=目录中的年份
fact.10.value=留空——两半没有共同的年份，而单是新约就在十三年间历经十次修订版
fact.11.label=在本语料库中
fact.11.value=全部 66 卷，也是希伯来文界面经过挑选的默认版本——阅读器打开的是它而非[[WLC|威斯敏斯特列宁格勒抄本]]，因为它一路贯通至新约末了
