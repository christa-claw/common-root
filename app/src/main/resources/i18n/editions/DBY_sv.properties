title=Darby 1885 (franska) — Om denna utgåva | Common Root
description=Den franska Darbybibeln från 1885: Pau–Vevey-översättningen, påbörjad 1859 av John Nelson Darby och hans medarbetare och färdig tre år efter hans död, och den version hans engelska Gamla testamente sedan byggdes ur.
heroHeading=Darby 1885 (franska)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=John Nelson Darby minns man för annat — han lämnade Irlands kyrka, var med och grundade Plymouthbröderna och satte den dispensationalistiska premillennialismen i omlopp — men han tillbringade en stor del av sitt liv med att översätta Bibeln, och han gjorde det på tre språk. Det egendomliga med honom är ordningen. De flesta översättare arbetar utåt från sitt eget tungomål. Darbys engelska bibel blev den sista av de tre att bli färdig, och dess Gamla testamente gjordes inte rakt ur hebreiskan av honom utan ur de franska och tyska versioner han redan hade framställt tillsammans med andra.
hero.2=Detta är den franska. Darby var den främste lärde men aldrig ensam översättare av något som bär hans namn; i det franska laget ingick William Joseph Lowe och Pierre Schlumberger. Nya testamentet kom 1859 och trycktes om tre gånger under de följande två årtiondena. Hela Bibeln utkom 1885 i Pau och Vevey — därav det namn den brukar gå under — även om titelbladet vilseleder något: Pau ligger längst ned i södra Frankrike, och arbetet gjordes främst för brödraförsamlingarna i det franskspråkiga Schweiz. Darby hade dött 1882 och fick alltså aldrig se den färdiga boken.
hero.3=Översättningen är bokstavlig av princip, och Darby sade rent ut varför i förordet till sitt tyska Nya testamente: den lärde kan gå till grundtexten, så en översättnings uppgift är att lägga en så exakt avbild av den som möjligt i händerna på dem som inte kan. Han varnade också för att en friare återgivning förlorar betydelser som översättaren själv kanske inte har uppfattat. Resultatet är exakt och osmyckat, och var aldrig menat att läsas högt — i sin egen förkunnelse använde Darby King James Version.
hero.4=Två ting binder den till resten av detta korpus. Den tyska Darbybibeln är Elberfelder, som finns här som Elberfelder 1905 — samme man, samma principer, och en av de två texter hans engelska Gamla testamente sattes samman ur, så dessa franska och tyska kort står varandra närmare än sina skilda språk låter ana. Och dess behandling av gudsnamnet ställer den vid sidan av American Standard Version, som trycker “Jehovah” tusentals gånger där King James Version trycker “the LORD”; Darby fattade samma beslut först, på tre språk. I läsaren är den den enda franska bibeln, så ett franskt gränssnitt öppnar på den. Någon förlaga är inte registrerad för den i härstamningens stegpinnar, och till skillnad från de flesta daterade utgåvorna här bär dess stegpinne inget år alls — katalogkortet visar 1885, men stegpinneåren är en egen handhållen lista och denna utgåva står ännu inte på den.

