title=Versión Biblia Libre — इस संस्करण के बारे में | Common Root
description=Versión Biblia Libre: Free Bible Ministry की एक स्पेनी बाइबिल, जिसे Jonathan Gallagher और Shelly Barrios de Avila ने अंग्रेज़ी Free Bible Version के स्पेनी बहन-संस्करण के रूप में अनूदित किया, और जो किसी भी उपयोग के लिए स्वतंत्र रूप से अनुज्ञप्त है।
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — अर्थात "बाइबिल का मुक्त संस्करण" — अंग्रेज़ी Free Bible Version का स्पेनी बहन-संस्करण है, जिसे उसी प्रकाशक, Free Bible Ministry ने प्रकाशित किया — मैरीलैंड के लॉरेल में स्थित एक अलाभकारी संस्था। इसके नए नियम का श्रेय अनुवादकों Jonathan Gallagher और Shelly Barrios de Avila को दिया जाता है, जिसमें Gustavo Sanabria और Rebekah Põldaas सहयोगी हैं, और इसका प्रतिलिप्याधिकार 2018–2020 की तिथि के साथ Gallagher और Barrios de Avila के नाम है। अपने अंग्रेज़ी बहन-संस्करण की भांति, यह प्रतिलिप्याधिकार पृष्ठ को उपयोग में बाधा के रूप में हटाने के लिए अस्तित्व में है: पाठ को कोई भी बिना रॉयल्टी और बिना अनुमति माँगे प्रतिलिपि कर सकता है, मुद्रित कर सकता है, ऑनलाइन प्रकाशित कर सकता है या रूपांतरित कर सकता है।
hero.2=प्रकाशित प्राक्कथन नए नियम के आधार को स्पष्ट रूप से दर्ज करता है — सीधे यूनानी Nestle–Aland पाठ से अनूदित, वही समीक्षात्मक पाठ जिसे बाइबिल सोसाइटीयाँ काम में लेती हैं — परंतु पुराने नियम के लिए अलग से कोई स्रोत पाठ नहीं बताता, भले ही इस संग्रह में रखा संस्करण छियासठ पुस्तकों वाला पूर्ण प्रोटेस्टेंट धर्मग्रंथ-संग्रह है। जहाँ सामग्री में रिक्तता रह जाती है, वह यहाँ भी रिक्त छोड़ी गई है, अटकल से भरने के बजाय।
hero.3=इस पाठक में यह पाँच स्पेनी संस्करणों में से एक है। स्पेनी अंतरफलक अब भी पूर्वनिर्धारित रूप से [[RVR09|Reina-Valera 1909]] खोलता है, जो एक सर्वथा भिन्न, शताब्दियों पुरानी परंपरा का सार्वजनिक-डोमेन पाठ है; इस संस्करण तक इसके बजाय इसके अपने कार्ड से पहुँचा जाता है, [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] और [[NBLA|Nueva Biblia de las Américas]] के साथ। यह इनमें से किसी का भी संशोधन नहीं है, इसलिए वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं है — Versión Biblia Libre के किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है। इस संग्रह में इसका निकटतम संबंधी स्पेनी है ही नहीं: [[FBV|Free Bible Version]], उसी संस्था का अंग्रेज़ी अनुवाद, उसी अनुज्ञप्ति के अंतर्गत।

