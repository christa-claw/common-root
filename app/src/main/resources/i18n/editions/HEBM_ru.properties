title=Еврейская Библия — Об этом издании | Common Root
description=Вся Библия по-еврейски: масоретский Ветхий Завет вместе с Новым Заветом Франца Делича 1877 года, переведённым обратно на иврит Мишны для тех, кто хотел иметь книгу целиком на одном языке.
heroHeading=Еврейская Библия — масоретский Ветхий Завет и Новый Завет Делича
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Библия, еврейская от корки до корки, — предмет более странный, чем кажется на слух, потому что половина её никогда по-еврейски не писалась. Ветхий Завет еврейский и всегда таким был. Новый Завет дошёл на греческом. Значит, издание вроде этого — два разных рода текста, сшитые вместе: подлинник и перевод, сделанный в направлении, обратном обычному, — с греческого назад, на тот язык, на котором его писавшие большей частью говорили.
hero.2=Новозаветная половина — труд Франца Делича, лейпцигского знатока еврейского языка и раввинистической словесности; Британское и иностранное библейское общество поручило ему работу в 1873 году, и он окончил её в 1877-м. Он переводил не на иврит своего века. Он писал на иврите Мишны и эпохи Второго храма, доказывая, что текст первого века и звучать должен как текст первого века, — так что итог читается не столько как переложение на иврит, сколько как попытка вернуть то, чем фразы могли быть, прежде чем стали греческими. Это по-прежнему тот еврейский Новый Завет, к которому обращаются чаще всего.
hero.3=С какого греческого он работал, решили отчасти за него. Он начал с Синайского кодекса, рукописи четвёртого века, найденной несколькими десятилетиями раньше, а библейское общество — чьим правилом было издавать по общепринятому тексту — отказалось и дальше оплачивать версию, построенную на нём. Делич вернулся к Textus Receptus и отмечал значимые синайские чтения, а не принимал их. Дальше текст оставался в движении тринадцать лет и десять изданий; последнее провёл через типографию Густав Дальман в 1890 году, в год смерти Делича. Это одна из причин, по которой каталог оставляет год этого издания пустым: у двух половин нет общей даты, а у той половины, где даты есть, их десять.
hero.4=В этой читалке это то издание, которое открывает еврейский интерфейс, — выбор отобранный, а не алфавитная случайность, — и выбор иврита разворачивает вокруг него весь интерфейс справа налево. Оно стоит рядом с Ленинградским кодексом, не соперничая с ним: кодекс — это научный Танах, полностью огласованный и с кантилляцией, кончающийся там, где кончается Ветхий Завет, тогда как здесь простой консонантный текст, идущий дальше, до Откровения. В ступенях родословия для него не записано источника, так что ступень, открытая под стихом, падает прямо на пол исходных языков, ≈ WLC и ≈ TR. В прочих местах этого собрания тот пол — приближение, и как раз об этом предупреждает знак ≈. Здесь он им почти не является: Ветхий Завет на экране и есть масоретский текст, а Textus Receptus — это то, что у Делича действительно лежало перед глазами.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=иврит — консонантный текст без огласовок и без знаков кантилляции
fact.2.label=Что это такое
fact.2.value=два текста, переплетённые как одна Библия: традиционный масоретский Ветхий Завет и еврейский Новый Завет, переведённый с греческого в девятнадцатом веке
fact.3.label=Новый Завет
fact.3.value=Франц Делич (1813–1890), лейпцигский гебраист
fact.4.label=Заказчик
fact.4.value=Британское и иностранное библейское общество в 1873 году; перевод был окончен в 1877-м
fact.5.label=Ветхий Завет с
fact.5.value=самого масоретского еврейского — не перевод, что делает это единственным здешним изданием, чей Ветхий Завет уже на своём исходном языке, как и [[WLC|Вестминстерский Ленинградский кодекс]]
fact.6.label=Новый Завет с
fact.6.value=греческого [[TR|Textus Receptus]]. Делич начинал с Синайского кодекса, но библейское общество издавало по общепринятому тексту и не стало оплачивать отступление
fact.7.label=Регистр
fact.7.value=не современный иврит. Делич писал на иврите Мишны и эпохи Второго храма, стараясь вернуть греческому тот оборот, каким пользовались бы его носители
fact.8.label=Правился до
fact.8.value=1890 года, последнее издание провёл через типографию Густав Дальман
fact.9.label=Не путать с
fact.9.value=Новым Заветом на современном иврите, изданным Библейским обществом в Израиле, — это отдельный перевод двадцатого века, всё ещё защищённый авторским правом
fact.10.label=Год в каталоге
fact.10.value=оставлен пустым — у двух половин нет общего года, а один только Новый Завет правился на протяжении тринадцати лет и десяти изданий
fact.11.label=В этом собрании
fact.11.value=все 66 книг и отобранный выбор по умолчанию для еврейского интерфейса — читалка открывает это, а не [[WLC|Вестминстерский Ленинградский кодекс]], потому что это идёт весь путь до конца Нового Завета
