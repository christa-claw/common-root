title=Kirkkoraamattu 1933/38 — Su questa edizione | Common Root
description=Kirkkoraamattu 1933/38: la bibbia ecclesiastica finlandese, ritradotta dall'ebraico e dal greco e adottata in due metà, nel 1933 e nel 1938, dopo che una commissione vi aveva lavorato per una settantina d'anni.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=Il nome sono due date, perché il libro arrivò in due metà. La Chiesa evangelica luterana di Finlandia accolse l'Antico Testamento nel 1933 e il Nuovo nel 1938, e in finnico da allora si chiama la bibbia ecclesiastica del 1933/38. Quelle date finali nascondono quanto indietro stesse l'inizio: la commissione di traduzione era stata nominata nel 1861. Una settantina d'anni, e più di una generazione di traduttori, separano l'incarico dalla bibbia compiuta.
hero.2=Quel che la commissione produsse fu una traduzione nuova e non una revisione. Lavorò sull'ebraico dell'Antico Testamento e sul greco del Nuovo — non per tramiti latini, tedeschi o svedesi, e non sulla bibbia finnica già in uso. Eppure ne era consapevolmente l'erede, della Biblia 1776, testo della chiesa per un secolo e mezzo, e ne conservò buona parte del lessico e della cadenza. È quell'eredità a spiegare perché una bibbia compiuta nel 1938 suonasse già arcaica ai suoi primi lettori, e perché porti ancora il registro solenne della scrittura finnica. Rimase la bibbia ecclesiastica ufficiale fino al 1992.
hero.3=In questo lettore fa due cose. Si imposti l'interfaccia in finnico e si aprirà questa edizione — l'ordinamento proprio del catalogo darebbe invece la Biblia 1776, sicché la scelta predefinita per il finnico è deliberata e non un caso dell'alfabeto. È inoltre il piolo più alto della catena finnica: si apra un piolo sotto un versetto del KR3338 e la Biblia 1776 compare al di sotto. Quel piolo va letto come successione all'interno della bibbia di una stessa chiesa piuttosto che come fonte, giacché i traduttori del 1933/38 avevano davanti l'ebraico e il greco, non il testo del 1776. Sotto la Biblia 1776 la catena prosegue: la Biblia del 1642, che l'edizione del 1776 rivede, poi il finnico di Agricola del 1548, che quella commissione rivide a sua volta, e il tedesco di Lutero del 1545, aperto accanto a loro mentre lavoravano. Solo al di sotto di questi la scala raggiunge l'ebraico e il greco.

