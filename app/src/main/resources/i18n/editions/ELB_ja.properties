fact.2.label=着手者
fact.2.value=ジョン・ネルソン・ダービー、カール・ブロックハウス、ユリウス・アントン・フォン・ポーゼック
fact.3.label=初版
fact.3.value=新約聖書1855年、詩篇1859年、旧約聖書1871年、エルバーフェルトにて——1929年以来ヴッパータールの一部となっている町であり、この翻訳の名の由来でもある
fact.4.label=この版
fact.4.value=R・ブロックハウス社の1905年版——フラクトゥールではなくラテン活字で組まれた最初の版であり、その活字の小ささから「真珠聖書(Perlbibel)」として知られる
fact.5.label=新約の底本
fact.5.value=校訂ギリシャ語本文:[[TR|テクストゥス・レセプトゥス]]から離れた最初期のドイツ語聖書の一つであり、シナイ写本とバチカン写本が刊行されるにつれてその読みを取り入れた
fact.6.label=旧約の底本
fact.6.value=マソラ本文のヘブライ語であり、数か所でそこから離れている
fact.7.label=翻訳の方針
fact.7.value=原典志向で意図的に逐語的——意味を補うために加えた語は補いと分かるように示され、原典に見出しがないという理由で章句の見出しも加えられていない
fact.8.label=神の御名
fact.8.value=旧約聖書全体を通じて「Jehova」(エホバ)を印刷している。1985年の改訂ではこれを「HERR」に置き換えた。[[ASV|アメリカン・スタンダード・バージョン]]や[[DBY|ダービーのフランス語聖書]]と同じ選択である
fact.9.label=姉妹版
fact.9.value=[[DBY|ダービー1885年版]]——同じ集団による、同じ原則に基づくフランス語聖書
fact.10.label=訂正の終期
fact.10.value=1932年、版を重ねるごとに——旧約聖書はアルフレート・ロシャ、新約聖書はエミール・デンゲスが担当した
fact.11.label=同じ書物ではないもの
fact.11.value=1975年と1985年の改訂エルバーフェルダー聖書(Revidierte Elberfelder)——二十五年にわたる改訂の成果であり、この版とは異なる本文である
fact.12.label=ライセンス
fact.12.value=パブリックドメイン
fact.13.label=このコーパスでは
fact.13.value=ドイツ語インターフェースが開くバイブル:ドイツ語には選定された既定版がないため、リーダーはカタログの中で最初に来るドイツ語聖書を採用しており、ELBはその略号だけを理由に[[LUT1545|ルター聖書1545]]と[[LUT1912|ルター聖書1912]]より先に並ぶ。系譜の段には母本が記録されていない——訂正のもとになった1871年のエルバーフェルダー聖書がこのコーパスに収められていないためであり——そのため段は原語の底面から開く。年についてもどちらの側にも記載がない。カタログの札は年の欄を空欄のままにしており、手作業でまとめられた段の年の一覧にもこの版の項目はない。したがってELBの段のチップには略号だけが示され、他には何も表示されない——静かなケースであり、[[DRA|ドゥエー・ランス訳]]は騒がしいケースで、この二つの一覧は公然と食い違っている
