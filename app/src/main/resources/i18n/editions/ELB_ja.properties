title=エルバーフェルダー聖書1905 — この版について | Common Root
description=エルバーフェルダー聖書:ジョン・ネルソン・ダービー、カール・ブロックハウス、ユリウス・アントン・フォン・ポーゼックが1855年に着手したドイツ語訳であり、ドイツ語訳として最初期にテクストゥス・レセプトゥスから離れた一つ——ここに収めるのは1905年版である。
heroHeading=エルバーフェルダー聖書1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=名前は地名である。エルバーフェルトはヴッパー川流域の町で、1929年以来ヴッパータールの一部となっており、翻訳の大半はここで行われた。着手したのは三人——ジョン・ネルソン・ダービー、カール・ブロックハウス、ユリウス・アントン・フォン・ポーゼックであり、いずれもブレザレン運動のドイツ支部と関わりがあった。新約聖書は1855年に、詩篇は1859年に、旧約聖書は1871年に世に出たが、誰の名前のもとにも出版されず、原典から「何人かのキリスト者によって」訳されたものとしてのみ示された。
hero.2=これを際立たせたのは、その底にあるギリシャ語本文だった。当時流通していたドイツ語聖書のほとんどはなおテクストゥス・レセプトゥスに拠っていたが、この訳はそこから離れ、19世紀半ばにかけて刊行されたシナイ写本とバチカン写本の読みを取り入れた。旧約聖書はマソラ本文のヘブライ語から作られた。翻訳の原則は優雅さより正確さであり、ヘブライ語とギリシャ語に忠実すぎて硬くなるほどのドイツ語、意味を補うために加えた語はすべて補いと分かるように示し、原典に見出しがないという理由で章句の見出しも一切設けなかった。今なお、その底本の語句に最も近いドイツ語訳の一つに数えられている。
hero.3=これは1905年版であり、フラクトゥールではなくラテン活字で組まれた最初の版である。その活字が小さいことから「真珠聖書(Perlbibel)」として知られる。これは新しい翻訳ではなかった。ルドルフ・ブロックハウスが1932年に死去するまで、エルバーフェルダー聖書は版を重ねるごとに見直され訂正され続けた——旧約聖書はアルフレート・ロシャ、新約聖書はエミール・デンゲスが担当した——したがって、ここに記す年は完成した版ではなく、なお動き続けていた本文のある版を指す。今日「エルバーフェルダー聖書」として売られているものは、たいてい別のものである。同じ運動から出た委員会が二十五年をかけて改訂を行い、その成果を1975年と1985年に出版した。その改訂は旧約聖書から「Jehova」(エホバ)を除き、代わりに「HERR」を入れた。この本文は今も「Jehova」を印刷しており、その点でアメリカン・スタンダード・バージョンやダービー自身のフランス語聖書と同じ立場に立つ。
hero.4=この文書群における位置づけはいくぶん特異である。ドイツ語にはリーダーの中で選定された既定版がないため、ドイツ語インターフェースはカタログの中で最初に来るドイツ語聖書を開くことになり、それがこの版である——ただアルファベット順で両方のルター聖書より先に来るというだけの理由による。系譜の段の中では、これは一人だけで立っている。二つのルター聖書は連鎖をなし、1912年版は1545年版の改訂であり、1545年版はギリシャ語とヘブライ語に拠っているが、エルバーフェルダー聖書には記録された母本がない。訂正のもとになった1871年のエルバーフェルダー聖書がこのコーパスに収められていないからである。そのため、エルバーフェルダー聖書の節の下で段を開くと、直接≈印の原語の底面に至る——もっとも、一列隣にあるフランス語のダービー聖書がここでの最も近い親類であるにもかかわらず。

