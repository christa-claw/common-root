title=Biblia en Español Sencillo — 关于此版本 | Common Root
description=Biblia en Español Sencillo：AudioBiblia.org 自2018年起出版的浅白西班牙文圣经，为听而写不亚于为读而写，并以任何人皆可复制的授权发布。
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=四百年来，西班牙文的新教圣经实际上只是一部书的历次修订：卡西奥多罗·德·雷纳1569年的译本，经西普里亚诺·德·瓦莱拉在1602年修订，以及此后一长串雷纳-瓦莱拉版本。Biblia en Español Sencillo 不在其列。它是一部新译本，用当代西班牙文写成，刻意浅白，由 AudioBiblia.org 出版——新约连同诗篇与箴言于2018年问世，旧约于2019年10月完成。译事归于伊尔玛·弗洛雷斯名下，其出版者称之为保守而福音派的译本。
hero.2=它的与众不同在于出身。它出自一项有声圣经事工，经文与逐章的完整录音是一同做出来的，而不是一者照着另一者念。两者的既定目标相同：一部易于理解、并且可以自由合法地复制与传布的圣经。后半句并非附带。该译本采用知识共享署名授权，署名 AudioBiblia.org 与伊尔玛·弗洛雷斯，而非出版社保留权利——正因如此，全文才能置于本语料库中，并逐节与库中任何其他文本并列。
hero.3=在本阅读器中，它是四种西班牙文版本之一。将界面设为西班牙文，阅读器打开的仍是雷纳-瓦莱拉1909；此本是读者自行切换过去的。它在谱系阶梯中的表现也不同。因为它是新译而非本库所收任何文本的修订，故未为其记录母本——在 Biblia en Español Sencillo 某节之下展开的阶梯，会径直落到以 ≈ 标记的原文语言底层，而不像英文一系那样落到同一部书较早的版本。不如把它放在第二栏，与雷纳-瓦莱拉1909相对，值得细看的正是两种语体之间的距离。

