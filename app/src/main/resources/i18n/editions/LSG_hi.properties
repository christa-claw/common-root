title=लुई सेगों 1910 (फ़्रांसीसी) — इस संस्करण के बारे में | Common Root
description=सेगों बाइबिल अपने 1910 के संशोधन में: जिनेवा के एक पादरी का इब्रानी और यूनानी से किया अनुवाद, पहली बार पूरा 1880 में छपा, ब्रिटिश एंड फ़ॉरेन बाइबिल सोसाइटी के लिए संशोधित, और एक सदी तक फ़्रांसीसी-भाषी प्रोटेस्टेंटों की सामान्य बाइबिल।
heroHeading=लुई सेगों 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=लुई सेगों का जन्म 1810 में प्लैंपैले में हुआ, जो तब जिनेवा के ठीक बाहर था, और उनकी मृत्यु 1885 में जिनेवा में हुई। उन्होंने स्ट्रासबर्ग के प्रोटेस्टेंट संकाय में धर्मविज्ञान पढ़ा, छब्बीस वर्ष की आयु में धर्मविज्ञान में डॉक्टरेट पाई, और चौबीस वर्ष तक शेन-बूज़री के ग्राम्य पल्ली के पादरी रहे, फिर इब्रानी और पुराने नियम के अध्यापन की ओर मुड़े। जिनेवा की आदरणीय पादरी-मंडली ने उन्हें पुराने नियम का इब्रानी से नए सिरे से अनुवाद करने का काम सौंपा, और उनका अनुवाद 1874 की तिथि वाले संस्करण में प्रकाशित हुआ। इसके बाद उन्होंने अपनी पहल पर नए नियम का अनुवाद किया — टेक्स्टस रिसेप्टस से नहीं, बल्कि कॉन्स्टेंटिन टिशेनडॉर्फ़ के समीक्षात्मक यूनानी पाठ से — और 1880 में पूरी बाइबिल एक ही खंड में, ऑक्सफ़र्ड में छपकर, निकली।
hero.2=यह ठीक-ठीक वह पाठ नहीं है जो सेगों ने प्रकाशित किया था। उनकी मृत्यु के बाद ब्रिटिश एंड फ़ॉरेन बाइबिल सोसाइटी ने फ़्रांसीसी और स्विस पादरियों तथा धर्मविज्ञानियों के एक समूह से इसका संशोधन करवाया, और संशोधन 1910 में प्रकाशित हुआ। उनके परिवर्तन प्रोटेस्टेंट रूढ़िवाद की शब्दावली की ओर झुके — याजक “prêtres” नहीं, बल्कि पुराने प्रोटेस्टेंट शब्द “sacrificateurs” बने; इस प्रति में “sacrificateur” हर जगह है और “prêtre” विरल। यही 1910 का पाठ बीसवीं सदी के अधिकांश समय तक फ़्रांसीसी प्रोटेस्टेंटवाद की संदर्भ बाइबिल बना, और आज भी फ़्रांसीसी-भाषी इवैंजेलिकलों में सबसे अधिक पढ़ी जाने वाली बाइबिलों में है। इसके बाद के संशोधनों का भी एक लंबा परिवार है: 1978 का “Colombe”, 1979 का Nouvelle Édition de Genève, और 2007 में Segond 21। कुछ विशेषताएँ लगभग हर पृष्ठ पर दिखती हैं। ईश्वरीय नाम “l'Éternel” है, अर्थात् शाश्वत, जैसे ओस्टरवाल्ड में और इस संग्रह में इसके बगल में खड़ी फ़्रांसीसी डार्बी में: भजन 23 में “L'Éternel est mon berger”। और यशायाह 7:14 में लिखा है “la jeune fille deviendra enceinte” — युवती, कुँवारी नहीं — ठीक उसी प्रकार का अनुवाद, जिसके कारण कुछ रूढ़िवादी प्रोटेस्टेंटों ने सेगों पर मसीही भविष्यवाणियों को कमज़ोर करने का आरोप लगाया।
hero.3=भजनसंहिता में यह पुस्तक इब्रानी का अनुसरण करती है: क्रमांकन इब्रानी है, इसलिए भजन 23 चरवाहे का भजन है, और जहाँ इब्रानी में किसी भजन का शीर्षक एक पद है, वहाँ यहाँ भी पद है — भजन 51 में 21 पद हैं, King James Version से दो अधिक। योएल और मलाकी, इसके विपरीत, लैटिन और अंग्रेज़ी परंपरा का अध्याय-विभाजन रखते हैं, तीन अध्याय और चार। इस पाठक में यह ओस्टरवाल्ड और फ़्रांसीसी डार्बी के साथ तीन फ़्रांसीसी बाइबिलों में से एक है। फ़्रांसीसी अंतरफलक इस पर नहीं खुलता: फ़्रांसीसी के लिए कोई चुना हुआ संस्करण नहीं है, इसलिए पाठक सूची-क्रम में पहली फ़्रांसीसी बाइबिल लेता है, जो डार्बी है। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं, अतः किसी पद के नीचे खुला पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है — पुराने नियम के लिए लेनिनग्राद कोडेक्स, जो सेगों के समय का कोई मुद्रित इब्रानी पाठ नहीं बल्कि मसोरेटिक परंपरा की एक पांडुलिपि है, और नए नियम के लिए टेक्स्टस रिसेप्टस, यानी ठीक वही यूनानी जिसका अनुसरण न करना उन्होंने चुना था। इसका पायदान चिह्न वर्ष 1910 धरता है।

