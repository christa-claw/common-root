title=Freedom Bible japonaise — À propos de cette édition | Common Root
description=La Freedom Bible japonaise (フリーダム・バイブル) : une Bible japonaise complète en 66 livres, diffusée par eBible.org comme ébauche de traduction sans droit d'auteur — la seule Bible japonaise de ce corpus, si bien que l'interface japonaise s'ouvre sur elle.
heroHeading=Freedom Bible japonaise
readerHref=/reader?c1.src=jfb

hero.1=La Freedom Bible japonaise — en japonais フリーダム・バイブル — est une Bible japonaise complète diffusée par eBible.org, qui se présente comme le distributeur officiel de la traduction. Elle est très récente : les fichiers sources que détient ce corpus sont datés du 19 août 2026, et le 2026 de sa fiche est la date de ces fichiers. eBible ne donne pas de date de publication distincte, et aucune n'est avancée ici.
hero.2=Bien des choses à son sujet ne sont pas consignées, et il vaut mieux le dire franchement. Les pages d'eBible ne nomment ni traducteur, ni comité, ni éditeur, et ne disent pas à partir de quoi la traduction a été faite — directement de l'hébreu et du grec, ou par l'intermédiaire d'une autre traduction moderne. Sa propre page de droits la qualifie d'ébauche de traduction (翻訳の草案) et invite à proposer des améliorations ; le texte d'ici est donc l'instantané d'un travail en cours, non une édition arrêtée.
hero.3=Ce qui est clair, c'est sa situation juridique : la même page déclare qu'aucun droit d'auteur n'est attaché à la traduction et la range dans le domaine public. C'est pourquoi elle est ici le texte japonais : c'était la seule Bible japonaise complète d'eBible libre de droits. La Bible japonaise plus ancienne qui aurait pu lui donner une lignée, la traduction de l'ère Meiji achevée en 1887 et depuis longtemps dans le domaine public, n'est pas disponible à cette source.
hero.4=Dans ce corpus, elle comprend les 66 livres du canon protestant, 31 098 versets, sans livres deutérocanoniques. Aucun texte de base n'est consigné pour elle ; ouvrir un échelon sous l'un de ses versets mène donc droit au sol des langues originales, marqué de ≈ : l'hébreu et le grec qui y figurent sont des témoins, non une affirmation sur ce dont elle a été traduite — et sa source étant inconnue, c'est la lecture honnête. C'est la seule Bible japonaise du corpus, si bien qu'une interface en japonais s'ouvre sur elle par défaut.

