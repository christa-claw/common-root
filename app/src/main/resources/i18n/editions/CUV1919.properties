title=Chinese Union Version, 1919 text — About This Edition | Common Root
description=The Chinese Union Version as first published in 1919, in the old character forms and the original punctuation, transcribed by Chinese Wikisource, with its footnotes.
heroHeading=Chinese Union Version — the 1919 text
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=This is the [[CUV|Chinese Union Version]] as it was printed in 1919: the Mandarin Bible that missionaries and Chinese scholars worked on for twenty-nine years, set down in the forms of that year. The other Union Version in this reader is the text as it is read today, with modern punctuation and modern character choices. This one keeps the 1919 page.
hero.2=You can see the difference in the characters. The 1919 text uses forms that later printings retired — 爲 where today's editions have 為, 愼, 册, 槪 — and it is printed in traditional characters throughout. Its punctuation is as transcribed from the 1919 printing, not the modern punctuation of later editions. Where the 1919 book printed consecutive verses as a single passage, so does this edition: the verse numbering is kept, and the text sits on the first verse of the run.
hero.3=The text comes from the transcription made by Chinese Wikisource, and it is the Shen edition (神版), in which God is 神, not 上帝. The footnotes of the 1919 book are kept, and appear in this reader as notes on the verses they belong to.
hero.4=It was added so that a Chinese Bible can be printed from a text whose date and origin are known. A printing of 1919 is long out of copyright. The punctuated texts that followed it, in 1988 and after, are a separate question, which is why the two are kept apart.

