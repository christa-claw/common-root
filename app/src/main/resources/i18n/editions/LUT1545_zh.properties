title=Luther Bibel 1545 — 关于此版本 | Common Root
description=路德的 Ausgabe letzter Hand：一五四五年的维滕贝格圣经，马丁·路德亲自校订的最后一版，也是他身后成为标准的文本。
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=这不是路德的第一部圣经，而是他最后的一部。他在瓦尔特堡译成的新约于一五二二年问世，完整的圣经于一五三四年；此后他又校订了十年，而汉斯·卢夫特一五四五年在维滕贝格所印的这一版，是路德亲自看到底的最后一版。德语称之为 Ausgabe letzter Hand，即最后之手的版本。次年二月他去世，此后的路德圣经都以这一文本为准绳。
hero.2=他从原文而非拉丁文着手：新约用伊拉斯谟所印的希腊文，旧约用马所拉希伯来文，并有一圈维滕贝格同侪与他争辩难解之处。所成之书对德语所起的作用，大致就是一个世纪后一六四二年 Biblia 对芬兰语所起的作用。一种方言众多、书面散文未定的语言，得到了一种人人可读的语体，现代书面语便由此生长出来。
hero.3=两条谱系链在此相会。Luther Bibel 1912 紧居此版本之上，因它是对此版本的修订。芬兰语这条线上的 Biblia 1642 也在其上三级，因为图尔库的委员会译经时路德就摊开在旁。在它之下，梯子触底——希腊文用 Textus Receptus，希伯来文用威斯敏斯特列宁格拉德抄本——而这两级是实心的，未标 ≈ 号，因为伊拉斯谟的希腊文和马所拉希伯来文正是路德实际据以翻译的底本，而不是事后补上的见证。

