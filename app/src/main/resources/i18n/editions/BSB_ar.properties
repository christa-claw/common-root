title=Berean Standard Bible — عن هذه الطبعة | Common Root
description=Berean Standard Bible: ترجمة إنجليزية حديثة أنجزها فريقا Bible Hub وDiscovery Bible عن النص العبري المسوري وعن عهد جديد يوناني حرّراه بأنفسهما — ثم وُهبت للملك العام.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible من أحدث الترجمات في هذه المجموعة، ومن أكثرها إفصاحًا عن طريقة صنعها. أنجزها الفريقان اللذان يقفان وراء Bible Hub وDiscovery Bible، تحت إشراف لجنة استشارية، وصدرت أول أمرها باسم آخر: Berean Study Bible. وقد أورث ذلك لبسًا متصلًا، لأن study Bible تعني في العادة كتابًا مقدسًا محشوًّا بالشروح والحواشي، وليست هذه كذلك. فأُعيدت تسمية الترجمة؛ أما الرمز فبقي كما هو.
hero.2=تنطلق أكثر الترجمات من عهد جديد يوناني حرّره سواها. أما هذا المشروع فبنى نصه أولًا. تتخذ Berean Greek Bible من طبعة نسله 1904 أساسًا لها — اختارها محرروها، على قولهم، لأنها أدق نص نقدي صار في الملك العام بالفعل — ثم تقابلها بنستله–ألاند، والعهد الجديد اليوناني الصادر عن SBL، وتِشندورف، وويستكوت–هورت، والنص البيزنطي، والنص المستلم، وتثبت في الحواشي مواضع الاختلاف. ومن ذلك تُرجمت الإنجليزية. ويأتي العهد القديم عن العبرية المسورية، مع الرجوع إلى مخطوطات البحر الميت والسبعينية وشهود قدماء آخرين حيث يكون لها أثر في القراءة. ثم نُشر العمل نفسه طبقات: نصًّا بين السطور كلمةً بكلمة، وطبعة حرفية متصلبة، وهذه الطبعة السلسة — حتى يستطيع القارئ أن يمشي من اليونانية إلى الإنجليزية خطوة خطوة بدل أن يأخذ كلام المترجمين تسليمًا. وهذا يضع Berean كذلك على الجانب الآخر من فاصل تُظهره هذه المجموعة: فكتاب جنيف المقدس وترجمة الملك جيمس ينحدران ههنا من النص المستلم، وهذه لا تنحدر منه.
hero.3=وآخر ما صنعه المشروع بنصه أن وهبه. فقد سُلّمت نصوص Berean إلى الملك العام في أبريل 2023، ولهذا يستطيع الكتاب كله أن يقيم في هذه المجموعة وأن يُنسخ منها ثانية. واضبط واجهة القارئ على الإنجليزية ينفتح لك New International Version، وهي ههنا بترخيص؛ أما Berean فهي الإنجليزية الحديثة القائمة إلى جانبها، يجوز لكل أحد أن يقتبسها ويطبعها ويعيد نشرها. وهي في درجات النسب تسلك مسلك Biblia en Español Sencillo. ليس لها أصل مسجّل، لأنها ترجمة جديدة لا تنقيح لشيء تملكه المجموعة، فالدرجة المفتوحة تحت آية من Berean تهبط رأسًا إلى أرضية اللغات الأصلية الموسومة بـ ≈ لا إلى كتاب مقدس إنجليزي أقدم. ويترك الفهرس سنتها فارغة أيضًا. وليس ذلك سهوًا — فالنص لا يزال يُنقَّح كلما وردت تصويبات، والسنوات ههنا منتقاة لا مظنونة، فالطبعة التي لا طبعة واحدة مؤرخة لها لا تُعطى سنة.

