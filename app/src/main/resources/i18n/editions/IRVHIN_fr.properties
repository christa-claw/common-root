title=Version indienne révisée — À propos de cette édition | Common Root
description=La Version indienne révisée (IRV) : une traduction hindi de la Bible de 2019 publiée par Bridge Connectivity Solutions, sous licence CC BY-SA 4.0 — le texte hindi sur lequel ce corpus s'ouvre par défaut.
heroHeading=Version indienne révisée
readerHref=/reader?c1.src=irvhin

hero.1=La Version indienne révisée est une traduction moderne de la Bible en hindi, dont les droits d'auteur, datés de 2017 et 2019, appartiennent à Bridge Connectivity Solutions Pvt. Ltd., une organisation indienne de traduction biblique et de technologie. Elle appartient à une série plus large de « Version indienne révisée » que le même éditeur a produite en parallèle dans plusieurs autres grandes langues de l'Inde — dont le kannada, le tamoul, le télougou et l'assamais — chacune une Bible complète dans sa propre écriture, publiée sous la même licence ouverte.
hero.2=Le texte de Common Root provient de la distribution USFM d'eBible.org de l'IRV en hindi, cataloguée là-bas sous le nom hin2017, plutôt que d'une copie numérique antérieure de la même traduction qui circulait avec le texte des notes collé directement dans les versets, et avec les noms des livres en hindi plutôt qu'en anglais. Réimporter à partir de cette source USFM a corrigé les deux problèmes avant que cette édition ne soit ajoutée ici — ce corpus conserve les noms des livres en anglais à l'interne, dans toutes ses éditions, quelle que soit la langue propre de la Bible.
hero.3=Elle est écrite ici en écriture devanagari, sous le nom इंडियन रिवाइज़्ड वर्ज़न, et comporte le canon protestant standard de 66 livres, sans livres deutérocanoniques.
hero.4=C'est la seule Bible en hindi de ce corpus, si bien qu'une interface en hindi s'ouvre sur elle par défaut.

