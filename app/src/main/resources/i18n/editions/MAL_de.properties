title=Muwatta Malik — Über diese Ausgabe | Common Root
description=Muwatta Malik: das Recht-und-Hadith-Kompendium des Imam Malik ibn Anas aus Medina, das den Sechs Büchern des sunnitischen Islam um etwa ein Jahrhundert vorausgeht und manchmal vorgeschlagen wird, unter ihnen den Platz von Sunan Ibn Majah einzunehmen.
heroHeading=Muwatta Malik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Malik ibn Anas ibn Malik ibn Abi 'Amir al-Asbahi al-Madani, bekannt unter der Kunya Abu 'Abdullah, wurde um das Jahr 93 n. H. (711 n. Chr.) in Medina geboren und starb dort im Jahr 179 (795 n. Chr.); er wurde auf dem Friedhof al-Baqi' bestattet. Er studierte bei Gelehrten wie Hisham ibn Urwah, Ibn Shihab al-Zuhri, Ja'far al-Sadiq und Nafi' Mawla Ibn Umar und lehrte sein ganzes Leben in Medina, wo er Titel wie Imam Dar al-Hijra („der Imam der Stadt der Hidschra“) und Shaykh al-Islam erwarb. Er wurde zum Namensgeber der malikitischen Rechtsschule, einer der vier großen Rechtsschulen des sunnitischen Islam; sein bedeutendster Schüler, Muhammad ibn Idris al-Shafi'i — der später die schafiitische Rechtsschule begründete —, nannte Maliks Buch „das verlässlichste auf Erden nach dem Koran“. Der abbasidische Kalif al-Mansur soll es zur einzigen Rechtsquelle des Reiches machen gewollt haben; Malik selbst lehnte ab.
hero.2=Al-Muwatta („der gut begangene Weg“) wurde der Überlieferung nach über etwa vierzig Jahre in der frühen Abbasidenzeit verfasst und überarbeitet; der Name soll daher stammen, dass Malik den Text siebzig Rechtsgelehrten Medinas zeigte, die ihm alle zustimmten (wata'a). Es verbindet dem Propheten zugeschriebene Hadithe mit den rechtlichen Aussprüchen seiner Gefährten und der folgenden Generation sowie mit Maliks eigenen Entscheidungen — nach einer Einschätzung das älteste erhaltene Werk, das Hadith und Fiqh auf diese Weise verschmilzt, und den Sechs Büchern um etwa ein Jahrhundert voraus. Die Angaben zu seinem Umfang schwanken je nach Rezension und Zählweise: eine häufig genannte Zahl für die eigentlichen Hadithe liegt bei etwa 1.720, während Malik aus den ihm angeblich zugänglichen 100.000 Überlieferungen knapp unter 1.900 ausgewählt haben soll.
hero.3=Mindestens sechzehn Rezensionen von al-Muwatta sind bekannt. Diejenige, die vor allem für die malikitische Rechtsschule zur Standardreferenz wurde, ist die von Yahya ibn Yahya al-Laythi; eine konkurrierende Rezension von Ahmad ibn Abi Bakr al-Zuhri ist etwa fünf bis zehn Prozent länger. Allein zur Rezension al-Laythis gibt es rund hundert Kommentare. Weil es den Sechs Büchern des sunnitischen Islam vorausgeht, vertreten manche Gelehrte — die Malikiten und Ibn al-Athir unter ihnen —, dass al-Muwatta und nicht [[IBM|Sunan Ibn Majah]] in diese kanonische Liste gehöre; Ibn Majahs Sunan habe den Platz allgemein deshalb behalten, weil sein Inhalt sich am wenigsten mit den anderen fünf überschneidet, nicht weil es als verlässlicher gilt.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-malik-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]] und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

