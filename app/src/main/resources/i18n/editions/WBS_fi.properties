fact.3.label=Tarkistuksen pohja
fact.3.value=[[KJV|King James Version]] vuodelta 1611, ”yleinen käännös”, sellaisena kuin sitä silloin painettiin — tarkistettu englanniksi eikä käännetty uudelleen, vaikka Webster vertasi korjauksiaan hepreaan ja kreikkaan
fact.4.label=Tarkistuksen luonne
fact.4.value=Kevyt ja varovainen: vanhentuneet sanat vaihdettu ajanmukaisiin; kielioppi korjattu, ”who” henkilöistä ja ”its” asioista; muutama ääneen luettavaksi sopimattomana pidetty sana pehmennetty; ”Holy Spirit” sanojen ”Holy Ghost” tilalla; tyyli ja opilliset kohdat jätetty tarkoituksella ennalleen
fact.5.label=Julkaistu
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, nimellä The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Käyttöoikeus
fact.6.value=Vapaassa käytössä; tämä kappale eBible.orgista
fact.7.label=Tässä aineistossa
fact.7.value=66 kirjaa, protestanttinen kaanon kokonaisuudessaan, ilman apokryfikirjoja; englantilainen luku- ja jakeenumerointi, joten psalmeja on 150 ja kunkin psalmin otsikko on sulautettu sen ensimmäiseen jakeeseen
fact.8.label=Polveutuminen
fact.8.value=Ei kirjattua edeltäjää eikä mitään kirjattuna sen päällä — askelma avautuu suoraan alkukielten pohjaan, Vanhassa testamentissa [[WLC|Leningradin koodeksiin]] ja Uudessa [[TR|Textus Receptukseen]], vaikka Websterin tarkistama teksti on [[KJV|King James Version]]
