title=Webster's Bible — Tietoja tästä laitoksesta | Common Root
description=Noah Websterin vuonna 1833 tekemä King James Versionin tarkistus, julkaistu New Havenissa Connecticutissa — yleinen englanninkielinen Raamattu lähes sanasta sanaan säilytettynä, vanhentuneet sanat vaihdettuina, kielioppi korjattuna ja muutama ilmaus ääneen lukemista varten pehmennettynä.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), newhaveniläinen sanakirjantekijä, muistetaan ennen kaikkea teoksesta An American Dictionary of the English Language vuodelta 1828. Viisi vuotta myöhemmin hän käänsi saman huolen selkeästä, oikeasta ja ajanmukaisesta englannista siihen Raamattuun, jota hänen maassaan todella luettiin. Vuonna 1833 newhaveniläinen Durrie and Peck julkaisi teoksen The Holy Bible … in the Common Version, with Amendments of the Language, jonka esipuhe on päivätty saman vuoden syyskuussa. Se ei ole uusi käännös. Webster otti vuoden 1611 King James Versionin — ”yleisen käännöksen” — sellaisena kuin sitä silloin painettiin ja muutti sitä vain siellä, missä sen englanti oli käynyt hämäräksi tai kieliopillisesti virheelliseksi. Hän kirjoitti tarkistaneensa korjauksiaan alkukielistä, mutta katsoi, ettei käännöksen yleistä tyyliä pitänyt muuttaa, eikä hän tietoisesti muuttanut yhtään kohtaa, johon jokin kirkkokunta perusti oppinsa.
hero.2=Esipuheessa hän nimeää kolmenlaisia muutoksia. Täysin käytöstä pois jääneet sanat saivat väistyä yleisessä käytössä olevien tieltä: Joosefin isäntä ”knoweth not”, mitä talossa on (1. Moos. 39:8), siinä missä King James Versionissa on ”wotteth not”, ja Apostolien tekojen 12:4:ssä Herodes aikoo tuoda Pietarin kansan eteen ”after the passover” eikä ”after Easter”. Kielioppi saatettiin Websterin ajan käytön mukaiseksi: ”who” sanan ”which” paikalle, kun puhutaan henkilöistä, joten Isä meidän alkaa ”Our Father who art in heaven”, ja ”its” sanan ”his” paikalle, kun puhutaan asioista, joten 1. Mooseksen kirjan 1. luvun kasvit tekevät siementä ”after its kind”. Lisäksi pieni joukko sanoja, joita hän ei pitänyt sopivina luettaviksi ääneen sekalaiselle kuulijakunnalle, korvattiin lievemmillä. Hän kirjoitti myös ”Holy Spirit” siellä, missä King James Versionissa on ”Holy Ghost”, eikä meidän kappaleessamme ole ”Holy Ghostia” lainkaan. Muuten tarkistus on kevyt: useimmat lukijat voisivat lukea luvun toisensa jälkeen huomaamatta lähteneensä King James Versionin tekstistä.
hero.3=Meidän kappaleemme on täydellinen: 66 kirjaa Genesiksestä Ilmestyskirjaan, ilman apokryfikirjoja, englantilaisen luku- ja jakeenumeroinnin mukaan — 150 psalmia, joiden otsikko on sulautettu ensimmäiseen jakeeseen, ja Malakia päättyy lukuun 4. King James Versionin tavoin se säilyttää ne vastaanotetun tekstin kohdat, jotka myöhemmät tekstikriittiset laitokset asettavat kyseenalaisiksi: Markuksen pidemmän lopun, Apostolien tekojen 8:37:n ja 1. Johanneksen kirjeen 5:7:n kolme todistajaa taivaassa. Tässä lukijassa se seisoo omillaan. Vaikka se on tarkistus King James Versionista, joka sekin on tässä aineistossa, aineistoon ei ole kirjattu sille edeltäjää, joten jonkin sen jakeen alta avattu polveutumisaskelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan — Vanhassa testamentissa Leningradin koodeksiin ja Uudessa Textus Receptukseen — eikä siihen englanninkieliseen tekstiin, jota Webster todellisuudessa muokkasi. Mitään ei myöskään ole kirjattu seisomaan sen päällä. Mikään käyttöliittymän kieli ei avaudu tähän laitokseen; englanninkielinen käyttöliittymä avautuu New International Versioniin, ja tähän päästään sen omasta kortista käännösruudukossa. King James Versionin rinnalle toiseen sarakkeeseen asetettuna se näyttää Websterin korjaukset jae jakeelta.

