title=Clementina Vulgata — Bu Baskı Hakkında | Common Root
description=Clementina Vulgata: Hieronymus'un Latince Kitab-ı Mukaddes'inin papalık revizyonu; 1592'de Roma'da basıldı, 1593 ve 1598'de düzeltilerek yeniden yayımlandı — 1979'a kadar Katolik Kilisesi'nin standart Latince metni ve bu okuyucuda Vulgata'nın üstündeki bir basamak.
heroHeading=Clementina Vulgata
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=1546'da Trento Konsili Vulgata'yı Kilise'nin sahih Latince Kitab-ı Mukaddes'i ilan etti ve böylece yanıtlamadığı bir soruyu açıkta bıraktı: hangi Vulgata? On bir yüzyıllık elle kopyalama, birbirinin tıpatıp aynısı iki elyazması bırakmamıştı ve konsil düzeltilmiş bir metin istedi. Papa V. Sixtus 1590'da, büyük ölçüde kendi elinden geçirdiği bir metni, onu sahih ilan eden bir papalık fermanıyla birlikte sundu. Aynı yılın ağustosunda öldü ve birkaç hafta içinde kardinaller metnin satışını durdurdu. VIII. Clemens döneminde bir komisyon — editörler arasında Francisco de Toledo, çalışmanın merkezinde Robert Bellarmino — onun yerine geçecek metni hazırladı; metin 1592'de Roma'da basıldı. 1593 ve 1598'deki daha küçük boyutlu yeni baskılar dizgi hatalarının çoğunu giderdi, Hieronymus'un önsözlerini ve kenar göndermelerini ekledi.
hero.2=Bu metin, 1979'daki Nova Vulgata'ya kadar yaklaşık dört yüzyıl boyunca Katolik Kilisesi'nin standart Latince Kitab-ı Mukaddes'i oldu; 1962 tarihli misal ve brevier onu hâlâ kullanır. Bu, Hieronymus'un bıraktığı biçimiyle değil, Kilise'nin teslim aldığı biçimiyle Hieronymus'un Kitab-ı Mukaddes'idir. Mezmurlar, onun sonradan İbraniceden yaptığı çeviri değil, Yunancaya göre gözden geçirdiği Galya mezmurlarıdır; bu yüzden Yunanca numaralandırmayı korur: Mezmur 22 burada “Dominus regit me” ile, çoban mezmuruyla başlar. 1 Yuhanna 5:7'de Comma Johanneum yer alır: “Pater, Verbum, et Spiritus Sanctus” — erken Yunanca elyazmalarında bulunmayan bir Latince eklemedir. Ester ve Daniel uzun biçimleriyle yer alır; Yunanca eklemeler Ester'in sonunda ve Daniel'in son iki bölümü olarak toplanmıştır. Bu kopyanın alındığı eBible.org dosyası, 1598 metnini not olarak Glossa Ordinaria ile basar — Laonlu Anselmus'un okulundan çıkmış on ikinci yüzyıl şerhi, Migne'nin 1880 baskısıyla. Notlar derlemeye girmedi; bazı ayetlerdeki köşeli parantezler kaynağın kendisine aittir.
hero.3=Bu okuyucuda, tek bir kayıtlı öncülü olan bir basamaktır; o öncül Latince Vulgata'dır: ayetlerinden herhangi birinin altında bir basamak açın, Vulgata görünür. İkisinin neredeyse kelimesi kelimesine aynı okunmasını bekleyin. Bu derlemedeki Vulgata da bir Clementina metninden alınmıştır; bu yüzden onları ayıran şey çoğunlukla noktalama — ve bu kopyada eksik olan kitaplardır. 66 kitabı vardır, yani Protestan kanonunun kitapları; Ester ve Daniel uzun biçimleriyle. Kaynak dosyalarda ayrıca Tobit, Yudit, Bilgelik, Sirak, Baruk ve iki Makabeler kitabı bulunur; alttaki Vulgata'da bunların hepsi vardır. Hiçbiri derlemeye geçmedi, bu yüzden Vulgata'da Tobit olan yerde üstünde hiçbir şey yoktur. Clementina'nın bir ek bölümde bastığı Manasse'nin Duası ile 3. ve 4. Ezra ne kaynakta ne de derlemede vardır. Derlemede hiçbir şey de bu baskının üzerinde durmaz.

