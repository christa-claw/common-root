# The narrative, one paragraph per key, in order.
hero.1=Третья Библия Финляндии — и та, которая закрепилась. Это правка, а не новый перевод: линия ведёт через правку Флоринуса 1683–85 годов назад к Библии 1642 года, первой полной финской Библии. Правку выполнил Андерс (Антти) Лизелиус, издавший собственную Библию ещё в 1758 году. Издание 1776 года изменило орфографию, а вместе с ней и охват. Это была первая финская Библия в обновлённом правописании и первая, напечатанная для домашнего чтения, а не только для церковного пульта. Библия, которой может владеть семья, — иной предмет, чем Библия, которой владеет приход. Издания, лежащие между ними, не сводились к орфографии. Хенрик Флоринус, пробст Паймио, готовивший издание 1685 года, знал древнееврейский и греческий и правил содержание не меньше языка — формулировки сдвинулись дальше, чем написание, — а промежуточным изданиям приписывают переводческую работу с языков оригинала, а не одну лишь уборку текста 1642 года. Тот, кто сравнивает 1642 год с 1776-м, смотрит поверх двух правок, а не поверх смены орфографии.
hero.2=Она удерживала церковное употребление полтора столетия, пока её не заменила Kirkkoraamattu 1933/38, и её не перестали читать, когда она перестала быть официальной. Два движения пробуждения внутри Евангелическо-лютеранской церкви Финляндии — лестадиане и rukoilevaiset — сохранили её и пользуются ею до сих поры. Поэтому одно слово Biblia по-фински указывает именно сюда, а не на более раннее или более позднее издание, и поэтому книгу называют также Vanha kirkkoraamattu, старой церковной Библией.
hero.3=В этой читалке она — середина финской цепи. Откройте одну ступень под стихом Kirkkoraamattu 1933/38, и появится это издание; откройте одну под ним, и появится Библия 1642 года. Две ступени, однако, читаются по-разному. Переводчики 1933/38 работали с еврейского и греческого, так что ступень выше — это преемство внутри Библии одной церкви, а не происхождение. Ступень ниже — настоящее происхождение: 1776 год есть правка 1642 года, и слова по обе стороны этого шага предназначены для сравнения.
hero.4=Одна оговорка о тексте на этом сайте: это не печатное издание 1776 года. То, что здесь читается, восходит к общедоступному цифровому тексту, орфографию которого нормализовала позднейшая рука и редакционная история которого не зафиксирована: из его 31 102 стихов ровно один содержит букву w, тогда как в Библии 1642 года их 26 862, а w вместо v — самый явный признак той орфографии, которой печаталось издание 1776 года. Итак, 1776 год модернизировал написание 1642 года, а этот текст с тех пор модернизировали ещё раз, что уводит его от печатной книги дальше, чем 1776 год отстоял от 1642-го. Двое исследователей старого литературного финского языка прежде всего спросили, какая это версия, и вопрос был правильный. Само издание 1776 года сохранилось в виде постраничных изображений в собрании шведского времени Национальной библиотеки Финляндии; заменить этот текст верным — работа, которую нам хотелось бы сделать.

