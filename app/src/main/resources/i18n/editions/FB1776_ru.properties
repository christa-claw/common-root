title=Biblia 1776 — Об этом издании | Common Root
description=Biblia 1776: церковная Библия Финляндии на протяжении полутора столетий, первая напечатанная для чтения дома и до сих пор та книга, которую финский язык имеет в виду, говоря «Biblia».
