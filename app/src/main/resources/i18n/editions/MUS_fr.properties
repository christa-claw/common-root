title=Sahih Muslim — À propos de cette édition | Common Root
description=Sahih Muslim : avec le Sahih al-Bukhari, il forme les Sahihayn, les deux recueils que l'islam sunnite place juste après le Coran ; Muslim ibn al-Hajjaj l'a composé à partir de hadiths recueillis dans la péninsule Arabique, en Égypte, en Irak et en Syrie, n'admettant que ceux dont la chaîne de transmetteurs fiables était ininterrompue.
heroHeading=Sahih Muslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi est né à Nishapur, dans la province abbasside du Khorasan (aujourd'hui dans le nord-est de l'Iran) ; les sources divergent sur l'année, donnant 202, 204 ou 206 de l'hégire (environ 817–822 apr. J.-C.). Il parcourut la péninsule Arabique, l'Égypte, l'Irak et la Syrie pour recueillir des hadiths auprès des savants de chaque pays, puis s'établit de nouveau dans sa ville natale, où il rencontra al-Bukhari, étudia auprès de lui et resta son ami pour le reste de sa vie. Selon al-Khatib al-Baghdadi, il entreprit l'ouvrage à la demande d'un élève, Ahmad ibn Salama al-Naysaburi ; son titre d'origine, al-Musnad al-Sahih al-Mukhtasar, est habituellement abrégé, comme celui d'al-Bukhari, en Sahih Muslim. Il mourut à Nishapur en 261 de l'hégire (875 apr. J.-C.) et fut enterré dans son faubourg de Nasarabad.
hero.2=Il n'admettait un hadith que si sa chaîne de transmission remontait sans interruption à un compagnon de Muhammad, passant à chaque maillon par au moins deux transmetteurs fiables ; il classait les transmetteurs en trois niveaux selon la mémoire et le caractère, et écartait ceux dont l'honnêteté était contestée. Son commentateur al-Nawawi a relevé un soin supplémentaire : Muslim, écrivait-il, place chaque hadith en un seul endroit approprié, avec toutes ses chaînes et variantes de formulation, plutôt que de les laisser apparaître dispersées — une présentation que des commentateurs plus tardifs ont opposée à la pratique du [[BUK|Sahih al-Bukhari]], qui place séparément les différentes formulations d'un hadith, chacune sous le chapitre dont elle illustre le point.
hero.3=Le nombre de hadiths que contient réellement le livre dépend, comme pour le [[BUK|Sahih al-Bukhari]], de qui compte et de la manière de traiter les répétitions. Kâtip Çelebi et Siddiq Hasan Khan arrivent tous deux à 7 275 ; Muhammad Fu'ad Abd al-Baqi, en comptant sans répétition, à 3 033 ; Mashhur ibn Hasan Al Salman à 7 385, ou 7 395 en comptant les dix hadiths de l'introduction même de Muslim ; d'autres estimations situent le total quelque part entre 5 500 et 7 500 environ. Al-Jawzaqi a compté 2 326 hadiths partagés, presque mot pour mot, avec le Sahih al-Bukhari. Le chiffre propre à ce corpus en est un autre encore : 57 livres et 7 563 hadiths numérotés, ce qui reflète simplement la forme de l'édition numérique dont ils sont tirés, sans prétendre reproduire exactement une numérotation imprimée en particulier.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. Dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-muslim de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe afin que les deux puissent être lus en vis-à-vis — le même dispositif d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]] et pour ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend lui-même, cela n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée comme en cours de vérification plutôt que comme relevant purement du domaine public ; l'arabe ci-dessus ne porte pas cette incertitude.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=arabe classique, avec une traduction anglaise affichée sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi (né 202–206 de l'hégire / v. 817–822 apr. J.-C. – mort 261 de l'hégire / 875 apr. J.-C.)
fact.3.label=Titre complet
fact.3.value=al-Musnad al-Sahih al-Mukhtasar — habituellement abrégé en Sahih Muslim
fact.4.label=Compilé
fact.4.value=hadiths recueillis dans la péninsule Arabique, en Égypte, en Irak et en Syrie ; l'ouvrage lui-même achevé à Nishapur, au Khorasan, à la demande d'un élève
fact.5.label=Méthode
fact.5.value=n'admet un hadith qu'avec une chaîne ininterrompue d'au moins deux transmetteurs fiables à chaque maillon jusqu'à un compagnon de Muhammad ; transmetteurs classés en trois niveaux de fiabilité, ceux d'honnêteté contestée exclus
fact.6.label=Rang
fact.6.value=le deuxième des Six Livres de l'islam sunnite (Kutub al-Sitta) ; avec le [[BUK|Sahih al-Bukhari]], forme « les Sahihayn », les deux recueils placés en autorité juste après le Coran ; la plupart des savants placent l'ensemble du recueil d'al-Bukhari au-dessus de celui-ci
fact.7.label=Nombre de hadiths
fact.7.value=les chiffres vont de 3 033 sans répétition (Abd al-Baqi) à 7 275–7 395 avec répétition, selon la méthode de comptage ; les éditions imprimées diffèrent à la fois sur la numérotation des chapitres et des hadiths
fact.8.label=Dans ce corpus
fact.8.value=57 livres et 7 563 hadiths numérotés — la forme propre du jeu de données source, non la reproduction d'une numérotation imprimée en particulier
fact.9.label=Traduction anglaise
fact.9.value=tirée de l'édition eng-muslim de fawazahmed0/hadith-api, affichée en accompagnement sous l'arabe ; de quelle traduction imprimée elle descend n'est pas encore confirmé du côté de ce corpus
fact.10.label=Licence
fact.10.value=le matn arabe est le texte classique du domaine public ; la licence de la traduction anglaise est encore en cours de vérification
