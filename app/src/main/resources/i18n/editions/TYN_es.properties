title=Nuevo Testamento de Tyndale 1534 — Acerca de esta edición | Common Root
description=El Nuevo Testamento de William Tyndale, la primera traducción inglesa hecha del griego y la primera impresa, en su propia revisión de 1534 — el texto que está debajo de la Biblia de Ginebra y de la King James Version.
heroHeading=Nuevo Testamento de Tyndale 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=En tiempos de Tyndale una Biblia en inglés seguía estando prohibida. Las Constituciones de Oxford de 1409 vedaban traducir la Escritura al inglés, o leer una traducción así, sin la aprobación de un obispo. William Tyndale pidió esa aprobación al obispo de Londres, Cuthbert Tunstall, en 1523, fue rechazado y al año siguiente dejó Inglaterra para hacer el trabajo sin ella. Con el Nuevo Testamento griego de Erasmo delante, y el alemán de Lutero y la Vulgata latina al lado, hizo el primer Nuevo Testamento inglés traducido del griego, y el primero que llegó a imprimirse. Un primer intento en Colonia en 1525 quedó interrumpido por una redada en la imprenta; el libro completo salió de la prensa de Peter Schöffer en Worms en 1526 y entró de contrabando en Inglaterra, donde los obispos compraban ejemplares para quemarlos.
hero.2=El texto que aquí se ofrece es la revisión del propio Tyndale, impresa en Amberes en 1534, en la que volvió sobre el griego, corrigió su primera versión y añadió prólogos y notas. Era tanto un alegato como una traducción. Tomás Moro lo atacó por escribir «congregación» (congregation) donde la Iglesia decía iglesia, «anciano» (elder) donde decía sacerdote y «amor» (love) donde decía caridad, y las tres elecciones están en este texto: Mateo 16:18 dice «apon this rocke I wyll bylde my congregacion». Tyndale revisó una vez más en 1535, fue arrestado en Amberes en mayo de ese año y en 1536 fue condenado como hereje, estrangulado y quemado en Vilvoorde, cerca de Bruselas.
hero.3=En este lector se le encuentra abajo del todo. El Tyndale es un peldaño registrado bajo la Biblia de Ginebra y bajo la King James Version, y por tanto, más abajo en la escalera, también bajo la Revised Version, la American Standard Version y la World English Bible, que se apoyan en la King James. Si se baja desde un versículo de la King James pasando por la Ginebra, la redacción muchas veces apenas se mueve — y de eso se trata; en 1 Corintios 13:13 sí se mueve, donde Tyndale y la Ginebra dicen love y la King James dice charity. Bajo Tyndale no hay ningún antecesor registrado. Trabajó sobre el griego de Erasmo, pero el Textus Receptus que hay aquí es la edición de 1550, una generación posterior, y el Lutero que hay aquí es la Biblia de 1545 y no el Nuevo Testamento de 1522 que él usó, así que la escalera baja directamente al suelo de las lenguas originales. Solo está el Nuevo Testamento, con su propia ortografía: Mateo empieza «This is the boke of the generacion of Iesus Christ».

