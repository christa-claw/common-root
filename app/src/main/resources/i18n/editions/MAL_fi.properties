fact.4.label=Koottu
fact.4.value=laadittu ja muokattu noin neljänkymmenen vuoden aikana abbasidikauden alussa; Malik opetti Medinassa koko elämänsä ja kuoli siellä vuonna 179 AH (795 jaa.)
