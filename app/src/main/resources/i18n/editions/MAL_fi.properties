title=Muwatta Malik — Tietoja tästä laitoksesta | Common Root
description=Muwatta Malik: imam Malik ibn Anasin Medinassa laatima oikeusopin ja hadithin kokoelma, joka edeltää sunni-islamin kuutta kirjaa noin vuosisadalla ja jota joskus ehdotetaan Sunan Ibn Majahin tilalle niiden joukkoon.
heroHeading=Muwatta Malik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Malik ibn Anas ibn Malik ibn Abi 'Amir al-Asbahi al-Madani, kunya-nimeltään Abu Abdullah, syntyi noin vuonna 93 AH (711 jaa.) Medinassa ja kuoli siellä vuonna 179 (795 jaa.); hänet haudattiin al-Baqi'-hautausmaalle. Hän opiskeli oppineiden, kuten Hisham ibn Urwahin, Ibn Shihab al-Zuhrin, Ja'far al-Sadiqin ja Nafi' Mawla Ibn Umarin, johdolla ja opetti Medinassa loppuelämänsä, saaden arvonimiä kuten Imam Dar al-Hijra ("muuttokaupungin imaami") ja Shaykh al-Islam. Hänestä tuli malikilaisen lainopillisen koulukunnan nimiantaja, yhden sunni-islamin neljästä suuresta lainopillisesta koulukunnasta; hänen merkittävin oppilaansa, Muhammad ibn Idris al-Shafi'i — joka perusti myöhemmin shafi'ilaisen koulukunnan — kutsui Malikin kirjaa "luotettavimmaksi maan päällä Koraanin jälkeen". Abbasidikalifi al-Mansurin kerrotaan halunneen tehdä siitä valtakunnan ainoan lainopillisen lähteen; Malik itse kieltäytyi.
hero.2=Al-Muwatta ("hyvin tallattu tie") laadittiin perimätiedon mukaan noin neljänkymmenen vuoden aikana abbasidikauden alussa; sen nimi kerrotaan tulevan siitä, että Malik näytti tekstiä seitsemällekymmenelle Medinan lainoppineelle, jotka kaikki olivat siitä samaa mieltä (wata'a). Se yhdistää profeetalle luettuja hadetheja hänen kumppaneidensa ja seuraavan sukupolven oikeudellisiin lausumiin sekä Malikin omiin ratkaisuihin — yhden arvion mukaan vanhin säilynyt teos, joka tällä tavoin yhdistää hadithin ja fiqhin, ja se edeltää Kuutta kirjaa noin vuosisadalla. Luvut sen laajuudesta vaihtelevat versiosta ja laskutavasta riippuen: usein mainittu luku varsinaisille hadetheille on noin 1 720, kun Malikin kerrotaan valinneen hieman alle 1 900 kertomusta niistä 100 000:sta, joita hänellä kerrotaan olleen käytössään.
hero.3=Al-Muwattasta tunnetaan ainakin kuusitoista versiota. Se, joka vakiintui vakiolähteeksi erityisesti malikilaiselle koulukunnalle, on Yahya ibn Yahya al-Laythin versio; kilpaileva Ahmad ibn Abi Bakr al-Zuhrin versio on noin viidestä kymmeneen prosenttia pidempi. Yksin al-Laythin versiosta on noin sata kommentaariteosta. Koska se edeltää sunni-islamin Kuutta kirjaa, jotkut oppineet — muun muassa malikiitit ja Ibn al-Athir — katsovat, että al-Muwattan, ei [[IBM|Sunan Ibn Majahin]], kuuluisi olla tällä kanonisella listalla; Ibn Majahin Sunanin kerrotaan yleisesti säilyttäneen paikkansa siksi, että sen sisältö limittyy vähiten muiden viiden kanssa, ei siksi, että sitä pidettäisiin luotettavampana.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-malik-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää [[BUK|Sahih al-Bukharissa]], [[MUS|Sahih Muslimissa]], [[ABD|Sunan Abi Dawudissa]], [[TIR|Jami` at-Tirmidhissa]], [[NAS|Sunan an-Nasa'issa]], [[IBM|Sunan Ibn Majahissa]] ja Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

