fact.7.value=noin 1 720 varsinaista hadithia on usein mainittu luku; Malikin kerrotaan valinneen hieman alle 1 900 kertomusta niistä 100 000:sta, joita hänellä oli käytössään; tämän aineiston lähdelaitos numeroi 1 858
fact.8.label=Tässä aineistossa
fact.8.value=62 kirjaa ja 1 858 numeroitua hadithia
