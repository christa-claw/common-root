title=موطأ مالك — عن هذه الطبعة | Common Root
description=موطأ مالك: مجموعة الإمام مالك بن أنس في الفقه والحديث من المدينة، وهي تسبق الكتب الستة عند أهل السنة بقرن تقريباً، ويُقترح أحياناً أن تحل محل سنن ابن ماجه بينها.
heroHeading=موطأ مالك
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد مالك بن أنس بن مالك بن أبي عامر الأصبحي المدني، المعروف بكنية أبي عبد الله، نحو سنة 93 هـ (711 م) في المدينة، وتوفي فيها سنة 179 هـ (795 م)، ودُفن في مقبرة البقيع. درس على علماء منهم هشام بن عروة وابن شهاب الزهري وجعفر الصادق ونافع مولى ابن عمر، ودرّس في المدينة بقية حياته، فنال ألقاباً مثل إمام دار الهجرة وشيخ الإسلام. وأصبح إمام المذهب المالكي، أحد المذاهب الفقهية الأربعة الكبرى عند أهل السنة؛ وتلميذه الأبرز، محمد بن إدريس الشافعي — الذي أسس بعد ذلك المذهب الشافعي — وصف كتاب مالك بأنه "أصح كتاب على وجه الأرض بعد كتاب الله". ويُقال إن الخليفة العباسي أبا جعفر المنصور رغب في جعله المرجع الفقهي الوحيد للدولة؛ فرفض مالك نفسه ذلك.
hero.2=أُلّف الموطأ ("الطريق المُمَهَّد") بحسب الرواية على مدى نحو أربعين سنة في أوائل العصر العباسي؛ ويُقال إن اسمه جاء من أن مالكاً عرض النص على سبعين فقيهاً من فقهاء المدينة، فاتفقوا (وطّأوا) عليه جميعاً. وهو يجمع بين أحاديث منسوبة إلى النبي وأقوال فقهية لأصحابه وللتابعين من بعدهم، إلى جانب اجتهادات مالك نفسه — وهو، بحسب أحد التقديرات، أقدم عمل باقٍ يجمع الحديث والفقه على هذا النحو، ويسبق الكتب الستة بقرن تقريباً. وتتفاوت الأرقام الخاصة بحجمه باختلاف الرواية وطريقة العدّ: فالرقم الشائع للأحاديث ذاتها نحو 1,720، في حين يُقال إن مالكاً اختار ما يقرب من 1,900 رواية من بين 100,000 رواية يُقال إنها كانت متاحة له.
hero.3=يُعرف من الموطأ ما لا يقل عن ست عشرة رواية. والرواية التي أصبحت المرجع المعتمد، خصوصاً عند المذهب المالكي، هي رواية يحيى بن يحيى الليثي؛ وثمة رواية منافسة لأحمد بن أبي بكر الزهري تزيد عليها بنحو خمسة إلى عشرة في المئة. وثمة نحو مئة شرح على رواية الليثي وحدها. وبسبب سبقه للكتب الستة عند أهل السنة، يرى بعض العلماء — منهم المالكية وابن الأثير — أن الموطأ، لا [[IBM|سنن ابن ماجه]]، هو ما ينبغي أن يكون في هذه القائمة المعتمدة؛ ويُقال عموماً إن سنن ابن ماجه احتفظ بهذا الموضع لأن محتواه أقل تداخلاً مع الخمسة الأخرى، لا لأنه يُحكم عليه بأنه أوثق.
hero.4=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-malik في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] و[[NAS|سنن النسائي]] و[[IBM|سنن ابن ماجه]] وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

