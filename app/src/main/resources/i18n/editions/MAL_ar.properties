fact.4.value=أُلّف ونُقّح على مدى نحو أربعين سنة في أوائل العصر العباسي؛ ودرّس مالك في المدينة طوال حياته وتوفي بها سنة 179 هـ (795 م)
fact.5.label=المنهج
fact.5.value=يجمع بين أحاديث منسوبة إلى النبي وأقوال الصحابة والتابعين واجتهادات مالك الفقهية الخاصة؛ ويسبق الكتب الستة بقرن تقريباً
fact.6.label=المكانة
fact.6.value=يسبق الكتب الستة المعتمدة عند أهل السنة؛ ويسمّيه بعض العلماء، منهم المالكية وابن الأثير، سادساً بدلاً من [[IBM|سنن ابن ماجه]] — خلاف تتركه المصادر المرجوع إليها هنا دون حسم
fact.7.label=عدد الأحاديث
fact.7.value=نحو 1,720 للأحاديث ذاتها بحسب رقم شائع؛ ويُقال إن مالكاً اختار ما يقرب من 1,900 رواية من بين 100,000 رواية كانت متاحة له؛ والطبعة المصدر لهذه المجموعة تُرقّم 1,858
fact.8.label=في هذه المجموعة
fact.8.value=62 كتاباً و1,858 حديثاً مرقَّماً
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-malik في fawazahmed0/hadith-api، وتظهر مرافقة تحت العربية؛ ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة منشورة تعود
fact.10.label=الرخصة
fact.10.value=المتن العربي هو النص الكلاسيكي الملك العام؛ أما رخصة الترجمة الإنجليزية فما زالت قيد المراجعة
