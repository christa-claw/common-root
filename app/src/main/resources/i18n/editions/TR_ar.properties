title=النص المستلم (Textus Receptus) — عن هذه الطبعة | Common Root
description=النص المستلم: العهد الجديد اليوناني المطبوع الذي يقف خلف لوثر وتندال وترجمة الملك جيمس، أعدّه إرازموس أول مرة سنة 1516 وسُمّي من سطر دعائي سنة 1633.
heroHeading=النص المستلم
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=كلّ كتاب مقدّس من عصر الإصلاح في هذه المجموعة ينحدر من كتاب طُبع في بازل سنة 1516. أراد إرازموس الروتردامي أن يدفع العهد الجديد اليوناني إلى المطبعة قبل أي أحد، فعمل على عجل — من حفنة المخطوطات المتأخرة التي أمكنه بلوغها في بازل، وليس فيها ما هو قديم بوجه خاص. وحيث كانت نسخته من سفر الرؤيا تفتقد ورقتها الأخيرة، أعاد ترجمة الأعداد الستة الأخيرة إلى اليونانية من الفولغاتا اللاتينية. دخلت تلك الأعداد المطبوع وبقيت فيه أربعة قرون.
hero.2=ظلّ النص يُصحّح ويُعاد إصداره مئة سنة بعد ذلك — على يد إرازموس نفسه، ثم روبير إستيين في باريس وتيودور بيزا في جنيف. فعلت الطبعة الرابعة لإستيين سنة 1551 شيئًا تجاوزت آثاره عالم العلم بكثير: قسّمت النص إلى أعداد مرقّمة. وهي أرقام الأعداد نفسها التي ما زالت تُطبع في كل كتاب مقدّس تقريبًا في العالم — وهي التي يتيح هذا القارئ إطفاءها.
hero.3=أمّا الاسم فجاء آخرًا، وجاء من الدعاية. في سنة 1633 روّج الأخوان إلزفير في لايدن لطبعتهما بسطر يقول إنّ لدى القارئ الآن “النص الذي تسلّمه الجميع” — textus receptus. كان ذلك ادّعاء بائع كتب، لا حكمًا علميًا، لكنه علق. ولمّا ظهرت مخطوطات أقدم في القرن التاسع عشر، بنى عليها محققون من تيشندورف إلى وستكوت وهورت نصوصًا جديدة، والترجمات الحديثة تتبع تلك. يبقى النص المستلم هنا للسبب الذي يجعله مهمًا: هو ما كان أمام لوثر وتندال ومترجمي جنيف ولجان الملك جيمس فعلًا، فهو النص الذي ينبغي أن تُقرأ صياغاتهم إزاءه.

