title=Reina Valera 1909 — Sobre esta edición | Common Root
description=Reina-Valera 1909: la revisión que llevó al siglo XX el español de Casiodoro de Reina de 1569, tal como Cipriano de Valera lo había revisado en 1602, y la edición que este lector abre para el español.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=La Biblia protestante en español es, en grado poco común, un solo libro. Casiodoro de Reina, que había salido de España huyendo de la Inquisición, acabó su traducción en el destierro y la publicó en Basilea en 1569: la Biblia del Oso, llamada así por el oso de su portada. Cipriano de Valera, que había estado en el mismo monasterio a las afueras de Sevilla y había hecho la misma fuga, la repasó durante años y publicó el resultado en Ámsterdam en 1602, la Biblia del Cántaro. Toda Reina-Valera posterior es la revisión de una revisión de aquella, y por eso un nombre con guion recuerda a dos hombres que nunca trabajaron en la misma sala.
hero.2=Esta es la revisión de 1909, preparada bajo la Sociedad Bíblica Británica y Extranjera junto con la Sociedad Bíblica Americana, y llamada por lo común Versión Antigua entre quienes siguieron usándola. Vino después de una revisión anterior, la de 1862, y es prudente justo en aquello que las revisiones suelen cambiar: la letra se adelanta donde Reina y Valera se habían vuelto difíciles de seguir, y se deja quieta donde no. El Antiguo Testamento se apoya en el hebreo masorético y el Nuevo en el Textus Receptus, como se apoyaba el de Reina.
hero.3=Tuvo casi para sí sola al mundo protestante de habla española durante unos cincuenta años, hasta que la revisión de 1960 la desplazó, y nunca ha desaparecido del todo. Está libre de derechos, cosa que la de 1960 no está, de modo que esta es la Reina-Valera que se imprime, se cuelga y se cita sin permiso de nadie. Por eso también el texto entero puede estar en este corpus y volver a copiarse fuera de él.
hero.4=En este lector el español tiene cinco Biblias, y es en esta en la que abre la interfaz. Se trata de una elección curada y no de un azar del catálogo: a diferencia del árabe o del chino, donde el lector abre en la única Biblia que hay en la lengua, el español tiene alternativas y esta fue escogida entre ellas. En los peldaños del linaje no se le registra ningún texto base, de manera que un peldaño abierto bajo un versículo cae directamente al suelo de lenguas originales marcado con ≈. El suelo acierta aquí más de cerca que de costumbre, por la misma razón que en la Biblia árabe: el griego que aporta es el Textus Receptus, y del Textus Receptus se hizo el Nuevo Testamento de Reina.

