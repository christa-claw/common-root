title=سميث وفان دايك (نصّ eBible) — عن هذه الطبعة | Common Root
description=الكتاب المقدس العربي لسميث وفان دايك سنة 1865، في النصّ الإلكتروني المشكَّل بالكامل الذي ينشره eBible.org ملكاً عاماً، عن ملفّ المصدر الذي قدّمته جمعية الكتاب المقدس الأمريكية.
heroHeading=سميث وفان دايك — النصّ المشكَّل بالكامل
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=هذه هي نفس الترجمة لـ[[SVD|سميث وفان دايك]] — الكتاب المقدس العربي الذي بدأه عالي سميث في بيروت وأتمّه كرنيليوس فان دايك سنة 1865 بمعاونة العلماء العرب بطرس البستاني وناصيف اليازجي ويوسف الأسير — لكنه صُفّ عن ملفّ إلكتروني مختلف. الترجمة واحدة؛ والملفّ هو سبب وجود هذه الطبعة.
hero.2=الكتاب المقدس الذي يرجع إلى سنة 1865 حرٌّ لكلّ أحد، لكن نسخته الإلكترونية هي أيضاً عمل أحد، ونصّ فان دايك يتداول على الشبكة في نسخ كثيرة مجهولة المصدر، يُعرض بعضها بدعوى حقّ النشر على النقل نفسه. والنصّ الذي لا يمكن تتبّع مصدره لا يُطبع بثقة، فلهذا تستعمل هذه الطبعة نسخةً يمكن تتبّع مصدرها: تلك التي ينشرها eBible.org، المُعلَنة ملكاً عاماً، والتي تذكر الإرسالية السورية مترجمةً وجمعية الكتاب المقدس الأمريكية مُقدِّمةً للمصدر. وتاريخ الملفّ 2020-08-03.
hero.3=وهو مشكَّل بالكامل. فكلّ كلمة تحمل حركاتها القصيرة وسائر علامات القراءة، حيث نصّ فان دايك الآخر في هذا القارئ غير مشكَّل في معظمه. وهذا يُبطئ الصفّ ويُسهّل القراءة بصوتٍ عالٍ، والصفحة المشكَّلة تحتاج مساحةً أكبر بين السطور، فتخرج النسخة المطبوعة من هذه الطبعة أطول من النصّ نفسه بلا تشكيل.
hero.4=هذه هي الطبعة التي تُختار إذا كان السؤال هو هل يجوز طبع النصّ. أمّا للقراءة على الشاشة فأيّ نصّي فان دايك يفي بالغرض.

