title=Smith & Van Dyck (eBible-Text) — Über diese Ausgabe | Common Root
description=Die arabische Bibel von Smith und Van Dyck von 1865 im vollständig vokalisierten elektronischen Text, den eBible.org als gemeinfrei veröffentlicht, aus der Quelldatei der American Bible Society.
heroHeading=Smith & Van Dyck — der vollständig vokalisierte Text
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Dies ist dieselbe Übersetzung wie [[SVD|Smith & Van Dyck]] — die arabische Bibel, die Eli Smith in Beirut begann und Cornelius Van Dyck 1865 vollendete, mit den arabischen Gelehrten Butrus al-Bustani, Nasif al-Yaziji und Yusuf al-Asir — nur aus einer anderen elektronischen Datei gesetzt. Die Übersetzung ist dieselbe; die Datei ist der Grund, warum diese Ausgabe existiert.
hero.2=Eine Bibel aus dem Jahr 1865 ist für jeden frei, aber eine elektronische Abschrift davon ist ebenfalls jemandes Arbeit, und der Van-Dyck-Text kursiert im Netz in vielen Kopien ungewissen Ursprungs. Manche werden mit dem Anspruch angeboten, die Transkription selbst sei urheberrechtlich geschützt. Ein Text, dessen Herkunft sich nicht nachverfolgen lässt, kann nicht mit Zuversicht gedruckt werden, also verwendet diese Ausgabe eine Abschrift, deren Herkunft sich nachverfolgen lässt: die von eBible.org veröffentlichte, als gemeinfrei erklärte Fassung, die die Syrische Mission als Übersetzer und die American Bible Society als Beitragende der Quelle nennt. Die Datei trägt das Datum 2020-08-03.
hero.3=Er ist vollständig vokalisiert. Jedes Wort trägt seine Kurzvokale und die übrigen Lesezeichen, wo der andere Van-Dyck-Text in diesem Leser weitgehend unvokalisiert ist. Das macht ihn langsamer zu setzen und leichter laut zu lesen, und eine vokalisierte Seite verlangt mehr Raum zwischen den Zeilen, sodass ein gedruckter Band dieser Ausgabe länger ausfällt als derselbe Text unvokalisiert.
hero.4=Es ist die Ausgabe, die zu wählen ist, wenn die Frage lautet, ob der Text gedruckt werden darf. Zum Lesen am Bildschirm leistet jeder der beiden Van-Dyck-Texte das Gleiche.

