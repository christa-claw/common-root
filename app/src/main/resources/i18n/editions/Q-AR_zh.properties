fact.1.label=语言
fact.1.value=古兰经阿拉伯语，采用标准的奥斯曼正写法
fact.2.label=读法（齐拉阿）
fact.2.value=阿西姆传哈夫斯——由哈夫斯·伊本·苏莱曼（卒于796年）传自库法的阿西姆·伊本·艾比·纳茹德（卒于745年）；十四种公认传承之一，也是世界上大多数印刷版古兰经所遵循的一种
fact.3.label=标准印刷本
fact.3.value=1924年开罗版——由爱资哈尔学者组成的委员会，自1907年起在福阿德一世治下工作，由布拉克的埃米里印刷厂于1924年7月10日印刷；此后大多数印本，包括法赫德国王建筑群自己的版本，均沿用此范本
fact.4.label=本处所用文本
fact.4.value=alquran.cloud的quran-uthmani版本，其阿拉伯文本源自坦齐勒计划的数字化成果
fact.5.label=比对对象
fact.5.value=法赫德国王古兰经印刷建筑群自己持有的哈夫斯版本，逐节比对：在全部6,236节经文的辅音骨架上完全一致，所有差异均限于元音标注、哈姆扎拼法及八处词界划分不同
fact.6.label=这一致性并不能证明什么
fact.6.value=血统传承——一致不等于传承关系——也不是许可：2026年8月下旬向该建筑群发出、请求展示其自有文件的请求，截至本文撰写时尚未获得回复
fact.7.label=本语料库中的对照译本
fact.7.value=[[Q-EN|皮克索尔的英译本]]（1930年）、[[Q-YA|优素福·阿里的英译本]]（1934年）和[[Q-SAB|萨布鲁科夫的俄译本]]（1878年）——三种与这段底本配对显示于每节经文之下的译本
fact.8.label=在本语料库中
fact.8.value=本语料库中每一种[[Q-EN|译本]]所配对的唯一一段阿拉伯文本；与之相对的是[[FB1776|1776年芬兰语圣经]]，那里这段文本究竟源自哪一版印刷根本无从知晓
fact.9.label=授权
fact.9.value=公共领域——古兰经阿拉伯文本被视为不属于任何人；我们来源自身的条款只要求转载时保持奥斯曼正写法不变
