title=古兰经 — 奥斯曼版 — 关于本版本 | Common Root
description=这是哈夫斯传自阿西姆的诵读版古兰经，自1924年开罗版以来，世界上大多数印刷版古兰经都以此为依据——在本语料库中，这段文本已逐节与法赫德国王建筑群自己持有的版本比对，结果显示在全部6,236节经文的辅音骨架上完全一致。
heroHeading=古兰经 — 奥斯曼版
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=支撑这段文本的诵读法有一条可考的传承链。哈夫斯·伊本·苏莱曼·库菲（卒于796年）师从阿西姆·伊本·艾比·纳茹德——库法的诵读者之一，伊本·穆贾希德后来将其诵读法列入七大诵读法之中（阿西姆卒于745年）。"阿西姆传哈夫斯"诵读法是穆斯林视为同一启示的多种同等权威传承之一；它并非唯一的诵读法，却是印刷最广的一种，远超其他。当一个由爱资哈尔学者组成的委员会，在福阿德一世治下自1907年开始工作，编成标准埃及古兰经，并由布拉克的埃米里印刷厂于1924年7月10日印刷出版时，正是这一诵读法被定型于铅字之中。如今世界各地出售的古兰经，包括法赫德国王建筑群自己的版本，大多沿用这一版本的体例。
hero.2=本语料库中的文本，经由alquran.cloud的quran-uthmani版本，取自坦齐勒计划（Tanzil Project）对同一哈夫斯文本的数字化成果。阅读器中它与三种译本配对显示：皮克索尔的英译本（1930年）、优素福·阿里的英译本（1934年）和萨布鲁科夫的俄译本（1878年）——打开这三者中的任何一种并置于此文本旁，其译文便会显示在每节经文之下。阅读器还以两种顺序呈现古兰经：这一传统所定下的经典穆斯哈夫顺序，以及学者们为每章降示时间所重建的顺序。
hero.3=逐字保存本身正是人们对这段文本所做的一项断言，因此这里是加以核实，而非预先假定。将其逐节与法赫德国王古兰经印刷建筑群自己持有的哈夫斯版比对，两者在辅音骨架——即尚未添加任何元音符号之前的裸露字母——上，于全部6,236节经文中完全一致。所发现的每一处差异，都仅限于元音与停顿符号的标注方式、哈姆扎的拼法，以及八处两家划分词界方式不同的地方；没有一处涉及文本本身的任何一个字母。这与本语料库在1776年芬兰语圣经一页中必须承认的那种不确定性恰恰相反——在那里，这段文本究竟源自哪一版印刷，根本无从知晓。
hero.4=这种一致性没有确立的两件事，值得直说。它不是血统传承的断言——与建筑群文本一致，只说明两者是同一段文本，并不说明其中一方抄自另一方。它也不是许可——2026年8月下旬向该建筑群发出的一份请求，询问能否展示其自有的诵读版本文件，截至本文撰写时尚未获得回复。比对本身一度显示有分歧的唯一一节经文——第19章第3节——结果证明是参照文件读取方式上的一个缺陷，而非两部古兰经中任何一方的问题——纠正之后，两者完全吻合。参照本身是对该建筑群文字处理文件的一次重建，而非其官方的数字发行版——这是本次比对唯一未能完全比照官方发布数据集的一点。

