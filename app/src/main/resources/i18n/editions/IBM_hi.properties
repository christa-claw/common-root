title=सुनन इब्न माजा — इस संस्करण के बारे में | Common Root
description=सुनन इब्न माजा: सुन्नी इस्लाम की छह पुस्तकों में अंतिम, विधिक विषय के अनुसार व्यवस्थित, जिसका उनमें स्थान इसमें मौजूद दुर्बल और मनगढ़ंत हदीसों के कारण लंबे समय से विवादित रहा है।
heroHeading=सुनन इब्न माजा
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=अबू अब्द अल्लाह मुहम्मद इब्न यज़ीद इब्न माजा अल-रबई अल-क़ज़्वीनी का जन्म हिजरी संवत् 209 (824 ई.) में क़ज़्वीन में हुआ, जो आज ईरान के उत्तर-पश्चिम में स्थित है, रबीआ क़बीले के मवाली (गैर-अरब आश्रितों) के एक परिवार में — एक विवरण के अनुसार माजा उनके पिता का उपनाम था, न कि किसी दादा या माँ का नाम। उन्होंने इराक़, हिजाज़, सीरिया और मिस्र होते हुए हदीस की खोज में यात्रा की, और विद्वानों के एक विशाल समूह से शिक्षा प्राप्त की; कहा जाता है कि उनकी भविष्य की सुनन का चौथाई से अधिक भाग एक ही गुरु, इब्न अबी शैबा, पर निर्भर है। अबू यअला अल-ख़लीली जैसे समकालीनों ने उन्हें विश्वसनीय, प्रतिष्ठित और सर्वसम्मति से स्वीकृत प्रमाण के रूप में सराहा। उनका निधन हिजरी संवत् 273 (887 ई.) में क़ज़्वीन में हुआ, हालाँकि अल-कत्तानी हिजरी संवत् 275 (889 ई.) भी दर्ज करते हैं; पारंपरिक विवरण के अनुसार, इब्न माजा द्वारा उन्हें पूर्ण सुनन पढ़ाए जाने के बाद, अबू ज़ुरआ अल-राज़ी ने कहा कि यदि लोगों के पास यह पुस्तक होती, तो अन्य सुनन संग्रह काफ़ी हद तक अनावश्यक हो जाते।
hero.2=उन्हें दिए गए लगभग पंद्रह ग्रंथों में से, उनकी सुनन, अल-धहबी की गणना के अनुसार, लगभग 1,500 अध्यायों और लगभग 4,000 हदीसों तक फैली है, जो [[ABD|अबू दाऊद]] और [[TIR|अल-तिर्मिज़ी]] के संग्रहों की तरह विधिक विषय के अनुसार व्यवस्थित है। सुदृढ़ और स्वीकार्य सामग्री के साथ-साथ, इसमें वे हदीसें भी हैं जिन्हें बाद के विद्वानों ने दुर्बल माना, जिनमें लगभग तीस ऐसी हैं जिन्हें सामान्यतः पूर्णतः मनगढ़ंत माना जाता है — यही कारण है कि कुछ विद्वान छह के बजाय केवल "पाँच" ही गिनते हैं।
hero.3=सुन्नी परंपरा सुनन इब्न माजा को छह पुस्तकों (कुतुब अल-सित्ता) में अंतिम मानती है, [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]] और [[NAS|सुनन अल-नसाई]] के साथ। यह छठा स्थान स्वयं विवादित है: मालिकी संप्रदाय और इब्न अल-अथीर, अन्यों के साथ, इसके स्थान पर [[MAL|मुवत्ता मालिक]] का नाम लेते हैं, और कुछ अल-दारक़ुत्नी की सुनन का नाम लेते हैं; सामान्यतः कहा जाता है कि इब्न माजा की पुस्तक को यह स्थान इसलिए मिला क्योंकि इसकी विषयवस्तु अन्य पाँच के साथ सबसे कम मेल खाती है, न कि इसलिए कि इसे उम्मीदवारों में सबसे विश्वसनीय माना जाता है।
hero.4=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-ibnmajah संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]], [[NAS|सुनन अल-नसाई]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

