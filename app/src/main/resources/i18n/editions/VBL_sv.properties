title=Versión Biblia Libre — Om denna utgåva | Common Root
description=Versión Biblia Libre: en spansk bibel från Free Bible Ministry, översatt av Jonathan Gallagher och Shelly Barrios de Avila som den spanska systerutgåvan till den engelska Free Bible Version, och fritt licensierad för all användning.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — "den fria versionen av Bibeln" — är den spanskspråkiga systerutgåvan till den engelska Free Bible Version, utgiven av samma förlag, Free Bible Ministry, en ideell organisation med säte i Laurel, Maryland. Dess Nya testamente tillskrivs översättarna Jonathan Gallagher och Shelly Barrios de Avila, med Gustavo Sanabria och Rebekah Põldaas som medarbetare, och bär en upphovsrätt daterad 2018–2020 till Gallagher och Barrios de Avila. Liksom sin engelska syster finns den till för att ta bort upphovsrättssidan som hinder för användning: texten får kopieras, tryckas, läggas ut på nätet eller bearbetas av vem som helst, utan royalty och utan tillstånd att be om.
hero.2=Den utgivna förtexten redogör tydligt för Nya testamentets grund — översatt direkt från den grekiska Nestle–Aland-texten, den kritiska text som bibelsällskapen använder — men namnger inte separat någon källtext för Gamla testamentet, trots att utgåvan som detta korpus rymmer är den fullständiga, sextiosex böcker omfattande protestantiska kanon. Där materialen lämnar en lucka lämnas den också här, hellre än att fyllas med en gissning.
hero.3=I denna läsare är den en av fem spanska utgåvor. Det spanska gränssnittet öppnar fortfarande som standard [[RVR09|Reina-Valera 1909]], en fritt tillgänglig text ur en helt annan, århundraden äldre tradition; denna utgåva nås i stället via sitt eget kort, jämte [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] och [[NBLA|Nueva Biblia de las Américas]]. Den är inte en revision av någon av dem, så ingen förlaga är noterad för den i stegpinnarna — en stegpinne öppnad under en vers i Versión Biblia Libre faller rakt ned på det med ≈ markerade grundspråksgolvet. Dess närmaste släkting i detta korpus är inte alls spansk: [[FBV|Free Bible Version]], den engelska översättningen från samma verksamhet, under samma licens.

