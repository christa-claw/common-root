title=Cenevre Kutsal Kitabı 1599 — Bu Baskı Hakkında | Common Root
description=Cenevre Kutsal Kitabı: Cenevre'de sürgündeki İngiliz Protestanlarca hazırlanan, baştan sona ayet numaralı ve kenar notlu ilk İngilizce Kutsal Kitap; Shakespeare kuşağının okuduğu metin ve Kral James Çevirisi'nin altındaki basamak.
heroHeading=Cenevre Kutsal Kitabı 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Bu Kutsal Kitap yurt dışında, güvenle evinde kalamayan insanlarca yapıldı. 1553'te I. Mary tahta çıkıp İngiltere Roma'ya dönünce birkaç yüz Protestan ülkeyi terk etti; bir bölümü Calvin'in Cenevre'sine yerleşti — orada matbaalar, İbranice ve Yunanca bilgisi ve hesap verilecek bir piskopos yokluğu vardı. William Whittingham orada 1557'de bir Yeni Antlaşma yayımladı. Anthony Gilby yönetimindeki bir ekip Eski Antlaşma'yı baştan sona işledi ve tam metin 1560'ta Cenevre'de Rowland Hall tarafından basıldı; Mary'nin ölümünden iki yıl sonra, sürgünlerin çoğu çoktan yurda dönmüşken.
hero.2=Ortaya koydukları şey, bir İngilizce Kutsal Kitabın görünüşünü değiştirdi. Her ayeti numaralandıran ilk baskıydı; böylece okur bir bölüme değil bir satıra yönlendirilebiliyordu. Gotik yerine antikva harflerle dizildi ve bir kürsüye zincirlenmek yerine sahip olunabilecek kadar küçük ve ucuz çıktı. Kenarlar da doluydu: çapraz göndermeler, güç sözcüklerin açıklamaları, haritalar ve bir pasajın ne anlama geldiğini söyleyen notlar. Sevilmesinin de kızılmasının da sebebi işte bu sonuncusudur. Notlar reformcudur, yer yer keskin biçimde, ve okura krallar hakkında ne düşünmesi gerektiğini, öğreti hakkında ne düşünmesi gerektiğini söylediği kadar rahat söyler.
hero.3=Bu baskının tarihi bir çekince gerektirir, çünkü Cenevre Kutsal Kitabı tek bir kitap değil, parçaları değişirken seksen yıl boyunca yeniden basılan bir metindi. 1576'da Laurence Tomson, Theodore Beza'nın 1565 Yunanca baskısına dayanarak yaptığı kendi gözden geçirmesini Yeni Antlaşma'nın yerine koydu ve 1587'den itibaren Cenevre Kutsal Kitaplarının çoğunun taşıdığı Yeni Antlaşma budur. 1599'da Franciscus Junius'un Vahiy üzerine notları eklendi. Dolayısıyla “1599”, bir basım yılından çok bir bileşimi adlandırır — Tomson'ın Yeni Antlaşma'sı artı Junius'un Vahiy notları — ve o tarihi taşıyan Kutsal Kitaplar sonrasında da basılmayı sürdürdü. Katalog kartının yılı boş bırakmasının, buna karşılık gösterecek kısa bir şeye ihtiyaç duyan basamak etiketinin GNV 1599 demesinin sebebi budur.
hero.4=Bu derlemedeki yeri bir menteşedir. Buradaki en uzun soy zinciri World English Bible'dan American Standard Version'a, oradan Revised Version'a, oradan Kral James Çevirisi'ne, sonra da buna uzanır: Kral James'in bir ayetinin altında bir basamak daha açın, altında Cenevre'nin ifadesi belirir — Kral James'in ne kadarının devralınmış, ne kadarının yazılmış olduğunu görmenin en açık yolu budur. Cenevre'nin altında İngilizce başka bir şey yoktur — yalnızca Yunanca ve İbranice, Textus Receptus ve Westminster Leningrad Kodeksi; merdiven orada tabana değer. Metin, baskının taşıdığı biçimde, yazımıyla birlikte verilir; bu yüzden Yaratılış 1:1 heauen der; mezmur başlıkları ve İbraniler'in kolofonu, o baskıların dizdiği gibi ilk ayetin başında akar ve temizlenmek yerine oldukları yerde bırakılmıştır.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Dil
fact.1.value=İngilizce — Elizabeth dönemi İngilizcesi, özgün yazımıyla
fact.2.label=Yapanlar
fact.2.value=I. Mary'nin saltanatından kaçıp Cenevre'ye yerleşen İngiliz Protestanlar — 1557 Yeni Antlaşma'sını William Whittingham, Eski Antlaşma'yı Anthony Gilby yönetimindeki bir ekip hazırladı
fact.3.label=İlk tam baskı
fact.3.value=1560, Cenevre'de Rowland Hall tarafından basıldı
fact.4.label=Eski Antlaşma kaynağı
fact.4.value=Masoretik İbranice — [[WLC|Westminster Leningrad Kodeksi]] bu derlemenin o metne tanığıdır
fact.5.label=Yeni Antlaşma kaynağı
fact.5.value=[[TR|Textus Receptus]] çizgisinin Yunancası; 1576'dan itibaren Laurence Tomson'ın, Beza'nın 1565 Yunanca baskısına dayanarak yaptığı gözden geçirme, çoğu baskıda Whittingham'ın Yeni Antlaşma'sının yerini aldı
fact.6.label=“1599” neyi adlandırır
fact.6.value=Tomson'ın Yeni Antlaşma'sını, Franciscus Junius'un Vahiy üzerine notlarıyla birlikte taşıyan baskıları; bu notlar Cenevre Kutsal Kitabı'na o yıl girdi
fact.7.label=İlkler
fact.7.value=baştan sona ayet numaralandırılmış ilk İngilizce Kutsal Kitap; gotik yerine antikva harflerle dizildi ve tam bir kenar notu aygıtı taşıdı — terim ortaya çıkmadan önceki bir çalışma Kutsal Kitabı
fact.8.label=İtiraz eden
fact.8.value=kenar notlarını kışkırtıcı bulan I. James — [[KJV|Kral James Çevirisi]]'ni harekete geçirmeye katkıda bulunan bir yakınma
fact.9.label=Katalogdaki yıl
fact.9.value=Hakkında kartında boş, oysa basamak etiketi GNV 1599 diyor — Cenevre Kutsal Kitabı 1560'tan 1640'lara dek yeniden basıldı ve Yeni Antlaşma'sı ile notları tek bir ad altında değişip durdu
fact.10.label=Bu derlemede
fact.10.value=66 kitabın tamamı, apokrifa yok, yazım güncellenmemiş — Yaratılış 1:1 “the heauen and the earth” diyor
fact.11.label=Bir basamak altta
fact.11.value=[[TR|Textus Receptus]] ve [[WLC|Westminster Leningrad Kodeksi]]; Cenevre'nin kendisi [[KJV|Kral James Çevirisi]]'nin altındaki ilk basamaktır
