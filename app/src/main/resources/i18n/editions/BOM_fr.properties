title=Livre de Mormon — À propos de cette édition | Common Root
description=Le Livre de Mormon : le récit de prophètes de l'Amérique antique dicté par Joseph Smith en 1830, imprimé à Palmyra, dans l'État de New York, et lu par les saints des derniers jours comme une écriture complémentaire de la Bible.
heroHeading=Livre de Mormon
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith a dit avoir traduit ce livre « par le don et le pouvoir de Dieu » à partir d'un ensemble de plaques métalliques anciennes, qu'il affirmait avoir retrouvées en 1827 près de la ferme de sa famille, aux abords de Palmyra, dans l'État de New York, et avoir rendues plus tard au messager qui les lui avait montrées. Les témoins de la dictée le décrivent examinant une pierre de voyant — dans les dernières étapes du travail, une pierre qu'il plaçait dans un chapeau pour bloquer la lumière, et non seulement la paire de pierres fixées à un pectoral que l'on appelle traditionnellement l'Urim et le Thummim et qui seraient venues avec les plaques — tout en prononçant le texte à voix haute pendant qu'un scribe l'écrivait. Oliver Cowdery en transcrivit ainsi la plus grande partie en environ deux mois, en 1829, principalement à la ferme de la famille Whitmer à Fayette, dans l'État de New York ; Martin Harris et l'épouse de Joseph, Emma Smith, avaient servi de scribes pour des passages plus courts et antérieurs.
hero.2=Le manuscrit partit à l'impression dans l'année. Smith obtint le droit d'auteur de l'ouvrage en juin 1829, et l'impression commença à l'atelier d'Egbert B. Grandin à Palmyra, où le typographe John H. Gilbert ajouta la ponctuation et le découpage en paragraphes que le manuscrit dicté ne comportait pas. Le livre achevé parut en mars 1830 : environ 5 000 exemplaires, tout le tirage de Grandin.
hero.3=Il est divisé en quinze livres, du Premier Livre de Néphi au Livre de Moroni, chacun portant le nom du scribe prophétique auquel sa compilation est attribuée. Aucun des exemplaires de 1830 ne comportait le moindre numéro de verset : le texte se présentait comme des paragraphes continus à l'intérieur de chapitres bien plus longs que ceux que voient les lecteurs aujourd'hui. Les divisions actuelles en chapitres et en versets datent d'une édition de 1879 préparée par Orson Pratt, qui raccourcit aussi les chapitres et ajouta les premières notes en bas de page. Des éditions ultérieures remanièrent encore sa présentation : un comité dirigé par George F. Richards la composa sur deux colonnes en 1920 et ajouta des résumés de chapitre ainsi qu'un guide de prononciation ; une édition de 1981 mit à jour les renvois, les titres de chapitre et d'autres éléments de référence ; et un tirage de 2013 corrigea des incohérences typographiques qui s'étaient glissées dans les plaques d'impression depuis 1981.
hero.4=Il compte parmi les quatre ouvrages que le mouvement des saints des derniers jours appelle ses écrits canoniques, à côté de la Bible, de la [[DC|Doctrine et Alliances]] et de la [[PGP|Perle de Grand Prix]]. Le texte de ce corpus provient de l'export JSON du Mormon Documentation Project, que son responsable a déclaré du domaine public ; il suit le texte et le découpage en versets de l'édition standard actuelle, avec les corrections typographiques du tirage de 2013, et omet les notes en bas de page, les résumés de chapitre et l'introduction, qui restent protégés par le droit d'auteur. Puisque c'est précisément ce texte standard actuel qui est conservé ici, et non une impression historique particulière, aucune année de publication unique ne lui est attribuée.

