fact.2.label=Réalisée par
fact.2.value=Joseph Smith fils (1805–1844), qui a dit l'avoir traduit « par le don et le pouvoir de Dieu » à partir d'un ensemble de plaques métalliques anciennes ; il dicta le texte à des scribes, principalement Oliver Cowdery, des passages plus courts et antérieurs étant transcrits par Martin Harris et Emma Smith
fact.3.label=Publiée
fact.3.value=1830, Palmyra, dans l'État de New York ; imprimée par Egbert B. Grandin, environ 5 000 exemplaires
fact.4.label=Structure
fact.4.value=15 livres, du Premier Livre de Néphi au Livre de Moroni, portant le nom des scribes néphites et jarédites auxquels chacun est attribué ; l'édition de 1830 ne comportait pas de numéros de verset, et les divisions actuelles en chapitres et en versets datent de l'édition de 1879 préparée par Orson Pratt
fact.5.label=Rang
fact.5.value=Un des quatre écrits canoniques du mouvement des saints des derniers jours, à côté de la Bible, de la [[DC|Doctrine et Alliances]] et de la [[PGP|Perle de Grand Prix]]
fact.6.label=Dans ce corpus
fact.6.value=Le texte et le découpage en versets suivent la formulation standard actuelle, avec les corrections typographiques de l'édition de 2013, tirés de l'export JSON du domaine public du Mormon Documentation Project ; ses notes en bas de page, résumés de chapitre et introduction, protégés par le droit d'auteur, sont omis — c'est pourquoi aucune année d'impression unique n'est indiquée ici
