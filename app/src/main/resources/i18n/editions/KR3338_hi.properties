title=Kirkkoraamattu 1933/38 — इस संस्करण के बारे में | Common Root
description=Kirkkoraamattu 1933/38: फ़िनलैंड की कलीसियाई बाइबिल, इब्रानी और यूनानी से नए सिरे से अनूदित और दो हिस्सों में — 1933 और 1938 में — स्वीकृत, जब एक समिति उस पर लगभग सत्तर वर्ष काम कर चुकी थी।
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=यह नाम दो तिथियाँ है, क्योंकि पुस्तक दो हिस्सों में आई। फ़िनलैंड की इवैंजेलिकल लूथरन कलीसिया ने पुराना नियम 1933 में और नया नियम 1938 में स्वीकार किया, और फ़िनिश में तब से इसे 1933/38 की कलीसियाई बाइबिल कहा जाता है। अन्त की ये तिथियाँ छिपा लेती हैं कि आरम्भ कितना पीछे था: अनुवाद समिति 1861 में ही नियुक्त हो चुकी थी। लगभग सत्तर वर्ष, और अनुवादकों की एक से अधिक पीढ़ी, आदेश को पूरी हुई बाइबिल से अलग करते हैं।
hero.2=समिति ने जो तैयार किया वह नया अनुवाद था, संशोधन नहीं। उसने पुराने नियम की इब्रानी और नए नियम की यूनानी से काम किया — लातीनी, जर्मन या स्वीडिश माध्यमों से नहीं, और न उस फ़िनिश बाइबिल से जो पहले से प्रचलन में थी। फिर भी वह सचेत रूप से उसी बाइबिल की उत्तराधिकारी थी — Biblia 1776, जो डेढ़ शताब्दी तक कलीसिया का पाठ रही — और उसने पुरानी पुस्तक की शब्दावली और लय का बहुत कुछ बनाए रखा। यही विरासत कारण है कि 1938 में पूरी हुई बाइबिल अपने पहले पाठकों को ही पुरानी लगी, और यह भी कि वह आज तक फ़िनिश धर्मग्रन्थ का गरिमामय स्वर धारण किए है। वह 1992 तक आधिकारिक कलीसियाई बाइबिल बनी रही।
hero.3=इस पाठक में यह दो काम करती है। इंटरफ़ेस को फ़िनिश पर रखिए और यही संस्करण खुलता है — सूची का अपना क्रम आपको इसके बजाय Biblia 1776 देता, इसलिए फ़िनिश का यह पूर्वनिर्धारित चयन जानबूझकर किया गया है, वर्णमाला का संयोग नहीं। यह फ़िनिश वंश-शृंखला का सबसे ऊपरी पायदान भी है: KR3338 के किसी पद के नीचे एक पायदान खोलिए, तो उसके नीचे Biblia 1776 प्रकट होती है। उस पायदान को एक ही कलीसिया की बाइबिल के भीतर उत्तराधिकार की तरह पढ़िए, स्रोत की तरह नहीं, क्योंकि 1933/38 के अनुवादकों के सामने इब्रानी और यूनानी थीं, 1776 का पाठ नहीं। Biblia 1776 के नीचे शृंखला चलती रहती है: 1642 की Biblia, जिसका संशोधन 1776 का संस्करण है; फिर अग्रिकोला की 1548 की फ़िनिश, जिसे उस समिति ने अपनी बारी में संशोधित किया; और लूथर की 1545 की जर्मन, जो काम करते समय उनके पास खुली रहती थी। इनके नीचे ही जाकर सीढ़ी इब्रानी और यूनानी तक पहुँचती है।

