title=Berean Standard Bible — Su questa edizione | Common Root
description=La Berean Standard Bible: una traduzione in inglese moderno realizzata dai gruppi di Bible Hub e Discovery Bible dall'ebraico masoretico e da un Nuovo Testamento greco curato da loro stessi — e poi donata al pubblico dominio.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=La Berean Standard Bible è una delle traduzioni più recenti di questa raccolta e una delle più trasparenti sul proprio modo di lavorare. L'hanno fatta i gruppi di Bible Hub e Discovery Bible, sotto un comitato consultivo, ed è uscita dapprima con un altro nome: Berean Study Bible. La cosa generava confusione continua, perché una study Bible di solito indica una Bibbia imbottita di commento e note, che questa non è. La traduzione è stata ribattezzata; la sigla è rimasta.
hero.2=La maggior parte delle traduzioni parte da un Nuovo Testamento greco curato da altri. Questo progetto si è costruito prima il proprio. La Berean Greek Bible prende come base Nestle 1904 — scelto, dicono i suoi curatori, perché è il testo critico più accurato già in pubblico dominio — e lo collaziona con Nestle–Aland, il Nuovo Testamento greco della SBL, Tischendorf, Westcott–Hort, il testo bizantino e il Textus Receptus, annotando in nota dove divergono. L'inglese è stato tradotto di lì. L'Antico Testamento viene dall'ebraico masoretico, con i rotoli del Mar Morto, la Settanta e altri testimoni antichi consultati dove pesano su una lezione. Lo stesso lavoro è stato poi pubblicato a strati: un interlineare parola per parola, un'edizione rigidamente letterale e questa leggibile, così che il lettore possa andare dal greco all'inglese un passo alla volta invece di credere ai traduttori sulla parola. Ciò colloca inoltre la Berean dall'altra parte di uno spartiacque che questo corpus rende visibile: la Bibbia di Ginevra e la King James Version qui discendono dal Textus Receptus, e questa no.
hero.3=L'ultima cosa che il progetto ha fatto del testo è stata regalarlo. I testi bereani sono stati ceduti al pubblico dominio nell'aprile 2023, ed è per questo che l'intera Bibbia può stare in questo corpus ed esserne ricopiata. Se si mette l'interfaccia del lettore in inglese si apre la New International Version, che qui sta su licenza; la Berean è l'inglese moderno accanto a essa che chiunque può citare, stampare e ridistribuire. Nei pioli della discendenza si comporta come la Biblia en Español Sencillo. Per essa non è registrato alcun testo base, perché è una traduzione nuova e non la revisione di qualcosa che il corpus contenga, sicché un piolo aperto sotto un versetto bereano cade dritto sul fondo delle lingue originali segnato con ≈ e non su una Bibbia inglese più antica. Anche l'anno il catalogo lo lascia in bianco. Non è una svista: il testo è ancora rivisto man mano che arrivano correzioni, e gli anni qui sono scelti e non indovinati, sicché un'edizione senza una sola stampa datata non riceve data.

