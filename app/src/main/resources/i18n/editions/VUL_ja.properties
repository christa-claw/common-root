title=ラテン語ウルガータ — この版について | Common Root
description=ラテン語ウルガータ：ヒエロニムスの翻訳。382年に委嘱され、405年ごろに成り、千年にわたって西ヨーロッパの聖書を担い、グーテンベルクが最初に印刷した書物でもある。
heroHeading=ラテン語ウルガータ
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=4世紀の末、西方に流通していたラテン語の福音書は、写本ごとに互いに食い違っていた。教皇ダマスス1世は、秘書であったヒエロニムスにそれを整理するよう求めた。ヒエロニムスは改訂として着手した。そして結局、二十年あまりをその仕事に費やし — その大半はベツレヘムで過ごした — 誰も頼んではいなかったものを作り上げることになった。
hero.2=それを決定づけたのは、旧約を、教会がそれまで一貫して用いてきたギリシャ語の七十人訳からではなく、ヘブライ語から訳すという選択であった。ヒエロニムスはこの原則を「hebraica veritas」— ヘブライ語の真実 — と呼んだ。それは論争を呼んだ。アウグスティヌスは彼に書き送り、慣れ親しんだ読みが足もとで変わることで会衆が騒ぎ立てるのではないかと案じている。ヒエロニムスはそれでも行った。よりにもよってラテン語の聖書が、最初のキリスト者たちが読んだギリシャ語の聖書よりもヘブライ語に近いところに立っているのは、その結果である。
hero.3=これは千年にわたる西ヨーロッパの聖書となった。それ以前にもそれ以後にも、どの翻訳もこれほど長くは続いていない。ウィクリフが英語に訳した底本はこれであり、ドゥエー・ランス訳の訳者たちが手にしていたのもこれである — したがって、このコーパスに収めるドゥエー・ランス訳はその直系の子孫であり、あの版の系譜の段はここへ指し返している。またこれは、可動活字で印刷された最初の本格的な書物でもあった。グーテンベルクが1455年ごろマインツで組んだ聖書は、この本文である。

