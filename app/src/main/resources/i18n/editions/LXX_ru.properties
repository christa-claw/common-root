title=Греческая Септуагинта Брентона — Об этом издании | Common Root
description=Септуагинта — греческий Ветхий Завет еврейской диаспоры и ранней Церкви — в том греческом тексте, который Ланселот Брентон напечатал рядом со своим английским переводом в 1851 году; в этой читалке — ступень под Вульгатой и русским Синодальным переводом.
heroHeading=Греческая Септуагинта Брентона
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=Септуагинта — древнейший перевод еврейской Библии, и в первые христианские века она попросту и была Библией. Говорившие по-гречески иудеи Александрии начали её с пяти книг Закона, вероятно, в III веке до н. э., а остальные книги последовали в течение двух следующих столетий. Название происходит из рассказа: Письмо Аристея повествует о семидесяти двух старейшинах, посланных из Иерусалима перевести Закон для царя Птолемея II, и «Семьдесят» — LXX римскими цифрами — стало именем всего греческого Ветхого Завета. Авторы Нового Завета постоянно её цитируют, ранняя Церковь её читала, а православные Церкви и сегодня читают её как свой Ветхий Завет.
hero.2=Её значение не сводится к древности. Переводчики работали с еврейскими рукописями, которые местами расходились с масоретским текстом, ставшим впоследствии нормой, — книга Иеремии, например, по-гречески заметно короче, — так что во многих местах Септуагинта оказывается древнейшим свидетельством еврейского чтения, которое сама еврейская традиция не сохранила. В ней есть и книги, которых нет в еврейском каноне, среди них Товит, Иудифь, Премудрость Соломона, Сирах и Варух. А некоторые её словесные решения стали вероучением: в Исаии 7:14, где в еврейском тексте стоит ʿalmah, молодая женщина, в греческом — parthenos, дева, то самое слово, которое приводит Матфей.
hero.3=Греческий текст здесь — тот, который напечатал сэр Ланселот Брентон. В 1844 году он издал английский перевод Септуагинты, сделанный главным образом по Ватиканскому кодексу — рукописи IV века, хранящейся в Ватиканской библиотеке; в 1851 году лондонский издатель Сэмюэл Бэгстер выпустил его снова, добавив апокрифические книги и поместив греческий текст рядом с английским, и именно этот греческий текст содержится в собрании. Псалмы в нём сохраняют греческую нумерацию, общую с находящейся здесь Вульгатой: в обеих 22-й псалом — это псалом о пастыре, 23-й в еврейском тексте и в большинстве английских Библий. Псалмов 151; Ездра и Неемия составляют одну книгу; Есфирь и Даниил даны в своих более пространных греческих формах.
hero.4=В этой читалке она — ступень, а не основание. Она стоит под латинской Вульгатой, потому что часть Вульгаты пришла через греческий: её Псалтирь — та, что Иероним сделал с греческого текста Гекзапл Оригена и которую его собственный перевод с еврейского так и не вытеснил, а Премудрость, Сирах и Варух остались в старолатинских переводах с греческого. Она стоит под русским Синодальным переводом, чей Ветхий Завет сохранил многие чтения Септуагинты из стоящей за ним церковнославянской Библии, и под собственным английским переводом Брентона. Записанного предка у неё нет: еврейский текст, с которого она переведена, в собрании отсутствует, а Ленинградский кодекс, более чем на тысячу лет моложе и принадлежащий масоретской линии, виден под ней лишь как основание языков оригинала. Она содержит только Ветхий Завет, поэтому под стихом Нового Завета эта ступень пропускается, — и не все книги греческой традиции здесь есть: в этом списке 45 книг и ни одной книги Маккавейской.

