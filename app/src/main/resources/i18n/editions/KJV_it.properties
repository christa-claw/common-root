title=King James Version — Su questa edizione | Common Root
description=La King James Version del 1611: quarantasette traduttori in sei compagnie, incaricati di rivedere la Bishops' Bible anziché ricominciare da capo — e, in questo corpus, il testo di ottanta libri che porta ancora gli apocrifi della prima stampa.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Cominciò come una concessione in una riunione che verteva su altro. Alla conferenza di Hampton Court del 1604, convocata da Giacomo I per udire le lagnanze puritane sul libro di preghiera, fu avanzata la proposta di una nuova traduzione e il re la fece propria. Quarantasette dotti furono nominati e divisi in sei compagnie — due a Westminster, due a Oxford, due a Cambridge — ciascuna con la sua porzione della Bibbia e un corpo di regole con cui lavorare. La prima di quelle regole è quella che più conta nel leggerla: dovevano seguire la Bishops' Bible del 1568 e mutarla soltanto quanto l'originale richiedesse. Fu commissionata come revisione e non come traduzione nuova, e così si legge. Robert Barker, stampatore del re, pubblicò il libro finito a Londra nel 1611.
hero.2=Ciò che le regole non dicevano, e che i traduttori fecero comunque, fu risalire di continuo al di là della Bishops' Bible. L'inglese che ereditavano era stato fatto da altri — Tyndale anzitutto, e la Bibbia di Ginevra che un'intera generazione di lettori inglesi possedeva davvero e leggeva in casa. Questo corpus registra quel debito invece di lasciarlo all'introduzione: i testi base della King James Version sono qui [[GNV|la Bibbia di Ginevra]], con il testo greco ricevuto e l'ebraico masoretico al di sotto. Si apra un piolo della discendenza sotto un versetto della King James, e ciò che sale è Ginevra. I due stanno, versetto dopo versetto, tanto vicini che la domanda interessante cessa di essere se Ginevra sia stata usata e diventa dove le compagnie del 1611 abbiano scelto di scostarsene — cosa che ora si può guardare anziché credere.
hero.3=Una differenza fra questa King James e la maggior parte delle altre riguarda ciò che vi sta dentro. Il testo qui conta ottanta libri e 36.820 versetti: l'Antico e il Nuovo Testamento e i quattordici libri degli apocrifi stampati in mezzo, come li stampava il volume del 1611. Quasi ogni Bibbia King James venduta oggi ne ha sessantasei. Il corpus conserva la forma più lunga, e l'effetto si vede lungo la catena che la discendenza registra: [[GNV|la Bibbia di Ginevra]] ha qui sessantasei libri, questa ottanta, [[RV|la Revised Version]] sopra di essa ottanta, e [[ASV|la American Standard Version]] sopra ancora sessantasei. Che un'edizione stampi gli apocrifi è una decisione che ciascuna ha preso per conto proprio, e metterle in una sola colonna rende il disegno leggibile.
hero.4=Si sia precisi su che cosa significhi l'anno sulla scheda. Dice 1611, ed è la data della traduzione: non è un'affermazione su quale stampa sia questo testo. L'inglese qui è modernizzato nell'ortografia: la Genesi comincia «In the beginning God created the heaven and the earth», dove i fogli del 1611 leggevano «In the beginning God created the Heauen, and the Earth». Questa è dunque la King James quale gli stampatori successivi l'hanno normalizzata, e la stampa particolare da cui discende non è registrata — la stessa lacuna onesta che il corpus lascia per [[FB1776|Biblia 1776]]. Per leggere le scelte dei traduttori non fa differenza; per citare il libro del 1611 come oggetto la fa tutta. Si noti inoltre che non è l'edizione con cui si apre un'interfaccia in inglese: quella è [[NIV|la New International Version]], e la King James è un'edizione a cui si passa.

