title=Yorumsuz Türkçe Çeviri — Sobre esta edición | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): una biblia turca moderna, traducida de la World English Bible por İsmail Serinken en colaboración con eBible.org, con licencia CC BY-ND 4.0 — el texto turco que este corpus abre de forma predeterminada.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — literalmente una traducción turca "sin comentario" o "sin glosa" — es una biblia turca moderna completada por İsmail Serinken en colaboración con eBible.org, con derechos de autor fechados entre 2023 y 2025. El propio nombre declara el método: una versión sencilla, palabra por palabra, que deja deliberadamente fuera las glosas explicativas y la paráfrasis interpretativa, y prefiere la transparencia hacia el texto subyacente antes que un modismo pulido.
hero.2=Ese texto subyacente es, dicho con honestidad, el inglés y no el hebreo, el arameo o el griego: la propia página de derechos de autor de la traducción la describe como vertida de la World English Bible, lo que la convierte en una traducción secundaria y no en una hecha directamente de las lenguas originales, a diferencia de la mayoría de las demás biblias de este corpus. Common Root buscó primero una edición abierta de la histórica biblia turca de 1941 (Kitabı Mukaddes), ya suficientemente antigua como para estar en el dominio público en Turquía, pero no se pudo encontrar ninguna fuente digital utilizable de ella; la Yorumsuz Türkçe Çeviri fue la única biblia turca disponible con licencia abierta. El texto de este corpus proviene de la distribución USFM de eBible.org, catalogada allí como turytc.
hero.3=Sus decisiones de traducción tienen un carácter contemporáneo más que tradicional: da el nombre personal de Dios como Yahve en lugar del habitual "RAB" o "Yehova" turco, citando Éxodo 3:14-15, y da el nombre de Jesús como Yeşua en lugar del familiar İsa turco, dejando los demás nombres propios en su forma habitual. Mantiene el canon protestante estándar de 66 libros, sin libros deuterocanónicos.
hero.4=Es la única biblia turca de este corpus, por lo que una interfaz turca se abre en ella de forma predeterminada.

