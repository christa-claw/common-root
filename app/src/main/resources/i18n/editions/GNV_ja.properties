title=ジュネーヴ聖書1599 — この版について | Common Root
description=ジュネーヴ聖書：ジュネーヴに亡命した英語のプロテスタントたちが作った、節番号と欄外注釈を備えた最初の英語聖書であり、シェイクスピアの世代が読み、キング・ジェイムズ・バージョンの下に位置する親の段でもある。
heroHeading=ジュネーヴ聖書1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=この聖書は国外で、故国に安全に留まれなかった人々の手によって作られた。1553年にメアリー1世が即位し、イングランドがローマへ復帰すると、数百人のプロテスタントが国を去った。その一部はカルヴァンのジュネーヴに落ち着いた。そこには印刷機があり、ヘブライ語とギリシャ語の学識があり、答えるべき主教はいなかった。ウィリアム・ウィッティンガムは1557年にそこで新約聖書を刊行した。アンソニー・ギルビー率いる一団が旧約聖書に取り組み、完全な聖書は1560年、メアリーの死から二年後、亡命者の大半がすでに帰国していた頃に、ジュネーヴでロウランド・ホールによって印刷された。
hero.2=彼らが作り上げたものは、英語聖書の見た目そのものを変えた。それはすべての節に番号を振った最初の聖書であり、読者は章ではなく行を示されるようになった。活字はブラックレターではなくローマン体で組まれ、書見台に鎖でつながれるのではなく所有できるほど小さく安価に刊行された。そして欄外は充実していた——参照箇所、難語の注解、地図、そして一節が何を意味するかを説明する注釈である。この最後の点こそが、この聖書が愛された理由であり、また憎まれた理由でもある。注釈は改革派のもので、ところによっては鋭く、教理についてと同じくらい気安く、王をどう考えるべきかを読者に告げている。
hero.3=この版の年号には一言注意が要る。ジュネーヴ聖書は一冊の書物ではなく、八十年にわたって版を重ねながら中身が変わっていったテキストだったからである。1576年、ローレンス・トムソンは新約聖書を、セオドア・ベザの1565年のギリシャ語版に基づく自らの改訂に差し替え、1587年以降はそれが大半のジュネーヴ聖書が持つ新約聖書となった。1599年にはフランシスクス・ユニウスによるヨハネの黙示録への注釈が加えられた。したがって「1599」は、印刷年よりもむしろ——トムソンの新約聖書とユニウスの黙示録注釈という——組み合わせを示す名であり、この年号を掲げた聖書はその後も印刷され続けた。だからこそ、カタログの札は年を空欄のままにし、短い表示を必要とする段の表示には GNV 1599 と記されている。
hero.4=この文集における位置づけは蝶番である。ここでの最長の系譜の連鎖は、ワールド・イングリッシュ・バイブルからアメリカン・スタンダード・バージョン、リバイズド・バージョン、キング・ジェイムズ・バージョンへとたどり、そしてこれへと至る。キング・ジェイムズの節の下でさらにもう一段開けば、ジュネーヴの語法がその下に現れる——キング・ジェイムズ訳がどれほど作り出されたものではなく受け継がれたものであるかを見る、いちばん率直な方法である。ジュネーヴの下にはもう英語はなく、ギリシャ語とヘブライ語、テクストゥス・レセプトゥスとウェストミンスター・レニングラード写本があるのみで、そこで梯子は底に達する。本文はこの版が持つとおりに——綴りも含めて——示されており、創世記1章1節は heauen と記す。詩篇の表題やヘブライ人への手紙末尾の奥付は、当時の印刷がそう組んだとおり最初の節の冒頭に組み込まれており、整理して取り除くことなくそのまま残されている。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=英語——エリザベス朝期のもので、原綴りのまま
fact.2.label=制作者
fact.2.value=メアリー1世の治世を逃れてジュネーヴに落ち着いた英語のプロテスタントたち——ウィリアム・ウィッティンガムが1557年の新約聖書を、アンソニー・ギルビー率いる一団が旧約聖書を手がけた
fact.3.label=最初の完全な版
fact.3.value=1560年、ジュネーヴでロウランド・ホールにより印刷
fact.4.label=旧約の底本
fact.4.value=マソラ本文のヘブライ語——[[WLC|ウェストミンスター・レニングラード写本]]がこのコーパスにおけるその本文の証人である
fact.5.label=新約の底本
fact.5.value=[[TR|テクストゥス・レセプトゥス]]系のギリシャ語。1576年以降は、ベザの1565年のギリシャ語版に基づくローレンス・トムソンの改訂が、大半の印刷でウィッティンガムの新約聖書に取って代わった
fact.6.label=「1599」が示すもの
fact.6.value=トムソンの新約聖書と、その年にジュネーヴ聖書に加わったフランシスクス・ユニウスのヨハネの黙示録への注釈とを共に載せた印刷
fact.7.label=初めてのこと
fact.7.value=節番号をすべてに振った最初の英語聖書であり、ブラックレターではなくローマン体で組まれ、欄外注釈の一式を備えていた——「スタディバイブル」という語が生まれる前のスタディバイブルである
fact.8.label=異を唱えた人
fact.8.value=ジェイムズ1世。欄外注釈を扇動的だと考え、その不満が[[KJV|キング・ジェイムズ・バージョン]]を動かす一因となった
fact.9.label=カタログの年
fact.9.value=「About」の札では空欄だが、段の表示には GNV 1599 とある——ジュネーヴ聖書は1560年から1640年代まで版を重ね、同じ名前のもとで新約聖書と注釈が変わっていった
fact.10.label=このコーパスでは
fact.10.value=66巻すべてを収め、外典は含まず、綴りは現代化されていない——創世記1章1節は "the heauen and the earth" と記す
fact.11.label=段の下
fact.11.value=[[TR|テクストゥス・レセプトゥス]]と[[WLC|ウェストミンスター・レニングラード写本]]。ジュネーヴ自体は[[KJV|キング・ジェイムズ・バージョン]]の下の最初の段である
