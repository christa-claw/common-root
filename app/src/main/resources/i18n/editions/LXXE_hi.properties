title=ब्रेंटन का अंग्रेज़ी सेप्टुआजिंट — इस संस्करण के बारे में | Common Root
description=सर लैंसलॉट ब्रेंटन द्वारा यूनानी पुराने नियम का अंग्रेज़ी अनुवाद, जो पहली बार 1844 में लंदन में छपा और 1851 में अप्रामाणिक ग्रंथों के साथ फिर से प्रकाशित हुआ — एक सदी से अधिक समय तक अंग्रेज़ी का सेप्टुआजिंट, और इस पाठक में उस यूनानी पाठ के ऊपर का पायदान जिससे इसका अनुवाद हुआ।
heroHeading=ब्रेंटन का अंग्रेज़ी सेप्टुआजिंट
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=लैंसलॉट चार्ल्स ली ब्रेंटन (1807–1862) रॉयल नेवी के एक एडमिरल, सर जहलील ब्रेंटन, के पुत्र थे, और ऑक्सफ़र्ड के ओरियल कॉलेज से उपाधि लेने के दो वर्ष बाद, 1830 में, चर्च ऑफ़ इंग्लैंड में उनका अभिषेक हुआ। वे उसमें अधिक समय नहीं रहे। ऑक्सफ़र्ड में उनकी भेंट जॉन नेल्सन डार्बी से हुई थी, और 1831 के अंत तक वे राजकीय चर्च छोड़कर बाथ में एक स्वतंत्र चैपल स्थापित कर चुके थे; 1835 तक वह चैपल प्लिमथ ब्रदरन से जुड़ गया था, वह आंदोलन जिसे डार्बी उस समय आकार दे रहे थे। डार्बी की अपनी बाइबिलें भी इस संग्रह में हैं, फ़्रांसीसी और अंग्रेज़ी में। 1844 में ब्रेंटन को अपने पिता की बैरोनेट उपाधि विरासत में मिली, और उसी वर्ष लंदन के सैमुअल बैगस्टर एंड संस ने उनका सेप्टुआजिंट अनुवाद प्रकाशित किया। 1862 में आइल ऑफ़ वाइट पर उनका निधन हुआ — निःसंतान, अपनी वंश-शाखा के अंतिम बैरोनेट।
hero.2=यह पहला अंग्रेज़ी सेप्टुआजिंट नहीं था — चार्ल्स थॉमसन 1808 में फ़िलाडेल्फ़िया में एक प्रकाशित कर चुके थे — पर टिका यही: डेढ़ सौ से अधिक वर्षों तक, 2007 में New English Translation of the Septuagint के आने तक, जो अंग्रेज़ी पाठक इब्रानी के बजाय यूनानी पुराना नियम चाहता था, वह ब्रेंटन को पढ़ता था। उन्होंने मुख्यतः कोडेक्स वैटिकनस से अनुवाद किया, जो वैटिकन पुस्तकालय की चौथी शताब्दी की पांडुलिपि है। पहले संस्करण में अप्रामाणिक ग्रंथ नहीं थे; 1851 के संस्करण ने उन्हें जोड़ा, और यह प्रति 1851 के ही पाठ को दोहराती है। बैगस्टर के यूनानी-अंग्रेज़ी संस्करणों ने यूनानी को अंग्रेज़ी के बगल में रखा, और वह यूनानी पाठ इस संग्रह में एक अलग संस्करण के रूप में है। क्योंकि अंग्रेज़ी यूनानी का अनुसरण करती है, वह वहीं वैसा पढ़ती है जैसा यूनानी पढ़ती है: भजन यूनानी क्रमांकन रखते हैं, इसलिए यहाँ भजन 22 चरवाहे वाला भजन है, और यशायाह 7:14 में “a virgin shall conceive” यूनानी parthenos का अनुवाद है, इब्रानी ʿalmah का नहीं।
hero.3=इस पाठक में यह एक ऐसा पायदान है जिसका एक ही, शाब्दिक जनक है: इसके नीचे का यूनानी सेप्टुआजिंट वही पाठ है जिसका ब्रेंटन ने अनुवाद किया, जिसे उनके अपने प्रकाशक ने उनकी अंग्रेज़ी के बगल में छापा। इसके किसी पद के नीचे एक पायदान खोलिए, तो यूनानी प्रकट होती है, और उसके नीचे मूल-भाषा तल के रूप में लेनिनग्राद कोडेक्स। संग्रह में इसके ऊपर बदले में कुछ नहीं टिका है। हमारी प्रति पुस्तक से संकरी है। इसमें 37 पुस्तकें हैं, वे जो इब्रानी धर्मसूची में भी अपने सामान्य नामों से हैं। eBible.org की जिन फ़ाइलों से यह ली गई, उनमें अप्रामाणिक ग्रंथ भी हैं — तोबित, यूदीत, प्रज्ञा, सीराख, बारूक, मक्काबियों की चार पुस्तकें और अन्य — और एस्तेर तथा दानिय्येल केवल अपने लम्बे यूनानी रूपों में दिए गए हैं। इनमें से कुछ भी संग्रह तक नहीं पहुँचा, इसलिए यहाँ न एस्तेर है न दानिय्येल, और जहाँ नीचे की यूनानी में तोबित या प्रज्ञा है, वहाँ उसके ऊपर कोई अंग्रेज़ी नहीं है। एज्रा और नहेम्याह यहाँ दो पुस्तकें हैं, जबकि नीचे की यूनानी में एक। इसी अनुवाद का वर्तनी-संशोधित रूप, एडम बॉयड का 2020 का Updated Brenton, संग्रह में एक अलग संस्करण के रूप में है।

