title=Free Bible Version — About This Edition | Common Root
description=The Free Bible Version: a modern English Bible translated from the Hebrew and the Nestle–Aland Greek by Jonathan Gallagher, and published under a share-alike licence so that anyone may reprint it.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=This translation exists because of a copyright page. Almost every modern English Bible carries one, and what it usually says is that a few hundred verses may be quoted without asking, that a whole book needs written permission, and that publishing the text entire means paying royalties. For a church website or a recording that can be the end of the matter. The Free Bible Version was made to be the version with nothing in the way of it.
hero.2=It is the work of Jonathan Gallagher, who holds a doctorate in divinity from St Andrews, and it is published by Free Bible Ministry, a not-for-profit. The New Testament comes from the Nestle–Aland Greek — the critical text the Bible Societies use — and the Old Testament from the Hebrew. The method the project describes is worth stating because it is not the usual one: the translation is made from the original text with lexicons alone, and only then compared against existing versions, as a check for duplication and error rather than as a source. It is not a revision of an older English Bible and not a synthesis of newer ones. Its stated aim is contemporary English that avoids slang and fashionable turns of phrase, and it declines to translate toward the positions of any particular faith community.
hero.3=The licence is the point of the thing. It is Creative Commons Attribution-ShareAlike 4.0: copy it, print it, put it on a website, adapt it, as long as the version is named, changes are marked, and whatever is built from it goes out under the same terms. That is a different bargain from public domain — the freedom is passed on rather than given away — and it is the same licence as the Spanish Versión Biblia Libre in this corpus, which comes from the same ministry.
hero.4=Two things follow for the reader. The catalogue leaves its year blank, because the project publishes revisions as it makes them; there is no dated printing this corpus is pinned to, and inventing one would be worse than the blank. And a rung opened beneath a Free Bible Version verse shows ≈ TR, the Textus Receptus, marked as a witness rather than as a parent. That is not what this translation was made from. It is what the corpus can currently offer as the Greek — no critical edition is held here yet — and the same stand-in appears beneath the New International Version, the New American Standard Bible and the Berean Standard Bible for the same reason.

