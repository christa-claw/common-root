title=Coran — texte uthmani — À propos de cette édition | Common Root
description=Le Coran dans la lecture hafs selon assim, le texte sur lequel reposent la plupart des Corans imprimés dans le monde depuis l'édition du Caire de 1924 — et, dans ce corpus, un texte comparé verset par verset à l'exemplaire du Complexe du roi Fahd lui-même, et jugé concorder sur le squelette consonantique dans la totalité de ses 6 236 versets.
heroHeading=Coran — texte uthmani
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=La lecture qui sous-tend ce texte a une chaîne de transmission nommée. Hafs ibn Sulayman al-Kufi (m. 796) l'a transmise de son maître, Assim ibn Abi al-Najoud, l'un des lecteurs de Koufa dont la récitation fut plus tard canonisée par Ibn Mujahid parmi les sept (Assim mourut en 745). Hafs selon Assim — « Hafs, d'après Assim » — est l'une de plusieurs lectures que les musulmans considèrent comme des transmissions également autorisées de la même révélation ; ce n'est pas la seule, mais c'est de loin la plus imprimée. Lorsqu'une commission de savants d'al-Azhar, œuvrant à partir de 1907 sous le roi Fouad Ier, produisit le Coran égyptien standard que l'Imprimerie Amiri de Boulaq publia le 10 juillet 1924, c'est cette lecture qu'elle fixa dans le texte imprimé. La plupart des Corans vendus aujourd'hui, où que ce soit, y compris celui du Complexe du roi Fahd lui-même, suivent l'exemple de cette édition.
hero.2=Ce qui figure dans ce corpus provient, par l'édition quran-uthmani d'alquran.cloud, de la numérisation par le Projet Tanzil de ce même texte hafs. Il se combine dans le lecteur avec trois traductions : l'anglaise de Pickthall de 1930, l'anglaise de Yusuf Ali de 1934 et la russe de Sablukov de 1878 — ouvrez l'une des trois à côté de celui-ci, et sa traduction s'affiche sous chaque verset. Le lecteur propose aussi le Coran selon deux ordres : l'ordre canonique du mushaf fixé par cette même tradition, et l'ordre que les chercheurs reconstituent pour la date de révélation de chaque sourate.
hero.3=La préservation à la lettre est elle-même l'une des affirmations faites sur ce texte, elle est donc ici vérifiée plutôt que supposée. Comparé verset par verset à l'exemplaire hafs du Complexe du roi Fahd pour l'impression du noble Coran, les deux textes concordent sur le squelette consonantique — les lettres nues, avant l'ajout de toute marque vocalique — dans la totalité de ses 6 236 versets. Toute différence relevée se limite à la notation des voyelles et des marques de pause, à l'orthographe du hamza et à huit endroits où les deux versions tracent différemment la limite des mots ; aucune ne touche une seule lettre du texte lui-même. C'est l'inverse de l'incertitude que ce corpus doit admettre pour la Bible finnoise de 1776, où l'on ignore simplement de quelle impression le texte descend.
hero.4=Deux choses que cette concordance n'établit pas méritent d'être dites clairement. Ce n'est pas une affirmation de filiation — concorder avec le texte du Complexe montre que les deux sont le même texte, non que l'un a été copié de l'autre. Et ce n'est pas une autorisation : une demande envoyée au Complexe fin août 2026, sollicitant la permission d'afficher ses propres fichiers de riwayat, n'avait pas reçu de réponse au moment de la rédaction de ces lignes. Le seul verset où la comparaison elle-même a brièvement montré un désaccord, 19:3, s'est révélé être un défaut dans la lecture du fichier de référence, et non dans l'un ou l'autre des deux Corans — corrigé, il correspond exactement. La copie de référence elle-même est une reconstitution du fichier de traitement de texte du Complexe, non sa publication numérique officielle, ce qui est le seul aspect où ceci n'est pas tout à fait une comparaison avec un jeu de données officiellement publié.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=arabe coranique, dans l'orthographe uthmani standard
fact.2.label=Lecture (qira'ah)
fact.2.value=Hafs selon Assim — transmise par Hafs ibn Sulayman (m. 796) d'après Assim ibn Abi al-Najoud de Koufa (m. 745) ; l'une des quatorze transmissions reconnues, et celle que suivent la plupart des Corans imprimés dans le monde
fact.3.label=Forme imprimée standard
fact.3.value=l'édition du Caire de 1924 — une commission de savants d'al-Azhar, œuvrant à partir de 1907 sous le roi Fouad Ier, imprimée par l'Imprimerie Amiri de Boulaq le 10 juillet 1924 ; le modèle que suivent la plupart des impressions ultérieures, y compris celle du Complexe du roi Fahd lui-même
fact.4.label=Texte utilisé ici
fact.4.value=l'édition quran-uthmani d'alquran.cloud, dont le texte arabe provient de la numérisation du Projet Tanzil
fact.5.label=Comparé à
fact.5.value=l'exemplaire hafs du Complexe du roi Fahd pour l'impression du noble Coran, verset par verset : concorde sur le squelette consonantique dans la totalité de ses 6 236 versets, chaque différence se limitant à la notation vocalique, à l'orthographe du hamza et à huit cas de division des mots
fact.6.label=Ce que cet accord ne prouve pas
fact.6.value=la filiation — concorder n'est pas descendre l'un de l'autre — ni une autorisation : une demande adressée au Complexe pour afficher ses propres fichiers, envoyée fin août 2026, n'avait pas reçu de réponse au moment de la rédaction de ces lignes
fact.7.label=Traductions compagnes dans ce corpus
fact.7.value=[[Q-EN|l'anglaise de Pickthall]] (1930), [[Q-YA|l'anglaise de Yusuf Ali]] (1934) et [[Q-SAB|la russe de Sablukov]] (1878) — trois traductions associées à ce texte de base sous chaque verset
fact.8.label=Dans ce corpus
fact.8.value=le seul texte arabe auquel chaque [[Q-EN|traduction]] ici est associée ; à l'inverse, [[FB1776|la Bible finnoise de 1776]], où l'on ignore simplement de quelle impression le texte descend
fact.9.label=Licence
