fact.8.value=واحدة من أربع طبعات إسبانية، مع [[RVR09|Reina-Valera 1909]] و[[BES|Biblia en Español Sencillo]] و[[VBL|Versión Biblia Libre]] — وليس لأيّ منها بعد أصل مسجّل هنا؛ وتحمل القانون البروتستانتي المعتاد المؤلَّف من ستة وستين سفراً، لا الطبعة المطبوعة الأكمل التي تضمّ الأسفار القانونية الثانية والتي يصدرها الناشر نفسه أيضاً
