title=Palabra de Dios para Ti — عن هذه الطبعة | Common Root
description=Palabra de Dios para Ti: ترجمة إسبانية نشرتها Asociación Bíblica Latinoamericana عام 2020، تحتفظ بأسماء الله العبرية منقولة بالحروف، ورُخّصت بحرية لأي استخدام.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — أي "كلمة الله لك" — ترجمة إسبانية جديدة نشرتها عام 2020 Asociación Bíblica Latinoamericana؛ وصدر نصّ إلكتروني عام 2022 عبر Latinamerican Textual Bible Foundation, Inc.، وهي منظمة غير ربحية مسجَّلة في فلوريدا توزّعها على eBible.org وYouVersion. وتُنسب إلى المترجمَين فرانسيسكو ليبانو وجويس ليبانو. وخلافاً لسلسلة رينا-بالِيرا التي تفتح عليها واجهة الإسبانية في هذه المجموعة افتراضياً، فهي ليست مراجعة لترجمة كاسيودورو دي رينا من القرن السادس عشر ولا لأيّ شيء ينحدر منها؛ بل هي ترجمة مستقلّة، أُنجزت مباشرة من اللغات الأصلية، موجَّهة إلى القرّاء العاديين في أنحاء أمريكا الناطقة بالإسبانية، ومقصودٌ أن تُقتبس بحرّية دون طلب إذن.
hero.2=يتبع العهد القديم Biblia Hebraica Stuttgartensia، ويتبع العهد الجديد الطبعة 27 من Novum Testamentum Graece لإبرهارد نستله. ويميّز صفحاتها اختيارٌ واحد عن أغلب الأناجيل الإسبانية بعد رينا: فحيث تنقل تلك الاسم الرباعي بوصفه "Jehová" أو تستبدله بـ"Señor"، تحتفظ Palabra de Dios para Ti بالأسماء العبرية نفسها منقولة بالحروف — Yavé وʼElohim وʼEL-Shadday — بحيث يفتتح سفر التكوين، بعبارة هذه الطبعة نفسها: "En un principio ʼElohim creó los cielos y la tierra".
hero.3=في هذا القارئ هي واحدة من أربع طبعات إسبانية، إلى جانب [[RVR09|Reina-Valera 1909]] و[[BES|Biblia en Español Sencillo]] و[[VBL|Versión Biblia Libre]]. والواجهة لا تزال تفتح افتراضياً على رينا-بالِيرا 1909؛ وهذه طبعة يُوصَل إليها من بطاقتها الخاصة. وهي، مثل الطبعتين الأخريين، ترجمة جديدة لا مراجعة لأيّ شيء آخر تحمله هذه المجموعة، فلم يُسجَّل لها أصل في درجات النسب — والدرجة المفتوحة تحت إحدى آياتها تهبط رأساً إلى أرضية اللغات الأصلية المعلَّمة بـ ≈. وتصدر Asociación Bíblica Latinoamericana أيضاً طبعة مطبوعة أكمل تضمّ الأسفار القانونية الثانية؛ والنصّ الذي تحمله هذه المجموعة هو القانون البروتستانتي المعتاد المؤلَّف من ستة وستين سفراً.

