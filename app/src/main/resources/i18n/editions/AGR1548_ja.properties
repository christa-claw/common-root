title=アグリコラ聖書1548 — この版について | Common Root
description=ミカエル・アグリコラのフィンランド語訳：1548年の新約聖書、1551年の詩篇、そして預言書——最初に印刷されたフィンランド語の聖書であり、書かれたフィンランド語そのものの始まりである。
heroHeading=アグリコラ聖書1548
readerHref=/reader?c1.src=agr1548
thanks=このページに訂正を送ってくださった方々に感謝します。

# The narrative, one paragraph per key, in order.
hero.1=現存する最古の印刷フィンランド語である。ミカエル・アグリコラが1548年に『新約聖書』（Se Wsi Testamenti）を出版したとき、フィンランド語が活字に組まれたことはほとんどなかった——数年前に出した自身のABC読本が、そもそも最初のフィンランド語の書物だった。その間には1544年の祈祷書があり、これは分量の多い書物で、すでに詩篇の訳を含んでいた。聖書を印刷するには、まずこの言語をどう書くかを決めねばならず、その決定——綴字、借用語、言葉の調子——こそが書かれたフィンランド語の始まりである。新約聖書は彼とトゥルクの仲間たちに十年以上を要し、詩篇は1551年に続き、預言書とモーセの書からの抜粋は1551年と1552年に続いた。しかし彼のものは最初に印刷されたフィンランド語であって、最初に書かれたフィンランド語ではない。ヴェスト写本、ウプサラ写本B28、カンガサラの典礼書、ウプサラ断片という四つの写本がフィンランド語の聖書箇所を含んでおり、カウコ・ピリネンは1988年、それらをスウェーデン語の原典と比較することで、その一部がアグリコラの印刷した何よりも古く、おそらく1530年代にまで遡って書かれたことを示した。
hero.2=彼が聖書全体を訳すことは一度もなく、この読書環境もそうではないかのようには見せない。新約聖書と150篇すべての詩篇は完全であり、預言書とモーセの書は抜粋のみが収められている。彼が他の場所で訳した部分もここに収められている——1544年の祈祷書、および1549年の『ケシキルヤ』（式文書）と『メッス』（ミサ書）は、それ自体の聖書本文を含んでおり、その中には「Genesist mutomat Lughut」という見出しで印刷された創世記の章があり、685節がそこから採られている。それらは、聖書諸巻に該当する箇所の節が存在せず、かつ本文が祈りの中の単一の引用としてではなく連続して流れている場合にのみ用いられている。こうして創世記は結局、部分的にここに収められている。1章から4章、22章、28章、32章である。士師記、ルツ記、歴代誌上、エステル記はまったく欠けている。完全なフィンランド語の旧約聖書は、系譜の一段上にある1642年の『ビブリア』を待たねばならなかった。
hero.3=この読書環境において、アグリコラはフィンランド語系譜の最古の段である。1642年の『ビブリア』の節の下で一段を開くと、彼の本文がルターのドイツ語と並んで現れる——これこそ1642年の委員会が実際に開いていた二つの典拠である。アグリコラ自身の下では、系譜はフィンランド語を完全に離れる。彼はエラスムスのギリシャ語と、その横に印刷されたエラスムスのラテン語訳、ルターのドイツ語、そしてウルガタとを典拠として用いた。そのうち三つがここでは彼の母本として記録されている。エラスムスのラテン語訳、および彼が同様に用いたグスタフ・ヴァーサの1541年のスウェーデン語聖書は、この語料庫には収められていない。本文はコトゥス（Kotus）のVKSコーパスのもので、1548年版そのものの綴字による：「Algusa oli Sana / Ja se Sana oli Jumalan tykene」。スウェーデン語聖書は1526年にスウェーデン語新約聖書が現れて以来印刷されていたので、スウェーデン語訳は当初から彼の手元にあった。

