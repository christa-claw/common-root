fact.3.label=出版
fact.3.value=『Se Wsi Testamenti』1548年；『Dauidin Psaltari』1551年；『Weisut』抜粋1551年および『Ne Prophetat』1552年——いずれもストックホルムで印刷
fact.4.label=内容
fact.4.value=完全な新約聖書、150篇すべての詩篇、抜粋による預言書とモーセの書——彼の典礼書からとられた創世記の章（1–4、22、28、32）を含む
fact.5.label=翻訳の典拠
fact.5.value=エラスムスのギリシャ語とラテン語訳、ルターのドイツ語、そしてウルガタ——グスタフ・ヴァーサの1541年のスウェーデン語聖書も机上にあった
fact.6.label=先行
fact.6.value=[[LUT1545|1545年のルターのドイツ語聖書]]——ここでフィンランド語の系譜はドイツ語へと越える
fact.7.label=後継
fact.7.value=[[FB1642|1642年の『ビブリア』]]、その委員会はアグリコラのフィンランド語を改訂した
