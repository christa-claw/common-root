title=Chinese Union Version — Om denna utgåva | Common Root
description=1919 års Chinese Union Version: tjugonio års kommittéarbete som gav den bibel de flesta kinesiska protestanter ännu läser, och en av de första böcker som någonsin gavs ut på skriven talspråklig mandarin.
heroHeading=Kinesiska unionsöversättningen
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=År 1890 samlades de protestantiska missionerna i Kina i Shanghai och erkände ett problem. Det fanns redan flera kinesiska biblar, och inga två var överens — inte om ordalydelsen, inte om hur namnen skulle stavas, inte ens om vilken språkart man skulle skriva på. Konferensen beslöt om en enda översättning som varje mission skulle använda och kallade den en unionsöversättning: 和合本, den sammanjämkade texten. Eftersom skriven kinesiska då var delad mellan de bildades skriftspråk och allas andras talspråk beställdes tre på en gång — två på skriftkinesiska, en på mandarin.
hero.2=Mandarinkommittén höll på i tjugonio år. Calvin Wilson Mateer, en amerikansk presbyterian som varit i Shandong sedan 1863, var dess ordförande och dog 1908 med arbetet ofullbordat; den panel han samlat ur ett halvdussin missioner fortsatte, liksom de kinesiska lärde som arbetade vid deras sida och vilkas namn missionshandlingarna bevarade långt mindre omsorgsfullt. De tog den engelska Revised Version som den text de återgav och prövade den mot hebreiskan och grekiskan bakom den — vilket ställer korpusets egen Revised Version ett steg uppströms om denna bibel, och King James Version ett steg däröver. De två skriftkinesiska versionerna slogs till slut samman till en. Mandarinversionen är den som överlevde.
hero.3=Den gavs ut 1919, och årtalet gjorde mer för den än någon kommitté kunde. Det var året för fjärde maj-rörelsen, då kinesiska författare på allvar började överge skriftspråket för talspråket, och unionsöversättningen kom som en av de allra första omfångsrika böcker som redan var skrivna så. En översättning avsedd att göra slut på ett gräl mellan missionärer blev en milstolpe i modern kinesisk prosa, och dess vändningar citeras av folk som aldrig öppnat en bibel. Den har sedan dess tryckts i två utgåvor som skiljer sig åt på ett enda ord — om Gud heter 神 eller 上帝 — med spärrningen justerad så att båda utgåvorna ännu bryter sidorna likadant.
hero.4=I denna läsare är den den enda kinesiska bibeln, vilket avgör två saker om hur den beter sig. Ställ gränssnittet på kinesiska och det är denna som öppnas — inte för att den valts, som Reina-Valera 1909 valts för spanskan, utan för att katalogen inte finner någon annan bibel på språket. Och i härstamningens stegpinnar har den ingen registrerad förlaga, så en stegpinne under en vers går rakt ned till det ≈-markerade originalspråksgolvet, fastän den Revised Version den gjordes ur står en spalt bort i korpuset. Sitt stegpinnemärke bär den däremot med ett årtal, 1919, vilket inte varje utgåva här gör.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Språk
fact.1.value=kinesiska — talspråklig mandarin (官話 / baihua), inte skriftkinesiska
fact.2.label=Namn på egna språket
fact.2.value=和合本 (héhéběn) — den “sammanjämkade” eller “förenade” versionen
fact.3.label=Beställd av
fact.3.value=1890 års allmänna konferens för protestantiska missionärer i Shanghai
fact.4.label=Översatt av
fact.4.value=en kommitté hämtad ur flera protestantiska missioner; den amerikanske presbyterianen Calvin Wilson Mateer (1836–1908) var ordförande för mandarinpanelen till sin död och arbetade hela tiden med kinesiska kolleger
fact.5.label=Utgiven
fact.5.value=1919, efter tjugonio års arbete
fact.6.label=Textunderlag
fact.6.value=den engelska Revised Version som arbetsunderlag, prövad mot hebreiskan och grekiskan — samma [[RV|Revised Version]] som detta korpus rymmer
fact.7.label=Två utgåvor
fact.7.value=Shen-utgåvan (神版) och Shangdi-utgåvan (上帝版), som skiljer sig endast i vilket kinesiskt ord som bär “Gud”
fact.8.label=Senare revision
fact.8.value=Revised Chinese Union Version, Nya testamentet 2006 och hela bibeln 2010 — inte denna text
fact.9.label=I detta korpus
fact.9.value=den enda kinesiska bibeln här, så ett kinesiskt gränssnitt öppnar på den som standard; ingen förlaga är registrerad i härstamningens stegpinnar, men dess stegpinnemärke bär årtalet 1919
