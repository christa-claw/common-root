title=Young's Literal Translation — 关于本版本 | Common Root
description=罗伯特·扬的圣经逐字直译本，1862年首次在爱丁堡出版，1887年由扬本人修订，1898年由其出版商再度修订——一部英文圣经，保留希伯来文与希腊文的时态、词序，并尽可能保留其用词，即使英语难以跟上也不例外。
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=罗伯特·扬（Robert Young，1822–1888）是爱丁堡的一位印刷商兼书商。他在印刷学徒期间自学了希伯来文和另外几种东方语言，1856年至1861年间在印度苏拉特主持一家差会印刷所，后人记住他主要是因为两部书：经文汇编 Analytical Concordance to the Bible 和这部译本。他于1862年在爱丁堡出版 Literal Translation，1887年出版修订版。他去世10年后，即1898年1月，他的出版商推出第三版，再次“按其现有原则”加以修订；本语料库收录的正是这一文本。扬依据通行的马所拉希伯来文本翻译旧约，依据希腊文公认文本（Textus Receptus）翻译新约，并明言不打算为两者另立新文本：他写道，翻译与经文鉴别是不同的工作，能兼任两者的人寥寥无几。
hero.2=全部用意在于让英语读者看见原文的语法。扬认为，原文用过去时而译文用现在时，或者“an a for a the”——以不定冠词代替定冠词——的译本，便是把逐字默示置于一旁；他据此翻译。希伯来文的动词形式被转成英语时态，因此叙事常以现在时展开：创世记开头是“In the beginning of God's preparing the heavens and the earth —”，接着是“and God saith, ‘Let light be;’ and light is.”为达意而补入的词放在方括号内：“Jehovah [is] my shepherd, I do not lack.”他力求凡能做到之处，都给每个希伯来文或希腊文词语一个固定的英文对应词，因此希伯来文的 olam 与希腊文的 aiōn 译作“age”和“age-during”，而非“ever”和“eternal”；在马太福音25:46，义人进入“to life age-during”。整部旧约中的神名都作“Jehovah”。
hero.3=我们的副本是完整的：从创世记到启示录共66卷，不含次经，采用英文的章节编号——诗篇共150篇，每篇的标题并入其第1节，玛拉基书止于第4章。作为公认文本的译本，它包含了后来的校勘本所质疑的段落，从马可福音的较长结尾，到约翰一书5:7中天上的三个见证——本文本将其置于方括号内，使徒行传8:37整节亦然。在本阅读器中，它独立存在。语料库没有为它记录母本，因此在它某节经文下打开的谱系之级会直接落到以≈标记的原文语言底层：旧约为列宁格勒抄本，新约为 Textus Receptus。这一底层与扬本人所据的文本相近，即马所拉希伯来文本与公认希腊文本，只是并非同一印本。也没有任何版本被记录为立于它之上。同样收于本语料库的2020年 Literal Standard Version 自称是对扬之译本的重大修订，但语料库并未记录这一联系，因此 LSV 下方的级不会通到这里。没有任何界面语言默认打开此版本；英文界面默认打开的是 New International Version，此版本须从翻译网格中它自己的卡片进入。

