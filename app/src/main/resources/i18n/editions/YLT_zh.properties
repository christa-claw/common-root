fact.2.label=译者
fact.2.value=罗伯特·扬（1822–1888），爱丁堡印刷商、书商、自学成才的语言学者，Analytical Concordance to the Bible 的编纂者
fact.3.label=旧约据
fact.3.value=通行的马所拉希伯来文本——本语料库中的[[WLC|列宁格勒抄本]]也属于这一传统
fact.4.label=新约据
fact.4.value=希腊文[[TR|公认文本]]（Textus Receptus）——扬写道，保留它“并非因为认为它完美”，而是因为翻译与经文鉴别是两项不同的工作
fact.5.label=翻译取向
fact.5.value=严格逐字：即使英语读来别扭，也保留原文时态，因此叙事常以现在时展开；尽可能以一个英文词对应原文的一个词，olam 与 aiōn 因而作“age”和“age-during”；为达意而补入的词置于方括号内；神名作“Jehovah”
fact.6.label=出版
fact.6.value=爱丁堡，1862年；扬本人修订，1887年；第三版，由其出版商再次修订，爱丁堡，1898年1月——即此处所收文本
fact.7.label=授权
fact.7.value=公共领域；本副本取自 eBible.org
fact.8.label=在本语料库中
fact.8.value=66卷，完整的新教正典，不含次经；采用英文章节编号，因此诗篇共150篇，每篇标题并入其第1节
fact.9.label=谱系
fact.9.value=无记录在案的母本，也没有记录在案立于其上的版本——级会直接打开在原文语言底层：旧约为[[WLC|列宁格勒抄本]]，新约为[[TR|公认文本]]；2020年的 [[LSV|Literal Standard Version]] 修订了扬的译本，但语料库未记录这一联系
