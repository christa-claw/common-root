title=ニュー・インターナショナル・バージョン — この版について | Common Root
description=ニュー・インターナショナル・バージョン：このリーダーが既定として開く英語の聖書であり、聖書翻訳委員会が原語から直接訳し、1978年に初めて完成した——ここに収めるのは2011年版の本文である。
heroHeading=ニュー・インターナショナル・バージョン
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=それはある教派の不満から始まった。1955年、実業家ハワード・ロングは牧師ピーター・デ・ヨングとともに、キリスト改革派教会に現代英語による聖書の制作を働きかけ、1957年、教会はこの構想を検討する委員会を承認した。全米福音派協会も同じ年に、独自の似た計画を始めていた。両団体は手を結び、合同委員会が1964年に翻訳会議への招待状を送った。会議は1965年8月、イリノイ州パロス・ハイツのトリニティ・クリスチャン・カレッジで開かれ、作業を進めるため「十五人からなる常任委員会」を設けることを決議した。この常任委員会が聖書翻訳委員会となった。1967年、ニューヨーク聖書協会——後にビブリカと名を改めた——が計画の運営を引き継ぎ、翻訳を行う学者たちを雇った。
hero.2=ここには、より古い英語聖書から下ってきたものは何もない。King James Version、Revised Version、American Standard Version、World English Bible がこの語料庫で改訂の一本の鎖をなすのに対し、ニュー・インターナショナル・バージョンはヘブライ語、アラム語、ギリシャ語から直接新たに訳された。旧約聖書はマソラ本文のヘブライ語から、死海文書や七十人訳その他の初期の証言も参照しつつ訳され、新約聖書は聖書協会世界連盟とネストレ・アーラントの版が代表する折衷的な校訂ギリシャ語本文から訳された——ここで[[GNV|ジュネーヴ聖書]]と[[KJV|キング・ジェイムズ・バージョン]]が拠って立つテクストゥス・レセプトゥスからではない。十五人の委員会は十年ほどのうちに、複数の英語圏の国々と多くの教派から百人を超える学者を頼る計画へと育った。彼らが掲げた目標は、原文の正確さを保ちながらも、それを一語一語そのまま写した文のようには読めない翻訳をつくることであり——この均衡は通常、動的等価（原文の意味を自然な表現で伝える方式）と分類され、厳密な逐語訳と緩やかな意訳の間に位置する。
hero.3=新約聖書が先に世に出た。1973年のことである。聖書全体は1978年10月27日にそれに続いた。軽い改訂が1984年にあった。本文はより大きく2011年に変わり、より包括的な改訂が1984年版と2005年のトゥデイズ・ニュー・インターナショナル・バージョンの両方に取って代わり、それ以来通用している一つの本文のために両者を退けた。この語料庫に収められているのは、この2011年の本文である——カタログの年表示と同じ年である。著作権は常にビブリカが保持し、合衆国ではゾンダーヴァンが、英国ではホッダー・アンド・ストートンが出版する。
hero.4=このリーダーにおけるその位置づけは、静かな意味で中心的である。インターフェースを英語に設定すれば、開くのはこの版である——この語料庫にある King James Version と Revised Version の頁自身が、自分はこれではないと述べ、ここを、たどり着く版ではなく切り替えて離れる版として指し示している。何も改訂しなかったため、語料庫はこれに母本を記録していない。ニュー・インターナショナル・バージョンの一節の下で系譜の段を開くと、≈ の印が付いた原語の底面へ直接下る。これは[[BSB|ベレアン・スタンダード聖書]]と同じだが、知っておくべき一つの違いがある。その底面のギリシャ語の証人はテクストゥス・レセプトゥスであり、テクストゥス・レセプトゥスはこの翻訳の新約聖書が実際に訳された本文ではない——その底面は一般的な「原語のギリシャ語」の代わりであり、この委員会自身の作業底本を記録したものではない。もう一つ、英語の隣人たちの大半と異なる点がある。これはライセンスされており、パブリックドメインではない。ニュー・アメリカン・スタンダード・バイブル2020と同じ地位であり、他方、ベレアン・スタンダード聖書、ジュネーヴ聖書、キング・ジェイムズ・バージョン、Revised Version、ワールド・イングリッシュ・バイブルはいずれも自由に複製できる。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=英語
fact.2.label=委嘱
fact.2.value=キリスト改革派教会と全米福音派協会の合同委員会により、1965年8月にイリノイ州パロス・ハイツのトリニティ・クリスチャン・カレッジで会議が招集された
fact.3.label=制作者
fact.3.value=聖書翻訳委員会——当初は十五人の学者であったが、やがて複数の英語圏の国々と多くの教派から百人を超える学者を数えるまでになった。期間はおよそ十年
fact.4.label=旧約の底本
fact.4.value=マソラ本文のヘブライ語。死海文書、七十人訳その他の初期の証言も参照された
fact.5.label=新約の底本
fact.5.value=聖書協会世界連盟とネストレ・アーラントの版が代表する折衷的な校訂ギリシャ語本文——ここで[[GNV|ジュネーヴ聖書]]と[[KJV|キング・ジェイムズ・バージョン]]が拠って立つ[[TR|テクストゥス・レセプトゥス]]ではない
fact.6.label=翻訳の方針
fact.6.value=逐語訳の正確さと自然で慣用的な英語との間で均衡を保ち、どちらの極にも偏らない——通常は動的等価と分類される。原語からの新訳であり、キング・ジェイムズの系譜の改訂ではない
fact.7.label=出版
fact.7.value=新約聖書は1973年、聖書全体は1978年10月27日、軽い改訂は1984年、より包括的に改訂された現行の本文は2011年——これが1984年版と2005年のトゥデイズ・ニュー・インターナショナル・バージョンの両方を退けた
fact.8.label=発行
fact.8.value=著作権を保持するビブリカ。合衆国ではゾンダーヴァン、英国ではホッダー・アンド・ストートンが発行
fact.9.label=ライセンス
fact.9.value=ライセンスされており、パブリックドメインではない。聖書の一書全体を成さず、作品全体の25%を超えない範囲であれば、著作権表示を付して500節まで無断で引用できる。それを超える利用にはビブリカの許可が必要
fact.10.label=このコーパスでは
fact.10.value=英語インターフェースが既定として開く聖書である——[[KJV|キング・ジェイムズ・バージョン]]と[[RV|リバイズド・バージョン]]の頁はここで、自分たちはこれではないと述べている。系譜の段には母本が記録されていない。NIVの一節の下で段を開くと≈の印が付いた原語の底面へ直接下る。これは[[BSB|ベレアン・スタンダード聖書]]と同じだが、その底面のギリシャ語の証人は[[TR|テクストゥス・レセプトゥス]]であり、この翻訳の新約聖書が実際に訳された本文ではない。パブリックドメインではなくライセンスされており、ニュー・アメリカン・スタンダード・バイブル2020と同じ地位にあるため、[[KJV|キング・ジェイムズ・バージョン]]、[[RV|リバイズド・バージョン]]、[[WEB|ワールド・イングリッシュ・バイブル]]のようなパブリックドメインの隣人たちとは一線を画す
