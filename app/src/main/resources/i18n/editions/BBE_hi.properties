title=Bible in Basic English — इस संस्करण के बारे में | Common Root
description=Bible in Basic English (बेसिक इंग्लिश में बाइबल), जिसका अनुवाद एस. एच. हूक के नेतृत्व में एक समिति ने इब्रानी और यूनानी से किया और जिसे Cambridge University Press ने प्रकाशित किया — नया नियम 1941 में, पूरी बाइबल 1949 में — सी. के. ऑग्डन की 850 शब्दों वाली बेसिक इंग्लिश में, जिसमें कविता और बाइबल के लिए 150 शब्द और जोड़े गए।
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=बेसिक इंग्लिश (Basic English) Orthological Institute के सी. के. ऑग्डन की रचना थी: 850 अंग्रेज़ी शब्दों की एक सूची, जिसे एक अंतरराष्ट्रीय सहायक भाषा के रूप में प्रस्तावित किया गया। Bible in Basic English को एस. एच. हूक (1874–1968) के निर्देशन में एक समिति ने Orthological Institute के सहयोग से तैयार किया; हूक पुराने नियम के विद्वान थे, जो 1930 में लंदन विश्वविद्यालय में पुराने नियम के अध्ययन के सैमुअल डेविडसन प्रोफ़ेसर बने। इसका अनुवाद इब्रानी और यूनानी से किया गया, किसी पुराने अंग्रेज़ी अनुवाद को सरल बनाकर नहीं, और फिर Cambridge University Press के सिंडिक्स द्वारा गठित एक समिति ने बेसिक पाठ को विस्तार से जाँचा। ऑग्डन के 850 शब्दों में अनुवादकों ने कविता में सहायक 100 शब्द और बाइबल के लिए आवश्यक 50 शब्द जोड़े, कुल 150। Cambridge University Press ने नया नियम 1941 में और पूरी बाइबल 1949 में प्रकाशित की; 1965 का एक मुद्रण संयुक्त राज्य अमेरिका में बिना कॉपीराइट सूचना के वितरित हुआ, और इसी कारण वहाँ यह पाठ सार्वजनिक अधिकार-क्षेत्र में है।
hero.2=परिणाम उस छोटे शब्द-भंडार के भीतर सरल और एकसार पढ़ा जाता है। उत्पत्ति “At the first God made the heaven and the earth.” से आरंभ होती है। भजन 23 “The Lord takes care of me as his sheep; I will not be without any good thing.” से आरंभ होता है। यूहन्ना रचित सुसमाचार “From the first he was the Word, and the Word was in relation with God and was God,” से खुलता है, और यूहन्ना 3:16 इस प्रकार है: “For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.” ईश्वर का नाम पूरे पाठ में “the Lord” है, सिवाय आठ आयतों के जिनमें यह “Yahweh” के रूप में दिया गया है; इनमें निर्गमन 6:3 है, जहाँ परमेश्वर कहता है कि अब्राहम, इसहाक और याकूब “had no knowledge of my name Yahweh”, और भजन 83:18। जहाँ इब्रानी अनुवाद के लिए बहुत अनिश्चित थी, वहाँ अनुवादकों ने उसके स्थान पर बिंदु रख दिए, और हमारी प्रति में कुछ आयतें, जिनमें अय्यूब 34:29–33 और अय्यूब 36:16–20 हैं, केवल “...” हैं।
hero.3=हमारी प्रति में उत्पत्ति से प्रकाशितवाक्य तक 66 पुस्तकें हैं, अपोक्रिफ़ा के बिना, King James और Revised Version के अध्याय और आयत क्रमांकन में — 150 भजन, और मलाकी जो अध्याय 4 पर समाप्त होती है। इसमें भजनों के शीर्षक नहीं हैं: भजन 51 “Have pity on me, O God” से आरंभ होता है। नया नियम स्वीकृत पाठ का अनुवाद नहीं है। सोलह आयतें जिन्हें आलोचनात्मक संस्करण छोड़ देते हैं, जिनमें मत्ती 17:21, प्रेरितों के काम 8:37 और रोमियों 16:24 हैं, यहाँ केवल [] से चिह्नित खाली स्थानों के रूप में रखी गई हैं, और 1 यूहन्ना 5:7 में स्वर्ग के तीन गवाह नहीं हैं; व्यभिचार में पकड़ी गई स्त्री की कथा, यूहन्ना 7:53–8:11, वर्ग कोष्ठकों में है, जबकि मरकुस का लंबा अंत बना रखा गया है। इस पाठक में यह अपने आप में खड़ी है। संग्रह इसके लिए कोई जनक दर्ज नहीं करता, इसलिए इसकी किसी आयत के नीचे खोला गया वंश-पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर गिरता है: पुराने नियम में लेनिनग्राद कोडेक्स और नए नियम में टेक्स्टस रिसेप्टस, एक यूनानी पाठ जिसका यह अनुवाद उन सोलह स्थानों पर अनुसरण नहीं करता। इस पर टिका हुआ भी कुछ दर्ज नहीं है। कोई अंतरफलक भाषा इस संस्करण पर नहीं खुलती; अंग्रेज़ी अंतरफलक New International Version पर खुलता है, और इस संस्करण तक अनुवाद-ग्रिड में इसके अपने कार्ड से पहुँचा जाता है।

