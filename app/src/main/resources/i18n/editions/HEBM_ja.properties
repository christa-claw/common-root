title=ヘブライ語聖書 — この版について | Common Root
description=ヘブライ語による聖書全体：マソラ本文の旧約聖書と、1877年のフランツ・デーリッチによる新約聖書——ミシュナー・ヘブライ語に訳し戻され、一つの言語で書物全体を求める読者のために作られた。
heroHeading=ヘブライ語聖書——マソラ本文旧約聖書とデーリッチ新約聖書
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=表紙から裏表紙まですべてヘブライ語である聖書は、聞こえるよりも奇妙なものである。なぜなら、その半分はもともとヘブライ語で書かれたのではないからだ。旧約聖書はヘブライ語であり、常にそうだった。新約聖書はギリシャ語で伝わった。したがって、この版のようなものは二種類の異なる本文が縫い合わされたものである——一つは原典であり、もう一つは通常とは逆方向に作られた翻訳、すなわちギリシャ語から、その著者たちの多くが実際に話していた言語へと戻された翻訳である。
hero.2=新約聖書の部分は、ライプツィヒのヘブライ語およびラビ文献の学者フランツ・デーリッチの仕事であり、1873年に英国外国聖書協会の委嘱を受け、1877年に完成した。彼は自分自身の時代のヘブライ語には訳さなかった。ミシュナーおよび第二神殿時代のヘブライ語で書いた。一世紀の文書は一世紀の文書らしく響くべきだという考えからである——その結果は、ヘブライ語への「訳」というより、ギリシャ語になる前の文がどうであったかを取り戻そうとする試みに近い読み物となっている。今なお、最もよく手に取られるヘブライ語新約聖書である。
hero.3=どのギリシャ語本文に拠るかは、彼自身の意志だけでは決まらなかった。彼は数十年前に発見されたばかりの四世紀の写本、シナイ写本から着手したが、公認本文からの出版を方針としていた聖書協会は、それに基づく版への資金提供を続けることを拒んだ。デーリッチはテクストゥス・レセプトゥスに立ち返り、重要なシナイ写本の読みは採用せず、注として記すにとどめた。本文はその後も十三年間、十版にわたって動き続け、最後の版はデーリッチが世を去った1890年、グスタフ・ダルマンの手で印刷に付された。この版の年がカタログで空欄になっている理由の一つはここにある——二つの半分は年を共有しておらず、年を持つ半分には十の年がある。
hero.4=この読書環境において、これはヘブライ語インターフェースが開く版である——アルファベット順の偶然ではなく、選び抜かれた既定である——そしてヘブライ語を選ぶと、インターフェース全体がこれを軸に右から左へと反転する。これはウェストミンスター・レニングラード写本と競い合うのではなく、その傍らに位置する。写本のほうは学術的なタナハであり、完全に母音点と朗唱記号を備え、旧約聖書が終わるところで終わる。対してこちらは平文の子音本文であり、黙示録まで続く。系譜の段には母本が記録されていないため、節の下で段を開くと直接原語の底面、≈ WLC と ≈ TR に至る。このコーパスの他の箇所では、その底面は近似にすぎず、≈ の印はまさにそれを警告している。ここではほとんどそうではない。画面上の旧約聖書はマソラ本文そのものであり、テクストゥス・レセプトゥスはデーリッチが実際に手にしていたものだからである。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=ヘブライ語——母音点も朗唱記号もない子音本文
fact.2.label=これは何か
fact.2.value=一冊の聖書として綴じられた二つの本文——伝統的なマソラ本文の旧約聖書と、19世紀にギリシャ語から訳されたヘブライ語新約聖書
fact.3.label=新約聖書の訳者
fact.3.value=フランツ・デーリッチ（1813–1890）、ライプツィヒのヘブライ語学者
fact.4.label=委嘱者
fact.4.value=1873年、英国外国聖書協会——翻訳は1877年に完成した
fact.5.label=旧約の底本
fact.5.value=マソラ本文のヘブライ語そのもの——翻訳ではなく、そのためこの版はここにある版の中で、旧約聖書がすでに原語のままである唯一の例となっている。[[WLC|ウェストミンスター・レニングラード写本]]がそうであるように
fact.6.label=新約の底本
fact.6.value=[[TR|テクストゥス・レセプトゥス]]のギリシャ語。デーリッチは代わりにシナイ写本から着手したが、聖書協会は公認本文からの出版を方針とし、その逸脱に資金を出そうとしなかった
fact.7.label=文体
fact.7.value=現代ヘブライ語ではない。デーリッチはミシュナーおよび第二神殿時代のヘブライ語で書き、ギリシャ語にその話者たちが用いたであろう語法を取り戻そうと試みた
fact.8.label=改訂の終期
fact.8.value=1890年、グスタフ・ダルマンの手で印刷に付された最後の版
fact.9.label=同じものと混同しないように
fact.9.value=イスラエル聖書協会が発行した現代ヘブライ語新約聖書——20世紀の別の翻訳であり、今なお著作権下にある
fact.10.label=カタログの年
fact.10.value=空欄——二つの半分は年を共有せず、新約聖書だけでも十三年、十版にわたって改訂された
fact.11.label=このコーパスでは
fact.11.value=66巻すべてを収め、ヘブライ語インターフェースの既定として選び抜かれている——リーダーは[[WLC|ウェストミンスター・レニングラード写本]]ではなくこちらを開く。こちらは新約聖書の終わりまで通して収めているからである
fact.12.label=音声
fact.12.value=聖書全体——新旧両約のすべての章——が、マイクロソフト・アジュール（Microsoft Azure）のニューラル音声he-IL-AvriNeuralによって読み上げられている。節ごとではなく章ごとに合成されており、散文が自然な文のリズムを保っている。
fact.13.label=音声の制限
fact.13.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
