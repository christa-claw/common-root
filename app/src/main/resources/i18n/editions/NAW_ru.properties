title=Сорок хадисов ан-Навави — Об этом издании | Common Root
description=Сорок хадисов ан-Навави: 42 хадиса, избранные имамом ан-Навави, каждый задуман как «великая основа» (ка'ида азыма) религии — самое читаемое произведение жанра сорока хадисов.
heroHeading=Сорок хадисов ан-Навави
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Яхья ибн Шараф ан-Навави родился в месяце мухаррам 631 года хиджры (октябрь 1233) в Наве, близ Дараа в Сирии, и в восемнадцать лет переехал в Дамаск для учёбы. В 665 году хиджры (1267) он был поставлен главой дамасской Дар аль-Хадис аль-Ашрафийя — должность, которую занимал до своей смерти в Наве в 676 году хиджры (1277), в середине своего пятого десятка; там он и был похоронен. Как правовед шафиитской школы, он написал за эту короткую жизнь множество трудов — среди прочих, Рийяд ас-Салихин, комментарий к Сахиху Муслима, известный как Аль-Минхадж, Аль-Маджму' Шарх аль-Мухаззаб, Минхадж ат-Талибин и Китаб аль-Азкар.
hero.2=«Аль-Арбаин ан-Нававийя» продолжает более древнюю традицию сборников «сорока хадисов» (арбаинийят), в основе которой лежит хадис, обещающий тому, кто сохранит для своей общины сорок хадисов о религии, место среди учёных в День Суда — хадис, который большинство критиков само относит к слабым (да'иф). Первый подобный сборник, ныне утраченный, приписывается Абдуллаху ибн аль-Мубараку (ум. 797); многие учёные впоследствии составили собственные. Ан-Навави отобрал хадисы, которые считал достоверными, в основном из [[BUK|Сахиха аль-Бухари]] и [[MUS|Сахиха Муслима]], каждый из которых иллюстрировал то, что он называл «великой основой» (ка'ида азыма) религии — и, несмотря на название, сборник в своём нынешнем виде содержит сорок два хадиса. Он стал самым читаемым примером этого жанра, получил десятки комментариев, самый известный из которых — «Джами аль-Улюм валь-Хикам» Ибн Раджаба аль-Ханбали, — и считается одним из самых читаемых произведений суннитского ислама после самого Корана.
hero.3=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-nawawi сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]], [[MUS|Сахиха Муслима]], [[ABD|Сунана Абу Дауда]], [[TIR|Джами ат-Тирмизи]], [[NAS|Сунана ан-Насаи]], [[IBM|Сунана Ибн Маджи]], [[MAL|Муватты Малика]] и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=Классический арабский, с английским переводом под каждым хадисом в читалке
fact.2.label=Составитель
fact.2.value=Яхья ибн Шараф ан-Навави (631–676 хиджры / 1233–1277)
fact.3.label=Название
fact.3.value=Известен как «Аль-Арбаин ан-Нававийя» («Сорок хадисов ан-Навави»); несмотря на название, сборник содержит сорок два хадиса
fact.4.label=Составлен
fact.4.value=В основном из [[BUK|Сахиха аль-Бухари]] и [[MUS|Сахиха Муслима]], в то время как ан-Навави возглавлял дамасскую Дар аль-Хадис аль-Ашрафийя (665 хиджры / 1267) до своей смерти в Наве, в Сирии, в 676 году хиджры (1277)
fact.5.label=Метод
fact.5.value=Каждый хадис избран как то, что ан-Навави называл «великой основой» (ка'ида азыма) религии; продолжает более древний жанр сорока хадисов (арбаинийят), первый известный, ныне утраченный пример которого приписывается Абдуллаху ибн аль-Мубараку (ум. 797)
fact.6.label=Положение
fact.6.value=Широко считается одним из самых читаемых произведений суннитского ислама после самого Корана; предмет десятков комментариев, самый известный — «Джами аль-Улюм валь-Хикам» Ибн Раджаба аль-Ханбали
fact.7.label=Число хадисов
fact.7.value=42, несмотря на название; исходное издание, на которое опирается это собрание, также даёт эту цифру
fact.8.label=В этом собрании
fact.8.value=1 книга и 42 пронумерованных хадиса
fact.9.label=Английский перевод
fact.9.value=Взят из издания eng-nawawi сервиса fawazahmed0/hadith-api, показан как сопровождение к арабскому тексту; из какого печатного перевода он происходит, со стороны этого собрания пока не подтверждено
fact.10.label=Лицензия
fact.10.value=Арабский матн — это классический текст, находящийся в общественном достоянии; лицензия английского перевода пока находится на проверке
