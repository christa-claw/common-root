title=Los cuarenta hadices qudsi — Acerca de esta edición | Common Root
description=Cuarenta hadices qudsi — dichos cuyo sentido, sostienen los musulmanes, viene de Dios, mientras su redacción, como la de cualquier otro hadiz, pasa por Mahoma — leídos aquí como volumen complementario a los cuarenta hadices de an-Nawawi.
heroHeading=Los cuarenta hadices qudsi
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Un hadiz qudsi (hadiz "sagrado" o "divino") se distingue de un hadiz ordinario por el origen que se atribuye a su significado: estudiosos como al-Jurjani lo describen como palabra de Dios expresada con las propias palabras de Mahoma, a diferencia del Corán, cuya redacción misma se considera de Dios. Esa distinción es de rango, no de solidez — un hadiz qudsi no necesita ser sahih (sólido); algunos así clasificados son da'if (débiles) o discutidos, juzgados con los mismos criterios de cadenas de transmisión que cualquier otro hadiz.
hero.2=Reunir cuarenta hadices qudsi sigue la misma vieja costumbre que [[NAW|los cuarenta hadices de an-Nawawi]] y el género más amplio de los "cuarenta hadices" (arba'iniyyat) al que pertenece, aunque aquí limitado a una sola categoría de hadiz en vez de al hadiz en general. Una edición inglesa muy difundida con este mismo título —seleccionada y traducida por Ezzeddin Ibrahim y Denys Johnson-Davies, quienes también hicieron la traducción complementaria de la colección de an-Nawawi— fue publicada por la Islamic Texts Society en 1997 como volumen bilingüe árabe-inglés, reuniendo sus cuarenta hadices de toda la literatura hadíz clásica. Si los cuarenta hadices que ofrece este corpus son esa misma selección, o un conjunto reunido de forma independiente y publicado bajo el mismo título tradicional, no se ha establecido por parte de este corpus.
hero.3=El texto árabe aquí es el matn clásico, considerado de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-qudsi de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]], el [[NAS|Sunan an-Nasa'i]], el [[IBM|Sunan Ibn Majah]], el [[MAL|Muwatta Malik]], los [[NAW|cuarenta hadices de an-Nawawi]] y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=Árabe clásico, con una traducción al inglés debajo de cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Sin un compilador clásico único; una edición inglesa publicada con este título fue seleccionada y traducida por Ezzeddin Ibrahim y Denys Johnson-Davies, que reunieron sus cuarenta hadices de toda la literatura hadíz clásica
fact.3.label=Título
fact.3.value=Hadiz qudsi — hadiz "sagrado" o "divino", cuyo sentido se considera venido de Dios aunque su redacción sea la propia de Mahoma, a diferencia del Corán
fact.4.label=Compilado
fact.4.value=Una antología tomada de la literatura hadíz más amplia y no un texto único continuo; la edición inglesa de Ibrahim/Johnson-Davies con este título se publicó en 1997
fact.5.label=Método
fact.5.value=Selección por clasificarse como qudsi, no por rango canónico; un hadiz qudsi no necesita ser sahih (sólido) — algunos así clasificados son da'if (débiles) o discutidos
fact.6.label=Posición
fact.6.value=Una antología entre varias que llevan este título, dentro de la misma tradición de cuarenta hadices (arba'iniyyat) que [[NAW|los cuarenta hadices de an-Nawawi]]
fact.7.label=Número de hadices
fact.7.value=40
fact.8.label=En este corpus
fact.8.value=1 libro y 40 hadices numerados
fact.9.label=Traducción al inglés
fact.9.value=Tomada de la edición eng-qudsi de fawazahmed0/hadith-api, mostrada como acompañamiento del árabe; si procede de la traducción de Ibrahim/Johnson-Davies o de una independiente no está confirmado por parte de este corpus
fact.10.label=Licencia
fact.10.value=El matn árabe es el texto clásico, considerado de dominio público; la licencia de la traducción al inglés sigue en revisión
