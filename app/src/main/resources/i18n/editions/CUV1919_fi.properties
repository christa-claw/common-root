title=Kiinan yhdistetty käännös, vuoden 1919 teksti — Tietoja tästä laitoksesta | Common Root
description=Kiinan yhdistetty käännös sellaisena kuin se julkaistiin ensimmäisen kerran 1919, vanhoilla merkkimuodoilla ja alkuperäisellä välimerkityksellä, Kiinan Wikilähteen litteroimana, alaviitteineen.
heroHeading=Kiinan yhdistetty käännös — vuoden 1919 teksti
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Tämä on [[CUV|Kiinan yhdistetty käännös]] sellaisena kuin se painettiin 1919: mandariinikielinen Raamattu, jota lähetyssaarnaajat ja kiinalaiset oppineet työstivät kahdenkymmenenyhdeksän vuoden ajan ja joka kirjattiin sen vuoden kirjoitusasuun. Tämän lukijan toinen yhdistetty käännös on teksti sellaisena kuin sitä luetaan nykyään, nykyaikaisin välimerkein ja nykyaikaisin merkkivalinnoin. Tämä säilyttää vuoden 1919 sivun.
hero.2=Erot näkyvät kirjoitusmerkeissä. Vuoden 1919 teksti käyttää muotoja, jotka myöhemmät painokset hylkäsivät — 爲, missä nykypainoksissa on 為, sekä 愼, 册, 槪 — ja se on painettu kokonaan perinteisin merkein. Sen välimerkitys on sellaisena kuin se on litteroitu vuoden 1919 painoksesta, ei myöhempien laitosten nykyaikaista välimerkitystä. Missä vuoden 1919 kirja painoi peräkkäiset jakeet yhtenä jaksona, tämä laitos tekee samoin: jaenumerointi säilyy, ja teksti sijoittuu jakson ensimmäiseen jakeeseen.
hero.3=Teksti on peräisin Kiinan Wikilähteen tekemästä litteroinnista, ja se on Shen-laitos (神版), jossa Jumala on 神, ei 上帝. Vuoden 1919 kirjan alaviitteet on säilytetty, ja ne näkyvät tässä lukijassa niiden jakeiden huomautuksina, joihin ne kuuluvat.
hero.4=Se lisättiin, jotta kiinalainen Raamattu voitaisiin painaa tekstistä, jonka ajankohta ja alkuperä tunnetaan. Vuoden 1919 painos on jo kauan sitten vapautunut tekijänoikeudesta. Sitä seuranneet, vuodesta 1988 alkaneet pisteytetyt tekstit ovat eri kysymys, ja siksi ne pidetään erillään.

