fact.2.label=المترجم
fact.2.value=روبرت يونغ (1822–1888)، طابع وبائع كتب ولغوي عصامي من إدنبرة، جامع Analytical Concordance to the Bible
fact.3.label=العهد القديم عن
fact.3.value=النص العبري الماسوري المتلقّى — التقليد الذي تنتمي إليه أيضًا [[WLC|مخطوطة لينينغراد]] في هذه المجموعة
fact.4.label=العهد الجديد عن
fact.4.value=[[TR|النص اليوناني المتلقّى]]، Textus Receptus — أبقاه يونغ، كما كتب، «لا لأنه يُعَدّ كاملًا»، بل لأن الترجمة ونقد النصوص مهمتان منفصلتان
fact.5.label=نوع الترجمة
fact.5.value=حرفية صارمة: أزمنة الأصل محفوظة حتى حيث تبدو الإنجليزية غريبة، فيجري السرد كثيرًا في المضارع؛ كلمة إنجليزية واحدة لكل كلمة في الأصل ما أمكن، فتصير olam وaiōn «age» و«age-during»؛ والكلمات المضافة لأجل المعنى بين معقوفين؛ والاسم الإلهي بصيغة «Jehovah»
fact.6.label=نُشر
fact.6.value=إدنبرة، 1862؛ نقّحها يونغ، 1887؛ الطبعة الثالثة، نقّحها ناشروه من جديد، إدنبرة، يناير 1898 — وهي النص الموجود هنا
fact.7.label=الترخيص
fact.7.value=ملك عام؛ وهذه النسخة من eBible.org
fact.8.label=في هذه المجموعة
fact.8.value=66 سفرًا، القانون البروتستانتي كاملًا، من غير الأسفار القانونية الثانية؛ بترقيم الأصحاحات والآيات الإنجليزي، فعدد المزامير 150، وعنوان كل مزمور مدمج في آيته الأولى
fact.9.label=النسب
fact.9.value=لا أصل مسجَّل، ولا شيء مسجَّل على أنه قائم عليها — تُفتح الدرجة مباشرة على أرضية اللغات الأصلية، [[WLC|مخطوطة لينينغراد]] في العهد القديم و[[TR|النص المتلقّى]] في العهد الجديد؛ و[[LSV|Literal Standard Version]] الصادرة عام 2020 تنقّح عمل يونغ، لكن المجموعة لا تسجّل هذه الصلة
