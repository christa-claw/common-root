title=Young's Literal Translation — عن هذه الطبعة | Common Root
description=الترجمة الحرفية للكتاب المقدس التي وضعها روبرت يونغ، نُشرت أول مرة في إدنبرة عام 1862، ونقّحها يونغ نفسه عام 1887 ثم ناشروه عام 1898 — كتاب مقدس إنجليزي يحفظ أزمنة العبرية واليونانية وترتيب كلماتهما، وما استطاع من مفرداتهما، حتى حيث تكاد الإنجليزية لا تجاريهما.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=كان روبرت يونغ (1822–1888) طابعًا وبائع كتب في إدنبرة. علّم نفسه العبرية وعدة لغات شرقية أخرى في أثناء تدرّبه على الطباعة، وأدار مطبعة إرسالية في سورات بالهند من 1856 إلى 1861، ويُذكر قبل كل شيء بكتابين: فهرس الألفاظ Analytical Concordance to the Bible وهذه الترجمة. نشر Literal Translation في إدنبرة عام 1862، وطبعة منقّحة عام 1887. وبعد وفاته بعشر سنين، في يناير 1898، أصدر ناشروه طبعة ثالثة نُقّحت مرة أخرى «على خطوطها القائمة»؛ وهذا هو النص الذي في هذه المجموعة. ترجم يونغ العهد القديم عن النص العبري الماسوري المتلقّى، والعهد الجديد عن النص اليوناني المتلقّى، Textus Receptus، وقال صراحة إنه لن يحاول وضع نص جديد لأيٍّ منهما: فالترجمة، كما كتب، مهمة غير مهمة نقد النصوص، وقليلون هم المؤهَّلون للاثنتين.
hero.2=الغاية كلها أن يرى القارئ الإنجليزي قواعد الأصل. كان يونغ يرى أن الترجمة التي تضع المضارع حيث يضع الأصل الماضي، أو «an a for a the»، أداة نكرة مكان أداة التعريف، تُسقط الوحي اللفظي من حسابها، فترجم على هذا الأساس. تنتقل صيغ الفعل العبرية أزمنةً إنجليزية، فيجري السرد كثيرًا في المضارع: يبدأ سفر التكوين بعبارة «In the beginning of God's preparing the heavens and the earth —» ويمضي «and God saith, ‘Let light be;’ and light is.» والكلمات المضافة لأجل المعنى موضوعة بين معقوفين: «Jehovah [is] my shepherd, I do not lack.» وحاول أن يعطي كل كلمة عبرية أو يونانية مقابلًا إنجليزيًا واحدًا حيثما استطاع، ولذلك تصير الكلمة العبرية olam واليونانية aiōn «age» و«age-during» بدل «ever» و«eternal»؛ وفي متى 25:46 يمضي الأبرار «to life age-during». ويرد الاسم الإلهي في العهد القديم كله بصيغة «Jehovah».
hero.3=نسختنا كاملة: 66 سفرًا من التكوين إلى الرؤيا، من غير الأسفار القانونية الثانية، بترقيم الأصحاحات والآيات الإنجليزي — 150 مزمورًا أُدمج عنوان كل منها في آيته الأولى، وملاخي ينتهي عند الأصحاح 4. ولأنها ترجمة للنص المتلقّى فإنها تحمل المقاطع التي تشكّك فيها الطبعات النقدية اللاحقة، من الخاتمة الطويلة لإنجيل مرقس إلى الشهود الثلاثة في السماء في 1 يوحنا 5:7، الذين يضعهم هذا النص بين معقوفين، كما يفعل بأعمال الرسل 8:37 كلها. وهي في هذا القارئ قائمة بذاتها. فالمجموعة لا تسجّل لها أصلًا، ولذا فإن درجة نسب تُفتح تحت إحدى آياتها تسقط مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈: مخطوطة لينينغراد في العهد القديم، وTextus Receptus في العهد الجديد. وهذه الأرضية قريبة مما ترجم عنه يونغ نفسه، العبرية الماسورية واليونانية المتلقّاة، وإن لم تكن في الطبعات نفسها. ولا شيء مسجَّل أيضًا على أنه قائم عليها. أما Literal Standard Version الصادرة عام 2020، وهي أيضًا في هذه المجموعة، فتقدّم نفسها مراجعةً كبرى لعمل يونغ، لكن المجموعة لا تسجّل هذه الصلة، فلا تقود الدرجات تحت LSV إلى هنا. ولا تُفتح على هذه الطبعة أي لغة من لغات الواجهة؛ فالواجهة الإنجليزية تُفتح على New International Version، ويُوصل إلى هذه الطبعة من بطاقتها الخاصة في شبكة الترجمات.

