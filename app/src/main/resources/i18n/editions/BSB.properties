title=Berean Standard Bible — About This Edition | Common Root
description=The Berean Standard Bible: a modern English translation made by the Bible Hub and Discovery Bible teams from the Masoretic Hebrew and a Greek New Testament they edited themselves, and then given away into the public domain.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=The Berean Standard Bible is one of the newest translations in this collection and one of the most open about its own workings. It was made by the teams behind Bible Hub and Discovery Bible, working under an advisory committee, and it first appeared under a different name — the Berean Study Bible. That caused steady confusion, because a study Bible normally means a Bible padded out with commentary and notes, which this is not. The translation was renamed; the abbreviation stayed.
hero.2=Most translations begin from a Greek New Testament somebody else edited. This project built its own first. The Berean Greek Bible takes Nestle 1904 as its base — chosen, its editors say, because it is the most accurate critical text already in the public domain — and collates it against Nestle–Aland, the SBL Greek New Testament, Tischendorf, Westcott–Hort, the Byzantine text and the Textus Receptus, footnoting where they part company. The English was translated from that. The Old Testament comes from the Masoretic Hebrew, with the Dead Sea Scrolls, the Septuagint and other early witnesses consulted where they bear on a reading. The same work was then published in layers: a word-for-word interlinear, a stiffly literal edition, and this readable one, so a reader can walk from the Greek to the English a step at a time instead of taking the translators' word for it. It also puts the Berean on the far side of a divide this corpus makes visible: the Geneva Bible and the King James Version here descend from the Textus Receptus, and this does not.
hero.3=The last thing the project did with the text was give it away. The Berean texts were dedicated to the public domain in April 2023, which is why the whole Bible can sit in this corpus and be copied back out of it. Set the reader's interface to English and what opens is the New International Version, which is here under licence; the Berean is the modern English beside it that anyone may quote, print and redistribute. In the lineage rungs it behaves like the Biblia en Español Sencillo. No parent is recorded for it, because it is a fresh translation rather than a revision of anything the corpus holds, so opening a rung beneath a Berean verse goes straight to the original-language floor marked with ≈ rather than to an older English Bible. The catalogue also leaves its year blank. That is not an oversight — the text is still revised as corrections come in, and the years here are curated rather than guessed, so an edition with no single dated printing gets no date.

