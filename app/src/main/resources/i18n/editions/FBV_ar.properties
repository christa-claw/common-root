title=Free Bible Version — عن هذه الطبعة | Common Root
description=Free Bible Version: كتاب مقدس إنجليزي حديث نقله جوناثان غالاغر عن العبرية وعن يونانية نستله–آلاند، ونُشر برخصة المشاركة بالمثل حتى يجوز لأي أحد أن يعيد طبعه.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=هذه الترجمة موجودة بسبب صفحة حقوق. تكاد كل نسخة إنجليزية حديثة تحمل واحدة، وما تقوله عادةً أن بضع مئات من الآيات يجوز اقتباسها دون استئذان، وأن سفرًا كاملًا يستلزم إذنًا خطيًا، وأن نشر النص بتمامه يعني دفع عوائد. أما موقع كنيسة أو تسجيل صوتي فقد ينتهي عنده الأمر. وقد صُنعت Free Bible Version لتكون الطبعة التي لا يقف أمامها شيء.
hero.2=هي عمل جوناثان غالاغر، الحائز درجة الدكتوراه في اللاهوت من سانت أندروز، وتصدرها Free Bible Ministry، وهي جهة لا تبتغي الربح. العهد الجديد منقول عن يونانية نستله–آلاند — النص النقدي الذي تستعمله جمعيات الكتاب المقدس — والعهد القديم عن العبرية. والطريقة التي يصفها المشروع جديرة بأن تُذكر لأنها ليست المعتادة: يُنقل النص عن أصله بالمعاجم وحدها، ثم يُقابَل بعد ذلك بالطبعات القائمة، مقابلةَ تدقيق تحرزًا من التكرار والخطأ لا استمدادًا منها. فهي ليست تنقيحًا لكتاب إنجليزي أقدم ولا خلاصةً لأحدث منه. وغايتها المعلنة إنجليزية معاصرة تتجنب العامية والعبارات الدارجة، وهي تأبى أن تترجم في اتجاه مقولات طائفة إيمانية بعينها.
hero.3=الرخصة هي بيت القصيد. إنها Creative Commons نسب المصنف-المشاركة بالمثل 4.0: انسخها واطبعها وضعها على موقع وعدّلها، ما دامت الطبعة مسمّاة والتغييرات مبيّنة وما يُبنى عليها يخرج بالشروط نفسها. وهذا اتفاق غير الملكية العامة — فالحرية تُمرَّر لا تُتنازل عنها — وهي الرخصة نفسها التي تحملها Versión Biblia Libre الإسبانية في هذه المجموعة، وهي من الخدمة نفسها.
hero.4=ويتبع ذلك أمران للقارئ. يترك الفهرس سنتها فارغة، لأن المشروع ينشر تنقيحاته أولًا بأول؛ فليست ثمة طبعة مؤرخة تُشدّ إليها هذه المجموعة، واختلاق واحدة شرٌّ من الفراغ. ثم إن درجة تُفتح تحت آية من Free Bible Version تُظهر ≈ TR، أي النص المتلقَّى، موسومًا شاهدًا لا أصلًا. وليس عنه نُقلت هذه الترجمة. بل هو ما تستطيع المجموعة أن تقدمه اليوم يونانيةً — إذ لا طبعة نقدية فيها بعد — والبديل نفسه يظهر للسبب نفسه تحت New International Version وNew American Standard Bible وBerean Standard Bible.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الإنجليزية — أميركية معاصرة
fact.2.label=المترجم
fact.2.value=جوناثان غالاغر، ودرجته في اللاهوت من جامعة سانت أندروز
fact.3.label=الناشر
fact.3.value=Free Bible Ministry، جهة لا تبتغي الربح، وهي التي تصدر أيضًا [[VBL|Versión Biblia Libre]] الإسبانية المحفوظة في هذه المجموعة
fact.4.label=منقولة عن
fact.4.value=العبرية، والعهد الجديد اليوناني لنستله–آلاند — النص النقدي الذي تستعمله جمعيات الكتاب المقدس
fact.5.label=الطريقة
fact.5.value=نُقلت عن النص الأصلي بعون المعاجم وحدها، ثم قوبلت بالطبعات القائمة تدقيقًا — لا خلاصةً منها ولا تنقيحًا لكتاب إنجليزي أقدم
fact.6.label=الأسلوب
fact.6.value=إنجليزية حديثة بلا عامية ولا دارجة عابرة، ودون محاولة لتصوير مقولات طائفة إيمانية بعينها
fact.7.label=الترخيص
fact.7.value=Creative Commons نسب المصنف-المشاركة بالمثل 4.0 — انسخ واطبع وعدّل بحرية، بشرط تسمية الطبعة وبيان التغييرات وحمل المشتق للرخصة نفسها
fact.8.label=السنة في الفهرس
fact.8.value=تُركت فارغة بدل أن تُخمَّن — فالمشروع ينقّح النص ويعيد نشره أولًا بأول، فما من طبعة واحدة هي الطبعة
fact.9.label=تحت درجة
fact.9.value=≈ TR، شاهد على اليونانية لا أصل هذه الترجمة؛ وليس في المجموعة بعدُ طبعة يونانية نقدية، فالبديل نفسه يخدم [[NIV|NIV]] و[[NASB|NASB]] و[[BSB|BSB]]
fact.10.label=في هذه المجموعة
fact.10.value=الأسفار الـ66 كلها. والإنجليزية تُفتح على [[NIV|New International Version]] المرخّصة، فتقف هذه إلى جانب [[BSB|Berean Standard Bible]] و[[WEB|World English Bible]] بوصفها الإنجليزية التي يجوز للقارئ أن يحملها معه خارجًا
