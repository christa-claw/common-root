title=リヴェドゥータ訳聖書1927年（イタリア語） — この版について | Common Root
description=リヴェドゥータ訳：ジョヴァンニ・ディオダティのイタリア語聖書を、ワルド派の神学者ジョヴァンニ・ルッツィ率いる委員会がヘブライ語とギリシャ語に照らして改訂し、1924年に英国内外聖書協会がローマで刊行したもの——そしてファイルがなぜ1927年としているのか。
heroHeading=リヴェドゥータ訳聖書1927年
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=ジョヴァンニ・ルッツィは1856年、スイスのグラウビュンデン州の下エンガディンに生まれ、翌年一家がルッカへ移住したとき、乳飲み子としてそこへ連れて行かれた。彼はイタリア人として育ち、フィレンツェのワルド派神学部——イタリアの古いプロテスタント教会の学校——に学び、のちにそこで神学を教え、同市で牧師も務めた。晩年は再びスイスのポスキアーヴォで過ごし、1948年にその地で没した。
hero.2=リヴェドゥータ訳は1906年に始まった。ディオダティの17世紀の翻訳を1世紀にわたってイタリアの読者のために印刷してきた英国内外聖書協会が、その改訂を一団に委ね、ルッツィをその長に据えたのである。彼はこれをカトリックの学者との共同の聖書にしたいと望んでいたが、ヴァチカンが拒み、作業はプロテスタントの改訂として進められた。聖書全巻は1924年にローマで刊行され、扉には原典に照らして改訂された版と記された——「riveduta」、すなわち「改訂された」であり、以来この名で知られている。これは新しい翻訳ではない。土台にはディオダティの本文があり、ヘブライ語とギリシャ語に改めて照合されている。20世紀の大半を通じてイタリアのプロテスタントの聖書であり続け、その後継であるヌオーヴァ・リヴェドゥータ（Nuova Riveduta）は1994年にジュネーヴ聖書協会から出版された。ルッツィはこれとは別に、注解付きの個人訳を12巻で著し、1921年からフィレンツェで刊行した。それは別の著作であり、この本文ではない。
hero.3=改訂はページの上に現れている。旧約の神名は「l'Eterno」、すなわち「永遠なる者」であり——詩編23編は「L'Eterno è il mio pastore」——ディオダティが「il Signore」とするところである。イザヤ書7:14は「la giovane」（若い女）と読み、ディオダティは「la Vergine」（処女）とする。新約では、後の校訂本がテクストゥス・レセプトゥスを離れる箇所でこれも離れる。ヨハネの手紙一5:7には天の証人がなく、マタイによる福音書6:13の主の祈りは頌栄なしで終わり、使徒言行録8:37は残されているが角括弧に入れられている。詩編はヘブライ語の番号付けに従い、詩編の表題は第1節に組み込まれている——詩編23編は「Salmo di Davide.」で始まる——ので、詩編51編は英語の聖書と同じく19節である。年について言えば、1927はデジタル本文が帯び、カタログが保持している年であり、そのためこの版の段のチップは1927と表示する。リヴェドゥータ訳そのものは1924年に刊行されたもので、このファイルが後のどの刷りを再現しているかは、本プロジェクトでは確定していない。
hero.4=この読書環境において、これはディオダティ訳の2つの写しと並ぶ3つのイタリア語聖書の一つである。イタリア語のインターフェースはこれを開かない。イタリア語には選定された既定の版がないため、読書環境はカタログ順で最初のイタリア語聖書を取り、それはディオダティ1649だからである。系譜の段にはこの版の母本が記録されていない——リヴェドゥータ訳はディオダティ訳の改訂であり、ディオダティ訳もこのコーパスにあるのに、ディオダティさえ記録されていない——ため、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る。旧約ではウェストミンスター・レニングラード写本、新約ではテクストゥス・レセプトゥスであり、後者はまさにこの改訂が離れていったギリシャ語である。

