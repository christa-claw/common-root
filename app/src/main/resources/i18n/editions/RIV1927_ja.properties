fact.1.label=言語
fact.1.value=イタリア語
fact.2.label=改訂者
fact.2.value=ジョヴァンニ・ルッツィ（1856–1948）。ワルド派の神学者で、改訂委員会の長
fact.3.label=委嘱者
fact.3.value=英国内外聖書協会。1906年に改訂を発足させた
fact.4.label=刊行
fact.4.value=聖書全巻、ローマ、1924年、英国内外聖書協会
fact.5.label=改訂の元
fact.5.value=[[DIO|ジョヴァンニ・ディオダティの聖書]]（1607年、本人により1641年に改訂）。ヘブライ語とギリシャ語に改めて照合されている
fact.6.label=ラベルが1927年である理由
fact.6.value=1927はデジタル本文が帯びている年である。リヴェドゥータ訳の初版は1924年で、ファイルがどの刷りを再現しているかは確定していない
fact.7.label=神名
fact.7.value=「l'Eterno」——永遠なる者——旧約全体を通じて。ディオダティは「il Signore」とする
fact.8.label=後の改訂版
fact.8.value=ヌオーヴァ・リヴェドゥータ、ジュネーヴ聖書協会、1994年
fact.9.label=混同しやすいもの
fact.9.value=ルッツィ自身の注解付き翻訳。12巻、フィレンツェ、1921年から——別の著作
fact.10.label=内容
fact.10.value=66巻——プロテスタント正典、第二正典なし。詩編はヘブライ語の番号付けで、各表題は第1節に組み込まれている
fact.11.label=ライセンス
fact.11.value=パブリックドメイン。このコピーは eBible.org から
fact.12.label=このコーパスでは
fact.12.value=[[DIO|ディオダティ1649]]、[[DIO1885|ディオダティ1885]]と並ぶ3つのイタリア語聖書の一つ。イタリア語のインターフェースが開くのはディオダティ1649で、これではない。系譜の段には母本が記録されておらず、その段のチップは1927と表示される
