title=Reina Valera 1909 — Su questa edizione | Common Root
description=Reina-Valera 1909: la revisione che portò nel Novecento lo spagnolo di Casiodoro de Reina del 1569, quale Cipriano de Valera lo aveva riveduto nel 1602, e l'edizione su cui questo lettore si apre per lo spagnolo.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=La Bibbia protestante spagnola è, in misura poco comune, un libro solo. Casiodoro de Reina, uscito di Spagna davanti all'Inquisizione, compì la sua traduzione in esilio e la pubblicò a Basilea nel 1569: la Biblia del Oso, così detta dall'orso del frontespizio. Cipriano de Valera, che era stato nel medesimo monastero fuori Siviglia e aveva fatto la medesima fuga, la ripassò per anni e ne pubblicò il frutto ad Amsterdam nel 1602, la Biblia del Cántaro. Ogni Reina-Valera successiva è la revisione di una revisione di quella, ed è per questo che un nome col trattino ricorda due uomini che non lavorarono mai nella stessa stanza.
hero.2=Questa è la revisione del 1909, preparata sotto la Società biblica britannica e forestiera insieme alla Società biblica americana, e chiamata di solito Versión Antigua — la versione antica — da chi continuò a servirsene. Venne dopo una revisione anteriore, quella del 1862, ed è prudente proprio in ciò che le revisioni sogliono mutare: la lettera è portata avanti dove Reina e Valera erano divenuti difficili da seguire, e lasciata stare dove non lo erano. L'Antico Testamento posa sull'ebraico masoretico e il Nuovo sul Textus Receptus, come posava quello di Reina.
hero.3=Tenne quasi per sé il mondo protestante di lingua spagnola per una cinquantina d'anni, finché la revisione del 1960 non la soppiantò, e non è mai scomparsa del tutto. È libera da diritti, cosa che quella del 1960 non è, sicché è questa la Reina-Valera che si stampa, si mette in rete e si cita senza il permesso di nessuno. Ed è anche per questo che il testo intero può stare in questo corpus e tornare a copiarsene fuori.
hero.4=In questo lettore lo spagnolo ha cinque Bibbie, ed è su questa che l'interfaccia si apre. È una scelta curata e non un caso del catalogo: a differenza dell'arabo o del cinese, dove il lettore si apre sull'unica Bibbia che nella lingua esista, lo spagnolo ha alternative e questa fu presa fra loro. Nei pioli della discendenza non le è registrato alcun testo base, sicché un piolo aperto sotto un versetto cade diritto sul pavimento delle lingue originali contrassegnato con ≈. Il pavimento coglie qui più da vicino del solito, per la stessa ragione che nella Bibbia araba: il greco che offre è il Textus Receptus, e dal Textus Receptus fu fatto il Nuovo Testamento di Reina.

