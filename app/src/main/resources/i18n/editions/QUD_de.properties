title=Die vierzig Hadith Qudsi — Über diese Ausgabe | Common Root
description=Vierzig Hadith Qudsi — Aussprüche, deren Bedeutung nach muslimischer Auffassung von Gott stammt, während ihr Wortlaut wie bei jedem anderen Hadith durch Muhammad überliefert ist — hier als Begleitband zu den vierzig Hadithen des an-Nawawi gelesen.
heroHeading=Die vierzig Hadith Qudsi
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Ein Hadith Qudsi ("heiliger" oder "göttlicher" Hadith) unterscheidet sich von einem gewöhnlichen Hadith durch die Herkunft seiner Bedeutung: Gelehrte wie al-Jurjani beschreiben ihn als die Worte Gottes, ausgedrückt in Muhammads eigenem Wortlaut — im Gegensatz zum Koran, dessen Wortlaut selbst als Gottes Wort gilt. Dieser Unterschied betrifft den Rang, nicht die Zuverlässigkeit — ein Hadith Qudsi muss nicht sahih (gesichert) sein; manche so eingestuften gelten als da'if (schwach) oder umstritten und werden nach denselben Kriterien der Überliefererketten beurteilt wie jeder andere Hadith.
hero.2=Das Zusammenstellen von vierzig Hadith Qudsi folgt derselben alten Gewohnheit wie [[NAW|die vierzig Hadithe des an-Nawawi]] und die weitere Vierzig-Hadith-Gattung (arba'iniyyat), zu der sie gehört, hier aber auf eine einzige Hadith-Kategorie statt auf Hadithe im Allgemeinen beschränkt. Eine weit verbreitete englische Ausgabe genau unter diesem Titel — ausgewählt und übersetzt von Ezzeddin Ibrahim und Denys Johnson-Davies, die auch die Begleitübersetzung an-Nawawis Sammlung verfassten — erschien 1997 bei der Islamic Texts Society als zweisprachiger arabisch-englischer Band, dessen vierzig Hadithe aus der gesamten klassischen Hadith-Literatur stammen. Ob die vierzig in diesem Korpus gebotenen Hadithe genau diese Auswahl sind oder eine unabhängig zusammengestellte Sammlung unter demselben traditionellen Titel, ist von Seiten dieses Korpus nicht geklärt.
hero.3=Der arabische Text hier ist der klassische Matn und gilt als gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-qudsi-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]], [[NAW|die vierzig Hadithe des an-Nawawi]] und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=Klassisches Arabisch, mit einer englischen Übersetzung unter jedem Hadith im Reader
fact.2.label=Zusammengestellt von
fact.2.value=Kein einzelner klassischer Verfasser; eine veröffentlichte englische Ausgabe unter diesem Titel wurde von Ezzeddin Ibrahim und Denys Johnson-Davies ausgewählt und übersetzt, die ihre vierzig Hadithe aus der gesamten klassischen Hadith-Literatur zusammenstellten
fact.3.label=Titel
fact.3.value=Hadith Qudsi — "heiliger" oder "göttlicher" Hadith, dessen Bedeutung als von Gott stammend gilt, während sein Wortlaut, anders als beim Koran, Muhammads eigener ist
fact.4.label=Zusammengestellt
fact.4.value=Eine Anthologie aus der weiteren Hadith-Literatur statt eines einzelnen fortlaufenden Textes; die englische Ausgabe von Ibrahim/Johnson-Davies unter diesem Titel erschien 1997
fact.5.label=Methode
fact.5.value=Auswahl nach Einstufung als qudsi, nicht nach kanonischem Rang; ein Hadith Qudsi muss nicht sahih (gesichert) sein — manche so eingestuften gelten als da'if (schwach) oder umstritten
fact.6.label=Stellung
fact.6.value=Eine von mehreren Anthologien unter diesem Titel, in derselben langen Vierzig-Hadith-Tradition (arba'iniyyat) wie [[NAW|die vierzig Hadithe des an-Nawawi]]
fact.7.label=Hadith-Anzahl
fact.7.value=40
fact.8.label=In diesem Korpus
fact.8.value=1 Buch und 40 numerierte Hadithe
fact.9.label=Englische Übersetzung
fact.9.value=Entnommen der eng-qudsi-Ausgabe der fawazahmed0/hadith-api, als Begleittext zum Arabischen gezeigt; ob sie von der Übersetzung Ibrahim/Johnson-Davies oder einer unabhängigen Übersetzung abstammt, ist von Seiten dieses Korpus nicht bestätigt
fact.10.label=Lizenz
fact.10.value=Der arabische Matn ist der klassische, als gemeinfrei geltende Text; die Lizenz der englischen Übersetzung ist noch in Prüfung
