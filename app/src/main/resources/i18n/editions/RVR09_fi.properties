title=Reina Valera 1909 — Tietoa tästä laitoksesta | Common Root
description=Reina-Valera 1909: tarkistus, joka kantoi Casiodoro de Reinan vuoden 1569 espanjan — sellaisena kuin Cipriano de Valera oli sen vuonna 1602 tarkistanut — 1900-luvulle, ja laitos, jonka tämä lukuohjelma avaa espanjalle.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=Espanjankielinen protestanttinen Raamattu on epätavallisen suuressa määrin yksi ainoa kirja. Casiodoro de Reina, joka oli lähtenyt Espanjasta inkvisitiota pakoon, sai käännöksensä valmiiksi maanpaossa ja julkaisi sen Baselissa vuonna 1569 — Biblia del Oso, nimensä nimiölehden karhusta saanut. Cipriano de Valera, joka oli ollut samassa Sevillan ulkopuolisessa luostarissa ja tehnyt saman paon, kävi sitä vuosikausia läpi ja julkaisi tuloksen Amsterdamissa vuonna 1602, Biblia del Cántaron. Jokainen sen jälkeinen Reina-Valera on tuon tarkistuksen tarkistuksen tarkistus, ja siksi yhdysviivainen nimi muistaa kahta miestä, jotka eivät koskaan työskennelleet samassa huoneessa.
hero.2=Tämä on vuoden 1909 tarkistus, joka valmisteltiin Britannian ja ulkomaan raamattuseuran sekä Amerikan raamattuseuran alaisuudessa ja jota sen käyttäjät yleensä kutsuvat nimellä Versión Antigua, vanha laitos. Sitä edelsi vuoden 1862 tarkistus, ja se on varovainen juuri siinä, mitä tarkistukset tavallisesti muuttavat: sanamuotoa tuodaan eteenpäin siellä, missä Reina ja Valera olivat käyneet vaikeiksi seurata, ja jätetään rauhaan siellä, missä eivät olleet. Vanha testamentti nojaa masoreettiseen hepreaan ja Uusi Textus Receptukseen, niin kuin Reinankin.
hero.3=Se piti espanjankielistä protestanttista maailmaa lähes yksin hallussaan noin viisikymmentä vuotta, kunnes vuoden 1960 tarkistus syrjäytti sen, eikä se ole koskaan aivan kadonnut. Se on tekijänoikeudesta vapaa, mitä vuoden 1960 laitos ei ole, joten juuri tämä on se Reina-Valera, jota painetaan, julkaistaan verkossa ja lainataan ilman kenenkään lupaa. Siksi myös koko teksti voi olla tässä aineistossa ja kopioitavissa siitä ulos.
hero.4=Tässä lukuohjelmassa espanjalla on viisi Raamattua, ja juuri tämän käyttöliittymä avaa. Se on harkittu valinta eikä luettelon sattuma: toisin kuin arabiassa tai kiinassa, joissa lukuohjelma avaa kielen ainoan Raamatun, espanjalla on vaihtoehtoja ja tämä on poimittu niiden joukosta. Polveutumisaskelmiin sille ei ole kirjattu kantatekstiä, joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan. Pohja osuu tässä lähemmäs kuin tavallisesti, samasta syystä kuin arabiankielisen Raamatun kohdalla: sen tarjoama kreikka on Textus Receptus, ja juuri Textus Receptuksesta Reinan Uusi testamentti tehtiin.

