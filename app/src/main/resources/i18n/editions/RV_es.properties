title=Revised Version — Acerca de esta edición | Common Root
description=La English Revised Version: la única revisión de la King James Version que la Iglesia de Inglaterra ha autorizado nunca, publicada en tres entregas entre 1881 y 1894 — y aquí el peldaño entre la King James Version y la American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=La Revised Version es la única revisión de la King James Version que la iglesia de Inglaterra encargó de veras. La Convocación de Canterbury la resolvió en 1870 y nombró dos comisiones, una por cada Testamento, que reunieron a más de cincuenta eruditos británicos de varias confesiones — no solo anglicanos, lo cual era en sí una novedad y fue objeto de disputa. Se invitó a eruditos estadounidenses a participar por correspondencia, y participaron. La instrucción era conservadora: alterar la Authorised Version solo allí donde las lenguas originales, fielmente vertidas, lo exigieran. El Nuevo Testamento salió en 1881, el Antiguo Testamento en 1885, y los apócrifos, trabajados los últimos, en 1894.
hero.2=La instrucción conservadora no impidió a la comisión del Nuevo Testamento tomar la decisión de mayores consecuencias del libro. No trabajaron a partir del Textus Receptus. Westcott y Hort formaban parte de esa comisión y le fueron presentando en pruebas su propio texto griego a medida que avanzaba el trabajo; aquello por lo que se decidieron los revisores fue su propio texto ecléctico y no exactamente el de Westcott y Hort, pero se desplazó decididamente hacia los manuscritos unciales más antiguos. Ponga esta edición junto a la King James Version en dos columnas y el desplazamiento se ve en el acto. En 1 Juan 5:7 la columna de la King James lee «For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one», y esta lee «And it is the Spirit that beareth witness, because the Spirit is the truth».
hero.3=Lo que los revisores británicos no cambiaron es justamente lo que los estadounidenses más querían cambiar. En el Salmo 23:1 esta edición sigue imprimiendo «The LORD is my shepherd», exactamente como la King James Version; la American Standard Version que está por encima imprime «Jehovah is my shepherd». El nombre aparece aquí solo donde la propia King James Version lo había impreso — en Éxodo 6:3 ambas leen «by my name JEHOVAH» — y llevarlo a lo largo de todo el Antiguo Testamento fue una preferencia estadounidense, relegada al apéndice por el acuerdo de catorce años y soltada al texto solo en 1901. Leer las dos columnas a la vez es el camino más corto para ver qué retuvo de hecho aquel acuerdo. Una segunda diferencia se muestra en la forma de las frases más que en su tenor: los revisores rompieron con la composición de un versículo por línea y compusieron la prosa en párrafos, y la huella sobrevive aquí en versículos que empiezan en minúscula porque continúan una frase — «and I appeared unto Abraham» en Éxodo 6:3, donde la columna de la King James empieza «And I appeared».
hero.4=La ficha de esta edición deja el año en blanco, y esa es la respuesta honrada y no una laguna. La Revised Version no se publicó una vez sino tres, y el texto aquí es el de ochenta libros: sesenta y seis libros más los catorce de los apócrifos, 36.873 versículos en total, lo que significa que lleva material que no existió impreso antes de 1894. El registro del corpus lo sella en 1885, el año en que el Antiguo Testamento completó la Biblia propiamente dicha, y ese es el año que muestra la chapa del peldaño de linaje. De qué impresión desciende el texto no está registrado — la misma laguna que el corpus deja abierta para la King James Version y para la Biblia finlandesa de 1776. Nótese además que ninguna interfaz abre en esta edición; una interfaz inglesa abre en la New International Version, y a esta se cambia.

