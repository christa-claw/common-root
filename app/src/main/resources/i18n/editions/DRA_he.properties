fact.6.value=המהדורה האמריקנית של 1899 מבית ג'ון מרפי, בולטימור, עם היתר הדפוס של הקרדינל ג'יימס גיבונס — חופשית מזכויות יוצרים מזה זמן רב, והיא הגרסה המסתובבת דיגיטלית
fact.7.label=התוכן כאן
