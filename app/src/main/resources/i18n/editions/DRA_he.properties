title=דואה-ריימס 1899 — על מהדורה זו | Common Root
description=ביבליית דואה-ריימס: התרגום הקתולי האנגלי שנעשה מן הוולגטה הלטינית בריימס ב־1582 ובדואה ב־1609–10, בהגהת הבישוף צ'לונר, בדפוס בולטימור של 1899.
heroHeading=דואה-ריימס 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=בשנת 1568 הקימה קבוצה של קתולים אנגלים, רבים מהם אנשי אוקספורד שלא יכלו עוד להחזיק במשרותיהם, מכללה בדואה שבפלנדריה בראשות ויליאם אלן. חלק מטעם קיומה היה להניח ביבליה אנגלית בידיים קתוליות, שכן הביבליות האנגליות היחידות שהיו אז במחזור היו פרוטסטנטיות ושימשו בפולמוס. גרגורי מרטין החל לתרגם באוקטובר 1578 בקצב של כשני פרקים ליום, והברית החדשה יצאה לאור ב־1582 בריימס, לשם עברה המכללה זמנית. מרטין מת בעשרים ושמונה באוקטובר של אותה שנה, שבועות אחדים לאחר שהופיעה הברית החדשה שלו. הברית הישנה הייתה מוכנה באותו זמן ואז נותרה בלתי מודפסת, מן הטעם הפשוט שלמכללה לא היה במה להדפיסה; היא יצאה סוף־סוף בשני כרכים ב־1609 וב־1610, כשתרגום המלך ג'יימס היה במרחק שנתיים.
hero.2=מה שמפריד בינה לבין כל ביבליה אנגלית אחרת באוסף הזה הוא ממה נעשתה. לא מן העברית ומן היוונית: מן הוולגטה הלטינית. ועידת טרנטו הכריזה על הוולגטה כנוסח האותנטי של הכנסייה, ומתרגמי דואה הוסיפו וטענו שהירונימוס עבד מכתבי יד עתיקים מכל עותק יווני שהיה בהישג ידם — מחשבה שלא הייתה בלתי סבירה סביב 1600, לפחות לגבי הברית הישנה. הפרוזה שנוצרה לטינית בכבדות, לעיתים עד כדי כך שאינה אנגלית כלל: תפילת האדון מבקשת “supersubstantial bread”, משום שהמתרגמים לא רצו לְאַזרח מילה שהתאולוגיה נשענה עליה. זו הייתה מדיניות, לא חוסר יכולת.
hero.3=עד אמצע המאה השמונה־עשרה כמעט איש לא יכול היה לקרוא אותה, והבישוף ריצ'רד צ'לונר הגיה אותה בין 1749 ל־1752 — הגהה כבדה, ובמידה רבה לכיוון תרגום המלך ג'יימס, שהיה אז פשוט הצליל של כתבי הקודש באנגלית. כל ביבליה הנמכרת היום כדואה-ריימס היא נוסח צ'לונר ולא נוסח מרטין. זו כאן היא הדפוס האמריקני של 1899, של חברת ג'ון מרפי מבולטימור, הנושא את היתר הדפוס של הקרדינל ג'יימס גיבונס; ומאחר שאותו דפוס חופשי מזכויות יוצרים מזה זמן רב, הוא זה שנסרק, הוקלד ושוכפל מאז, והוא מה שכמעט כל דואה-ריימס דיגיטלית היא למעשה.
hero.4=בקורא הזה היא עושה דבר שכמעט שום מהדורה אחרת כאן אינה יכולה לעשות. המקור הרשום שלה נמצא באוסף: פִּתחו שלב שושלת מתחת לפסוק מדואה-ריימס, והשלב שמתחת הוא הוולגטה הלטינית עצמה, הנוסח שממנו תורגמה בפועל, ולא רצפת שפות המקור המסומנת ב־≈ שאליה נופלות רוב המהדורות. זה בדיוק המקרה שלמענו נבנה מנגנון השלבים. ההשפעה זרמה גם בכיוון ההפוך — הברית החדשה של ריימס הייתה על שולחנות מתרגמי המלך ג'יימס, ולא מעט מאוצר המילים הלטיני שלה עבר אל עבודתם — אך רשימת השושלת שומרת רק קווי הגהה פורמליים, ולכן החוב הזה אינו רשום בה. יש היפוך שראוי לציין: תווית השלב שלה נושאת את השנה 1899 ואילו כרטיס הקטלוג אינו מציג שנה כלל. שנות השלבים הן רשימה שנאספה ביד והכרטיס קורא את המטא־נתונים של הקטלוג עצמו, ובמקום שבו מהדורה מופיעה באחד ולא בשני, השניים חלוקים בגלוי.
hero.5=אזהרה בעניין הקנון. הנוסח השמור כאן מונה 72 ספרים, לא 73 כבביבליה קתולית מודפסת. ששת הספרים הדויטרוקנוניים שהוא כן נושא — טוביה, יהודית, מקבים א' וב', חכמת שלמה ובן סירא — עומדים אחרי חזון יוחנן ולא במקומותיהם הקתוליים, וברוך נעדר לחלוטין. זו תכונה של הנוסח הדיגיטלי כפי שנקלט, לא של הספר מ־1899, ומשמעה שהטור הזה ייקרא נכון פסוק אחר פסוק אך אין להשתמש בו כדי לבדוק מה כולל הקנון הקתולי.

