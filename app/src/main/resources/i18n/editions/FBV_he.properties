title=Free Bible Version — על מהדורה זו | Common Root
description=Free Bible Version: ביבליה אנגלית מודרנית שתרגם ג'ונתן גלאגר מן העברית ומן היוונית של נסטלה–אלנד, ויצאה ברישיון שיתוף־זהה כך שכל אדם רשאי להדפיסה מחדש.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=התרגום הזה קיים בגלל עמוד זכויות. כמעט כל ביבליה אנגלית מודרנית נושאת אחד כזה, ומה שכתוב בו בדרך כלל הוא שכמה מאות פסוקים מותר לצטט בלי לשאול, שספר שלם מחייב רשות בכתב, ושפרסום הטקסט במלואו פירושו תשלום תמלוגים. לאתר של קהילה או להקלטה זה עשוי להיות סוף הדבר. Free Bible Version נעשתה כדי להיות המהדורה שאין דבר העומד לפניה.
hero.2=זו מלאכתו של ג'ונתן גלאגר, בעל תואר דוקטור לתאולוגיה מסנט אנדרוס, והיא יוצאת לאור מטעם Free Bible Ministry, גוף שלא למטרות רווח. הברית החדשה באה מן היוונית של נסטלה–אלנד — הטקסט הביקורתי שחברות המקרא משתמשות בו — והברית הישנה מן העברית. דרך העבודה שהמיזם עצמו מתאר ראויה שתיאמר, משום שאיננה הדרך הרגילה: מתרגמים מן המקור בעזרת מילונים בלבד, ורק לאחר מכן משווים למהדורות הקיימות, כבדיקה מפני כפילות ושגיאה ולא כמקור. אין זו רוויזיה של ביבליה אנגלית קדומה יותר ואף לא צירוף של חדשות ממנה. המטרה המוצהרת היא אנגלית בת־זמננו הנמנעת מסלנג ומניבים אופנתיים, והיא מסרבת לתרגם לכיוון עמדותיה של קהילת אמונה מסוימת.
hero.3=הרישיון הוא עיקר העניין. זהו Creative Commons ייחוס-שיתוף זהה 4.0: העתיקו, הדפיסו, העלו לאתר, עבדו מחדש — ובלבד שהמהדורה תיקרא בשמה, שהשינויים יסומנו, ושכל הנבנה ממנה ייצא באותם תנאים עצמם. זו עסקה אחרת מנחלת הכלל — החירות נמסרת הלאה במקום להינתן מן היד — וזה אותו רישיון עצמו של Versión Biblia Libre הספרדית שבאוסף זה, שבאה מאותה שליחות.
hero.4=לקורא נובעים מכאן שני דברים. הקטלוג מותיר את שנתה ריקה, משום שהמיזם מפרסם רוויזיות ככל שהוא עושה אותן; אין הדפסה מתוארכת שאוסף זה קשור אליה, ולהמציא אחת יהיה גרוע מן הריק. ושלב הנפתח מתחת לפסוק מן Free Bible Version מראה ≈ TR, הוא הטקסטוס רצפטוס, מסומן כעד ולא כמקור. לא ממנו נעשה תרגום זה. זהו מה שהאוסף מסוגל להציע כיום כיוונית — מהדורה ביקורתית עדיין איננה כאן — ואותו ממלא מקום מופיע מאותו טעם עצמו גם מתחת ל־New International Version, ל־New American Standard Bible ול־Berean Standard Bible.

