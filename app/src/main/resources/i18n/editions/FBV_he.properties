fact.4.label=מתורגם מתוך
fact.4.value=העברית, והברית החדשה היוונית של נסטלה–אלנד — הטקסט הביקורתי שחברות המקרא משתמשות בו
fact.5.label=דרך העבודה
fact.5.value=תורגם מן המקור בעזרת מילונים בלבד, ורק לאחר מכן הושווה למהדורות הקיימות כבדיקה — לא צירוף שלהן ולא רוויזיה של ביבליה אנגלית קדומה יותר
fact.6.label=סגנון
fact.6.value=אנגלית מודרנית בלא סלנג ובלא לשון דיבור חולפת, ובלא ניסיון לשקף עמדות של קהילת אמונה מסוימת
fact.7.label=רישיון
fact.7.value=Creative Commons ייחוס-שיתוף זהה 4.0 — להעתיק, להדפיס ולעבד בחופשיות, ובלבד שהמהדורה תיקרא בשמה, שהשינויים יסומנו ושהנגזר יישא את הרישיון עצמו
fact.8.label=השנה בקטלוג
fact.8.value=הושארה ריקה ולא נוחשה — המיזם מתקן את הטקסט ומפרסמו מחדש תוך כדי, ולפיכך אין הדפסה אחת שהיא המהדורה
fact.9.label=תחת שלב
fact.9.value=≈ TR, עד ליוונית ולא טקסט הבסיס של תרגום זה; מהדורה יוונית ביקורתית עדיין אינה באוסף, ולכן אותו ממלא מקום משמש גם את [[NIV|NIV]], את [[NASB|NASB]] ואת [[BSB|BSB]]
fact.10.label=באוסף זה
fact.10.value=כל 66 הספרים. האנגלית נפתחת על [[NIV|New International Version]] שברישיון, ולפיכך עומדת זו לצד [[BSB|Berean Standard Bible]] ו־[[WEB|World English Bible]] כאנגלית שקורא רשאי לשאת עמו גם החוצה
