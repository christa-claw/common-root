title=Palabra de Dios para Ti — इस संस्करण के बारे में | Common Root
description=Palabra de Dios para Ti: Asociación Bíblica Latinoamericana द्वारा 2020 में प्रकाशित स्पेनी अनुवाद, जो हिब्रू ईश्वर-नामों को लिप्यंतरित रूप में बनाए रखता है और किसी भी उपयोग के लिए स्वतंत्र रूप से अनुज्ञप्त है।
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — अर्थात "तुम्हारे लिए ईश्वर का वचन" — एक नया स्पेनी अनुवाद है, जिसे 2020 में Asociación Bíblica Latinoamericana ने प्रकाशित किया; एक डिजिटल पाठ 2022 में Latinamerican Textual Bible Foundation, Inc. के माध्यम से जारी हुआ, जो फ़्लोरिडा में पंजीकृत एक अलाभकारी संस्था है और इसे eBible.org तथा YouVersion पर वितरित करती है। इसका श्रेय अनुवादकों फ्रांसिस्को लिएवानो और जॉइस लिएवानो को दिया जाता है। इस संग्रह का स्पेनी अंतरफलक जिस रेइना-वालेरा शृंखला पर पूर्वनिर्धारित रूप से खुलता है, उसके विपरीत यह न तो कासियोदोरो दे रेइना के सोलहवीं शताब्दी के अनुवाद का संशोधन है, न उससे उपजी किसी भी कृति का; यह एक स्वतंत्र अनुवाद है, जो सीधे मूल भाषाओं से किया गया, पूरे स्पेनी-भाषी अमेरिका के सामान्य पाठकों के लिए बनाया गया, और बिना अनुमति माँगे स्वतंत्र रूप से उद्धृत किए जाने के लिए अभिप्रेत है।
hero.2=पुराना नियम Biblia Hebraica Stuttgartensia का अनुसरण करता है और नया नियम एबरहार्ड नेस्ले के Novum Testamentum Graece के 27वें संस्करण का। एक चुनाव इसके पृष्ठों को रेइना के बाद के अधिकांश स्पेनी बाइबिलों से अलग करता है: जहाँ वे चतुरक्षरी नाम को "Jehová" के रूप में देती हैं या उसे "Señor" से बदल देती हैं, वहाँ Palabra de Dios para Ti हिब्रू नामों को स्वयं, लिप्यंतरित रूप में बनाए रखता है — Yavé, ʼElohim, ʼEL-Shadday — जिससे उत्पत्ति इस संस्करण के अपने ही शब्दों में खुलती है, "En un principio ʼElohim creó los cielos y la tierra."
hero.3=इस पाठक में यह चार स्पेनी संस्करणों में से एक है, [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] और [[VBL|Versión Biblia Libre]] के साथ। अंतरफलक अब भी पूर्वनिर्धारित रूप से रेइना-वालेरा 1909 खोलता है; यह वह संस्करण है जिस तक इसके अपने कार्ड से पहुँचा जाता है। अन्य दो की भाँति, यह एक ताज़ा अनुवाद है, इस संग्रह की किसी और कृति का संशोधन नहीं, इसलिए वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं है — इसके किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है। Asociación Bíblica Latinoamericana द्वितीयक-विहित पुस्तकों सहित एक अधिक पूर्ण मुद्रित संस्करण भी प्रकाशित करती है; इस संग्रह में रखा पाठ छियासठ पुस्तकों वाला सामान्य प्रोटेस्टेंट धर्मग्रंथ-संग्रह है।

