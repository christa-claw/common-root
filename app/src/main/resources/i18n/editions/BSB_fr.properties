title=Berean Standard Bible — À propos de cette édition | Common Root
description=La Berean Standard Bible : une traduction en anglais moderne faite par les équipes de Bible Hub et de Discovery Bible d'après l'hébreu massorétique et un Nouveau Testament grec qu'elles ont établi elles-mêmes — puis versée dans le domaine public.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=La Berean Standard Bible est l'une des traductions les plus récentes de cette collection et l'une des plus transparentes sur sa propre fabrication. Elle est l'œuvre des équipes de Bible Hub et de Discovery Bible, sous un comité consultatif, et elle a d'abord paru sous un autre nom : Berean Study Bible. Cela entretenait une confusion constante, car une study Bible désigne d'ordinaire une bible gonflée de commentaires et de notes, ce qu'elle n'est pas. La traduction a été rebaptisée ; l'abréviation est restée.
hero.2=La plupart des traductions partent d'un Nouveau Testament grec établi par quelqu'un d'autre. Ce projet a d'abord construit le sien. La Berean Greek Bible prend pour base Nestle 1904 — choisi, disent ses éditeurs, parce que c'est le texte critique le plus exact déjà tombé dans le domaine public — et le collationne avec Nestle–Aland, le Nouveau Testament grec de la SBL, Tischendorf, Westcott–Hort, le texte byzantin et le Textus Receptus, en notant en bas de page les endroits où ils divergent. L'anglais en a été traduit. L'Ancien Testament vient de l'hébreu massorétique, les manuscrits de la mer Morte, la Septante et d'autres témoins anciens étant consultés là où ils pèsent sur une leçon. Le même travail a ensuite été publié par couches : un interlinéaire mot à mot, une édition raidement littérale et celle-ci, lisible, afin qu'un lecteur puisse aller du grec à l'anglais pas à pas au lieu de croire les traducteurs sur parole. Cela place aussi la Berean de l'autre côté d'un partage que ce corpus rend visible : la Bible de Genève et la King James Version descendent ici du Textus Receptus, et celle-ci non.
hero.3=La dernière chose que le projet ait faite de son texte, c'est de le donner. Les textes béréens ont été versés dans le domaine public en avril 2023, et c'est pourquoi la Bible entière peut se trouver dans ce corpus et en être recopiée. Réglez l'interface du lecteur sur l'anglais et c'est la New International Version qui s'ouvre, présente ici sous licence ; la Berean est l'anglais moderne à côté d'elle que chacun peut citer, imprimer et rediffuser. Dans les échelons de filiation, elle se comporte comme la Biblia en Español Sencillo. Aucun texte source ne lui est enregistré, car c'est une traduction neuve et non la révision de quoi que ce soit que le corpus détienne ; un échelon ouvert sous un verset béréen tombe donc droit sur le sol des langues originales marqué ≈, et non sur une bible anglaise plus ancienne. Le catalogue laisse également son année vide. Ce n'est pas un oubli : le texte est encore révisé à mesure que les corrections arrivent, et les années sont ici choisies et non devinées, de sorte qu'une édition sans un seul tirage daté n'obtient pas de date.

