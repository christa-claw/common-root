title=Tyndale Yeni Antlaşması 1534 — Bu baskı hakkında | Common Root
description=William Tyndale'in Yeni Antlaşması: Yunancadan yapılan ve basılan ilk İngilizce çeviri, kendi elinden geçmiş 1534 düzeltmesiyle — Cenevre Kutsal Kitabı'nın ve Kral James Çevirisi'nin altındaki metin.
heroHeading=Tyndale Yeni Antlaşması 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=Tyndale'in İngiltere'sinde İngilizce bir Kutsal Kitap hâlâ yasaktı. 1409 tarihli Oxford Konstitüsyonları, bir piskoposun onayı olmadan Kutsal Yazıları İngilizceye çevirmeyi ya da böyle bir çeviriyi okumayı yasaklıyordu. William Tyndale 1523'te bu onayı Londra Piskoposu Cuthbert Tunstall'dan istedi, geri çevrildi ve ertesi yıl işi onaysız yapmak için İngiltere'den ayrıldı. Önünde Erasmus'un Yunanca Yeni Antlaşması, yanında Luther'in Almancası ve Latince Vulgata ile, Yunancadan çevrilmiş ilk İngilizce Yeni Antlaşma'yı ve şimdiye dek basılmış ilkini ortaya koydu. 1525'te Köln'deki ilk girişim matbaaya yapılan bir baskınla yarıda kaldı; kitabın tamamı 1526'da Worms'ta Peter Schöffer'in matbaasından çıktı ve İngiltere'ye kaçırıldı; orada piskoposlar nüshaları toplayıp yaktılar.
hero.2=Buradaki metin, Tyndale'in kendi düzeltmesidir; 1534'te Anvers'te basıldı. Bu baskıda Yunancayı yeniden gözden geçirdi, ilk çevirisini düzeltti, önsözler ve notlar ekledi. Bu, bir çeviri olduğu kadar bir tavır alıştı. Thomas More, Kilise'nin kilise dediği yerde “cemaat” (congregation), rahip dediği yerde “ihtiyar” (elder), charity dediği yerde de “sevgi” (love) yazdığı için ona saldırdı; üç tercihin üçü de bu metinde durur: Matta 16:18 “apon this rocke I wyll bylde my congregacion” diye okunur. Tyndale 1535'te çevirisini bir kez daha gözden geçirdi, aynı yılın mayısında Anvers'te tutuklandı ve 1536'da sapkın ilan edilip Brüksel yakınlarındaki Vilvoorde'da boğularak öldürüldü ve yakıldı.
hero.3=Bu okuyucuda onu en altta bulursunuz. Tyndale hem Cenevre Kutsal Kitabı'nın hem de Kral James Çevirisi'nin altında kayıtlı bir basamaktır; dolayısıyla merdivende daha aşağıda, Kral James'in üzerinde durduğu Revised Version, American Standard Version ve World English Bible'ın da altındadır. Bir Kral James ayetinden Cenevre'yi geçerek aşağı inildiğinde ifade çoğu zaman neredeyse hiç kıpırdamaz — asıl mesele de budur; 1. Korintliler 13:13'te ise kıpırdar: Tyndale ile Cenevre love derken Kral James charity der. Tyndale'in altında kayıtlı bir öncül yoktur. Erasmus'un Yunancasıyla çalışmıştı, ama buradaki Textus Receptus ondan bir kuşak sonraki 1550 baskısıdır; buradaki Luther de onun kullandığı 1522 Yeni Antlaşması değil, 1545 Kutsal Kitabı'dır. Bu yüzden merdiven doğrudan özgün dillerin zeminine iner. Burada yalnızca Yeni Antlaşma vardır, kendi yazımıyla: Matta “This is the boke of the generacion of Iesus Christ” diye başlar.

