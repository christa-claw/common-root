title=Biblia en Español Sencillo — À propos de cette édition | Common Root
description=La Biblia en Español Sencillo : une Bible en espagnol simple publiée par AudioBiblia.org depuis 2018, écrite autant pour être entendue que pour être lue, et sous une licence qui permet à quiconque de la copier.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Pendant quatre siècles, la Bible protestante en espagnol a été, de fait, un seul livre en révisions successives : la traduction de Casiodoro de Reina de 1569, telle que Cipriano de Valera l'a révisée en 1602, et la longue lignée des éditions Reina-Valera qui a suivi. La Biblia en Español Sencillo n'en fait pas partie. C'est une traduction neuve, faite en espagnol d'aujourd'hui et délibérément simple, publiée par AudioBiblia.org — le Nouveau Testament avec les Psaumes et les Proverbes en 2018, l'Ancien Testament achevé en octobre 2019. La traduction est attribuée à Irma Flores, et ses éditeurs la décrivent comme conservatrice et évangélique.
hero.2=Ce qui la distingue, c'est son origine. Elle est l'œuvre d'un ministère de Bible audio, et le texte ainsi qu'un enregistrement complet chapitre par chapitre ont été produits ensemble, et non l'un lu à partir de l'autre. Le but affiché était le même pour les deux : une Bible facile à comprendre, et que l'on puisse copier et partager librement et légalement. Cette seconde moitié n'est pas accessoire. La traduction porte une licence Creative Commons Attribution, créditant AudioBiblia.org et Irma Flores, plutôt que les droits réservés d'un éditeur — et c'est pourquoi le texte entier peut se trouver dans ce corpus et être mis verset par verset à côté de n'importe quoi d'autre.
hero.3=Dans ce lecteur, elle est l'une des quatre éditions espagnoles. Réglez l'interface sur l'espagnol et le lecteur ouvre toujours la Reina-Valera 1909 ; celle-ci est une édition vers laquelle on bascule. Elle se comporte aussi autrement dans les échelons de filiation. Étant une traduction neuve et non la révision de quoi que ce soit que le corpus contienne, aucun texte source ne lui est enregistré — de sorte qu'un échelon ouvert sous un verset de la Biblia en Español Sencillo tombe droit sur le sol des langues originales marqué d'un ≈, et non, comme dans la chaîne anglaise, sur une édition plus ancienne du même livre. Mettez-la plutôt dans la seconde colonne face à la Reina-Valera 1909 : c'est l'écart entre les deux registres qui mérite le regard.

