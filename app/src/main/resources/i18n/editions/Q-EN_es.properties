title=Corán — Pickthall — Acerca de esta edición | Common Root
description=La traducción de 1930 de Muhammad Marmaduke Pickthall, la primera traducción inglesa del Corán realizada por un musulmán cuya lengua materna era el inglés — producida al servicio del nizam de Hyderabad y con el consejo de los sabios de al-Azhar, y en este corpus el inglés que se muestra por defecto bajo el texto árabe.
heroHeading=Corán — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) fue un novelista inglés, admirado en su época por H. G. Wells y D. H. Lawrence, antes de convertirse en traductor de escritura sagrada. Declaró su conversión al islam en noviembre de 1917, tras una charla titulada "Islam and Progress" ante la Muslim Literary Society de Notting Hill, y pronunció la shahada ese mismo mes en la Woking Muslim Mission. Una década después era director del Chadarghat High School en Hyderabad, al servicio del nizam, y fue desde allí, en 1928, donde tomó un año sabático de dos años para hacer lo que había querido hacer desde su conversión: traducir el Corán al inglés.
hero.2=No lo hizo solo ni con prisa. En 1929 pasó tres meses en El Cairo, donde el apoyo de Rashid Rida le abrió puertas, buscando la bendición de los sabios de al-Azhar para un proyecto del que algunos de ellos habían sido advertidos de que podía costarles su puesto — una parte de al-Azhar consideraba que traducir el Corán era en sí un asunto grave. Pickthall siguió adelante y continuó consultándolos de todos modos. Lo que publicó en 1930, como "The Meaning of the Glorious Koran: An Explanatory Translation", lleva esa cautela ya en el título: no "el Corán en inglés" sino una explicación de su significado, porque ninguna traducción, según su propia opinión declarada, podía ser el Corán mismo. Alfred A. Knopf publicó la primera edición en Nueva York; le siguió una edición bilingüe de la imprenta del gobierno de Hyderabad.
hero.3=The Times Literary Supplement la llamó "a great literary achievement", y suele describirse como la primera traducción inglesa del Corán hecha por un musulmán cuya lengua materna era el inglés — versiones inglesas anteriores, como las de Sale y Rodwell, fueron obra de orientalistas no musulmanes. La de Pickthall ha permanecido impresa y en uso durante casi un siglo desde entonces, una de las pocas traducciones al inglés que los lectores corrientes, no solo los estudiosos, leen realmente.
hero.4=En este corpus es la traducción que se muestra por defecto bajo el texto árabe uthmani — el árabe sigue siendo la base de cada columna, y este inglés se muestra como comentario junto a él, sin sustituirlo nunca. Se eligió para ese papel por una razón tan poco glamurosa como literaria: un repaso de las traducciones disponibles encontró solo dos versiones inglesas inequívocamente de dominio público, esta y la de Yusuf Ali de 1934, además de la rusa de Sablukov de 1878 para una tercera lengua. El texto aquí es una digitalización de la traducción, obtenida a través de alquran.cloud y no vinculada a ninguna impresión concreta, por lo que debe leerse como la redacción de Pickthall y no como un facsímil de una edición determinada.

