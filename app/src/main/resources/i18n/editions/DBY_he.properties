fact.10.value=הביבליה הצרפתית היחידה כאן, ולכן ממשק צרפתי נפתח עליה; בשלבי השושלת לא רשום שום מקור, ותווית השלב שלה מוצגת בלא שנה אף שכרטיס הקטלוג מציג 1885
