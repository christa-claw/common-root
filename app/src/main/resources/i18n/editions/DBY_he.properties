title=דארבי 1885 (צרפתית) — על מהדורה זו | Common Root
description=ביבליית דארבי הצרפתית משנת 1885: תרגום פּוֹ–ווי, שהחלו בו ג'ון נלסון דארבי ועמיתיו בשנת 1859 והושלם שלוש שנים לאחר מותו, והנוסח שממנו נבנתה אחר כך הברית הישנה האנגלית שלו.
