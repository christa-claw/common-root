# The narrative, one paragraph per key, in order.
hero.1=את ג'ון נלסון דארבי זוכרים בשל דברים אחרים — הוא פרש מכנסיית אירלנד, סייע לייסד את אחי פלימות' והפיץ את הפרה־מילנריאליזם הדיספנסציוני — אך חלק גדול מחייו עבר עליו בתרגום המקרא, והוא עשה זאת בשלוש לשונות. המיוחד בו הוא הסדר. רוב המתרגמים עובדים החוצה מלשונם שלהם. הביבליה האנגלית של דארבי הייתה האחרונה מן השלוש שהושלמה, ואת הברית הישנה שלה לא עשה הוא היישר מן העברית אלא מן הנוסחים הצרפתי והגרמני שכבר הכין עם אחרים.
hero.2=זו הצרפתית. דארבי היה המלומד הראשי אך מעולם לא המתרגם היחיד של דבר הנושא את שמו; בצוות הצרפתי היו ויליאם ג'וזף לואו ופייר שלומברז'ה. הברית החדשה הופיעה בשנת 1859 ונדפסה שוב שלוש פעמים בשני העשורים שלאחר מכן. הביבליה השלמה יצאה בשנת 1885 בפּוֹ ובווי — ומכאן השם שבו היא ידועה בדרך כלל — אף שדף השער מטעה מעט: פּוֹ שוכנת בקצה דרומה של צרפת, והעבודה נעשתה בעיקר למען קהילות האחים של שווייץ דוברת הצרפתית. דארבי מת בשנת 1882, ולפיכך לא ראה את הספר הגמור.
hero.3=התרגום מילולי מתוך עיקרון, ודארבי אמר בפירוש מדוע בהקדמה לברית החדשה הגרמנית שלו: המלומד יכול לעיין במקור, ולפיכך תכלית התרגום היא להניח ייצוג מדויק ככל האפשר שלו בידי מי שאינו יכול. הוא גם הזהיר כי מסירה חופשית יותר מאבדת משמעויות שאולי המתרגם עצמו לא עמד עליהן. התוצאה מדויקת ובלתי מקושטת, ומעולם לא נועדה לקריאה בקול — בדרשתו שלו השתמש דארבי ב־King James Version.
hero.4=שני דברים קושרים אותה לשאר האוסף הזה. הביבליה הגרמנית של דארבי היא האלברפלדית, המצויה כאן בשם Elberfelder 1905 — אותו אדם, אותם עקרונות, ואחד משני הטקסטים שמהם הורכבה הברית הישנה האנגלית שלו, כך ששני הכרטיסים, הצרפתי והגרמני, קרובים זה לזה יותר משמשתמע מלשונותיהם השונות. ויחסה אל שם האל מעמיד אותה לצד American Standard Version, המדפיסה “Jehovah” אלפי פעמים במקום שבו King James Version מדפיסה “the LORD”; דארבי קיבל את אותה החלטה ראשון, בשלוש לשונות. בקורא היא הביבליה הצרפתית היחידה, ולכן ממשק צרפתי נפתח עליה. בשלבי השושלת לא רשום לה שום מקור, ובשונה מרוב המהדורות המתוארכות שכאן תווית השלב שלה אינה נושאת שנה כלל — כרטיס הקטלוג מציג 1885, אך שנות השלבים הן רשימה נפרדת הנאספת ביד, ומהדורה זו עדיין אינה בה.

