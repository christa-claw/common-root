fact.8.label=נוסחים אחים
fact.8.value=הביבליה הגרמנית של דארבי היא האלברפלדית, באוסף זה [[ELB|Elberfelder 1905]]; הברית הישנה האנגלית של דארבי נעשתה מן העבודה הצרפתית והגרמנית ולא היישר מאנגליתו שלו
