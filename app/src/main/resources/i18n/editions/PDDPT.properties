title=Palabra de Dios para Ti — About This Edition | Common Root
description=Palabra de Dios para Ti: a 2020 Spanish translation from the Asociación Bíblica Latinoamericana, keeping the Hebrew divine names transliterated and freely licensed for any use.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — "the Word of God for you" — is a fresh Spanish translation published in 2020 by the Asociación Bíblica Latinoamericana, with an electronic text issued in 2022 through the Latinamerican Textual Bible Foundation, Inc., a Florida-registered nonprofit that distributes it on eBible.org and YouVersion. It is credited to the translators Francisco Liévano and Joyce Liévano. Unlike the Reina-Valera line this corpus's Spanish interface opens on by default, it is not a revision of Casiodoro de Reina's sixteenth-century translation or of anything descended from it; it is an independent translation made directly from the source languages, aimed at ordinary readers across the Spanish-speaking Americas and meant to be quoted freely, without asking permission.
hero.2=The Old Testament follows the Biblia Hebraica Stuttgartensia and the New Testament the 27th edition of Eberhard Nestle's Novum Testamentum Graece. One choice sets its page apart from most Spanish Bibles since Reina: where those render the Tetragrammaton as "Jehová" or replace it with "Señor," Palabra de Dios para Ti keeps the Hebrew names themselves, transliterated — Yavé, ʼElohim, ʼEL-Shadday — so that Genesis opens, in this edition's own words, "En un principio ʼElohim creó los cielos y la tierra."
hero.3=In this reader it is one of four Spanish editions, alongside [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] and [[VBL|Versión Biblia Libre]]. The interface still opens on Reina-Valera 1909 by default; this is an edition reached from its own card. Like the other two, it is a fresh translation rather than a revision of anything else the corpus holds, so no parent is recorded for it in the lineage rungs — a rung opened beneath one of its verses goes straight to the original-language floor marked ≈. The Asociación Bíblica Latinoamericana also issues a fuller print edition carrying the deuterocanonical books; the text held in this corpus is the standard sixty-six-book Protestant canon.

