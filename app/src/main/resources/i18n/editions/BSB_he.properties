title=Berean Standard Bible — על מהדורה זו | Common Root
description=Berean Standard Bible: תרגום לאנגלית בת ימינו שעשו צוותי Bible Hub ו־Discovery Bible מן העברית המסורתית ומברית חדשה יוונית שהתקינו בעצמם — ואחר כך נמסר לנחלת הכלל.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible היא מן התרגומים החדשים ביותר באוסף הזה, ומן הגלויים ביותר באשר לדרך עשייתה. עשו אותה הצוותים שמאחורי Bible Hub ו־Discovery Bible תחת ועדה מייעצת, והיא הופיעה תחילה בשם אחר: Berean Study Bible. הדבר גרם בלבול מתמיד, שכן study Bible פירושה בדרך כלל ביבליה ממולאת פירוש והערות, וזו אינה כזאת. שם התרגום שונה; הקיצור נשאר.
hero.2=רוב התרגומים יוצאים מברית חדשה יוונית שהתקין מישהו אחר. המיזם הזה בנה תחילה את שלו. Berean Greek Bible לוקחת את מהדורת נסטלה 1904 כבסיס — נבחרה, כדברי מתקיניה, משום שהיא הנוסח הביקורתי המדויק ביותר שכבר מצוי בנחלת הכלל — ומשווה אותה אל נסטלה–אלנד, אל הברית החדשה היוונית של SBL, אל טישנדורף, אל ווסטקוט–הורט, אל הנוסח הביזנטי ואל הנוסח המקובל, ומציינת בהערות את מקומות הפירוד. האנגלית תורגמה ממנה. הברית הישנה באה מן העברית המסורתית, ומגילות ים המלח, תרגום השבעים ועדים קדומים אחרים נשקלו במקום שיש להם משקל בגרסה. אותה עבודה יצאה לאור אחר כך בשכבות: נוסח בין־שיטין מילה במילה, מהדורה מילולית נוקשה, וזו הקריאה — כדי שקורא יוכל ללכת מן היוונית אל האנגלית צעד אחר צעד במקום להאמין למתרגמים על דברתם. הדבר גם מציב את Berean בעברו האחר של קו חוצה שהאוסף הזה מגלה לעין: ביבליית ז'נבה ותרגום המלך ג'יימס יורדים כאן מן הנוסח המקובל, וזו אינה.
hero.3=הדבר האחרון שעשה המיזם בנוסחו היה לתת אותו. נוסחי Berean נמסרו לנחלת הכלל באפריל 2023, ומשום כך יכולה הביבליה כולה לשכון באוסף הזה ולהיות מועתקת ממנו החוצה. העמידו את ממשק הקורא על אנגלית וייפתח New International Version, המצוי כאן ברישיון; Berean היא האנגלית בת ימינו שלצדו, שכל אדם רשאי לצטט, להדפיס ולהפיץ. בשלבי השושלת היא נוהגת כמו Biblia en Español Sencillo. לא רשום לה שום מקור, משום שהיא תרגום חדש ולא הגהה של דבר שהאוסף מחזיק, ולכן שלב הנפתח מתחת לפסוק מ־Berean יורד היישר אל רצפת שפות המקור המסומנת ב־≈ ולא אל ביבליה אנגלית קדומה יותר. גם את שנתה מותיר הקטלוג ריקה. אין זו שגגה — הנוסח עודנו מתוקן ככל שמגיעות הערות, והשנים כאן נבחרות ואינן מנוחשות, ולכן מהדורה שאין לה דפוס מתוארך אחד אינה מקבלת שנה.

