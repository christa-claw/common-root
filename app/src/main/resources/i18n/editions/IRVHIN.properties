title=Indian Revised Version — About This Edition | Common Root
description=The Indian Revised Version (IRV): a 2019 Hindi translation of the Bible from Bridge Connectivity Solutions, licensed CC BY-SA 4.0 — the Hindi text this corpus opens on by default.
heroHeading=Indian Revised Version
readerHref=/reader?c1.src=irvhin

# The narrative, one paragraph per key, in order.
hero.1=The Indian Revised Version is a modern Hindi translation of the Bible, copyrighted 2017 and 2019 by Bridge Connectivity Solutions Pvt. Ltd., an India-based Bible translation and technology organisation. It belongs to a wider "Indian Revised Version" series the same publisher has produced in parallel across several of India's other major languages — Kannada, Tamil, Telugu and Assamese among them — each a complete Bible in its own script, released under the same open licence.
hero.2=Common Root's text comes from eBible.org's USFM distribution of the Hindi IRV, catalogued there as hin2017, rather than from an earlier digital copy of the same translation that had circulated with footnote text glued inline into the verses and with book names given in Hindi rather than English. Re-ingesting from that USFM source fixed both problems before the edition was added here — this corpus keeps book names in English internally, across every edition, regardless of the Bible's own language.
hero.3=It is written here in the Devanagari script, as इंडियन रिवाइज़्ड वर्ज़न, and holds the standard 66-book Protestant canon, with no deuterocanonical books.
hero.4=It is the only Hindi Bible in this corpus, so a Hindi interface opens on it by default.

