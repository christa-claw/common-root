fact.12.value=ראש הסולם הגרמני: אב רשום אחד, [[LUT1545|Luther Bibel 1545]], ומתחתיו רצפת לשונות המקור. שמונים וחמש הערות המגיהים נישאות כאן כהערות ולא נזרקות, והן קשורות למהדורה — ביאור מ־1912 מוצג תחת טור של 1912 ולא בשום מקום אחר. אין זו המהדורה שממשק גרמני נפתח עליה; זו [[ELB|האלברפלד]], הראשונה בקטלוג לפי ראשי התיבות שלה ומשום דבר אחר
