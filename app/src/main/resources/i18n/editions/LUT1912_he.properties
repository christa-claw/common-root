title=Luther Bibel 1912 — על מהדורה זו | Common Root
description=התיקון הכנסייתי הרשמי השני של מקרא לותר: הגהה זהירה במתכוון, שהושלמה ב־1910, אומצה ב־1912, והנוסח הלותרני האחרון הנשען על Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=תיקון של תיקון. הכנסיות הגרמניות הסכימו ב־1892 על נוסח אחד של מקרא לותר, הוא התיקון הכנסייתי הרשמי הראשון, ובתוך שנים מעטות כבר נאמר עליו שאינו מספיק. הטענות היו הישנות: יותר מדי מילים שיצאו מכלל שימוש, וכתיב שכבר לא היה של איש. הנקודה השנייה היא שהכריעה. הדודן העניק לרייך הגרמני כתיב מחייב שנלמד בבתי הספר, ומקרא לותר שסטה ממנו היה קשה להניח לפני כיתה. ב־1906 הסכימה ועידת הכנסיות האוונגליות הגרמניות לתיקון נוסף והורתה במפורש שיהיה עדין ומשמר. ועדה של תיאולוגים עברה על כל ספר עד 1910, וב־1912 אימצה הוועידה את התוצאה.
hero.2=העבודה ארכה בקושי יותר משנתיים, וזה מעיד איזה מין תיקון היה זה. איש לא ניסה לעשות מקרא לותר חדש, לא מבחינה פילולוגית ולא בדרך אחרת. מגיה מאוחר יותר, פריץ טשירש, פטר אותו כתיקון של מלמד, והכינוי אינו שקרי לגבי השיטה — הכתיב יושר, המילים המתות באופן הגלוי ביותר הוחלפו, והלשון בשאר הדברים הונחה היכן שלותר הניח אותה. מה שהכינוי אינו רואה הוא עד כמה החזיק מעמד. לאורך עשורים של תיקונים חלקיים שבאו אחריו, נוסח 1912 נשאר במקומו, והוא עדיין נקרא ועדיין נמכר. חלק מזה הוא ה־Jubiläumsbibel של 1912, מהדורת המאה של מכון המקרא של וירטמברג עם הערות מבארות, שנדפסה מחדש בפרקטור עד עמוק לתוך המאה הזאת. חלק מזה הוא שזכות היוצרים פקעה, כך שאין עלות לשכפל את הנוסח והוא מופיע בכל מקום — ובכלל זה כאן.
hero.3=דבר אחד יותר מכול מחזיק אותו בשימוש אצל קוראים שמרנים: זהו התיקון הלותרני האחרון הבנוי על Textus Receptus, הברית החדשה היוונית של המאות השש־עשרה והשבע־עשרה. כל מה שבא אחריו עבר אל הנוסח הביקורתי. הדבר עושה מהדורה זו לשלב נקי במידה חריגה לעמוד עליו בסולם, משום שהיוונית שמתחתיה היא אותה יוונית שמתחת למהדורתו של לותר עצמו מ־1545 ומתחת לז'נבה ומתחת ל־King James — כל המגדל חולק רצפה אחת במקום להחליף אותה באמצע הדרך.
hero.4=בשלבי השושלת עומדת מהדורה זו ממש מעל Luther Bibel 1545, ויש לה בדיוק אב אחד רשום, והוא זו. פתחו שלב מתחת לפסוק מ־1912 ולשונו של לותר עצמו מ־1545 תופיע מתחתיו; פתחו עוד אחד והסולם מגיע אל Textus Receptus ליוונית ואל כתב יד לנינגרד לעברית. שלוש מאות שישים ושבע שנות תיקון, פסוק אחר פסוק, בשתי הקלקות. מה שמהדורה זו איננה: המקרא שממשק גרמני נפתח עליו — לגרמנית אין מהדורת ברירת מחדל נבחרת, ולכן הקורא מקבל את המקרא הגרמני הראשון בקטלוג, והוא האלברפלד.

