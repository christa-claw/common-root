title=Young's Literal Translation — इस संस्करण के बारे में | Common Root
description=रॉबर्ट यंग का बाइबल का शाब्दिक अनुवाद, पहली बार 1862 में एडिनबरा में प्रकाशित, 1887 में स्वयं यंग द्वारा और 1898 में उनके प्रकाशकों द्वारा संशोधित — एक अंग्रेज़ी बाइबल जो इब्रानी और यूनानी के काल, शब्द-क्रम और जहाँ तक हो सके शब्दावली को बनाए रखती है, वहाँ भी जहाँ अंग्रेज़ी मुश्किल से साथ दे पाती है।
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=रॉबर्ट यंग (1822–1888) एडिनबरा के एक मुद्रक और पुस्तक-विक्रेता थे। छपाई की शागिर्दी के दौरान उन्होंने स्वयं इब्रानी और कई अन्य पूर्वी भाषाएँ सीखीं, 1856 से 1861 तक भारत के सूरत में एक मिशन छापाख़ाना चलाया, और उन्हें सबसे बढ़कर दो पुस्तकों के लिए याद किया जाता है: Analytical Concordance to the Bible नामक अनुक्रमणिका और यह अनुवाद। उन्होंने Literal Translation 1862 में एडिनबरा में प्रकाशित किया और 1887 में उसका संशोधित संस्करण निकाला। उनकी मृत्यु के दस वर्ष बाद, जनवरी 1898 में, उनके प्रकाशकों ने तीसरा संस्करण निकाला, जिसे एक बार फिर “उसकी वर्तमान रेखाओं पर” संशोधित किया गया था; इस संग्रह में वही पाठ है। यंग ने पुराने नियम का अनुवाद प्रचलित मसोरेटिक इब्रानी पाठ से और नए नियम का यूनानी स्वीकृत पाठ, टेक्स्टस रिसेप्टस, से किया, और साफ़ कहा कि वे इनमें से किसी का नया पाठ गढ़ने का प्रयास नहीं करेंगे: उन्होंने लिखा कि अनुवाद पाठ-आलोचना से अलग काम है, और दोनों के योग्य बहुत कम लोग होते हैं।
hero.2=पूरा उद्देश्य यह है कि अंग्रेज़ी पाठक मूल का व्याकरण देख सके। यंग का मानना था कि जो अनुवाद वहाँ वर्तमान काल देता है जहाँ मूल में भूतकाल है, या “an a for a the”, निश्चित उपपद की जगह अनिश्चित, वह शाब्दिक प्रेरणा को किनारे कर देता है, और उन्होंने उसी के अनुसार अनुवाद किया। इब्रानी क्रिया-रूप अंग्रेज़ी कालों के रूप में आते हैं, इसलिए कथा अक्सर वर्तमान काल में चलती है: उत्पत्ति “In the beginning of God's preparing the heavens and the earth —” से शुरू होती है और आगे “and God saith, ‘Let light be;’ and light is.” कहती है। अर्थ के लिए जोड़े गए शब्द वर्गाकार कोष्ठकों में हैं: “Jehovah [is] my shepherd, I do not lack.” उन्होंने जहाँ तक बन पड़ा हर इब्रानी या यूनानी शब्द को एक ही अंग्रेज़ी समतुल्य देने का प्रयास किया, और इसीलिए इब्रानी olam और यूनानी aiōn “ever” और “eternal” के बजाय “age” और “age-during” बन जाते हैं; मत्ती 25:46 में धर्मी “to life age-during” जाते हैं। पूरे पुराने नियम में परमेश्वर का नाम “Jehovah” के रूप में है।
hero.3=हमारी प्रति पूरी है: उत्पत्ति से प्रकाशितवाक्य तक 66 पुस्तकें, अपोक्रिफ़ा के बिना, अंग्रेज़ी अध्याय और आयत क्रमांकन में — 150 भजन, जिनमें हर भजन का शीर्षक उसकी पहली आयत में मिला दिया गया है, और मलाकी जो अध्याय 4 पर समाप्त होती है। स्वीकृत पाठ का अनुवाद होने के कारण इसमें वे अंश हैं जिन पर बाद के आलोचनात्मक संस्करण प्रश्न उठाते हैं, मरकुस के लंबे अंत से लेकर 1 यूहन्ना 5:7 में स्वर्ग के तीन गवाहों तक, जिन्हें यह पाठ वर्गाकार कोष्ठकों में रखता है, जैसे वह पूरी प्रेरितों के काम 8:37 को रखता है। इस पाठक में यह अपने आप में खड़ा है। संग्रह इसके लिए कोई जनक दर्ज नहीं करता, इसलिए इसकी किसी आयत के नीचे खोला गया वंश-पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर गिरता है: पुराने नियम में लेनिनग्राद कोडेक्स और नए नियम में टेक्स्टस रिसेप्टस। यह तल उसके निकट है जिससे स्वयं यंग ने अनुवाद किया, मसोरेटिक इब्रानी और स्वीकृत यूनानी, यद्यपि उन्हीं मुद्रणों में नहीं। इस पर टिका हुआ भी कुछ दर्ज नहीं है। 2020 का Literal Standard Version, जो इस संग्रह में भी है, स्वयं को यंग के कार्य का एक बड़ा संशोधन बताता है, पर संग्रह यह कड़ी दर्ज नहीं करता, इसलिए LSV के नीचे के पायदान यहाँ नहीं ले जाते। कोई अंतरफलक भाषा इस संस्करण पर नहीं खुलती; अंग्रेज़ी अंतरफलक New International Version पर खुलता है, और इस संस्करण तक अनुवाद-ग्रिड में इसके अपने कार्ड से पहुँचा जाता है।

