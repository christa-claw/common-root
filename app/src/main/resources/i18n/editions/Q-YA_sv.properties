title=Koranen — Yusuf Ali — Om denna utgåva | Common Root
description=Abdullah Yusuf Alis översättning, utgiven i fyra volymer mellan 1934 och 1937 av en indisk tjänsteman som blev islamforskare — en av bara två engelska koranöversättningar som befanns otvetydigt fria att kopiera, och i detta korpus en andra engelsk följeöversättning vid sidan av Pickthalls.
heroHeading=Koranen — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872–1953) föddes i Bombay och utbildades först vid Wilson College där, där en religiös fostran vid sidan av skolgången fick honom att som pojke lära sig Koranen utantill. En förstaklassig kandidatexamen i engelsk litteratur från Bombays universitet 1891 gav honom ett Presidency-stipendium till Storbritannien, där han studerade juridik vid St John's College i Cambridge, tog kandidat- och juristexamen 1895 och återvände samma år till Indien med en tjänst inom den indiska civilförvaltningen.
hero.2=Han tillbringade nästan två decennier inom civilförvaltningen — som fredsdomare och skattetjänsteman, därefter som domare och senare som biträdande sekreterare i den indiska regeringens finansdepartement — innan han avgick 1914 och slog sig ner i Storbritannien. Där blev han förvaltare för Shah Jehan-moskén i Woking och för East London Mosque Fund, utnämndes till CBE 1917 för sitt arbete under kriget och höll föreläsningar i hindustani vid School of Oriental Studies. Han återvände till Indien på 1920- och 1930-talen som rektor för Islamia College i Lahore, och det var under dessa år, efter mer än ett decenniums arbete, som han skrev om Koranen till engelska med sina egna förklarande anmärkningar.
hero.3=Översättningen kom ut i trettio häften mellan 1934 och 1937, det första den 4 april 1934, under titeln "The Holy Qur'an: Text, Translation and Commentary", utgiven av Shaik Muhammad Ashraf i Lahore; en sammanställd enbandsutgåva följde 1938, med en reviderad utgåva 1939–1940. Vid sidan av Pickthalls blev den en av de två mest lästa engelska koranöversättningarna under 1900-talet, känd framför allt för omfattningen av dess fotnoter, och har sedan dess getts ut på nytt, delvis omarbetad av andra händer, i omkring trettio ytterligare tryckningar — däribland en utgåva som Amana Publications spred i Nordamerika från 1977 och en Saudiarabien-sponsrad revidering från 1980-talet.
hero.4=Det som digitaliserats här, via alquran.cloud, är själva översättningstexten snarare än Yusuf Alis medföljande kommentar, och den erbjuds i detta korpus som en andra engelsk följeöversättning till [[Q-AR|den uthmanska arabiska texten]], vid sidan av [[Q-EN|Pickthalls]] från 1930. Den var en av bara två engelska återgivningar som en genomgång av tillgängliga översättningar fann otvetydigt fria att kopiera — denna och Pickthalls — även om "otvetydigt" här behöver en förbehåll: verket är fritt att kopiera inom EU och i Pakistan, där Yusuf Ali dog och där verket först gavs ut, men en formell upphovsrätt registrerad i USA 1996 anses gälla där till 2033.

