title=American Standard Version — عن هذه الطبعة | Common Root
description=طبعة American Standard Version الصادرة سنة 1901: الطبعة الأمريكية من Revised Version، صنعها علماء أمضوا عشرين سنة يصححون ترجمة الملك جيمس بالمراسلة، وهي أصل Revised Standard Version وNew American Standard Bible وWorld English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=بدأت American Standard Version مشروعًا لغيرها. فلما شرعت كنيسة إنجلترا سنة 1870 في تنقيح ترجمة الملك جيمس، دعت علماء أمريكيين إلى المشاركة، فشاركوا — بالمراسلة، عبر الأطلسي، قرابة عقدين من الزمان. وحيث اختلف الجانبان، دخلت قراءة اللجنة البريطانية في المتن ودخل ما فضّله الأمريكيون في ملحق، وتعهد الأمريكيون بألا يخرجوا طبعة خاصة بهم أربع عشرة سنة. وصدرت Revised Version الإنجليزية سنة 1881 وسنة 1885. وتلتها الطبعة الأمريكية سنة 1901، وقد رُفعت قراءات الملحق إلى المتن حيث أرادها محرروها منذ البداية.
hero.2=هي ترجمة صنعها علماء لعلماء، وهكذا تُقرأ. التزم المنقّحون بترتيب الكلمات العبري واليوناني إلى الحد الذي تحتمله الإنجليزية، فجاءت American Standard Version دقيقة، ومتيبّسة في مقاطع طويلة. وأظهر قراراتها ما يتعلق بالاسم الإلهي: حيث طبعت ترجمة الملك جيمس “the LORD” بحروف كبيرة صغيرة، تطبع American Standard Version “Jehovah” آلاف المرات في العهد القديم كله. وفي العهد الجديد تتبع يونانية المنقّحين لا النص المستلم، فالقراءات التي كانت بين يدي مترجمي الملك جيمس ولا تحملها المخطوطات الأقدم — ومنها الجملة الثالوثية في رسالة يوحنا الأولى 5:7 — إما في الحاشية وإما غائبة.
hero.3=لم تصر American Standard Version كتابًا مقدسًا لمقاعد الكنائس. الذي صارته أنها أصل. فقد كانت Revised Standard Version الصادرة سنة 1952 تنقيحًا لها؛ وكذلك New American Standard Bible، وهي في هذه المجموعة أيضًا؛ وكذلك World English Bible التي حملتها إلى الملك العام بإملاء حديث. ولهذا موضعها حيث هو في درجات النسب لدى القارئ — وسط أطول سلسلة تملكها هذه المجموعة. افتح درجة تحت آية من ASV فتظهر تحتها Revised Version التي صُنعت منها، وتحتها ترجمة الملك جيمس وكتاب جنيف المقدس، نزولًا إلى قاع اللغات الأصلية المعلَّم بالرمز ≈. وافتح درجة تحت آية من World English Bible فتعود إلى هنا.

