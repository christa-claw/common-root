title=Textus Receptus — Bu baskı hakkında | Common Root
description=Textus Receptus: Luther'in, Tyndale'in ve Kral James Çevirisi'nin ardında duran basılı Yunanca Yeni Ahit; ilk kez 1516'da Erasmus tarafından yayına hazırlandı ve adını 1633 tarihli bir kitapçı reklamından aldı.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Bu derlemedeki her Reform dönemi İncil'i, 1516'da Basel'de basılan bir kitaptan gelir. Rotterdamlı Erasmus Yunanca Yeni Ahit'i herkesten önce baskıya vermek istiyordu ve hızlı çalıştı — Basel'de ulaşabildiği bir avuç geç tarihli elyazmasından yola çıkarak; hiçbiri özellikle eski değildi. Vahiy'in elindeki nüshasının son yaprağı eksik olduğu yerde, son altı ayeti Latince Vulgata'dan Yunancaya geri çevirdi. O ayetler baskıya girdi ve dört yüzyıl orada kaldı.
hero.2=Metin yüz yıl boyunca düzeltilip yeniden basıldı — önce Erasmus'un kendisi, sonra Paris'te Robert Estienne ve Cenevre'de Theodore Beza tarafından. Estienne'in 1551 tarihli dördüncü baskısı, sonuçları bilim çevresinin çok ötesine geçen bir şey yaptı: metni numaralandırılmış ayetlere böldü. Bunlar dünyadaki hemen her İncil'de hâlâ basılan ayet numaralarıdır — ve bu okuyucunun kapatmaya izin verdiği numaralar.
hero.3=Ad en son geldi ve reklamdan geldi. 1633'te Leidenli Elzevir kardeşler baskılarını, okurun artık “herkesçe kabul edilmiş metne” sahip olduğu sözüyle tanıttılar — textus receptus. Bu bir kitapçının iddiasıydı, bilimsel bir hüküm değil, ama tuttu. On dokuzuncu yüzyılda daha eski elyazmaları ortaya çıktığında, Tischendorf'tan Westcott ve Hort'a uzanan yayımcılar bunların üzerine yeni metinler kurdular ve modern çeviriler onları izliyor. Textus Receptus burada önemini veren nedenle duruyor: Luther'in, Tyndale'in, Cenevre çevirmenlerinin ve Kral James kurullarının önünde gerçekten duran metin buydu; dolayısıyla onların söz seçimleri buna karşı okunmalıdır.

