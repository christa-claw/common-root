title=Svenska 1917 — Über diese Ausgabe | Common Root
description=Die Übersetzung der Schwedischen Kirche von 1917 — Gustav V:s bibel — die erste schwedische Bibel, die direkt aus dem Hebräischen und Griechischen gemacht wurde statt aus der vorigen revidiert zu sein, und die einzige schwedische Bibel, die dieses Korpus führt.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Dreieinhalb Jahrhunderte lang hatte die Schwedische Kirche eine einzige Bibel, revidiert, aber nie neu gemacht. Gustav Vasas Bibel von 1541, die erste vollständige, auf Schwedisch gedruckte Bibel, stützte sich stark auf Martin Luthers Deutsch. Gustav II. Adolfs Bibel von 1618 revidierte sie, und Karl XII:s bibel von 1703 — vollendet unter einem König, obwohl von seinem Vater vor ihm angeordnet — trug dasselbe überlieferte Schwedisch einen Schritt weiter. Keine der drei fing noch einmal von vorn an.
hero.2=1773 ernannte Gustav III. eine Bibelkommission, um das zu tun, was keine jener Revisionen getan hatte: direkt aus dem Hebräischen und Griechischen zu übersetzen, statt das alte Schwedische noch einmal weiterzutragen. Die Kommission saß 144 Jahre. Ihr Ergebnis — die zweite vollständige Bibelübersetzung Schwedens, nach der von Gustav Vasa und vor Bibel 2000 — wurde 1917 unter Gustav V. vollendet und genehmigt, und wird deshalb bis heute oft Gustav V:s bibel genannt.
hero.3=Das Alte Testament ruht auf dem masoretischen hebräischen Text, wie die Ausgaben davor. Das Neue Testament setzt deren Linie nicht fort: es folgt dem aktuellsten kritischen griechischen Text, den die Kommission um 1917 zur Verfügung hatte, statt dem Textus Receptus, auf dem die Bibeln der Reformationszeit beruhen, die dieses Korpus führt.
hero.4=In diesem Leser ist sie die einzige schwedische Bibel, sodass die Oberfläche auf Schwedisch gestellt auf ihr öffnet — nicht als kuratierte Wahl, wie die Reina-Valera 1909 fürs Spanische gewählt ist, sondern weil der Katalogdurchgang in der Sprache nichts anderes findet. Für sie ist kein Vorfahre in den Abstammungssprossen verzeichnet, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden fällt. Dieser Boden liefert fürs Griechische den Textus Receptus, und hier liegt das weiter von der Wahrheit entfernt als sonst: die Kommission ließ den Textus Receptus bewusst hinter sich, für einen aktuelleren kritischen Text, sodass der Boden unter einem Vers dieser Übersetzung einen griechischen Text nennt, der nicht der ist, dem sie tatsächlich folgte.

