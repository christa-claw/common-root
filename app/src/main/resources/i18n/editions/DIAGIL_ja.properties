title=エンファティック・ダイアグロット（行間訳） — この版について | Common Root
description=ベンジャミン・ウィルソンによる1864年のエンファティック・ダイアグロット——グリースバッハのギリシャ語の下に印刷された逐語的な英語の行間訳であり、のちにものみの塔協会に買い取られて六十年にわたり重版され、ヨハネ1章1節の論争がたいてい舞台とする本文。
heroHeading=エンファティック・ダイアグロット（行間訳）
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=ベンジャミン・ウィルソンは職業的な学者ではなかった。イリノイ州ジェニーヴァで新聞の編集者を務めながら独学でギリシャ語を学んだ人物であり、1857年から1863年にかけて、一冊ずつ分冊の形で行間訳の新約聖書を世に送り出した——それは彼が翻訳しただけでなく、自らの手で製造したものでもあった。甥が見ていたところによれば、彼は組版した各ページから蝋型を取り、それを一晩酸に漬けて銅の膜を育て、その銅に鋳物の金属を裏打ちし、少年が版にインクを塗る間、手引き印刷機でその結果を刷っていた。完成した一冊は1864年に世に出た。ギリシャ語本文には、ヨハン・ヤーコプ・グリースバッハが1770年代に確立した本文を、バチカン写本から得た異読とともに用いた。
hero.2=ウィルソンが実際に印刷したのは、一つではなく二つの英語本文だった。ページの左側には各語の下に逐語的な英語の逐語訳を添えたギリシャ語が走り、右側には彼自身が練り上げた訳文——エンファティック・バージョン——が走っていた。両者は同じではなく、ヨハネ1章1節では真っ向から対立する——逐語訳は「and a god was the Word」と読ませ、エンファティック・バージョンは「and the LOGOS was God」と読ませる。どちらもウィルソン自身の手によるもので、同じ一冊の中に、わずか数センチ離れて印刷されている。このコーパスが収めているのは逐語訳の列であり、それは人々が引用する列であって、それゆえ聖書の一覧表の中ではなく、独立した区分に置かれている。逐語訳が記録しているのは、ギリシャ語の文がどのように組み立てられているか——格ごとに、冠詞ごとに、ギリシャ語の語順のままに——であって、その文を英語としてどう読むべきかについての判断ではない。その判断にあたるウィルソン自身の見解は、隣の列に印刷されている。片方を引用する者は、もう片方が存在することを知っておくべきである。
hero.3=この書物がほとんどの人に知られている理由は、その後の経歴にある。ウィルソンは1900年に、ブレッセド・ホープ教会の一員として世を去った——当時「エホバの証人」の名で存在していたどの団体の一員でもなかった。1902年、ものみの塔聖書冊子協会の会長チャールズ・テイズ・ラッセルがウィルソンの遺族から著作権を取得し、やがて印刷版も手に入れた。同協会はその後六十年にわたってダイアグロットを印刷し続けた——1927年には自社の印刷所で活字を組み直し、十五万部を優に超える部数を刷り、二ドルで販売し、やがては無償で配布するようになった。したがってダイアグロットは、著作によってではなく継承によってエホバの証人の書物となったのであり、著者たちがヘブライ語聖書を引用する際にκύριοςと書いた箇所に新約聖書で「Jehovah」（エホバ）を印刷するその習慣は、その用法を有名にした運動が現れるよりも四十年早く生まれていたことになる。著作権は1952年に失効し、それ以来パブリックドメインである。
hero.4=このリーダーでこれを使う前に知っておく価値のある点が二つある。グリースバッハはいずれも印刷しなかったため、使徒8章37節とルカ17章36節はここにはない。欠落を詰めて以降の節をすべて一つ前に詰めるのではなく、番号の付け方はその二箇所を空のままにしており、したがって参照はこの列でも隣の列でも同じ節に着地する。そしてこれには母本が記録されていないため、ダイアグロットの節の下で系譜の段を開くと、より古い英語版にではなく、直接原語の底面に至る。
hero.5=その底面が印刷しているものについては、正確であるべきだ。そこに示されるギリシャ語はテクストゥス・レセプトゥスである——チップには ≈ TR 1550 と表示され、この ≈ は、この版が作られた本文そのものではなく、ギリシャ語への一つの証言を提供しているにすぎないと、リーダー自身が告げているしるしである。ウィルソンはグリースバッハに基づいて作業した。ヨハネ1章1節のように両者が一致する箇所では、段はまさに逐語訳されている語そのものを示す。両者が分かれる箇所ではそうではない——グリースバッハは1ヨハネ5章7節の三位一体句を排除したため、ダイアグロットにはその痕跡がまったくないが、その下のテクストゥス・レセプトゥスの行はそれを全文のまま収めている。ギリシャ語がページの上にそのまま置かれているということを前提とする行間訳において、それこそが引用する前に知っておく価値のある唯一の隙間である。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=これは何か
fact.1.value=ギリシャ語の下に印刷された逐語訳——語ごとの英語であり、ウィルソンの読みやすい訳文ではない
fact.2.label=編者
fact.2.value=ベンジャミン・ウィルソン（1817–1900）、イリノイ州ジェニーヴァの独学の学者・新聞編集者
fact.3.label=ギリシャ語本文
fact.3.value=グリースバッハの校訂本文——バチカン写本（写本1209番）の異読を伴う
fact.4.label=出版
fact.4.value=1857年から分冊で刊行され、1864年にニューヨークのFowler and Wells社から一冊本として完結した
fact.5.label=印刷の方法
fact.5.value=ウィルソンは自らすべての版を電気版で作り、初版を手引き印刷機で刷った
fact.6.label=神の御名
fact.6.value=著者たちがヘブライ語聖書を引用してκύριοςと書いた箇所に、新約聖書で「Jehovah」（エホバ）と印刷している——[[ASV|アメリカン・スタンダード・バージョン]]が旧約聖書全体で下したのと同じ判断である
fact.7.label=取得
fact.7.value=ものみの塔聖書冊子協会——1902年にチャールズ・テイズ・ラッセルのもとで著作権を取得し、1927年に活字を組み直し、1960年代まで印刷を続けた
fact.8.label=ライセンス
fact.8.value=パブリックドメイン——著作権は1952年に失効し、ものみの塔による重版が新たな著作権を加えることもなかった
fact.9.label=欠けている二つの節
fact.9.value=使徒8章37節とルカ17章36節はグリースバッハにないため、ここにもない。番号は詰めずに空のまま残されており、したがって本文は他のどの版とも節ごとに対応したままである
fact.10.label=段の下のギリシャ語
fact.10.value=[[TR|テクストゥス・レセプトゥス]]、≈ TR 1550として示される——ギリシャ語への証言であり、ウィルソンの底本であるグリースバッハの校訂本文ではない。両者はヨハネ1章1節で一致し、1ヨハネ5章7節で分かれる
fact.11.label=このコーパスでは
fact.11.value=読書用の聖書とは別に、独自の「行間訳・研究版」区分に置かれており、逐語訳が翻訳と取り違えられることのないようにしている。系譜の段には母本が記録されていないため、段を開くと直接原語の底面に至る
