title=Brenton Yunanca Septuaginta — Bu baskı hakkında | Common Root
description=Septuaginta — Yahudi diasporasının ve erken Kilise'nin Yunanca Eski Antlaşması — Lancelot Brenton'un 1851'de kendi İngilizcesinin yanına bastığı Yunanca metinle; bu okuyucuda Vulgata'nın ve Rusça Sinodal Çeviri'nin altındaki basamak.
heroHeading=Brenton Yunanca Septuaginta
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=Septuaginta, İbranice Kutsal Kitap'ın en eski çevirisidir ve ilk Hristiyan yüzyıllarında düpedüz Kutsal Kitap'ın kendisiydi. İskenderiye'deki Yunanca konuşan Yahudiler işe Yasa'nın beş kitabıyla, büyük olasılıkla MÖ 3. yüzyılda başladılar; öbür kitaplar sonraki iki yüzyıl içinde geldi. Ad bir öyküden gelir: Aristeas Mektubu, Kral II. Ptolemaios için Yasa'yı çevirmek üzere Kudüs'ten gönderilen yetmiş iki ihtiyardan söz eder ve “Yetmişler” — Roma rakamlarıyla LXX — bütün Yunanca Eski Antlaşma'nın adı oldu. Yeni Antlaşma yazarları ondan durmadan alıntı yapar, erken Kilise onu okurdu, Ortodoks kiliseleri de onu bugün hâlâ Eski Antlaşma olarak okur.
hero.2=Önemi yaşından ibaret değildir. Çevirmenler, sonradan ölçüt hâline gelen Masoretik metinden yer yer ayrılan İbranice elyazmalarından çalıştılar — örneğin Yeremya Yunancada belirgin biçimde daha kısadır — bu yüzden Septuaginta pek çok yerde, İbrani geleneğin kendisinin korumadığı bir İbranice okumanın en eski tanığıdır. İbrani kanonunda bulunmayan kitapları da içerir; aralarında Tobit, Yudit, Bilgelik, Sirak ve Baruk vardır. Bazı sözcük seçimleri de öğretiye dönüştü: İbranicede ʿalmah, yani genç kadın denen Yeşaya 7:14'te Yunanca parthenos, yani bakire der — Matta'nın alıntıladığı sözcük budur.
hero.3=Buradaki Yunanca, Sir Lancelot Brenton'un bastığı metindir. Brenton 1844'te Septuaginta'nın İngilizce bir çevirisini yayımladı; çeviri esas olarak Vatikan Kütüphanesi'ndeki 4. yüzyıl elyazması Codex Vaticanus'a dayanıyordu. 1851'de Londralı Samuel Bagster onu, apokrif kitaplar eklenmiş ve Yunanca İngilizcenin yanına konmuş olarak yeniden yayımladı; bu derlemedeki de o Yunancadır. Mezmurları Yunanca numaralandırmayı korur; buradaki Vulgata da aynı numaralandırmayı paylaşır: ikisinde de 22. Mezmur çoban mezmurudur, İbranicede ve çoğu İngilizce Kutsal Kitap'ta ise 23. Mezmur. 151 mezmur vardır; Ezra ile Nehemya tek bir kitaptır; Ester ve Daniel daha uzun Yunanca biçimleriyle yer alır.
hero.4=Bu okuyucuda o bir zemin değil, bir basamaktır. Latince Vulgata'nın altında durur, çünkü Vulgata'nın bir bölümü Yunanca üzerinden gelmiştir: Mezmurlar kitabı, Hieronymus'un Origenes'in Hexapla'sındaki Yunancadan yaptığı ve kendi İbranice çevirisinin hiçbir zaman yerinden edemediği metindir; Bilgelik, Sirak ve Baruk ise Yunancadan yapılmış Eski Latince çevirilerde bırakılmıştır. Rusça Sinodal Çeviri'nin altında durur; onun Eski Antlaşması, arkasındaki Kilise Slavcası Kutsal Kitap'tan gelen pek çok Septuaginta okumasını korumuştur. Brenton'un kendi İngilizce çevirisinin de altındadır. Kendisinin kayıtlı bir öncülü yoktur: çevrildiği İbranice metin derlemede yoktur; Leningrad Kodeksi ise — bin yıldan fazla daha genç ve Masoretik çizgiden — altında yalnızca özgün dillerin zemini olarak görünür. Yalnızca Eski Antlaşma'yı kapsar, bu yüzden bir Yeni Antlaşma ayetinin altında bu basamak atlanır — ayrıca Yunanca geleneğin her kitabı burada değildir: bu nüshada 45 kitap vardır ve Makabeler kitaplarından hiçbiri yoktur.

