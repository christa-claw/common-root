fact.6.label=翻訳の方針
fact.6.value=形式的対応。ロバート・ヤングの1898年のLiteral Translationの大規模な改訂として提示されており、三つの原則を掲げている——可能な限り原文の動詞の時制を保持すること、一貫性が許す限り与えられた語を同じ英語の語で訳すこと、英語の読みやすさが別の対応を求める場合を除き原文の語順を保つこと。旧約聖書の神の名は「主」のような称号で訳すのではなく音訳されている
fact.7.label=出版
fact.7.value=改訂作業は2018年初頭に開始され、2020年2月2日に完了・出版された。米国の著作権は同年1月に登録され、電子書籍版は2020年5月に続いた
fact.8.label=ライセンス
fact.8.value=クリエイティブ・コモンズ 表示-継承 4.0——出典を示し、変更箇所を明示し、成果を同じライセンスで公開することを条件に、商用・非商用を問わず自由に複写・印刷・翻訳・改作できる。著作権はCovenant PressとCovenant Christian Coalitionが保持する(© 2020年)
fact.9.label=このコーパスでは
fact.9.value=[[NIV|ニュー・インターナショナル・バージョン]]や[[NASB|ニュー・アメリカン・スタンダード・バイブル]]と同様、パブリックドメインではなくライセンスされている——自由に複写できるものではなくライセンスされた版であるが、両者よりも著しく緩やかな条件のもとにある。系譜の段には親版が記録されていない。ロバート・ヤングのLiteral Translationの改訂として提示されており、その原典自体は本コーパスに保持されていないため、LSVの一節の下の段は≈と記された原語の底まで直接下りる。英語インターフェースは標準でニュー・インターナショナル・バージョンを開き、本版には自分自身のカードから到達する。
