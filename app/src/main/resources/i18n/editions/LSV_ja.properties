title=Literal Standard Version — この版について | Common Root
description=Literal Standard Version:Covenant Pressによる、十九世紀のロバート・ヤングのLiteral Translationの2020年改訂版。読みやすい英語が許す限り、ヘブライ語・アラム語・ギリシャ語に最も一貫して逐語的な英訳を与えることを目指している。
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Versionは、ロバート・ヤングによる十九世紀の極めて逐語的な英訳聖書Literal Translation(1862年に初版、ヤング自身により1887年と1898年に改訂)の大規模な改訂版として自らを位置づけている。Covenant Christian Coalitionの出版部門であるCovenant Pressは、2018年初頭にこの新たな改訂作業に着手した。その目的は、ヤングの逐語的な直訳への姿勢を保持しながら、英語表現を現代化し、後の写本研究および語彙研究が進んだ箇所を修正することにあったとされる。作業は完了し、2020年2月2日に出版された。米国の著作権は同年1月に登録され、電子書籍版は同年5月に続いた。出版版には個々の翻訳者の名前は記されていない。委嘱機関としてCovenant PressとCovenant Christian Coalitionが挙げられている。
hero.2=旧約聖書についてLSVはマソラ本文に従い、七十人訳(セプトゥアギンタ)の大きな影響を受けつつ、死海文書の異読が十分に明確と見られる場合にはそれを時おり参照している。新約聖書については公認本文(Textus Receptus)と多数派本文に従い、アレクサンドリア系の異読は一般的な方針としてではなく、特定かつ明示された場合にのみ採用している。翻訳者たちは三つの指導原則を定めた。英語が許す限り原文の動詞の時制を保持すること、一貫性が許す限り原語のある語を同じ英語の語で訳すこと、そして英語の読みやすさが本当に変更を求める場合を除き、原文の語順を保つことである。旧約聖書の神の名は、「主」のような称号で訳すのではなく音訳されており、読者に原文自身の選択をそのまま示し、それを均してしまわないという本訳の全般的な方針に沿っている。
hero.3=本コーパスとの関係は、系譜的というより文献的なものである。Literal Standard Versionの新約聖書は公認本文と多数派本文に依拠しており、これは本コーパスが別途「公認本文」として全文を保持している同一のギリシャ語底本——欽定訳(King James Version)および宗教改革期の伝統一般の基礎となった本文——である。この二つの版を結ぶ系譜の段は存在しない。LSVは公認本文そのものや本コーパスに保持されているいかなる本文の改訂ではなく、ヤングのLiteral Translationの改訂として提示されているためであり、したがってLSVの一節の下に開かれる段は、≈と記された原語の底まで直接下りる。本訳はパブリックドメインに委ねられるのではなく、クリエイティブ・コモンズ 表示-継承 4.0 ライセンスのもとで公開されており、これによりニュー・インターナショナル・バージョンおよびニュー・アメリカン・スタンダード・バイブルと並んで、自由に複写できるものではなくライセンスされた版の一つとなっている——ただし両者よりも著しく緩やかな条件のもとにある。英語インターフェースは標準でニュー・インターナショナル・バージョンを開き、本版には自分自身のカードから到達する。

