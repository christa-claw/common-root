title=Smith & Van Dyck (texte eBible) — À propos de cette édition | Common Root
description=La Bible arabe de Smith et Van Dyck de 1865, dans le texte électronique entièrement vocalisé qu'eBible.org publie comme relevant du domaine public, d'après le fichier source de l'American Bible Society.
heroHeading=Smith & Van Dyck — le texte entièrement vocalisé
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Ceci est la même traduction que [[SVD|Smith & Van Dyck]] — la Bible arabe qu'Eli Smith commença à Beyrouth et que Cornelius Van Dyck acheva en 1865, avec les lettrés arabes Butrus al-Bustani, Nasif al-Yaziji et Yusuf al-Asir — composée à partir d'un fichier électronique différent. La traduction est la même ; le fichier est la raison pour laquelle cette édition existe.
hero.2=Une Bible de 1865 est libre pour quiconque, mais une copie électronique de celle-ci est elle aussi le travail de quelqu'un, et le texte de Van Dyck circule sur le web en de nombreuses copies d'origine incertaine. Certaines sont proposées avec une revendication de droit d'auteur sur la transcription elle-même. Un texte dont l'origine ne peut être retracée ne peut être imprimé en toute confiance, cette édition utilise donc une copie dont l'origine le peut : celle que publie eBible.org, déclarée du domaine public, nommant la Mission syrienne comme traductrice et l'American Bible Society comme contributrice de la source. Le fichier porte la date du 2020-08-03.
hero.3=Il est entièrement vocalisé. Chaque mot porte ses voyelles brèves et les autres signes de lecture, là où l'autre texte de Van Dyck dans ce lecteur est en grande partie non vocalisé. Cela le rend plus lent à composer et plus facile à lire à voix haute, et une page vocalisée demande plus d'espace entre les lignes, si bien qu'un exemplaire imprimé de cette édition est plus long que le même texte non vocalisé.
hero.4=C'est l'édition à choisir quand la question est de savoir si le texte peut être imprimé. Pour une lecture à l'écran, l'un ou l'autre des deux Van Dyck convient aussi bien.

