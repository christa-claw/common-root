title=艾布·达乌德圣训集 — 关于此版本 | Common Root
description=艾布·达乌德圣训集：艾布·达乌德·西吉斯坦尼因其与伊斯兰教法的关联而编纂的圣训集，从他考证过的约500,000则传述中选录，并按法学主题编排——逊尼派六大圣训集中的第三部。
heroHeading=艾布·达乌德圣训集
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=艾布·达乌德·苏莱曼·伊本·阿什阿斯·阿兹迪·西吉斯坦尼大约于希吉拉历202年（公元817—818年）生于锡吉斯坦，呼罗珊的一个省份，今天位于伊朗与阿富汗的边境地带。他十八岁时到达巴格达，此后又游历呼罗珊、伊拉克、希贾兹、叙利亚、埃及和尼沙普尔以求学圣训，师从约300位学者，其中包括艾哈迈德·伊本·罕百勒。他最终定居巴士拉，于希吉拉历275年舍瓦鲁月的一个星期五（公元889年）去世，享年七十三岁，葬于法学家苏菲扬·萨乌里墓旁。
hero.2=他的兴趣专门集中在法学上：与布哈里圣训实录和穆斯林圣训实录兼顾信仰、历史与法律不同，艾布·达乌德围绕与教法（菲格赫）相关的圣训构建了他的圣训集，将其编排为依循法学家所需主题展开的若干卷——从净身、礼拜到天课、斋戒、婚姻、遗产、司法等。据其弟子伊本·达萨所述，他在收集材料时考证了约500,000则圣训传述。他还为此设立了与布哈里和穆斯林不同的标准：后两者只采纳他们判定为完全可靠的圣训，而艾布·达乌德在没有更可靠的传述涉及某一法学问题时，会收入一些穆尔萨勒（传承链不全）、弱传（达伊夫）甚至蒙克尔（严重存疑）的传述，并在致麦加居民的一封信中说明了自己的方法，还亲自标明了这些较弱的评级，而不是不加说明地留下它们。
hero.3=逊尼派传统将艾布·达乌德圣训集列为六大圣训集中的第三部，次于布哈里圣训实录和穆斯林圣训实录；至于它与提尔米济圣训实录、奈萨仪圣训实录和伊本·马哲圣训实录在其余四部之间究竟如何排序，学界长期争论而未有定论。该书所载的数字彼此并不一致，而这种不一致似乎从未被解释清楚：伊本·达萨所述艾布·达乌德选录的数字是4,800则，而现代标准版本——由穆罕默德·穆希丁·阿卜杜勒-哈米德编订、1935年在开罗印行——则编号至5,274则。本语料库自身的数字，43卷、5,274则圣训，恰好与那部开罗版本的编号相符，这使它在此处比布哈里圣训实录或穆斯林圣训实录站在更稳固的基础上，因为在那两部书中，本语料库的数字并不对应任何单一的印本传统。
hero.4=这里的阿拉伯语文本是公有领域的古典正文（matn）。在阅读器中，其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-abudawud版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在布哈里圣训实录、穆斯林圣训实录及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

