fact.2.label=编纂者
fact.2.value=艾布·达乌德·苏莱曼·伊本·阿什阿斯·阿兹迪·西吉斯坦尼（希吉拉历202–275年 / 公元817–889年）
fact.3.label=名称
fact.3.value=通称《艾布·达乌德圣训集》；与[[BUK|布哈里圣训实录]]不同，没有另行记录的正式全称
fact.4.label=编纂地点与时间
fact.4.value=于游历呼罗珊、伊拉克、希贾兹、叙利亚、埃及和尼沙普尔期间收集；艾布·达乌德最终定居并卒于巴士拉
fact.5.label=方法
fact.5.value=按法学主题（菲格赫）而非传述人或年代编排；在没有更可靠传述涉及某一法学问题时，收入部分弱传、穆尔萨勒和蒙克尔圣训，并明确标明
fact.6.label=地位
fact.6.value=逊尼派六大圣训集（库图布·西塔）中的第三部，次于[[BUK|布哈里圣训实录]]和[[MUS|穆斯林圣训实录]]；它在其余三部中的具体排序仍存争议，未有定论
fact.7.label=圣训数量
fact.7.value=据艾布·达乌德弟子伊本·达萨所述为4,800则选录，或据1935年开罗版（穆罕默德·穆希丁·阿卜杜勒-哈米德编订）标准本为5,274则；两个数字在文献中并未得到调和
fact.8.label=在本语料库中
fact.8.value=43卷、5,274则编号圣训——恰好与1935年开罗版的编号相符
fact.9.label=英译文
fact.9.value=取自fawazahmed0/hadith-api的eng-abudawud版本，在阿拉伯语下方作为伴读显示；它究竟源自哪一个已出版译本，本语料库尚未确认
fact.10.label=许可
