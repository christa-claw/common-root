title=Biblia 1642 — Bu Baskı Hakkında | Common Root
description=Biblia 1642: Fincedeki ilk tam Kutsal Kitap; Turku'da dört bilgin tarafından üç yılda çevrildi ve İsveç Kraliçesi Christina'nın himayesinde basıldı.
