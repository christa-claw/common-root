# The narrative, one paragraph per key, in order.
hero.1=Fincedeki ilk tam Kutsal Kitap. Ondan önce Mikael Agricola'nın 1548 tarihli Yeni Antlaşması ve Eski Antlaşmanın 1550'lerde yayımlanan parçaları vardı; ondan sonra, güçbela yazıya geçirilmiş bir dilde eksiksiz bir Kutsal Kitap oldu. İşi 1638 ile 1641 arasında dört bilgin yaptı — Eskil Petraeus, Martinus Stodius, Henricus Hoffman ve Gregorius Matthaei — projeyi sonuna kadar götüren Turku piskoposu Isaacus Rothovius'un gözetiminde. Finlandiya İsveç'in parçasıydı ve cilt 1642'de Kraliçe Christina'nın himayesinde çıktı. Bir kuşak önce de bir girişim olmuştu: 1602'de, muhtemelen Turku piskoposu Ericus Erici Sorolainen'in başkanlığında bir Kutsal Kitap çeviri kurulu atandı. Kurul anlaşılan taslaklar üretti ama bunları hiçbir zaman bir Kutsal Kitap hâline getiremedi ve akıbetleri büyük ölçüde kayıp — yine de bu çalışmanın 1642 çevirisinde iz bıraktığı düşünülür.
hero.2=İbraniceden ve Yunancadan, Luther'in Almancası yanlarında olarak çevirdiler. Gustav Vasa'nın İsveççe Kutsal Kitabı masadaki öteki kitaptı; o bu derlemede yok, bu yüzden zincir burada Luther'i — ve yanında, kurulun elden geçirdiği taban metni, Agricola'nın 1548 Fincesini — kaydediyor. 1642 Biblia'sının daha büyük etkisi Fincenin kendisine oldu. Yazılı düzyazısı neredeyse hiç olmayan bir dil, tek bir ciltte hukuktan ağıta kadar her şey için bir söz dağarcığı ve bir tartım kazandı — ve sonraki her Fince Kutsal Kitap onun bir gözden geçirmesi ya da ardılıdır, yeni bir başlangıç değil.
hero.3=Bu okuyucuda 1642 baskısı iki Fin basamağının arasında durur. Kirkkoraamattu 1933/38'in üç basamak altında, Biblia 1776'nın altında bu baskı belirir; onun altında da iki kaynak yan yana — kurulun elden geçirdiği taban metin olan Agricola'nın 1548 Fincesi ile masada açık duran Luther'in 1545 Almancası. Bir basamak daha aşağıda zincir Finceyi bir daha dönmemek üzere terk etmiştir. Buradaki metin Kotus'un eski yazılı Fince VKS derleminden gelir; gördüğünüz imlânın — «tulcon walkeus» — 1642 baskısının kendi imlâsı olması ve modernleştirilmemiş olması bundandır.

