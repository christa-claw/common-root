title=Agricola 1548 — Acerca de esta edición | Common Root
description=El finés de Mikael Agricola: el Nuevo Testamento de 1548, el Salterio de 1551 y los profetas — la primera Escritura impresa en finés y el comienzo mismo del finés escrito.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Con agradecimiento a quienes enviaron correcciones a esta página.

# The narrative, one paragraph per key, in order.
hero.1=El finés impreso más antiguo que existe. Cuando Mikael Agricola publicó Se Wsi Testamenti en 1548, el finés casi nunca había pasado por una imprenta: su propio abecedario, de unos años antes, fue sencillamente el primer libro finés. Entre ambos apareció aún el devocionario de 1544, obra de gran extensión que ya contenía traducciones de salmos. Para imprimir la Escritura tuvo que decidir primero cómo se escribía la lengua, y esas decisiones — la ortografía, los préstamos, la cadencia — son donde empieza el finés escrito. El Nuevo Testamento le llevó, a él y a su círculo de Turku, más de una década; el Salterio siguió en 1551, y las selecciones de los profetas y de los libros de Moisés en 1551 y 1552. El suyo fue, con todo, el primer finés impreso, no el primero escrito: cuatro manuscritos —el Codex Westh, el códice B 28 de Upsala, el misal de Kangasala y el fragmento de Upsala— contienen pasajes bíblicos en finés, y Kauko Pirinen demostró en 1988, comparándolos con sus fuentes suecas, que partes de ellos son más antiguas que cuanto Agricola imprimió, quizá escritas ya en la década de 1530.
hero.2=Nunca tradujo la Biblia entera, y este lector no finge lo contrario. El Nuevo Testamento y los 150 salmos están completos; los profetas y los libros de Moisés aparecen en selección. También está aquí lo que vertió en otros lugares: su devocionario de 1544 y su Käsikirja y su Messu de 1549 llevan texto bíblico propio — entre él los capítulos del Génesis impresos bajo el título "Genesist mutomat Lughut" — y 685 versículos proceden de ahí. Solo se usan donde los volúmenes de escritura no tienen versículo en esa dirección, y solo donde el texto corre de forma continua en vez de figurar como cita suelta dentro de una oración. Así que el Génesis sí está, en parte: capítulos 1–4, 22, 28 y 32. Jueces, Rut, 1 Crónicas y Ester faltan por completo. Un Antiguo Testamento finés completo tuvo que esperar a la Biblia de 1642, un peldaño más arriba.
hero.3=En este lector, Agricola es el peldaño finés más antiguo. Abra un peldaño bajo un versículo de la Biblia de 1642 y su texto aparece junto al alemán de Lutero — las dos fuentes que el comité de 1642 tenía realmente abiertas. Bajo el propio Agricola la cadena abandona el finés para siempre: trabajó con el griego de Erasmo y con el latín que Erasmo imprimió a su lado, con el alemán de Lutero y con la Vulgata. Tres de ellos constan aquí como sus padres; el latín de Erasmo y la Biblia sueca de Gustavo Vasa de 1541, que también usó, no están en este corpus. El texto es el del corpus VKS de Kotus, con la grafía de la impresión de 1548: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". La Escritura en sueco estaba impresa desde 1526, cuando apareció el Nuevo Testamento sueco, de modo que una versión sueca estuvo a su alcance desde el principio.

