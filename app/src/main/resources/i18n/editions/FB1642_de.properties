# The narrative, one paragraph per key, in order.
hero.1=Die erste vollständige Bibel auf Finnisch. Vorher gab es Mikael Agricolas Neues Testament von 1548 und in den 1550er Jahren erschienene Teile des Alten; danach gab es eine ganze Bibel in einer Sprache, die kaum geschrieben worden war. Vier Gelehrte leisteten die Arbeit zwischen 1638 und 1641 — Eskil Petraeus, Martinus Stodius, Henricus Hoffman und Gregorius Matthaei — unter Isaacus Rothovius, dem Bischof von Turku, der das Vorhaben durchsetzte. Finnland gehörte zu Schweden, und der Band erschien 1642 unter der Schirmherrschaft der Königin Christina. Ein Versuch war eine Generation früher gemacht worden: 1602 wurde eine Bibelübersetzungskommission eingesetzt, wahrscheinlich unter Ericus Erici Sorolainen, Bischof von Turku. Sie brachte offenbar Entwürfe hervor, fügte sie aber nie zu einer Bibel zusammen, und ihr Verbleib ist weitgehend unbekannt — die Arbeit soll gleichwohl auf die Übersetzung von 1642 gewirkt haben.
hero.2=Sie übersetzten aus dem Hebräischen und dem Griechischen, mit Luthers Deutsch daneben. Die schwedische Bibel Gustav Wasas war das andere Buch auf dem Tisch; sie ist nicht in diesem Korpus, deshalb verzeichnet die Kette hier den Luther — und daneben Agricolas Finnisch von 1548, den Grundtext, den die Kommission überarbeitete. Die größere Wirkung der Biblia von 1642 betraf das Finnische selbst. Eine Sprache fast ohne geschriebene Prosa erhielt in einem Band ein Vokabular und einen Tonfall für alles von der Rechtsurkunde bis zur Klage, und jede spätere finnische Bibel ist eine Revision oder Nachfolgerin von ihr und kein Neuanfang.
hero.3=In diesem Reader steht die 1642er zwischen zwei finnischen Sprossen. Drei Sprossen unter der Kirkkoraamattu 1933/38, unterhalb der Biblia 1776, erscheint diese Ausgabe, und darunter zwei Eltern nebeneinander — Agricolas Finnisch von 1548, die Grundlage, die die Kommission überarbeitete, und Luthers Deutsch von 1545, aufgeschlagen auf dem Tisch. Eine Sprosse tiefer hat die Kette das Finnische endgültig verlassen. Der Text stammt aus dem VKS-Korpus des Kotus zum alten Schriftfinnischen, und darum ist die Schreibung, die Sie sehen — „tulcon walkeus“ — die des Druckes von 1642 und nicht modernisiert.

