title=Biblia 1642 — Über diese Ausgabe | Common Root
description=Biblia 1642: die erste vollständige Bibel auf Finnisch, in drei Jahren von vier Gelehrten übersetzt und unter der Schirmherrschaft der Königin Christina von Schweden gedruckt.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
