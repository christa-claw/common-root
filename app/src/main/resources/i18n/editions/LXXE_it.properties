title=Septuaginta inglese di Brenton — Informazioni su questa edizione | Common Root
description=La traduzione inglese dell'Antico Testamento greco di Sir Lancelot Brenton, pubblicata a Londra nel 1844 e ristampata con gli apocrifi nel 1851 — per oltre un secolo la Septuaginta inglese per antonomasia, e in questo lettore il piolo posto sopra il greco da cui fu tradotta.
heroHeading=Septuaginta inglese di Brenton
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) era figlio di un ammiraglio della Royal Navy, Sir Jahleel Brenton, e fu ordinato nella Chiesa d'Inghilterra nel 1830, due anni dopo la laurea all'Oriel College di Oxford. Non vi rimase a lungo. A Oxford aveva conosciuto John Nelson Darby, e alla fine del 1831 aveva già lasciato la Chiesa di Stato per fondare una cappella indipendente a Bath; nel 1835 quella cappella era legata ai Fratelli di Plymouth, il movimento a cui Darby stava allora dando forma. Anche le Bibbie dello stesso Darby sono in questo corpus, in francese e in inglese. Nel 1844 Brenton ereditò il titolo di baronetto del padre, e nello stesso anno Samuel Bagster and Sons di Londra pubblicò la sua traduzione della Septuaginta. Morì sull'isola di Wight nel 1862, senza figli, ultimo baronetto della sua linea.
hero.2=Non fu la prima Septuaginta inglese — Charles Thomson ne aveva pubblicata una a Filadelfia nel 1808 — ma fu quella che durò: per più di un secolo e mezzo, finché nel 2007 non uscì la New English Translation of the Septuagint, il lettore di lingua inglese che voleva l'Antico Testamento greco anziché quello ebraico leggeva Brenton. Tradusse principalmente dal Codice Vaticano, il manoscritto del IV secolo conservato nella Biblioteca Vaticana. La prima edizione lasciava fuori gli apocrifi; l'edizione del 1851 li aggiunse, ed è il testo del 1851 che questa copia riproduce. Le edizioni greco-inglesi di Bagster ponevano il greco accanto all'inglese, e quel greco è in questo corpus come edizione a sé. Poiché l'inglese segue il greco, legge dove legge il greco: i salmi mantengono la numerazione greca, sicché il salmo 22 è qui il salmo del pastore, e in Isaia 7,14 «a virgin shall conceive» rende il greco parthenos, non l'ebraico ʿalmah.
hero.3=In questo lettore è un piolo con un solo genitore, e letterale: la Septuaginta greca che le sta sotto è il testo che Brenton tradusse, stampato dal suo stesso editore accanto al suo inglese. Aprite un piolo sotto uno dei suoi versetti e compare il greco, con il Codice di Leningrado più sotto come fondo delle lingue originali. Nulla nel corpus poggia a sua volta su di essa. La nostra copia è più stretta del libro. Ha 37 libri, quelli che anche il canone ebraico possiede con i loro nomi consueti. I file di eBible.org da cui è stata presa contengono anche gli apocrifi — Tobia, Giuditta, Sapienza, Siracide, Baruc, quattro libri dei Maccabei e altro — e danno Ester e Daniele soltanto nelle loro forme greche, più lunghe. Niente di tutto ciò è arrivato nel corpus: qui non ci sono dunque né Ester né Daniele, e dove il greco sottostante ha Tobia o la Sapienza non c'è inglese al di sopra. Esdra e Neemia compaiono come due libri, dove il greco sottostante ne ha uno. Un aggiornamento ortografico della stessa traduzione, l'Updated Brenton di Adam Boyd del 2020, è nel corpus come edizione a sé.

