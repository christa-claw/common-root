title=American Standard Version — Bu Baskı Hakkında | Common Root
description=1901 tarihli American Standard Version: Revised Version'ın Amerikan baskısı; yirmi yıl boyunca Kral James Çevirisi'ni mektupla düzelten bilginlerin eseri ve Revised Standard Version'ın, New American Standard Bible'ın ve World English Bible'ın kökü.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=American Standard Version bir başkasının projesi olarak başladı. İngiltere Kilisesi 1870'te Kral James Çevirisi'ni gözden geçirmeye giriştiğinde Amerikalı bilginleri de katılmaya çağırdı; onlar da katıldılar — mektupla, Atlantik'in iki yakası arasında, yirmi yıla yakın bir süre. İki tarafın anlaşamadığı yerlerde İngiliz komitesinin okuyuşu metne, Amerikalıların tercihi ise bir eke girdi; Amerikalılar da on dört yıl kendi baskılarını çıkarmamayı kabul ettiler. İngiliz Revised Version 1881'de ve 1885'te çıktı. Amerikan baskısı 1901'de ardından geldi ve ekteki okuyuşlar, editörlerinin baştan beri istediği yere, metnin içine alındı.
hero.2=Bu, bilginlerin bilginler için yaptığı bir çeviridir ve öyle de okunur. Gözden geçirenler İbranice ile Yunancanın sözcük dizilişine İngilizcenin kaldırabildiği ölçüde bağlı kaldılar; bu da American Standard Version'ı kesin, uzun bölümlerde ise katı kılar. En görünür kararı Tanrı'nın adına ilişkindir: Kral James Çevirisi'nin küçük büyük harflerle “the LORD” bastığı yerde American Standard Version “Jehovah” basar — Eski Antlaşma boyunca binlerce kez. Yeni Antlaşma'da Textus Receptus'u değil, gözden geçirenlerin Yunanca metnini izler; böylece Kral James çevirmenlerinin elindeki, daha eski elyazmalarında bulunmayan okuyuşlar — aralarında 1. Yuhanna 5:7'deki üçlübirlik cümlesi de vardır — dipnotta kalır ya da hiç yoktur.
hero.3=American Standard Version hiçbir zaman kilise sırasının Kutsal Kitabı olmadı. Olduğu şey bir kök oldu. 1952 tarihli Revised Standard Version onun gözden geçirilmişiydi; bu derlemede yer alan New American Standard Bible da öyle; onu modern yazımla kamu malına taşıyan World English Bible da öyle. Okuyucunun soy basamaklarında bulunduğu yerde durmasının nedeni budur — derlemenin sahip olduğu en uzun zincirin ortası. Bir ASV ayetinin altında bir basamak açın, yapıldığı Revised Version altında belirir, onun da altında Kral James Çevirisi ve Cenevre Kutsal Kitabı, ≈ ile işaretli özgün dil tabanına dek. World English Bible'ın bir ayetinin altında bir basamak açın, buraya geri dönersiniz.

