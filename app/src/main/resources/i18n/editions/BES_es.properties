title=Biblia en Español Sencillo — Acerca de esta edición | Common Root
description=La Biblia en Español Sencillo: una Biblia en español llano publicada por AudioBiblia.org desde 2018, escrita tanto para oírse como para leerse y licenciada de modo que cualquiera pueda copiarla.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Durante cuatro siglos la Biblia protestante en español ha sido, en la práctica, un solo libro en revisiones sucesivas: la traducción de Casiodoro de Reina de 1569, tal como la revisó Cipriano de Valera en 1602, y la larga línea de ediciones Reina-Valera que vino después. La Biblia en Español Sencillo no es una de ellas. Es una traducción nueva, hecha en español actual y deliberadamente llana, publicada por AudioBiblia.org: el Nuevo Testamento junto con Salmos y Proverbios en 2018, y el Antiguo Testamento terminado en octubre de 2019. La traducción se atribuye a Irma Flores, y sus editores la describen como conservadora y evangélica.
hero.2=Lo que la distingue es de dónde viene. Es obra de un ministerio de Biblia en audio, y el texto y una grabación completa capítulo por capítulo se produjeron juntos, y no leyendo el uno a partir del otro. El propósito declarado fue el mismo para ambos: una Biblia fácil de entender y que pueda copiarse y compartirse libre y legalmente. Esa segunda mitad no es accesoria. La traducción lleva una licencia Creative Commons Atribución, con crédito a AudioBiblia.org y a Irma Flores, en lugar de los derechos reservados de una editorial — y por eso el texto entero puede estar en este corpus y ponerse versículo a versículo junto a cualquier otro que haya en él.
hero.3=En este lector es una de cuatro ediciones españolas. Si se pone la interfaz en español, el lector sigue abriendo la Reina-Valera 1909; esta es una edición a la que uno cambia. También se comporta de otro modo en los peldaños del linaje. Como es una traducción nueva y no la revisión de nada que el corpus contenga, no se le registra ningún texto base, de manera que un peldaño abierto bajo un versículo de la Biblia en Español Sencillo cae directamente al suelo de lenguas originales marcado con ≈ y no, como en la cadena inglesa, a una edición más antigua del mismo libro. Póngala más bien en la segunda columna frente a la Reina-Valera 1909, y lo que merece mirarse es la distancia entre los dos registros.

