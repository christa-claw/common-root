title=Kinesiska unionsöversättningen, 1919 års text — Om denna utgåva | Common Root
description=Kinesiska unionsöversättningen sådan den först utgavs 1919, med de äldre teckenformerna och den ursprungliga interpunktionen, transkriberad av Chinese Wikisource, med dess fotnoter.
heroHeading=Kinesiska unionsöversättningen — 1919 års text
