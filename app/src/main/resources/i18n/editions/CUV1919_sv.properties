# The narrative, one paragraph per key, in order.
hero.1=Detta är [[CUV|Kinesiska unionsöversättningen]] sådan den trycktes 1919: mandarinbibeln som missionärer och kinesiska lärda arbetade på i tjugonio år och som fastställdes med det årets teckenformer. Den andra unionsöversättningen i den här läsaren är texten sådan den läses i dag, med modern interpunktion och moderna teckenval. Den här behåller 1919 års sida.
hero.2=Skillnaden syns i tecknen. 1919 års text använder teckenformer som senare tryckningar övergav — 爲 där dagens utgåvor har 為, liksom 愼, 册, 槪 — och den är genomgående tryckt med traditionella tecken. Interpunktionen är den som transkriberats från 1919 års tryckning, inte de senare utgåvornas moderna interpunktion. Där 1919 års bok tryckte på varandra följande verser som ett enda stycke gör denna utgåva detsamma: versnumreringen behålls, och texten placeras vid styckets första vers.
hero.3=Texten kommer från den transkription som gjorts av Chinese Wikisource, och det är Shen-utgåvan (神版), där Gud är 神, inte 上帝. 1919 års boks fotnoter är bevarade och visas i denna läsare som anmärkningar till de verser de hör till.
hero.4=Den lades till för att en kinesisk bibel ska kunna tryckas från en text vars datum och ursprung är känt. En tryckning från 1919 är sedan länge fri från upphovsrätt. De interpunkterade texterna som följde den, från 1988 och framåt, är en annan fråga, och därför hålls de två isär.

