title=クレメンス版ウルガータ — この版について | Common Root
description=クレメンス版ウルガータ。ヒエロニムスのラテン語聖書を教皇庁が改訂したもので、1592年にローマで印刷され、1593年と1598年に訂正を加えて再刊された。1979年までカトリック教会の標準ラテン語本文であり、このリーダーではウルガータの上の段にあたる。
heroHeading=クレメンス版ウルガータ
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=1546年、トリエント公会議はウルガータを教会の真正なラテン語聖書と宣言したが、それによって答えのない問いが残った。どのウルガータなのか。11世紀もの間の手写しの結果、まったく同じ写本は2つとなく、公会議は校訂された本文を求めた。教皇シクストゥス5世は1590年にそれを出した。その多くは彼自身が改訂したもので、真正と宣言する大勅書が添えられていた。彼は同じ年の8月に没し、数週間のうちに枢機卿たちはその販売を差し止めた。クレメンス8世のもとで委員会が後継の版を作り、1592年にローマで印刷された。編者にはフランシスコ・デ・トレドが加わり、作業の中心にはロベルト・ベラルミーノがいた。1593年と1598年の小型の再刊は誤植の大半を取り除き、ヒエロニムスの序文と欄外参照を加えた。
hero.2=この本文は、1979年の新ウルガータまで4世紀近くにわたってカトリック教会の標準ラテン語聖書であり、1962年のミサ典礼書と聖務日課書は今もこれを用いている。これは、教会が受け継いだかたちのヒエロニムスの聖書であって、彼が残したままの姿ではない。詩編は彼のガリア詩編書で、ギリシャ語に基づいて改訂されたものであり、のちにヘブライ語から訳したものではない。そのためギリシャ語の番号づけを保っており、ここでの詩編第22編は「Dominus regit me」で始まる羊飼いの詩編である。ヨハネの手紙一5:7にはヨハネのコンマ「Pater, Verbum, et Spiritus Sanctus」がある。初期のギリシャ語写本にはないラテン語の付加である。エステル記とダニエル書は長い形で収められ、ギリシャ語の付加部分はエステル記の末尾と、ダニエル書の最後の2章にまとめられている。このコピーの元になった eBible.org のファイルは、1598年の本文に『標準注解』（Glossa Ordinaria）を注として添えている。ラオンのアンセルムスの学派から出た12世紀の注解で、ミーニュの1880年版によるものだ。注はコーパスに入っておらず、一部の節にある角括弧は元のファイルにあったものである。
hero.3=このリーダーにおいて、これは記録された親本を一つだけもつ段で、その親本はラテン語ウルガータである。どの節の下で段を開いてもウルガータが現れる。両者はほぼ一字一句同じに読めると考えてよい。このコーパスのウルガータ自体がクレメンス版系の本文から取られているので、両者を分けるのは主に句読点と、このコピーに欠けている書である。収録は66書で、プロテスタント正典の書に、長い形のエステル記とダニエル書が入っている。元ファイルにはトビト記、ユディト記、知恵の書、シラ書、バルク書、マカバイ記2書もあり、下のウルガータにはそれらがすべてある。しかしどれも取り込まれなかったので、ウルガータにトビト記がある箇所では、その上に何もない。クレメンス版が付録に印刷したマナセの祈りとエズラ記第3書・第4書は、元ファイルにもコーパスにもない。このコーパスでは、この版の上に立つものは何もない。

