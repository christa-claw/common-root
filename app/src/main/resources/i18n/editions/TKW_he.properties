title=טקסטביבל 1906 — על מהדורה זו | Common Root
description=ה־Textbibel של קאוץ' ווייצזקר: מקרא גרמני של חוקרים, שתורגם מחדש מעברית ומיוונית ויצא לראשונה בכרך אחד בטיבינגן ב־1899; הנוסח כאן מתוארך ל־1906.
heroHeading=טקסטביבל 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=שני פרופסורים, שתי בריתות. קרל וייצזקר (1822–1899) היה היסטוריון של הכנסייה בטיבינגן, שם ירש ב־1861 את הקתדרה של פרדיננד כריסטיאן באור, ומ־1889 היה קנצלר האוניברסיטה. תרגומו לברית החדשה יצא לראשונה ב־1875 וזכה לתשע מהדורות בחייו; את האחרונה הכין על ערש דווי. אמיל קאוץ' (1841–1910) היה חוקר המקרא, שלימד בלייפציג, בבאזל ובטיבינגן לפני שהשתקע בהאלה ב־1888; התנ"ך שלו, שתורגם יחד עם קבוצת עמיתים מומחים, יצא בשלמותו ב־1894.
hero.2=ב־1899, השנה שבה מת וייצזקר, אוחדו השניים בכרך אחד, Textbibel des Alten und Neuen Testaments, שיצא לאור בטיבינגן בהוצאת J.C.B. Mohr (Paul Siebeck). השם אומר מה הוא: הטקסט החשוף, לקוראים שרצו לדעת מה אומרים העברית והיוונית, בגרמנית של זמנם. מעולם לא נועד להחליף את לותר. וייצזקר נמנע במתכוון מלשונו של לותר וביקש במקום זאת להעביר את הרושם שעשה המקור על קוראיו הראשונים; הביוגרף שלו סבר שלא סביר שיהפוך אי־פעם לספר עממי, והוא אכן לא הפך. הוא המשיך להיות מודפס מחדש עד שנות ה־1910. הטקסט הדיגיטלי כאן מתוארך ל־1906; לאיזו מהדורה השתייכה אותה הדפסה — את זה פרויקט זה לא בירר.
hero.3=הוא נקרא כמו המחקר של שעתו. שם האל בתנ"ך הוא "Jahwe" — "Jahwe ist mein Hirte" בתהלים 23 — אלפי פעמים, במקום שבו אצל לותר "der Herr". בישעיהו 7:14 כתוב "ein junges Weib", אישה צעירה. בברית החדשה תפילת האדון במתי 6:13 מסתיימת בלי הדוקסולוגיה, ובאיגרת יוחנן הראשונה 5:7 אין עדים שבשמיים. התנ"ך שומר על חלוקת הפרקים והפסוקים העברית: כותרות המזמורים נמנות במספור הפסוקים, ולכן בתהלים 51 יש 21 פסוקים, ובמלאכי שלושה פרקים ולא ארבעה. הכתיב ישן יותר ממה שהתאריך מרמז — ביוחנן 8:1 ישוע "gieng" אל הר הזיתים.
hero.4=בקורא זה הוא אחד מארבעה תרגומי מקרא גרמניים, לצד האלברפלד ונוסחי לותר מ־1545 ומ־1912. ממשק גרמני אינו נפתח עליו: לגרמנית אין בחירה מוגדרת, ולכן הקורא לוקח את המקרא הגרמני הראשון בקטלוג, והוא האלברפלד. בשלבי השושלת לא רשום לו שום מקור, וזה הולם תרגום שנעשה מן המקורות: שלב שנפתח תחת פסוק יורד ישר אל רצפת לשונות המקור המסומנת ב־≈ — כתב יד לנינגרד במהדורת וסטמינסטר לברית הישנה, ולחדשה הנוסח המקובל, יוונית שתרגום זה אינו הולך אחריה, כפי שמראה יוחנן הראשונה 5:7.

