# The narrative, one paragraph per key, in order.
hero.1=यह अब तक की सबसे पुरानी छपी हुई फ़िनिश है। जब मिकाएल आग्रिकोला ने 1548 में Se Wsi Testamenti प्रकाशित किया, तब फ़िनिश भाषा छापेखाने से लगभग कभी गुज़री ही नहीं थी — कुछ ही वर्ष पहले छपी उनकी अपनी वर्णमाला-पुस्तिका ही पहली फ़िनिश किताब थी। इन दोनों के बीच 1544 की प्रार्थना-पुस्तक भी आई — पाठ की दृष्टि से बड़ी कृति, जिसमें भजनों के अनुवाद भी थे। धर्मग्रन्थ छापने से पहले उन्हें यह तय करना पड़ा कि यह भाषा लिखी कैसे जाएगी, और वे निर्णय — वर्तनी, उधार शब्द, लय — वहीं से लिखित फ़िनिश आरम्भ होती है। नए नियम में उन्हें और उनके तुर्कू मण्डल को एक दशक से अधिक लगा; 1551 में भजन-संहिता आई, और 1551–52 में नबियों तथा मूसा की पुस्तकों के चयन। फिर भी उनकी फ़िनिश पहली छपी हुई फ़िनिश थी, पहली लिखी हुई नहीं: चार पांडुलिपियाँ — कोडेक्स वेस्थ, उप्साला कोडेक्स B 28, कंगसाला मिसाल और उप्साला खंड — फ़िनिश में बाइबल के अंश रखती हैं, और काउको पिरिनेन ने 1988 में उनकी स्वीडिश स्रोतों से तुलना करके दिखाया कि उनका कुछ भाग आग्रिकोला के छापे किसी भी पाठ से पुराना है, संभवतः 1530 के दशक में ही लिखा गया।
hero.2=पूरी बाइबिल का अनुवाद उन्होंने कभी नहीं किया, और यह रीडर ऐसा होने का ढोंग भी नहीं करता। नया नियम और सभी 150 भजन पूर्ण हैं; नबी और मूसा की पुस्तकें चयन के रूप में हैं। जो उन्होंने अन्यत्र अनूदित किया, वह भी यहाँ है: 1544 की उनकी प्रार्थना-पुस्तक तथा 1549 की Käsikirja और Messu में अपना बाइबिल-पाठ है — जिनमें "Genesist mutomat Lughut" शीर्षक से छपे उत्पत्ति के अध्याय भी हैं — और वहीं से 685 पद आए हैं। इनका प्रयोग केवल वहाँ हुआ है जहाँ धर्मग्रन्थ-खंडों में उसी पते पर कोई पद नहीं, और केवल वहाँ जहाँ पाठ निरंतर चलता है, न कि प्रार्थना के भीतर अकेले उद्धरण के रूप में। सो उत्पत्ति आख़िर है ही, आंशिक रूप से: अध्याय 1–4, 22, 28 और 32। न्यायियों, रूत, 1 इतिहास और एस्तेर पूर्णतः अनुपस्थित हैं। सम्पूर्ण फ़िनिश पुराना नियम शृंखला में एक सीढ़ी ऊपर, 1642 की Biblia तक प्रतीक्षा करता रहा।
hero.3=इस रीडर में आग्रिकोला फ़िनिश शृंखला की सबसे पुरानी सीढ़ी हैं। Biblia 1642 के किसी वचन के नीचे एक सीढ़ी खोलिए, तो उनका पाठ लूथर की जर्मन के साथ प्रकट होता है — वही दो स्रोत जो 1642 की समिति के सामने सचमुच खुले थे। स्वयं आग्रिकोला के नीचे शृंखला फ़िनिश को सदा के लिए छोड़ देती है: उन्होंने इरास्मस की यूनानी और उसके साथ छपी इरास्मस की लातिनी, लूथर की जर्मन तथा वुल्गाता के आधार पर काम किया। इनमें से तीन यहाँ उनके मूल-स्रोत के रूप में दर्ज हैं; इरास्मस की लातिनी और 1541 की गुस्ताव वासा की स्वीडिश पूरी बाइबल, जिसे वे भी बरतते थे, इस संग्रह में नहीं हैं। पाठ Kotus के VKS कॉर्पस का है, 1548 की छपाई की अपनी वर्तनी में: "Algusa oli Sana / Ja se Sana oli Jumalan tykene"। स्वीडिश में बाइबल 1526 से छपी हुई थी, जब स्वीडिश नया नियम प्रकाशित हुआ, इसलिए एक स्वीडिश रूपांतर उन्हें आरंभ से ही उपलब्ध था।

