title=Agricola 1548 — इस संस्करण के बारे में | Common Root
description=मिकाएल आग्रिकोला की फ़िनिश: 1548 का नया नियम, 1551 का भजन-संहिता और नबियों की पुस्तकें — फ़िनिश में छपा पहला धर्मग्रन्थ, और लिखित फ़िनिश भाषा की शुरुआत।
heroHeading=Agricola 1548
