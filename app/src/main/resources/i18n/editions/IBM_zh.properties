title=伊本·马哲圣训集 — 关于此版本 | Common Root
description=伊本·马哲圣训集：逊尼派六大圣训集中的最后一部，按法学主题编排，因其中亦掺杂弱传及伪造的圣训，其在六大圣训集中的地位长期存在争议。
heroHeading=伊本·马哲圣训集
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=艾布·阿卜杜拉·穆罕默德·伊本·叶齐德·伊本·马哲·拉比仪·卡兹温尼于希吉拉历209年（公元824年）生于卡兹温——今伊朗西北部一地——出身拉比阿部落的归附者（马瓦利）家庭；据一说，"马哲"是其父的绰号，而非祖父或母亲之名。他游历伊拉克、希贾兹、沙姆和埃及以求学圣训，师从许多学者；据称他后来所编《圣训集》中四分之一以上的圣训，仅出自一位老师——伊本·艾比·舍拜。同代学者如艾布·叶阿拉·哈利利称他可靠、声名显著，是公认的权威。他于希吉拉历273年（公元887年）卒于卡兹温，但卡塔尼另记为希吉拉历275年（公元889年）；据传统记载，伊本·马哲向艾布·祖尔阿·拉齐诵读完成的《圣训集》后，艾布·祖尔阿评论说，人们若拥有此书，其余的圣训集大体便无需再读了。
hero.2=据宰海比统计，他的《圣训集》约有1,500章、4,000则圣训，按法学主题编排，如[[ABD|艾布·达乌德圣训集]]和[[TIR|提尔米济圣训实录]]一样。书中除确凿可信和可接受的材料外，也收有后世学者判定为弱传的圣训，其中大约三十则被普遍认定纯属伪造——这正是部分学者只承认"五大圣训集"而不计入第六部的原因。
hero.3=逊尼派传统将《伊本·马哲圣训集》列为六大圣训集（库图布·西塔）的最后一部，与[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]和[[TIR|提尔米济圣训实录]]并列。而这第六部之位本身也存在争议：马立克派及伊本·艾西尔等学者主张应以[[MAL|马立克穆瓦塔]]取而代之，另有人主张应是达拉古特尼的《圣训集》；一般认为伊本·马哲之书之所以赢得此位，是因为其内容与其余五部重复最少，而非因其被判定为诸候选中最可靠者。
hero.4=此处的阿拉伯语文本是公有领域的古典正文（matn）。阅读器中其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-ibnmajah版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]、[[TIR|提尔米济圣训实录]]、[[NAS|奈萨仪圣训集]]及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

