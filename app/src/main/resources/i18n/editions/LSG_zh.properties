title=路易·瑟贡 1910（法文）— 关于此版本 | Common Root
description=瑟贡圣经的 1910 年修订本：一位日内瓦牧师从希伯来文和希腊文译出的圣经，1880 年首次全本印行，为英国及海外圣经公会修订，一个世纪以来是讲法语的新教徒通用的圣经。
heroHeading=路易·瑟贡 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=路易·瑟贡 1810 年生于普兰帕莱，当时就在日内瓦城外，1885 年卒于日内瓦。他在斯特拉斯堡的新教神学院攻读神学，26 岁获神学博士学位，在乡村堂区谢讷-布热里任牧师 24 年，之后转而教授希伯来文和旧约。日内瓦可敬牧师团委托他从希伯来文重新翻译旧约，他的译本以署年 1874 的版本问世。此后他主动翻译新约，所据是康斯坦丁·蒂申多夫的希腊文校勘本，而不是公认文本；1880 年，整部圣经合为一卷，在牛津印行。
hero.2=这并不完全是瑟贡当年出版的文本。他去世后，英国及海外圣经公会请一批法国和瑞士的牧师与神学家加以修订，修订本于 1910 年问世。他们的改动偏向新教正统的用语——祭司译作 “sacrificateurs”，那个古老的新教用词，而不是 “prêtres”；在本副本中 “sacrificateur” 随处可见，“prêtre” 则很少。正是这个 1910 年的文本，在 20 世纪的大部分时间里成为法国新教的标准参考圣经，至今仍是讲法语的福音派信徒最常读的圣经之一。它还有一长串后来的修订本：1978 年的 “Colombe”、1979 年的 Nouvelle Édition de Genève，以及 2007 年的 Segond 21。有几个特点几乎每页可见。神的名字作 “l'Éternel”，即“永恒者”，与奥斯特瓦尔德本以及本语料库中并列的法文达秘圣经相同：诗篇 23 篇作 “L'Éternel est mon berger”。以赛亚书 7:14 作 “la jeune fille deviendra enceinte”——年轻女子，而非童女——正是这类译法，使一些保守的新教徒指责瑟贡削弱了弥赛亚预言。
hero.3=在诗篇上，本书随从希伯来文：编号采用希伯来编号，因此诗篇 23 篇是牧者之诗；凡希伯来文中诗篇标题算作一节之处，这里也算作一节——诗篇 51 篇有 21 节，比 King James Version 多 2 节。约珥书和玛拉基书则沿用拉丁和英语传统的分章，分别为 3 章和 4 章。在本阅读器中，它是三部法文圣经之一，与奥斯特瓦尔德本和法文达秘圣经并列。法文界面并不在它上面开启：法文没有选定的默认版本，所以阅读器按目录顺序取第一部法文圣经，那就是达秘圣经。谱系阶梯中未为它记录任何母本，所以在某一节之下展开的阶梯径直落到以 ≈ 标示的原文底层——旧约是列宁格勒抄本，一部马所拉传统的抄本，而不是瑟贡时代的希伯来文印本；新约是公认文本，恰恰是他选择不去依从的那种希腊文。它的阶梯标签带有年份 1910。

