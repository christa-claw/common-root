title=Baibal Olcim — Bu Baskı Hakkında | Common Root
description=Baibal Olcim: Myanmar'ın Chin Eyaleti'ndeki bir azınlık dili olan Matu Çincesiyle yazılmış İncil; eBible.org tarafından, çevirmeni ve çeviri tarihi kayıtlı olmayan, gerçekten kamu malı bir metin olarak dağıtılmaktadır.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Matu Çincesi — Matupi Çincesi olarak da bilinir — Myanmar'ın Chin Eyaleti'nin güneyinde, Matupi çevresinde yoğunlaşan yaklaşık 34.000 kişi tarafından konuşulan Çin-Tibet dil ailesinden bir dildir; Hindistan'ın Mizoram eyaletinde sınırın öte yakasında da akraba topluluklar bulunur. Baibal Olcim bu dildeki İncil'dir ve bu derlemedeki tek Matu Çincesi metnidir.
hero.2=Kaydın vermediği şey, onu kimin ve ne zaman çevirdiğidir. Metni dağıtan eBible.org, yalnızca onun kamu malı olduğunu belirtir ve onu Matu Çincesi'nin ISO 639-3 kodu olan hlt altında kataloglar — ne çevirmen, ne kurul, ne de bir çeviri tarihi. Bu sayfa, tahmin etmek yerine ikisini de boş bırakır. Aynı kodun burada kendine özgü küçük bir geçmişi vardır: bu derlemeye ikinci bir Hintçe İncil eklemek için yapılan önceki bir girişim, benzer görünümlü bir kısaltma yüzünden hlt altına kaydedilmiş, ta ki Hintçe beklenen yerde Matu Çincesi ayetlerin çıkması hatayı ortaya çıkarana dek. Bu baskı, gerçekten de kodunun adlandırdığı dile karşı denetlenmiş olandır.
hero.3=Bu metin, uzunluğu için değil, ne olduğu için eklendi: yalnızca lisanslı değil, gerçekten kamu malı bir İncil — Myanmar'ın iç çatışmasında, Chin Eyaleti ve çevresinde yoğunlaşan, gerçek bir zulüm görmüş Hristiyan bir azınlığın dilinde. Kullanıcılarından hiçbir şey istemeyen ve hiçbirini izlemeyen bir okuyucu, tam olarak böyle bir durum içindir — bu da bu sayfanın verilerine koyacak başka pek az şeyi olmasının da büyük ölçüde nedenidir.

