title=Ostervald Kutsal Kitabı (Fransızca) — Bu Baskı Hakkında | Common Root
description=Ostervald Kutsal Kitabı: Neuchâtelli bir papazın Cenevre'nin Fransızca Protestan Kutsal Kitabı üzerinde yaptığı revizyon; ilk kez 1744'te yayımlandı, burada modern Fransızca yazımlı daha sonraki bir revizyonuyla yer alıyor.
heroHeading=Ostervald Kutsal Kitabı
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald 1663'te Neuchâtel'de doğdu ve 1747'de orada öldü. 1683'te doğduğu kentte papaz olarak takdis edildi ve hayatının büyük bölümünü o kentin kilisesinde geçirdi; önce diyakoz, 1699'dan itibaren papaz olarak görev yaptı, ayrıca teoloji dersleri verdi. Onun Kutsal Kitabı İbranice ve Yunancadan yapılmış yeni bir çeviri değil, Cenevre'nin Fransızca Protestan Kutsal Kitabı'nın bir revizyonudur; Fransızca konuşan Reforme kiliselerinin on altıncı yüzyıldan beri okuduğu çeviri budur. Ostervald'ın revize ettiği metin ilk kez 1744'te, ölümünden üç yıl önce yayımlandı ve iki yüzyılı aşkın süre yeniden basılıp gözden geçirildi; Britanya'da da iyi tanınıyordu.
hero.2=Bu derlemedeki metin 1744'ün Fransızcası değildir. On sekizinci yüzyıl, modern Fransızcanın “était” yazdığı yerde “étoit” yazardı; bu kopyada her yerde “était” vardır ve “étoit” bir kez bile geçmez, dolayısıyla Ostervald'ın adını koruyan sonraki revizyonlardan birinden gelir. Bunların en bilineni Société biblique de France'ın 1881'de yayımladığı revizyondur; Yeni Antlaşma'sı Ch. L. Frossard'ın işidir ve bu metin 1996'da da güncellenmiştir. Bu kopyanın kaynağı eBible.org yalnızca “Ostervald” der, revizyonu belirtmez; bu yüzden bu sayfa da birini adlandırmaz. Bazı özellikler neredeyse her sayfada görülür. Tanrı'nın adı “l'Éternel”, yani Ebedî olandır; Segond'da ve Fransızca Darby'de de böyledir: Mezmur 23'te “L'Éternel est mon berger; je n'aurai point de disette”. Yeşaya 7:14 “la vierge sera enceinte” — bakire — ifadesini korur; Segond'da orada genç kadın vardır. Yeni Antlaşma da eleştirel baskıların çıkardığı Textus Receptus okumalarını korur: 1. Yuhanna 5:7'de üç göksel tanık, “le Père, la Parole, et le Saint-Esprit”, yer alır; yanındaki Segond'da bunlar yoktur.
hero.3=Bu okuyucuda Segond ve Fransızca Darby'nin yanında yer alan üç Fransızca Kutsal Kitap'tan biridir. Fransızca bir arayüz bunu açmaz: Fransızca için elle yapılmış bir seçim yoktur, bu yüzden okuyucu katalog sırasındaki ilk Fransızca Kutsal Kitap'ı alır, o da Darby'dir. Soy basamaklarında ona kayıtlı bir kaynak yoktur — revize ettiği Cenevre Kutsal Kitabı bu derlemede bulunmaz — bu yüzden bir ayetin altında açılan basamak doğruca ≈ ile imlenen özgün diller tabanına iner: Eski Antlaşma için Leningrad Kodeksi, Yeni Antlaşma için ise Textus Receptus, yani bu Kutsal Kitap'ın gerçekten izlediği Yunanca gelenek. Basamak etiketi 1744 yılını taşır; bu, gösterilen metnin değil, Ostervald'ın kendi revizyonunun yılıdır. İki yüzyıllık Fransız Protestan Kutsal Kitap dilini yan yana görmek için onu Segond'un yanında açın.

