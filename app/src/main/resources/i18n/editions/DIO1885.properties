title=Diodati 1885 (Italian) — About This Edition | Common Root
description=Giovanni Diodati's Italian Bible in a nineteenth-century form: his 1641 text as revised in 1821, in an edition dated 1885 — the same translation as the other Diodati in this corpus, divided into verses differently.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=This is Giovanni Diodati's translation — the Genevan of Lucchese family, born in 1576, who in 1607 published the first Italian Bible made from the Hebrew and the Greek rather than the Latin, and revised it with his own notes in 1641, eight years before he died. The other Diodati in this corpus has a page of its own that tells that story. For two centuries after him the text lived by being reprinted, and from 1808 the British and Foreign Bible Society published it in edition after edition, because for Italian Protestants there was nothing else to print.
hero.2=This file is one of those later forms. eBible.org, which supplies it on behalf of the United Bible Societies, describes it as Diodati's 1641 translation revised in 1821, in an edition dated 1885. Who made the 1821 revision and which press printed the 1885 edition are not things this project has established, so the page does not name them. The date is not the problem it is on the other Diodati, whose label is the year Diodati died: 1885 is the edition's own date, the catalogue stores it, and the rung chip shows it.
hero.3=Set beside the other Diodati, the wording is the same in every spot-check: “il Signore è il mio pastore” at Psalm 23, “la Vergine concepirà” at Isaiah 7:14, the heavenly witnesses at 1 John 5:7, the doxology at the end of the Lord's Prayer, Acts 8:37 in full. The divine name is “il Signore”, the Lord, as Diodati wrote it; it was the Riveduta, a revision of this text published in 1924, that changed it to “l'Eterno”. What differs is the verse division. In more than thirty places this copy follows another scheme, close to the Hebrew one — Jonah's prayer begins at 2:1 and the chapter runs to 2:11, Isaiah 8 has a 23rd verse, Job 39 runs on to verse 38, and the first verse of Colossians 4 sits at the end of chapter 3 — so it counts seven fewer verses in all. And this copy has none of the psalm headings: Psalm 51 opens straight at “Abbi pietà di me, o Dio”, where the other Diodati runs the heading into the first verse. eBible.org's own presentation of this text shows the headings, so they were most likely lost in this project's import rather than missing from the 1885 printing.
hero.4=In this reader it is one of three Italian Bibles. An Italian interface opens on the other Diodati, Diodati 1649, which comes first in catalogue order, since Italian has no curated pick. No parent is recorded for it in the lineage rungs — not even that other copy of the same translation — so a rung opened under a verse drops straight to the original-language floor marked with ≈. As with the other Diodati, the Textus Receptus there is close to the truth: Diodati worked from Beza's printed Greek, a text of that family.

