title=ティンダル新約聖書1534 — この版について | Common Root
description=ウィリアム・ティンダルの新約聖書。ギリシャ語から訳された最初の英訳であり、最初に印刷された英訳でもある。本書は彼自身による1534年の改訂版で、ジュネーヴ聖書とキング・ジェイムズ・バージョンの下にある言葉づかいである。
heroHeading=ティンダル新約聖書1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=ティンダルの時代のイングランドでは、英語の聖書はなお違法だった。1409年のオックスフォード教会会議規定は、司教の承認なしに聖書を英語に訳すことも、そうした訳を読むことも禁じていた。ウィリアム・ティンダルは1523年にロンドン司教カスバート・タンストールにその承認を求めたが退けられ、翌年、承認なしにこの仕事をするためにイングランドを去った。目の前にエラスムスのギリシャ語新約聖書を置き、かたわらにルターのドイツ語訳とラテン語ウルガータを置いて、彼はギリシャ語から訳された最初の英語の新約聖書を作り、それは史上初めて印刷された英語の新約聖書ともなった。1525年のケルンでの最初の試みは印刷所への手入れで中断した。完全な本は1526年にヴォルムスのペーター・シェッファーの印刷所から出て、イングランドに密輸され、司教たちはそれを買い上げて焼いた。
hero.2=ここにある本文は、1534年にアントワープで印刷されたティンダル自身の改訂版である。彼はギリシャ語を見直し、初版を訂正し、序文と注を加えた。それは翻訳であると同時に、ひとつの主張でもあった。トマス・モアは、教会が「教会」と言うところを「会衆」（congregation）、「司祭」と言うところを「長老」（elder）、charity と言うところを「愛」（love）と書いたとして彼を攻撃したが、この三つの選択はいずれもこの本文に残っている。マタイによる福音書16章18節は「apon this rocke I wyll bylde my congregacion」となっている。ティンダルは1535年にもう一度改訂し、同年5月にアントワープで逮捕され、1536年に異端として断罪され、ブリュッセル近郊のフィルフォールデで絞殺されたうえ焼かれた。
hero.3=このリーダーでは、彼はいちばん下にいる。ティンダルはジュネーヴ聖書とキング・ジェイムズ・バージョンの双方の下の段として記録されており、したがって梯子のさらに下で、キング・ジェイムズの上に立つリバイズド・バージョン、アメリカン・スタンダード・バージョン、ワールド・イングリッシュ・バイブルの下にもある。キング・ジェイムズの節からジュネーヴを越えて下りていくと、言葉づかいはしばしばほとんど動かない——それこそが要点である。コリントの信徒への手紙一13章13節では動く。ティンダルとジュネーヴは love と言い、キング・ジェイムズは charity と言う。ティンダルの下には記録された親本はない。彼はエラスムスのギリシャ語に拠ったが、このコーパスのテクストゥス・レセプトゥスは彼より一世代後の1550年版であり、ここにあるルターも彼が用いた1522年の新約聖書ではなく1545年の聖書であるため、梯子はそのまま原語の床へと下りる。ここにあるのは新約聖書のみで、彼自身の綴りのままである。マタイによる福音書は「This is the boke of the generacion of Iesus Christ」で始まる。

