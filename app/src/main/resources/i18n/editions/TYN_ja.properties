fact.1.value=英語——チューダー朝初期の英語、原綴りのまま
fact.2.label=翻訳者
fact.2.value=ウィリアム・ティンダル。1523年にロンドン司教に許可を拒まれた後、大陸で亡命生活を送りながら訳した
fact.3.label=初版
fact.3.value=1526年、ヴォルムス、ペーター・シェッファーの印刷所——英語で印刷された最初の新約聖書
fact.4.label=この本文
fact.4.value=ティンダル自身の改訂版、1534年にアントワープで印刷
fact.5.label=翻訳の底本
fact.5.value=エラスムスのギリシャ語新約聖書。かたわらにルターの1522年のドイツ語新約聖書とウルガータ——[[TR|テクストゥス・レセプトゥス]]がこのコーパスにおけるそのギリシャ語の証言である
fact.6.label=論争を呼んだ語
fact.6.value=church の代わりに「congregation」、priest の代わりに「elder」、charity の代わりに「love」——トマス・モアが攻撃した選択
fact.7.label=このコーパスでは
fact.7.value=新約聖書27書のみ、7954節、綴りは現代化していない
fact.8.label=下の段となっている版
fact.8.value=[[GNV|ジュネーヴ聖書]]と[[KJV|キング・ジェイムズ・バージョン]]——さらにキング・ジェイムズを通じて[[RV|リバイズド・バージョン]]、[[ASV|アメリカン・スタンダード・バージョン]]、[[WEB|ワールド・イングリッシュ・バイブル]]
fact.9.label=この段の下
fact.9.value=記録された親本はない——梯子はそのまま原語の床へと下り、そこでは[[TR|テクストゥス・レセプトゥス]]が、ティンダルが手にした本としてではなく、ギリシャ語の証言として立っている
