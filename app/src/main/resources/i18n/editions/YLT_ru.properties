fact.1.label=Язык
fact.1.value=Английский
fact.2.label=Переводчик
fact.2.value=Роберт Янг (1822–1888), эдинбургский печатник, книготорговец и самоучка-лингвист, составитель конкорданса Analytical Concordance to the Bible
fact.3.label=Ветхий завет с
fact.3.value=Принятого масоретского еврейского текста — традиции, к которой принадлежит и [[WLC|Ленинградский кодекс]] в этом собрании
fact.4.label=Новый завет с
fact.4.value=Греческого общепринятого текста, [[TR|Textus Receptus]], — сохранённого, как писал Янг, «не потому, что его считают совершенным», а потому, что перевод и текстология — разные задачи
fact.5.label=Род перевода
fact.5.value=Строго буквальный: времена подлинника сохранены даже там, где по-английски это звучит странно, так что повествование часто идёт в настоящем времени; по возможности одно английское слово на каждое слово подлинника, так что olam и aiōn становятся «age» и «age-during»; слова, добавленные ради смысла, — в квадратных скобках; имя Бога — «Jehovah»
fact.6.label=Издан
fact.6.value=Эдинбург, 1862; пересмотрен Янгом, 1887; третье издание, вновь пересмотренное его издателями, Эдинбург, январь 1898 — текст, находящийся здесь
fact.7.label=Лицензия
fact.7.value=Общественное достояние; эта копия с eBible.org
fact.8.label=В этом собрании
fact.8.value=66 книг, протестантский канон полностью, без неканонических книг; английская нумерация глав и стихов, так что псалмов 150 и надписание каждого слито с его первым стихом
fact.9.label=Родословие
fact.9.value=Записанного предка нет, и ничего не записано как стоящее на нём, — ступень открывается прямо на полу языков оригинала, [[WLC|Ленинградском кодексе]] в Ветхом Завете и [[TR|Textus Receptus]] в Новом; [[LSV|Literal Standard Version]] 2020 года перерабатывает труд Янга, но собрание эту связь не записывает
