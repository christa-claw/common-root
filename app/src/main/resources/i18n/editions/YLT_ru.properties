title=Young's Literal Translation — Об этом издании | Common Root
description=Буквальный перевод Библии Роберта Янга, впервые изданный в Эдинбурге в 1862 году, пересмотренный самим Янгом в 1887 году и его издателями в 1898 году, — английская Библия, сохраняющая времена глаголов, порядок слов и, насколько возможно, словарь еврейского и греческого текста даже там, где английский язык едва за ними поспевает.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Роберт Янг (1822–1888) был эдинбургским печатником и книготорговцем. Ещё учеником в типографии он самостоятельно выучил древнееврейский и несколько других восточных языков, с 1856 по 1861 год руководил миссионерской типографией в Сурате в Индии и остался в памяти прежде всего двумя книгами: конкордансом Analytical Concordance to the Bible и этим переводом. Literal Translation он издал в Эдинбурге в 1862 году, а исправленное издание — в 1887 году. Через десять лет после его смерти, в январе 1898 года, его издатели выпустили третье издание, ещё раз пересмотренное «в его нынешних рамках»; именно этот текст находится в этом собрании. Ветхий Завет Янг переводил с принятого масоретского еврейского текста, а Новый Завет — с греческого общепринятого текста, Textus Receptus, и прямо говорил, что не станет создавать новый текст ни того, ни другого: перевод, писал он, — задача иная, чем текстология, и мало кто пригоден для обеих.
hero.2=Вся цель — дать английскому читателю увидеть грамматику подлинника. Янг считал, что перевод, который ставит настоящее время там, где в подлиннике прошедшее, или «an a for a the», неопределённый артикль вместо определённого, отбрасывает словесную богодухновенность, и переводил соответственно. Еврейские глагольные формы переходят в английские времена, так что повествование часто идёт в настоящем времени: Книга Бытия начинается словами «In the beginning of God's preparing the heavens and the earth —» и продолжается «and God saith, ‘Let light be;’ and light is.» Слова, добавленные ради смысла, стоят в квадратных скобках: «Jehovah [is] my shepherd, I do not lack.» Он старался везде, где мог, давать каждому еврейскому или греческому слову один английский эквивалент, и поэтому еврейское olam и греческое aiōn становятся «age» и «age-during», а не «ever» и «eternal»; в Евангелии от Матфея 25:46 праведники идут «to life age-during». Имя Бога во всём Ветхом Завете передано как «Jehovah».
hero.3=Наша копия полна: 66 книг, от Бытия до Откровения, без неканонических книг, в английской нумерации глав и стихов — 150 псалмов, надписание каждого из которых слито с его первым стихом, и Книга Малахии, заканчивающаяся главой 4. Как перевод общепринятого текста, она содержит места, которые позднейшие критические издания ставят под сомнение, — от длинного окончания Марка до трёх свидетелей на небе в 1-м послании Иоанна 5:7, которых этот текст заключает в квадратные скобки, как и весь стих Деяний 8:37. В этом читателе она стоит особняком. Собрание не записывает для неё предка, поэтому ступень родословия, открытая под одним из её стихов, падает прямо на пол языков оригинала, помеченный ≈: в Ветхом Завете это Ленинградский кодекс, в Новом — Textus Receptus. Этот пол близок к тому, с чего переводил сам Янг, — к масоретскому еврейскому и общепринятому греческому тексту, хотя и не в тех же изданиях. И ничего не записано как стоящее на ней. Literal Standard Version 2020 года, тоже входящая в это собрание, представляет себя масштабной переработкой труда Янга, но собрание эту связь не записывает, так что ступени под LSV сюда не ведут. Ни один язык интерфейса не открывается на этом издании; английский интерфейс открывается на New International Version, а к этому изданию ведёт его собственная карточка в сетке переводов.

