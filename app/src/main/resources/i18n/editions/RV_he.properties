title=Revised Version — על מהדורה זו | Common Root
description=המהדורה המתוקנת האנגלית: התיקון היחיד של King James Version שכנסיית אנגליה הרשתה אי־פעם, שיצא בשלוש מנות בין 1881 ל־1894 — וכאן השלב שבין King James Version ל־American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=המהדורה המתוקנת היא התיקון האחד של King James Version שכנסיית אנגליה אמנם הזמינה. אספת קנטרברי החליטה עליו ב־1870 ומינתה שתי חבורות, אחת לכל ברית, ובהן יותר מחמישים חוקרים בריטים מכמה זרמים — לא אנגליקנים בלבד, דבר שהיה כשלעצמו חידוש ושנוי במחלוקת. חוקרים אמריקנים הוזמנו להשתתף בדואר, והשתתפו. ההנחיה הייתה שמרנית: לשנות את Authorised Version רק במקום שלשונות המקור, המתורגמות בנאמנות, מחייבות זאת. הברית החדשה יצאה ב־1881, הברית הישנה ב־1885, והספרים החיצוניים, שעליהם עבדו אחרונים, ב־1894.
hero.2=ההנחיה השמרנית לא מנעה מחבורת הברית החדשה לקבל את ההחלטה מרחיקת הלכת ביותר שבספר. הם לא עבדו על פי Textus Receptus. ווסטקוט והורט ישבו באותה חבורה והגישו לה בהגהות את הנוסח היווני שלהם ככל שהתקדמה המלאכה; מה שקבעו המתקנים היה הנוסח האקלקטי שלהם עצמם ולא בדיוק זה של ווסטקוט והורט, אך הוא נע נחרצות אל כתבי היד האונציאליים הקדומים יותר. העמידו מהדורה זו לצד King James Version בשני טורים, והתזוזה נראית מיד. באיגרת יוחנן א 5:7 קורא טור King James ״For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one״, וזה קורא ״And it is the Spirit that beareth witness, because the Spirit is the truth״.
hero.3=מה שהמתקנים הבריטים לא שינו הוא בדיוק מה שהאמריקנים ביקשו לשנות יותר מכול. בתהילים 23:1 מהדורה זו עדיין מדפיסה ״The LORD is my shepherd״, בדיוק כמו King James Version; ואילו American Standard Version שמעליה מדפיסה ״Jehovah is my shepherd״. השם מופיע כאן רק במקום שבו King James Version עצמה הדפיסה אותו — בשמות 6:3 שתיהן קוראות ״by my name JEHOVAH״ — והולכתו לאורך כל הברית הישנה הייתה העדפה אמריקנית, שנדחקה לנספח מכוח הסכם ארבע־עשרה השנים ושוחררה אל הטקסט רק ב־1901. קריאת שני הטורים יחד היא הדרך הקצרה ביותר לראות מה עיכב אותו הסכם למעשה. הבדל שני ניכר בצורת המשפטים ולא בלשונם: המתקנים שברו את הסידור של פסוק בכל שורה וסידרו את הפרוזה בפסקאות, והעקבות נשמרו כאן בפסוקים הפותחים באות קטנה משום שהם ממשיכים משפט — ״and I appeared unto Abraham״ בשמות 6:3, במקום שטור King James פותח ״And I appeared״.
hero.4=הכרטיס של מהדורה זו מותיר את השנה ריקה, וזו התשובה הישרה ולא פער. המהדורה המתוקנת לא פורסמה פעם אחת אלא שלוש, והטקסט כאן הוא זה של שמונים הספרים: שישים ושישה ספרים ועוד ארבעה עשר מן הספרים החיצוניים, 36,873 פסוקים בסך הכול, כלומר הוא נושא חומר שלא היה קיים בדפוס לפני 1894. רישום האוסף חותם אותו 1885, השנה שבה השלימה הברית הישנה את המקרא כשלעצמו, וזו השנה שמציג תג שלב השושלת. מאיזו הדפסה יורד הטקסט אינו רשום — אותו פער שהאוסף מותיר פתוח אצל King James Version ואצל Biblia הפינית משנת 1776. שימו לב גם שאף ממשק אינו נפתח במהדורה זו; ממשק אנגלי נפתח ב־New International Version, ואל זו כאן עוברים.

