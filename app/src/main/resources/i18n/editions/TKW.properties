title=Textbibel 1906 — About This Edition | Common Root
description=The Textbibel of Kautzsch and Weizsäcker: a scholars' German Bible translated afresh from the Hebrew and the Greek, first published as one volume at Tübingen in 1899; the text here is dated 1906.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Two professors, two Testaments. Carl Weizsäcker (1822–1899) was a church historian at Tübingen, where he succeeded Ferdinand Christian Baur in 1861 and was chancellor of the university from 1889. His translation of the New Testament first appeared in 1875 and went through nine editions in his lifetime, the last of them prepared on his deathbed. Emil Kautzsch (1841–1910) was an Old Testament scholar who taught at Leipzig, Basel and Tübingen before settling at Halle in 1888; his Old Testament, translated with a group of fellow specialists, appeared complete in 1894.
hero.2=In 1899, the year Weizsäcker died, the two were joined in a single volume, the Textbibel des Alten und Neuen Testaments, published at Tübingen by J.C.B. Mohr (Paul Siebeck). The name says what it is: the bare text, for readers who wanted to know what the Hebrew and the Greek say, in the German of their own day. It was never meant to replace Luther. Weizsäcker deliberately stayed clear of Luther's language and tried instead to give the impression the original made on its first readers; his biographer thought it unlikely ever to become a book for ordinary households, and it did not. It went on being reprinted into the 1910s. The digital text here is dated 1906; which edition that printing was is not something this project has established.
hero.3=It reads like the scholarship of its moment. The divine name in the Old Testament is “Jahwe” — “Jahwe ist mein Hirte” at Psalm 23 — thousands of times over, where Luther has “der Herr”. Isaiah 7:14 has “ein junges Weib”, a young woman. In the New Testament the Lord's Prayer at Matthew 6:13 ends without the doxology, and 1 John 5:7 has no heavenly witnesses. The Old Testament keeps the Hebrew chapters and verses: psalm headings are counted in the verse numbers, so Psalm 51 has 21 verses, and Malachi has three chapters rather than four. The spelling is older than the date suggests — at John 8:1 Jesus “gieng” to the Mount of Olives.
hero.4=In this reader it is one of four German Bibles, beside the Elberfelder and Luther's texts of 1545 and 1912. A German interface does not open on it: German has no curated default, so the reader takes the first German Bible in the catalogue, which is the Elberfelder. No parent is recorded for it in the lineage rungs, which suits a translation made from the originals: a rung opened beneath a verse drops straight to the original-language floor, marked with ≈ — the Westminster Leningrad Codex for the Old Testament and, for the New, the Textus Receptus, a Greek text this translation does not follow, as 1 John 5:7 shows.

