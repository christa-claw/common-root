title=Palabra de Dios para Ti — Bu Baskı Hakkında | Common Root
description=Palabra de Dios para Ti: Asociación Bíblica Latinoamericana'nın 2020'de yayımladığı, İbranice tanrı adlarını harf çevirisiyle koruyan ve her türlü kullanım için serbestçe lisanslanmış bir İspanyolca çeviri.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — "Sana Tanrı'nın Sözü" — Asociación Bíblica Latinoamericana'nın 2020'de yayımladığı yeni bir İspanyolca çeviridir; elektronik metin 2022'de, Florida'da kayıtlı kâr amacı gütmeyen bir kuruluş olan ve onu eBible.org ile YouVersion'da dağıtan Latinamerican Textual Bible Foundation, Inc. aracılığıyla çıktı. Çeviri, Francisco Liévano ve Joyce Liévano'ya mal edilir. Bu derlemenin İspanyolca arayüzünün varsayılan olarak açtığı Reina-Valera hattından farklı olarak, bu, Casiodoro de Reina'nın on altıncı yüzyıl çevirisinin ya da ondan türeyen herhangi bir şeyin gözden geçirilmesi değildir; doğrudan kaynak dillerden yapılmış bağımsız bir çeviridir, İspanyolca konuşulan Amerika'nın her yerindeki sıradan okurlara yöneliktir ve izin istenmeden serbestçe alıntılanmak üzere tasarlanmıştır.
hero.2=Eski Antlaşma, Biblia Hebraica Stuttgartensia'yı; Yeni Antlaşma ise Eberhard Nestle'nin Novum Testamentum Graece'sinin 27. baskısını izler. Bir seçim, sayfalarını Reina'dan sonraki çoğu İspanyolca Kutsal Kitaptan ayırır: onlar Tetragrammaton'u "Jehová" olarak verir ya da yerine "Señor" koyarken, Palabra de Dios para Ti İbranice adların kendisini, harf çevirisiyle korur — Yavé, ʼElohim, ʼEL-Shadday — öyle ki Yaratılış, bu baskının kendi sözleriyle, şöyle açılır: "En un principio ʼElohim creó los cielos y la tierra."
hero.3=Bu okuyucuda [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] ve [[VBL|Versión Biblia Libre]] ile birlikte dört İspanyolca baskıdan biridir. Arayüz varsayılan olarak hâlâ Reina-Valera 1909'u açar; bu, kendi kartından ulaşılan bir baskıdır. Diğer ikisi gibi, bu da derlemenin taşıdığı başka bir metnin gözden geçirilmesi değil, yeni bir çeviridir; bu yüzden soy basamaklarında ona kayıtlı bir kaynak metin yoktur — ayetlerinden birinin altında açılan bir basamak, doğrudan ≈ ile imlenen özgün diller tabanına iner. Asociación Bíblica Latinoamericana, deuterokanonik kitapları da içeren daha kapsamlı bir basılı baskı da yayımlar; bu derlemenin taşıdığı metin, alışılmış altmış altı kitaplık Protestan kanonudur.

