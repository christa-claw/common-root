fact.2.value=Giovanni Diodati (1576–1649), né à Genève dans une famille protestante originaire de Lucques
fact.3.label=Première parution
fact.3.value=1607, à Genève ; révisée par Diodati lui-même, avec notes, en 1641
fact.4.label=Cette forme
fact.4.value=le texte de Diodati de 1641 dans la révision de 1821, en une édition datée de 1885 — selon la description d'eBible.org ; le réviseur et l'imprimeur ne sont pas établis ici
fact.5.label=Le grec du Nouveau Testament
fact.5.value=les éditions de Bèze — au sein de cette famille de textes grecs imprimés que ce corpus tient pour le [[TR|Textus Receptus]]
fact.6.label=Nom divin
fact.6.value=« il Signore » — le Seigneur — comme dans l'autre Diodati ; [[RIV1927|la Riveduta]] le changea plus tard en « l'Eterno »
fact.7.label=Découpage en versets
fact.7.value=diffère de [[DIO|Diodati 1649]] en plus de trente endroits, plus proche du système hébreu ; sept versets de moins au total
fact.8.label=Titres des psaumes
fact.8.value=aucun dans cette copie — très probablement perdus à l'import, puisque la présentation du même texte par eBible.org les montre
fact.9.label=Contenu
fact.9.value=66 livres — le canon protestant, sans deutérocanoniques ; Psaumes dans la numérotation hébraïque
fact.10.label=Licence
fact.10.value=Domaine public ; cette copie provient d'eBible.org, fournie par l'Alliance biblique universelle
fact.11.label=Dans ce corpus
fact.11.value=l'une des trois bibles italiennes, à côté de [[DIO|Diodati 1649]] et de [[RIV1927|Riveduta 1927]] ; une interface en italien s'ouvre sur Diodati 1649 ; aucun ascendant n'est enregistré dans les échelons de filiation, et sa pastille d'échelon affiche 1885
