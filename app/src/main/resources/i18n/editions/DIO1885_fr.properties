title=Diodati 1885 (italien) — À propos de cette édition | Common Root
description=La bible italienne de Giovanni Diodati sous une forme du XIXe siècle : son texte de 1641 dans la révision de 1821, en une édition datée de 1885 — la même traduction que l'autre Diodati de ce corpus, découpée autrement en versets.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=C'est la traduction de Giovanni Diodati — le Genevois de famille lucquoise, né en 1576, qui publia en 1607 la première Bible italienne faite sur l'hébreu et le grec plutôt que sur le latin, et la révisa avec ses propres notes en 1641, huit ans avant sa mort. L'autre Diodati de ce corpus a sa propre page, qui raconte cette histoire. Pendant deux siècles après lui, le texte vécut de réimpressions, et à partir de 1808 la Société biblique britannique et étrangère le publia édition après édition, parce qu'il n'y avait rien d'autre à imprimer pour les protestants italiens.
hero.2=Ce fichier est l'une de ces formes tardives. eBible.org, qui le fournit au nom de l'Alliance biblique universelle, le décrit comme la traduction de Diodati de 1641 révisée en 1821, en une édition datée de 1885. Qui fit la révision de 1821 et quelle presse imprima l'édition de 1885, ce projet ne l'a pas établi, aussi la page ne les nomme-t-elle pas. La date ne pose pas ici le problème qu'elle pose pour l'autre Diodati, dont l'étiquette est l'année de la mort de Diodati : 1885 est la date propre de l'édition, le catalogue la stocke et la pastille d'échelon l'affiche.
hero.3=Placée à côté de l'autre Diodati, la formulation est la même à chaque sondage : « il Signore è il mio pastore » au Psaume 23, « la Vergine concepirà » en Ésaïe 7:14, les témoins célestes en 1 Jean 5:7, la doxologie à la fin du Notre Père, Actes 8:37 en entier. Le nom divin est « il Signore », le Seigneur, comme Diodati l'écrivit ; c'est la Riveduta, une révision de ce texte publiée en 1924, qui le changea en « l'Eterno ». Ce qui diffère, c'est le découpage en versets. En plus de trente endroits, cette copie suit un autre système, proche de l'hébreu — la prière de Jonas commence en 2:1 et le chapitre va jusqu'à 2:11, Ésaïe 8 a un 23e verset, Job 39 se prolonge jusqu'au verset 38, et le premier verset de Colossiens 4 se trouve à la fin du chapitre 3 —, si bien qu'elle compte sept versets de moins au total. Et cette copie n'a aucun des titres des psaumes : le Psaume 51 s'ouvre directement sur « Abbi pietà di me, o Dio », là où l'autre Diodati fond le titre dans le premier verset. La présentation de ce texte par eBible.org elle-même montre les titres, ils ont donc très probablement été perdus lors de l'import de ce projet plutôt que manquants dans l'impression de 1885.
hero.4=Dans ce lecteur, elle est l'une des trois bibles italiennes. Une interface en italien s'ouvre sur l'autre Diodati, Diodati 1649, qui vient en premier dans l'ordre du catalogue, puisque l'italien n'a pas de choix curaté. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation — pas même cette autre copie de la même traduction —, de sorte qu'un échelon ouvert sous un verset tombe droit sur le plancher des langues originales marqué de ≈. Comme pour l'autre Diodati, le Textus Receptus y est proche de la vérité : Diodati travaillait sur le grec imprimé de Bèze, un texte de cette famille.

