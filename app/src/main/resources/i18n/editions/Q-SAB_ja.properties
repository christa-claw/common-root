title=クルアーン — サブルコフ — この版について | Common Root
description=ゴルディイ・サブルコフによるロシア語訳。1878年にカザンで出版され、フランス語や英語を介さずアラビア語から直接訳された最初のロシア語訳クルアーンとされることが多い——本コーパスでは、ウスマーン正書体のアラビア語本文の下に示されるロシア語訳である。
heroHeading=クルアーン — サブルコフ
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=ゴルディイ・セミョーノヴィチ・サブルコフ（1803年-1880年）はロシア正教の聖職者となるための教育を受け、1826年にオレンブルク神学校を、1830年にモスクワ神学大学を卒業した。続く二十年間、1830年から1849年にかけてサラトフ神学校で歴史と東洋諸語を教え——1840年代半ばには、後に急進的な作家となるニコライ・チェルヌィシェフスキーも教え子の一人であった——その後1849年にカザン神学大学の宣教学部に移り、1862年まで東洋諸語と古典語を教えた。
hero.2=ロシア語によるクルアーン翻訳は1716年にまで遡る。この年、ピョートル・ポストニコフがピョートル大帝の命により翻訳を行ったが、それはアラビア語からではなく、アンドレ・デュ・リエのフランス語訳からのものであった。1792年のアレクセイ・コルマコフの翻訳も同様に、ジョージ・セールの英訳からのものであった。1878年にカザンで"Коран, законодательная книга мохаммеданского вероучения"（「クルアーン、ムハンマド教の立法の書」）として出版されたサブルコフの翻訳は、アラビア語原典から直接訳された最初のロシア語訳クルアーンとされることが多く、カザンで東洋諸語を教えた彼の長年の成果であった。
hero.3=彼は翌年、注釈を添えた副巻"Приложения к переводу Корана"（1879年）を続けて出し、その後これに関連する二つの研究、"Сведения о Коране"（「クルアーンについての情報」、1884年）、および神の諸名に関するキリスト教とイスラームの教えを比較した、それより前に書かれた論考（1873年）を発表した。彼の翻訳は、後の翻訳——その中にはイグナーティ・クラチコフスキーの死後出版された翻訳も含まれる——がソ連およびソ連後の学術的使用でより広く知られるようになった後も、流布したロシア語訳の一つであり続けた。
hero.4=ここでalquran.cloudのru.sablukov版を通じてデジタル化されているものは、本コーパスでは[[Q-AR|ウスマーン正書体のアラビア語本文]]に添えるロシア語訳として、1930年の[[Q-EN|ピクソール]]訳と1934年の[[Q-YA|ユースフ・アリー]]訳という英訳と並んで提供される——これら三つの翻訳は、入手可能な翻訳を調べた結果、明確に自由に使用できると分かったものであり、アラビア語を除く各言語につき一つずつである。

