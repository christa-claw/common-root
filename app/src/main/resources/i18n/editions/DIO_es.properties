fact.2.value=Giovanni Diodati (1576–1649), nacido en Ginebra en una familia de mercaderes protestantes que habían dejado Luca antes que renunciar a su religión
fact.3.label=Primera publicación
fact.3.value=1607, en Ginebra — la primera Biblia italiana hecha desde el hebreo y el griego y no desde el latín
fact.4.label=Edición revisada
fact.4.value=1641, con notas propias de Diodati; en esa forma se reimprimió el texto los tres siglos siguientes
fact.5.label=Por qué la etiqueta dice 1649
fact.5.value=1649 es el año en que murió Diodati, no el año de una edición — la fecha viaja con el texto digital, y la ficha del catálogo deja vacía la columna del año antes que afirmar uno
fact.6.label=El griego detrás del Nuevo Testamento
fact.6.value=las ediciones de Beza, hechas en Ginebra una generación antes — dentro de esa familia de textos griegos impresos que este corpus tiene por [[TR|Textus Receptus]]
fact.7.label=También suya
fact.7.value=una Biblia francesa, 1644, generalmente tenida por la más floja de las dos — el francés no era la lengua en que pensaba
fact.8.label=Contenido
fact.8.value=66 libros — el canon protestante, sin deuterocanónicos
fact.9.label=En este corpus
fact.9.value=la única Biblia italiana de aquí, de manera que una interfaz en italiano abre en ella; en los peldaños de linaje no consta antecedente alguno, y su peldaño se presenta sin año
