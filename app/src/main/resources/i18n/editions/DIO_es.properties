title=Diodati 1649 (italiano) — Acerca de esta edición | Common Root
description=La Biblia italiana de Giovanni Diodati: publicada en Ginebra en 1607, la primera hecha desde el hebreo y el griego y no desde la Vulgata, revisada con notas suyas en 1641 — y por qué la fecha que lleva el archivo es el año de su muerte.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati nació en Ginebra en 1576, en una familia de mercaderes de Luca que habían dejado Italia antes que renunciar a su religión. Era italiano de linaje y ginebrino de formación, y justamente en esa combinación está toda la razón de que exista este libro: tenía la lengua del país al que la Reforma no había llegado, y estaba en la ciudad que se había vuelto su imprenta. Teodoro de Beza lo propuso para la cátedra de hebreo a los veintiún años. Fue profesor de teología desde 1606, pastor desde 1608, y sucedió a Beza en la cátedra de teología al año siguiente; en 1618 fue al Sínodo de Dort como delegado de Ginebra y fue uno de los seis hombres designados para redactar sus actas.
hero.2=Su Biblia italiana se imprimió en Ginebra en 1607. Italia había tenido antes biblias en lengua vulgar — la de Malermi de 1471, la de Brucioli de 1532 —, pero trabajaban desde el latín o se apoyaban mucho en él. Diodati fue al hebreo y al griego, y para el Nuevo Testamento eso significó el texto griego que Beza había editado en la misma ciudad una generación antes. En 1641 sacó una edición revisada con notas explicativas suyas, y de ésa descienden las reimpresiones. Llegó a ser, y ha seguido siendo, la Biblia protestante italiana — lo cual, en un país casi sin lectores protestantes, quiso decir que durante cuatro siglos la llevó muy poca gente. Tradujo también la Biblia al francés, en 1644; aquélla se tiene generalmente por la más floja, y él probablemente no habría discutido.
hero.3=La fecha de la ficha merece una frase, porque no la hay. Este texto circula en forma digital bajo la etiqueta «Diodati 1649», y 1649 no es una edición: es el año en que murió Diodati. Las dos fechas que significan algo son 1607, cuando la traducción apareció por primera vez, y 1641, cuando él la revisó. Cuál de las dos representa realmente un archivo digital dado es cosa que este proyecto no ha establecido, de modo que el catálogo deja vacía la columna del año antes que imprimir un número por el que no puede responder. El nombre se conserva tal como llegó, porque es el que la gente buscará.
hero.4=En este lector es la única Biblia italiana, de manera que poner la interfaz en italiano abre en ella — no por una elección curada, como se escogió la Reina-Valera 1909 para el español, sino porque el barrido del catálogo no encuentra otra cosa en la lengua. En los peldaños de linaje no consta antecedente alguno, de modo que un peldaño abierto bajo un versículo baja derecho al suelo de lenguas originales marcado con ≈. Ese suelo suministra el Textus Receptus para el griego, y aquí eso queda inusualmente cerca de la verdad: para la mayoría de las ediciones de este corpus el Receptus hace las veces de un texto crítico que los traductores sí usaron, pero Diodati trabajaba de veras sobre un texto griego impreso de esa familia. Su peldaño no lleva año, cosa que corresponde al blanco de la ficha.

