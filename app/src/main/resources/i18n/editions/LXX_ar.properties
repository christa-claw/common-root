title=السبعينية اليونانية لبرنتون — عن هذه الطبعة | Common Root
description=الترجمة السبعينية — العهد القديم اليوناني ليهود الشتات وللكنيسة الأولى — في النص اليوناني الذي طبعه لانسلوت برنتون إلى جانب ترجمته الإنجليزية سنة 1851، وهي في هذا القارئ الدرجة التي تحت الفولغاتا والترجمة السينودسية الروسية.
heroHeading=السبعينية اليونانية لبرنتون
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=الترجمة السبعينية أقدم ترجمة للكتاب المقدس العبري، وكانت في القرون المسيحية الأولى هي الكتاب المقدس ببساطة. بدأها يهود ناطقون باليونانية في الإسكندرية بأسفار الشريعة الخمسة، على الأرجح في القرن الثالث قبل الميلاد، ثم تبعتها الأسفار الأخرى خلال القرنين التاليين. ويأتي اسمها من رواية: إذ تحكي رسالة أريستياس عن اثنين وسبعين شيخًا أُرسلوا من أورشليم ليترجموا الشريعة للملك بطليموس الثاني، فصار «السبعون» — LXX بالأرقام الرومانية — اسمًا للعهد القديم اليوناني كله. ويقتبس منها كتّاب العهد الجديد باستمرار، وكانت الكنيسة الأولى تقرؤها، ولا تزال الكنائس الأرثوذكسية تقرؤها عهدًا قديمًا لها.
hero.2=وأهميتها تتجاوز قِدَمها. فقد عمل المترجمون على مخطوطات عبرية تختلف في مواضع عن النص الماسوري الذي صار معيارًا فيما بعد — فسفر إرميا مثلًا أقصر بكثير في اليونانية — ولذلك كانت السبعينية في مواضع كثيرة أقدم شاهد على قراءة عبرية لم يحفظها التقليد العبري نفسه. وهي تضم كذلك أسفارًا ليست في القانون العبري، منها طوبيا ويهوديت والحكمة ويشوع بن سيراخ وباروخ. وبعض اختياراتها اللفظية صار عقيدة: ففي إشعياء 7:14، حيث تقول العبرية ʿalmah، أي فتاة، تقول اليونانية parthenos، أي عذراء — وهي الكلمة التي يقتبسها متى.
hero.3=النص اليوناني هنا هو الذي طبعه السير لانسلوت برنتون. فقد نشر سنة 1844 ترجمة إنجليزية للسبعينية اعتمد فيها أساسًا على المخطوطة الفاتيكانية، وهي مخطوطة من القرن الرابع محفوظة في مكتبة الفاتيكان؛ وفي سنة 1851 أعاد صموئيل باغستر في لندن نشرها مضيفًا إليها الأسفار الأبوكريفية وواضعًا اليونانية إلى جانب الإنجليزية، وتلك اليونانية هي ما تضمه هذه المجموعة. ومزاميرها تحتفظ بالترقيم اليوناني الذي تشاركها فيه الفولغاتا الموجودة هنا: فالمزمور 22 في كليهما هو مزمور الراعي، وهو المزمور 23 في العبرية وفي معظم الأناجيل الإنجليزية. وعدد المزامير 151؛ وعزرا ونحميا سفر واحد؛ وأستير ودانيال بصيغتيهما اليونانيتين الأطول.
hero.4=وهي في هذا القارئ درجة لا قاع. فهي تقع تحت الفولغاتا اللاتينية، لأن جزءًا من الفولغاتا جاء عبر اليونانية: فمزاميرها هي التي صنعها جيروم عن يونانية «الهكسابلا» لأوريجانوس ولم تحلّ محلها قط ترجمته هو عن العبرية، وبقيت الحكمة ويشوع بن سيراخ وباروخ في ترجمات لاتينية قديمة مأخوذة عن اليونانية. وتقع تحت الترجمة السينودسية الروسية، التي احتفظ عهدها القديم بقراءات كثيرة من السبعينية جاءتها من الكتاب المقدس السلافوني الذي سبقها، وتحت ترجمة برنتون الإنجليزية نفسها. وليس لها أصل مسجَّل: فالنص العبري الذي تُرجمت عنه ليس في المجموعة، ومخطوطة لينينغراد، الأحدث منها بأكثر من ألف عام والمنتمية إلى الخط الماسوري، لا تظهر تحتها إلا قاعًا للغات الأصلية. وهي عهد قديم فقط، فتُتخطّى هذه الدرجة تحت آيات العهد الجديد — وليست كل أسفار التقليد اليوناني هنا: في هذه النسخة 45 سفرًا، وليس فيها شيء من أسفار المكابيين.

