title=Palabra de Dios para Ti — Su questa edizione | Common Root
description=Palabra de Dios para Ti: una traduzione spagnola pubblicata nel 2020 dall'Asociación Bíblica Latinoamericana, che mantiene traslitterati i nomi ebraici di Dio ed è concessa liberamente in licenza per qualunque uso.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — "la Parola di Dio per te" — è una traduzione spagnola nuova, pubblicata nel 2020 dall'Asociación Bíblica Latinoamericana; un testo elettronico è uscito nel 2022 tramite la Latinamerican Textual Bible Foundation, Inc., ente senza scopo di lucro registrato in Florida che la distribuisce su eBible.org e YouVersion. È attribuita ai traduttori Francisco Liévano e Joyce Liévano. A differenza della linea Reina-Valera, su cui si apre per impostazione predefinita l'interfaccia spagnola di questo corpus, non è una revisione della traduzione di Casiodoro de Reina del Cinquecento né di nulla che ne discenda; è una traduzione indipendente, fatta direttamente dalle lingue originali, rivolta ai lettori comuni di tutta l'America di lingua spagnola e pensata per essere citata liberamente, senza chiedere permesso.
hero.2=L'Antico Testamento segue la Biblia Hebraica Stuttgartensia e il Nuovo Testamento la 27ª edizione del Novum Testamentum Graece di Eberhard Nestle. Una scelta distingue le sue pagine dalla maggior parte delle Bibbie spagnole successive a Reina: dove queste rendono il Tetragramma con "Jehová" o lo sostituiscono con "Señor", Palabra de Dios para Ti mantiene i nomi ebraici stessi, traslitterati — Yavé, ʼElohim, ʼEL-Shadday — cosicché la Genesi si apre, nelle parole stesse di questa edizione, con "En un principio ʼElohim creó los cielos y la tierra".
hero.3=In questo lettore è una delle quattro edizioni spagnole, accanto a [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] e [[VBL|Versión Biblia Libre]]. L'interfaccia apre ancora per impostazione predefinita la Reina-Valera 1909; questa è un'edizione a cui si arriva dalla propria scheda. Come le altre due, è una traduzione nuova e non la revisione di nient'altro che il corpus contenga, sicché non le è registrato alcun testo base nei pioli della discendenza — un piolo aperto sotto uno dei suoi versetti cade diritto sul pavimento delle lingue originali contrassegnato con ≈. L'Asociación Bíblica Latinoamericana pubblica anche un'edizione a stampa più completa con i libri deuterocanonici; il testo che questo corpus detiene è il consueto canone protestante di sessantasei libri.

