title=Palabra de Dios para Ti — Om denna utgåva | Common Root
description=Palabra de Dios para Ti: en spansk översättning utgiven 2020 av Asociación Bíblica Latinoamericana, som behåller de hebreiska gudsnamnen translittererade och är fritt licensierad för all användning.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — "Guds ord till dig" — är en ny spansk översättning utgiven 2020 av Asociación Bíblica Latinoamericana; en elektronisk text kom 2022 genom Latinamerican Textual Bible Foundation, Inc., en ideell organisation registrerad i Florida som sprider den på eBible.org och YouVersion. Den tillskrivs översättarna Francisco Liévano och Joyce Liévano. Till skillnad från Reina-Valera-linjen, som detta korpus spanska gränssnitt öppnar på som standard, är den inte en revision av Casiodoro de Reinas översättning från femtonhundratalet eller av något som härstammar från den; den är en självständig översättning, gjord direkt från källspråken, riktad till vanliga läsare i det spansktalande Amerika och avsedd att citeras fritt, utan att be om tillstånd.
hero.2=Gamla testamentet följer Biblia Hebraica Stuttgartensia och Nya testamentet den 27:e upplagan av Eberhard Nestles Novum Testamentum Graece. Ett val skiljer dess sidor från de flesta spanska biblar sedan Reina: där dessa återger Tetragrammet som "Jehová" eller ersätter det med "Señor", behåller Palabra de Dios para Ti de hebreiska namnen själva, translittererade — Yavé, ʼElohim, ʼEL-Shadday — så att Första Moseboken öppnar, med denna utgåvas egna ord, "En un principio ʼElohim creó los cielos y la tierra."
hero.3=I denna läsare är den en av fyra spanska utgåvor, jämte [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] och [[VBL|Versión Biblia Libre]]. Gränssnittet öppnar fortfarande som standard Reina-Valera 1909; detta är en utgåva man når via sitt eget kort. Liksom de två andra är den en ny översättning och inte en revision av något annat som korpuset rymmer, så ingen förlaga är noterad för den i stegpinnarna — en stegpinne öppnad under en av dess verser faller rakt ned på det med ≈ markerade grundspråksgolvet. Asociación Bíblica Latinoamericana ger även ut en fylligare tryckt utgåva med de deuterokanoniska böckerna; texten som finns i detta korpus är den sedvanliga sextiosex böcker omfattande protestantiska kanon.

