title=Versión Biblia Libre — Su questa edizione | Common Root
description=Versión Biblia Libre: una Bibbia spagnola di Free Bible Ministry, tradotta da Jonathan Gallagher e Shelly Barrios de Avila come gemella spagnola della Free Bible Version inglese, e concessa liberamente in licenza per qualunque uso.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — "la versione libera della Bibbia" — è la gemella in lingua spagnola della Free Bible Version inglese, pubblicata dallo stesso editore, Free Bible Ministry, un ente senza scopo di lucro con sede a Laurel, nel Maryland. Il suo Nuovo Testamento è attribuito ai traduttori Jonathan Gallagher e Shelly Barrios de Avila, con Gustavo Sanabria e Rebekah Põldaas come collaboratori, e reca un copyright datato 2018–2020 a nome di Gallagher e Barrios de Avila. Come la sua gemella inglese, esiste per togliere di mezzo la pagina di copyright come ostacolo all'uso: il testo può essere copiato, stampato, pubblicato online o adattato da chiunque, senza royalty e senza permesso da chiedere.
hero.2=I preliminari pubblicati documentano chiaramente la base del Nuovo Testamento — tradotto direttamente dal testo greco di Nestle–Aland, il testo critico di cui si servono le società bibliche — ma non indicano separatamente un testo fonte per l'Antico Testamento, pur essendo l'edizione detenuta da questo corpus il canone protestante completo di sessantasei libri. Dove i materiali lasciano un vuoto, lo si lascia anche qui, piuttosto che colmarlo con una supposizione.
hero.3=In questo lettore è una delle cinque edizioni spagnole. L'interfaccia spagnola apre ancora per impostazione predefinita la [[RVR09|Reina-Valera 1909]], un testo di pubblico dominio proveniente da una tradizione del tutto distinta e di secoli più antica; questa edizione si raggiunge invece dalla propria scheda, accanto a [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] e [[NBLA|Nueva Biblia de las Américas]]. Non è la revisione di nessuna di esse, sicché non le è registrato alcun testo base nei pioli della discendenza — un piolo aperto sotto uno dei versetti della Versión Biblia Libre cade diritto sul pavimento delle lingue originali contrassegnato con ≈. Il suo parente più stretto in questo corpus non è affatto spagnolo: [[FBV|la Free Bible Version]], la traduzione inglese dello stesso ente, sotto la stessa licenza.

