title=Diodati 1885 (italiano) — Acerca de esta edición | Common Root
description=La Biblia italiana de Giovanni Diodati en una forma del siglo XIX: su texto de 1641 en la revisión de 1821, en una edición fechada en 1885 — la misma traducción que el otro Diodati de este corpus, dividida en versículos de otra manera.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Esta es la traducción de Giovanni Diodati — el ginebrino de familia luquesa, nacido en 1576, que en 1607 publicó la primera Biblia italiana hecha del hebreo y del griego y no del latín, y la revisó con notas propias en 1641, ocho años antes de morir. El otro Diodati de este corpus tiene una página propia que cuenta esa historia. Durante dos siglos después de él, el texto vivió de reimprimirse, y desde 1808 la Sociedad Bíblica Británica y Extranjera lo publicó en una edición tras otra, porque para los protestantes italianos no había otra cosa que imprimir.
hero.2=Este archivo es una de esas formas posteriores. eBible.org, que lo ofrece en nombre de las Sociedades Bíblicas Unidas, lo describe como la traducción de Diodati de 1641 revisada en 1821, en una edición fechada en 1885. Quién hizo la revisión de 1821 y qué imprenta imprimió la edición de 1885 no es algo que este proyecto haya establecido, así que la página no los nombra. La fecha no es el problema que es en el otro Diodati, cuya etiqueta es el año en que murió Diodati: 1885 es la fecha propia de la edición, el catálogo la guarda y el peldaño la muestra.
hero.3=Puesta junto al otro Diodati, la redacción es la misma en cada cata: «il Signore è il mio pastore» en el Salmo 23, «la Vergine concepirà» en Isaías 7:14, los testigos celestiales en 1 Juan 5:7, la doxología al final del padrenuestro, Hechos 8:37 completo. El nombre divino es «il Signore», el Señor, como lo escribió Diodati; fue la Riveduta, una revisión de este texto publicada en 1924, la que lo cambió por «l'Eterno». Lo que difiere es la división en versículos. En más de treinta lugares esta copia sigue otro esquema, cercano al hebreo — la oración de Jonás empieza en 2:1 y el capítulo llega a 2:11, Isaías 8 tiene un versículo 23, Job 39 sigue hasta el versículo 38, y el primer versículo de Colosenses 4 está al final del capítulo 3 —, de modo que cuenta siete versículos menos en total. Y esta copia no tiene ninguno de los títulos de los salmos: el Salmo 51 empieza directamente en «Abbi pietà di me, o Dio», donde el otro Diodati une el título al primer versículo. La propia presentación de este texto en eBible.org muestra los títulos, así que lo más probable es que se perdieran en la importación de este proyecto y no que falten en la impresión de 1885.
hero.4=En este lector es una de tres Biblias italianas. Una interfaz en italiano abre en el otro Diodati, Diodati 1649, que va primero en el orden del catálogo, ya que el italiano no tiene elección curada. En los peldaños de linaje no consta antecedente alguno para ella — ni siquiera esa otra copia de la misma traducción —, de modo que un peldaño abierto bajo un versículo cae directamente al suelo de lenguas originales marcado con ≈. Como en el otro Diodati, el Textus Receptus está ahí cerca de la verdad: Diodati trabajó con el griego impreso de Beza, un texto de esa familia.

