title=Free Bible Version — Acerca de esta edición | Common Root
description=Free Bible Version: una Biblia inglesa moderna traducida del hebreo y del griego de Nestle–Aland por Jonathan Gallagher, publicada bajo una licencia de compartir-igual para que cualquiera pueda reimprimirla.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Esta traducción existe por culpa de una página de derechos. Casi todas las Biblias inglesas modernas llevan una, y lo que suele decir es que unos cientos de versículos pueden citarse sin pedir permiso, que un libro entero exige autorización por escrito y que publicar el texto completo significa pagar regalías. Para el sitio web de una iglesia o para una grabación, ahí puede acabar el asunto. La Free Bible Version se hizo para ser la versión que no tiene nada por delante.
hero.2=Es obra de Jonathan Gallagher, doctor en teología por St Andrews, y la publica Free Bible Ministry, una entidad sin ánimo de lucro. El Nuevo Testamento procede del griego de Nestle–Aland — el texto crítico que emplean las sociedades bíblicas — y el Antiguo del hebreo. Vale la pena declarar el método que el proyecto describe, porque no es el habitual: se traduce del texto original solo con léxicos y únicamente después se coteja con las versiones existentes, como control de duplicaciones y errores y no como fuente. No es la revisión de una Biblia inglesa anterior ni la síntesis de otras más recientes. Su objetivo declarado es un inglés contemporáneo que evita la jerga y los giros de moda, y se niega a traducir hacia las posiciones de ninguna comunidad de fe en particular.
hero.3=La licencia es lo esencial del asunto. Es Creative Commons Atribución-CompartirIgual 4.0: cópiela, imprímala, póngala en un sitio web, adáptela, siempre que se nombre la versión, se señalen los cambios y todo lo que se construya a partir de ella salga bajo los mismos términos. Es un trato distinto del dominio público — la libertad se transmite en vez de cederse — y es la misma licencia que la Versión Biblia Libre española de este corpus, que procede del mismo ministerio.
hero.4=De ahí se siguen dos cosas para el lector. El catálogo deja su año en blanco, porque el proyecto publica revisiones a medida que las hace; no hay una impresión fechada a la que este corpus quede sujeto, e inventar una sería peor que el blanco. Y un peldaño abierto bajo un versículo de la Free Bible Version muestra ≈ TR, el Textus Receptus, marcado como testigo y no como texto base. No es de ahí de donde se hizo esta traducción. Es lo que el corpus puede ofrecer hoy como griego — todavía no hay aquí ninguna edición crítica — y el mismo suplente aparece, por la misma razón, bajo la New International Version, la New American Standard Bible y la Berean Standard Bible.

