fact.6.label=Estilo
fact.6.value=inglés moderno sin jerga ni coloquialismos pasajeros, y sin intentar reflejar las posiciones de ninguna comunidad de fe en particular
fact.7.label=Licencia
fact.7.value=Creative Commons Atribución-CompartirIgual 4.0 — cópiese, imprímase y adáptese libremente, siempre que se nombre la versión, se señalen los cambios y lo derivado lleve la misma licencia
fact.8.label=Año en el catálogo
fact.8.value=dejado en blanco antes que adivinado — el proyecto revisa el texto y lo vuelve a publicar sobre la marcha, de modo que ninguna impresión concreta es la edición
fact.9.label=Bajo un peldaño
fact.9.value=≈ TR, testigo del griego más que texto base de esta traducción; el corpus aún no contiene ninguna edición crítica griega, así que el mismo suplente sirve a [[NIV|la NIV]], [[NASB|la NASB]] y [[BSB|la BSB]]
fact.10.label=En este corpus
fact.10.value=los 66 libros. El inglés abre en la [[NIV|New International Version]] licenciada, de modo que esta figura junto a [[BSB|la Berean Standard Bible]] y [[WEB|la World English Bible]] como el inglés que un lector puede llevarse consigo al salir
