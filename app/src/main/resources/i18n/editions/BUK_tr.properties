title=Sahih al-Buhari — Bu Baskı Hakkında | Common Root
description=Sahih al-Buhari: Sünni İslam'ın Kur'an'dan sonra en yetkili ikinci kaynak saydığı hadis derlemesi; Muhammad el-Buhari onu incelediği yaklaşık 600.000 rivayet arasından, yalnızca güvenilir bulduğu ravilerin kesintisiz bir zincirini taşıyanları kabul ederek seçmiştir.
heroHeading=Sahih al-Buhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad bin İsmail el-Buhari bu derlemeyi büyük ölçüde iki mescitte — Mekke'deki Mescid-i Haram ile Medine'deki Mescid-i Nebevî'de — bir araya getirdi ve doğduğu şehir Buhara'da, hicretin 232. yılı (miladi 846) civarında tamamladı; ömrünün son yaklaşık yirmi yılını seyahatleri boyunca eseri daha da gözden geçirmeye adadı. Tam adı el-Câmiu'l-Müsnedü's-Sahîhu'l-Muhtasar min Umûri Resûlillâh ve Sünenihî ve Eyyâmihî olan eser, genellikle Sahih el-Buhari olarak kısaltılır — "el-Buhari'nin güvenilir [derlemesi]". El-Buhari'nin kendisi, onu incelediği yaklaşık 600.000 rivayet arasından seçtiğini ve bir rivayeti, kendi değerlendirmesine göre, asıl kaynağına kadar kesintisiz, güvenilir ravilerden oluşan bir zincir taşıdığında kabul ettiğini söylediği rivayet edilir.
hero.2=Bu ölçüt, kitabın taşıdığı ağırlığın nedenidir. Sahih el-Buhari, Sünni İslam'ın Altı Kitabı (Kütüb-i Sitte) arasında birinci sayılır; yöntem ve itibar açısından en yakın rakibi olan Sahih-i Müslim ile birlikte, bu ikisine es-Sahihayn, "iki güvenilir [eser]" denir. Sünni âlimlerin çoğu, el-Buhari'nin derlemesini diğer her hadis kitabının üstünde ve yetkide Kur'an'ın hemen ardından sayar, gerçi bir azınlık yerine Sahih-i Müslim'in önceliğini savunmuştur. Malzeme, ravi veya kronolojiye göre değil konuya göre düzenlenmiştir (âlimlerin musannaf dediği bu düzen); ritüel temizlik ve namazdan ticarete, evliliğe, önceki peygamberlerin hayatına ve Son Saat'in alametlerine uzanan kitaplara (kütüb) bölünmüştür.
hero.3=Kitabın gerçekte kaç hadis içerdiği, hangi baskı geleneğinin saydığına bağlıdır. Bugün en çok anılan sayı olan 7.563, editör Muhammad Fuad Abdülbaki'nin metne yirminci yüzyılda verdiği numaralandırmadan gelir ve bir hadisi, başka bir bölüm altında her tekrarlandığında yeniden sayar; tekrarlar çıkarıldığında İbn Hacer el-Askalani 2.602 saymıştır. Diğer âlimler de başka toplam sayılar önermiştir. Bu derlemenin kendi sayısı ise üçüncü bir sayıdır: 98 kitap ve 7.589 numaralı hadis — bu, yalnızca alındığı dijital baskının biçimidir, herhangi bir belirli basılı numaralandırmayı tam olarak yeniden üretme iddiası taşımaz.
hero.4=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-bukhari baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

