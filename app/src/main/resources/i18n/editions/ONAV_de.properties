title=Open New Arabic Version — Über diese Ausgabe | Common Root
description=Biblicas Open New Arabic Version: eine moderne arabische Bibel mit dem Copyright-Vermerk 1988, 1997 und 2012, veröffentlicht unter einer Creative-Commons-Lizenz, die es erlaubt, sie mit Namensnennung weiterzugeben, zu bearbeiten und zu drucken.
heroHeading=Biblicas Open New Arabic Version
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Dies ist eine moderne arabische Übersetzung, ein anderer Text als [[SVD|Smith & Van Dyck]] und nicht eine weitere Abschrift davon. Sie wird von Biblica, Inc. veröffentlicht, deren Copyright-Vermerk drei Jahre trägt: 1988, 1997 und 2012. Die Copyright-Seite des Textes selbst nennt seinen älteren Namen, Ketab El Hayat Majani.
hero.2=Was ihn in diesem Leser auszeichnet, ist seine Lizenz. Biblica veröffentlichte ihn als „offenen“ Text unter der Creative Commons Namensnennung-Weitergabe unter gleichen Bedingungen 4.0-Lizenz: Jeder darf ihn kopieren, bearbeiten und drucken, sofern Biblica genannt wird und alles daraus Entstandene zu denselben Bedingungen weitergegeben wird. Der Hinweistext, den Biblica verlangt, lautet: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". Die meisten modernen Übersetzungen werden nicht auf diese Weise angeboten, und deshalb steht er hier.
hero.3=Die Lizenz hat eine Bedingung, die man kennen sollte. Der unveränderte Text darf den Namen Biblica tragen. Ein umgestellter Text darf das nicht: Die Ausgaben in Ereignisfolge und Entstehungsfolge auf dieser Seite setzen die Bücher in eine andere Reihenfolge, was wir als Bearbeitung behandeln, also sagen sie, dass der Text umgestellt wurde, und verwenden Biblicas Namen nicht als Titel.
hero.4=Die Datei ist vollständig vokalisiert. Eine Einzelheit ihrer Quelle: Apostelgeschichte 15,25 und 26 sind als ein einziger Vers gedruckt, sodass das Korpus sie zusammen unter Vers 25 führt und dort keinen eigenen Vers 26 hat.

