title=Brenton İngilizce Septuaginta — Bu baskı hakkında | Common Root
description=Sir Lancelot Brenton'un Yunanca Eski Antlaşma'nın İngilizce çevirisi: ilk kez 1844'te Londra'da yayımlandı, 1851'de apokrif kitaplarla yeniden basıldı — yüzyılı aşkın bir süre İngilizcenin Septuagintası, bu okuyucuda ise çevrildiği Yunanca metnin üstündeki basamak.
heroHeading=Brenton İngilizce Septuaginta
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862), Kraliyet Donanması amirallerinden Sir Jahleel Brenton'un oğluydu ve Oxford'daki Oriel College'dan mezun olduktan iki yıl sonra, 1830'da İngiltere Kilisesi'nde rahip olarak takdis edildi. Orada uzun kalmadı. Oxford'da John Nelson Darby ile tanışmıştı ve 1831'in sonuna gelindiğinde resmî kiliseden ayrılıp Bath'ta bağımsız bir şapel kurmuştu; 1835'e gelindiğinde bu şapel, Darby'nin o sıralar biçimlendirdiği hareket olan Plymouth Kardeşleri ile bağlantılıydı. Darby'nin kendi Kutsal Kitapları da bu derlemededir, Fransızca ve İngilizce. Brenton 1844'te babasının baronetlik unvanını devraldı ve aynı yıl Londra'daki Samuel Bagster and Sons onun Septuaginta çevirisini yayımladı. 1862'de Wight Adası'nda çocuksuz olarak, soyunun son baroneti olarak öldü.
hero.2=İlk İngilizce Septuaginta değildi — Charles Thomson 1808'de Philadelphia'da bir tane yayımlamıştı — ama kalıcı olan buydu: bir buçuk yüzyıldan uzun bir süre, 2007'de New English Translation of the Septuagint çıkana dek, İbranice yerine Yunanca Eski Antlaşma'yı isteyen İngilizce okur Brenton'u okudu. Brenton başlıca Vatikan Kütüphanesi'ndeki 4. yüzyıl el yazması Codex Vaticanus'tan çevirdi. İlk baskıda apokrif kitaplar yoktu; 1851 baskısı onları ekledi ve bu kopyanın yeniden verdiği metin 1851 metnidir. Bagster'in Yunanca-İngilizce baskıları Yunancayı İngilizcenin yanına koyuyordu; o Yunanca metin bu derlemede ayrı bir baskı olarak yer alır. İngilizce Yunancayı izlediği için Yunancanın okuduğu yerde okur: Mezmurlar Yunanca numaralandırmayı korur, bu yüzden burada 22. Mezmur çoban mezmurudur; Yeşaya 7:14'te “a virgin shall conceive” İbranice ʿalmah'ı değil, Yunanca parthenos'u karşılar.
hero.3=Bu okuyucuda tek ve harfiyen bir öncülü olan bir basamaktır: altındaki Yunanca Septuaginta, Brenton'un çevirdiği ve kendi yayıncısının onun İngilizcesinin yanına bastığı metnin ta kendisidir. Ayetlerinden birinin altında bir basamak açın, Yunanca belirir; onun altında da özgün dillerin zemini olarak Leningrad Kodeksi. Derlemede onun üzerinde duran başka bir şey yoktur. Bizim kopyamız kitaptan daha dardır. 37 kitap içerir; bunlar İbranice kanonda da alışılmış adlarıyla bulunan kitaplardır. Alındığı eBible.org dosyaları apokrif kitapları da taşır — Tobit, Yudit, Bilgelik, Sirak, Baruk, dört Makabeler kitabı ve daha fazlası — ve Ester ile Daniel'i yalnızca daha uzun Yunanca biçimleriyle verir. Bunların hiçbiri derlemeye geçmedi; bu yüzden burada ne Ester ne Daniel vardır ve alttaki Yunancada Tobit ya da Bilgelik bulunan yerlerde üstte İngilizce yoktur. Ezra ile Nehemya iki kitap olarak durur; alttaki Yunancada ise tek kitaptır. Aynı çevirinin yazım güncellemesi, Adam Boyd'un 2020 tarihli Updated Brenton'u, derlemede kendi başına bir baskı olarak yer alır.

