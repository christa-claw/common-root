title=Elberfelder 1905 — 关于此版本 | Common Root
description=埃尔伯费尔德圣经：1855 年由约翰·纳尔逊·达秘、卡尔·布罗克豪斯与尤利乌斯·安东·冯·波泽克着手的德文译本，是最早脱离公认文本的德文译本之一——此为 1905 年印本。
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=这名字是个地名。埃尔伯费尔德是伍珀河谷中的一座城市，自 1929 年起属于伍珀塔尔，大部分工作就是在那里做成的。动手的是三个人：约翰·纳尔逊·达秘、卡尔·布罗克豪斯与尤利乌斯·安东·冯·波泽克，都与弟兄运动的德国一支有关。新约于 1855 年问世，诗篇于 1859 年，旧约于 1871 年——都不署任何人的名，只称由“若干基督徒”依原文译出。
hero.2=使它出众的，是它底下的希腊文。当时流通的德文圣经几乎全都仍立在公认文本之上；这一部与之决裂，随着西奈抄本与梵蒂冈抄本在十九世纪中叶陆续刊布而采纳其读法。旧约则依马所拉希伯来文译出。翻译的原则是准确先于文雅：一种紧随希伯来文与希腊文、紧到发硬的德文，凡为文义补足的字都标明为补足，并且完全不设分段标题，理由是原文本来就没有。它至今仍被算在最贴近其底本字句的德文译本之列。
hero.3=此处所用的是 1905 年印本，第一次以罗马字体而非哥特体排印；因字号细小，人称 Perlbibel（珍珠圣经）。它并非新译。直到鲁道夫·布罗克豪斯于 1932 年去世为止，埃尔伯费尔德本一直逐印次校订修改——旧约由阿尔弗雷德·罗夏负责，新约由埃米尔·登格斯负责——所以此处的年份指的是一段流动文本中的某一次印刷，而非一个定本。今日以埃尔伯费尔德之名出售的，多半又是另一回事：同一运动的一个委员会花了二十五年修订它，成果于 1975 年与 1985 年出版。那次修订把“Jehova”从旧约里撤去，改置“HERR”。此处的文本仍印“Jehova”，这使它与 American Standard Version 以及达秘本人的法文圣经并列。
hero.4=它在本收藏中的位置略微偏在一旁。德文在阅读器中没有经过挑选的默认版本，因此德文界面打开的是目录中第一部德文圣经，也就是这一部——排在两部路德圣经之前，凭的只是字母顺序，别无他故。在谱系阶梯里它独自站立。两部路德本构成一条链：1912 年本修订自 1545 年本，1545 年本立于希腊文与希伯来文之上；埃尔伯费尔德本却没有记录在案的母本，因为它逐次校改所自出的 1871 年埃尔伯费尔德本并不在本语料库中。因此，埃尔伯费尔德经文之下的一级阶梯径直落到以 ≈ 标示的原文底层，尽管隔着一栏的法文达秘圣经才是它在此处最近的亲属。

