fact.10.value=1932 年，逐印次进行——旧约由阿尔弗雷德·罗夏负责，新约由埃米尔·登格斯负责
fact.11.label=并非同一部书
fact.11.value=1975 年与 1985 年的 Revidierte Elberfelder，是历时二十五年修订的成果，与此处的文本并不相同
fact.12.label=授权
