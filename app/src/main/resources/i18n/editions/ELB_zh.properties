fact.13.label=在本语料库中
fact.13.value=德文界面所打开的那部圣经：德文没有经过挑选的默认版本，于是阅读器取目录中第一部德文圣经，而 ELB 排在[[LUT1545|Luther 1545]]与[[LUT1912|Luther 1912]]之前，凭的不过是自己的缩写。谱系阶梯中未记录任何母本——它逐次校改所自出的 1871 年埃尔伯费尔德本不在库中——因此一级阶梯开启的是原文底层。它两边都不带年份：目录卡片的年份一栏留空，手工维护的阶梯年份清单也没有它，所以 ELB 的阶梯标签只显示缩写而已——这是安静的一例；喧闹的一例是[[DRA|杜埃-兰斯译本]]，那里两份清单公开相互矛盾
