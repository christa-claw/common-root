title=Open New Arabic Version — Об этом издании | Common Root
description=Open New Arabic Version издательства Biblica: современная арабская Библия с правами на 1988, 1997 и 2012 годы, выпущенная по лицензии Creative Commons, разрешающей делиться ею, адаптировать и печатать её с указанием авторства.
heroHeading=Open New Arabic Version издательства Biblica
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Это современный арабский перевод — текст, отличный от [[SVD|Смит и Ван Дейк]], а не очередная его копия. Его издаёт Biblica, Inc., чьё уведомление об авторском праве несёт три года: 1988, 1997 и 2012. Собственная страница авторских прав текста даёт его более старое название — Ketab El Hayat Majani.
hero.2=Что выделяет его в этой читалке — это его лицензия. Biblica выпустила его как «открытый» текст по лицензии Creative Commons «С указанием авторства — На тех же условиях 4.0»: любой может копировать его, адаптировать и печатать, при условии указания Biblica и распространения всего созданного на основе него на тех же условиях. Текст указания авторства, который требует Biblica, таков: «The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible». Большинство современных переводов не предлагаются таким образом, и поэтому он здесь.
hero.3=У лицензии есть одно условие, которое стоит знать. Неизменённый текст может нести имя Biblica. Переставленный текст — не может: издания в Порядке событий и Порядке написания на этом сайте располагают книги в другом порядке, что мы считаем адаптацией, поэтому они сообщают, что текст был переставлен, и не используют имя Biblica как заголовок.
hero.4=Файл полностью огласован. Одна деталь его источника: Деяния 15:25 и 26 напечатаны как единый стих, так что собрание держит их вместе под стихом 25 и не имеет там отдельного стиха 26.

