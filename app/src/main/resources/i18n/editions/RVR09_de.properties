title=Reina Valera 1909 — Über diese Ausgabe | Common Root
description=Reina-Valera 1909: die Revision, die Casiodoro de Reinas Spanisch von 1569 — so wie Cipriano de Valera es 1602 überarbeitet hatte — ins zwanzigste Jahrhundert trug, und die Ausgabe, auf die dieser Leser für das Spanische öffnet.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=Die spanische protestantische Bibel ist in ungewöhnlichem Maße ein einziges Buch. Casiodoro de Reina, der Spanien vor der Inquisition verlassen hatte, vollendete seine Übersetzung im Exil und gab sie 1569 in Basel heraus — die Biblia del Oso, benannt nach dem Bären auf ihrem Titelblatt. Cipriano de Valera, der im selben Kloster vor Sevilla gewesen war und dieselbe Flucht angetreten hatte, ging sie jahrelang durch und veröffentlichte das Ergebnis 1602 in Amsterdam, die Biblia del Cántaro. Jede Reina-Valera seither ist die Revision einer Revision davon, und darum gedenkt ein Bindestrichname zweier Männer, die nie im selben Raum gearbeitet haben.
hero.2=Dies ist die Revision von 1909, erarbeitet unter der Britischen und Ausländischen Bibelgesellschaft gemeinsam mit der Amerikanischen Bibelgesellschaft und von denen, die sie weiter benutzten, gemeinhin Versión Antigua genannt — die alte Fassung. Ihr ging eine frühere Revision von 1862 voraus, und sie ist zurückhaltend gerade in dem, was Revisionen sonst ändern: der Wortlaut wird dort nachgeführt, wo Reina und Valera schwer zu folgen geworden waren, und dort in Ruhe gelassen, wo sie es nicht waren. Das Alte Testament steht auf dem masoretischen Hebräisch und das Neue auf dem Textus Receptus, wie Reinas es tat.
hero.3=Etwa fünfzig Jahre lang hielt sie die spanischsprachige protestantische Welt beinahe für sich allein, bis die Revision von 1960 sie verdrängte, und ganz verschwunden ist sie nie. Sie ist gemeinfrei, was die von 1960 nicht ist, und so ist dies die Reina-Valera, die ohne jemandes Erlaubnis gedruckt, ins Netz gestellt und zitiert wird. Ebendarum kann der ganze Text in diesem Korpus stehen und wieder aus ihm herauskopiert werden.
hero.4=In diesem Leser hat das Spanische fünf Bibeln, und auf diese öffnet die Oberfläche. Das ist eine kuratierte Wahl und kein Zufall des Katalogs: anders als beim Arabischen oder Chinesischen, wo der Leser auf die einzige Bibel der Sprache öffnet, hat das Spanische Alternativen, und diese wurde unter ihnen ausgewählt. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden fällt. Der Boden trifft hier näher als sonst, aus demselben Grund wie bei der arabischen Bibel: das Griechische, das er beistellt, ist der Textus Receptus, und aus dem Textus Receptus ist Reinas Neues Testament gemacht.

