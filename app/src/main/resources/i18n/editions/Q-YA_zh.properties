title=古兰经 — 优素福·阿里 — 关于本版本 | Common Root
description=阿卜杜拉·优素福·阿里的译本，由一位后来成为伊斯兰学者的印度文官于1934年至1937年间分四卷出版——这是现存译本中仅有两种被认定为确属公共领域的英译古兰经之一，在本语料库中作为皮克索尔译本之外的第二种英译对照本。
heroHeading=古兰经 — 优素福·阿里
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=阿卜杜拉·优素福·阿里（1872年-1953年）生于孟买，最初在当地的威尔逊学院接受教育，在校学习之余所受的宗教教育使他少年时便能背诵古兰经。1891年，他以英国文学一等学位从孟买大学毕业，获得省督奖学金前往英国，在剑桥大学圣约翰学院攻读法律，1895年取得学士及法学学位，同年返回印度，在印度文官体系中获得一个职位。
hero.2=他在文官体系中度过了近二十年——先后担任治安官兼税务官、法官，后来又在印度政府财政部任副秘书——直到1914年辞职并定居英国。在那里，他成为沃金沙贾汗清真寺及东伦敦清真寺基金的受托人，1917年因战时工作获授CBE勋衔，并在东方研究学院讲授印度斯坦语。20世纪20年代（1920年）及30年代，他回到印度，担任拉合尔伊斯兰学院院长，正是在这些年间，经过十余年的努力，他将古兰经译成英文，并附上自己的注释说明。
hero.3=这部译本以三十个分册的形式于1934年至1937年间连续出版，第一册于1934年4月4日问世，题为《The Holy Qur'an: Text, Translation and Commentary》，由拉合尔的谢赫·穆罕默德·阿什拉夫出版；1938年出现合订为一卷的版本，1939年至1940年间又有修订版问世。与皮克索尔的译本并列，它成为20世纪两种最广为阅读的英译古兰经之一，尤以其注释篇幅之浩繁著称，此后又以约三十种后续印本重新出版，其中部分经他人之手重新改写——包括1977年起由阿曼出版社在北美发行的一版，以及20世纪80年代（1980年）由沙特资助的一次修订。
hero.4=本语料库经由alquran.cloud数字化的内容，是译文本身，而非优素福·阿里随附的注释；它在本语料库中作为[[Q-AR|奥斯曼版阿拉伯文本]]的第二种英译对照本提供，与1930年的[[Q-EN|皮克索尔译本]]并列。对现有译本的一次调查发现，仅有两种英译本确属可自由使用——这一译本与皮克索尔的译本——不过这里的"确属"需要加一个限定：该作品在欧盟及巴基斯坦属于公共领域，优素福·阿里于巴基斯坦去世，该作品亦最初在此出版，但1996年在美国登记的一项形式性版权被认为在该国一直有效至2033年。

