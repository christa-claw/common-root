title=Riveduta 1927 (Italian) — About This Edition | Common Root
description=The Riveduta: Giovanni Diodati's Italian Bible revised against the Hebrew and Greek by a committee under the Waldensian theologian Giovanni Luzzi, published at Rome in 1924 by the British and Foreign Bible Society — and why the file says 1927.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi was born in 1856 in the Lower Engadine, in the Swiss canton of Graubünden, and was taken to Lucca as an infant when his family emigrated there the following year. He grew up Italian, studied at the Waldensian Faculty of Theology in Florence — the school of Italy's old Protestant church — and went on to teach theology there and to serve as a pastor in the city. He spent his last years back in Switzerland, at Poschiavo, and died there in 1948.
hero.2=The Riveduta began in 1906, when the British and Foreign Bible Society, which had been printing Diodati's seventeenth-century translation for Italian readers for a century, set a group to revise it, with Luzzi at its head. He had hoped to make it a joint Bible with Catholic scholars; the Vatican declined, and the work went ahead as a Protestant revision. The complete Bible appeared at Rome in 1924, described on its title page as a version revised against the original text — “riveduta”, revised, which is how it has been known ever since. It is not a new translation: Diodati's text is underneath, checked afresh against the Hebrew and the Greek. It became the Bible of Italian Protestants for most of the twentieth century, and its descendant, the Nuova Riveduta, was published by the Geneva Bible Society in 1994. Luzzi also made a translation of his own, annotated, in twelve volumes published at Florence from 1921; that is a different work and is not this text.
hero.3=The revision shows on the page. The divine name in the Old Testament is “l'Eterno”, the Eternal — “L'Eterno è il mio pastore” at Psalm 23 — where Diodati has “il Signore”. Isaiah 7:14 reads “la giovane”, the young woman, where Diodati has “la Vergine”. In the New Testament it leaves the Textus Receptus where the later critical editions do: 1 John 5:7 has no heavenly witnesses, the Lord's Prayer in Matthew 6:13 ends without the doxology, and Acts 8:37 is kept but set in square brackets. Psalms follow the Hebrew numbering, and a psalm's heading is run into its first verse — Psalm 23 opens “Salmo di Davide.” — so Psalm 51 has 19 verses, as in English Bibles. As for the date: 1927 is the year the digital text carries and the year the catalogue stores, so its rung chip shows 1927. The Riveduta itself appeared in 1924, and which later printing this file reproduces is not something this project has established.
hero.4=In this reader it is one of three Italian Bibles, beside two copies of Diodati. An Italian interface does not open on it: Italian has no curated pick, so the reader takes the first Italian Bible in catalogue order, which is Diodati 1649. No parent is recorded for it in the lineage rungs — not even Diodati, although the Riveduta is a revision of Diodati and Diodati is in the corpus — so a rung opened under a verse drops straight to the original-language floor marked with ≈: the Westminster Leningrad Codex for the Old Testament, and for the New the Textus Receptus, which is the Greek this revision moved away from.

