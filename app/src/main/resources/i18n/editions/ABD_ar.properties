title=سنن أبي داود — عن هذه الطبعة | Common Root
description=سنن أبي داود: مجموعة الأحاديث التي جمعها أبو داود السجستاني لصلتها بالفقه الإسلامي، منتخبة من بين نحو 500,000 رواية فحصها ومرتبة بحسب الموضوع الفقهي — ثالث كتب السنة الستة عند أهل السنة.
heroHeading=سنن أبي داود
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد أبو داود سليمان بن الأشعث الأزدي السجستاني نحو سنة 202 هـ (817–818 م) في سجستان، إحدى ولايات خراسان التي تقع اليوم على الحدود بين إيران وأفغانستان. بلغ بغداد في الثامنة عشرة من عمره، ثم رحل عبر خراسان والعراق والحجاز والشام ومصر ونيسابور طلباً للحديث، ودرس على نحو 300 من العلماء، منهم أحمد بن حنبل. واستقر في البصرة، حيث توفي يوم جمعة في شوال سنة 275 هـ (889 م) عن عمر بلغ ثلاثة وسبعين عاماً، ودُفن إلى جانب الفقيه سفيان الثوري.
hero.2=وكان اهتمامه فقهياً على وجه التحديد: فعلى خلاف صحيح البخاري وصحيح مسلم، اللذين يتناولان العقيدة والتاريخ والفقه معاً، بنى أبو داود سننه حول الأحاديث المتصلة بالفقه، ورتّبه في كتب تسير على ما يحتاجه الفقيه — من الطهارة والصلاة إلى الزكاة والصيام والزواج والمواريث والقضاء وغيرها. وبحسب تلميذه ابن داسة، فحص أبو داود نحو 500,000 رواية حديثية في جمعه لهذه المادة. وقد وضع معياراً مختلفاً عن البخاري ومسلم أيضاً: فحيث لم يقبلا إلا ما حكما بصحته التامة، أدخل أبو داود بعض الروايات المرسلة والضعيفة وحتى المنكرة حين لا توجد رواية أقوى تتناول نقطة فقهية معينة، وبيّن منهجه في رسالته إلى أهل مكة، ونبّه هو نفسه على الروايات الأضعف بدل أن يتركها دون بيان.
hero.3=تضع التقاليد السنية سنن أبي داود في المرتبة الثالثة بين الكتب الستة، بعد صحيح البخاري وصحيح مسلم؛ أما ترتيبه الدقيق مقارنة بجامع الترمذي وسنن النسائي وسنن ابن ماجه بين الكتب الأربعة الباقية، فمسألة طال فيها الجدل العلمي ولم تُحسم. والأرقام المعطاة للكتاب لا تتفق فيما بينها على نحو لم يُفسَّر: فرقم ابن داسة لما اختاره أبو داود هو 4,800 حديث، بينما الطبعة الحديثة المعيارية — التي حققها محمد محيي الدين عبد الحميد وطُبعت في القاهرة سنة 1935 — تُرقِّم 5,274 حديثاً. ورقم هذه المجموعة نفسها، 43 كتاباً و5,274 حديثاً، يطابق ترقيم طبعة القاهرة تلك تماماً، وهو ما يجعلها هنا على أرض أثبت من صحيح البخاري أو صحيح مسلم، حيث لا يطابق رقم هذه المجموعة أي تقليد مطبوع واحد بعينه.
hero.4=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-abudawud في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في صحيح البخاري وصحيح مسلم وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=العربية الكلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=أبو داود سليمان بن الأشعث الأزدي السجستاني (202–275 هـ / 817–889 م)
fact.3.label=الاسم
fact.3.value=يُعرف ببساطة باسم سنن أبي داود؛ على خلاف [[BUK|صحيح البخاري]]، لم يُسجَّل له اسم كامل مستقل
fact.4.label=مكان وزمان التأليف
fact.4.value=جُمع في رحلات عبر خراسان والعراق والحجاز والشام ومصر ونيسابور؛ استقر أبو داود وتوفي في البصرة
fact.5.label=المنهج
fact.5.value=مرتب بحسب الموضوع الفقهي لا بحسب الراوي أو الزمن؛ يتضمن بعض الروايات الضعيفة والمرسلة والمنكرة حين لا توجد رواية أقوى تتناول نقطة فقهية، مع بيان ذلك صريحاً
fact.6.label=المكانة
fact.6.value=ثالث كتب السنة الستة عند أهل السنة (الكتب الستة)، بعد [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]]؛ ترتيبه بين الكتب الثلاثة الباقية مسألة جدل لا حسم
fact.7.label=عدد الأحاديث
fact.7.value=4,800 حديثاً مختاراً بحسب تلميذ أبي داود ابن داسة، أو 5,274 في طبعة محمد محيي الدين عبد الحميد المعيارية بالقاهرة سنة 1935؛ والرقمان لم يُوفَّق بينهما في المصادر
fact.8.label=في هذه المجموعة
fact.8.value=43 كتاباً و5,274 حديثاً مرقَّماً — يطابق ترقيم طبعة القاهرة سنة 1935 تماماً
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-abudawud في fawazahmed0/hadith-api، وتظهر مرافقة تحت العربية؛ ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة منشورة تعود
fact.10.label=الرخصة
fact.10.value=المتن العربي هو النص الكلاسيكي الملك العام؛ أما رخصة الترجمة الإنجليزية فما زالت قيد المراجعة
