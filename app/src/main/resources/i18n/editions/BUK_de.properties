fact.1.label=Sprache
fact.1.value=klassisches Arabisch, mit einer englischen Übersetzung unter jedem Hadith im Reader
fact.2.label=Zusammengestellt von
fact.2.value=Muhammad ibn Ismail al-Bukhari (194–256 n. H. / 810–870 n. Chr.)
fact.3.label=Vollständiger Titel
fact.3.value=al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi — gewöhnlich verkürzt zu Sahih al-Bukhari
fact.4.label=Zusammengestellt
fact.4.value=größtenteils an der Heiligen Moschee in Mekka und der Moschee des Propheten in Medina; vollendet in Buchara um das Jahr 232 n. H. (846 n. Chr.)
fact.5.label=Methode
fact.5.value=lässt einen Hadith nur mit einer ununterbrochenen Kette von Überlieferern zu, die al-Bukhari als zuverlässig einstufte; er soll die Sammlung aus rund 600.000 von ihm geprüften Überlieferungen ausgewählt haben
fact.6.label=Stellung
fact.6.value=das erste der sechs Bücher des sunnitischen Islam (Kutub as-Sitta); zusammen mit [[MUS|Sahih Muslim]] als „Sahihayn" bezeichnet — die beiden Sammlungen in der Autorität gleich nach dem Koran eingestuft
fact.7.label=Hadith-Anzahl
fact.7.value=7.563 mit Wiederholungen in der weitverbreiteten Abd-al-Baqi-Zählung, oder 2.602 ohne Wiederholung nach der Zählung von Ibn Hajar al-Asqalani; gedruckte Ausgaben unterscheiden sich sowohl in der Kapitel- als auch in der Hadith-Numerierung
fact.8.label=In diesem Korpus
fact.8.value=98 Bücher (kutub) und 7.589 numerierte Hadithe — die Form des Quelldatensatzes selbst, keine Wiedergabe irgendeiner einzelnen Drucknumerierung
fact.9.label=Englische Übersetzung
fact.9.value=entnommen der eng-bukhari-Ausgabe der fawazahmed0/hadith-api, als Begleittext unter dem Arabischen gezeigt; von welcher veröffentlichten Übersetzung sie abstammt, ist von Seiten dieses Korpus noch nicht geklärt
fact.10.label=Lizenz
fact.10.value=der arabische Matn ist der klassische, gemeinfreie Text; die Lizenz der englischen Übersetzung ist noch in Prüfung
