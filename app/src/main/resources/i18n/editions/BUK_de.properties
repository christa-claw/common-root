title=Sahih al-Bukhari — Über diese Ausgabe | Common Root
description=Sahih al-Bukhari: die Hadith-Sammlung, die sunnitische Muslime nach dem Koran als zweithöchste Autorität einstufen, zusammengestellt von Muhammad al-Bukhari aus rund 600.000 von ihm geprüften Überlieferungen, von denen er nur jene zuließ, die eine ununterbrochene Kette zuverlässiger Überlieferer trugen.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismail al-Bukhari stellte diese Sammlung größtenteils an zwei Moscheen zusammen — der Heiligen Moschee in Mekka und der Moschee des Propheten in Medina — und vollendete sie in seiner Heimatstadt Buchara um das Jahr 232 n. H. (846 n. Chr.); ungefähr die letzten zwei Jahrzehnte seines Lebens verbrachte er damit, sie auf seinen Reisen weiter zu überarbeiten. Ihr vollständiger Titel, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, wird gewöhnlich zu Sahih al-Bukhari verkürzt — „die zuverlässige [Sammlung] al-Bukharis". Al-Bukhari selbst soll gesagt haben, er habe sie aus rund 600.000 von ihm geprüften Hadithen ausgewählt und einen Bericht nur zugelassen, wenn dieser seiner Einschätzung nach eine ununterbrochene Kette zuverlässiger Überlieferer bis zur ursprünglichen Quelle trug.
hero.2=Dieser Maßstab erklärt das Gewicht, das dem Buch zukommt. Sahih al-Bukhari gilt als das erste der sechs Bücher des sunnitischen Islam (Kutub as-Sitta), und zusammen mit Sahih Muslim — seinem nächsten Rivalen in Methode und Ansehen — werden die beiden als Sahihayn bezeichnet, „die beiden zuverlässigen". Die meisten sunnitischen Gelehrten stufen al-Bukharis Sammlung über jedes andere Hadith-Buch und in der Autorität gleich nach dem Koran selbst ein, wenngleich eine Minderheit stattdessen Sahih Muslim den Vorrang gibt. Der Stoff ist thematisch geordnet und nicht nach Überlieferer oder Chronologie (was Gelehrte eine musannaf nennen), gegliedert in Bücher (kutub), die von der rituellen Reinigung und dem Gebet über Handel und Ehe bis zu den Leben früherer Propheten und den Zeichen der Letzten Stunde reichen.
hero.3=Wie viele Hadithe das Buch tatsächlich enthält, hängt davon ab, welche Drucktradition zählt. Die heute am häufigsten genannte Zahl, 7.563, stammt aus der Zählung, die der Herausgeber Muhammad Fu'ad Abd al-Baqi dem Text im 20. Jahrhundert gab, und sie zählt einen Hadith jedes Mal neu, wenn er unter einem anderen Kapitel wiederholt wird; bereinigt um Wiederholungen zählte Ibn Hajar al-Asqalani 2.602. Andere Gelehrte haben noch weitere Gesamtzahlen vorgeschlagen. Die eigene Zahl dieses Korpus ist noch eine dritte: 98 Bücher und 7.589 numerierte Hadithe — schlicht die Form der digitalen Ausgabe, aus der sie stammt, kein Anspruch, irgendeine einzelne Drucknumerierung genau wiederzugeben.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-bukhari-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

