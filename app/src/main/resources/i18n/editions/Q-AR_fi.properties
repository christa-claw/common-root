title=Koraani — uthmani — Tietoja tästä laitoksesta | Common Root
description=Koraani hafs-lukutavassa asimilta, tekstissä, jolle suurin osa maailman painetuista Koraaneista on perustunut Kairon vuoden 1924 laitoksesta lähtien — ja tässä aineistossa teksti, joka on tarkistettu jae jaetta vastaan King Fahdin kompleksin omaa kappaletta vasten ja havaittu yhteneväksi konsonanttirungoltaan kaikissa 6 236 jakeessaan.
heroHeading=Koraani — uthmani
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=Tämän tekstin pohjana olevalla lukutavalla on nimetty ketju. Hafs ibn Sulaiman al-Kufi (k. 796) välitti sen opettajaltaan Asim ibn Abi al-Najudilta, yhdeltä Kufan lukijoista, joiden lukutavan Ibn Mujahid myöhemmin vahvisti seitsemän joukkoon (Asim kuoli vuonna 745). Hafs asimilta — "Hafs, asimilta" — on yksi useista lukutavoista, joita muslimit pitävät yhtä auktoritatiivisina saman ilmoituksen välityksinä; se ei ole ainoa, mutta se on ylivoimaisesti painetuin. Kun al-Azharin oppineiden lautakunta, joka työskenteli vuodesta 1907 kuningas Fuad I:n alaisuudessa, tuotti Egyptin vakiomuotoisen Koraanin, jonka Bulaqin Amiri-kirjapaino painoi 10. heinäkuuta 1924, juuri tämä lukutapa vakiinnutettiin kirjasimiin. Suurin osa missä tahansa myytävistä Koraaneista nykyään, King Fahdin kompleksin omaa mukaan lukien, seuraa tämän laitoksen esimerkkiä.
hero.2=Tässä aineistossa oleva teksti on peräisin, alquran.cloudin quran-uthmani-laitoksen kautta, Tanzil-hankkeen digitoinnista samasta hafs-tekstistä. Se rinnastuu lukijassa kolmeen käännökseen: Pickthallin englanninkieliseen vuodelta 1930, Yusuf Alin englanninkieliseen vuodelta 1934 ja Sablukovin venäjänkieliseen vuodelta 1878 — avaa mikä tahansa näistä kolmesta tämän rinnalle, ja sen käännös ilmestyy joka jakeen alle. Lukija tarjoaa Koraanin myös kahdessa järjestyksessä: perinteisen mushaf-järjestyksen, jonka tämä samainen traditio vahvisti, ja järjestyksen, jonka tutkijat rakentavat sille, milloin mikä sura ilmoitettiin.
hero.3=Säilyminen kirjaimellisena on itsessään yksi tästä tekstistä esitetyistä väitteistä, niin se tarkistetaan tässä sen sijaan, että se oletettaisiin. Verrattuna jae jaetta vastaan King Fahdin Koraanin painamisen kompleksin omaan hafs-laitokseen, kaksi tekstiä ovat yhtä mieltä konsonanttirungosta — alastomista kirjaimista, ennen minkään vokaalimerkin lisäämistä — kaikissa 6 236 jakeessaan. Kaikki löydetty ero rajoittuu siihen, miten vokaalit ja taukomerkit merkitään, hamzan kirjoitustapaan ja kahdeksaan kohtaan, joissa kaksi tahoa jakavat sanat eri tavoin; mikään niistä ei kosketa tekstin itsensä yhtäkään kirjainta. Se on päinvastaista sille epävarmuudelle, joka tämän aineiston on myönnettävä vuoden 1776 suomalaisen Raamatun kohdalla, jossa ei yksinkertaisesti tiedetä, mistä painoksesta teksti polveutuu.
hero.4=Kaksi asiaa, joita tämä yhtäläisyys ei osoita, kannattaa sanoa suoraan. Se ei ole väite polveutumisesta — yhteneväisyys kompleksin tekstin kanssa osoittaa, että kaksi tekstiä ovat sama teksti, ei sitä, että toinen olisi kopioitu toisesta. Eikä se ole lupa: elokuun 2026 lopulla kompleksille lähetettyyn pyyntöön, jossa pyydettiin lupaa näyttää sen omat riwaya-tiedostot, ei ollut tätä kirjoitettaessa saatu vastausta. Ainoa jae, jossa itse vertailu näytti hetkellisesti olevan eri mieltä, 19:3, osoittautui virheeksi siinä, miten vertailutiedosto luettiin, ei virheeksi kummassakaan Koraanissa — korjattuna se vastaa tarkalleen. Vertailukappale itse on jälleenrakennettu kompleksin tekstinkäsittelytiedostosta, ei sen virallinen digitaalinen julkaisu, ja se on ainoa kohta, jossa tämä ei ole aivan vertailu viralliseen julkaistuun aineistoon.

