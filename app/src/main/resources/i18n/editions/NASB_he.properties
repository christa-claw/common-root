title=New American Standard Bible 2020 — על המהדורה הזו | Common Root
description=New American Standard Bible: המשכה העצמי של קרן Lockman למסורת התרגום המילולי מילה-במילה של American Standard Version, תורגמה מחדש מהעברית, הארמית והיוונית, וכעת בנוסחה משנת 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=New American Standard Bible התחילה כהמשך מכוון, לא כפרויקט חדש לחלוטין. קרן Lockman, גוף ללא כוונת רווח שמקומו ב-La Habra, קליפורניה, פתחה בעבודה ב-1959 כדי להמשיך את American Standard Version משנת 1901 — ולשמר את שמה הטוב כתרגום מילולי ומדויק מילה-במילה מהעברית, הארמית והיוונית, תוך חידוש האנגלית המיושנת שלו. הקרן הקימה ועדה של חכמים ממכללות, אוניברסיטאות ומכוני תאולוגיה נוצריים, בעיקר מזרמים אוונגליסטיים שמרניים, והתרגום פורסם בשלבים: הבשורה על פי יוחנן ב-1960, שאר הבשורות ב-1962, הברית החדשה בשלמותה ב-1963, ספר תהלים בנפרד ב-1968, והמקרא כולו ב-1971. המהדורה השלמה הראשונה הזו נשענה, בברית הישנה, על המהדורה השלישית של Biblia Hebraica של רודולף קיטל, בהתייחסות למגילות מדבר יהודה, ובברית החדשה על המהדורה העשרים ושלוש של Novum Testamentum Graece של נסטלה ואלנד.
hero.2=עבודת התיקון נמשכה עשרות שנים אחרי אותה הדפסה ראשונה. שינויי ניסוח קלים באו בעקבותיה ב-1972, 1973 ו-1975, ואז תיקון מקיף יותר ב-1977, ותיקון מוגבל נוסף ב-1992. ב-1995 הוציאה הקרן את Updated Edition — כלומר NASB95, הנוסח שרוב האנשים מתכוונים אליו כשהם אומרים סתם "NASB" — בהתייחסות ל-Biblia Hebraica Stuttgartensia ולמהדורה העשרים ושש של Nestle-Aland. הנוסח הנוכחי הוא העדכון משנת 2020, שחלקים ממנו התחילו להופיע ברשת כבר ב-2018: הוא העביר את הבסיס הטקסטואלי של הברית הישנה ל-Biblia Hebraica Stuttgartensia, ולספרים שהוא מכיל, לחדש ממנה, Biblia Hebraica Quinta, בהתייחסות לתרגום השבעים, למגילות מדבר יהודה, לתרגומים הארמיים ולנוסחים עתיקים אחרים במקומות שבהם הם משפיעים על הקריאה, בעוד הברית החדשה עוקבת כעת אחרי המהדורה העשרים ושמונה של Nestle-Aland, בתוספת החומר העשיר יותר של עדויות כתבי היד היווניים שמציעה Editio Critica Maior. שיטת המתרגמים המוצהרת נשארה אותה שיטה בכל תיקון: להעביר את המקור בצורה מילולית ככל שהאנגלית מאפשרת, ובמקום שבו תרגום מילולי קפדני יטעה או יישמע לא טבעי, לבחור בניסוח הברור יותר ולרשום את הניסוח המילולי יותר בהערת שוליים — משמעת שמוזכרת לעיתים קרובות כהסבר לכך שזהו אחד התרגומים המילוליים ביותר מבין התרגומים האנגליים הנפוצים של המאות העשרים והעשרים ואחת.
hero.3=על אף שמה וחובה המוצהר ל-American Standard Version, New American Standard Bible הוא תרגום חדש מהלשונות המקוריות ולא תיקון שורה-אחר-שורה שלו, ולכן האוסף אינו רושם לו מקור: פתיחת שלב של שושלת מתחת לפסוק מ-NASB יורדת ישירות לרצפת לשונות המקור המסומנת ב-≈, בדיוק כמו ב-New International Version. לשני התרגומים משותף יותר מהצורה הזו בלבד — שניהם ברישיון, לא נחלת הכלל, עומדים בנפרד מהמהדורות האנגליות החופשיות להעתקה על אותו המדף, אף שמנשק אנגלי נפתח כברירת מחדל על New International Version, בעוד ש-New American Standard Bible מגיעים אליו מכרטיסו שלו ברשת התרגומים.

