fact.2.value=בידי קרן Lockman מ-La Habra, קליפורניה, שפתחה בפרויקט ב-1959 כהמשך למסורת התרגום המילולי של American Standard Version
fact.3.label=נעשתה בידי
fact.3.value=ועדת תרגום שמומנה בידי הקרן, שקיבצה חכמים ממכללות ומכוני תאולוגיה נוצריים, בעיקר מזרמים אוונגליסטיים שמרניים
fact.4.label=הברית הישנה מתוך
fact.4.value=המהדורה השלישית של Biblia Hebraica של רודולף קיטל ומגילות מדבר יהודה למהדורה המקורית משנת 1971; Biblia Hebraica Stuttgartensia מתיקון 1995; נוסח 2020 נשען על Biblia Hebraica Stuttgartensia, ובמקום שהיא זמינה, על החדש ממנה Biblia Hebraica Quinta, בהתייחסות לתרגום השבעים, למגילות מדבר יהודה, לתרגומים הארמיים ולנוסחים עתיקים אחרים
fact.5.label=הברית החדשה מתוך
fact.5.value=המהדורה העשרים ושלוש של Novum Testamentum Graece של נסטלה ואלנד למהדורה המקורית משנת 1971; המהדורה העשרים ושש מתיקון 1995; המהדורה העשרים ושמונה (NA28) לנוסח 2020, בתוספת עדויות כתבי היד היווניים מ-Editio Critica Maior
fact.6.label=סוג התרגום
fact.6.value=שוויון צורני — תורגם באופן מילולי מהלשונות המקוריות ככל שאנגלית קריאה מאפשרת, עם רישום הניסוח המילולי יותר בהערת שוליים במקומות שבהם נבחר ניסוח ברור יותר; תרגום חדש מהעברית, הארמית והיוונית, לא תיקון של מקרא אנגלי קדום יותר, על אף שורשיו בשיטת American Standard Version
fact.7.label=פורסמה
fact.7.value=הבשורה על פי יוחנן ב-1960, הבשורות ב-1962, הברית החדשה ב-1963, תהלים ב-1968, המקרא כולו ב-1971, שינויים טקסטואליים קלים ב-1972, 1973 ו-1975, תיקון מקיף ב-1977, תיקון מוגבל ב-1992, Updated Edition (NASB95) ב-1995, והנוסח הנוכחי משנת 2020, שחלקים ממנו פורסמו ברשת מ-2018
fact.8.label=רישיון
fact.8.value=ברישיון, לא נחלת הכלל. עד 1,000 פסוקים ניתן לצטט בכל צורה בלא רשות כתובה, בתנאי שאינם מהווים ספר מקרא שלם או יותר מחצי מהחיבור המצטט, עם ציון זכויות יוצרים הנוקב בשנים 1960, 1971, 1977, 1995 ו-2020; מעבר לכך דרושה רשות קרן Lockman
fact.9.label=באוסף זה
fact.9.value=ברישיון, לא נחלת הכלל, כמו [[NIV|New International Version]] — מנשק אנגלי נפתח על אותה מהדורה כברירת מחדל, וזו מגיעים אליה מכרטיסה שלה. בשלבי השושלת לא רשום לה מקור: אף שהקרן מתארת את הפרויקט כהמשך למילוליות של [[ASV|American Standard Version]], הוא תורגם מחדש מהעברית, הארמית והיוונית ולא תיקון שלה או של נוסח אנגלי אחר המוחזק כאן, כך שהשלב מתחת לפסוק מ-NASB יורד ישירות לרצפת לשונות המקור המסומנת ב-≈
