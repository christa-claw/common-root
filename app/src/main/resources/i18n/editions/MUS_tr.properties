title=Sahih-i Müslim — Bu Baskı Hakkında | Common Root
description=Sahih-i Müslim: Sahih-i Buhari ile birlikte, Sünni İslam'ın Kur'an'dan sonra en yetkili kabul ettiği iki derlemeyi, "es-Sahihayn"i oluşturur; Müslim bin el-Haccâc, Arap Yarımadası, Mısır, Irak ve Suriye'de topladığı hadislerden, yalnızca güvenilir ravilerden kesintisiz bir zincire sahip olanları alarak derlemiştir.
heroHeading=Sahih-i Müslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Ebu'l-Hüseyin Müslim bin el-Haccâc el-Kuşeyrî en-Nîşâbûrî, Abbasi eyaleti Horasan'da (bugünkü İran'ın kuzeydoğusunda) bulunan Nişabur'da doğdu; kaynaklar doğum yılı konusunda farklılık gösterir, hicrî 202, 204 ya da 206 (yaklaşık miladi 817–822) tarihlerini verir. Her birinden hadis toplamak üzere Arap Yarımadası, Mısır, Irak ve Suriye'yi dolaştı, sonra yeniden memleketine yerleşti; burada el-Buhari ile tanıştı, onun öğrencisi oldu ve hayatının sonuna kadar dostu olarak kaldı. El-Hatîb el-Bağdâdî'ye göre bu eseri bir öğrencisinin, Ahmed bin Selame en-Nîşâbûrî'nin, ricası üzerine kaleme aldı; aslen el-Müsnedü's-Sahîhu'l-Muhtasar olan adı, el-Buhari'nin eserinde olduğu gibi, genellikle Sahih-i Müslim olarak kısaltılır. Hicrî 261'de (miladi 875) Nişabur'da vefat etti ve şehrin banliyösü Nasarâbâd'a defnedildi.
hero.2=Bir hadisi, yalnızca Hz. Muhammed'in bir sahabisine kadar kesintisiz uzanan ve her halkada en az iki güvenilir ravi içeren bir zincire sahipse kabul ederdi; ravileri hafıza ve karakterlerine göre üç kademeye ayırdı ve dürüstlüğü tartışmalı olanları bir kenara bıraktı. Şarihi en-Nevevî ek bir dikkat noktasına işaret eder: Müslim, yazdığına göre, her hadisi bütün zincirleri ve lafız farklılıklarıyla birlikte tek, uygun bir yere koyar, bunların dağınık görünmesine izin vermez — bu sunuş, sonraki şarihler tarafından, [[BUK|Sahih-i Buhari]]'nin bir hadisin farklı lafızlarını ayrı ayrı, her birini o lafzın işaret ettiği noktayı anlatan bölümün altına koyma pratiğiyle karşılaştırılmıştır.
hero.3=Kitabın gerçekte kaç hadis içerdiği, [[BUK|Sahih-i Buhari]]'de olduğu gibi, kimin saydığına ve tekrarların nasıl ele alındığına bağlıdır. Kâtip Çelebi ve Sıddık Hasan Han ikisi de 7.275 sayısına ulaşmıştır; Muhammad Fuad Abdülbaki, tekrarsız sayarak, 3.033'e; Meşhur bin Hasan Âl Selmân 7.385'e, ya da Müslim'in kendi girişindeki on hadisi eklerse 7.395'e ulaşmıştır; diğer tahminler toplamı yaklaşık 5.500 ile 7.500 arasına yerleştirir. El-Cevzekî, Sahih-i Buhari ile neredeyse kelimesi kelimesine paylaşılan 2.326 hadis saymıştır. Bu derlemenin kendi sayısı ise yine başka bir sayıdır: 57 kitap ve 7.563 numaralı hadis — bu, yalnızca alındığı dijital baskının biçimidir, herhangi bir belirli basılı numaralandırmayı tam olarak yeniden üretme iddiası taşımaz.
hero.4=Buradaki Arapça metin klasik matındır ve kamu malıdır. Okuyucuda bunun altında, fawazahmed0/hadith-api'nin eng-muslim baskısından alınmış ve Arapça ile hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih-i Buhari]] için ve Kur'an çevirileri için kullandığı aynı eşlik düzenlemesidir. Bu dosyanın kendisinin hangi yayımlanmış İngilizce çeviriden geldiği bu derleme tarafında tespit edilememiştir; bu nedenle lisansı doğrudan kamu malı olarak değil, incelenmekte olarak işaretlenmiştir. Yukarıdaki Arapça metin bu belirsizliği taşımaz.

