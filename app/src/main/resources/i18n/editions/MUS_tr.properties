fact.5.label=Yöntem
fact.5.value=Bir hadisi yalnızca Hz. Muhammed'in bir sahabisine kadar her halkada en az iki güvenilir raviden geçen kesintisiz bir zincirle kabul eder; raviler güvenilirliklerine göre üç kademeye ayrılmış, dürüstlüğü tartışmalı olanlar dışlanmıştır
fact.6.label=Konum
fact.6.value=Sünni İslam'ın Altı Kitabı'nın (Kütüb-i Sitte) ikincisi; [[BUK|Sahih-i Buhari]] ile birlikte "es-Sahihayn"i oluşturur — yetkide Kur'an'ın hemen ardından gelen iki derleme; âlimlerin çoğu el-Buhari'nin derlemesinin bütününü bunun üzerinde tutar
fact.7.label=Hadis sayısı
fact.7.value=Sayım yöntemine göre rakamlar tekrarsız 3.033'ten (Abdülbaki) tekrarlı 7.275–7.395'e kadar değişir; basılı baskılar hem bölüm hem de hadis numaralandırmasında farklılık gösterir
fact.8.label=Bu derlemede
fact.8.value=57 kitap ve 7.563 numaralı hadis — kaynak veri kümesinin kendi biçimi, herhangi bir belirli basılı numaralandırmanın yeniden üretimi değil
fact.9.label=İngilizce çeviri
fact.9.value=fawazahmed0/hadith-api'nin eng-muslim baskısından alınmıştır, Arapçanın altında eşlik eden metin olarak gösterilir; hangi basılı çeviriden geldiği bu derleme tarafında henüz doğrulanmamıştır
fact.10.label=Lisans
fact.10.value=Arapça matın, kamu malı olan klasik metindir; İngilizce çevirinin lisansı hâlâ incelenmektedir
