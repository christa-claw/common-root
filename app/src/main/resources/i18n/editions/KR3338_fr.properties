title=Kirkkoraamattu 1933/38 — À propos de cette édition | Common Root
description=Kirkkoraamattu 1933/38 : la bible d'Église finlandaise, retraduite de l'hébreu et du grec et adoptée en deux moitiés, en 1933 et en 1938, après qu'un comité y eut travaillé quelque soixante-dix ans.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=Le nom, ce sont deux dates, parce que le livre est arrivé en deux moitiés. L'Église évangélique luthérienne de Finlande adopta l'Ancien Testament en 1933 et le Nouveau en 1938, et le finnois l'appelle depuis la bible d'Église de 1933/38. Ces dates finales dissimulent combien le commencement était loin : le comité de traduction avait été nommé en 1861. Quelque soixante-dix ans, et plus d'une génération de traducteurs, séparent la commande de la bible achevée.
hero.2=Ce que le comité produisit fut une traduction nouvelle et non une révision. Il travailla sur l'hébreu de l'Ancien Testament et le grec du Nouveau — sans intermédiaire latin, allemand ou suédois, et non d'après la bible finnoise déjà en usage. Elle n'en était pas moins consciemment l'héritière de celle-là, la Biblia 1776, texte de l'Église depuis un siècle et demi, et elle en garda une bonne part du vocabulaire et de la cadence. Cet héritage explique qu'une bible achevée en 1938 sonnât déjà archaïque à ses premiers lecteurs, et qu'elle porte encore le registre solennel de l'Écriture finnoise. Elle demeura la bible d'Église officielle jusqu'en 1992.
hero.3=Dans ce lecteur elle fait deux choses. Mettez l'interface en finnois et c'est cette édition qui s'ouvre — l'ordre propre du catalogue vous donnerait plutôt la Biblia 1776, si bien que le choix par défaut du finnois est délibéré et non un hasard de l'alphabet. Elle est aussi l'échelon supérieur de la chaîne finnoise : ouvrez un échelon sous un verset du KR3338 et la Biblia 1776 apparaît en dessous. Lisez cet échelon comme une succession à l'intérieur de la bible d'une même Église plutôt que comme une source, car les traducteurs de 1933/38 avaient devant eux l'hébreu et le grec, non le texte de 1776. Sous la Biblia 1776 la chaîne se poursuit : la Biblia de 1642, que 1776 révise, puis le finnois d'Agricola de 1548, que ce comité-là révisa à son tour, et l'allemand de Luther de 1545, ouvert à côté d'eux pendant leur travail. Ce n'est qu'en dessous que l'échelle atteint l'hébreu et le grec.

