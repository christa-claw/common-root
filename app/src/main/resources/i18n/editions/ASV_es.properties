title=American Standard Version — Acerca de esta edición | Common Root
description=La American Standard Version de 1901: la edición estadounidense de la Revised Version, hecha por eruditos que habían pasado veinte años corrigiendo por correo la Versión del Rey Jacobo, y el tronco de la Revised Standard Version, la New American Standard Bible y la World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=La American Standard Version empezó como proyecto ajeno. Cuando la Iglesia de Inglaterra emprendió en 1870 la revisión de la Versión del Rey Jacobo, invitó a participar a eruditos estadounidenses, y estos participaron — por correspondencia, de un lado al otro del Atlántico, durante cerca de dos décadas. Donde ambas partes discrepaban, la lectura del comité británico pasaba al texto y la preferencia estadounidense a un apéndice, y los estadounidenses se comprometieron a no sacar edición propia durante catorce años. La Revised Version inglesa apareció en 1881 y en 1885. La edición estadounidense siguió en 1901, con las lecturas del apéndice subidas al texto, donde sus editores siempre las habían querido.
hero.2=Es una traducción hecha por eruditos para eruditos, y se lee como tal. Los revisores se ciñeron al orden de palabras hebreo y griego cuanto el inglés toleraba, lo que hace a la American Standard Version exacta y, en tramos largos, rígida. Su decisión más visible atañe al nombre divino: donde la Versión del Rey Jacobo imprimía “the LORD” en versalitas, la American Standard Version imprime “Jehovah”, miles de veces, por todo el Antiguo Testamento. En el Nuevo Testamento sigue el griego de los revisores y no el Textus Receptus, de modo que las lecturas que tuvieron los traductores del Rey Jacobo y que los manuscritos más antiguos no traen — la cláusula trinitaria de 1 Jn 5:7 entre ellas — van en nota o faltan.
hero.3=La American Standard Version nunca llegó a ser biblia de banco. Lo que llegó a ser fue un tronco. La Revised Standard Version de 1952 fue una revisión suya; también lo fue la New American Standard Bible, que está asimismo en este corpus; y también lo es la World English Bible, que la llevó al dominio público con ortografía moderna. Por eso ocupa el lugar que ocupa en los peldaños del lector — en medio de la cadena más larga que tiene el corpus. Abra un peldaño bajo un versículo de la ASV y aparecerá debajo la Revised Version de la que se hizo, y bajo ella la Versión del Rey Jacobo y la Biblia de Ginebra, hasta el suelo de las lenguas originales marcado con ≈. Abra un peldaño bajo un versículo de la World English Bible y volverá aquí.

