title=Mormons bok — Om denna utgåva | Common Root
description=Mormons bok: Joseph Smiths år 1830 dikterade uppteckning om forntida profeter i Amerika, tryckt i Palmyra, New York, och läst av sistadagarsheliga som en kompletterande skrift till Bibeln.
heroHeading=Mormons bok
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith sade att han översatte denna bok "genom Guds gåva och kraft" från en samling forntida metallplåtar, som han sade sig ha återfunnit 1827 nära familjens gård utanför Palmyra, New York, och senare återlämnat till den budbärare som hade visat honom dem. Vittnen till dikteringen beskriver hur han betraktade en siarsten — i senare skeden av arbetet en sten han lade i en hatt för att utestänga ljuset, inte bara det par stenar fästa vid ett bröstsköld som traditionellt kallas Urim och Tummim och som sägs ha medföljt plåtarna — och talade texten högt medan en skrivare skrev ner den. Oliver Cowdery nedtecknade det mesta på detta sätt under omkring två månader 1829, huvudsakligen på familjen Whitmers gård i Fayette, New York; Martin Harris och Josephs hustru Emma Smith hade tjänstgjort som skrivare under kortare, tidigare skeden.
hero.2=Manuskriptet gick till tryck inom året. Smith säkrade upphovsrätten till verket i juni 1829, och tryckningen inleddes i Egbert B. Grandins tryckeri i Palmyra, där boksättaren John H. Gilbert tillförde den skiljetecken och styckeindelning som det dikterade manuskriptet saknade. Den färdiga boken utkom i mars 1830: omkring 5 000 exemplar, Grandins hela upplaga.
hero.3=Den är indelad i femton böcker, från Första Nephis bok till Moronis bok, var och en namngiven efter den profetiska uppteckningsman som uppges ha sammanställt den. Inget av 1830 års exemplar hade en enda versnumrering — texten löpte som sammanhängande stycken inom betydligt längre kapitel än läsare ser i dag. Dagens kapitel- och versindelning härstammar från en utgåva från 1879, utarbetad av Orson Pratt, som också kortade kapitlen och lade till de första fotnoterna. Senare utgåvor omformade presentationen ytterligare: en kommitté under George F. Richards satte texten i dubbla kolumner 1920 och lade till kapitelsammanfattningar och en uttalsguide; en utgåva från 1981 uppdaterade korsreferenser, kapitelrubriker och annat referensmaterial; och en tryckning från 2013 rättade till typografiska inkonsekvenser som smugit sig in i tryckplattorna sedan 1981.
hero.4=Den räknas som en av de fyra volymer som sistadagarsheligas rörelse kallar sina standardverk, vid sidan av Bibeln, [[DC|Läran och förbunden]] och [[PGP|Den dyrbara pärlan]]. Texten i detta korpus kommer från Mormon Documentation Projects JSON-export, som dess ansvariga har förklarat fri från upphovsrätt; den följer dagens standardutgåvas ordalydelse och versindelning, med 2013 års tryckningens typografiska korrigeringar, och utelämnar de fotnoter, kapitelsammanfattningar och den inledning som fortfarande omfattas av upphovsrätt. Eftersom det som finns här är just denna nuvarande standardtext och inte någon enskild historisk tryckning anges inget enskilt utgivningsår för den.

