title=丁道尔新约 1534 — 关于本版本 | Common Root
description=威廉·丁道尔的新约：第一部从希腊文译出、也是第一部付印的英文译本，此为他本人1534年的修订本——日内瓦圣经与钦定本之下的那层措辞。
heroHeading=丁道尔新约 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=在丁道尔所处的英格兰，英文圣经仍属违法。1409年的《牛津宪章》规定，未经主教批准，任何人不得将圣经译成英文，也不得阅读这样的译本。1523年，威廉·丁道尔向伦敦主教卡斯伯特·滕斯托尔请求这一批准，遭到拒绝；次年他离开英格兰，决意不经批准完成此事。他面前是伊拉斯谟的希腊文新约，旁边是路德的德文译本和拉丁文武加大译本，由此完成了第一部从希腊文译出的英文新约，也是有史以来第一部付印的英文新约。1525年在科隆的首次尝试因印刷所遭搜查而中断；全书于1526年在沃尔姆斯由彼得·舍弗尔的印刷所印出，被偷运进英格兰，主教们则把书买下焚毁。
hero.2=这里的文本是丁道尔本人的修订本，1534年在安特卫普印行：他重新对照希腊文，修正了初版，并加上了序言和注释。这既是一部译本，也是一份立场。托马斯·莫尔攻击他，因为教会说“教会”之处他写“会众”（congregation），教会说“祭司”之处他写“长老”（elder），教会说 charity 之处他写“爱”（love）——这三处选择都保留在本文本中：马太福音16:18作“apon this rocke I wyll bylde my congregacion”。丁道尔于1535年再作修订，同年5月在安特卫普被捕，1536年以异端罪被判处，在布鲁塞尔附近的维尔福德被绞死并焚尸。
hero.3=在本阅读器中，他处在最底层。丁道尔被记录为日内瓦圣经和钦定本二者之下的一级，因而在梯子更低处，也位于建立在钦定本之上的 Revised Version、American Standard Version 和 World English Bible 之下。从钦定本的某一节越过日内瓦圣经往下走，措辞往往几乎不动——这正是要点所在；到了哥林多前书13:13，它动了：丁道尔和日内瓦圣经作 love，钦定本作 charity。丁道尔之下没有记录在案的母本。他依据的是伊拉斯谟的希腊文，但本语料库中的公认文本是1550年的版本，比他晚了一代人；这里的路德则是1545年的全本圣经，而不是他所用的1522年新约，所以梯子直接落到原文语言的底层。这里只有新约，保留他本人的拼写：马太福音开头作“This is the boke of the generacion of Iesus Christ”。

