title=Perla di Gran Prezzo — Su questa edizione | Common Root
description=La Perla di Gran Prezzo: una scelta di rivelazioni, traduzioni e racconti di Joseph Smith, raccolta per la prima volta nel 1851 come opuscolo missionario a Liverpool, in Inghilterra, e accettata come scrittura dai santi degli ultimi giorni nel 1880.
heroHeading=Perla di Gran Prezzo
readerHref=/reader?c1.src=pgp

hero.1=La Perla di Gran Prezzo nacque come opuscolo missionario, non come libro di scrittura. Nel 1851 Franklin D. Richards, allora presidente della Missione europea della chiesa, la compilò a Liverpool, in Inghilterra, raccogliendo scritti di Joseph Smith apparsi nei primi giornali della chiesa o circolati soltanto in poche copie, perché i membri in Gran Bretagna li avessero riuniti in un solo luogo. Il titolo viene dalla parabola di Matteo 13:45–46, quella del mercante che vende tutto ciò che possiede per comprare un'unica perla di gran prezzo.
hero.2=Una seconda edizione, curata e riordinata da Orson Pratt, uscì a Salt Lake City nel 1878, e il 10 ottobre 1880 una conferenza generale della chiesa la accettò per votazione come scrittura. Una revisione del 1902, preparata soprattutto da James E. Talmage, divise il testo in capitoli e versetti ed eliminò le rivelazioni che aveva in comune con Dottrina e Alleanze; un'edizione del 1921 la compose su due colonne. Nel 1976 vi furono aggiunte altre due rivelazioni — una visione del regno celeste e la visione di Joseph F. Smith sulla redenzione dei morti — e nel 1979 la chiesa le trasferì in Dottrina e Alleanze, la cui edizione del 1981 le riporta come sezioni 137 e 138.
hero.3=L'edizione attuale si compone di cinque parti. Selezioni dal Libro di Mosè e Joseph Smith – Matteo sono estratti della revisione della Bibbia di re Giacomo che Joseph Smith iniziò nel 1830: la prima è un racconto ampliato dei capitoli iniziali della Genesi, inquadrato da visioni date a Mosè; la seconda una rielaborazione di Matteo 23:39 e del capitolo 24. Il Libro di Abrahamo è il testo che Smith disse di aver tradotto da papiri egizi acquistati a Kirtland, in Ohio, nel 1835; fu pubblicato nel 1842 sul Times and Seasons a Nauvoo, in Illinois, con tre illustrazioni oggi chiamate facsimile 1, 2 e 3. Joseph Smith – Storia è tratto dal resoconto dei suoi primi anni e delle sue visioni che egli preparò nel 1838, e gli Articoli di fede sono tredici enunciati di credo tratti da una lettera del 1842 al direttore di giornale di Chicago John Wentworth.
hero.4=Il Libro di Abrahamo è la parte più spesso messa in discussione. A lungo si ritenne che la maggior parte dei papiri fosse andata distrutta, probabilmente nell'incendio di Chicago del 1871, ma dieci frammenti un tempo in possesso di Joseph Smith ricomparvero al Metropolitan Museum of Art di New York, che li trasferì alla chiesa nel 1967. Gli studiosi identificano i frammenti come parti di comuni testi funerari egizi, scritti tra il III secolo a.C. e il I secolo d.C., e il saggio pubblicato dalla chiesa stessa sul libro riconosce che nessuno dei caratteri che vi compaiono menziona il nome di Abrahamo o un qualunque evento narrato nel libro.
hero.5=Con la Bibbia, il Libro di Mormon e Dottrina e Alleanze, è una delle quattro opere canoniche della Chiesa di Gesù Cristo dei Santi degli Ultimi Giorni; la Community of Christ, l'altra grande chiesa discesa dal movimento di Joseph Smith, non la annovera tra le proprie scritture. Il testo di questo corpus proviene dall'esportazione JSON di pubblico dominio del Mormon Documentation Project, la stessa fonte del Libro di Mormon e di Dottrina e Alleanze presenti qui, e conserva le cinque parti come cinque libri: Mosè con otto capitoli, Abrahamo con cinque e gli ultimi tre con uno ciascuno. I tre facsimile e le spiegazioni stampate con essi non sono testo in versetti, e perciò non sono inclusi. Come le due opere compagne, riporta la formulazione dell'edizione standard attuale e non quella di una singola stampa storica, motivo per cui qui non è indicato un anno di pubblicazione.

fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Realizzata da
fact.2.value=Joseph Smith Jr. (1805–1844): rivelazioni, la sua revisione della Bibbia di re Giacomo, una traduzione che disse di aver fatto da papiri egizi, la sua storia personale e una dichiarazione di fede; riunite per la prima volta in un volume da Franklin D. Richards
fact.3.label=Pubblicata
fact.3.value=1851, Liverpool, Inghilterra, come opuscolo missionario compilato da Franklin D. Richards; seconda edizione 1878, Salt Lake City, curata da Orson Pratt; accettata come scrittura da una conferenza generale il 10 ottobre 1880
fact.4.label=Struttura
fact.4.value=Cinque parti — Selezioni dal Libro di Mosè, il Libro di Abrahamo, Joseph Smith – Matteo, Joseph Smith – Storia e gli Articoli di fede — divise in capitoli e versetti dalla revisione del 1902; il nostro corpus tratta ogni parte come un libro
fact.5.label=Posizione
fact.5.value=Una delle quattro opere canoniche della Chiesa di Gesù Cristo dei Santi degli Ultimi Giorni, insieme alla Bibbia, al [[BOM|Libro di Mormon]] e a [[DC|Dottrina e Alleanze]]; la Community of Christ non la considera scrittura
fact.6.label=In questo corpus
fact.6.value=Il testo segue la formulazione standard attuale dell'esportazione JSON di pubblico dominio del Mormon Documentation Project — la stessa fonte del [[BOM|Libro di Mormon]] e di [[DC|Dottrina e Alleanze]]; gli estratti di Mosè e di Matteo rielaborano il testo della [[KJV|King James Version]], che il corpus contiene anch'esso; i facsimile e le loro spiegazioni sono omessi, e qui non è indicato un singolo anno di stampa
fact.7.label=Licenza
fact.7.value=Di pubblico dominio, secondo quanto dichiarato dal responsabile dei dati; l'apparato di studio moderno protetto da copyright non è incluso
