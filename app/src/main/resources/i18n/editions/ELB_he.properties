fact.5.value=היוונית הביקורתית: מן הביבליות הגרמניות הראשונות ששברו עם [[TR|הטקסטוס רצפטוס]], ואספו את גרסאות הקודקס הסינאיטי והקודקס הוותיקני ככל שכתבי היד הללו באו לדפוס
