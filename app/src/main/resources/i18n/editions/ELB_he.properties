title=Elberfelder 1905 — על מהדורה זו | Common Root
description=ביבליית אלברפלד: התרגום הגרמני שהחלו בו ב־1855 ג'ון נלסון דרבי, קרל ברוקהאוס ויוליוס אנטון פון פוזק, מן הראשונים בגרמנית שנטשו את הטקסטוס רצפטוס — כאן בדפוס של 1905.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=השם הוא מקום. אלברפלד היא עיר בעמק הוופר, ומאז 1929 חלק מוופרטל, ושם נעשה רוב המלאכה. שלושה אנשים החלו בה: ג'ון נלסון דרבי, קרל ברוקהאוס ויוליוס אנטון פון פוזק, כולם קשורים לענף הגרמני של תנועת האחים. הברית החדשה הופיעה ב־1855, תהלים ב־1859 והברית הישנה ב־1871 — יוצאות לא בשמו של איש אלא כמתורגמות מן המקור “בידי כמה נוצרים”.
hero.2=מה שהבדיל אותה היה היוונית שמתחתיה. כמעט כל ביבליה גרמנית שהייתה אז במחזור עמדה עדיין על הטקסטוס רצפטוס; זו שברה עמו ואספה את גרסאות הקודקס הסינאיטי והקודקס הוותיקני ככל שכתבי היד הללו ראו אור באמצע המאה התשע־עשרה. הברית הישנה נעשתה מן העברית המסורתית. עקרון התרגום היה דיוק לפני חן: גרמנית ההולכת אחר העברית והיוונית מקרוב עד כדי קשיחות, כל מילה שהוספה למען המובן מסומנת כמוספת, ובלי כותרות משנה כלל, מן הטעם שבמקורות אין כאלה. היא נמנית עוד היום עם הנוסחים הגרמניים הקרובים ביותר ללשון שמתחתיהם.
hero.3=זהו הדפוס של 1905, הראשון שנסדר באות לטינית ולא בפרקטור; מקוטנה של אותה אות הוא נודע כ־Perlbibel. הוא לא היה תרגום חדש. עד מותו של רודולף ברוקהאוס ב־1932 עברה האלברפלדית עיון ותיקון מדפוס לדפוס — אלפרד רושה אחראי לברית הישנה, אמיל דנגס לחדשה — כך ששנה כאן מציינת דפוס בתוך נוסח נע ולא מהדורה גמורה. ומה שנמכר היום כאלברפלדית הוא לרוב דבר אחר שוב: ועדה מאותה תנועה השקיעה עשרים וחמש שנים בהגהתה ופרסמה את התוצאה ב־1975 וב־1985. אותה הגהה הוציאה את “Jehova” מן הברית הישנה והציבה “HERR” במקומו. הנוסח שכאן עדיין מדפיס “Jehova”, וזה מציב אותו לצד American Standard Version ולצד הביבליה הצרפתית של דרבי עצמו.
hero.4=מקומה באוסף הזה עומד מעט בצד. לגרמנית אין מהדורת ברירת מחדל נבחרת בקורא, ולכן ממשק גרמני פותח את הביבליה הגרמנית הראשונה בקטלוג, והיא זו — לפני שתי ביבליות לותר בסדר האלפביתי ולא בשל דבר אחר. בשלבי השושלת היא עומדת לבדה. שני הלותרים יוצרים שרשרת, זו של 1912 מוגהת מזו של 1545 וזו של 1545 נשענת על היוונית והעברית, ואילו לאלברפלדית אין מקור רשום, משום שהאלברפלדית של 1871 שממנה יצאה בכוח תיקונים חוזרים אינה באוסף הזה. שלב מתחת לפסוק אלברפלדי יורד לפיכך היישר אל רצפת שפות המקור המסומנת ב־≈, אף שהביבליה הצרפתית של דרבי, במרחק טור אחד, היא קרובתה הקרובה ביותר כאן.

