fact.13.label=באוסף זה
fact.13.value=הביבליה שממשק גרמני נפתח עליה: לגרמנית אין מהדורת ברירת מחדל נבחרת, ולכן הקורא לוקח את הביבליה הגרמנית הראשונה בקטלוג, ו־ELB עומדת לפני [[LUT1545|Luther 1545]] ולפני [[LUT1912|Luther 1912]] בשל קיצורה בלבד ולא בשל דבר אחר. בשלבי השושלת לא רשום שום מקור — האלברפלדית של 1871 שממנה יצאה בכוח תיקונים חוזרים אינה באוסף — ולכן שלב נפתח על רצפת שפות המקור. גם שנה אינה נושאת באף אחד משני הצדדים: כרטיס הקטלוג מותיר את עמודת השנה ריקה, ורשימת שנות השלבים הנאספת ביד אינה מכירה אותה אף היא, כך שתווית שלב עבור ELB מציגה את הקיצור ולא יותר — זה המקרה השקט, ואילו [[DRA|דואה-ריימס]] היא הרועש, ושם שתי הרשימות סותרות זו את זו בגלוי
