fact.8.value=מדפיסה “Jehova” לאורך הברית הישנה; הגהת 1985 החליפה אותו ב־“HERR”. אותה הכרעה כמו ב־[[ASV|American Standard Version]] וכמו ב[[DBY|ביבליה הצרפתית של דרבי]]
