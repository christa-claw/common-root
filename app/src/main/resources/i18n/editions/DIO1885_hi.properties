title=दियोदाती 1885 (इतालवी) — इस संस्करण के बारे में | Common Root
description=जोवान्नी दियोदाती की इतालवी बाइबिल उन्नीसवीं सदी के एक रूप में: उनका 1641 का पाठ 1821 के संशोधन में, 1885 तिथि वाले एक संस्करण में — वही अनुवाद जो इस संग्रह की दूसरी दियोदाती में है, बस पदों में अलग ढंग से बँटा हुआ।
heroHeading=दियोदाती 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=यह जोवान्नी दियोदाती का अनुवाद है — लुक्का मूल के परिवार के वे जिनेवावासी, जिनका जन्म 1576 में हुआ, जिन्होंने 1607 में लातीनी के बजाय इब्रानी और यूनानी से बनी पहली इतालवी बाइबिल प्रकाशित की, और 1641 में, अपनी मृत्यु से आठ वर्ष पहले, अपनी टिप्पणियों के साथ उसका संशोधन किया। इस संग्रह की दूसरी दियोदाती का अपना पृष्ठ है, जो वह कहानी बताता है। उनके बाद दो सदियों तक यह पाठ पुनर्मुद्रण के सहारे जीवित रहा, और 1808 से ब्रिटिश एंड फ़ॉरेन बाइबिल सोसाइटी ने इसे एक के बाद एक संस्करण में छापा, क्योंकि इतालवी प्रोटेस्टेंटों के लिए छापने को और कुछ था ही नहीं।
hero.2=यह फ़ाइल उन्हीं बाद के रूपों में से एक है। eBible.org, जो इसे यूनाइटेड बाइबिल सोसाइटीज़ की ओर से उपलब्ध कराता है, इसे दियोदाती का 1641 का अनुवाद बताता है, जिसका 1821 में संशोधन हुआ, और जो 1885 तिथि वाले एक संस्करण में है। 1821 का संशोधन किसने किया और 1885 का संस्करण किस छापेखाने ने छापा, यह इस परियोजना ने स्थापित नहीं किया है, इसलिए पृष्ठ उनके नाम नहीं लेता। यहाँ तिथि वैसी समस्या नहीं है जैसी दूसरी दियोदाती में है, जिसका लेबल दियोदाती की मृत्यु का वर्ष है: 1885 इस संस्करण की अपनी तिथि है, सूची उसे सहेजती है, और पायदान चिह्न उसे दिखाता है।
hero.3=दूसरी दियोदाती के साथ रखने पर हर नमूना-जाँच में शब्द वही हैं: भजन 23 में “il Signore è il mio pastore”, यशायाह 7:14 में “la Vergine concepirà”, 1 यूहन्ना 5:7 में स्वर्गीय गवाह, प्रभु की प्रार्थना के अंत में स्तुतिवचन, प्रेरितों के काम 8:37 पूरा। ईश्वरीय नाम “il Signore” है, यानी प्रभु, जैसा दियोदाती ने लिखा; इसे “l'Eterno” में बदलने वाली रिवेदुता थी, इसी पाठ का एक संशोधन जो 1924 में छपा। अंतर पद-विभाजन में है। तीस से अधिक स्थानों पर यह प्रति एक दूसरी पद्धति का पालन करती है, जो इब्रानी के निकट है — योना की प्रार्थना 2:1 से शुरू होती है और अध्याय 2:11 तक जाता है, यशायाह 8 में 23वाँ पद है, अय्यूब 39 पद 38 तक चलता है, और कुलुस्सियों 4 का पहला पद अध्याय 3 के अंत में है — इसलिए कुल मिलाकर इसमें सात पद कम हैं। और इस प्रति में भजनों का एक भी शीर्षक नहीं है: भजन 51 सीधे “Abbi pietà di me, o Dio” से शुरू होता है, जबकि दूसरी दियोदाती शीर्षक को पहले पद में मिला देती है। eBible.org की इस पाठ की अपनी प्रस्तुति में शीर्षक दिखते हैं, इसलिए अधिक संभावना यही है कि वे इस परियोजना के आयात में खो गए, न कि 1885 की छपाई में थे ही नहीं।
hero.4=इस पाठक में यह तीन इतालवी बाइबिलों में से एक है। इतालवी अंतरफलक दूसरी दियोदाती, यानी दियोदाती 1649, पर खुलता है, जो सूची-क्रम में पहले आती है, क्योंकि इतालवी के लिए कोई चुना हुआ संस्करण नहीं है। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं है — उसी अनुवाद की वह दूसरी प्रति भी नहीं — इसलिए किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषा तल पर पहुँचता है। दूसरी दियोदाती की तरह, वहाँ टेक्स्टस रिसेप्टस सच्चाई के निकट है: दियोदाती ने बेज़ा के मुद्रित यूनानी पाठ से काम किया था, जो उसी परिवार का पाठ है।

