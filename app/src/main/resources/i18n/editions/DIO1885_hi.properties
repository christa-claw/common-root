fact.11.value=तीन इतालवी बाइबिलों में से एक, [[DIO|दियोदाती 1649]] और [[RIV1927|रिवेदुता 1927]] के साथ; इतालवी अंतरफलक दियोदाती 1649 पर खुलता है; वंश-पायदानों में कोई मूल अभिलिखित नहीं, और इसका पायदान चिह्न 1885 दिखाता है
