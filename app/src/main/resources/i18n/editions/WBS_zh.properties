fact.1.label=语言
fact.1.value=英语
fact.2.label=修订者
fact.2.value=诺亚·韦伯斯特（1758–1843），美国词典编纂家，An American Dictionary of the English Language（1828）的编者
fact.3.label=修订底本
fact.3.value=1611年的 [[KJV|King James Version]]，即“通行译本”，依当时的印本——以英文修订，而非重新翻译，不过韦伯斯特修订时参考了希伯来文和希腊文
fact.4.label=修订取向
fact.4.value=轻微而保守：以通行词替换废弃词；改正语法，指人用“who”，指物用“its”；少数被认为不宜朗读的词加以缓和；以“Holy Spirit”代替“Holy Ghost”；文风与涉及教义的经文刻意保持原样
fact.5.label=出版
fact.5.value=康涅狄格州纽黑文：Durrie and Peck，1833年，书名为 The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=授权
fact.6.value=公共领域；本副本取自 eBible.org
fact.7.label=在本语料库中
fact.7.value=66卷，完整的新教正典，不含次经；采用英文章节编号，因此诗篇共150篇，每篇标题并入其第1节
fact.8.label=谱系
fact.8.value=无记录在案的母本，也没有记录在案立于其上的版本——级会直接打开在原文语言底层：旧约为[[WLC|列宁格勒抄本]]，新约为[[TR|公认文本]]；而韦伯斯特所修订的文本其实是 [[KJV|King James Version]]
