title=Webster's Bible — 关于此版本 | Common Root
description=诺亚·韦伯斯特于1833年对 King James Version 所作的修订，在康涅狄格州纽黑文出版——通行的英文圣经几乎逐字保留，只替换了废弃不用的词语，改正了语法，并为朗读而缓和了少数措辞。
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=诺亚·韦伯斯特（1758–1843）是纽黑文的词典编纂家，最为人所知的是1828年的 An American Dictionary of the English Language。5年后，他把同样对清晰、正确、当代英语的关切，转向了他的国家实际在读的那部圣经。1833年，纽黑文的 Durrie and Peck 出版了 The Holy Bible … in the Common Version, with Amendments of the Language，其序言署于同年9月。这不是新译本。韦伯斯特采用当时通行印本的1611年 King James Version——“通行译本”——只在其英语已变得晦涩或不合语法之处才加以改动。他写道，他在修订时参考了原文，但译本的总体风格不应改变；他也没有有意改动任何一个宗派据以立其教义的经文。
hero.2=他的序言列出3类改动。完全废弃不用的词让位给通行的词：在 King James 作“wotteth not”之处，约瑟的主人对家中之事“knoweth not”（创世记39:8）；在使徒行传12:4，希律打算“after the passover”把彼得提出来，而不是“after Easter”。语法按韦伯斯特时代的用法加以改正：指人时用“who”代替“which”，于是主祷文以“Our Father who art in heaven”开头；指物时用“its”代替“his”，于是创世记第1章的植物结种“after its kind”。此外，少数他认为不宜在男女同席的会众面前朗读的词，换成了较委婉的说法。他还把 King James 的“Holy Ghost”写作“Holy Spirit”，我们的副本中一个“Holy Ghost”也没有。除此以外，这次修订很轻：大多数读者可以一章接一章地读下去，而察觉不到自己已离开了 King James 的文本。
hero.3=我们的副本是完整的：从创世记到启示录共66卷，不含次经，采用英文的章节编号——诗篇共150篇，每篇的标题并入其第1节，玛拉基书止于第4章。与 King James 一样，它保留了后来的校勘本所质疑的公认文本段落：马可福音的较长结尾、使徒行传8:37，以及约翰一书5:7中天上的3个见证。在本阅读器中，它独立存在。虽然它是对同样收于本语料库的 King James Version 的修订，语料库却没有为它记录母本，因此在它某节经文下打开的谱系之级会直接落到以≈标记的原文语言底层——旧约为列宁格勒抄本，新约为 Textus Receptus——而不是韦伯斯特实际据以修订的那部英文文本。也没有任何版本被记录为立于它之上。没有任何界面语言默认打开此版本；英文界面默认打开的是 New International Version，此版本须从翻译网格中它自己的卡片进入。把它放在第2栏与 King James 并列，就能逐节看到韦伯斯特的修订。

