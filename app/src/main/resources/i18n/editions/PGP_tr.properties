fact.1.value=İngilizce
fact.2.label=Yapanlar
fact.2.value=Joseph Smith Jr. (1805–1844): vahiyler, Kral James İncili revizyonu, Mısır papirüslerinden yaptığını söylediği bir çeviri, kendi tarihi ve bir inanç bildirgesi; ilk kez tek ciltte Franklin D. Richards tarafından derlendi
fact.3.label=Yayımlanma
fact.3.value=1851, Liverpool, İngiltere, Franklin D. Richards'ın derlediği bir misyon broşürü olarak; ikinci baskı 1878, Salt Lake City, editörü Orson Pratt; 10 Ekim 1880'de bir genel konferansça kutsal metin olarak kabul edildi
fact.4.label=Yapı
fact.4.value=Beş bölüm — Musa Kitabı'ndan Seçmeler, İbrahim Kitabı, Joseph Smith—Matta, Joseph Smith—Tarih ve İman Maddeleri — 1902 revizyonundan beri bölümlere ve ayetlere ayrılmış; derlememizde her bölüm ayrı bir kitaptır
fact.5.label=Konum
fact.5.value=İsa Mesih'in Son Zaman Azizler Kilisesi'nin dört standart eserinden biri; İncil, [[BOM|Mormon Kitabı]] ve [[DC|Öğreti ve Antlaşmalar]] ile birlikte; Community of Christ onu kutsal metin saymaz
fact.6.label=Bu derlemede
fact.6.value=Metin, Mormon Documentation Project'in kamu malı ilan edilmiş JSON dışa aktarımındaki güncel standart ifadeyi izler — [[BOM|Mormon Kitabı]] ve [[DC|Öğreti ve Antlaşmalar]] ile aynı kaynak; Musa ve Matta alıntıları, derlemede de bulunan [[KJV|Kral James Çevirisi]] metnini yeniden işler; faksimileler ve açıklamaları dışarıda bırakılmıştır ve burada tek bir baskı yılı verilmemiştir
fact.7.label=Lisans
fact.7.value=Kamu malı, verinin sorumlusunun beyanına göre; modern, telif hakkı korumalı inceleme malzemesi dahil değildir
