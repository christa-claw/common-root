title=Değerli İnci — Bu Baskı Hakkında | Common Root
description=Değerli İnci: Joseph Smith'in vahiylerinden, çevirilerinden ve anlatılarından bir seçki; ilk kez 1851'de İngiltere'nin Liverpool kentinde bir misyon broşürü olarak derlenmiş ve 1880'de Son Gün Azizleri tarafından kutsal metin olarak kabul edilmiştir.
heroHeading=Değerli İnci
readerHref=/reader?c1.src=pgp

hero.1=Değerli İnci, bir kutsal kitap olarak değil, bir misyon broşürü olarak doğdu. 1851'de, o sırada kilisenin Avrupa Misyonu başkanı olan Franklin D. Richards, onu İngiltere'nin Liverpool kentinde derledi; kilisenin ilk gazetelerinde yayımlanmış ya da yalnızca az sayıda nüshayla dolaşmış Joseph Smith yazılarını bir araya getirerek Britanya'daki üyelerin bunlara tek bir yerde ulaşmasını sağladı. Adı, Matta 13:45–46'daki benzetmeden, sahip olduğu her şeyi satıp çok değerli tek bir inci satın alan tüccarın öyküsünden gelir.
hero.2=Orson Pratt'ın düzenleyip yeniden sıraladığı ikinci baskı 1878'de Salt Lake City'de yayımlandı ve 10 Ekim 1880'de kilisenin bir genel konferansı onu oylamayla kutsal metin olarak kabul etti. Büyük ölçüde James E. Talmage'ın hazırladığı 1902 revizyonu metni bölümlere ve ayetlere ayırdı ve Öğreti ve Antlaşmalar ile ortak olan vahiyleri çıkardı; 1921 baskısı iki sütun hâlinde dizildi. 1976'da iki vahiy daha eklendi — selestiyal krallığın görümü ve Joseph F. Smith'in ölülerin kurtuluşuna dair görümü — ve 1979'da kilise bunları Öğreti ve Antlaşmalar'a taşıdı; o kitabın 1981 baskısı bunları 137. ve 138. kısımlar olarak basar.
hero.3=Günümüzdeki baskı beş bölümden oluşur. "Musa Kitabı'ndan Seçmeler" ve "Joseph Smith—Matta", Joseph Smith'in 1830'da başladığı Kral James İncili revizyonundan alıntılardır: ilki, Musa'ya verilen görümler çerçevesinde Yaratılış'ın ilk bölümlerinin genişletilmiş bir anlatımı; ikincisi Matta 23:39 ile 24. bölümün yeniden yazımıdır. "İbrahim Kitabı", Smith'in 1835'te Kirtland, Ohio'da edinilen Mısır papirüslerinden çevirdiğini söylediği metindir; 1842'de Nauvoo, Illinois'teki Times and Seasons gazetesinde, bugün 1, 2 ve 3 numaralı faksimileler olarak anılan üç resimle birlikte yayımlandı. "Joseph Smith—Tarih", onun 1838'de hazırladığı ilk yılları ve görümleri hakkındaki anlatıdan alınmıştır; "İman Maddeleri" ise 1842'de Chicago'lu gazete editörü John Wentworth'e yazdığı bir mektuptaki on üç inanç ifadesidir.
hero.4="İbrahim Kitabı", en sık sorgulanan bölümdür. Papirüslerin çoğunun uzun süre, büyük olasılıkla 1871 Chicago yangınında, yok olduğu düşünüldü; ancak bir zamanlar Joseph Smith'in elinde bulunan on parça New York'taki Metropolitan Sanat Müzesi'nde ortaya çıktı ve müze bunları 1967'de kiliseye devretti. Araştırmacılar bu parçaları, MÖ 3. yüzyıl ile MS 1. yüzyıl arasında yazılmış sıradan Mısır cenaze metinlerinin parçaları olarak tanımlar; kilisenin kitap hakkında yayımladığı kendi makalesi de parçalardaki işaretlerin hiçbirinin İbrahim'in adını ya da kitabın anlattığı herhangi bir olayı anmadığını kabul eder.
hero.5=İncil, Mormon Kitabı ve Öğreti ve Antlaşmalar ile birlikte İsa Mesih'in Son Zaman Azizler Kilisesi'nin dört standart eserinden biridir; Joseph Smith'in hareketinden doğan öteki büyük kilise Community of Christ ise onu kutsal metinleri arasında saymaz. Bu derlemedeki metin, Mormon Documentation Project'in kamu malı JSON dışa aktarımından alınmıştır; buradaki Mormon Kitabı ve Öğreti ve Antlaşmalar ile aynı kaynaktır ve beş bölümü beş kitap olarak korur: Musa sekiz bölüm, İbrahim beş bölüm, son üçü ise birer bölüm. Üç faksimile ve onlarla birlikte basılan açıklamalar ayetli metin olmadığından dahil edilmemiştir. İki kardeş eseri gibi, herhangi bir tarihsel baskıyı değil, güncel standart baskının ifadesini izler; bu yüzden burada bir yayın yılı verilmemiştir.

