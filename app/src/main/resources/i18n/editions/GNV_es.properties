fact.1.label=Lengua
fact.1.value=inglés — isabelino, en su ortografía original
fact.2.label=Hecha por
fact.2.value=protestantes ingleses que habían huido del reinado de María I y se establecieron en Ginebra — William Whittingham hizo el Nuevo Testamento de 1557, y un equipo dirigido por Anthony Gilby el Antiguo
fact.3.label=Primera edición completa
fact.3.value=1560, impresa en Ginebra por Rowland Hall
fact.4.label=Antiguo Testamento de
fact.4.value=el hebreo masorético — [[WLC|el Códice de Leningrado de Westminster]] es el testigo de ese texto en este corpus
fact.5.label=Nuevo Testamento de
fact.5.value=el griego de la línea del [[TR|Textus Receptus]]; desde 1576 la revisión de Laurence Tomson, hecha sobre la edición griega de Beza de 1565, desplazó el Nuevo Testamento de Whittingham en la mayoría de las impresiones
fact.6.label=Qué nombra “1599”
fact.6.value=las impresiones que llevan el Nuevo Testamento de Tomson junto con las notas de Franciscus Junius al Apocalipsis, que entraron en la Biblia de Ginebra ese año
fact.7.label=Primicias
fact.7.value=la primera Biblia inglesa con todos los versículos numerados, compuesta en letra redonda en lugar de gótica y provista de un aparato completo de notas marginales — una Biblia de estudio antes de que existiera el término
fact.8.label=Objetada por
fact.8.value=Jacobo I, que consideraba sediciosas las notas marginales — una queja que ayudó a poner en marcha [[KJV|la Versión del Rey Jacobo]]
fact.9.label=Año en el catálogo
fact.9.value=en blanco en la ficha Acerca de, aunque la etiqueta de peldaño dice GNV 1599 — la Biblia de Ginebra se reimprimió desde 1560 hasta la década de 1640, cambiando su Nuevo Testamento y sus notas bajo un mismo nombre
fact.10.label=En este corpus
fact.10.value=los 66 libros, sin apócrifos, ortografía sin modernizar — Génesis 1:1 dice “the heauen and the earth”
fact.11.label=Bajo un peldaño
fact.11.value=[[TR|Textus Receptus]] y [[WLC|Códice de Leningrado de Westminster]]; la de Ginebra es a su vez el primer peldaño bajo [[KJV|la Versión del Rey Jacobo]]
