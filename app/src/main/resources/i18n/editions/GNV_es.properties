title=Biblia de Ginebra 1599 — Acerca de esta edición | Common Root
description=La Biblia de Ginebra: hecha por protestantes ingleses exiliados en Ginebra, la primera Biblia inglesa con versículos numerados y notas marginales, leída por la generación de Shakespeare y el peldaño bajo la Versión del Rey Jacobo.
heroHeading=Biblia de Ginebra 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Esta Biblia se hizo en el extranjero, por gente que no podía quedarse en casa sin peligro. Cuando María I subió al trono en 1553 e Inglaterra volvió a Roma, unos cientos de protestantes se marcharon; algunos se establecieron en la Ginebra de Calvino, donde había imprentas, erudición hebrea y griega, y ningún obispo ante quien responder. William Whittingham publicó allí un Nuevo Testamento en 1557. Un equipo dirigido por Anthony Gilby recorrió el Antiguo Testamento, y la Biblia completa se imprimió en Ginebra, por Rowland Hall, en 1560, dos años después de la muerte de María, cuando la mayoría de los exiliados ya había regresado.
hero.2=Lo que produjeron cambió el aspecto de una Biblia inglesa. Fue la primera en numerar cada versículo, de modo que se podía remitir al lector a una línea y no a un capítulo. Se compuso en letra redonda en vez de gótica y salió lo bastante pequeña y barata como para poseerse en lugar de encadenarse a un atril. Y los márgenes iban llenos: referencias cruzadas, glosas de palabras difíciles, mapas y notas que explicaban lo que significaba un pasaje. Esto último es la razón de que se la amara y de que se la resintiera. Las notas son reformadas, y en algunos lugares agudamente, y le dicen al lector qué pensar de los reyes con la misma soltura con que le dicen qué pensar de la doctrina.
hero.3=La fecha de esta edición pide una advertencia, porque la Biblia de Ginebra no fue un libro sino un texto reimpreso durante ochenta años mientras sus partes cambiaban. En 1576 Laurence Tomson sustituyó el Nuevo Testamento por su propia revisión, hecha sobre la edición griega de Teodoro de Beza de 1565, y desde 1587 ese es el Nuevo Testamento que llevan casi todas las Biblias de Ginebra. En 1599 se añadieron las notas de Franciscus Junius al Apocalipsis. Así pues, “1599” nombra una configuración — el Nuevo Testamento de Tomson más Junius sobre el Apocalipsis — con más precisión que un año de impresión, y siguieron imprimiéndose Biblias con esa fecha después. Por eso la ficha del catálogo deja el año en blanco mientras la etiqueta de peldaño, que necesita algo breve que mostrar, dice GNV 1599.
hero.4=Su posición en esta colección es una bisagra. La cadena de linaje más larga que hay aquí va de la World English Bible a la American Standard Version, a la Revised Version, a la Versión del Rey Jacobo, y luego a esta: abra un peldaño más bajo un versículo del Rey Jacobo y aparecerá debajo la redacción de Ginebra, que es el modo más claro de ver cuánto del Rey Jacobo es heredado y no compuesto. Debajo de Ginebra ya no hay nada en inglés — solo el griego y el hebreo, el Textus Receptus y el Códice de Leningrado de Westminster, donde la escalera toca su fondo. El texto se da tal como lo tiene la edición, con su ortografía y todo, de manera que Génesis 1:1 dice heauen; los títulos de los salmos y el colofón de Hebreos corren incorporados al comienzo del primer versículo, tal como los componían aquellas impresiones, y se han dejado ahí en vez de limpiarlos.

