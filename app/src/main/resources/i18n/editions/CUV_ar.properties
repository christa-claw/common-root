title=الترجمة الصينية الموحَّدة — عن هذه الطبعة | Common Root
description=الترجمة الصينية الموحَّدة لسنة 1919: تسعٌ وعشرون سنة من عمل اللجان أثمرت الكتاب المقدس الذي ما زال بروتستانت الصين يقرأونه، وأحد أوائل الكتب التي نُشرت أصلًا بالمَندرين الدارجة المكتوبة.
heroHeading=الترجمة الصينية الموحَّدة
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=في سنة 1890 اجتمعت الإرساليات البروتستانتية العاملة في الصين بشنغهاي وأقرّت بمشكلة. كانت هناك بالفعل عدة تراجم صينية للكتاب المقدس، ولا اثنتان منها تتفقان: لا في الصياغة، ولا في رسم الأعلام، ولا حتى في أيّ مستوى من الصينية يُكتب. فقرر المؤتمر ترجمة واحدة تستعملها كل إرسالية، وسمّاها الترجمة الموحَّدة: 和合本، أي النص المؤالَف. ولمّا كانت الصينية المكتوبة يومئذ منقسمة بين لغة أدبية للمتعلمين ولغة منطوقة لسائر الناس، طُلبت ثلاث ترجمات دفعةً واحدة: اثنتان بالصينية الأدبية وواحدة بالمَندرين.
hero.2=استغرقت لجنة المَندرين تسعًا وعشرين سنة. ترأّسها كالفن ويلسون ماتير، وهو مشيخيّ أمريكي مقيم في شاندونغ منذ 1863، ومات سنة 1908 والعمل لم يتم؛ فمضت في العمل الهيئة التي كان قد جمعها من نحو ستّ إرساليات، ومضى معها العلماء الصينيون العاملون إلى جانبهم، وهم الذين حفظت سجلات الإرساليات أسماءهم بعناية أقل بكثير. اتخذوا الـ Revised Version الإنجليزية نصًّا ينقلونه، وقابلوها بالعبرية واليونانية اللتين وراءها — وهذا يجعل الـ Revised Version التي في هذه المجموعة نفسها درجةً واحدة فوق هذا الكتاب، والـ King James Version درجةً أخرى فوقها. أمّا الترجمتان الأدبيتان فدُمجتا في النهاية في واحدة. والذي بقي هو ترجمة المَندرين.
hero.3=صدرت سنة 1919، وقد صنع لها التاريخ ما لم تكن لجنة لتصنعه. فتلك سنة حركة الرابع من مايو، حين شرع الكُتّاب الصينيون جدًّا في هجر اللغة الأدبية إلى الدارجة، فجاءت الترجمة الموحَّدة من أوائل الكتب الضخمة المكتوبة بها أصلًا. وهكذا استحالت ترجمة قُصد بها فضّ خلاف بين المرسلين معلَمًا من معالم النثر الصيني الحديث، حتى صارت عباراتها يقتبسها من لم يفتح كتابًا مقدسًا قط. وهي تُطبع منذئذ في طبعتين لا تختلفان إلا في كلمة واحدة — أيكون الله 神 أم 上帝 — وقد ضُبط التباعد حتى تظلّ الطبعتان تقطعان الصفحات في الموضع نفسه.
hero.4=وهي في هذا القارئ الكتابُ المقدس الصيني الوحيد، وذلك يحسم أمرين في سلوكه. اضبط الواجهة على الصينية ينفتح هذا — لا لأنه انتُقي، كما انتُقيت Reina-Valera 1909 للإسبانية، بل لأن الفهرس لا يجد في اللغة كتابًا مقدسًا غيره. وليس له في درجات النسب أصل مسجّل، فالدرجة تحت الآية تهبط رأسًا إلى أرضية اللغات الأصلية الموسومة بـ ≈، مع أن الـ Revised Version التي صُنع منها قائمة في المجموعة على بُعد عمود واحد. غير أن شارة درجته تحمل سنة، 1919، وليس كل طبعة هنا تفعل ذلك.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الصينية — المَندرين الدارجة (官話 / baihua) لا الصينية الأدبية
fact.2.label=الاسم بلغتها
fact.2.value=和合本 (héhéběn) — الترجمة “المؤالَفة” أو “الموحَّدة”
fact.3.label=مَن طلبها
fact.3.value=المؤتمر العام للمرسلين البروتستانت بشنغهاي سنة 1890
fact.4.label=مَن ترجمها
fact.4.value=لجنة مؤلَّفة من عدة إرساليات بروتستانتية؛ ترأّس المشيخيّ الأمريكي كالفن ويلسون ماتير (1836–1908) هيئة المَندرين حتى وفاته، عاملًا طوال الوقت مع زملاء صينيين
fact.5.label=النشر
fact.5.value=1919، بعد تسعٍ وعشرين سنة من العمل
fact.6.label=الأساس النصي
fact.6.value=الـ Revised Version الإنجليزية أساسًا للعمل، مقابَلةً بالعبرية واليونانية — وهي [[RV|الترجمة المنقَّحة]] نفسها التي تضمّها هذه المجموعة
fact.7.label=طبعتان
fact.7.value=طبعة شِن (神版) وطبعة شانغدي (上帝版)، لا تختلفان إلا في أيّ لفظ صيني يحمل معنى “الله”
fact.8.label=تنقيح لاحق
fact.8.value=الترجمة الصينية الموحَّدة المنقَّحة: العهد الجديد سنة 2006 والكتاب كاملًا سنة 2010 — وليست هي هذا النص
fact.9.label=في هذه المجموعة
fact.9.value=الكتاب المقدس الصيني الوحيد هنا، فالواجهة الصينية تفتح عليه تلقائيًّا؛ ولا أصل مسجّل له في درجات النسب، وإن كانت شارة درجته تحمل سنة 1919
