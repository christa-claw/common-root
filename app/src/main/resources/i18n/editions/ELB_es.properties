fact.13.label=En este corpus
fact.13.value=la Biblia con que abre una interfaz alemana: el alemán no tiene edición predeterminada curada, de modo que el lector toma la primera Biblia alemana del catálogo, y ELB va por delante de [[LUT1545|Luther 1545]] y de [[LUT1912|Luther 1912]] por nada más que su abreviatura. En los peldaños de linaje no consta antecedente alguno — la Elberfelder de 1871 de la que salió a fuerza de correcciones no está en el corpus — así que un peldaño abre en el suelo de lenguas originales. Tampoco lleva año por ninguno de los dos lados: la ficha del catálogo deja la columna del año en blanco y la lista de años de peldaño, hecha a mano, tampoco la recoge, de manera que un peldaño de ELB muestra la abreviatura y nada más — el caso callado, mientras que [[DRA|la Douay-Rheims]] es el ruidoso y allí las dos listas se contradicen en público
