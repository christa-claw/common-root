title=Elberfelder 1905 — Acerca de esta edición | Common Root
description=La Biblia de Elberfeld: la traducción alemana comenzada en 1855 por John Nelson Darby, Carl Brockhaus y Julius Anton von Poseck, una de las primeras en alemán que abandonó el Textus Receptus — aquí en la impresión de 1905.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=El nombre es un lugar. Elberfeld es una ciudad del valle del Wupper, parte de Wuppertal desde 1929, y allí se hizo la mayor parte del trabajo. La empezaron tres hombres: John Nelson Darby, Carl Brockhaus y Julius Anton von Poseck, todos ligados a la rama alemana del movimiento de los Hermanos. El Nuevo Testamento apareció en 1855, los Salmos en 1859 y el Antiguo Testamento en 1871, publicados no bajo el nombre de nadie sino como traducidos del texto original “por algunos cristianos”.
hero.2=Lo que la distinguía era el griego que tenía debajo. Casi toda Biblia alemana entonces en circulación seguía apoyada en el Textus Receptus; esta rompió con él y recogió las lecturas del Códice Sinaítico y del Códice Vaticano a medida que esos manuscritos se iban publicando a mediados del siglo XIX. El Antiguo Testamento se hizo del hebreo masorético. El principio de traducción era la exactitud antes que la elegancia: un alemán que sigue al hebreo y al griego tan de cerca que resulta rígido, cada palabra añadida por el sentido marcada como añadida, y ningún encabezamiento de sección, por la razón de que los textos originales no los tienen. Todavía se la cuenta entre las versiones alemanas más cercanas a la letra que hay debajo de ellas.
hero.3=Esta es la impresión de 1905, la primera compuesta en tipo latino en vez de fractura; por el cuerpo pequeño de esa letra se la conoce como la Perlbibel. No fue una traducción nueva. Hasta la muerte de Rudolf Brockhaus en 1932 la Elberfelder se revisó y se corrigió de impresión en impresión — Alfred Rochat respondía del Antiguo Testamento, Emil Dönges del Nuevo — de modo que una fecha nombra aquí una impresión dentro de un texto en movimiento y no una edición acabada. Lo que hoy se vende como Elberfelder suele ser otra cosa distinta: una comisión del mismo movimiento dedicó veinticinco años a revisarla y publicó el resultado en 1975 y 1985. Esa revisión quitó “Jehova” del Antiguo Testamento y puso “HERR” en su lugar. Este texto sigue imprimiendo “Jehova”, lo que la coloca al lado de la American Standard Version y al lado de la propia Biblia francesa de Darby.
hero.4=Su sitio en esta colección queda algo aparte. El alemán no tiene edición predeterminada curada en el lector, así que una interfaz alemana abre la primera Biblia alemana del catálogo, y es esta — por delante de las dos Biblias de Lutero por orden alfabético y por nada más. En los peldaños de linaje está sola. Los dos Lutero forman una cadena, la de 1912 revisada de la de 1545 y la de 1545 apoyada en el griego y el hebreo, mientras que la Elberfelder no tiene antecedente registrado, porque la Elberfelder de 1871 de la que salió a fuerza de correcciones no está en este corpus. Un peldaño bajo un versículo de la Elberfelder va por eso derecho al suelo de lenguas originales marcado con ≈, aunque la Biblia francesa de Darby, a una columna de distancia, sea aquí su pariente más próximo.

