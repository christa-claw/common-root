title=ブレントン版英語七十人訳 — この版について | Common Root
description=サー・ランスロット・ブレントンによるギリシャ語旧約聖書の英訳。1844年にロンドンで初めて刊行され、1851年に外典を加えて再刊された。100年以上にわたり英語の七十人訳そのものであり、このリーダーでは、それが訳されたギリシャ語本文の上の段にあたる。
heroHeading=ブレントン版英語七十人訳
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=ランスロット・チャールズ・リー・ブレントン（1807–1862）は英国海軍の提督サー・ジャリール・ブレントンの息子で、オックスフォードのオリエル・カレッジを卒業して2年後の1830年に英国国教会で叙任された。だが、そこに長くはとどまらなかった。オックスフォードで彼はジョン・ネルソン・ダービーと出会っており、1831年の末までには国教会を離れてバースに独立の礼拝堂を開いた。1835年までにその礼拝堂は、ダービーが当時かたちづくりつつあった運動、プリマス・ブレザレンと結びついていた。ダービー自身の聖書もこのコーパスに、フランス語と英語で収められている。1844年、ブレントンは父の准男爵位を継ぎ、同じ年にロンドンのサミュエル・バグスター・アンド・サンズ社が彼の七十人訳の翻訳を出版した。1862年にワイト島で、子のないまま、その家系の最後の准男爵として世を去った。
hero.2=これは最初の英語の七十人訳ではない——チャールズ・トムソンが1808年にフィラデルフィアで一つを出していた——が、生き残ったのはこちらだった。2007年に New English Translation of the Septuagint が現れるまでの150年以上、ヘブライ語ではなくギリシャ語の旧約を求める英語の読者が読んだのはブレントンだった。彼は主にヴァチカン写本、つまりヴァチカン図書館にある4世紀の写本から訳した。初版には外典が含まれていなかったが、1851年版がそれを加え、このコピーが再現しているのはその1851年の本文である。バグスターのギリシャ語・英語対訳版はギリシャ語を英語の横に組み、そのギリシャ語はこのコーパスに独立した版として入っている。英語がギリシャ語に従っているので、ギリシャ語の読むとおりに読む。詩編はギリシャ語の番号づけを保ち、ここでの詩編22は羊飼いの詩編である。またイザヤ書7:14 の「a virgin shall conceive」は、ヘブライ語の ʿalmah ではなく、ギリシャ語の parthenos を訳している。
hero.3=このリーダーにおいて、これはただ一つの、文字どおりの親本をもつ段である。その下にあるギリシャ語七十人訳は、ブレントンが訳したまさにその本文であり、彼自身の出版社が彼の英語と並べて印刷したものだ。その節の一つの下で段を開けばギリシャ語が現れ、さらにその下に原語の床としてレニングラード写本がある。このコーパスで、逆にこの版の上に立つものはない。私たちのコピーは書物そのものより狭い。37書を収め、それはヘブライ語正典にも通常の名前で含まれる書である。取得元である eBible.org のファイルには外典——トビト記、ユディト記、知恵の書、シラ書、バルク書、マカバイ記4書など——も入っており、エステル記とダニエル書はより長いギリシャ語の形でのみ収められている。そのどれもコーパスには取り込まれなかったため、ここにはエステル記もダニエル書もなく、下のギリシャ語にトビト記や知恵の書がある箇所では、その上に英語はない。エズラ記とネヘミヤ記は2書として立っているが、下のギリシャ語では1書である。同じ翻訳の綴りを改めた版、アダム・ボイドによる2020年の Updated Brenton が、独立した版としてこのコーパスに入っている。

