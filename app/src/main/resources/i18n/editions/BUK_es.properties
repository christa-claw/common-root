title=Sahih al-Bukhari — Acerca de esta edición | Common Root
description=Sahih al-Bukhari: la colección de hadices que el islam suní sitúa en segundo lugar de autoridad solo después del Corán, reunida por Muhammad al-Bukhari entre unos 600.000 relatos que examinó, admitiendo únicamente los que llevaban una cadena ininterrumpida de transmisores fiables.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismail al-Bukhari reunió esta colección sobre todo en dos mezquitas —la Mezquita Sagrada de Meca y la Mezquita del Profeta en Medina— y la terminó en su ciudad natal, Bujará, hacia el año 232 d. H. (846 d. C.); dedicó aproximadamente las dos últimas décadas de su vida a revisarla más mientras viajaba. Su título completo, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, suele abreviarse como Sahih al-Bukhari: «la [colección] fidedigna de al-Bukhari». Se dice que el propio al-Bukhari afirmó haberla seleccionado entre unos 600.000 relatos de hadices que había examinado, admitiendo un relato solo cuando, a su juicio, llevaba una cadena ininterrumpida de transmisores fiables hasta su fuente original.
hero.2=Esa exigencia explica el peso que tiene la obra. Sahih al-Bukhari se cuenta como el primero de los Seis Libros del islam suní (Kutub al-Sitta), y junto con Sahih Muslim —su rival más cercano en método y reputación— a los dos se les llama los Sahihayn, «los dos fidedignos». La mayoría de los eruditos suníes sitúan la colección de al-Bukhari por encima de cualquier otro libro de hadices y, en autoridad, inmediatamente después del propio Corán, aunque una minoría ha defendido en cambio la precedencia de Sahih Muslim. El material está organizado por temas y no por transmisor o cronología (lo que los eruditos llaman un musannaf), dividido en libros (kutub) que van desde la purificación ritual y la oración hasta el comercio, el matrimonio, la vida de profetas anteriores y las señales de la Última Hora.
hero.3=Cuántos hadices contiene realmente el libro depende de qué tradición impresa esté contando. La cifra más citada hoy, 7.563, procede de la numeración que el editor Muhammad Fu'ad Abd al-Baqi dio al texto en el siglo XX, y cuenta de nuevo un hadiz cada vez que se repite bajo otro capítulo; eliminadas las repeticiones, Ibn Hajar al-Asqalani contó 2.602. Otros eruditos han propuesto además otras cifras totales. La cifra propia de este corpus es, a su vez, una tercera: 98 libros y 7.589 hadices numerados, que es sencillamente la forma de la edición digital de la que procede, no una pretensión de reproducir con exactitud ninguna numeración impresa concreta.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-bukhari de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=árabe clásico, con una traducción al inglés debajo de cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Muhammad ibn Ismail al-Bukhari (194–256 d. H. / 810–870 d. C.)
fact.3.label=Título completo
fact.3.value=al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi — abreviado habitualmente como Sahih al-Bukhari
fact.4.label=Compilado
fact.4.value=sobre todo en la Mezquita Sagrada de Meca y la Mezquita del Profeta en Medina; terminado en Bujará hacia el año 232 d. H. (846 d. C.)
fact.5.label=Método
fact.5.value=admite un hadiz solo con una cadena ininterrumpida de transmisores que al-Bukhari consideraba fiables; se dice que seleccionó la colección entre unos 600.000 relatos que había examinado
fact.6.label=Posición
fact.6.value=el primero de los Seis Libros del islam suní (Kutub al-Sitta); junto con [[MUS|Sahih Muslim]] forma «los Sahihayn», las dos colecciones situadas en autoridad inmediatamente después del Corán
fact.7.label=Número de hadices
fact.7.value=7.563 con repeticiones según la numeración de Abd al-Baqi, muy extendida, o 2.602 sin repetición según el recuento de Ibn Hajar al-Asqalani; las ediciones impresas difieren tanto en la numeración de capítulos como en la de hadices
fact.8.label=En este corpus
fact.8.value=98 libros (kutub) y 7.589 hadices numerados —la forma propia del conjunto de datos de origen, no una reproducción de ninguna numeración impresa concreta
fact.9.label=Traducción al inglés
fact.9.value=tomada de la edición eng-bukhari de fawazahmed0/hadith-api, mostrada como acompañamiento bajo el árabe; de qué traducción publicada procede aún no se ha determinado por parte de este corpus
fact.10.label=Licencia
fact.10.value=el matn árabe es el texto clásico de dominio público; la licencia de la traducción al inglés sigue en revisión
