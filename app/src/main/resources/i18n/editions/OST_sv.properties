# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald föddes i Neuchâtel 1663 och dog där 1747. Han prästvigdes i sin hemstad 1683 och tjänade större delen av sitt liv i dess kyrka, först som diakon och från 1699 som pastor, och föreläste dessutom i teologi. Hans bibel är ingen ny översättning från hebreiskan och grekiskan utan en revision av den franska protestantiska bibeln från Genève, den version som de fransktalande reformerta församlingarna hade läst sedan femtonhundratalet. Ostervalds reviderade text gavs ut första gången 1744, tre år före hans död, och den trycktes om och reviderades i mer än två sekler; den var också välkänd i Storbritannien.
hero.2=Ordalydelsen i detta korpus är inte 1744 års franska. Sjuttonhundratalet skrev ”étoit” där modern franska skriver ”était”; denna kopia har ”était” genomgående och ”étoit” inte en enda gång, så den kommer från någon av de senare revisioner som behöll Ostervalds namn. Den mest kända är den revision som Société biblique de France gav ut 1881, med Nya testamentet utfört av Ch. L. Frossard, och den texten uppdaterades så sent som 1996. eBible.org, källan till denna kopia, nämner bara ”Ostervald” och inte revisionen, så inte heller denna sida namnger någon. Några drag syns på nästan varje sida. Gudsnamnet är ”l'Éternel”, den Evige, som hos Segond och i den franska Darby: ”L'Éternel est mon berger; je n'aurai point de disette” i Psaltaren 23. Jesaja 7:14 behåller ”la vierge sera enceinte” — jungfrun — där Segond har den unga kvinnan. Och Nya testamentet behåller läsarter ur Textus Receptus som kritiska utgåvor stryker: 1 Joh 5:7 har de tre himmelska vittnena, ”le Père, la Parole, et le Saint-Esprit”, som Segond bredvid saknar.
hero.3=I denna läsare är den en av tre franska biblar, bredvid Segond och den franska Darby. Ett franskt gränssnitt öppnar inte på den: franskan har inget kurerat val, så läsaren tar den första franska bibeln i katalogordning, och det är Darby. I härstamningens stegpinnar har den ingen registrerad förlaga — Genèvebibeln som den reviderar finns inte i detta korpus — så en stegpinne under en vers faller rakt ned till det ≈-markerade originalspråksgolvet: för Gamla testamentet Leningradkodexen och för Nya Textus Receptus, den grekiska tradition som denna bibel faktiskt följer. Dess stegpinne bär året 1744, året för Ostervalds egen revision och inte för den ordalydelse som visas. Lägg den bredvid Segond för att se två sekler av franskt protestantiskt bibelspråk sida vid sida.

