title=Ostervaldbibeln (franska) — Om denna utgåva | Common Root
description=Ostervaldbibeln: en neuchâtelsk pastors revision av den franska protestantiska bibeln från Genève, första gången utgiven 1744, här i en senare revision med modern fransk stavning.
heroHeading=Ostervaldbibeln
