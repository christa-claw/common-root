title=Sahih Muslim — Tietoja tästä laitoksesta | Common Root
description=Sahih Muslim: muodostaa yhdessä Sahih al-Bukharin kanssa Sahihaynin, kaksi kokoelmaa, jotka sunni-islam asettaa arvovallassa heti Koraanin jälkeen; Muslim ibn al-Hajjaj kokosi sen Arabian niemimaalta, Egyptistä, Irakista ja Syyriasta kerätyistä hadith-kertomuksista, hyväksyen mukaan vain ne, joilla oli katkeamaton ketju luotettavia välittäjiä.
heroHeading=Sahih Muslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi syntyi Nishapurissa, abbasidien Khorasanin maakunnassa (nykyisen Iranin koillisosassa); lähteet eroavat syntymävuodesta, antaen 202, 204 tai 206 AH (noin 817–822 jaa.). Hän matkusti Arabian niemimaalla, Egyptissä, Irakissa ja Syyriassa kerätäkseen hadithia oppineilta joka paikassa, ja asettui sitten takaisin kotikaupunkiinsa, missä hän tapasi al-Bukharin, opiskeli hänen johdollaan ja pysyi hänen ystävänään loppuelämänsä. Al-Khatib al-Baghdadin mukaan hän ryhtyi teokseen oppilaansa, Ahmad ibn Salama al-Naysaburin, pyynnöstä; sen alkuperäinen nimi, al-Musnad al-Sahih al-Mukhtasar, lyhennetään tavallisesti, kuten al-Bukharinkin, Sahih Muslimiksi. Hän kuoli Nishapurissa vuonna 261 AH (875 jaa.) ja haudattiin sen esikaupunkiin Nasarabadiin.
hero.2=Hän hyväksyi hadithin vain, kun sen välitysketju oli katkeamaton Muhammadin sahabaan asti ja kulki joka lenkissä vähintään kahden luotettavan välittäjän kautta; hän jaotteli välittäjät kolmeen tasoon muistin ja luonteen mukaan ja jätti pois ne, joiden rehellisyys oli kyseenalaistettu. Hänen selittäjänsä al-Nawawi nosti esiin erään lisähuolellisuuden: Muslim, hän kirjoitti, sijoittaa kunkin hadithin yhteen sopivaan paikkaan kaikkien sen ketjujen ja sanamuotovarianttien kanssa sen sijaan, että ne näkyisivät hajallaan — esitystapa, jota myöhemmät selittäjät ovat verranneet [[BUK|Sahih al-Bukharin]] tapaan sijoittaa hadithin eri sanamuodot erikseen, aina sen luvun alle, jonka asiaa sanamuoto valaisee.
hero.3=Se, montako hadithia kirja todella sisältää, riippuu, kuten [[BUK|Sahih al-Bukharin]] kohdalla, siitä, kuka laskee ja miten toistoja käsitellään. Kâtip Çelebi ja Siddiq Hasan Khan päätyivät molemmat lukuun 7 275; Muhammad Fu'ad Abd al-Baqi, laskien toistoitta, lukuun 3 033; Mashhur ibn Hasan Al Salman lukuun 7 385, tai 7 395 lisäämällä Muslimin oman johdannon kymmenen hadithia; muut arviot sijoittavat kokonaismäärän johonkin noin 5 500 ja 7 500 välille. Al-Jawzaqi laski 2 326 hadithia, jotka ovat jaettuja, lähes sanasta sanaan, Sahih al-Bukharin kanssa. Tämän aineiston oma luku on jälleen toinen: 57 kirjaa ja 7 563 numeroitua hadithia, joka on yksinkertaisesti sen digitaalisen laitoksen muoto, josta se on peräisin, ei väite minkään yksittäisen painetun numeroinnin toistamisesta.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä. Sen alla lukijassa on englanninkielinen käännös, otettu fawazahmed0/hadith-api:n eng-muslim-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää [[BUK|Sahih al-Bukharin]] ja Koraani-käännöstensä kohdalla. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=klassista arabiaa, englanninkielinen käännös näkyy lukijassa jokaisen hadithin alla
fact.2.label=Kokoaja
fact.2.value=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi (s. 202–206 AH / n. 817–822 jaa. – k. 261 AH / 875 jaa.)
fact.3.label=Täydellinen nimi
fact.3.value=al-Musnad al-Sahih al-Mukhtasar — lyhennetään tavallisesti Sahih Muslimiksi
fact.4.label=Koottu
fact.4.value=hadithia kerätty Arabian niemimaalla, Egyptissä, Irakissa ja Syyriassa; teos itse valmistui Nishapurissa, Khorasanissa, oppilaan pyynnöstä
fact.5.label=Menetelmä
fact.5.value=hyväksyy hadithin vain katkeamattomalla, vähintään kahden luotettavan välittäjän ketjulla joka lenkissä Muhammadin sahabaan asti; välittäjät jaoteltu kolmeen luotettavuustasoon, kyseenalaisen rehellisyyden omaavat suljettu pois
fact.6.label=Asema
fact.6.value=toinen sunni-islamin Kuudesta kirjasta (Kutub al-Sittah); yhdessä [[BUK|Sahih al-Bukharin]] kanssa muodostaa "Sahihaynin" — kaksi kokoelmaa, joita pidetään arvovaltaisimpina heti Koraanin jälkeen; useimmat oppineet asettavat al-Bukharin kokoelman kokonaisuutena tämän edelle
fact.7.label=Hadith-määrä
fact.7.value=luvut vaihtelevat 3 033:sta toistoitta (Abd al-Baqi) 7 275–7 395:een toistoineen, laskutavasta riippuen; painetut laitokset eroavat sekä luku- että hadith-numeroinnissa
fact.8.label=Tässä aineistossa
fact.8.value=57 kirjaa ja 7 563 numeroitua hadithia — lähdeaineiston oman muodon mukaisesti, ei minkään yksittäisen painetun numeroinnin toistona
fact.9.label=Englanninkielinen käännös
fact.9.value=otettu fawazahmed0/hadith-api:n eng-muslim-laitoksesta, näytetään arabiankielisen tekstin rinnalla; mistä painetusta käännöksestä se on peräisin, ei ole tämän aineiston puolesta vielä vahvistettu
fact.10.label=Käyttöoikeus
fact.10.value=arabiankielinen matn on klassinen, vapaasti käytettävä teksti; englanninkielisen käännöksen käyttöoikeus on edelleen tarkistuksessa
