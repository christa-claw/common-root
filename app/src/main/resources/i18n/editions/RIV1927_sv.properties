title=Riveduta 1927 (italienska) — Om denna utgåva | Common Root
description=Riveduta: Giovanni Diodatis italienska bibel reviderad mot hebreiskan och grekiskan av en kommitté under den valdensiske teologen Giovanni Luzzi, utgiven i Rom 1924 av Brittiska och utländska bibelsällskapet — och varför filen säger 1927.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi föddes 1856 i Nedre Engadin, i den schweiziska kantonen Graubünden, och kom som spädbarn till Lucca när familjen utvandrade dit året därpå. Han växte upp som italienare, studerade vid den valdensiska teologiska fakulteten i Florens — skolan för Italiens gamla protestantiska kyrka — och kom sedan att undervisa i teologi där och tjäna som pastor i staden. Sina sista år tillbringade han åter i Schweiz, i Poschiavo, och där dog han 1948.
hero.2=Riveduta började 1906, när Brittiska och utländska bibelsällskapet, som redan i ett sekel hade tryckt Diodatis översättning från sextonhundratalet för italienska läsare, satte en grupp att revidera den, med Luzzi i spetsen. Han hade hoppats göra den till en gemensam bibel med katolska forskare; Vatikanen avböjde, och arbetet fortsatte som en protestantisk revision. Hela bibeln utkom i Rom 1924 och beskrevs på titelbladet som en version reviderad mot grundtexten — ”riveduta”, reviderad, och så har den hetat sedan dess. Det är ingen ny översättning: under den ligger Diodatis text, granskad på nytt mot hebreiskan och grekiskan. Den blev de italienska protestanternas bibel under större delen av nittonhundratalet, och dess efterföljare, Nuova Riveduta, gavs ut av Genèves bibelsällskap 1994. Luzzi gjorde också en egen översättning, kommenterad, i tolv band utgivna i Florens från 1921; det är ett annat verk och inte denna text.
hero.3=Revisionen syns på sidan. Gudsnamnet i Gamla testamentet är ”l'Eterno”, den Evige — ”L'Eterno è il mio pastore” i Psalm 23 — där Diodati har ”il Signore”. Jesaja 7:14 lyder ”la giovane”, den unga kvinnan, där Diodati har ”la Vergine”. I Nya testamentet lämnar den Textus Receptus där de senare kritiska utgåvorna gör det: 1 Joh 5:7 saknar de himmelska vittnena, Herrens bön i Matteus 6:13 slutar utan lovprisningen, och Apostlagärningarna 8:37 är kvar men inom hakparentes. Psaltaren följer den hebreiska numreringen, och en psalms överskrift är inbakad i dess första vers — Psalm 23 börjar ”Salmo di Davide.” — så Psalm 51 har 19 verser, som i engelska biblar. Och årtalet: 1927 är året som den digitala texten bär och som katalogen lagrar, så dess stegpinne visar 1927. Själva Riveduta utkom 1924, och vilken senare tryckning filen återger är inget som detta projekt har fastställt.
hero.4=I denna läsare är den en av tre italienska biblar, bredvid två exemplar av Diodati. Ett italienskt gränssnitt öppnar inte på den: italienskan har inget kurerat val, så läsaren tar den första italienska bibeln i katalogordning, som är Diodati 1649. Ingen förlaga är registrerad för den i härstamningens stegpinnar — inte ens Diodati, fast Riveduta är en revision av Diodati och Diodati finns i korpuset — så en stegpinne som öppnas under en vers faller rakt ner till grundspråksgolvet märkt med ≈: Westminster Leningradkodexen för Gamla testamentet, och för Nya Textus Receptus, just den grekiska som denna revision lämnade.

