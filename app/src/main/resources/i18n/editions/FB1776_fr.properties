title=Biblia 1776 — À propos de cette édition | Common Root
description=Biblia 1776 : la Bible d'église finlandaise pendant un siècle et demi, la première imprimée pour la lecture à la maison, et encore le livre que le finnois désigne quand il dit « Biblia ».
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=Avec nos remerciements à celles et ceux qui ont envoyé des corrections à cette page.

# The narrative, one paragraph per key, in order.
hero.1=La troisième Bible de Finlande, et celle qui s'est fixée. C'est une révision et non une traduction nouvelle : la ligne remonte, par la révision de Florinus de 1683–85, jusqu'à la Biblia de 1642, la première Bible finnoise complète. La révision est l'œuvre d'Anders (Antti) Lizelius, qui avait déjà procuré une édition de la Bible en 1758. Ce que l'édition de 1776 a changé, c'est l'orthographe et, avec elle, la portée. Ce fut la première Bible finnoise dans une orthographe modernisée et la première imprimée pour l'usage domestique et non pour le seul lutrin. Une Bible qu'une famille peut posséder est un autre objet qu'une Bible que possède une paroisse. Les éditions intermédiaires ne relevaient pas de la seule orthographe. Henrik Florinus, prévôt de Paimio, qui prépara celle de 1685, savait l'hébreu et le grec et corrigea le fond autant que la langue — la formulation bougea plus que la graphie — et l'on tient les éditions intermédiaires pour avoir traduit aussi depuis les langues originales, et non pour avoir seulement rangé 1642. Qui compare 1642 et 1776 regarde par-dessus deux révisions, non par-dessus un changement de graphie.
hero.2=Elle a tenu l'usage de l'Église un siècle et demi, jusqu'à ce que la Kirkkoraamattu 1933/38 la remplace, et on n'a pas cessé de la lire quand elle a cessé d'être officielle. Deux mouvements de réveil au sein de l'Église évangélique luthérienne de Finlande, les laestadiens et les rukoilevaiset, l'ont gardée et s'en servent encore. C'est pourquoi le seul mot Biblia, en finnois, désigne ce livre-ci et non une édition plus ancienne ou plus récente, et pourquoi on l'appelle aussi Vanha kirkkoraamattu, la vieille Bible d'église.
hero.3=Dans ce lecteur, elle est le milieu de la chaîne finnoise. Ouvrez un échelon sous un verset de la Kirkkoraamattu 1933/38 et cette édition paraît ; ouvrez-en un sous celle-ci et la Biblia de 1642 paraît. Les deux échelons se lisent toutefois différemment. Les traducteurs de 1933/38 travaillaient sur l'hébreu et le grec : l'échelon du dessus est donc une succession à l'intérieur de la Bible d'une même Église, non une dérivation. Celui du dessous est une filiation réelle : 1776 est une révision de 1642, et les mots de part et d'autre de ce pas sont faits pour être comparés.
hero.4=Une réserve sur le texte présenté ici : ce n'est pas l'impression de 1776. Ce que l'on lit descend d'un texte numérique du domaine public dont l'orthographe a été normalisée par une main postérieure et dont l'histoire éditoriale n'est pas consignée — sur ses 31 102 versets, un seul contient la lettre w, là où la Biblia de 1642 en compte 26 862, et le w pour v est la marque la plus nette de l'orthographe dans laquelle 1776 fut imprimée. 1776 a donc modernisé la graphie de 1642, et ce texte a été modernisé une seconde fois depuis, ce qui l'éloigne du livre imprimé plus que 1776 ne l'était de 1642. Deux spécialistes du vieux finnois littéraire ont demandé de quelle version il s'agissait avant toute autre question, et la question était la bonne. L'impression de 1776 subsiste sous forme d'images de pages dans la collection de l'époque suédoise de la Bibliothèque nationale de Finlande ; y substituer un texte fidèle est un travail que nous aimerions faire.

