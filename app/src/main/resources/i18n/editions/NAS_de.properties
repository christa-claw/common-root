title=Sunan an-Nasa'i — Über diese Ausgabe | Common Root
description=Sunan an-Nasa'i: die Hadith-Sammlung, die Ahmad ibn Shu'ayb al-Nasa'i aus seinem umfangreicheren Werk, dem Sunan al-Kubra, herauszog und die von Ibn Hajar als jene der Sechs Bücher ausgezeichnet wurde, die nach den beiden Sahihs die wenigsten schwachen Hadithe enthält.
heroHeading=Sunan an-Nasa'i
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali al-Nasa'i wurde um das Jahr 214–215 n. H. (829–830 n. Chr.) in Nasa geboren, einer Stadt Khorasans, die heute in Turkmenistan liegt. Er begann im Alter von etwa fünfzehn Jahren, auf der Suche nach Hadithen zu reisen, und studierte zunächst bei Qutaybah ibn Sa'id — bei dem er über ein Jahr in Baghlan verbrachte — bevor er weiter durch den Irak, den Hijaz, Syrien und Ägypten zog, wo er bei Gelehrten wie Ishaq ibn Rahwayh und Abu Dawud al-Sijistani, dem Zusammensteller des [[ABD|Sunan Abi Dawud]], studierte. Er ließ sich in Ägypten nieder, lehrte dort und wurde als Hafiz al-Hadith bekannt; spätere Biographen sind sich uneinig, ob er je direkt bei Muhammad al-Bukhari studierte, da al-Mizzi behauptete, die beiden hätten sich nie getroffen. Auf einer Reise von Kairo nach Mekka im hohen Alter machte er in Damaskus halt, wo, der traditionellen Überlieferung zufolge, ein von ihm gehaltener Vortrag über die Tugenden der Gefährten des Propheten inmitten der anti-alidischen Stimmung der Stadt eine feindliche Menge aufbrachte; er starb kurz darauf, im Jahr 303 n. H. (915 n. Chr.), an den dort erlittenen Verletzungen. Die Berichte über seinen Begräbnisort gehen auseinander — zwischen Safa und Marwa in Mekka nach einer Überlieferung, oder in Ramla in Palästina nach einer anderen.
hero.2=Von den rund fünfzehn ihm zugeschriebenen Werken betreffen sechs den Hadith. Das umfangreichste davon, den Sunan al-Kubra, zog er später selbst zu einer kürzeren Auswahl zusammen, bekannt als Sunan al-Sughra ("der kleinere Sunan") oder al-Mujtaba ("das Ausgewählte") — jenes Werk, das heute mit dem schlichten Titel Sunan an-Nasa'i gemeint ist. Wer genau diese Auswahl traf und auf wessen Wunsch, ist in den für diese Seite herangezogenen Quellen nicht verzeichnet. Darin ordnete al-Nasa'i die Hadithe nach Rechtsthema, wie es auch [[ABD|Abu Dawud]] und [[TIR|at-Tirmidhi]] taten. Der Rechtsgelehrte Ibn Hajar al-Asqalani zeichnete es später dadurch aus, dass es nach den beiden Sahihs die wenigsten schwachen (da'if) Hadithe und unzuverlässigen Überlieferer der Sechs Bücher enthält und überhaupt keine gefälschten (mawdu') Hadithe.
hero.3=Die sunnitische Tradition zählt Sunan an-Nasa'i zu den Sechs Büchern (Kutub al-Sittah), zusammen mit [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]] und [[TIR|Jami` at-Tirmidhi]], sowie einem sechsten Buch, das zwischen Sunan Ibn Majah und anderen Kandidaten umstritten ist. Wo genau es unter den vier Sunan-Sammlungen einzuordnen ist, wird diskutiert, ohne entschieden zu sein: Manche Quellen nennen es das drittangesehenste der sechs, gleich nach den beiden Sahihs, während die eigenen Seiten dieses Korpus zu [[ABD|Sunan Abi Dawud]] und [[TIR|Jami` at-Tirmidhi]] die gebräuchlichere Reihenfolge wiedergeben, die Abu Dawuds Buch an die dritte Stelle setzt. Die für es angegebene Hadith-Zahl schwankt in ähnlicher Weise: 5.758, einschließlich wiederholter Überlieferungen, nach einer häufig zitierten Zahl für das al-Mujtaba, gegenüber 5.765 in der Ausgabe, aus der dieses Korpus schöpft — die Quellen bringen diese beiden Zahlen nicht in Einklang.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen der eng-nasai-Ausgabe der fawazahmed0/hadith-api und Hadith für Hadith mit dem Arabischen abgeglichen, sodass beide als Paar gelesen werden können — dieselbe Begleit-Anordnung, die dieses Korpus für [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]] und seine Koran-Übersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist von Seiten dieses Korpus noch nicht geklärt, weshalb ihre Lizenz als in Prüfung und nicht schlicht als gemeinfrei vermerkt ist; das Arabische darüber trägt keine solche Unsicherheit.

