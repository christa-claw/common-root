fact.1.label=Sprache
fact.1.value=klassisches Arabisch, mit einer englischen Übersetzung unter jedem Hadith im Reader
fact.2.label=Zusammengestellt von
fact.2.value=Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i (215–303 n. H. / 830–915 n. Chr.)
fact.3.label=Titel
fact.3.value=bekannt als Sunan an-Nasa'i, Sunan al-Sughra ("der kleinere Sunan") oder al-Mujtaba ("das Ausgewählte") — eine spätere Auswahl aus al-Nasa'is eigenem umfangreicherem Werk, dem Sunan al-Kubra
fact.4.label=Zusammengestellt
fact.4.value=gesammelt auf Reisen durch den Irak, den Hijaz, Syrien und Ägypten, die im Alter von etwa fünfzehn Jahren begannen; al-Nasa'i ließ sich in Ägypten nieder und starb im Jahr 303 n. H. (915 n. Chr.) in Damaskus
fact.5.label=Methode
fact.5.value=nach Rechtsthema geordnet, wie [[ABD|Sunan Abi Dawud]] und [[TIR|Jami` at-Tirmidhi]]; aus al-Nasa'is umfangreicherem Sunan al-Kubra durch ein Verfahren herausgezogen, das die hier herangezogenen Quellen nicht verzeichnen
fact.6.label=Stellung
fact.6.value=zählt zu den Sechs Büchern des sunnitischen Islam (Kutub al-Sittah); manche Quellen setzen es an dritte Stelle, nach [[BUK|Sahih al-Bukhari]] und [[MUS|Sahih Muslim]], während die Seiten dieses Korpus zu [[ABD|Sunan Abi Dawud]] und [[TIR|Jami` at-Tirmidhi]] die gebräuchlichere Reihenfolge wiedergeben, die Abu Dawuds Buch an die dritte Stelle setzt — der genaue Rang ist umstritten und nicht entschieden
fact.7.label=Hadith-Anzahl
fact.7.value=5.758, einschließlich wiederholter Überlieferungen, nach einer häufig zitierten Zahl für das al-Mujtaba; die Quellenausgabe dieses Korpus zählt 5.765 — die Quellen bringen diese beiden Zahlen nicht in Einklang
fact.8.label=In diesem Korpus
fact.8.value=52 Bücher und 5.765 numerierte Hadithe
fact.9.label=Englische Übersetzung
fact.9.value=entnommen der eng-nasai-Ausgabe der fawazahmed0/hadith-api, als Begleittext unter dem Arabischen gezeigt; von welcher veröffentlichten Übersetzung sie abstammt, ist von Seiten dieses Korpus noch nicht geklärt
fact.10.label=Lizenz
fact.10.value=der arabische Matn ist der klassische, gemeinfreie Text; die Lizenz der englischen Übersetzung ist noch in Prüfung
