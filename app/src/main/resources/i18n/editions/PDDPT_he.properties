title=Palabra de Dios para Ti — על מהדורה זו | Common Root
description=Palabra de Dios para Ti: תרגום לספרדית שפרסמה Asociación Bíblica Latinoamericana בשנת 2020, השומר על שמות האל העבריים בתעתיק, ומוענק ברישיון חופשי לכל שימוש.
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — "דבר האלוהים אליך" — הוא תרגום חדש לספרדית, שפרסמה בשנת 2020 Asociación Bíblica Latinoamericana; נוסח אלקטרוני יצא בשנת 2022 באמצעות Latinamerican Textual Bible Foundation, Inc., עמותה רשומה בפלורידה המפיצה אותו ב-eBible.org וב-YouVersion. התרגום מיוחס למתרגמים פרנסיסקו ליבאנו וג'ויס ליבאנו. בניגוד לקו ריינה-ולרה, שבו פותח כברירת מחדל הממשק הספרדי של אוסף זה, זהו אינו עיבוד של תרגומו של קסיודורו דה ריינה מהמאה השש-עשרה ולא של דבר הנובע ממנו; זהו תרגום עצמאי, שנעשה ישירות מלשונות המקור, המיועד לקוראים רגילים ברחבי אמריקה דוברת הספרדית, ומיועד להיות מצוטט בחופשיות וללא בקשת רשות.
hero.2=הברית הישנה הולכת בעקבות Biblia Hebraica Stuttgartensia, והברית החדשה בעקבות המהדורה ה-27 של Novum Testamentum Graece מאת אברהרד נסטלה. בחירה אחת מייחדת את דפיה מרוב כתבי הקודש הספרדיים שלאחר ריינה: במקום לתרגם את השם המפורש כ"Jehová" או להחליפו ב"Señor", שומרת Palabra de Dios para Ti על השמות העבריים עצמם, בתעתיק — Yavé, ʼElohim, ʼEL-Shadday — כך שספר בראשית נפתח, במילותיה שלה, "En un principio ʼElohim creó los cielos y la tierra".
hero.3=בקורא הזה זו אחת מארבע מהדורות ספרדיות, לצד [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] ו-[[VBL|Versión Biblia Libre]]. הממשק עדיין פותח כברירת מחדל בריינה-ולרה 1909; זו מהדורה שמגיעים אליה מכרטיסה שלה. כמו שתי האחרות, זהו תרגום חדש ולא עיבוד של דבר אחר שהאוסף מחזיק, כך שלא נרשם לה מקור בשלבי השושלת — שלב הנפתח מתחת לאחד מפסוקיה צונח היישר אל רצפת לשונות המקור המסומנת ב-≈. Asociación Bíblica Latinoamericana מוציאה לאור גם מהדורה מודפסת שלמה יותר הכוללת את הספרים החיצוניים; הנוסח שמחזיק אוסף זה הוא הקאנון הפרוטסטנטי הרגיל של שישים ושישה ספרים.

