title=ブレントン版ギリシャ語七十人訳 — この版について | Common Root
description=七十人訳聖書——ユダヤ人ディアスポラと初期教会のギリシャ語旧約聖書——を、ランスロット・ブレントンが1851年に自身の英訳と並べて印刷したギリシャ語本文で収める。このリーダーではウルガータとロシア語シノド訳の下の段にあたる。
heroHeading=ブレントン版ギリシャ語七十人訳
readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=七十人訳はヘブライ語聖書の最古の翻訳であり、キリスト教の最初の数世紀には、それがそのまま聖書だった。アレクサンドリアのギリシャ語を話すユダヤ人が律法の五書から訳し始めたのはおそらく紀元前3世紀のことで、その他の書は続く2世紀のあいだに訳された。名称はある物語に由来する。『アリステアスの手紙』は、王プトレマイオス2世のために律法を訳すべくエルサレムから72人の長老が遣わされたと語り、「七十人」——ローマ数字で LXX——がギリシャ語旧約聖書全体の名となった。新約聖書の著者たちは絶えずこれを引用し、初期教会はこれを読み、正教会は今もこれを自らの旧約聖書として読んでいる。
hero.2=その意義は古さだけにとどまらない。訳者たちが拠ったヘブライ語写本は、のちに標準となったマソラ本文と所々で異なっていた——たとえばエレミヤ書はギリシャ語のほうが明らかに短い——ため、多くの箇所で七十人訳は、ヘブライ語の伝統そのものが保たなかったヘブライ語の読みを伝える最古の証言となっている。またヘブライ語正典にない書も含み、そのなかにはトビト記、ユディト記、知恵の書、シラ書、バルク書がある。そして訳語の選択のいくつかは教義となった。イザヤ書7章14節で、ヘブライ語が ʿalmah（若い女）とするところを、ギリシャ語は parthenos（おとめ）とし、マタイが引用するのはこの語である。
hero.3=ここにあるギリシャ語本文は、サー・ランスロット・ブレントンが印刷したものである。彼は1844年に七十人訳の英訳を出版した。それは主にヴァティカン写本——ヴァティカン図書館に所蔵される4世紀の写本——に拠っていた。1851年、ロンドンのサミュエル・バグスターがこれを再刊し、外典を加え、ギリシャ語を英語と並べて組んだ。このコーパスが収めるのはそのギリシャ語である。詩編はギリシャ語の番号づけを保っており、ここにあるウルガータも同じ番号づけをとる。どちらでも詩編22は羊飼いの詩編で、ヘブライ語本文や多くの英語聖書では詩編23にあたる。詩編は151編あり、エズラ記とネヘミヤ記は一つの書となり、エステル記とダニエル書はより長いギリシャ語の形で収められている。
hero.4=このリーダーでは、これは床ではなく段である。ラテン語ウルガータの下にあるのは、ウルガータの一部がギリシャ語を経て来たからである。その詩編はヒエロニムスがオリゲネスの『ヘクサプラ』のギリシャ語から訳したもので、彼自身のヘブライ語からの訳に取って代わられることはなかった。また知恵の書、シラ書、バルク書は、ギリシャ語から訳された古ラテン語訳のまま残された。ロシア語シノド訳の下にもある。シノド訳の旧約は、その背後にある教会スラヴ語聖書から七十人訳の読みを数多く保っている。そしてブレントン自身の英訳の下にもある。それ自体には記録された親本はない。それが訳されたヘブライ語本文はコーパスになく、1000年以上も新しくマソラの系統に属するレニングラード写本は、その下に原語の床として現れるにすぎない。旧約聖書のみなので、新約聖書の節の下ではこの段は飛ばされる——またギリシャ語の伝統のすべての書がここにあるわけではない。この写しは45書で、マカバイ記は一つも含まない。

