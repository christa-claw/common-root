title=Sünen-i Ebu Davud — Bu Baskı Hakkında | Common Root
description=Sünen-i Ebu Davud: Ebu Davud es-Sicistani'nin İslam hukukuyla ilgisi nedeniyle derlediği, incelediği yaklaşık 500.000 rivayet arasından seçilip hukuki konuya göre düzenlenen hadis derlemesi — Sünni İslam'ın Altı Kitabı'ndan üçüncüsü.
heroHeading=Sünen-i Ebu Davud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Ebu Davud Süleyman bin el-Eş'as el-Ezdi es-Sicistani, hicri 202 (miladi 817–818) yılı civarında, bugün İran–Afganistan sınırında yer alan Horasan eyaleti Sicistan'da doğdu. On sekiz yaşında Bağdat'a ulaştı ve ardından hadis aramak için Horasan, Irak, Hicaz, Suriye, Mısır ve Nişabur üzerinden seyahat etti; aralarında Ahmed bin Hanbel'in de bulunduğu yaklaşık 300 âlimden ders aldı. Basra'ya yerleşti ve burada hicri 275 (miladi 889) yılının şevval ayında bir cuma günü yetmiş üç yaşında vefat ederek fakih Süfyan es-Sevri'nin yanına gömüldü.
hero.2=İlgisi özellikle hukukiydi: inanç, tarih ve hukuku eşit ölçüde kapsayan Sahih al-Buhari ve Sahih-i Müslim'den farklı olarak, Ebu Davud Sünenini fıkıhla ilgili hadisler üzerine kurdu ve onu bir fakihin gereksinim duyduğu konulardan geçen kitaplara böldü — temizlik, namaz, zekât, oruç, evlilik, miras, kadılık ve diğerleri. Öğrencisi İbn Dase'ye göre, malzemeyi toplarken yaklaşık 500.000 hadis rivayetini inceledi. El-Buhari ve Müslim'den farklı bir ölçüt de belirledi: onlar yalnızca tam olarak sahih saydıkları hadisleri kabul ederken, Ebu Davud belirli bir hukuki noktayı ele alan daha güçlü bir hadis bulunmadığında bazı mürsel, zayıf (zaif) ve hatta münker rivayetleri de dahil etti; yöntemini Mekke halkına yazdığı bir mektupta açıkladı ve daha zayıf değerlendirmeleri işaretsiz bırakmak yerine kendisi belirtti.
hero.3=Sünni gelenek, Sünen-i Ebu Davud'u Sahih al-Buhari ve Sahih-i Müslim'den sonra Altı Kitap arasında üçüncü sayar; onun, Câmiu't-Tirmizî, Sünen-i Nesâî ve Sünen-i İbn Mâce ile birlikte kalan dört kitap arasında birbirine göre tam olarak nerede durduğu uzun zamandır tartışılmış, ancak çözülmemiştir. Kitap için verilen rakamlar, kimsenin açıklığa kavuşturmuş gibi görünmediği bir şekilde birbiriyle uyuşmaz: İbn Dase'nin Ebu Davud'un seçtiklerine verdiği rakam 4.800 hadistir, modern standart baskı ise — Muhammad Muhyiddin Abdülhamid tarafından hazırlanıp 1935'te Kahire'de basılmış — 5.274 olarak numaralandırır. Bu derlemenin kendi rakamı, 43 kitap ve 5.274 hadis, o Kahire baskısının numaralandırmasıyla tam olarak örtüşür; bu da onu burada, bu derlemenin rakamının herhangi bir belirli basılı geleneği yansıtmadığı Sahih al-Buhari veya Sahih-i Müslim'e kıyasla daha sağlam bir temele yerleştirir.
hero.4=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-abudawud baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin Sahih al-Buhari, Sahih-i Müslim ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

