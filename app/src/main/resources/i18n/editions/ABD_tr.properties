fact.1.label=Dil
fact.1.value=klasik Arapça; okuyucuda her hadisin altında bir İngilizce çeviri gösterilir
fact.2.label=Derleyen
fact.2.value=Ebu Davud Süleyman bin el-Eş'as el-Ezdi es-Sicistani (hicrî 202–275 / miladi 817–889)
fact.3.label=Adı
fact.3.value=yalnızca Sünen-i Ebu Davud olarak bilinir; [[BUK|Sahih al-Buhari]]'nin aksine, onun için ayrı bir tam ad kaydedilmemiştir
fact.4.label=Derlendiği yer
fact.4.value=Horasan, Irak, Hicaz, Suriye, Mısır ve Nişabur üzerinden yapılan seyahatlerde toplandı; Ebu Davud Basra'ya yerleşti ve orada vefat etti
fact.5.label=Yöntem
fact.5.value=ravi veya kronolojiye göre değil, hukuki konuya (fıkıh) göre düzenlenmiştir; bir hukuki noktayı ele alan daha güçlü bir rivayet bulunmadığında bazı zayıf, mürsel ve münker hadisleri açıkça işaretleyerek içerir
fact.6.label=Konum
fact.6.value=[[BUK|Sahih al-Buhari]] ve [[MUS|Sahih-i Müslim]]'den sonra Sünni İslam'ın Altı Kitabı'nın (Kütüb-i Sitte) üçüncüsü; kalan üç kitap arasındaki konumu tartışmalı olup çözülmemiştir
fact.7.label=Hadis sayısı
fact.7.value=Ebu Davud'un öğrencisi İbn Dase'ye göre seçilen 4.800, ya da Muhammad Muhyiddin Abdülhamid'in standart baskısında, Kahire 1935, 5.274; kaynaklar bu iki rakamı uzlaştırmaz
fact.8.label=Bu derlemede
fact.8.value=43 kitap ve 5.274 numaralı hadis — 1935 Kahire baskısının numaralandırmasıyla tam olarak örtüşür
fact.9.label=İngilizce çeviri
fact.9.value=fawazahmed0/hadith-api'nin eng-abudawud baskısından alınmıştır, Arapça metnin altında eşlik eden çeviri olarak gösterilir; hangi yayınlanmış çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir
fact.10.label=Lisans
fact.10.value=Arapça metin (matn), kamu malı olan klasik metindir; İngilizce çevirinin lisansı hâlâ inceleme aşamasındadır
