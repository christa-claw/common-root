title=Diodati 1649 (italiano) — Su questa edizione | Common Root
description=La Bibbia italiana di Giovanni Diodati: pubblicata a Ginevra nel 1607, la prima fatta sull'ebraico e sul greco anziché sulla Vulgata, riveduta con note sue nel 1641 — e perché la data che accompagna il file è l'anno della sua morte.
heroHeading=Diodati 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Diodati nacque a Ginevra nel 1576 da una famiglia di mercanti lucchesi che avevano lasciato l'Italia piuttosto che rinunciare alla propria religione. Era italiano di stirpe e ginevrino di formazione, e proprio in questa combinazione sta tutta la ragione per cui questo libro esiste: aveva la lingua del paese che la Riforma non aveva raggiunto, e stava nella città che ne era diventata la tipografia. Teodoro di Beza lo propose per la cattedra di ebraico a ventun anni. Divenne professore di teologia nel 1606, pastore nel 1608, e succedette a Beza nella cattedra di teologia l'anno appresso; nel 1618 andò al Sinodo di Dordrecht come delegato di Ginevra e fu uno dei sei incaricati di redigerne gli atti.
hero.2=La sua Bibbia italiana fu stampata a Ginevra nel 1607. L'Italia aveva già avuto bibbie in volgare — quella del Malermi nel 1471, quella del Brucioli nel 1532 —, ma lavoravano sul latino o vi si appoggiavano assai. Diodati andò all'ebraico e al greco, e per il Nuovo Testamento ciò volle dire il testo greco che Beza aveva curato nella stessa città una generazione prima. Nel 1641 diede fuori un'edizione riveduta con note esplicative proprie, ed è da quella che discendono le ristampe. Divenne, ed è rimasta, la Bibbia protestante italiana — il che, in un paese quasi privo di lettori protestanti, significò che per quattro secoli la portarono pochissime persone. Tradusse la Bibbia anche in francese, nel 1644; quella è generalmente reputata la più debole, ed egli probabilmente non avrebbe contestato.
hero.3=La data sulla scheda merita una frase, perché non c'è. Questo testo circola in forma digitale sotto l'etichetta “Diodati 1649”, e 1649 non è un'edizione: è l'anno in cui Diodati morì. Le due date che significano qualcosa sono il 1607, quando la traduzione apparve la prima volta, e il 1641, quando la rivide. Quale delle due un dato file digitale rappresenti davvero è cosa che questo progetto non ha accertato, sicché il catalogo lascia vuota la colonna dell'anno anziché stampare un numero di cui non può rispondere. Il nome è conservato come è arrivato, perché è quello che la gente cercherà.
hero.4=In questo lettore è l'unica Bibbia italiana, sicché mettendo l'interfaccia in italiano è su di essa che si apre — non per una scelta curata, come per lo spagnolo è scelta la Reina-Valera 1909, ma perché la scansione del catalogo non trova altro in quella lingua. Nei pioli della discendenza non le è registrato alcun antecedente, sicché un piolo aperto sotto un versetto scende dritto al pavimento delle lingue originali segnato con ≈. Quel pavimento fornisce per il greco il Textus Receptus, e qui la cosa è insolitamente vicina al vero: per la maggior parte delle edizioni di questo corpus il Receptus sta al posto di un testo critico che i traduttori adoperarono davvero, ma Diodati lavorava per davvero su un testo greco a stampa di quella famiglia. Il suo segno di piolo non porta anno, il che corrisponde al vuoto della scheda.

