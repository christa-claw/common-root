fact.2.value=Giovanni Diodati (1576–1649), nato a Ginevra da una famiglia di mercanti protestanti che avevano lasciato Lucca piuttosto che rinunciare alla propria religione
fact.3.label=Prima pubblicazione
fact.3.value=1607, a Ginevra — la prima Bibbia italiana fatta sull'ebraico e sul greco anziché sul latino
fact.4.label=Edizione riveduta
fact.4.value=1641, con note proprie di Diodati; è in quella forma che il testo fu ristampato per i tre secoli seguenti
fact.5.label=Perché l'etichetta dice 1649
fact.5.value=il 1649 è l'anno della morte di Diodati, non l'anno di un'edizione — la data viaggia insieme al testo digitale, e la scheda di catalogo lascia vuota la colonna dell'anno anziché asserirne uno
fact.6.label=Il greco dietro il Nuovo Testamento
fact.6.value=le edizioni di Beza, fatte a Ginevra una generazione prima — entro quella famiglia di testi greci a stampa che questo corpus tiene come [[TR|Textus Receptus]]
