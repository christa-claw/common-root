title=文本圣经 1906 — 关于此版本 | Common Root
description=考奇与魏茨泽克的《文本圣经》（Textbibel）：一部学者的德文圣经，从希伯来文和希腊文重新译出，1899 年在图宾根首次合为一卷出版；此处文本标注的年份是 1906 年。
heroHeading=文本圣经 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=两位教授，新旧两约。卡尔·魏茨泽克（1822–1899）是图宾根的教会史学者，1861 年接替费迪南德·克里斯蒂安·鲍尔的教席，自 1889 年起任该大学校务长。他的新约译本于 1875 年首次出版，在他生前共出了 9 版，最后一版是他在临终病榻上准备的。埃米尔·考奇（1841–1910）是旧约学者，先后在莱比锡、巴塞尔和图宾根任教，1888 年定居哈雷；他与一批专业同行合译的旧约于 1894 年全部出齐。
hero.2=1899 年，即魏茨泽克去世那年，两者合为一卷，名为 Textbibel des Alten und Neuen Testaments，由图宾根的 J.C.B. Mohr（Paul Siebeck）出版。书名说明了它是什么：纯粹的经文，供那些想用自己时代的德语了解希伯来文和希腊文究竟说了什么的读者使用。它从未打算取代路德。魏茨泽克刻意避开路德的语言，转而力求传达原文给最初读者留下的印象；他的传记作者认为它不大可能成为大众读物，事实也确实如此。它一直重印到 1910 年代。此处的数字文本标注为 1906 年；那次印刷属于第几版，本项目尚未查明。
hero.3=它读起来就是那个时代的学术。旧约中的神名是 “Jahwe”——诗篇 23 篇作 “Jahwe ist mein Hirte”——成千上万次出现在路德译作 “der Herr” 的地方。以赛亚书 7:14 作 “ein junges Weib”，即一位年轻妇人。新约中，马太福音 6:13 的主祷文没有结尾的颂赞，约翰一书 5:7 也没有天上的见证。旧约保留希伯来文的章节划分：诗篇的标题计入节数，所以诗篇 51 篇有 21 节，玛拉基书是 3 章而不是 4 章。拼写比年份所显示的更古老——约翰福音 8:1 中耶稣 “gieng” 往橄榄山去。
hero.4=在这个阅读器中，它是 4 部德文圣经之一，与艾伯菲尔德译本以及路德 1545 年和 1912 年的文本并列。德文界面并不在它上面开启：德文没有选定的默认版本，所以阅读器取目录中第一部德文圣经，那就是艾伯菲尔德译本。谱系阶梯中未为它记录任何母本，这对一部直接从原文译出的译本而言恰如其分：在某一节之下展开的阶梯径直落到以 ≈ 标示的原文底层——旧约是威斯敏斯特列宁格勒抄本，新约是公认文本，而正如约翰一书 5:7 所示，这部译本并不依从那种希腊文。

