fact.2.value=Joseph Smith jr. (1805–1844), der sagte, er habe es "durch die Gabe und Macht Gottes" aus einer Reihe antiker Metallplatten übersetzt; er diktierte den Text Schreibern, hauptsächlich Oliver Cowdery, wobei kürzere, frühere Abschnitte von Martin Harris und Emma Smith aufgezeichnet wurden
fact.3.label=Erschienen
fact.3.value=1830, Palmyra, New York; gedruckt von Egbert B. Grandin, etwa 5.000 Exemplare
fact.4.label=Aufbau
fact.4.value=15 Bücher, vom Ersten Buch Nephi bis zum Buch Moroni, benannt nach den nephitischen und jareditischen Aufzeichnern, denen ihre Zusammenstellung zugeschrieben wird; die Ausgabe von 1830 hatte keine Versnummern, und die heutige Kapitel- und Verseinteilung geht auf Orson Pratts Ausgabe von 1879 zurück
fact.5.label=Stellung
fact.5.value=Eines der vier Standardwerke der Bewegung der Heiligen der Letzten Tage, neben der Bibel, [[DC|Lehre und Bündnisse]] und der [[PGP|Köstlichen Perle]]
fact.6.label=In diesem Korpus
fact.6.value=Text und Verseinteilung folgen dem aktuellen Standardwortlaut, mit den typografischen Korrekturen der Ausgabe von 2013, aus dem als gemeinfrei erklärten JSON-Export des Mormon Documentation Project; dessen urheberrechtlich geschützte Fußnoten, Kapitelzusammenfassungen und Einleitung sind ausgelassen — deshalb wird hier kein einzelnes Druckjahr angegeben
fact.7.label=Lizenz
fact.7.value=Gemeinfrei, laut Angabe der für die Daten Verantwortlichen; das moderne urheberrechtlich geschützte Studienmaterial ist nicht enthalten
