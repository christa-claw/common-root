title=Buch Mormon — Über diese Ausgabe | Common Root
description=Das Buch Mormon: Joseph Smiths 1830 diktierte Aufzeichnung antiker Prophezeiungen aus Amerika, gedruckt in Palmyra, New York, und von Heiligen der Letzten Tage als begleitende Schrift zur Bibel gelesen.
heroHeading=Buch Mormon
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith sagte, er habe dieses Buch "durch die Gabe und Macht Gottes" aus einer Reihe antiker Metallplatten übersetzt, die er nach eigener Aussage 1827 in der Nähe des Hofs seiner Familie außerhalb von Palmyra, New York, gefunden und später an den Boten zurückgegeben habe, der sie ihm gezeigt hatte. Zeugen der Diktierung beschreiben, wie er einen Seherstein betrachtete — in späteren Abschnitten der Arbeit einen Stein, den er in einen Hut legte, um das Licht auszuschließen, nicht nur das Paar an einem Brustschild befestigter Steine, die traditionell als Urim und Tummim bezeichnet werden und die den Platten beigelegen haben sollen — und den Text laut sprach, während ein Schreiber ihn aufschrieb. Oliver Cowdery schrieb auf diese Weise den größten Teil über etwa zwei Monate im Jahr 1829 nieder, hauptsächlich auf dem Hof der Familie Whitmer in Fayette, New York; Martin Harris und Josephs Frau Emma Smith hatten für kürzere, frühere Abschnitte als Schreiber gedient.
hero.2=Das Manuskript ging noch im selben Jahr in den Druck. Smith sicherte sich im Juni 1829 das Urheberrecht an dem Werk, und der Druck begann in Egbert B. Grandins Druckerei in Palmyra, wo der Schriftsetzer John H. Gilbert die Satzzeichen und Absatzeinteilungen ergänzte, die dem diktierten Manuskript fehlten. Das fertige Buch erschien im März 1830: etwa 5.000 Exemplare, Grandins gesamte Auflage.
hero.3=Es ist in fünfzehn Bücher gegliedert, vom Ersten Buch Nephi bis zum Buch Moroni, jedes benannt nach dem prophetischen Aufzeichner, dem seine Zusammenstellung zugeschrieben wird. Keines der Exemplare von 1830 besaß eine einzige Versnummer — der Text verlief als durchgehender Fließtext innerhalb deutlich längerer Kapitel, als Leser sie heute sehen. Die heute gebräuchliche Kapitel- und Verseinteilung geht auf eine Ausgabe von 1879 zurück, die Orson Pratt erstellte; er kürzte auch die Kapitel und fügte die ersten Fußnoten hinzu. Spätere Ausgaben gestalteten die Darstellung weiter um: Ein Komitee unter George F. Richards setzte den Text 1920 zweispaltig und fügte Kapitelzusammenfassungen und eine Ausspracheanleitung hinzu; eine Ausgabe von 1981 aktualisierte Querverweise, Kapitelüberschriften und anderes Nachschlagematerial; und ein Druck von 2013 korrigierte typografische Unstimmigkeiten, die sich seit 1981 in die Druckplatten eingeschlichen hatten.
hero.4=Es gilt als eines der vier Werke, die die Bewegung der Heiligen der Letzten Tage ihre Standardwerke nennt, neben der Bibel, [[DC|Lehre und Bündnisse]] und der [[PGP|Köstlichen Perle]]. Der Text in diesem Korpus stammt aus dem JSON-Export des Mormon Documentation Project, den dessen Betreuer als gemeinfrei erklärt hat; er folgt dem Wortlaut und der Verseinteilung der aktuellen Standardausgabe, mit den typografischen Korrekturen der Ausgabe von 2013, und lässt die Fußnoten, Kapitelzusammenfassungen und die Einleitung aus, die weiterhin urheberrechtlich geschützt sind. Weil hier eben dieser aktuelle Standardtext vorliegt und kein einzelner historischer Druck, wird dafür kein einzelnes Erscheinungsjahr angegeben.

