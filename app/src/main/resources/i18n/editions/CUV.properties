title=Chinese Union Version — About This Edition | Common Root
description=The Chinese Union Version of 1919: twenty-nine years of committee work that produced the Bible most Chinese Protestants still read, and one of the first books ever published in written vernacular Mandarin.
heroHeading=Chinese Union Version
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=In 1890 the Protestant missions working in China met in Shanghai and admitted a problem. There were already several Chinese Bibles, and no two agreed — not on wording, not on the spelling of names, and not even on which register of Chinese to write in. The conference resolved on a single translation that every mission would use, and called it a union version: 和合本, the harmonised text. Because written Chinese was then split between the literary language of the educated and the spoken vernacular of everyone else, they commissioned three at once — two in literary Chinese, one in Mandarin.
hero.2=The Mandarin committee took twenty-nine years. Calvin Wilson Mateer, an American Presbyterian who had been in Shandong since 1863, chaired it, and died in 1908 with the work unfinished; the panel he had assembled from a half-dozen missions carried on, as did the Chinese scholars who worked alongside them and whose names the mission records kept much less carefully. They took the English Revised Version as the text they were rendering and checked it against the Hebrew and Greek behind it — which puts the corpus's own Revised Version one step upstream of this Bible, and the King James Version one step above that. The two literary versions were eventually merged into one. The Mandarin version is what survived.
hero.3=It was published in 1919, and the date did more for it than any committee could have. That was the year of the May Fourth Movement, when Chinese writers began abandoning the literary language for the vernacular in earnest, and the Union Version arrived as one of the very first substantial books already written that way. A translation meant to settle an argument between missionaries turned into a landmark of modern Chinese prose, and its phrasing is quoted by people who have never opened a Bible. It has been printed ever since in two editions that differ in a single word — whether God is 神 or 上帝 — with the spacing adjusted so that both editions still break pages identically.
hero.4=In this reader it is the only Chinese Bible, which decides two things about how it behaves. Set the interface to Chinese and this is what opens — not because it was picked, as Reina-Valera 1909 was picked for Spanish, but because the catalogue finds no other Bible in the language. And in the lineage rungs it has no recorded parent, so opening a rung beneath a verse goes straight to the original-language floor marked with ≈, even though the Revised Version it was made from is sitting in the corpus one column away. Its rung chip does carry a year, 1919, which not every edition here does.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Language
fact.1.value=Chinese — vernacular Mandarin (官話 / baihua), not literary Chinese
fact.2.label=Native name
fact.2.value=和合本 (héhéběn) — “harmonised” or “united” version
fact.3.label=Commissioned by
fact.3.value=The 1890 General Conference of Protestant Missionaries in Shanghai
fact.4.label=Translated by
fact.4.value=A committee drawn from several Protestant missions; the American Presbyterian Calvin Wilson Mateer (1836–1908) chaired the Mandarin panel until his death, working with Chinese colleagues throughout
fact.5.label=Published
fact.5.value=1919, after twenty-nine years of work
fact.6.label=Textual basis
fact.6.value=The English Revised Version as the working base, checked against the Hebrew and Greek — the same [[RV|Revised Version]] this corpus holds
fact.7.label=Two editions
fact.7.value=The Shen edition (神版) and the Shangdi edition (上帝版), differing only in which Chinese word carries “God”
fact.8.label=Later revision
fact.8.value=The Revised Chinese Union Version, New Testament 2006 and complete Bible 2010 — not this text
fact.9.label=In this corpus
fact.9.value=The only Chinese Bible here, so a Chinese interface opens on it by default; no parent is recorded in the lineage rungs, though its rung chip does carry the year 1919
