title=Koran — Yusuf Ali — Über diese Ausgabe | Common Root
description=Abdullah Yusuf Alis Übersetzung, zwischen 1934 und 1937 in vier Bänden veröffentlicht von einem indischen Beamten, der zum Islamgelehrten wurde — eine von nur zwei englischen Koranübersetzungen, die sich eindeutig als gemeinfrei erwiesen, und in diesem Korpus eine zweite englische Begleitübersetzung neben der von Pickthall.
heroHeading=Koran — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872–1953) wurde in Bombay geboren und zunächst am dortigen Wilson College ausgebildet, wo er neben dem regulären Unterricht eine religiöse Erziehung erhielt, die ihn als Jungen den Koran auswendig lernen ließ. Ein erstklassiger Bachelorabschluss in englischer Literatur von der Universität Bombay im Jahr 1891 brachte ihm ein Presidency-Stipendium nach Großbritannien ein, wo er am St John's College in Cambridge Rechtswissenschaft studierte, 1895 mit Bachelor- und Jura-Abschluss graduierte und im selben Jahr mit einer Stelle im indischen Zivildienst nach Indien zurückkehrte.
hero.2=Fast zwei Jahrzehnte verbrachte er im Zivildienst — als Friedensrichter und Steuerbeamter, dann als Richter und später als stellvertretender Sekretär im Finanzministerium der indischen Regierung —, bevor er 1914 seinen Dienst quittierte und sich in Großbritannien niederließ. Dort wurde er Treuhänder der Shah-Jehan-Moschee in Woking und des East London Mosque Fund, wurde 1917 für seine Arbeit während des Krieges zum CBE ernannt und hielt Vorlesungen in Hindustani an der School of Oriental Studies. In den 1920er- und 1930er-Jahren kehrte er als Rektor des Islamia College in Lahore nach Indien zurück, und in diesen Jahren, nach mehr als einem Jahrzehnt der Arbeit, schrieb er den Koran mit eigenen erklärenden Anmerkungen ins Englische um.
hero.3=Die Übersetzung erschien zwischen 1934 und 1937 in dreißig Fortsetzungslieferungen, die erste am 4. April 1934, unter dem Titel "The Holy Qur'an: Text, Translation and Commentary", veröffentlicht von Shaik Muhammad Ashraf aus Lahore; 1938 folgte eine zusammengefasste einbändige Ausgabe, 1939–1940 eine überarbeitete Fassung. Neben der von Pickthall wurde sie eine der beiden meistgelesenen englischen Koranübersetzungen des 20. Jahrhunderts, bekannt vor allem für den Umfang ihrer Fußnoten, und wurde seither in rund dreißig weiteren, teils von fremder Hand überarbeiteten Auflagen neu herausgegeben — darunter eine ab 1977 in Nordamerika verbreitete Ausgabe von Amana Publications und eine von Saudi-Arabien geförderte Überarbeitung aus den 1980er-Jahren.
hero.4=Was hier über alquran.cloud digitalisiert wurde, ist der Übersetzungstext selbst, nicht Yusuf Alis begleitender Kommentar; er wird in diesem Korpus als zweite englische Begleitübersetzung zu [[Q-AR|dem uthmanischen arabischen Text]] angeboten, neben der von [[Q-EN|Pickthall]] aus dem Jahr 1930. Sie war eine von nur zwei englischen Fassungen, die eine Durchsicht der verfügbaren Übersetzungen als eindeutig frei nutzbar fand — diese und die von Pickthall —, wobei "eindeutig" hier einen Vorbehalt braucht: Das Werk ist in der Europäischen Union und in Pakistan, wo Yusuf Ali starb und wo es zuerst erschien, gemeinfrei, doch ein 1996 in den Vereinigten Staaten pro forma eingetragenes Urheberrecht soll dort bis 2033 gelten.

