title=Chinese Union Version — Об этом издании | Common Root
description=Chinese Union Version 1919 года: двадцать девять лет работы комитета, из которых вышла Библия, которую китайские протестанты читают до сих пор, и одна из первых книг, вообще изданных на письменном разговорном мандаринском.
heroHeading=Китайский союзный перевод
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=В 1890 году протестантские миссии, работавшие в Китае, собрались в Шанхае и признали существование проблемы. Китайских Библий было уже несколько, и ни одна не совпадала с другой — ни в формулировках, ни в написании имён, ни даже в том, на каком регистре китайского вообще писать. Конференция постановила сделать единый перевод, которым пользовались бы все миссии, и назвала его союзным: 和合本, согласованный текст. Поскольку письменный китайский был тогда разделён между литературным языком образованных и разговорным языком всех прочих, заказали сразу три — два на литературном китайском, один на мандаринском.
hero.2=Мандаринскому комитету понадобилось двадцать девять лет. Возглавлял его Кальвин Уилсон Матир, американский пресвитерианин, живший в Шаньдуне с 1863 года; он умер в 1908 году, не доведя работу до конца, а собранная им из полудюжины миссий коллегия продолжила, как продолжили и китайские учёные, работавшие рядом с ними и чьи имена миссионерские бумаги сохранили куда небрежнее. За передаваемый текст они взяли английскую Revised Version и сверяли её с еврейским и греческим, стоящими за нею, — что ставит собственную Revised Version этого собрания одной ступенью выше настоящей Библии, а King James Version — ещё одной выше неё. Две литературные версии в конце концов слили в одну. Уцелела мандаринская.
hero.3=Она вышла в 1919 году, и дата сделала для неё больше, чем мог бы любой комитет. Это был год Движения четвёртого мая, когда китайские писатели всерьёз стали оставлять литературный язык ради разговорного, и союзный перевод явился как одна из самых первых объёмных книг, уже написанных именно так. Перевод, задуманный, чтобы прекратить спор между миссионерами, обернулся вехой современной китайской прозы, и его обороты цитируют люди, ни разу не открывавшие Библии. С тех пор его печатают в двух изданиях, различающихся одним-единственным словом — 神 или 上帝 для Бога, — причём разрядка подогнана так, что оба издания и поныне ломают страницы одинаково.
hero.4=В этой читалке она единственная китайская Библия, и это решает в её поведении две вещи. Поставьте интерфейс на китайский — откроется именно она: не потому, что её выбрали, как для испанского выбрали Reina-Valera 1909, а потому, что каталог не находит на этом языке другой Библии. А в ступенях родословия источник для неё не записан, так что ступень под стихом уходит прямо на пол исходных языков, помеченный знаком ≈, хотя Revised Version, из которой она сделана, стоит в собрании через колонку. Год же её метка ступени несёт — 1919, чего здесь не делает всякое издание.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=китайский — разговорный мандаринский (官話 / байхуа), не литературный китайский
fact.2.label=Самоназвание
fact.2.value=和合本 (héhéběn) — «согласованный», то есть «союзный», перевод
fact.3.label=Заказан
fact.3.value=Всеобщей конференцией протестантских миссионеров в Шанхае 1890 года
fact.4.label=Переведён
fact.4.value=комитетом, собранным из нескольких протестантских миссий; американский пресвитерианин Кальвин Уилсон Матир (1836–1908) возглавлял мандаринскую коллегию до самой смерти, работая всё это время с китайскими сотрудниками
fact.5.label=Издан
fact.5.value=в 1919 году, после двадцати девяти лет работы
fact.6.label=Текстовая основа
fact.6.value=английская Revised Version как рабочая основа, сверенная с еврейским и греческим, — та самая [[RV|Revised Version]], что есть в этом собрании
fact.7.label=Два издания
fact.7.value=издание Шэнь (神版) и издание Шанди (上帝版), различающиеся лишь тем, каким китайским словом передан «Бог»
fact.8.label=Позднейший пересмотр
fact.8.value=Revised Chinese Union Version: Новый Завет 2006 года и полная Библия 2010 года — не этот текст
fact.9.label=В этом собрании
fact.9.value=единственная китайская Библия здесь, так что китайский интерфейс открывается на ней по умолчанию; в ступенях родословия источник не записан, но метка ступени всё же несёт год 1919
