title=Los cuarenta hadices de an-Nawawi — Acerca de esta edición | Common Root
description=Los cuarenta hadices de an-Nawawi: 42 hadices elegidos por el imam an-Nawawi, cada uno pensado como un "gran fundamento" (qa'ida azima) de la religión — la obra más leída del género de los cuarenta hadices.
heroHeading=Los cuarenta hadices de an-Nawawi
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Sharaf an-Nawawi nació en muharram del año 631 AH (octubre de 1233) en Nawa, cerca de Daraa, en Siria, y se trasladó a Damasco a los dieciocho años para estudiar. En 665 AH (1267) fue nombrado director de la Dar al-Hadith al-Ashrafiyya de Damasco, cargo que ocupó hasta su muerte en Nawa en 676 AH (1277), a mediados de sus cuarenta años; allí fue enterrado. Jurista de la escuela shafi'í, escribió profusamente en esa breve vida — entre sus otras obras están Riyad al-Salihin, un comentario a Sahih Muslim conocido como Al-Minhaj, al-Majmu' Sharh al-Muhadhab, Minhaj al-Talibin y Kitab al-Adhkar.
hero.2=Al-Arba'in al-Nawawiyya continúa una tradición más antigua de colecciones de "cuarenta hadices" (arba'iniyyat), cuya premisa es un hadiz que promete a quien conserve cuarenta hadices sobre la religión un lugar entre los sabios el Día del Juicio — un hadiz que la mayoría de los críticos clasifica a su vez como da'if (débil). La primera colección de este tipo, hoy perdida, se atribuye a Abdullah ibn al-Mubarak (m. 797); muchos sabios hicieron después las suyas. An-Nawawi eligió hadices que juzgó sólidos, en su mayoría del [[BUK|Sahih al-Bukhari]] y del [[MUS|Sahih Muslim]], cada uno ilustrando lo que él llamó un "gran fundamento" (qa'ida azima) de la religión — y a pesar del nombre, la colección tal como se conserva reúne cuarenta y dos hadices. Se convirtió en el ejemplo más leído del género, recibió decenas de comentarios, el más célebre el Jami' al-'Ulum wal-Hikam de Ibn Rajab al-Hanbali, y se cuenta entre las obras más leídas del islam suní después del propio Corán.
hero.3=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-nawawi de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]], el [[NAS|Sunan an-Nasa'i]], el [[IBM|Sunan Ibn Majah]], el [[MAL|Muwatta Malik]] y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=Árabe clásico, con una traducción al inglés debajo de cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Yahya ibn Sharaf an-Nawawi (631–676 AH / 1233–1277)
fact.3.label=Título
fact.3.value=Conocida como al-Arba'in al-Nawawiyya ("los cuarenta hadices de an-Nawawi"); a pesar del nombre, la colección reúne cuarenta y dos hadices
fact.4.label=Compilado
fact.4.value=Mayormente del [[BUK|Sahih al-Bukhari]] y del [[MUS|Sahih Muslim]], mientras an-Nawawi dirigía la Dar al-Hadith al-Ashrafiyya de Damasco (665 AH / 1267) hasta su muerte en Nawa, Siria, en 676 AH (1277)
fact.5.label=Método
fact.5.value=Cada hadiz elegido por ser, en palabras de an-Nawawi, un "gran fundamento" (qa'ida azima) de la religión; continúa un género más antiguo de cuarenta hadices (arba'iniyyat) cuyo primer ejemplo conocido, hoy perdido, se atribuye a Abdullah ibn al-Mubarak (m. 797)
fact.6.label=Posición
fact.6.value=Contada ampliamente entre las obras más leídas del islam suní después del propio Corán; objeto de decenas de comentarios, el más célebre el Jami' al-'Ulum wal-Hikam de Ibn Rajab al-Hanbali
fact.7.label=Número de hadices
fact.7.value=42, a pesar del nombre; la edición fuente de este corpus los numera igual
fact.8.label=En este corpus
fact.8.value=1 libro y 42 hadices numerados
fact.9.label=Traducción al inglés
fact.9.value=Tomada de la edición eng-nawawi de fawazahmed0/hadith-api, mostrada como acompañamiento del árabe; de qué traducción impresa procede no está aún confirmado por parte de este corpus
fact.10.label=Licencia
fact.10.value=El matn árabe es el texto clásico de dominio público; la licencia de la traducción al inglés sigue en revisión
