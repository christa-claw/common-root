title=Open New Arabic Version — 关于此版本 | Common Root
description=Biblica 出版的 Open New Arabic Version：一部现代阿拉伯文圣经，版权标注1988、1997及2012年，依知识共享授权发布，允许共享、改编并署名付印。
heroHeading=Biblica 的 Open New Arabic Version
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=此为现代阿拉伯文译本，与[[SVD|史密斯与范戴克译本]]是不同的文本，而非其另一抄本。由 Biblica, Inc. 出版，其版权声明载有三个年份：1988、1997及2012年。该文本自身的版权页给出其较早的名称：Ketab El Hayat Majani。
hero.2=使其在本阅读器中独具一格的是其授权方式。Biblica 以知识共享署名-相同方式共享 4.0 授权将其发布为「开放」文本：任何人均可复制、改编与付印，惟须注明 Biblica，且凡据此制作者须以同一条款共享。Biblica 所要求的署名文字为："The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible"。多数现代译本并不以此方式提供，这正是此本收录于此的缘由。
hero.3=此授权有一条值得知悉的条件。未经改动的文本可署 Biblica 之名；经重排的文本则不可：本站的事件顺序版与写作顺序版将诸书置于不同次序，我们视之为改编，故这些版本声明文本已经重排，不以 Biblica 之名为标题。
hero.4=此文件全标音。其源文件有一处细节：使徒行传15章25、26节印作单一节经文，故本库将二者并列于第25节之下，该处并无独立的第26节。

