title=Sunan Ibn Majah — Tietoja tästä laitoksesta | Common Root
description=Sunan Ibn Majah: sunni-islamin kuudesta kirjasta viimeinen, järjestetty lainopillisen aiheen mukaan, jonka asema niiden joukossa on pitkään ollut kiistanalainen siinä myös esiintyvien heikkojen ja väärennettyjen hadithien vuoksi.
heroHeading=Sunan Ibn Majah
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abdullah Muhammad ibn Yazid Ibn Majah al-Rabi'i al-Qazwini syntyi vuonna 209 AH (824 jaa.) Qazwinissa, joka sijaitsee nykyisin Iranin luoteisosassa, mawali-perheessä (ei-arabialaisten asiakkaiden perheessä) Rabi'ah-heimosta — Majah oli yhden kertomuksen mukaan hänen isänsä lempinimi, ei isoisän tai äidin nimi. Hän matkusti hadithien etsinnässä Irakin, Hidjazin, Syyrian ja Egyptin halki opiskellen laajan oppineiden piirin johdolla; yli neljänneksen hänen myöhemmästä Sunanistaan kerrotaan nojaavan yhteen ainoaan opettajaan, Ibn Abi Shaybahiin. Aikalaiset, kuten Abu Ya'la al-Khalili, kiittivät häntä luotettavaksi, arvostetuksi ja yksimielisesti tunnustetuksi auktoriteetiksi. Hän kuoli Qazwinissa vuonna 273 AH (887 jaa.), vaikka al-Kattani merkitsee myös vuoden 275 (889 jaa.); perinteisen kertomuksen mukaan Abu Zur'a al-Razi huomautti, luettuaan Ibn Majahilta valmiin Sunanin, että jos ihmisillä olisi tämä kirja, muut Sunan-kokoelmat kävisivät suurelta osin tarpeettomiksi.
hero.2=Hänen Sunaninsa käsittää al-Dhahabin laskun mukaan noin 1 500 lukua ja noin 4 000 hadithia, järjestettynä lainopillisen aiheen mukaan kuten [[ABD|Abu Dawudin]] ja [[TIR|at-Tirmidhin]] kokoelmat. Kunnollisen ja hyväksyttävän aineiston rinnalla siinä on myös hadetheja, jotka myöhemmät oppineet arvioivat heikoiksi, mukaan lukien noin kolmekymmentä, joita yleisesti pidetään suoranaisina väärennöksinä — syy, jonka takia jotkut oppineet laskevat vain "Viisi" kuuden sijaan.
hero.3=Sunnimuslimien perinne asettaa Sunan Ibn Majahin Kuuden kirjan (Kutub al-Sittah) viimeiseksi, yhdessä [[BUK|Sahih al-Bukharin]], [[MUS|Sahih Muslimin]], [[ABD|Sunan Abi Dawudin]], [[TIR|Jami` at-Tirmidhin]] ja [[NAS|Sunan an-Nasa'in]] kanssa. Tämä kuudes sija on itsessään kiistanalainen: malikiitit ja Ibn al-Athir nimeävät muiden ohella sen sijaan [[MAL|Muwatta Malikin]], ja jotkut nimeävät al-Daraqutnin Sunanin; Ibn Majahin kirjan kerrotaan yleisesti saaneen paikan siksi, että sen sisältö limittyy vähiten muiden viiden kanssa, ei siksi, että sitä pidettäisiin ehdokkaista luotettavimpana.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-ibnmajah-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää [[BUK|Sahih al-Bukharissa]], [[MUS|Sahih Muslimissa]], [[ABD|Sunan Abi Dawudissa]], [[TIR|Jami` at-Tirmidhissa]], [[NAS|Sunan an-Nasa'issa]] ja Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

