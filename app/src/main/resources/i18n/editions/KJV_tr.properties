title=King James Version — Bu Baskı Hakkında | Common Root
description=1611 tarihli King James Version: altı takım hâlinde kırk yedi çevirmen, sıfırdan başlamak yerine Bishops' Bible'ı gözden geçirmekle görevlendirildi — ve bu derlemede, ilk baskının taşıdığı apokrifleri hâlâ taşıyan seksen kitaplık metin.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Her şey, başka bir konu için toplanılmış bir mecliste verilen bir ödünle başladı. I. James'in dua kitabına dair Püriten şikâyetlerini dinlemek üzere topladığı 1604 Hampton Court Konferansı'nda yeni bir çeviri önerisi ortaya atıldı ve kral bunu benimsedi. Kırk yedi bilgin atandı ve altı takıma bölündü — ikisi Westminster'da, ikisi Oxford'da, ikisi Cambridge'de — her birine Kutsal Kitap'ın bir bölümü ve çalışacakları bir kurallar dizisi verildi. Bu kuralların ilki, okurken en çok önem taşıyanıdır: 1568 tarihli Bishops' Bible'ı izleyecekler ve onu ancak özgün metnin gerektirdiği ölçüde değiştireceklerdi. Bu iş yeni bir çeviri olarak değil, bir gözden geçirme olarak ısmarlandı ve öyle de okunur. Kralın matbaacısı Robert Barker, tamamlanan kitabı 1611'de Londra'da yayımladı.
hero.2=Kuralların söylemediği ama çevirmenlerin yine de yaptığı şey, Bishops' Bible'ın gerisine durmadan uzanmaktı. Devraldıkları İngilizceyi başkaları yapmıştı — her şeyden önce Tyndale ve bir kuşak İngiliz okurun gerçekten sahip olup evde okuduğu Cenevre İncili. Bu derleme o borcu önsöze bırakmak yerine kaydeder: King James Version'ın burada kayıtlı kaynağı [[GNV|Cenevre İncili]]dir; altında da alınagelen Yunanca metin ile masoretik İbranice bulunur. Bir King James ayetinin altında soy basamağı açın, yukarı gelen Cenevre'dir. İkisi ayet ayet o kadar yakındır ki ilginç soru artık Cenevre'nin kullanılıp kullanılmadığı olmaktan çıkar ve 1611 takımlarının ondan nerede ayrılmayı seçtiği hâline gelir — ki buna artık inanmak yerine bakılabilir.
hero.3=Bu King James ile çoğu ötekiler arasındaki bir fark, içinde ne bulunduğuyla ilgilidir. Metin burada seksen kitap ve 36.820 ayet tutar: Eski ve Yeni Antlaşma ile aralarına basılmış on dört apokrif kitap; tıpkı 1611 cildinin bastığı gibi. Bugün satılan hemen her King James'te altmış altı vardır. Derleme uzun biçimi korur ve etkisi, soyun kaydettiği zincir boyunca görünür: [[GNV|Cenevre İncili]]nde burada altmış altı kitap vardır, bunda seksen, üstündeki [[RV|Revised Version]]'da seksen, onun da üstündeki [[ASV|American Standard Version]]'da yine altmış altı. Bir baskının apokrifleri basıp basmaması her birinin ayrı ayrı verdiği bir karardır ve onları tek sütuna koymak örüntüyü okunur kılar.
hero.4=Karttaki yılın ne anlama geldiği konusunda kesin olun. Orada 1611 yazar ve bu çevirinin tarihidir — bu metnin hangi basım olduğuna dair bir iddia değildir. Buradaki İngilizcenin yazımı çağdaşlaştırılmıştır: Yaratılış «In the beginning God created the heaven and the earth» diye başlar; oysa 1611 formaları «In the beginning God created the Heauen, and the Earth» diyordu. Yani bu, sonraki matbaacıların standartlaştırdığı hâliyle King James'tir ve türediği belirli basım kayıtlı değildir — derlemenin [[FB1776|Biblia 1776]] için bıraktığı aynı dürüst boşluk. Çevirmenlerin tercihlerini okumak bakımından fark etmez; 1611 kitabını bir nesne olarak alıntılamak bakımından her şeyi değiştirir. Şunu da not edin: İngilizce arayüzün açtığı baskı bu değildir; o [[NIV|New International Version]]'dır ve King James geçiş yapılan bir baskıdır.

