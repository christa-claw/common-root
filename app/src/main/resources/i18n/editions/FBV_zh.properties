title=Free Bible Version — 关于本版本 | Common Root
description=Free Bible Version：由 Jonathan Gallagher 据希伯来文与 Nestle–Aland 希腊文译成的现代英文圣经，以相同方式共享的授权发布，任何人都可以重印。
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=这部译本的存在，缘于一页版权声明。几乎每一部现代英文圣经都载有这样一页，而其上通常写着：引用几百节经文无须征询，整卷则须书面许可，全文出版则意味着支付版税。对一个教会网站或一份录音而言，事情到此便可作罢。Free Bible Version 之所以被译出，就是要成为那部前面没有任何阻拦的圣经。
hero.2=它出自 Jonathan Gallagher 之手，他在圣安德鲁斯大学取得神学博士学位；出版者是非营利机构 Free Bible Ministry。新约据 Nestle–Aland 希腊文而译——那是各圣经公会所用的校勘本——旧约则据希伯来文。该计划自述的译法值得一提，因为它并非通例：先仅凭辞书自原文译出，其后才与既有译本比对，且比对只是查核重复与讹误，而非取材。它既不是对某部更早英文圣经的修订，也不是对若干新译本的综合。它自陈的目标，是避开俚语与时兴措辞的当代英文，并且不肯朝任何一个信仰群体的立场翻译。
hero.3=授权才是这件事的要旨。所用的是 Creative Commons 署名-相同方式共享 4.0：可复制、可付印、可上网、可改编，只要注明版本、标示改动，并且由它衍生之物同样以此条款发布。这与公有领域是不同的交易——自由是传递下去，而非拱手让出——本语料库中的西班牙文 Versión Biblia Libre 用的正是同一授权，且出自同一事工。
hero.4=对读者而言，由此可得两点。目录把它的年份留白，因为该计划随改随发；并无一个有确切日期的印本可供本语料库系定，而杜撰一个只会比留白更糟。此外，在 Free Bible Version 的某一节之下展开一级阶梯，所见是 ≈ TR，即公认文本，标为见证而非母本。这部译本并非据它译成。那只是本语料库目前所能提供的希腊文——此处尚无任何校勘本——同样的权宜之选，出于同样的缘故，也出现在 New International Version、New American Standard Bible 与 Berean Standard Bible 之下。

