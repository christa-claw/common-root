title=Coran — Yusuf Ali — À propos de cette édition | Common Root
description=La traduction d'Abdullah Yusuf Ali, publiée en quatre volumes entre 1934 et 1937 par un fonctionnaire indien devenu érudit islamique — l'une des deux seules traductions anglaises du Coran jugées sans ambiguïté dans le domaine public, et dans ce corpus une seconde traduction anglaise d'accompagnement à côté de celle de Pickthall.
heroHeading=Coran — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872-1953) est né à Bombay et fut d'abord scolarisé au Wilson College de cette ville, où une éducation religieuse menée en parallèle de sa scolarité lui fit mémoriser le Coran dès l'enfance. Une licence de première classe en littérature anglaise obtenue à l'université de Bombay en 1891 lui valut une bourse de la Presidency pour la Grande-Bretagne, où il étudia le droit au St John's College de Cambridge, obtenant une licence et un diplôme de droit en 1895, et rentrant la même année en Inde avec un poste dans la fonction publique indienne (l'ICS).
hero.2=Il passa près de deux décennies dans l'ICS — comme magistrat et agent du fisc, puis comme juge, et enfin comme secrétaire adjoint au département des Finances du gouvernement de l'Inde — avant de démissionner en 1914 pour s'installer en Grande-Bretagne. Il y devint administrateur de la mosquée Shah Jehan de Woking et du fonds de la mosquée de l'East London, fut nommé CBE en 1917 pour son travail pendant la guerre, et enseigna l'hindoustani à la School of Oriental Studies. Il retourna en Inde dans les années 1920 et 1930 comme directeur de l'Islamia College de Lahore, et c'est au fil de ces années, après plus d'une décennie de travail, qu'il mit le Coran en anglais, accompagné de ses propres notes explicatives.
hero.3=La traduction parut en trente fascicules entre 1934 et 1937, le premier le 4 avril 1934, sous le titre "The Holy Qur'an: Text, Translation and Commentary", publié par Shaik Muhammad Ashraf de Lahore ; une édition réunie en un seul volume suivit en 1938, puis une édition révisée en 1939-1940. Avec celle de Pickthall, elle devint l'une des deux traductions anglaises du Coran les plus lues du XXe siècle, connue surtout pour l'ampleur de ses notes de bas de page, et a depuis été réimprimée, et par endroits retouchée par d'autres mains, dans une trentaine de tirages ultérieurs — dont une édition diffusée en Amérique du Nord par Amana Publications à partir de 1977 et une révision parrainée par l'Arabie saoudite dans les années 1980.
hero.4=Ce qui est numérisé ici, via alquran.cloud, est le texte même de la traduction et non le commentaire qui l'accompagne ; il est proposé dans ce corpus comme une seconde traduction anglaise d'accompagnement [[Q-AR|du texte arabe uthmani]], à côté de celle de [[Q-EN|Pickthall]] de 1930. Ce fut l'une des deux seules versions anglaises qu'un examen des traductions disponibles jugea sans ambiguïté libres d'usage — celle-ci et celle de Pickthall —, bien que "sans ambiguïté" demande ici une réserve : l'œuvre est dans le domaine public dans l'Union européenne et au Pakistan, où Yusuf Ali est mort et où l'œuvre fut d'abord publiée, mais un droit d'auteur de pure forme enregistré aux États-Unis en 1996 y serait valable jusqu'en 2033.

