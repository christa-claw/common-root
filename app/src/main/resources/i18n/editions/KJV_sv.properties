title=King James Version — Om denna utgåva | Common Root
description=King James Version från 1611: fyrtiosju översättare i sex sällskap, tillsagda att revidera Bishops' Bible i stället för att börja om — och i detta korpus den åttiobokstext som ännu bär de apokryfer som första tryckningen hade.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Det började som en eftergift vid ett möte om något annat. Vid Hampton Court-konferensen 1604, sammankallad av Jakob I för att höra puritanska klagomål om bönboken, väcktes förslaget om en ny översättning och kungen tog upp det. Fyrtiosju lärde utsågs och delades i sex sällskap — två i Westminster, två i Oxford, två i Cambridge — vart och ett med sin del av Bibeln och en uppsättning regler att arbeta efter. Den första av dessa regler är den som betyder mest vid läsningen: de skulle följa Bishops' Bible från 1568 och ändra den bara så långt grundtexten krävde. Detta beställdes som en revision och inte som en ny översättning, och det läser sig som en. Robert Barker, kungens boktryckare, gav ut den färdiga boken i London 1611.
hero.2=Vad reglerna inte sade, och vad översättarna ändå gjorde, var att gång på gång sträcka sig bakom Bishops' Bible. Den engelska de ärvde var gjord av andra — framför allt Tyndale, och Genèvebibeln som en hel generation engelska läsare faktiskt ägde och läste hemma. Detta korpus noterar den skulden i stället för att lämna den åt inledningen: King James Versions förlagor är här [[GNV|Genèvebibeln]], med den mottagna grekiska texten och den masoretiska hebreiskan under. Öppna en stegpinne under en King James-vers, och det är Genève som kommer upp. De två ligger vers efter vers så nära varandra att den intressanta frågan upphör att vara om Genève användes och blir var 1611 års sällskap valde att avvika från den — vilket är något man nu kan se efter i stället för att ta på tro.
hero.3=En skillnad mellan denna King James och de flesta andra gäller vad som står i den. Texten här omfattar åttio böcker och 36 820 verser: Gamla och Nya testamentet och de fjorton apokryfiska böckerna tryckta däremellan, så som 1611 års volym tryckte dem. Nästan varje King James-bibel som säljs i dag har sextiosex. Korpuset behåller den längre formen, och verkan syns längs den kedja släktskapet noterar: [[GNV|Genèvebibeln]] har här sextiosex böcker, denna åttio, [[RV|Revised Version]] ovanför den åttio, och [[ASV|American Standard Version]] ovanför den sextiosex igen. Om en utgåva trycker apokryferna är ett beslut var och en har fattat för sig, och att ställa dem i samma spalt gör mönstret läsbart.
hero.4=Var noga med vad årtalet på kortet betyder. Det säger 1611, och det är översättningens år — det är inget påstående om vilken tryckning denna text är. Engelskan här är moderniserad i stavningen: Första Moseboken börjar ”In the beginning God created the heaven and the earth”, där 1611 års ark läste ”In the beginning God created the Heauen, and the Earth”. Detta är alltså King James så som senare tryckare standardiserade den, och just den tryckning den härstammar från är inte noterad — samma ärliga lucka som korpuset lämnar för [[FB1776|Biblia 1776]]. För att läsa översättarnas val gör det ingen skillnad; för att citera 1611 års bok som föremål gör det hela skillnaden. Lägg också märke till att detta inte är den utgåva ett engelskt gränssnitt öppnar: det är [[NIV|New International Version]], och King James är en man byter till.

