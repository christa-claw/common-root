title=Versión India Revisada — Acerca de esta edición | Common Root
description=La Versión India Revisada (IRV): una traducción hindi de la Biblia de 2019 publicada por Bridge Connectivity Solutions, con licencia CC BY-SA 4.0 — el texto en hindi con el que se abre este corpus de forma predeterminada.
heroHeading=Versión India Revisada
readerHref=/reader?c1.src=irvhin

hero.1=La Versión India Revisada es una traducción moderna de la Biblia al hindi, con derechos de autor de 2017 y 2019 a nombre de Bridge Connectivity Solutions Pvt. Ltd., una organización india de traducción bíblica y tecnología. Forma parte de una serie más amplia de "Versión India Revisada" que la misma editorial ha producido en paralelo en varios otros idiomas principales de la India —entre ellos el canarés, el tamil, el telugu y el asamés— cada una una Biblia completa en su propia escritura, publicada bajo la misma licencia abierta.
hero.2=El texto de Common Root procede de la distribución USFM de eBible.org de la IRV en hindi, catalogada allí como hin2017, en lugar de una copia digital anterior de la misma traducción que circulaba con el texto de las notas al pie pegado dentro de los versículos y con los nombres de los libros en hindi en vez de en inglés. Reingresar los datos desde esa fuente USFM corrigió ambos problemas antes de añadir esta edición aquí: este corpus mantiene los nombres de los libros en inglés internamente, en todas sus ediciones, sin importar el idioma propio de la Biblia.
hero.3=Aquí está escrita en escritura devanagari, como इंडियन रिवाइज़्ड वर्ज़न, y contiene el canon protestante estándar de 66 libros, sin libros deuterocanónicos.
hero.4=Es la única Biblia en hindi de este corpus, por lo que una interfaz en hindi se abre en ella de forma predeterminada.

