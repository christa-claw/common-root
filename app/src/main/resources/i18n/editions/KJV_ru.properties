title=King James Version — Об этом издании | Common Root
description=King James Version 1611 года: сорок семь переводчиков в шести комиссиях, которым велено было исправлять Bishops' Bible, а не начинать заново, — и в этом собрании восьмидесятикнижный текст, всё ещё несущий апокрифы первого издания.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Всё началось как уступка на собрании, созванном по другому поводу. На Хэмптон-Кортской конференции 1604 года, созванной Яковом I, чтобы выслушать пуританские жалобы на молитвенник, прозвучало предложение о новом переводе, и король его подхватил. Сорок семь учёных были назначены и разделены на шесть комиссий — две в Вестминстере, две в Оксфорде, две в Кембридже, — каждой досталась своя часть Библии и свод правил, по которым работать. Первое из этих правил важнее всего при чтении: им следовало держаться Bishops' Bible 1568 года и менять её лишь настолько, насколько того требовал подлинник. Работа заказывалась как пересмотр, а не как новый перевод, и читается она именно так. Роберт Баркер, королевский печатник, выпустил готовую книгу в Лондоне в 1611 году.
hero.2=Чего правила не говорили, а переводчики всё же делали, — так это раз за разом тянулись за Bishops' Bible вглубь. Английский, который они унаследовали, был сделан другими: прежде всего Тиндейлом и Женевской Библией, которой целое поколение английских читателей действительно владело и которую читало дома. Это собрание записывает этот долг, а не оставляет его предисловию: основой King James Version здесь значится [[GNV|Женевская Библия]], а под нею — принятый греческий текст и масоретский еврейский. Откройте ступень родословия под стихом King James — и поднимется Женева. Стих за стихом они настолько близки, что интересным становится не вопрос, пользовались ли Женевой, а вопрос, где комиссии 1611 года решили от неё отойти, — и на это теперь можно посмотреть, а не принимать на веру.
hero.3=Одно отличие этой King James от большинства прочих касается того, что в ней есть. Текст здесь насчитывает восемьдесят книг и 36 820 стихов: Ветхий и Новый Заветы и четырнадцать книг апокрифов, напечатанных между ними, как их печатал том 1611 года. Почти в каждой King James, продаваемой сегодня, шестьдесят шесть. Собрание сохраняет более длинный состав, и следствие видно вдоль записанной цепи: в [[GNV|Женевской Библии]] здесь шестьдесят шесть книг, в этой восемьдесят, в [[RV|Revised Version]] над нею восемьдесят, а в [[ASV|American Standard Version]] над той снова шестьдесят шесть. Печатать ли апокрифы — решение, которое каждое издание принимало само, и постановка их в один столбец делает узор читаемым.
hero.4=Будьте точны в том, что означает год на карточке. Там стоит 1611, и это дата перевода, а не утверждение о том, каким изданием является этот текст. Английский здесь осовременен в написании: Бытие начинается «In the beginning God created the heaven and the earth», тогда как листы 1611 года читали «In the beginning God created the Heauen, and the Earth». Итак, это King James в том виде, в каком её упорядочили позднейшие печатники, а то самое издание, от которого она происходит, не записано — тот же честный пробел, какой собрание оставляет для [[FB1776|Biblia 1776]]. Для чтения решений переводчиков это ничего не меняет; для цитирования книги 1611 года как предмета — меняет всё. Заметьте также, что это не то издание, с которого открывается английский интерфейс: это [[NIV|New International Version]], а King James — то, на которое переключаются.

