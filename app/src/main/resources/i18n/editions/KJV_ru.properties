fact.7.value=восемьдесят книг и 36 820 стихов — с апокрифами, как их имело издание 1611 года, тогда как большинство нынешних King James печатают шестьдесят шесть
fact.8.label=Год на карточке
fact.8.value=1611 — год перевода, а не издания этого текста; написание здесь осовремененное, и от какого издания текст происходит, не записано
fact.9.label=В этом собрании
fact.9.value=ступень между [[GNV|Женевой]] и [[RV|Revised Version]] в английской цепи, спускающейся к [[WLC|масоретскому еврейскому тексту]] и [[TR|греческому]]; не английское издание по умолчанию, каковым является [[NIV|New International Version]]
