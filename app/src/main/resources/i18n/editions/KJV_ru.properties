fact.5.value=1611 год, Лондон, у Роберта Баркера, королевского печатника
fact.6.label=Записанные основы
fact.6.value=[[GNV|Женевская Библия 1599 года]], а на полу языков оригинала [[TR|Textus Receptus]] и [[WLC|Вестминстерский Ленинградский кодекс]], помеченные ≈, ибо они свидетели тех текстов, а не собственные экземпляры переводчиков
