title=Klementiininen Vulgata — Tietoja tästä laitoksesta | Common Root
description=Klementiininen Vulgata: Hieronymuksen latinankielisen Raamatun paavillinen tarkistus, painettu Roomassa 1592 ja julkaistu korjattuna uudelleen 1593 ja 1598 — katolisen kirkon latinalainen vakioteksti vuoteen 1979 asti, ja tässä lukijassa askelma Vulgatan yläpuolella.
heroHeading=Klementiininen Vulgata
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=Vuonna 1546 Trenton kirkolliskokous julisti Vulgatan kirkon autenttiseksi latinalaiseksi Raamatuksi, mikä jätti auki kysymyksen, johon se ei vastannut: mikä Vulgata? Yksitoista vuosisataa käsin kopioimista oli jättänyt jälkeensä käsikirjoituksia, joista kaksi ei ollut täysin samanlaista, ja Trento pyysi korjattua tekstiä. Paavi Sixtus V toimitti sellaisen vuonna 1590, suurelta osin itse tarkistamanaan, bullan saattelemana, joka julisti sen autenttiseksi. Hän kuoli saman vuoden elokuussa, ja muutamassa viikossa kardinaalit olivat pysäyttäneet sen myynnin. Klemens VIII:n aikana komissio — toimittajien joukossa Francisco de Toledo, työn keskiössä Robert Bellarmino — laati sen korvaajan, joka painettiin Roomassa 1592. Pienemmät uusintapainokset 1593 ja 1598 poistivat suurimman osan sen painovirheistä ja lisäsivät Hieronymuksen esipuheet ja reunaviitteet.
hero.2=Tämä teksti oli katolisen kirkon latinalainen vakioraamattu lähes neljän vuosisadan ajan, aina vuoden 1979 Nova Vulgataan asti, ja vuoden 1962 messukirja ja breviaari käyttävät sitä yhä. Se on Hieronymuksen Raamattu sellaisena kuin kirkko oli sen vastaanottanut, ei sellaisena kuin hän sen jätti. Psalmit ovat hänen gallikaaninen psalttarinsa, kreikasta tarkistettu, eivät hänen myöhempi käännöksensä hepreasta, joten ne säilyttävät kreikkalaisen numeroinnin: psalmi 22 alkaa tässä sanoin ”Dominus regit me”, paimenpsalmi. Kohdassa 1. Joh. 5:7 se sisältää niin sanotun Comma Johanneumin, ”Pater, Verbum, et Spiritus Sanctus”, latinalaisen lisäyksen, jota varhaisissa kreikkalaisissa käsikirjoituksissa ei ole. Ester ja Daniel ovat pidemmässä muodossaan, ja kreikkalaiset lisäykset on koottu Esterin loppuun ja Danielin kahdeksi viimeiseksi luvuksi. eBible.orgin tiedosto, josta tämä kappale on peräisin, painaa vuoden 1598 tekstin Glossa Ordinarian kanssa huomautuksina — Anselm Laonilaisen koulukunnan kahdennellatoista vuosisadalla laatima kommentaari, Mignen vuoden 1880 laitoksena. Huomautukset eivät tulleet aineistoon; joidenkin jakeiden hakasulkeet ovat lähteen omia.
hero.3=Tässä lukijassa se on askelma, jolla on yksi kirjattu edeltäjä, latinalainen Vulgata: avaa askelma minkä tahansa sen jakeen alta, ja Vulgata ilmestyy. Odota niiden kuulostavan lähes sanasta sanaan samalta. Tämän aineiston Vulgata on itsekin otettu klementiinisestä tekstistä, joten niitä erottavat lähinnä välimerkit — ja kirjat, jotka tästä kappaleesta puuttuvat. Kirjoja on 66, protestanttisen kaanonin kirjat, Ester ja Daniel pidemmässä muodossaan. Lähdetiedostoissa ovat myös Tobit, Judit, Viisauden kirja, Siirakin kirja, Baruk ja kaksi Makkabealaiskirjaa, jotka kaikki alla olevassa Vulgatassa ovat; yksikään ei tullut mukaan, joten siellä missä Vulgatassa on Tobit, sen yläpuolella ei ole mitään. Manassen rukous sekä 3. ja 4. Esran kirja, jotka klementiininen laitos painoi liitteeseen, eivät ole lähteessä eivätkä aineistossa. Mikään aineistossa ei puolestaan seiso tämän laitoksen päällä.

