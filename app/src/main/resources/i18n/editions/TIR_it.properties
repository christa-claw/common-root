title=Jami` at-Tirmidhi — Su questa edizione | Common Root
description=Jami` at-Tirmidhi: la raccolta di hadith che Abu Isa at-Tirmidhi costruì classificando apertamente la forza di ogni racconto e registrando gli argomenti giuridici che i giuristi ne trassero — contata fra i Sei Libri dell'islam sunnita.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi nacque verso l'anno 209 dell'Egira (824 d.C.) vicino a Termez, nel Khorasan, in quello che oggi è il confine tra Uzbekistan e Afghanistan. Iniziò a studiare hadith verso i venti anni e viaggiò, a partire dall'anno 235 dell'Egira, attraverso il Khorasan, l'Iraq e l'Hijaz in loro ricerca, studiando principalmente con Muhammad al-Bukhari — il suo principale maestro — e inoltre con Muslim ibn al-Hajjaj, Abu Dawud al-Sijistani, Qutaybah ibn Sa'id e Ali ibn Hujr. Divenne cieco negli ultimi anni di vita, da cui deriva il suo soprannome "ad-Darir" ("il Cieco"). Tornò nella zona di Termez, dove morì il 13 di rajab dell'anno 279 dell'Egira (9 ottobre 892 d.C.) a circa settant'anni.
hero.2=Il suo titolo completo, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, è di norma abbreviato in Jami' at-Tirmidhi o Sunan at-Tirmidhi. Mentre il Sahih al-Bukhari e il Sahih Muslim ammettono solo hadith che i loro compilatori giudicarono pienamente autentici, at-Tirmidhi classificava apertamente ogni hadith all'interno del testo stesso — sahih, hasan, da'if o gharib — e spiegava le ragioni di una classificazione più debole, invece di omettere l'hadith; esponeva inoltre i punti su cui le scuole giuridiche (madhahib) divergevano e le prove invocate da ciascuna parte, il che rende il libro tanto una guida al ragionamento giuridico fondato sugli hadith quanto una raccolta di hadith in sé.
hero.3=La tradizione sunnita lo colloca fra i Sei Libri, generalmente dopo il Sahih al-Bukhari, il Sahih Muslim e il Sunan Abi Dawud; dove esattamente esso si collochi fra i libri restanti — e quale raccolta occupi il sesto posto, essendo il Sunan Ibn Majah la risposta più comune ma non l'unica proposta storicamente — è da lungo tempo discusso senza essere stato risolto, come per le altre raccolte Sunan di questo corpus. Il numero di hadith indicato per il libro varia per la stessa ragione: circa 4.330 secondo il computo tradizionale, citato altrove come circa 4.400; anche la sua struttura è descritta in modi diversi, come 46 libri, 49 capitoli nell'edizione del Cairo di Ahmad Muhammad Shakir, o cinquanta capitoli. La cifra propria di questo corpus è ancora un'altra cifra: 49 libri e 3.998 hadith numerati, la forma dell'edizione digitale da cui è stata tratta, non la pretesa di riprodurre una particolare tradizione a stampa.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-tirmidhi di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il Sahih al-Bukhari, il Sahih Muslim, il Sunan Abi Dawud e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Abu Isa Muhammad ibn Isa at-Tirmidhi (209–279 dell'Egira / 824–892 d.C.)
fact.3.label=Titolo
fact.3.value=noto come Jami' at-Tirmidhi o Sunan at-Tirmidhi; titolo completo al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal
fact.4.label=Compilato
fact.4.value=raccolto durante viaggi attraverso il Khorasan, l'Iraq e l'Hijaz, iniziati verso l'anno 235 dell'Egira; at-Tirmidhi morì vicino a Termez nell'anno 279 dell'Egira (892 d.C.)
fact.5.label=Metodo
fact.5.value=classifica apertamente ogni hadith come sahih, hasan, da'if o gharib e ne spiega le ragioni quando la classificazione è più debole, ed espone i punti su cui le scuole giuridiche divergono e le prove invocate da ciascuna — invece di ammettere solo hadith giudicati pienamente autentici, come fanno il [[BUK|Sahih al-Bukhari]] e il [[MUS|Sahih Muslim]]
fact.6.label=Posizione
fact.6.value=contato fra i Sei Libri dell'islam sunnita (Kutub al-Sitta), generalmente dopo il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]] e il [[ABD|Sunan Abi Dawud]]; la sua posizione esatta fra i libri restanti, e quale occupi il sesto posto, è discussa piuttosto che risolta
fact.7.label=Numero di hadith
fact.7.value=circa 4.330 secondo il computo tradizionale, citato altrove come circa 4.400; anche la sua struttura è descritta in modi diversi, come 46 libri, 49 capitoli nell'edizione del Cairo di Ahmad Muhammad Shakir, o cinquanta capitoli
fact.8.label=In questo corpus
fact.8.value=49 libri e 3.998 hadith numerati — la forma dei dati di origine stessi, non una riproduzione di una particolare tradizione a stampa
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-tirmidhi di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione pubblicata discenda non è ancora stato stabilito da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
