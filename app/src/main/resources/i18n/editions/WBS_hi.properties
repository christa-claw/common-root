fact.7.label=इस संग्रह में
fact.7.value=66 पुस्तकें, पूरा प्रोटेस्टेंट धर्मसूत्र, अपोक्रिफ़ा के बिना; अंग्रेज़ी अध्याय और आयत क्रमांकन, इसलिए भजन 150 हैं और हर भजन का शीर्षक उसकी पहली आयत में मिला दिया गया है
fact.8.label=वंश
fact.8.value=कोई दर्ज जनक नहीं, और इस पर टिका कुछ दर्ज नहीं — पायदान सीधे मूल-भाषाओं के तल पर खुलता है, पुराने नियम में [[WLC|लेनिनग्राद कोडेक्स]] और नए नियम में [[TR|टेक्स्टस रिसेप्टस]] पर, यद्यपि वेबस्टर ने जिस पाठ का संशोधन किया वह [[KJV|King James Version]] है
