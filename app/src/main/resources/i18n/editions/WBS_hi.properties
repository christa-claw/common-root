title=Webster's Bible — इस संस्करण के बारे में | Common Root
description=नोआ वेबस्टर द्वारा 1833 में किया गया King James Version का संशोधन, जो न्यू हेवन, कनेक्टिकट में प्रकाशित हुआ — प्रचलित अंग्रेज़ी बाइबल लगभग शब्दशः बनाए रखी गई, अप्रचलित शब्द बदले गए, व्याकरण सुधारा गया और ऊँचे स्वर में पढ़ने के लिए कुछ अभिव्यक्तियाँ कोमल की गईं।
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=न्यू हेवन के कोशकार नोआ वेबस्टर (1758–1843) को सबसे बढ़कर 1828 के An American Dictionary of the English Language के लिए याद किया जाता है। पाँच वर्ष बाद उन्होंने स्पष्ट, शुद्ध और समकालीन अंग्रेज़ी के प्रति वही चिंता उस बाइबल पर लगाई जिसे उनका देश वास्तव में पढ़ता था। 1833 में न्यू हेवन के Durrie and Peck ने The Holy Bible … in the Common Version, with Amendments of the Language प्रकाशित की, जिसकी प्रस्तावना पर उसी वर्ष सितंबर में हस्ताक्षर हुए थे। यह कोई नया अनुवाद नहीं है। वेबस्टर ने 1611 का King James Version — “प्रचलित संस्करण” — जैसा वह तब छपता था वैसा ही लिया, और उसे केवल वहीं बदला जहाँ उसकी अंग्रेज़ी अस्पष्ट या व्याकरण-विरुद्ध हो गई थी। उन्होंने लिखा कि अपने संशोधन करते समय उन्होंने मूल भाषाओं से परामर्श किया, पर संस्करण की सामान्य शैली नहीं बदलनी चाहिए, और कि उन्होंने जान-बूझकर ऐसा कोई अंश नहीं बदला जिस पर कोई संप्रदाय अपना सिद्धांत टिकाता हो।
hero.2=उनकी प्रस्तावना तीन प्रकार के परिवर्तन गिनाती है। पूरी तरह अप्रचलित हो चुके शब्दों ने प्रचलित शब्दों के लिए स्थान छोड़ा: जहाँ King James में “wotteth not” है, वहाँ यूसुफ़ का स्वामी घर में क्या है यह “knoweth not” (उत्पत्ति 39:8), और प्रेरितों के काम 12:4 में हेरोदेस पतरस को “after Easter” नहीं, “after the passover” लोगों के सामने लाना चाहता है। व्याकरण को वेबस्टर के समय के प्रयोग के अनुरूप किया गया: व्यक्तियों के लिए “which” के स्थान पर “who”, जिससे प्रभु की प्रार्थना “Our Father who art in heaven” से आरंभ होती है, और वस्तुओं के लिए “his” के स्थान पर “its”, जिससे उत्पत्ति 1 के पौधे “after its kind” बीज लाते हैं। इसके अतिरिक्त, कुछ थोड़े-से शब्द, जिन्हें वे मिश्रित श्रोताओं के सामने ऊँचे स्वर में पढ़े जाने के अयोग्य समझते थे, कोमल शब्दों से बदले गए। उन्होंने यह भी किया कि जहाँ King James में “Holy Ghost” है वहाँ “Holy Spirit” लिखा, और हमारी प्रति में एक भी “Holy Ghost” नहीं है। इसके आगे संशोधन हल्का है: अधिकांश पाठक अध्याय पर अध्याय पढ़ते जा सकते हैं और उन्हें पता भी न चले कि वे King James के पाठ से हट चुके हैं।
hero.3=हमारी प्रति पूरी है: उत्पत्ति से प्रकाशितवाक्य तक 66 पुस्तकें, अपोक्रिफ़ा के बिना, अंग्रेज़ी अध्याय और आयत क्रमांकन में — 150 भजन, जिनमें हर भजन का शीर्षक उसकी पहली आयत में मिला दिया गया है, और मलाकी जो अध्याय 4 पर समाप्त होती है। King James की तरह यह स्वीकृत पाठ के वे अंश बनाए रखती है जिन पर बाद के आलोचनात्मक संस्करण प्रश्न उठाते हैं: मरकुस का लंबा अंत, प्रेरितों के काम 8:37, और 1 यूहन्ना 5:7 में स्वर्ग के तीन गवाह। इस पाठक में यह अपने आप में खड़ी है। यद्यपि यह King James Version का संशोधन है, जो इस संग्रह में भी है, संग्रह इसके लिए कोई जनक दर्ज नहीं करता, इसलिए इसकी किसी आयत के नीचे खोला गया वंश-पायदान उस अंग्रेज़ी पाठ पर नहीं जिस पर वेबस्टर ने वास्तव में काम किया, बल्कि सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर गिरता है: पुराने नियम में लेनिनग्राद कोडेक्स और नए नियम में टेक्स्टस रिसेप्टस। इस पर टिका हुआ भी कुछ दर्ज नहीं है। कोई अंतरफलक भाषा इस संस्करण पर नहीं खुलती; अंग्रेज़ी अंतरफलक New International Version पर खुलता है, और इस संस्करण तक अनुवाद-ग्रिड में इसके अपने कार्ड से पहुँचा जाता है। दूसरे स्तंभ में King James के बगल में रखने पर यह वेबस्टर के संशोधन आयत-दर-आयत दिखाती है।

