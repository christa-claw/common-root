fact.3.label=किसका संशोधन
fact.3.value=1611 का [[KJV|King James Version]], “प्रचलित संस्करण”, जैसा वह तब छपता था — नए सिरे से अनूदित नहीं, अंग्रेज़ी में संशोधित, यद्यपि वेबस्टर ने अपने संशोधनों के लिए इब्रानी और यूनानी से परामर्श किया
fact.4.label=संशोधन का प्रकार
fact.4.value=हल्का और संयमित: अप्रचलित शब्दों के स्थान पर प्रचलित शब्द; व्याकरण सुधारा गया, व्यक्तियों के लिए “who” और वस्तुओं के लिए “its”; ऊँचे स्वर में पढ़ने के अयोग्य समझे गए कुछ शब्द कोमल किए गए; “Holy Ghost” के स्थान पर “Holy Spirit”; शैली और सैद्धांतिक अंश जान-बूझकर जैसे थे वैसे छोड़े गए
fact.5.label=प्रकाशन
