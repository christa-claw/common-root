title=Yorumsuz Türkçe Çeviri — על המהדורה הזו | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): מקרא טורקי מודרני, שתורגם מ-World English Bible בידי איסמאעיל סרינקן בשיתוף עם eBible.org, ברישיון CC BY-ND 4.0 — הטקסט הטורקי שבו נפתח אוסף זה כברירת מחדל.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — שפירושה המילולי תרגום טורקי "בלתי מפורש" או "בלא פירוש" — הוא מקרא טורקי מודרני שהושלם בידי איסמאעיל סרינקן בשיתוף עם eBible.org, עם זכויות יוצרים מתוארכות 2023 עד 2025. השם עצמו מצהיר את השיטה: תרגום פשוט, מילה-במילה, המשמיט בכוונה פירושים מסבירים ותרגום-פרפרזה, ומעדיף שקיפות כלפי הטקסט הבסיסי על פני ניסוח אידיומטי מוחלק.
hero.2=הטקסט הבסיסי הזה הוא, בכנות, אנגלית ולא עברית, ארמית או יוונית: עמוד זכויות היוצרים של התרגום עצמו מתאר אותו כמועבר מ-World English Bible, מה שעושה אותו לתרגום משני ולא לתרגום שנעשה ישירות מהלשונות המקוריות, בשונה מרוב המקראות האחרים באוסף זה. Common Root חיפש תחילה מהדורה חופשית של המקרא הטורקי ההיסטורי משנת 1941 (Kitabı Mukaddes), שכיום די ישן כדי להיות נחלת הכלל בטורקיה, אך לא נמצא עבורו מקור דיגיטלי שמיש; Yorumsuz Türkçe Çeviri היה המקרא הטורקי היחיד שהיה זמין ברישיון חופשי. הטקסט של אוסף זה מגיע מהפצת ה-USFM של eBible.org, המקוטלגת שם בשם turytc.
hero.3=בחירות התרגום שלו נושאות אופי עכשווי ולא מסורתי: הוא מעביר את שמו הפרטי של אלוהים כ-Yahve במקום ה"RAB" או ה"Yehova" הטורקיים הנהוגים, בהתבסס על שמות 3:14-15, ומעביר את שם ישוע כ-Yeşua במקום ה-İsa הטורקי המוכר, ומשאיר שמות עצם אחרים בצורתם הרגילה. הוא עוקב אחר הקנון הפרוטסטנטי הרגיל של 66 ספרים, בלי ספרים דויטרוקנוניים.
hero.4=הוא המקרא הטורקי היחיד באוסף זה, כך שמנשק טורקי נפתח עליו כברירת מחדל.

