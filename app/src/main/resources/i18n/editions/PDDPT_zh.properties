title=Palabra de Dios para Ti — 关于此版本 | Common Root
description=Palabra de Dios para Ti：Asociación Bíblica Latinoamericana 于2020年出版的西班牙文译本，保留希伯来文神名的音译形式，并以可供任何用途的自由授权发布。
heroHeading=Palabra de Dios para Ti
readerHref=/reader?c1.src=pddpt

# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti——意为"赐给你的神之道"——是一部新的西班牙文译本，由 Asociación Bíblica Latinoamericana 于2020年出版；电子文本于2022年经由 Latinamerican Textual Bible Foundation, Inc.（一家在佛罗里达州注册的非营利机构）发布，在 eBible.org 与 YouVersion 上流通。译事归于弗朗西斯科·列瓦诺与乔伊斯·列瓦诺名下。与本语料库西班牙文界面默认打开的雷纳-瓦莱拉一系不同，它并非卡西奥多罗·德·雷纳十六世纪译本或其任何衍生本的修订，而是一部独立译本，直接译自原文语言，面向整个西班牙语美洲的普通读者，旨在可被自由引用，无需征得许可。
hero.2=旧约依据 Biblia Hebraica Stuttgartensia，新约依据艾伯哈特·内斯特莱《新约希腊文本》第27版。有一个选择使其文本有别于雷纳之后的大多数西班牙文圣经：那些版本将四字神名译作"Jehová"或代以"Señor"，而 Palabra de Dios para Ti 保留希伯来文神名本身的音译形式——Yavé、ʼElohim、ʼEL-Shadday——因此《创世记》以此版本自己的措辞开篇："En un principio ʼElohim creó los cielos y la tierra."
hero.3=在本阅读器中，它是四种西班牙文版本之一，与 [[RVR09|Reina-Valera 1909]]、[[BES|Biblia en Español Sencillo]] 及 [[VBL|Versión Biblia Libre]] 并列。界面仍默认打开雷纳-瓦莱拉1909；此本是从其自身卡片切换而至的版本。与另外两者一样，它是新译本而非本库所收任何其他文本的修订，故谱系阶梯中未为其记录母本——在其某节之下展开的阶梯会径直落到以 ≈ 标记的原文语言底层。Asociación Bíblica Latinoamericana 也发行一部收录次经书卷的更完整印刷版；本语料库所收的文本是通常的六十六卷新教正典。

