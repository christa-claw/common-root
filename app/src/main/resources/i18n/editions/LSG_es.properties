title=Louis Segond 1910 (francés) — Acerca de esta edición | Common Root
description=La Biblia Segond en su revisión de 1910: la traducción de un pastor ginebrino desde el hebreo y el griego, impresa completa por primera vez en 1880, revisada para la Sociedad Bíblica Británica y Extranjera y durante un siglo la Biblia corriente de los protestantes francófonos.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond nació en 1810 en Plainpalais, entonces a las puertas de Ginebra, y murió en Ginebra en 1885. Estudió teología en la facultad protestante de Estrasburgo, se doctoró en teología a los veintiséis años y fue durante veinticuatro años pastor de la parroquia aldeana de Chêne-Bougeries antes de pasar a enseñar hebreo y Antiguo Testamento. La Venerable Compañía de Pastores de Ginebra le encargó traducir de nuevo el Antiguo Testamento desde el hebreo, y su versión apareció en una edición fechada en 1874. Después tradujo por iniciativa propia el Nuevo Testamento, a partir del texto griego crítico de Constantin Tischendorf y no del Textus Receptus, y en 1880 salió la Biblia entera en un solo volumen, impresa en Oxford.
hero.2=Este no es exactamente el texto que publicó Segond. Tras su muerte, la Sociedad Bíblica Británica y Extranjera lo hizo revisar por un grupo de pastores y teólogos franceses y suizos, y la revisión apareció en 1910. Sus cambios se inclinaron hacia el vocabulario de la ortodoxia protestante — los sacerdotes pasaron a ser «sacrificateurs», la vieja palabra protestante, y no «prêtres»; en esta copia «sacrificateur» está por todas partes y «prêtre» es raro. Fue este texto de 1910 el que se convirtió en la Biblia de referencia del protestantismo francés durante la mayor parte del siglo XX, y sigue entre las más leídas por los evangélicos francófonos. Tiene además una larga familia de revisiones posteriores: la «Colombe» de 1978, la Nouvelle Édition de Genève de 1979 y la Segond 21 en 2007. Algunos rasgos se ven en casi cada página. El nombre divino es «l'Éternel», el Eterno, como en Ostervald y en el Darby francés que está a su lado en este corpus: «L'Éternel est mon berger» en el Salmo 23. E Isaías 7:14 dice «la jeune fille deviendra enceinte» — la joven, no la virgen —, justo el tipo de versión por el que algunos protestantes conservadores acusaron a Segond de debilitar las profecías mesiánicas.
hero.3=En los Salmos el libro sigue al hebreo: la numeración es la hebrea, de modo que el Salmo 23 es el del pastor, y donde el título de un salmo es un versículo en hebreo también lo es aquí — el Salmo 51 tiene 21 versículos, dos más que en la King James Version. Joel y Malaquías, en cambio, conservan la división en capítulos de la tradición latina e inglesa, tres capítulos y cuatro. En este lector es una de tres Biblias francesas, junto a Ostervald y el Darby francés. Una interfaz en francés no abre en ella: el francés no tiene elección curada, así que el lector toma la primera Biblia francesa en el orden del catálogo, que es Darby. En los peldaños de linaje no consta antecedente alguno, de modo que un peldaño abierto bajo un versículo baja derecho al suelo de lenguas originales marcado con ≈ — para el Antiguo Testamento el Códice de Leningrado, un manuscrito de la tradición masorética y no un hebreo impreso de la época de Segond, y para el Nuevo el Textus Receptus, que es precisamente el griego que él decidió no seguir. Su peldaño lleva el año 1910.

