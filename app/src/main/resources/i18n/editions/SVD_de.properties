title=Smith & Van Dyck — Über diese Ausgabe | Common Root
description=Die arabische Bibel von Smith und Van Dyck: von Eli Smith in Beirut begonnen, 1865 von Cornelius Van Dyck vollendet, unter Mitarbeit der Nahda-Gelehrten Butrus al-Bustani, Nasif al-Yaziji und Yusuf al-Asir — bis heute die meistgelesene arabische Bibel.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=Die amerikanische Mission in Beirut begann diese Übersetzung um 1847, und wer sie anfing, hat sie nicht beendet. Eli Smith hatte zwei Jahrzehnte in der Levante verbracht und beherrschte die Sprache gut genug, um über sie zu streiten; er arbeitete bis zu seinem Tod 1857 an dem Text. Cornelius Van Alen Van Dyck übernahm und führte sie zu Ende — das Neue Testament 1860 fertig, das Alte fünf Jahre später, 1865. Die beiden Namen auf dem Buch sind die beiden Hälften einer einzigen Arbeit.
hero.2=Die Namen, die nicht auf dem Rücken stehen, wiegen ebenso schwer. Van Dyck hatte sein Arabisch bei Butrus al-Bustani und Nasif al-Yaziji gelernt, und beide arbeiteten mit ihm an der Übersetzung, ebenso der Schaich Yusuf al-Asir, der das Arabische auf Wendung und Stil durchging. Diese drei waren keine Gehilfen eines Missionsunternehmens. Sie zählten zu den Hauptgestalten der Nahda, der arabischen literarischen Erneuerung, und was dabei herauskam, liest sich als arabische Prosa und nicht als eine in arabische Kleider gesteckte Übersetzung. Darum überlebte das Buch die Mission, die es bezahlt hatte.
hero.3=Es war eine drucktechnische Leistung so gut wie eine gelehrte. Die American Press in Beirut setzte es in einer für die Mission geschnittenen arabischen Schrift, die 1843 fertig wurde — jener Type, die noch immer al-Amerikani heißt und an deren Gestalt Smith mitgewirkt hatte. Arabisch ist schwer gut zu setzen — die Buchstaben binden sich aneinander und ändern dabei ihre Form —, und eine Bibel, die auf der Seite richtig aussah, tat für ihre Aufnahme mehr, als Argumente vermocht hätten. Millionen Exemplare sind seither hinausgegangen, an protestantische wie an koptische Leser, und für die meisten arabischsprachigen Christen klingt die Bibel schlicht so.
hero.4=In diesem Leser ist sie die einzige arabische Bibel, und das entscheidet ihr Verhalten. Stellt man die Oberfläche auf Arabisch, öffnet sich diese — nicht weil sie gewählt wurde, wie die Reina-Valera 1909 für das Spanische gewählt wurde, sondern weil der Katalog eine Bibel in der Sprache der Oberfläche sucht und genau eine findet. Sie ist zudem eine von nur zwei Ausgaben hier, deren Text von rechts nach links läuft; die andere ist die neuhebräische Bibel. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden fällt — was hier näher trifft als sonst, denn das Griechische, das dieser Boden beistellt, ist der Textus Receptus, und aus dem Textus Receptus ist ihr Neues Testament gemacht.

