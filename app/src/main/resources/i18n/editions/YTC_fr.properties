title=Yorumsuz Türkçe Çeviri — À propos de cette édition | Common Root
description=Yorumsuz Türkçe Çeviri (YTC) : une bible turque moderne, traduite de la World English Bible par İsmail Serinken en collaboration avec eBible.org, sous licence CC BY-ND 4.0 — le texte turc sur lequel ce corpus s'ouvre par défaut.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — littéralement une traduction turque « sans commentaire » ou « non glosée » — est une bible turque moderne achevée par İsmail Serinken en collaboration avec eBible.org, sous droits d'auteur datés de 2023 à 2025. Le nom lui-même énonce la méthode : un rendu simple, mot à mot, qui exclut délibérément les gloses explicatives et la paraphrase interprétative, préférant la transparence envers le texte sous-jacent à un idiome lissé.
hero.2=Ce texte sous-jacent est, en toute honnêteté, l'anglais plutôt que l'hébreu, l'araméen ou le grec : la page de droits d'auteur de la traduction elle-même la décrit comme rendue à partir de la World English Bible, ce qui en fait une traduction secondaire plutôt qu'une traduction faite directement des langues originales, à la différence de la plupart des autres bibles de ce corpus. Common Root a d'abord cherché une édition ouverte de la bible turque historique de 1941 (Kitabı Mukaddes), désormais suffisamment ancienne pour être dans le domaine public en Turquie, mais aucune source numérique utilisable n'a pu en être trouvée ; la Yorumsuz Türkçe Çeviri était la seule bible turque disponible sous licence ouverte. Le texte de ce corpus provient de la distribution USFM d'eBible.org, cataloguée là-bas comme turytc.
hero.3=Ses choix de rendu portent une empreinte contemporaine plutôt que traditionnelle : elle rend le nom personnel de Dieu par Yahve plutôt que par le « RAB » ou « Yehova » turc habituel, en citant Exode 3.14-15, et rend le nom de Jésus par Yeşua plutôt que par l'İsa turc familier, tout en laissant les autres noms propres sous leur forme ordinaire. Elle suit le canon protestant standard de 66 livres, sans livres deutérocanoniques.
hero.4=C'est la seule bible turque de ce corpus, si bien qu'une interface turque s'ouvre sur elle par défaut.

