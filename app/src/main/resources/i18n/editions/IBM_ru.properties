title=Сунан Ибн Маджа — Об этом издании | Common Root
description=Сунан Ибн Маджа: последняя из Шести книг суннитского ислама, упорядоченная по правовой теме, чьё место среди них долго было спорным из-за также встречающихся в ней слабых и подделанных хадисов.
heroHeading=Сунан Ибн Маджа
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Абу Абдуллах Мухаммад ибн Язид Ибн Маджа аль-Раби'и аль-Казвини родился в 209 году хиджры (824 году н. э.) в Казвине, который сегодня находится на северо-западе Ирана, в семье мавали (неарабских клиентов) племени Раби'а — Маджа, по одному рассказу, было прозвищем его отца, а не именем деда или матери. Он путешествовал в поисках хадисов по Ираку, Хиджазу, Сирии и Египту, обучаясь у широкого круга учёных; более четверти его будущего Сунана, как говорят, восходит к одному учителю — Ибн Аби Шайбе. Современники, такие как Абу Я'ла аль-Халили, хвалили его как надёжного, видного и единодушно признанного авторитета. Он умер в Казвине в 273 году хиджры (887 году н. э.), хотя аль-Каттани также указывает 275 год (889 год н. э.); по традиционному рассказу, после того как Ибн Маджа прочитал ему завершённый Сунан, Абу Зур'а ар-Рази заметил, что если бы у людей была эта книга, прочие собрания Сунан стали бы во многом не нужны.
hero.2=Его Сунан насчитывает, по подсчёту аль-Дхахаби, около 1 500 глав и около 4 000 хадисов, упорядоченных по правовой теме, как и собрания [[ABD|Абу Дауда]] и [[TIR|ат-Тирмизи]]. Наряду с достоверным и приемлемым материалом в нём также содержатся хадисы, которые позднейшие учёные сочли слабыми, включая около тридцати, которые обычно считаются прямыми подделками, — причина, по которой некоторые учёные считают только «Пять», а не Шесть.
hero.3=Суннитская традиция помещает Сунан Ибн Маджи последней из Шести книг (Кутуб ас-Ситта), наряду с [[BUK|Сахихом аль-Бухари]], [[MUS|Сахихом Муслима]], [[ABD|Сунаном Абу Дауда]], [[TIR|Джами ат-Тирмизи]] и [[NAS|Сунаном ан-Насаи]]. Само это шестое место является спорным: маликиты и Ибн аль-Асир, среди прочих, называют вместо него [[MAL|Муватта Малика]], а некоторые называют Сунан ад-Даракутни; книга Ибн Маджи, как принято считать, заняла это место потому, что её содержание меньше всего перекрывается с остальными пятью, а не потому, что она считается самой надёжной из претендентов.
hero.4=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-ibnmajah сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]], [[MUS|Сахиха Муслима]], [[ABD|Сунана Абу Дауда]], [[TIR|Джами ат-Тирмизи]], [[NAS|Сунана ан-Насаи]] и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

