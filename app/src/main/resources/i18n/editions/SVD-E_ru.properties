title=Смит и Ван Дейк (текст eBible) — Об этом издании | Common Root
description=Арабская Библия Смита и Ван Дейка 1865 года в полностью огласованном электронном тексте, который eBible.org публикует как общественное достояние, по исходному файлу Американского библейского общества.
heroHeading=Смит и Ван Дейк — полностью огласованный текст
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Это тот же перевод, что и [[SVD|Смит и Ван Дейк]] — арабская Библия, которую начал Илай Смит в Бейруте и завершил Корнелиус Ван Дейк в 1865 году вместе с арабскими учёными Бутрусом аль-Бустани, Насифом аль-Языджи и Юсуфом аль-Асиром, — набранная по другому электронному файлу. Перевод тот же; файл — вот причина, по которой существует это издание.
hero.2=Библия 1865 года свободна для всех, но её электронная копия — тоже чей-то труд, и текст Ван Дейка расходится по сети во множестве копий неясного происхождения. Некоторые предлагаются с заявлением об авторском праве на саму транскрипцию. Текст, чьё происхождение невозможно проследить, нельзя печатать с уверенностью, поэтому это издание использует копию, чьё происхождение проследить можно: ту, что публикует eBible.org, объявленную общественным достоянием, называющую Сирийскую миссию переводчиком, а Американское библейское общество — предоставившим источник. Файл датирован 2020-08-03.
hero.3=Он полностью огласован. Каждое слово несёт свои краткие гласные и прочие знаки чтения, тогда как другой текст Ван Дейка в этой читалке в основном без огласовок. Это замедляет набор и облегчает чтение вслух, а огласованная страница требует больше места между строк, так что печатный экземпляр этого издания выходит длиннее того же текста без огласовок.
hero.4=Это издание стоит выбрать, когда вопрос в том, можно ли печатать текст. Для чтения с экрана подойдёт любой из двух текстов Ван Дейка.

