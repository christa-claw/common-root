title=Koran — uthmanischer Text — Über diese Ausgabe | Common Root
description=Der Koran in der Lesart Hafs nach Asim, dem Text, auf dem die meisten gedruckten Korane weltweit seit der Kairoer Ausgabe von 1924 beruhen — und in diesem Korpus ein Text, der Vers für Vers mit dem eigenen Exemplar des König-Fahd-Komplexes verglichen wurde und sich im Konsonantengerüst in sämtlichen seiner 6.236 Verse als übereinstimmend erwies.
heroHeading=Koran — uthmanischer Text
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=Die Lesart, auf der dieser Text beruht, hat eine benannte Überlieferungskette. Hafs ibn Sulaiman al-Kufi (gest. 796) überlieferte sie von seinem Lehrer Asim ibn Abi an-Najud, einem der Leser Kufas, dessen Rezitation Ibn Mujahid später unter die sieben kanonisierte (Asim starb 745). Hafs nach Asim — „Hafs, nach Asim" — ist eine von mehreren Lesarten, die Muslime für gleichermaßen autoritative Überlieferungen derselben Offenbarung halten; sie ist nicht die einzige, aber mit Abstand die am meisten gedruckte. Als ein Gremium von Al-Azhar-Gelehrten, das ab 1907 unter König Fuad I. arbeitete, den ägyptischen Standardkoran herstellte, den die Amiri-Druckerei in Bulaq am 10. Juli 1924 veröffentlichte, war es diese Lesart, die sie im Satz festlegten. Die meisten heute irgendwo verkauften Korane, einschließlich des eigenen des König-Fahd-Komplexes, folgen dem Vorbild jener Ausgabe.
hero.2=Was in diesem Korpus steht, stammt, über die Ausgabe quran-uthmani von alquran.cloud, aus der Digitalisierung desselben Hafs-Textes durch das Tanzil-Projekt. Es wird im Reader mit drei Übersetzungen gepaart: Pickthalls englischer von 1930, Yusuf Alis englischer von 1934 und Sablukows russischer von 1878 — öffnet man eine der drei neben diesem Text, erscheint ihre Wiedergabe unter jedem Vers. Der Reader bietet den Koran auch in zwei Reihenfolgen an: der kanonischen Mushaf-Abfolge, die dieselbe Tradition festlegte, und der Reihenfolge, die Gelehrte für den Zeitpunkt rekonstruieren, zu dem jede Sure offenbart wurde.
hero.3=Die buchstabengetreue Bewahrung ist selbst eine der Behauptungen, die über diesen Text aufgestellt werden, daher wird sie hier überprüft statt vorausgesetzt. Vers für Vers mit der eigenen Hafs-Ausgabe des König-Fahd-Komplexes für den Druck des ehrwürdigen Korans verglichen, stimmen beide Texte im Konsonantengerüst — den blanken Buchstaben, bevor irgendein Vokalzeichen hinzugefügt wird — in sämtlichen seiner 6.236 Verse überein. Jeder gefundene Unterschied beschränkt sich darauf, wie Vokale und Pausenzeichen notiert werden, auf die Schreibung des Hamza und auf acht Stellen, an denen die beiden Seiten die Wortgrenze unterschiedlich ziehen; keiner betrifft einen einzigen Buchstaben des Textes selbst. Das ist das Gegenteil der Unsicherheit, die dieses Korpus für die finnische Bibel von 1776 eingestehen muss, wo schlicht nicht bekannt ist, von welchem Druck der Text abstammt.
hero.4=Zwei Dinge, die diese Übereinstimmung nicht belegt, sollte man offen aussprechen. Es ist keine Behauptung der Abstammung — mit dem Text des Komplexes übereinzustimmen zeigt, dass beide derselbe Text sind, nicht, dass der eine vom anderen kopiert wurde. Und es ist keine Genehmigung: eine Ende August 2026 an den Komplex gesandte Anfrage, die um Erlaubnis bat, dessen eigene Riwayat-Dateien zu zeigen, war zum Zeitpunkt dieser Niederschrift nicht beantwortet worden. Der einzige Vers, bei dem der Vergleich selbst kurz eine Abweichung zeigte, 19:3, erwies sich als ein Fehler darin, wie die Referenzdatei gelesen wurde, nicht in einem der beiden Korane — korrigiert, stimmt er genau überein. Die Referenzkopie selbst ist eine Rekonstruktion der Textverarbeitungsdatei des Komplexes, nicht dessen offizielle digitale Veröffentlichung, und das ist der einzige Punkt, in dem dies nicht ganz ein Vergleich mit einem offiziell veröffentlichten Datensatz ist.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=koranisches Arabisch, in der standardisierten uthmanischen Orthographie
fact.2.label=Lesart (qira'ah)
fact.2.value=Hafs nach Asim — überliefert von Hafs ibn Sulaiman (gest. 796) von Asim ibn Abi an-Najud aus Kufa (gest. 745); eine der vierzehn anerkannten Überlieferungen, und jene, der die meisten gedruckten Korane weltweit folgen
fact.3.label=Standardisierte gedruckte Form
fact.3.value=die Kairoer Ausgabe von 1924 — ein Gremium von Al-Azhar-Gelehrten, das ab 1907 unter König Fuad I. arbeitete, gedruckt von der Amiri-Druckerei in Bulaq am 10. Juli 1924; das Vorbild, dem die meisten späteren Drucke folgen, einschließlich des eigenen des König-Fahd-Komplexes
fact.4.label=Hier verwendeter Text
fact.4.value=die Ausgabe quran-uthmani von alquran.cloud, deren arabischer Text aus der Digitalisierung des Tanzil-Projekts stammt
fact.5.label=Verglichen mit
fact.5.value=der eigenen Hafs-Ausgabe des König-Fahd-Komplexes für den Druck des ehrwürdigen Korans, Vers für Vers: stimmt im Konsonantengerüst in sämtlichen seiner 6.236 Verse überein, wobei jeder Unterschied auf Vokalnotation, Hamza-Schreibung und acht Fälle der Worttrennung beschränkt bleibt
fact.6.label=Was diese Übereinstimmung nicht belegt
fact.6.value=Abstammung — Übereinstimmung ist keine Herkunft — und auch keine Genehmigung: eine Ende August 2026 an den Komplex gesandte Anfrage, dessen eigene Dateien zu zeigen, war zum Zeitpunkt dieser Niederschrift nicht beantwortet worden
fact.7.label=Begleitübersetzungen in diesem Korpus
fact.7.value=[[Q-EN|Pickthalls englische]] (1930), [[Q-YA|Yusuf Alis englische]] (1934) und [[Q-SAB|Sablukows russische]] (1878) — drei Übersetzungen, die mit diesem Grundtext unter jedem Vers gepaart werden
fact.8.label=In diesem Korpus
fact.8.value=der einzige arabische Text, mit dem hier jede [[Q-EN|Übersetzung]] gepaart wird; im Gegensatz dazu [[FB1776|die finnische Bibel von 1776]], wo schlicht nicht bekannt ist, von welchem Druck der Text abstammt
fact.9.label=Lizenz
fact.9.value=gemeinfrei — das koranische Arabisch wird so behandelt, als gehöre es niemandem; die eigenen Bedingungen unserer Quelle verlangen nur, dass eine Wiedergabe die uthmanische Orthographie unverändert erhält
