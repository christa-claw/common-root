# The narrative, one paragraph per key, in order.
hero.1=La terza Bibbia della Finlandia, e quella che si è fissata. È una revisione e non una traduzione nuova: la linea risale, attraverso la revisione di Florinus del 1683–85, alla Biblia del 1642, la prima Bibbia finlandese completa. La revisione si deve ad Anders (Antti) Lizelius, che già nel 1758 aveva curato una propria edizione della Bibbia. Ciò che l'edizione del 1776 ha cambiato è l'ortografia e, con essa, la portata. Fu la prima Bibbia finlandese in ortografia modernizzata e la prima stampata per l'uso domestico e non soltanto per il leggio. Una Bibbia che una famiglia può possedere è un oggetto diverso da una Bibbia che possiede una parrocchia. Le edizioni intermedie non furono solo ortografia. Henrik Florinus, prevosto di Paimio, che curò quella del 1685, sapeva l'ebraico e il greco e corresse la sostanza quanto la lingua — la formulazione si mosse più della grafia — e si ritiene che le edizioni intermedie abbiano tradotto anche dalle lingue originali, e non soltanto ripulito il 1642. Chi confronta il 1642 con il 1776 guarda attraverso due revisioni, non attraverso un cambio di ortografia.
hero.2=Ha tenuto l'uso della chiesa per un secolo e mezzo, finché la Kirkkoraamattu 1933/38 non l'ha sostituita, e non si è smesso di leggerla quando ha smesso di essere ufficiale. Due movimenti di risveglio interni alla Chiesa evangelica luterana di Finlandia, i laestadiani e i rukoilevaiset, l'hanno conservata e la usano ancora. Per questo la sola parola Biblia, in finlandese, indica questo libro e non un'edizione più antica o più recente, e per questo il libro si chiama anche Vanha kirkkoraamattu, la vecchia Bibbia della chiesa.
hero.3=In questo lettore è il centro della catena finlandese. Aprite un piolo sotto un versetto della Kirkkoraamattu 1933/38 e compare questa edizione; apritene uno sotto questa e compare la Biblia del 1642. I due pioli, però, vanno letti in modo diverso. I traduttori del 1933/38 lavoravano dall'ebraico e dal greco, quindi il piolo di sopra è successione all'interno della Bibbia di una chiesa e non derivazione. Quello di sotto è filiazione vera: il 1776 è una revisione del 1642, e le parole ai due lati di quel passo sono fatte per essere confrontate.
hero.4=Un'avvertenza sul testo presente in questo sito: non è la stampa del 1776. Quello che si legge qui discende da un testo digitale di pubblico dominio la cui ortografia è stata normalizzata da una mano posteriore e la cui storia editoriale non è registrata: dei suoi 31 102 versetti esattamente uno contiene la lettera w, mentre la Biblia del 1642 ne ha 26 862, e la w per v è il segno più chiaro dell'ortografia in cui il 1776 fu stampato. Il 1776 modernizzò dunque la grafia del 1642, e questo testo è stato modernizzato di nuovo in seguito, il che lo lascia più lontano dal libro stampato di quanto il 1776 lo fosse dal 1642. Due studiosi del finlandese letterario antico hanno chiesto di quale versione si trattasse prima di ogni altra cosa, e la domanda era quella giusta. La stampa del 1776 sopravvive come immagini di pagina nella collezione dell'epoca svedese della Biblioteca nazionale finlandese; sostituirlo con un testo fedele è un lavoro che vorremmo fare.

