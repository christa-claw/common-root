title=Biblia 1776 — Su questa edizione | Common Root
description=Biblia 1776: la Bibbia della chiesa finlandese per un secolo e mezzo, la prima stampata per la lettura in casa e ancora il libro che il finlandese intende quando dice «Biblia».
heroHeading=Biblia 1776
