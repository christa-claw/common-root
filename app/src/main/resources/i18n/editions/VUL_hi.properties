title=लातीनी वुल्गाता — इस संस्करण के बारे में | Common Root
description=लातीनी वुल्गाता: जेरोम का अनुवाद, जो 382 में सौंपा गया और लगभग 405 में पूरा हुआ, जिसने बाइबिल को एक हज़ार वर्ष तक पश्चिमी यूरोप में थामे रखा और जो गुटेनबर्ग की छापी पहली पुस्तक था।
