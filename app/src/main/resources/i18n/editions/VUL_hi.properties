# The narrative, one paragraph per key, in order.
hero.1=चौथी शताब्दी के अंत तक पश्चिम में प्रचलित लातीनी सुसमाचार एक प्रति से दूसरी प्रति तक आपस में भिन्न पड़ चुके थे, और पोप दमासुस प्रथम ने अपने सचिव जेरोम से उन्हें सुलझाने को कहा। जेरोम ने संशोधन से आरम्भ किया। अन्ततः उन्होंने इस पर बीस से अधिक वर्ष लगाए, जिनमें से अधिकांश बेथलहम में बीते, और कुछ ऐसा तैयार किया जो किसी ने माँगा ही न था।
hero.2=निर्णायक चुनाव यह था कि उन्होंने पुराने नियम का अनुवाद यूनानी सेप्टुआजिंट से नहीं, जिसे कलीसिया सदा से काम में लाती थी, बल्कि इब्रानी से किया। जेरोम ने इस सिद्धांत को “hebraica veritas” — इब्रानी सत्य — कहा, और यह विवादास्पद रहा: ऑगस्टीन ने उन्हें चिंतित होकर लिखा कि परिचित पाठ बदलते देख मंडलियाँ भड़क उठेंगी। जेरोम ने फिर भी वैसा ही किया। यही कारण है कि एक लातीनी बाइबिल, और वही, उस यूनानी बाइबिल की अपेक्षा इब्रानी के अधिक निकट है जिसे पहले मसीही पढ़ते थे।
hero.3=यह एक सहस्राब्दी तक पश्चिमी यूरोप की बाइबिल बनी रही — इतनी लंबी अवधि किसी भी अनुवाद को न उससे पहले मिली, न बाद में। विक्लिफ ने इसी से अंग्रेज़ी में अनुवाद किया, और डुए-रिम्स के अनुवादकों ने भी इसी पर काम किया — इसलिए इस संग्रह की डुए-रिम्स इसकी सीधी वंशज है, और उस संस्करण की सीढ़ियाँ यहीं लौटकर संकेत करती हैं। यह चल-अक्षरों से छपी पहली बड़ी पुस्तक भी थी: गुटेनबर्ग ने लगभग 1455 में माइंत्स में जो बाइबिल जमाई, वह यही पाठ था।

