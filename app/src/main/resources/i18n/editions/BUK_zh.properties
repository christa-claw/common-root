title=布哈里圣训实录 — 关于此版本 | Common Root
description=布哈里圣训实录：逊尼派伊斯兰教奉为权威性仅次于《古兰经》的圣训集，由穆罕默德·布哈里从他考证过的约600,000则传述中选录而成，只收入具备可靠传述人不间断链条的传述。
heroHeading=布哈里圣训实录
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=穆罕默德·伊本·伊斯玛仪·布哈里主要在两座清真寺——麦加禁寺与麦地那先知寺——编纂这部圣训集,并于希吉拉历232年（公元846年）前后在故乡布哈拉完成；此后他把生命中大约最后二十年的时间，用在旅途中继续修订此书。其全称阿拉伯语为 al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi，通常简称为《布哈里圣训实录》——意为"布哈里的可靠[圣训集]"。相传布哈里本人曾说，他是从自己考证过的约600,000则圣训传述中挑选出此书的内容，只有当一则传述按他的判断具备一条通向原始来源的、由可靠传述人组成的不间断链条时，他才予以采用。
hero.2=正是这一标准，造就了这部书所享有的分量。《布哈里圣训实录》被列为逊尼派伊斯兰教六大圣训集（库图布·西塔）之首，并与《穆斯林圣训实录》——其在方法与声望上最接近的对手——合称为"两部可靠实录"（萨希哈因）。大多数逊尼派学者把布哈里的圣训集置于其他任何圣训集之上，权威性仅次于《古兰经》本身，不过也有少数学者主张《穆斯林圣训实录》应居其前。书中内容按主题而非按传述人或年代编排（学者称这种体例为"穆萨纳夫"），分为若干卷（库图布），内容从仪式性净身与礼拜，一直延伸到商业、婚姻、历代先知的生平，以及末日来临的征兆。
hero.3=这部书究竟收录了多少则圣训，取决于采用哪一种印本传统来计数。如今最常被引用的数字是7,563，这一数字源自编者穆罕默德·福阿德·阿卜杜勒-巴基在二十世纪为该文本所作的编号，其计数方式是每当同一则圣训在另一卷下重复出现时就再计一次；若剔除重复，伊本·哈贾尔·阿斯卡拉尼的统计为2,602。其他学者还提出过另外的总数。本语料库自身的统计又是第三个数字：98卷、7,589则编号圣训——这仅仅反映了本语料库所据数字化版本自身的结构，并非宣称精确复现任何某一种印本编号。
hero.4=这里的阿拉伯语文本是公有领域的古典正文（matn）。在阅读器中，其下方附有一段英译文，取自 fawazahmed0/hadith-api 的 eng-bukhari 版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=语言
fact.1.value=古典阿拉伯语，阅读器中每则圣训下方附有英译文
fact.2.label=编纂者
fact.2.value=穆罕默德·伊本·伊斯玛仪·布哈里（希吉拉历194–256年 / 公元810–870年）
fact.3.label=全称
fact.3.value=al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi——通常简称为《布哈里圣训实录》
fact.4.label=编纂地点与时间
fact.4.value=主要在麦加禁寺与麦地那先知寺编纂；于希吉拉历232年（公元846年）前后在布哈拉完成
fact.5.label=方法
fact.5.value=只收录具备布哈里认定可靠传述人不间断链条的圣训；相传他从自己考证过的约600,000则传述中选录成此书
fact.6.label=地位
fact.6.value=逊尼派伊斯兰教六大圣训集（库图布·西塔）之首；与[[MUS|《穆斯林圣训实录》]]合称"萨希哈因"——两部权威性仅次于《古兰经》的圣训集
fact.7.label=圣训数量
fact.7.value=按广泛使用的阿卜杜勒-巴基编号计入重复为7,563则，或按伊本·哈贾尔·阿斯卡拉尼的统计剔除重复为2,602则；各印本在卷数与圣训编号上均有差异
fact.8.label=在本语料库中
fact.8.value=98卷、7,589则编号圣训——这是源数据集本身的结构，并非对任何某一种印本编号的复现
fact.9.label=英译文
fact.9.value=取自 fawazahmed0/hadith-api 的 eng-bukhari 版本，在阿拉伯语下方作为伴读显示；它究竟源自哪一个已出版译本，本语料库尚未确认
fact.10.label=许可
fact.10.value=阿拉伯语正文（matn）是公有领域的古典文本；英译文的许可仍处于审核中
