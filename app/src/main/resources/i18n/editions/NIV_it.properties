title=New International Version — Informazioni su questa edizione | Common Root
description=La New International Version: la Bibbia inglese con cui questo lettore si apre di default, tradotta direttamente dalle lingue originali dal Committee on Bible Translation e completata per la prima volta nel 1978 — qui nel suo testo del 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Cominciò con l'insoddisfazione di una confessione. Nel 1955 l'uomo d'affari Howard Long, insieme al pastore Peter De Jong, fece pressione sulla Christian Reformed Church perché producesse una Bibbia in inglese contemporaneo, e nel 1957 la CRC approvò un comitato per studiare l'idea. La National Association of Evangelicals aveva avviato quello stesso anno un proprio progetto analogo. Le due organizzazioni unirono le forze: un comitato congiunto inviò nel 1964 inviti a una conferenza di traduzione, che si riunì nell'agosto 1965 al Trinity Christian College di Palos Heights, nell'Illinois, e decise di formare "un comitato permanente di quindici" per portare avanti il lavoro. Quel comitato permanente divenne il Committee on Bible Translation. Nel 1967 la New York Bible Society — da allora rinominata Biblica — assunse la direzione del progetto e assunse gli studiosi che avrebbero fatto la traduzione.
hero.2=Nulla qui discende da una Bibbia inglese più antica. Mentre la King James Version, la Revised Version, la American Standard Version e la World English Bible formano in questo corpus un'unica catena di revisioni, la New International Version fu tradotta di nuovo, direttamente dall'ebraico, dall'aramaico e dal greco: l'Antico Testamento dal testo ebraico masoretico, con i rotoli del Mar Morto, la Settanta e altre testimonianze antiche consultate; il Nuovo Testamento dal testo greco critico eclettico rappresentato dalle edizioni della United Bible Societies e di Nestle-Aland, non dal Textus Receptus su cui riposano qui la Bibbia di Ginevra e la King James. Il comitato di quindici crebbe, in circa un decennio, in un progetto che arrivò a contare più di cento studiosi provenienti da diversi paesi anglofoni e da molte confessioni. Il loro obiettivo dichiarato era una traduzione che rispettasse l'esattezza del testo originale senza leggersi come una trascrizione parola per parola di esso — un equilibrio di solito classificato come equivalenza dinamica, tra una resa letterale rigorosa e una parafrasi libera.
hero.3=Il Nuovo Testamento apparve prima, nel 1973; la Bibbia completa seguì il 27 ottobre 1978; una leggera revisione arrivò nel 1984. Il testo cambiò più sostanzialmente nel 2011, quando una revisione più ampia sostituì sia l'edizione del 1984 sia la Today's New International Version del 2005, ritirando entrambe a favore del testo unico in vigore da allora. È questo il testo del 2011 conservato in questo corpus — lo stesso anno indicato sulla scheda del catalogo. Biblica, Inc. ne detiene sempre il copyright; la pubblicano Zondervan negli Stati Uniti e Hodder & Stoughton nel Regno Unito.
hero.4=Il suo posto in questo lettore è centrale in modo discreto. Si imposti l'interfaccia in inglese, ed è questa a aprirsi — le pagine della King James Version e della Revised Version in questo corpus dicono esse stesse di non esserlo, indicando questa come l'edizione da cui si passa, non quella su cui si arriva. Non avendo revisionato nulla, il corpus non registra per essa alcun testo base: aprire un piolo di discendenza sotto un versetto della New International Version scende direttamente al pavimento delle lingue originali contrassegnato con ≈, come per la Berean Standard Bible — con una differenza che vale la pena conoscere. Il testimone greco di quel pavimento è il Textus Receptus, e il Textus Receptus non è ciò da cui è stato realmente tratto il Nuovo Testamento di questa traduzione — il pavimento sta semmai per "il greco originale" in generale, non per il testo di lavoro proprio di questo comitato. Un'altra cosa la distingue dalla maggior parte delle sue vicine inglesi: è su licenza, non di pubblico dominio, lo stesso stato della New American Standard Bible 2020, mentre la Berean Standard Bible, la Bibbia di Ginevra, la King James Version, la Revised Version e la World English Bible si possono copiare tutte liberamente.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Commissionata
fact.2.value=Da un comitato congiunto della Christian Reformed Church e della National Association of Evangelicals, che convocò una conferenza al Trinity Christian College di Palos Heights, nell'Illinois, nell'agosto 1965
fact.3.label=Realizzata da
fact.3.value=Il Committee on Bible Translation — quindici studiosi all'inizio, cresciuti poi a oltre cento provenienti da diversi paesi anglofoni e da molte confessioni, nell'arco di circa un decennio
fact.4.label=Antico Testamento da
fact.4.value=Il testo ebraico masoretico, con i rotoli del Mar Morto, la Settanta e altre testimonianze antiche consultate
fact.5.label=Nuovo Testamento da
fact.5.value=Il testo greco critico eclettico rappresentato dalle edizioni della United Bible Societies e di Nestle-Aland — non [[TR|il Textus Receptus]] su cui riposano qui [[GNV|la Bibbia di Ginevra]] e [[KJV|la King James Version]]
fact.6.label=Tipo di traduzione
fact.6.value=Bilancia l'esattezza di una resa letterale con un inglese naturale e idiomatico, senza fermarsi a nessuno dei due estremi — di solito classificata come equivalenza dinamica; una traduzione nuova dalle lingue originali, non una revisione della tradizione King James
fact.7.label=Pubblicata
fact.7.value=Il Nuovo Testamento nel 1973; la Bibbia completa il 27 ottobre 1978; una leggera revisione nel 1984; il testo attuale, revisionato più a fondo, nel 2011, che ritirò sia l'edizione del 1984 sia la Today's New International Version del 2005
fact.8.label=Editore
fact.8.value=Biblica, Inc., che ne detiene il copyright; Zondervan negli Stati Uniti, Hodder & Stoughton nel Regno Unito
fact.9.label=Licenza
fact.9.value=Su licenza, non di pubblico dominio. Si possono citare fino a 500 versetti senza permesso scritto, purché non costituiscano un libro intero della Bibbia né più del 25% dell'opera, con l'indicazione del copyright; tutto ciò che va oltre richiede il permesso di Biblica
fact.10.label=In questo corpus
fact.10.value=La Bibbia con cui un'interfaccia inglese si apre di default — [[KJV|la King James Version]] e [[RV|la Revised Version]] qui dichiarano entrambe di non esserlo. Nei pioli di discendenza non le è registrato alcun testo base: un piolo sotto un versetto della NIV scende direttamente al pavimento delle lingue originali contrassegnato con ≈, come per [[BSB|la Berean Standard Bible]] — se non che il testimone greco di quel pavimento è [[TR|il Textus Receptus]], che non è il testo da cui è stato realmente tratto il Nuovo Testamento di questa traduzione. Su licenza invece che di pubblico dominio, con lo stesso stato della New American Standard Bible 2020, si distingue così da vicine di pubblico dominio come [[KJV|la King James Version]], [[RV|la Revised Version]] e [[WEB|la World English Bible]]
