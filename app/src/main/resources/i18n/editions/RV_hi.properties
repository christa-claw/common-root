title=Revised Version — इस संस्करण के बारे में | Common Root
description=अंग्रेज़ी संशोधित संस्करण: King James Version का एकमात्र संशोधन जिसे इंग्लैंड के चर्च ने कभी अधिकृत किया, जो 1881 और 1894 के बीच तीन किस्तों में प्रकाशित हुआ — और यहाँ King James Version तथा American Standard Version के बीच का पायदान।
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=संशोधित संस्करण King James Version का वही एक संशोधन है जिसे इंग्लैंड के चर्च ने सचमुच करवाया। कैंटरबरी की कॉन्वोकेशन ने 1870 में इसका निर्णय लिया और दो मंडलियाँ नियुक्त कीं, प्रत्येक नियम के लिए एक, जिनमें कई सम्प्रदायों के पचास से अधिक ब्रिटिश विद्वान जुटे — केवल एंग्लिकन नहीं, जो अपने आप में नया था और जिस पर विवाद हुआ। अमेरिकी विद्वानों को पत्राचार द्वारा भाग लेने का न्योता मिला, और उन्होंने लिया। निर्देश रूढ़िवादी था: Authorised Version को केवल वहीं बदला जाए जहाँ निष्ठापूर्वक अनूदित मूल भाषाएँ इसकी माँग करें। नया नियम 1881 में निकला, पुराना नियम 1885 में, और सबसे अन्त में तैयार किए गए अपोक्रिफ़ा 1894 में।
hero.2=रूढ़िवादी निर्देश ने नए नियम की मंडली को पुस्तक का सबसे दूरगामी निर्णय लेने से नहीं रोका। उन्होंने Textus Receptus पर काम नहीं किया। वेस्टकॉट और होर्ट उसी मंडली में बैठते थे और काम बढ़ने के साथ-साथ अपना यूनानी पाठ प्रूफ़ में उसके सामने रखते रहे; संशोधकों ने जिस पर निश्चय किया वह उनका अपना चयनात्मक पाठ था, ठीक-ठीक वेस्टकॉट और होर्ट का नहीं, किन्तु वह निर्णायक रूप से पुरानी अंशियल पांडुलिपियों की ओर खिसका। इस संस्करण को King James Version के बगल में दो स्तम्भों में रखिए और यह खिसकाव तत्काल दिखता है। 1 यूहन्ना 5:7 में King James स्तम्भ पढ़ता है “For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one”, और यह पढ़ता है “And it is the Spirit that beareth witness, because the Spirit is the truth”।
hero.3=ब्रिटिश संशोधकों ने जो नहीं बदला वही है जिसे अमेरिकी सबसे अधिक बदला हुआ देखना चाहते थे। भजन 23:1 में यह संस्करण अब भी “The LORD is my shepherd” छापता है, ठीक जैसे King James Version छापती है; उसके ऊपर की American Standard Version “Jehovah is my shepherd” छापती है। नाम यहाँ केवल वहीं आता है जहाँ King James Version ने स्वयं उसे छापा था — निर्गमन 6:3 में दोनों “by my name JEHOVAH” पढ़ती हैं — और उसे समूचे पुराने नियम में ले चलना अमेरिकी पसन्द थी, जो चौदह वर्ष के समझौते के तहत परिशिष्ट में डाल दी गई और पाठ में केवल 1901 में छोड़ी गई। दोनों स्तम्भों को साथ पढ़ना यह देखने का सबसे छोटा रास्ता है कि उस समझौते ने वस्तुतः क्या रोक रखा था। दूसरा अन्तर वाक्यों की शब्दावली से अधिक उनके आकार में दिखता है: संशोधकों ने प्रति पंक्ति एक पद वाली संरचना तोड़ी और गद्य को अनुच्छेदों में रखा, और उसका चिह्न यहाँ उन पदों में बचा है जो छोटे अक्षर से आरम्भ होते हैं क्योंकि वे वाक्य को आगे बढ़ाते हैं — निर्गमन 6:3 का “and I appeared unto Abraham”, जहाँ King James स्तम्भ “And I appeared” से आरम्भ होता है।
hero.4=इस संस्करण का कार्ड वर्ष खाली छोड़ता है, और यही ईमानदार उत्तर है, कोई चूक नहीं। संशोधित संस्करण एक बार नहीं बल्कि तीन बार प्रकाशित हुआ, और यहाँ का पाठ अस्सी पुस्तकों वाला है: छियासठ पुस्तकें और उनके साथ अपोक्रिफ़ा की चौदह, कुल मिलाकर 36,873 पद, जिसका अर्थ है कि वह ऐसी सामग्री वहन करता है जो 1894 से पहले छपी हुई थी ही नहीं। संग्रह की प्रविष्टि उस पर 1885 की मुहर लगाती है, वह वर्ष जब पुराने नियम ने स्वयं बाइबल को पूरा किया, और वही वर्ष वंश-पायदान की चिप दिखाती है। पाठ किस छपाई से उतरा है, यह दर्ज नहीं — वही चूक जो संग्रह King James Version के लिए और 1776 की फ़िनिश Biblia के लिए खुली छोड़ता है। यह भी ध्यान दें कि कोई इंटरफ़ेस इस संस्करण पर नहीं खुलता; अंग्रेज़ी इंटरफ़ेस New International Version पर खुलता है, और इस पर आकर बदला जाता है।

