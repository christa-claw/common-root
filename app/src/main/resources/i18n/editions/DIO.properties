fact.2.label=Translator
fact.2.value=Giovanni Diodati (1576–1649), born in Geneva to a family of Protestant merchants who had left Lucca rather than give up their religion
fact.3.label=First published
fact.3.value=1607, at Geneva — the first Italian Bible made from the Hebrew and the Greek rather than from the Latin
fact.4.label=Revised edition
fact.4.value=1641, with Diodati's own notes; that is the form the text was reprinted in for the next three centuries
fact.5.label=Why the label says 1649
fact.5.value=1649 is the year Diodati died, not the year of an edition — the date rides along with the digital text, and the catalogue card leaves the year column blank rather than assert one
fact.6.label=Greek behind the New Testament
fact.6.value=Beza's editions, made in Geneva a generation earlier — within the family of printed Greek texts this corpus holds as [[TR|Textus Receptus]]
fact.7.label=Also by him
fact.7.value=A French Bible, 1644, generally reckoned the weaker of the two — French was not the language he thought in
fact.8.label=Contents
fact.8.value=66 books — the Protestant canon, no deuterocanon
fact.9.label=In this corpus
fact.9.value=The only Italian Bible here, so an Italian interface opens on it; no parent is recorded in the lineage rungs, and its rung chip renders without a year
