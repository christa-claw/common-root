title=डॉक्ट्रिन एंड कॉवनंट्स — इस संस्करण के बारे में | Common Root
description=डॉक्ट्रिन एंड कॉवनंट्स: जोसेफ़ स्मिथ द्वारा दर्ज किए गए प्रकटीकरण और अन्य वक्तव्य, जो पहली बार 1835 में कर्टलैंड, ओहायो में प्रकाशित हुए और लैटर-डे सेंट्स द्वारा बाइबिल के साथ धर्मग्रंथ के रूप में पढ़े जाते हैं।
heroHeading=डॉक्ट्रिन एंड कॉवनंट्स
readerHref=/reader?c1.src=dc

hero.1=डॉक्ट्रिन एंड कॉवनंट्स में वे प्रकटीकरण, दर्शन और अन्य वक्तव्य संकलित हैं जिन्हें जोसेफ़ स्मिथ जूनियर ने ईश्वर से सीधे प्राप्त संदेश बताया था; ये मुख्यतः चर्च के आरंभिक वर्षों में ओहायो, मिसूरी और न्यूयॉर्क में दर्ज किए गए। "क्राइस्ट के चर्च के शासन के लिए आज्ञाओं की पुस्तक" नामक एक पहले का संकलन मिसूरी के इंडिपेंडेंस में चर्च के प्रिंटिंग प्रेस में छप रहा था, जब जुलाई 1833 में एक उपद्रवी भीड़ ने प्रेस को नष्ट कर दिया और पुस्तक पूरी होने से पहले अधूरे पन्नों को तहस-नहस कर दिया; यह कभी औपचारिक रूप से प्रकाशित नहीं हुई, हालाँकि तब बचाए गए बिना-बंधे पन्नों में से कुछ थोड़ी संख्या आज भी बची हुई है।
hero.2=इसके बाद 1835 में एक विस्तारित और नए नाम से प्रकाशित संस्करण, "लैटर डे सेंट्स चर्च के डॉक्ट्रिन एंड कॉवनंट्स", कर्टलैंड, ओहायो में प्रकाशित हुआ; इसे चार सदस्यों की एक समिति — जोसेफ़ स्मिथ, ओलिवर काउडरी, सिडनी रिग्डन और फ़्रेडरिक जी. विलियम्स — ने संकलित और स्वीकृत किया। उस पहले संस्करण में एक ही जिल्द के भीतर दो प्रकार की सामग्री को साथ रखा गया था — कर्टलैंड स्कूल में दिए गए धार्मिक प्रवचनों की एक शृंखला, जिन्हें पुस्तक के "डॉक्ट्रिन" भाग के रूप में प्रस्तुत किया गया, और स्वयं दर्ज किए गए प्रकटीकरण, जिन्हें इसके "कॉवनंट्स" भाग के रूप में प्रस्तुत किया गया। ये प्रवचन, जो बाद में Lectures on Faith के नाम से जाने गए, बाद में पुस्तक से हटा दिए गए — यह परिवर्तन सामान्यतः 1921 के संस्करण में माना जाता है — जिससे प्रकटीकरण ही इस कृति की संपूर्णता बन गए।
hero.3=यह पुस्तक बाइबिल की तरह पुस्तकों, अध्यायों और पदों में नहीं, बल्कि क्रमांकित खंडों (sections) में व्यवस्थित है — जो इसकी प्रकृति को दर्शाता है: एक निरंतर कथा के बजाय अलग-अलग एकत्र किए गए पाठों का संग्रह। 19वीं सदी के संस्करणों के दौरान विषय-वस्तु और क्रमांकन दोनों बदले, जिनमें ऑर्सन प्रैट के नेतृत्व में 1876 का संस्करण शामिल है, जिसने पहले की सामग्री को पुनर्व्यवस्थित किया और नए प्रकटीकरण जोड़े। आधुनिक संस्करण ने 1981 में अपना वर्तमान स्वरूप पाया, जब दो और अंश — महिमा के स्तरों का एक दर्शन और मृतकों की मुक्ति का एक दर्शन — खंड 137 और 138 के रूप में जोड़े गए, साथ ही दो "आधिकारिक घोषणाएँ": 1890 का एक घोषणापत्र, जिसने नए बहुविवाहों के प्रति चर्च के समर्थन को समाप्त कर दिया, और 1978 की एक घोषणा, जिसने नस्ल की परवाह किए बिना सभी योग्य पुरुष सदस्यों तक पुरोहिताई की नियुक्ति का विस्तार किया। 2013 के मुद्रण ने अन्य संदर्भ सामग्री को अपडेट किया। आज प्रयुक्त मानक संस्करण में 138 खंड और दो आधिकारिक घोषणाएँ शामिल हैं।
hero.4=यह उन चार रचनाओं में से एक है जिन्हें लैटर डे सेंट आंदोलन अपनी "मानक रचनाएँ" कहता है, बाइबिल, [[BOM|मॉरमन की पुस्तक]] और [[PGP|पर्ल ऑफ़ ग्रेट प्राइस]] के साथ। उसी आंदोलन से निकला एक अलग संप्रदाय, Community of Christ, अपना स्वतंत्र डॉक्ट्रिन एंड कॉवनंट्स रखता है, जिसका क्रमांकन और अद्यतन इससे स्वतंत्र रूप से होता है। इस संग्रह में पाठ Mormon Documentation Project के JSON निर्यात से लिया गया है, जो वही सार्वजनिक-क्षेत्र स्रोत है जो [[BOM|मॉरमन की पुस्तक]] और [[PGP|पर्ल ऑफ़ ग्रेट प्राइस]] के लिए उपयोग किया गया है, और यहाँ इसे "डॉक्ट्रिन एंड कॉवनंट्स" नाम की एक ही पुस्तक के रूप में प्रस्तुत किया गया है, जिसमें हर खंड एक अध्याय के रूप में कार्य करता है; यह वर्तमान मानक संस्करण के शब्दों का पालन करता है और कॉपीराइट-सुरक्षित फुटनोट तथा अध्याय-शीर्षकों को छोड़ देता है, इसीलिए यहाँ कोई एक प्रकाशन वर्ष नहीं दिया गया है।

