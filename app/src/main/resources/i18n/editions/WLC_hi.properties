title=लेनिनग्राद कोडेक्स — इस संस्करण के बारे में | Common Root
description=लेनिनग्राद कोडेक्स: इब्रानी बाइबिल की सबसे प्राचीन पूर्ण उपलब्ध पांडुलिपि, जो 1008 ई. में लिखी गई और आज भी अधिकांश आधुनिक पुराने नियम अनुवादों का आधार-पाठ है।
heroHeading=लेनिनग्राद कोडेक्स
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=यह इब्रानी बाइबिल की सबसे प्राचीन पूर्ण पांडुलिपि है जो आज तक बची है। इसे शमूएल बेन याकोब नामक एक लिपिक ने पुराने काहिरा में बैठकर उतारा था, और पांडुलिपि के अंत में अपनी ही टिप्पणी में उसने अपने काम की तिथि 1008 ई. दर्ज की।
hero.2=शमूएल बेन याकोब कोई नया पाठ नहीं गढ़ रहा था; वह एक पाठ को सुरक्षित रख रहा था। वह बेन आशेर परिवार की परंपरा में काम कर रहा था, जो मसोरा के सर्वोच्च प्रामाणिक विद्वान माने जाते थे — स्वर-चिह्नों, गान-चिह्नों और हाशिये की टिप्पणियों की वह विस्तृत प्रणाली जिसे यहूदी विद्वानों ने सदियों तक निखारा, ताकि इब्रानी बाइबिल का उच्चारण स्थिर रहे और पाठ बिगड़ने से बचा रहे। बेन आशेर परंपरा की एक और प्राचीन तथा संभवतः अधिक प्रामाणिक पांडुलिपि भी बची है — अलेप्पो कोडेक्स — पर उसका तोराह वाला अधिकांश भाग 1947 में नष्ट हो गया। लेनिनग्राद कोडेक्स इसी कारण अनमोल है: यह पूर्ण है, और इतना प्राचीन कि उस परंपरा के उद्गम पर ही खड़ा है।
hero.3=इसका नाम उस नगर से आया जहाँ यह बाद में पहुँचा: लेनिनग्राद — सेंट पीटर्सबर्ग का वह नाम जो उस समय प्रचलित था जब यह पांडुलिपि पश्चिमी विद्वत्ता के सामने आई, और जो 1991 में नगर का अपना नाम लौट आने के बाद भी पांडुलिपि के साथ बना रहा। आज यह Biblia Hebraica Stuttgartensia का आधार है, जो इब्रानी बाइबिल का मानक अकादमिक संस्करण है — अर्थात् लगभग हर भाषा में पुराने नियम का लगभग हर आधुनिक अनुवाद ग्यारहवीं सदी के काहिरा के इसी एक लिपिक की सावधानी तक जाता है, चाहे उसके पाठक उसका नाम कभी जानें या न जानें।

