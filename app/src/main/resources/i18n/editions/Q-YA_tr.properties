title=Kur'an — Yusuf Ali — Bu Baskı Hakkında | Common Root
description=Abdullah Yusuf Ali'nin çevirisi, 1934-1937 arasında dört cilt halinde, İslam alimi olan bir Hindistanlı memur tarafından yayımlandı — mevcut çeviriler arasında açıkça kamu malı olduğu bulunan yalnızca iki İngilizce Kur'an çevirisinden biri ve bu derlemede Pickthall'ınkinin yanında ikinci bir İngilizce eşlik eden çeviri.
heroHeading=Kur'an — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872-1953) Bombay'da doğdu ve önce oradaki Wilson College'da eğitim gördü; okulunun yanı sıra aldığı dini eğitim, çocukken Kur'an'ı ezberlemesini sağladı. 1891'de Bombay Üniversitesi'nden İngiliz edebiyatında birinci sınıf lisans derecesi alması, ona Britanya'ya gitmek için bir Presidency bursu kazandırdı; burada Cambridge'deki St John's College'da hukuk okudu, 1895'te lisans ve hukuk diplomasıyla mezun oldu ve aynı yıl Hindistan Sivil Hizmeti'nde bir görevle Hindistan'a döndü.
hero.2=Sivil hizmette — önce yargıç ve vergi memuru, ardından hakim, sonunda Hindistan Hükümeti Maliye Dairesi'nde yardımcı sekreter olarak — yaklaşık yirmi yıl geçirdi; 1914'te görevinden istifa edip Britanya'ya yerleşti. Burada Woking'deki Şah Cihan Camii'nin ve East London Mosque Fonu'nun mütevellisi oldu, savaş sırasındaki çalışmaları nedeniyle 1917'de CBE nişanı aldı ve School of Oriental Studies'de Hindustani dili üzerine ders verdi. 1920'ler ve 1930'larda Lahor'daki Islamia College'ın müdürü olarak Hindistan'a döndü; Kur'an'ı kendi açıklayıcı notlarıyla İngilizceye aktarmasını, on yıldan fazla süren çalışmanın ardından, işte bu yıllar boyunca gerçekleştirdi.
hero.3=Çeviri, 1934-1937 arasında otuz fasikül halinde yayımlandı; ilki 4 Nisan 1934'te, "The Holy Qur'an: Text, Translation and Commentary" başlığıyla, Lahor'dan Shaik Muhammad Ashraf tarafından basıldı; 1938'de tek ciltte birleştirilmiş bir baskı, 1939-1940'ta ise gözden geçirilmiş bir baskı izledi. Pickthall'ınkinin yanında, 20. yüzyılın en çok okunan iki İngilizce Kur'an çevirisinden biri haline geldi; özellikle dipnotlarının kapsamıyla tanınır ve o zamandan beri, kimi yerlerde başka ellerce yeniden düzenlenerek, otuza yakın baskı daha yapılmıştır — bunlar arasında 1977'den itibaren Kuzey Amerika'da Amana Publications tarafından dağıtılan bir baskı ve 1980'lerde Suudi Arabistan destekli bir revizyon da vardır.
hero.4=Burada alquran.cloud üzerinden dijitalleştirilen, Yusuf Ali'nin eşlik eden yorumu değil, çevirinin kendisidir; bu derlemede [[Q-AR|Osmanlı mushaf metninin]] yanında ikinci bir İngilizce eşlik eden çeviri olarak, [[Q-EN|Pickthall'ın]] 1930 tarihli çevirisinin yanı sıra sunulur. Mevcut çevirilerin bir taraması, açıkça serbestçe kullanılabilir bulunan yalnızca iki İngilizce çeviriden biriydi — bu çeviri ve Pickthall'ınki — ancak "açıkça" ifadesi burada bir çekince gerektirir: eser, Yusuf Ali'nin öldüğü ve eserin ilk yayımlandığı Avrupa Birliği'nde ve Pakistan'da kamu malıdır, ancak Amerika Birleşik Devletleri'nde 1996'da şeklî olarak tescil edilen bir telif hakkının orada 2033'e kadar geçerli olduğu kabul edilir.

