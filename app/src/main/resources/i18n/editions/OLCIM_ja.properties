title=Baibal Olcim — この版について | Common Root
description=Baibal Olcimは、ミャンマーのチン州における少数言語マトゥ・チン語の聖書であり、eBible.orgによって、訳者も翻訳年も記録されていない、正真正銘のパブリックドメインの本文として配布されている。
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=マトゥ・チン語——マトゥピ・チン語とも呼ばれる——は、ミャンマーのチン州南部、マトゥピを中心とする地域で約34,000人が話すシナ・チベット語族の言語であり、国境を越えたインドのミゾラム州にも縁戚関係にある共同体がある。Baibal Olcimはこの言語による聖書であり、本コーパスにおける唯一のマトゥ・チン語の本文である。
hero.2=記録が示していないのは、誰がいつ翻訳したかである。この本文を配布するeBible.orgは、それがパブリックドメインであるとだけ述べ、マトゥ・チン語のISO 639-3コードであるhltの下に分類している——訳者もなく、委員会もなく、翻訳年もない。この版のページは、推測するよりも両方を空欄のままにしている。このhltというコードには、ここで独自の小さな経緯がある。本コーパスに二つ目のヒンディー語聖書を加えようとした以前の試みが、似通った略号のために誤ってhltの下に登録され、ヒンディー語が見込まれていた箇所にマトゥ・チン語の聖句が現れたことで、その誤りが発覚するまで気づかれなかった。この版こそが、実際にそのコードが指す言語と照合された版である。
hero.3=この版は、その分量のためではなく、それが何であるかのために加えられた。すなわち、単にライセンスされているだけでなく、正真正銘パブリックドメインである聖書であり、チン州とその周辺を中心とするミャンマーの内戦の中で現実の迫害を受けてきたキリスト教徒の少数派が話す言語によるものである。利用者に何も求めず、そのうちの誰も追跡しないように作られたリーダーは、まさにこうした場合のためにある——そしてそれが、このページの事実欄に他に載せるものがこれほど少ない理由の大半でもある。

