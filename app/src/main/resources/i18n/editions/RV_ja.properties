fact.1.label=言語
fact.1.value=英語
fact.2.label=委嘱
fact.2.value=1870年、カンタベリー教会会議により——イングランド国教会がこれまでに公認した唯一のキング・ジェイムズ・バージョンの改訂
fact.3.label=制作者
fact.3.value=各聖書ごとに一つずつの二つの委員会、複数の教派から集まった五十人を超る英国の学者たち、そして書簡を通じて参加したアメリカの学者たち
fact.4.label=出版
fact.4.value=新約聖書は1881年、旧約聖書は1885年、外典は1894年
fact.5.label=改訂元
fact.5.value=[[KJV|1611年のキング・ジェイムズ・バージョン]]——原語がそれを要求すると判断された箇所でのみ改められた
fact.6.label=新約の底本
fact.6.value=改訂者たち自身の校訂ギリシャ語本文であり、テクストゥス・レセプトゥスではない。ウェストコットとホートは委員会に名を連ね、校正刷りの形で自分たちの本文を提示した
fact.7.label=旧約の底本
fact.7.value=マソラ本文のヘブライ語
fact.8.label=神の御名
fact.8.value=「The LORD」——キング・ジェイムズ・バージョンにあるとおりであり、ただしその版自身が「JEHOVAH」と印刷していた箇所を除く。御名を全体にわたって通すことはアメリカ側の好みであり、1901年の[[ASV|アメリカン・スタンダード・バージョン]]で解き放たれた
fact.9.label=ここでの内容
fact.9.value=八十巻、36,873節——外典十四巻が六十六巻に加わる形であり、ここでは[[KJV|キング・ジェイムズ・バージョン]]も同様である
fact.10.label=カタログの年
fact.10.value=空欄であり、それは意図的なものである。三度の分割出版——1881年、1885年、1894年——があり、この八十巻の本文はその三つすべてを含んでいる。コーパスは1885年を刻んでおり、段のチップが示すのもその年である
fact.11.label=このコーパスでは
fact.11.value=ここにある最長の系譜連鎖の中で、[[KJV|キング・ジェイムズ・バージョン]]と[[ASV|アメリカン・スタンダード・バージョン]]の間の段であり、その連鎖は上は[[WEB|ワールド・イングリッシュ・バイブル]]まで伸び、下は[[GNV|ジュネーヴ]]を経て[[TR|ギリシャ語]]と[[WLC|マソラ本文のヘブライ語]]まで下る
