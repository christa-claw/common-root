title=Revised Version — この版について | Common Root
description=イングリッシュ・リバイズド・バージョン：イングランド国教会がこれまでに公認した唯一のキング・ジェイムズ・バージョンの改訂であり、1881年から1894年にかけて三度に分けて出版された——そしてここではキング・ジェイムズ・バージョンとアメリカン・スタンダード・バージョンの間の段である。
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=リバイズド・バージョンは、イングランド国教会が実際に委嘱したキング・ジェイムズ・バージョンの唯一の改訂である。カンタベリー教会会議は1870年にこれを決議し、各聖書ごとに一つずつ、二つの委員会を任命して、複数の教派から五十人を超える英国の学者たちを集めた——国教会信徒だけではなく、これ自体が新しいことであり、議論を呼んだ。アメリカの学者たちも書簡を通じて参加するよう招かれ、実際に参加した。指示は保守的だった——原語を忠実に訳した結果として必要とされる箇所でのみ Authorised Version を改めるべし、というものである。新約聖書は1881年に、旧約聖書は1885年に、そして最後に取り組まれた外典は1894年に世に出た。
hero.2=保守的な指示も、新約聖書委員会がこの書物の中でもっとも重大な決定を下すのを止めはしなかった。彼らはテクストゥス・レセプトゥスに基づいて作業したのではない。ウェストコットとホートはその委員会に名を連ね、作業が進むにつれて校正刷りの形で自分たち自身のギリシャ語本文を委員会に提示した。改訂者たちが落ち着いた先は、ウェストコットとホートのものそのままではなく彼ら自身の折衷的な本文だったが、それはより古いアンシャル写本の方へと決定的に移動したものだった。この版をキング・ジェイムズ・バージョンと二段組で並べれば、その移行はただちに見て取れる。ヨハネの第一の手紙5章7節で、キング・ジェイムズの段には「For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one」とあり、こちらの段には「And it is the Spirit that beareth witness, because the Spirit is the truth」とある。
hero.3=イギリスの改訂者たちが変えなかったものこそ、アメリカ側がもっとも変えたかったものである。詩篇23篇1節で、この版はいまも「The LORD is my shepherd」と印刷しており、キング・ジェイムズ・バージョンとまったく同じである。その上にあるアメリカン・スタンダード・バージョンは「Jehovah is my shepherd」と印刷する。この御名がここに現れるのは、キング・ジェイムズ・バージョン自身がそれを印刷していた箇所、すなわち出エジプト記6章3節で両者とも「by my name JEHOVAH」と読む箇所に限られており、旧約聖書全体を通じてそれを貫くことはアメリカ側の好みであって、十四年の取り決めのもで付録に追いやられ、1901年になってようやく本文に解き放たれた。この二つの段を並べて読むことが、その取り決めが実際に何を押しとどめていたのかを見る一番の近道である。もう一つの違いは語句ではなく文の形に現れている。改訂者たちは一節一行の組版をやめて散文を段落にまとめ、その名残はここでは、文を続けているために小文字で始まる節として残っている——出エジプト記6章3節の「and I appeared unto Abraham」がそれで、キング・ジェイムズの段は「And I appeared」で始まる。
hero.4=この版のカードは年を空欄のままにしているが、それは欠落ではなく正直な答えである。リバイズド・バージョンは一度ではなく三度にわたって出版されており、ここにある本文は八十巻版である——外典十四巻を加えた六十六巻、合わせて36,873節であり、それは1894年より前には印刷された形で存在しなかった素材を含んでいることを意味する。コーパスの記録はこれを1885年と刻んでおり、それは旧約聖書が聖書本体を完成させた年であって、系譜の段のチップが示す年もその年である。本文がどの印刷から派生したものかは記録されていない——これはコーパスがキング・ジェイムズ・バージョンとフィンランド語のビブリア1776年版についても残している同じ空白である。また、どのインターフェースもこの版を既定として開かないことにも注意されたい。英語インターフェースはニュー・インターナショナセ・バージョンを既定として開き、これはそこから切り替えて読むものである。

