title=Biblia en Español Sencillo — על מהדורה זו | Common Root
description=Biblia en Español Sencillo: תנ"ך וברית חדשה בספרדית פשוטה שמוציאה AudioBiblia.org מאז 2018, כתובים להישמע לא פחות מלהיקרא ומורשים כך שכל אחד רשאי להעתיקם.
heroHeading=Biblia en Español Sencillo
