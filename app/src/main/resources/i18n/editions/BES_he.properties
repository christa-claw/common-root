# The narrative, one paragraph per key, in order.
hero.1=ארבע מאות שנה היה הכתב הפרוטסטנטי בספרדית, למעשה, ספר אחד בסדרת עיבודים: תרגומו של קסיודורו דה ריינה משנת 1569, כפי שסיפריאנו דה ולרה תיקן אותו בשנת 1602, והשורה הארוכה של מהדורות ריינה-ולרה שבאו אחריהן. Biblia en Español Sencillo אינה אחת מהן. זהו תרגום חדש, בספרדית בת ימינו ופשוט במתכוון, שמוציאה AudioBiblia.org — הברית החדשה יחד עם תהלים ומשלי בשנת 2018, והברית הישנה הושלמה באוקטובר 2019. התרגום מיוחס לאירמה פלורס, ומוציאיו מתארים אותו כשמרני ואוונגלי.
hero.2=מה שמייחד אותו הוא מוצאו. זו עבודה של מפעל מקרא מוקלט, והנוסח וההקלטה המלאה פרק אחר פרק נעשו יחד ולא זה נקרא מתוך זה. המטרה המוצהרת הייתה אחת לשניהם: כתבי קודש שקל להבינם, ושמותר להעתיק ולהפיץ אותם בחופשיות ובחוקיות. המחצית השנייה אינה עניין שולי. התרגום נושא רישיון Creative Commons ייחוס, המזכה את AudioBiblia.org ואת אירמה פלורס, ולא זכויות שמורות של מוציא לאור — ולכן הנוסח כולו יכול לשכון באוסף זה ולהיות מוצב פסוק מול פסוק לצד כל דבר אחר שבו.
hero.3=בקורא הזה זו אחת מארבע מהדורות ספרדיות. אם מעמידים את הממשק על ספרדית, הקורא עדיין פותח בריינה-ולרה 1909; זו מהדורה שעוברים אליה. גם בשלבי השושלת היא נוהגת אחרת. מפני שזהו תרגום חדש ולא עיבוד של דבר שהאוסף מחזיק, לא רשום לה מקור — כך ששלב הנפתח מתחת לפסוק של Biblia en Español Sencillo צונח היישר אל רצפת לשונות המקור המסומנת ב־≈, ולא, כמו בשרשרת האנגלית, אל מהדורה ישנה יותר של אותו ספר. הציבו אותה במקום זאת בטור השני מול ריינה-ולרה 1909, והמרחק בין שני המשלבים הוא מה שכדאי להתבונן בו.

