title=Louis Segond 1910 (franska) — Om denna utgåva | Common Root
description=Segondbibeln i 1910 års revision: en genèvisk pastors översättning från hebreiskan och grekiskan, första gången tryckt i sin helhet 1880, reviderad för Brittiska och utländska bibelsällskapet, och i ett sekel de fransktalande protestanternas standardbibel.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond föddes 1810 i Plainpalais, då strax utanför Genève, och dog i Genève 1885. Han studerade teologi vid den protestantiska fakulteten i Strasbourg, tog sin doktorsgrad i teologi vid tjugosex års ålder och var i tjugofyra år pastor i byförsamlingen Chêne-Bougeries innan han övergick till att undervisa i hebreiska och Gamla testamentet. Genèves vördnadsvärda pastorskompani gav honom i uppdrag att på nytt översätta Gamla testamentet från hebreiskan, och hans version kom ut i en utgåva daterad 1874. Därefter översatte han Nya testamentet på eget initiativ, utifrån Constantin Tischendorfs kritiska grekiska text och inte Textus Receptus, och 1880 kom hela bibeln ut i ett band, tryckt i Oxford.
hero.2=Detta är inte riktigt den text Segond gav ut. Efter hans död lät Brittiska och utländska bibelsällskapet en grupp franska och schweiziska pastorer och teologer revidera den, och revisionen kom ut 1910. Ändringarna drog åt den protestantiska ortodoxins ordförråd — präster blev ”sacrificateurs”, det gamla protestantiska ordet, och inte ”prêtres”; i denna kopia står ”sacrificateur” överallt och ”prêtre” sällan. Det är denna text från 1910 som blev den franska protestantismens referensbibel under större delen av nittonhundratalet och som fortfarande hör till de mest lästa bland fransktalande evangelikaler. Den har också en lång släkt av senare revisioner: ”Colombe” från 1978, Nouvelle Édition de Genève från 1979 och Segond 21 år 2007. Några drag syns på nästan varje sida. Gudsnamnet är ”l'Éternel”, den Evige, som hos Ostervald och i den franska Darby som står bredvid i detta korpus: ”L'Éternel est mon berger” i Psaltaren 23. Och Jesaja 7:14 lyder ”la jeune fille deviendra enceinte” — den unga kvinnan, inte jungfrun — just den sortens återgivning för vilken somliga konservativa protestanter anklagade Segond för att försvaga de messianska profetiorna.
hero.3=I Psaltaren följer boken hebreiskan: numreringen är den hebreiska, så Psalm 23 är herdepsalmen, och där en psalms överskrift är en vers på hebreiska är den en vers här också — Psalm 51 har 21 verser, två fler än i King James Version. Joel och Malaki behåller däremot den latinska och engelska traditionens kapitelindelning, tre kapitel och fyra. I denna läsare är den en av tre franska biblar, bredvid Ostervald och den franska Darby. Ett franskt gränssnitt öppnar inte på den: franskan har inget kurerat val, så läsaren tar den första franska bibeln i katalogordning, och det är Darby. I härstamningens stegpinnar har den ingen registrerad förlaga, så en stegpinne under en vers faller rakt ned till det ≈-markerade originalspråksgolvet — för Gamla testamentet Leningradkodexen, en handskrift i den masoretiska traditionen och inte en tryckt hebreisk text från Segonds tid, och för Nya Textus Receptus, som är just den grekiska han valde att inte följa. Dess stegpinne bär året 1910.

