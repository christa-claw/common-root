title=モルモン書 — この版について | Common Root
description=モルモン書：ジョセフ・スミスが1830年に口述し記録された、古代アメリカの預言者たちの記録。ニューヨーク州パルマイラで印刷され、末日聖徒は聖書を補う聖典として読んでいる。
heroHeading=モルモン書
readerHref=/reader?c1.src=bom

hero.1=ジョセフ・スミスは、この書を「神の賜物と力によって」一組の古代の金属板から翻訳したと述べた。彼はこれらの版を1827年、ニューヨーク州パルマイラ郊外にあった家族の農場の近くで見つけたと語り、後にそれを自分に示した使者に返したという。口述を目撃した人々は、彼が「予見の石」を調べていたと述べている——作業の後の段階では、光を遮るために帽子の中に入れた石であり、伝統的にウリムとトンミムと呼ばれ、版とともに届いたとされる、胸当てに取り付けられた一対の石だけではなかった——そして彼が声に出して文章を語り、それを書記が書き取った。オリバー・カウドリは1829年のおよそ二か月間、おもにニューヨーク州フェイエットのホイットマー家の農場で、この方法によって大部分を書き取った。マーティン・ハリスとジョセフの妻エマ・スミスは、それより前の、より短い期間に書記を務めた。
hero.2=原稿はその年のうちに印刷に回された。スミスは1829年6月にこの作品の著作権を取得し、印刷はパルマイラのエグバート・B・グランディンの店で始まった。そこで植字工のジョン・H・ギルバートが、口述された原稿にはなかった句読点と段落分けを加えた。完成した書物は1830年3月に刊行された——約5,000部、グランディンの刷った全部数である。
hero.3=この書は、第一ニーファイ書からモロナイ書まで十五の書に分かれており、それぞれ編纂したとされる預言者的記録者の名が付けられている。1830年版のどの一冊にも節番号は一つもなかった——本文は、今日の読者が見るよりもはるかに長い章の中で、続けて書かれた段落として流れていた。今日使われている章と節の区分は、オーソン・プラットが編纂した1879年版に由来し、彼はまた章を短くし、最初の脚注を加えた。その後の版はさらに体裁を変えた。1920年にはジョージ・F・リチャーズを委員長とする委員会が本文を二段組みにし、章の要約と発音ガイドを加えた。1981年版は相互参照、章の見出し、その他の参考資料を更新した。そして2013年版は、1981年以降印刷版に入り込んだ組版上の不整合を修正した。
hero.4=この書は、末日聖徒運動が「標準聖典」と呼ぶ四つの書の一つであり、聖書、[[DC|教義と聖約]]、[[PGP|高価な真珠]]とともに数えられる。この資料体に収められている本文は、Mormon Documentation ProjectのJSONエクスポートに由来し、その管理者はこれをパブリックドメインであると宣言している。本文と節の区分は現行の標準版の文言に従っており、2013年版の組版上の修正を伴うが、今なお著作権で保護されている脚注、章の要約、序文は含まれていない。ここに収められているのは、特定の歴史的な印刷版ではなく、まさにこの現行の標準本文であるため、単一の出版年は記していない。

