fact.2.label=制作者
fact.2.value=ジョセフ・スミス・ジュニア（1805–1844）。「神の賜物と力によって」一組の古代の金属板から翻訳したと述べた。本文を書記に口述し、おもにオリバー・カウドリが、それより前の、より短い期間はマーティン・ハリスとエマ・スミスが書き取った
fact.3.label=出版
fact.3.value=1830年、ニューヨーク州パルマイラ。エグバート・B・グランディンが印刷、約5,000部
fact.4.label=構成
fact.4.value=十五の書、第一ニーファイ書からモロナイ書まで、それぞれ編纂したとされるニーファイ人またはヤレド人の記録者の名が付けられている。1830年版には節番号がなく、今日の章と節の区分はオーソン・プラットが編纂した1879年版に由来する
fact.5.label=位置づけ
fact.5.value=末日聖徒運動の四つの標準聖典の一つで、聖書、[[DC|教義と聖約]]、[[PGP|高価な真珠]]とともに数えられる
fact.6.label=このコーパスでは
fact.6.value=本文と節の区分は、2013年版の組版上の修正を伴う現行の標準的な文言に従っており、Mormon Documentation Projectがパブリックドメインと宣言したJSONエクスポートに由来する。著作権で保護されている脚注、章の要約、序文は含まれていない——そのためここでは単一の印刷年を示していない
