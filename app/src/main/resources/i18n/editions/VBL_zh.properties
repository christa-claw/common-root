title=Versión Biblia Libre — 关于此版本 | Common Root
description=Versión Biblia Libre：Free Bible Ministry 出版的西班牙文圣经，由 Jonathan Gallagher 与 Shelly Barrios de Avila 译出，作为英文 Free Bible Version 的西班牙文姊妹译本，并以可供任何用途的自由授权发布。
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre——意为“自由版圣经”——是英文 Free Bible Version 的西班牙文姊妹译本，由同一出版方 Free Bible Ministry 发行——这是一家总部设于马里兰州劳雷尔（Laurel）的非营利机构。其新约部分归于译者 Jonathan Gallagher 与 Shelly Barrios de Avila 名下，Gustavo Sanabria 与 Rebekah Põldaas 为协作者，版权标注为2018年至2020年，归于 Gallagher 与 Barrios de Avila。与其英文姊妹译本一样，它的存在是为了消除版权页作为使用障碍：任何人均可复制、付印、发布于网络或加以改编该文本，无需支付版税，也无需征得许可。
hero.2=已出版的前言明确记载了新约部分的依据——直接译自希腊文 Nestle–Aland 文本，即各圣经公会所用的校勘本——但并未单独指明旧约部分的源文本，尽管本语料库所收的版本是完整的六十六卷新教正典。材料留下空白之处，这里也同样留白，而非以猜测填补。
hero.3=在本阅读器中，它是五种西班牙文版本之一。西班牙文界面仍默认打开 [[RVR09|Reina-Valera 1909]]，这是一部来自完全不同、历时数百年之久传统的公共领域文本；本版本则需从其自身卡片切换而至，与 [[BES|Biblia en Español Sencillo]]、[[PDDPT|Palabra de Dios para Ti]] 及 [[NBLA|Nueva Biblia de las Américas]] 并列。它不是其中任何一者的修订本，故谱系阶梯中未为其记录母本——在 Versión Biblia Libre 某节之下展开的阶梯会直接落到以 ≈ 标记的原文语言底层。它在本语料库中最亲近的“近亲”其实并非西班牙文：[[FBV|Free Bible Version]]，出自同一机构的英文译本，采用同一授权。

