title=Latinalainen Vulgata — Tietoja tästä laitoksesta | Common Root
description=Latinalainen Vulgata: Hieronymuksen käännös, joka tilattiin vuonna 382 ja valmistui noin 405, kantoi Raamattua läpi Länsi-Euroopan tuhannen vuoden ajan ja oli ensimmäinen Gutenbergin painama kirja.
heroHeading=Latinalainen Vulgata
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=Neljännen vuosisadan lopulla lännessä kiertäneet latinankieliset evankeliumit olivat keskenään ristiriidassa, jäljennös jäljennökseltä, ja paavi Damasus I pyysi sihteeriään Hieronymusta selvittämään ne. Hieronymus aloitti korjaustyöstä. Hän päätyi käyttämään siihen yli kaksikymmentä vuotta, suurimman osan niistä Betlehemissä, ja tuottamaan jotakin, jota kukaan ei ollut pyytänyt.
hero.2=Ratkaisu, joka teki työstä sen mitä se on, oli kääntää Vanha testamentti hepreasta eikä siitä kreikankielisestä Septuagintasta, jota kirkko oli aina käyttänyt. Hieronymus kutsui periaatetta nimellä “hebraica veritas” — heprealainen totuus — ja se oli kiistanalainen: Augustinus kirjoitti hänelle huolissaan siitä, että seurakunnat nousisivat kapinaan, kun tutut sanamuodot vaihtuisivat heidän allaan. Hieronymus teki sen silti. Tulos on syy siihen, että juuri latinankielinen Raamattu on lähempänä hepreaa kuin se kreikankielinen Raamattu, jota ensimmäiset kristityt lukivat.
hero.3=Siitä tuli Länsi-Euroopan Raamattu vuosituhanneksi, mikä on pidempi kausi kuin yhdelläkään käännöksellä ennen tai jälkeen. Siitä Wycliffe käänsi englanniksi, ja siitä työskentelivät myös Douay-Rheimsin kääntäjät — joten tämän aineiston Douay-Rheims on sen suora jälkeläinen, ja kyseisen laitoksen polveutumisaskelmat osoittavat tänne takaisin. Se oli myös ensimmäinen laaja kirjapainotaidolla painettu kirja: Raamattu, jonka Gutenberg latoi Mainzissa noin 1455, oli tämä teksti.

