title=Tyndales Nya testamente 1534 — Om denna utgåva | Common Root
description=William Tyndales Nya testamente, den första engelska översättningen gjord från grekiskan och den första som trycktes, i hans egen revision från 1534 — ordalydelsen under Genèvebibeln och King James Version.
heroHeading=Tyndales Nya testamente 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=På Tyndales tid var en engelsk bibel fortfarande olaglig. Oxfordkonstitutionerna från 1409 förbjöd var och en att översätta Skriften till engelska, eller att läsa en sådan översättning, utan en biskops godkännande. William Tyndale bad Londons biskop, Cuthbert Tunstall, om detta godkännande 1523, blev avvisad och lämnade året därpå England för att göra arbetet utan det. Med Erasmus grekiska Nya testamente framför sig, och Luthers tyska och den latinska Vulgata bredvid, gjorde han det första engelska Nya testamentet översatt från grekiskan, och det första som någonsin trycktes. Ett första försök i Köln 1525 avbröts av en razzia mot tryckeriet; den fullständiga boken kom från Peter Schöffers press i Worms 1526 och smugglades in i England, där biskoparna köpte upp exemplar och brände dem.
hero.2=Texten här är Tyndales egen revision, tryckt i Antwerpen 1534, där han gick igenom grekiskan på nytt, rättade sin första version och lade till förord och anmärkningar. Den var lika mycket ett ställningstagande som en översättning. Thomas More angrep honom för att han skrev ”församling” (congregation) där kyrkan sade kyrka, ”äldste” (elder) där den sade präst, och ”kärlek” (love) där den sade charity, och alla tre valen står kvar i denna text: Matteus 16:18 lyder ”apon this rocke I wyll bylde my congregacion”. Tyndale reviderade ännu en gång 1535, greps i Antwerpen i maj samma år och dömdes 1536 som kättare, ströps och brändes i Vilvoorde utanför Bryssel.
hero.3=I denna läsare hittar man honom underst. Tyndale är en registrerad stegpinne under både Genèvebibeln och King James Version, och därmed, längre ner på stegen, också under Revised Version, American Standard Version och World English Bible, som vilar på King James. Kliver man ner från en King James-vers förbi Genèvebibeln rör sig ordalydelsen ofta knappt alls — vilket är själva poängen; vid 1 Korinthierbrevet 13:13 gör den det, där Tyndale och Genèvebibeln säger love och King James säger charity. Under Tyndale finns ingen registrerad förlaga. Han arbetade från Erasmus grekiska, men den Textus Receptus som finns här är utgåvan från 1550, en generation efter honom, och Luther här är bibeln från 1545 och inte det Nya testamente från 1522 som han använde, så stegen går direkt ner till grundspråksbotten. Bara Nya testamentet finns här, i hans egen stavning: Matteus börjar ”This is the boke of the generacion of Iesus Christ”.

