title=Baibal Olcim — Über diese Ausgabe | Common Root
description=Baibal Olcim: die Bibel auf Matu-Chin, einer Minderheitensprache in Myanmars Chin-Staat, verbreitet von eBible.org als eine wirklich gemeinfreie Ausgabe, deren Übersetzer und Übersetzungsdatum nicht überliefert sind.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Matu-Chin — auch Matupi-Chin genannt — ist eine sinotibetische Sprache mit etwa 34.000 Sprechern, die sich um Matupi im Süden von Myanmars Chin-Staat konzentrieren, mit verwandten Gemeinschaften jenseits der Grenze im indischen Bundesstaat Mizoram. Baibal Olcim ist die Bibel in dieser Sprache, und sie ist der einzige Matu-Chin-Text in diesem Korpus.
hero.2=Was die Aufzeichnung nicht hergibt, ist, wer sie übersetzt hat oder wann. eBible.org, das den Text verbreitet, gibt nur an, dass er gemeinfrei ist, und verzeichnet ihn unter hlt, dem ISO-639-3-Code für Matu-Chin — kein Übersetzer, kein Komitee, kein Übersetzungsdatum. Diese Seite lässt beides offen, statt zu raten. Derselbe Code hat hier seine eigene kleine Geschichte: Ein früherer Versuch, diesem Korpus eine zweite Hindi-Bibel hinzuzufügen, wurde aufgrund einer ähnlich aussehenden Abkürzung unter hlt abgelegt, bis Matu-Chin-Verse dort auftauchten, wo Hindi-Verse erwartet wurden, und den Irrtum aufdeckten. Diese Ausgabe ist diejenige, die tatsächlich gegen die Sprache geprüft wurde, die ihr Code benennt.
hero.3=Sie wurde aufgenommen für das, was sie ist, nicht für ihren Umfang: eine wirklich gemeinfreie Bibel, nicht nur eine lizenzierte, in der Sprache einer christlichen Minderheit, die im Bürgerkrieg Myanmars, konzentriert in und um den Chin-Staat, echte Verfolgung erlebt hat. Ein Reader, der von seinen Nutzern nichts verlangt und keinen von ihnen verfolgt, ist genau für einen solchen Fall gedacht — was auch größtenteils erklärt, warum diese Seite so wenig sonst in ihre Fakten zu setzen hat.

