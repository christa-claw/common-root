title=Bible in Basic English — Über diese Ausgabe | Common Root
description=Die Bible in Basic English, von einem Komitee unter S. H. Hooke aus dem Hebräischen und dem Griechischen übersetzt und bei Cambridge University Press erschienen — das Neue Testament 1941, die ganze Bibel 1949 — im Basic English C. K. Ogdens mit 850 Wörtern, ergänzt um 150 weitere für die Dichtung und für die Bibel.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=Basic English stammt von C. K. Ogden vom Orthological Institute: eine Liste von 850 englischen Wörtern, als internationale Hilfssprache vorgeschlagen. Die Bible in Basic English entstand in einem Komitee unter der Leitung von S. H. Hooke (1874–1968), dem Alttestamentler, der 1930 Samuel-Davidson-Professor für Alttestamentliche Studien an der Universität London wurde, in Zusammenarbeit mit dem Orthological Institute. Sie wurde aus dem Hebräischen und dem Griechischen übersetzt, nicht aus einer früheren englischen Übersetzung vereinfacht, und der Basic-Text wurde anschließend von einem Komitee, das die Syndics der Cambridge University Press bildeten, im Einzelnen durchgesehen. Zu Ogdens 850 Wörtern fügten die Übersetzer 100 hinzu, die bei der Dichtung helfen, und 50, die für die Bibel nötig waren, zusammen 150. Cambridge University Press veröffentlichte das Neue Testament 1941 und die ganze Bibel 1949; ein Druck von 1965 wurde in den Vereinigten Staaten ohne Copyright-Vermerk vertrieben, und deshalb ist der Text dort gemeinfrei.
hero.2=Das Ergebnis liest sich schlicht und gleichmäßig, innerhalb dieses kleinen Wortschatzes. Genesis beginnt „At the first God made the heaven and the earth.“ Psalm 23 beginnt „The Lord takes care of me as his sheep; I will not be without any good thing.“ Das Johannesevangelium beginnt „From the first he was the Word, and the Word was in relation with God and was God,“ und Johannes 3:16 lautet „For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.“ Der Gottesname ist durchgehend „the Lord“, außer in acht Versen, in denen er als „Yahweh“ wiedergegeben ist, darunter Exodus 6:3, wo Gott sagt, Abraham, Isaak und Jakob „had no knowledge of my name Yahweh“, und Psalm 83:18. Wo das Hebräische zu unsicher war, um es zu übersetzen, setzten die Übersetzer Punkte an seine Stelle, und in unserer Abschrift bestehen einige Verse, darunter Hiob 34:29–33 und Hiob 36:16–20, aus nichts als „...“.
hero.3=Unsere Abschrift umfasst 66 Bücher von Genesis bis zur Offenbarung, ohne die Apokryphen, in der Kapitel- und Verszählung der King James und der Revised Version — 150 Psalmen, und Maleachi, das mit Kapitel 4 endet. Psalmüberschriften enthält sie nicht: Psalm 51 beginnt mit „Have pity on me, O God“. Das Neue Testament ist keine Übersetzung des empfangenen Textes. Sechzehn Verse, die die textkritischen Ausgaben auslassen, darunter Matthäus 17:21, Apostelgeschichte 8:37 und Römer 16:24, stehen hier nur als leere, mit [] markierte Stellen, und 1. Johannes 5:7 hat keine drei Zeugen im Himmel; die Erzählung von der Ehebrecherin, Johannes 7:53–8:11, steht in eckigen Klammern, während der längere Markusschluss erhalten ist. In diesem Reader steht sie für sich. Das Korpus verzeichnet für sie keine Vorlage, sodass eine Abstammungssprosse, die man unter einem ihrer Verse öffnet, geradewegs auf den mit ≈ markierten Ursprachenboden fällt: im Alten Testament den Codex Leningradensis, im Neuen den Textus Receptus, einen griechischen Text, dem diese Übersetzung an jenen sechzehn Stellen nicht folgt. Auf ihr ist ihrerseits nichts als stehend verzeichnet. Keine Oberflächensprache öffnet auf dieser Ausgabe; eine englische Oberfläche öffnet auf der New International Version, und diese hier erreicht man über ihre eigene Karte im Übersetzungsraster.

