fact.8.label=Abstammung
fact.8.value=Keine verzeichnete Vorlage und nichts als auf ihr stehend verzeichnet – eine Sprosse öffnet geradewegs auf den Ursprachenboden, im Alten Testament auf [[WLC|den Codex Leningradensis]], im Neuen auf [[TR|den Textus Receptus]], einen griechischen Text, dem diese Übersetzung nicht folgt
