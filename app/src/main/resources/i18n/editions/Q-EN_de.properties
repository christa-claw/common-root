title=Koran — Pickthall — Über diese Ausgabe | Common Root
description=Muhammad Marmaduke Pickthalls Übersetzung von 1930, die erste englische Koranübersetzung durch einen Muslim, dessen Muttersprache Englisch war — entstanden im Dienst des Nizam von Hyderabad und mit dem Rat der Gelehrten von al-Azhar, und in diesem Korpus das Englisch, das standardmäßig unter dem arabischen Text erscheint.
heroHeading=Koran — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) war ein englischer Schriftsteller, zu seiner Zeit von H. G. Wells und D. H. Lawrence geschätzt, bevor er zum Übersetzer heiliger Schriften wurde. Er erklärte seinen Übertritt zum Islam im November 1917, nach einem Vortrag mit dem Titel „Islam and Progress" vor der Muslim Literary Society in Notting Hill, und legte im selben Monat in der Woking Muslim Mission die Schahada ab. Ein Jahrzehnt später war er Rektor der Chadarghat High School in Hyderabad, im Dienst des Nizam, und von dort aus nahm er 1928 ein zweijähriges Sabbatjahr, um das zu tun, was er seit seiner Konversion tun wollte: den Koran ins Englische zu übertragen.
hero.2=Er tat es nicht allein und nicht in Eile. 1929 verbrachte er drei Monate in Kairo, wo ihm die Unterstützung Rashid Ridas Türen öffnete, um den Segen der Gelehrten von al-Azhar für ein Vorhaben zu suchen, vor dem einige von ihnen gewarnt worden waren, es könne sie ihre Stellung kosten — ein Teil von al-Azhar hielt das Übersetzen des Korans überhaupt für eine schwerwiegende Angelegenheit. Pickthall machte trotzdem weiter und beriet sich weiterhin mit ihnen. Was er 1930 als „The Meaning of the Glorious Koran: An Explanatory Translation" veröffentlichte, trägt diese Vorsicht schon im Titel: nicht „der Koran auf Englisch", sondern eine Erklärung seiner Bedeutung, denn keine Übersetzung konnte, seiner eigenen erklärten Ansicht nach, der Koran selbst sein. Alfred A. Knopf brachte die Erstausgabe in New York heraus; eine zweisprachige Ausgabe der Regierungsdruckerei von Hyderabad folgte.
hero.3=Das Times Literary Supplement nannte sie „a great literary achievement", und sie wird gewöhnlich als die erste englische Koranübersetzung durch einen Muslim beschrieben, dessen Muttersprache Englisch war — frühere englische Fassungen, etwa von Sale und Rodwell, waren das Werk nichtmuslimischer Orientalisten. Pickthalls Übersetzung ist seitdem fast ein Jahrhundert lang im Druck und in Gebrauch geblieben, eine von nur wenigen englischen Wiedergaben, die gewöhnliche Leser, nicht nur Gelehrte, tatsächlich lesen.
hero.4=In diesem Korpus ist es die Übersetzung, die standardmäßig unter dem uthmanischen arabischen Text erscheint — das Arabische bleibt die Grundlage jeder Spalte, und dieses Englisch wird als Erläuterung daneben angezeigt, ohne es je zu ersetzen. Es wurde für diese Rolle ebenso aus einem unglamourösen Grund wie aus einem literarischen gewählt: Eine Durchsicht der verfügbaren Übersetzungen fand nur zwei englische Fassungen, die zweifelsfrei gemeinfrei waren, diese und die von Yusuf Ali aus dem Jahr 1934, sowie Sablukows russische von 1878 für eine dritte Sprache. Der Text hier ist eine Digitalisierung der Übersetzung, bezogen über alquran.cloud und nicht an eine bestimmte Druckausgabe gebunden, weshalb er als Pickthalls Wortlaut und nicht als Faksimile einer bestimmten Ausgabe zu lesen ist.

