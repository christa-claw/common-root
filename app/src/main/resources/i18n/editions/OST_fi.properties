title=Ostervaldin Raamattu (ranska) — Tietoja tästä laitoksesta | Common Root
description=Ostervaldin Raamattu: neuchâtelilaisen pastorin tarkistama Genevan ranskankielinen protestanttinen Raamattu, julkaistu ensi kerran 1744, tässä myöhempänä tarkistuksena nykyranskan oikeinkirjoituksella.
heroHeading=Ostervaldin Raamattu
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald syntyi Neuchâtelissa 1663 ja kuoli siellä 1747. Hänet vihittiin papiksi kotikaupungissaan 1683, ja hän palveli lähes koko ikänsä sen kirkossa, ensin diakonina ja vuodesta 1699 pastorina, ja luennoi lisäksi teologiaa. Hänen Raamattunsa ei ole uusi käännös hepreasta ja kreikasta vaan Genevan ranskankielisen protestanttisen Raamatun tarkistus — sen käännöksen, jota ranskankieliset reformoidut seurakunnat olivat lukeneet kuudennellatoista vuosisadalta asti. Ostervaldin tarkistama teksti julkaistiin ensi kerran 1744, kolme vuotta ennen hänen kuolemaansa, ja sitä painettiin ja tarkistettiin yli kahden vuosisadan ajan; se tunnettiin hyvin myös Britanniassa.
hero.2=Tämän aineiston sanamuoto ei ole vuoden 1744 ranskaa. Kahdeksannellatoista vuosisadalla kirjoitettiin ”étoit”, missä nykyranska kirjoittaa ”était”; tässä kappaleessa on kauttaaltaan ”était” eikä kertaakaan ”étoit”, joten se on peräisin jostakin myöhemmästä tarkistuksesta, joka säilytti Ostervaldin nimen. Tunnetuin on Ranskan raamattuseuran (Société biblique de France) vuonna 1881 julkaisema tarkistus, jonka Uuden testamentin teki Ch. L. Frossard, ja tuota tekstiä on ajantasaistettu vielä 1996. eBible.org, josta tämä kappale on, mainitsee vain nimen ”Ostervald” eikä tarkistusta, joten tämäkään sivu ei nimeä sitä. Muutama piirre näkyy lähes joka sivulla. Jumalan nimi on ”l'Éternel”, Iankaikkinen, kuten Segondissa ja ranskalaisessa Darbyssa: ”L'Éternel est mon berger; je n'aurai point de disette” psalmissa 23. Jesajan 7:14 säilyttää muodon ”la vierge sera enceinte” — neitsyt — missä Segondilla on nuori nainen. Ja Uusi testamentti säilyttää Textus Receptuksen lukutapoja, jotka kriittiset laitokset jättävät pois: 1. Johanneksen kirjeen jakeessa 5:7 ovat kolme taivaallista todistajaa, ”le Père, la Parole, et le Saint-Esprit”, jotka sen rinnalla olevasta Segondista puuttuvat.
hero.3=Tässä lukuohjelmassa se on yksi kolmesta ranskankielisestä Raamatusta, Segondin ja ranskalaisen Darbyn rinnalla. Ranskankielinen käyttöliittymä ei avaa sitä: ranskalle ei ole valittu poimintaa, joten lukuohjelma ottaa luettelojärjestyksessä ensimmäisen ranskankielisen Raamatun, joka on Darby. Polveutumisaskelmiin sille ei ole kirjattu kantatekstiä — sen tarkistamaa Genevan Raamattua ei ole tässä aineistossa — joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan: Vanhassa testamentissa Leningradin koodeksiin ja Uudessa Textus Receptukseen, siihen kreikkalaiseen perinteeseen, jota tämä Raamattu todella seuraa. Sen askelmamerkintä kantaa vuotta 1744, Ostervaldin oman tarkistuksen vuotta eikä näytetyn sanamuodon. Avaa se Segondin rinnalle, niin näet kahden vuosisadan ranskalaisen protestanttisen raamatunkielen vierekkäin.

