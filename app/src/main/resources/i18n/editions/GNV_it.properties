title=Bibbia di Ginevra 1599 — Su questa edizione | Common Root
description=La Bibbia di Ginevra: realizzata da protestanti inglesi esuli a Ginevra, prima Bibbia inglese con versetti numerati e note marginali, letta dalla generazione di Shakespeare e piolo sotto la Bibbia di re Giacomo.
heroHeading=Bibbia di Ginevra 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Questa Bibbia fu fatta all'estero, da persone che non potevano restare in patria senza pericolo. Quando Maria I salì al trono nel 1553 e l'Inghilterra tornò a Roma, qualche centinaio di protestanti partì; alcuni si stabilirono nella Ginevra di Calvino, dove c'erano torchi, erudizione ebraica e greca e nessun vescovo cui rendere conto. William Whittingham vi pubblicò un Nuovo Testamento nel 1557. Un gruppo guidato da Anthony Gilby percorse l'Antico Testamento, e la Bibbia completa fu stampata a Ginevra da Rowland Hall nel 1560, due anni dopo la morte di Maria, quando la maggior parte degli esuli era già rientrata.
hero.2=Ciò che produssero cambiò l'aspetto di una Bibbia inglese. Fu la prima a numerare ogni versetto, così che un lettore potesse essere rimandato a una riga anziché a un capitolo. Fu composta in tondo invece che in gotico e pubblicata abbastanza piccola e abbastanza a buon mercato da essere posseduta anziché incatenata a un leggio. E i margini erano pieni: rimandi, glosse delle parole difficili, carte e note che spiegavano che cosa significasse un passo. È quest'ultima cosa che spiega perché fu amata e perché fu malvista. Le note sono riformate, in certi punti aspramente, e dicono al lettore che cosa pensare dei re con la stessa prontezza con cui gli dicono che cosa pensare della dottrina.
hero.3=La data di questa edizione richiede una cautela, perché la Bibbia di Ginevra non fu un libro ma un testo ristampato per ottant'anni mentre le sue parti cambiavano. Nel 1576 Laurence Tomson sostituì il Nuovo Testamento con una propria revisione, condotta sull'edizione greca di Teodoro di Beza del 1565, e dal 1587 è quello il Nuovo Testamento che la maggior parte delle Bibbie di Ginevra reca. Nel 1599 vi si aggiunsero le note di Franciscus Junius sull'Apocalisse. “1599” indica dunque una configurazione — il Nuovo Testamento di Tomson più Junius sull'Apocalisse — più precisamente di quanto indichi un anno di stampa, e Bibbie recanti quella data continuarono a essere stampate dopo. Per questo la scheda di catalogo lascia l'anno vuoto mentre il segno di piolo, che ha bisogno di qualcosa di breve da mostrare, riporta GNV 1599.
hero.4=La sua posizione in questa raccolta è una cerniera. La catena di discendenza più lunga qui presente va dalla World English Bible all'American Standard Version, alla Revised Version, alla Bibbia di re Giacomo, e poi a questa: si apra un piolo in più sotto un versetto di re Giacomo e la formulazione di Ginevra compare al di sotto, che è il modo più chiaro di vedere quanto della Bibbia di re Giacomo sia ereditato anziché composto. Sotto la Ginevra non c'è più nulla in inglese — soltanto il greco e l'ebraico, il Textus Receptus e il Codice di Leningrado di Westminster, dove la scala tocca il fondo. Il testo è dato come l'edizione lo porta, grafia compresa, sicché Genesi 1:1 dice heauen; i titoli dei salmi e il colofone della Lettera agli Ebrei corrono dentro l'inizio del primo versetto, come quelle stampe li disponevano, e sono stati lasciati lì anziché ripuliti.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=inglese — elisabettiano, nella grafia originale
fact.2.label=Realizzata da
fact.2.value=protestanti inglesi fuggiti dal regno di Maria I e stabilitisi a Ginevra — William Whittingham curò il Nuovo Testamento del 1557 e un gruppo guidato da Anthony Gilby l'Antico
fact.3.label=Prima edizione completa
fact.3.value=1560, stampata a Ginevra da Rowland Hall
fact.4.label=Antico Testamento da
fact.4.value=l'ebraico masoretico — [[WLC|il Codice di Leningrado di Westminster]] è il testimone di quel testo in questo corpus
fact.5.label=Nuovo Testamento da
fact.5.value=il greco della linea del [[TR|Textus Receptus]]; dal 1576 la revisione di Laurence Tomson, condotta sull'edizione greca di Beza del 1565, soppiantò il Nuovo Testamento di Whittingham nella maggior parte delle tirature
fact.6.label=Che cosa indica “1599”
fact.6.value=le tirature che recano il Nuovo Testamento di Tomson insieme alle note di Franciscus Junius sull'Apocalisse, entrate in quell'anno nella Bibbia di Ginevra
fact.7.label=Primati
fact.7.value=la prima Bibbia inglese con tutti i versetti numerati, composta in tondo anziché in gotico e dotata di un apparato completo di note marginali — una Bibbia da studio prima che il termine esistesse
fact.8.label=Contestata da
fact.8.value=Giacomo I, che riteneva sediziose le note marginali — una lagnanza che contribuì ad avviare [[KJV|la Bibbia di re Giacomo]]
fact.9.label=Anno nel catalogo
fact.9.value=vuoto sulla scheda Informazioni, benché il segno di piolo riporti GNV 1599 — la Bibbia di Ginevra fu ristampata dal 1560 fino agli anni 1640, con il Nuovo Testamento e le note che cambiavano sotto un unico nome
fact.10.label=In questo corpus
fact.10.value=tutti i 66 libri, senza apocrifi, grafia non modernizzata — Genesi 1:1 recita “the heauen and the earth”
fact.11.label=Sotto un piolo
fact.11.value=[[TR|Textus Receptus]] e [[WLC|Codice di Leningrado di Westminster]]; la Ginevra è essa stessa il primo piolo sotto [[KJV|la Bibbia di re Giacomo]]
