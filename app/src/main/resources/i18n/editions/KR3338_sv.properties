title=Kirkkoraamattu 1933/38 — Om denna utgåva | Common Root
description=Kirkkoraamattu 1933/38: den finska kyrkobibeln, nyöversatt från hebreiska och grekiska och antagen i två halvor, 1933 och 1938, sedan en kommitté arbetat med den i omkring sjuttio år.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=Namnet är två årtal, för boken kom i två halvor. Finlands evangelisk-lutherska kyrka antog Gamla testamentet 1933 och Nya testamentet 1938, och på finska har den sedan dess kallats 1933/38 års kyrkobibel. De där slutårtalen döljer hur långt tillbaka början låg: översättningskommittén hade tillsatts 1861. Omkring sjuttio år, och mer än en generation översättare, skiljer uppdraget från den färdiga bibeln.
hero.2=Vad kommittén åstadkom var en nyöversättning och inte en revision. Den arbetade från Gamla testamentets hebreiska och Nya testamentets grekiska — inte via latinska, tyska eller svenska mellanled, och inte från den finska bibel som redan var i bruk. Ändå var den medvetet efterträdare till den bibeln, Biblia 1776, som varit kyrkans text i ett och ett halvt sekel, och den behöll en hel del av den äldre bokens ordförråd och fall. Det arvet är skälet till att en bibel färdig 1938 redan lät ålderdomlig för sina första läsare, och till att den fortfarande bär den finska skriftens högtidliga tonfall. Den förblev officiell kyrkobibel till 1992.
hero.3=I den här läsaren gör den två saker. Ställ in gränssnittet på finska och det är den här utgåvan som öppnas — katalogens egen ordning skulle ge dig Biblia 1776 i stället, så det finska förvalet är ett medvetet val och inte en tillfällighet i alfabetet. Den är också översta stegpinnen i den finska härstamningskedjan: öppna en stegpinne under en KR3338-vers och Biblia 1776 träder fram under den. Läs den stegpinnen som succession inom en och samma kyrkas bibel snarare än som källa, för 1933/38 års översättare hade hebreiskan och grekiskan framför sig, inte 1776 års text. Under Biblia 1776 fortsätter kedjan: Biblia 1642, som 1776 reviderar, sedan Agricolas finska från 1548, som den kommittén i sin tur reviderade, och Luthers tyska från 1545, uppslagen bredvid dem medan de arbetade. Först under dem når stegen hebreiskan och grekiskan.

