title=World English Bible — Bu Baskı Hakkında | Common Root
description=World English Bible: 1901 tarihli American Standard Version'ın modern İngilizceye gözden geçirilmişi; 1994'te Michael Paul Johnson tarafından başlatıldı, Yeni Antlaşması Yunanca çoğunluk metnine uyduruldu ve bilerek kamu malı kılındı.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=World English Bible bir telif hakkı sorunu yüzünden vardır. 1994'te, tam zamanlı bir işten artan saatlerde Kutsal Kitap çeviren mühendis Michael Paul Johnson, herkesin serbestçe çoğaltabileceği modern İngilizce bir Kutsal Kitabı bitirmenin ne kadar süreceğini hesapladı ve cevabı beğenmedi. Sıfırdan çevirmeyi bıraktı ve 1901 tarihli American Standard Version'dan yeniden başladı: kesin, saygı gören ve — Kral James Çevirisi'nin tersine, ki İngiltere ile Galler'de hâlâ Taç'ın imtiyaz belgesiyle yüklüdür — telif hakkından tümüyle azade. Kendi yazdığı bir program ASV metnini tarayarak hiçbir modern Kutsal Kitabın kullanmadığı sözcükleri buldu, karşılıklar önerdi ve değişimleri on beş dakika kadar bir sürede yaptı. Programın yapamadığı her şey — sözcük sırası, noktalama, tırnaklar — sonraki yıllarda elle yapıldı; metin 1997'den başlayarak yayımlandı ve gözden geçirilmiş hâlleriyle yeniden yayımlandı.
hero.2=Onu, gözden geçirdiği baskıdan iki şey ayırır. Birincisi Yunancadır. ASV'nin Yeni Antlaşması, sonradan Nestle-Aland baskısı olacak metne yakın duran, gözden geçirenlerin eleştirel metnini izliyordu; World English Bible ise Bizans çoğunluk metnine uyduruldu, dolayısıyla ne kökünün metnidir ne de Kral James çevirmenlerinin kullandığı Textus Receptus. İkincisi Tanrı'nın adıdır. ASV “Jehovah” bastı; World English Bible “Yahweh” basar ve Yaratılış 2:4'teki bir dipnot bu seçimi “the LORD” bekleyen okura açıklar. İngiliz baskısı “LORD”a döner — bu derlemedeki nüsha Amerikan nüshasıdır, okunan “Yahweh”tir. Bu iki karar dışında kökünün tarzında biçimsel eşdeğerlikçi bir çeviri olarak kalır: İbranice ile Yunancanın sözcük sırasına aynı yakın bağlılık, ama artık açıklama gerektirmeyen bir yazım ve dilbilgisiyle.
hero.3=Okuyucuda o bir yapraktır, hem de derlemenin en uzun dalındaki tek yaprak. World English Bible'ın bir ayetinin altında bir basamak açın, altında American Standard Version belirir, onun da altında Revised Version, Kral James Çevirisi ve Cenevre Kutsal Kitabı, ≈ ile işaretli özgün dil tabanına dek. Derlemede hiçbir şey kendi sırasında World English Bible'ın üstünde durmaz. O aynı zamanda bu dalın en geniş metnidir: American Standard Version'ın apokrif kitapları yoktu, bu yüzden World English Bible'ınkiler ayrıca hazırlandı — Kral James apokriflerinden ve Brenton'ın İngilizce Septuaginta'sından — ve bizim nüshamız seksen kitap taşırken altındaki ASV altmış altı taşır; bunların arasında Kral James apokriflerinde bulunmayan 3. ve 4. Makabiler ile 151. Mezmur vardır. Onlarda bulunan Baruk ise bizim nüshamızda yoktur. Hakkında sayfası bu baskının yıl sütununu boş bırakır, haklı olarak: tek bir yayım yılı yoktur. Derleme, basamak etiketlerinin sıralanacak bir şeyi olsun diye 2000 damgasını vurur.

