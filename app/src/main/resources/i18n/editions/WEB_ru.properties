title=World English Bible — Об этом издании | Common Root
description=World English Bible: пересмотр American Standard Version 1901 года на современном английском, начатый в 1994 году Майклом Полом Джонсоном; Новый Завет приведён в соответствие с греческим текстом большинства, а само издание намеренно отдано в общественное достояние.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=World English Bible обязана своим существованием проблеме авторского права. В 1994 году Майкл Пол Джонсон, инженер, переводивший Библию в часы, остававшиеся от работы на полную ставку, подсчитал, сколько времени уйдёт у него на современный английский перевод, который всякий мог бы свободно копировать, — и ответ ему не понравился. Он бросил переводить с нуля и начал заново от American Standard Version 1901 года: точной, уважаемой и, в отличие от Библии короля Иакова (в Англии и Уэльсе до сих пор обременённой королевским патентом), совершенно свободной от авторского права. Написанная им самим программа прошла по тексту ASV, отыскивая слова, которых не употребляет ни одна современная Библия, предложила замены и произвела их примерно за пятнадцать минут. Всё, что программе было не под силу, — порядок слов, пунктуацию, кавычки — делали вручную в последующие годы, и текст выходил, и выходил снова пересмотрами, начиная с 1997 года.
hero.2=Две вещи отделяют её от издания, которое она пересматривает. Первая — греческий. Новый Завет ASV следовал критическому тексту пересматривавших, близкому к тому, что станет изданием Нестле — Аланда; World English Bible же была приведена в соответствие с византийским текстом большинства, так что она не есть ни текст своей родоначальницы, ни Textus Receptus, которым пользовались переводчики короля Иакова. Вторая — имя Божие. ASV печатала “Jehovah”; World English Bible печатает “Yahweh”, а примечание к Быт. 2:4 объясняет выбор читателю, ожидающему “the LORD”. Британское издание возвращается к “LORD” — экземпляр в этом собрании американский, так что читается “Yahweh”. За пределами этих двух решений она остаётся переводом формального соответствия в манере своей родоначальницы: то же тесное следование еврейскому и греческому порядку слов, но в орфографии и грамматике, которые больше не требуют пояснения.
hero.3=В читателе это лист — и единственный на самой длинной ветви собрания. Откройте ступень под стихом World English Bible, и под ним появится American Standard Version, а ниже — Revised Version, Библия короля Иакова и Женевская Библия, вплоть до пола исходных языков, помеченного знаком ≈. Ничто в собрании, в свой черёд, не стоит на World English Bible. Это и самый широкий текст этой ветви: у American Standard Version не было неканонических книг, поэтому книги World English Bible были сделаны отдельно — по апокрифам короля Иакова и английской Септуагинте Брентона, — и наш экземпляр несёт восемьдесят книг там, где лежащая под ним ASV несёт шестьдесят шесть; среди них 3-я и 4-я Маккавейские и псалом 151, которых у апокрифов короля Иакова нет. Книги же Варуха, которая у них есть, в нашем экземпляре недостаёт. Страница «О собрании» оставляет графу года для этого издания пустой — и правильно: единого года издания нет. Собрание проставляет 2000, чтобы плашкам ступеней было по чему упорядочиваться.

