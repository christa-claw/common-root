title=Диодати 1885 (итальянская) — Об этом издании | Common Root
description=Итальянская Библия Джованни Диодати в облике XIX века: его текст 1641 года в редакции 1821 года, в издании, датированном 1885 годом, — тот же перевод, что и другой Диодати в этом собрании, но иначе разделённый на стихи.
heroHeading=Диодати 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Это перевод Джованни Диодати — женевца из луккской семьи, родившегося в 1576 году, который в 1607 году выпустил первую итальянскую Библию, сделанную с еврейского и греческого, а не с латыни, и в 1641 году, за восемь лет до смерти, пересмотрел её с собственными примечаниями. У другого Диодати в этом собрании есть своя страница, где рассказана эта история. Два века после него текст жил переизданиями, а с 1808 года Британское и иностранное библейское общество выпускало его издание за изданием, потому что для итальянских протестантов печатать было больше нечего.
hero.2=Этот файл — один из тех поздних обликов. eBible.org, предоставляющий его от имени Объединённых библейских обществ, описывает его как перевод Диодати 1641 года, пересмотренный в 1821 году, в издании, датированном 1885 годом. Кто сделал редакцию 1821 года и какая типография напечатала издание 1885 года, проект не установил, поэтому страница их не называет. Дата здесь не та проблема, что у другого Диодати, чей ярлык — год смерти Диодати: 1885 — собственная дата издания, каталог её хранит, и метка ступени её показывает.
hero.3=Рядом с другим Диодати формулировка в каждой пробе одна и та же: «il Signore è il mio pastore» в Псалме 23, «la Vergine concepirà» в Исаии 7:14, небесные свидетели в 1 Иоанна 5:7, славословие в конце молитвы Господней, Деяния 8:37 полностью. Имя Божие — «il Signore», Господь, как писал Диодати; заменила его на «l'Eterno» Риведута, редакция этого текста, вышедшая в 1924 году. Различается деление на стихи. Более чем в тридцати местах эта копия следует другой схеме, близкой к еврейской: молитва Ионы начинается с 2:1, и глава доходит до 2:11, в Исаии 8 есть 23-й стих, Иов 39 продолжается до стиха 38, а первый стих Колоссянам 4 стоит в конце главы 3, — так что всего стихов на семь меньше. И в этой копии нет ни одного надписания псалмов: Псалом 51 начинается прямо со слов «Abbi pietà di me, o Dio», тогда как другой Диодати сливает надписание с первым стихом. Собственная подача этого текста на eBible.org показывает надписания, так что, скорее всего, они потерялись при импорте в этом проекте, а не отсутствуют в издании 1885 года.
hero.4=В этой читалке она одна из трёх итальянских Библий. Итальянский интерфейс открывает другого Диодати, Диодати 1649, который идёт первым в порядке каталога, поскольку для итальянского нет отобранного вручную выбора. В ступенях родословия для неё не записан источник — даже та, другая копия того же перевода, — так что ступень, открытая под стихом, сразу падает на отмеченное ≈ дно языков оригинала. Как и у другого Диодати, Textus Receptus там близок к истине: Диодати работал по печатному греческому тексту Безы, тексту этого семейства.

