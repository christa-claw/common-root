title=Muvatta-i Mâlik — Bu Baskı Hakkında | Common Root
description=Muvatta-i Mâlik: İmam Mâlik bin Enes'in Medine'de derlediği hukuk ve hadis derlemesi; Sünni İslam'ın Altı Kitabı'ndan yaklaşık bir asır öncedir ve aralarında Sünen-i İbn Mâce'nin yerine geçmesi bazen önerilir.
heroHeading=Muvatta-i Mâlik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Mâlik bin Enes bin Mâlik bin Ebî Âmir el-Asbahî el-Medenî, Ebu Abdullah lakabıyla bilinir, hicri 93 (miladi 711) yılı civarında Medine'de doğdu ve hicri 179 (miladi 795) yılında orada vefat etti; el-Bakî' Mezarlığı'na defnedildi. Hişam bin Urve, İbn Şihab ez-Zührî, Ca'fer es-Sadık ve Nâfi' Mevlâ İbn Ömer gibi âlimlerden ders aldı ve hayatının sonuna kadar Medine'de ders verdi; bu sırada İmam Dâru'l-Hicre ("Hicret Şehri'nin İmamı") ve Şeyhu'l-İslam gibi unvanlar kazandı. Sünni İslam'ın dört büyük mezhebinden biri olan Malikî mezhebinin kurucusu oldu; en önde gelen öğrencisi, daha sonra Şafiî mezhebini kuran Muhammed bin İdris eş-Şafiî, Mâlik'in kitabını "Kur'an'dan sonra yeryüzünde en güvenilir kitap" olarak andı. Abbasi halifesi el-Mansur'un bu kitabı imparatorluğun tek hukuki kaynağı yapmak istediği söylenir; Mâlik'in kendisi bunu kabul etmedi.
hero.2=El-Muvatta ("iyi aşınmış yol") geleneğe göre erken Abbasi döneminde yaklaşık kırk yıl boyunca yazıldı ve gözden geçirildi; adının, Mâlik'in metni Medine'nin yetmiş hukukçusuna göstermesi ve hepsinin bunu onaylamasından (vata'a) geldiği söylenir. Peygamber'e atfedilen hadisleri, onun ashabının ve sonraki kuşağın hukuki görüşleriyle ve Mâlik'in kendi hükümleriyle birleştirir — bir değerlendirmeye göre, hadis ile fıkhı bu şekilde birleştiren günümüze ulaşan en eski eserdir ve Altı Kitap'tan yaklaşık bir asır öncedir. Boyutuna ilişkin rakamlar, nüshaya ve sayım yöntemine göre değişir: gerçek hadisler için sık anılan bir rakam yaklaşık 1.720'dir; Mâlik'in ise kendisine erişilebilir olduğu söylenen 100.000 rivayetten 1.900'e yakın bir sayıyı seçtiği söylenir.
hero.3=El-Muvatta'nın en az on altı nüshası bilinmektedir. Özellikle Malikî mezhebi için standart kaynak hâline gelen nüsha, Yahya bin Yahya el-Leysî'ye aittir; rakip bir nüsha olan Ahmed bin Ebî Bekir ez-Zührî'ninki yaklaşık yüzde beş ile on arasında daha uzundur. Yalnızca el-Leysî'nin nüshası üzerine yaklaşık yüz şerh vardır. Sünni İslam'ın Altı Kitabı'ndan önce geldiği için, bazı âlimler — Malikîler ve İbn el-Esîr bunlardan bazılarıdır — bu kanonik listede [[IBM|Sünen-i İbn Mâce]] yerine el-Muvatta'nın bulunması gerektiğini ileri sürer; İbn Mâce'nin Sünen'inin bu yeri genellikle, daha güvenilir sayıldığından değil, içeriğinin diğer beşiyle en az örtüşmesinden dolayı koruduğu söylenir.
hero.4=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-malik baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]], [[NAS|Sünen-i Nesâî]], [[IBM|Sünen-i İbn Mâce]] ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

