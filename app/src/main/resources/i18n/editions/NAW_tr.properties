fact.1.label=Dil
fact.1.value=Klasik Arapça; okuyucuda her hadisin altında bir İngilizce çeviri gösterilir
fact.2.label=Derleyen
fact.2.value=Yahya ibn Şeref en-Nevevî (hicri 631–676 / miladi 1233–1277)
fact.3.label=Adı
fact.3.value=El-Erba'ûne'n-Nevevîyye ("Nevevî'nin Kırk Hadisi") olarak bilinir; adına rağmen derleme kırk iki hadis içerir
fact.4.label=Derlendiği yer
fact.4.value=Çoğunlukla [[BUK|Sahih-i Buhari]] ve [[MUS|Sahih-i Müslim]]'den; Nevevî, hicri 676'da (1277) Suriye'deki Nevâ'da vefatına kadar Şam'daki Eşrefiyye Dâru'l-Hadis'in başındayken (hicri 665 / 1267) derledi
fact.5.label=Yöntem
fact.5.value=Her hadis, Nevevî'nin dinin "büyük bir temel ilkesi" (qa'ida azima) dediği şeyi örneklediği için seçildi; kendisinden önceki, ilk bilinen örneği günümüze ulaşmayan ve Abdullah ibn el-Mübarek'e (ö. 797) atfedilen kırk hadis (erbâîniyyât) türünü sürdürür
fact.6.label=Konum
fact.6.value=Kur'an'dan sonra Sünni İslam'da en çok okunan eserler arasında sayılır; en ünlüsü İbn Receb el-Hanbelî'nin Camiu'l-Ulûm ve'l-Hikem'i olmak üzere onlarca şerhe konu olmuştur
fact.7.label=Hadis sayısı
fact.7.value=Adına rağmen 42; bu derlemenin kaynak baskısı da aynı sayıyı verir
fact.8.label=Bu derlemede
fact.8.value=1 kitap ve 42 numaralı hadis
fact.9.label=İngilizce çeviri
fact.9.value=fawazahmed0/hadith-api'nin eng-nawawi baskısından alınmış, Arapça metnin eşlikçisi olarak gösterilir; hangi basılı çeviriden geldiği bu derleme tarafından henüz doğrulanmamıştır
fact.10.label=Lisans
fact.10.value=Arapça metin kamu malı olan klasik metindir; İngilizce çevirinin lisansı hâlâ incelemededir
