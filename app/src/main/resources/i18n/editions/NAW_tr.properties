title=Nevevî'nin Kırk Hadisi — Bu Baskı Hakkında | Common Root
description=Nevevî'nin Kırk Hadisi: İmam Nevevî'nin seçtiği, her biri dinin "büyük bir temel ilkesi" (qa'ida azima) olarak düşünülen 42 hadis — kırk hadis türünün en çok okunan eseri.
heroHeading=Nevevî'nin Kırk Hadisi
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Şeref en-Nevevî, hicri 631 (Muharrem ayı, miladi Ekim 1233) yılında Suriye'de Dara yakınlarındaki Nevâ'da doğdu ve on sekiz yaşında öğrenim için Şam'a taşındı. Hicri 665'te (1267) Şam'daki Eşrefiyye Dâru'l-Hadis'in başına getirildi; bu görevi, kırklı yaşlarının ortasında, hicri 676'da (1277) Nevâ'da vefat edene kadar sürdürdü ve orada defnedildi. Şafiî mezhebinden bir fakih olan Nevevî, bu kısa ömrü boyunca pek çok eser kaleme aldı — diğer eserleri arasında Riyazü's-Salihîn, Sahih-i Müslim şerhi olan ve el-Minhac diye bilinen eser, el-Mecmu' Şerhu'l-Mühezzeb, Minhacü't-Talibin ve Kitabü'l-Ezkâr bulunur.
hero.2=El-Erba'ûne'n-Nevevîyye, kendisinden önce var olan "kırk hadis" (erbâîniyyât) türünün bir devamıdır; bu türün çıkış noktası, dinine dair kırk hadisi koruyan kimseye kıyamet gününde âlimler arasında bir yer vadeden — eleştirmenlerin kendisinin de genellikle zayıf (da'îf) saydığı — bir hadistir. Bu türden ilk derleme, günümüze ulaşmayan, Abdullah ibn el-Mübarek'e (ö. 797) atfedilen derlemedir; sonra pek çok âlim kendi derlemelerini yaptı. Nevevî, sağlam saydığı, çoğu [[BUK|Sahih-i Buhari]] ve [[MUS|Sahih-i Müslim]]'den alınan hadisleri seçti; her biri onun dinin "büyük bir temel ilkesi" (qa'ida azima) dediği şeyi örneklendiriyordu — ve adına rağmen derleme bugünkü haliyle kırk iki hadis içerir. Bu tür içinde en çok okunan örnek olmuş, onlarca şerh almış — en ünlüsü İbn Receb el-Hanbelî'nin Camiu'l-Ulûm ve'l-Hikem'i — ve Kur'an'dan sonra Sünni İslam'da en çok okunan eserler arasında sayılır.
hero.3=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-nawawi baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]], [[NAS|Sünen-i Nesâî]], [[IBM|Sünen-i İbn Mâce]], [[MAL|Muvatta-i Mâlik]] ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

