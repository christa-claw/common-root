title=スミス・ヴァンダイク訳 — この版について | Common Root
description=スミスとヴァンダイクのアラビア語聖書。ベイルートでイーライ・スミスが起こし、1865年にコルネリウス・ヴァンダイクが、ナフダの学者ブトルス・アル＝ブスターニー、ナースィフ・アル＝ヤーズィジー、ユースフ・アル＝アスィールとともに完成させた。今なお最も広く読まれているアラビア語聖書である。
heroHeading=スミス・ヴァンダイク訳
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=ベイルートのアメリカ伝道団がこの翻訳に着手したのは1847年ごろで、始めた当人は終えられなかった。イーライ・スミスはレヴァントで二十年を過ごし、この言語について論争できるほどには通じていた。彼は1857年に世を去るまで本文に向かい続けた。コルネリウス・ヴァン・アレン・ヴァンダイクがあとを引き受け、最後まで運んだ — 新約は1860年に成り、旧約はその五年後、1865年に成った。書物に載る二つの名は、一つの仕事の二つの半分である。
hero.2=背に載らなかった名も、同じだけの重みを持つ。ヴァンダイクはアラビア語をブトルス・アル＝ブスターニーとナースィフ・アル＝ヤーズィジーに学んでおり、二人ともこの翻訳を彼とともに手がけた。語法と文体の面からアラビア語を通して見たシャイフ、ユースフ・アル＝アスィールも同じである。この三人は伝道事業の助手ではない。アラビア語文芸の復興、すなわちナフダの中心にいた人々であり、できあがったものはアラビア語の衣を着た翻訳としてではなく、アラビア語の散文として読める。この書物が、費用を出した伝道団より長く生きた理由はそこにある。
hero.3=これは学識の仕事であると同時に、印刷の仕事でもあった。ベイルートのアメリカン・プレスは、伝道団のために彫られて1843年に仕上がったアラビア文字の活字 — 今もアル＝アメリカーニーと呼ばれ、スミスがその姿にも関わった書体 — でこれを組んだ。アラビア語をよく組むのは難しい。文字はつながり、つながることで形を変える。そして頁の上で正しく見える聖書は、どんな議論よりもその受け入れに寄与した。以来、幾百万部がプロテスタントの読者にもコプトの読者にも渡っており、アラビア語を話すキリスト教徒の多くにとって、聖書とはつまりこのように響くものである。
hero.4=このリーダーではこれが唯一のアラビア語聖書であり、そのことが振る舞いを決めている。インターフェースをアラビア語にすれば開くのはこれだが、それはスペイン語に対してレイナ・バレラ1909が選ばれたように選ばれたからではなく、カタログがインターフェースの言語で聖書を探し、ちょうど一つだけ見つけるからである。また、本文が右から左へ流れる版はここに二つしかなく、その一つがこれで、もう一つは現代ヘブライ語聖書である。系譜の段には典拠が記録されていないため、節の下に開いた段は ≈ で印された原語の底面へまっすぐ落ちる — そしてそれは、ここでは常よりも近いところに落ちる。その底面が差し出すギリシャ語はテクストゥス・レセプトゥスであり、この版の新約はまさにテクストゥス・レセプトゥスから作られたからである。

