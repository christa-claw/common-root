title=スミス・ヴァンダイク訳 — この版について | Common Root
description=スミスとヴァンダイクのアラビア語聖書。ベイルートでイーライ・スミスが起こし、1865年にコルネリウス・ヴァンダイクが、ナフダの学者ブトルス・アル＝ブスターニー、ナースィフ・アル＝ヤーズィジー、ユースフ・アル＝アスィールとともに完成させた。今なお最も広く読まれているアラビア語聖書である。
heroHeading=スミス・ヴァンダイク訳
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=ベイルートのアメリカ伝道団がこの翻訳に着手したのは1847年ごろで、始めた当人は終えられなかった。イーライ・スミスはレヴァントで二十年を過ごし、この言語について論争できるほどには通じていた。彼は1857年に世を去るまで本文に向かい続けた。コルネリウス・ヴァン・アレン・ヴァンダイクがあとを引き受け、最後まで運んだ — 新約は1860年に成り、旧約はその五年後、1865年に成った。書物に載る二つの名は、一つの仕事の二つの半分である。
hero.2=背に載らなかった名も、同じだけの重みを持つ。ヴァンダイクはアラビア語をブトルス・アル＝ブスターニーとナースィフ・アル＝ヤーズィジーに学んでおり、二人ともこの翻訳を彼とともに手がけた。語法と文体の面からアラビア語を通して見たシャイフ、ユースフ・アル＝アスィールも同じである。この三人は伝道事業の助手ではない。アラビア語文芸の復興、すなわちナフダの中心にいた人々であり、できあがったものはアラビア語の衣を着た翻訳としてではなく、アラビア語の散文として読める。この書物が、費用を出した伝道団より長く生きた理由はそこにある。
hero.3=これは学識の仕事であると同時に、印刷の仕事でもあった。ベイルートのアメリカン・プレスは、伝道団のために彫られて1843年に仕上がったアラビア文字の活字 — 今もアル＝アメリカーニーと呼ばれ、スミスがその姿にも関わった書体 — でこれを組んだ。アラビア語をよく組むのは難しい。文字はつながり、つながることで形を変える。そして頁の上で正しく見える聖書は、どんな議論よりもその受け入れに寄与した。以来、幾百万部がプロテスタントの読者にもコプトの読者にも渡っており、アラビア語を話すキリスト教徒の多くにとって、聖書とはつまりこのように響くものである。
hero.4=この読書環境には三つのアラビア語聖書がある——これと、eBible.org が公開する完全に母音符号を付した本文による同じ翻訳（[[SVD-E|スミス・ヴァンダイク、eBible本文]]）、そして Biblica による現代訳の[[ONAV|オープン・ニュー・アラビック・バージョン]]である。その本文はヘブライ語の各版や他のアラビア語版と同様、右から左に流れる。系譜の段には典拠が記録されていないため、節の下に開いた段は ≈ で印された原語の底面へまっすぐ落ちる — そしてそれは、ここでは常よりも近いところに落ちる。その底面が差し出すギリシャ語はテクストゥス・レセプトゥスであり、この版の新約はまさにテクストゥス・レセプトゥスから作られたからである。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=アラビア語 — 文体は古典的で、意図して逐語的
fact.2.label=起こした人
fact.2.value=ベイルートのアメリカ伝道団のイーライ・スミス、1847年ごろから。1857年に没し、仕事は未完に終わった
fact.3.label=完成させた人
fact.3.value=コルネリウス・ヴァン・アレン・ヴァンダイク。翻訳を引き受け、最後まで運んだ
fact.4.label=アラビア語の学者
fact.4.value=ブトルス・アル＝ブスターニー、ナースィフ・アル＝ヤーズィジー、ユースフ・アル＝アスィール — アラビア語文芸の復興ナフダの面々
fact.5.label=新約
fact.5.value=1860年に完成
fact.6.label=旧約
fact.6.value=1865年に完成 — カタログの札が載せているのはこの年
fact.7.label=旧約の底本
fact.7.value=マソラ本文のヘブライ語。底面はその証人として、このコーパスの[[WLC|ウェストミンスター・レニングラード写本]]を差し出す
fact.8.label=新約の底本
fact.8.value=テクストゥス・レセプトゥス — このコーパスが収める[[TR|テクストゥス・レセプトゥス]]と同じもの
fact.9.label=印刷
fact.9.value=ベイルートのアメリカン・プレス。1843年に仕上がり、今もアル＝アメリカーニーと呼ばれるアラビア文字の活字による
fact.10.label=ライセンス
fact.10.value=パブリックドメイン
fact.11.label=このコーパスでは
fact.11.value=ここにある三つのアラビア語聖書の一つで、[[SVD-E|スミス・ヴァンダイク、eBible本文]]（同じ翻訳）および[[ONAV|オープン・ニュー・アラビック・バージョン]]と並ぶ。系譜の段に典拠は記録されていない
fact.12.label=音声
fact.12.value=聖書全体——新旧両約のすべての章——が、マイクロソフト・アジュール（Microsoft Azure）のニューラル音声ar-SA-HamedNeuralによって読み上げられている。節ごとではなく章ごとに合成されており、散文が自然な文のリズムを保っている。
fact.13.label=音声の制限
fact.13.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
