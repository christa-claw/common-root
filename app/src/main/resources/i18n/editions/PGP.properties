title=Pearl of Great Price — About This Edition | Common Root
description=The Pearl of Great Price: a selection of Joseph Smith's revelations, translations and narratives, first gathered in 1851 as a mission pamphlet in Liverpool, England, and accepted as scripture by Latter-day Saints in 1880.
heroHeading=Pearl of Great Price
readerHref=/reader?c1.src=pgp

# The narrative, one paragraph per key, in order.
hero.1=The Pearl of Great Price began as a mission pamphlet, not as a book of scripture. In 1851 Franklin D. Richards, then president of the church's European Mission, compiled it in Liverpool, England, gathering writings of Joseph Smith that had appeared in early church newspapers or had circulated only in small numbers, so that members in Britain could have them in one place. Its title comes from the parable in Matthew 13:45–46 of the merchant who sells all he has to buy a single pearl of great price.
hero.2=A second edition, edited and rearranged by Orson Pratt, was published in Salt Lake City in 1878, and on 10 October 1880 a general conference of the church accepted it by vote as scripture. A revision of 1902, prepared chiefly by James E. Talmage, divided the text into chapters and verses and dropped the revelations it shared with the Doctrine and Covenants; a 1921 edition set it in double columns. In 1976 two more revelations were added — a vision of the celestial kingdom and Joseph F. Smith's vision of the redemption of the dead — and in 1979 the church moved them to the Doctrine and Covenants, whose 1981 edition prints them as sections 137 and 138.
hero.3=The current edition has five parts. Selections from the Book of Moses and Joseph Smith—Matthew are extracts from Joseph Smith's revision of the King James Bible, begun in 1830: the first an expanded account of the opening chapters of Genesis, framed by visions given to Moses; the second a reworking of Matthew 23:39 and chapter 24. The Book of Abraham is the text Smith said he translated from Egyptian papyri acquired in Kirtland, Ohio, in 1835; it was published in 1842 in the Times and Seasons at Nauvoo, Illinois, with three illustrations now called facsimiles 1, 2 and 3. Joseph Smith—History is taken from the account of his early life and visions that he prepared in 1838, and the Articles of Faith are thirteen statements of belief from an 1842 letter to the Chicago newspaper editor John Wentworth.
hero.4=The Book of Abraham is the part most often questioned. Most of the papyri were long thought destroyed, probably in the Chicago fire of 1871, but ten fragments once in Joseph Smith's possession turned up at the Metropolitan Museum of Art in New York, which transferred them to the church in 1967. Scholars identify the fragments as parts of standard Egyptian funerary texts written between the third century BCE and the first century CE, and the church's own published essay on the book acknowledges that none of the characters on them mentions Abraham's name or any event the book records.
hero.5=With the Bible, the Book of Mormon and the Doctrine and Covenants, it is one of the four standard works of The Church of Jesus Christ of Latter-day Saints; the Community of Christ, the other large church descended from Joseph Smith's movement, does not count it among its scriptures. The text in this corpus comes from the Mormon Documentation Project's public-domain JSON export, the same source as the Book of Mormon and the Doctrine and Covenants here, and keeps the five parts as five books: Moses with eight chapters, Abraham with five, and the last three with one each. The three facsimiles and the explanations printed with them are not verse text, so they are not included. Like its two companions it carries the wording of the current standard edition rather than any one historical printing, which is why no publication year is given here.

