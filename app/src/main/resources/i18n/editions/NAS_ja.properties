title=スナン・アン=ナサーイー — この版について | Common Root
description=スナン・アン=ナサーイー——アフマド・イブン・シュアイブ・アン=ナサーイーが、より大部の著作『大スナン』から編み直したハディース集。イブン・ハジャルにより、両サヒーフに次いで六書中もっとも弱いハディースが少ない書と評された。
heroHeading=スナン・アン=ナサーイー
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=アブー・アブド・アッ=ラフマーン・アフマド・イブン・シュアイブ・イブン・アリー・アン=ナサーイーは、ヒジュラ暦214〜215年（西暦829〜830年）頃、ホラーサーン地方のナサーという町——現在のトルクメニスタン——に生まれた。十五歳頃にハディースを求めて旅を始め、まずクタイバ・イブン・サイードに師事し——バグランで一年以上を過ごした——その後イラク、ヒジャーズ、シリア、エジプトを巡り、イスハーク・イブン・ラーフワイヤや、『[[ABD|スナン・アブー・ダーウード]]』の編者アブー・ダーウード・アッ=シジスターニーらの学者のもとで学んだ。エジプトに定住し、そこで教え、「ハーフィズ・アル=ハディース」として知られるようになった。後世の伝記作家たちは、彼が実際にムハンマド・アル=ブハーリーのもとで直接学んだかどうかについて意見が分かれており、アル=ミッズィーは両者が一度も会ったことがないと論じた。晩年、カイロからメッカへ向かう途上でダマスカスに立ち寄った際、伝統的な伝承によれば、預言者の教友たちの美徳について行った講話が、同市に広がっていた反アリー的な感情のただ中で敵意ある群衆を刺激した。彼はそのすぐ後、ヒジュラ暦303年（西暦915年）に、そこで受けた傷によって没した。埋葬地についての伝承は分かれており、一説ではメッカのサファーとマルワの間、別の説ではパレスチナのラムラとされる。
hero.2=彼に帰せられる約十五の著作のうち、六つがハディースに関わるものである。そのうち最大の『大スナン（アッ=スナン・アル=クブラー）』を、彼自身が後に、より短い選集——『小スナン（アッ=スナン・アッ=スグラー）』あるいは『アル=ムジュタバー』（「精選されたもの」）として知られる——にまとめ直した。今日「スナン・アン=ナサーイー」という単純な書名で指されているのは、この書物である。この選定を実際に誰が、誰の求めによって行ったのかは、本頁のために参照した資料には記録されていない。この書の中でアン=ナサーイーは、[[ABD|アブー・ダーウード]]や[[TIR|アッ=ティルミズィー]]がそうしたように、ハディースを法学上の主題によって整理した。法学者イブン・ハジャル・アル=アスカラーニーは後に、この書が両サヒーフに次いで、六書の中で弱い（ダイーフ）ハディースと信頼性の低い伝承者がもっとも少なく、偽造された（マウドゥー）ハディースが一つもないことを特筆した。
hero.3=スンニ派の伝統では、スナン・アン=ナサーイーは、[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]とともに六書（クトゥブ・スィッタ）の一つに数えられ、第六書についてはスナン・イブン・マージャと他の候補との間で争いがある。四つのスナン諸書の中で正確にどこに位置づけられるかは、長く論じられてきたが決着していない。一部の資料は、両サヒーフに次いで六書中第三位の権威を持つとするが、このコーパス自身の[[ABD|スナン・アブー・ダーウード]]と[[TIR|ジャーミウ・アッ=ティルミズィー]]のページは、アブー・ダーウードの書を第三位とする、より一般的な順序を反映している。挙げられるハディースの数も同様に一定しない——広く引用されるアル=ムジュタバーの数字では、重複する伝承を含めて5,758件であるのに対し、このコーパスが基づく版では5,765件と番号づけられており、両者は文献上調整されていない。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-nasai 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

