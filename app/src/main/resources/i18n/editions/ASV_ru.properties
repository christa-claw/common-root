title=American Standard Version — Об этом издании | Common Root
description=American Standard Version 1901 года: американское издание Revised Version, сделанное учёными, которые двадцать лет правили Библию короля Иакова по переписке, и родоначальница Revised Standard Version, New American Standard Bible и World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=American Standard Version начиналась как чужой замысел. Когда Церковь Англии в 1870 году взялась пересматривать Библию короля Иакова, она пригласила к участию американских учёных, и те приняли участие — по переписке, через Атлантику, без малого два десятилетия. Там, где стороны расходились, в текст шло чтение британского комитета, а американское предпочтение — в приложение, и американцы согласились четырнадцать лет воздерживаться от собственного издания. Английская Revised Version вышла в 1881 и 1885 годах. Американское издание последовало в 1901 году, и чтения приложения были подняты в текст, где их издатели всегда и хотели их видеть.
hero.2=Это перевод, сделанный учёными для учёных, и читается он именно так. Пересматривавшие держались еврейского и греческого порядка слов настолько, насколько это терпел английский, отчего American Standard Version точна и на длинных участках суха. Самое заметное её решение касается имени Божия: там, где Библия короля Иакова печатала капителью “the LORD”, American Standard Version печатает “Jehovah” — тысячи раз, по всему Ветхому Завету. В Новом Завете она следует греческому тексту пересматривавших, а не Textus Receptus, так что чтения, бывшие у переводчиков короля Иакова и отсутствующие в более древних рукописях — среди них тринитарная вставка в 1 Ин. 5:7, — стоят в примечании или отсутствуют.
hero.3=Скамеечной Библией American Standard Version так и не стала. Стала она родоначальницей. Revised Standard Version 1952 года была её пересмотром; им была и New American Standard Bible, которая тоже есть в этом собрании; и им же является World English Bible, перенёсшая American Standard Version в общественное достояние в современной орфографии. Оттого она и стоит там, где стоит, среди ступеней читателя — посередине самой длинной цепи, какая есть в собрании. Откройте ступень под стихом ASV, и под ним появится Revised Version, из которой она сделана, а ниже — Библия короля Иакова и Женевская Библия, вплоть до пола исходных языков, помеченного знаком ≈. Откройте ступень под стихом World English Bible — и вы вернётесь сюда.

