fact.1.value=Anglais
fact.2.label=Réalisée par
fact.2.value=Joseph Smith Jr. (1805–1844) : révélations, sa révision de la Bible du roi Jacques, une traduction qu'il dit avoir faite de papyrus égyptiens, sa propre histoire et un énoncé de croyances ; réunis pour la première fois en un volume par Franklin D. Richards
fact.3.label=Publiée
fact.3.value=1851, Liverpool, Angleterre, sous forme de brochure missionnaire compilée par Franklin D. Richards ; deuxième édition 1878, Salt Lake City, revue par Orson Pratt ; acceptée comme écriture par une conférence générale le 10 octobre 1880
fact.4.label=Structure
fact.4.value=Cinq parties — Extraits du livre de Moïse, livre d'Abraham, Joseph Smith, Matthieu, Joseph Smith, Histoire et Articles de foi —, divisées en chapitres et versets depuis la révision de 1902 ; notre corpus traite chaque partie comme un livre
fact.5.label=Rang
fact.5.value=L'un des quatre ouvrages canoniques de l'Église de Jésus-Christ des Saints des Derniers Jours, à côté de la Bible, du [[BOM|Livre de Mormon]] et des [[DC|Doctrine et Alliances]] ; la Communauté du Christ ne la tient pas pour une écriture
fact.6.label=Dans ce corpus
fact.6.value=Le texte suit la formulation standard actuelle de l'export JSON du Mormon Documentation Project, placé dans le domaine public — la même source que le [[BOM|Livre de Mormon]] et les [[DC|Doctrine et Alliances]] ; les extraits de Moïse et de Matthieu remanient le texte de [[KJV|la King James Version]], que le corpus contient aussi ; les fac-similés et leurs explications sont omis, et aucune année d'impression précise n'est indiquée ici
fact.7.label=Licence
fact.7.value=Domaine public, selon la déclaration du responsable des données ; l'appareil d'étude moderne protégé par le droit d'auteur n'est pas inclus
