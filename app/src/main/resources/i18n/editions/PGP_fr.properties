title=Perle de Grand Prix — À propos de cette édition | Common Root
description=La Perle de Grand Prix : un choix de révélations, de traductions et de récits de Joseph Smith, réuni pour la première fois en 1851 sous forme de brochure missionnaire à Liverpool, en Angleterre, et accepté comme écriture par les saints des derniers jours en 1880.
heroHeading=Perle de Grand Prix
readerHref=/reader?c1.src=pgp

hero.1=La Perle de Grand Prix est née comme une brochure missionnaire, non comme un livre d'écriture. En 1851, Franklin D. Richards, alors président de la Mission européenne de l'Église, la compila à Liverpool, en Angleterre, en rassemblant des écrits de Joseph Smith parus dans les premiers journaux de l'Église ou diffusés seulement à petit nombre, afin que les membres de Grande-Bretagne les aient réunis en un seul endroit. Son titre vient de la parabole de Matthieu 13:45–46, celle du marchand qui vend tout ce qu'il possède pour acheter une seule perle de grand prix.
hero.2=Une deuxième édition, revue et réorganisée par Orson Pratt, parut à Salt Lake City en 1878, et le 10 octobre 1880 une conférence générale de l'Église l'accepta par vote comme écriture. Une révision de 1902, préparée surtout par James E. Talmage, divisa le texte en chapitres et en versets et retira les révélations qu'il avait en commun avec les Doctrine et Alliances ; une édition de 1921 le composa sur deux colonnes. En 1976, deux nouvelles révélations y furent ajoutées — une vision du royaume céleste et la vision de Joseph F. Smith sur la rédemption des morts — et, en 1979, l'Église les transféra dans les Doctrine et Alliances, dont l'édition de 1981 les imprime comme sections 137 et 138.
hero.3=L'édition actuelle compte cinq parties. Les Extraits du livre de Moïse et Joseph Smith, Matthieu sont tirés de la révision de la Bible du roi Jacques que Joseph Smith entreprit en 1830 : le premier est un récit amplifié des premiers chapitres de la Genèse, encadré par des visions données à Moïse ; le second, une refonte de Matthieu 23:39 et du chapitre 24. Le livre d'Abraham est le texte que Smith dit avoir traduit de papyrus égyptiens acquis à Kirtland, dans l'Ohio, en 1835 ; il parut en 1842 dans le Times and Seasons à Nauvoo, dans l'Illinois, avec trois illustrations appelées aujourd'hui fac-similés 1, 2 et 3. Joseph Smith, Histoire est tiré du récit de sa jeunesse et de ses visions qu'il rédigea en 1838, et les Articles de foi sont treize énoncés de croyance extraits d'une lettre de 1842 adressée au directeur de journal de Chicago John Wentworth.
hero.4=Le livre d'Abraham est la partie la plus souvent contestée. On a longtemps cru la plupart des papyrus détruits, probablement dans l'incendie de Chicago de 1871, mais dix fragments ayant appartenu à Joseph Smith réapparurent au Metropolitan Museum of Art de New York, qui les remit à l'Église en 1967. Les spécialistes y reconnaissent des parties de textes funéraires égyptiens courants, écrits entre le IIIe siècle av. J.-C. et le Ier siècle apr. J.-C., et l'essai que l'Église elle-même a publié sur le livre reconnaît qu'aucun des caractères qu'ils portent ne mentionne le nom d'Abraham ni aucun événement rapporté par le livre.
hero.5=Avec la Bible, le Livre de Mormon et les Doctrine et Alliances, elle est l'un des quatre ouvrages canoniques de l'Église de Jésus-Christ des Saints des Derniers Jours ; la Communauté du Christ, l'autre grande Église issue du mouvement de Joseph Smith, ne la compte pas parmi ses écritures. Le texte de ce corpus provient de l'export JSON du Mormon Documentation Project, placé dans le domaine public, la même source que le Livre de Mormon et les Doctrine et Alliances de ce site, et il conserve les cinq parties comme cinq livres : Moïse avec huit chapitres, Abraham avec cinq et les trois derniers avec un chacun. Les trois fac-similés et les explications imprimées avec eux ne sont pas du texte versifié et ne sont donc pas inclus. Comme ses deux compagnons, il reprend la formulation de l'édition standard actuelle plutôt que celle d'une impression historique particulière, c'est pourquoi aucune année de publication n'est indiquée ici.

