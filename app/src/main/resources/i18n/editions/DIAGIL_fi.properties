title=Emphatic Diaglott (interlineaari) — Tietoja tästä laitoksesta | Common Root
description=Benjamin Wilsonin Emphatic Diaglott vuodelta 1864: sanasanainen englanninkielinen selitys Griesbachin kreikan alle painettuna, myöhemmin Vartiotorni-seuran ostama ja kuusikymmentä vuotta uudelleen painama — ja se teksti, josta Joh. 1:1:n kiistaa tavallisesti käydään.
heroHeading=Emphatic Diaglott (interlineaari)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson ei ollut ammattitutkija. Hän oli sanomalehtitoimittaja Genevassa Illinoisissa, opetteli kreikan itse ja julkaisi vuosina 1857–1863 osa kerrallaan interlineaarisen Uuden testamentin, jota hän ei ollut ainoastaan kääntänyt vaan myös valmistanut: hänen veljenpoikansa katseli, kuinka hän otti vahajäljennöksen jokaisesta ladotusta sivusta, ripusti ne yöksi happoon kasvattamaan kuparikalvon, tuki kuparin valumetallilla ja painoi tuloksen käsipainolla pojan väriten laattaa. Valmis nide ilmestyi 1864. Kreikkansa hän otti tekstistä, jonka Johann Jakob Griesbach oli vakiinnuttanut 1770-luvulla, lukutapoineen Codex Vaticanuksesta.
hero.2=Wilson painoi todellisuudessa kaksi englanninkielistä tekstiä, ei yhtä. Sivun vasemmassa laidassa kulki kreikka ja jokaisen sanan alla kirjaimellinen sanasanainen englanninkielinen selitys; oikeassa laidassa hänen oma viimeistelty käännöksensä, Emphatic Version. Ne eivät ole sama asia, ja kohdassa Joh. 1:1 ne ovat suorastaan eri mieltä — selitys kuuluu ”and a god was the Word”, Emphatic Version ”and the LOGOS was God”. Kummatkin ovat Wilsonin, painettuina samaan kirjaan muutaman sentin päähän toisistaan. Tämä aineisto sisältää selityksen, sen palstan jota siteerataan, ja juuri siksi se on omassa osastossaan eikä Raamattujen ruudukossa. Selitys kirjaa, miten kreikkalainen lause on koottu — sija sijalta, artikkeli artikkelilta, kreikan sanajärjestyksessä. Se ei ole ratkaisu siitä, miten lause pitäisi englanniksi lukea, ja Wilsonin oma ratkaisu siihen on painettu viereiseen palstaan. Sen, joka toista siteeraa, olisi hyvä tietää toisen olemassaolosta.
hero.3=Kirjan myöhemmät vaiheet ovat syy siihen, että useimmat ovat siitä kuulleet. Wilson kuoli 1900 Church of the Blessed Hope -yhteisön jäsenenä, ei minkään sellaisen ryhmän, joka silloin olisi kulkenut Jehovan todistajien nimellä. Vuonna 1902 Charles Taze Russell, Vartiotorni-raamattu- ja traktaattiseuran presidentti, hankki tekijänoikeuden Wilsonin perillisiltä ja aikanaan myös laatat. Seura painoi Diaglottia seuraavat kuusikymmentä vuotta — latoi tekstin uudelleen omilla koneillaan 1927, ajoi siitä reilusti yli sataviisikymmentätuhatta kappaletta, myi sitä kahdella dollarilla ja lopulta antoi sitä ilmaiseksi. Diaglott on siis Jehovan todistajien kirja omaksumisen eikä tekijyyden nojalla, ja sen tapa painaa ”Jehova” Uuteen testamenttiin siellä, missä kirjoittajat kirjoittivat κύριος lainatessaan heprealaisia kirjoituksia, oli neljä vuosikymmentä vanhempi kuin se liike, joka teki tavasta kuuluisan. Tekijänoikeus raukesi 1952, ja siitä lähtien teos on ollut vapaassa käytössä.
hero.4=Kaksi asiaa siitä on tässä lukuohjelmassa hyvä tietää ennen käyttöä. Griesbach ei painanut jakeita Ap. t. 8:37 eikä Luuk. 17:36, joten kumpaakaan ei täällä ole; sen sijaan että aukko suljettaisiin ja jokainen myöhempi jae siirtyisi yhdellä ylöspäin, numerointi jättää nämä kaksi kohtaa tyhjiksi, niin että viittaus osuu tässä palstassa samaan jakeeseen kuin viereisessäkin. Eikä sille ole kirjattu edeltäjää, joten Diaglott-jakeen alta avattu polveutumisaskelma vie alkukielten pohjaan eikä vanhempaan englanninkieliseen laitokseen.
hero.5=Ole täsmällinen sen suhteen, mitä tuo pohja painaa. Sen näyttämä kreikka on Textus Receptus — merkintä kuuluu ≈ TR 1550, ja tuo ≈ on lukuohjelman tapa sanoa, että se tarjoaa kreikan todistajan eikä sitä tekstiä, josta tämä laitos on tehty. Wilson työskenteli Griesbachin pohjalta. Siellä missä nämä kaksi ovat yhtä mieltä, kuten kohdassa Joh. 1:1, askelma todella näyttää juuri ne sanat, joita selitetään. Siellä missä ne eroavat, se ei näytä: Griesbach hylkäsi kolminaisuuslauseen kohdassa 1. Joh. 5:7, joten Diaglottissa siitä ei ole jälkeäkään, kun taas alla kulkeva Textus Receptus -rivi kantaa sen kokonaisena. Interlineaarissa, jonka koko lähtökohta on että kreikka on siinä samalla sivulla, tämä on se yksi aukko, joka kannattaa tietää ennen kuin siitä siteeraa.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Mikä tämä on
fact.1.value=rivien välinen selitys — kreikan alle painettu sanasanainen englanti, ei Wilsonin luettava käännös
fact.2.label=Laatija
fact.2.value=Benjamin Wilson (1817–1900), itseoppinut tutkija ja sanomalehtitoimittaja Genevassa Illinoisissa
fact.3.label=Kreikkalainen teksti
fact.3.value=Griesbachin resensio, lukutapoineen Codex Vaticanuksesta (Vatikaanin käsikirjoitus 1209)
fact.4.label=Julkaistu
fact.4.value=osina vuodesta 1857; kokonaisena yhtenä niteenä 1864, kustantajana Fowler and Wells, New York
fact.5.label=Painotapa
fact.5.value=Wilson galvanoi jokaisen laatan itse ja ajoi ensimmäisen laitoksen käsipainolla
fact.6.label=Jumalan nimi
fact.6.value=painaa ”Jehova” Uuteen testamenttiin siellä, missä kirjoittajat kirjoittivat κύριος lainatessaan heprealaisia kirjoituksia — sama ratkaisu, jonka [[ASV|American Standard Version]] teki läpi Vanhan testamentin
fact.7.label=Hankki itselleen
fact.7.value=Vartiotorni-raamattu- ja traktaattiseura, joka sai tekijänoikeuden 1902 Charles Taze Russellin aikana, latoi tekstin uudelleen 1927 ja painoi sitä 1960-luvulle asti
fact.8.label=Lisenssi
fact.8.value=vapaassa käytössä — tekijänoikeus raukesi 1952, eivätkä Vartiotornin uusintapainokset tuoneet uutta
fact.9.label=Kaksi jaetta puuttuu
fact.9.value=Ap. t. 8:37 ja Luuk. 17:36 eivät ole Griesbachilla eivätkä siksi täällä; niiden numerot on jätetty tyhjiksi eikä suljettu umpeen, joten teksti pysyy jae jakeelta kohdakkain jokaisen muun laitoksen kanssa
fact.10.label=Askelman alla oleva kreikka
fact.10.value=[[TR|Textus Receptus]], merkittynä ≈ TR 1550 — kreikan todistaja eikä Wilsonin pohjateksti, joka oli Griesbachin resensio; nämä kaksi ovat yhtä mieltä kohdassa Joh. 1:1 ja eroavat kohdassa 1. Joh. 5:7
fact.11.label=Tässä aineistossa
fact.11.value=pidetään omassa interlineaarien ja tutkimuslaitosten osastossaan erillään lukuraamatuista, jottei selitystä koskaan luultaisi käännökseksi; polveutumisaskelmiin ei ole kirjattu kantatekstiä, joten askelma avautuu suoraan alkukielten pohjaan
