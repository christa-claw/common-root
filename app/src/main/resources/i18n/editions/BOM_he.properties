title=ספר מורמון — על מהדורה זו | Common Root
description=ספר מורמון: רישום על נביאים קדומים באמריקה שהוכתב בידי ג'וזף סמית' ב-1830, נדפס בפלמירה שבניו יורק, ונקרא בידי קדושי אחרית הימים כתב קודש משלים למקרא.
heroHeading=ספר מורמון
readerHref=/reader?c1.src=bom

hero.1=ג'וזף סמית' אמר שתרגם את הספר הזה "במתת האל ובכוחו" מתוך מערכת לוחות מתכת עתיקים, שלדבריו מצא ב-1827 בקרבת חוות משפחתו מחוץ לפלמירה שבניו יורק, והחזיר מאוחר יותר למלאך שהראה לו אותם. עדי ההכתבה מתארים אותו בוחן אבן חוזה — בשלבים מאוחרים יותר של העבודה, אבן שהניח בתוך כובע כדי לחסום את האור, ולא רק את זוג האבנים המחוברות לחושן, המכונות באופן מסורתי אורים ותומים ושלפי המסורת הגיעו עם הלוחות — ואומר את הטקסט בקול רם בעת שלבלר כתבו. אוליבר קאודרי רשם כך את חלקו הגדול במהלך כחודשיים ב-1829, בעיקר בחוות משפחת ויטמר בפייט שבניו יורק; מרטין האריס ואשתו של ג'וזף, אמה סמית', שימשו כסופרים בשלבים קצרים ומוקדמים יותר.
hero.2=כתב היד הועבר לדפוס באותה שנה. סמית' רשם את זכויות היוצרים על החיבור ביוני 1829, וההדפסה החלה בבית המלאכה של אגברט ב. גרנדין בפלמירה, שם הוסיף הסדרן ג'ון ה. גילברט את סימני הפיסוק וחלוקת הפסקאות שלא היו בכתב היד המוכתב. הספר המוגמר הופיע במרץ 1830: כ-5,000 עותקים, כל תפוצתו של גרנדין.
hero.3=הספר מתחלק לחמישה עשר ספרים, מספר נפי הראשון ועד ספר מורוני, וכל אחד נקרא על שם רושם הרשומות הנבואי שמיוחס לו חיבורו. באף אחד מעותקי 1830 לא היה מספור פסוקים — הטקסט זרם כפסקאות רצופות בתוך פרקים ארוכים בהרבה מאלה שהקוראים מכירים היום. חלוקת הפרקים והפסוקים הנהוגה כיום מקורה במהדורת 1879 שהכין אורסון פראט, אשר גם קיצר את הפרקים והוסיף את הערות השוליים הראשונות. מהדורות מאוחרות יותר עיצבו מחדש את ההצגה: ועדה בראשות ג'ורג' פ. ריצ'רדס סידרה את הטקסט בשני טורים ב-1920 והוסיפה תקצירי פרקים ומדריך הגייה; מהדורת 1981 חידשה את ההפניות הצולבות, כותרות הפרקים וחומר עיון נוסף; ודפוס 2013 תיקן חוסר אחידות טיפוגרפי שהצטבר בלוחות ההדפסה מאז 1981.
hero.4=הספר נמנה עם ארבעת החיבורים שתנועת קדושי אחרית הימים מכנה "כתבי הקודש התקניים" שלה, לצד המקרא, [[DC|תורה ובריתות]] ו[[PGP|הפנינה היקרה]]. הטקסט באוסף זה מקורו בייצוא ה-JSON של Mormon Documentation Project, שהאחראי עליו הכריז שהוא נחלת הכלל; הוא עוקב אחר נוסח המהדורה התקנית הנוכחית וחלוקתה לפסוקים, עם התיקונים הטיפוגרפיים של דפוס 2013, ומשמיט את הערות השוליים, תקצירי הפרקים וההקדמה שעדיין מוגנים בזכויות יוצרים. מכיוון שמה שנשמר כאן הוא בדיוק הנוסח התקני הנוכחי הזה ולא דפוס היסטורי מסוים, לא מצוינת לו שנת הוצאה אחת.

