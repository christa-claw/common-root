# The narrative, one paragraph per key, in order.
hero.1=שאה ולי אללה דהלווי — בשמו המלא קוטב אלדין אחמד בן עבד אלרחים אלעומרי אלדהלווי — נולד ב-21 בפברואר 1703 בפולת, סמוך למוזפרנגר, והתחנך בדלהי, שם אביו, שאה עבד אלרחים, הקים את בית המדרש "אלרחימיה". מספרים שלמד את הקוראן בעל־פה בגיל שבע והשלים את מסכת הלימודים הרגילה בת זמנו בגיל חמש־עשרה, והחליף את אביו בראשות בית המדרש שנתיים לאחר מכן. בשנים 1730–1731 ביצע את עלית החאג', ולאחר מכן שהה כשנה במדינה ולמד חדית' — בעיקר אצל אבו טאהר אלכורדי (גם אלכוראני), ולמד עוד אצל מחמד וופדאללה אלמאלכי והשיח' תאג' אלדין אלקלעי — לפני שחזר לדלהי ב-16 בדצמבר 1732. הוא נפטר שם ב-20 באוגוסט 1762 (29 במוחרם 1176 להג'רה) ונקבר לצד אביו. בין חיבוריו האחרים: חֻ'גָ'ת אללה אלבאלגה, הנחשב בדרך כלל לספרו החשוב ביותר, אלפוז אלכביר, ופתוח אלחרמין, תיאורו שלו למסע שהביאו לחיג'אז.
hero.2=אלארבעין ממשיכה את אותה מסורת "ארבעים חדית'ים" (ארבעיניאת) כמו [[NAW|הארבעים של אלנוואוי]] ו[[QUD|הארבעים הקדושים]], מסורת שמקורה בחדית' המבטיח למי שישמור לבני אומתו ארבעים חדית'ים בענייני הדת מקום בין החכמים ביום הדין — חדית' שרוב המבקרים מסווגים אותו עצמו כחלש (צ'עיף) — ובאוסף הראשון מסוג זה, שאבד, המיוחס לעבדאללה בן אלמובארכ (נפ' 797). היא נבדלת משני האוספים הללו באשר לְמה שהיא אוספת: במקום חדית'ים הנבחרים לפי נושא או דרגה מכלל ספרות החדית', המוציא לאור האנגלי שלה מתאר אותה כארבעים חדית'ים ששאה ולי אללה טען כי שמע ישירות ממורו שלו במדינה, כל אחד נשמר יחד עם שלשלת המסירה (סנד) שבאמצעותה קיבל אותו — רישום מסירה אישי משנת הלימודים ההיא, אשר לפי דברי בנו שינתה את אופן הוראתו וכתיבתו לאחר שחזר לדלהי.
hero.3=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-dehlawi של fawazahmed0/hadith-api ומיושר חדית' מול חדית' עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אלבוכ'ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג'אמע אלתרמד'י]], [[NAS|סונן אלנסאאי]], [[IBM|סונן אבן מאג'ה]], [[MAL|מואטא של מאלכ]], [[NAW|הארבעים של אלנוואוי]] ו[[QUD|הארבעים הקדושים]], ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

