fact.4.label=מקום ומועד החיבור
fact.4.value=לאחר ששאה ולי אללה חזר לדלהי ב-16 בדצמבר 1732, בעקבות עלית חאג' שביצע ב-1730–1731 וכשנה של לימוד חדית' במדינה, בעיקר אצל אבו טאהר אלכורדי (גם אלכוראני)
fact.5.label=שיטה
fact.5.value=לפי המוציא לאור האנגלי שלה, כל אחד מארבעים החדית'ים הוא כזה ששאה ולי אללה טען כי שמע ישירות ממורו שלו, נשמר יחד עם שלשלת המסירה (סנד) שבאמצעותה קיבל אותו — רישום מסירה אישי ולא בחירה שנעשתה לפי נושא או דרגה
fact.6.label=מעמד
fact.6.value=אוסף "ארבעים החדית'ים" (ארבעיניאת) הנודע ביותר מתת־היבשת ההודית; ממשיך סוגה שהאוסף הראשון והידוע שבה, שאבד, מיוחס לעבדאללה בן אלמובארכ (נפ' 797) ואשר הולידה גם את [[NAW|הארבעים של אלנוואוי]] ו[[QUD|הארבעים הקדושים]]
