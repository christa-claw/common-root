fact.14.value=Ääni on koneellisesti tuotettu, ei ihmisen lukema, joten nimien ja termien ääntämystä ei ole toimituksellisesti tarkistettu; lukurivi seuraa ja korostaa kunkin jakeen vain Jakeet-näyttötilassa — muissa tiloissa ääni toimii silti, mutta ilman korostusta.
