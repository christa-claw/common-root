title=Synodaalikäännös — Tietoa tästä laitoksesta | Common Root
description=Venäjän synodaalikäännös vuodelta 1876: Venäjän raamattuseuran vuonna 1813 aloittama, neljän ortodoksisen teologisen akatemian metropoliitta Filaretin johdolla saattama päätökseen, ja yhä se Raamattu, jota useimmat venäjänkieliset tarkoittavat sanalla "Raamattu".
heroHeading=Synodaalikäännös
readerHref=/reader?c1.src=syn

hero.1=Hanke alkoi vuonna 1813, kun vastaperustettu Venäjän raamattuseura ryhtyi tsaari Aleksanteri I:n tuella venäjänkieliseen käännökseen, jonka oli määrä seistä kirkkoslaavilaisen Raamatun rinnalla, ei korvata sitä. Uusi testamentti ilmestyi muutaman vuoden kuluessa. Konservatiivinen papisto näki puhutulla venäjällä kirjoitetussa Raamatussa uhan kirkkoslaavilaisen tekstin arvovallalle, ja vuonna 1826 Nikolai I lakkautti seuran ja pysäytti työn kolmeksi vuosikymmeneksi.
hero.2=Käännöstyö jatkui vasta Aleksanteri II:n aikana. Vuonna 1858 pyhä synodi hyväksyi uuden venäjänkielisen laitoksen ja antoi työn Moskovan, Pietarin, Kazanin ja Kiovan teologisten akatemioiden tehtäväksi; Moskovan metropoliitta Filaret (Drozdov) toimi sen johtavana ja viimeisenä toimittajana. Uusi testamentti, käännetty kreikkalaisesta painetusta tekstistä, joka tunnetaan nimellä Textus Receptus, ilmestyi vuonna 1862. Vanha testamentti oli vaikeampi kiistakysymys: Filaret vaati menemistä kirkkoslaavilaisen tekstin taakse, itse hepreaan asti, mitä vastustivat ne, jotka pitivät kiinni kirkkoslaavilaisen tekstin kreikkalaisesta pohjasta, ja synodin muodollinen lupa kääntää masoreettisesta tekstistä saatiin vasta samana vuonna 1862 — jolloin suurin osa Vanhasta testamentista oli joka tapauksessa jo käännetty sillä pohjalla.
hero.3=Koko Raamattu — Vanha ja Uusi testamentti ensimmäistä kertaa saman kannen sisällä tällä uudella venäjällä eikä kirkkoslaaviksi — ilmestyi vuonna 1876 Synodaalikirjapainosta, josta käännöksen yleinen nimi on peräisin. Sen Vanha testamentti ei ollut puhtaasti heprealainen: missä kirkkoslaavilaisen perinteen säilyttämä Septuaginta poikkesi masoreettisesta tekstistä, kreikkalainen luku usein säilytettiin silti, yleensä vaihtoehtona sulkeissa, joten valmis kirja kantaa yhä todellisen velan vanhan kirkkoslaavilaisen tekstin takana olevalle kreikkalaiselle Raamatulle.
hero.4=Sillä ei ole sen jälkeen ollut vakavaa kilpailijaa. Ortodoksiset, katoliset, baptistiset ja muut protestanttiset lukijat Venäjällä turvautuvat kaikki jossain muodossa samaan tekstiin, ja sen tyyli on leimannut kirjallista venäjää samaan tapaan kuin kuninkaan Jaakon Raamattu englantia. Tässä aineistossa se käsittää 66 kirjaa, protestanttisen kaanonin eikä laajempaa ortodoksista, ja se on ainoa venäjänkielinen Raamattu täällä, joten venäjänkielinen käyttöliittymä avautuu siihen.

