title=Сорок хадисов кудси — Об этом издании | Common Root
description=Сорок хадисов кудси — изречения, смысл которых, как считают мусульмане, исходит от Бога, тогда как их словесная форма, как и в любом другом хадисе, передана через Мухаммада; здесь они читаются как том, сопутствующий «Сорока хадисам ан-Навави».
heroHeading=Сорок хадисов кудси
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Хадис кудси («священный» или «божественный» хадис) отличается от обычного хадиса тем, откуда, как считается, исходит его смысл: такие учёные, как аль-Джурджани, описывают его как слово Бога, выраженное собственными словами Мухаммада, — в отличие от Корана, чья словесная форма сама считается словом Бога. Это различие касается статуса, а не достоверности — хадис кудси не обязан быть сахихом (достоверным); некоторые из так классифицируемых являются да'иф (слабыми) или спорными и оцениваются по тем же критериям цепочек передачи, что и любой другой хадис.
hero.2=Собрание сорока хадисов кудси следует той же давней привычке, что и [[NAW|«Сорок хадисов ан-Навави»]], и более широкому жанру «сорока хадисов» (арбаинийят), к которому оно принадлежит, но здесь оно ограничено одной категорией хадисов, а не хадисами в целом. Широко распространённое английское издание именно под этим названием — выбранное и переведённое Иззеддином Ибрахимом и Денисом Джонсоном-Дейвисом, которые также подготовили сопутствующий перевод сборника ан-Навави, — было опубликовано Islamic Texts Society в 1997 году как двуязычный арабско-английский том, чьи сорок хадисов собраны из всей классической хадисной литературы. Являются ли сорок хадисов, представленных в этом собрании, именно этим выбором или независимо составленным набором, опубликованным под тем же традиционным названием, со стороны этого собрания не установлено.
hero.3=Арабский текст здесь — это классический матн, считающийся находящимся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-qudsi сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]], [[MUS|Сахиха Муслима]], [[ABD|Сунана Абу Дауда]], [[TIR|Джами ат-Тирмизи]], [[NAS|Сунана ан-Насаи]], [[IBM|Сунана Ибн Маджи]], [[MAL|Муватты Малика]], [[NAW|«Сорока хадисов ан-Навави»]] и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=Классический арабский, с английским переводом под каждым хадисом в читалке
fact.2.label=Составитель
fact.2.value=Нет единого классического составителя; опубликованное под этим названием английское издание было выбрано и переведено Иззеддином Ибрахимом и Денисом Джонсоном-Дейвисом, собравшими свои сорок хадисов из всей классической хадисной литературы
fact.3.label=Название
fact.3.value=Хадис кудси — «священный» или «божественный» хадис, чей смысл считается исходящим от Бога, хотя его словесная форма принадлежит самому Мухаммаду, в отличие от Корана
fact.4.label=Составлен
fact.4.value=Антология, собранная из более широкой хадисной литературы, а не единый непрерывный текст; английское издание Ибрахима/Джонсона-Дейвиса под этим названием было опубликовано в 1997 году
fact.5.label=Метод
fact.5.value=Отбор по признаку классификации как кудси, а не по каноническому рангу; хадис кудси не обязан быть сахихом (достоверным) — некоторые из так классифицируемых являются да'иф (слабыми) или спорными
fact.6.label=Положение
fact.6.value=Одна из нескольких антологий под этим названием, в той же давней традиции сорока хадисов (арбаинийят), что и [[NAW|«Сорок хадисов ан-Навави»]]
fact.7.label=Число хадисов
fact.7.value=40
fact.8.label=В этом собрании
fact.8.value=1 книга и 40 пронумерованных хадисов
fact.9.label=Английский перевод
fact.9.value=Взят из издания eng-qudsi сервиса fawazahmed0/hadith-api, показан как сопровождение к арабскому тексту; происходит ли он от перевода Ибрахима/Джонсона-Дейвиса или от независимого перевода, со стороны этого собрания не подтверждено
fact.10.label=Лицензия
fact.10.value=Арабский матн — это классический текст, считающийся находящимся в общественном достоянии; лицензия английского перевода пока находится на проверке
