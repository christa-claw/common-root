title=インド改訂訳 — この版について | Common Root
description=インド改訂訳(IRV)は、Bridge Connectivity Solutionsが2019年に発行したヒンディー語訳聖書で、CC BY-SA 4.0の下で公開されている——このコーパスが既定で開くヒンディー語の本文。
heroHeading=インド改訂訳
readerHref=/reader?c1.src=irvhin

hero.1=インド改訂訳は、2017年および2019年の著作権表示を持つ、インドの聖書翻訳・技術団体Bridge Connectivity Solutions Pvt. Ltd.による現代ヒンディー語訳聖書である。同じ発行元が、カンナダ語、タミル語、テルグ語、アッサム語などインドの他の主要言語でも並行して制作している、より広範な「インド改訂訳」シリーズの一つであり、いずれもそれぞれの文字体系による完全な聖書として、同じオープンライセンスの下で公開されている。
hero.2=Common Rootの本文は、eBible.orgが配布するヒンディー語IRVのUSFM版（同サイトではhin2017として分類されている）に基づいており、脚注の文章が本文中にそのまま埋め込まれ、書名が英語ではなくヒンディー語で記されていた、同じ訳の以前のデジタルコピーには基づいていない。このUSFM版から改めて取り込み直すことで、この版が追加される前に両方の問題が解消された——本コーパスは、聖書自体の言語にかかわらず、すべての版で内部的に書名を英語で保持している。
hero.3=ここではデーヴァナーガリー文字で、इंडियन रिवाइज़्ड वर्ज़नとして表記され、第二正典を含まない標準的な66巻のプロテスタント正典を収める。
hero.4=本コーパスで唯一のヒンディー語聖書であり、そのためヒンディー語インターフェースは既定でこの版で開く。

