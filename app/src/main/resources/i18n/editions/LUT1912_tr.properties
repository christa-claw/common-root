title=Luther Bibel 1912 — Bu Baskı Hakkında | Common Root
description=Luther Kutsal Kitabı'nın ikinci kilise revizyonu: bilerek ölçülü tutulmuş bir gözden geçirme; 1910'da tamamlandı, 1912'de kabul edildi ve Textus Receptus'a dayanan son Luther metni oldu.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Bir revizyonun revizyonu. Alman kiliseleri 1892'de, ilk kilise revizyonuyla, Luther Kutsal Kitabı'nın tek bir metninde anlaşmıştı; birkaç yıl içinde bunun yetersiz olduğu söylenmeye başlandı. İtirazlar eskisiydi: fazla arkaizm ve artık kimsenin olmayan bir yazım. Kararı ikincisi verdi. Duden, Alman İmparatorluğu'na okullarda öğretilen bağlayıcı bir imla kazandırmıştı ve bundan ayrılan bir Luther Kutsal Kitabı'nı bir sınıfın önüne koymak zordu. 1906'da Alman Evanjelik Kilise Konferansı yeni bir revizyona razı oldu ve bunun esirgeyici ve koruyucu olmasını açıkça şart koştu. Bir ilahiyatçılar kurulu 1910'a dek bütün kitapları baştan sona geçti ve 1912'de konferans sonucu kabul etti.
hero.2=İş iki yılı ancak aştı; bu da nasıl bir revizyon olduğunu söyler. Kimse ne filolojik olarak ne de başka bir biçimde yeni bir Luther Kutsal Kitabı yapmaya çalışmıyordu. Sonraki bir gözden geçiren, Fritz Tschirch, onu okul hocası işi bir revizyon diye bir yana itti; yöntem konusunda bu yakıştırma yanlış değil — yazım hizaya sokuldu, apaçık ölmüş sözcükler değiştirildi, söyleyiş geri kalanda Luther'in bıraktığı yerde bırakıldı. Yakıştırmanın göremediği şey, metnin ne kadar iyi dayandığıdır. Ardından gelen kısmi revizyon onyılları boyunca 1912 metni yerinde durdu ve bugün de okunuyor, bugün de satılıyor. Bunun bir yanı 1912 Jubiläumsbibel'idir: Württemberg Kutsal Kitap Enstitüsü'nün açıklayıcı notlu yüzüncü yıl baskısı, bu yüzyılın içlerine dek Fraktur harfleriyle yeniden basıldı. Bir yanı da telif hakkının düşmüş olmasıdır: metni çoğaltmanın hiçbir bedeli yok, bu yüzden her yerde karşınıza çıkıyor — burada da.
hero.3=Onu muhafazakâr okurlar arasında ayakta tutan şey her şeyden önce şudur: Textus Receptus üzerine kurulu son Luther revizyonudur — 16. ve 17. yüzyılların Yunanca Yeni Antlaşması. Ondan sonraki her şey eleştirel metne geçti. Bu da bu baskıyı, bir merdivende üzerine basılacak alışılmadık ölçüde temiz bir basamak yapar; çünkü altındaki Yunanca, Luther'in kendi 1545 baskısının altındaki, Cenevre'nin ve King James'in altındaki Yunancanın aynısıdır — kule, zemini yarı yolda değiştirmek yerine tek bir zemini paylaşır.
hero.4=Soy basamaklarında bu baskı doğrudan Luther Bibel 1545'in üstünde durur ve kayıtlı tam bir atası vardır: o. 1912 tarihli bir ayetin altında bir basamak açın, altında Luther'in kendi 1545 söyleyişi belirir; bir tane daha açın, merdiven Yunanca için Textus Receptus'a, İbranice için Westminster Leningrad Kodeksi'ne uzanır. Üç yüz altmış yedi yıllık revizyon, ayet ayet, iki tıklamada. Bu baskının olmadığı şey ise şu: Almanca bir arayüzün üzerine açıldığı Kutsal Kitap değildir — Almanca için seçilmiş bir varsayılan baskı yok, dolayısıyla okur kataloğun ilk Almanca Kutsal Kitabını alır ve o da Elberfelder'dir.

