fact.12.value=Alman merdiveninin en üstü: kayıtlı tek ata, [[LUT1545|Luther Bibel 1545]], onun altında da asıl dillerin zemini. Gözden geçirenlerin 85 notu burada atılmayıp yorum olarak taşınır ve baskıya bağlıdır — 1912 tarihli bir açıklama 1912 sütununun altında görünür, başka hiçbir yerde görünmez. Almanca bir arayüzün üzerine açıldığı baskı bu değildir; o [[ELB|Elberfelder]]'dir, katalogda kısaltmasıyla ilk sırada olduğu için, başka hiçbir nedenle değil
