title=دُواي-ريمس 1899 — عن هذه الطبعة | Common Root
description=كتاب دُواي-ريمس المقدس: الترجمة الكاثوليكية الإنجليزية المصنوعة عن الفولغاتا اللاتينية في ريمس سنة 1582 وفي دُواي سنة 1609–10، وقد راجعها الأسقف تشالونر، في طبعة بالتيمور لسنة 1899.
heroHeading=دُواي-ريمس 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=في سنة 1568 أنشأت جماعة من الكاثوليك الإنجليز، كثير منهم من رجال أكسفورد الذين لم يعد في وسعهم الاحتفاظ بمناصبهم، كليةً في دُواي بفلاندرز برئاسة وليم ألن. وكان من بين ما وُجدت له أن تضع كتابًا مقدسًا إنجليزيًا في أيدٍ كاثوليكية، إذ لم تكن الكتب الإنجليزية المتداولة حينئذ إلا بروتستانتية، وكانت تُستعمل في الجدل. بدأ غريغوري مارتن الترجمة في تشرين الأول من سنة 1578 بمعدل إصحاحين في اليوم تقريبًا، وصدر العهد الجديد سنة 1582 في ريمس، حيث كانت الكلية قد انتقلت مؤقتًا. ومات مارتن في الثامن والعشرين من تشرين الأول من تلك السنة، بعد أسابيع من ظهور عهده الجديد. وكان العهد القديم جاهزًا في الوقت نفسه ثم ظلّ غير مطبوع، لسبب بسيط هو أنّ الكلية لم يكن في مقدورها نفقة طبعه؛ وصدر أخيرًا في مجلدين سنة 1609 و1610، ولم يكن يفصله عن ترجمة الملك جيمس إلا عامان.
hero.2=وما يفصله عن كل كتاب مقدس إنجليزي آخر في هذه المجموعة هو ما صُنع عنه. لا عن العبرية واليونانية: بل عن الفولغاتا اللاتينية. فقد أعلن مجمع ترنت أنّ الفولغاتا هي النص الموثوق للكنيسة، وأضاف مترجمو دُواي أنّ إيرونيموس عمل على مخطوطات أقدم من أي نسخة يونانية كانت في متناولهم — وهو، في ما يخصّ العهد القديم، ظنّ غير بعيد عن المعقول حوالي سنة 1600. والنثر الذي نتج مثقل باللاتينية، حتى إنه أحيانًا لا يكون إنجليزيًا أصلًا: فالصلاة الربانية تطلب “supersubstantial bread”، لأنّ المترجمين لم يريدوا تعريب كلمة كان اللاهوت مستندًا إليها. كان ذلك مبدأً لا عجزًا.
hero.3=وبحلول منتصف القرن الثامن عشر لم يكد أحد يقدر على قراءته، فراجعه الأسقف ريتشارد تشالونر بين 1749 و1752 — مراجعة عميقة، وفي اتجاه ترجمة الملك جيمس إلى حدّ بعيد، إذ كانت تلك الترجمة قد صارت ببساطة هي صوت الكتاب المقدس بالإنجليزية. وكل كتاب يُباع اليوم باسم دُواي-ريمس هو نصّ تشالونر لا نصّ مارتن. وهذه هي الطبعة الأمريكية لسنة 1899، الصادرة عن شركة جون ميرفي في بالتيمور، وتحمل إذن الطبع من الكاردينال جيمس غيبونز؛ ولأنّ تلك الطبعة خرجت من حماية حقوق النشر منذ زمن طويل، فهي التي مُسحت ضوئيًا وأُدخلت وأُعيد إنتاجها منذ ذلك الحين، وهي في الواقع ما تكونه كل نسخة رقمية من دُواي-ريمس تقريبًا.
hero.4=وفي هذا القارئ يفعل ما لا تكاد تفعله طبعة أخرى هنا. فأصله المسجّل موجود في المجموعة: افتح درجة نسب تحت آية من دُواي-ريمس، فتكون الدرجة التي تحتها هي الفولغاتا اللاتينية نفسها، النص الذي تُرجم عنه فعلًا، لا أرضية اللغات الأصلية المعلّمة بـ≈ التي تسقط إليها معظم الطبعات. وهذه بالضبط هي الحالة التي بُني لأجلها نظام الدرجات. وقد جرى التأثير في الاتجاه المعاكس أيضًا — فعهد ريمس الجديد كان على موائد مترجمي الملك جيمس، وانتقل قدر لا بأس به من مفرداته اللاتينية إلى عملهم — غير أنّ قائمة النسب لا تحفظ إلا خطوط المراجعة الرسمية، فلم يُسجَّل ذلك الدين فيها. وثمة انقلاب يستحق التنبيه: شارة درجته تحمل سنة 1899 بينما لا تُظهر بطاقة الفهرس أي سنة البتة. فسنوات الدرجات قائمة مرتّبة باليد، والبطاقة تقرأ بيانات الفهرس نفسه؛ وحيث تكون طبعة في إحداهما دون الأخرى، يختلف الاثنان على الملأ.
hero.5=وتنبيه بشأن القانون الكنسي. النص المحفوظ هنا فيه 72 سفرًا لا 73 كما في كتاب كاثوليكي مطبوع. والأسفار القانونية الثانية الستة التي يحملها — طوبيا ويهوديت والمكابيين الأول والثاني والحكمة وابن سيراخ — تقع بعد سفر الرؤيا لا في مواضعها الكاثوليكية، وسفر باروخ غائب تمامًا. وهذه صفة النص الرقمي كما أُدخل، لا صفة كتاب سنة 1899؛ ومعنى ذلك أنّ هذا العمود يُقرأ صحيحًا آيةً آية، لكن لا ينبغي استعماله للتحقق مما يتضمّنه القانون الكاثوليكي.

