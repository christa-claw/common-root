fact.1.label=اللغة
fact.1.value=الإنجليزية — التقليد الكاثوليكي
fact.2.label=مترجم عن
fact.2.value=الفولغاتا اللاتينية لا عن العبرية واليونانية — [[VUL|الفولغاتا]] نفسها التي تحملها هذه المجموعة
fact.3.label=العهد الجديد
fact.3.value=ريمس، 1582 — عمل غريغوري مارتن أساسًا، ومعه وليم ألن وريتشارد بريستو وتوماس ورثنغتون
fact.4.label=العهد القديم
fact.4.value=دُواي، 1609 و1610، في مجلدين — أُنجز في وقت العهد الجديد نفسه لكنه حُبس نحو ثلاثين سنة لانعدام المال اللازم لطبعه
fact.5.label=راجعه
fact.5.value=الأسقف ريتشارد تشالونر، 1749–1752 — كل كتاب يُباع اليوم باسم دُواي-ريمس هو مراجعة تشالونر لا نص 1582/1610
fact.6.label=هذه الطبعة
fact.6.value=الطبعة الأمريكية لسنة 1899 عن شركة جون ميرفي، بالتيمور، بإذن طبع من الكاردينال جيمس غيبونز — خارجة من حقوق النشر منذ زمن طويل، وهي النسخة المتداولة رقميًا
fact.7.label=المحتوى هنا
fact.7.value=72 سفرًا: الـ66 من القانون البروتستانتي بترتيب بروتستانتي، مع طوبيا ويهوديت والمكابيين الأول والثاني والحكمة وابن سيراخ ملحقة بعد سفر الرؤيا. وباروخ غير موجود، فلا يصلح هذا العمود فحصًا موثوقًا للقانون الكاثوليكي
fact.8.label=النسب
fact.8.value=من الطبعات القليلة هنا التي يوجد أصلها المسجّل داخل المجموعة نفسها — درجة تحت آية من دُواي-ريمس تنفتح على [[VUL|الفولغاتا اللاتينية]] لا على أرضية اللغات الأصلية
fact.9.label=في هذه المجموعة
fact.9.value=تحمل شارة درجته سنة 1899 مع أنّ بطاقة الفهرس تترك السنة فارغة؛ فسنوات الدرجات قائمة مرتّبة على حدة، ويُسمح للاثنين بالاختلاف
