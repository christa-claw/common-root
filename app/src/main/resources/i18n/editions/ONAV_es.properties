title=Open New Arabic Version — Sobre esta edición | Common Root
description=Open New Arabic Version de Biblica: una Biblia árabe moderna, con derechos de autor de 1988, 1997 y 2012, publicada bajo una licencia Creative Commons que permite compartirla, adaptarla e imprimirla con crédito.
heroHeading=Open New Arabic Version de Biblica
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Esta es una traducción árabe moderna, un texto distinto de [[SVD|Smith & Van Dyck]] y no otra copia de él. La publica Biblica, Inc., cuyo aviso de derechos de autor lleva tres años: 1988, 1997 y 2012. La propia página de derechos de autor del texto da su nombre más antiguo, Ketab El Hayat Majani.
hero.2=Lo que lo distingue en este lector es su licencia. Biblica lo publicó como texto «abierto» bajo la licencia Creative Commons Atribución-CompartirIgual 4.0: cualquiera puede copiarlo, adaptarlo e imprimirlo, siempre que se dé crédito a Biblica y lo que se construya a partir de él se comparta en los mismos términos. La mención de crédito que pide Biblica es: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". La mayoría de las traducciones modernas no se ofrecen así, y por eso está aquí.
hero.3=La licencia tiene una condición que vale la pena conocer. El texto sin modificar puede llevar el nombre de Biblica. Un texto reordenado no: las ediciones en Orden de los hechos y Orden de redacción de este sitio colocan los libros en otra secuencia, lo cual tratamos como una adaptación, así que indican que el texto ha sido reordenado y no usan el nombre de Biblica como título.
hero.4=El archivo está completamente vocalizado. Un detalle de su fuente: Hechos 15:25 y 26 se imprimen como un solo versículo, de modo que el corpus los mantiene juntos bajo el versículo 25 y no tiene allí un versículo 26 separado.

