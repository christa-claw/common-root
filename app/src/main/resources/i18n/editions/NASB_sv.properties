title=New American Standard Bible 2020 — Om denna utgåva | Common Root
description=New American Standard Bible: Lockman Foundations egen fortsättning av American Standard Versions ordagranna bokstavstrohet, nyöversatt från hebreiska, arameiska och grekiska och nu i sin text från 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=New American Standard Bible började som en medveten fortsättning snarare än ett helt nytt projekt. Lockman Foundation, en ideell organisation med säte i La Habra, Kalifornien, inledde arbetet 1959 för att föra American Standard Version från 1901 vidare — och behålla dess rykte om bokstavstrogen, ordagrann trohet mot hebreiska, arameiska och grekiska, samtidigt som dess ålderdomliga engelska moderniserades. Stiftelsen samlade en kommitté av forskare från kristna högskolor, seminarier och främst konservativa evangelikala samfund, och översättningen kom ut i etapper: Johannesevangeliet 1960, de övriga evangelierna 1962, hela Nya testamentet 1963, Psaltaren separat 1968, och hela bibeln 1971. Den första fullständiga utgåvan utgick från tredje upplagan av Rudolf Kittels Biblia Hebraica för Gamla testamentet, med Dödahavsrullarna beaktade, och från 23:e upplagan av Nestle och Alands Novum Testamentum Graece för Nya testamentet.
hero.2=Revideringen fortsätte i decennier efter den första tryckningen. Mindre ändringar i ordalydelsen följde 1972, 1973 och 1975, därefter en mer genomgripande revidering 1977 och ytterligare en begränsad 1992. År 1995 gav stiftelsen ut Updated Edition — NASB95, den text de flesta menar när de bara säger ”NASB” — med hjälp av Biblia Hebraica Stuttgartensia och 26:e upplagan av Nestle-Aland. Den nuvarande texten är uppdateringen från 2020, varav delar redan hade börjat visas online 2018: den flyttade Gamla testamentets textbas till Biblia Hebraica Stuttgartensia och, för de böcker den omfattar, den nyare Biblia Hebraica Quinta, med Septuaginta, Dödahavsrullarna, targumerna och andra forntida versioner beaktade där de påverkar en läsning, medan Nya testamentet nu följer 28:e upplagan av Nestle-Aland, kompletterad med Editio Critica Maiors fylligare material av grekiska handskriftsbelägg. Översättarnas uttalade metod höll sig densamma genom varje revidering: återge originalet så ordagrant som engelskan tillåter, och där en strikt ordagrann återgivning skulle missleda eller läsas onärligt, välj det tydligare idiomet och ange den mer ordagranna lydelsen i en fotnot istället — en disciplin som ofta anges som skälet till att detta är en av de mest bokstavstrogna av de allmänt använda engelska översättningarna från 1900- och 2000-talet.
hero.3=Trots sitt namn och sin uttalade skuld till American Standard Version är New American Standard Bible en nyöversättning från originalspråken snarare än en rad-för-rad-revidering av den, och korpuset antecknar därför ingen förälder för den: öppnar man en härstamningsstegpinne under en NASB-vers går den rakt ner till botten med originalspråket, markerad ≈, precis som för New International Version. De två har mer gemensamt än den formen — båda är licensierade snarare än fria att kopiera, vilket skiljer dem från de fritt kopierbara engelska utgåvorna på samma hylla, även om ett engelskt gränssnitt öppnar på New International Version som standard, medan New American Standard Bible nås från sitt eget kort i översättningsrutnätet.

fact.1.label=Språk
fact.1.value=Engelska
fact.2.label=Beställd av
fact.2.value=Lockman Foundation i La Habra, Kalifornien, som inledde projektet 1959 som en fortsättning på American Standard Versions tradition av ordagrann översättning
fact.3.label=Utförd av
fact.3.value=En översättningskommitté finansierad av stiftelsen, med forskare från kristna högskolor och seminarier och främst konservativa evangelikala samfund
fact.4.label=Gamla testamentet från
fact.4.value=Rudolf Kittels Biblia Hebraica (3:e upplagan) och Dödahavsrullarna för originalutgåvan 1971; Biblia Hebraica Stuttgartensia från revideringen 1995; 2020 års text hänvisar till Biblia Hebraica Stuttgartensia och, där den finns tillgänglig, den nyare Biblia Hebraica Quinta, med Septuaginta, Dödahavsrullarna, targumerna och andra forntida versioner beaktade
fact.5.label=Nya testamentet från
fact.5.value=Nestle och Alands Novum Testamentum Graece, 23:e upplagan, för originalutgåvan 1971; 26:e upplagan från revideringen 1995; 28:e upplagan (NA28) för 2020 års text, kompletterad med Editio Critica Maiors material av grekiska handskriftsbelägg
fact.6.label=Typ av översättning
fact.6.value=Formell motsvarighet — översatt så ordagrant från originalspråken som läsbar engelska tillåter, med den mer ordagranna återgivningen i fotnot där ett tydligare idiom valts istället; en nyöversättning från hebreiska, arameiska och grekiska, inte en revidering av en äldre engelsk bibel, trots sina rötter i American Standard Versions arbetssätt
fact.7.label=Utgiven
fact.7.value=Johannesevangeliet 1960, evangelierna 1962, Nya testamentet 1963, Psaltaren 1968, hela bibeln 1971, mindre textändringar 1972, 1973 och 1975, en större revidering 1977, en begränsad revidering 1992, Updated Edition (NASB95) 1995, och den nuvarande texten från 2020, varav delar publicerades online från 2018
fact.8.label=Licens
fact.8.value=Licensierad, inte fri att kopiera. Upp till 1 000 verser får citeras i valfri form utan skriftligt tillstånd, förutsatt att de inte utgör en hel bibelbok eller mer än hälften av det citerande verket, med ett upphovsrättserkännande som nämner 1960, 1971, 1977, 1995 och 2020; allt därutöver kräver Lockman Foundations tillstånd
fact.9.label=I detta korpus
fact.9.value=Licensierad snarare än fri att kopiera, precis som [[NIV|New International Version]] — det engelska gränssnittet öppnar på den utgåvan som standard, och denna nås från sitt eget kort. Ingen förälder är antecknad i härstamningsstegen: även om stiftelsen beskriver projektet som en fortsättning på [[ASV|American Standard Versions]] bokstavstrohet, är den nyöversatt från hebreiska, arameiska och grekiska snarare än en revidering av den eller någon annan engelsk text som finns här, så en stegpinne under en NASB-vers går rakt ner till botten med originalspråket, markerad ≈
