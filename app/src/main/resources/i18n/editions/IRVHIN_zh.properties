title=印度修订版 — 关于本版本 | Common Root
description=印度修订版（IRV）：由 Bridge Connectivity Solutions 于2019年出版的印地语圣经译本，采用 CC BY-SA 4.0 授权——本语料库默认开启的印地语文本。
heroHeading=印度修订版
readerHref=/reader?c1.src=irvhin

hero.1=印度修订版是一部现代印地语圣经译本，版权标注为2017年及2019年，归Bridge Connectivity Solutions Pvt. Ltd.所有，该机构是一家印度的圣经翻译与技术团体。它属于同一出版方同时在印度其他多种主要语言中推出的更大系列"印度修订版"——其中包括坎纳达语、泰米尔语、泰卢固语和阿萨姆语——每一种都是以该语言自身文字写成的完整圣经，采用同一开放授权发布。
hero.2=Common Root的文本取自eBible.org发布的印地语IRV的USFM版本，该网站将其编目为hin2017，而非取自同一译本早先流传的一份数字副本——那份副本把注脚文字直接嵌入经文之中，并以印地语而非英语书写书名。重新从该USFM来源导入，在本版本加入本语料库之前，修正了这两个问题——本语料库在所有版本内部一律以英语保留书名，不论圣经本身使用何种语言。
hero.3=在本语料库中，它以天城文书写，名为इंडियन रिवाइज़्ड वर्ज़न，收录标准的66卷新教正典，不含次经。
hero.4=它是本语料库中唯一的印地语圣经，因此印地语界面默认即以它开启。

