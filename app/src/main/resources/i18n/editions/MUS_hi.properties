# The narrative, one paragraph per key, in order.
hero.1=अबुल हुसैन मुस्लिम इब्न अल-हज्जाज अल-क़ुशैरी अल-नयशापुरी का जन्म नयशापुर में हुआ, जो अब्बासी प्रांत खुरासान में था (आज के उत्तर-पूर्वी ईरान में); स्रोत जन्म-वर्ष के बारे में भिन्न हैं, कोई 202, कोई 204 और कोई 206 हिजरी (लगभग 817–822 ई.) बताता है। उन्होंने अरब प्रायद्वीप, मिस्र, इराक़ और सीरिया की यात्रा की, हर जगह के विद्वानों से हदीसें एकत्र करने के लिए, और फिर अपने गृहनगर में बस गए, जहाँ उनकी मुलाक़ात अल-बुख़ारी से हुई, उन्होंने उनके अधीन अध्ययन किया और जीवन भर उनके मित्र बने रहे। अल-ख़तीब अल-बग़दादी के अनुसार, उन्होंने यह ग्रंथ अपने एक शिष्य, अहमद इब्न सलमा अल-नयशापुरी, के आग्रह पर रचा; इसका मूल नाम, अल-मुसनद अल-सहीह अल-मुख़्तसर, सामान्यतः, अल-बुख़ारी के ग्रंथ की तरह, सहीह मुस्लिम के रूप में संक्षिप्त किया जाता है। उनकी मृत्यु 261 हिजरी (875 ई.) में नयशापुर में हुई और उन्हें उसके उपनगर नसराबाद में दफ़नाया गया।
hero.2=वे किसी हदीस को तभी स्वीकार करते थे जब उसकी प्रसारण-शृंखला बिना टूटे मुहम्मद के किसी साथी तक पहुँचती थी, और हर कड़ी में कम से कम दो विश्वसनीय रावियों से गुज़रती थी; उन्होंने रावियों को स्मृति और चरित्र के अनुसार तीन स्तरों में बाँटा और जिनकी सच्चाई संदेह में थी उन्हें अलग रखा। उनके व्याख्याकार अल-नवावी ने एक और सावधानी की ओर इशारा किया: मुस्लिम, उन्होंने लिखा, हर हदीस को उसकी सभी शृंखलाओं और पाठ-भेदों के साथ एक ही उपयुक्त स्थान पर रखते हैं, बजाय इसके कि वे बिखरे हुए दिखें — एक प्रस्तुति जिसकी बाद के व्याख्याकारों ने [[BUK|सहीह अल-बुख़ारी]] की उस प्रथा से तुलना की है, जिसमें किसी हदीस के भिन्न पाठों को अलग-अलग, हर एक को उस अध्याय के अंतर्गत रखा जाता है जिसकी बात वह पाठ स्पष्ट करता है।
hero.3=पुस्तक में वास्तव में कितनी हदीसें हैं, यह, [[BUK|सहीह अल-बुख़ारी]] की तरह, इस पर निर्भर करता है कि कौन गिन रहा है और दोहराव को कैसे गिना जाता है। कातिब चेलेबी और सिद्दीक़ हसन ख़ान दोनों 7,275 तक पहुँचे; मुहम्मद फुआद अब्द अल-बाक़ी, दोहराव रहित गिनती में, 3,033 तक; मशहूर इब्न हसन आल सलमान 7,385 तक, या मुस्लिम की अपनी भूमिका की दस हदीसें जोड़ने पर 7,395 तक; अन्य अनुमान कुल संख्या को लगभग 5,500 और 7,500 के बीच रखते हैं। अल-जौज़क़ी ने सहीह अल-बुख़ारी के साथ लगभग शब्दशः साझा 2,326 हदीसें गिनी। इस संग्रह की अपनी संख्या एक और ही संख्या है: 57 पुस्तकें और 7,563 क्रमांकित हदीसें — जो केवल उस डिजिटल संस्करण का स्वरूप है जिससे यह लिया गया है, किसी एक विशेष मुद्रित क्रमांकन को यथावत् दोहराने का दावा नहीं।
hero.4=यहाँ अरबी पाठ शास्त्रीय मतन है, सार्वजनिक डोमेन में। इसके नीचे पाठक में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-muslim संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित है ताकि दोनों को साथ-साथ पढ़ा जा सके — वही सह-प्रस्तुति व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उत्पन्न हुई है, यह इस संग्रह की ओर से स्पष्ट नहीं किया जा सका है, इसीलिए इसका लाइसेंस सीधे सार्वजनिक डोमेन के बजाय समीक्षाधीन अंकित है; ऊपर की अरबी में यह अनिश्चितता नहीं है।

