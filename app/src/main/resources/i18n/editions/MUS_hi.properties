title=सहीह मुस्लिम — इस संस्करण के बारे में | Common Root
description=सहीह मुस्लिम: सहीह अल-बुख़ारी के साथ मिलकर 'सहीहैन' बनाता है, वे दो संग्रह जिन्हें सुन्नी इस्लाम क़ुरआन के ठीक बाद रखता है; मुस्लिम इब्न अल-हज्जाज ने इसे अरब प्रायद्वीप, मिस्र, इराक़ और सीरिया में एकत्र की गई हदीसों से संकलित किया, और केवल उन्हीं को शामिल किया जिनकी विश्वसनीय रावियों की शृंखला अटूट थी।
heroHeading=सहीह मुस्लिम
