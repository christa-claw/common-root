title=Biblia Sinodal — Acerca de esta edición | Common Root
description=La Biblia Sinodal rusa de 1876: iniciada en 1813 por la Sociedad Bíblica Rusa, concluida por las cuatro academias teológicas ortodoxas bajo el metropolita Filaret, y todavía la Biblia que la mayoría de los hablantes de ruso entienden simplemente como «la Biblia».
heroHeading=Biblia Sinodal
readerHref=/reader?c1.src=syn

hero.1=El proyecto comenzó en 1813, cuando la recién fundada Sociedad Bíblica Rusa, con el apoyo del zar Alejandro I, emprendió una traducción al ruso destinada a situarse junto a la Biblia eslava eclesiástica, no a sustituirla. En pocos años apareció un Nuevo Testamento. El clero conservador vio en una Biblia en ruso hablado una amenaza a la autoridad del texto eslavo eclesiástico, y en 1826 Nicolás I disolvió la Sociedad y detuvo el trabajo durante tres décadas.
hero.2=La traducción solo se reanudó bajo Alejandro II. En 1858 el Santo Sínodo autorizó una nueva versión rusa y encomendó el trabajo a las academias teológicas de Moscú, San Petersburgo, Kazán y Kiev, con el metropolita Filaret (Drozdov) de Moscú como editor principal y final. El Nuevo Testamento, traducido del texto griego impreso conocido como Textus Receptus, apareció en 1862. El Antiguo Testamento fue el punto más difícil de resolver: Filaret insistía en remontarse, más allá del texto eslavo eclesiástico, al propio hebreo, a lo que se oponían quienes se aferraban a la base griega del texto eslavo, y el permiso formal del Sínodo para traducir del texto masorético no llegó hasta ese mismo 1862, cuando ya se había hecho así la mayor parte del Antiguo Testamento de todos modos.
hero.3=La Biblia completa —Antiguo y Nuevo Testamento reunidos por primera vez bajo una misma cubierta en este nuevo ruso y no en eslavo eclesiástico— apareció en 1876, de la Imprenta Sinodal, de donde procede el nombre habitual de la traducción. Su Antiguo Testamento no resultó puramente hebreo: donde la Septuaginta que conservaba la tradición eslava eclesiástica discrepaba del texto masorético, a menudo se mantenía también la lectura griega, generalmente como variante entre paréntesis, de modo que el libro terminado conserva una deuda real con la Biblia griega que respaldaba al antiguo texto eslavo.
hero.4=Desde entonces no ha tenido un rival serio. Lectores ortodoxos, católicos, bautistas y de otras confesiones protestantes en Rusia recurren todos, de un modo u otro, al mismo texto, y su estilo ha marcado el ruso literario tanto como la Versión del Rey Jacobo marcó el inglés. En este corpus reúne 66 libros, el canon protestante y no el ortodoxo más amplio, y es la única Biblia rusa aquí, de modo que una interfaz en ruso se abre en ella.

