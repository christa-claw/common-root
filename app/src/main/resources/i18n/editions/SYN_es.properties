fact.13.value=La Biblia completa —cada capítulo de ambos Testamentos— leída por la voz neuronal de Microsoft Azure ru-RU-DmitryNeural, sintetizada capítulo a capítulo y no versículo a versículo, para que la prosa conserve su ritmo natural de frase.
fact.14.label=Limitaciones del audio
fact.14.value=Generado por máquina y no por un lector humano, por lo que la pronunciación de nombres y términos no ha sido revisada editorialmente; la línea de lectura sigue el texto y resalta cada versículo solo en el modo de visualización «Versículos» —en los demás modos el audio sigue sonando, pero sin resaltado.
