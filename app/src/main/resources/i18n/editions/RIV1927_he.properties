title=ריבדוטה 1927 (איטלקית) — על מהדורה זו | Common Root
description=הריבדוטה: הביבליה האיטלקית של ג'ובאני דיודאטי, מתוקנת על פי העברית והיוונית בידי ועדה בראשות התאולוג הוולדנזי ג'ובאני לוצי, שיצאה לאור ברומא ב־1924 בידי חברת התנ״ך הבריטית והזרה — ומדוע הקובץ אומר 1927.
heroHeading=ריבדוטה 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=ג'ובאני לוצי נולד ב־1856 באנגדין התחתון, בקנטון השווייצרי גראובינדן, והובא ללוקה כתינוק כשמשפחתו היגרה לשם בשנה שלאחר מכן. הוא גדל איטלקי, למד בפקולטה הוולדנזית לתאולוגיה בפירנצה — בית הספר של הכנסייה הפרוטסטנטית העתיקה של איטליה — ולימים לימד בה תאולוגיה ושימש כומר בעיר. את שנותיו האחרונות עשה שוב בשווייץ, בפוסקיאבו, ושם מת ב־1948.
hero.2=הריבדוטה החלה ב־1906, כשחברת התנ״ך הבריטית והזרה, שכבר מאה שנה הדפיסה לקוראים האיטלקים את תרגומו של דיודאטי מן המאה השבע־עשרה, הטילה על קבוצה לתקן אותו והעמידה את לוצי בראשה. הוא קיווה לעשות ממנו ביבליה משותפת עם חוקרים קתולים; הוותיקן סירב, והעבודה נמשכה כתיקון פרוטסטנטי. הביבליה השלמה יצאה ברומא ב־1924, ובשער שלה תוארה כנוסח מתוקן על פי הטקסט המקורי — „riveduta”, מתוקנת, ובשם זה היא ידועה מאז. אין זה תרגום חדש: ביסודו עומד הטקסט של דיודאטי, שהושווה מחדש לעברית וליוונית. היא הייתה הביבליה של הפרוטסטנטים האיטלקים במרבית המאה העשרים, ויורשתה, הנואובה ריבדוטה, יצאה לאור בידי חברת התנ״ך של ז'נבה ב־1994. לוצי עשה גם תרגום משלו, מבואר, בשנים־עשר כרכים שיצאו בפירנצה מ־1921 ואילך; זו יצירה אחרת ולא הטקסט הזה.
hero.3=התיקון ניכר בדף. השם המפורש בברית הישנה הוא „l'Eterno”, הנצחי — „L'Eterno è il mio pastore” במזמור 23 — במקום שבו אצל דיודאטי „il Signore”. ישעיהו 7:14 קורא „la giovane”, העלמה, במקום שבו אצל דיודאטי „la Vergine”, הבתולה. בברית החדשה היא סוטה מן הנוסח המקובל במקומות שבהם סוטות ממנו המהדורות הביקורתיות המאוחרות: ביוחנן א' 5:7 אין העדים השמימיים, תפילת האדון במתי 6:13 מסתיימת בלי השבח, ומעשי השליחים 8:37 נשמר אך בתוך סוגריים מרובעים. המזמורים ממוספרים כמו בעברית, וכותרת המזמור מצורפת לפסוק הראשון שלו — מזמור 23 נפתח במילים „Salmo di Davide.” — ולכן במזמור 51 יש 19 פסוקים, כמו בביבליות האנגליות. ובאשר לתאריך: 1927 היא השנה שהטקסט הדיגיטלי נושא ושהקטלוג שומר, ולכן תווית השלב שלה מציגה 1927. הריבדוטה עצמה יצאה ב־1924, ואיזו הדפסה מאוחרת יותר משחזר הקובץ — זאת לא בירר פרויקט זה.
hero.4=בקורא זה היא אחת משלוש ביבליות איטלקיות, לצד שני עותקים של דיודאטי. ממשק איטלקי אינו נפתח עליה: לאיטלקית אין בחירה מאוצרת, ולכן הקורא לוקח את הביבליה האיטלקית הראשונה בסדר הקטלוג, והיא דיודאטי 1649. בשלבי השושלת לא רשום לה שום מקור — אפילו לא דיודאטי, אף שהריבדוטה היא תיקון של דיודאטי ודיודאטי נמצא באוסף — ולכן שלב שנפתח תחת פסוק יורד ישר אל רצפת לשונות המקור המסומנת ב־≈: כתב יד לנינגרד במהדורת וסטמינסטר לברית הישנה, ולחדשה הנוסח המקובל, שהוא בדיוק היוונית שממנה התרחק תיקון זה.

