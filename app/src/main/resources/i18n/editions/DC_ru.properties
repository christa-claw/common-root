fact.2.label=Кем сделана
fact.2.value=Откровения и иные заявления, которые, по словам Джозефа Смита младшего (1805–1844), он получил как прямые послания от Бога; небольшое число более поздних фрагментов, прежде всего два Официальных заявления, принадлежат его преемникам на посту президента церкви
fact.3.label=Издана
fact.3.value=1835, Киртланд, штат Огайо, в дополнение к незаконченной Книге заповедей 1833 года; составлена и одобрена комитетом в составе Джозефа Смита, Оливера Каудери, Сидни Ригдона и Фредерика Г. Уильямса
fact.4.label=Структура
fact.4.value=138 нумерованных разделов и два Официальных заявления вместо книг, глав и стихов; в нашем собрании каждый раздел выступает главой внутри одной книги, «Учение и Заветы»
fact.5.label=Положение
fact.5.value=Одно из четырёх канонических писаний движения святых последних дней, наряду с Библией, [[BOM|Книгой Мормона]] и [[PGP|Драгоценной Жемчужиной]]
fact.6.label=В этом собрании
fact.6.value=Текст следует нынешней стандартной формулировке из JSON-экспорта общественного достояния Mormon Documentation Project — того же источника, что и для [[BOM|Книги Мормона]] и [[PGP|Драгоценной Жемчужины]]; его защищённые авторским правом подстрочные примечания и заголовки глав не включены — поэтому здесь не указан единый год издания
fact.7.label=Лицензия
fact.7.value=Общественное достояние, по заявлению ответственного за данные; современный защищённый авторским правом учебный аппарат не включён
