title=Учение и Заветы — Об этом издании | Common Root
description=Учение и Заветы: откровения и иные заявления, записанные Джозефом Смитом, впервые изданные в 1835 году в Киртланде, штат Огайо, и читаемые святыми последних дней как писание рядом с Библией.
heroHeading=Учение и Заветы
readerHref=/reader?c1.src=dc

hero.1=Учение и Заветы собирают откровения, видения и иные заявления, которые, по словам Джозефа Смита младшего, он получил как прямые послания от Бога, записанные главным образом в первые годы существования церкви в Огайо, Миссури и Нью-Йорке. Более раннее собрание под названием «Книга заповедей для управления Церковью Христа» печаталось в типографии церкви в Индепенденсе, штат Миссури, когда толпа разрушила типографию в июле 1833 года и разметала незаконченные листы прежде, чем книгу успели завершить; она так и не была официально издана, хотя небольшое число спасённых тогда непереплетённых листов сохранилось.
hero.2=В 1835 году последовало расширенное и переименованное издание «Учение и Заветы Церкви святых последних дней», опубликованное в Киртланде, штат Огайо, составленное и одобренное комитетом из четырёх человек: Джозефа Смита, Оливера Каудери, Сидни Ригдона и Фредерика Г. Уильямса. Это первое издание объединяло под одной обложкой два вида материала — серию богословских лекций, прочитанных в Киртландской школе и представленных как его «Учение», и сами записанные откровения, представленные как его «Заветы». Эти лекции, впоследствии известные как Lectures on Faith, позднее были исключены из книги — обычно это изменение датируют изданием 1921 года, — так что откровения стали составлять всё произведение.
hero.3=Книга организована в нумерованные разделы, а не в книги, главы и стихи, как Библия, — что отражает её природу: собрание отдельных текстов, а не единое непрерывное повествование. И содержание, и нумерация менялись на протяжении изданий XIX века, в том числе в издании 1876 года под руководством Орсона Пратта, которое реорганизовало более ранний материал и добавило новые откровения. Современное издание обрело свой нынешний вид в 1981 году, когда были добавлены ещё два фрагмента — видение о степенях славы и видение об искуплении умерших — как разделы 137 и 138, а также два «Официальных заявления»: манифест 1890 года, положивший конец одобрению церковью новых полигамных браков, и заявление 1978 года, распространившее посвящение в священство на всех достойных членов церкви мужского пола независимо от расы. Издание 2013 года обновило дополнительный справочный материал. Нынешнее стандартное издание включает 138 разделов и два Официальных заявления.
hero.4=Она входит в число четырёх произведений, которые движение святых последних дней называет своими каноническими писаниями, наряду с Библией, [[BOM|Книгой Мормона]] и [[PGP|Драгоценной Жемчужиной]]. Community of Christ — отдельная конфессия, также восходящая к этому движению, — хранит собственное Учение и Заветы, нумеруемое и обновляемое независимо от этого издания. Текст в этом собрании взят из JSON-экспорта Mormon Documentation Project, того же источника общественного достояния, что используется для [[BOM|Книги Мормона]] и [[PGP|Драгоценной Жемчужины]], и представлен здесь как одна книга, «Учение и Заветы», в которой каждый раздел выступает главой; он следует формулировкам нынешнего стандартного издания и не включает защищённые авторским правом подстрочные примечания и заголовки глав, поэтому здесь не указан единый год публикации.

