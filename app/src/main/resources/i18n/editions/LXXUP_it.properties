title=Septuaginta inglese di Brenton aggiornata — Informazioni su questa edizione | Common Root
description=La Septuaginta inglese di Sir Lancelot Brenton, del 1844 e del 1851, con l'ortografia e i nomi aggiornati da Adam Boyd nel 2020 — la stessa traduzione del Brenton originale che le sta accanto in questo corpus, con thou e thee lasciati dove Brenton li aveva messi.
heroHeading=Septuaginta inglese di Brenton aggiornata
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Questa è la traduzione inglese della Septuaginta, l'Antico Testamento greco, di Sir Lancelot Brenton, con l'inglese aggiornato. Brenton tradusse principalmente dal Codex Vaticanus; Samuel Bagster and Sons di Londra pubblicò la sua versione nel 1844 e la ripubblicò con gli apocrifi nel 1851. Nel 2020 Adam Boyd la rivide per eBible.org e cedette le sue modifiche al pubblico dominio. Non la ritradusse. La sua introduzione elenca che cosa cambiò: l'ortografia, portata all'inglese americano moderno, così che “shew” diventa “show”; i nomi di persone e di luoghi, nelle forme che il lettore inglese conosce; “begat” e “spake”, mutati in “begot” e “spoke”; trattini e segni di punteggiatura doppi, riordinati; e la poesia, impaginata come poesia. Ciò che conservò è altrettanto voluto: “thou”, “thee” e “ye” con le forme verbali che li accompagnano, la grammatica di Brenton e la sua pesante punteggiatura dell'Ottocento.
hero.2=La differenza si vede meglio accanto al Brenton originale, anch'esso in questo corpus. Brenton scriveva i nomi ebraici come li scrive il greco; l'aggiornamento dà per lo più la forma inglese. Dove il Neemia di Brenton si apre con “the words of Neemias the son of Chelcia”, questo ha “Nehemiah the son of Hacaliah”; Elias the Thesbite diventa Elijah the Tishbite, ed Emmanuel in Isaia 7,14 diventa Immanuel. Sotto l'ortografia la traduzione resta quella di Brenton, e quindi legge ancora dove legge il greco. “A virgin shall conceive” in Isaia 7,14 rende il greco parthenos; i Salmi mantengono la numerazione greca, così che il Salmo 22 è qui il salmo del pastore; e la terra di Genesi 1,2 è ancora “unsightly and unfurnished”. Restano anche i vecchi pronomi: “thou shalt call his name Immanuel”.
hero.3=In questo lettore sta fuori dai pioli di discendenza. Il corpus non le registra alcun genitore — né il greco che Brenton tradusse né il Brenton che essa rivede —, così che un piolo aperto sotto uno dei suoi versetti cade dritto sul pavimento delle lingue originali contrassegnato con ≈, che per l'Antico Testamento è il Codice di Leningrado: un testo ebraico, non il greco da cui questa traduzione fu fatta. Per scendere dall'inglese di Brenton al suo greco, aprite il Brenton originale, il cui genitore registrato è la Septuaginta. Nulla poggia a sua volta su questa edizione, e nessuna lingua dell'interfaccia si apre su di essa; un'interfaccia inglese si apre sulla New International Version. La nostra copia è più stretta del libro. Ha 36 libri. Esdra e Neemia sono un unico libro di 23 capitoli, come nel greco, con Neemia che comincia al capitolo 11. I file di eBible.org da cui proviene contengono anche gli apocrifi e danno Ester e Daniele solo nelle loro forme greche più lunghe; nulla di ciò è stato incluso, così qui non ci sono né Ester né Daniele, e nemmeno Tobia o la Sapienza.

