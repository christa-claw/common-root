fact.1.label=Lingua
fact.1.value=Inglese
fact.2.label=Traduttore
fact.2.value=Sir Lancelot Charles Lee Brenton (1807–1862), secondo baronetto
fact.3.label=Riveduta da
fact.3.value=Robert Adam Boyd, 2020 — ortografia, nomi, trattini, punteggiatura e impaginazione della poesia; la traduzione in sé lasciata come Brenton la fece
fact.4.label=Revisione di
fact.4.value=[[LXXE|La Septuaginta inglese di Brenton]] — Londra, Samuel Bagster and Sons, 1844; con gli apocrifi, 1851
fact.5.label=Tradotta da
fact.5.value=[[LXX|La Septuaginta greca]], principalmente nel testo del Codex Vaticanus
fact.6.label=Salmi
fact.6.value=Nella numerazione greca, 151 in tutto — il Salmo 22 è il salmo del pastore, che nella [[KJV|King James Version]] è il Salmo 23
fact.7.label=Licenza
fact.7.value=Pubblico dominio; le modifiche di Boyd cedute a esso con CC0; questa copia da eBible.org
fact.8.label=In questo corpus
fact.8.value=36 libri, solo Antico Testamento; Esdra e Neemia come un solo libro, niente Ester, niente Daniele e nessuno degli apocrifi — i file di origine li contengono, ma non sono stati inclusi
fact.9.label=Discendenza
fact.9.value=Nessun genitore registrato — un piolo si apre dritto sul pavimento delle lingue originali, [[WLC|il Codice di Leningrado]], e non sul [[LXX|greco]] a cui scende [[LXXE|il Brenton originale]]
