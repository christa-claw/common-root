title=Nueva Biblia de las Américas — Acerca de esta edición | Common Root
description=La Nueva Biblia de las Américas: la revisión al español latinoamericano que The Lockman Foundation hizo de su propia La Biblia de las Américas, llevando el mismo método palabra por palabra al español cotidiano que se habla en toda América.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=La Nueva Biblia de las Américas es la edición en español latinoamericano de The Lockman Foundation, construida sobre su anterior La Biblia de las Américas de 1986 — fruto, a su vez, de unos quince años de trabajo de veintidós traductores y consultores, con la misma filosofía de traducción palabra por palabra que después se trasladó al inglés como la New American Standard Bible. En lugar de una traducción nueva del hebreo y el griego, la NBLA es una revisión de registro: un comité de doce miembros de Lockman reelaboró el español, de tendencia más castellana, de La Biblia de las Américas en el español familiar y moderno que se habla en toda Latinoamérica, sustituyendo formas como el "vosotros" por el más extendido "ustedes" y aligerando construcciones, como el "y" formulario y el "sucedió que", que el texto anterior había conservado literalmente del estilo narrativo hebreo. El propio aviso de permiso para citar de The Lockman Foundation fecha el texto terminado en 2005.
hero.2=La base textual se deriva directamente de La Biblia de las Américas: el Antiguo Testamento se apoya en la Biblia Hebraica de Rudolf Kittel, con los Rollos del Mar Muerto consultados, y el Nuevo Testamento, en general, en la 27.ª edición del Novum Testamentum Graece de Eberhard Nestle, prestando atención a evidencia manuscrita adicional donde incide en una lectura concreta. Algunas librerías y catálogos de software bíblico agrupan hoy la Nueva Biblia de las Américas junto con la revisión de 2020 de la New American Standard Bible de la Fundación, comercializando ambas como un par a juego para lectores de inglés y de español de la misma tradición literal; la traducción en sí, sin embargo, no lleva en los propios avisos de la Fundación una fecha de copyright posterior a 2005.
hero.3=La interfaz en español se abre aquí de forma predeterminada en la Reina Valera 1909, un texto de dominio público de una tradición de traducción totalmente distinta y un siglo más antiguo; la Nueva Biblia de las Américas se alcanza en cambio desde su propia tarjeta en la cuadrícula de traducciones. Comparte poca historia textual con esa edición, pero mucho con la New American Standard Bible — la misma fundación, el mismo método de equivalencia formal y el mismo estatus de licenciada, no de dominio público, que permite citar hasta 500 versículos sin permiso escrito, siempre que no formen un libro completo ni más de un cuarto de la obra que cita. No se registra ningún padre en los peldaños de linaje: La Biblia de las Américas, el texto que revisa, no se tiene en este corpus, de modo que un peldaño bajo un versículo de la NBLA va directamente al suelo de la lengua original, marcado con ≈.

fact.1.label=Lengua
fact.1.value=Español
fact.2.label=Encargada
fact.2.value=The Lockman Foundation, de La Habra, California — la misma organización sin fines de lucro detrás de la New American Standard Bible y de su propia predecesora, La Biblia de las Américas (1986)
fact.3.label=Hecha por
fact.3.value=Un comité de revisión de doce miembros de Lockman que trabajó a partir de la traducción de La Biblia de las Américas, obra a su vez de veintidós traductores y consultores durante unos quince años
fact.4.label=Antiguo Testamento de
fact.4.value=La Biblia Hebraica de Rudolf Kittel, con los Rollos del Mar Muerto consultados, heredada de la propia base textual de La Biblia de las Américas
fact.5.label=Nuevo Testamento de
fact.5.value=El Novum Testamentum Graece de Eberhard Nestle, en general la 27.ª edición, con atención a evidencia manuscrita adicional cuando incide en una lectura
fact.6.label=Clase de traducción
fact.6.value=Equivalencia formal, el mismo método palabra por palabra que La Biblia de las Américas y la New American Standard Bible — no una traducción nueva, sino una revisión de registro al español familiar y moderno que se habla en toda Latinoamérica, sustituyendo formas castellanas como "vosotros" por "ustedes" y reelaborando construcciones como el "y" formulario y el "sucedió que" que el texto anterior conservaba literalmente del hebreo
fact.7.label=Publicada
fact.7.value=Protegida por derechos de autor en 2005 por The Lockman Foundation; algunos catálogos la agrupan desde entonces junto con la revisión de 2020 de la New American Standard Bible de la Fundación, aunque 2005 sigue siendo el año que figura en su propio aviso de copyright
fact.8.label=Licencia
fact.8.value=Licenciada, no de dominio público. Se pueden citar hasta 500 versículos en cualquier forma sin permiso escrito, siempre que no formen un libro completo de la Biblia ni más de un cuarto de la obra que cita, con un aviso de copyright que mencione 2005; cualquier uso mayor requiere el permiso de The Lockman Foundation
fact.9.label=En este corpus
fact.9.value=Licenciada y no de dominio público, como [[NASB|la New American Standard Bible]] de la misma fundación. La interfaz en español se abre de forma predeterminada en [[RVR09|la Reina Valera 1909]], un texto de dominio público de una tradición no relacionada y un siglo más antiguo, y esta edición se alcanza desde su propia tarjeta. No se registra ningún padre en los peldaños de linaje: es una revisión de registro de La Biblia de las Américas, que no se tiene en este corpus, de modo que un peldaño bajo un versículo de la NBLA va directamente al suelo de la lengua original, marcado con ≈.
