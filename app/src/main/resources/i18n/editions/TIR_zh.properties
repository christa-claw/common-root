title=提尔米济圣训实录 — 关于此版本 | Common Root
description=提尔米济圣训实录：艾布·伊萨·提尔米济编纂的圣训集，公开评定每条传述的强弱并记录法学家据以推演的教法论证——列于逊尼派六大圣训集之中。
heroHeading=提尔米济圣训实录
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=艾布·伊萨·穆罕默德·伊本·伊萨·提尔米济大约于希吉拉历209年（公元824年）生于特尔梅兹附近，呼罗珊境内，今乌兹别克斯坦与阿富汗边境地带。他约二十岁时开始求学圣训，自希吉拉历235年起游历呼罗珊、伊拉克和希贾兹以求之，主要师从布哈里——他的主要导师——以及穆斯林·伊本·哈贾吉、艾布·达乌德·西吉斯坦尼、古泰拔·伊本·赛义德和阿里·伊本·胡吉尔。晚年双目失明，其别号"达利尔"（意为"盲者"）即由此而来。他返回特尔梅兹地区，于希吉拉历279年拉贾布月十三日（公元892年10月9日）去世，享年约七十岁。
hero.2=他的全名《简编圣训集：辑自使者的训谕并辨其真伪与通行者》（al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal），通常简称为《提尔米济圣训集》或《提尔米济圣训实录》。布哈里圣训实录和穆斯林圣训实录只采纳其编纂者判定为完全可靠的圣训，而提尔米济则在正文之中公开评定每条圣训的等级——正传（赛哈）、良传（哈桑）、弱传（达伊夫）或孤传（加里卜）——并说明较弱评级的理由，而不是略去该条圣训；他还指明各教法学派（麦兹海布）分歧所在及各方所依凭的证据，这使该书既是一部圣训集，也是一部以圣训为据进行教法推理的指南。
hero.3=逊尼派传统将其列入六大圣训集，通常次于布哈里圣训实录、穆斯林圣训实录和艾布·达乌德圣训集；至于它在其余各部之间的确切排序——以及哪一部占据第六位，伊本·马哲圣训实录是常见但并非历史上唯一提出的答案——学界长期争论而未有定论，本语料库所收的其他圣训实录也是如此。该书所载的圣训数量因同样的原因而说法不一：按传统计数约为4,330则，另有记载约为4,400则；其结构也有不同描述——或称46卷，或称艾哈迈德·穆罕默德·沙基尔开罗版的49章，或称五十章。本语料库自身的数字则是另一个数字：49卷、3,998则编号圣训，这只是其所据数字版本本身的形态，并非声称复现任何特定的印本传统。
hero.4=这里的阿拉伯语文本是公有领域的古典正文（matn）。在阅读器中，其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-tirmidhi版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在布哈里圣训实录、穆斯林圣训实录、艾布·达乌德圣训集及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

