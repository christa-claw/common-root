fact.2.value=艾布·伊萨·穆罕默德·伊本·伊萨·提尔米济（希吉拉历209–279年 / 公元824–892年）
fact.3.label=名称
fact.3.value=通称《提尔米济圣训集》或《提尔米济圣训实录》；全名《简编圣训集：辑自使者的训谕并辨其真伪与通行者》
fact.4.label=编纂地点与时间
fact.4.value=于游历呼罗珊、伊拉克和希贾兹期间收集，始于希吉拉历235年左右；提尔米济于希吉拉历279年（公元892年）卒于特尔梅兹附近
fact.5.label=方法
fact.5.value=在正文中公开将每条圣训评为正传、良传、弱传或孤传，并说明较弱评级的理由，又指明各教法学派分歧所在及各方所凭证据——而不像[[BUK|布哈里圣训实录]]和[[MUS|穆斯林圣训实录]]那样只采纳判定为完全可靠的圣训
fact.6.label=地位
fact.6.value=列于逊尼派六大圣训集（库图布·西塔）之中，通常次于[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]和[[ABD|艾布·达乌德圣训集]]；它在其余诸部中的确切排序，以及哪一部占据第六位，仍存争议，未有定论
fact.7.label=圣训数量
fact.7.value=按传统计数约为4,330则，另有记载约为4,400则；其结构同样有不同描述——或称46卷，或称艾哈迈德·穆罕默德·沙基尔开罗版的49章，或称五十章
fact.8.label=在本语料库中
fact.8.value=49卷、3,998则编号圣训——仅为源数据本身的形态，并非复现任何特定的印本传统
