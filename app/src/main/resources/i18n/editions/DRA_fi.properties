title=Douay-Rheims 1899 — Tietoja tästä laitoksesta | Common Root
description=Douay-Rheims-Raamattu: englanninkielinen katolinen käännös, joka tehtiin latinalaisesta Vulgatasta Reimsissä 1582 ja Douaissa 1609–10, piispa Challonerin tarkistamana, vuoden 1899 Baltimoren painoksena.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=Vuonna 1568 joukko englantilaisia katolisia, monet heistä Oxfordin miehiä, jotka eivät enää voineet pitää virkojaan, perusti Douaihin Flanderiin kollegion William Allenin johdolla. Osa sen olemassaolon tarkoitusta oli saada englanninkielinen Raamattu katolisiin käsiin, sillä ainoat silloin liikkeellä olleet englanninkieliset Raamatut olivat protestanttisia ja niitä käytettiin väittelyssä. Gregory Martin aloitti kääntämisen lokakuussa 1578 noin kahden luvun päivävauhdilla, ja Uusi testamentti julkaistiin 1582 Reimsissä, jonne kollegio oli väliaikaisesti siirtynyt. Martin kuoli saman vuoden lokakuun 28. päivänä, viikkoja Uuden testamenttinsa ilmestymisen jälkeen. Vanha testamentti oli valmis samaan aikaan ja jäi sitten painamatta siitä yksinkertaisesta syystä, ettei kollegiolla ollut varaa painaa sitä; se ilmestyi vihdoin kahtena niteenä 1609 ja 1610, jolloin Kuningas Jaakon käännökseen oli kaksi vuotta.
hero.2=Se, mikä erottaa sen jokaisesta muusta tämän aineiston englanninkielisestä Raamatusta, on se, mistä se tehtiin. Ei hepreasta ja kreikasta: latinalaisesta Vulgatasta. Trenton kirkolliskokous oli julistanut Vulgatan kirkon autenttiseksi tekstiksi, ja Douain kääntäjät esittivät lisäksi, että Hieronymus oli työskennellyt käsikirjoituksista, jotka olivat vanhempia kuin yksikään heidän saatavillaan ollut kreikkalainen jäljennös — mikä Vanhan testamentin osalta ei ollut vuonna 1600 kohtuuton ajatus. Syntynyt proosa on raskaan latinalaista, toisinaan siihen asti ettei se ole englantia lainkaan: Isä meidän -rukous pyytää “supersubstantial bread”, koska kääntäjät eivät halunneet kotouttaa sanaa, jonka varassa teologia lepäsi. Se oli linjaus, ei kyvyttömyyttä.
hero.3=Kahdeksannentoista vuosisadan puoliväliin mennessä sitä ei enää juuri kukaan osannut lukea, ja piispa Richard Challoner tarkisti sen vuosina 1749–1752 — perusteellisesti ja suurelta osin Kuningas Jaakon käännöksen suuntaan, joka siihen mennessä oli yksinkertaisesti se, miltä englanninkielinen pyhä kirjoitus kuulosti. Jokainen tänään Douay-Rheimsinä myytävä Raamattu on Challonerin tekstiä eikä Martinin. Tämä on vuoden 1899 amerikkalainen painos, Baltimoren John Murphy Companyn tekemä, ja siinä on kardinaali James Gibbonsin imprimatur; koska tuo painos on aikaa sitten vapautunut tekijänoikeudesta, juuri sitä on skannattu, näppäilty ja jäljennetty siitä lähtien, ja se on se, mitä lähes jokainen digitaalinen Douay-Rheims todellisuudessa on.
hero.4=Tässä lukuohjelmassa se tekee jotakin, mihin lähes mikään muu täkäläinen laitos ei pysty. Sen kirjattu kantateksti on aineistossa: avaa polveutumisaskelma Douay-Rheimsin jakeen alta, ja alempi askelma on latinalainen Vulgata itse, se teksti josta se todella käännettiin, eikä se ≈-merkitty alkukielten pohja, johon useimmat laitokset putoavat. Juuri tätä tapausta varten askelmamekanismi rakennettiin. Vaikutus kulki myös toiseen suuntaan — Reimsin Uusi testamentti oli Kuningas Jaakon kääntäjien pöydillä, ja melkoinen osa sen latinalaisesta sanastosta siirtyi heidän työhönsä — mutta polveutumisluettelo pitää kirjaa vain muodollisista tarkistuslinjoista, joten sitä velkaa ei ole siihen merkitty. Yksi käänteisyys on syytä panna merkille: sen askelmamerkinnässä lukee vuosi 1899, kun taas luettelokortissa ei lue vuotta lainkaan. Askelmavuodet ovat käsin koottu luettelo ja kortti lukee luettelon omaa metatietoa, ja kun laitos on toisessa muttei toisessa, nuo kaksi ovat julkisesti eri mieltä.
hero.5=Varoitus kaanonista. Täällä oleva teksti sisältää 72 kirjaa, ei painetun katolisen Raamatun 73:a. Ne kuusi deuterokanonista kirjaa, jotka siinä ovat — Tobit, Judit, 1. ja 2. Makkabilaiskirja, Viisauden kirja ja Sirak — ovat Ilmestyskirjan jäljessä eivätkä katolisilla paikoillaan, ja Baruk puuttuu kokonaan. Tämä on digitaalisen tekstin ominaisuus siinä muodossa kuin se tuotiin, ei vuoden 1899 kirjan, ja se tarkoittaa, että tämä palsta lukee jae jakeelta oikein mutta sitä ei pidä käyttää sen tarkistamiseen, mitä katolinen kaanon sisältää.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=englanti — katolinen perinne
fact.2.label=Käännetty
fact.2.value=latinalaisesta Vulgatasta, ei hepreasta ja kreikasta — samasta [[VUL|Vulgatasta]], joka on tässä aineistossa
fact.3.label=Uusi testamentti
fact.3.value=Reims, 1582 — pääosin Gregory Martinin työtä, mukana William Allen, Richard Bristow ja Thomas Worthington
fact.4.label=Vanha testamentti
fact.4.value=Douai, 1609 ja 1610, kahtena niteenä — valmis samaan aikaan kuin Uusi testamentti mutta pidätettynä lähes kolmekymmentä vuotta, koska painamiseen ei ollut varaa
fact.5.label=Tarkisti
fact.5.value=piispa Richard Challoner, 1749–1752 — jokainen tänään Douay-Rheimsinä myytävä kirja on Challonerin tarkistus, ei vuosien 1582/1610 teksti
fact.6.label=Tämä painos
fact.6.value=vuoden 1899 amerikkalainen laitos, Baltimoren John Murphy Company, kardinaali James Gibbonsin imprimaturilla — aikaa sitten tekijänoikeudesta vapaa, ja se laitos joka liikkuu digitaalisesti
fact.7.label=Sisältö täällä
fact.7.value=72 kirjaa: protestanttisen kaanonin 66 protestanttisessa järjestyksessä, ja Tobit, Judit, 1. ja 2. Makkabilaiskirja, Viisauden kirja ja Sirak Ilmestyskirjan perässä. Baruk puuttuu, joten tämä palsta ei ole luotettava tarkistus katolisesta kaanonista
fact.8.label=Polveutuminen
fact.8.value=yksi harvoista täkäläisistä laitoksista, joiden kirjattu kantateksti on itse aineistossa — askelma Douay-Rheimsin jakeen alla avautuu [[VUL|latinalaiseen Vulgataan]] eikä alkukielten pohjaan
fact.9.label=Tässä aineistossa
fact.9.value=sen askelmamerkintä kantaa vuotta 1899, vaikka luettelokortti jättää vuoden tyhjäksi; askelmavuodet ovat erillinen käsin koottu luettelo, ja näiden kahden on lupa olla eri mieltä
