title=كتاب جنيف المقدس 1599 — عن هذه الطبعة | Common Root
description=كتاب جنيف المقدس: صنعه بروتستانت إنجليز في المنفى بجنيف، وهو أول كتاب مقدس إنجليزي بترقيم كامل للأعداد وحواشٍ على الهامش، قرأه جيل شكسبير، وهو الدرجة التي تحت ترجمة الملك جيمس.
heroHeading=كتاب جنيف المقدس 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=صُنع هذا الكتاب في الخارج، على يد أناس لم يكن بوسعهم البقاء في بلادهم بأمان. فلما اعتلت ماري الأولى العرش سنة 1553 وعادت إنجلترا إلى روما، غادر بضع مئات من البروتستانت؛ واستقر بعضهم في جنيف كالفن، حيث المطابع، وعلم العبرية واليونانية، ولا أسقف يُسأل أمامه. نشر ويليام ويتنغهام هناك عهدًا جديدًا سنة 1557. وعمل فريق بقيادة أنتوني غيلبي على العهد القديم، فطُبع الكتاب كاملًا في جنيف على يد رولاند هول سنة 1560، بعد وفاة ماري بعامين، وقد كان معظم المنفيين قد عادوا إلى ديارهم.
hero.2=غيّر ما أنجزوه هيئة الكتاب المقدس الإنجليزي. فقد كان أول كتاب يرقّم كل عدد، حتى صار في الإمكان أن يُحال القارئ إلى سطر لا إلى أصحاح. ورُكن بالحرف الروماني لا بالحرف القوطي، وصدر صغيرًا رخيصًا بما يكفي ليُقتنى لا ليُقيَّد بسلسلة إلى منبر القراءة. وكانت الهوامش مملوءة: إحالات، وشروح للكلمات العسيرة، وخرائط، وحواشٍ تفسّر معنى المقطع. وهذا الأخير هو سبب حبّه وسبب التبرّم منه معًا. فالحواشي إصلاحية، وحادّة في مواضع، وهي تقول للقارئ ما ينبغي أن يظنّه في الملوك بمثل ما تقوله له في العقيدة.
hero.3=وتاريخ هذه الطبعة يحتاج إلى تحفّظ، فكتاب جنيف لم يكن كتابًا واحدًا بل نصًّا أُعيدت طباعته ثمانين سنة وأجزاؤه تتبدّل. ففي 1576 استبدل لورنس تومسون بالعهد الجديد مراجعته هو، المصنوعة على طبعة تيودور بيزا اليونانية لسنة 1565، ومنذ 1587 صار ذلك هو العهد الجديد الذي تحمله أكثر نسخ جنيف. وفي 1599 أُضيفت حواشي فرانسيسكوس يونيوس على سفر الرؤيا. فـ“1599” إذًا تسمّي تركيبةً — عهد تومسون الجديد مع يونيوس على الرؤيا — أدقّ ممّا تسمّي سنة طبع، وقد ظلّت تُطبع نسخ تحمل ذلك التاريخ بعده. ولهذا تترك بطاقة الفهرس السنة فارغة بينما تقرأ شارة الدرجة، التي تحتاج إلى شيء قصير تعرضه، GNV 1599.
hero.4=وموضعه في هذه المجموعة مفصل. فأطول سلسلة نسب هنا تمتد من World English Bible إلى American Standard Version إلى Revised Version إلى ترجمة الملك جيمس، ثم إلى هذا: افتح درجة أخرى تحت آية من ترجمة الملك جيمس فتظهر تحتها صيغة جنيف، وهي أوضح طريقة لرؤية كم في ترجمة الملك جيمس من موروث لا من مؤلَّف. وتحت جنيف لا شيء آخر بالإنجليزية — بل اليونانية والعبرية فحسب، Textus Receptus ومخطوط لينينغراد ويستمنستر، حيث يبلغ السلّم قاعه. ويُعطى النص كما تحمله الطبعة، بهجائه كله، فتكوين 1:1 يقول heauen؛ وعناوين المزامير وخاتمة الرسالة إلى العبرانيين تجري داخل مطلع العدد الأول، كما رتّبتها تلك الطبعات، وقد تُركت هناك دون تنقية.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الإنجليزية — إنجليزية العصر الإليزابيثي، بهجائها الأصلي
fact.2.label=من صنعه
fact.2.value=بروتستانت إنجليز فرّوا من حكم ماري الأولى واستقروا في جنيف — أنجز ويليام ويتنغهام العهد الجديد سنة 1557، وأنجز فريق بقيادة أنتوني غيلبي العهد القديم
fact.3.label=أول طبعة كاملة
fact.3.value=1560، طُبعت في جنيف على يد رولاند هول
fact.4.label=العهد القديم عن
fact.4.value=العبرية الماسورية — [[WLC|مخطوط لينينغراد ويستمنستر]] هو شاهد هذه المجموعة على ذلك النص
fact.5.label=العهد الجديد عن
fact.5.value=يونانية خط [[TR|النص المتلقّى]]؛ ومنذ 1576 حلّت مراجعة لورنس تومسون، المصنوعة على طبعة بيزا اليونانية لسنة 1565، محلّ عهد ويتنغهام الجديد في معظم الطبعات
fact.6.label=ما تسمّيه “1599”
fact.6.value=الطبعات التي تحمل عهد تومسون الجديد مع حواشي فرانسيسكوس يونيوس على سفر الرؤيا، وقد دخلت كتاب جنيف في تلك السنة
fact.7.label=أوائل
fact.7.value=أول كتاب مقدس إنجليزي بترقيم كامل للأعداد، مركون بالحرف الروماني لا بالقوطي، ومزوّد بجهاز كامل من الحواشي الهامشية — كتاب دراسة قبل أن يوجد المصطلح
fact.8.label=اعترض عليه
fact.8.value=جيمس الأول، الذي رأى في الحواشي الهامشية تحريضًا — شكوى أسهمت في تحريك [[KJV|ترجمة الملك جيمس]]
fact.9.label=السنة في الفهرس
fact.9.value=فارغة في بطاقة «عن»، مع أنّ شارة الدرجة تقرأ GNV 1599 — أُعيدت طباعة كتاب جنيف من 1560 إلى عقد 1640، وعهده الجديد وحواشيه تتبدّل تحت الاسم نفسه
fact.10.label=في هذه المجموعة
fact.10.value=الكتب الـ66 كاملة، بلا أبوكريفا، والهجاء غير محدَّث — تكوين 1:1 يقرأ “the heauen and the earth”
fact.11.label=تحت درجة
fact.11.value=[[TR|النص المتلقّى]] و[[WLC|مخطوط لينينغراد ويستمنستر]]؛ وكتاب جنيف نفسه هو الدرجة الأولى تحت [[KJV|ترجمة الملك جيمس]]
