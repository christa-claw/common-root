title=سميث وفان دايك — عن هذه الطبعة | Common Root
description=الكتاب المقدس العربي لسميث وفان دايك: بدأه عالي سميث في بيروت وأتمّه كرنيليوس فان دايك سنة 1865 بمعاونة أعلام النهضة بطرس البستاني وناصيف اليازجي ويوسف الأسير، وهو إلى اليوم أوسع الترجمات العربية انتشاراً.
heroHeading=سميث وفان دايك
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=بدأت الإرسالية الأمريكية في بيروت هذه الترجمة نحو سنة 1847، ولم يُتمّها مَن بدأها. كان عالي سميث قد أمضى عقدين في بلاد الشام، وبلغ من العربية ما يكفي لأن يُجادل فيها؛ وظلّ يشتغل بالنصّ حتى وفاته سنة 1857. فتناولها كرنيليوس فان آلن فان دايك ومضى بها إلى غايتها: تمّ العهد الجديد سنة 1860، والعهد القديم بعده بخمس سنين، سنة 1865. والاسمان على الكتاب نصفا عملٍ واحد.
hero.2=والأسماء التي ليست على الكعب لا تقلّ وزناً. فقد تعلّم فان دايك عربيّته على بطرس البستاني وناصيف اليازجي، وعمل الرجلان معه في الترجمة، وعمل معه كذلك الشيخ يوسف الأسير، الذي راجع العربية أسلوباً وجَرْياً على السَّنن. ولم يكن هؤلاء الثلاثة أعواناً لمشروع تبشيري، بل كانوا من أعلام النهضة الأدبية العربية، وما خرج يُقرأ نثراً عربياً لا ترجمةً متلبّسةً بالعربية. ولهذا بقي الكتاب بعد أن زالت الإرسالية التي أنفقت عليه.
hero.3=وكان الأمر مأثرةً في الطباعة كما كان مأثرةً في العلم. فقد صفّته المطبعة الأمريكية في بيروت بحرفٍ عربي قُطع للإرسالية وفرغوا منه سنة 1843، وهو الخطّ الذي ما زال يُعرف بالأمريكاني، وكان لسميث يد في تسويته. والعربية عسيرة الصفّ على وجهها — تتّصل الحروف وتتبدّل صورها باتّصالها — وكتابٌ مقدّس يبدو على الصفحة كما ينبغي قد صنع لقَبوله أكثر ممّا تصنعه الحجّة. وقد خرجت منه منذ ذلك الحين ملايين النسخ، إلى قرّاء من البروتستانت والأقباط سواء، وعند أكثر المسيحيين العرب هكذا يكون صوت الكتاب المقدس ببساطة.
hero.4=وهو في هذا القارئ الكتابُ المقدس العربي الوحيد، وبذلك يتقرّر سلوكه. فإذا ضُبطت الواجهة على العربية فهو ما يُفتح — لا لأنه اختير، كما اختيرت رينا-باليرا 1909 للإسبانية، بل لأن الفهرس يطلب كتاباً مقدساً بلغة الواجهة فلا يجد إلا واحداً. وهو أيضاً واحد من طبعتين اثنتين لا غير هنا يجري نصّهما من اليمين إلى اليسار، والأخرى هي الكتاب المقدس العبري الحديث. ولا أصل مسجّل له في درجات النسب، فالدرجة المفتوحة تحت آية تهبط رأساً إلى أرضية اللغات الأصلية المعلَّمة بـ ≈ — وهذا هنا أقرب إلى الصواب من المعتاد، لأن اليونانية التي تقدّمها تلك الأرضية هي النصّ المتلقَّى، ومن النصّ المتلقَّى صُنع عهده الجديد.

