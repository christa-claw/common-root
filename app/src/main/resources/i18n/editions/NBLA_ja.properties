title=Nueva Biblia de las Américas — この版について | Common Root
description=Nueva Biblia de las Américas:The Lockman Foundationが自らの La Biblia de las Américas を改訂したラテンアメリカ・スペイン語版で、同じ逐語訳の方法をアメリカ大陸全域で話される日常スペイン語にもたらす。
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas は、The Lockman Foundation によるラテンアメリカ・スペイン語版であり、同財団が1986年に先に刊行した La Biblia de las Américas——二十二人の翻訳者と顧問が約十五年をかけて作り上げた、後に英語で New American Standard Bible として伝えられた同じ逐語訳の理念に基づく訳——を基盤としている。ヘブライ語・ギリシア語からの新訳ではなく、NBLA はレジスター(文体層)の改訂である。十二人からなる Lockman の委員会が、La Biblia de las Américas のより古風なカスティーリャ風スペイン語を、ラテンアメリカ全域で話される親しみやすい現代スペイン語に書き改め、二人称複数形の「vosotros」をより広く使われる「ustedes」に置き換え、前の版がヘブライ語の物語文体から直訳的に引き継いでいた定型的な「y」や「sucedió que」のような構文を和らげた。The Lockman Foundation 自身の引用許可に関する通知は、完成した本文を2005年としている。
hero.2=本文の底本は La Biblia de las Américas から直接引き継がれている。旧約はルドルフ・キッテルの Biblia Hebraica に基づき、死海文書も参照されている。新約は一般にエーバーハルト・ネストレの Novum Testamentum Graece 第27版に基づき、特定の読みに影響する箇所では追加の写本的証拠にも注意が払われている。一部の書店や聖書ソフトウェアのカタログは、現在 Nueva Biblia de las Américas を同財団の2020年版 New American Standard Bible 改訂と組み合わせ、同じ直訳主義の伝統に立つ英語・スペイン語読者向けの対になった組として売り出している。しかし訳そのものは、財団自身の表示において2005年より後の著作権年を持たない。
hero.3=ここでのスペイン語インターフェースは既定で Reina Valera 1909 を開く——まったく異なる翻訳の伝統に属し、一世紀古い、パブリックドメインの本文である。Nueva Biblia de las Américas にはそれとは別に、翻訳の格子にある自分自身のカードから到達する。本版とはほとんど本文の歴史を共有しないが、New American Standard Bible とは多くを共有する——同じ財団、同じ形式対応の方法、そして同じ、パブリックドメインではなくライセンスされた地位であり、完全な一書を構成せず、引用する著作の四分の一を超えない限り、書面の許可なく500節まで引用することを認めている。系譜の段には親となる訳が記録されていない。NBLA が改訂する本文である La Biblia de las Américas 自体はこのコーパスに収められていないため、NBLA のある節の下の段は、≈で示された原語の底へと直接下る。

fact.1.label=言語
fact.1.value=スペイン語
fact.2.label=委嘱
fact.2.value=カリフォルニア州ラ・ハブラの The Lockman Foundation——New American Standard Bible、および同財団自身の前身である La Biblia de las Américas(1986年)を後ろ盾とする同じ非営利団体
fact.3.label=制作者
fact.3.value=La Biblia de las Américas の訳文を基に作業した、十二人からなる Lockman の改訂委員会。同訳自体は、二十二人の翻訳者と顧問による約十五年にわたる仕事である
fact.4.label=旧約の底本
fact.4.value=ルドルフ・キッテルの Biblia Hebraica。死海文書も参照され、La Biblia de las Américas 自身の底本からそのまま引き継がれている
fact.5.label=新約の底本
fact.5.value=エーバーハルト・ネストレの Novum Testamentum Graece、一般に第27版。特定の読みに影響する箇所では追加の写本的証拠にも注意が払われている
fact.6.label=翻訳の方針
fact.6.value=形式対応。La Biblia de las Américas および New American Standard Bible と同じ逐語訳の方法——新訳ではなく、ラテンアメリカ全域で話される親しみやすい現代スペイン語へのレジスター改訂であり、「vosotros」のようなカスティーリャ風の形を「ustedes」に置き換え、前の版がヘブライ語から直訳的に引き継いでいた定型的な「y」や「sucedió que」のような構文を書き改めている
fact.7.label=出版
fact.7.value=2005年に The Lockman Foundation により著作権登録。以後一部のカタログは同財団の2020年版 New American Standard Bible 改訂と組み合わせているが、2005年が自身の著作権表示に記された年のままである
fact.8.label=ライセンス
fact.8.value=ライセンスされており、パブリックドメインではない。完全な聖書の一書を構成せず、引用する著作の四分の一を超えない限り、2005年を記した著作権表示とともに、書面の許可なくいかなる形でも500節まで引用できる。それを超える利用には The Lockman Foundation の許可が必要である
fact.9.label=このコーパスでは
fact.9.value=同じ財団の[[NASB|New American Standard Bible]]と同様、パブリックドメインではなくライセンスされている。スペイン語インターフェースは既定で、無関係の伝統に属し一世紀古いパブリックドメインの本文である[[RVR09|Reina Valera 1909]]を開くが、本版には自分自身のカードから到達する。系譜の段には親となる訳が記録されていない。本版は La Biblia de las Américas のレジスター改訂であり、同訳自体はこのコーパスに収められていないため、NBLA のある節の下の段は、≈で示された原語の底へと直接下る。
