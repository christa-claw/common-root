title=Sunan an-Nasa'i — Tietoja tästä laitoksesta | Common Root
description=Sunan an-Nasa'i: hadith-kokoelma, jonka Ahmad ibn Shu'ayb al-Nasa'i tiivisti laajemmasta teoksestaan Sunan al-Kubrasta ja jonka Ibn Hajar erotti sillä, että siinä on vähiten heikkoja hadetheja kaikista Kuudesta kirjasta kahden Sahihin jälkeen.
heroHeading=Sunan an-Nasa'i
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali al-Nasa'i syntyi noin vuonna 214–215 AH (829–830 jaa.) Nasassa, Khurasanin kaupungissa, joka sijaitsee nykyisin Turkmenistanissa. Hän alkoi matkustaa hadith-kertomuksia etsien noin viidentoista vuoden iässä, opiskellen ensin Qutaybah ibn Sa'idin johdolla — jonka luona hän viipyi Baghlanissa yli vuoden — ja jatkaen sitten Irakin, Hidjazin, Syyrian ja Egyptin halki, missä hän opiskeli oppineiden, kuten Ishaq ibn Rahwayhin ja Abu Dawud al-Sijistanin, [[ABD|Sunan Abi Dawudin]] kokoajan, johdolla. Hän asettui Egyptiin, opetti siellä ja tuli tunnetuksi nimellä Hafiz al-Hadith; myöhemmät elämäkertojen kirjoittajat ovat eri mieltä siitä, opiskeliko hän koskaan suoraan Muhammad al-Bukharin johdolla, sillä al-Mizzi väitti, etteivät kaksi miestä koskaan tavanneet. Matkustaessaan Kairosta Mekkaa kohti elämänsä loppuvaiheessa hän pysähtyi Damaskokseen, jossa — perinteisen kertomuksen mukaan — hänen pitämänsä puhe profeetan kumppanien ansioista yllytti vihamielisen väkijoukon kaupungin ali-vastaisen tunnelman keskellä; hän kuoli pian sen jälkeen, vuonna 303 AH (915 jaa.), siellä saamiinsa vammoihin. Kertomukset eroavat siitä, mihin hänet haudattiin — toisen perinteen mukaan Safan ja Marwan välille Mekassa, toisen mukaan Ramlaan Palestiinassa.
hero.2=Hänelle luetuista noin viidestätoista teoksesta kuusi käsittelee hadithia. Suurimman, Sunan al-Kubran, hän tiivisti itse myöhemmin lyhyemmäksi valikoimaksi, joka tunnetaan nimellä Sunan al-Sughra ("pienempi Sunan") tai al-Mujtaba ("valikoitu") — teos, jota nykyisin tarkoitetaan yksinkertaisella nimellä Sunan an-Nasa'i. Sitä, kuka tämän valinnan tarkalleen teki ja kenen pyynnöstä, ei ole kirjattu tämän sivun lähteissä. Siinä al-Nasa'i järjesti hadithit lainopillisen aiheen mukaan, kuten [[ABD|Abu Dawud]] ja [[TIR|at-Tirmidhi]] tekivät. Lainoppinut Ibn Hajar al-Asqalani erotti sen myöhemmin sillä, että siinä on, kahden Sahihin jälkeen, vähiten heikkoja (da'if) hadetheja ja epäluotettavia kertojia Kuudesta kirjasta, eikä siinä ole lainkaan väärennettyjä (mawdu') hadetheja.
hero.3=Sunnimuslimien perinne lukee Sunan an-Nasa'in Kuuteen kirjaan (Kutub al-Sittah) yhdessä [[BUK|Sahih al-Bukharin]], [[MUS|Sahih Muslimin]], [[ABD|Sunan Abi Dawudin]] ja [[TIR|Jami` at-Tirmidhin]] kanssa, sekä kuudennen kirjan kanssa, josta kiistellään Sunan Ibn Majahin ja muiden ehdokkaiden välillä. Sitä, mille sijalle se tarkalleen asettuu neljän Sunan-kokoelman joukossa, on kiistelty ratkaisematta: joidenkin lähteiden mukaan se on kuudesta kolmanneksi arvostetuin, suoraan kahden Sahihin jälkeen, kun taas tämän aineiston omat [[ABD|Sunan Abi Dawud]]- ja [[TIR|Jami` at-Tirmidhi]] -sivut heijastavat yleisempää järjestystä, jossa Abu Dawudin kirja on kolmas. Sille annettu hadith-määrä vaihtelee samalla tavalla: 5 758, mukaan lukien toistetut kertomukset, yhden laajalti siteeratun luvun mukaan al-Mujtaballe, kun tämän aineiston lähdelaitos numeroi 5 765 — lähteet eivät sovita näitä kahta lukua yhteen.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-nasai-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää [[BUK|Sahih al-Bukharissa]], [[MUS|Sahih Muslimissa]], [[ABD|Sunan Abi Dawudissa]], [[TIR|Jami` at-Tirmidhissa]] ja Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

