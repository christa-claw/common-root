fact.1.label=Kieli
fact.1.value=klassista arabiaa, englanninkielinen käännös näkyy lukijassa jokaisen hadithin alla
fact.2.label=Kokoaja
fact.2.value=Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i (215–303 AH / 830–915 jaa.)
fact.3.label=Nimi
fact.3.value=tunnetaan nimillä Sunan an-Nasa'i, Sunan al-Sughra ("pienempi Sunan") tai al-Mujtaba ("valikoitu") — myöhempi valikoima al-Nasa'in omasta laajemmasta teoksesta Sunan al-Kubra
fact.4.label=Koottu
fact.4.value=koottu matkoilla Irakin, Hidjazin, Syyrian ja Egyptin halki, jotka alkoivat noin viidentoista vuoden iässä; al-Nasa'i asettui Egyptiin ja kuoli Damaskoksessa vuonna 303 AH (915 jaa.)
fact.5.label=Menetelmä
fact.5.value=järjestetty lainopillisen aiheen mukaan, kuten [[ABD|Sunan Abi Dawud]] ja [[TIR|Jami` at-Tirmidhi]]; tiivistetty al-Nasa'in laajemmasta Sunan al-Kubrasta prosessilla, jota tässä käytetyt lähteet eivät kirjaa
fact.6.label=Asema
fact.6.value=luetaan sunni-islamin Kuuteen kirjaan (Kutub al-Sittah); joidenkin lähteiden mukaan kolmas, [[BUK|Sahih al-Bukharin]] ja [[MUS|Sahih Muslimin]] jälkeen, kun tämän aineiston [[ABD|Sunan Abi Dawud]]- ja [[TIR|Jami` at-Tirmidhi]] -sivut heijastavat yleisempää järjestystä, jossa Abu Dawudin kirja on kolmas — tarkka sija on kiistanalainen eikä ratkaistu
fact.7.label=Hadith-määrä
fact.7.value=5 758, mukaan lukien toistetut kertomukset, yhden laajalti siteeratun luvun mukaan al-Mujtaballe; tämän aineiston lähdelaitos numeroi 5 765 — lähteet eivät sovita näitä kahta lukua yhteen
fact.8.label=Tässä aineistossa
fact.8.value=52 kirjaa ja 5 765 numeroitua hadithia
fact.9.label=Englanninkielinen käännös
fact.9.value=otettu fawazahmed0/hadith-api:n eng-nasai-laitoksesta, näytetään arabiankielisen tekstin rinnalla; mistä julkaistusta käännöksestä se on peräisin, ei ole tämän aineiston puolesta vielä varmistettu
fact.10.label=Käyttöoikeus
