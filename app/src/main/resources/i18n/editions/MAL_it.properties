fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Malik ibn Anas al-Asbahi al-Madani (93–179 dell'Egira / 711–795 d.C.)
fact.3.label=Titolo
fact.3.value=noto come al-Muwatta ("il sentiero ben battuto")
fact.4.label=Compilato
fact.4.value=composto e rivisto nell'arco di circa quarant'anni nel primo periodo abbaside; Malik insegnò a Medina per tutta la vita e vi morì nell'anno 179 dell'Egira (795 d.C.)
fact.5.label=Metodo
fact.5.value=riunisce hadith attribuiti al Profeta con pareri di compagni e successori e le posizioni giuridiche proprie di Malik; anteriore di circa un secolo ai Sei Libri
fact.6.label=Posizione
fact.6.value=anteriore ai Sei Libri canonici dell'islam sunnita; alcuni studiosi, i malikiti e Ibn al-Athir tra altri, lo nominano invece del [[IBM|Sunan Ibn Majah]] come sesto — una disputa che le fonti qui consultate lasciano irrisolta
fact.7.label=Numero di hadith
fact.7.value=circa 1.720 hadith propriamente detti secondo una cifra spesso citata; si dice che Malik abbia selezionato poco meno di 1.900 narrazioni tra le 100.000 a lui disponibili; l'edizione fonte di questo corpus ne numera 1.858
fact.8.label=In questo corpus
fact.8.value=62 libri e 1.858 hadith numerati
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-malik di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione pubblicata discenda non è ancora stato stabilito da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
