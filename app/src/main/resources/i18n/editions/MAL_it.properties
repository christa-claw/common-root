title=Muwatta Malik — Su questa edizione | Common Root
description=Muwatta Malik: la raccolta di diritto e hadith dell'imam Malik ibn Anas, anteriore di circa un secolo ai Sei Libri dell'islam sunnita e talvolta proposta per occupare fra essi il posto del Sunan Ibn Majah.
heroHeading=Muwatta Malik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Malik ibn Anas ibn Malik ibn Abi 'Amir al-Asbahi al-Madani, noto con la kunya Abu 'Abdullah, nacque verso l'anno 93 dell'Egira (711 d.C.) a Medina e vi morì nell'anno 179 (795 d.C.), sepolto nel cimitero di al-Baqi'. Studiò con studiosi come Hisham ibn Urwah, Ibn Shihab al-Zuhri, Ja'far al-Sadiq e Nafi' Mawla Ibn Umar, e insegnò a Medina per tutta la vita, guadagnandosi titoli come Imam Dar al-Hijra ("l'imam della città dell'Egira") e Shaykh al-Islam. Divenne l'eponimo della scuola malikita, una delle quattro grandi scuole giuridiche dell'islam sunnita; il suo discepolo più noto, Muhammad ibn Idris al-Shafi'i — che fondò poi la scuola shafiita — definì il libro di Malik "il più sicuro sulla terra dopo il Corano". Si dice che il califfo abbaside al-Mansur volesse farne l'unico riferimento giuridico dell'impero; Malik stesso rifiutò.
hero.2=Al-Muwatta ("il sentiero ben battuto") fu composto, secondo la tradizione, nell'arco di circa quarant'anni nel primo periodo abbaside; il suo nome deriverebbe dal fatto che Malik mostrò il testo a settanta giuristi di Medina, che tutti vi concordarono (wata'a). Esso riunisce hadith attribuiti al Profeta con i pareri giuridici dei suoi compagni e della generazione successiva, insieme alle decisioni di Malik stesso — secondo una valutazione, la più antica opera superstite a fondere così hadith e fiqh, anteriore di circa un secolo ai Sei Libri. Le cifre sulla sua estensione variano secondo la recensione e il metodo di conteggio: una cifra spesso citata per gli hadith propriamente detti è di circa 1.720, mentre si dice che Malik abbia selezionato poco meno di 1.900 narrazioni tra le 100.000 che gli sarebbero state disponibili.
hero.3=Si conoscono almeno sedici recensioni dell'al-Muwatta. Quella divenuta il riferimento standard, in particolare per la scuola malikita, è quella di Yahya ibn Yahya al-Laythi; una recensione rivale di Ahmad ibn Abi Bakr al-Zuhri è più lunga di circa il cinque-dieci per cento. Esistono circa cento commentari sulla sola recensione di al-Laythi. Poiché è anteriore ai Sei Libri dell'islam sunnita, alcuni studiosi — i malikiti e Ibn al-Athir tra altri — sostengono che l'al-Muwatta, e non il [[IBM|Sunan Ibn Majah]], debba figurare in quella lista canonica; si dice generalmente che il Sunan di Ibn Majah abbia mantenuto quel posto perché il suo contenuto si sovrappone meno agli altri cinque, non perché sia giudicato più sicuro.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-malik di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]], il [[NAS|Sunan an-Nasa'i]], il [[IBM|Sunan Ibn Majah]] e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

