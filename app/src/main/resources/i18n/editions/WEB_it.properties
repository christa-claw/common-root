title=World English Bible — Su questa edizione | Common Root
description=La World English Bible: revisione in inglese moderno dell'American Standard Version del 1901, iniziata nel 1994 da Michael Paul Johnson, con il Nuovo Testamento conformato al testo maggioritario greco e deliberatamente posta nel pubblico dominio.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=La World English Bible esiste per un problema di diritto d'autore. Nel 1994 Michael Paul Johnson, ingegnere che traduceva la Bibbia nelle ore lasciate libere da un impiego a tempo pieno, calcolò quanto gli sarebbe occorso per finire una Bibbia in inglese moderno che chiunque potesse copiare liberamente, e la risposta non gli piacque. Smise di tradurre da zero e ricominciò dall'American Standard Version del 1901 — esatta, stimata e, a differenza della Bibbia di re Giacomo (in Inghilterra e nel Galles tuttora gravata dalle lettere patenti della Corona), interamente libera da diritti. Un programma che scrisse lui stesso percorse l'ASV in cerca delle parole che nessuna Bibbia moderna usava più, propose sostituzioni e le applicò in un quarto d'ora circa. Tutto ciò che il programma non sapeva fare — l'ordine delle parole, la punteggiatura, le virgolette — fu fatto a mano negli anni seguenti, e il testo uscì, e tornò a uscire in revisioni, dal 1997 in poi.
hero.2=Due cose la separano dall'edizione che rivede. La prima è il greco. Il Nuovo Testamento dell'ASV seguiva il testo critico dei revisori, vicino a quello che sarebbe diventata l'edizione Nestle-Aland; la World English Bible fu invece conformata al testo maggioritario bizantino, sicché non è né il testo del proprio ceppo né il Textus Receptus di cui si servirono i traduttori di re Giacomo. La seconda è il nome divino. L'ASV stampava “Jehovah”; la World English Bible stampa “Yahweh”, con una nota a Genesi 2:4 che spiega la scelta al lettore che si aspetta “the LORD”. L'edizione britannica torna a “LORD” — l'esemplare di questo corpus è quello americano, dunque si legge “Yahweh”. Fuori da queste due decisioni resta una traduzione a equivalenza formale alla maniera del suo ceppo: la stessa aderenza stretta all'ordine delle parole ebraico e greco, in una grafia e una grammatica che non chiedono più glossa.
hero.3=Nel lettore è una foglia, e l'unica del ramo più lungo del corpus. Si apra un piolo sotto un versetto della World English Bible e comparirà sotto di esso l'American Standard Version, e sotto quella la Revised Version, la Bibbia di re Giacomo e la Bibbia di Ginevra, giù fino al fondo delle lingue originali segnato con ≈. Nulla nel corpus poggia a sua volta sulla World English Bible. È anche il testo più ampio di quel ramo: l'American Standard Version non aveva apocrifi, sicché quelli della World English Bible furono allestiti a parte, dagli apocrifi di re Giacomo e dalla Settanta inglese di Brenton, e il nostro esemplare porta ottanta libri dove l'ASV che gli sta sotto ne porta sessantasei — fra essi 3 e 4 Maccabei e il Salmo 151, che gli apocrifi di re Giacomo non hanno. Baruc, che loro hanno, manca al nostro esemplare. La pagina informativa lascia vuota la colonna dell'anno per questa edizione, e a ragione: un anno di pubblicazione unico non c'è. Il corpus vi stampiglia 2000 perché le targhette dei pioli abbiano qualcosa su cui ordinarsi.

