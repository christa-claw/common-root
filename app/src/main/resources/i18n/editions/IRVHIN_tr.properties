title=Hint Gözden Geçirilmiş Çeviri — Bu Baskı Hakkında | Common Root
description=Hint Gözden Geçirilmiş Çeviri (IRV): Bridge Connectivity Solutions tarafından 2019'da yayımlanan Hintçe İncil çevirisi, CC BY-SA 4.0 lisanslı — bu derlemenin varsayılan olarak açıldığı Hintçe metin.
heroHeading=Hint Gözden Geçirilmiş Çeviri
readerHref=/reader?c1.src=irvhin

hero.1=Hint Gözden Geçirilmiş Çeviri, telif hakları 2017 ve 2019 tarihli ve bir Hint Kutsal Kitap çevirisi ve teknoloji kuruluşu olan Bridge Connectivity Solutions Pvt. Ltd.'ye ait, modern bir Hintçe Kutsal Kitap çevirisidir. Aynı yayıncının Hindistan'ın başlıca diğer dillerinde de — Kannada, Tamil, Telugu ve Assamca bunlardan bazıları — paralel olarak ürettiği, her biri kendi yazı sistemiyle tam bir Kutsal Kitap olan ve aynı açık lisansla yayımlanan daha geniş bir "Hint Gözden Geçirilmiş Çeviri" dizisine aittir.
hero.2=Common Root'un metni, eBible.org'un Hintçe IRV'nin USFM dağıtımından gelir; bu dağıtım orada hin2017 olarak kataloglanmıştır. Bu metin, aynı çevirinin dipnot metninin doğrudan ayetlerin içine yapıştırıldığı ve kitap adlarının İngilizce yerine Hintçe verildiği daha önceki bir dijital kopyasından değil, bu kaynaktan alınmıştır. Bu USFM kaynağından yeniden içe aktarma, bu baskı buraya eklenmeden önce her iki sorunu da düzeltti — bu derleme, Kutsal Kitabın kendi dili ne olursa olsun, tüm baskılarında kitap adlarını dahili olarak İngilizce tutar.
hero.3=Burada Devanagari yazısıyla, इंडियन रिवाइज़्ड वर्ज़न olarak yazılmıştır ve deuterokanonik kitaplar olmadan standart 66 kitaplık Protestan kanonunu içerir.
hero.4=Bu derlemedeki tek Hintçe İncil'dir, bu yüzden Hintçe arayüz varsayılan olarak onunla açılır.

