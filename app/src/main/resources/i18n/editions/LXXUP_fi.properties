title=Ajantasaistettu Brentonin englanninkielinen Septuaginta — Tietoja tästä laitoksesta | Common Root
description=Sir Lancelot Brentonin englanninkielinen Septuaginta vuosilta 1844 ja 1851, jonka oikeinkirjoituksen ja nimet Adam Boyd saattoi ajan tasalle 2020 — sama käännös kuin alkuperäinen Brenton sen rinnalla tässä aineistossa, ja thou ja thee jätettyinä sinne minne Brenton ne pani.
heroHeading=Ajantasaistettu Brentonin englanninkielinen Septuaginta
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Tämä on Sir Lancelot Brentonin englanninnos Septuagintasta, kreikkalaisesta Vanhasta testamentista, englanniltaan ajan tasalle saatettuna. Brenton käänsi pääasiassa Codex Vaticanuksesta; lontoolainen Samuel Bagster and Sons julkaisi hänen käännöksensä 1844 ja uudelleen apokryfikirjoineen 1851. Vuonna 2020 Adam Boyd tarkisti sen eBible.orgia varten ja luovutti muutoksensa vapaaseen käyttöön. Uudelleen hän ei sitä kääntänyt. Hänen johdantonsa luettelee, mitä hän muutti: oikeinkirjoitus nykyiseksi amerikanenglanniksi, niin että “shew” on nyt “show”; henkilöiden ja paikkojen nimet niihin muotoihin, jotka englantia lukeva tuntee; “begat” ja “spake” muotoon “begot” ja “spoke”; yhdysmerkit ja kaksinkertaiset välimerkit siistitty; ja runous aseteltu runoudeksi. Se mitä hän säilytti, on yhtä harkittua: “thou”, “thee” ja “ye” niihin kuuluvine verbimuotoineen, Brentonin kielioppi ja hänen raskas 1800-luvun välimerkityksensä.
hero.2=Ero näkyy parhaiten alkuperäisen Brentonin rinnalla, joka on sekin tässä aineistossa. Brenton kirjoitti heprealaiset nimet niin kuin kreikka ne kirjoittaa; päivitys antaa yleensä englantilaisen muodon. Siinä missä Brentonin Nehemian kirja alkaa sanoin “the words of Neemias the son of Chelcia”, tässä on “Nehemiah the son of Hacaliah”; Elias the Thesbite on nyt Elijah the Tishbite, ja Jesajan 7:14 Emmanuel on nyt Immanuel. Oikeinkirjoituksen alla käännös on yhä Brentonin, joten se lukee yhä niin kuin kreikka lukee. “A virgin shall conceive” Jesajan 7:14 kohdalla kääntää kreikan sanan parthenos; psalmit noudattavat kreikkalaista numerointia, joten psalmi 22 on tässä paimenpsalmi; ja 1. Mooseksen kirjan 1:2 maa on yhä “unsightly and unfurnished”. Vanhat pronominitkin pysyvät: “thou shalt call his name Immanuel”.
hero.3=Tässä lukijassa se on polveutumisaskelmien ulkopuolella. Aineistoon ei ole kirjattu sille edeltäjää — ei kreikkaa, jonka Brenton käänsi, eikä Brentonia, jota se tarkistaa — joten jonkin sen jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan, joka Vanhassa testamentissa on Leningradin koodeksi: heprealainen teksti, ei se kreikka, josta tämä käännös on tehty. Jos haluat astua Brentonin englannista alas hänen kreikkaansa, avaa alkuperäinen Brenton, jonka kirjattu edeltäjä on Septuaginta. Mikään ei puolestaan seiso tämän laitoksen päällä, eikä mikään käyttöliittymän kieli avaudu siihen; englanninkielinen käyttöliittymä avautuu New International Versioniin. Meidän kappaleemme on kirjaa suppeampi. Siinä on 36 kirjaa. Esra ja Nehemia ovat yksi 23 luvun kirja, kuten kreikassa, ja Nehemia alkaa luvusta 11. eBible.orgin tiedostot, joista se on otettu, sisältävät myös apokryfikirjat ja antavat Esterin ja Danielin vain niiden pidemmässä kreikkalaisessa muodossa; mitään näistä ei otettu aineistoon, joten tässä ei ole Esteriä eikä Danielia, eikä myöskään Tobitia tai Viisauden kirjaa.

