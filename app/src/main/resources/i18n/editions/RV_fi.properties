title=Revised Version — Tietoja tästä laitoksesta | Common Root
description=Englannin Revised Version: ainoa King James Versionin tarkistus, jonka Englannin kirkko on koskaan valtuuttanut, julkaistuna kolmessa erässä vuosien 1881 ja 1894 välillä — ja täällä askelma King James Versionin ja American Standard Versionin välissä.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=Revised Version on se yksi King James Versionin tarkistus, jonka Englannin kirkko todella tilasi. Canterburyn konvokaatio päätti siitä vuonna 1870 ja asetti kaksi ryhmää, yhden kummallekin testamentille, ja niihin koottiin yli viisikymmentä brittiläistä oppinutta useasta kirkkokunnasta — ei vain anglikaaneja, mikä oli sinänsä uutta ja mistä kiisteltiin. Amerikkalaiset oppineet kutsuttiin mukaan kirjeitse, ja he tulivat. Ohje oli varovainen: valtuutettua käännöstä tuli muuttaa vain siellä, missä uskollisesti käännetyt alkukielet sitä vaativat. Uusi testamentti ilmestyi 1881, Vanha testamentti 1885 ja viimeisenä työstetyt apokryfikirjat 1894.
hero.2=Varovainen ohje ei estänyt Uuden testamentin ryhmää tekemästä kirjan seurauksiltaan suurinta ratkaisua. He eivät työskennelleet Textus Receptuksen pohjalta. Westcott ja Hort istuivat siinä ryhmässä ja panivat oman kreikkalaisen tekstinsä sen eteen korrehtuurina työn edetessä; se, mihin tarkistajat päätyivät, oli heidän oma eklektinen tekstinsä eikä täsmälleen Westcottin ja Hortin, mutta se siirtyi ratkaisevasti vanhempien unsiaalikäsikirjoitusten suuntaan. Aseta tämä laitos King James Versionin rinnalle kahteen palstaan, ja siirtymä näkyy heti. Kohdassa 1. Joh. 5:7 King James -palstassa lukee ”For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one”, ja tässä lukee ”And it is the Spirit that beareth witness, because the Spirit is the truth”.
hero.3=Se, mitä brittiläiset tarkistajat eivät muuttaneet, on juuri se, minkä amerikkalaiset eniten halusivat muutettavan. Psalmissa 23:1 tässä laitoksessa lukee yhä ”The LORD is my shepherd”, aivan kuten King James Versionissa; sen yläpuolella American Standard Versionissa lukee ”Jehovah is my shepherd”. Nimi esiintyy täällä vain siellä, missä King James Version oli itsekin sen painanut — kohdassa 2. Moos. 6:3 molemmissa lukee ”by my name JEHOVAH” — ja sen kuljettaminen läpi koko Vanhan testamentin oli amerikkalainen mieltymys, joka neljäntoista vuoden sopimuksen nojalla siirrettiin liitteeseen ja päästettiin tekstiin vasta 1901. Näiden kahden palstan lukeminen rinnakkain on lyhin tapa nähdä, mitä tuo sopimus tosiasiassa pidätti. Toinen ero näkyy lauseiden muodossa eikä niiden sanamuodossa: tarkistajat luopuivat jae per rivi -ladonnasta ja latoivat proosan kappaleiksi, ja jälki siitä säilyy täällä jakeissa, jotka alkavat pienellä kirjaimella koska ne jatkavat lausetta — ”and I appeared unto Abraham” kohdassa 2. Moos. 6:3, kun King James -palsta alkaa ”And I appeared”.
hero.4=Tämän laitoksen kortti jättää vuosiluvun tyhjäksi, ja se on rehellinen vastaus eikä aukko. Revised Versionia ei julkaistu kerran vaan kolmesti, ja teksti on täällä se kahdeksankymmenen kirjan laitos: kuusikymmentäkuusi kirjaa ja niiden lisäksi apokryfikirjojen neljätoista, kaikkiaan 36 873 jaetta, mikä tarkoittaa että se kantaa ainesta jota ei ollut painettuna ennen vuotta 1894. Aineiston kirjaus leimaa sen vuoteen 1885, jolloin Vanha testamentti täydensi varsinaisen Raamatun, ja sen vuoden näyttää myös polveutumisaskelman merkki. Sitä painosta, josta teksti polveutuu, ei ole kirjattu — sama aukko, jonka aineisto jättää King James Versionin ja suomalaisen Biblia 1776:n kohdalle. Huomaa myös, ettei mikään käyttöliittymä avaudu tällä laitoksella; englanninkielinen avautuu New International Versionilla, ja tämä on se, johon vaihdetaan.

