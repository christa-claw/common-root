title=古兰经 — 皮克索尔 — 关于本版本 | Common Root
description=穆罕默德·马默杜克·皮克索尔1930年的译本，是母语为英语的穆斯林所做的第一部英译古兰经——在海得拉巴尼扎姆门下任职期间完成，并得到爱资哈尔学者的指点，在本语料库中，它是默认显示于阿拉伯文本下方的英译文。
heroHeading=古兰经 — 皮克索尔
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=穆罕默德·马默杜克·皮克索尔（1875年至1936年）在成为圣典译者之前，是一位英国小说家，当时曾受H. G. 威尔斯与D. H. 劳伦斯的推崇。1917年11月，他在诺丁山的穆斯林文学会发表题为《伊斯兰与进步》的演讲后，宣布皈依伊斯兰教，同月在沃金穆斯林传教会诵念了清真言。十年后，他在海得拉巴担任查达尔加特中学校长，为尼扎姆效力，1928年正是从那里开始，他请了两年的休假，去做他皈依以来一直想做的事：把古兰经译成英文。
hero.2=他并非独自或草率地完成此事。1929年，他在开罗停留了三个月，拉希德·里达的支持为他打开了门径，他在那里争取爱资哈尔学者对这项事业的祝福——其中一些学者曾被告诫，协助此事可能会使他们失去职位，因为爱资哈尔内部有一部分人认为，翻译古兰经本身就是一件严重的事。皮克索尔不顾此而继续前行，并一直与他们商议。他1930年以《The Meaning of the Glorious Koran: An Explanatory Translation》之名出版的译本，其书名本身就带着这种审慎：不是"英文版古兰经"，而是对其含义的一种解说，因为按他本人声明的看法，任何译本都不可能是古兰经本身。阿尔弗雷德·A·诺普夫在纽约出版了第一版；随后海得拉巴政府印刷所又出版了一个双语版本。
hero.3=《泰晤士报文学增刊》称其为"a great literary achievement"，它通常被称为第一部由母语为英语的穆斯林所译的英文古兰经——此前的英译本，如塞尔和罗德韦尔的译本，都是非穆斯林东方学者的作品。此后近一个世纪以来，皮克索尔的译本一直在印行和使用，是少数真正被普通读者、而不仅仅是学者阅读的英译本之一。
hero.4=在本语料库中，它是默认显示于奥斯曼正写法阿拉伯文本下方的译本——阿拉伯文始终是每一栏的底本，而这段英译文则作为旁注显示在其一侧，绝不取代它。选它承担这一角色，既出于文学上的原因，也出于一个并不光鲜的现实：对现有译本的一番调查发现，明确属于公共领域的英译本只有两种，一种是本译本，另一种是优素福·阿里1934年的译本，此外还有萨布鲁科夫1878年的俄译本作为第三种语言。这里的文本是该译本的数字化版本，取自alquran.cloud，并不对应某一特定印本，因此应把它当作皮克索尔本人的措辞来读，而不是某一特定版本的影印。

