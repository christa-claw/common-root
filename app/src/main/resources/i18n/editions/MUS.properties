fact.4.label=Compiled
fact.4.value=Hadith gathered across Arabia, Egypt, Iraq, and Syria; the book itself completed in Nishapur, Khorasan, at a student's request
fact.5.label=Method
fact.5.value=Admits a hadith only on an unbroken chain of at least two reliable narrators at every link back to a companion of Muhammad; narrators ranked in three tiers by reliability, those of disputed honesty excluded
fact.6.label=Standing
fact.6.value=Second of Sunni Islam's Six Books (Kutub al-Sittah); paired with [[BUK|Sahih al-Bukhari]] as "the Sahihayn", the two collections ranked second in authority only to the Qur'an; most scholars rank al-Bukhari's collection as a whole above this one
