title=King James Version — 关于此版本 | Common Root
description=1611年的 King James Version：四十七位译者分为六组，奉命修订 Bishops' Bible 而非另起炉灶——在本语料库中，它是仍保留初版次经的八十卷本。
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=它起初不过是一场议题另属的会议上的一项让步。1604年的汉普顿宫会议由詹姆斯一世召集，本为听取清教徒对祈祷书的申诉，会上有人提出新译之议，国王采纳了。四十七位学者受命，分为六组——威斯敏斯特两组、牛津两组、剑桥两组——各领圣经的一部分，并有一套据以工作的规则。这些规则中的第一条，于阅读而言最为要紧：他们须依循1568年的 Bishops' Bible，仅在原文有所要求处加以更动。此书是作为修订而非新译受命的，读来也正是如此。国王的印刷商罗伯特·巴克于1611年在伦敦印行了成书。
hero.2=规则未曾言明、而译者仍旧照做的，是不断向 Bishops' Bible 之前伸手。他们承接的英文出自他人之手——首推廷代尔，还有整整一代英格兰读者确实拥有并在家中诵读的日内瓦圣经。本语料库把这笔债记录在案，而不是留给序言：King James Version 在此记录的母本是[[GNV|日内瓦圣经]]，其下则是公认的希腊文本与马所拉希伯来文。在 King James 某节之下展开谱系阶梯，浮上来的便是日内瓦。二者逐节相近到这样一个地步：有趣的问题不再是是否用过日内瓦，而是1611年各组在何处选择与之分道——而这如今可以亲眼查看，不必凭信而受。
hero.3=这部 King James 与多数其他版本的一处差别，在于它里头有些什么。此处经文共八十卷、36,820节：新旧两约，以及印在两者之间的十四卷次经，正如1611年那一卷所印。今日售卖的 King James 圣经几乎都是六十六卷。语料库保留较长的形制，其效果沿着谱系所记的链条可见：此处[[GNV|日内瓦圣经]]为六十六卷，本版为八十卷，其上的[[RV|Revised Version]]为八十卷，再上的[[ASV|American Standard Version]]又回到六十六卷。一个版本印不印次经，是各自分别作出的决定；把它们并入同一栏，这一格局便可读了。
hero.4=卡片上的年份意指为何，须准确了解。它写作1611，那是翻译的年份——并非声称此文本即那一次印刷。此处英文的拼写已作现代化：创世记开篇为「In the beginning God created the heaven and the earth」，而1611年的书页读作「In the beginning God created the Heauen, and the Earth」。所以这是经后世印刷商规范化之后的 King James，而它所出自的具体印次并无记录——正是本语料库为[[FB1776|Biblia 1776]]留下的同一处诚实的空白。就阅读译者的取舍而言，这无关紧要；就把1611年的书当作实物加以引用而言，这关系全局。另须留意，英文界面并非以此版打开：那是[[NIV|New International Version]]，而 King James 是读者自行切换过去的。

