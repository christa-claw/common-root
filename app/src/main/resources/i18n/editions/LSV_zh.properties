title=Literal Standard Version — 关于本译本 | Common Root
description=Literal Standard Version:Covenant Press 于2020年对罗伯特·扬十九世纪 Literal Translation 的修订本,力求在可读英语允许的范围内,对希伯来文、亚兰文与希腊文作出最前后一致的逐字英译。
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version 自称是对罗伯特·扬(Robert Young)十九世纪极度逐字直译的英译本 Literal Translation 的一次重大修订;该译本于1862年首次出版,扬本人又于1887年和1898年对其作了修订。Covenant Christian Coalition 的出版机构 Covenant Press 于2018年初着手进行这次新的修订,其宣称的目标是保持扬对逐词直译的执着,同时更新其英语表达,并纠正后来手稿与词汇学研究有所推进之处。该译本于2020年2月2日完成并出版;美国版权登记于同年1月,电子书版本则于同年5月跟进。出版的版本中未列出具体译者姓名;赞助机构列为 Covenant Press 与 Covenant Christian Coalition。
hero.2=旧约方面,LSV 遵循马索拉文本(Masoretic Text),并受到七十士译本(Septuagint)的重大影响,在死海古卷的异文看起来足够清晰、值得采纳之处也偶尔参考死海古卷。新约方面则遵循公认文本(Textus Receptus)与多数文本(Majority Text),只在特定且明确说明的情况下采用亚历山大系异文,而非作为普遍方针。译者确立了三项指导原则:在英语允许的范围内保留原文的动词时态;在可以保持一致之处,用同一个英语词翻译原文中给定的词;并保留原文的词序,除非英语的可读性确实要求改变。旧约中的神名以音译而非像"主"这样的称号译出,这与本译本整体偏好——向读者呈现原文自身的选择,而非将其磨平——相符。
hero.3=与本语料库的联系更多是文本上的,而非谱系上的:Literal Standard Version 的新约依据公认文本与多数文本,而这正是本语料库另行、完整保存为"公认文本"(Textus Receptus)的同一希腊文底本——即英王钦定版(King James Version)及宗教改革时代传统一般所依据的文本。两个版本之间并无谱系阶梯相连,因为 LSV 被呈现为对扬的 Literal Translation 的修订,而不是对公认文本本身或本语料库所存任何文本的修订;因此,LSV经文下方展开的阶梯会直接通向标记为≈的原文底线。它以 Creative Commons 署名-相同方式共享 4.0 许可发布,而非归入公共领域,这使它与新国际版(New International Version)和新美国标准版(New American Standard Bible)一样属于授权使用而非可自由复制的版本之列——但条件远比这两者宽松。英语界面默认打开新国际版;本译本则需从自己的卡片进入。

