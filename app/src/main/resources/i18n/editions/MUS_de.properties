title=Sahih Muslim — Über diese Ausgabe | Common Root
description=Sahih Muslim: zusammen mit Sahih al-Bukhari bildet es die Sahihayn, die beiden Sammlungen, die der sunnitische Islam gleich nach dem Koran einordnet; Muslim ibn al-Hajjaj stellte es aus Hadithen zusammen, die er auf der Arabischen Halbinsel, in Ägypten, im Irak und in Syrien gesammelt hatte, und nahm nur jene auf, deren Überliefererkette lückenlos und zuverlässig war.
heroHeading=Sahih Muslim
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi wurde in Nishapur geboren, in der abbasidischen Provinz Khorasan (im heutigen Nordostiran); die Quellen nennen unterschiedliche Jahre, 202, 204 oder 206 n. H. (etwa 817–822 n. Chr.). Er reiste durch die Arabische Halbinsel, Ägypten, den Irak und Syrien, um bei Gelehrten vor Ort Hadithe zu sammeln, und ließ sich dann wieder in seiner Heimatstadt nieder, wo er al-Bukhari traf, bei ihm studierte und für den Rest seines Lebens sein Freund blieb. Nach al-Khatib al-Baghdadi unternahm er das Werk auf Bitten eines Schülers, Ahmad ibn Salama al-Naysaburi; sein ursprünglicher Titel, al-Musnad al-Sahih al-Mukhtasar, wird gewöhnlich, wie bei al-Bukhari, zu Sahih Muslim verkürzt. Er starb 261 n. H. (875 n. Chr.) in Nishapur und wurde in dessen Vorort Nasarabad beigesetzt.
hero.2=Er nahm einen Hadith nur auf, wenn dessen Überliefererkette lückenlos bis zu einem Gefährten Muhammads zurückreichte und an jedem Glied durch mindestens zwei zuverlässige Überlieferer verlief; er teilte die Überlieferer nach Gedächtnis und Charakter in drei Stufen ein und ließ jene aus, deren Redlichkeit umstritten war. Sein Kommentator al-Nawawi hob eine weitere Sorgfalt hervor: Muslim, so schrieb er, ordne jedem Hadith eine einzige, passende Stelle zu, zusammen mit allen seinen Überliefererketten und Wortvarianten, statt sie verstreut erscheinen zu lassen — eine Darstellung, die spätere Kommentatoren der Praxis von [[BUK|Sahih al-Bukhari]] gegenübergestellt haben, die verschiedenen Formulierungen eines Hadith getrennt einzuordnen, jeweils unter dem Kapitel, dessen Rechtspunkt die Formulierung veranschaulicht.
hero.3=Wie viele Hadithe das Buch tatsächlich enthält, hängt, wie bei [[BUK|Sahih al-Bukhari]], davon ab, wer zählt und wie mit Wiederholungen umgegangen wird. Kâtip Çelebi und Siddiq Hasan Khan kamen beide auf 7.275; Muhammad Fu'ad Abd al-Baqi, ohne Wiederholungen gezählt, auf 3.033; Mashhur ibn Hasan Al Salman auf 7.385, oder 7.395 mit den zehn Hadithen aus Muslims eigener Einleitung; andere Schätzungen setzen die Gesamtzahl irgendwo zwischen etwa 5.500 und 7.500 an. Al-Jawzaqi zählte 2.326 Hadithe, die sich, nahezu wortgleich, auch in Sahih al-Bukhari finden. Die eigene Zahl dieses Korpus ist noch eine weitere: 57 Bücher und 7.563 numerierte Hadithe, was schlicht die Form der digitalen Ausgabe widerspiegelt, aus der sie stammt, und keinen Anspruch erhebt, irgendeine einzelne Drucknumerierung genau wiederzugeben.
hero.4=Der arabische Text hier ist der klassische Matn, gemeinfrei. Darunter steht im Reader eine englische Übersetzung, entnommen aus der eng-muslim-Ausgabe von fawazahmed0/hadith-api und Hadith für Hadith dem Arabischen zugeordnet, sodass beide als Paar gelesen werden können — dieselbe Begleitanordnung, die dieser Korpus für [[BUK|Sahih al-Bukhari]] und für seine Koranübersetzungen verwendet. Von welcher veröffentlichten englischen Übersetzung diese Datei selbst abstammt, ist auf Seiten dieses Korpus nicht festgestellt worden, weshalb ihre Lizenz als in Prüfung befindlich und nicht einfach als gemeinfrei gekennzeichnet ist; der arabische Text darüber trägt diese Unsicherheit nicht.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=Klassisches Arabisch, mit einer englischen Übersetzung, die im Reader unter jedem Hadith angezeigt wird
fact.2.label=Zusammengestellt von
fact.2.value=Abu al-Husayn Muslim ibn al-Hajjaj al-Qushayri al-Naysaburi (geb. 202–206 n. H. / um 817–822 n. Chr. – gest. 261 n. H. / 875 n. Chr.)
fact.3.label=Vollständiger Titel
fact.3.value=al-Musnad al-Sahih al-Mukhtasar — gewöhnlich zu Sahih Muslim verkürzt
fact.4.label=Zusammengestellt
fact.4.value=Hadithe gesammelt auf der Arabischen Halbinsel, in Ägypten, im Irak und in Syrien; das Buch selbst vollendet in Nishapur, Khorasan, auf Bitten eines Schülers
fact.5.label=Methode
fact.5.value=Nimmt einen Hadith nur mit lückenloser Kette von mindestens zwei zuverlässigen Überlieferern an jedem Glied bis zu einem Gefährten Muhammads auf; Überlieferer in drei Zuverlässigkeitsstufen eingeteilt, jene mit umstrittener Redlichkeit ausgeschlossen
fact.6.label=Stellung
fact.6.value=das zweite der sechs Bücher des sunnitischen Islam (Kutub as-Sitta); zusammen mit [[BUK|Sahih al-Bukhari]] als „Sahihayn" bezeichnet — die beiden Sammlungen in der Autorität gleich nach dem Koran eingestuft; die meisten Gelehrten stellen al-Bukharis Sammlung als Ganzes über diese
fact.7.label=Hadith-Anzahl
fact.7.value=Die Angaben reichen von 3.033 ohne Wiederholung (Abd al-Baqi) bis 7.275–7.395 mit Wiederholung, je nach Zählweise; gedruckte Ausgaben unterscheiden sich sowohl in der Kapitel- als auch in der Hadith-Numerierung
fact.8.label=In diesem Korpus
fact.8.value=57 Bücher und 7.563 numerierte Hadithe — die Form des Quelldatensatzes selbst, keine Wiedergabe irgendeiner einzelnen Drucknumerierung
fact.9.label=Englische Übersetzung
fact.9.value=Entnommen aus der eng-muslim-Ausgabe von fawazahmed0/hadith-api, als Begleittext unter dem Arabischen gezeigt; von welcher gedruckten Übersetzung sie abstammt, ist auf Seiten dieses Korpus noch nicht bestätigt
fact.10.label=Lizenz
fact.10.value=Der arabische Matn ist der gemeinfreie klassische Text; die Lizenz der englischen Übersetzung ist noch in Prüfung
