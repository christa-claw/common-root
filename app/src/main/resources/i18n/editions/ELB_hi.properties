title=Elberfelder 1905 — इस संस्करण के बारे में | Common Root
description=एल्बरफ़ेल्ड बाइबिल: वह जर्मन अनुवाद जिसे 1855 में जॉन नेल्सन डार्बी, कार्ल ब्रोकहाउस और यूलिउस आंटोन फ़ॉन पोज़ेक ने आरम्भ किया, और जो टेक्स्टस रेसेप्टुस छोड़ने वाले पहले जर्मन अनुवादों में से है — यहाँ 1905 की छपाई में।
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=यह नाम एक स्थान का है। एल्बरफ़ेल्ड वुपर की घाटी में बसा नगर है, 1929 से वुपरटाल का अंग, और अधिकांश काम वहीं हुआ। इसे तीन व्यक्तियों ने आरम्भ किया: जॉन नेल्सन डार्बी, कार्ल ब्रोकहाउस और यूलिउस आंटोन फ़ॉन पोज़ेक — तीनों ब्रदरन आन्दोलन की जर्मन शाखा से जुड़े हुए। नया नियम 1855 में प्रकट हुआ, भजन संहिता 1859 में और पुराना नियम 1871 में — किसी के नाम से नहीं, बल्कि मूल पाठ से “कुछ मसीहियों द्वारा” अनूदित के रूप में।
hero.2=इसे अलग करने वाली बात इसके नीचे की यूनानी थी। उस समय प्रचलित लगभग हर जर्मन बाइबिल अब भी टेक्स्टस रेसेप्टुस पर टिकी थी; इसने उससे नाता तोड़ा और उन्नीसवीं शताब्दी के मध्य में जैसे-जैसे कोडेक्स सिनाइटिकस और कोडेक्स वैटिकानुस प्रकाशित होते गए, उनके पाठ ग्रहण किए। पुराना नियम मासोरेटिक इब्रानी से बना। अनुवाद का सिद्धांत सौंदर्य से पहले यथार्थता था: ऐसी जर्मन जो इब्रानी और यूनानी का इतना निकट अनुसरण करती है कि कठोर हो जाती है, अर्थ के लिए जोड़ा गया हर शब्द जोड़ा हुआ चिह्नित, और खण्ड-शीर्षक बिलकुल नहीं, इस आधार पर कि मूल पाठों में वे हैं ही नहीं। यह आज भी उन जर्मन संस्करणों में गिनी जाती है जो अपने नीचे के शब्दों के सबसे निकट खड़े हैं।
hero.3=यह 1905 की छपाई है, फ़्रैक्टूर के स्थान पर रोमन अक्षरों में सजाई गई पहली छपाई; उस टाइप के छोटे आकार के कारण इसे Perlbibel कहा जाता है। यह कोई नया अनुवाद न था। 1932 में रुडोल्फ़ ब्रोकहाउस की मृत्यु तक एल्बरफ़ेल्डर को छपाई-दर-छपाई देखा और सुधारा जाता रहा — पुराने नियम के लिए आल्फ़्रेड रोशा उत्तरदायी थे, नए के लिए एमिल डोंगेस — इसलिए यहाँ कोई तिथि एक चलते हुए पाठ के भीतर की छपाई का नाम है, किसी पूर्ण संस्करण का नहीं। और आज जो एल्बरफ़ेल्डर के नाम से बिकता है, वह प्रायः फिर कुछ और ही है: उसी आन्दोलन की एक समिति ने पच्चीस वर्ष उसके संशोधन में लगाए और परिणाम 1975 तथा 1985 में प्रकाशित किया। उस संशोधन ने “Jehova” को पुराने नियम से हटाकर उसके स्थान पर “HERR” रखा। यह पाठ अब भी “Jehova” छापता है, और यही इसे American Standard Version के तथा स्वयं डार्बी की फ़्रांसीसी बाइबिल के साथ खड़ा करता है।
hero.4=इस संग्रह में इसका स्थान कुछ अलग-थलग है। जर्मन के लिए पाठक में कोई चुना हुआ पूर्वनिर्धारित संस्करण नहीं है, इसलिए जर्मन अंतरफलक सूची की पहली जर्मन बाइबिल खोलता है, और वह यही है — दोनों लूथर बाइबिलों से आगे, केवल वर्णक्रम के कारण और किसी अन्य कारण से नहीं। वंश-पायदानों में यह अकेली खड़ी है। दोनों लूथर एक शृंखला बनाते हैं — 1912 का संशोधन 1545 से हुआ और 1545 यूनानी तथा इब्रानी पर टिका है — जबकि एल्बरफ़ेल्डर का कोई अभिलिखित मूल नहीं, क्योंकि 1871 की वह एल्बरफ़ेल्डर, जिससे यह निरन्तर सुधारों द्वारा निकली, इस संग्रह में नहीं है। इसलिए एल्बरफ़ेल्डर के पद के नीचे का पायदान सीधे ≈ से चिह्नित मूल-भाषा तल पर उतरता है, यद्यपि एक स्तम्भ दूर खड़ी फ़्रांसीसी डार्बी बाइबिल ही यहाँ इसकी निकटतम सम्बन्धी है।

