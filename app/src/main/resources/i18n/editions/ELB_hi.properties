fact.4.label=यह छपाई
fact.4.value=आर. ब्रोकहाउस की 1905 की छपाई — फ़्रैक्टूर के स्थान पर रोमन अक्षरों में सजाई गई पहली, और उस टाइप के छोटे आकार से Perlbibel नाम से जानी जाने वाली
fact.5.label=नया नियम किससे
fact.5.value=समीक्षात्मक यूनानी पाठ से: [[TR|टेक्स्टस रेसेप्टुस]] से नाता तोड़ने वाली पहली जर्मन बाइबिलों में से एक, जिसने कोडेक्स सिनाइटिकस और कोडेक्स वैटिकानुस के पाठ उनके छपते जाने के साथ-साथ ग्रहण किए
fact.6.label=पुराना नियम किससे
fact.6.value=मासोरेटिक इब्रानी से, कुछ थोड़े स्थानों पर उससे हटते हुए
fact.7.label=अनुवाद का प्रकार
fact.7.value=स्रोत-पाठ पर केन्द्रित और जान-बूझकर शब्दानुवादी — अर्थ के लिए जोड़े गए शब्द जोड़े हुए चिह्नित हैं, और खण्ड-शीर्षक नहीं जोड़े गए, क्योंकि मूल पाठों में वे नहीं हैं
fact.8.label=ईश्वर का नाम
fact.8.value=सम्पूर्ण पुराने नियम में “Jehova” छापती है; 1985 के संशोधन ने उसके स्थान पर “HERR” रखा। वही निर्णय जो [[ASV|American Standard Version]] का और [[DBY|डार्बी की फ़्रांसीसी बाइबिल]] का है
fact.9.label=सहोदर संस्करण
fact.9.value=[[DBY|Darby 1885]] — उसी मण्डली की फ़्रांसीसी बाइबिल, उन्हीं सिद्धांतों पर
fact.10.label=सुधार चलता रहा
fact.10.value=1932 तक, छपाई-दर-छपाई — पुराने नियम के लिए आल्फ़्रेड रोशा, नए के लिए एमिल डोंगेस
fact.11.label=यह वह पुस्तक नहीं
fact.11.value=1975 और 1985 की Revidierte Elberfelder, पच्चीस वर्ष चले संशोधन का फल और इससे भिन्न पाठ
fact.12.label=लाइसेंस
fact.12.value=सार्वजनिक डोमेन
fact.13.label=इस संग्रह में
fact.13.value=वह बाइबिल जिस पर जर्मन अंतरफलक खुलता है: जर्मन के लिए कोई चुना हुआ पूर्वनिर्धारित संस्करण नहीं है, इसलिए पाठक सूची की पहली जर्मन बाइबिल लेता है, और ELB [[LUT1545|Luther 1545]] तथा [[LUT1912|Luther 1912]] से केवल अपने संक्षेपाक्षर के बल पर आगे रहती है। वंश-पायदानों में कोई मूल अभिलिखित नहीं — 1871 की वह एल्बरफ़ेल्डर, जिससे यह निरन्तर सुधारों द्वारा निकली, संग्रह में नहीं है — इसलिए पायदान मूल-भाषा तल पर खुलता है। वर्ष भी यह किसी ओर नहीं रखती: सूची-कार्ड वर्ष का स्तम्भ रिक्त छोड़ता है और हाथ से बनी पायदान-वर्षों की सूची भी इसे नहीं जानती, अतः ELB का पायदान चिह्न संक्षेपाक्षर के सिवा कुछ नहीं दिखाता — यह मौन स्थिति है, जबकि [[DRA|डुए-रिम्स]] मुखर स्थिति है, जहाँ वे दोनों सूचियाँ सार्वजनिक रूप से एक-दूसरे का खण्डन करती हैं
