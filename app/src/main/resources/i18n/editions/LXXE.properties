title=Brenton English Septuagint — About This Edition | Common Root
description=Sir Lancelot Brenton's English translation of the Greek Old Testament, first published in London in 1844 and reissued with the Apocrypha in 1851 — for more than a century the English Septuagint, and in this reader the rung above the Greek it was made from.
heroHeading=Brenton English Septuagint
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) was the son of a Royal Navy admiral, Sir Jahleel Brenton, and was ordained in the Church of England in 1830, two years after taking his degree at Oriel College, Oxford. He did not stay in it long. At Oxford he had met John Nelson Darby, and by the end of 1831 he had left the established Church to found an independent chapel in Bath; by 1835 that chapel was associated with the Plymouth Brethren, the movement Darby was then shaping. Darby's own Bibles are in this corpus too, in French and in English. In 1844 Brenton inherited his father's baronetcy, and in the same year Samuel Bagster and Sons of London published his translation of the Septuagint. He died on the Isle of Wight in 1862, childless, the last baronet of his line.
hero.2=It was not the first English Septuagint — Charles Thomson had published one in Philadelphia in 1808 — but it was the one that lasted: for more than a century and a half, until the New English Translation of the Septuagint appeared in 2007, an English reader who wanted the Greek Old Testament rather than the Hebrew read Brenton. He translated principally from Codex Vaticanus, the fourth-century manuscript in the Vatican Library. The first edition left out the Apocrypha; the 1851 edition added them, and it is the 1851 text that this copy reproduces. Bagster's Greek–English editions set the Greek beside the English, and that Greek is in this corpus as a separate edition. Because the English follows the Greek, it reads where the Greek reads: the Psalms keep the Greek numbering, so Psalm 22 here is the shepherd psalm, and at Isaiah 7:14 “a virgin shall conceive” renders the Greek parthenos, not the Hebrew ʿalmah.
hero.3=In this reader it is a rung with a single, literal parent: the Greek Septuagint beneath it is the text Brenton translated, printed by his own publisher beside his English. Open a rung beneath one of its verses and the Greek appears, with the Westminster Leningrad Codex below it as the original-language floor. Nothing in the corpus stands on it in turn. Our copy is narrower than the book. It has 37 books, the ones the Hebrew canon also has under their usual names. The eBible.org files it was taken from also carry the Apocrypha — Tobit, Judith, Wisdom, Sirach, Baruch, four books of Maccabees and more — and give Esther and Daniel only in their longer Greek forms. None of those came through into the corpus, so there is no Esther and no Daniel here, and where the Greek beneath has Tobit or Wisdom there is no English above it. Ezra and Nehemiah stand as two books, where the Greek beneath has one. A spelling update of the same translation, Adam Boyd's Updated Brenton of 2020, is in the corpus as an edition of its own.

