title=Reina Valera 1909 — About This Edition | Common Root
description=Reina-Valera 1909: the revision that carried Casiodoro de Reina's Spanish of 1569, as Cipriano de Valera had revised it in 1602, into the twentieth century — and the edition this reader opens on for Spanish.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=The Spanish Protestant Bible is, to an unusual degree, one book. Casiodoro de Reina, who had left Spain ahead of the Inquisition, finished his translation in exile and published it at Basel in 1569 — the Biblia del Oso, named for the bear on its title page. Cipriano de Valera, who had been in the same monastery outside Seville and made the same escape, spent years going over it and published the result at Amsterdam in 1602, the Biblia del Cántaro. Every Reina-Valera since is a revision of a revision of that, which is why a hyphenated name commemorates two men who never worked in the same room.
hero.2=This is the revision of 1909, prepared under the British and Foreign Bible Society together with the American Bible Society, and generally called the Versión Antigua — the old version — by the people who kept using it. It followed an earlier revision of 1862, and it is conservative about the thing revisions usually change: the wording is brought forward where Reina and Valera had grown hard to follow, and left alone where it had not. The Old Testament stands on the Masoretic Hebrew and the New on the Textus Receptus, as Reina's had.
hero.3=It held the Spanish-speaking Protestant world almost to itself for about fifty years, until the revision of 1960 displaced it, and it has never quite gone away. It is out of copyright, which the 1960 is not, so this is the Reina-Valera that gets printed, posted and quoted without anyone's permission. That is also why the whole text can sit in this corpus and be copied back out of it.
hero.4=In this reader Spanish has five Bibles, and this is the one the interface opens on. That is a curated choice rather than an accident of the catalogue: unlike Arabic or Chinese, where the reader opens on the only Bible in the language there is, Spanish has alternatives and this was picked from among them. In the lineage rungs no parent is recorded for it, so a rung opened beneath a verse falls straight to the original-language floor marked with ≈. The floor fits closer here than it usually does, for the same reason it does on the Arabic Bible: the Greek it supplies is the Textus Receptus, and the Textus Receptus is what Reina's New Testament was made from.

