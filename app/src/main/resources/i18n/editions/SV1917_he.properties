title=Svenska 1917 — על מהדורה זו | Common Root
description=תרגום הכנסייה השוודית משנת 1917 — Gustav V:s bibel — התנ"ך השוודי הראשון שנעשה ישירות מן העברית והיוונית ולא עודכן מקודמו, והתנ"ך השוודי היחיד שאוסף זה מחזיק.
heroHeading=Svenska 1917
