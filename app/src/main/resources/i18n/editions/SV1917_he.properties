# The narrative, one paragraph per key, in order.
hero.1=במשך שלוש מאות וחמישים שנה היה לכנסייה השוודית תנ"ך אחד, שעודכן אך לא נעשה מחדש. תנ"ך גוסטב ואסה משנת 1541, התנ"ך המלא הראשון שנדפס בשוודית, נשען בכובד על הגרמנית של מרטין לותר. תנ"ך גוסטב השני אדולף משנת 1618 עדכן אותו, ו-Karl XII:s bibel משנת 1703 — שהושלם בימי מלך אחד אף שאביו הזמין אותו קודם לכן — נשא את אותה שוודית נחלת אבות צעד נוסף קדימה. אף אחד משלושתם לא חזר להתחיל מבראשית.
hero.2=בשנת 1773 מינה גוסטב השלישי ועדת תנ"ך לעשות את מה שאף אחד מאותם עדכונים לא עשה: לתרגם ישירות מן העברית והיוונית במקום לשוב ולשאת את השוודית הישנה צעד נוסף. הוועדה כיהנה 144 שנה. תוצאתה — תרגום התנ"ך המלא השני בשוודיה, אחרי זה של גוסטב ואסה ולפני Bibel 2000 — הושלמה ואושרה בימי גוסטב החמישי בשנת 1917, ומשום כך היא עדיין נקראת לרוב Gustav V:s bibel.
hero.3=הברית הישנה נשענת על הנוסח העברי המסורתי, כמו המהדורות שקדמו לה. הברית החדשה אינה ממשיכה את קו שלהן: היא הולכת אחרי הנוסח היווני הביקורתי העדכני ביותר שהיה בידי הוועדה עד 1917, ולא אחרי הנוסח המקובל שעליו בנויות ביבליות הרפורמציה שבאוסף זה.
hero.4=בקורא הזה היא התנ"ך השוודי היחיד, ולכן העמדת הממשק על שוודית פותחת עליה — לא כבחירה מוקפדת, כדרך ש־Reina-Valera 1909 נבחרה לספרדית, אלא משום שסריקת הקטלוג אינה מוצאת בשפה דבר אחר. בשלבי השושלת לא רשום לה שום מקור, ולכן שלב הנפתח מתחת לפסוק יורד היישר אל רצפת שפות המקור המסומנת ב־≈. רצפה זו מספקת ליוונית את הנוסח המקובל, וכאן הדבר מתרחק מן האמת יותר מן הרגיל: הוועדה נטשה בכוונה את הנוסח המקובל למען נוסח ביקורתי עדכני יותר, כך שהרצפה מתחת לפסוק מתרגום זה מציינת נוסח יוונית שאינו הנוסח שבו הוא אכן הלך בעקבותיו.

