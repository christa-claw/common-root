title=क़ुरआन — सब्लुकोव — इस संस्करण के बारे में | Common Root
description=गोर्दी सब्लुकोव का रूसी अनुवाद, जो 1878 में काज़ान में प्रकाशित हुआ और जिसे सामान्यतः फ़्रेंच या अंग्रेज़ी माध्यम के बजाय सीधे अरबी से किया गया पहला रूसी क़ुरआन अनुवाद बताया जाता है — और इस संग्रह में उस्मानी अरबी पाठ के नीचे दिखाया जाने वाला रूसी साथी अनुवाद।
heroHeading=क़ुरआन — सब्लुकोव
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=गोर्दी सिम्योनोविच सब्लुकोव (1803-1880) ने रूसी रूढ़िवादी पादरी बनने का प्रशिक्षण लिया, 1826 में ओरेनबर्ग थियोलॉजिकल सेमिनरी से और 1830 में मॉस्को थियोलॉजिकल अकादमी से स्नातक हुए। उन्होंने अगले दो दशक, 1830 से 1849 तक, सारातोव थियोलॉजिकल सेमिनरी में इतिहास और पूर्वी भाषाएँ पढ़ाने में बिताए — जहाँ 1840 के दशक के मध्य में उनके विद्यार्थियों में भविष्य के क्रांतिकारी लेखक निकोलाई चेर्नीशेव्स्की भी थे — इससे पहले कि वे 1849 में काज़ान थियोलॉजिकल अकादमी के मिशनरी विभाग में चले गए, जहाँ उन्होंने 1862 तक पूर्वी और शास्त्रीय भाषाएँ पढ़ाई।
hero.2=क़ुरआन के रूसी अनुवाद 1716 तक जाते हैं, जब प्योत्र पोस्तनिकोव ने पीटर महान के आदेश पर एक अनुवाद तैयार किया था — लेकिन यह आंद्रे दू रियर के फ़्रेंच अनुवाद से था, अरबी से नहीं, जैसा कि अलेक्सेई कोल्माकोव का 1792 का अनुवाद भी था, जो जॉर्ज सेल के अंग्रेज़ी अनुवाद से किया गया था। सब्लुकोव का अनुवाद, जो 1878 में काज़ान में "Коран, законодательная книга мохаммеданского вероучения" ("क़ुरआन, मोहम्मदी पंथ की विधायी पुस्तक") शीर्षक से प्रकाशित हुआ, सामान्यतः मूल अरबी से सीधे किए गए पहले रूसी क़ुरआन अनुवाद के रूप में जाना जाता है, जो काज़ान में पूर्वी भाषाएँ पढ़ाने के उनके वर्षों का परिणाम था।
hero.3=उन्होंने अगले वर्ष इसके साथ टिप्पणियों का एक साथी खंड जोड़ा, "Приложения к переводу Корана" (1879), और बाद में इससे जुड़े दो और अध्ययन: "Сведения о Коране" ("क़ुरआन के बारे में जानकारी," 1884) और ईसाई व मुस्लिम शिक्षाओं में ईश्वर के नामों पर एक पहले का तुलनात्मक लेख (1873)। उनका अनुवाद तब से अधिक प्रसारित रूसी संस्करणों में से एक बना रहा, भले ही बाद के अनुवाद — जिनमें इग्नाती क्राच्कोव्स्की का मृत्योपरांत प्रकाशित अनुवाद भी शामिल है — सोवियत और सोवियत-पश्चात् शैक्षणिक उपयोग में अधिक जाने गए।
hero.4=यहाँ alquran.cloud के ru.sablukov संस्करण के माध्यम से जो डिजिटलीकृत किया गया है, उसे इस संग्रह में [[Q-AR|उस्मानी अरबी पाठ]] के साथ रूसी साथी अनुवाद के रूप में प्रस्तुत किया गया है, 1930 के [[Q-EN|पिकथॉल]] और 1934 के [[Q-YA|यूसुफ़ अली]] के अंग्रेज़ी अनुवादों के साथ — वे तीन अनुवाद जिन्हें उपलब्ध अनुवादों की एक समीक्षा ने स्पष्ट रूप से स्वतंत्र रूप से उपयोग योग्य पाया, अरबी के अलावा प्रत्येक भाषा के लिए एक-एक।

