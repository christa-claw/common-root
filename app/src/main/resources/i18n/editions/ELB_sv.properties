title=Elberfelder 1905 — Om denna utgåva | Common Root
description=Elberfelderbibeln: den tyska översättning som 1855 påbörjades av John Nelson Darby, Carl Brockhaus och Julius Anton von Poseck, en av de första på tyska som lämnade Textus Receptus — här i 1905 års tryckning.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Namnet är en plats. Elberfeld är en stad i Wupperdalen, sedan 1929 en del av Wuppertal, och det var där det mesta av arbetet gjordes. Tre män började det: John Nelson Darby, Carl Brockhaus och Julius Anton von Poseck, alla knutna till den tyska grenen av brödrarörelsen. Nya testamentet kom 1855, Psaltaren 1859 och Gamla testamentet 1871 — utgivna inte under någons namn utan som översatta från grundtexten “av några kristna”.
hero.2=Det som skilde den från de andra var grekiskan under den. Så gott som varje tysk bibel som då var i omlopp stod ännu på Textus Receptus; denna bröt med den och tog upp läsarterna i Codex Sinaiticus och Codex Vaticanus allteftersom de handskrifterna kom i tryck under 1800-talets mitt. Gamla testamentet gjordes från den masoretiska hebreiskan. Principen var noggrannhet före elegans: en tyska som följer hebreiskan och grekiskan så nära att den blir stel, varje ord som lagts till för meningens skull utmärkt som tillagt, och inga avsnittsrubriker alls, på den grunden att grundtexterna inte har några. Den räknas ännu bland de tyska versioner som står ordalydelsen under sig närmast.
hero.3=Detta är 1905 års tryckning, den första satt med antikva i stället för fraktur; av den lilla stilgraden kallas den Perlbibel. Den var ingen ny översättning. Ända till Rudolf Brockhaus död 1932 gicks Elberfelder igenom och rättades från tryckning till tryckning — Alfred Rochat svarade för Gamla testamentet, Emil Dönges för Nya — så ett årtal här namnger en tryckning i en text i rörelse snarare än en färdig utgåva. Det som i dag säljs som Elberfelder är oftast något annat igen: en kommission ur samma rörelse lade tjugofem år på att revidera den och gav ut resultatet 1975 och 1985. Den revisionen tog bort “Jehova” ur Gamla testamentet och satte “HERR” i dess ställe. Denna text trycker fortfarande “Jehova”, vilket ställer den vid sidan av American Standard Version och vid sidan av Darbys egen franska bibel.
hero.4=Dess plats i denna samling ligger något vid sidan om. Tyskan har ingen kurerad standardutgåva i läsaren, så ett tyskt gränssnitt öppnar den första tyska bibeln i katalogen, och det är denna — före båda Lutherbiblarna på alfabetisk ordning och ingenting annat. I härstamningens stegpinnar står den ensam. De två Luther bildar en kedja, 1912 reviderad ur 1545 och 1545 vilande på grekiskan och hebreiskan, medan Elberfelder inte har någon registrerad förlaga, eftersom den Elberfelder från 1871 som den genom fortlöpande rättelser har utgått ur inte finns i detta korpus. En stegpinne under en Elberfeldervers går därför rakt ned till det ≈-markerade originalspråksgolvet, fastän den franska Darbybibeln en spalt bort är dess närmaste släkting här.

