fact.13.value=den bibel ett tyskt gränssnitt öppnar: tyskan har ingen kurerad standardutgåva, så läsaren tar den första tyska bibeln i katalogen, och ELB står före [[LUT1545|Luther 1545]] och [[LUT1912|Luther 1912]] på ingenting annat än sin förkortning. I härstamningens stegpinnar är ingen förlaga registrerad — den Elberfelder från 1871 som den har utgått ur finns inte i korpuset — så en stegpinne öppnar på originalspråksgolvet. Något år bär den inte på någondera sidan: katalogkortet lämnar årskolumnen tom, och den handhållna listan över stegpinneår saknar den likaså, så en stegpinne för ELB visar förkortningen och ingenting mer — det tysta fallet, där [[DRA|Douay-Rheims]] är det högljudda och de två listorna motsäger varandra offentligt
