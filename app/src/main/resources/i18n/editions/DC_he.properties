title=תורה ובריתות — על מהדורה זו | Common Root
description=תורה ובריתות: התגלויות והצהרות נוספות שתועדו בידי ג'וזף סמית', שהודפסו לראשונה ב-1835 בקירטלנד שבאוהיו, ונקראות בידי קדושי אחרית הימים כתבי קודש לצד המקרא.
heroHeading=תורה ובריתות
readerHref=/reader?c1.src=dc

hero.1=תורה ובריתות אוסף התגלויות, חזיונות והצהרות נוספות שג'וזף סמית' הבן אמר שקיבל כמסרים ישירים מאלוהים, שתועדו בעיקרם בשנותיה המוקדמות ביותר של הכנסייה באוהיו, במיזורי ובניו יורק. קובץ מוקדם יותר, שנקרא "ספר המצוות לממשל כנסיית המשיח", היה בהדפסה בבית הדפוס של הכנסייה באינדיפנדנס שבמיזורי, כאשר אספסוף החריב את בית הדפוס ביולי 1833 ופיזר את הגיליונות הבלתי שלמים בטרם הספר הושלם; הוא לא יצא לאור באופן רשמי מעולם, אף שמספר מצומצם מהגיליונות הבלתי כרוכים שניצלו אז שרד.
hero.2=מהדורה מורחבת ובעלת שם חדש, "תורה ובריתות של כנסיית קדושי אחרית הימים", יצאה לאחריה ב-1835, פורסמה בקירטלנד שבאוהיו, וחוברה ואושרה בידי ועדה של ארבעה: ג'וזף סמית', אוליבר קאודרי, סידני ריגדון ופרדריק ג'. ויליאמס. אותה מהדורה ראשונה כללה בכריכה אחת שני סוגי חומר — סדרת הרצאות תאולוגיות שנישאו בבית הספר של קירטלנד, שהוצגו כ"תורה" שבספר, לצד ההתגלויות המתועדות עצמן, שהוצגו כ"בריתות" שבו. הרצאות אלה, שנודעו מאז כ-Lectures on Faith, הוסרו מאוחר יותר מהספר — שינוי המתוארך בדרך כלל למהדורת 1921 — כך שההתגלויות נותרו הן כל החיבור.
hero.3=הספר מאורגן בסעיפים ממוספרים ולא בספרים, בפרקים ובפסוקים כבמקרא — דבר המשקף את מה שהוא: אוסף של טקסטים נפרדים ולא סיפור אחד רצוף. גם התוכן וגם המספור השתנו במהלך מהדורות המאה ה-19, בהן מהדורת 1876 בראשות אורסון פראט, שערכה מחדש חומר קודם והוסיפה התגלויות נוספות. המהדורה המודרנית קיבלה את צורתה הנוכחית ב-1981, אז נוספו שני פריטים נוספים — חזון על דרגות התהילה וחזון על גאולת המתים — כסעיפים 137 ו-138, לצד שתי "הצהרות רשמיות": מניפסט מ-1890 שסיים את הכרת הכנסייה בנישואים פוליגמיים חדשים, והצהרה מ-1978 שהרחיבה את הסמכה לכהונה לכל חבר זכר הגון, בלי הבדל גזע. דפוס 2013 חידש חומר עיון נוסף. המהדורה התקנית הנהוגה כיום מכילה 138 סעיפים ושתי ההצהרות הרשמיות.
hero.4=הספר נמנה עם ארבעת החיבורים שתנועת קדושי אחרית הימים מכנה "כתבי הקודש התקניים" שלה, לצד המקרא, [[BOM|ספר מורמון]] ו[[PGP|הפנינה היקרה]]. Community of Christ, זרם נפרד שמקורו באותה תנועה, שומר על תורה ובריתות משלו, הממוספר ומתעדכן באופן עצמאי מזה שלפנינו. הטקסט באוסף זה מקורו בייצוא ה-JSON של Mormon Documentation Project, אותו המקור שבנחלת הכלל המשמש גם ל[[BOM|ספר מורמון]] ול[[PGP|הפנינה היקרה]], והוא מוצג כאן כספר אחד, "תורה ובריתות", שבו כל סעיף משמש פרק; הוא עוקב אחר נוסח המהדורה התקנית הנוכחית ומשמיט את הערות השוליים וכותרות הפרקים המוגנות בזכויות יוצרים, ומשום כך לא מצוינת לו כאן שנת הוצאה אחת.

