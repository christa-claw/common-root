title=Emphatic Diaglott (अंतर्पंक्तिक) — इस संस्करण के बारे में | Common Root
description=बेंजामिन विल्सन का 1864 का Emphatic Diaglott: ग्रीसबाख की यूनानी के नीचे छपी शब्दशः अंग्रेज़ी टीका, जिसे बाद में वॉच टावर सोसाइटी ने खरीदकर साठ वर्ष तक पुनर्मुद्रित किया — और वही पाठ जिस पर यूहन्ना 1:1 का विवाद प्रायः लड़ा जाता है।
heroHeading=Emphatic Diaglott (अंतर्पंक्तिक)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=बेंजामिन विल्सन पेशेवर विद्वान नहीं थे। वे इलिनॉय के जेनेवा में एक अख़बार के संपादक थे, यूनानी उन्होंने स्वयं सीखी, और 1857 से 1863 के बीच उन्होंने खंड-दर-खंड एक अंतर्पंक्तिक नया नियम निकाला जिसे उन्होंने केवल अनूदित ही नहीं, बनाया भी था: उनके भतीजे ने उन्हें देखा था कि वे टाइप के हर पृष्ठ की मोम-छाप लेते, उन्हें रातभर अम्ल में लटकाते ताकि ताँबे की एक झिल्ली चढ़ जाए, ताँबे के पीछे ढली धातु भरते, और लड़का प्लेट पर स्याही फेरता रहता जबकि वे परिणाम हस्तचालित प्रेस पर छापते। पूरा खंड 1864 में सामने आया। यूनानी के लिए उन्होंने वह पाठ लिया जिसे योहान याकोब ग्रीसबाख ने 1770 के दशक में स्थापित किया था, और पाठभेद कोडेक्स वैटिकानुस से लिए।
hero.2=विल्सन ने वास्तव में दो अंग्रेज़ी पाठ छापे, एक नहीं। पृष्ठ के बाएँ हाशिये पर यूनानी चलती थी और हर शब्द के नीचे शब्दशः शाब्दिक अंग्रेज़ी टीका; दाएँ हाशिये पर उनका अपना सँवारा हुआ अनुवाद, Emphatic Version। ये एक नहीं हैं, और यूहन्ना 1:1 पर तो खुलकर असहमत हैं — टीका पढ़ती है «and a god was the Word», और Emphatic Version «and the LOGOS was God»। दोनों विल्सन की हैं, एक ही पुस्तक में कुछ सेंटीमीटर की दूरी पर छपी। इस संग्रह में टीका है, वही स्तंभ जिसे लोग उद्धृत करते हैं, और यही कारण है कि वह बाइबिलों की जालिका में नहीं, अपने अलग खंड में बैठती है। टीका यह दर्ज करती है कि यूनानी वाक्य किस तरह जोड़ा गया है — कारक दर कारक, उपपद दर उपपद, यूनानी शब्दक्रम में। यह इस बारे में निर्णय नहीं है कि वाक्य को अंग्रेज़ी में कैसे पढ़ा जाए, और उस बारे में विल्सन का अपना निर्णय बगल के स्तंभ में छपा है। जो एक को उद्धृत करे, उसे जानना चाहिए कि दूसरा भी है।
hero.3=पुस्तक का परवर्ती जीवन ही वह कारण है जिससे अधिकांश लोगों ने इसका नाम सुना है। विल्सन की मृत्यु 1900 में हुई, और वे Church of the Blessed Hope के सदस्य थे, न कि किसी ऐसे समूह के जो उस समय यहोवा के साक्षी नाम से विद्यमान हो। 1902 में वॉच टावर बाइबल एंड ट्रैक्ट सोसाइटी के अध्यक्ष चार्ल्स टेज़ रसेल ने विल्सन के उत्तराधिकारियों से कॉपीराइट प्राप्त किया और समय के साथ प्लेटें भी। सोसाइटी ने अगले साठ वर्ष तक Diaglott छापा — 1927 में अपनी प्रेसों पर टाइप फिर से बिठाया, डेढ़ लाख से कहीं अधिक प्रतियाँ निकालीं, इसे दो डॉलर में बेचा और अंततः मुफ़्त बाँटने लगी। सो Diaglott यहोवा के साक्षियों की पुस्तक कर्तृत्व से नहीं, अपनाए जाने से है; और नए नियम में वहाँ «यहोवा» छापने की इसकी रीति, जहाँ लेखकों ने इब्रानी शास्त्र उद्धृत करते हुए κύριος लिखा था, उस आंदोलन से चार दशक पहले आ चुकी थी जिसने इस रीति को प्रसिद्ध किया। कॉपीराइट 1952 में समाप्त हो गया और तब से यह सार्वजनिक अधिकार-क्षेत्र में है।
hero.4=इस पाठक में इसके बारे में दो बातें उपयोग से पहले जान लेना ठीक है। ग्रीसबाख ने न प्रेरितों के काम 8:37 छापा और न लूका 17:36, इसलिए यहाँ दोनों में से कोई नहीं है; अंतर पाटकर हर बाद के पद को एक ऊपर खिसकाने के बजाय क्रमांकन उन दो स्थानों को खाली छोड़ देता है, ताकि कोई संदर्भ इस स्तंभ में उसी पद पर उतरे जिस पर बगल वाले में। और इसका कोई पूर्ववर्ती अभिलिखित नहीं है, इसलिए Diaglott के किसी पद के नीचे खोला गया वंश-पायदान मूल-भाषाओं के तल पर जाता है, किसी पुराने अंग्रेज़ी संस्करण पर नहीं।
hero.5=उस तल पर क्या छपता है, इस बारे में सटीक रहिए। जो यूनानी वह दिखाता है वह टेक्स्टस रिसेप्टस है — चिह्न पढ़ता है ≈ TR 1550, और वह ≈ पाठक का यह कहना है कि वह यूनानी का एक साक्षी प्रस्तुत कर रहा है, न कि वह पाठ जिससे यह संस्करण बना। विल्सन ने ग्रीसबाख से काम किया। जहाँ दोनों सहमत हैं, जैसे यूहन्ना 1:1 पर, वहाँ पायदान सचमुच वही शब्द दिखाता है जिनकी टीका हो रही है। जहाँ वे भिन्न हैं, वहाँ नहीं: ग्रीसबाख ने 1 यूहन्ना 5:7 के त्रित्ववादी उपवाक्य को अस्वीकार किया, इसलिए Diaglott में उसका कोई चिह्न नहीं, जबकि नीचे की टेक्स्टस रिसेप्टस पंक्ति उसे पूरा-पूरा वहन करती है। एक अंतर्पंक्तिक ग्रंथ में, जिसकी पूरी प्रतिज्ञा ही यह है कि यूनानी वहीं पृष्ठ पर मौजूद है, उद्धरण देने से पहले जानने योग्य यही एकमात्र रिक्ति है।

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=यह क्या है
fact.1.value=अधःपंक्ति टीका — यूनानी के नीचे छपी शब्दशः अंग्रेज़ी, विल्सन का सुपाठ्य अनुवाद नहीं
fact.2.label=संकलनकर्ता
fact.2.value=बेंजामिन विल्सन (1817–1900), स्वयंशिक्षित विद्वान और इलिनॉय के जेनेवा में अख़बार-संपादक
fact.3.label=यूनानी पाठ
fact.3.value=ग्रीसबाख का पुनरीक्षण, कोडेक्स वैटिकानुस (वैटिकन हस्तलेख 1209) से पाठभेदों सहित
fact.4.label=प्रकाशन
fact.4.value=1857 से खंडों में; 1864 में एक ही जिल्द में पूर्ण, न्यूयॉर्क के Fowler and Wells द्वारा
fact.5.label=कैसे छपा
fact.5.value=विल्सन ने हर प्लेट स्वयं विद्युत्-मुद्रण से बनाई और पहला संस्करण हस्तचालित प्रेस पर छापा
fact.6.label=ईश्वरीय नाम
fact.6.value=नए नियम में वहाँ «यहोवा» छापता है जहाँ लेखकों ने इब्रानी शास्त्र उद्धृत करते हुए κύριος लिखा — वही निर्णय जो [[ASV|American Standard Version]] ने पूरे पुराने नियम में लिया
fact.7.label=किसने अर्जित किया
fact.7.value=वॉच टावर बाइबल एंड ट्रैक्ट सोसाइटी ने, जिसने 1902 में चार्ल्स टेज़ रसेल के समय कॉपीराइट लिया, 1927 में टाइप फिर से बिठाया और 1960 के दशक तक इसे छापा
fact.8.label=अनुज्ञप्ति
fact.8.value=सार्वजनिक अधिकार-क्षेत्र — कॉपीराइट 1952 में समाप्त हुआ, और वॉच टावर के पुनर्मुद्रणों ने कोई नया नहीं जोड़ा
fact.9.label=दो पद अनुपस्थित
fact.9.value=प्रेरितों के काम 8:37 और लूका 17:36 ग्रीसबाख में नहीं हैं, इसलिए यहाँ भी नहीं; उनके क्रमांक पाटे नहीं, खाली छोड़े गए हैं, ताकि पाठ हर दूसरे संस्करण के साथ पद-दर-पद पंक्तिबद्ध रहे
fact.10.label=पायदान के नीचे की यूनानी
fact.10.value=[[TR|टेक्स्टस रिसेप्टस]], ≈ TR 1550 के रूप में दिखाया गया — यूनानी का एक साक्षी, विल्सन का आधार-पाठ नहीं, जो ग्रीसबाख का पुनरीक्षण था; दोनों यूहन्ना 1:1 पर सहमत हैं और 1 यूहन्ना 5:7 पर अलग हो जाते हैं
fact.11.label=इस संग्रह में
fact.11.value=पठन-बाइबिलों से अलग, अपने ही अंतर्पंक्तिक एवं अध्ययन-संस्करण खंड में रखा गया है, ताकि टीका कभी अनुवाद न समझी जाए; वंश-पायदानों में इसका कोई आधार-पाठ अभिलिखित नहीं, इसलिए पायदान सीधे मूल-भाषाओं के तल पर खुलता है
