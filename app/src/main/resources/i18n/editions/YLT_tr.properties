title=Young's Literal Translation — Bu baskı hakkında | Common Root
description=Robert Young'ın harfî Kutsal Kitap çevirisi; ilk kez 1862'de Edinburgh'da yayımlandı, 1887'de Young'ın kendisi, 1898'de de yayıncıları tarafından gözden geçirildi — İbranicenin ve Yunancanın zamanlarını, sözcük dizisini ve elden geldiğince sözcük dağarcığını, İngilizcenin güçlükle izleyebildiği yerlerde bile koruyan bir İngilizce Kutsal Kitap.
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=Robert Young (1822–1888) Edinburgh'lu bir matbaacı ve kitapçıydı. Matbaa çıraklığı sırasında İbraniceyi ve başka birkaç Doğu dilini kendi kendine öğrendi, 1856–1861 yılları arasında Hindistan'ın Surat kentinde bir misyon matbaasını yönetti ve her şeyden önce iki kitabıyla hatırlanır: Analytical Concordance to the Bible adlı konkordansı ve bu çeviri. Literal Translation'ı 1862'de Edinburgh'da, gözden geçirilmiş bir baskısını da 1887'de yayımladı. Ölümünden on yıl sonra, Ocak 1898'de yayıncıları, bir kez daha “mevcut çizgileri üzerinde” gözden geçirilmiş üçüncü bir baskı çıkardı; bu derlemedeki metin odur. Young Eski Antlaşma'yı kabul görmüş Masoretik İbrani metinden, Yeni Antlaşma'yı da Yunanca kabul görmüş metinden, Textus Receptus'tan çevirdi ve ikisinden de yeni bir metin oluşturmaya kalkışmayacağını açıkça söyledi: ona göre çeviri, metin eleştirisinden ayrı bir iştir ve ikisine birden ehil olan azdır.
hero.2=Bütün amaç, İngilizce okura özgün metnin dilbilgisini göstermektir. Young, özgün metnin geçmiş zaman kullandığı yerde şimdiki zaman veren ya da “an a for a the”, belirli tanımlık yerine belirsiz tanımlık koyan bir çevirinin sözel esini bir kenara ittiğini düşünüyor ve buna göre çeviriyordu. İbranice fiil biçimleri İngilizce zamanlar olarak aktarılır; bu yüzden anlatı çoğu kez şimdiki zamanda akar: Yaratılış “In the beginning of God's preparing the heavens and the earth —” diye açılır ve “and God saith, ‘Let light be;’ and light is.” diye sürer. Anlam için eklenen sözcükler köşeli ayraç içindedir: “Jehovah [is] my shepherd, I do not lack.” Elinden geldiğince her İbranice ya da Yunanca sözcüğe tek bir İngilizce karşılık vermeye çalıştı; bu yüzden İbranice olam ve Yunanca aiōn, “ever” ve “eternal” yerine “age” ve “age-during” olur; Matta 25:46'da doğrular “to life age-during” gider. Tanrı'nın adı Eski Antlaşma boyunca “Jehovah” olarak geçer.
hero.3=Kopyamız eksiksizdir: Yaratılış'tan Vahiy'e 66 kitap, Apokrifa olmadan, İngilizce bölüm ve ayet numaralamasıyla — her birinin başlığı ilk ayetine katılmış 150 mezmur ve 4. bölümle biten Malaki. Kabul görmüş metnin çevirisi olarak, sonraki eleştirel baskıların sorguladığı pasajları içerir: Markos'un uzun sonundan, bu metnin köşeli ayraç içine aldığı 1. Yuhanna 5:7'deki gökteki üç tanığa kadar; Elçilerin İşleri 8:37'nin tamamını da aynı biçimde ayraç içine alır. Bu okuyucuda tek başına durur. Derleme onun için hiçbir öncül kaydetmez; bu yüzden ayetlerinden birinin altında açılan bir soy basamağı doğrudan ≈ ile işaretli özgün dil tabanına düşer: Eski Antlaşma'da Leningrad Kodeksi'ne, Yeni Antlaşma'da Textus Receptus'a. Bu taban, aynı baskılarda olmasa da, Young'ın kendisinin çevirdiği metne, Masoretik İbraniceye ve kabul görmüş Yunancaya yakındır. Onun üzerinde duran hiçbir şey de kayıtlı değildir. Yine bu derlemede bulunan 2020 tarihli Literal Standard Version kendini Young'ın eserinin kapsamlı bir gözden geçirmesi olarak sunar, ama derleme bu bağı kaydetmez; bu yüzden LSV'nin altındaki basamaklar buraya çıkmaz. Hiçbir arayüz dili bu baskıda açılmaz; İngilizce arayüz New International Version'da açılır, bu baskıya ise çeviri ızgarasındaki kendi kartından ulaşılır.

