fact.5.value=Kesin olarak harfî: özgün metnin zamanları İngilizcenin tuhaf durduğu yerlerde bile korunur, bu yüzden anlatı çoğu kez şimdiki zamanda akar; elden geldiğince özgün metnin her sözcüğüne bir İngilizce sözcük, olam ve aiōn “age” ve “age-during” olur; anlam için eklenen sözcükler köşeli ayraç içinde; Tanrı'nın adı “Jehovah” olarak
fact.6.label=Yayımlanışı
