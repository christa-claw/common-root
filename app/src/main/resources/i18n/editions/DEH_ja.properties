# The narrative, one paragraph per key, in order.
hero.1=シャー・ワリーウッラー・デフラヴィー——正式名クトゥブ・アッ=ディーン・アフマド・イブン・アブド・アッ=ラヒーム・アル=ウマリー・アッ=ディフラヴィー——は、1703年2月21日、ムザッファルナガル近郊のプーラトに生まれ、父シャー・アブドゥッラヒームがラヒーミーヤ学院を創設したデリーで育った。七歳でクルアーンを記憶し、十五歳で当時の標準的な学業を終え、その二年後に父の後を継いで学院の長となったと伝えられる。1730年から1731年にかけてハッジを行い、その後メディナで一年ほどハディースを学んだ——主にアブー・ターヒル・アル=クルディー（アル=クラーニーとも表記される）のもとで、さらにムハンマド・ワフドゥッラー・アル=マーリキーとシャイフ・タージュ・アッ=ディーン・アル=カルイーのもとでも学んだ——その後1732年12月16日にデリーへ戻った。1762年8月20日（ヒジュラ暦1176年ムハッラム月29日）にデリーで没し、父の傍らに葬られた。他の著作には、一般に彼の最重要著作とされる『フッジャトゥッラー・アル=バーリガ』、『アル=ファウズ・アル=カビール』、そして彼をヒジャーズへと導いた旅についての自身の記録である『フトゥーフ・アル=ハラマイン』がある。
hero.2=『アル=アルバイーン』は、[[NAW|アン=ナワウィーの四十のハディース]]や[[QUD|四十の聖なるハディース]]と同じ「四十ハディース」（アルバイーニーヤート）の伝統を継ぐものであり、その発端は、宗教に関する四十のハディースを自らの共同体のために保持する者には審判の日に学者たちの中に地位が与えられると約するハディース——批評家の多くがそれ自体を弱い（ダイーフ）と評するハディース——と、アブドゥッラー・イブン・アル=ムバーラク（没797年）に帰せられる現存しない最初の編集にある。この書はこれら二作品と、何を集めているかという点で異なる：より広い文献から主題や格付けによって選ばれたハディースではなく、英訳本の出版社はこれを、シャー・ワリーウッラーがメディナで自らの師から直に聞いたと述べた四十のハディースであり、それぞれが彼がそれを受け取った伝承の鎖（サナド）とともに保存されているものと説明する——その学びの年から残る個人的な伝承の記録であり、息子の語るところでは、デリーに戻ってからの彼の教え方と書き方を変えたものである。
hero.3=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-dehlawi 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]、[[IBM|スナン・イブン・マージャ]]、[[MAL|ムワッタ・マーリク]]、[[NAW|アン=ナワウィーの四十のハディース]]、[[QUD|四十の聖なるハディース]]、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=シャー・ワリーウッラー・デフラヴィー（1703–1762年）
fact.3.label=名称
fact.3.value=アラビア語で『アル=アルバイーン』（「四十」）として知られる。Forty Hadith of Shah Wali-Allah と題された現代英訳版が2015年にTurath Publishingより刊行され、Safaruk Zaman Chowdhuryが翻訳した
fact.4.label=編纂地と時期
fact.4.value=シャー・ワリーウッラーが1730年から1731年にかけてハッジを行い、メディナで一年ほどハディースを学んだ後——主にアブー・ターヒル・アル=クルディー（アル=クラーニーとも表記される）のもとで——1732年12月16日にデリーへ戻った後
fact.5.label=方法
fact.5.value=英訳本の出版社によれば、四十のハディースはそれぞれ、シャー・ワリーウッラーが自らの師から直に聞いたと述べたものであり、それを受け取った伝承の鎖（サナド）とともに保存されている——主題や格付けによる選別ではなく、個人的な伝承の記録である
fact.6.label=位置づけ
fact.6.value=インド亜大陸から出た「四十ハディース」（アルバイーニーヤート）のコレクションとして最も知られるもの。その最初の、現存しない例がアブドゥッラー・イブン・アル=ムバーラク（没797年）に帰せられ、[[NAW|アン=ナワウィーの四十のハディース]]や[[QUD|四十の聖なるハディース]]も生んだこの類を継承する
fact.7.label=ハディースの数
fact.7.value=40
fact.8.label=このコーパスでは
fact.8.value=1巻・40件の番号付きハディース
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-dehlawi 版から取られ、アラビア語の対訳として示される。データセットは翻訳者を不明としており、Turath Publishing／Chowdhuryの訳か独立した訳かは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語本文はパブリックドメインの古典テキストである。英訳のライセンスは依然確認中である
