title=シャー・ワリーウッラー・デフラヴィーの四十のハディース — この版について | Common Root
description=シャー・ワリーウッラー・デフラヴィーの四十のハディース：18世紀デリーの学者が、メディナで学んだ一年の間に自らの師から直に聞いたと述べる四十のハディースを、その伝承の鎖とともに保存したもの——インド亜大陸から出たこの種のコレクションとして最も知られるもの。
heroHeading=シャー・ワリーウッラー・デフラヴィーの四十のハディース
