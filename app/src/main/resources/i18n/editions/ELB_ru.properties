title=Elberfelder 1905 — Об этом издании | Common Root
description=Эльберфельдская Библия: немецкий перевод, начатый в 1855 году Джоном Нельсоном Дарби, Карлом Брокхаусом и Юлиусом Антоном фон Позеком, один из первых немецких, отошедших от Textus Receptus, — здесь в печати 1905 года.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Название — это место. Эльберфельд, город в долине Вуппера, с 1929 года часть Вупперталя, и именно там была сделана большая часть работы. Начали её трое: Джон Нельсон Дарби, Карл Брокхаус и Юлиус Антон фон Позек, все связанные с немецкой ветвью движения братьев. Новый Завет вышел в 1855 году, Псалмы в 1859-м, Ветхий Завет в 1871-м — изданные не под чьим-либо именем, а как переведённые с подлинника “некоторыми христианами”.
hero.2=Отличал её греческий, лежавший под ней. Едва ли не всякая немецкая Библия, ходившая тогда, всё ещё стояла на Textus Receptus; эта порвала с ним и вобрала чтения Синайского и Ватиканского кодексов по мере того, как эти рукописи выходили в свет в середине девятнадцатого века. Ветхий Завет сделан с масоретского еврейского. Принцип перевода был — точность прежде изящества: немецкий, который следует за еврейским и греческим так близко, что становится жёстким, каждое слово, добавленное ради смысла, помечено как добавленное, и никаких заголовков разделов вовсе, на том основании, что в подлинниках их нет. Её и поныне числят среди тех немецких версий, что ближе всего стоят к лежащему под ними слову.
hero.3=Это печать 1905 года, первая, набранная антиквой, а не фрактурой; по мелкости этого шрифта она известна как Perlbibel. Новым переводом она не была. До самой смерти Рудольфа Брокхауса в 1932 году Эльберфельдскую пересматривали и правили от печати к печати — Альфред Роша отвечал за Ветхий Завет, Эмиль Дёнгес за Новый, — так что дата называет здесь печать внутри движущегося текста, а не законченное издание. То, что продаётся сегодня под именем Эльберфельдской, обыкновенно опять-таки другое: комиссия из того же движения потратила двадцать пять лет на пересмотр и выпустила его в 1975 и 1985 годах. Тот пересмотр убрал “Jehova” из Ветхого Завета и поставил на его место “HERR”. Здешний текст всё ещё печатает “Jehova”, что ставит его рядом с American Standard Version и рядом с собственной французской Библией Дарби.
hero.4=Место её в этом собрании стоит несколько особняком. Для немецкого в читалке нет отобранного издания по умолчанию, поэтому немецкий интерфейс открывает первую немецкую Библию каталога, а это она — впереди обеих Лютеровых Библий по алфавитному порядку и ни по чему иному. В ступенях родословия она стоит одна. Два Лютера образуют цепь: 1912 год выправлен из 1545-го, а 1545-й держится на греческом и еврейском, тогда как у Эльберфельдской не записано никакого источника, потому что Эльберфельдской 1871 года, из которой она вышла путём постоянных исправлений, в этом собрании нет. Ступень под стихом Эльберфельдской ведёт поэтому прямо на помеченный знаком ≈ пол исходных языков, хотя французская Библия Дарби, стоящая через одну колонку, и есть здесь её ближайшая родня.

