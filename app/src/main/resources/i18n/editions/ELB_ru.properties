fact.1.label=Язык
fact.1.value=немецкий
fact.2.label=Начали
fact.2.value=Джон Нельсон Дарби, Карл Брокхаус и Юлиус Антон фон Позек
fact.3.label=Первое издание
fact.3.value=Новый Завет 1855, Псалмы 1859, Ветхий Завет 1871, в Эльберфельде — городе, с 1929 года входящем в Вупперталь, и причине того, что перевод зовётся так, как зовётся
fact.4.label=Эта печать
fact.4.value=печать Р. Брокхауса 1905 года — первая, набранная антиквой, а не фрактурой, и по мелкости этого шрифта известная как Perlbibel
fact.5.label=Новый Завет с
fact.5.value=критического греческого: одна из первых немецких Библий, порвавших с [[TR|Textus Receptus]], вобравшая чтения Синайского и Ватиканского кодексов по мере того, как эти рукописи выходили в печать
fact.6.label=Ветхий Завет с
fact.6.value=масоретского еврейского, с отступлениями в немногих местах
fact.7.label=Род перевода
fact.7.value=ориентированный на исходный текст и намеренно буквальный — слова, добавленные ради смысла, помечены как добавленные, и заголовки разделов не добавлялись, коль скоро в подлинниках их нет
fact.8.label=Божественное имя
fact.8.value=печатает “Jehova” по всему Ветхому Завету; пересмотр 1985 года заменил его на “HERR”. То же решение, что и в [[ASV|American Standard Version]] и во [[DBY|французской Библии Дарби]]
fact.9.label=Сестринская версия
fact.9.value=[[DBY|Darby 1885]] — французская Библия из того же круга, на тех же основаниях
fact.10.label=Правилась до
fact.10.value=1932 года, от печати к печати — Альфред Роша отвечал за Ветхий Завет, Эмиль Дёнгес за Новый
fact.11.label=Не та же книга, что
fact.11.value=Revidierte Elberfelder 1975 и 1985 годов, плод двадцатипятилетнего пересмотра и иной текст, нежели этот
fact.12.label=Лицензия
fact.12.value=общественное достояние
fact.13.label=В этом собрании
fact.13.value=Библия, которую открывает немецкий интерфейс: для немецкого нет отобранного издания по умолчанию, поэтому читалка берёт первую немецкую Библию каталога, и ELB идёт впереди [[LUT1545|Luther 1545]] и [[LUT1912|Luther 1912]] не по чему иному, как по своему сокращению. В ступенях родословия источник не записан — Эльберфельдской 1871 года, из которой она вышла путём постоянных исправлений, в собрании нет, — так что ступень открывается на пол исходных языков. Года она не несёт ни с той, ни с другой стороны: каталожная карточка оставляет столбец года пустым, и вручную составленный список ступенных годов её тоже не знает, так что метка ступени для ELB показывает одно сокращение и ничего больше — случай тихий, тогда как [[DRA|Дуэ-Реймсская Библия]] — случай громкий, и там эти два списка противоречат друг другу публично
