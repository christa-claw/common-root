title=Сунан ан-Насаи — Об этом издании | Common Root
description=Сунан ан-Насаи: сборник хадисов, который Ахмад ибн Шуайб ан-Насаи сократил из своего более крупного труда «ас-Сунан аль-Кубра» и который Ибн Хаджар отметил как содержащий наименьшее число слабых хадисов среди Шести книг после двух Сахихов.
heroHeading=Сунан ан-Насаи
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Абу Абд ар-Рахман Ахмад ибн Шуайб ибн Али ан-Насаи родился около 214–215 года хиджры (829–830 года н. э.) в Насе, городе Хорасана, который сегодня лежит на территории Туркменистана. Он начал путешествовать в поисках хадисов примерно в пятнадцать лет, обучаясь сначала у Кутайбы ибн Саида — у которого провёл в Баглане более года — а затем продолжил путь через Ирак, Хиджаз, Сирию и Египет, обучаясь у таких учёных, как Исхак ибн Рахвайх и Абу Дауд ас-Сиджистани, составитель [[ABD|Сунана Абу Дауда]]. Он поселился в Египте, преподавал там и стал известен как Хафиз аль-Хадис; позднейшие биографы расходятся во мнениях о том, учился ли он непосредственно у Мухаммада аль-Бухари, поскольку аль-Мизи утверждал, что эти двое никогда не встречались. Путешествуя из Каира в Мекку в конце жизни, он остановился в Дамаске, где, по традиционному рассказу, произнесённая им проповедь о достоинствах соратников Пророка вызвала враждебность толпы на фоне антиалидских настроений города; он умер вскоре после этого, в 303 году хиджры (915 году н. э.), от полученных там ран. Рассказы расходятся о месте его погребения — между Сафой и Марвой в Мекке, по одному преданию, или в Рамле в Палестине, по другому.
hero.2=Из примерно пятнадцати приписываемых ему трудов шесть касаются хадисов. Самый крупный из них, «ас-Сунан аль-Кубра», он позже сократил сам в более короткое собрание, известное как «Сунан ас-Сугра» («меньший Сунан») или «аль-Муджтаба» («избранное») — именно эту книгу сегодня и подразумевают под простым названием Сунан ан-Насаи. Кто именно сделал этот отбор и по чьей просьбе, в источниках, использованных для этой страницы, не зафиксировано. В нём ан-Насаи упорядочил хадисы по правовой теме, как это сделали [[ABD|Абу Дауд]] и [[TIR|ат-Тирмизи]]. Правовед Ибн Хаджар аль-Аскалани позднее отметил, что в нём, после двух Сахихов, меньше всего слабых (да'иф) хадисов и ненадёжных передатчиков среди Шести книг, и что в нём нет ни одного подделанного (мавду') хадиса.
hero.3=Суннитская традиция относит Сунан ан-Насаи к Шести книгам (Кутуб ас-Ситта) наряду с [[BUK|Сахихом аль-Бухари]], [[MUS|Сахихом Муслима]], [[ABD|Сунаном Абу Дауда]] и [[TIR|Джами ат-Тирмизи]], а также шестой книгой, спор о которой идёт между Сунаном Ибн Маджи и другими претендентами. Где именно он стоит среди четырёх собраний Сунан, является предметом споров, а не решённым вопросом: некоторые источники называют его третьим по значимости из шести, сразу после двух Сахихов, тогда как собственные страницы этого собрания о [[ABD|Сунане Абу Дауда]] и [[TIR|Джами ат-Тирмизи]] отражают более распространённый порядок, ставящий книгу Абу Дауда на третье место. Число приводимых для него хадисов колеблется сходным образом: 5 758, включая повторяющиеся сообщения, по одной широко цитируемой цифре для аль-Муджтабы, против 5 765 в издании, из которого исходит это собрание, — источники не согласуют эти два числа.
hero.4=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-nasai сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]], [[MUS|Сахиха Муслима]], [[ABD|Сунана Абу Дауда]], [[TIR|Джами ат-Тирмизи]] и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

