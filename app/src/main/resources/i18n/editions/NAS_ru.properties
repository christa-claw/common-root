fact.1.label=Язык
fact.1.value=классический арабский, с английским переводом под каждым хадисом в читалке
fact.2.label=Составитель
fact.2.value=Абу Абд ар-Рахман Ахмад ибн Шуайб ан-Насаи (215–303 года хиджры / 830–915 года н. э.)
fact.3.label=Название
fact.3.value=известен как Сунан ан-Насаи, Сунан ас-Сугра («меньший Сунан») или аль-Муджтаба («избранное») — более позднее собрание, отобранное из собственного крупного труда ан-Насаи «ас-Сунан аль-Кубра»
fact.4.label=Составлен
fact.4.value=собран в путешествиях по Ираку, Хиджазу, Сирии и Египту, начавшихся примерно в пятнадцать лет; ан-Насаи поселился в Египте и умер в Дамаске в 303 году хиджры (915 году н. э.)
fact.5.label=Метод
fact.5.value=упорядочен по правовой теме, как и [[ABD|Сунан Абу Дауда]] и [[TIR|Джами ат-Тирмизи]]; сокращён из более крупного «ас-Сунан аль-Кубра» ан-Насаи процессом, который использованные здесь источники не фиксируют
fact.6.label=Положение
fact.6.value=относится к суннитским Шести книгам (Кутуб ас-Ситта); некоторые источники ставят его третьим, после [[BUK|Сахиха аль-Бухари]] и [[MUS|Сахиха Муслима]], тогда как страницы этого собрания о [[ABD|Сунане Абу Дауда]] и [[TIR|Джами ат-Тирмизи]] отражают более распространённый порядок, ставящий книгу Абу Дауда на третье место, — точный ранг является предметом споров, а не решённым вопросом
fact.7.label=Число хадисов
fact.7.value=5 758, включая повторяющиеся сообщения, по одной широко цитируемой цифре для аль-Муджтабы; издание-источник этого собрания нумерует 5 765 — источники не согласуют эти два числа
fact.8.label=В этом собрании
fact.8.value=52 книги и 5 765 пронумерованных хадисов
fact.9.label=Английский перевод
fact.9.value=взят из издания eng-nasai сервиса fawazahmed0/hadith-api, показан как сопровождение под арабским текстом; от какого опубликованного перевода он происходит, со стороны этого собрания пока не установлено
fact.10.label=Лицензия
fact.10.value=арабский матн — классический текст, находящийся в общественном достоянии; лицензия английского перевода пока на проверке
