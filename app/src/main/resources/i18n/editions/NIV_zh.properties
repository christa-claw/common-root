title=New International Version — 关于本译本 | Common Root
description=New International Version：本阅读器默认打开的英文圣经，由圣经翻译委员会（Committee on Bible Translation）直接据原文译出，1978年首次译完——本语料库收录其2011年文本。
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=它始于一个教派的不满。1955年，商人霍华德·朗（Howard Long）与牧师彼得·德·杨（Peter De Jong）一同向归正教会（Christian Reformed Church）施压，要求出版一部用当代英语写成的圣经，1957年归正教会批准成立委员会研究此事。全美福音派协会（National Association of Evangelicals）同年也自行启动了类似的计划。两个团体联手：一个联合委员会于1964年发出翻译会议的邀请，会议于1965年8月在伊利诺伊州帕洛斯高地（Palos Heights）的三一基督学院（Trinity Christian College）召开，决议组成“十五人常设委员会”以推进工作。这个常设委员会后来成为圣经翻译委员会。1967年，纽约圣经公会（New York Bible Society）——后改名为Biblica——接手主办，雇用了负责翻译的学者。
hero.2=此译本并非出自任何更早的英文圣经。King James Version、Revised Version、American Standard Version 与 World English Bible 在本语料库中构成一条修订链，而 New International Version 则直接从希伯来文、亚兰文与希腊文重新译出：旧约据马索拉希伯来文本译出，并参考死海古卷、七十人译本等早期证据；新约据联合圣经公会（United Bible Societies）与内斯特莱—阿兰德（Nestle-Aland）版本所代表的折衷式鉴定希腊文本译出——而非此处日内瓦圣经与 King James 所据的公认文本。十五人委员会历时约十年，发展为汇集多个英语国家、众多教派逾百名学者的计划。他们宣称的目标，是既忠实于原文的准确性，又不读来像逐字照搬的译本——这种平衡通常归类为动态对等，介于严格直译与松散意译之间。
hero.3=新约最先问世，1973年；全书继之，于1978年10月27日完成；1984年又作了一次轻微修订。2011年文本改动更大，一次更全面的修订同时取代了1984年版与2005年的 Today's New International Version，将两者一并退役，改以此后沿用至今的单一文本取而代之。本语料库所收即为这一2011年文本——与目录卡片所示的年份相同。Biblica, Inc. 始终持有版权；美国由 Zondervan 出版，英国则由 Hodder & Stoughton 出版。
hero.4=它在本阅读器中的地位是一种安静的居中。将界面设为英文，打开的正是它——本语料库中 King James Version 与 Revised Version 的页面都各自说明自己并非此本，而是指向此本，称其为读者会切换离开、而非默认落脚之处。因为它并未修订任何底本，本语料库未为其记录母本：在 New International Version 经文下打开谱系阶梯，会直接落到以≈标记的原文语言底层，与 Berean Standard Bible 相同——但有一点值得留意的差异。该底层的希腊文见证是公认文本，而公认文本并非此译本新约实际据以译出的文本——该底层代表的是泛指的"原文希腊文"，并非这一委员会自己使用的工作底本。还有一点使它与大多数英文邻本不同：它是授权使用，并非公共领域，地位与 New American Standard Bible 2020 相同，而 Berean Standard Bible、日内瓦圣经、King James Version、Revised Version 与 World English Bible 皆可自由复制。

