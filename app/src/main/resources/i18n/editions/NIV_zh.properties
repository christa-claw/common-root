fact.1.label=语言
fact.1.value=英语
fact.2.label=受命缘起
fact.2.value=归正教会与全美福音派协会的联合委员会，于1965年8月在伊利诺伊州帕洛斯高地的三一基督学院召开会议
fact.3.label=编译者
fact.3.value=圣经翻译委员会——起初十五名学者，后来扩展到逾百名，来自多个英语国家与众多教派，历时约十年
fact.4.label=旧约据
fact.4.value=马索拉希伯来文本，并参考死海古卷、七十人译本等早期证据
fact.5.label=新约据
fact.5.value=联合圣经公会与内斯特莱—阿兰德版本所代表的折衷式鉴定希腊文本——而非此处[[GNV|日内瓦圣经]]与[[KJV|King James Version]]所据的[[TR|公认文本]]
fact.6.label=翻译取向
fact.6.value=在直译的准确性与自然、合乎语感的英文之间取得平衡，不偏执于任何一端——通常归类为动态对等；是据原文重新译出的新译本，并非对 King James 一系的修订
fact.7.label=出版
fact.7.value=新约1973年；全书1978年10月27日完成；1984年作轻微修订；现行且修订更全面的文本为2011年版，将1984年版与2005年的 Today's New International Version 一并退役
fact.8.label=出版者
fact.8.value=持有版权的 Biblica, Inc.；美国由 Zondervan 出版，英国由 Hodder & Stoughton 出版
fact.9.label=授权
fact.9.value=授权使用，并非公共领域。在无须书面许可的情况下，最多可引用500节经文，但不得构成圣经的完整一卷，亦不得超过作品的25%，并须附版权声明；超出此限则须获得 Biblica 的许可
fact.10.label=在本语料库中
fact.10.value=英文界面默认打开的圣经——[[KJV|King James Version]]与[[RV|Revised Version]]两页都在此说明自己并非此本。谱系阶梯中未为其记录母本：NIV 经文下的阶梯会直接落到以≈标记的原文语言底层，与[[BSB|Berean Standard Bible]]相同——只是该底层的希腊文见证是[[TR|公认文本]]，而这并非此译本新约实际据以译出的文本。它授权使用而非公共领域，与 New American Standard Bible 2020 地位相同，由此与公共领域的邻本如[[KJV|King James Version]]、[[RV|Revised Version]]与[[WEB|World English Bible]]区别开来
