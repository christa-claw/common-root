title=Luther Bibel 1545 — Tietoja tästä laitoksesta | Common Root
description=Lutherin Ausgabe letzter Hand: vuoden 1545 Wittenbergin Raamattu, viimeinen laitos jonka Martti Luther itse ehti tarkistaa, ja teksti josta tuli standardi hänen kuolemansa jälkeen.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Ei Lutherin ensimmäinen Raamattu vaan hänen viimeisensä. Wartburgissa tehty Uusi testamentti ilmestyi 1522 ja koko Raamattu 1534; hän jatkoi tarkistamista vielä vuosikymmenen, ja Hans Lufftin Wittenbergissä vuonna 1545 painama laitos on viimeinen, jonka Luther itse vei loppuun. Saksaksi sitä kutsutaan nimellä Ausgabe letzter Hand, viimeisen käden laitos. Hän kuoli seuraavana helmikuuna, ja tästä tekstistä tuli mittapuu, jota vasten myöhemmät Luther-Raamatut asetettiin.
hero.2=Hän työskenteli alkukielistä eikä latinasta: Uuteen testamenttiin Erasmuksen painettu kreikka, Vanhaan masoreettinen heprea, ja joukko wittenbergiläisiä kollegoita väittelemässä vaikeista kohdista. Tulos teki saksalle suunnilleen sen, minkä vuoden 1642 Biblia tekisi suomelle vuosisataa myöhemmin. Kieli, jossa oli monta murretta ja vähän vakiintunutta proosaa, sai yhden rekisterin jota kaikki saattoivat lukea, ja nykyinen kirjakieli kasvoi siitä.
hero.3=Kaksi ketjua kohtaa tässä. Luther Bibel 1912 on suoraan tämän laitoksen yläpuolella sen tarkistuksena. Samoin on Biblia 1642 kolme askelmaa ylempänä suomalaisessa linjassa, koska Turun komitea työskenteli Luther avoinna edessään. Sen alla tikkaat saavuttavat pohjan — Textus Receptus kreikkaa varten, Westminster Leningrad Codex hepreaa varten — ja nuo askelmat ovat umpinaisia eivätkä ≈-merkittyjä, koska Erasmuksen kreikka ja masoreettinen heprea ovat sitä, mistä Luther todella käänsi, eivät jälkikäteen asetettuja todistajia.

