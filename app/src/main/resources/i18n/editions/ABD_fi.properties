title=Sunan Abi Dawud — Tietoja tästä laitoksesta | Common Root
description=Sunan Abi Dawud: hadith-kokoelma, jonka Abu Dawud al-Sijistani kokosi islamilaisen oikeusopin kannalta merkityksellisistä kertomuksista noin 500 000 tutkimansa joukosta ja järjesti aiheittain lain mukaan — sunni-islamin Kuudesta kirjasta kolmas.
heroHeading=Sunan Abi Dawud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani syntyi noin vuonna 202 AH (817–818 jaa.) Sijistanissa, Khurasanin maakunnassa, joka sijaitsee nykyisin Iranin ja Afganistanin rajalla. Hän saapui Bagdadiin kahdeksantoistavuotiaana ja matkusti sen jälkeen Khurasanin, Irakin, Hidjazin, Syyrian, Egyptin ja Nisapurin halki hadith-kertomuksia etsimässä, opiskellen noin 300 oppineen johdolla, joihin kuului myös Ahmad ibn Hanbal. Hän asettui Basraan, jossa hän kuoli perjantaina shawwal-kuussa vuonna 275 AH (889 jaa.) 73-vuotiaana, ja hänet haudattiin oikeusoppinut Sufyan al-Thawrin viereen.
hero.2=Hänen kiinnostuksensa oli nimenomaan lainopillinen: toisin kuin Sahih al-Bukhari ja Sahih Muslim, jotka käsittelevät yhtä lailla oppia, historiaa ja lakia, Abu Dawud rakensi Sununsa fiqh-aiheisten hadithien varaan, järjestäen sen kirjoiksi, jotka etenevät lainoppineen tarvitsemien aiheiden mukaan — puhdistautumisesta ja rukouksesta zakatiin, paastoon, avioliittoon, perintöön ja tuomarin toimeen. Hänen oppilaansa Ibn Dasan mukaan hän tutki aineistoa koostaessaan noin 500 000 hadith-kertomusta. Hän asetti myös toisenlaisen vaatimustason kuin al-Bukhari ja Muslim: siinä missä he hyväksyivät vain täysin aidoksi arvioimansa hadithit, Abu Dawud sisällytti joitakin mursal-, heikkoja (da'if) ja jopa munkar-kertomuksia silloin, kun mikään vahvempi hadith ei käsitellyt kyseistä lainopillista kohtaa, selittäen menetelmänsä kirjeessä Mekan asukkaille ja merkitsemällä itse heikommat arvioinnit sen sijaan, että olisi jättänyt ne merkitsemättä.
hero.3=Sunnimuslimien perinne lukee Sunan Abi Dawudin kolmanneksi Kuudesta kirjasta, Sahih al-Bukharin ja Sahih Muslimin jälkeen; sitä, mille sijalle se, Jami` at-Tirmidhi, Sunan an-Nasa'i ja Sunan Ibn Majah tarkalleen asettuvat toisiinsa nähden jäljellä olevien neljän joukossa, on kauan kiistelty ratkaisematta. Kirjalle annetut luvut ovat ristiriidassa toistensa kanssa tavalla, jota kukaan ei näytä selittäneen: Ibn Dasan luku Abu Dawudin valitsemille hadetheille on 4 800, kun taas nykyaikainen standardilaitos — toimittanut Muhammad Muhyiddin Abd al-Hamid ja painettu Kairossa 1935 — numeroi 5 274. Tämän aineiston oma luku, 43 kirjaa ja 5 274 hadithia, vastaa tarkalleen tätä Kairon laitoksen numerointia, mikä asettaa sen tässä vakaammalle pohjalle kuin Sahih al-Bukharin tai Sahih Muslimin, joiden kohdalla tämän aineiston luku ei vastaa yhtäkään yksittäistä painoperinnettä.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-abudawud-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää Sahih al-Bukharissa, Sahih Muslimissa ja Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

