fact.1.label=Kieli
fact.1.value=klassista arabiaa, englanninkielinen käännös näkyy lukijassa jokaisen hadithin alla
fact.2.label=Kokoaja
fact.2.value=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani (202–275 AH / 817–889 jaa.)
fact.3.label=Nimi
fact.3.value=tunnetaan yksinkertaisesti nimellä Sunan Abi Dawud; toisin kuin [[BUK|Sahih al-Bukharilla]], sille ei ole kirjattu erillistä muodollista täyttä nimeä
fact.4.label=Koottu
fact.4.value=koottu matkoilla Khurasanin, Irakin, Hidjazin, Syyrian, Egyptin ja Nisapurin halki; Abu Dawud asettui ja kuoli Basrassa
fact.5.label=Menetelmä
fact.5.value=järjestetty lainopillisen aiheen (fiqh) mukaan eikä kertojan tai ajan mukaan; sisältää joitakin heikkoja, mursal- ja munkar-hadetheja, kun mikään vahvempi kertomus ei käsittele lainopillista kohtaa, selvästi sellaisiksi merkittyinä
fact.6.label=Asema
fact.6.value=sunni-islamin Kuudesta kirjasta (Kutub al-Sittah) kolmas, [[BUK|Sahih al-Bukharin]] ja [[MUS|Sahih Muslimin]] jälkeen; sen sija jäljellä olevien kolmen kirjan joukossa on kiistanalainen eikä ratkaistu
fact.7.label=Hadith-määrä
fact.7.value=4 800 Abu Dawudin oppilaan Ibn Dasan mukaan valittua, tai 5 274 Muhammad Muhyiddin Abd al-Hamidin standardilaitoksessa, Kairo 1935; lähteet eivät sovita näitä kahta lukua yhteen
fact.8.label=Tässä aineistossa
fact.8.value=43 kirjaa ja 5 274 numeroitua hadithia — vastaa tarkalleen vuoden 1935 Kairon laitoksen numerointia
fact.9.label=Englanninkielinen käännös
fact.9.value=otettu fawazahmed0/hadith-api:n eng-abudawud-laitoksesta, näytetään arabiankielisen tekstin rinnalla; mistä julkaistusta käännöksestä se on peräisin, ei ole tämän aineiston puolesta vielä varmistettu
fact.10.label=Käyttöoikeus
fact.10.value=arabiankielinen matn on klassinen, vapaasti käytettävä teksti; englanninkielisen käännöksen käyttöoikeus on edelleen tarkistuksessa
