fact.2.label=किसके आदेश से
fact.2.value=La Habra, कैलिफ़ोर्निया का The Lockman Foundation — वही गैर-लाभकारी संस्था जो New American Standard Bible और अपने ही पूर्ववर्ती La Biblia de las Américas (1986) के पीछे है
fact.3.label=किसने तैयार किया
fact.3.value=बारह सदस्यों की एक Lockman संशोधन समिति, जिसने La Biblia de las Américas के अनुवाद से काम किया, जो स्वयं बाईस अनुवादकों और सलाहकारों के लगभग पंद्रह वर्षों के कार्य का परिणाम है
fact.4.label=पुराना नियम किससे
fact.4.value=रूडोल्फ़ किटेल की Biblia Hebraica, जिसमें मृत सागर की पांडुलिपियों को भी देखा गया है, जो La Biblia de las Américas के अपने पाठ्य आधार से चली आई है
fact.5.label=नया नियम किससे
fact.5.value=एबरहार्ड नेस्ले का Novum Testamentum Graece, सामान्यतः 27वाँ संस्करण, जहाँ किसी पाठ को प्रभावित करने वाले अतिरिक्त पांडुलिपि प्रमाणों पर ध्यान दिया गया है
fact.6.label=अनुवाद का प्रकार
fact.6.value=औपचारिक समानता, La Biblia de las Américas और New American Standard Bible जैसी ही शब्द-दर-शब्द पद्धति — यह नया अनुवाद नहीं, बल्कि पूरे लातिन अमेरिका में बोली जाने वाली परिचित, आधुनिक स्पैनिश में एक रजिस्टर संशोधन है, जिसमें "vosotros" जैसे कास्टीलियन रूपों को "ustedes" से बदला गया और सूत्रबद्ध "y" तथा "sucedió que" जैसी संरचनाओं को, जिन्हें पहले के पाठ ने इब्रानी से शब्दशः अपनाया था, पुनः संयोजित किया गया
fact.7.label=प्रकाशन
fact.7.value=The Lockman Foundation द्वारा 2005 में प्रतिलिप्याधिकार प्राप्त; कुछ सूचियों ने इसके बाद इसे फाउंडेशन के 2020 के New American Standard Bible संशोधन के साथ समूहित किया है, परंतु 2005 ही इसकी अपनी प्रतिलिप्याधिकार सूचना में दी गई तारीख़ बनी हुई है
fact.8.label=लाइसेंस
fact.8.value=लाइसेंस-प्राप्त, सार्वजनिक डोमेन नहीं। 2005 का उल्लेख करने वाली प्रतिलिप्याधिकार सूचना के साथ, लिखित अनुमति के बिना किसी भी रूप में 500 पदों तक उद्धृत किया जा सकता है, बशर्ते वे कोई संपूर्ण बाइबल पुस्तक न बनाएँ या उद्धृत करने वाली रचना के एक चौथाई से अधिक न हों; इससे अधिक किसी भी उपयोग के लिए The Lockman Foundation की अनुमति आवश्यक है
fact.9.label=इस संग्रह में
fact.9.value=उसी फाउंडेशन की [[NASB|New American Standard Bible]] की तरह लाइसेंस-प्राप्त, सार्वजनिक डोमेन नहीं। स्पैनिश इंटरफ़ेस डिफ़ॉल्ट रूप से [[RVR09|Reina Valera 1909]] पर खुलता है, जो एक असंबंधित परंपरा का सार्वजनिक-डोमेन पाठ है और एक सदी अधिक पुराना है, जबकि इस संस्करण तक इसके अपने कार्ड से पहुँचा जाता है। वंशावली की सीढ़ियों में इसके लिए कोई मूल स्रोत दर्ज नहीं है: यह La Biblia de las Américas का एक रजिस्टर संशोधन है, जो स्वयं इस संग्रह में नहीं रखा गया है, इसलिए NBLA के किसी पद के नीचे की सीढ़ी सीधे ≈ चिह्नित मूल-भाषा तल तक उतरती है।
