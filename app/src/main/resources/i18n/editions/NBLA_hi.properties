title=Nueva Biblia de las Américas — इस संस्करण के बारे में | Common Root
description=Nueva Biblia de las Américas: The Lockman Foundation द्वारा अपनी La Biblia de las Américas का लातिन अमेरिकी स्पैनिश में संशोधन, जो वही शब्द-दर-शब्द पद्धति अमेरिका महाद्वीपों में बोली जाने वाली रोज़मर्रा की स्पैनिश में लाता है।
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas, The Lockman Foundation का लातिन अमेरिकी स्पैनिश संस्करण है, जो फाउंडेशन की पहले की 1986 की La Biblia de las Américas पर आधारित है — जो स्वयं बाईस अनुवादकों और सलाहकारों के लगभग पंद्रह वर्षों के कार्य का परिणाम है, और उसी शब्द-दर-शब्द अनुवाद दर्शन का अनुसरण करती है जो बाद में अंग्रेज़ी में New American Standard Bible के रूप में आया। हिब्रू और यूनानी से नया अनुवाद करने के बजाय, NBLA एक रजिस्टर संशोधन है: बारह सदस्यों की एक Lockman समिति ने La Biblia de las Américas की अधिक कास्टीलियन स्पैनिश को, पूरे अमेरिका में बोली जाने वाली परिचित, आधुनिक स्पैनिश में बदला, द्वितीय पुरुष बहुवचन रूप "vosotros" को अधिक प्रचलित "ustedes" से बदला, और सूत्रबद्ध "y" तथा "sucedió que" जैसी संरचनाओं को सरल किया जिन्हें पहले के पाठ ने इब्रानी कथा शैली से शब्दशः अपनाया था। The Lockman Foundation की अपनी उद्धरण-अनुमति सूचना पूर्ण पाठ को 2005 की तारीख़ देती है।
hero.2=पाठ का आधार सीधे La Biblia de las Américas से चला आता है: पुराना नियम रूडोल्फ़ किटेल की Biblia Hebraica पर आधारित है, जिसमें मृत सागर की पांडुलिपियों को भी देखा गया है, और नया नियम सामान्यतः एबरहार्ड नेस्ले के Novum Testamentum Graece के 27वें संस्करण पर आधारित है, जहाँ किसी विशेष पाठ को प्रभावित करने वाले अतिरिक्त पांडुलिपि प्रमाणों पर ध्यान दिया गया है। कुछ पुस्तक विक्रेता और बाइबल सॉफ़्टवेयर सूचियाँ अब Nueva Biblia de las Américas को फाउंडेशन के 2020 के New American Standard Bible संशोधन के साथ समूहित करती हैं, दोनों को एक ही शब्दवादी परंपरा के अंग्रेज़ी और स्पैनिश पाठकों के लिए एक मिलान युग्म के रूप में प्रस्तुत करती हैं; परंतु अनुवाद स्वयं, फाउंडेशन की अपनी सूचनाओं में, 2005 से बाद की कोई प्रतिलिप्याधिकार तारीख़ नहीं रखता।
hero.3=यहाँ स्पैनिश इंटरफ़ेस डिफ़ॉल्ट रूप से Reina Valera 1909 पर खुलता है, जो एक पूर्णतः भिन्न अनुवाद परंपरा का सार्वजनिक-डोमेन पाठ है और एक सदी अधिक पुराना है; Nueva Biblia de las Américas के बजाय अनुवाद-सारणी में अपने स्वयं के कार्ड से पहुँचा जाता है। यह इस संस्करण के साथ बहुत कम पाठ्य इतिहास साझा करता है, परंतु New American Standard Bible के साथ बहुत कुछ — वही फाउंडेशन, वही औपचारिक समानता पद्धति, और वही लाइसेंस-प्राप्त, सार्वजनिक-डोमेन-नहीं, स्थिति, जो लिखित अनुमति के बिना 500 पदों तक उद्धृत करने की अनुमति देती है, बशर्ते वे कोई संपूर्ण पुस्तक न बनाएँ या उद्धृत करने वाली रचना के एक चौथाई से अधिक न हों। वंशावली की सीढ़ियों में इसके लिए कोई मूल स्रोत दर्ज नहीं है: La Biblia de las Américas, जिस पाठ का यह संशोधन है, स्वयं इस संग्रह में नहीं रखा गया है, इसलिए NBLA के किसी पद के नीचे की सीढ़ी सीधे ≈ चिह्नित मूल-भाषा तल तक उतरती है।

