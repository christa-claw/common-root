title=雷纳-瓦莱拉1909 — 关于此版本 | Common Root
description=雷纳-瓦莱拉1909：将卡西奥多罗·德·雷纳 1569 年的西班牙文——经西普里亚诺·德·瓦莱拉 1602 年修订者——带入二十世纪的修订本，也是本阅读器为西班牙文所开的版本。
heroHeading=雷纳-瓦莱拉1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=西班牙文的新教圣经，在少见的程度上只是一部书。卡西奥多罗·德·雷纳避宗教裁判所而离开西班牙，在流亡中完成译事，1569 年在巴塞尔刊行——即《熊圣经》，得名于扉页上的那只熊。西普里亚诺·德·瓦莱拉曾在塞维利亚城外的同一座修道院，也作了同样的出逃，费了数年通读其书，1602 年在阿姆斯特丹刊出成果，即《水罐圣经》。此后每一部雷纳-瓦莱拉，都是那部书的修订之修订；一个带连字符的名字所纪念的，正是两位从未同处一室工作的人。
hero.2=这就是 1909 年的修订本，由大英圣书公会与美国圣经公会共同主持编订，沿用者通常称之为 Versión Antigua，即「旧译本」。它承接更早的 1862 年修订本，而在修订通常要改动之处反倒谨慎：雷纳与瓦莱拉已难以读懂的地方，字句往前推；未难读之处，则听其自然。旧约立于马所拉希伯来文，新约立于公认经文，与雷纳当初所立者相同。
hero.3=约有五十年之久，它几乎独占西班牙语新教世界，直到 1960 年的修订本将其取代，而它也从未真正消失。它已无版权，1960 年本则不然；因此凡付印、上网、引用而无须任何人许可的雷纳-瓦莱拉，正是此本。全书之所以能置于本语料库、又可从中复制而出，缘由亦在于此。
hero.4=在本阅读器中，西班牙文有五部圣经，而界面所开的是这一部。这是经过挑选的取舍，而非目录的偶然：不像阿拉伯文或中文，阅读器所开的是该语言中仅有的一部圣经；西班牙文有别的选择，而此本是从中取定的。谱系阶梯中未为它记录母本，因此在某节之下展开的阶梯会径直落到以 ≈ 标记的原文语言底层。此处底层比通常更贴近实情，其故与阿拉伯文圣经相同：它所供的希腊文正是公认经文，而雷纳的新约正是据公认经文译出的。

