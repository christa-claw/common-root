title=Luther Bibel 1545 — Su questa edizione | Common Root
description=L'Ausgabe letzter Hand di Lutero: la Bibbia di Wittenberg del 1545, l'ultima edizione che Martin Lutero rivide di persona, e il testo che divenne il riferimento dopo la sua morte.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Non la prima Bibbia di Lutero, ma l'ultima. Il Nuovo Testamento che fece alla Wartburg apparve nel 1522 e la Bibbia completa nel 1534; continuò a rivedere per un altro decennio, e l'edizione che Hans Lufft stampò a Wittenberg nel 1545 è l'ultima che Lutero portò a termine di persona. Il tedesco la chiama Ausgabe letzter Hand, l'edizione di ultima mano. Morì nel febbraio seguente, e questo testo divenne la misura sulla quale furono regolate le Bibbie luterane successive.
hero.2=Lavorò dagli originali e non dal latino: il greco stampato di Erasmo per il Nuovo Testamento, l'ebraico masoretico per l'Antico, con una cerchia di colleghi di Wittenberg per discutere i passi difficili. Ciò che ne venne fece per il tedesco più o meno quello che la Biblia del 1642 avrebbe fatto per il finlandese un secolo dopo. Una lingua di molti dialetti e di poca prosa stabilita ricevette un registro unico che tutti potevano leggere, e la lingua scritta moderna ne è nata.
hero.3=Qui si incontrano due catene. La Luther Bibel 1912 sta immediatamente sopra questa edizione, essendone una revisione. Lo stesso fa la Biblia 1642, tre pioli più in alto nella linea finlandese, perché il collegio di Turku lavorava con Lutero aperto. Sotto, la scala raggiunge il fondo — il Textus Receptus per il greco, il Codice di Leningrado per l'ebraico — e quei pioli sono pieni e non contrassegnati con ≈, perché il greco di Erasmo e l'ebraico masoretico sono ciò da cui Lutero tradusse davvero, non testimoni collocati a posteriori.

