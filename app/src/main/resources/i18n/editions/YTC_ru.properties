title=Yorumsuz Türkçe Çeviri — Об этом издании | Common Root
description=Yorumsuz Türkçe Çeviri (YTC): современная турецкая Библия, переведённая с World English Bible Исмаилом Серинкеном в сотрудничестве с eBible.org, под лицензией CC BY-ND 4.0 — турецкий текст, на который по умолчанию открывается этот корпус.
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri — буквально «перевод без комментариев» или «без толкования» на турецкий язык — это современная турецкая Библия, завершённая Исмаилом Серинкеном в сотрудничестве с eBible.org, с авторскими правами, датированными 2023–2025 годами. Само название указывает на метод: простая, слово за словом передача текста, сознательно исключающая пояснительные глоссы и толковательный пересказ, предпочитающая прозрачность по отношению к исходному тексту сглаженной идиоматике.
hero.2=Этот исходный текст, честно говоря, представляет собой английский язык, а не иврит, арамейский или греческий: собственная страница авторских прав перевода описывает его как переданный с World English Bible, что делает его вторичным переводом, а не выполненным непосредственно с языков оригинала, в отличие от большинства других Библий в этом собрании. Common Root сначала искал открытое издание исторической турецкой Библии 1941 года (Kitabı Mukaddes), которая уже достаточно стара, чтобы находиться в общественном достоянии в Турции, однако пригодного цифрового источника для неё не нашлось; Yorumsuz Türkçe Çeviri оказался единственной свободно лицензированной турецкой Библией в доступе. Текст этого собрания взят из USFM-дистрибутива eBible.org, каталогизированного там как turytc.
hero.3=Решения этого перевода носят скорее современный, чем традиционный характер: личное имя Бога передаётся как Yahve, а не привычным турецким «RAB» или «Yehova», со ссылкой на Исход 3:14-15, а имя Иисуса передаётся как Yeşua, а не привычным турецким İsa, тогда как прочие имена собственные оставлены в их обычной форме. Перевод следует стандартному протестантскому канону из 66 книг, без неканонических книг.
hero.4=Это единственная турецкая Библия в этом собрании, поэтому турецкий интерфейс по умолчанию открывается на ней.

