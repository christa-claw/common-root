fact.5.value=допускает хадис лишь при непрерывной цепи передатчиков, которых аль-Бухари считал надёжными; по преданию, он отобрал сборник из примерно 600 000 проверенных им сообщений
fact.6.label=Положение
fact.6.value=первая из суннитских Шести книг (Кутуб ас-Ситта); вместе с [[MUS|Сахихом Муслима]] образует «ас-Сахихайн» — два сборника, стоящих по авторитетности сразу после Корана
fact.7.label=Число хадисов
fact.7.value=7 563 с повторами по широко используемой нумерации Абд аль-Баки, либо 2 602 без повторов по подсчёту Ибн Хаджара аль-Аскалани; печатные издания расходятся как в нумерации глав, так и хадисов
fact.8.label=В этом собрании
fact.8.value=98 книг и 7 589 пронумерованных хадисов — форма самого исходного набора данных, а не воспроизведение какой-либо одной печатной нумерации
fact.9.label=Английский перевод
