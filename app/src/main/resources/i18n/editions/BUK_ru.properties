title=Сахих аль-Бухари — Об этом издании | Common Root
description=Сахих аль-Бухари: сборник хадисов, который суннитский ислам ставит по авторитетности на второе место сразу после Корана; Мухаммад аль-Бухари составил его из примерно 600 000 проверенных им сообщений, допуская лишь те, что передавались непрерывной цепью надёжных передатчиков.
heroHeading=Сахих аль-Бухари
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Мухаммад ибн Исмаил аль-Бухари собирал этот сборник главным образом в двух мечетях — Заповедной мечети в Мекке и мечети Пророка в Медине — и завершил его в своём родном городе Бухаре около 232 года хиджры (846 года н. э.); примерно последние два десятилетия жизни он провёл, продолжая дорабатывать его во время своих путешествий. Полное название сборника, аль-Джами' аль-Мусанад ас-Сахих аль-Мухтасар мин умур Расул Аллах ва-сунанихи ва-айямихи, обычно сокращают до Сахих аль-Бухари — «достоверный [сборник] аль-Бухари». Сам аль-Бухари, по преданию, говорил, что отобрал его из примерно 600 000 проверенных им сообщений, допуская сообщение лишь тогда, когда оно, по его оценке, передавалось непрерывной цепью надёжных передатчиков вплоть до первоисточника.
hero.2=Именно эта требовательность объясняет тот вес, которым обладает книга. Сахих аль-Бухари считается первым из суннитских Шести книг (Кутуб ас-Ситта), и вместе с Сахихом Муслима — его ближайшим соперником по методу и репутации — эти два сборника называют ас-Сахихайн, «две достоверные [книги]». Большинство суннитских учёных ставят сборник аль-Бухари выше любой другой книги хадисов и по авторитетности — сразу после самого Корана, хотя меньшинство учёных отдавало первенство Сахиху Муслима. Материал расположен по темам, а не по передатчикам или хронологии (учёные называют такое построение мусаннаф), и разделён на книги (кутуб), которые охватывают путь от ритуального очищения и молитвы через торговлю и брак до жизни прежних пророков и признаков Последнего часа.
hero.3=Сколько именно хадисов содержит книга, зависит от того, какая печатная традиция их считает. Чаще всего сегодня приводят цифру 7 563 — она восходит к нумерации, которую текст получил в XX веке от издателя Мухаммада Фуада Абд аль-Баки, и она заново считает хадис каждый раз, когда он повторяется под другой главой; без повторов Ибн Хаджар аль-Аскалани насчитал 2 602. Другие учёные предлагали и иные итоговые числа. Собственное число этого собрания — ещё одно, третье по счёту: 98 книг и 7 589 пронумерованных хадисов, что просто отражает форму того цифрового издания, из которого они взяты, а не претензию на точное воспроизведение какой-либо одной печатной нумерации.
hero.4=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-bukhari сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

