fact.3.value=Known in Arabic as Al-Arba'in ("The Forty"); a modern English edition titled Forty Hadith of Shah Wali-Allah was published by Turath Publishing in 2015, translated by Safaruk Zaman Chowdhury
fact.4.label=Compiled
fact.4.value=After Shah Waliullah returned to Delhi on 16 December 1732, following a hajj made in 1730–31 and roughly a year studying hadith in Medina, chiefly under Abu Tahir al-Kurdi (also rendered al-Kurani)
fact.5.label=Method
fact.5.value=According to its English publisher, each of the forty hadith is one Shah Waliullah said he heard directly from his own teacher, kept together with the chain of transmission (sanad) by which he received it — a personal record of transmission rather than a selection made by theme or canonical rank
fact.6.label=Standing
fact.6.value=The best-known "forty hadith" (arba'iniyyat) collection from the Indian subcontinent; continues a genre whose first known, now-lost example is credited to Abdullah ibn al-Mubarak (d. 797) and which also produced [[NAW|al-Nawawi's Forty Hadith]] and [[QUD|Forty Hadith Qudsi]]
