title=古兰经 — 萨布鲁科夫 — 关于本版本 | Common Root
description=戈尔吉·萨布鲁科夫的俄译本，1878年在喀山出版，通常被认为是第一部直接由阿拉伯语译出而非经由法语或英语转译的俄译古兰经——在本语料库中，这是显示于奥斯曼版阿拉伯文本之下的俄语对照译本。
heroHeading=古兰经 — 萨布鲁科夫
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=戈尔吉·谢苗诺维奇·萨布鲁科夫（1803年-1880年）接受东正教神职培训，1826年毕业于奥伦堡神学院，1830年毕业于莫斯科神学院。此后二十年间，自1830年至1849年，他在萨拉托夫神学院讲授历史与东方语言——19世纪40年代中期（1840年前后），未来的激进作家尼古拉·车尔尼雪夫斯基便是他的学生之一——之后于1849年转入喀山神学院传教学部，在那里讲授东方语言及古典语言直至1862年。
hero.2=俄译古兰经的历史可追溯至1716年，当时彼得·波斯特尼科夫奉彼得大帝之命译出一部，但那是据安德烈·杜·里耶的法译本译出，而非阿拉伯语原文；1792年阿列克谢·科尔马科夫的译本同样如此，是据乔治·塞尔的英译本译出。萨布鲁科夫的译本于1878年在喀山出版，题为《Коран, законодательная книга мохаммеданского вероучения》（《古兰经：穆罕默德信仰的立法书》），通常被认为是第一部直接由阿拉伯语原文译出的俄译古兰经，是他多年在喀山讲授东方语言的成果。
hero.3=次年，他又增补了一卷配套注释，《Приложения к переводу Корана》（1879年），此后又写了两项与之相关的研究：《Сведения о Коране》（《关于古兰经的资料》，1884年）以及更早些年关于基督教与伊斯兰教对真主诸名教义之比较的一篇论文（1873年）。此后，他的译本一直是流传较广的俄译本之一，即便后来的译本——其中包括伊格纳季·克拉奇科夫斯基身后出版的译本——在苏联及后苏联时期的学术使用中更为人知。
hero.4=此处经由alquran.cloud的ru.sablukov版本数字化的内容，在本语料库中作为[[Q-AR|奥斯曼版阿拉伯文本]]的俄语对照译本提供，与1930年[[Q-EN|皮克索尔]]及1934年[[Q-YA|优素福·阿里]]的英译本并列——这三种译本是对现有译本的一次调查认定为确属可自由使用的译本，阿拉伯语之外，每种语言各占其一。

