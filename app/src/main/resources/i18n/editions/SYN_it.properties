fact.13.label=Audio
fact.13.value=L'intera Bibbia — ogni capitolo di entrambi i Testamenti — letta dalla voce neurale di sintesi vocale Microsoft Azure ru-RU-DmitryNeural, sintetizzata un capitolo alla volta anziché versetto per versetto, così che la prosa conservi il suo ritmo di frase naturale.
fact.14.label=Limiti dell'audio
fact.14.value=Generato automaticamente e non letto da una persona, perciò la pronuncia di nomi e termini non è stata verificata da un redattore; la riga di lettura segue il testo ed evidenzia ogni versetto solo nella modalità di visualizzazione "Versetti" — nelle altre modalità l'audio continua comunque, ma senza evidenziazione.
