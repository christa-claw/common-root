title=Bibbia Sinodale — Informazioni su questa edizione | Common Root
description=La Bibbia Sinodale russa del 1876: iniziata nel 1813 dalla Società Biblica Russa, portata a termine dalle quattro accademie teologiche ortodosse sotto la guida del metropolita Filaret, e ancora oggi la Bibbia che la maggior parte dei russofoni intende semplicemente come "la Bibbia".
heroHeading=Bibbia Sinodale
readerHref=/reader?c1.src=syn

hero.1=Il progetto iniziò nel 1813, quando la Società Biblica Russa, appena fondata, intraprese con l'appoggio dello zar Alessandro I una traduzione in russo destinata ad affiancare la Bibbia slavo-ecclesiastica, non a sostituirla. Nel giro di pochi anni apparve un Nuovo Testamento. Il clero conservatore vide in una Bibbia nel russo parlato una minaccia all'autorità del testo slavo-ecclesiastico, e nel 1826 Nicola I sciolse la Società e fermò il lavoro per tre decenni.
hero.2=La traduzione riprese solo sotto Alessandro II. Nel 1858 il Santo Sinodo autorizzò una nuova versione russa e affidò il lavoro alle accademie teologiche di Mosca, San Pietroburgo, Kazan' e Kiev, con il metropolita Filaret (Drozdov) di Mosca come redattore guida e finale. Il Nuovo Testamento, tradotto dal testo greco a stampa noto come Textus Receptus, apparve nel 1862. L'Antico Testamento fu il punto più difficile da risolvere: Filaret insisteva per risalire, oltre il testo slavo-ecclesiastico, fino all'ebraico stesso, incontrando l'opposizione di chi restava fedele al fondamento greco del testo slavo, e il permesso formale del Sinodo di tradurre dal testo masoretico arrivò solo in quello stesso 1862, quando comunque la maggior parte dell'Antico Testamento era già stata tradotta su quella base.
hero.3=La Bibbia completa — Antico e Nuovo Testamento riuniti per la prima volta in un solo volume in questo nuovo russo anziché in slavo ecclesiastico — apparve nel 1876, dalla Tipografia Sinodale, da cui viene il nome comune della traduzione. Il suo Antico Testamento non risultò puramente ebraico: dove la Settanta custodita dalla tradizione slava divergeva dal testo masoretico, la lettura greca veniva spesso mantenuta comunque, di solito come variante tra parentesi, cosicché il libro finito conserva un debito reale verso la Bibbia greca che stava dietro all'antico testo slavo.
hero.4=Da allora non ha più avuto un rivale serio. Lettori ortodossi, cattolici, battisti e di altre confessioni protestanti in Russia fanno tutti riferimento, in una forma o nell'altra, allo stesso testo, e il suo stile ha segnato il russo letterario quanto la Bibbia di Re Giacomo ha segnato l'inglese. In questo corpus comprende 66 libri, il canone protestante e non quello ortodosso più ampio, ed è l'unica Bibbia russa qui presente, perciò un'interfaccia in russo si apre su di essa.

