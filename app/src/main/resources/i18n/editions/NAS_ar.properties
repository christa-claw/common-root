fact.1.label=اللغة
fact.1.value=العربية الكلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=أبو عبد الرحمن أحمد بن شعيب النسائي (215–303 هـ / 830–915 م)
fact.3.label=الاسم
fact.3.value=يُعرف بسنن النسائي، أو سنن النسائي الصغرى، أو المجتبى ("المنتخب") — وهو انتخاب لاحق من كتابه الأكبر السنن الكبرى
fact.4.label=مكان وزمان التأليف
fact.4.value=جُمع في رحلات عبر العراق والحجاز والشام ومصر بدأت نحو سن الخامسة عشرة؛ استقر النسائي في مصر وتوفي في دمشق سنة 303 هـ (915 م)
fact.5.label=المنهج
fact.5.value=مرتب بحسب الموضوع الفقهي، كما [[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]]؛ انتُخب من السنن الكبرى الأكبر للنسائي بعملية لم تسجلها المصادر المرجوع إليها هنا
fact.6.label=المكانة
fact.6.value=من كتب السنة الستة عند أهل السنة؛ يجعله بعض المصادر ثالثها، بعد [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]]، في حين تعكس صفحتا [[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] في هذه المجموعة الترتيب الأكثر شيوعاً الذي يضع كتاب أبي داود ثالثاً — والترتيب الدقيق مسألة جدل لا حسم
fact.7.label=عدد الأحاديث
fact.7.value=5,758 حديثاً، بما فيها المكرر، بحسب رقم شائع للمجتبى؛ وطبعة المصدر التي تعتمدها هذه المجموعة تُرقّم 5,765 — والرقمان لم يُوفَّق بينهما في المصادر
fact.8.label=في هذه المجموعة
fact.8.value=52 كتاباً و5,765 حديثاً مرقَّماً
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-nasai في fawazahmed0/hadith-api، وتظهر مرافقة تحت العربية؛ ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة منشورة تعود
fact.10.label=الرخصة
fact.10.value=المتن العربي هو النص الكلاسيكي الملك العام؛ أما رخصة الترجمة الإنجليزية فما زالت قيد المراجعة
