title=سنن النسائي — عن هذه الطبعة | Common Root
description=سنن النسائي: مجموعة الأحاديث التي اختصرها أحمد بن شعيب النسائي من كتابه الأكبر السنن الكبرى، وخصّها ابن حجر بأن فيها أقل قدر من الأحاديث الضعيفة بين الكتب الستة بعد الصحيحين.
heroHeading=سنن النسائي
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد أبو عبد الرحمن أحمد بن شعيب بن علي النسائي نحو سنة 214–215 هـ (829–830 م) في نسا، بلدة من خراسان تقع اليوم في تركمانستان. بدأ الرحلة في طلب الحديث نحو الخامسة عشرة من عمره، فدرس أولاً على قتيبة بن سعيد — ومكث عنده في بغلان أكثر من سنة — ثم تابع رحلته عبر العراق والحجاز والشام ومصر، ودرس على علماء منهم إسحاق بن راهويه وأبو داود السجستاني، مؤلف [[ABD|سنن أبي داود]]. واستقر في مصر حيث درّس وعُرف بـ"حافظ الحديث"؛ واختلف من ترجم له فيما بعد في هل درس فعلاً على محمد البخاري مباشرة، حيث ذهب المزي إلى أن الرجلين لم يتلاقيا قط. وفي رحلته من القاهرة نحو مكة في أواخر عمره، توقف في دمشق، حيث أثارت — بحسب الرواية التقليدية — محاضرة ألقاها في فضائل صحابة النبي حشداً معادياً وسط ما كانت عليه المدينة من نزعة معادية للعلويين؛ فتوفي بعد ذلك بقليل، سنة 303 هـ (915 م)، متأثراً بجروح أصابته هناك. وتختلف الروايات في مكان دفنه — بين الصفا والمروة بمكة بحسب رواية، أو في الرملة بفلسطين بحسب أخرى.
hero.2=من بين نحو خمسة عشر عملاً تُنسب إليه، تتعلق ستة منها بالحديث. وأكبرها، السنن الكبرى، اختصره هو نفسه بعد ذلك في منتخب أصغر عُرف بسنن النسائي الصغرى أو المجتبى ("المنتخب") — وهو الكتاب الذي يُراد اليوم بالاسم المبسّط سنن النسائي. ولم يُسجَّل في المصادر التي رجعت إليها هذه الصفحة من قام بهذا الانتخاب بالضبط ولا بطلب من. ورتّب النسائي الأحاديث فيه بحسب الموضوع الفقهي، كما فعل [[ABD|أبو داود]] و[[TIR|الترمذي]]. وقد خصّه الحافظ ابن حجر العسقلاني فيما بعد بأن فيه، بعد الصحيحين، أقل قدر من الأحاديث الضعيفة والرواة غير الموثوقين بين الكتب الستة، وليس فيه حديث موضوع واحد.
hero.3=تضع التقاليد السنية سنن النسائي بين الكتب الستة، إلى جانب [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]]، وكتاب سادس اختُلف فيه بين سنن ابن ماجه وكتب أخرى. أما ترتيبه الدقيق بين كتب السنن الأربعة فمسألة جدل لا حسم: فبعض المصادر تجعله ثالث الكتب الستة، بعد الصحيحين مباشرة، في حين تعكس صفحتا [[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] في هذه المجموعة الترتيب الأكثر شيوعاً الذي يضع كتاب أبي داود في المرتبة الثالثة. وعدد الأحاديث المعطى له يتفاوت بنفس الطريقة: 5,758 حديثاً، بما فيها المكرر، بحسب رقم شائع للمجتبى، في حين تُرقّم الطبعة التي تستمد هذه المجموعة منها موادها 5,765 حديثاً — والرقمان لم يُوفَّق بينهما في المصادر.
hero.4=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-nasai في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

