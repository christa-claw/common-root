title=Open New Arabic Version — About This Edition | Common Root
description=Biblica's Open New Arabic Version: a modern Arabic Bible, copyright 1988, 1997 and 2012, released under a Creative Commons licence that allows it to be shared, adapted and printed with credit.
heroHeading=Biblica Open New Arabic Version
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=This is a modern Arabic translation, a different text from [[SVD|Smith & Van Dyck]] rather than another copy of it. It is published by Biblica, Inc., whose copyright notice carries three years: 1988, 1997 and 2012. The text's own copyright page gives its older name, Ketab El Hayat Majani.
hero.2=What sets it apart in this reader is its licence. Biblica released it as an "open" text under the Creative Commons Attribution-ShareAlike 4.0 licence: anyone may copy it, adapt it and print it, provided Biblica is credited and anything built from it is shared on the same terms. The credit line Biblica asks for is: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". Most modern translations are not offered this way, which is why it is here.
hero.3=The licence has one condition worth knowing. The unmodified text may carry the Biblica name. A rearranged text may not: the Event order and Writing order editions on this site put the books in a different sequence, which we treat as adaptations, so they say that the text has been rearranged and do not use Biblica's name as a title.
hero.4=The file is fully vowelled. One detail of its source: Acts 15:25 and 26 are printed as a single verse, so the corpus holds them together under verse 25 and has no separate verse 26 there.

