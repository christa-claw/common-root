title=Free Bible Version — Bu baskı hakkında | Common Root
description=Free Bible Version: Jonathan Gallagher'ın İbraniceden ve Nestle–Aland Yunancasından çevirdiği modern bir İngilizce Kutsal Kitap; herkes yeniden basabilsin diye aynı koşullarla paylaşma lisansıyla yayımlanmıştır.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Bu çeviri bir telif sayfası yüzünden vardır. Neredeyse her modern İngilizce Kutsal Kitap böyle bir sayfa taşır ve orada genellikle şu yazar: birkaç yüz ayet sorulmadan alıntılanabilir, tam bir kitap için yazılı izin gerekir, metnin tamamını yayımlamaksa telif ödemek demektir. Bir kilise sitesi ya da bir ses kaydı için iş orada bitebilir. Free Bible Version, önünde hiçbir engel bulunmayan baskı olsun diye yapıldı.
hero.2=Eser, ilahiyat doktorasını St Andrews'da almış olan Jonathan Gallagher'ındır; yayımlayan ise kâr amacı gütmeyen Free Bible Ministry'dir. Yeni Antlaşma, Kutsal Kitap derneklerinin kullandığı eleştirel metin olan Nestle–Aland Yunancasından, Eski Antlaşma ise İbraniceden gelir. Projenin kendi anlattığı yöntemi söylemeye değer, çünkü alışılmış yöntem değildir: çeviri, özgün metinden yalnızca sözlüklerle yapılır ve ancak ondan sonra mevcut çevirilerle karşılaştırılır — kaynak olarak değil, yineleme ve yanlışa karşı bir denetim olarak. Ne daha eski bir İngilizce Kutsal Kitap'ın gözden geçirilmesidir ne de daha yenilerinin bir bileşimi. Bildirdiği amaç, argodan ve günün moda deyişlerinden kaçınan çağdaş bir İngilizcedir; belirli bir inanç topluluğunun görüşleri yönünde çevirmeyi de reddeder.
hero.3=Asıl mesele lisanstır. Creative Commons Atıf-AynıLisanslaPaylaş 4.0: kopyalayın, basın, bir siteye koyun, uyarlayın — yeter ki baskının adı anılsın, değişiklikler belirtilsin ve ondan kurulan her şey aynı koşullarla çıksın. Bu, kamu malı olmaktan başka bir pazarlıktır: özgürlük elden bırakılmaz, ileriye aktarılır. Aynı lisansı bu derlemedeki İspanyolca Versión Biblia Libre de taşır ve o da aynı hizmetten gelir.
hero.4=Okur için bundan iki şey çıkar. Katalog yılını boş bırakır, çünkü proje gözden geçirmelerini yaptıkça yayımlar; bu derlemenin bağlandığı tarihli bir baskı yoktur ve bir tane uydurmak boşluktan beter olurdu. Ayrıca bir Free Bible Version ayetinin altında açılan basamak ≈ TR'yi, yani Textus Receptus'u gösterir; kaynak metin olarak değil, tanık olarak işaretlenmiştir. Bu çeviri ondan yapılmadı. O yalnızca derlemenin şu an Yunanca olarak sunabildiği şeydir — burada henüz eleştirel bir baskı yoktur — ve aynı vekil, aynı sebeple New International Version'ın, New American Standard Bible'ın ve Berean Standard Bible'ın altında da belirir.

