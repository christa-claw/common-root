fact.10.label=Bu derlemede
fact.10.value=66 kitabın tamamı. İngilizce, lisanslı [[NIV|New International Version]] ile açılır; bu yüzden bu çeviri [[BSB|Berean Standard Bible]] ve [[WEB|World English Bible]] ile birlikte, okurun yanında dışarı taşıyabileceği İngilizcedir
