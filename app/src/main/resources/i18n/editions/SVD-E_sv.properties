title=Smith & Van Dyck (eBible-text) — Om denna utgåva | Common Root
description=Smith och Van Dycks arabiska bibel från 1865, i den helt vokaliserade elektroniska text som eBible.org publicerar som public domain, från American Bible Societys källfil.
heroHeading=Smith & Van Dyck — den helt vokaliserade texten
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Detta är samma översättning som [[SVD|Smith & Van Dyck]] — den arabiska bibel som Eli Smith påbörjade i Beirut och Cornelius Van Dyck fullbordade 1865, tillsammans med de arabiska lärde Butrus al-Bustani, Nasif al-Yaziji och Yusuf al-Asir — satt från en annan elektronisk fil. Översättningen är densamma; filen är skälet till att denna utgåva finns.
hero.2=En bibel från 1865 är fri för vem som helst, men en elektronisk avskrift av den är också någons arbete, och Van Dyck-texten cirkulerar på nätet i många kopior av osäkert ursprung. Några erbjuds med ett anspråk på upphovsrätt till själva transkriptionen. En text vars ursprung inte kan spåras kan inte tryckas med tillförsikt, så denna utgåva använder en kopia vars ursprung kan spåras: den som eBible.org publicerar, förklarad som public domain, som anger den syriska missionen som översättare och American Bible Society som bidragsgivare av källan. Filen är daterad 2020-08-03.
hero.3=Den är helt vokaliserad. Varje ord bär sina korta vokaler och de övriga läsmärkena, där den andra Van Dyck-texten i den här läsaren till största delen saknar vokalisering. Det gör den långsammare att sätta och lättare att läsa högt, och en vokaliserad sida kräver mer utrymme mellan raderna, så ett tryckt exemplar av denna utgåva blir längre än samma text ovokaliserad.
hero.4=Det är utgåvan att välja när frågan är om texten får tryckas. För läsning på skärm fungerar båda Van Dyck-texterna lika bra.

