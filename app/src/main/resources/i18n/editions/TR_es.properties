title=Textus Receptus — Acerca de esta edición | Common Root
description=El Textus Receptus: el Nuevo Testamento griego impreso que está detrás de Lutero, Tyndale y la Versión del Rey Jacobo, editado por primera vez por Erasmo en 1516 y bautizado por una línea publicitaria de 1633.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Toda Biblia de la Reforma que hay en esta colección desciende de un libro impreso en Basilea en 1516. Erasmo de Róterdam quería llevar el Nuevo Testamento griego a la imprenta antes que nadie, y trabajó deprisa — a partir del puñado de manuscritos tardíos que pudo alcanzar en Basilea, ninguno especialmente antiguo. Donde a su ejemplar del Apocalipsis le faltaba la última hoja, tradujo los seis últimos versículos de vuelta al griego desde la Vulgata latina. Esos versículos entraron en la imprenta y siguieron allí durante cuatro siglos.
hero.2=El texto se corrigió y se reeditó durante un siglo después — por el propio Erasmo, luego por Robert Estienne en París y Teodoro de Beza en Ginebra. La cuarta edición de Estienne, de 1551, hizo algo cuyas consecuencias van mucho más allá de la erudición: partió el texto en versículos numerados. Son los números de versículo que aún se imprimen en casi todas las Biblias del mundo, y los que este lector permite desactivar.
hero.3=El nombre llegó el último, y llegó de la publicidad. En 1633 los hermanos Elzevir de Leiden anunciaron su edición con la línea de que el lector tenía ahora “el texto recibido por todos” — textus receptus. Era la afirmación de un librero, no un veredicto académico, pero se quedó. Cuando en el siglo XIX aparecieron manuscritos más antiguos, editores desde Tischendorf hasta Westcott y Hort levantaron sobre ellos textos nuevos, y las traducciones modernas siguen esos. El Textus Receptus permanece aquí por la razón que lo hace importante: es lo que Lutero, Tyndale, los traductores de Ginebra y los comités del Rey Jacobo tenían realmente delante, de modo que es el texto contra el cual hay que leer sus palabras.

