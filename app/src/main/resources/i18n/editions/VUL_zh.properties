title=拉丁文武加大译本 — 关于此版本 | Common Root
description=拉丁文武加大译本：耶柔米的翻译，382 年受命、约 405 年完成，一千年间承载着西欧的圣经，也是古腾堡印出的第一部书。
heroHeading=拉丁文武加大译本
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=到 4 世纪末，西方流传的拉丁文福音书彼此矛盾，一本抄本与另一本不同，教宗达玛稣一世便请他的秘书耶柔米把它们理清。耶柔米从修订入手，最终为此投入二十多年，其中大部分时间在伯利恒，并做出了一件无人要求的事。
hero.2=真正关键的决定，是把旧约从希伯来文而非教会一向使用的希腊文七十士译本译出。耶柔米称这一原则为“hebraica veritas”——希伯来的真实——而它极具争议：奥古斯丁写信给他，担心会众会因熟悉的经文在脚下改变而生乱。耶柔米仍然照做。结果便是：偏偏一部拉丁文圣经，比最初基督徒所读的希腊文圣经更贴近希伯来原文。
hero.3=它成了西欧一千年的圣经，这段年月比此前此后任何译本都长。威克里夫据它译成英文，杜埃-兰斯译本的译者也据它工作——因此本语料库中的杜埃-兰斯译本是它的直系后裔，那一版本的谱系阶梯正指回这里。它也是第一部以活字印成的大部头书：古腾堡约在 1455 年于美因茨排印的圣经，正是这个文本。

