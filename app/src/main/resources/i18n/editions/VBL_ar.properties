title=Versión Biblia Libre — عن هذه الطبعة | Common Root
description=Versión Biblia Libre: كتاب مقدس إسباني من Free Bible Ministry، ترجمه جوناثان غالاغر وشيلي باريوس دي أفيلا بوصفه الشقيقة الإسبانية لـFree Bible Version الإنجليزية، ورُخّص بحرية لأي استخدام.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — أي "النسخة الحرة من الكتاب المقدس" — هي الشقيقة الإسبانية لـFree Bible Version الإنجليزية، وقد نشرها الناشر نفسه، Free Bible Ministry، وهي منظمة غير ربحية مقرّها لوريل في ولاية ميريلاند. وتُنسب عهدها الجديد إلى المترجمين جوناثان غالاغر وشيلي باريوس دي أفيلا، بمشاركة غوستابو سانابريا وريبيكا بولداس بصفتهما مساهمين، وتحمل حقوق نشر مؤرّخة بين عامي 2018 و2020 باسم غالاغر وباريوس دي أفيلا. وهي، شأنها شأن شقيقتها الإنجليزية، قائمة لإزالة صفحة حقوق النشر عائقاً أمام الاستخدام: فيجوز لأي شخص نسخ النصّ وطباعته ونشره على الإنترنت أو تعديله، دون إتاوات ودون طلب إذن.
hero.2=يوثّق التمهيد المنشور بوضوح أساس العهد الجديد — المترجم مباشرة عن النصّ اليوناني لنستله–آلاند، النصّ النقدي الذي تستعمله جمعيات الكتاب المقدس — لكنه لا يسمّي على حدة نصّاً مصدرياً للعهد القديم، مع أن الطبعة التي تحملها هذه المجموعة هي القانون البروتستانتي الكامل المؤلّف من ستة وستين سفراً. وحيثما تترك المواد فراغاً، يُترك هنا أيضاً بدل أن يُملأ بتخمين.
hero.3=في هذا القارئ هي واحدة من خمس طبعات إسبانية. والواجهة الإسبانية لا تزال تفتح افتراضياً [[RVR09|Reina-Valera 1909]]، وهو نصّ مشاع عائد إلى تقليد مختلف تماماً وأقدم بقرون؛ أما هذه الطبعة فيُوصل إليها من بطاقتها الخاصة، إلى جانب [[BES|Biblia en Español Sencillo]] و[[PDDPT|Palabra de Dios para Ti]] و[[NBLA|Nueva Biblia de las Américas]]. وهي ليست مراجعة لأيّها، فلم يُسجّل لها أصل في درجات النسب — والدرجة المفتوحة تحت إحدى آيات Versión Biblia Libre تهبط رأساً إلى أرضية اللغات الأصلية المعلّمة بـ ≈. وأقرب نسيب لها في هذه المجموعة ليس إسبانياً على الإطلاق: [[FBV|Free Bible Version]]، الترجمة الإنجليزية الصادرة عن الهيئة نفسها، بالترخيص نفسه.

