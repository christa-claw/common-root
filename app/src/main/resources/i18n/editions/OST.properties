title=Ostervald Bible (French) — About This Edition | Common Root
description=The Ostervald Bible: a Neuchâtel pastor's revision of the French Protestant Bible of Geneva, first published in 1744, here in a later revision in modern French spelling.
heroHeading=Ostervald Bible
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald was born in Neuchâtel in 1663 and died there in 1747. He was ordained in his native town in 1683 and spent most of his life in its church, first as a deacon and from 1699 as a pastor, lecturing in theology as well. His Bible is not a fresh translation from the Hebrew and Greek but a revision of the French Protestant Bible of Geneva, the version French-speaking Reformed churches had read since the sixteenth century. Ostervald's revised text was first published in 1744, three years before his death, and it was reprinted and revised for well over two centuries; it was also well known in Britain.
hero.2=The wording in this corpus is not the French of 1744. The eighteenth century wrote “étoit” where modern French writes “était”; this copy has “était” throughout and “étoit” not once, so it comes from one of the later revisions that kept Ostervald's name. The best known is the revision issued by the Société biblique de France in 1881, its New Testament the work of Ch. L. Frossard, and that text was itself updated as recently as 1996. eBible.org, the source of this copy, names only “Ostervald” and not the revision, so this page does not name one either. A few features show on almost every page. The divine name is “l'Éternel”, as in Segond and the French Darby: “L'Éternel est mon berger; je n'aurai point de disette” at Psalm 23. Isaiah 7:14 keeps “la vierge sera enceinte” — the virgin — where Segond has the young woman. And the New Testament keeps readings of the Textus Receptus that critical editions drop: 1 John 5:7 has the three heavenly witnesses, “le Père, la Parole, et le Saint-Esprit”, which the Segond beside it lacks.
hero.3=In this reader it is one of three French Bibles, beside Segond and the French Darby. A French interface does not open on it: French has no curated pick, so the reader takes the first French Bible in catalogue order, which is Darby. No parent is recorded for it in the lineage rungs — the Geneva Bible it revises is not in this corpus — so a rung opened under a verse drops straight to the original-language floor marked with ≈: the Westminster Leningrad Codex for the Old Testament and, for the New, the Textus Receptus, the Greek tradition this Bible actually follows. Its rung chip carries the year 1744, the year of Ostervald's own revision rather than of the wording shown. Set it beside Segond to see two centuries of French Protestant Bible language side by side.

