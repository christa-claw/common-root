title=Güncellenmiş Brenton İngilizce Septuaginta — Bu baskı hakkında | Common Root
description=Sir Lancelot Brenton'ın 1844 ve 1851 tarihli İngilizce Septuaginta'sı, yazımı ve adları 2020'de Adam Boyd tarafından güncellenmiş hâliyle — bu derlemede yanında duran özgün Brenton ile aynı çeviri; thou ve thee, Brenton'ın koyduğu yerde bırakılmış.
heroHeading=Güncellenmiş Brenton İngilizce Septuaginta
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Bu, Sir Lancelot Brenton'ın Septuaginta'nın, yani Yunanca Eski Antlaşma'nın İngilizce çevirisidir; İngilizcesi günümüze uyarlanmıştır. Brenton başlıca Codex Vaticanus'tan çevirdi; Londra'daki Samuel Bagster and Sons çevirisini 1844'te yayımladı ve 1851'de apokrif kitaplarla birlikte yeniden bastı. 2020'de Adam Boyd onu eBible.org için gözden geçirdi ve değişikliklerini kamuya açık hâle getirdi. Onu yeniden çevirmedi. Girişi neleri değiştirdiğini sıralar: yazım çağdaş Amerikan İngilizcesine getirildi, böylece “shew” “show” oldu; kişi ve yer adları İngilizce okurun tanıdığı biçimlere kondu; “begat” ve “spake” “begot” ve “spoke” yapıldı; kısa çizgiler ve çift noktalama işaretleri düzenlendi; ve şiir şiir olarak dizildi. Koruduğu şeyler de aynı ölçüde bilinçlidir: “thou”, “thee” ve “ye” ile onlara eşlik eden fiil biçimleri, Brenton'ın dilbilgisi ve onun ağır, 19. yüzyıl noktalaması.
hero.2=Fark en iyi, bu derlemede o da bulunan özgün Brenton'ın yanında görünür. Brenton İbranice adları Yunancanın yazdığı gibi yazıyordu; güncelleme çoğunlukla İngilizce biçimi verir. Brenton'ın Nehemya'sı “the words of Neemias the son of Chelcia” diye açılırken bunda “Nehemiah the son of Hacaliah” vardır; Elias the Thesbite, Elijah the Tishbite olur; Yeşaya 7:14'teki Emmanuel de Immanuel olur. Yazımın altında çeviri hâlâ Brenton'ındır, bu yüzden hâlâ Yunancanın okuduğu yerde okur. Yeşaya 7:14'teki “A virgin shall conceive” Yunanca parthenos'u karşılar; Mezmurlar Yunanca numaralandırmayı korur, dolayısıyla burada Mezmur 22 çoban mezmurudur; ve Yaratılış 1:2'deki yer hâlâ “unsightly and unfurnished”dır. Eski zamirler de kalır: “thou shalt call his name Immanuel”.
hero.3=Bu okuyucuda soy basamaklarının dışında durur. Derleme onun için hiçbir öncül kaydetmez — ne Brenton'ın çevirdiği Yunancayı ne de gözden geçirdiği Brenton'ı —, bu yüzden ayetlerinden birinin altında açılan bir basamak doğrudan ≈ ile işaretli özgün dil tabanına düşer; Eski Antlaşma için bu taban Leningrad Kodeksi'dir: bir İbranice metin, bu çevirinin yapıldığı Yunanca değil. Brenton'ın İngilizcesinden onun Yunancasına inmek için, kayıtlı öncülü Septuaginta olan özgün Brenton'ı açın. Bu baskının üzerinde de hiçbir şey durmaz ve hiçbir arayüz dili onda açılmaz; İngilizce arayüz New International Version'da açılır. Kopyamız kitaptan dardır. 36 kitap içerir. Ezra ve Nehemya, Yunancada olduğu gibi 23 bölümlük tek bir kitaptır ve Nehemya 11. bölümde başlar. Alındığı eBible.org dosyaları apokrif kitapları da içerir ve Ester ile Daniel'i yalnızca daha uzun Yunanca biçimleriyle verir; bunların hiçbiri alınmadı, bu yüzden burada ne Ester ne Daniel vardır, ne de Tobit ya da Bilgelik.

