fact.1.label=Lengua
fact.1.value=Inglés
fact.2.label=Encargada
fact.2.value=Por un comité conjunto de la Christian Reformed Church y la National Association of Evangelicals, que convocó una conferencia en el Trinity Christian College de Palos Heights, Illinois, en agosto de 1965
fact.3.label=Hecha por
fact.3.value=El Committee on Bible Translation: quince especialistas al principio, que llegaron a sumar más de cien procedentes de varios países de habla inglesa y muchas denominaciones, a lo largo de cosa de una década
fact.4.label=Antiguo Testamento de
fact.4.value=El texto hebreo masorético, con los Rollos del Mar Muerto, la Septuaginta y otros testimonios antiguos consultados
fact.5.label=Nuevo Testamento de
fact.5.value=El texto griego crítico ecléctico que representan las ediciones de la United Bible Societies y de Nestle-Aland, no [[TR|el Textus Receptus]] sobre el que descansan aquí [[GNV|la Biblia de Ginebra]] y [[KJV|la King James Version]]
fact.6.label=Clase de traducción
fact.6.value=Equilibra la exactitud de una traslación literal con un inglés natural e idiomático, sin atenerse a ninguno de los dos extremos: suele clasificarse como equivalencia dinámica; una traducción nueva desde los idiomas originales, no una revisión de la tradición King James
fact.7.label=Publicada
fact.7.value=El Nuevo Testamento en 1973; la Biblia completa el 27 de octubre de 1978; una ligera revisión en 1984; el texto actual, revisado más a fondo, en 2011, que retiró tanto la edición de 1984 como la Today's New International Version de 2005
fact.8.label=Editorial
fact.8.value=Biblica, Inc., que posee los derechos de autor; Zondervan en los Estados Unidos, Hodder & Stoughton en el Reino Unido
fact.9.label=Licencia
fact.9.value=Con licencia, no de dominio público. Pueden citarse hasta 500 versículos sin permiso escrito, siempre que no formen un libro completo de la Biblia ni más del 25 % de la obra, con reconocimiento de los derechos de autor; lo que exceda eso necesita el permiso de Biblica
fact.10.label=En este corpus
fact.10.value=La Biblia con la que una interfaz en inglés se abre por defecto: [[KJV|la King James Version]] y [[RV|la Revised Version]] dicen aquí, las dos, que no son esta. No hay texto base registrado en los peldaños del linaje: un peldaño bajo un versículo de la NIV baja directamente al suelo de lenguas originales marcado con ≈, igual que para [[BSB|la Berean Standard Bible]], salvo que el testigo griego de ese suelo es [[TR|el Textus Receptus]], que no es el texto del que realmente se hizo el Nuevo Testamento de esta traducción. Con licencia en vez de ser de dominio público, con la misma condición que la New American Standard Bible 2020, se distingue así de vecinas de dominio público como [[KJV|la King James Version]], [[RV|la Revised Version]] y [[WEB|la World English Bible]]
