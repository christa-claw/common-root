title=New International Version — Acerca de esta edición | Common Root
description=La New International Version: la Biblia en inglés con la que este lector se abre por defecto, traducida directamente de los idiomas originales por el Committee on Bible Translation y completada por primera vez en 1978 — aquí en su texto de 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Comenzó con la insatisfacción de una denominación. En 1955 el empresario Howard Long, junto con el reverendo Peter De Jong, presionó a la Christian Reformed Church para que produjera una Biblia en inglés contemporáneo, y en 1957 la CRC aprobó un comité para estudiar la idea. La National Association of Evangelicals había iniciado ese mismo año un proyecto similar propio. Las dos organizaciones unieron fuerzas: un comité conjunto envió invitaciones en 1964 a una conferencia de traducción, que se reunió en agosto de 1965 en el Trinity Christian College de Palos Heights, Illinois, y resolvió formar "un comité permanente de quince" para llevar adelante el trabajo. Ese comité permanente se convirtió en el Committee on Bible Translation. En 1967 la New York Bible Society —hoy llamada Biblica— asumió el patrocinio y contrató a los especialistas que harían la traducción.
hero.2=Nada aquí desciende de una Biblia inglesa anterior. Mientras que la King James Version, la Revised Version, la American Standard Version y la World English Bible forman en este corpus una sola cadena de revisiones, la New International Version se tradujo de nuevo directamente del hebreo, el arameo y el griego: el Antiguo Testamento del texto hebreo masorético, con los Rollos del Mar Muerto, la Septuaginta y otros testimonios antiguos consultados; el Nuevo Testamento del texto griego crítico ecléctico que representan las ediciones de la United Bible Societies y de Nestle-Aland, no el Textus Receptus sobre el que descansan aquí la Biblia de Ginebra y la King James. El comité de quince creció, en cosa de una década, hasta convertirse en un proyecto que llegó a reunir a más de cien especialistas de varios países de habla inglesa y muchas denominaciones. Su objetivo declarado era una traducción que mantuviera la exactitud del texto original sin leerse como una transcripción palabra por palabra de él —un equilibrio que suele clasificarse como equivalencia dinámica, entre una traslación literal estricta y una paráfrasis suelta.
hero.3=El Nuevo Testamento apareció primero, en 1973; la Biblia completa le siguió el 27 de octubre de 1978; una ligera revisión llegó en 1984. El texto cambió más a fondo en 2011, cuando una revisión más amplia sustituyó tanto la edición de 1984 como la Today's New International Version de 2005, retirando a ambas en favor del texto único que ha permanecido desde entonces. Ese texto de 2011 es el que se conserva en este corpus —el mismo año que muestra la ficha del catálogo—. Biblica, Inc. posee los derechos de autor en todo momento; Zondervan la publica en los Estados Unidos y Hodder & Stoughton en el Reino Unido.
hero.4=Su lugar en este lector es central de manera discreta. Pon la interfaz en inglés, y esto es lo que se abre: las páginas de la King James Version y la Revised Version en este corpus dicen ellas mismas que no son esta edición, y señalan hacia aquí como la que se deja al cambiar, no la que se encuentra de entrada. Como no revisó nada, el corpus no registra texto base para ella: abrir un peldaño de linaje bajo un versículo de la New International Version baja directamente al suelo de lenguas originales marcado con ≈, igual que ocurre con la Berean Standard Bible, con una diferencia que conviene conocer. El testigo griego de ese suelo es el Textus Receptus, y el Textus Receptus no es de donde realmente se hizo el Nuevo Testamento de esta traducción: el suelo representa "el griego original" en general, no el texto de trabajo propio de este comité. Hay algo más que la distingue de la mayoría de sus vecinas inglesas: tiene licencia, no es de dominio público, la misma condición que la New American Standard Bible 2020, mientras que la Berean Standard Bible, la Biblia de Ginebra, la King James Version, la Revised Version y la World English Bible pueden copiarse libremente.

