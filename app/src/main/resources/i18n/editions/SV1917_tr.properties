title=Svenska 1917 — Bu baskı hakkında | Common Root
description=İsveç Kilisesi'nin 1917 çevirisi — Gustav V:s bibel — öncekinden gözden geçirilmek yerine doğrudan İbranice ve Yunancadan yapılan ilk İsveççe Kutsal Kitap ve bu derlemenin elinde tuttuğu tek İsveççe Kutsal Kitap.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Üç yüz elli yıl boyunca İsveç Kilisesi'nin tek bir Kutsal Kitabı vardı; gözden geçirildi ama hiç yeniden yapılmadı. İsveççe basılan ilk tam Kutsal Kitap olan 1541 tarihli Gustav Vasa'nın Kutsal Kitabı, Martin Luther'in Almancasına ağırlıklı olarak yaslanıyordu. 1618 tarihli Gustav II Adolf'un Kutsal Kitabı onu gözden geçirdi, ve babası tarafından ondan önce sipariş edilmiş olsa da bir kralın döneminde tamamlanan 1703 tarihli Karl XII:s bibel, aynı miras alınan İsveççeyi bir adım daha ileri taşıdı. Üçünden hiçbiri baştan başlamadı.
hero.2=1773'te III. Gustav, o gözden geçirmelerin hiçbirinin yapmadığını yapacak bir İncil komisyonu atadı: eski İsveççeyi bir kez daha ileri taşımak yerine doğrudan İbranice ve Yunancadan çevirmek. Komisyon 144 yıl görev yaptı. Sonucu — Gustav Vasa'nınkinden sonra ve Bibel 2000'den önce İsveç'in ikinci tam Kutsal Kitap çevirisi — 1917'de V. Gustav döneminde tamamlandı ve onaylandı, bu yüzden hâlâ sık sık Gustav V:s bibel olarak anılır.
hero.3=Eski Antlaşma, kendisinden önceki baskılar gibi, masoretik İbranice metne dayanır. Yeni Antlaşma onların çizgisini sürdürmez: komisyonun 1917'ye kadar elinde bulunan en güncel eleştirel Yunanca metni izler, bu derlemedeki Reform dönemi Kutsal Kitaplarının üzerine kurulu olduğu Textus Receptus'u değil.
hero.4=Bu okuyucuda tek İsveççe Kutsal Kitap odur, dolayısıyla arayüzü İsveççeye almak onu açar — İspanyolca için Reina-Valera 1909 seçilmiş olduğu gibi elle seçildiği için değil, katalog taraması bu dilde başka bir şey bulamadığı için. Soy basamaklarında ona kayıtlı bir kaynak yoktur, bu yüzden bir ayetin altında açılan basamak doğruca ≈ ile imlenen özgün diller tabanına iner. O taban Yunanca için Textus Receptus'u verir ve burada bu, her zamankinden daha uzağında durur gerçeğin: komisyon daha güncel bir eleştirel metin için Textus Receptus'u bilerek geride bıraktı, bu yüzden bu çevirinin bir ayetinin altındaki taban, onun gerçekte izlediği metin olmayan bir Yunanca metni adlandırır.

