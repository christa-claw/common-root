title=Darby 1885 (francés) — Acerca de esta edición | Common Root
description=La Biblia Darby francesa de 1885: la traducción de Pau y Vevey, comenzada en 1859 por John Nelson Darby y sus colaboradores y terminada tres años después de su muerte, y la versión a partir de la cual se construyó después su Antiguo Testamento inglés.
heroHeading=Darby 1885 (francés)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=A John Nelson Darby se le recuerda por otras cosas — dejó la Iglesia de Irlanda, ayudó a fundar a los Hermanos de Plymouth y puso en circulación el premilenarismo dispensacionalista —, pero pasó buena parte de su vida traduciendo la Biblia, y lo hizo en tres lenguas. Lo insólito en él es el orden. La mayoría de los traductores trabaja hacia fuera desde su propia lengua. Su Biblia inglesa fue la última de las tres en quedar terminada, y su Antiguo Testamento no lo hizo él directamente del hebreo, sino a partir de las versiones francesa y alemana que ya había producido con otros.
hero.2=Esta es la francesa. Darby fue el erudito principal, pero nunca el único traductor de nada que lleve su nombre; en el equipo francés estaban William Joseph Lowe y Pierre Schlumberger. El Nuevo Testamento apareció en 1859 y se reeditó tres veces en las dos décadas siguientes. La Biblia completa salió en 1885 en Pau y Vevey — de ahí el nombre con que se la conoce de ordinario —, aunque la portada engaña un poco: Pau está en el extremo sur de Francia, y el trabajo se hizo sobre todo para las asambleas de hermanos de la Suiza francófona. Darby había muerto en 1882, de modo que nunca vio el libro terminado.
hero.3=La traducción es literal por principio, y Darby dijo sin rodeos por qué en el prefacio de su Nuevo Testamento alemán: el erudito puede consultar el original, así que el sentido de una traducción es poner una representación de él lo más exacta posible en manos de quienes no pueden. Advirtió además que una versión más libre pierde sentidos que el propio traductor quizá no haya captado. El resultado es exacto y sin adorno, y nunca se pensó para leerlo en voz alta — en su propia predicación Darby usaba la King James Version.
hero.4=Dos cosas la unen al resto de este corpus. La Biblia Darby alemana es la Elberfelder, presente aquí como Elberfelder 1905 — el mismo hombre, los mismos principios, y uno de los dos textos con que se armó su Antiguo Testamento inglés, de modo que estas dos fichas, la francesa y la alemana, son parientes más cercanas de lo que sus lenguas distintas dejan suponer. Y su tratamiento del nombre divino la pone junto a la American Standard Version, que imprime “Jehovah” miles de veces donde la King James Version imprime “the LORD”; Darby tomó la misma decisión antes, en tres lenguas. En el lector es la única Biblia francesa, de manera que una interfaz en francés abre en ella. En los peldaños de linaje no se le registra antecedente alguno y, a diferencia de la mayoría de las ediciones fechadas de aquí, su peldaño no lleva año ninguno — la ficha del catálogo muestra 1885, pero los años de peldaño son una lista aparte llevada a mano y esta edición todavía no está en ella.

