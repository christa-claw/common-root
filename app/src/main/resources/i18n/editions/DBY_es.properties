fact.3.label=Erudito principal
fact.3.value=John Nelson Darby (1800–1882), en trabajo con William Joseph Lowe y Pierre Schlumberger — no fue el único traductor de ninguna de las versiones que llevan su nombre
fact.4.label=Nuevo Testamento
fact.4.value=publicado por primera vez en 1859, reeditado en 1872, 1875 y 1878
fact.5.label=Biblia completa
fact.5.value=1885, publicada en Pau y Vevey — tres años después de la muerte de Darby
fact.6.label=Hecha para
fact.6.value=las asambleas de hermanos, sobre todo las de la Suiza francófona más que las de Pau misma
fact.7.label=Clase de traducción
fact.7.value=deliberadamente literal, hecha para el estudio privado más que para la lectura en voz alta; el nombre divino se vierte «l'Éternel» y no se deja como «le Seigneur»
fact.8.label=Versiones hermanas
fact.8.value=la Biblia Darby alemana es la Elberfelder, en este corpus como [[ELB|Elberfelder 1905]]; el Antiguo Testamento Darby inglés se hizo a partir del trabajo francés y alemán, no directamente del inglés propio de Darby
fact.9.label=Contenido
fact.9.value=66 libros — el canon protestante, sin deuterocanónicos
fact.10.label=En este corpus
