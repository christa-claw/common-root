title=Tyndalen Uusi testamentti 1534 — Tietoja tästä laitoksesta | Common Root
description=William Tyndalen Uusi testamentti, ensimmäinen kreikasta tehty ja ensimmäinen painettu englanninkielinen käännös, hänen omana tarkistuksenaan vuodelta 1534 — sanamuoto Geneven Raamatun ja King James Versionin alla.
heroHeading=Tyndalen Uusi testamentti 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=Tyndalen aikana englanninkielinen Raamattu oli yhä lainvastainen. Oxfordin konstituutiot vuodelta 1409 kielsivät kääntämästä Raamattua englanniksi tai lukemasta sellaista käännöstä ilman piispan hyväksyntää. William Tyndale pyysi tätä hyväksyntää Lontoon piispalta Cuthbert Tunstallilta vuonna 1523, sai kieltävän vastauksen ja lähti seuraavana vuonna Englannista tehdäkseen työn ilman sitä. Edessään Erasmuksen kreikkalainen Uusi testamentti ja sen vierellä Lutherin saksannos ja latinalainen Vulgata hän teki ensimmäisen kreikasta käännetyn englanninkielisen Uuden testamentin ja ensimmäisen, joka koskaan painettiin. Ensimmäinen yritys Kölnissä vuonna 1525 keskeytyi, kun kirjapainoon tehtiin ratsia; valmis kirja tuli Peter Schöfferin painosta Wormsissa vuonna 1526 ja salakuljetettiin Englantiin, missä piispat ostivat kappaleita pois ja polttivat ne.
hero.2=Tämä teksti on Tyndalen oma tarkistus, painettu Antwerpenissä vuonna 1534: hän kävi kreikan uudelleen läpi, korjasi ensimmäistä versiotaan ja lisäsi esipuheita ja huomautuksia. Se oli yhtä paljon kannanotto kuin käännös. Thomas More hyökkäsi häntä vastaan siksi, että hän kirjoitti ”seurakunta” (congregation) siinä, missä kirkko sanoi kirkko, ”vanhin” (elder) siinä, missä se sanoi pappi, ja ”rakkaus” (love) siinä, missä se sanoi lähimmäisenrakkaus (charity) — ja kaikki kolme valintaa ovat tässä tekstissä: Matteus 16:18 kuuluu ”apon this rocke I wyll bylde my congregacion”. Tyndale tarkisti työtään vielä kerran vuonna 1535, pidätettiin Antwerpenissä saman vuoden toukokuussa ja tuomittiin vuonna 1536 harhaoppisena, kuristettiin ja poltettiin Vilvoordessa Brysselin liepeillä.
hero.3=Tässä lukuohjelmassa hänet löytää alta. Tyndale on kirjattu askelmaksi sekä Geneven Raamatun että King James Versionin alle ja siten, tikapuilla alempana, myös Revised Versionin, American Standard Versionin ja World English Biblen alle, jotka nojaavat King James Versioniin. Kun King James -jakeesta astuu Geneven ohi alaspäin, sanamuoto liikahtaa usein tuskin lainkaan — ja juuri se on asian ydin; 1. Korinttilaiskirjeen 13:13 kohdalla se liikahtaa, sillä Tyndale ja Geneve sanovat love ja King James charity. Tyndalen alla ei ole kirjattua edeltäjää. Hän työskenteli Erasmuksen kreikan pohjalta, mutta tässä aineistossa oleva Textus Receptus on vuoden 1550 laitos, sukupolven häntä myöhäisempi, ja täällä oleva Luther on vuoden 1545 Raamattu eikä vuoden 1522 Uusi testamentti, jota hän käytti, joten tikapuut laskeutuvat suoraan alkukielten pohjalle. Mukana on vain Uusi testamentti, hänen omalla oikeinkirjoituksellaan: Matteus alkaa sanoin ”This is the boke of the generacion of Iesus Christ”.

