title=Klementinska Vulgata — Om denna utgåva | Common Root
description=Klementinska Vulgata: den påvliga revisionen av Hieronymus latinska bibel, tryckt i Rom 1592 och utgiven på nytt med rättelser 1593 och 1598 — Katolska kyrkans latinska standardtext fram till 1979, och i denna läsare en stegpinne ovanför Vulgata.
heroHeading=Klementinska Vulgata
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=År 1546 förklarade Tridentinska konciliet Vulgata för kyrkans autentiska latinska bibel, och lämnade därmed en fråga som det inte besvarade: vilken Vulgata? Elva sekler av avskrivning för hand hade inte lämnat två handskrifter riktigt lika, och konciliet bad om en rättad text. Påven Sixtus V levererade en år 1590, till stor del reviderad av honom själv, under en bulla som förklarade den autentisk. Han dog i augusti samma år, och inom några veckor hade kardinalerna stoppat försäljningen. Under Clemens VIII tog en kommission fram dess ersättare — med Francisco de Toledo bland redaktörerna och Robert Bellarmino i arbetets mitt — tryckt i Rom 1592. Mindre nytryck 1593 och 1598 tog bort de flesta av dess tryckfel och lade till Hieronymus prologer och marginalhänvisningar.
hero.2=Den texten var Katolska kyrkans latinska standardbibel i nära fyra sekler, fram till Nova Vulgata 1979, och 1962 års missale och breviarium använder den fortfarande. Det är Hieronymus bibel så som kyrkan hade tagit emot den, inte så som han lämnade den. Psalmerna är hans galliska psaltare, reviderad efter grekiskan, inte hans senare översättning från hebreiskan, och därför behåller de den grekiska numreringen: Psalm 22 börjar här med ”Dominus regit me”, herdepsalmen. I 1 Joh 5:7 har den Comma Johanneum, ”Pater, Verbum, et Spiritus Sanctus”, ett latinskt tillägg som de tidiga grekiska handskrifterna saknar. Ester och Daniel finns i sina längre former, med de grekiska tilläggen samlade i slutet av Ester och som Daniels två sista kapitel. Den eBible.org-fil som denna kopia kommer från trycker 1598 års text med Glossa Ordinaria som noter — kommentaren från Anselm av Laons skola, sammanställd under det tolfte århundradet, i Mignes utgåva från 1880. Noterna kom inte med i korpuset; hakparenteserna i vissa verser är källans egna.
hero.3=I denna läsare är den en stegpinne med en enda registrerad förlaga, den latinska Vulgata: öppna en stegpinne under någon av dess verser så visas Vulgata. Räkna med att de två läses nästan ord för ord lika. Vulgata i detta korpus är själv hämtad från en klementinsk text, så det som skiljer dem åt är mest interpunktion — och de böcker som denna kopia saknar. Den har 66, den protestantiska kanons böcker, med Ester och Daniel i sina längre former. Källfilerna innehåller också Tobit, Judit, Vishetens bok, Syraks bok, Baruk och de två Mackabeerböckerna, som alla finns i Vulgata under den; ingen av dem kom med, så där Vulgata har Tobit står ingenting ovanför. Manasses bön och 3 och 4 Esra, som den klementinska utgåvan tryckte i ett appendix, finns varken i källan eller i korpuset. Ingenting i korpuset står i sin tur på denna utgåva.

