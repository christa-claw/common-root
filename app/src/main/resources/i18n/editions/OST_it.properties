title=Bibbia di Ostervald (francese) — Su questa edizione | Common Root
description=La Bibbia di Ostervald: la revisione, opera di un pastore di Neuchâtel, della Bibbia protestante francese di Ginevra, pubblicata per la prima volta nel 1744, qui in una revisione successiva con ortografia francese moderna.
heroHeading=Bibbia di Ostervald
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald nacque a Neuchâtel nel 1663 e vi morì nel 1747. Fu consacrato al ministero nella sua città natale nel 1683 e passò la maggior parte della vita al servizio della sua chiesa, prima come diacono e dal 1699 come pastore, insegnando anche teologia. La sua Bibbia non è una traduzione nuova dall'ebraico e dal greco, ma una revisione della Bibbia protestante francese di Ginevra, la versione che le chiese riformate di lingua francese leggevano dal Cinquecento. Il testo riveduto da Ostervald uscì per la prima volta nel 1744, tre anni prima della sua morte, e fu ristampato e riveduto per più di due secoli; era anche ben noto in Gran Bretagna.
hero.2=Il testo di questo corpus non è il francese del 1744. Il Settecento scriveva «étoit» dove il francese moderno scrive «était»; questa copia ha «était» ovunque e «étoit» neppure una volta, quindi proviene da una delle revisioni successive che conservarono il nome di Ostervald. La più nota è la revisione pubblicata dalla Société biblique de France nel 1881, il cui Nuovo Testamento fu opera di Ch. L. Frossard, e quel testo è stato aggiornato ancora nel 1996. eBible.org, la fonte di questa copia, nomina solo «Ostervald» e non la revisione, perciò neppure questa pagina ne nomina una. Alcuni tratti si vedono quasi in ogni pagina. Il nome divino è «l'Éternel», l'Eterno, come in Segond e nella Darby francese: «L'Éternel est mon berger; je n'aurai point de disette» al Salmo 23. Isaia 7:14 conserva «la vierge sera enceinte» — la vergine — dove Segond ha la giovane donna. E il Nuovo Testamento conserva lezioni del Textus Receptus che le edizioni critiche eliminano: 1 Giovanni 5:7 ha i tre testimoni celesti, «le Père, la Parole, et le Saint-Esprit», che mancano nella Segond accanto.
hero.3=In questo lettore è una di tre Bibbie francesi, accanto alla Segond e alla Darby francese. Un'interfaccia in francese non si apre su di essa: il francese non ha una scelta curata, così il lettore prende la prima Bibbia francese nell'ordine del catalogo, che è la Darby. Nei pioli della discendenza non le è registrato alcun antecedente — la Bibbia di Ginevra che essa rivede non è in questo corpus — sicché un piolo aperto sotto un versetto scende dritto al pavimento delle lingue originali segnato con ≈: per l'Antico Testamento il Codice di Leningrado e per il Nuovo il Textus Receptus, la tradizione greca che questa Bibbia segue davvero. Il suo segno di piolo porta l'anno 1744, quello della revisione di Ostervald stesso e non quello del testo mostrato. Apritela accanto alla Segond per vedere fianco a fianco due secoli di lingua biblica protestante francese.

