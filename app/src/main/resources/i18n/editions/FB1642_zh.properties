title=Biblia 1642 — 关于此版本 | Common Root
description=Biblia 1642：第一部完整的芬兰语圣经，由四位学者在图尔库以三年译成，在瑞典女王克里斯蒂娜的庇护下印行。
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
thanks=感谢为本页寄来订正的各位。

# The narrative, one paragraph per key, in order.
hero.1=第一部完整的芬兰语圣经。在它之前，有米卡埃尔·阿格里科拉一五四八年的新约以及一五五〇年代刊行的旧约若干部分；在它之后，一种几乎未曾被书写的语言有了一整部圣经。四位学者在一六三八至一六四一年间完成此事——埃斯基尔·佩特雷乌斯、马丁努斯·斯托迪乌斯、亨里库斯·霍夫曼与格雷戈里乌斯·马泰——在图尔库主教伊萨库斯·罗托维乌斯手下，是他把这项工程推成的。当时芬兰属于瑞典，此书于一六四二年在女王克里斯蒂娜的庇护下问世。 一代人之前已有过尝试：1602年设立了圣经翻译委员会，很可能由图尔库主教埃里克斯·埃里齐·索罗莱宁主持。该委员会似乎拟出了译稿，却始终未能汇成一部圣经，其下落大半湮没无闻——不过一般认为这项工作对1642年的译本仍有影响。
hero.2=他们从希伯来文和希腊文翻译，路德的德文就在手边。古斯塔夫·瓦萨的瑞典语圣经是桌上另一部书；它不在本语料库中，所以此处的谱系链记录路德——并在他身旁记录阿格里科拉一五四八年的芬兰语，即委员会所修订的底本。一六四二年 Biblia 更大的作用落在芬兰语本身。一种几乎没有书面散文的语言，在一部书之内获得了从法律到哀歌的词汇与节奏；而其后每一部芬兰语圣经都是它的修订或承继，而非另起一头。
hero.3=在本阅读器中，一六四二年版立于两级芬兰语链级之间。在 Kirkkoraamattu 1933/38 之下三级、Biblia 1776 之下，出现此版本；而在它之下，两个上源并肩而立——阿格里科拉一五四八年的芬兰语，即委员会所修订的底本，与摊在桌上的路德一五四五年德文。再往下一级，谱系链便永远离开了芬兰语。 此处文本取自芬兰语言研究中心（Kotus）的 VKS 古芬兰书面语语料库，所以你看到的拼写——「tulcon walkeus」——是一六四二年印本自身的，未经现代化。

