title=Koranen — Pickthall — Om denna utgåva | Common Root
description=Muhammad Marmaduke Pickthalls översättning från 1930, den första engelska koranöversättningen av en muslim med engelska som modersmål — tillkommen i tjänst hos nizamen av Hyderabad och med råd från al-Azhars lärda, och i detta korpus den engelska som visas under den arabiska texten som standard.
heroHeading=Koranen — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) var en engelsk romanförfattare, uppskattad i sin tid av H. G. Wells och D. H. Lawrence, innan han blev en översättare av helig skrift. Han förklarade sin övergång till islam i november 1917, efter ett föredrag med titeln "Islam and Progress" inför Muslim Literary Society i Notting Hill, och avlade shahada samma månad vid Woking Muslim Mission. Ett decennium senare var han rektor för Chadarghat High School i Hyderabad, i tjänst hos nizamen, och det var därifrån han 1928 tog ett tvåårigt sabbatsår för att göra det han velat göra sedan sin konversion: föra över Koranen till engelska.
hero.2=Han gjorde det inte ensam eller i hast. 1929 tillbringade han tre månader i Kairo, där Rashid Ridas stöd öppnade dörrar, för att söka al-Azhars lärdas välsignelse för ett projekt som några av dem hade varnats kunde kosta dem deras ställning — en del av al-Azhar ansåg att översätta Koranen alls var en allvarlig sak. Pickthall gick vidare trots det och fortsatte att rådgöra med dem. Det han gav ut 1930, som "The Meaning of the Glorious Koran: An Explanatory Translation", bär denna försiktighet redan i sin titel: inte "Koranen på engelska" utan en förklaring av dess betydelse, eftersom ingen översättning, enligt hans egen uttalade uppfattning, kunde vara Koranen själv. Alfred A. Knopf gav ut förstautgåvan i New York; en tvåspråkig utgåva från Hyderabads regeringstryckeri följde.
hero.3=The Times Literary Supplement kallade den "a great literary achievement", och den beskrivs vanligen som den första engelska koranöversättningen av en muslim vars modersmål var engelska — tidigare engelska versioner, av bland andra Sale och Rodwell, var verk av icke-muslimska orientalister. Pickthalls har hållits i tryck och i bruk i nästan ett sekel sedan, en av ett fåtal engelska återgivningar som vanliga läsare, inte bara forskare, faktiskt läser.
hero.4=I detta korpus är det översättningen som visas under den uthmanska arabiska texten som standard — arabiskan förblir grunden för varje kolumn, och denna engelska visas som en förklaring vid sidan av den, utan att någonsin ersätta den. Den valdes för denna roll av ett lika oglamoröst skäl som ett litterärt: en genomgång av tillgängliga översättningar fann endast två engelska återgivningar otvetydigt fria att kopiera, denna och Yusuf Alis från 1934, samt Sablukovs ryska från 1878 för ett tredje språk. Texten här är en digitalisering av översättningen, hämtad via alquran.cloud snarare än från någon enskild tryckning, så den bör läsas som Pickthalls ordalydelse snarare än som ett faksimil av en bestämd utgåva.

