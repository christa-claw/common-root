title=公认文本 — 关于本版本 | Common Root
description=公认文本（Textus Receptus）：站在路德、丁道尔与钦定版背后的希腊文新约印本，1516 年由伊拉斯谟首次编定，其名则出自 1633 年的一句广告词。
heroHeading=公认文本
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=本收藏中每一部宗教改革时期的圣经，都源自 1516 年在巴塞尔印行的一本书。鹿特丹的伊拉斯谟想赶在所有人之前把希腊文新约付印，于是他做得很快 —— 所据只是他在巴塞尔能够着的少数几部晚期写本，没有一部算得上古老。他手中启示录的那部写本缺了最后一叶，他便把最后六节从拉丁文武加大译本回译成希腊文。那几节进了印本，并在其中留了四个世纪。
hero.2=此后一百年间，这个文本不断被校正、重印 —— 先是伊拉斯谟自己，后来是巴黎的罗伯·斯蒂芬纳与日内瓦的伯扎。斯蒂芬纳 1551 年的第四版做了一件影响远超学术的事：它把文本切分成编号的节。那就是今天几乎每一部圣经里仍在印的节号 —— 也是本阅读器允许你关掉的那些。
hero.3=名字是最后才有的，而且来自叫卖。1633 年，莱顿的埃尔泽维尔兄弟为自家版本做广告，称读者如今拿到的是“为众人所接受的文本” —— textus receptus。那是书商的声称，不是学界的定论，却就此粘住了。十九世纪更古老的写本陆续现世之后，从提什多夫到韦斯特与霍尔特的编者便在它们之上建起新的文本，现代译本所从的是那些。公认文本留在这里，正是因为它的要紧之处：路德、丁道尔、日内瓦的译者与钦定版的委员会当日摊在面前的正是它，因此他们的措辞必须对照它来读。

