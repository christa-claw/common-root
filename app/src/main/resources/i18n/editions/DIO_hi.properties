fact.2.value=जोवान्नी दियोदाती (1576–1649), जिनेवा में एक प्रोटेस्टेंट व्यापारी परिवार में जन्मे, जिसने अपना धर्म छोड़ने के बजाय लुक्का छोड़ दिया था
fact.3.label=प्रथम प्रकाशन
fact.3.value=1607, जिनेवा में — लातीनी से नहीं, इब्रानी और यूनानी से बनी पहली इतालवी बाइबिल
fact.4.label=संशोधित संस्करण
fact.4.value=1641, दियोदाती की अपनी टिप्पणियों सहित; अगली तीन शताब्दियों तक पाठ इसी रूप में पुनर्मुद्रित होता रहा
fact.5.label=नाम में 1649 क्यों है
fact.5.value=1649 दियोदाती की मृत्यु का वर्ष है, किसी संस्करण का नहीं — तिथि डिजिटल पाठ के साथ-साथ चलती रहती है, और सूची-कार्ड कोई वर्ष जताने के बजाय वर्ष का स्तंभ रिक्त छोड़ता है
fact.6.label=नए नियम के पीछे की यूनानी
fact.6.value=बेज़ा के संस्करण, एक पीढ़ी पहले जिनेवा में बने — मुद्रित यूनानी पाठों के उसी परिवार के भीतर जिसे यह संग्रह [[TR|टेक्स्टस रेसेप्टुस]] के रूप में रखता है
fact.7.label=उन्हीं की और भी
fact.7.value=एक फ़्रांसीसी बाइबिल, 1644, दोनों में प्रायः कमज़ोर मानी जाने वाली — फ़्रांसीसी वह भाषा नहीं थी जिसमें वे सोचते थे
fact.8.label=विषय-वस्तु
fact.8.value=66 पुस्तकें — प्रोटेस्टेंट कैनन, द्वितीयकानूनिक पुस्तकों के बिना
fact.9.label=इस संग्रह में
fact.9.value=यहाँ की एकमात्र इतालवी बाइबिल, इसलिए इतालवी अंतरफलक इसी पर खुलता है; वंश-पायदानों में कोई मूल अभिलिखित नहीं, और इसका पायदान चिह्न बिना वर्ष के प्रस्तुत होता है
