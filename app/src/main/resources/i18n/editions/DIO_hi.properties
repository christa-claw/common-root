title=दियोदाती 1649 (इतालवी) — इस संस्करण के बारे में | Common Root
description=जोवान्नी दियोदाती की इतालवी बाइबिल: 1607 में जिनेवा में प्रकाशित, वुल्गाता से नहीं बल्कि इब्रानी और यूनानी से बनी पहली इतालवी बाइबिल, 1641 में उनकी अपनी टिप्पणियों सहित संशोधित — और फ़ाइल पर पड़ा वर्ष उनकी मृत्यु का वर्ष क्यों है।
heroHeading=दियोदाती 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=जोवान्नी दियोदाती का जन्म 1576 में जिनेवा में लुक्का के एक व्यापारी परिवार में हुआ, जिसने अपना धर्म छोड़ने के बजाय इटली छोड़ दिया था। वंश से वे इतालवी थे और शिक्षा से जिनेवावासी, और यही मेल इस पुस्तक के अस्तित्व का पूरा कारण है: उनके पास उस देश की भाषा थी जहाँ तक सुधार-आंदोलन नहीं पहुँचा था, और वे उस नगर में खड़े थे जो उस आंदोलन की छापाख़ाना बन चुका था। थियोडोर बेज़ा ने इक्कीस वर्ष की आयु में उन्हें इब्रानी की पीठ के लिए प्रस्तावित किया। 1606 में वे धर्मविज्ञान के प्राध्यापक बने, 1608 में पादरी, और अगले ही वर्ष धर्मविज्ञान की पीठ पर बेज़ा के उत्तराधिकारी हुए; 1618 में वे जिनेवा के प्रतिनिधि के रूप में डोर्ट की धर्मसभा में गए और उन छह व्यक्तियों में से एक थे जिन्हें उसकी कार्यवाही लिखने का भार सौंपा गया।
hero.2=उनकी इतालवी बाइबिल 1607 में जिनेवा में छपी। इटली में लोकभाषा की बाइबिलें पहले भी रही थीं — मालेर्मी की 1471 की, ब्रूचोली की 1532 की — पर वे लातीनी से काम करती थीं या उस पर भारी रूप से टिकी थीं। दियोदाती इब्रानी और यूनानी तक गए, और नए नियम के लिए इसका अर्थ था वह यूनानी पाठ जिसे बेज़ा ने उसी नगर में एक पीढ़ी पहले संपादित किया था। 1641 में उन्होंने अपनी व्याख्यात्मक टिप्पणियों सहित एक संशोधित संस्करण निकाला, और पुनर्मुद्रण उसी से उतरते हैं। वह इतालवी प्रोटेस्टेंट बाइबिल बनी और बनी रही — और लगभग बिना प्रोटेस्टेंट पाठकों वाले देश में इसका अर्थ था कि चार शताब्दियों तक उसे बहुत थोड़े लोगों ने उठाए रखा। उन्होंने बाइबिल का फ़्रांसीसी में भी अनुवाद किया, 1644 में; उसे प्रायः दोनों में कमज़ोर माना जाता है, और वे स्वयं भी संभवतः विवाद न करते।
hero.3=कार्ड पर पड़े वर्ष के विषय में एक वाक्य कहना उचित है, क्योंकि वहाँ वर्ष है ही नहीं। यह पाठ डिजिटल रूप में “दियोदाती 1649” नाम से चलता है, और 1649 कोई संस्करण नहीं — वह दियोदाती की मृत्यु का वर्ष है। जिन दो तिथियों का कुछ अर्थ है वे हैं 1607, जब अनुवाद पहली बार निकला, और 1641, जब उन्होंने उसे संशोधित किया। कोई दी हुई डिजिटल फ़ाइल वस्तुतः इनमें से किसे प्रस्तुत करती है, यह इस परियोजना ने स्थापित नहीं किया है, इसलिए सूची वर्ष का स्तंभ रिक्त छोड़ देती है, न कि ऐसा अंक छापती है जिसके पीछे वह खड़ी न हो सके। नाम जैसा आया वैसा ही रखा गया है, क्योंकि लोग उसी को खोजेंगे।
hero.4=इस पाठक में यह एकमात्र इतालवी बाइबिल है, इसलिए अंतरफलक को इतालवी पर रखने से यही खुलती है — इसलिए नहीं कि इसे चुना गया हो, जैसे स्पेनिश के लिए Reina-Valera 1909 चुनी गई है, बल्कि इसलिए कि सूची की छानबीन को उस भाषा में और कुछ नहीं मिलता। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं, अतः किसी पद के नीचे खुला पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है। वह तल यूनानी के लिए टेक्स्टस रेसेप्टुस देता है, और यहाँ यह असामान्य रूप से सत्य के निकट है: इस संग्रह के अधिकांश संस्करणों के लिए रेसेप्टुस उस समीक्षात्मक पाठ के स्थान पर खड़ा होता है जिसे अनुवादकों ने वस्तुतः बरता था, पर दियोदाती सचमुच उसी परिवार के एक मुद्रित यूनानी पाठ से काम कर रहे थे। इसका पायदान चिह्न कोई वर्ष नहीं धरता, जो कार्ड के रिक्त स्थान से मेल खाता है।

