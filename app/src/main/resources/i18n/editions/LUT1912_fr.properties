fact.12.value=Le sommet de l'échelle allemande : un parent enregistré, [[LUT1545|Luther Bibel 1545]], et au-dessous le sol des langues originales. Ses 85 notes des réviseurs sont portées ici comme commentaires plutôt que jetées, et elles sont liées à l'édition — une glose de 1912 paraît sous une colonne de 1912 et nulle part ailleurs. Ce n'est pas ce sur quoi s'ouvre une interface allemande ; c'est [[ELB|l'Elberfelder]], première du catalogue par son sigle et pour nulle autre raison
