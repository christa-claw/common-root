title=Luther Bibel 1912 — À propos de cette édition | Common Root
description=La deuxième révision officielle de la Bible de Luther : une relecture délibérément prudente, achevée en 1910, adoptée en 1912, et le dernier texte luthérien reposant sur le Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Une révision d'une révision. Les Églises allemandes s'étaient accordées en 1892 sur un texte unique de la Bible de Luther, la première révision officielle, et en quelques années on la disait insuffisante. Les griefs étaient les anciens : trop d'archaïsmes et une orthographe qui n'était plus celle de personne. C'est le second point qui a emporté la décision. Le Duden avait donné à l'Empire allemand une orthographe contraignante, enseignée à l'école, et une Bible de Luther qui s'en écartait était malaisée à mettre devant une classe. En 1906, la conférence des Églises évangéliques allemandes a consenti à une nouvelle révision en prescrivant expressément qu'elle fût ménagée et conservatrice. Une commission de théologiens a parcouru chaque livre jusqu'en 1910, et en 1912 la conférence en a adopté le résultat.
hero.2=Le travail a duré à peine plus de deux ans, ce qui dit assez de quelle sorte de révision il s'agissait. Personne ne cherchait à faire une nouvelle Bible de Luther, ni philologiquement ni autrement. Un réviseur plus tardif, Fritz Tschirch, l'a écartée comme une révision de maître d'école, et sur la méthode l'étiquette ne dit rien de faux — l'orthographe remise en ordre, les mots les plus manifestement morts remplacés, la lettre laissée pour le reste là où Luther l'avait mise. Ce que l'étiquette ne voit pas, c'est sa tenue. À travers les décennies de révisions partielles qui ont suivi, le texte de 1912 est resté en place, et il se lit et se vend encore. Cela tient en partie à la Jubiläumsbibel de 1912, l'édition du centenaire de l'institut biblique de Wurtemberg, pourvue de notes explicatives et réimprimée en fraktur fort avant dans ce siècle. Cela tient en partie à ce que le droit d'auteur est échu : le texte ne coûte rien à reproduire et se retrouve partout — ici compris.
hero.3=Une chose avant toutes la maintient en usage chez les lecteurs conservateurs : c'est la dernière révision luthérienne bâtie sur le Textus Receptus, le Nouveau Testament grec des XVIe et XVIIe siècles. Tout ce qui a suivi est passé au texte critique. Cela fait de cette édition un échelon d'une propreté rare où poser le pied dans une échelle, car le grec qui est dessous est le même grec qui est sous l'édition propre de Luther de 1545, sous la Genève et sous la King James — la tour entière partage un sol au lieu d'en changer à mi-hauteur.
hero.4=Dans les échelons de la filiation, cette édition se tient immédiatement au-dessus de la Luther Bibel 1545 et compte exactement un parent enregistré, qui est celle-là. Ouvrez un échelon sous un verset de 1912 et la lettre propre de Luther de 1545 paraît dessous ; ouvrez-en un autre et l'échelle atteint le Textus Receptus pour le grec et le Codex de Leningrad pour l'hébreu. Trois cent soixante-sept ans de révision, verset par verset, en deux clics. Ce que cette édition n'est pas : la Bible sur laquelle s'ouvre une interface allemande — l'allemand n'a pas d'édition par défaut choisie, de sorte que le lecteur reçoit la première Bible allemande du catalogue, et c'est l'Elberfelder.

