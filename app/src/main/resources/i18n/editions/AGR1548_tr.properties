title=Agricola 1548 — Bu Baskı Hakkında | Common Root
description=Mikael Agricola'nın Fincesi: 1548 Yeni Ahit'i, 1551 Mezmurlar'ı ve peygamberler — Fince basılmış ilk kutsal metin ve yazılı Fincenin ta kendisinin başlangıcı.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Bu sayfaya düzeltme gönderenlere teşekkürlerimizle.

# The narrative, one paragraph per key, in order.
hero.1=Var olan en eski basılı Fince. Mikael Agricola 1548'de Se Wsi Testamenti'yi yayımladığında Fince neredeyse hiç dizgiye girmemişti — birkaç yıl önceki kendi alfabe kitabı, düpedüz ilk Fince kitaptı. İkisinin arasında 1544 tarihli dua kitabı da çıktı: metin hacmi büyük bir eser, içinde mezmur çevirileri de vardı. Kutsal metni basabilmek için önce bu dilin nasıl yazılacağına karar vermesi gerekti ve o kararlar — imlâ, ödünç sözcükler, tını — yazılı Fincenin başladığı yerdir. Yeni Ahit ona ve Turku'daki çevresine on yıldan fazlaya mal oldu; 1551'de Mezmurlar, 1551 ve 1552'de peygamberlerden ve Musa'nın kitaplarından seçmeler geldi. Yine de onunki basılan ilk Fincedir, yazılan ilk Fince değil: dört yazma — Codex Westh, Uppsala kodeksi B 28, Kangasala missali ve Uppsala parçası — Fince Kutsal Kitap bölümleri taşır ve Kauko Pirinen 1988'de bunları İsveççe kaynaklarıyla karşılaştırarak, bir kısmının Agricola'nın bastığı her şeyden eski, belki daha 1530'larda yazılmış olduğunu gösterdi.
hero.2=Kutsal Kitap'ın tamamını hiç çevirmedi ve bu okuyucu da öyleymiş gibi yapmaz. Yeni Ahit ile 150 mezmurun tümü eksiksizdir; peygamberler ve Musa'nın kitapları seçmeler hâlindedir. Başka yerlerde çevirdikleri de burada: 1544 tarihli dua kitabı ile 1549 tarihli Käsikirja ve Messu kendi Kutsal Kitap metnini taşır — aralarında "Genesist mutomat Lughut" başlığıyla basılmış Yaratılış bölümleri de vardır — ve 685 ayet oradan gelir. Bunlar yalnızca kutsal metin ciltlerinde aynı adreste ayet bulunmayan yerlerde, ve yalnızca metnin bir dua içindeki tek bir alıntı olarak değil kesintisiz aktığı yerlerde kullanılır. Böylece Yaratılış sonuçta burada, kısmen: 1–4, 22, 28 ve 32. bölümler. Hâkimler, Rut, 1. Tarihler ve Ester ise büsbütün yoktur. Eksiksiz bir Fince Eski Ahit, zincirde bir basamak yukarıdaki 1642 Biblia'sını beklemek zorunda kaldı.
hero.3=Bu okuyucuda Agricola, Fin zincirinin en eski basamağıdır. Biblia 1642'nin bir ayetinin altında bir basamak açın: metni, Luther'in Almancasının yanında belirir — 1642 kurulunun masasında gerçekten açık duran iki kaynak. Agricola'nın kendisinin altında ise zincir Finceyi bir daha dönmemek üzere terk eder: o, Erasmus'un Yunancasıyla ve Erasmus'un onun yanına bastığı Latinceyle, Luther'in Almancasıyla ve Vulgata'yla çalışıyordu. Bunlardan üçü burada onun kaynakları olarak kayıtlıdır; Erasmus'un Latincesi ile yararlandığı 1541 tarihli Gustav Vasa'nın İsveççe tam Kutsal Kitabı bu derlemde yoktur. Metin, Kotus'un VKS derleminden, 1548 baskısının kendi yazımıyla: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". İsveççe Kutsal Kitap 1526'dan beri basılıydı — o yıl İsveççe Yeni Ahit çıkmıştı — dolayısıyla bir İsveççe çeviri en baştan elinin altındaydı.

