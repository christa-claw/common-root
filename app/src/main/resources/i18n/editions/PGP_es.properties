title=Perla de Gran Precio — Acerca de esta edición | Common Root
description=La Perla de Gran Precio: una selección de revelaciones, traducciones y relatos de Joseph Smith, reunida por primera vez en 1851 como folleto misional en Liverpool, Inglaterra, y aceptada como escritura por los santos de los últimos días en 1880.
heroHeading=Perla de Gran Precio
readerHref=/reader?c1.src=pgp

hero.1=La Perla de Gran Precio nació como un folleto misional, no como un libro de escritura. En 1851, Franklin D. Richards, entonces presidente de la Misión Europea de la iglesia, la compiló en Liverpool, Inglaterra, reuniendo escritos de Joseph Smith que habían aparecido en los primeros periódicos de la iglesia o que solo habían circulado en pocos ejemplares, para que los miembros de Gran Bretaña los tuvieran en un solo lugar. Su título procede de la parábola de Mateo 13:45–46, la del mercader que vende todo lo que tiene para comprar una sola perla de gran precio.
hero.2=Una segunda edición, revisada y reordenada por Orson Pratt, se publicó en Salt Lake City en 1878, y el 10 de octubre de 1880 una conferencia general de la iglesia la aceptó por votación como escritura. Una revisión de 1902, preparada sobre todo por James E. Talmage, dividió el texto en capítulos y versículos y suprimió las revelaciones que compartía con Doctrina y Convenios; una edición de 1921 la dispuso a dos columnas. En 1976 se añadieron dos revelaciones más —una visión del reino celestial y la visión de Joseph F. Smith sobre la redención de los muertos— y en 1979 la iglesia las trasladó a Doctrina y Convenios, cuya edición de 1981 las imprime como secciones 137 y 138.
hero.3=La edición actual consta de cinco partes. Selecciones del Libro de Moisés y José Smith—Mateo son extractos de la revisión de la Biblia del rey Jacobo que Joseph Smith comenzó en 1830: la primera, un relato ampliado de los capítulos iniciales del Génesis, enmarcado por visiones dadas a Moisés; la segunda, una reelaboración de Mateo 23:39 y del capítulo 24. El Libro de Abraham es el texto que Smith dijo haber traducido de unos papiros egipcios adquiridos en Kirtland, Ohio, en 1835; se publicó en 1842 en el Times and Seasons de Nauvoo, Illinois, con tres ilustraciones que hoy se llaman facsímiles 1, 2 y 3. José Smith—Historia procede del relato de sus primeros años y visiones que él preparó en 1838, y los Artículos de Fe son trece declaraciones de creencia tomadas de una carta de 1842 al director de periódico de Chicago John Wentworth.
hero.4=El Libro de Abraham es la parte más cuestionada. Durante mucho tiempo se creyó que la mayoría de los papiros se había perdido, probablemente en el incendio de Chicago de 1871, pero diez fragmentos que habían estado en posesión de Joseph Smith aparecieron en el Metropolitan Museum of Art de Nueva York, que los transfirió a la iglesia en 1967. Los especialistas identifican los fragmentos como partes de textos funerarios egipcios corrientes, escritos entre el siglo III a. C. y el siglo I d. C., y el propio ensayo publicado por la iglesia sobre el libro reconoce que ninguno de los caracteres que contienen menciona el nombre de Abraham ni ningún suceso que el libro relate.
hero.5=Junto con la Biblia, el Libro de Mormón y Doctrina y Convenios, es una de las cuatro obras canónicas de La Iglesia de Jesucristo de los Santos de los Últimos Días; la Comunidad de Cristo, la otra gran iglesia surgida del movimiento de Joseph Smith, no la cuenta entre sus escrituras. El texto de este corpus proviene de la exportación JSON de dominio público del Mormon Documentation Project, la misma fuente que el Libro de Mormón y Doctrina y Convenios de este sitio, y conserva las cinco partes como cinco libros: Moisés con ocho capítulos, Abraham con cinco y los tres últimos con uno cada uno. Los tres facsímiles y las explicaciones impresas con ellos no son texto en versículos, por lo que no se incluyen. Como sus dos compañeros, recoge la redacción de la edición estándar actual y no la de ninguna impresión histórica concreta, razón por la cual no se indica aquí un año de publicación.

