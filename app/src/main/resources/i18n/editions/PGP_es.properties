fact.1.value=Inglés
fact.2.label=Hecha por
fact.2.value=Joseph Smith Jr. (1805–1844): revelaciones, su revisión de la Biblia del rey Jacobo, una traducción que dijo haber hecho de papiros egipcios, su propia historia y una declaración de creencias; reunida por primera vez en un volumen por Franklin D. Richards
fact.3.label=Publicada
fact.3.value=1851, Liverpool, Inglaterra, como folleto misional compilado por Franklin D. Richards; segunda edición 1878, Salt Lake City, revisada por Orson Pratt; aceptada como escritura por una conferencia general el 10 de octubre de 1880
fact.4.label=Estructura
fact.4.value=Cinco partes —Selecciones del Libro de Moisés, el Libro de Abraham, José Smith—Mateo, José Smith—Historia y los Artículos de Fe—, divididas en capítulos y versículos desde la revisión de 1902; nuestro corpus trata cada parte como un libro
fact.5.label=Posición
fact.5.value=Una de las cuatro obras canónicas de La Iglesia de Jesucristo de los Santos de los Últimos Días, junto a la Biblia, el [[BOM|Libro de Mormón]] y [[DC|Doctrina y Convenios]]; la Comunidad de Cristo no la considera escritura
fact.6.label=En este corpus
fact.6.value=El texto sigue la redacción estándar actual de la exportación JSON de dominio público del Mormon Documentation Project —la misma fuente que el [[BOM|Libro de Mormón]] y [[DC|Doctrina y Convenios]]—; los extractos de Moisés y Mateo reelaboran el texto de [[KJV|la King James Version]], que el corpus también contiene; los facsímiles y sus explicaciones se han omitido, y no se indica aquí un año de impresión concreto
fact.7.label=Licencia
fact.7.value=De dominio público, según indica el responsable de los datos; el aparato de estudio moderno protegido por derechos de autor no está incluido
