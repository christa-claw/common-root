title=Textus Receptus — Informazioni su questa edizione | Common Root
description=Il Textus Receptus: il Nuovo Testamento greco a stampa che sta dietro a Lutero, Tyndale e alla Bibbia di re Giacomo, curato per la prima volta da Erasmo nel 1516 e battezzato da una riga pubblicitaria del 1633.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Ogni Bibbia della Riforma presente in questa raccolta discende da un libro stampato a Basilea nel 1516. Erasmo da Rotterdam voleva portare il Nuovo Testamento greco alle stampe prima di chiunque altro, e lavorò in fretta — a partire dalla manciata di manoscritti tardi che poteva raggiungere a Basilea, nessuno dei quali particolarmente antico. Dove alla sua copia dell'Apocalisse mancava l'ultimo foglio, ritradusse in greco gli ultimi sei versetti dalla Vulgata latina. Quei versetti entrarono nella stampa e vi rimasero per quattro secoli.
hero.2=Il testo fu corretto e ristampato per un secolo ancora — da Erasmo stesso, poi da Robert Estienne a Parigi e Teodoro di Beza a Ginevra. La quarta edizione di Estienne, del 1551, fece qualcosa le cui conseguenze vanno ben oltre l'erudizione: divise il testo in versetti numerati. Sono i numeri di versetto ancora stampati in quasi ogni Bibbia del mondo, e quelli che questo lettore permette di disattivare.
hero.3=Il nome arrivò per ultimo, e arrivò dalla pubblicità. Nel 1633 i fratelli Elzevier di Leida reclamizzarono la loro edizione con la riga che il lettore aveva ormai “il testo ricevuto da tutti” — textus receptus. Era l'affermazione di un libraio, non un verdetto degli studiosi, ma rimase attaccata. Quando nell'Ottocento riaffiorarono manoscritti più antichi, curatori da Tischendorf a Westcott e Hort vi costruirono sopra testi nuovi, e le traduzioni moderne seguono quelli. Il Textus Receptus resta qui per la ragione che lo rende importante: è ciò che Lutero, Tyndale, i traduttori di Ginevra e i comitati di re Giacomo avevano davvero davanti, ed è dunque il testo contro cui va letta la loro formulazione.

