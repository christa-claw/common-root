title=Les quarante hadiths qudsi — À propos de cette édition | Common Root
description=Quarante hadiths qudsi — des paroles dont le sens, selon les musulmans, vient de Dieu, tandis que leur formulation, comme pour tout autre hadith, passe par Mahomet — lus ici comme volume compagnon des quarante hadiths d'an-Nawawi.
heroHeading=Les quarante hadiths qudsi
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Un hadith qudsi (hadith « sacré » ou « divin ») se distingue d'un hadith ordinaire par l'origine attribuée à son sens : des savants comme al-Jurjani le décrivent comme la parole de Dieu, exprimée dans les propres mots de Mahomet, à la différence du Coran, dont la formulation même est tenue pour divine. Cette distinction porte sur le rang, non sur la fiabilité — un hadith qudsi n'a pas besoin d'être sahih (sûr) ; certains ainsi classés sont da'if (faibles) ou contestés, jugés selon les mêmes critères de chaînes de transmission que tout autre hadith.
hero.2=Réunir quarante hadiths qudsi suit la même vieille habitude que [[NAW|les quarante hadiths d'an-Nawawi]] et le genre plus large des « quarante hadiths » (arba'iniyyat) auquel il appartient, mais restreint ici à une seule catégorie de hadith plutôt qu'au hadith en général. Une édition anglaise largement diffusée sous ce même titre — choisie et traduite par Ezzeddin Ibrahim et Denys Johnson-Davies, qui réalisèrent aussi la traduction compagnon du recueil d'an-Nawawi — fut publiée par l'Islamic Texts Society en 1997 sous forme de volume bilingue arabe-anglais, ses quarante hadiths étant puisés dans l'ensemble de la littérature hadithique classique. Que les quarante hadiths offerts par ce corpus soient cette même sélection, ou un ensemble assemblé indépendamment et publié sous le même titre traditionnel, n'a pas été établi du côté de ce corpus.
hero.3=Le texte arabe ici est le matn classique, tenu pour appartenir au domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-qudsi de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]], le [[NAS|Sunan an-Nasa'i]], le [[IBM|Sunan Ibn Majah]], le [[MAL|Muwatta Malik]], les [[NAW|quarante hadiths d'an-Nawawi]] et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

