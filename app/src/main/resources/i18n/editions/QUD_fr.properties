fact.4.label=Compilé
fact.4.value=Une anthologie puisée dans la littérature hadithique plus large plutôt qu'un texte unique continu ; l'édition anglaise d'Ibrahim/Johnson-Davies sous ce titre fut publiée en 1997
fact.5.label=Méthode
fact.5.value=Sélection fondée sur le classement qudsi, non sur le rang canonique ; un hadith qudsi n'a pas besoin d'être sahih (sûr) — certains ainsi classés sont da'if (faibles) ou contestés
fact.6.label=Rang
fact.6.value=Une anthologie parmi plusieurs portant ce titre, dans la même tradition ancienne des quarante hadiths (arba'iniyyat) que [[NAW|les quarante hadiths d'an-Nawawi]]
