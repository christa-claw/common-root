title=स्मिथ एवं वान डाइक — इस संस्करण के विषय में | Common Root
description=स्मिथ और वान डाइक की अरबी बाइबिल: बेरूत में एली स्मिथ द्वारा आरम्भ और 1865 में कॉर्नेलियस वान डाइक द्वारा सम्पन्न, जिसमें नह्दा के विद्वान बुत्रुस अल-बुस्तानी, नासिफ़ अल-याज़िजी और यूसुफ़ अल-असीर सहभागी थे; आज भी सर्वाधिक पढ़ी जाने वाली अरबी बाइबिल।
heroHeading=स्मिथ एवं वान डाइक
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=बेरूत के अमेरिकी मिशन ने यह अनुवाद लगभग 1847 में आरम्भ किया, और जिसने आरम्भ किया उसी ने पूरा नहीं किया। एली स्मिथ लेवांत में दो दशक बिता चुके थे और भाषा इतनी जानते थे कि उस पर विवाद कर सकें; वे 1857 में अपनी मृत्यु तक पाठ पर लगे रहे। कॉर्नेलियस वान एलन वान डाइक ने कार्य सँभाला और उसे अन्त तक पहुँचाया — नया नियम 1860 में तैयार हुआ, पुराना नियम पाँच वर्ष बाद, 1865 में। पुस्तक पर अंकित दोनों नाम एक ही श्रम के दो अर्ध हैं।
hero.2=जो नाम पीठ पर नहीं हैं, उनका भार उतना ही है। वान डाइक ने अपनी अरबी बुत्रुस अल-बुस्तानी और नासिफ़ अल-याज़िजी से सीखी थी, और दोनों ने उनके साथ अनुवाद पर काम किया, वैसे ही शेख़ यूसुफ़ अल-असीर ने, जिन्होंने मुहावरे और शैली की दृष्टि से अरबी को पूरा देखा। वे तीनों किसी मिशनरी उद्यम के सहायक नहीं थे। वे नह्दा के, अर्थात् अरबी साहित्यिक पुनर्जागरण के, केन्द्रीय व्यक्तियों में थे, और जो निकला वह अरबी गद्य-सा पढ़ा जाता है, अरबी वेश धारण किए अनुवाद-सा नहीं। इसी कारण यह पुस्तक उस मिशन से अधिक जीवित रही जिसने इसका व्यय उठाया था।
hero.3=यह विद्वत्ता जितनी ही मुद्रण-कला की भी उपलब्धि थी। बेरूत के अमेरिकी प्रेस ने इसे उस अरबी टाइप में जमाया जो मिशन के लिए गढ़ा गया और 1843 में पूरा हुआ — वही अक्षर-रूप जो आज भी अल-अमेरिकानी कहलाता है और जिसके गठन में स्मिथ का हाथ था। अरबी को भली भाँति जमाना कठिन है — अक्षर जुड़ते हैं और जुड़ते ही रूप बदल देते हैं — और एक बाइबिल जो पृष्ठ पर ठीक दिखती हो, उसने अपनी स्वीकृति के लिए उससे अधिक किया जितना कोई तर्क कर पाता। तब से लाखों प्रतियाँ निकल चुकी हैं, प्रोटेस्टेंट और कॉप्टिक दोनों पाठकों तक, और अधिकांश अरबी-भाषी ईसाइयों के लिए बाइबिल की ध्वनि सीधे-सीधे यही है।
hero.4=इस पाठक में यह एकमात्र अरबी बाइबिल है, और इसी से इसका बर्ताव तय होता है। अन्तरफलक को अरबी पर रखने पर यही खुलती है — इसलिए नहीं कि इसे चुना गया, जैसे स्पेनी के लिए रेइना-वालेरा 1909 चुनी गई, बल्कि इसलिए कि सूची अन्तरफलक की भाषा में बाइबिल ढूँढ़ती है और ठीक एक ही पाती है। यह यहाँ के उन दो ही संस्करणों में से एक है जिनका पाठ दाएँ से बाएँ चलता है; दूसरा आधुनिक इब्रानी बाइबिल है। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं, अतः किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है — और यहाँ यह सामान्य से अधिक निकट बैठता है, क्योंकि वह तल जो यूनानी देता है वही तेक्स्तुस रेसेप्तुस है, और तेक्स्तुस रेसेप्तुस से ही इसका नया नियम बना।

