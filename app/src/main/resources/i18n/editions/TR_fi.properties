title=Textus Receptus — Tietoja tästä laitoksesta | Common Root
description=Textus Receptus: painettu kreikankielinen Uusi testamentti Lutherin, Tyndalen ja kuningas Jaakon käännöksen takana, jonka Erasmus toimitti ensi kerran 1516 ja joka sai nimensä kirjakauppiaan mainoslauseesta 1633.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Jokainen tämän kokoelman uskonpuhdistuksen ajan Raamattu polveutuu kirjasta, joka painettiin Baselissa 1516. Erasmus Rotterdamilainen halusi saada kreikankielisen Uuden testamentin painoon ennen ketään muuta, ja hän teki työn nopeasti — niiden harvojen myöhäisten käsikirjoitusten pohjalta, jotka hän Baselissa tavoitti, eikä yksikään niistä ollut erityisen vanha. Kun hänen Ilmestyskirjan kappaleestaan puuttui viimeinen lehti, hän käänsi kuusi viimeistä jaetta takaisin kreikaksi latinalaisesta Vulgatasta. Ne jakeet päätyivät painoon ja pysyivät siellä neljä vuosisataa.
hero.2=Tekstia korjattiin ja julkaistiin uudelleen sadan vuoden ajan — ensin Erasmus itse, sitten Robert Estienne Pariisissa ja Theodore Beza Genevessä. Estiennen neljäs laitos vuodelta 1551 teki jotakin, jonka seuraukset ulottuvat kauas oppineisuuden ulkopuolelle: se jakoi tekstin numeroituihin jakeisiin. Ne ovat samat jaenumerot, jotka yhä painetaan lähes jokaiseen Raamattuun maailmassa — ja ne, jotka tässä lukijassa voi kytkeä pois.
hero.3=Nimi tuli viimeisenä, ja se tuli mainonnasta. Vuonna 1633 Elzevirin veljekset Leidenistä mainostivat laitostaan lauseella, jonka mukaan lukijalla oli nyt “kaikkien vastaanottama teksti” — textus receptus. Se oli kirjakauppiaan väite, ei tieteellinen tuomio, mutta se jäi elämään. Kun vanhempia käsikirjoituksia löytyi 1800-luvulla, Tischendorfista Westcottiin ja Hortiin ulottuva toimittajien joukko rakensi niiden varaan uudet tekstit, ja nykykäännökset seuraavat niitä. Textus Receptus on täällä siitä syystä missä sen merkitys on: se on se, mikä Lutherilla, Tyndalella, Geneven kääntäjillä ja kuningas Jaakon komiteoilla todella oli edessään, joten heidän sanamuotojaan on luettava sitä vasten.

