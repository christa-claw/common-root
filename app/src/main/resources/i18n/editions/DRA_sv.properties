fact.5.label=Reviderad av
fact.5.value=biskop Richard Challoner, 1749–1752 — varje bok som i dag säljs som Douay-Rheims är Challoners revision, inte texten från 1582/1610
fact.6.label=Denna tryckning
fact.6.value=1899 års amerikanska utgåva från John Murphy Company, Baltimore, med imprimatur av kardinal James Gibbons — sedan länge fri från upphovsrätt, och den version som cirkulerar digitalt
fact.7.label=Innehållet här
fact.7.value=72 böcker: den protestantiska kanons 66 i protestantisk ordning, med Tobit, Judit, 1 och 2 Mackabeerboken, Vishetens bok och Syraks bok tillagda efter Uppenbarelseboken. Baruk saknas, så denna spalt är ingen tillförlitlig kontroll av den katolska kanon
fact.8.label=Härstamning
