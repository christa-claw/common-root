title=Douay-Rheims 1899 — Om denna utgåva | Common Root
description=Douay-Rheims-bibeln: den engelska katolska översättningen gjord från den latinska Vulgata i Reims 1582 och Douai 1609–10, reviderad av biskop Challoner, i Baltimoretryckningen från 1899.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=År 1568 grundade en grupp engelska katoliker, många av dem Oxfordmän som inte längre kunde behålla sina tjänster, ett kollegium i Douai i Flandern under William Allen. En del av dess ändamål var att lägga en engelsk bibel i katolska händer, eftersom de enda engelska biblar som då fanns i omlopp var protestantiska och användes i polemik. Gregory Martin började översätta i oktober 1578 i ungefär två kapitel om dagen, och Nya testamentet utkom 1582 i Reims, dit kollegiet tillfälligt hade flyttat. Martin dog den 28 oktober samma år, veckor efter att hans Nya testamente hade utkommit. Gamla testamentet var färdigt samtidigt och blev sedan liggande otryckt, av det enkla skälet att kollegiet inte hade råd att trycka det; det kom till sist ut i två band 1609 och 1610, då King James Version var två år bort.
hero.2=Det som skiljer den från varje annan engelsk bibel i detta korpus är vad den gjordes av. Inte hebreiskan och grekiskan: den latinska Vulgata. Tridentinska mötet hade förklarat Vulgata vara kyrkans autentiska text, och Douaiöversättarna hävdade dessutom att Hieronymus hade arbetat från handskrifter äldre än någon grekisk avskrift som var tillgänglig för dem — vilket, för Gamla testamentets del, inte var något orimligt att tänka år 1600. Prosan som blev följden är tungt latiniserad, ibland till den grad att den inte är engelska alls: Herrens bön ber om “supersubstantial bread”, därför att översättarna inte ville naturalisera ett ord som teologin vilade på. Det var en princip, inte en oförmåga.
hero.3=Vid mitten av sjuttonhundratalet kunde nästan ingen läsa den, och biskop Richard Challoner reviderade den mellan 1749 och 1752 — grundligt, och till stor del i riktning mot King James Version, som vid det laget helt enkelt var hur engelsk skrift lät. Varje bibel som i dag säljs som Douay-Rheims är Challoners text snarare än Martins. Denna är 1899 års amerikanska tryckning, från John Murphy Company i Baltimore, med imprimatur av kardinal James Gibbons; eftersom den tryckningen sedan länge är fri från upphovsrätt är det den som har skannats, knappats in och återgivits ända sedan dess, och den är vad nästan varje digital Douay-Rheims i själva verket är.
hero.4=I den här läsaren gör den något som nästan ingen annan utgåva här kan. Dess registrerade förlaga finns i korpuset: öppna en stegpinne under en Douay-Rheims-vers och stegpinnen under är den latinska Vulgata själv, den text den faktiskt översattes från, i stället för det ≈-markerade originalspråksgolv som de flesta utgåvor faller igenom till. Det är just det fall stegpinnemekanismen byggdes för. Inflytandet gick också åt andra hållet — Reims Nya testamente låg på King James-översättarnas bord, och en hel del av dess latiniserade ordförråd gick över i deras arbete — men härstamningslistan för bara formella revisionslinjer, så den skulden är inte registrerad där. En omkastning att lägga märke till: dess stegpinne visar året 1899 medan katalogkortet inte visar något år alls. Stegpinneåren är en handkurerad lista och kortet läser katalogens egna metadata, och där en utgåva finns i det ena men inte i det andra är de två offentligt oense.
hero.5=En varning om kanon. Texten som förvaras här har 72 böcker, inte de 73 i en tryckt katolsk bibel. De sex deuterokanoniska böcker den bär — Tobit, Judit, 1 och 2 Mackabeerboken, Vishetens bok och Syraks bok — står efter Uppenbarelseboken i stället för på sina katolska platser, och Baruk saknas helt. Det är en egenskap hos den digitala texten som den togs in, inte hos boken från 1899, och det betyder att denna spalt läses rätt vers för vers men inte bör användas för att kontrollera vad den katolska kanon innehåller.

