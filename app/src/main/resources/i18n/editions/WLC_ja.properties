title=レニングラード写本 — この版について | Common Root
description=レニングラード写本：現存する最古の完全なヘブライ語聖書写本。西暦1008年に書写され、現在も大半の現代旧約聖書学術訳の底本となっている。
heroHeading=レニングラード写本
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=現存する中で最も古い、完全な形を保つヘブライ語聖書の写本である。書き上げたのは旧カイロで活動した書記者サムエル・ベン・ヤコブで、彼自身が写本の末尾に記した識語によれば、その仕事を西暦1008年のものとしている。
hero.2=サムエル・ベン・ヤコブは本文を創り出したのではなく、受け継がれてきたものを書き写した。彼が従ったのはベン・アシェル家の伝統であり、同家はマソラ——ヘブライ語聖書の発音を定め、本文が損なわれないよう守るために、ユダヤ人学者たちが何世紀もかけて磨き上げてきた、母音符号・朗誦記号・欄外注からなる精緻な体系——の第一の権威であった。ベン・アシェル家に連なる、より古くおそらくより権威が高いとされる写本も現存している——アレッポ写本である——が、そのトーラー部分の大半は1947年に失われた。レニングラード写本が貴重とされるのは、まさにそれが完全な形を保ち、かつこの伝統の源流に直接立つほど古いからである。
hero.3=その名は、後にこの写本が落ち着いた都市にちなむ。写本が西洋の学界に入った当時、サンクトペテルブルクはレニングラードと呼ばれており、1991年に都市が元の名を取り戻した後も、この呼び名は定着したままとなった。今日、この写本はヘブライ語聖書の標準的な学術版であるビブリア・ヘブライカ・シュトゥットガルテンシアの底本となっている。つまり、ほぼすべての言語による、ほぼすべての現代の旧約聖書訳は——読者がその名を知っているかどうかにかかわらず——11世紀のこのカイロの一人の書記者による丁寧な書写にまで遡るのである。

