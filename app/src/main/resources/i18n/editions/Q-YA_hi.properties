# The narrative, one paragraph per key, in order.
hero.1=अब्दुल्लाह यूसुफ़ अली (1872-1953) का जन्म बॉम्बे में हुआ और उनकी शिक्षा पहले वहाँ विल्सन कॉलेज में हुई, जहाँ स्कूली पढ़ाई के साथ-साथ दी गई धार्मिक शिक्षा ने बचपन में ही उन्हें क़ुरआन कंठस्थ करवा दिया। 1891 में बॉम्बे विश्वविद्यालय से अंग्रेज़ी साहित्य में प्रथम श्रेणी की बी.ए. उपाधि ने उन्हें ब्रिटेन जाने के लिए एक प्रेज़िडेंसी छात्रवृत्ति दिलाई, जहाँ उन्होंने कैम्ब्रिज के सेंट जॉन्स कॉलेज में क़ानून पढ़ा, 1895 में बी.ए. और एल.एल.बी. की उपाधि लेकर स्नातक हुए, और उसी वर्ष भारतीय सिविल सेवा में एक पद के साथ भारत लौटे।
hero.2=उन्होंने सिविल सेवा में लगभग दो दशक बिताए — मैजिस्ट्रेट और राजस्व अधिकारी के रूप में, फिर न्यायाधीश के रूप में, और बाद में भारत सरकार के वित्त विभाग में उप-सचिव के रूप में — 1914 में इस्तीफ़ा देकर ब्रिटेन में बस जाने से पहले। वहाँ वे वोकिंग की शाह जहाँ मस्जिद और ईस्ट लंदन मस्जिद कोष के ट्रस्टी बने, युद्धकालीन कार्य के लिए 1917 में उन्हें सी.बी.ई. की उपाधि मिली, और उन्होंने स्कूल ऑफ़ ओरिएंटल स्टडीज़ में हिंदुस्तानी भाषा पढ़ाई। वे 1920 और 1930 के दशकों में लाहौर के इस्लामिया कॉलेज के प्राचार्य के रूप में भारत लौटे, और इन्हीं वर्षों में, एक दशक से अधिक के काम के बाद, उन्होंने अपनी व्याख्यात्मक टिप्पणियों के साथ क़ुरआन को अंग्रेज़ी में उतारा।
hero.3=यह अनुवाद 1934 और 1937 के बीच तीस क्रमिक भागों में प्रकाशित हुआ, पहला भाग 4 अप्रैल 1934 को, "The Holy Qur'an: Text, Translation and Commentary" शीर्षक से, लाहौर के शेख़ मुहम्मद अशरफ़ द्वारा प्रकाशित; 1938 में एक संयुक्त एकल-खंड संस्करण आया, और 1939-1940 में एक संशोधित संस्करण। पिकथॉल के अनुवाद के साथ, यह बीसवीं सदी के दो सबसे अधिक पढ़े जाने वाले अंग्रेज़ी क़ुरआन अनुवादों में से एक बन गया, जो सबसे अधिक अपने व्यापक पाद-टिप्पणियों के लिए जाना जाता है, और तब से लगभग तीस और मुद्रणों में पुनः प्रकाशित हुआ है, जिनमें से कुछ अन्य हाथों द्वारा पुनः संपादित भी हुए — जिनमें 1977 से उत्तरी अमेरिका में Amana Publications द्वारा वितरित एक संस्करण और 1980 के दशक का सऊदी-प्रायोजित संशोधन शामिल है।
hero.4=यहाँ alquran.cloud के माध्यम से जो डिजिटलीकृत किया गया है, वह अनुवाद का पाठ स्वयं है, यूसुफ़ अली की साथ वाली टीका नहीं, और इसे इस संग्रह में [[Q-AR|उस्मानी अरबी पाठ]] के साथ एक दूसरे अंग्रेज़ी साथी अनुवाद के रूप में प्रस्तुत किया गया है, 1930 के [[Q-EN|पिकथॉल के अनुवाद]] के साथ। यह उन केवल दो अंग्रेज़ी अनुवादों में से एक था जिन्हें उपलब्ध अनुवादों की एक समीक्षा ने स्पष्ट रूप से स्वतंत्र रूप से उपयोग योग्य पाया — यह और पिकथॉल का अनुवाद — हालाँकि "स्पष्ट रूप से" यहाँ एक सीमा की माँग करता है: यह कृति यूरोपीय संघ और पाकिस्तान में सार्वजनिक अधिकार-क्षेत्र में है, जहाँ यूसुफ़ अली की मृत्यु हुई और जहाँ यह कृति पहली बार प्रकाशित हुई, लेकिन 1996 में संयुक्त राज्य अमेरिका में पंजीकृत एक औपचारिक कॉपीराइट को वहाँ 2033 तक प्रभावी माना जाता है।

