title=क़ुरआन — यूसुफ़ अली — इस संस्करण के बारे में | Common Root
description=अब्दुल्लाह यूसुफ़ अली का अनुवाद, जो 1934 से 1937 के बीच चार खंडों में एक भारतीय सिविल सेवक द्वारा प्रकाशित हुआ जो बाद में इस्लामी विद्वान बना — उपलब्ध अनुवादों में से केवल दो अंग्रेज़ी क़ुरआन अनुवाद जो स्पष्ट रूप से सार्वजनिक अधिकार-क्षेत्र में पाए गए, और इस संग्रह में पिकथॉल के अनुवाद के साथ एक दूसरा अंग्रेज़ी साथी अनुवाद।
heroHeading=क़ुरआन — यूसुफ़ अली
