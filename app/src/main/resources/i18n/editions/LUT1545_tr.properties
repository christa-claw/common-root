title=Luther Bibel 1545 — Bu Baskı Hakkında | Common Root
description=Luther'in Ausgabe letzter Hand'i: 1545 Wittenberg Kutsal Kitabı, Martin Luther'in kendi gözden geçirdiği son baskı ve ölümünden sonra ölçüt hâline gelen metin.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Luther'in ilk Kutsal Kitabı değil, sonuncusu. Wartburg'da yaptığı Yeni Antlaşma 1522'de, tam Kutsal Kitap 1534'te çıktı; bir on yıl daha gözden geçirmeyi sürdürdü ve Hans Lufft'un 1545'te Wittenberg'de bastığı baskı, Luther'in bizzat sonuna kadar götürdüğü son baskıdır. Almanca ona Ausgabe letzter Hand, son el baskısı der. Ertesi şubat öldü ve bu metin, sonraki Luther Kutsal Kitaplarının kendisine göre ayarlandığı ölçüt oldu.
hero.2=Latinceden değil, asıllardan çalıştı: Yeni Antlaşma için Erasmus'un basılı Yunancası, Eski Antlaşma için Masoretik İbranice ve güç yerleri tartışmak üzere bir Wittenberg meslektaşları çevresi. Ortaya çıkan şey, Almanca için aşağı yukarı 1642 Biblia'sının bir yüzyıl sonra Fince için yapacağı şeyi yaptı. Çok lehçeli ve yerleşik düzyazısı az olan bir dile herkesin okuyabileceği tek bir düzey verildi ve modern yazı dili ondan büyüdü.
hero.3=Burada iki zincir buluşur. Luther Bibel 1912 doğrudan bu baskının üstünde durur, çünkü onun bir gözden geçirmesidir. Fin hattında üç basamak yukarıdaki Biblia 1642 de öyle, çünkü Turku kurulu Luther açık hâlde çalışıyordu. Altında merdiven zemine ulaşır — Yunanca için Textus Receptus, İbranice için Westminster Leningrad Kodeksi — ve bu basamaklar ≈ ile işaretli değil, dolu basamaklardır; çünkü Erasmus'un Yunancası ile Masoretik İbranice, Luther'in gerçekten kendisinden çevirdiği metinlerdir, sonradan yerleştirilmiş tanıklar değil.

