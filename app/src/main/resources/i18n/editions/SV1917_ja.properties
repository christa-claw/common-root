title=Svenska 1917 — この版について | Common Root
description=スウェーデン教会による1917年の翻訳——Gustav V:s bibel——先行版の改訂ではなく、ヘブライ語とギリシャ語から直接作られた最初のスウェーデン語聖書であり、このコーパスが保持する唯一のスウェーデン語聖書である。
heroHeading=Svenska 1917
