# The narrative, one paragraph per key, in order.
hero.1=三世紀半にわたり、スウェーデン教会には一つの聖書しかなく、改訂されても作り直されることはなかった。スウェーデン語で印刷された最初の完全な聖書である1541年のグスタフ・ヴァーサの聖書は、マルティン・ルターのドイツ語に大きく依拠していた。1618年のグスタフ2世アドルフの聖書がそれを改訂し、1703年のKarl XII:s bibel——父王が命じたものの、完成したのは別の王の代であった——が、同じ受け継がれたスウェーデン語をさらに一歩進めた。三つのいずれも、最初からやり直すことはしなかった。
hero.2=1773年、グスタフ3世は、それらの改訂のいずれも行わなかったことを行う聖書委員会を任命した——古いスウェーデン語をもう一度進めるのではなく、ヘブライ語とギリシャ語から直接翻訳することである。委員会は144年にわたって活動した。その成果——グスタフ・ヴァーサの翻訳の後、Bibel 2000の前に来る、スウェーデンの二番目の完全な聖書翻訳——は1917年、グスタフ5世のもとで完成し認可され、そのためいまも Gustav V:s bibel と呼ばれることが多い。
hero.3=旧約聖書は、それ以前の版と同様、マソラ本文のヘブライ語に基づく。新約聖書はその系譜を継がない——このコーパスの宗教改革期の聖書が基づくテクストゥス・レセプトゥスではなく、1917年までに委員会が入手できた最も最新の校訂ギリシャ語本文に従っている。
hero.4=この読書環境において、これは唯一のスウェーデン語聖書であり、インターフェースをスウェーデン語に設定するとこれが開く——レイナ・バレラ1909がスペイン語のために選び抜かれたのとは違い、選定によってではなく、カタログを走査してもこの言語には他に何もないためである。系譜の段には母本が記録されていないため、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る。その底面はギリシャ語についてテクストゥス・レセプトゥスを供給しており、ここでは常よりも真実から遠いところに落ちる——委員会はより最新の校訂本文のために、意図的にテクストゥス・レセプトゥスを後に残したのであり、そのためこの翻訳の節の下にある底面は、この翻訳が実際に従った本文とは異なるギリシャ語本文を指し示すことになる。

