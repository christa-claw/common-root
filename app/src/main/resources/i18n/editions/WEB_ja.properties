fact.1.label=言語
fact.1.value=英語
fact.2.label=制作者
fact.2.value=マイケル・ポール・ジョンソン。数百人のボランティアの校正者・協力者とともに。Rainbow Missionsにより出版され、eBible.orgを通じて配布されている
fact.3.label=出版
fact.3.value=単一の年はない——1994年に始まり、1997年以降は改訂を重ねて刊行され、今では訂正を除いて固定されている。これがAboutページの年の欄が空欄である理由である
fact.4.label=改訂元
fact.4.value=[[ASV|1901年のアメリカン・スタンダード・バージョン]]。正確で、著作権から完全に自由だったために選ばれた
fact.5.label=旧約の底本
fact.5.value=マソラ本文のヘブライ語。ビブリア・ヘブライカ・シュトゥットガルテンシア版による
fact.6.label=新約の底本
fact.6.value=ビザンティン本文——親版の校訂ギリシャ語でも[[TR|テクストゥス・レセプトゥス]]でもない
fact.7.label=特徴
fact.7.value=旧約聖書全体を通じて神の御名に「Yahweh」を用いており、アメリカン・スタンダード・バージョンは「Jehovah」、[[KJV|キング・ジェイムズ・バージョン]]は「the LORD」と印刷していた
fact.8.label=ライセンス
fact.8.value=翻訳者の意図によるパブリックドメイン——この企画が始められた理由そのものである
fact.9.label=このコーパスでは
fact.9.value=最長の系譜連鎖の葉——WEB → ASV → RV → KJV → GNV——であり、その中でもっとも幅広い本文で、アメリカン・スタンダード・バージョンの六十六巻に対して八十巻を数える
