title=World English Bible — この版について | Common Root
description=ワールド・イングリッシュ・バイブル：1901年のアメリカン・スタンダード・バージョンを現代英語に改訂したものであり、1994年にマイケル・ポール・ジョンソンによって始められ、新約聖書はギリシャ語多数派本文に合わせられ、意図的にパブリックドメインに置かれている。
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=ワールド・イングリッシュ・バイブルが存在するのは、著作権の問題があったからである。1994年、フルタイムの仕事の合間を縫って聖書を翻訳していた技術者マイケル・ポール・ジョンソンは、誰もが自由に複製できる現代英語の聖書を完成させるのにどれだけの時間がかかるかを計算し、その答えが気に入らなかった。彼はゼロから翻訳するのをやめ、1901年のアメリカン・スタンダード・バージョンを土台にやり直した——正確で、信頼されており、そして、キング・ジェイムズ・バージョンとは違って(イングランドとウェールズでは今なお王室の勅許状に縛られている)、著作権から完全に自由だったからである。彼が自分で書いたプログラムがASVを調べて、現代の聖書ではもう使われない語を探し出し、置き換え案を提示し、およそ十五分で置き換えを行った。そのプログラムにできなかったこと——語順、句読点、引用符——はすべて、その後何年もかけて手作業で行われ、本文は1997年以降、出版され、改訂を重ねて再出版された。
hero.2=これが改訂した版と分かれる点は二つある。第一はギリシャ語である。ASVの新約聖書は改訂者たちの校訂本文に従っており、それはのちのネストレ・アーラント版に近いものだった。これに対してワールド・イングリッシュ・バイブルはビザンティン本文に合わせられており、したがって親版の本文でもキング・ジェイムズ訳の訳者たちが用いたテクストゥス・レセプトゥスでもない。第二は神の御名である。ASVは「Jehovah」と印刷したが、ワールド・イングリッシュ・バイブルは「Yahweh」と印刷し、創世記2章4節に脚注を付けて、「the LORD」を期待する読者にこの選択を説明している。イギリス版は「LORD」に戻しているが、このコーパスにある版はアメリカ版であり、したがって読むのは「Yahweh」である。この二つの決定を除けば、親版の流儀にならった形式的対応訳のままである——ヘブライ語とギリシャ語の語順を同じように忠実にたどり、もはや注釈を必要としない綴りと文法で書かれている。
hero.3=このリーダーにおいて、これは葉であり、このコーパスの最長の枝にある唯一の葉である。ワールド・イングリッシュ・バイブルの一節の下で段を開けば、その下にアメリカン・スタンダード・バージョンが現れ、その下にはリバイズド・バージョン、キング・ジェイムズ・バージョン、ジュネーヴ聖書が続き、≈ 印で示された原語の床にまで下る。このコーパスでワールド・イングリッシュ・バイブルの上に立つものは何もない。またこの枝の中でもっとも幅広い本文でもある。アメリカン・スタンダード・バージョンには外典がなかったため、ワールド・イングリッシュ・バイブルの外典は別に作られ、キング・ジェイムズの外典とブレントンの英訳七十人訳から取られた。その結果、私たちの版は八十巻を収めており、その下のASVが収める六十六巻に対して、マカバイ記三・四と詩篇151篇が加わっている——これらはキング・ジェイムズの外典にはないものである。逆にキング・ジェイムズの外典にあるバルク書は、私たちの版には欠けている。Aboutページはこの版の年の欄を空欄のままにしており、それは正しい。単一の刊行年というものが存在しないからである。コーパスは2000年を刻んでおり、段のチップがそれによって並べ替えられるようにしている。

