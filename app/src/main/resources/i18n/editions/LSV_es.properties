title=Literal Standard Version — Acerca de esta edición | Common Root
description=La Literal Standard Version: la revisión de 2020 que Covenant Press hizo de la Literal Translation de Robert Young, del siglo XIX, buscando la traducción inglesa más consistentemente literal del hebreo, el arameo y el griego que permite un inglés legible.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=La Literal Standard Version se presenta como una revisión mayor de la Literal Translation de Robert Young, la Biblia inglesa del siglo XIX de extrema literalidad publicada por primera vez en 1862 y revisada por el propio Young en 1887 y 1898. Covenant Press, el sello editorial de la Covenant Christian Coalition, inició la nueva revisión a comienzos de 2018 con el objetivo declarado de mantener el compromiso de Young con la literalidad palabra por palabra, al mismo tiempo que modernizaba su inglés y corregía los lugares en que la erudición manuscrita y léxica posterior había avanzado. El trabajo se completó y se publicó el 2 de febrero de 2020; el copyright estadounidense se registró en enero de ese año, y las ediciones electrónicas siguieron en mayo del mismo año. Los traductores individuales no se nombran en la edición publicada; Covenant Press y la Covenant Christian Coalition figuran como las entidades patrocinadoras.
hero.2=Para el Antiguo Testamento, la LSV sigue el Texto Masorético, con una influencia sustancial de la Septuaginta y recurso ocasional a los Rollos del Mar Muerto cuando sus lecturas parecían suficientemente claras como para preferirlas. Para el Nuevo Testamento sigue el Textus Receptus y el Texto Mayoritario, adoptando lecturas de la tradición alejandrina solo en casos específicos y declarados, no como política general. Los traductores establecieron tres principios rectores: conservar el tiempo verbal del original siempre que el inglés lo permita, traducir una palabra original dada con la misma palabra inglesa siempre que la consistencia sea posible, y mantener el orden original de las palabras salvo que la legibilidad en inglés exija realmente un cambio. El nombre divino del Antiguo Testamento se translitera en lugar de traducirse con un título como "SEÑOR", conforme a la preferencia general de esta traducción por mostrar al lector las propias decisiones del texto original en lugar de suavizarlas.
hero.3=La conexión con este corpus es más textual que genealógica: el Nuevo Testamento de la Literal Standard Version se apoya en el Textus Receptus y el Texto Mayoritario, la misma base griega que este corpus conserva por separado y de forma completa como el Textus Receptus, el texto que sustenta la King James Version y, en general, la tradición de la época de la Reforma. Ningún peldaño de linaje conecta ambas ediciones, ya que la LSV se presenta como una revisión de la Literal Translation de Young y no del Textus Receptus en sí ni de ningún texto que se tenga aquí; un peldaño abierto bajo un versículo de la LSV va, en consecuencia, directamente al suelo de la lengua original, marcado con ≈. Se publica bajo una licencia Creative Commons Reconocimiento-CompartirIgual 4.0 en lugar de entregarse al dominio público, lo que la sitúa junto a la New International Version y la New American Standard Bible como licenciada y no libremente copiable, aunque en condiciones notablemente más permisivas que ambas. La interfaz en inglés se abre de forma predeterminada en la New International Version; esta edición se alcanza desde su propia tarjeta.

