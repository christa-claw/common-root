fact.9.value=Licenciada bajo condiciones de compartir igual en lugar de entregada al dominio público, situándose junto a [[NIV|la New International Version]] y [[NASB|la New American Standard Bible]] como licenciada y no libremente copiable, aunque en condiciones notablemente más permisivas que ambas. No se registra ningún padre en los peldaños de linaje: se presenta como una revisión de la Literal Translation de Robert Young, que no se tiene en este corpus, de modo que un peldaño bajo un versículo de la LSV va directamente al suelo de la lengua original, marcado con ≈. La interfaz en inglés se abre de forma predeterminada en la New International Version; esta edición se alcanza desde su propia tarjeta.
