title=नवावी की चालीस हदीसें — इस संस्करण के बारे में | Common Root
description=नवावी की चालीस हदीसें: इमाम अन-नवावी द्वारा चुनी गई 42 हदीसें, जिनमें से हर एक को धर्म का "एक महान आधार" (क़ाइदा अज़ीमा) माना गया — चालीस-हदीस शैली की सबसे अधिक पढ़ी जाने वाली रचना।
heroHeading=नवावी की चालीस हदीसें
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=यह्या इब्न शरफ़ अन-नवावी का जन्म 631 हिजरी (अक्टूबर 1233 ई.) के मुहर्रम महीने में सीरिया के दर्आ के निकट नवा में हुआ, और वे अठारह वर्ष की आयु में अध्ययन के लिए दमिश्क़ चले गए। 665 हिजरी (1267 ई.) में उन्हें दमिश्क़ की अश्रफ़िया दार अल-हदीस का प्रमुख नियुक्त किया गया, जो पद उन्होंने अपनी मृत्यु तक — यानी 676 हिजरी (1277 ई.) में, अपनी चालीस की उम्र के मध्य में, नवा में हुई मृत्यु तक — धारण किया; उन्हें वहीं दफ़नाया गया। एक शाफ़िई न्यायविद होने के नाते उन्होंने उस छोटे से जीवन में भारी मात्रा में लिखा — उनकी अन्य रचनाओं में रियाज़ अल-सालिहीन, सहीह मुस्लिम की टीका अल-मिन्हाज, अल-मज्मू' शरह अल-मुहज़्ज़ब, मिन्हाज अल-तालिबीन और किताब अल-अज़कार शामिल हैं।
hero.2=अल-अरबईन अन-नवावियाह एक पुरानी "चालीस हदीस" (अरबईनिय्यात) परंपरा को आगे बढ़ाती है, जिसका आधार वह हदीस है जो धर्म से जुड़ी चालीस हदीसें अपने समुदाय के लिए संरक्षित रखने वाले को क़यामत के दिन विद्वानों में स्थान देने का वादा करती है — एक हदीस जिसे अधिकांश आलोचक स्वयं ज़ईफ़ (कमज़ोर) मानते हैं। इस प्रकार का पहला संग्रह, जो अब लुप्त है, अब्दुल्लाह इब्न अल-मुबारक (मृ. 797) से जोड़ा जाता है; बाद में कई विद्वानों ने अपने-अपने संग्रह बनाए। नवावी ने वे हदीसें चुनीं जिन्हें वे सही मानते थे, अधिकांशतः [[BUK|सहीह अल-बुख़ारी]] और [[MUS|सहीह मुस्लिम]] से, जिनमें से हर एक उस चीज़ का उदाहरण थी जिसे उन्होंने धर्म का "महान आधार" (क़ाइदा अज़ीमा) कहा — और नाम के बावजूद, यह संग्रह अपने वर्तमान रूप में बयालीस हदीसें रखता है। यह इस शैली का सबसे अधिक पढ़ा जाने वाला उदाहरण बना, इस पर दर्जनों टीकाएँ लिखी गईं — सबसे प्रसिद्ध इब्न रजब अल-हनबली की जामी' अल-उलूम वल-हिकम — और यह क़ुरआन के बाद सुन्नी इस्लाम में सबसे अधिक पढ़ी जाने वाली रचनाओं में गिनी जाती है।
hero.3=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-nawawi संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]], [[NAS|सुनन अल-नसाई]], [[IBM|सुनन इब्न माजा]], [[MAL|मुवत्ता मालिक]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

