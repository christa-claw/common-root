fact.1.label=भाषा
fact.1.value=शास्त्रीय अरबी, रीडर में हर हदीस के नीचे एक अंग्रेज़ी अनुवाद दिखाई देता है
fact.2.label=संकलनकर्ता
fact.2.value=यह्या इब्न शरफ़ अन-नवावी (631–676 हिजरी / 1233–1277 ई.)
fact.3.label=नाम
fact.3.value=अल-अरबईन अन-नवावियाह ("नवावी की चालीस हदीसें") के रूप में जाना जाता है; नाम के बावजूद इस संग्रह में बयालीस हदीसें हैं
fact.4.label=संकलन स्थान एवं काल
fact.4.value=अधिकांशतः [[BUK|सहीह अल-बुख़ारी]] और [[MUS|सहीह मुस्लिम]] से, जब नवावी दमिश्क़ की अश्रफ़िया दार अल-हदीस के प्रमुख थे (665 हिजरी / 1267 ई.) — सीरिया के नवा में 676 हिजरी (1277 ई.) में उनकी मृत्यु तक
fact.5.label=पद्धति
fact.5.value=हर हदीस को इसलिए चुना गया क्योंकि नवावी की दृष्टि में वह धर्म का "महान आधार" (क़ाइदा अज़ीमा) थी; यह एक पुरानी "चालीस हदीस" (अरबईनिय्यात) शैली को आगे बढ़ाती है, जिसका पहला ज्ञात — अब लुप्त — उदाहरण अब्दुल्लाह इब्न अल-मुबारक (मृ. 797) से जोड़ा जाता है
fact.6.label=स्थिति
fact.6.value=क़ुरआन के बाद सुन्नी इस्लाम की सबसे अधिक पढ़ी जाने वाली रचनाओं में व्यापक रूप से गिनी जाती है; दर्जनों टीकाओं का विषय, सबसे प्रसिद्ध इब्न रजब अल-हनबली की जामी' अल-उलूम वल-हिकम
fact.7.label=हदीसों की संख्या
fact.7.value=नाम के बावजूद 42; इस संग्रह का मूल संस्करण भी इतनी ही संख्या देता है
fact.8.label=इस संग्रह में
fact.8.value=1 पुस्तक और 42 क्रमांकित हदीसें
fact.9.label=अंग्रेज़ी अनुवाद
fact.9.value=fawazahmed0/hadith-api के eng-nawawi संस्करण से लिया गया, अरबी के सहवर्ती रूप में दिखाया गया; यह किस प्रकाशित अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी पुष्ट नहीं किया गया है
fact.10.label=लाइसेंस
fact.10.value=अरबी मतन सार्वजनिक अधिकार-क्षेत्र का शास्त्रीय पाठ है; अंग्रेज़ी अनुवाद का लाइसेंस अभी भी समीक्षाधीन है
