title=كتاب أوسترفالد المقدس (الفرنسية) — عن هذه الطبعة | Common Root
description=كتاب أوسترفالد المقدس: مراجعة قسّ من نوشاتيل للكتاب المقدس البروتستانتي الفرنسي الصادر في جنيف، نُشرت أول مرة في 1744، وهي هنا في مراجعة لاحقة بالإملاء الفرنسي الحديث.
heroHeading=كتاب أوسترفالد المقدس
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=وُلد جان فريدريك أوسترفالد في نوشاتيل سنة 1663 وتوفي فيها سنة 1747. رُسم للخدمة في مدينته سنة 1683، وقضى معظم حياته في كنيستها، شمّاسًا أولًا ثم قسًّا منذ 1699، وكان يدرّس اللاهوت أيضًا. وكتابه المقدس ليس ترجمة جديدة عن العبرية واليونانية، بل مراجعة للكتاب المقدس البروتستانتي الفرنسي الصادر في جنيف، وهي الترجمة التي كانت الكنائس المُصلَحة الناطقة بالفرنسية تقرؤها منذ القرن السادس عشر. وقد نُشر نص أوسترفالد المُراجَع أول مرة سنة 1744، قبل وفاته بثلاث سنوات، وظلّ يُعاد طبعه ويُراجَع أكثر من قرنين، وكان معروفًا جيدًا في بريطانيا أيضًا.
hero.2=ليس نص هذه المجموعة فرنسيةَ سنة 1744. ففي القرن الثامن عشر كانوا يكتبون «étoit» حيث تكتب الفرنسية الحديثة «était»؛ وهذه النسخة تكتب «était» في كل موضع ولا ترد فيها «étoit» مرة واحدة، فهي إذن من إحدى المراجعات اللاحقة التي احتفظت باسم أوسترفالد. وأشهرها المراجعة التي أصدرتها جمعية الكتاب المقدس في فرنسا (Société biblique de France) سنة 1881، وكان عهدها الجديد من عمل Ch. L. Frossard، وقد حُدّث ذلك النص مرة أخرى سنة 1996. وeBible.org، مصدر هذه النسخة، لا يذكر إلا «Ostervald» ولا يسمّي المراجعة، فلا تسمّي هذه الصفحة واحدة أيضًا. وتظهر بعض السمات في كل صفحة تقريبًا. فالاسم الإلهي «l'Éternel»، أي الأزلي، كما عند سيغون وفي داربي الفرنسية: «L'Éternel est mon berger; je n'aurai point de disette» في المزمور 23. ويحتفظ إشعياء 7:14 بعبارة «la vierge sera enceinte» — العذراء — حيث عند سيغون الفتاة. ويحتفظ العهد الجديد بقراءات من النص المستلم تحذفها الطبعات النقدية: ففي رسالة يوحنا الأولى 5:7 الشهود السماويون الثلاثة، «le Père, la Parole, et le Saint-Esprit»، وهم غائبون عن سيغون المجاور.
hero.3=وهو في هذا القارئ واحد من ثلاثة كتب مقدسة فرنسية، إلى جانب سيغون وداربي الفرنسية. والواجهة الفرنسية لا تفتح عليه: فليس للفرنسية اختيار منتقى، فيأخذ القارئ أول كتاب مقدس فرنسي في ترتيب الفهرس، وهو داربي. وليس له في درجات النسب أصل مسجّل — فكتاب جنيف المقدس الذي يراجعه ليس في هذه المجموعة — فالدرجة المفتوحة تحت الآية تهبط رأسًا إلى أرضية اللغات الأصلية المعلَّمة بـ ≈: وهي للعهد القديم مخطوطة لينينغراد، وللعهد الجديد النص المستلم، أي التقليد اليوناني الذي يتبعه هذا الكتاب فعلًا. وشارة درجته تحمل السنة 1744، سنة مراجعة أوسترفالد نفسه لا سنة النص المعروض. افتحه إلى جانب سيغون لترى قرنين من لغة الكتاب المقدس البروتستانتية الفرنسية جنبًا إلى جنب.

