title=Sahih al-Bukhari — About This Edition | Common Root
description=Sahih al-Bukhari: the hadith collection Sunni Islam ranks second in authority only to the Qur'an, assembled by Muhammad al-Bukhari from among roughly 600,000 reports he examined, admitting only those carried by an unbroken chain of trustworthy narrators.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismail al-Bukhari assembled this collection largely at two mosques — the Sacred Mosque in Mecca and the Prophet's Mosque in Medina — and completed it in Bukhara, his home city, around 232 AH (846 CE); he spent roughly the last two decades of his life revising it further as he travelled. Its full title, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, is usually shortened to Sahih al-Bukhari — "the authentic [collection] of al-Bukhari." Al-Bukhari himself is reported to have said he selected it from around 600,000 hadith reports he had examined, admitting a report only when it carried, in his judgment, an unbroken chain of trustworthy narrators back to its original source.
hero.2=That standard is why the book carries the weight it does. Sahih al-Bukhari is counted first among Sunni Islam's Six Books (Kutub al-Sittah), and together with Sahih Muslim — its nearest rival in method and reputation — the two are called the Sahihayn, "the two authentic ones." Most Sunni scholars rank Bukhari's collection above every other hadith book and second in authority only to the Qur'an itself, though a minority have argued for Sahih Muslim's precedence instead. The material is arranged topically rather than by narrator or chronology (what scholars call a musannaf), organised into books (kutub) that run from ritual purification and prayer through commerce and marriage to the lives of earlier prophets and the signs of the Last Hour.
hero.3=How many hadith the book actually contains depends on which print tradition is doing the counting. The figure most often quoted today, 7,563, comes from the numbering the editor Muhammad Fu'ad Abd al-Baqi gave the text in the twentieth century, and it counts a hadith again each time it is repeated under a different chapter; stripped of repeats, Ibn Hajar al-Asqalani counted 2,602. Other scholars have proposed other totals besides. This corpus's own count is a third number again: 98 books and 7,589 numbered hadith, which is simply the shape of the digital edition it was drawn from, not a claim to reproduce any one print numbering exactly.
hero.4=The Arabic text here is the classical matn, in the public domain. Beneath it in the reader sits an English translation, drawn from the fawazahmed0/hadith-api's eng-bukhari edition and aligned hadith-for-hadith with the Arabic so the two can be read as a pair — the same companion arrangement this corpus uses for its Qur'an translations. Which published English translation that file itself descends from has not been pinned down on this corpus's side, which is why its licence is marked under review rather than public domain outright; the Arabic above it carries no such uncertainty.

