title=الأربعون النووية — عن هذه الطبعة | Common Root
description=الأربعون النووية: اثنان وأربعون حديثاً اختارها الإمام النووي، كل واحد منها "قاعدة عظيمة" من قواعد الدين — وهي الكتاب الأكثر قراءة في نوع الأربعينيات الحديثية.
heroHeading=الأربعون النووية
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=وُلد يحيى بن شرف النووي في المحرم سنة 631 هـ (أكتوبر 1233 م) في نوى قرب درعا بسوريا، وانتقل إلى دمشق في الثامنة عشرة من عمره للدراسة. وفي سنة 665 هـ (1267 م) عُيِّن شيخاً لدار الحديث الأشرفية بدمشق، وهو منصب ظل يتولاه حتى وفاته في نوى سنة 676 هـ (1277 م) في منتصف الأربعينيات من عمره؛ ودُفن هناك. كان فقيهاً شافعياً، وألَّف في تلك الحياة القصيرة مؤلفات كثيرة، منها رياض الصالحين، وشرحه على صحيح مسلم المعروف بالمنهاج، والمجموع شرح المهذب، ومنهاج الطالبين، وكتاب الأذكار.
hero.2=تستمر الأربعون النووية في تقليد أقدم من "الأربعينيات" الحديثية، التي يقوم أصلها على حديث يَعِد من يحفظ لأمته أربعين حديثاً من أمر دينها بمكانة بين العلماء يوم القيامة — حديث يصفه أكثر النقاد بأنه ضعيف في ذاته. وأول من جمع مثل هذه المجموعة، وقد ضاعت، هو عبد الله بن المبارك (ت 797 م)؛ وتبعه علماء كثيرون بمجموعاتهم الخاصة. واختار النووي أحاديث حكم عليها بالصحة، أكثرها من [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]]، كل حديث منها يوضح ما سمّاه "قاعدة عظيمة" من قواعد الدين — ومع أن اسمها "الأربعون"، فإن المجموعة كما هي عليه اليوم تضم اثنين وأربعين حديثاً. وأصبحت أكثر كتب هذا النوع قراءة، وكُتبت عليها عشرات الشروح، أشهرها جامع العلوم والحكم لابن رجب الحنبلي، وتُعدّ من أكثر الكتب قراءة في الإسلام السني بعد القرآن نفسه.
hero.3=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-nawawi في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]] و[[ABD|سنن أبي داود]] و[[TIR|جامع الترمذي]] و[[NAS|سنن النسائي]] و[[IBM|سنن ابن ماجه]] و[[MAL|موطأ مالك]] وترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=العربية الكلاسيكية، مع ترجمة إنجليزية تظهر تحت كل حديث في القارئ
fact.2.label=المؤلف
fact.2.value=يحيى بن شرف النووي (631–676 هـ / 1233–1277 م)
fact.3.label=الاسم
fact.3.value=معروفة بالأربعين النووية ("أربعون حديثاً للنووي")؛ ومع ذلك فإن المجموعة تضم اثنين وأربعين حديثاً
fact.4.label=مكان وزمان التأليف
fact.4.value=أغلبها من [[BUK|صحيح البخاري]] و[[MUS|صحيح مسلم]]، بينما كان النووي شيخاً لدار الحديث الأشرفية بدمشق (665 هـ / 1267 م) حتى وفاته في نوى بسوريا سنة 676 هـ (1277 م)
fact.5.label=المنهج
fact.5.value=اختيار كل حديث لكونه ما سمّاه النووي "قاعدة عظيمة" من قواعد الدين؛ استمرار لتقليد أقدم من "الأربعينيات" الحديثية، أول مَن جمع مثلها، وقد ضاعت مجموعته، هو عبد الله بن المبارك (ت 797 م)
fact.6.label=المكانة
fact.6.value=تُعدّ على نطاق واسع من أكثر الكتب قراءة في الإسلام السني بعد القرآن نفسه؛ وموضوع عشرات الشروح، أشهرها جامع العلوم والحكم لابن رجب الحنبلي
fact.7.label=عدد الأحاديث
fact.7.value=اثنان وأربعون، على الرغم من الاسم؛ والطبعة التي تستند إليها هذه المجموعة تعدّها كذلك
fact.8.label=في هذه المجموعة
fact.8.value=كتاب واحد و42 حديثاً مرقَّماً
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-nawawi في fawazahmed0/hadith-api، تظهر مرافقة للعربية؛ ولم يتأكد من جهة هذه المجموعة إلى أي ترجمة مطبوعة يعود هذا الملف
fact.10.label=الرخصة
fact.10.value=المتن العربي نص كلاسيكي ملك عام؛ ورخصة الترجمة الإنجليزية لا تزال قيد المراجعة
