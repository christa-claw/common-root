title=New American Standard Bible 2020 — Об этом издании | Common Root
description=New American Standard Bible — собственное продолжение Lockman Foundation буквальной, слово-в-слово точности American Standard Version, заново переведённое с иврита, арамейского и греческого и представленное здесь в тексте 2020 года.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=New American Standard Bible началась как сознательное продолжение, а не как совершенно новый проект. Lockman Foundation, некоммерческая организация из Ла-Абры, Калифорния, начала работу в 1959 году, чтобы продолжить American Standard Version 1901 года — сохранив её репутацию буквальной, слово-в-слово верности ивриту, арамейскому и греческому языкам, одновременно модернизируя её устаревший английский. Фонд собрал комитет учёных из христианских колледжей, семинарий и, в основном, консервативных евангельских конфессий, и перевод выходил поэтапно: Евангелие от Иоанна в 1960 году, остальные Евангелия в 1962 году, полный Новый завет в 1963 году, Псалтирь отдельно в 1968 году и вся Библия в 1971 году. Это первое полное издание опиралось для Ветхого завета на третье издание Biblia Hebraica Рудольфа Киттеля, с учётом свитков Мёртвого моря, а для Нового завета — на 23-е издание Novum Testamentum Graece Нестле и Аланда.
hero.2=Пересмотр совредейства мира издания. Незастичными изменения в тексте посравнении с оригиналом в 1972, 1973 и 1975 годах, затем более существенный пересмотр в 1977 году и ещё один, ограниченный, в 1992 году. В 1995 году фонд выпустил Updated Edition — NASB95, текст, который большинство имеет в виду, говоря просто «NASB» — с учётом Biblia Hebraica Stuttgartensia и 26-го издания Нестле-Аланда. текущий текст — это обновление 2020 года, части которого уже начали появляться в интернете в 2018 году: оно перенесло текстовую основу Ветхого завета на Biblia Hebraica Stuttgartensia и, для охватываемых изданием книг, на более новую Biblia Hebraica Quinta, с учётом Септуагинты, свитков Мёртвого моря, таргумов и других древних версий там, где они влияют на чтение, тогда как Новый завет теперь следует 28-му изданию Нестле-Аланда, дополненному более полным аппаратом свидетельств греческих рукописей Editio Critica Maior. заявленный метод переводчиков оставался неизменным при каждом пересмотре: передавать оригинал настолько буквально, насколько это позволяет английский язык, а там, где строго буквальный перевод мог бы ввести в заблуждение или звучать неестественно, выбирать более ясную идиому и отмечать более буквальную формулировку в примечании — дисциплина, которую регулярно называют бованием того, что это один из самых буквальных среди широко используемых английских переводов XX и XXI веков.
hero.3=Несмотря на своё название и заявленный долг перед American Standard Version, New American Standard Bible — это новый перевод с оригинальных языков, а не построчный пересмотр её, и корпус поэтому не записывает для неё родителя: открытие ступени родословной под стихом NASB ведёт прямо к полу оригинального языка, отмеченному ≈, точно так же, как для New International Version. У этих двух изданий общего больше, чем эта форма, — оба лицензированы, а не являются общественным достоянием, что отличает их от свободно копируемых английских изданий на той же полке, хотя английский интерфейс по умолчанию открывается на New International Version, а New American Standard Bible достигается со своей собственной карточки в сетке переводов.

fact.1.label=Язык
fact.1.value=Английский
fact.2.label=Заказан
fact.2.value=Lockman Foundation из Ла-Абры, Калифорния, которая начала проект в 1959 году как продолжение традиции буквального перевода American Standard Version
fact.3.label=Кем сделан
fact.3.value=Комитетом переводчиков, финансируемым фондом, с учёными из христианских колледжей и семинарий и, в основном, консервативных евангельских конфессий
fact.4.label=Ветхий завет с
fact.4.value=третьего издания Biblia Hebraica Рудольфа Киттеля и свитков Мёртвого моря для оригинального издания 1971 года; Biblia Hebraica Stuttgartensia с пересмотра 1995 года; текст 2020 года ссылается на Biblia Hebraica Stuttgartensia и, где доступно, на более новую Biblia Hebraica Quinta, с учётом Септуагинты, свитков Мёртвого моря, таргумов и других древних версий
fact.5.label=Новый завет с
fact.5.value=23-го издания Novum Testamentum Graece Нестле и Аланда для оригинального издания 1971 года; 26-го издания с пересмотра 1995 года; 28-го издания (NA28) для текста 2020 года, дополненного аппаратом свидетельств греческих рукописей Editio Critica Maior
fact.6.label=Род перевода
fact.6.value=Формальная эквивалентность — переведено настолько буквально с оригинальных языков, насколько позволяет читаей английский язык, с более буквальной формулировкой в примечании там, где вместо неё была выбрана более ясная идиома; новый перевод с иврита, арамейского и греческого, а не пересмотр более ранней английской Библии, несмотря на корни в подходе American Standard Version
fact.7.label=Издан
fact.7.value=Евангелие от Иоанна в 1960 году, Евангелия в 1962 году, Новый завет в 1963 году, Псалтирь в 1968 году, полная Библия в 1971 году, незастичные текстовые изменения в 1972, 1973 и 1975 годах, крупный пересмотр в 1977 году, ограниченный пересмотр в 1992 году, Updated Edition (NASB95) в 1995 году и текущий текст 2020 года, части которого появились в интернете начиная с 2018 года
fact.8.label=Лицензия
fact.8.value=Лицензировано, не общественное достояние. До 1 000 стихов можно цитировать в любой форме без письменного разрешения, при условии что они не составляют целую книгу Библии и не более половины цитирующего произведения, с указанием авторских прав, называющих 1960, 1971, 1977, 1995 и 2020 годы; всё сверх этого требует разрешения Lockman Foundation
fact.9.label=В этом собрании
fact.9.value=Лицензировано, а не является общественным достоянием, как и [[NIV|New International Version]] — английский интерфейс по умолчанию открывается на этом издании, а это издание достигается со своей собственной карточки. В ступенях родословной не записано родителя: хотя фонд описывает проект как продолжение буквальности [[ASV|American Standard Version]], перевод заново сделан с иврита, арамейского и греческого, а не является пересмотром её или любого другого английского текста, хранящегося здесь, так что ступень под стихом NASB ведёт прямо к полу оригинального языка, отмеченному ≈
