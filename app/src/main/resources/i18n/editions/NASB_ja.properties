title=ニュー・アメリカン・スタンダード・バイブル2020 — この版について | Common Root
description=ニュー・アメリカン・スタンダード・バイブル:ロックマン財団自身によるアメリカン・スタンダード・バージョンの逐語的な直訳性の継承であり、ヘブライ語・アラム語・ギリシャ語から新たに翻訳され、現在は2020年版のテキストとなっている。
heroHeading=ニュー・アメリカン・スタンダード・バイブル2020
readerHref=/reader?c1.src=nasb

hero.1=ニュー・アメリカン・スタンダード・バイブルは、まったく新しい企画としてではなく、意図的な継承として始まった。カリフォルニア州ラハブラに本部を置く非営利団体ロックマン財団は、1901年のアメリカン・スタンダード・バージョンを引き継ぐため、1959年にこの作業を開始した——ヘブライ語・アラム語・ギリシャ語への逐語的で字義どおりの忠実さという評価を保ちながら、その古めかしい英語を現代化するのである。財団は、主に保守的な福音派の諸教派に属する、キリスト教系の大学や神学校の学者からなる委員会を編成し、翻訳は段階的に公刊された。1960年にヨハネ福音書、1962年にその他の福音書、1963年に新約聖書全体、1968年に詩篇が単独で、そして1971年に聖書全体である。この最初の完全版は、旧約聖書についてはルドルフ・キッテルの『ビブリア・ヘブライカ』第3版を底本とし、死海写本も参照したうえで、新約聖書についてはネストレとアーラントの『ノヴム・テスタメントゥム・グラエケ』第23版を底本とした。
hero.2=その最初の刊行以降、数十年にわたって改訂作業が続いた。1972年、1973年、1975年に小さな語句の変更が続き、1977年にはより大きな改訂、1992年にはさらに限定的な改訂があった。1995年、財団はアップデイテッド・エディション——すなわちNASB95、多くの人が単に「NASB」と言うときに指している版——を、『ビブリア・ヘブライカ・シュトゥットガルテンシア』とネストレ・アーラント第26版を参照して公刊した。現在の版は2020年版であり、その一部は2018年にすでにオンラインで公開され始めていた。旧約聖書の底本は『ビブリア・ヘブライカ・シュトゥットガルテンシア』へ、そしてそれが対象とする書については、さらに新しい『ビブリア・ヘブライカ・クインタ』へと移され、読みに関わる箇所では七十人訳、死海写本、タルグム、その他の古代訳が参照された。一方、新約聖書は現在ネストレ・アーラント第28版に従い、『エディティオ・クリティカ・マイオル』によるより豊富なギリシャ語写本の証拠で補われている。翻訳者たちが表明した方法は、どの改訂においても一貫していた。英語が許す限り原文を逐語的に訳し、厳密に逐語的な訳が誤解を招くか不自然に読める場合には、より明確な言い回しを選び、より逐語的な訳を脚注に記すというものである——この規律こそが、本訳が二十世紀および二十一世紀に広く使われた英訳聖書の中でも最も逐語的なものの一つとされる理由として、常に挙げられている。
hero.3=その名称とアメリカン・スタンダード・バージョンへの表明された負い目にもかかわらず、ニュー・アメリカン・スタンダード・バイブルは原語からの新たな翻訳であって、その逐行改訂ではなく、それゆえコーパスはこれに親版を記録していない。NASBの一節の下で系譜の段を開くと、ニュー・インターナショナル・バージョンの場合とまったく同様に、≈と記された原語の底まで直接下りる。この二つが共有するのは、この形だけではない——いずれもライセンスされたものであり、自由にコピーできるものではない点で、同じ書架にある自由コピー可能な英語版とは一線を画している。ただし英語インターフェースは標準でニュー・インターナショナル・バージョンを開き、ニュー・アメリカン・スタンダード・バイブルには翻訳グリッドの自分自身のカードから到達する。

