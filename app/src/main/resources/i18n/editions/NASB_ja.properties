fact.1.value=英語
fact.2.label=委嘱
fact.2.value=カリフォルニア州ラハブラのロックマン財団。1959年、アメリカン・スタンダード・バージョンの逐語訳の伝統を継承する計画として本事業を開始した
fact.3.label=制作者
fact.3.value=財団が資金を提供した翻訳委員会で、主に保守的な福音派の諸教派に属する、キリスト教系の大学や神学校の学者を集めた
fact.4.label=旧約の底本
fact.4.value=1971年の原版についてはルドルフ・キッテルの『ビブリア・ヘブライカ』(第3版)と死海写本;1995年の改訂からは『ビブリア・ヘブライカ・シュトゥットガルテンシア』;2020年のテキストは『ビブリア・ヘブライカ・シュトゥットガルテンシア』と、入手可能な場合にはさらに新しい『ビブリア・ヘブライカ・クインタ』を底本とし、七十人訳、死海写本、タルグム、その他の古代訳も参照している
fact.5.label=新約の底本
fact.5.value=1971年の原版についてはネストレとアーラントの『ノヴム・テスタメントゥム・グラエケ』第23版;1995年の改訂からは第26版;2020年のテキストについては第28版(NA28)で、『エディティオ・クリティカ・マイオル』のギリシャ語写本の証拠により補われている
fact.6.label=翻訳の方針
fact.6.value=形式的等価性——読み得る英語が許す限り原語から逐語的に翻訳し、より明確な言い回しが選ばれた箇所では、より逐語的な訳を脚注に記した。アメリカン・スタンダード・バージョンの手法にその根を持つにもかかわらず、以前の英訳聖書の改訂ではなく、ヘブライ語・アラム語・ギリシャ語からの新たな翻訳である
fact.7.label=出版
fact.7.value=1960年にヨハネ福音書、1962年に諸福音書、1963年に新約聖書、1968年に詩篇、1971年に聖書全体、1972年・1973年・1975年に小さな本文の変更、1977年に大規模な改訂、1992年に限定的な改訂、1995年にアップデイテッド・エディション(NASB95)、そして2018年から一部がオンラインで公開されていた現行の2020年版テキスト
fact.8.label=ライセンス
fact.8.value=ライセンスされており、自由にコピーできるものではない。1,000節までは、聖書の一書全体を構成せず、また引用する著作物の半分を超えない限り、1960年・1971年・1977年・1995年・2020年を記した著作権表示を付して、書面による許可なくいかなる形式でも引用できる。それを超える場合はロックマン財団の許可が必要である
fact.9.label=このコーパスでは
fact.9.value=[[NIV|ニュー・インターナショナル・バージョン]]と同じく、ライセンスされており自由にコピーできるものではない——英語インターフェースは標準でその版を開き、本版には自分自身のカードから到達する。系譜の段には親版が記録されていない。財団は本事業を[[ASV|アメリカン・スタンダード・バージョン]]の逐語性の継承と説明しているが、実際にはヘブライ語・アラム語・ギリシャ語からの新たな翻訳であって、それやここに保持されている他の英語テキストの改訂ではないため、NASBの一節の下の段は≈と記された原語の底まで直接下りる
