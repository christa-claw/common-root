fact.2.label=Derleyen
fact.2.value=Şah Veliyyullah Dehlevî (1703–1762)
fact.3.label=Adı
fact.3.value=Arapça El-Erba'ûn ("Kırklar") olarak bilinir; Forty Hadith of Shah Wali-Allah başlıklı modern bir İngilizce baskı 2015'te Turath Publishing tarafından yayımlandı, çevirmeni Safaruk Zaman Chowdhury
fact.4.label=Derlendiği yer
fact.4.value=Şah Veliyyullah'ın 1730–31'de yaptığı hac ve Medine'de geçirdiği yaklaşık bir yıllık hadis öğreniminin ardından, başlıca Ebu Tahir el-Kürdî'nin (el-Kürânî olarak da yazılır) yanında, 16 Aralık 1732'de Delhi'ye dönmesinden sonra
fact.5.label=Yöntem
fact.5.value=İngilizce yayıncısına göre, kırk hadisin her biri Şah Veliyyullah'ın kendi şeyhinden bizzat işittiğini söylediği bir hadistir; kendisine nasıl ulaştığını gösteren rivayet zinciriyle (senet) birlikte korunmuştur — konu veya kanonik değere göre yapılmış bir seçim değil, kişisel bir rivayet kaydı
fact.6.label=Konum
fact.6.value=Hint yarımadasından gelen "kırk hadis" (erbâîniyyât) derlemelerinin en tanınmışı; ilk bilinen örneği günümüze ulaşmayan ve Abdullah ibn el-Mübarek'e (ö. 797) atfedilen, [[NAW|Nevevî'nin Kırk Hadisi]] ile [[QUD|Kırk Kutsî Hadis]]'i de doğuran türü sürdürür
fact.7.label=Hadis sayısı
