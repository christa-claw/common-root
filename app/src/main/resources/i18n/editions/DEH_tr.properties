title=Şah Veliyyullah Dehlevî'nin Kırk Hadisi — Bu Baskı Hakkında | Common Root
description=Şah Veliyyullah Dehlevî'nin Kırk Hadisi: on sekizinci yüzyıl Delhili âlimin, Medine'de bir yıllık öğrenim süresince kendi şeyhinden bizzat işittiğini söylediği kırk hadis, rivayet zincirleriyle birlikte korunmuş — Hint yarımadasından gelen bu türün en tanınmış derlemesi.
heroHeading=Şah Veliyyullah Dehlevî'nin Kırk Hadisi
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Şah Veliyyullah Dehlevî — tam adıyla Kutbüddin Ahmed ibn Abdürrahim el-Ömerî ed-Dehlevî — 21 Şubat 1703'te, Muzaffarnagar yakınlarındaki Phulat'ta doğdu ve babası Şah Abdürrahim'in kurduğu Medresetü'r-Rahimiyye'nin bulunduğu Delhi'de büyüdü. Yedi yaşında Kur'an'ı ezberlediği ve on beş yaşında döneminin standart eğitim müfredatını tamamladığı söylenir; iki yıl sonra babasının yerine medresenin başına geçti. 1730–31'de hacca gitti, ardından Medine'de hadis öğrenimi için yaklaşık bir yıl geçirdi — başlıca Ebu Tahir el-Kürdî'nin (el-Kürânî olarak da yazılır) yanında, ayrıca Muhammed Vefdullah el-Malikî ve Şeyh Tacüddin el-Kal'î'nin yanında daha fazla öğrenim gördü — ve 16 Aralık 1732'de Delhi'ye döndü. Orada 20 Ağustos 1762'de (hicri 1176, 29 Muharrem) vefat etti ve babasının yanına defnedildi. Diğer eserleri arasında, genellikle en önemli kitabı sayılan Huccetullahi'l-Baliğa, el-Fevzü'l-Kebîr ve kendisini Hicaz'a götüren yolculuğu anlattığı Fütuhu'l-Haremeyn bulunur.
hero.2=El-Erba'ûn, [[NAW|Nevevî'nin Kırk Hadisi]] ve [[QUD|Kırk Kutsî Hadis]] ile aynı "kırk hadis" (erbâîniyyât) türünü sürdürür; bu türün çıkış noktası, dinine dair kırk hadisi koruyan kimseye kıyamet gününde âlimler arasında bir yer vadeden — eleştirmenlerin kendisinin de genellikle zayıf (da'îf) saydığı — bir hadistir, ayrıca Abdullah ibn el-Mübarek'e (ö. 797) atfedilen, günümüze ulaşmayan ilk derlemeye dayanır. Bu eser, topladığı şey bakımından o ikisinden ayrılır: daha geniş literatürden konu veya kanonik değere göre seçilmiş hadisler yerine, İngilizce yayıncısı onu, Şah Veliyyullah'ın Medine'de kendi şeyhinden bizzat işittiğini söylediği kırk hadis olarak tanımlar; her biri, kendisine nasıl ulaştığını gösteren rivayet zinciriyle (senet) birlikte korunmuştur — oğlunun anlatımına göre, Delhi'ye döndükten sonra onun öğretme ve yazma şeklini değiştiren o öğrenim yılından kalan kişisel bir rivayet kaydı.
hero.3=Buradaki Arapça metin, kamu malı olan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-dehlawi baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]], [[NAS|Sünen-i Nesâî]], [[IBM|Sünen-i İbn Mâce]], [[MAL|Muvatta-i Mâlik]], [[NAW|Nevevî'nin Kırk Hadisi]] ve [[QUD|Kırk Kutsî Hadis]] ile Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

