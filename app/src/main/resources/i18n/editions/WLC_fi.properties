title=Leningradin koodeksi — Tietoja tästä laitoksesta | Common Root
description=Leningradin koodeksi: maailman vanhin täydellinen heprealaisen Raamatun käsikirjoitus, kopioitu vuonna 1008 jaa. ja yhä useimpien nykyisten Vanhan testamentin käännösten pohjateksti.
heroHeading=Leningradin koodeksi
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=Tämä on vanhin säilynyt täydellinen heprealaisen Raamatun käsikirjoitus. Sen kirjoitti puhtaaksi kirjuri nimeltä Samuel ben Jaakob, joka työskenteli vanhassa Kairossa ja ajoitti työnsä käsikirjoituksen loppuun liittämässään muistiinpanossa vuoteen 1008 jaa.
hero.2=Samuel ben Jaakob ei keksinyt tekstiä, vaan säilytti sen. Hän seurasi Ben Asherin suvun perinnettä; suku oli masoran johtava auktoriteetti — sen vokaalimerkkien, kantillaatiomerkkien ja marginaalihuomautusten järjestelmän, jota juutalaiset oppineet olivat vuosisatoja hioneet vakiinnuttaakseen heprealaisen Raamatun ääntämyksen ja suojellakseen tekstiä turmeltumiselta. Vanhempi ja kiistatta arvovaltaisempi Ben Asher -käsikirjoitus on kyllä säilynyt — Aleppon koodeksi — mutta suuri osa sen Toora-osuudesta katosi vuonna 1947. Leningradin koodeksia arvostetaan juuri siksi, että se on täydellinen ja niin vanha, että se seisoo aivan tuon perinteen lähteellä.
hero.3=Nimensä se on saanut kaupungista, johon se myöhemmin päätyi: Leningrad, kuten Pietaria kutsuttiin käsikirjoituksen tullessa länsimaisen tutkimuksen piiriin — nimi jäi elämään, vaikka kaupunki sai oman nimensä takaisin vuonna 1991. Nykyään koodeksi on Biblia Hebraica Stuttgartensian pohjana, ja se on heprealaisen Raamatun vakiintunut tieteellinen laitos. Näin lähes jokainen nykyaikainen Vanhan testamentin käännös lähes kaikilla kielillä palautuu tämän yhden 1000-luvun kairolaisen kirjurin huolelliseen työhön, tiesivätpä lukijat hänen nimensä tai eivät.

