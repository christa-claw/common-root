fact.3.value=ウィルソン・カレッジおよびボンベイ大学（学位、1891年）；ケンブリッジのセント・ジョンズ・カレッジ（学位および法学資格、1895年）
fact.4.label=制作時期
fact.4.value=主として1914年にインド文官職を辞した後；ラホールのイスラミア・カレッジの学長を二度目に務めていた間に完成
fact.5.label=初版
fact.5.value=三十分冊、1934年-1937年、"The Holy Qur'an: Text, Translation and Commentary"として、ラホールのシャイフ・ムハンマド・アシュラフより；1938年に一巻本
fact.6.label=評価
fact.6.value=[[Q-EN|ピクソール訳]]と並び、最も広く読まれた二つの英訳クルアーンの一つ、広範な脚注で知られる；以来およそ三十の増刷と改訂
