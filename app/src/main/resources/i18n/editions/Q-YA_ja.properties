title=クルアーン — ユースフ・アリー — この版について | Common Root
description=アブドゥッラー・ユースフ・アリーによる翻訳。後にイスラーム学者となったインドの文官が、1934年から1937年にかけて全四巻で出版した——入手可能な翻訳のうち、明確にパブリックドメインと認められた英訳クルアーンは二つしかなく、本コーパスではピクソール訳と並ぶ、もう一つの英訳である。
heroHeading=クルアーン — ユースフ・アリー
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=アブドゥッラー・ユースフ・アリー（1872年-1953年）はボンベイで生まれ、まず現地のウィルソン・カレッジで学んだ。そこでは学業と並行して受けた宗教教育により、少年時代にクルアーンを暗記した。1891年、ボンベイ大学で英文学の優等学位を取得し、プレジデンシー奨学金を得て英国へ渡り、ケンブリッジのセント・ジョンズ・カレッジで法学を学び、1895年に学位と法学の資格を得て卒業、同年インド文官職を得てインドに戻った。
hero.2=彼はほぼ二十年をインド文官として過ごした——治安判事・税務官として、次いで裁判官として、さらにインド政府財務省の副書記官として——が、1914年に辞職し、英国に定住した。そこでウォーキングのシャー・ジャハーン・モスクおよびイースト・ロンドン・モスク基金の理事となり、戦時中の働きにより1917年にCBE勲章を受け、東洋学院でヒンドゥスターニー語を講じた。1920年代から1930年代にかけ、ラホールのイスラミア・カレッジの学長としてインドに戻り、まさにこの数年のうちに、十年以上を費やして、自らの注釈を付したクルアーンの英訳を書き上げた。
hero.3=この翻訳は1934年から1937年にかけて三十の分冊として刊行され、第一分冊は1934年4月4日に、"The Holy Qur'an: Text, Translation and Commentary"という題でラホールのシャイフ・ムハンマド・アシュラフより出版された。1938年には一巻にまとめた版が続き、1939年から1940年にかけて改訂版が出た。ピクソール訳と並び、二十世紀で最も広く読まれた二つの英訳クルアーンの一つとなり、とりわけその脚注の規模で知られ、以来、他の人の手で改訂された箇所を含みつつ、およそ三十の増刷を経てきた——1977年以降北米で頒布されたアマナ出版の版や、1980年代のサウジアラビア支援による改訂版もその一つである。
hero.4=ここでalquran.cloudを通じてデジタル化されているのは、ユースフ・アリー自身の注釈ではなく翻訳本文そのものであり、本コーパスでは[[Q-AR|ウスマーン正書体のアラビア語本文]]に添えるもう一つの英訳として、1930年の[[Q-EN|ピクソール訳]]と並んで提供される。入手可能な翻訳を調べた結果、明確に自由に使用できると分かった英訳はこれとピクソール訳の二つだけであった——とはいえ「明確に」という語にはここで留保が必要である。この作品は欧州連合およびパキスタンではパブリックドメインであり、ユースフ・アリーはパキスタンで没し、同地で最初に出版されたが、1996年に米国で形式的に登録された著作権は同国において2033年まで有効とされている。

