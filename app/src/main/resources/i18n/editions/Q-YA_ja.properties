fact.8.value=[[Q-AR|ウスマーン正書体のアラビア語本文]]に添えるもう一つの英訳、1930年の[[Q-EN|ピクソール訳]]と並んで
fact.9.label=ライセンス
fact.9.value=欧州連合（著作者の死後70年）およびパキスタンではパブリックドメイン（A・ユースフ・アリー、1934年；1953年没）；1996年に米国で形式的に登録された著作権は同国において2033年まで有効とされている
