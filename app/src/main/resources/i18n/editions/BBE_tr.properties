title=Bible in Basic English — Bu Baskı Hakkında | Common Root
description=Bible in Basic English, S. H. Hooke'un yönettiği bir kurulca İbranice ve Grekçeden çevrilip Cambridge University Press tarafından yayımlandı — Yeni Antlaşma 1941'de, Kutsal Kitap'ın tamamı 1949'da — C. K. Ogden'ın 850 sözcüklük Basic English'iyle, şiir ve Kutsal Kitap için eklenen 150 sözcükle birlikte.
