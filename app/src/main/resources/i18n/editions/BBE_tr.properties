# The narrative, one paragraph per key, in order.
hero.1=Basic English, Orthological Institute'tan C. K. Ogden'ın eseriydi: uluslararası yardımcı dil olarak önerilen 850 İngilizce sözcüklük bir liste. Bible in Basic English'i, Orthological Institute ile birlikte çalışan ve S. H. Hooke'un (1874–1968) yönettiği bir kurul hazırladı; Hooke, 1930'da Londra Üniversitesi'nde Samuel Davidson Eski Antlaşma Çalışmaları Profesörü olan bir Eski Antlaşma bilginiydi. Çeviri, daha önceki bir İngilizce çeviriden sadeleştirilerek değil, İbranice ve Grekçeden yapıldı; ardından Basic metin, Cambridge University Press yöneticilerinin kurduğu bir kurul tarafından ayrıntılı olarak gözden geçirildi. Ogden'ın 850 sözcüğüne çevirmenler şiire yardımcı olan 100 sözcük ve Kutsal Kitap için gereken 50 sözcük ekledi, toplam 150. Cambridge University Press Yeni Antlaşma'yı 1941'de, Kutsal Kitap'ın tamamını 1949'da yayımladı; 1965 tarihli bir baskı Amerika Birleşik Devletleri'nde telif hakkı bildirimi olmadan dağıtıldı ve bu yüzden metin orada kamuya açıktır.
hero.2=Sonuç, o küçük sözcük dağarcığı içinde sade ve düzgün okunur. Yaratılış “At the first God made the heaven and the earth.” diye açılır. Mezmur 23 “The Lord takes care of me as his sheep; I will not be without any good thing.” diye başlar. Yuhanna'ya göre İncil “From the first he was the Word, and the Word was in relation with God and was God,” diye açılır ve Yuhanna 3:16 şöyledir: “For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.” Tanrı'nın adı metnin her yerinde “the Lord”dur; yalnızca “Yahweh” olarak verildiği sekiz ayet bunun dışındadır: aralarında Tanrı'nın, İbrahim, İshak ve Yakup'un “had no knowledge of my name Yahweh” dediği Mısır'dan Çıkış 6:3 ve Mezmur 83:18 vardır. İbranicenin çevrilemeyecek kadar belirsiz olduğu yerlerde çevirmenler onun yerine noktalar koydu; kopyamızda aralarında Eyüp 34:29–33 ve Eyüp 36:16–20'nin de bulunduğu birkaç ayet yalnızca “...”dan ibarettir.
hero.3=Kopyamızda Yaratılış'tan Vahiy'e 66 kitap vardır, Apokrifa olmadan, King James ve Revised Version'ın bölüm ve ayet numaralamasıyla — 150 mezmur ve 4. bölümle biten Malaki. Mezmur başlıkları yoktur: Mezmur 51 “Have pity on me, O God” ile başlar. Yeni Antlaşma, kabul görmüş metnin bir çevirisi değildir. Eleştirel baskıların çıkardığı on altı ayet, aralarında Matta 17:21, Elçilerin İşleri 8:37 ve Romalılar 16:24, burada yalnızca [] ile işaretli boş yerler olarak korunur ve 1. Yuhanna 5:7'de gökteki üç tanık yoktur; zina üstünde yakalanan kadının öyküsü, Yuhanna 7:53–8:11, köşeli ayraç içindedir, Markos'un uzun sonu ise korunmuştur. Bu okuyucuda tek başına durur. Derleme onun için hiçbir öncül kaydetmez; bu yüzden ayetlerinden birinin altında açılan bir soy basamağı doğrudan ≈ ile işaretli özgün dil tabanına düşer: Eski Antlaşma'da Leningrad Kodeksi'ne, Yeni Antlaşma'da Textus Receptus'a; bu çeviri o on altı yerde bu Grekçe metni izlemez. Onun üzerinde duran hiçbir şey de kayıtlı değildir. Hiçbir arayüz dili bu baskıda açılmaz; İngilizce arayüz New International Version'da açılır, bu baskıya ise çeviri ızgarasındaki kendi kartından ulaşılır.

