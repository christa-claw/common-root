fact.2.label=Tilaaja
fact.2.value=Lockman-säätiö Kalifornian La Habrasta — samasta voittoa tavoittelemattomasta järjestöstä, joka on New American Standard Biblen ja sen oman edeltäjän, La Biblia de las Américasin (1986), takana
fact.3.label=Tekijät
fact.3.value=Kaksitoistahenkinen Lockmanin tarkistustoimikunta, joka työskenteli La Biblia de las Américasin käännöksen pohjalta — käännöksen, joka itse on kahdenkymmenenkahden kääntäjän ja asiantuntijan noin viidentoista vuoden työn tulos
fact.4.label=Vanha testamentti pohjautuu
fact.4.value=Rudolf Kittelin Biblia Hebraicaan, Kuolleenmeren kääröt huomioon ottaen, peritty La Biblia de las Américasin omasta tekstipohjasta
fact.5.label=Uusi testamentti pohjautuu
fact.5.value=Eberhard Nestlen Novum Testamentum Graeceen, yleisesti 27. painokseen, huomioiden lisää käsikirjoitusaineistoa siltä osin kuin se vaikuttaa johonkin lukutapaan
fact.6.label=Käännöstyyppi
fact.6.value=Formaalinen vastaavuus, sama sanatarkka menetelmä kuin La Biblia de las Américasissa ja New American Standard Biblessä — ei tuore käännös, vaan rekisterin tarkistus tutuksi, nykyaikaiseksi espanjaksi, jota puhutaan koko Latinalaisessa Amerikassa, korvaten kastilialaisia muotoja kuten "vosotros" muodolla "ustedes" ja väljentäen rakenteita kuten kaavamaisen "y":n ja "sucedió que":n, jotka aiempi teksti siirsi kirjaimellisesti hebreasta
fact.7.label=Julkaistu
fact.7.value=Tekijänoikeus rekisteröity 2005 Lockman-säätiölle; jotkin luettelot ovat sittemmin ryhmitelleet sen yhteen säätiön vuoden 2020 New American Standard Bible -tarkistuksen kanssa, mutta 2005 pysyy sen omassa tekijänoikeusilmoituksessa mainittuna vuonna
fact.8.label=Lisenssi
fact.8.value=Lisenssinvarainen, ei vapaaseen käyttöön luovutettu. Enintään 500 jaetta saa lainata missä tahansa muodossa ilman kirjallista lupaa, kunhan ne eivät muodosta kokonaista Raamatun kirjaa eivätkä enempää kuin neljäsosaa lainaavasta teoksesta, ja mukana on tekijänoikeusmaininta, joka nimeää vuoden 2005; sitä laajempi käyttö vaatii Lockman-säätiön luvan
fact.9.label=Tässä aineistossa
fact.9.value=Lisenssinvarainen eikä vapaaseen käyttöön luovutettu, samoin kuin [[NASB|New American Standard Bible]] samasta säätiöstä. Espanjankielinen käyttöliittymä avautuu oletuksena [[RVR09|Reina Valera 1909]] -laitokseen, vapaan käytön tekstiin erillisestä perinteestä ja vuosisadan vanhempaan, ja tämä laitos tavoitetaan omalta kortiltaan. Polveutumisaskelmiin ei ole kirjattu isää: se on La Biblia de las Américasin rekisterin tarkistus, jota ei itsessään pidetä tässä aineistossa, niin että askelma NBLA-jakeen alla johtaa suoraan alkukielen pohjalle, merkittynä ≈.
