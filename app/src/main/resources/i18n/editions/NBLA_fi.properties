title=Nueva Biblia de las Américas — Tietoa tästä laitoksesta | Common Root
description=Nueva Biblia de las Américas: Lockman-säätiön latinalaisamerikkalais-espanjankielinen tarkistus omasta La Biblia de las Américasista, joka vie samaa sanatarkkaa menetelmää koko Amerikassa puhuttuun arkiseen espanjaan.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas on Lockman-säätiön latinalaisamerikkalais-espanjankielinen laitos, rakennettu säätiön aiemman, vuoden 1986 La Biblia de las Américasin varaan — joka itse on noin viidentoista vuoden työn tulos kahdellakymmenelläkahdella kääntäjällä ja asiantuntijalla, samalla sanatarkalla käännösfilosofialla, joka vietiin myöhemmin englanniksi New American Standard Biblena. Tuore käännös hebreasta ja kreikasta se ei ole; NBLA on rekisterin tarkistus: kaksitoistahenkinen Lockmanin toimikunta muokkasi La Biblia de las Américasin kastilialaisemman espanjan tutuksi, nykyaikaiseksi espanjaksi, jota puhutaan koko Latinalaisessa Amerikassa, korvaten muodot kuten monikon toisen persoonan "vosotros" yleisemmällä "ustedes"-muodolla ja väljentäen rakenteita, kuten kaavamaisen "y":n ja "sucedió que":n, jotka aiempi teksti oli siirtänyt kirjaimellisesti hebrealaisesta kertomustyylistä. Lockman-säätiön oma lainausluvan ilmoitus ajoittaa valmiin tekstin vuoteen 2005.
hero.2=Tekstipohja seuraa suoraan La Biblia de las Américasista: Vanha testamentti pohjautuu Rudolf Kittelin Biblia Hebraicaan, Kuolleenmeren kääröt huomioon ottaen, ja Uusi testamentti yleisesti Eberhard Nestlen Novum Testamentum Graecen 27. painokseen, huomioiden lisää käsikirjoitusaineistoa siltä osin kuin se vaikuttaa johonkin lukutapaan. Jotkin kirjakaupat ja raamattuohjelmistojen luettelot ryhmittävät nykyään Nueva Biblia de las Américasin yhteen säätiön vuoden 2020 New American Standard Bible -tarkistuksen kanssa, markkinoiden niitä yhtenä parina englannin- ja espanjankielisille lukijoille samasta sanatarkasta perinteestä; käännös itse ei kuitenkaan kanna säätiön omissa ilmoituksissa myöhempää tekijänoikeusvuotta kuin 2005.
hero.3=Espanjankielinen käyttöliittymä avautuu tässä oletuksena Reina Valera 1909:ään, vapaan käytön tekstiin täysin erillisestä käännösperinteestä ja vuosisadan vanhempaan; Nueva Biblia de las Américas tavoitetaan sen sijaan omalta kortiltaan käännösruudukossa. Sillä on vähän tekstihistoriaa yhteistä tämän laitoksen kanssa, mutta paljon New American Standard Biblen kanssa — sama säätiö, sama formaalisen vastaavuuden menetelmä ja sama lisenssinvarainen, ei vapaaseen käyttöön luovutettu asema, joka sallii enintään 500 jakeen lainaamisen ilman kirjallista lupaa, kunhan ne eivät muodosta kokonaista kirjaa eivätkä enempää kuin neljäsosaa lainaavasta teoksesta. Polveutumisaskelmiin ei ole kirjattu isää: La Biblia de las Américas, teksti, jota se tarkistaa, ei itse ole tässä aineistossa, niin että askelma NBLA-jakeen alla johtaa suoraan alkukielen pohjalle, merkittynä ≈.

