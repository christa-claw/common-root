title=Septuaginta inglesa de Brenton — Acerca de esta edición | Common Root
description=La traducción inglesa del Antiguo Testamento griego hecha por Sir Lancelot Brenton, publicada por primera vez en Londres en 1844 y reeditada con los apócrifos en 1851: durante más de un siglo, la Septuaginta inglesa por excelencia, y en este lector el peldaño situado sobre el griego del que se tradujo.
heroHeading=Septuaginta inglesa de Brenton
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) era hijo de un almirante de la Royal Navy, Sir Jahleel Brenton, y fue ordenado en la Iglesia de Inglaterra en 1830, dos años después de licenciarse en el Oriel College de Oxford. No permaneció en ella mucho tiempo. En Oxford había conocido a John Nelson Darby, y a finales de 1831 ya había dejado la Iglesia establecida para fundar una capilla independiente en Bath; hacia 1835 esa capilla estaba asociada a los Hermanos de Plymouth, el movimiento al que Darby estaba dando forma. Las Biblias del propio Darby también están en este corpus, en francés y en inglés. En 1844 Brenton heredó el título de baronet de su padre, y ese mismo año Samuel Bagster and Sons, de Londres, publicó su traducción de la Septuaginta. Murió en la isla de Wight en 1862, sin hijos, el último baronet de su línea.
hero.2=No fue la primera Septuaginta inglesa —Charles Thomson había publicado una en Filadelfia en 1808—, pero fue la que perduró: durante más de siglo y medio, hasta que apareció en 2007 la New English Translation of the Septuagint, el lector de habla inglesa que quería el Antiguo Testamento griego en lugar del hebreo leía a Brenton. Tradujo principalmente del Códice Vaticano, el manuscrito del siglo IV de la Biblioteca Vaticana. La primera edición dejaba fuera los apócrifos; la edición de 1851 los añadió, y es el texto de 1851 el que reproduce esta copia. Las ediciones grecoinglesas de Bagster colocaban el griego junto al inglés, y ese griego está en este corpus como edición aparte. Como el inglés sigue al griego, lee donde lee el griego: los salmos conservan la numeración griega, de modo que aquí el salmo 22 es el salmo del pastor, y en Isaías 7:14 «a virgin shall conceive» traduce el griego parthenos, no el hebreo ʿalmah.
hero.3=En este lector es un peldaño con un único antecesor, y literal: la Septuaginta griega que tiene debajo es el texto que Brenton tradujo, impreso por su propio editor junto a su inglés. Abra un peldaño bajo uno de sus versículos y aparece el griego, con el Códice de Leningrado debajo como suelo de las lenguas originales. Nada en el corpus se apoya a su vez en ella. Nuestra copia es más estrecha que el libro. Tiene 37 libros, los que también tiene el canon hebreo con sus nombres habituales. Los archivos de eBible.org de los que se tomó contienen también los apócrifos —Tobías, Judit, Sabiduría, Sirácida, Baruc, cuatro libros de los Macabeos y más— y dan Ester y Daniel solo en sus formas griegas, más largas. Nada de eso llegó al corpus, así que aquí no hay Ester ni Daniel, y donde el griego de debajo tiene Tobías o Sabiduría no hay inglés encima. Esdras y Nehemías figuran como dos libros, donde el griego de debajo tiene uno. Una actualización ortográfica de la misma traducción, la Updated Brenton de Adam Boyd, de 2020, está en el corpus como edición propia.

