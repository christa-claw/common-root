title=Opin ja liittojen kirja — Tietoja tästä laitoksesta | Common Root
description=Opin ja liittojen kirja: Joseph Smithin kirjaamat ilmoitukset ja muut lausumat, julkaistu ensimmäisen kerran 1835 Kirtlandissa, Ohiossa, ja myöhempien päivien pyhien luettuina pyhänä kirjoituksena Raamatun rinnalla.
heroHeading=Opin ja liittojen kirja
readerHref=/reader?c1.src=dc

hero.1=Opin ja liittojen kirja kokoaa ilmoituksia, näkyjä ja muita lausumia, jotka Joseph Smith nuorempi sanoi saaneensa suorina viesteinä Jumalalta; ne kirjattiin pääosin kirkon ensimmäisten vuosien aikana Ohiossa, Missourissa ja New Yorkissa. Aikaisempi koonnos, nimeltään "Käskyjen kirja Kristuksen kirkon hallintoa varten", oli painettavana kirkon painossa Independencessä, Missourissa, kun joukko tuhosi painon heinäkuussa 1833 ja hajotti keskeneräiset arkit ennen kuin kirja saatiin valmiiksi; sitä ei koskaan julkaistu virallisesti, vaikka pieni osa silloin pelastetuista, sitomattomista arkeista on säilynyt.
hero.2=Laajennettu ja uudelleen nimetty "Myöhempien aikojen pyhien kirkon oppi ja liitot" seurasi vuonna 1835, julkaistuna Kirtlandissa, Ohiossa, ja sen kokosi ja hyväksyi nelihenkinen toimikunta: Joseph Smith, Oliver Cowdery, Sidney Rigdon ja Frederick G. Williams. Tämä ensimmäinen laitos yhdisti saman kannen alle kahdenlaista ainesta — Kirtlandin koulussa pidettyjen teologisten luentojen sarjan, esiteltynä sen "Oppina", sekä itse kirjatut ilmoitukset, esiteltynä sen "Liittoina". Nämä luennot, sittemmin tunnettuina nimellä Lectures on Faith, poistettiin myöhemmin kirjasta — muutos ajoitetaan tavallisesti vuoden 1921 laitokseen — jolloin ilmoitukset jäivät koko teokseksi.
hero.3=Kirja on jaettu numeroituihin pykäliin sen sijaan, että siinä olisi Raamatun kaltaiset kirjat, luvut ja jakeet — mikä vastaa sitä, mitä se on: kokoelma erillisiä tekstejä eikä yksi yhtenäinen kertomus. Sekä sisältö että numerointi muuttuivat 1800-luvun laitosten myötä, muun muassa vuoden 1876 laitoksessa, jonka Orson Pratt järjesti uudelleen ja jossa hän lisäsi uusia ilmoituksia. Nykyinen laitos sai lopullisen muotonsa vuonna 1981, kun siihen lisättiin pykäliksi 137 ja 138 kaksi uutta kohtaa — näky kirkkauden asteista ja näky kuolleiden lunastuksesta — sekä kaksi "virallista julistusta": vuoden 1890 julistus, joka lopetti kirkon hyväksymät uudet moniavioiset liitot, ja vuoden 1978 julistus, joka ulotti pappeuden vihkimisen kaikkiin arvollisiin miesjäseniin rodusta riippumatta. Vuoden 2013 painos päivitti lisäksi muuta hakuaineistoa. Nykyisin käytössä oleva standardilaitos käsittää 138 pykälää ja kaksi virallista julistusta.
hero.4=Se on yksi niistä neljästä teoksesta, joita myöhempien päivien pyhien liike kutsuu standarditeoksikseen, Raamatun, [[BOM|Mormonin kirjan]] ja [[PGP|Kallisarvoisen helmen kirjan]] ohella. Community of Christ, samasta liikkeestä periytyvä erillinen kirkkokunta, pitää omaa Opin ja liittojen kirjaansa, numeroituna ja päivitettynä tästä riippumatta. Tämän aineiston teksti on peräisin Mormon Documentation Project -hankkeen JSON-aineistosta, samasta yleisomistukseen julistetusta lähteestä, jota käytetään myös [[BOM|Mormonin kirjassa]] ja [[PGP|Kallisarvoisen helmen kirjassa]], ja se esitetään tässä yhtenä kirjana, "Opin ja liittojen kirja", jossa kukin pykälä vastaa lukua; se noudattaa nykyisen standardilaitoksen sanamuotoa ja jättää pois tekijänoikeuden alaiset alaviitteet ja lukujen otsikot, minkä takia sille ei tässä esitetä yksittäistä julkaisuvuotta.

