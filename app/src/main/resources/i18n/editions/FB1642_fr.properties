title=Biblia 1642 — À propos de cette édition | Common Root
description=Biblia 1642 : la première Bible complète en finnois, traduite en trois ans par quatre savants à Turku et imprimée sous le patronage de la reine Christine de Suède.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
thanks=Avec nos remerciements à celles et ceux qui ont envoyé des corrections à cette page.

# The narrative, one paragraph per key, in order.
hero.1=La première Bible complète en finnois. Avant elle il y avait le Nouveau Testament de Mikael Agricola de 1548 et des morceaux de l'Ancien parus dans les années 1550 ; après elle il y avait une Bible entière dans une langue qui avait à peine été écrite. Quatre savants ont fait le travail entre 1638 et 1641 — Eskil Petraeus, Martinus Stodius, Henricus Hoffman et Gregorius Matthaei — sous Isaacus Rothovius, évêque de Turku, qui a fait aboutir le projet. La Finlande faisait partie de la Suède, et le volume a paru en 1642 sous le patronage de la reine Christine. Une tentative avait eu lieu une génération plus tôt : en 1602 fut nommée une commission de traduction biblique, probablement sous Ericus Erici Sorolainen, évêque de Turku. Elle semble avoir produit des ébauches sans jamais les rassembler en une Bible, et leur sort est en grande partie perdu — on pense toutefois que ce travail a marqué la traduction de 1642.
hero.2=Ils ont traduit de l'hébreu et du grec, l'allemand de Luther à côté d'eux. La Bible suédoise de Gustave Vasa était l'autre livre sur la table ; elle n'est pas dans ce corpus, de sorte que la chaîne enregistre ici le Luther — et, à côté de lui, le finnois d'Agricola de 1548, le texte de base que le comité révisait. Le plus grand effet de la Biblia de 1642 a porté sur le finnois lui-même. Une langue presque sans prose écrite a reçu, en un seul volume, un vocabulaire et une cadence pour tout, du droit à la lamentation, et chaque Bible finnoise ultérieure en est une révision ou une héritière, non un nouveau départ.
hero.3=Dans ce lecteur, la 1642 se tient entre deux barreaux finnois. Trois échelons sous la Kirkkoraamattu 1933/38, au-dessous de la Biblia 1776, cette édition paraît, et au-dessous d'elle deux parents côte à côte — le finnois d'Agricola de 1548, la base que le comité révisait, et l'allemand de Luther de 1545, ouvert sur la table. Un barreau plus bas, la chaîne a quitté le finnois pour de bon. Le texte vient du corpus VKS du Kotus de finnois littéraire ancien, et c'est pourquoi la graphie que vous voyez — « tulcon walkeus » — est celle de l'impression de 1642 et n'est pas modernisée.

