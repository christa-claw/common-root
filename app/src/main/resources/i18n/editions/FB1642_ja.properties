# The narrative, one paragraph per key, in order.
hero.1=フィンランド語で最初の完全な聖書である。それ以前には、ミカエル・アグリコラの1548年の新約聖書と、1550年代に出版された旧約聖書の一部があった。それ以後には、ほとんど書かれたことのない言語による、まるごと一冊の聖書があった。四人の学者が1638年から1641年のあいだにこの仕事を行った——エスキル・ペトラエウス、マルティヌス・ストディウス、ヘンリクス・ホフマン、グレゴリウス・マッタエイである——計画を推し進めたトゥルク主教イサークス・ロートヴィウスのもとでのことである。フィンランドはスウェーデンの一部であり、この書物は1642年に女王クリスティーナの庇護のもとで世に出た。一世代前にも試みがなされていた。1602年、おそらくトゥルク主教エリクス・エリキ・ソロライネンのもとで、翻訳委員会が任命されたのである。それは草稿を作成したようだが、聖書としてまとめられることはなく、その行方の大半は失われている——とはいえ、その仕事が1642年の翻訳に影響を与えたと考えられている。
hero.2=彼らはヘブライ語とギリシャ語から、ルターのドイツ語を脇に置いて訳した。グスタフ・ヴァーサのスウェーデン語聖書も机上にあった別の書物だったが、このコーパスには収められていないため、ここでの系譜はルターを——そしてその傍らに、委員会が改訂していた底本であるアグリコラの1548年のフィンランド語を記録している。Biblia 1642 がより大きく影響したのは、フィンランド語そのものに対してである。書かれた散文をほとんど持たなかった言語が、一冊の中で、法律から哀歌まですべてに通じる語彙と調子を手に入れた——そして、それ以後のすべてのフィンランド語聖書は、新しい出発ではなく、その改訂か後継である。
hero.3=この読書環境において、Biblia 1642 は二つのフィンランド語の段のあいだに座っている。Kirkkoraamattu 1933/38 の三段下、Biblia 1776 の下に、この版が現れる。そしてその下には二つの母本が並んでいる——委員会が改訂した底本であるアグリコラの1548年のフィンランド語と、机上に開かれていたルターの1545年のドイツ語である。さらに一段下ると、系譜はフィンランド語を完全に離れる。本文はコトゥスのVKSコーパスの古フィンランド文語によるもので、そのため見える綴り——「tulcon walkeus」——は1642年版そのものの表記であり、現代化されてはいない。

