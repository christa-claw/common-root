fact.9.label=רישיון
fact.9.value=ברישיון, לא נחלת הכלל. עד 500 פסוקים ניתן לצטט בלא רשות כתובה, בתנאי שאינם מהווים ספר מקרא שלם ולא יותר מ-25% מהחיבור, בציון זכויות היוצרים; מעבר לכך דרושה רשות מ-Biblica
fact.10.label=באוסף זה
fact.10.value=המקרא שבו מנשק אנגלי נפתח כברירת מחדל — [[KJV|King James Version]] ו[[RV|מהדורה מתוקנת]] קובעים כאן שניהם שאין זה הם. בשלבי השושלת לא רשום לה מקור: שלב מתחת לפסוק מ-NIV יורד ישירות לרצפת לשונות המקור המסומנת ב-≈, כמו ב[[BSB|Berean Standard Bible]] — אלא שהעד היווני של אותה רצפה הוא [[TR|הנוסח המקובל]], שאינו הנוסח שממנו נעשתה למעשה הברית החדשה של תרגום זה. ברישיון ולא נחלת הכלל, באותו מעמד כמו New American Standard Bible 2020, היא עומדת כך בנפרד משכנות שהן נחלת הכלל כגון [[KJV|King James Version]], [[RV|מהדורה מתוקנת]] ו[[WEB|World English Bible]]
