fact.7.value=הברית החדשה ב-1973; המקרא השלם ב-27 באוקטובר 1978; תיקון קל ב-1984; הנוסח הנוכחי, המתוקן ביתר יסודיות, ב-2011, שהוציא משימוש גם את מהדורת 1984 וגם את Today's New International Version משנת 2005
fact.8.label=המוציא לאור
