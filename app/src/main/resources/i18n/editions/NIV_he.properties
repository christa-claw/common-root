fact.6.label=סוג התרגום
fact.6.value=מאזן בין דיוק של תרגום מילולי לבין אנגלית טבעית ואידיומטית, מבלי להיאחז באחד הקצוות — מסווג בדרך כלל כשוויון ערך דינמי; תרגום חדש מהלשונות המקוריות, לא תיקון של מסורת King James
