title=New International Version — על המהדורה הזו | Common Root
description=New International Version: המקרא האנגלי שבו קורא זה נפתח כברירת מחדל, תורגם ישירות מהלשונות המקוריות בידי ועדת תרגום המקרא (Committee on Bible Translation) והושלם לראשונה ב-1978 — כאן בנוסחו משנת 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=זה התחיל מחוסר שביעות רצון של זרם דתי אחד. ב-1955 איש העסקים הווארד לונג, יחד עם הכומר פיטר דה יונג, הפעיל לחץ על ה-Christian Reformed Church להוציא מקרא באנגלית בת־זמננו, וב-1957 אישרה הכנסייה ועדה שתבחן את הרעיון. ה-National Association of Evangelicals החלה באותה שנה בפרויקט דומה משל עצמה. שני הגופים איחדו כוחות: ועדה משותפת שלחה ב-1964 הזמנות לכנס תרגום, שנתכנס באוגוסט 1965 ב-Trinity Christian College בפאלוס הייטס, אילינוי, והחליט להקים "ועדה קבועה של חמישה עשר" להמשיך את העבודה. הוועדה הקבועה הזו הפכה לוועדת תרגום המקרא. ב-1967 נטלה New York Bible Society — ששמה שונה מאז ל-Biblica — את חסות הפרויקט ושכרה את החכמים שיביאו את התרגום לידי ביצוע.
hero.2=שום דבר כאן אינו נובע ממקרא אנגלי קדום יותר. בעוד King James Version, Revised Version, American Standard Version ו-World English Bible מהוות באוסף זה שרשרת תיקון אחת, New International Version תורגמה מחדש, ישירות מן העברית, הארמית והיוונית: הברית הישנה מתוך הנוסח העברי המסורתי, בהתייחסות למגילות מדבר יהודה, לתרגום השבעים ולעדים קדומים אחרים; הברית החדשה מתוך הנוסח היווני הביקורתי האקלקטי שמייצגות מהדורות United Bible Societies ו-Nestle-Aland — ולא מהנוסח המקובל שעליו נשענים כאן מקרא ז'נבה ו-King James. הוועדה בת חמישה עשר התרחבה, במשך כעשור, לפרויקט שנשען על יותר ממאה חכמים ממדינות דוברות אנגלית שונות ומזרמים דתיים רבים. מטרתם המוצהרת הייתה תרגום שישמור על דיוק הנוסח המקורי מבלי להיקרא כהעתקה מילה-במילה שלו — איזון המסווג בדרך כלל כשוויון ערך דינמי, בין תרגום מילולי קפדני לבין ניסוח חופשי.
hero.3=הברית החדשה הופיעה ראשונה, ב-1973; המקרא השלם בא בעקבותיה ב-27 באוקטובר 1978; תיקון קל נעשה ב-1984. הנוסח השתנה ביתר יסודיות ב-2011, אז תיקון נרחב יותר החליף גם את מהדורת 1984 וגם את Today's New International Version משנת 2005, והוציא את שתיהן משימוש לטובת הנוסח האחד שעמד מאז. נוסח 2011 הזה הוא זה שמוחזק באוסף זה — אותה שנה שמוצגת בכרטיס הקטלוג. ל-Biblica, Inc. שייכות זכויות היוצרים כל העת; מוציאה אותו Zondervan בארצות הברית ו-Hodder & Stoughton בבריטניה.
hero.4=מקומה בקורא זה מרכזי באופן שקט. כוונו את המנשק לאנגלית, וזו הנפתחת — עמודי King James Version ו-Revised Version באוסף זה עצמם קובעים שאינם היא, ומפנים לכאן כאל המהדורה שעוברים ממנה הצידה, לא זו שמגיעים אליה. מכיוון שלא תיקנה דבר, האוסף אינו רושם לה מקור: פתיחת שלב של שושלת מתחת לפסוק מ-New International Version יורדת ישירות לרצפת לשונות המקור המסומנת ב-≈, כמו ב-Berean Standard Bible — עם הבדל אחד שכדאי להכיר. העד היווני של אותה רצפה הוא הנוסח המקובל, והנוסח המקובל אינו מה שממנו נעשתה למעשה הברית החדשה של תרגום זה — הרצפה עומדת במקום "היוונית המקורית" באופן כללי, לא עבור נוסח העבודה של הוועדה הזאת עצמה. דבר נוסף מייחד אותה מרוב שכנותיה האנגליות: היא ברישיון, לא נחלת הכלל, אותו מעמד כמו New American Standard Bible 2020, בעוד ש-Berean Standard Bible, מקרא ז'נבה, King James Version, Revised Version ו-World English Bible כולן מותרות להעתקה חופשית.

