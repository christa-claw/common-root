title=Brentons engelska Septuaginta i uppdaterad stavning — Om denna utgåva | Common Root
description=Sir Lancelot Brentons engelska Septuaginta från 1844 och 1851, med stavning och namn moderniserade av Adam Boyd 2020 — samma översättning som den ursprungliga Brenton bredvid den i detta korpus, med thou och thee kvar där Brenton satte dem.
heroHeading=Brentons engelska Septuaginta i uppdaterad stavning
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Detta är Sir Lancelot Brentons engelska översättning av Septuaginta, Gamla testamentet på grekiska, med engelskan moderniserad. Brenton översatte främst från Codex Vaticanus; Samuel Bagster and Sons i London gav ut hans översättning 1844 och på nytt med apokryferna 1851. År 2020 reviderade Adam Boyd den för eBible.org och överlämnade sina ändringar till det fria. Han översatte den inte på nytt. Hans inledning räknar upp vad han ändrade: stavningen gjord modern amerikansk, så att ”shew” blir ”show”; person- och ortnamn i de former engelska läsare känner; ”begat” och ”spake” ändrade till ”begot” och ”spoke”; bindestreck och dubbla skiljetecken städade; och poesi uppställd som poesi. Det han behöll är lika avsiktligt: ”thou”, ”thee” och ”ye” med de verbformer som hör till dem, Brentons grammatik och hans tunga interpunktion från 1800-talet.
hero.2=Skillnaden syns bäst bredvid den ursprungliga Brenton, som också finns i detta korpus. Brenton stavade hebreiska namn så som grekiskan stavar dem; uppdateringen ger oftast den engelska formen. Där Brentons Nehemja börjar med ”the words of Neemias the son of Chelcia” har denna ”Nehemiah the son of Hacaliah”; Elias the Thesbite blir Elijah the Tishbite, och Emmanuel i Jesaja 7:14 blir Immanuel. Under stavningen är översättningen fortfarande Brentons, så den läser fortfarande där grekiskan läser. ”A virgin shall conceive” i Jesaja 7:14 återger grekiskans parthenos; Psalmerna behåller den grekiska numreringen, så Psalm 22 är här herdepsalmen; och jorden i 1 Mos 1:2 är fortfarande ”unsightly and unfurnished”. De gamla pronomenen står också kvar: ”thou shalt call his name Immanuel”.
hero.3=I denna läsare står den utanför härstamningens stegpinnar. Korpuset har ingen förlaga noterad för den — varken grekiskan Brenton översatte eller den Brenton den reviderar — så en stegpinne öppnad under en av dess verser faller rakt ned på grundspråksgolvet märkt med ≈, som för Gamla testamentet är Leningradkodexen: en hebreisk text, inte den grekiska denna översättning gjordes ur. Vill man stiga från Brentons engelska ned i hans grekiska öppnar man den ursprungliga Brenton, vars noterade förlaga är Septuaginta. Ingenting står i sin tur på denna utgåva, och inget gränssnittsspråk öppnar på den; ett engelskt gränssnitt öppnar på New International Version. Vår kopia är smalare än boken. Den har 36 böcker. Esra och Nehemja är en enda bok på 23 kapitel, så som i grekiskan, med Nehemja från kapitel 11. Filerna från eBible.org som den hämtades ur innehåller också apokryferna och ger Ester och Daniel enbart i deras längre grekiska form; inget av detta togs in, så här finns varken Ester eller Daniel, och inte heller Tobit eller Vishetens bok.

