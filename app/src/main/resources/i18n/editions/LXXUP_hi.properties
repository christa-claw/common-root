title=अद्यतन ब्रेंटन अंग्रेज़ी सेप्टुआजिंट — इस संस्करण के बारे में | Common Root
description=सर लैंसलॉट ब्रेंटन का 1844 और 1851 का अंग्रेज़ी सेप्टुआजिंट, जिसकी वर्तनी और नाम एडम बॉयड ने 2020 में अद्यतन किए — वही अनुवाद जो इस संग्रह में इसके बगल में रखा मूल ब्रेंटन है, और thou व thee वहीं छोड़े गए जहाँ ब्रेंटन ने उन्हें रखा था।
heroHeading=अद्यतन ब्रेंटन अंग्रेज़ी सेप्टुआजिंट
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=यह सर लैंसलॉट ब्रेंटन द्वारा सेप्टुआजिंट, यानी यूनानी पुराने नियम, का अंग्रेज़ी अनुवाद है, जिसकी अंग्रेज़ी को आज के अनुरूप किया गया है। ब्रेंटन ने मुख्यतः कोडेक्स वैटिकनस से अनुवाद किया; लंदन के Samuel Bagster and Sons ने उनका अनुवाद 1844 में प्रकाशित किया और 1851 में अप्रामाणिक ग्रंथों सहित फिर से छापा। 2020 में एडम बॉयड ने eBible.org के लिए इसका संशोधन किया और अपने परिवर्तन सार्वजनिक अधिकार-क्षेत्र को सौंप दिए। उन्होंने इसका दोबारा अनुवाद नहीं किया। उनकी भूमिका बताती है कि उन्होंने क्या बदला: वर्तनी को आधुनिक अमेरिकी अंग्रेज़ी में लाया गया, जिससे “shew” “show” बन गया; व्यक्तियों और स्थानों के नाम उन रूपों में दिए गए जिन्हें अंग्रेज़ी पाठक पहचानते हैं; “begat” और “spake” को “begot” और “spoke” किया गया; योजक-चिह्न और दोहरे विराम-चिह्न व्यवस्थित किए गए; और कविता को कविता के रूप में सजाया गया। जो उन्होंने रखा, वह भी उतना ही सोचा-समझा है: “thou”, “thee” और “ye” तथा उनके साथ चलने वाले क्रिया-रूप, ब्रेंटन का व्याकरण, और उनका भारी उन्नीसवीं सदी का विराम-चिह्न विधान।
hero.2=अंतर सबसे अच्छा मूल ब्रेंटन के बगल में दिखता है, जो इस संग्रह में भी है। ब्रेंटन इब्रानी नामों को वैसे लिखते थे जैसे यूनानी उन्हें लिखती है; अद्यतन संस्करण प्रायः अंग्रेज़ी रूप देता है। जहाँ ब्रेंटन की नहेम्याह की पुस्तक “the words of Neemias the son of Chelcia” से आरंभ होती है, वहाँ इसमें “Nehemiah the son of Hacaliah” है; Elias the Thesbite बन जाता है Elijah the Tishbite, और यशायाह 7:14 का Emmanuel बन जाता है Immanuel। वर्तनी के नीचे अनुवाद अब भी ब्रेंटन का है, इसलिए यह अब भी वहीं पढ़ता है जहाँ यूनानी पढ़ती है। यशायाह 7:14 में “A virgin shall conceive” यूनानी parthenos का अनुवाद है; भजन यूनानी क्रमांकन रखते हैं, इसलिए यहाँ भजन 22 चरवाहे का भजन है; और उत्पत्ति 1:2 की पृथ्वी अब भी “unsightly and unfurnished” है। पुराने सर्वनाम भी बने रहते हैं: “thou shalt call his name Immanuel”।
hero.3=इस पाठक में यह वंश-पायदानों से बाहर खड़ा है। संग्रह इसके लिए कोई जनक दर्ज नहीं करता — न वह यूनानी जिसका ब्रेंटन ने अनुवाद किया, न वह ब्रेंटन जिसका यह संशोधन है — इसलिए इसकी किसी आयत के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर गिरता है, जो पुराने नियम के लिए लेनिनग्राद कोडेक्स है: एक इब्रानी पाठ, न कि वह यूनानी जिससे यह अनुवाद बना। ब्रेंटन की अंग्रेज़ी से उनकी यूनानी तक उतरने के लिए मूल ब्रेंटन खोलें, जिसका दर्ज जनक सेप्टुआजिंट है। इस संस्करण पर बदले में कुछ नहीं टिका, और कोई अंतरफलक भाषा इस पर नहीं खुलती; अंग्रेज़ी अंतरफलक New International Version पर खुलता है। हमारी प्रति पुस्तक से संकरी है। इसमें 36 पुस्तकें हैं। एज्रा और नहेम्याह 23 अध्यायों की एक ही पुस्तक हैं, जैसे यूनानी में, और नहेम्याह अध्याय 11 से शुरू होता है। जिन eBible.org फ़ाइलों से यह ली गई, उनमें अप्रामाणिक ग्रंथ भी हैं, और वे एस्तेर और दानिय्येल को केवल उनके लंबे यूनानी रूपों में देती हैं; इनमें से कुछ भी शामिल नहीं किया गया, इसलिए यहाँ न एस्तेर है न दानिय्येल, और न ही तोबित या प्रज्ञा।

