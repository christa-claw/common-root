title=Agricola 1548 — عن هذه الطبعة | Common Root
description=فنلندية ميكائيل أغريكولا: العهد الجديد سنة 1548 والمزامير سنة 1551 والأنبياء — أول كتاب مقدس مطبوع بالفنلندية، وبداية الفنلندية المكتوبة نفسها.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=مع الشكر لمن أرسلوا تصويبات لهذه الصفحة.

# The narrative, one paragraph per key, in order.
hero.1=هذه أقدم فنلندية مطبوعة على الإطلاق. حين نشر ميكائيل أغريكولا Se Wsi Testamenti سنة 1548، لم تكن الفنلندية قد صُفَّت في مطبعة تقريبًا قط — فكتابه لتعليم الحروف، الصادر قبل ذلك بسنوات قليلة، كان أول كتاب فنلندي أصلًا. وبينهما صدر أيضًا كتاب الصلوات سنة 1544، وهو عمل ضخم الحجم، وفيه ترجمات لمزامير. ولكي يطبع الكتاب المقدس كان عليه أولًا أن يقرر كيف تُكتب هذه اللغة، وتلك القرارات — الهجاء والكلمات المستعارة والإيقاع — هي حيث تبدأ الفنلندية المكتوبة. استغرق العهد الجديد منه ومن حلقته في توركو أكثر من عقد؛ وتبعته المزامير سنة 1551، ثم مختارات من الأنبياء وأسفار موسى في 1551 و1552. غير أنّ فنلنديته كانت أول فنلندية مطبوعة، لا أول فنلندية مكتوبة: أربع مخطوطات — كودكس ڤيست، ومخطوط أوبسالا B 28، وقُدّاس كنغاسالا، وقصاصة أوبسالا — تحمل مقاطع كتابية بالفنلندية، وقد بيّن كاوكو پيرينن سنة 1988، بمقارنتها بمصادرها السويدية، أنّ بعضها أقدم من كل ما طبعه أغريكولا، ولعلّه كُتب في ثلاثينيات القرن السادس عشر.
hero.2=لم يترجم الكتاب المقدس كله قط، وهذا القارئ لا يدّعي غير ذلك. العهد الجديد والمزامير المئة والخمسون كاملة؛ والأنبياء وأسفار موسى واردة في مختارات. وهنا أيضًا ما نقله في مواضع أخرى: ففي كتاب صلواته سنة 1544، وفي Käsikirja وMessu سنة 1549، نصٌّ كتابيٌّ خاصّ بها — ومنه فصول سفر التكوين المطبوعة تحت عنوان "Genesist mutomat Lughut" — ومن هناك جاءت 685 آية. ولا تُستعمل إلا حيث لا تحوي مجلدات الكتاب آيةً في الموضع نفسه، وحيث يجري النصّ متصلًا لا مقتبسًا مفردًا داخل صلاة. فسفر التكوين إذن حاضر، جزئيًا: الفصول 1–4 و22 و28 و32. أما القضاة وراعوث وأخبار الأيام الأول وأستير فغائبة تمامًا. أما العهد القديم الفنلندي الكامل فكان عليه أن ينتظر بيبليا سنة 1642، درجة واحدة أعلى.
hero.3=في هذا القارئ أغريكولا هو أقدم الدرجات الفنلندية. افتح درجة واحدة تحت آية من بيبليا 1642 فيظهر نصه إلى جانب ألمانية لوثر — وهما المصدران اللذان كانا مفتوحين حقًا أمام لجنة 1642. وتحت أغريكولا نفسه تغادر السلسلة الفنلندية بلا رجعة: فقد عمل على يونانية إيراسموس وعلى اللاتينية التي طبعها إيراسموس إلى جانبها، وعلى ألمانية لوثر وعلى الفولغاتا. ثلاثة منها مسجّلة هنا آباءً له؛ أما لاتينية إيراسموس والكتاب المقدّس السويدي الكامل لغوستاف فاسا سنة 1541، وقد استعان به أيضًا، فليسا في هذه المجموعة. النص من مدونة VKS لدى Kotus، بهجاء طبعة 1548 نفسه: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". كان الكتاب المقدّس بالسويدية مطبوعًا منذ سنة 1526، حين صدر العهد الجديد السويدي، فكانت ترجمة سويدية في متناوله منذ البداية.

