title=Nueva Biblia de las Américas — Über diese Ausgabe | Common Root
description=Die Nueva Biblia de las Américas: die lateinamerikanisch-spanische Überarbeitung der Lockman Foundation ihrer eigenen La Biblia de las Américas, die dieselbe wortgetreue Methode in das Alltagsspanisch trägt, das in ganz Amerika gesprochen wird.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Die Nueva Biblia de las Américas ist die lateinamerikanisch-spanische Ausgabe der Lockman Foundation, aufgebaut auf deren früherer La Biblia de las Américas von 1986 — selbst das Ergebnis von etwa fünfzehn Jahren Arbeit zweiundzwanzig Übersetzer und Berater, nach derselben wortgetreuen Übersetzungsphilosophie, die später ins Englische als New American Standard Bible übertragen wurde. Statt einer neuen Übersetzung aus Hebräisch und Griechisch ist die NBLA eine Registerüberarbeitung: Ein zwölfköpfiges Lockman-Komitee gestaltete das eher kastilisch geprägte Spanisch von La Biblia de las Américas in das vertraute, moderne Spanisch um, das in ganz Lateinamerika gesprochen wird, ersetzte Formen wie das zweite-Person-Plural "vosotros" durch das weiter verbreitete "ustedes" und lockerte Konstruktionen wie das formelhafte "y" und "sucedió que" auf, die der frühere Text wörtlich aus dem hebräischen Erzählstil übernommen hatte. Die eigene Zitiergenehmigungs-Mitteilung der Lockman Foundation datiert den fertigen Text auf 2005.
hero.2=Die Textgrundlage folgt direkt aus La Biblia de las Américas: Das Alte Testament beruht auf Rudolf Kittels Biblia Hebraica, unter Berücksichtigung der Schriftrollen vom Toten Meer, und das Neue Testament im Allgemeinen auf der 27. Auflage von Eberhard Nestles Novum Testamentum Graece, mit Beachtung weiterer Handschriftenbelege, wo diese eine bestimmte Lesart betreffen. Manche Buchhändler und Bibelsoftware-Kataloge gruppieren die Nueva Biblia de las Américas inzwischen zusammen mit der Überarbeitung der New American Standard Bible von 2020 der Stiftung und vermarkten beide als zusammengehöriges Paar für englische und spanische Leser derselben wortgetreuen Tradition; die Übersetzung selbst trägt jedoch in den eigenen Mitteilungen der Stiftung kein späteres Copyright-Datum als 2005.
hero.3=Die spanische Oberfläche öffnet hier standardmäßig mit der Reina Valera 1909, einem gemeinfreien Text aus einer völlig anderen Übersetzungstradition und ein Jahrhundert älter; die Nueva Biblia de las Américas wird stattdessen über ihre eigene Karte im Übersetzungsraster erreicht. Sie teilt mit jener Ausgabe wenig Textgeschichte, aber sehr viel mit der New American Standard Bible — dieselbe Stiftung, dieselbe formale Äquivalenzmethode und derselbe lizenzierte statt gemeinfreie Status, der es erlaubt, bis zu 500 Verse ohne schriftliche Genehmigung zu zitieren, sofern sie kein vollständiges Buch oder mehr als ein Viertel des zitierenden Werks ausmachen. In den Abstammungssprossen ist keine Vorlage verzeichnet: La Biblia de las Américas, der Text, den sie überarbeitet, wird selbst nicht in diesem Korpus gehalten, sodass eine Sprosse unter einem NBLA-Vers geradewegs zum Boden der Originalsprache hinunterführt, markiert mit ≈.

fact.1.label=Sprache
fact.1.value=Spanisch
fact.2.label=In Auftrag gegeben
fact.2.value=Die Lockman Foundation aus La Habra, Kalifornien — dieselbe gemeinnützige Organisation hinter der New American Standard Bible und ihrer eigenen Vorgängerin, La Biblia de las Américas (1986)
fact.3.label=Erstellt von
fact.3.value=Ein zwölfköpfiges Lockman-Überarbeitungskomitee, das auf der Übersetzung von La Biblia de las Américas aufbaute, selbst das Werk von zweiundzwanzig Übersetzern und Beratern über etwa fünfzehn Jahre
fact.4.label=Altes Testament nach
fact.4.value=Rudolf Kittels Biblia Hebraica, unter Berücksichtigung der Schriftrollen vom Toten Meer, übernommen aus der eigenen Textgrundlage von La Biblia de las Américas
fact.5.label=Neues Testament nach
fact.5.value=Eberhard Nestles Novum Testamentum Graece, im Allgemeinen der 27. Auflage, mit Beachtung weiterer Handschriftenbelege, wo diese eine Lesart betreffen
fact.6.label=Art der Übersetzung
fact.6.value=Formale Äquivalenz, dieselbe wortgetreue Methode wie La Biblia de las Américas und die New American Standard Bible — keine neue Übersetzung, sondern eine Registerüberarbeitung in das vertraute, moderne Spanisch, das in ganz Lateinamerika gesprochen wird, wobei kastilische Formen wie "vosotros" durch "ustedes" ersetzt und Konstruktionen wie das formelhafte "y" und "sucedió que", die der frühere Text wörtlich aus dem Hebräischen übernahm, überarbeitet wurden
fact.7.label=Veröffentlicht
fact.7.value=Urheberrechtlich 2005 von der Lockman Foundation registriert; manche Kataloge gruppieren sie seither zusammen mit der Überarbeitung der New American Standard Bible der Stiftung von 2020, doch 2005 bleibt das in ihrer eigenen Copyright-Mitteilung genannte Jahr
fact.8.label=Lizenz
fact.8.value=Lizenziert, nicht gemeinfrei. Bis zu 500 Verse dürfen in beliebiger Form ohne schriftliche Genehmigung zitiert werden, sofern sie kein vollständiges Buch der Bibel oder mehr als ein Viertel des zitierenden Werks bilden, mit einem Copyright-Hinweis, der 2005 nennt; alles darüber hinaus bedarf der Genehmigung der Lockman Foundation
fact.9.label=In diesem Korpus
fact.9.value=Lizenziert statt gemeinfrei, ebenso wie [[NASB|die New American Standard Bible]] derselben Stiftung. Die spanische Oberfläche öffnet standardmäßig mit [[RVR09|der Reina Valera 1909]], einem gemeinfreien Text aus einer unverwandten Tradition und ein Jahrhundert älter, während diese Ausgabe über ihre eigene Karte erreicht wird. In den Abstammungssprossen ist keine Vorlage verzeichnet: Sie ist eine Registerüberarbeitung von La Biblia de las Américas, die selbst nicht in diesem Korpus gehalten wird, sodass eine Sprosse unter einem NBLA-Vers geradewegs zum Boden der Originalsprache hinunterführt, markiert mit ≈.
