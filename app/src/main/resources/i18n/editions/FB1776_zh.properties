title=Biblia 1776 — 关于此版本 | Common Root
description=Biblia 1776：一个半世纪以来芬兰的教会圣经，第一部为家庭阅读而印行的芬兰语圣经，也仍是芬兰语说到「Biblia」时所指的那一部书。
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=感谢为本页寄来订正的各位。

# The narrative, one paragraph per key, in order.
hero.1=芬兰的第三部圣经，也是最终定型的那一部。它是修订本，而非重新翻译：这条线经由弗洛里努斯一六八三至八五年的修订，上溯到一六四二年的 Biblia，即第一部完整的芬兰语圣经。校订者是安德斯（安蒂）·利泽利乌斯，他早在一七五八年便已编成过一部圣经。一七七六年版所改动的是拼写，随之改动的是它能到达多远。它是第一部采用现代化正字法的芬兰语圣经，也是第一部为家庭使用而非仅为讲台印行的圣经。一家人能够拥有的圣经，与一个堂区所拥有的圣经，是两样不同的东西。 其间的两次刊行并不只是拼写之事。主持一六八五年版的派米奥堂长亨里克·弗洛里努斯通晓希伯来文与希腊文，所改正的内容与语言并重——措辞的变动大于正字法——而这两次中间的刊行一般被认为也依原文做了翻译，并非仅将一六四二年的文本整饬一番。因此以一六四二年与一七七六年相比者，所越过的是两次修订，而非一次拼写的更易。
hero.2=它在教会中沿用了一个半世纪，直到 Kirkkoraamattu 1933/38 取代它为止；而它不再是官方译本之后，人们并未停止阅读它。芬兰福音信义会内部的两个复兴运动——莱斯塔迪安派与 rukoilevaiset——保留了它，至今仍在使用。因此芬兰语中单说 Biblia 一词，指的正是这一部，而不是更早或更晚的版本；也因此这部书又称 Vanha kirkkoraamattu，即旧教会圣经。
hero.3=在本阅读器中，它处于芬兰语谱系链的中间。在 Kirkkoraamattu 1933/38 的一节经文下方展开一级，便出现此版本；在它下方再展开一级，则出现一六四二年的 Biblia。不过这两级应当分别看待。一九三三／三八年的译者是从希伯来文和希腊文着手的，所以上面那一级是同一教会圣经内部的承接，而非源出。下面那一级才是真正的源出：一七七六年是对一六四二年的修订，这一步两侧的字句正是供人比对的。
hero.4=关于本站所载文本，须有一项声明：它不是1776年的印本。此处的文字源自一份公有领域的数字文本，其拼写经后人规范化，编订经过亦无记载——全书31 102节中恰有一节含字母 w，而1642年的 Biblia 有26 862节；以 w 代 v 正是1776年印本所用正字法最明显的标记。也就是说，1776年把1642年的拼写现代化了，而此处的文本此后又被现代化了一次，因而离那本印刷的书比1776年离1642年更远。两位古芬兰书面语学者最先问的，正是这究竟是哪一个版本——这一问问得对。1776年的印本本身以书页影像保存于芬兰国家图书馆的瑞典时期馆藏；以忠实的文本取而代之，是我们乐意去做的工作。

