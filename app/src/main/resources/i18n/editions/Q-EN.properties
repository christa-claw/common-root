title=Qur'an — Pickthall — About This Edition | Common Root
description=Muhammad Marmaduke Pickthall's 1930 translation, the first English rendering of the Qur'an by a native English-speaking Muslim, produced in the service of the Nizam of Hyderabad with the counsel of Al-Azhar's scholars — and, in this corpus, the English shown beneath the Arabic text by default.
heroHeading=Qur'an — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) was an English novelist, admired in his day by H. G. Wells and D. H. Lawrence, before he became a translator of scripture. He declared his conversion to Islam in November 1917, after a talk titled "Islam and Progress" given to the Muslim Literary Society in Notting Hill, and took the shahada that same month at the Woking Muslim Mission. A decade later he was Principal of Chadarghat High School in Hyderabad, in the service of the Nizam, and it was from there, in 1928, that he took a two-year sabbatical to do what he had wanted to do since his conversion: put the Qur'an into English.
hero.2=He did not do it alone or in haste. In 1929 he spent three months in Cairo, where Rashid Rida's support opened doors, seeking the blessing of Al-Azhar's scholars on a project some of them had been warned could cost them their positions — part of Al-Azhar held translating the Qur'an at all to be a grave matter. Pickthall went ahead and kept consulting them anyway. What he published in 1930, as "The Meaning of the Glorious Koran: An Explanatory Translation," carries that caution in its own title: not "the Qur'an in English" but an explanation of its meaning, since no translation, in his own stated view, could be the Qur'an itself. Alfred A. Knopf brought out the first edition in New York; a bilingual printing from the Hyderabad government press followed.
hero.3=The Times Literary Supplement called it "a great literary achievement," and it is routinely described as the first English translation of the Qur'an by a Muslim whose native language was English — earlier English versions, by Sale and Rodwell among others, were the work of non-Muslim orientalists. Pickthall's has stayed in print and in use for close to a century since, one of a small number of English renderings that ordinary readers, not only scholars, actually read.
hero.4=In this corpus it is the translation shown beneath the Uthmani Arabic text by default — the Arabic stays the base of every column, with this English displayed as commentary alongside it, never replacing it. It was chosen for that role for an unglamorous reason as much as a literary one: a survey of the translations available found only two English renderings unambiguously in the public domain, this one and Yusuf Ali's of 1934, plus Sablukov's Russian of 1878 for a third language. The text here is a digitisation of the translation, drawn via alquran.cloud rather than from any one printing, so it should be read as the Pickthall wording rather than as a facsimile of a particular edition.

