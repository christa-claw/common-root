# The narrative, one paragraph per key, in order.
hero.1=Den första fullständiga bibeln på finska. Före den fanns Mikael Agricolas Nya testamente från 1548 och delar av det Gamla utgivna på 1550-talet; efter den fanns en hel bibel på ett språk som knappt hade skrivits ned. Fyra lärde utförde arbetet mellan 1638 och 1641 — Eskil Petraeus, Martinus Stodius, Henricus Hoffman och Gregorius Matthaei — under Isaacus Rothovius, biskop i Åbo, som drev projektet igenom. Finland hörde till Sverige, och volymen utkom 1642 under drottning Kristinas beskydd. Ett försök hade gjorts en generation tidigare: 1602 tillsattes en bibelöversättningskommitté, sannolikt under Åbobiskopen Ericus Erici Sorolainen. Den tycks ha åstadkommit utkast men aldrig fogat samman dem till en bibel, och vad som blev av dem är till stor del okänt — arbetet antas ändå ha satt spår i 1642 års översättning.
hero.2=De översatte från hebreiskan och grekiskan med Luthers tyska vid sin sida. Gustav Vasas svenska bibel var den andra boken på bordet; den finns inte i detta korpus, så kedjan här upptar Luther — och bredvid honom Agricolas finska från 1548, grundtexten som kommittén omarbetade. Biblia 1642:s större verkan gällde finskan själv. Ett språk med nästan ingen skriven prosa fick i en enda volym ett ordförråd och en satsrytm för allt från lag till klagan, och varje senare finsk bibel är en revision eller efterträdare till den och inte en ny början.
hero.3=I denna läsare står 1642 års Biblia mellan två finska stegpinnar. Tre steg under Kirkkoraamattu 1933/38, nedanför Biblia 1776, träder denna utgåva fram, och under den två föräldrar sida vid sida — Agricolas finska från 1548, grunden som kommittén omarbetade, och Luthers tyska från 1545, uppslagen på bordet. En stegpinne längre ned har kedjan lämnat finskan för gott. Texten kommer från Kotus VKS-korpus över äldre finskt skriftspråk, och därför är stavningen du ser — ”tulcon walkeus” — 1642-tryckets egen och inte moderniserad.

