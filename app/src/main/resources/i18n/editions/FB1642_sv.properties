title=Biblia 1642 — Om denna utgåva | Common Root
description=Biblia 1642: den första fullständiga bibeln på finska, översatt i tre år av fyra lärde i Åbo och tryckt under drottning Kristinas beskydd.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
