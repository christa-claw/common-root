fact.1.label=Språk
fact.1.value=engelska — samtida amerikansk
fact.2.label=Översättare
fact.2.value=Jonathan Gallagher, vars teologie doktorsgrad är från University of St Andrews
fact.3.label=Utgiven av
fact.3.value=Free Bible Ministry, en ideell verksamhet, som också ger ut den spanska [[VBL|Versión Biblia Libre]] som finns i detta korpus
fact.4.label=Översatt ur
fact.4.value=hebreiskan och det nestle–alandska grekiska Nya testamentet — den kritiska text som bibelsällskapen använder
fact.5.label=Metod
fact.5.value=översatt ur grundtexten med enbart lexikaliskt stöd, därefter jämförd mot befintliga utgåvor som kontroll — inte en sammanvägning av dem, och inte en revision av en äldre engelsk bibel
fact.6.label=Stil
fact.6.value=modern engelska utan slang och tillfälliga talspråksvändningar, och utan försök att återge något enskilt trossamfunds ståndpunkter
fact.7.label=Licens
fact.7.value=Creative Commons Erkännande-DelaLika 4.0 — kopiera, tryck och bearbeta fritt, förutsatt att utgåvan namnges, att ändringar markeras och att bearbetningar bär samma licens
fact.8.label=Årtal i katalogen
fact.8.value=lämnat tomt hellre än gissat — projektet reviderar texten och ger ut den på nytt allteftersom, så ingen enskild tryckning är utgåvan
fact.9.label=Under en stegpinne
fact.9.value=≈ TR, ett vittne till grekiskan snarare än denna översättnings grundtext; ingen kritisk grekisk utgåva finns ännu i korpuset, så samma ställföreträdare tjänar [[NIV|NIV]], [[NASB|NASB]] och [[BSB|BSB]]
fact.10.label=I detta korpus
fact.10.value=alla 66 böcker. Engelskan öppnar på den licensierade [[NIV|New International Version]], så denna står jämte [[BSB|Berean Standard Bible]] och [[WEB|World English Bible]] som engelska en läsare får bära ut med sig igen
