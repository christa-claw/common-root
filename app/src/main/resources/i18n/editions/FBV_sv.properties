title=Free Bible Version — Om denna utgåva | Common Root
description=Free Bible Version: en modern engelsk bibel översatt ur hebreiskan och den nestle–alandska grekiskan av Jonathan Gallagher, utgiven under en share-alike-licens så att vem som helst får trycka om den.
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=Den här översättningen finns till på grund av en copyrightsida. Nästan varje modern engelsk bibel bär en, och vad den brukar säga är att några hundra verser får citeras utan att man frågar, att en hel bok kräver skriftligt tillstånd och att ge ut texten i sin helhet betyder royalties. För en församlingswebbplats eller en inspelning kan det vara punkt slut. Free Bible Version gjordes för att bli den utgåva som ingenting står i vägen för.
hero.2=Den är Jonathan Gallaghers verk — han har en teologie doktorsgrad från St Andrews — och den ges ut av Free Bible Ministry, en ideell verksamhet. Nya testamentet kommer från den nestle–alandska grekiskan, den kritiska text som bibelsällskapen använder, och Gamla testamentet från hebreiskan. Den metod projektet beskriver är värd att nämnas, för den är inte den vanliga: översättningen görs ur grundtexten med enbart lexikon till hjälp, och först därefter jämförs den mot befintliga utgåvor, som en kontroll mot dubbleringar och fel snarare än som källa. Den är varken en revision av en äldre engelsk bibel eller en sammanvägning av nyare. Dess uttalade mål är samtida engelska utan slang och modeuttryck, och den avstår från att översätta i riktning mot något enskilt trossamfunds ståndpunkter.
hero.3=Licensen är hela poängen. Den är Creative Commons Erkännande-DelaLika 4.0: kopiera den, tryck den, lägg ut den på en webbplats, bearbeta den — så länge utgåvan namnges, ändringar markeras och det som byggs av den går ut på samma villkor. Det är ett annat avtal än public domain: friheten förs vidare i stället för att skänkas bort. Det är samma licens som den spanska Versión Biblia Libre i detta korpus bär, och den kommer från samma verksamhet.
hero.4=Två saker följer för läsaren. Katalogen lämnar dess årtal tomt, eftersom projektet ger ut revisioner allteftersom de görs; det finns ingen daterad tryckning som detta korpus är fäst vid, och att hitta på en vore sämre än det tomma fältet. Och en stegpinne som öppnas under en vers ur Free Bible Version visar ≈ TR, Textus Receptus, märkt som vittne och inte som förlaga. Det är inte det denna översättning gjordes ur. Det är vad korpuset för närvarande kan erbjuda som grekiska — någon kritisk utgåva finns ännu inte här — och samma ställföreträdare dyker upp under New International Version, New American Standard Bible och Berean Standard Bible av samma skäl.

