title=Emphatic Diaglott（行间对照） — 关于此版本 | Common Root
description=本杰明·威尔逊1864年的 Emphatic Diaglott：印在格里斯巴赫希腊文之下的逐字英文夹注，后为守望台社购得并重印六十年，也是约翰福音1:1之争通常所围绕的文本。
heroHeading=Emphatic Diaglott（行间对照）
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=本杰明·威尔逊并非职业学者。他是伊利诺伊州日内瓦城的报纸编辑，希腊文靠自学，1857年至1863年间分期刊出一部行间对照新约——不仅是他译的，也是他造的：他的侄儿看着他给每一版铅字取蜡模，夜里挂在酸液中长出一层铜皮，铜皮背后灌以铸金属，再在手动印刷机上印出来，男孩则在旁给版面上墨。成书于1864年问世。希腊文他取自约翰·雅各布·格里斯巴赫在1770年代确立的文本，异文则采自梵蒂冈抄本。
hero.2=威尔逊实际印出的是两种英文本，而非一种。页面左侧是希腊文，每个词下附逐字直译的英文夹注；右侧是他自己润饰过的译文，即 Emphatic Version。二者并不相同，在约翰福音1:1处更是公然相左——夹注作「and a god was the Word」，Emphatic Version 作「and the LOGOS was God」。两者都出自威尔逊，印在同一本书上，相距不过几厘米。本语料库收的是夹注，也就是人们引用的那一栏，这正是它另立一节而不列入圣经栏目的缘故。夹注记录的是一个希腊文句子如何构成——格位逐一、冠词逐一，依希腊文语序。它并非关于该句在英文中应当怎样读的判断，而威尔逊本人对此的判断就印在旁边那一栏。引用其一的人，应当知道另一者的存在。
hero.3=此书后来的际遇，才是多数人听说过它的原因。威尔逊于1900年去世，生前是 Church of the Blessed Hope 的成员，而非当时任何以耶和华见证人为名的团体。1902年，守望台圣经书社社长查尔斯·泰兹·罗素从威尔逊的继承人手中取得版权，其后又取得印版。此后六十年间该社持续印行 Diaglott——1927年在自家印机上重排，印出远超十五万册，售价两美元，最终免费赠送。所以 Diaglott 是耶和华见证人因承继而非因著述而有的书；而它在新约中、于作者引用希伯来经卷写下 κύριος 之处印作「耶和华」的做法，比使这一做法闻名的运动早了四十年。版权于1952年失效，此后即属公有领域。
hero.4=在本阅读器中使用它之前，有两点值得知道。格里斯巴赫未印使徒行传8:37，也未印路加福音17:36，故此处二者皆无；编号并不填补空缺、把其后每节上移一位，而是把这两处留空，使同一处引证在本栏与邻栏落在同一节上。此外并未为它记录任何前身，因此在 Diaglott 某节之下展开的谱系阶梯，通往的是原文语言底层，而非更早的英文版本。
hero.5=须准确了解那一层底所印为何。它所显示的希腊文是公认文本——标记读作 ≈ TR 1550，那个 ≈ 是阅读器在说：它提供的是希腊文的一个见证，而非此版据以译成的底本。威尔逊所据者为格里斯巴赫。二者相合之处，如约翰福音1:1，阶梯确实呈现所夹注的那些词。二者相异之处则否：格里斯巴赫弃去约翰一书5:7的三一句，故 Diaglott 中并无痕迹，而其下的公认文本一行则整句俱在。在一部以「希腊文就在页面上」为全部前提的行间对照本里，这是引用之前唯一值得知晓的缺口。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=这是什么
fact.1.value=行下夹注——印在希腊文之下的逐字英文，而非威尔逊可读的译文
fact.2.label=编订者
fact.2.value=本杰明·威尔逊（1817–1900），自学成才的学者，伊利诺伊州日内瓦城报纸编辑
fact.3.label=希腊文文本
fact.3.value=格里斯巴赫的校订本，异文采自梵蒂冈抄本（梵蒂冈写本1209）
fact.4.label=出版
fact.4.value=自1857年起分期刊行；1864年以单卷本出齐，由纽约 Fowler and Wells 出版
fact.5.label=如何印制
fact.5.value=威尔逊亲自以电铸法制作每一块印版，初版在手动印刷机上印成
fact.6.label=神名
fact.6.value=在新约中、于作者引用希伯来经卷写下 κύριος 之处印作「耶和华」——与 [[ASV|American Standard Version]] 在整部旧约所作的决定相同
fact.7.label=由谁取得
fact.7.value=守望台圣经书社；1902年在查尔斯·泰兹·罗素任内取得版权，1927年重排铅字，并一直印行至1960年代
fact.8.label=授权
fact.8.value=公有领域——版权于1952年失效，守望台的重印本亦未添附新的版权
fact.9.label=缺两节
fact.9.value=使徒行传8:37与路加福音17:36不见于格里斯巴赫，故此处亦无；其编号留空而不填并，使经文仍与其他各版逐节对齐
fact.10.label=阶梯之下的希腊文
fact.10.value=[[TR|公认文本]]，标示为 ≈ TR 1550——希腊文的一个见证，而非威尔逊的底本，其底本为格里斯巴赫的校订本；二者在约翰福音1:1相合，在约翰一书5:7分道
fact.11.label=在本语料库中
fact.11.value=另置于行间对照与研读版本一节，与供阅读的圣经分开，以免夹注被当作译文；谱系阶梯中未记录母本，故阶梯径直通往原文语言底层
