title=Коран — усмани — Об этом издании | Common Root
description=Коран в чтении хафс от асима — тексте, на который опирается большинство печатных Коранов в мире начиная с каирского издания 1924 года, — и в этом собрании текст, сверенный аят за аятом с собственным экземпляром Комплекса имени короля Фахда и оказавшийся совпадающим по согласному костяку во всех его 6 236 аятах.
heroHeading=Коран — усмани
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=У чтения, на котором держится этот текст, есть именованная цепочка передачи. Хафс ибн Сулейман аль-Куфи (ум. 796) передал его от своего учителя Асима ибн Аби ан-Наджуда, одного из куфийских чтецов, чьё чтение Ибн Муджахид позже канонизировал среди семи (Асим умер в 745 году). Хафс от Асима — «Хафс, по Асиму» — одно из нескольких чтений, которые мусульмане считают равно достоверными передачами одного и того же откровения; оно не единственное, но безусловно самое печатаемое. Когда комиссия улемов Аль-Азхара, работавшая с 1907 года под властью короля Фуада I, подготовила стандартный египетский Коран, напечатанный типографией Амирия в Булаке 10 июля 1924 года, именно это чтение они закрепили в наборе. Большинство Коранов, продающихся сегодня где угодно, включая собственное издание Комплекса имени короля Фахда, следуют примеру того издания.
hero.2=То, что находится в этом собрании, взято — через издание quran-uthmani сервиса alquran.cloud — из оцифровки того же текста хафс, выполненной проектом Tanzil. В читалке он сопоставляется с тремя переводами: английским Пиктхолла 1930 года, английским Юсуфа Али 1934 года и русским Саблукова 1878 года — откройте любой из трёх рядом с этим текстом, и его перевод появится под каждым аятом. Читалка также предлагает Коран в двух порядках: каноническом порядке мусхафа, установленном той же традицией, и порядке, который учёные восстанавливают для времени ниспослания каждой суры.
hero.3=Буквальная сохранность сама по себе одно из утверждений, которые делаются об этом тексте, поэтому здесь это проверяется, а не принимается на веру. При сравнении аят за аятом с собственным изданием хафс Комплекса по изданию Благородного Корана, оба текста совпадают по согласному костяку — обнажённым буквам, до добавления каких-либо гласных знаков — во всех его 6 236 аятах. Каждое найденное различие ограничивается тем, как обозначены гласные и паузальные знаки, написанием хамзы и восемью местами, где обе стороны по-разному проводят границу слова; ничто из этого не касается ни одной буквы самого текста. Это противоположность той неопределённости, которую это собрание должно признать для финской Библии 1776 года, где просто неизвестно, от какого издания происходит текст.
hero.4=Стоит прямо сказать о двух вещах, которых это совпадение не доказывает. Это не утверждение о происхождении — совпадение с текстом Комплекса показывает, что это один и тот же текст, а не то, что один был скопирован с другого. И это не разрешение: запрос, отправленный Комплексу в конце августа 2026 года с просьбой разрешить показ его собственных файлов риваятов, на момент написания этого текста не получил ответа. Единственный аят, где само сравнение на короткое время показало несогласие, 19:3, оказался следствием ошибки в том, как был прочитан файл сравнения, а не ошибкой в каком-либо из двух Коранов — после исправления он совпадает точно. Сам эталонный экземпляр — это восстановление файла текстового процессора Комплекса, а не его официальный цифровой релиз, и это единственное отношение, в котором это не вполне сравнение с официально опубликованным набором данных.

