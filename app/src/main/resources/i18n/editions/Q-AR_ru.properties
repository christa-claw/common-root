fact.1.label=Язык
fact.1.value=коранический арабский, в стандартной орфографии усмани
fact.2.label=Чтение (кыраат)
fact.2.value=хафс от асима — передано Хафсом ибн Сулейманом (ум. 796) от Асима ибн Аби ан-Наджуда из Куфы (ум. 745); одна из четырнадцати признанных передач, и та, которой следует большинство печатных Коранов в мире
fact.3.label=Стандартная печатная форма
fact.3.value=каирское издание 1924 года — комиссия улемов Аль-Азхара, работавшая с 1907 года под властью короля Фуада I, напечатано типографией Амирия в Булаке 10 июля 1924 года; образец, которому следует большинство последующих изданий, включая собственное издание Комплекса имени короля Фахда
fact.4.label=Используемый здесь текст
fact.4.value=издание quran-uthmani сервиса alquran.cloud, арабский текст которого восходит к оцифровке проекта Tanzil
fact.5.label=Сопоставлено с
fact.5.value=собственным изданием хафс Комплекса имени короля Фахда по изданию Благородного Корана, аят за аятом: совпадает по согласному костяку во всех его 6 236 аятах, при этом каждое различие ограничено обозначением гласных, написанием хамзы и восемью случаями разделения слов
fact.6.label=Чего это совпадение не доказывает
fact.6.value=происхождения — совпадение не есть происхождение — и не разрешения: запрос к Комплексу о показе его собственных файлов, отправленный в конце августа 2026 года, на момент написания этого текста не получил ответа
fact.7.label=Переводы-спутники в этом собрании
fact.7.value=[[Q-EN|английский Пиктхолла]] (1930), [[Q-YA|английский Юсуфа Али]] (1934) и [[Q-SAB|русский Саблукова]] (1878) — три перевода, сопоставляемые с этим исходным текстом под каждым аятом
fact.8.label=В этом собрании
fact.8.value=единственный арабский текст, с которым здесь сопоставляется каждый [[Q-EN|перевод]]; в отличие от [[FB1776|финской Библии 1776 года]], где просто неизвестно, от какого издания происходит текст
fact.9.label=Лицензия
fact.9.value=общественное достояние — коранический арабский текст считается не принадлежащим никому; собственные условия нашего источника требуют лишь, чтобы при воспроизведении сохранялась орфография усмани
