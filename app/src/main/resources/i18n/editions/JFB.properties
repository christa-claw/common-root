title=Japanese Freedom Bible — About This Edition | Common Root
description=The Japanese Freedom Bible (フリーダム・バイブル): a complete 66-book Japanese Bible that eBible.org distributes as a draft translation with no copyright set on it — the only Japanese Bible in this corpus, so the Japanese interface opens on it.
heroHeading=Japanese Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=The Japanese Freedom Bible — フリーダム・バイブル — is a complete Japanese Bible distributed by eBible.org, which names itself as the translation's official distributor. It is very recent: the source files this corpus holds are dated 19 August 2026, and the 2026 on its card is the date of those files. eBible gives no separate publication date, and none is asserted here.
hero.2=Much about it is not recorded, and that is worth saying plainly. eBible's pages name no translator, committee or publisher, and do not say what the translation was made from — directly from the Hebrew and Greek, or by way of another modern translation. Its own copyright page calls it a draft translation (翻訳の草案) and invites suggestions for improving it, so the text here is a snapshot of a work in progress rather than a fixed edition.
hero.3=What is clear is its legal standing: the same page states that no copyright is set on the translation, and labels it public domain. That is why it is the Japanese text here — it was the only complete Japanese Bible on eBible free of copyright. The older Japanese Bible that could have given it a lineage, the Meiji-era translation completed in 1887 and long in the public domain, is not available from that source.
hero.4=In this corpus it holds the 66 books of the Protestant canon, 31,098 verses, with no deuterocanonical books. No parent is recorded for it, so opening a rung beneath one of its verses goes straight to the original-language floor marked with ≈: the Hebrew and Greek shown there are witnesses, not a claim about what it was translated from — and with its source unknown, that is the honest reading. It is the only Japanese Bible in the corpus, so a Japanese interface opens on it by default.

