title=American Standard Version — 关于此版本 | Common Root
description=1901年的 American Standard Version：Revised Version 的美国版，出自一批以书信往还、用二十年校订钦定本的学者之手，也是 Revised Standard Version、New American Standard Bible 与 World English Bible 的源头。
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=American Standard Version 起初是别人的工程。1870年英格兰教会着手修订钦定本时，邀请美国学者参与，他们也确实参与了——以书信往还，横跨大西洋，前后将近二十年。两边意见相左之处，英国委员会的读法进入正文，美国方面的取舍则放入附录；美国人并且同意十四年内不出自己的版本。英国的 Revised Version 于1881年与1885年问世。美国版随后于1901年出版，附录中的读法被提升进正文，那正是其编者一向希望它们所在的位置。
hero.2=这是学者为学者所作的译本，读起来也正是如此。修订者在英语所能容忍的限度内紧贴希伯来文与希腊文的语序，这使 American Standard Version 精确，而在长篇处显得生硬。它最显眼的一项决定关乎神名：钦定本以小型大写字母印作 “the LORD” 之处，American Standard Version 印作 “Jehovah”，通篇旧约凡数千次。新约方面它依从修订者的希腊文而非公认文本，因此钦定本译者所据、而更古抄本所无的读法——约翰一书 5:7 的三位一体子句即在其中——或入脚注，或径付阙如。
hero.3=American Standard Version 从未成为教堂座席上的圣经。它所成为的，是一个源头。1952年的 Revised Standard Version 是对它的修订；本语料库中同样收录的 New American Standard Bible 亦然；以现代拼写将它带入公有领域的 World English Bible 也是如此。这正是它在阅读器谱系级次中所处位置的缘由——本语料库最长一链的中段。在 ASV 的某一节下展开一级，据以修订的 Revised Version 便出现在其下，再往下是钦定本与日内瓦圣经，直至以 ≈ 标示的原文底层。在 World English Bible 的某一节下展开一级，你便回到此处。

