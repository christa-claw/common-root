title=New American Standard Bible 2020 — Über diese Ausgabe | Common Root
description=Die New American Standard Bible: die eigene Fortsetzung der Lockman Foundation der wortgetreuen Wörtlichkeit der American Standard Version, neu übersetzt aus dem Hebräischen, Aramäischen und Griechischen und nun in ihrem Text von 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=Die New American Standard Bible begann als bewusste Fortsetzung, nicht als völlig neues Projekt. Die Lockman Foundation, eine gemeinnützige Organisation mit Sitz in La Habra, Kalifornien, begann die Arbeit 1959, um die American Standard Version von 1901 fortzuführen — und ihren Ruf wörtlicher, wortgetreuer Treue zum Hebräischen, Aramäischen und Griechischen zu bewahren, während ihr veraltetes Englisch modernisiert wurde. Die Stiftung versammelte einen Ausschuss von Gelehrten aus christlichen Hochschulen, Seminaren und überwiegend konservativen evangelikalen Konfessionen, und die Übersetzung erschien in Etappen: das Johannesevangelium 1960, die übrigen Evangelien 1962, das vollständige Neue Testament 1963, die Psalmen gesondert 1968, und die ganze Bibel 1971. Diese erste vollständige Ausgabe stützte sich beim Alten Testament auf die dritte Auflage von Rudolf Kittels Biblia Hebraica, unter Berücksichtigung der Schriftrollen vom Toten Meer, und beim Neuen Testament auf die 23. Auflage von Nestle und Alands Novum Testamentum Graece.
hero.2=Die Überarbeitung setzte sich noch Jahrzehnte nach diesem ersten Druck fort. Kleinere Änderungen am Wortlaut folgten 1972, 1973 und 1975, dann eine umfassendere Überarbeitung 1977 und eine weitere, begrenzte 1992. 1995 gab die Stiftung die Updated Edition heraus — NASB95, der Text, den die meisten meinen, wenn sie schlicht „die NASB“ sagen — unter Berücksichtigung der Biblia Hebraica Stuttgartensia und der 26. Auflage von Nestle-Aland. Der aktuelle Text ist die Überarbeitung von 2020, von der Teile bereits 2018 online erschienen waren: Sie verlegte die Textgrundlage des Alten Testaments auf die Biblia Hebraica Stuttgartensia und, für die Bücher, die sie abdeckt, die neuere Biblia Hebraica Quinta, unter Berücksichtigung der Septuaginta, der Schriftrollen vom Toten Meer, der Targumim und anderer antiker Fassungen, soweit sie für eine Lesart von Belang sind, während das Neue Testament nun der 28. Auflage von Nestle-Aland folgt, ergänzt durch den umfangreicheren Apparat griechischer Handschriftenbelege der Editio Critica Maior. Die erklärte Methode der Übersetzer blieb über jede Überarbeitung hinweg dieselbe: das Original so wörtlich wiedergeben, wie es lesbares Englisch erlaubt, und wo eine streng wörtliche Wiedergabe irreführen oder unnatürlich klingen würde, die klarere Redewendung wählen und die wörtlichere Formulierung stattdessen in einer Fußnote vermerken — eine Disziplin, die regelmäßig als Grund dafür angeführt wird, dass dies eine der wörtlichsten der weitverbreiteten englischen Übersetzungen des 20. und 21. Jahrhunderts ist.
hero.3=Trotz ihres Namens und ihrer erklärten Schuld gegenüber der American Standard Version ist die New American Standard Bible eine Neuübersetzung aus den Originalsprachen und keine zeilenweise Überarbeitung von ihr, und der Korpus verzeichnet entsprechend keine Vorlage für sie: Öffnet man eine Abstammungssprosse unter einem NASB-Vers, führt sie geradewegs zum Boden der Originalsprache hinunter, markiert mit ≈, genau wie bei der New International Version. Die beiden haben mehr gemeinsam als diese Form — beide sind lizenziert, nicht gemeinfrei, und stehen damit abseits der frei kopierbaren englischen Ausgaben im selben Regal, wenngleich eine englische Oberfläche standardmäßig mit der New International Version öffnet, während die New American Standard Bible über ihre eigene Karte im Übersetzungsraster erreicht wird.

fact.1.label=Sprache
fact.1.value=Englisch
fact.2.label=In Auftrag gegeben
fact.2.value=Von der Lockman Foundation in La Habra, Kalifornien, die das Projekt 1959 als Fortsetzung der Tradition wörtlicher Übersetzung der American Standard Version begann
fact.3.label=Erstellt von
fact.3.value=Einem von der Stiftung finanzierten Übersetzungsausschuss mit Gelehrten aus christlichen Hochschulen und Seminaren und überwiegend konservativen evangelikalen Konfessionen
fact.4.label=Altes Testament nach
fact.4.value=Rudolf Kittels Biblia Hebraica (3. Auflage) und den Schriftrollen vom Toten Meer für die Originalausgabe von 1971; der Biblia Hebraica Stuttgartensia ab der Überarbeitung von 1995; der Text von 2020 nennt die Biblia Hebraica Stuttgartensia und, soweit verfügbar, die neuere Biblia Hebraica Quinta, unter Berücksichtigung der Septuaginta, der Schriftrollen vom Toten Meer, der Targumim und anderer antiker Fassungen
fact.5.label=Neues Testament nach
fact.5.value=Nestle und Alands Novum Testamentum Graece, 23. Auflage, für die Originalausgabe von 1971; der 26. Auflage ab der Überarbeitung von 1995; der 28. Auflage (NA28) für den Text von 2020, ergänzt durch den Apparat griechischer Handschriftenbelege der Editio Critica Maior
fact.6.label=Art der Übersetzung
fact.6.value=Formale Äquivalenz — so wörtlich aus den Originalsprachen übersetzt, wie lesbares Englisch es erlaubt, mit der wörtlicheren Wiedergabe in einer Fußnote, wo stattdessen eine klarere Redewendung gewählt wurde; eine Neuübersetzung aus dem Hebräischen, Aramäischen und Griechischen, keine Überarbeitung einer älteren englischen Bibel, trotz ihrer Wurzeln in der Vorgehensweise der American Standard Version
fact.7.label=Veröffentlicht
fact.7.value=Das Johannesevangelium 1960, die Evangelien 1962, das Neue Testament 1963, die Psalmen 1968, die vollständige Bibel 1971, kleinere Textänderungen 1972, 1973 und 1975, eine umfassendere Überarbeitung 1977, eine begrenzte Überarbeitung 1992, die Updated Edition (NASB95) 1995, und der aktuelle Text von 2020, von dem Teile ab 2018 online erschienen
fact.8.label=Lizenz
fact.8.value=Lizenziert, nicht gemeinfrei. Bis zu 1.000 Verse dürfen in beliebiger Form ohne schriftliche Genehmigung zitiert werden, sofern sie weder ein vollständiges Buch der Bibel noch mehr als die Hälfte des zitierenden Werks ausmachen, zusammen mit einem Urheberrechtsvermerk, der 1960, 1971, 1977, 1995 und 2020 nennt; alles darüber hinaus braucht die Genehmigung der Lockman Foundation
fact.9.label=In diesem Korpus
fact.9.value=Lizenziert statt gemeinfrei, ebenso wie [[NIV|die New International Version]] — die englische Oberfläche öffnet standardmäßig mit dieser Ausgabe, und diese wird über ihre eigene Karte erreicht. In den Abstammungssprossen ist keine Vorlage verzeichnet: Obwohl die Stiftung das Projekt als Fortsetzung der Wörtlichkeit [[ASV|der American Standard Version]] beschreibt, ist sie neu aus dem Hebräischen, Aramäischen und Griechischen übersetzt und keine Überarbeitung von ihr oder einem anderen hier gehaltenen englischen Text, sodass eine Sprosse unter einem NASB-Vers geradewegs zum Boden der Originalsprache hinunterführt, markiert mit ≈
