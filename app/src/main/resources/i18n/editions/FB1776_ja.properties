title=Biblia 1776 — この版について | Common Root
description=Biblia 1776：一世紀半にわたるフィンランドの教会聖書であり、家庭での使用のために印刷された最初のフィンランド語聖書、そして今もフィンランド語で「Biblia」と言うときに意味される書物である。
