# The narrative, one paragraph per key, in order.
hero.1=フィンランドの三番目の聖書であり、定着した版である。これは新しい翻訳ではなく改訂であり——その系譜は1683–85年のフロリヌスによる改訂を経て、最初の完全なフィンランド語聖書である1642年のBibliaへとさかのぼる。改訂を手がけたのはアンデルス（アンッティ）・リーセリウスで、彼はすでに1758年に自身の聖書版を編んでいた。1776年版が変えたのは正書法であり、それとともに読者層も変わった。これは近代化された正書法で組まれた最初のフィンランド語聖書であり、説教台のためだけでなく家庭用に印刷された最初の聖書でもあった。家族が所有できる聖書は、教区が所有する聖書とは別の存在である。その間の諸版は単なる正書法の問題ではなかった。1685年版を手がけたパイミオの首席司祭ヘンリク・フロリヌスはヘブライ語とギリシャ語を解し、言葉遣いだけでなく内容そのものを訂正した——文言は正書法以上に変化した——ため、間に挟まる諸版は1642年版を整えるだけでなく、原語からの翻訳作業を行ったとみなされている。1642年と1776年を比べる読者は、正書法の変化ひとつではなく、二度の改訂を越えて見ていることになる。
hero.2=この版は一世紀半にわたって教会で使われ、Kirkkoraamattu 1933/38に取って代わられるまで続いた。公式の地位を失っても、読まれなくなったわけではない。フィンランド福音ルーテル教会内の二つの信仰復興運動——レスタディウス派と、「祈り求める者たち」を意味するrukoilevaiset——がこれを守り、今も使い続けている。それゆえフィンランド語で単に Biblia と言えば、より古いあるいは新しい版ではなくこの版を指すのであり、この書物が Vanha kirkkoraamattu（古い教会聖書）とも呼ばれる理由もそこにある。
hero.3=この読書環境において、この版はフィンランド語系譜の中間に位置する。Kirkkoraamattu 1933/38の一節の一段下を開けばこの版が現れ、この版の一段下を開けば1642年のBibliaが現れる。ただし、この二つの段は異なる読み方をすべきものである。1933/38年の翻訳者たちはヘブライ語とギリシャ語から訳したので、上の段は派生ではなく同じ教会の聖書内での継承にすぎない。下の段は本物の系譜である——1776年版は1642年版の改訂であり、その段をはさむ両側の言葉は比較されることを意図している。
hero.4=このサイトにあるテキストについて一つ注意しておきたい。それは1776年の印刷版そのものではない。ここにあるのは、後の手によって正書法が標準化され、編集の経緯が記録されていないパブリックドメインのデジタルテキストに由来する——その31,102節のうち、文字wを含むのは正確に1か所だけであり、1642年のBibliaには26,862か所ある。vの代わりのwは、1776年当時の正書法を示す最もわかりやすい印である。つまり1776年版は1642年版の正書法を近代化したものであり、このテキストはその後さらに一度近代化されているため、1776年が1642年から離れた距離よりも、印刷された書物からさらに遠ざかっている。古フィンランド文語の研究者二人が何よりも先にこれがどの版であるかを尋ねたが、それは正しい問いであった。1776年の印刷版そのものは、フィンランド国立図書館のスウェーデン統治時代コレクションにページ画像として残っている。その代わりとなる忠実なテキストを用意することは、私たちがしたいと思っている仕事である。

