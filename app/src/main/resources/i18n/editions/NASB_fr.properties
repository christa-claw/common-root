title=New American Standard Bible 2020 — À propos de cette édition | Common Root
description=La New American Standard Bible : la propre continuation par la Fondation Lockman de la littéralité mot à mot de l'American Standard Version, retraduite depuis l'hébreu, l'araméen et le grec, et aujourd'hui dans son texte de 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=La New American Standard Bible a commencé comme une continuation délibérée plutôt que comme un projet entièrement nouveau. La Fondation Lockman, une organisation à but non lucratif basée à La Habra, en Californie, a lancé le travail en 1959 pour prolonger l'American Standard Version de 1901 — en conservant sa réputation de fidélité littérale, mot à mot, à l'hébreu, à l'araméen et au grec, tout en modernisant son anglais désuet. La Fondation a réuni un comité de spécialistes issus de collèges et séminaires chrétiens et, pour l'essentiel, de dénominations évangéliques conservatrices, et la traduction est parue par étapes : l'Évangile de Jean en 1960, les autres Évangiles en 1962, le Nouveau Testament complet en 1963, les Psaumes séparément en 1968, et la Bible entière en 1971. Cette première édition complète s'appuyait, pour l'Ancien Testament, sur la troisième édition de la Biblia Hebraica de Rudolf Kittel, avec les manuscrits de la mer Morte consultés, et pour le Nouveau Testament, sur la 23e édition du Novum Testamentum Graece de Nestle et Aland.
hero.2=La révision s'est poursuivie pendant des décennies après cette première impression. Des changements mineurs de formulation ont suivi en 1972, 1973 et 1975, puis une révision plus substantielle en 1977 et une autre, plus limitée, en 1992. En 1995, la Fondation publia l'Updated Edition — la NASB95, le texte que la plupart des gens ont en tête lorsqu'ils disent simplement « la NASB » — en s'appuyant sur la Biblia Hebraica Stuttgartensia et la 26e édition de Nestle-Aland. Le texte actuel est la mise à jour de 2020, dont des parties avaient déjà commencé à paraître en ligne en 2018 : elle a déplacé la base textuelle de l'Ancien Testament vers la Biblia Hebraica Stuttgartensia et, pour les livres qu'elle couvre, vers la plus récente Biblia Hebraica Quinta, en consultant la Septante, les manuscrits de la mer Morte, les Targums et d'autres versions anciennes là où ils influent sur une leçon, tandis que le Nouveau Testament suit désormais la 28e édition de Nestle-Aland, complétée par l'appareil plus riche de témoins manuscrits grecs de l'Editio Critica Maior. La méthode déclarée des traducteurs est restée la même à travers chaque révision : rendre l'original aussi littéralement que le permet un anglais lisible, et là où une traduction strictement littérale risquerait d'induire en erreur ou de sonner de façon peu naturelle, choisir l'idiome le plus clair et noter en bas de page la formulation la plus littérale — une discipline régulièrement citée comme la raison pour laquelle cette traduction est l'une des plus littérales parmi les traductions anglaises largement diffusées des XXe et XXIe siècles.
hero.3=Malgré son nom et sa dette déclarée envers l'American Standard Version, la New American Standard Bible est une traduction nouvelle à partir des langues originales plutôt qu'une révision ligne par ligne de celle-ci, et le corpus n'y inscrit donc aucun parent : ouvrir un échelon de lignée sous un verset de la NASB mène directement au socle de la langue originale, marqué ≈, exactement comme pour la New International Version. Les deux ont plus en commun que cette forme — toutes deux sont sous licence plutôt que dans le domaine public, ce qui les distingue des éditions anglaises librement copiables sur la même étagère, même si une interface en anglais s'ouvre par défaut sur la New International Version, la New American Standard Bible étant atteinte depuis sa propre fiche dans la grille des traductions.

fact.1.label=Langue
fact.1.value=Anglais
fact.2.label=Commandée
fact.2.value=Par la Fondation Lockman, de La Habra, en Californie, qui a lancé le projet en 1959 comme une continuation de la tradition de traduction littérale de l'American Standard Version
fact.3.label=Réalisée par
fact.3.value=Un comité de traduction financé par la Fondation, réunissant des spécialistes issus de collèges et séminaires chrétiens et, pour l'essentiel, de dénominations évangéliques conservatrices
fact.4.label=Ancien Testament d'après
fact.4.value=La Biblia Hebraica de Rudolf Kittel (3e édition) et les manuscrits de la mer Morte pour l'édition originale de 1971 ; la Biblia Hebraica Stuttgartensia à partir de la révision de 1995 ; le texte de 2020 cite la Biblia Hebraica Stuttgartensia et, lorsqu'elle est disponible, la plus récente Biblia Hebraica Quinta, avec la Septante, les manuscrits de la mer Morte, les Targums et d'autres versions anciennes consultées
fact.5.label=Nouveau Testament d'après
fact.5.value=Le Novum Testamentum Graece de Nestle et Aland, 23e édition, pour l'édition originale de 1971 ; la 26e édition à partir de la révision de 1995 ; la 28e édition (NA28) pour le texte de 2020, complétée par l'appareil de témoins manuscrits grecs de l'Editio Critica Maior
fact.6.label=Genre de traduction
fact.6.value=Équivalence formelle — traduite aussi littéralement des langues originales que le permet un anglais lisible, avec la formulation la plus littérale en note de bas de page là où un idiome plus clair a été choisi à la place ; une traduction nouvelle depuis l'hébreu, l'araméen et le grec, non une révision d'une Bible anglaise antérieure, malgré ses racines dans la démarche de l'American Standard Version
fact.7.label=Publiée
fact.7.value=L'Évangile de Jean en 1960, les Évangiles en 1962, le Nouveau Testament en 1963, les Psaumes en 1968, la Bible complète en 1971, des changements textuels mineurs en 1972, 1973 et 1975, une révision majeure en 1977, une révision limitée en 1992, l'Updated Edition (NASB95) en 1995, et le texte actuel de 2020, dont des parties ont paru en ligne à partir de 2018
fact.8.label=Licence
fact.8.value=Sous licence, pas dans le domaine public. Jusqu'à 1 000 versets peuvent être cités sous quelque forme que ce soit sans autorisation écrite, à condition qu'ils ne constituent pas un livre entier de la Bible ni plus de la moitié de l'ouvrage citant, avec une mention de droits d'auteur nommant 1960, 1971, 1977, 1995 et 2020 ; tout usage allant au-delà nécessite l'autorisation de la Fondation Lockman
fact.9.label=Dans ce corpus
fact.9.value=Sous licence plutôt que dans le domaine public, comme [[NIV|la New International Version]] — l'interface anglaise s'ouvre par défaut sur cette édition, et celle-ci est atteinte depuis sa propre fiche. Aucun parent n'est inscrit dans les échelons de lignée : bien que la Fondation décrive le projet comme une continuation de la littéralité de [[ASV|l'American Standard Version]], elle est retraduite depuis l'hébreu, l'araméen et le grec et non révisée à partir de celle-ci ou de tout autre texte anglais détenu ici, si bien qu'un échelon sous un verset de la NASB mène directement au socle de la langue originale, marqué ≈
