title=Текстбибель 1906 — Об этом издании | Common Root
description=Textbibel Каутча и Вайцзеккера: учёная немецкая Библия, заново переведённая с еврейского и греческого и впервые изданная одним томом в Тюбингене в 1899 году; текст здесь датирован 1906 годом.
heroHeading=Текстбибель 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Два профессора, два Завета. Карл Вайцзеккер (1822–1899) был историком Церкви в Тюбингене, где в 1861 году занял кафедру после Фердинанда Кристиана Баура, а с 1889 года был канцлером университета. Его перевод Нового Завета впервые вышел в 1875 году и при его жизни выдержал девять изданий, последнее из которых он готовил уже на смертном одре. Эмиль Каутч (1841–1910) был исследователем Ветхого Завета; он преподавал в Лейпциге, Базеле и Тюбингене, прежде чем в 1888 году обосноваться в Галле. Его Ветхий Завет, переведённый вместе с группой коллег-специалистов, вышел целиком в 1894 году.
hero.2=В 1899 году, в год смерти Вайцзеккера, оба перевода соединили в одном томе — Textbibel des Alten und Neuen Testaments, изданном в Тюбингене у J.C.B. Mohr (Paul Siebeck). Название говорит само за себя: голый текст для читателей, которые хотели знать, что говорят еврейский и греческий, на немецком языке своего времени. Заменить Лютера она никогда не стремилась. Вайцзеккер сознательно избегал языка Лютера и старался передать впечатление, которое оригинал производил на первых читателей; его биограф считал маловероятным, что она когда-нибудь станет народной книгой, и она ею не стала. Её переиздавали вплоть до 1910-х годов. Цифровой текст здесь датирован 1906 годом; каким изданием был этот тираж, проект не установил.
hero.3=Она читается как наука своего времени. Имя Бога в Ветхом Завете — «Jahwe»: «Jahwe ist mein Hirte» в Псалме 23 — тысячи раз, там, где у Лютера «der Herr». В Исаии 7:14 стоит «ein junges Weib», молодая женщина. В Новом Завете молитва «Отче наш» в Матфея 6:13 заканчивается без доксологии, а в 1 Иоанна 5:7 нет небесных свидетелей. Ветхий Завет сохраняет еврейское деление на главы и стихи: надписания псалмов входят в нумерацию, поэтому в Псалме 51 — 21 стих, а в книге Малахии три главы, а не четыре. Орфография старше, чем подсказывает дата: в Иоанна 8:1 Иисус «gieng» на гору Елеонскую.
hero.4=В этой читалке она — одна из четырёх немецких Библий, рядом с Эльберфельдской и текстами Лютера 1545 и 1912 годов. Немецкий интерфейс открывается не на ней: для немецкого нет выбранного по умолчанию перевода, поэтому читалка берёт первую немецкую Библию в каталоге, а это Эльберфельдская. В ступенях родословия для неё не записан источник, что подходит переводу, сделанному с оригиналов: ступень, открытая под стихом, сразу падает на отмеченное ≈ дно языков оригинала — Вестминстерский Ленинградский кодекс для Ветхого Завета, а для Нового — Textus Receptus, греческий текст, которому этот перевод не следует, как показывает 1 Иоанна 5:7.

