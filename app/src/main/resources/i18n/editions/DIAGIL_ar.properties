title=Emphatic Diaglott (بين السطور) — عن هذه الطبعة | Common Root
description=Emphatic Diaglott لبنجامين ويلسون سنة 1864: الشرح الإنجليزي كلمةً بكلمة مطبوعاً تحت يونانية غريسباخ، ثم اشترته جمعية برج المراقبة وأعادت طبعه ستّين سنة — وهو النصّ الذي يدور حوله عادةً الجدل في يوحنا 1:1.
heroHeading=Emphatic Diaglott (بين السطور)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=لم يكن بنجامين ويلسون عالماً محترفاً. كان محرّر صحيفة في جنيفا بولاية إلينوي، علّم نفسه اليونانية، وأصدر بين 1857 و1863، قسماً بعد قسم، عهداً جديداً بين السطور لم يترجمه فحسب بل صنعه أيضاً: كان ابن أخيه يرقبه وهو يأخذ طبعات شمعية لكلّ صفحة مصفوفة، ويعلّقها ليلةً في الحمض حتى ينمو عليها غشاء من النحاس، ويسند النحاس بمعدن مصبوب، ثم يطبع الناتج على مكبس يدوي والصبيّ يحبّر اللوح. وظهر المجلّد التامّ سنة 1864. أمّا يونانيّته فأخذها من النصّ الذي أثبته يوهان ياكوب غريسباخ في عقد 1770، بقراءات مأخوذة من المخطوطة الفاتيكانية.
hero.2=والذي طبعه ويلسون في الحقيقة نصّان إنجليزيّان لا نصّ واحد. على يسار الصفحة تجري اليونانية وتحت كلّ كلمة شرح حرفيّ كلمةً بكلمة؛ وعلى يمينها ترجمته هو المصقولة، Emphatic Version. وليستا سواءً، بل تتعارضان صراحةً عند يوحنا 1:1 — فالشرح يقرأ «and a god was the Word»، وEmphatic Version «and the LOGOS was God». كلتاهما لويلسون، مطبوعتان في الكتاب نفسه على بضعة سنتيمترات. وهذه المجموعة تحمل الشرح، وهو العمود الذي يُقتبس، ولهذا يقع في قسم خاصّ به لا في شبكة الكتب المقدّسة. فالشرح يسجّل كيف رُكّبت الجملة اليونانية — حالةً بحالة، وأداة تعريف بأداة، على ترتيب الكلمات اليوناني. وليس حكماً في كيف ينبغي أن تُقرأ الجملة بالإنجليزية، وحكم ويلسون نفسه في ذلك مطبوع في العمود المجاور. وحريٌّ بمن يقتبس أحدهما أن يعلم بوجود الآخر.
hero.3=وحياة الكتاب اللاحقة هي سبب سماع أكثر الناس به. مات ويلسون سنة 1900 عضواً في Church of the Blessed Hope، لا في جماعة كانت قائمة يومئذ باسم شهود يهوه. وفي سنة 1902 حصل تشارلز تيز رصل، رئيس جمعية برج المراقبة للكتاب المقدّس والكرّاسات، على حقّ النشر من ورثة ويلسون، ثم على الألواح مع الوقت. وطبعت الجمعية الـDiaglott ستّين سنة تالية — أعادت صفّ الحروف على مكابسها سنة 1927، وسحبت منه ما يزيد كثيراً على مئة وخمسين ألف نسخة، وباعته بدولارين ثم صارت توزّعه مجّاناً. فالـDiaglott إذاً كتاب لشهود يهوه بالتبنّي لا بالتأليف، وعادته في طبع «يهوه» في العهد الجديد حيث كتب الكتّاب κύριος وهم يقتبسون الكتب العبرية سبقت بأربعة عقود الحركة التي أشهرت هذا الصنيع. وسقط حقّ النشر سنة 1952، وهو منذ ذلك الحين في الملك العام.
hero.4=وأمران عنه في هذا القارئ يحسن معرفتهما قبل استعماله. لم يطبع غريسباخ أعمال 8:37 ولا لوقا 17:36، فليس واحد منهما هنا؛ وبدل سدّ الثغرة ورفع كلّ آية تالية درجةً، يترك الترقيم الموضعين خاليين، فتقع الإحالة على الآية نفسها في هذا العمود كما في العمود المجاور. ولم يُسجَّل له سلف، فالدرجة النَسَبية المفتوحة تحت آية من الـDiaglott تفضي إلى أرضية اللغات الأصلية لا إلى طبعة إنجليزية أقدم.
hero.5=وكن دقيقاً في ما تطبعه تلك الأرضية. فاليونانية التي تعرضها هي النص المتلقّى — والبطاقة تقرأ ≈ TR 1550، وهذا الـ≈ هو قول القارئ إنه يقدّم شاهداً على اليونانية لا النصّ الذي صُنعت منه هذه الطبعة. وويلسون عمل على غريسباخ. فحيث يتّفق الاثنان، كما في يوحنا 1:1، تُظهر الدرجة عين الكلمات المشروحة حقّاً. وحيث يفترقان لا تفعل: فقد رفض غريسباخ العبارة التثليثية في 1 يوحنا 5:7، فلا أثر لها في الـDiaglott، بينما يحملها سطر النص المتلقّى تحتها كاملةً. وفي نصّ بين السطور مبناه كلّه أنّ اليونانية ماثلة هناك على الصفحة، هذه هي الثغرة الوحيدة الجديرة بالمعرفة قبل الاقتباس منه.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=ما هذا
fact.1.value=الشرح تحت السطر — الإنجليزية كلمةً بكلمة المطبوعة تحت اليونانية، لا ترجمة ويلسون السلسة
fact.2.label=أعدّه
fact.2.value=بنجامين ويلسون (1817–1900)، عالم عصاميّ ومحرّر صحيفة في جنيفا بولاية إلينوي
fact.3.label=النصّ اليوناني
fact.3.value=تنقيح غريسباخ، بقراءات من المخطوطة الفاتيكانية (مخطوط الفاتيكان 1209)
fact.4.label=صدر
fact.4.value=أقساماً من سنة 1857؛ وتامّاً في مجلّد واحد سنة 1864، عن Fowler and Wells في نيويورك
fact.5.label=كيف طُبع
fact.5.value=صنع ويلسون كلّ لوح بالتنضيد الكهربائي بنفسه، وسحب الطبعة الأولى على مكبس يدوي
fact.6.label=الاسم الإلهي
fact.6.value=يطبع «يهوه» في العهد الجديد حيث كتب الكتّاب κύριος وهم يقتبسون الكتاب العبري — القرار نفسه الذي اتّخذته [[ASV|American Standard Version]] عبر العهد القديم كلّه
fact.7.label=آلت إلى
fact.7.value=جمعية برج المراقبة للكتاب المقدّس والكرّاسات، التي نالت حقّ النشر سنة 1902 في عهد تشارلز تيز رصل، وأعادت صفّ الحروف سنة 1927، وظلّت تطبعه حتى عقد 1960
fact.8.label=الترخيص
fact.8.value=الملك العام — سقط حقّ النشر سنة 1952، ولم تُحدث طبعات برج المراقبة حقّاً جديداً
fact.9.label=آيتان غائبتان
fact.9.value=أعمال 8:37 ولوقا 17:36 ليستا عند غريسباخ فليستا هنا؛ ورقماهما متروكان خاليين لا مسدودين، فيظلّ النصّ محاذياً آيةً بآية لكلّ طبعة أخرى
fact.10.label=اليونانية تحت الدرجة
fact.10.value=[[TR|النص المتلقّى]]، معروضاً بوسم ≈ TR 1550 — شاهد على اليونانية لا نصّ ويلسون الأساس، فذاك كان تنقيح غريسباخ؛ يتّفقان في يوحنا 1:1 ويفترقان في 1 يوحنا 5:7
fact.11.label=في هذه المجموعة
fact.11.value=يُحفظ في قسمه الخاصّ للطبعات بين السطور وطبعات الدرس، بمعزل عن كتب القراءة، لئلّا يُحسب شرحٌ ترجمةً؛ ولم يُسجَّل له أصل في درجات النسب، فالدرجة تفتح رأساً على أرضية اللغات الأصلية
