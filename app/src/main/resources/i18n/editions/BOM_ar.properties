fact.2.value=جوزيف سميث الابن (1805–1844)، الذي قال إنه ترجمه "بهبة الله وقدرته" عن مجموعة من الألواح المعدنية القديمة؛ أملى النص على كُتّاب، أساسًا أوليفر كاودري، بينما دوّن مارتن هاريس وإيما سميث مراحل أقصر وأسبق
fact.3.label=نُشر
fact.3.value=1830، بالميرا، نيويورك؛ طبعه إيغبرت ب. غراندين، نحو 5,000 نسخة
fact.4.label=البنية
fact.4.value=15 كتابًا، من كتاب نافي الأول إلى كتاب موروني، سُمّي كل منها باسم كاتب السجل النفي أو اليارِدي الذي يُنسب إليه تجميعه؛ لم تحتوِ طبعة عام 1830 على أرقام آيات، وتعود تقسيمات الفصول والآيات الحالية إلى طبعة عام 1879 التي أعدّها أورسون برات
fact.5.label=المكانة
fact.5.value=أحد الأعمال القانونية الأربعة لحركة قديسي الأيام الأخيرة، إلى جانب الكتاب المقدس و[[DC|العقيدة والعهود]] و[[PGP|الدرة الكريمة]]
fact.6.label=في هذه المجموعة
fact.6.value=يتبع النص وتقسيمه إلى آيات الصياغة القياسية الحالية، مع التصحيحات الطباعية لطبعة عام 2013، المأخوذة من تصدير JSON الخاص بـ Mormon Documentation Project والمعلَن أنه في الملكية العامة؛ وتُستثنى حواشيه وملخصات فصوله ومقدمته المحمية بحقوق النشر — ولهذا لا تُذكر هنا سنة طبع واحدة
fact.7.label=الرخصة
fact.7.value=في الملكية العامة، حسب تصريح القائم على البيانات؛ لا تشمل المواد الدراسية الحديثة المحمية بحقوق النشر
