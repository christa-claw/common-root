title=كتاب مورمون — عن هذه الطبعة | Common Root
description=كتاب مورمون: سجلٌ لأنبياء أمريكا القدامى أملاه جوزيف سميث عام 1830، طُبع في بالميرا بولاية نيويورك، ويقرأه قديسو الأيام الأخيرة بوصفه نصًا مكملًا للكتاب المقدس.
heroHeading=كتاب مورمون
readerHref=/reader?c1.src=bom

hero.1=قال جوزيف سميث إنه ترجم هذا الكتاب "بهبة الله وقدرته" عن مجموعة من الألواح المعدنية القديمة، التي ذكر أنه عثر عليها عام 1827 قرب مزرعة عائلته على مشارف بالميرا بولاية نيويورك، وأنه أعادها لاحقًا إلى الرسول الذي أطلعه عليها. يصف شهود عملية الإملاء أنه كان يتفحص حجر رؤية — وفي مراحل لاحقة من العمل، حجرًا كان يضعه داخل قبعة ليحجب الضوء، لا الزوج من الحجرين المثبتين في صدرية ويُعرفان تقليديًا باسم أوريم وتُمّيم واللذين يُقال إنهما وصلا مع الألواح وحسب — وكان يتلو النص بصوت مرتفع بينما يدونه كاتب. وقد دوّن أوليفر كاودري الجزء الأكبر من النص على هذا النحو خلال نحو شهرين في عام 1829، في مزرعة أسرة ويتمر بمدينة فييت بنيويورك أساسًا؛ وكان مارتن هاريس وزوجة جوزيف إيما سميث قد عملا كاتبين في مراحل أقصر وأسبق.
hero.2=ذهبت المخطوطة إلى المطبعة في نفس تلك السنة. سجّل سميث حق النشر للعمل في يونيو 1829، وبدأ الطبع في مطبعة إيغبرت ب. غراندين في بالميرا، حيث أضاف عامل الصف جون هـ. غيلبرت علامات الترقيم وتقسيم الفقرات التي لم تكن موجودة في المخطوطة المُملاة. وظهر الكتاب كاملًا في مارس 1830: نحو 5,000 نسخة، وهي كل ما طبعه غراندين.
hero.3=ينقسم الكتاب إلى خمسة عشر كتابًا، من كتاب نافي الأول إلى كتاب موروني، وقد سُمّي كل منها باسم كاتب السجل النبوي الذي يُنسب إليه تجميعه. لم تكن في أي نسخة من نسخ عام 1830 إشارة إلى رقم آية واحدة — فقد جرى النص في فقرات متصلة ضمن فصول أطول بكثير من تلك التي يراها القارئ اليوم. وتعود تقسيمات الفصول والآيات المستخدمة اليوم إلى طبعة عام 1879 التي أعدّها أورسون برات، الذي اختصر الفصول أيضًا وأضاف أولى الحواشي. وأعادت طبعات لاحقة تشكيل عرض النص أكثر: فقد نسقت لجنة برئاسة جورج ف. ريتشاردز النص في عمودين عام 1920 وأضافت ملخصات للفصول ودليلًا للنطق؛ وحدّثت طبعة عام 1981 الإحالات المرجعية وعناوين الفصول وغيرها من المواد المرجعية؛ وصحّحت طبعة عام 2013 تناقضات في الطباعة تراكمت في ألواح الطبع منذ عام 1981.
hero.4=يُعدّ هذا الكتاب أحد أربعة مؤلفات تسمّيها حركة قديسي الأيام الأخيرة "الأعمال القانونية" الخاصة بها، إلى جانب الكتاب المقدس و[[DC|العقيدة والعهود]] و[[PGP|الدرة الكريمة]]. والنص في هذه المجموعة مأخوذ من تصدير JSON الخاص بـ Mormon Documentation Project، الذي أعلن القائم عليه أنه في الملكية العامة؛ وهو يتبع صياغة الطبعة القياسية الحالية وتقسيمها إلى آيات، مع التصحيحات الطباعية لطبعة عام 2013، ويستثني الحواشي وملخصات الفصول والمقدمة التي تظل محمية بحقوق النشر. وبما أن المحفوظ هنا هو هذا النص القياسي الحالي بالذات لا طبعة تاريخية معينة، فلا تُذكر له سنة نشر واحدة.

