# The narrative, one paragraph per key, in order.
hero.1=ג'ובאני דיודאטי נולד בז'נבה ב־1576 למשפחת סוחרים מלוקה שעזבה את איטליה ולא ויתרה על דתה. איטלקי היה במוצאו וז'נבתי בחינוכו, וצירוף זה הוא כל הטעם לקיומו של הספר הזה: בידו הייתה לשון הארץ שהרפורמציה לא הגיעה אליה, ועמד הוא בעיר שנעשתה בית הדפוס שלה. תיאודור בזא הציע אותו לכיסא הלשון העברית בהיותו בן עשרים ואחת. ב־1606 נעשה פרופסור לתיאולוגיה, ב־1608 כומר, ובשנה שלאחר מכן ירש את בזא בכיסא התיאולוגיה; וב־1618 יצא לוועידת דורדרכט כציר ז'נבה והיה אחד מששה אנשים שנתמנו לערוך את פרוטוקוליה.
hero.2=הביבליה האיטלקית שלו נדפסה בז'נבה ב־1607. לאיטליה היו ביבליות בלשון העם גם קודם לכן — של מאלרמי ב־1471, של ברוצ'ולי ב־1532 — אלא שהן עבדו מן הלטינית או נשענו עליה בכבדות. דיודאטי הלך אל העברית ואל היוונית, ולעניין הברית החדשה פירוש הדבר הנוסח היווני שבזא ההדיר באותה עיר עצמה דור קודם לכן. ב־1641 הוציא מהדורה מוגהת ובה הערותיו המבארות, ומן המהדורה ההיא משתלשלים ההדפסים החוזרים. היא נעשתה — ונשארה — הביבליה הפרוטסטנטית האיטלקית, ובארץ שכמעט אין בה קהל קוראים פרוטסטנטי פירושו של דבר שנשאו אותה ארבע מאות שנה אנשים מעטים מאוד. הוא תרגם את הביבליה גם לצרפתית, ב־1644; אותה נוהגים לראות כחלשה מבין השתיים, ומן הסתם לא היה חולק.
hero.3=על השנה שבכרטיס ראוי לומר משפט, שכן אין שנה. הנוסח הזה מסתובב בצורה דיגיטלית תחת התווית ”דיודאטי 1649“, ו־1649 אינה מהדורה — היא שנת מותו של דיודאטי. שתי השנים שיש בהן ממש הן 1607, שבה הופיע התרגום לראשונה, ו־1641, שבה הגיהו. איזו מהן מייצג קובץ דיגיטלי מסוים לאמיתו של דבר — זאת לא קבע המיזם הזה, ולפיכך מותיר הקטלוג את טור השנה ריק ואינו מדפיס מספר שאין הוא יכול לעמוד מאחוריו. השם נשמר כפי שהגיע, משום שזה מה שיחפשו.
hero.4=בקורא הזה היא הביבליה האיטלקית היחידה, ולכן העמדת הממשק על איטלקית פותחת עליה — לא כבחירה מוקפדת, כדרך ש־Reina-Valera 1909 נבחרה לספרדית, אלא משום שסריקת הקטלוג אינה מוצאת בשפה דבר אחר. בשלבי השושלת לא רשום לה שום מקור, ולכן שלב הנפתח מתחת לפסוק יורד היישר אל רצפת שפות המקור המסומנת ב־≈. רצפה זו מספקת ליוונית את הנוסח המקובל, וכאן הדבר קרוב לאמת קרבה בלתי רגילה: ברוב המהדורות שבאוסף זה עומד הנוסח המקובל במקומו של נוסח ביקורתי שהמתרגמים אכן השתמשו בו, ואילו דיודאטי אמנם עבד מנוסח יווני מודפס מאותה משפחה. תווית השלב שלה אינה נושאת שנה, וזה תואם את החלל שבכרטיס.

