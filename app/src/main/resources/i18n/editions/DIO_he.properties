title=דיודאטי 1649 (איטלקית) — על מהדורה זו | Common Root
description=הביבליה האיטלקית של ג'ובאני דיודאטי: יצאה בז'נבה ב־1607, הראשונה שנעשתה מן העברית ומן היוונית ולא מן הוולגטה, והוגהה עם הערותיו שלו ב־1641 — ומדוע השנה שעל הקובץ היא שנת מותו.
