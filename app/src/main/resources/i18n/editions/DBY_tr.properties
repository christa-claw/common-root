title=Darby 1885 (Fransızca) — Bu Baskı Hakkında | Common Root
description=1885 tarihli Fransızca Darby Kutsal Kitabı: John Nelson Darby ile arkadaşlarının 1859'da başlayıp onun ölümünden üç yıl sonra tamamlanan Pau–Vevey çevirisi — ve İngilizce Eski Antlaşması'nın sonradan üzerine kurulduğu metin.
heroHeading=Darby 1885 (Fransızca)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=John Nelson Darby başka şeylerle anılır — İrlanda Kilisesi'nden ayrıldı, Plymouth Kardeşleri'nin kuruluşuna katkıda bulundu ve dispensasyonalist premilenyalizmi dolaşıma soktu — ama ömrünün büyük bölümünü Kutsal Kitap'ı çevirmekle geçirdi ve bunu üç dilde yaptı. Onda alışılmadık olan, sıradır. Çevirmenlerin çoğu kendi dilinden dışarıya doğru çalışır. Darby'nin İngilizce Kutsal Kitabı üçünün en son tamamlananı oldu ve Eski Antlaşması'nı doğrudan İbraniceden kendisi yapmadı; başkalarıyla birlikte daha önce ortaya koyduğu Fransızca ve Almanca sürümlerden yaptı.
hero.2=İşte Fransızcası. Darby başlıca âlimdi ama adını taşıyan hiçbir işin tek çevirmeni olmadı; Fransızca ekipte William Joseph Lowe ve Pierre Schlumberger vardı. Yeni Antlaşma 1859'da çıktı ve sonraki yirmi yılda üç kez yeniden basıldı. Kutsal Kitap'ın tamamı 1885'te Pau ve Vevey'de yayımlandı — genellikle bilindiği ad buradan gelir — gerçi kapak sayfası biraz yanıltır: Pau, Fransa'nın en güneyindedir ve iş asıl olarak Fransızca konuşan İsviçre'nin kardeşler topluluklarına yönelikti. Darby 1882'de ölmüştü; bitmiş kitabı hiç görmedi.
hero.3=Çeviri ilke gereği harfidir ve Darby bunun nedenini Almanca Yeni Antlaşması'nın önsözünde açıkça söyledi: bilgin özgün metne bakabilir, öyleyse bir çevirinin amacı, bakamayanların eline onun olabildiğince kesin bir temsilini vermektir. Daha serbest bir aktarımın, çevirmenin kendisinin bile fark etmemiş olabileceği anlamları yitirdiği konusunda da uyardı. Sonuç kesin ve süssüzdür; hiçbir zaman yüksek sesle okunmak için düşünülmemişti — Darby kendi vaazında King James Version'ı kullanırdı.
hero.4=İki şey onu bu derlemenin geri kalanına bağlar. Almanca Darby Kutsal Kitabı Elberfelder'dir ve burada Elberfelder 1905 olarak bulunur — aynı adam, aynı ilkeler ve İngilizce Eski Antlaşması'nın kendisinden derlendiği iki metinden biri; öyle ki Fransızca ve Almanca bu iki kart, farklı dillerinin sezdirdiğinden daha yakın akrabadır. Tanrı'nın adına yaptığı muamele ise onu American Standard Version'ın yanına koyar: o, King James Version'ın “the LORD” bastığı yerlerde binlerce kez “Jehovah” basar; aynı kararı önce Darby vermişti, üstelik üç dilde. Okuyucuda tek Fransızca Kutsal Kitap odur, bu yüzden Fransızca arayüz onun üzerine açılır. Soy basamaklarında ona kayıtlı bir kaynak yoktur ve buradaki tarihli baskıların çoğundan farklı olarak basamak etiketi hiç yıl taşımaz — katalog kartı 1885'i gösterir, ama basamak yılları elle tutulan ayrı bir listedir ve bu baskı henüz o listede değildir.

