title=Septante anglaise de Brenton mise à jour — À propos de cette édition | Common Root
description=La Septante anglaise de Sir Lancelot Brenton, de 1844 et 1851, dont l'orthographe et les noms ont été mis à jour par Adam Boyd en 2020 — la même traduction que le Brenton original placé à côté d'elle dans ce corpus, avec thou et thee laissés là où Brenton les avait mis.
heroHeading=Septante anglaise de Brenton mise à jour
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Voici la traduction anglaise de la Septante, l'Ancien Testament grec, par Sir Lancelot Brenton, avec son anglais mis à jour. Brenton traduisit principalement d'après le Codex Vaticanus ; Samuel Bagster and Sons, à Londres, publia sa version en 1844 et la réédita avec les apocryphes en 1851. En 2020, Adam Boyd la révisa pour eBible.org et versa ses modifications dans le domaine public. Il ne la retraduisit pas. Son introduction énumère ce qu'il a changé : l'orthographe, ramenée à l'anglais américain moderne, si bien que « shew » devient « show » ; les noms de personnes et de lieux, donnés sous les formes que connaît le lecteur anglais ; « begat » et « spake », changés en « begot » et « spoke » ; traits d'union et ponctuations doublées, mis en ordre ; et la poésie, disposée en poésie. Ce qu'il a gardé est tout aussi délibéré : « thou », « thee » et « ye » avec les formes verbales qui les accompagnent, la grammaire de Brenton et sa lourde ponctuation du XIXe siècle.
hero.2=La différence se voit le mieux à côté du Brenton original, qui est lui aussi dans ce corpus. Brenton écrivait les noms hébreux comme le grec les écrit ; la mise à jour donne le plus souvent la forme anglaise. Là où le Néhémie de Brenton s'ouvre sur « the words of Neemias the son of Chelcia », celle-ci porte « Nehemiah the son of Hacaliah » ; Elias the Thesbite devient Elijah the Tishbite, et Emmanuel en Ésaïe 7,14 devient Immanuel. Sous l'orthographe, la traduction reste celle de Brenton, et elle lit donc toujours là où lit le grec. « A virgin shall conceive » en Ésaïe 7,14 rend le grec parthenos ; les Psaumes gardent la numérotation grecque, si bien que le Psaume 22 est ici le psaume du berger ; et la terre de Genèse 1,2 est toujours « unsightly and unfurnished ». Les vieux pronoms restent eux aussi : « thou shalt call his name Immanuel ».
hero.3=Dans ce lecteur, elle se tient en dehors des échelons de filiation. Le corpus ne lui enregistre aucun parent — ni le grec que Brenton traduisit, ni le Brenton qu'elle révise —, si bien qu'un échelon ouvert sous l'un de ses versets tombe directement sur le sol des langues originales marqué ≈, qui pour l'Ancien Testament est le Codex de Léningrad : un texte hébreu, et non le grec dont cette traduction a été faite. Pour descendre de l'anglais de Brenton jusqu'à son grec, ouvrez le Brenton original, dont le parent enregistré est la Septante. Rien ne repose à son tour sur cette édition, et aucune langue d'interface ne s'ouvre sur elle ; une interface en anglais s'ouvre sur la New International Version. Notre copie est plus étroite que le livre. Elle compte 36 livres. Esdras et Néhémie y forment un seul livre de 23 chapitres, comme dans le grec, Néhémie commençant au chapitre 11. Les fichiers d'eBible.org dont elle provient contiennent aussi les apocryphes et ne donnent Esther et Daniel que sous leurs formes grecques plus longues ; rien de tout cela n'a été repris, si bien qu'il n'y a ici ni Esther ni Daniel, ni non plus Tobit ou la Sagesse.

