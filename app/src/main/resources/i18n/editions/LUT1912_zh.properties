fact.12.value=德语梯子的顶端：一个被记录的先辈 [[LUT1545|Luther Bibel 1545]]，其下即原文语言的地面。修订者的 85 条注释在此作为评注保留而未弃置，且与版本绑定——1912 年的一条注解只显于 1912 年的栏下，别处不见。德语界面开启时所落之处并非此本，而是 [[ELB|艾伯菲尔德译本]]，它在目录中因缩写排在首位，别无他故
