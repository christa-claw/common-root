title=Luther Bibel 1912 — 关于此版本 | Common Root
description=路德圣经的第二次教会官方修订：一次有意从宽的通盘校订，1910 年完成，1912 年通过，也是最后一部立于 Textus Receptus 之上的路德文本。
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=一次修订的修订。德国各教会于 1892 年以第一次教会官方修订议定了路德圣经的统一文本，不过数年，便有人说它不敷使用。抱怨仍是旧的那些：古语太多，正字法也已不再是任何人的正字法。真正起决定作用的是后一条。杜登为德意志帝国定下了具约束力、学校据以施教的正字法，一部与之相左的路德圣经，摆到课堂上便颇为难。1906 年，德国福音教会会议同意再作修订，并明令其务须轻手而存旧。一个神学家委员会至 1910 年通读了每一卷书，1912 年会议通过了成果。
hero.2=工作前后不过两年有余，这已说明是何种修订。无论在语文学上还是别的方面，都无人有意另造一部路德圣经。后来的修订者弗里茨·奇尔希斥之为塾师式的修订，就方法而言，此语并无不实——正字法予以划一，明显死去的词加以更换，措辞其余则仍留在路德所置之处。此语看不见的，是它有多耐久。在随后数十年的局部修订中，1912 年的文本岿然未动，至今仍有人读、仍有人卖。其中一端是 1912 年的 Jubiläumsbibel，即符腾堡圣经会附有解说注释的百年纪念版，直至本世纪仍以哥特体重印。另一端是版权已然失效：复制此文本分文不费，因而随处可见——包括此处。
hero.3=有一事尤使它在保守读者中沿用不衰：它是最后一部建立在 Textus Receptus 之上的路德修订本，即 16、17 世纪的希腊文新约。此后诸本皆转向校勘本。这使此版本成为梯中格外干净的一级踏板，因为它底下的希腊文，正是路德本人 1545 年版底下的希腊文，也是日内瓦圣经与钦定本底下的希腊文——整座塔共用一层地面，而非中途换底。
hero.4=在谱系的梯级中，此版本紧居 Luther Bibel 1545 之上，且只有一个被记录的先辈，正是它。在 1912 年的某一节经文下开启一级，路德 1545 年本人的措辞便显于其下；再开一级，梯子便触及希腊文的 Textus Receptus 与希伯来文的威斯敏斯特列宁格拉德抄本。367 年的修订，逐节可见，两次点击而已。此版本不是什么：它不是德语界面开启时所落之处——德语并无选定的默认版本，读者拿到的是目录中第一部德语圣经，而那是艾伯菲尔德译本。

