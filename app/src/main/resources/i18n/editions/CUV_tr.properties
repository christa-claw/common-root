title=Chinese Union Version — Bu Baskı Hakkında | Common Root
description=1919 tarihli Chinese Union Version: Çinli Protestanların hâlâ okuduğu Kutsal Kitabı ortaya çıkaran yirmi dokuz yıllık komisyon çalışması ve yazılı halk Mandarincesiyle basılmış ilk kitaplardan biri.
heroHeading=Çince Birlik Çevirisi
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=1890'da Çin'de çalışan Protestan misyonları Şanghay'da toplanıp bir sorunu itiraf ettiler. Ortada zaten birkaç Çince Kutsal Kitap vardı ve hiçbiri bir diğeriyle uyuşmuyordu — ne sözcük seçiminde, ne adların yazımında, hatta ne de Çincenin hangi katmanında yazılacağında. Konferans, her misyonun kullanacağı tek bir çeviriye karar verdi ve buna birlik çevirisi adını verdi: 和合本, uzlaştırılmış metin. Yazılı Çince o sıralar okumuşların edebî dili ile herkesin konuştuğu dil arasında bölünmüş olduğundan, aynı anda üç çeviri ısmarladılar — ikisi edebî Çince, biri Mandarince.
hero.2=Mandarince komisyonunun işi yirmi dokuz yıl sürdü. Başkanlığını, 1863'ten beri Şantung'da bulunan Amerikalı Presbiteryen Calvin Wilson Mateer yaptı; 1908'de iş yarım kalmışken öldü, onun yarım düzine misyondan derlediği kurul ise sürdürdü, yanlarında çalışan ve adlarını misyon kayıtlarının çok daha özensiz sakladığı Çinli bilginler de öyle. Çevirdikleri metin olarak İngilizce Revised Version'ı aldılar ve onu ardındaki İbranice ile Yunancaya karşı denetlediler — bu da derlemenin kendi Revised Version'ını bu Kutsal Kitabın bir basamak yukarısına, King James Version'ı ise onun bir basamak üstüne yerleştirir. İki edebî çeviri sonunda tek bir metinde birleştirildi. Ayakta kalan, Mandarince olanıdır.
hero.3=1919'da yayımlandı ve bu tarih, onun için hiçbir komisyonun yapamayacağı kadarını yaptı. O yıl, Çinli yazarların edebî dili gerçekten bırakıp halk diline geçtikleri Dört Mayıs Hareketi'nin yılıydı ve birlik çevirisi, daha baştan o dille yazılmış ilk hacimli kitaplardan biri olarak çıkageldi. Misyonerler arasındaki bir tartışmayı bitirmek için düşünülmüş bir çeviri, modern Çin düzyazısının bir dönüm noktasına dönüştü; deyişlerini, ömründe Kutsal Kitap açmamış insanlar aktarıyor. O günden beri tek bir sözcükte ayrılan iki baskı hâlinde basılır — Tanrı 神 mi, 上帝 mi — ve aralıklar öyle ayarlanmıştır ki iki baskı hâlâ sayfaları aynı yerden böler.
hero.4=Bu okuyucuda tek Çince Kutsal Kitap odur ve bu, davranışıyla ilgili iki şeyi belirler. Arayüzü Çinceye alın, açılan budur: seçilmiş olduğu için değil — İspanyolca için Reina-Valera 1909 seçilmiştir — katalog bu dilde başka bir Kutsal Kitap bulamadığı için. Soy basamaklarında ise ona kayıtlı bir kaynak yoktur, dolayısıyla bir ayetin altındaki basamak doğruca ≈ ile işaretli özgün dil tabanına iner; oysa kendisinin yapıldığı Revised Version derlemede bir sütun ötededir. Buna karşılık basamak etiketi bir yıl taşır, 1919 — buradaki her baskının yapmadığı bir şey.

