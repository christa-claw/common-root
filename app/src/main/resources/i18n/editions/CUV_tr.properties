fact.2.label=Kendi dilindeki adı
fact.2.value=和合本 (héhéběn) — “uzlaştırılmış” ya da “birleştirilmiş” çeviri
fact.3.label=Ismarlayan
fact.3.value=1890 Şanghay Protestan Misyonerleri Genel Konferansı
fact.4.label=Çevirenler
fact.4.value=birkaç Protestan misyondan derlenmiş bir komisyon; Amerikalı Presbiteryen Calvin Wilson Mateer (1836–1908) Mandarince kurulunu ölümüne dek yönetti ve baştan sona Çinli meslektaşlarıyla çalıştı
fact.5.label=Yayımlanışı
fact.5.value=1919, yirmi dokuz yıllık çalışmanın ardından
fact.6.label=Metin temeli
fact.6.value=çalışma temeli olarak İngilizce Revised Version, İbranice ve Yunancaya karşı denetlenerek — bu derlemede bulunan [[RV|Revised Version]]'ın ta kendisi
fact.7.label=İki baskı
fact.7.value=Shen baskısı (神版) ile Shangdi baskısı (上帝版); yalnızca “Tanrı” karşılığını hangi Çince sözcüğün taşıdığı bakımından ayrılırlar
fact.8.label=Sonraki gözden geçirme
fact.8.value=Revised Chinese Union Version: Yeni Antlaşma 2006, tam Kutsal Kitap 2010 — bu metin değil
fact.9.label=Bu derlemede
fact.9.value=buradaki tek Çince Kutsal Kitap, bu yüzden Çince arayüz varsayılan olarak onu açar; soy basamaklarında kayıtlı bir kaynak yoktur, ama basamak etiketi 1919 yılını taşır
