title=Svenska 1917 — 关于此版本 | Common Root
description=瑞典教会1917年的译本——Gustav V:s bibel——第一部直接据希伯来文和希腊文译出、而非修订自前一版的瑞典文圣经，也是本语料库所藏唯一的瑞典文圣经。
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=三个半世纪以来，瑞典教会只有一部圣经，屡经修订，却从未重译。1541年的古斯塔夫·瓦萨圣经，是第一部以瑞典文印行的完整圣经，很大程度上依赖马丁·路德的德文译本。1618年的古斯塔夫二世·阿道夫圣经对其作了修订，而1703年的Karl XII:s bibel——虽由其父王下令，却在另一位国王在位时完成——又将这同一部承袭而来的瑞典文向前推进了一步。三者之中没有一部是从头译起的。
hero.2=1773年，古斯塔夫三世任命了一个圣经委员会，去做那几次修订都未曾做过的事：直接据希伯来文和希腊文翻译，而不是再把那旧瑞典文向前推一步。委员会历时144年。其成果——瑞典的第二部完整圣经译本，继古斯塔夫·瓦萨之后、在Bibel 2000之前——于1917年在古斯塔夫五世在位期间完成并获得批准，因此至今仍常被称作Gustav V:s bibel。
hero.3=旧约仍如之前各版那样，依据马所拉希伯来文本。新约却未延续它们的路线：它所据的是委员会在1917年之前所能得到的最新校勘希腊文本，而不是本语料库中宗教改革时期诸译本所依据的公认经文。
hero.4=在本阅读器中，它是唯一的瑞典文圣经，所以把界面设为瑞典文便在它上面开启——并非因为它被挑选出来，如同西班牙文选定了Reina-Valera 1909那样，而是因为目录扫描在这门语言里找不到别的。谱系阶梯中未为它记录任何母本，所以在某一节之下展开的阶梯径直落到以≈标示的原文底层。该底层为希腊文提供公认经文，而此处它比通常更远离实情：委员会为了一部更新的校勘本，刻意把公认经文抛在了后面，因此这部译本某节之下的底层所指的希腊文本，并非它实际依据的文本。

