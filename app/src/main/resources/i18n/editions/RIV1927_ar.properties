title=ريفيدوتا 1927 (الإيطالية) — عن هذه الطبعة | Common Root
description=الريفيدوتا: كتاب جوفاني ديودَاتي المقدس بالإيطالية، منقَّحًا على العبرية واليونانية بيد لجنة يرأسها اللاهوتي الولدنسي جوفاني لوتسي، نشرته جمعية الكتاب المقدس البريطانية والأجنبية في روما سنة 1924 — ولماذا يقول الملف 1927.
heroHeading=ريفيدوتا 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=وُلد جوفاني لوتسي سنة 1856 في إنغادين السفلى، في كانتون غراوبوندن السويسري، وحُمل رضيعًا إلى لوكّا حين هاجرت أسرته إليها في السنة التالية. نشأ إيطاليًّا، ودرس في كلية اللاهوت الولدنسية بفلورنسا — مدرسة الكنيسة البروتستانتية القديمة في إيطاليا — ثم درّس فيها اللاهوت وخدم قسًّا في المدينة. وقضى سنواته الأخيرة في سويسرا من جديد، في بوسكيافو، وتوفي هناك سنة 1948.
hero.2=بدأت الريفيدوتا سنة 1906، حين كلّفت جمعية الكتاب المقدس البريطانية والأجنبية — وكانت تطبع ترجمة ديودَاتي العائدة إلى القرن السابع عشر للقرّاء الإيطاليين منذ قرن كامل — جماعةً بتنقيحها، وجعلت لوتسي على رأسها. وكان يرجو أن يجعلها كتابًا مقدسًا مشتركًا مع علماء كاثوليك؛ فرفض الفاتيكان، ومضى العمل تنقيحًا بروتستانتيًّا. وصدر الكتاب المقدس كاملًا في روما سنة 1924، ووُصف على صفحة عنوانه بأنه نسخة منقَّحة على النص الأصلي — «riveduta»، أي المنقَّحة، وبهذا الاسم عُرف منذ ذلك الحين. وليس ترجمة جديدة: تحته نص ديودَاتي، مقابَلًا من جديد على العبرية واليونانية. وصار كتاب البروتستانت الإيطاليين المقدس طوال معظم القرن العشرين، ونشرت وريثته، النوفا ريفيدوتا، جمعيةُ الكتاب المقدس في جنيف سنة 1994. وصنع لوتسي أيضًا ترجمة خاصة به، مشروحة، في اثني عشر مجلدًا صدرت في فلورنسا ابتداءً من سنة 1921؛ وتلك عمل آخر، لا هذا النص.
hero.3=يظهر التنقيح على الصفحة. فالاسم الإلهي في العهد القديم هو «l'Eterno»، أي الأزلي — «L'Eterno è il mio pastore» في المزمور 23 — حيث يقول ديودَاتي «il Signore». ويقرأ إشعياء 7:14 «la giovane»، أي الفتاة، حيث يقول ديودَاتي «la Vergine». وفي العهد الجديد يفارق النص المستلم حيث تفارقه الطبعات النقدية اللاحقة: فليس في 1 يوحنا 5:7 الشهود السماويون، والصلاة الربانية في متى 6:13 تنتهي بلا تمجيد، وأعمال الرسل 8:37 باقية لكن بين معقوفين. والمزامير على الترقيم العبري، وعنوان المزمور مدموج في آيته الأولى — يبدأ المزمور 23 بعبارة «Salmo di Davide.» — فللمزمور 51 تسع عشرة آية، كما في الكتب المقدسة الإنجليزية. أما التاريخ: فـ1927 هي السنة التي يحملها النص الرقمي ويخزنها الفهرس، ولذا تُظهر شارة درجته 1927. وقد صدرت الريفيدوتا نفسها سنة 1924، وأيّ طبعة لاحقة ينقلها هذا الملف أمر لم يثبته هذا المشروع.
hero.4=وهو في هذا القارئ واحد من ثلاثة كتب مقدسة إيطالية، إلى جانب نسختين من ديودَاتي. والواجهة الإيطالية لا تفتح عليه: فليس للإيطالية اختيار منتقى، فيأخذ القارئ أول كتاب مقدس إيطالي في ترتيب الفهرس، وهو ديودَاتي 1649. وليس له في درجات النسب أصل مسجّل — ولا حتى ديودَاتي، مع أن الريفيدوتا تنقيح لديودَاتي وديودَاتي في المجموعة — فالدرجة المفتوحة تحت الآية تهبط مباشرة إلى أرضية اللغات الأصلية المعلَّمة بـ≈: مخطوطة لينينغراد في طبعة وستمنستر للعهد القديم، والنص المستلم للعهد الجديد، وهو بعينه اليوناني الذي ابتعد عنه هذا التنقيح.

