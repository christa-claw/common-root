title=穆斯林圣训实录 — 关于此版本 | Common Root
description=《穆斯林圣训实录》：与《布哈里圣训实录》合称"萨希哈因"，是逊尼派伊斯兰教仅次于《古兰经》的两部权威圣训集；穆斯林·伊本·哈贾吉汇集了在阿拉伯半岛、埃及、伊拉克和叙利亚收集到的圣训，只收录那些具有可靠传述者不间断传述链的圣训。
heroHeading=穆斯林圣训实录
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=阿布·侯赛因·穆斯林·伊本·哈贾吉·古莱希·内沙布里生于内沙布尔，当时属阿拔斯王朝的呼罗珊省（今伊朗东北部）；关于他的出生年份，各资料记载不一，分别为希吉拉历202年、204年或206年（约公元817至822年）。他曾游历阿拉伯半岛、埃及、伊拉克和叙利亚，向各地学者收集圣训，随后又回到故乡定居，在那里结识了布哈里，拜其为师，并终生与他保持友谊。据海推布·巴格达迪记载，他是应一位弟子艾哈迈德·伊本·萨拉马·内沙布里之请而着手编写此书的；此书原名《穆斯纳德·萨希赫·穆赫塔萨尔》，与布哈里的著作一样，通常简称为《穆斯林圣训实录》。他于希吉拉历261年（公元875年）在内沙布尔去世，葬于其郊区纳萨拉巴德。
hero.2=他只收录那些传述链不间断地上溯至穆罕默德某位伴侣、且每一环节都经过至少两位可靠传述者的圣训；他依据记忆力和品行将传述者分为三等，凡诚信受到质疑者皆予以排除。他的注释者纳瓦维指出了另一层用心：据其所言，穆斯林把每则圣训连同其所有传述链和措辞异文都安置在同一个恰当的位置，而不让它们散见各处——后世注释者常将这种编排方式与[[BUK|《布哈里圣训实录》]]的做法相对照，后者将同一圣训的不同措辞分别置于各自所阐明之要点所属的章节之下。
hero.3=这部书究竟收录了多少则圣训，如同《布哈里圣训实录》一样，取决于由谁来计数以及如何处理重复。卡提布·切莱比与西迪克·哈桑·汗二人均得出7,275的数字；穆罕默德·福阿德·阿卜杜勒-巴基在不计重复的情况下得出3,033；马什胡尔·伊本·哈桑·阿勒-萨勒曼得出7,385，若加上穆斯林本人序言中的十则圣训则为7,395；其他估计将总数置于约5,500至7,500之间。贾乌扎基统计出与《布哈里圣训实录》几乎逐字相同、共有的圣训有2,326则。本语料库自身的统计又是另一个数字：57卷、7,563则编号圣训——这仅仅反映了本语料库所据数字化版本自身的结构，并非宣称精确复现任何某一种印本编号。
hero.4=此处的阿拉伯文本为古典马特恩（matn），属公共领域。阅读器中其下方配有英译文，取自fawazahmed0/hadith-api的eng-muslim版本，并与阿拉伯文逐条圣训对齐，使二者可以成对阅读——这与本语料库在[[BUK|《布哈里圣训实录》]]及其古兰经译文中所用的并排方式相同。该文件本身究竟出自哪个已出版的英译本，本语料库方面尚未查实，因此其许可被标注为审核中，而非直接标注为公共领域；上方的阿拉伯文本则不存在这种不确定性。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=语言
fact.1.value=古典阿拉伯语，阅读器中每则圣训下方配有英译文
fact.2.label=编纂者
fact.2.value=阿布·侯赛因·穆斯林·伊本·哈贾吉·古莱希·内沙布里（希吉拉历202–206年生 / 约公元817–822年 — 希吉拉历261年 / 公元875年卒）
fact.3.label=全称
fact.3.value=al-Musnad al-Sahih al-Mukhtasar——通常简称为《穆斯林圣训实录》
fact.4.label=编纂地点与时间
fact.4.value=圣训采集于阿拉伯半岛、埃及、伊拉克和叙利亚；该书本身应一位弟子之请在呼罗珊内沙布尔完成
fact.5.label=方法
fact.5.value=仅收录传述链不间断、每一环节至少经两位可靠传述者直至穆罕默德某位伴侣的圣训；传述者按可靠程度分为三等，诚信受质疑者被排除
fact.6.label=地位
fact.6.value=逊尼派伊斯兰教六大圣训集（库图布·西塔）之二；与[[BUK|《布哈里圣训实录》]]合称"萨希哈因"——两部权威性仅次于《古兰经》的圣训集；多数学者认为布哈里的圣训集整体权威性高于此书
fact.7.label=圣训数量
fact.7.value=数字因计数方式而异，从不计重复的3,033（阿卜杜勒-巴基）到计入重复的7,275至7,395不等；各印本在卷数与圣训编号上均有差异
fact.8.label=在本语料库中
fact.8.value=57卷、7,563则编号圣训——这是源数据集本身的结构，并非对任何某一种印本编号的复现
fact.9.label=英译文
fact.9.value=取自fawazahmed0/hadith-api的eng-muslim版本，在阿拉伯文下方作为配套显示；它究竟出自哪个印本译文，本语料库方面尚未确认
fact.10.label=许可
fact.10.value=阿拉伯文马特恩是公共领域的古典文本；英译文的许可仍在审核中
