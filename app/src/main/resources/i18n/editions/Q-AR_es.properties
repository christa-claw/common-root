title=Corán — Uthmani — Acerca de esta edición | Common Root
description=El Corán en la lectura hafs de asim, el texto en que se basa la mayoría de los Coranes impresos en el mundo desde la edición de El Cairo de 1924 — y, en este corpus, un texto cotejado versículo por versículo con la copia del propio Complejo Rey Fahd, con el que coincide en el esqueleto consonántico en la totalidad de sus 6.236 versículos.
heroHeading=Corán — Uthmani
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=La lectura que sostiene este texto tiene una cadena de transmisión con nombre. Hafs ibn Sulaiman al-Kufi (m. 796) la transmitió de su maestro, Asim ibn Abi al-Nayud, uno de los lectores de Kufa cuya recitación Ibn Muyahid canonizó más tarde entre las siete (Asim murió en 745). Hafs de Asim —"Hafs, según Asim"— es una de varias lecturas que los musulmanes consideran transmisiones igualmente autorizadas de la misma revelación; no es la única, pero es, con mucho, la más impresa. Cuando un comité de eruditos de Al-Azhar, trabajando desde 1907 bajo el rey Fuad I, produjo el Corán egipcio estándar que la Imprenta Amiri de Bulaq publicó el 10 de julio de 1924, fue esta lectura la que fijaron en los tipos. La mayoría de los Coranes que se venden hoy en cualquier lugar, incluido el del propio Complejo Rey Fahd, siguen el ejemplo de esa edición.
hero.2=Lo que figura en este corpus procede, a través de la edición quran-uthmani de alquran.cloud, de la digitalización que el Proyecto Tanzil hizo de ese mismo texto hafs. Se empareja en el lector con tres traducciones: la inglesa de Pickthall de 1930, la inglesa de Yusuf Ali de 1934 y la rusa de Sablukov de 1878 — abra cualquiera de las tres junto a esta y su versión aparece debajo de cada aleya. El lector ofrece además el Corán en dos órdenes: la secuencia canónica del mushaf que esta misma tradición fijó, y el orden que los estudiosos reconstruyen para cuándo se reveló cada sura.
hero.3=La conservación letra por letra es en sí misma una de las afirmaciones que se hacen sobre este texto, así que aquí se comprueba en vez de suponerse. Cotejado versículo por versículo con la propia edición hafs del Complejo Rey Fahd para la Impresión del Glorioso Corán, los dos coinciden en el esqueleto consonántico — las letras desnudas, antes de añadir ninguna vocal — en la totalidad de sus 6.236 versículos. Toda diferencia hallada se limita a cómo se anotan las vocales y las marcas de pausa, a la grafía de la hamza y a ocho lugares donde las dos casas trazan de modo distinto la separación de las palabras; ninguna afecta a una sola letra del texto mismo. Es lo contrario de la incertidumbre que este corpus tiene que admitir para la Biblia finlandesa de 1776, donde simplemente no se sabe de qué impresión desciende el texto.
hero.4=Conviene decir con claridad dos cosas que esa coincidencia no demuestra. No es una afirmación de descendencia: que coincida con el texto del Complejo muestra que los dos son el mismo texto, no que uno se copiara del otro. Y tampoco es una licencia: una solicitud enviada al Complejo a finales de agosto de 2026, pidiendo permiso para mostrar sus propios archivos de riwayat, no había recibido respuesta a la fecha de escribir esto. El único versículo donde la propia comparación mostró brevemente un desacuerdo, el 19:3, resultó ser un defecto en cómo se leyó el archivo de referencia, no en ninguno de los dos Coranes — corregido, coincide exactamente. La copia de referencia misma es una reconstrucción del archivo de procesador de textos del Complejo, no una publicación digital oficial suya, que es el único aspecto en que esto no es del todo una comparación con un conjunto de datos publicado oficialmente.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lengua
fact.1.value=árabe coránico, en la ortografía uthmani estándar
fact.2.label=Lectura (qira'ah)
fact.2.value=Hafs de Asim — transmitida por Hafs ibn Sulaiman (m. 796) de Asim ibn Abi al-Nayud de Kufa (m. 745); una de las catorce transmisiones reconocidas, y la que sigue la mayoría de los Coranes impresos en el mundo
fact.3.label=Forma impresa estándar
fact.3.value=La edición de El Cairo de 1924 — un comité de eruditos de Al-Azhar, trabajando desde 1907 bajo el rey Fuad I, impresa por la Imprenta Amiri de Bulaq el 10 de julio de 1924; el modelo que siguen la mayoría de las impresiones posteriores, incluida la del propio Complejo Rey Fahd
fact.4.label=Texto utilizado aquí
fact.4.value=la edición quran-uthmani de alquran.cloud, cuyo texto árabe procede de la digitalización del Proyecto Tanzil
fact.5.label=Cotejado con
fact.5.value=la propia edición hafs del Complejo Rey Fahd para la Impresión del Glorioso Corán, versículo por versículo: coincide en el esqueleto consonántico en la totalidad de sus 6.236 versículos, con toda diferencia limitada a la notación vocálica, la grafía de la hamza y ocho casos de separación de palabras
fact.6.label=Lo que esa coincidencia no demuestra
fact.6.value=la descendencia —coincidir no es ser el origen— ni tampoco una licencia: una solicitud al Complejo para mostrar sus propios archivos, enviada a finales de agosto de 2026, no había recibido respuesta a la fecha de escribir esto
fact.7.label=Traducciones que lo acompañan en este corpus
fact.7.value=[[Q-EN|la inglesa de Pickthall]] (1930), [[Q-YA|la inglesa de Yusuf Ali]] (1934) y [[Q-SAB|la rusa de Sablukov]] (1878) — tres traducciones que se emparejan con este texto base bajo cada aleya
fact.8.label=En este corpus
fact.8.value=el único texto árabe con el que se empareja aquí cada [[Q-EN|traducción]]; en contraste, [[FB1776|la Biblia finlandesa de 1776]], donde simplemente no se sabe de qué impresión desciende el texto
fact.9.label=Licencia
fact.9.value=dominio público — el texto árabe coránico se trata como algo que no pertenece a nadie; los propios términos de nuestra fuente solo piden que cualquier reproducción conserve intacta la ortografía uthmani
