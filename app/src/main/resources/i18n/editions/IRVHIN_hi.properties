title=इंडियन रिवाइज़्ड वर्ज़न — इस संस्करण के बारे में | Common Root
description=इंडियन रिवाइज़्ड वर्ज़न (IRV): Bridge Connectivity Solutions द्वारा प्रकाशित 2019 का हिन्दी बाइबिल अनुवाद, CC BY-SA 4.0 के अंतर्गत लाइसेंस प्राप्त — यह संग्रह डिफ़ॉल्ट रूप से जिस हिन्दी पाठ पर खुलता है।
heroHeading=इंडियन रिवाइज़्ड वर्ज़न
readerHref=/reader?c1.src=irvhin

hero.1=इंडियन रिवाइज़्ड वर्ज़न बाइबिल का एक आधुनिक हिन्दी अनुवाद है, जिसका कॉपीराइट 2017 और 2019 का है और जो Bridge Connectivity Solutions Pvt. Ltd. के पास है, जो बाइबिल अनुवाद और तकनीक से जुड़ी एक भारतीय संस्था है। यह "इंडियन रिवाइज़्ड वर्ज़न" की एक बड़ी शृंखला का हिस्सा है, जिसे इसी प्रकाशक ने भारत की अन्य प्रमुख भाषाओं में भी समांतर रूप से तैयार किया है — जिनमें कन्नड़, तमिल, तेलुगु और असमिया शामिल हैं — हर एक अपनी ही लिपि में एक संपूर्ण बाइबिल, उसी खुले लाइसेंस के अंतर्गत प्रकाशित।
hero.2=Common Root का पाठ eBible.org द्वारा वितरित हिन्दी IRV के USFM संस्करण से लिया गया है, जिसे वहाँ hin2017 के रूप में सूचीबद्ध किया गया है, बजाय इसी अनुवाद की उस पहले की डिजिटल प्रतिलिपि के जो फुटनोट के पाठ को सीधे पदों के भीतर जोड़े हुए और पुस्तकों के नाम अंग्रेज़ी के बजाय हिन्दी में देते हुए प्रचलन में थी। उस USFM स्रोत से दोबारा आयात करने से यह संस्करण यहाँ जोड़े जाने से पहले दोनों समस्याएँ ठीक हो गईं — यह संग्रह बाइबिल की अपनी भाषा जो भी हो, अपने सभी संस्करणों में पुस्तकों के नाम आंतरिक रूप से अंग्रेज़ी में ही रखता है।
hero.3=यह यहाँ देवनागरी लिपि में, इंडियन रिवाइज़्ड वर्ज़न के रूप में लिखा गया है, और इसमें ड्यूटेरोकैनोनिकल पुस्तकों के बिना मानक 66 पुस्तकों वाली प्रोटेस्टेंट सिद्धांत-सूची है।
hero.4=यह इस संग्रह में एकमात्र हिन्दी बाइबिल है, इसलिए हिन्दी इंटरफ़ेस डिफ़ॉल्ट रूप से इसी पर खुलता है।

