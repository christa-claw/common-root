title=Reina Valera 1909 — Bu baskı hakkında | Common Root
description=Reina-Valera 1909: Casiodoro de Reina'nın 1569 tarihli İspanyolcasını, Cipriano de Valera'nın 1602'de gözden geçirdiği biçimiyle, yirminci yüzyıla taşıyan gözden geçirme — ve bu okuyucunun İspanyolca için açtığı baskı.
heroHeading=Reina Valera 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=İspanyolca Protestan Kutsal Kitap, alışılmadık ölçüde tek bir kitaptır. Engizisyonun önünden İspanya'yı terk eden Casiodoro de Reina çevirisini sürgünde bitirdi ve 1569'da Basel'de yayımladı: kapağındaki ayıdan ötürü Biblia del Oso denen kitap. Sevilla dışındaki aynı manastırda bulunmuş ve aynı kaçışı yapmış olan Cipriano de Valera yıllarca onu gözden geçirdi ve ürünü 1602'de Amsterdam'da bastırdı, Biblia del Cántaro. O gün bugün her Reina-Valera, onun bir gözden geçirmesinin gözden geçirmesidir; kısa çizgili bir adın, hiç aynı odada çalışmamış iki adamı anmasının sebebi budur.
hero.2=Bu, 1909 gözden geçirmesidir; Britanya ve Yabancı Ülkeler Kutsal Kitap Şirketi ile Amerikan Kutsal Kitap Şirketi'nin gözetiminde hazırlanmış, kullanmayı sürdürenlerce çoğunlukla Versión Antigua — eski sürüm — diye anılmıştır. Daha önceki bir gözden geçirmenin, 1862'nin ardından geldi ve gözden geçirmelerin genelde değiştirdiği şeyde tutucudur: Reina ile Valera'nın izlenmesi güçleşmiş olduğu yerde söz öne alınır, güçleşmemiş olduğu yerde kendi hâline bırakılır. Eski Antlaşma Masoretik İbranice üzerinde, Yeni Antlaşma Textus Receptus üzerinde durur; Reina'nınki de öyle dururdu.
hero.3=İspanyolca konuşan Protestan dünyasını elli yıl kadar neredeyse tek başına elinde tuttu; 1960 gözden geçirmesi onu geri itene dek. Ve hiçbir zaman büsbütün ortadan kalkmadı. Telif hakkından muaftır, 1960 ise değildir; böylece kimsenin iznini almaksızın basılan, ağa konan ve alıntılanan Reina-Valera budur. Metnin bütününün bu derlemede durabilmesinin ve oradan geri kopyalanabilmesinin sebebi de aynıdır.
hero.4=Bu okuyucuda İspanyolcanın beş Kutsal Kitabı vardır ve arayüzün açtığı budur. Bu, kataloğun bir rastlantısı değil, seçilmiş bir tercihtir: okuyucunun o dilde var olan tek Kutsal Kitabı açtığı Arapça ya da Çincenin tersine, İspanyolcanın seçenekleri vardır ve bu onların arasından alınmıştır. Soy basamaklarında ona kayıtlı bir kaynak metin yoktur, dolayısıyla bir ayetin altında açılan basamak doğrudan ≈ ile imlenen özgün diller tabanına iner. Taban burada her zamankinden yakın düşer, Arapça Kutsal Kitaptaki sebebin aynısıyla: sunduğu Yunanca Textus Receptus'tur ve Reina'nın Yeni Antlaşması Textus Receptus'tan yapılmıştır.

