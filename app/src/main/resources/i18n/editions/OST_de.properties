title=Ostervald-Bibel (französisch) — Über diese Ausgabe | Common Root
description=Die Ostervald-Bibel: die Revision der französischen protestantischen Bibel von Genf durch einen Neuenburger Pfarrer, erstmals 1744 erschienen, hier in einer späteren Revision in moderner französischer Rechtschreibung.
heroHeading=Ostervald-Bibel
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=Jean-Frédéric Ostervald wurde 1663 in Neuenburg (Neuchâtel) geboren und starb dort 1747. Er wurde 1683 in seiner Heimatstadt ordiniert und diente fast sein ganzes Leben in ihrer Kirche, zuerst als Diakon und ab 1699 als Pfarrer; daneben lehrte er Theologie. Seine Bibel ist keine neue Übersetzung aus dem Hebräischen und Griechischen, sondern eine Revision der französischen protestantischen Bibel von Genf, der Fassung, die die französischsprachigen reformierten Gemeinden seit dem 16. Jahrhundert lasen. Ostervalds revidierter Text erschien erstmals 1744, drei Jahre vor seinem Tod, und wurde über mehr als zwei Jahrhunderte nachgedruckt und überarbeitet; auch in Großbritannien war er gut bekannt.
hero.2=Der Wortlaut in diesem Korpus ist nicht das Französisch von 1744. Das 18. Jahrhundert schrieb „étoit“, wo das heutige Französisch „était“ schreibt; diese Abschrift hat durchgehend „était“ und kein einziges Mal „étoit“, stammt also aus einer der späteren Revisionen, die Ostervalds Namen beibehielten. Die bekannteste ist die 1881 von der Société biblique de France herausgegebene Revision, deren Neues Testament Ch. L. Frossard besorgte, und dieser Text wurde noch 1996 aktualisiert. eBible.org, die Quelle dieser Abschrift, nennt nur „Ostervald“ und nicht die Revision, deshalb nennt auch diese Seite keine. Einige Züge zeigen sich auf fast jeder Seite. Der Gottesname ist „l'Éternel“, der Ewige, wie bei Segond und in der französischen Darby: „L'Éternel est mon berger; je n'aurai point de disette“ in Psalm 23. Jesaja 7:14 behält „la vierge sera enceinte“ — die Jungfrau —, wo Segond die junge Frau hat. Und das Neue Testament bewahrt Lesarten des Textus Receptus, die kritische Ausgaben streichen: 1. Johannes 5:7 hat die drei himmlischen Zeugen, „le Père, la Parole, et le Saint-Esprit“, die der Segond daneben fehlen.
hero.3=In diesem Leser ist sie eine von drei französischen Bibeln, neben Segond und der französischen Darby. Eine französische Oberfläche öffnet nicht auf ihr: fürs Französische gibt es keine kuratierte Wahl, also nimmt der Leser die erste französische Bibel in Katalogreihenfolge, und das ist Darby. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet — die Genfer Bibel, die sie revidiert, ist nicht in diesem Korpus —, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden fällt: für das Alte Testament der Codex Leningradensis, für das Neue der Textus Receptus, also die griechische Überlieferung, der diese Bibel tatsächlich folgt. Ihr Sprossen-Chip trägt das Jahr 1744, das Jahr von Ostervalds eigener Revision, nicht das des gezeigten Wortlauts. Neben Segond geöffnet zeigt sie zwei Jahrhunderte französischer protestantischer Bibelsprache Seite an Seite.

