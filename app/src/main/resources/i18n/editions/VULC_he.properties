title=הוולגטה הקלמנטינית — על מהדורה זו | Common Root
description=הוולגטה הקלמנטינית: העריכה האפיפיורית של כתבי הקודש הלטיניים של הירונימוס, שנדפסה ברומא ב־1592 ויצאה שוב בתיקונים ב־1593 וב־1598 — הנוסח הלטיני המקובל של הכנסייה הקתולית עד 1979, ובקורא זה שלב מעל הוולגטה.
heroHeading=הוולגטה הקלמנטינית
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=ב־1546 הכריזה ועידת טרנטו על הוולגטה כעל כתבי הקודש הלטיניים המוסמכים של הכנסייה, ובכך השאירה שאלה שלא ענתה עליה: איזו וולגטה? אחת־עשרה מאות שנים של העתקה ביד לא השאירו שני כתבי יד זהים לגמרי, והוועידה ביקשה נוסח מתוקן. האפיפיור סיקסטוס החמישי סיפק נוסח כזה ב־1590, שחלק גדול ממנו תיקן בעצמו, יחד עם בולה שהכריזה עליו כמוסמך. הוא מת באוגוסט של אותה שנה, ובתוך שבועות ספורים עצרו הקרדינלים את מכירתו. בימי קלמנס השמיני הכינה ועדה את מחליפו — פרנסיסקו דה טולדו בין העורכים, רוברטו בלרמינו בלב העבודה — והוא נדפס ברומא ב־1592. הדפסות חוזרות בפורמט קטן יותר ב־1593 וב־1598 הסירו את רוב טעויות הדפוס שבו והוסיפו את הקדמותיו של הירונימוס ומראי מקום בשוליים.
hero.2=הנוסח הזה היה כתבי הקודש הלטיניים המקובלים של הכנסייה הקתולית במשך קרוב לארבע מאות שנה, עד הנובה וולגטה של 1979, וספר המיסה וספר התפילות של 1962 משתמשים בו עד היום. זהו התרגום של הירונימוס כפי שהכנסייה קיבלה אותו, ולא כפי שהוא עצמו השאיר אותו. המזמורים הם תהילים הגאליקני שלו, שתוקן על פי היוונית, ולא תרגומו המאוחר מן העברית, ולכן הם שומרים על המספור היווני: מזמור 22 פותח כאן במילים “Dominus regit me”, מזמור הרועה. באיגרת הראשונה של יוחנן 5:7 מופיעה הפסוקית היוחנאית (Comma Johanneum), “Pater, Verbum, et Spiritus Sanctus”, תוספת לטינית שאינה בכתבי היד היווניים הקדומים. אסתר ודניאל באים בצורתם הארוכה, והתוספות היווניות מכונסות בסוף אסתר ובשני הפרקים האחרונים של דניאל. הקובץ של eBible.org שממנו נלקח העותק הזה מדפיס את נוסח 1598 עם הגלוסה אורדינריה (Glossa Ordinaria) כהערות — הפירוש מן המאה השתים־עשרה שיצא מאסכולת אנסלם מלאון, במהדורת מין של 1880. ההערות לא נכנסו לאוסף; הסוגריים המרובעים בחלק מן הפסוקים הם של המקור עצמו.
hero.3=בקורא זה הוא שלב בעל הורה רשום אחד, הוולגטה הלטינית: פִּתחו שלב מתחת לאחד מפסוקיו, והוולגטה מופיעה. צפו ששני הנוסחים ייקראו כמעט מילה במילה אותו דבר. הוולגטה באוסף זה לקוחה בעצמה מנוסח קלמנטיני, כך שמה שמבדיל ביניהם הוא בעיקר הפיסוק — והספרים שחסרים בעותק הזה. יש בו 66, ספרי הקאנון הפרוטסטנטי, ואסתר ודניאל בצורתם הארוכה. קובצי המקור כוללים גם את טוביה, יהודית, חכמת שלמה, בן סירא, ברוך ושני ספרי המקבים, שכולם מצויים בוולגטה שמתחתיו; אף אחד מהם לא הגיע, ולכן היכן שבוולגטה יש טוביה, אין מעליה דבר. תפילת מנשה וספרי עזרא 3 ו־4, שהקלמנטינה הדפיסה בנספח, אינם לא במקור ולא באוסף. דבר באוסף אינו עומד בתורו על מהדורה זו.

