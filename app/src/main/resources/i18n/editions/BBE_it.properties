title=Bible in Basic English — Su questa edizione | Common Root
description=La Bible in Basic English, tradotta dall'ebraico e dal greco da un comitato diretto da S. H. Hooke e pubblicata dalla Cambridge University Press — il Nuovo Testamento nel 1941, la Bibbia intera nel 1949 — nel Basic English di C. K. Ogden, di 850 parole, con altre 150 aggiunte per la poesia e per la Bibbia.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=Il Basic English fu opera di C. K. Ogden dell'Orthological Institute: un elenco di 850 parole inglesi, proposto come lingua ausiliaria internazionale. La Bible in Basic English fu realizzata da un comitato sotto la direzione di S. H. Hooke (1874–1968), lo studioso dell'Antico Testamento che nel 1930 divenne Samuel Davidson Professor di studi veterotestamentari all'Università di Londra, in collaborazione con l'Orthological Institute. Fu tradotta dall'ebraico e dal greco, non semplificata a partire da una versione inglese precedente, e il testo in Basic fu poi riveduto nei particolari da un comitato formato dai Syndics della Cambridge University Press. Alle 850 parole di Ogden i traduttori ne aggiunsero 100 che aiutano con la poesia e 50 necessarie per la Bibbia, 150 in tutto. La Cambridge University Press pubblicò il Nuovo Testamento nel 1941 e la Bibbia intera nel 1949; una tiratura del 1965 fu distribuita negli Stati Uniti senza avviso di copyright, ed è per questo che lì il testo è di pubblico dominio.
hero.2=Il risultato si legge con semplicità e regolarità, entro quel vocabolario ridotto. La Genesi si apre con «At the first God made the heaven and the earth.» Il Salmo 23 comincia «The Lord takes care of me as his sheep; I will not be without any good thing.» Il Vangelo di Giovanni si apre con «From the first he was the Word, and the Word was in relation with God and was God,» e Giovanni 3:16 dice «For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.» Il nome divino è ovunque «the Lord», tranne in otto versetti in cui è reso con «Yahweh», tra cui Esodo 6:3, dove Dio dice che Abramo, Isacco e Giacobbe «had no knowledge of my name Yahweh», e Salmo 83:18. Dove l'ebraico era troppo incerto per essere tradotto, i traduttori misero dei puntini al suo posto, e nella nostra copia alcuni versetti, tra cui Giobbe 34:29–33 e Giobbe 36:16–20, non sono altro che «...».
hero.3=La nostra copia contiene 66 libri, dalla Genesi all'Apocalisse, senza gli apocrifi, nella numerazione di capitoli e versetti della King James e della Revised Version — 150 salmi, e Malachia che termina al capitolo 4. Non riporta i titoli dei salmi: il Salmo 51 comincia da «Have pity on me, O God». Il Nuovo Testamento non è una traduzione del testo ricevuto. Sedici versetti che le edizioni critiche omettono, tra cui Matteo 17:21, Atti 8:37 e Romani 16:24, sono conservati qui solo come posti vuoti segnati [], e 1 Giovanni 5:7 non ha i tre testimoni in cielo; il racconto dell'adultera, Giovanni 7:53–8:11, sta tra parentesi quadre, mentre la finale lunga di Marco è conservata. In questo lettore sta da sola. Il corpus non le registra alcun genitore, così che un piolo di discendenza aperto sotto uno dei suoi versetti cade dritto sul pavimento delle lingue originali contrassegnato con ≈: il Codice di Leningrado nell'Antico Testamento e il Textus Receptus nel Nuovo, un testo greco che questa traduzione non segue in quei sedici punti. Nulla risulta registrato come poggiante su di essa. Nessuna lingua dell'interfaccia si apre su questa edizione; un'interfaccia inglese si apre sulla New International Version, e a questa si arriva dalla sua scheda nella griglia delle traduzioni.

