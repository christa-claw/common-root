title=Коран — Пиктхолл — Об этом издании | Common Root
description=Перевод Мухаммада Мармадьюка Пиктхолла 1930 года — первый английский перевод Корана, выполненный мусульманином, для которого английский был родным языком; создан на службе у низама Хайдарабада по совету учёных Аль-Азхара, и в этом собрании это английский текст, который по умолчанию показывается под арабским.
heroHeading=Коран — Пиктхолл
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Мухаммад Мармадьюк Пиктхолл (1875-1936) был английским романистом, которого в своё время ценили Г. Уэллс и Д. Г. Лоуренс, прежде чем стать переводчиком священного текста. Он объявил о своём переходе в ислам в ноябре 1917 года, после выступления под названием "Islam and Progress" перед Muslim Literary Society в Ноттинг-Хилле, и в том же месяце произнёс шахаду в Woking Muslim Mission. Десятилетие позже он был директором школы Chadarghat High School в Хайдарабаде, на службе у низама, и именно оттуда в 1928 году взял двухлетний творческий отпуск, чтобы сделать то, что хотел сделать с момента своего обращения: перевести Коран на английский язык.
hero.2=Он не делал этого ни один, ни второпях. В 1929 году он провёл три месяца в Каире, где поддержка Рашида Риды открыла ему двери, добиваясь благословения учёных Аль-Азхара на предприятие, за участие в котором некоторых из них предупреждали, что это может стоить им должности — часть Аль-Азхара считала сам перевод Корана серьёзным делом. Пиктхолл всё же продолжил и не прекращал с ними советоваться. То, что он опубликовал в 1930 году под названием "The Meaning of the Glorious Koran: An Explanatory Translation", несёт эту осторожность уже в самом заглавии: не "Коран на английском", а разъяснение его смысла, поскольку, по его собственному заявленному убеждению, никакой перевод не мог быть самим Кораном. Альфред А. Кнопф выпустил первое издание в Нью-Йорке; затем последовало двуязычное издание правительственной типографии Хайдарабада.
hero.3=The Times Literary Supplement назвал его "a great literary achievement", и его обычно называют первым английским переводом Корана, выполненным мусульманином, для которого английский был родным языком — более ранние английские переводы, в частности Сейла и Родуэлла, были работой немусульманских ориенталистов. Перевод Пиктхолла остаётся в печати и в употреблении почти столетие с тех пор — один из немногих английских переводов, которые действительно читают обычные читатели, а не только учёные.
hero.4=В этом собрании это перевод, который по умолчанию показывается под усманским арабским текстом — арабский остаётся основой каждой колонки, а этот английский текст показывается как пояснение рядом с ним, никогда его не заменяя. Для этой роли его выбрали по причине столь же прозаической, сколь и литературной: обзор доступных переводов нашёл лишь два английских перевода, безусловно являющихся общественным достоянием, — этот и перевод Юсуфа Али 1934 года, а также русский перевод Саблукова 1878 года для третьего языка. Текст здесь представляет собой оцифровку перевода, полученную через alquran.cloud, а не привязанную к какому-то одному изданию, поэтому его следует читать как формулировку Пиктхолла, а не как факсимиле определённого издания.

