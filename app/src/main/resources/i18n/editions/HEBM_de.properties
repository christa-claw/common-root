title=Hebräische Bibel — Über diese Ausgabe | Common Root
description=Die ganze Bibel auf Hebräisch: das masoretische Alte Testament zusammen mit dem Neuen Testament von Franz Delitzsch aus dem Jahr 1877, ins Hebräisch der Mischna zurückübersetzt für Leser, die das Buch ganz in einer Sprache wollten.
heroHeading=Hebräische Bibel — masoretisches Altes Testament und Neues Testament von Delitzsch
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Eine Bibel, die von vorn bis hinten hebräisch ist, ist ein fremderer Gegenstand, als es klingt, denn die eine Hälfte wurde nie auf Hebräisch geschrieben. Das Alte Testament ist hebräisch und war es immer. Das Neue Testament ist auf Griechisch überliefert. Eine Ausgabe wie diese besteht also aus zwei ganz verschiedenen Arten von Text, aneinandergenäht: einem Original und einer Übersetzung, die in die umgekehrte Richtung als sonst gemacht wurde — aus dem Griechischen zurück in die Sprache, die ihre Verfasser größtenteils sprachen.
hero.2=Die neutestamentliche Hälfte ist das Werk von Franz Delitzsch, einem Leipziger Kenner des Hebräischen und der rabbinischen Literatur, 1873 von der Britischen und Ausländischen Bibelgesellschaft in Auftrag gegeben und 1877 vollendet. Er übersetzte nicht in das Hebräisch seines eigenen Jahrhunderts. Er schrieb im Hebräisch der Mischna und der Zeit des Zweiten Tempels, mit dem Argument, ein Text des ersten Jahrhunderts solle auch nach einem solchen klingen — so liest sich das Ergebnis weniger als Übertragung ins Hebräische denn als Versuch, zurückzugewinnen, was die Sätze gewesen sein mochten, ehe sie griechisch waren. Es ist noch immer das hebräische Neue Testament, nach dem am häufigsten gegriffen wird.
hero.3=Welches Griechisch er zugrunde legte, wurde zum Teil für ihn entschieden. Er begann beim Codex Sinaiticus, der einige Jahrzehnte zuvor gefundenen Handschrift des vierten Jahrhunderts, und die Bibelgesellschaft — deren Grundsatz es war, nach dem überlieferten Text zu drucken — weigerte sich, eine darauf gebaute Fassung weiter zu finanzieren. Delitzsch kehrte zum Textus Receptus zurück und vermerkte die bedeutsamen sinaitischen Lesarten, statt sie zu übernehmen. Der Text blieb danach dreizehn Jahre und zehn Auflagen lang in Bewegung; die letzte betreute Gustav Dalman 1890 im Druck, in dem Jahr, in dem Delitzsch starb. Das ist ein Grund, warum der Katalog die Jahresspalte dieser Ausgabe leer lässt: die beiden Hälften teilen kein Datum, und die Hälfte, die Daten hat, hat deren zehn.
hero.4=In diesem Leser ist sie die Ausgabe, auf der eine hebräische Oberfläche öffnet — eine kuratierte Wahl, kein alphabetischer Zufall —, und wer Hebräisch wählt, dreht damit die ganze Oberfläche von rechts nach links um sie herum. Sie steht neben dem Codex Leningradensis, ohne mit ihm zu wetteifern: der Codex ist der wissenschaftliche Tanach, voll punktiert und akzentuiert und endend, wo das Alte Testament endet, während dies ein schlichter Konsonantentext ist, der bis zur Offenbarung weiterläuft. Die Abstammungssprossen verzeichnen für sie keine Vorlage, sodass eine unter einem Vers geöffnete Sprosse geradewegs auf den Ursprachenboden fällt, ≈ WLC und ≈ TR. Sonst ist dieser Boden in diesem Korpus eine Annäherung, und davor warnt das ≈. Hier ist er es beinahe nicht: das Alte Testament auf dem Bildschirm ist der masoretische Text, und der Textus Receptus ist das, was Delitzsch tatsächlich vor sich hatte.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Sprache
fact.1.value=Hebräisch — Konsonantentext ohne Vokalpunkte und ohne Akzentzeichen
fact.2.label=Was es ist
fact.2.value=zwei Texte als eine Bibel gebunden: das überlieferte masoretische Alte Testament und ein hebräisches Neues Testament, im neunzehnten Jahrhundert aus dem Griechischen übersetzt
fact.3.label=Neues Testament von
fact.3.value=Franz Delitzsch (1813–1890), dem Leipziger Hebraisten
fact.4.label=In Auftrag gegeben von
fact.4.value=der Britischen und Ausländischen Bibelgesellschaft im Jahr 1873; die Übersetzung wurde 1877 vollendet
fact.5.label=Altes Testament nach
fact.5.value=dem masoretischen Hebräisch selbst — keine Übersetzung, was dies zur einzigen Ausgabe hier macht, deren Altes Testament bereits in seiner Ursprache steht, wie [[WLC|der Westminster Leningrad Codex]]
fact.6.label=Neues Testament nach
fact.6.value=dem Griechischen des [[TR|Textus Receptus]]. Delitzsch begann stattdessen beim Codex Sinaiticus, aber die Bibelgesellschaft druckte nach dem überlieferten Text und wollte die Abweichung nicht finanzieren
fact.7.label=Sprachstufe
fact.7.value=kein modernes Hebräisch. Delitzsch schrieb im Hebräisch der Mischna und der Zeit des Zweiten Tempels und suchte dem Griechischen die Redeweise zurückzugeben, die seine Sprecher gebraucht hätten
fact.8.label=Überarbeitet bis
fact.8.value=1890, die letzte Auflage von Gustav Dalman im Druck betreut
fact.9.label=Nicht zu verwechseln mit
fact.9.value=dem neuhebräischen Neuen Testament der Bibelgesellschaft in Israel, einer eigenen Übersetzung des zwanzigsten Jahrhunderts, die noch urheberrechtlich geschützt ist
fact.10.label=Jahr im Katalog
fact.10.value=leer gelassen — die beiden Hälften teilen kein Jahr, und allein das Neue Testament wurde über dreizehn Jahre und zehn Auflagen hinweg überarbeitet
fact.11.label=In diesem Korpus
fact.11.value=alle 66 Bücher, und die kuratierte Vorgabe für eine hebräische Oberfläche — der Leser öffnet auf dieser und nicht auf [[WLC|dem Westminster Leningrad Codex]], weil diese den ganzen Weg durch das Neue Testament geht
