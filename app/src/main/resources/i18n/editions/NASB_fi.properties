title=New American Standard Bible 2020 — Tietoa tästä laitoksesta | Common Root
description=New American Standard Bible: Lockman-säätiön oma jatke American Standard Versionin sanatarkalle kirjaimellisuudelle, käännetty uudestaan hebreasta, aramealaisesta ja kreikasta, nyt vuoden 2020 tekstinä.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=New American Standard Bible alkoi tarkoituksellisena jatkeena, ei kokonaan uutena hankkeena. Lockman-säätiö, Kalifornian La Habrassa toimiva voittoa tavoittelematon järjestö, aloitti työn 1959 viedäkseen vuoden 1901 American Standard Versionia eteenpäin — säilyttäen sen maineen kirjaimellisesta, sanatarkasta uskollisuudesta hebrealle, aramealaiselle ja kreikalle, mutta uudistaen sen vanhentunutta englantia. Säätiö kokosi toimikunnan tutkijoita kristillisistä korkeakouluista ja seminaareista, enimmäkseen konservatiivisista evankelisista kirkkokunnista, ja käännös ilmestyi vaiheittain: Johanneksen evankeliumi 1960, muut evankeliumit 1962, koko Uusi testamentti 1963, Psalmit erikseen 1968, ja koko Raamattu 1971. Tämä ensimmäinen täydellinen laitos pohjautui Vanhan testamentin osalta Rudolf Kittelin Biblia Hebraican kolmanteen painokseen, Kuolleenmeren kääröjä huomioon ottaen, ja Uuden testamentin osalta Nestlen ja Alandin Novum Testamentum Graecen 23. painokseen.
hero.2=Tarkistustyö jatkui vuosikymmeniä ensimmäisen painoksen jälkeen. Pieniä sanamuotojen muutoksia tehtiin 1972, 1973 ja 1975, sitten laajempi tarkistus 1977 ja edelleen rajoitetumpi 1992. Vuonna 1995 säätiö julkaisi Updated Editionin — NASB95:n, tekstin, jota useimmat tarkoittavat sanoessaan pelkästään ”NASB” — Biblia Hebraica Stuttgartensiaa ja Nestle-Alandin 26. painosta hyödyntäen. Nykyinen teksti on vuoden 2020 päivitys, josta osia oli alkanut ilmestyä verkossa jo 2018: se siirsi Vanhan testamentin tekstipohjan Biblia Hebraica Stuttgartensiaan ja, niiden kirjojen osalta, joita se kattaa, uudempaan Biblia Hebraica Quintaan, Septuagintaa, Kuolleenmeren kääröjä, targumeja ja muita muinaisia versioita hyödyntäen siltä osin kuin ne vaikuttavat lukutapaan, kun taas Uusi testamentti seuraa nyt Nestle-Alandin 28. painosta, täydennettynä Editio Critica Maiorin laajemmalla kreikkalaisten käsikirjoitusten aineistolla. Kääntäjien ilmoitettu menetelmä pysyi samana joka tarkistuksessa: käännä alkuteksti niin kirjaimellisesti kuin englanti sallii, ja missä tiukasti kirjaimellinen käännös johtaisi harhaan tai lukisi luonnottomasti, valitse selkeämpi idiomi ja merkitse kirjaimellisempi sanamuoto alaviitteeseen — käytäntö, jota pidetään säännöllisesti syynä siihen, että tämä on yksi 1900- ja 2000-luvun laajalti käytettyjen englanninkielisten käännösten kirjaimellisimmista.
hero.3=Nimestään ja ilmoitetusta velastaan American Standard Versionille huolimatta New American Standard Bible on uusi käännös alkukielistä, ei sen rivi riville tehty tarkistus, ja aineisto jättää sille siksi isän kirjaamatta: polveutumisaskelman avaaminen NASB-jakeen alta johtaa suoraan alkukielen pohjalle, merkittynä ≈, täsmälleen samoin kuin New International Versionille. Näillä kahdella on muutakin yhteistä kuin tämä muoto — molemmat ovat lisenssinvaraisia, ei vapaasti käytettäviä, erottuen samalla hyllyllä olevista vapaasti kopioitavista englanninkielisistä laitoksista, vaikka englanninkielinen käyttöliittymä avautuu oletuksena New International Versioniin, ja New American Standard Bible tavoitetaan omalta kortiltaan käännösruudukossa.

