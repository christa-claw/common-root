fact.4.value=Rudolf Kittelin Biblia Hebraican (3. painos) ja Kuolleenmeren kääröjen varaan vuoden 1971 alkuperäislaitoksessa; Biblia Hebraica Stuttgartensiaan vuoden 1995 tarkistuksessa; vuoden 2020 teksti nojaa Biblia Hebraica Stuttgartensiaan ja, siltä osin kuin se on saatavilla, uudempaan Biblia Hebraica Quintaan, Septuagintaa, Kuolleenmeren kääröjä, targumeja ja muita muinaisia versioita hyödyntäen
fact.5.label=Uusi testamentti pohjautuu
fact.5.value=Nestlen ja Alandin Novum Testamentum Graecen 23. painokseen vuoden 1971 alkuperäislaitoksessa; 26. painokseen vuoden 1995 tarkistuksessa; 28. painokseen (NA28) vuoden 2020 tekstissä, täydennettynä Editio Critica Maiorin kreikkalaisten käsikirjoitusten aineistolla
fact.6.label=Käännöstyyppi
fact.6.value=Formaalinen vastaavuus — käännetty niin kirjaimellisesti alkukielistä kuin luettava englanti sallii, kirjaimellisempi sanamuoto alaviitteessä siellä, missä on valittu selkeämpi idiomi; uusi käännös hebreasta, aramealaisesta ja kreikasta, ei aiemman englanninkielisen Raamatun tarkistus, American Standard Versionin lähestymistavan juurista huolimatta
fact.7.label=Julkaistu
fact.7.value=Johanneksen evankeliumi 1960, evankeliumit 1962, Uusi testamentti 1963, Psalmit 1968, koko Raamattu 1971, pieniä tekstimuutoksia 1972, 1973 ja 1975, laaja tarkistus 1977, rajoitettu tarkistus 1992, Updated Edition (NASB95) 1995, ja nykyinen vuoden 2020 teksti, josta osia ilmestyi verkossa vuodesta 2018 alkaen
fact.8.label=Lisenssi
fact.8.value=Lisensoitu, ei vapaasti käytettävä. Enintään 1 000 jaetta saa lainata missä tahansa muodossa ilman kirjallista lupaa, kunhan ne eivät muodosta kokonaista Raamatun kirjaa eivätkä enempää kuin puolta lainaavasta teoksesta, ja mukana on tekijänoikeusmaininta, joka nimeää vuodet 1960, 1971, 1977, 1995 ja 2020; sitä laajempi käyttö vaatii Lockman-säätiön luvan
fact.9.label=Tässä aineistossa
fact.9.value=Lisensoitu, ei vapaasti käytettävä, kuten [[NIV|New International Version]] — englanninkielinen käyttöliittymä avautuu oletuksena siihen laitokseen, ja tämä tavoitetaan omalta kortiltaan. Polveutumisaskelmiin ei ole kirjattu isää: vaikka säätiö kuvaa hanketta jatkeeksi [[ASV|American Standard Versionin]] kirjaimellisuudelle, se on käännetty uudestaan hebreasta, aramealaisesta ja kreikasta, ei tarkistus siitä tai mistään muusta tässä pidetystä englanninkielisestä tekstistä, niin että askelma NASB-jakeen alla johtaa suoraan alkukielen pohjalle, merkittynä ≈
