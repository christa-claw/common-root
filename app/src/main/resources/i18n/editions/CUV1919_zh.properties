title=和合本，1919年文本 — 关于此版本 | Common Root
description=和合本1919年首次出版时的文本，保留当年的字形与原本的标点，由中文维基文库转录，并附其脚注。
heroHeading=和合本 — 1919年文本
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=这就是1919年印刷时的[[CUV|和合本]]：传教士与中国学者历时二十九年译成的官话圣经，照那一年的字形定本。本阅读器中的另一部和合本，是今日所读的文本，采用现代标点与现代字形选择。这一部保留的是1919年的书页。
hero.2=字形上的差异一看便知。1919年文本使用的是后来印本已经弃用的字形——爲，而今天的版本作為；此外还有愼、册、槪——并且全文均用繁体字排印。其标点是照1919年印本转录而来，并非后来版本的现代标点。凡1919年原书将连续的经文排作一段的地方，本版也照样排列：节号保留，正文落在该段的第一节上。
hero.3=文本来自中文维基文库所做的转录，是神版（神版），其中称"神"而非"上帝"。1919年原书的脚注得以保留，在本阅读器中显示为所属经节的附注。
hero.4=加入这一文本，是为了能用一部日期与来源都确知的文本印刷中文圣经。1919年的印本早已不受版权保护。此后出现的标点本，始于1988年及以后，是另一回事，因此二者分开处理。

