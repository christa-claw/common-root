title=シノド訳聖書 — この版について | Common Root
description=1876年のロシア語シノド訳聖書：1813年にロシア聖書協会が始め、モスクワ府主教フィラレートの指導のもと正教神学アカデミー4校が完成させた翻訳で、今もロシア語話者の多くがただ「聖書」といえばこれを指す版である。
heroHeading=シノド訳聖書
readerHref=/reader?c1.src=syn

hero.1=この企ては1813年、創設されたばかりのロシア聖書協会が、皇帝アレクサンドル1世の支援を受けて、教会スラヴ語聖書に取って代わるのではなくそれと並び立つロシア語訳に着手したことに始まる。数年のうちに新約聖書が世に出た。保守的な聖職者たちは、話し言葉のロシア語による聖書を教会スラヴ語本文の権威に対する脅威とみなし、1826年、ニコライ1世は協会を解散させて作業を三十年にわたり中断させた。
hero.2=翻訳が再開されたのはアレクサンドル2世の治世になってからである。1858年、至聖主教会議は新しいロシア語訳を認可し、モスクワ、サンクトペテルブルク、カザン、キエフの神学アカデミーに作業を委ね、モスクワ府主教フィラレート（ドロズドフ）が中心となり最終的な編集を担った。「公認本文（テクストゥス・レケプトゥス）」として知られるギリシア語印刷本文から訳された新約聖書は1862年に出版された。旧約聖書はより難しい論争点だった。フィラレートは教会スラヴ語本文を越えてヘブライ語そのものに立ち返ることを主張し、教会スラヴ語本文のギリシア語的基盤を支持する者たちはこれに反対した。マソラ本文からの翻訳を認める主教会議の正式な許可が下りたのも同じ1862年のことで、その時点で旧約聖書の大部分はすでにその本文に基づいて訳し終えられていた。
hero.3=旧約聖書と新約聖書が教会スラヴ語ではなくこの新しいロシア語で初めて一冊にまとめられた完全な聖書は、1876年にシノド印刷所から出版され、この翻訳の通称はここに由来する。その旧約聖書は純粋にヘブライ語だけから成ったわけではない。教会スラヴ語の伝統が伝えてきた七十人訳がマソラ本文と食い違う箇所では、ギリシア語の読みもしばしばそのまま残され、たいていは括弧内の異読として示された。そのため完成した書物は、古い教会スラヴ語本文の背後にあったギリシア語聖書への実質的な負債を今も負っている。
hero.4=それ以来、本格的な競合相手は現れていない。ロシアの正教徒、カトリック教徒、バプテスト派、その他のプロテスタントの読者たちは、形はどうであれ皆同じ本文に拠っており、その文体は欽定訳聖書が英語に残したのと同じくらいの刻印を文語ロシア語に残した。このコーパスではこの版は66巻から成る——より範囲の広い正教の正典ではなく、プロテスタントの正典である——そしてここにある唯一のロシア語聖書であり、ロシア語インターフェースはこの版で開く。

