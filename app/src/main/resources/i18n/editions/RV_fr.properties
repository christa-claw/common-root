title=Revised Version — À propos de cette édition | Common Root
description=L’English Revised Version : la seule révision de la King James Version que l’Église d’Angleterre ait jamais autorisée, parue en trois livraisons entre 1881 et 1894 — et ici l’échelon entre la King James Version et l’American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=La Revised Version est la seule révision de la King James Version que l’Église d’Angleterre ait réellement commandée. La Convocation de Cantorbéry en décida en 1870 et nomma deux compagnies, une par Testament, réunissant plus de cinquante savants britanniques de plusieurs confessions — non pas les seuls anglicans, ce qui était en soi nouveau et fit débat. Des savants américains furent invités à y prendre part par correspondance, et le firent. La consigne était prudente : ne modifier l’Authorised Version que là où les langues originales, fidèlement rendues, l’exigeaient. Le Nouveau Testament parut en 1881, l’Ancien Testament en 1885, et les apocryphes, travaillés en dernier, en 1894.
hero.2=La consigne prudente n’empêcha pas la compagnie du Nouveau Testament de prendre la décision la plus lourde de conséquences du livre. Ils ne travaillèrent pas sur le Textus Receptus. Westcott et Hort siégeaient dans cette compagnie et lui soumirent en épreuves leur propre texte grec à mesure que le travail avançait ; ce que les réviseurs arrêtèrent fut leur propre texte éclectique et non exactement celui de Westcott et Hort, mais il se déplaça résolument vers les manuscrits onciaux les plus anciens. Placez cette édition à côté de la King James Version en deux colonnes et le déplacement saute aux yeux. En 1 Jean 5:7 la colonne King James lit « For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one », et celle-ci lit « And it is the Spirit that beareth witness, because the Spirit is the truth ».
hero.3=Ce que les réviseurs britanniques n’ont pas changé est précisément ce que les Américains voulaient le plus voir changer. Au Psaume 23:1 cette édition imprime encore « The LORD is my shepherd », exactement comme la King James Version ; l’American Standard Version au-dessus d’elle imprime « Jehovah is my shepherd ». Le nom n’apparaît ici que là où la King James Version l’avait elle-même imprimé — en Exode 6:3 les deux lisent « by my name JEHOVAH » — et le porter à travers tout l’Ancien Testament était une préférence américaine, reléguée à l’appendice par l’accord de quatorze ans et lâchée dans le texte seulement en 1901. Lire les deux colonnes ensemble est le plus court chemin pour voir ce que cet accord retenait en fait. Une seconde différence tient à la forme des phrases plutôt qu’à leur lettre : les réviseurs rompirent avec la composition d’un verset par ligne et mirent la prose en paragraphes, et la trace en subsiste ici dans des versets qui commencent par une minuscule parce qu’ils prolongent une phrase — « and I appeared unto Abraham » en Exode 6:3, là où la colonne King James commence « And I appeared ».
hero.4=La fiche de cette édition laisse l’année en blanc, et c’est la réponse honnête et non une lacune. La Revised Version ne fut pas publiée une fois mais trois, et le texte est ici celui à quatre-vingts livres : soixante-six livres plus les quatorze des apocryphes, 36 873 versets en tout, ce qui veut dire qu’il porte de la matière qui n’existait pas imprimée avant 1894. La notice du corpus l’estampille 1885, l’année où l’Ancien Testament acheva la Bible proprement dite, et c’est l’année qu’affiche la pastille de l’échelon de filiation. De quelle impression le texte descend n’est pas noté — la même lacune que le corpus laisse ouverte pour la King James Version et pour la Biblia finlandaise de 1776. On notera aussi qu’aucune interface n’ouvre sur cette édition ; une interface anglaise ouvre sur la New International Version, et c’est vers celle-ci qu’on bascule.

