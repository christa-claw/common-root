title=Lateinische Vulgata — Über diese Ausgabe | Common Root
description=Die lateinische Vulgata: die 382 in Auftrag gegebene und um 405 vollendete Übersetzung des Hieronymus, die die Bibel tausend Jahre lang durch Westeuropa trug und das erste von Gutenberg gedruckte Buch war.
heroHeading=Lateinische Vulgata
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=Gegen Ende des vierten Jahrhunderts widersprachen einander die im Westen umlaufenden lateinischen Evangelien von Abschrift zu Abschrift, und Papst Damasus I. beauftragte seinen Sekretär Hieronymus, sie zu ordnen. Hieronymus begann mit einer Revision. Am Ende wandte er mehr als zwanzig Jahre dafür auf, die meisten davon in Bethlehem, und schuf etwas, worum niemand gebeten hatte.
hero.2=Die Entscheidung, auf die es ankam, war die Übersetzung des Alten Testaments aus dem Hebräischen statt aus der griechischen Septuaginta, welche die Kirche immer benutzt hatte. Hieronymus nannte den Grundsatz “hebraica veritas” — die hebräische Wahrheit — und er war umstritten: Augustinus schrieb ihm besorgt, die Gemeinden würden aufbegehren, wenn sich vertraute Lesarten unter ihnen veränderten. Hieronymus tat es dennoch. Das Ergebnis ist der Grund, weshalb ausgerechnet eine lateinische Bibel dem Hebräischen näher steht als die griechische Bibel, welche die ersten Christen lasen.
hero.3=Sie wurde für ein Jahrtausend die Bibel Westeuropas, eine längere Laufzeit als bei jeder Übersetzung davor oder danach. Aus ihr übersetzte Wyclif ins Englische, und aus ihr arbeiteten auch die Übersetzer der Douay-Rheims — die Douay-Rheims in diesem Korpus ist also ihr direkter Nachkomme, und die Sprossen jener Ausgabe weisen hierher zurück. Sie war zudem das erste umfangreiche mit beweglichen Lettern gedruckte Buch: Die Bibel, die Gutenberg um 1455 in Mainz setzte, war dieser Text.

