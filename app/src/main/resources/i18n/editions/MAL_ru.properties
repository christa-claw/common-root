title=Муватта Малика — Об этом издании | Common Root
description=Муватта Малика: мединский свод права и хадисов имама Малика ибн Анаса, предшествующий Шести книгам суннитского ислама примерно на столетие и иногда предлагаемый на место Сунана Ибн Маджи среди них.
heroHeading=Муватта Малика
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Малик ибн Анас ибн Малик ибн Абу 'Амир аль-Асбахи аль-Мадани, известный по кунье Абу Абдуллах, родился около 93 года хиджры (711 года н. э.) в Медине и умер там в 179 году (795 году н. э.); он был похоронен на кладбище аль-Баки'. Он учился у таких учёных, как Хишам ибн Урва, Ибн Шихаб аз-Зухри, Джафар ас-Садик и Нафи' Мавля Ибн Умар, и всю жизнь преподавал в Медине, заслужив такие титулы, как Имам Дар аль-Хиджра («имам города хиджры») и Шейх аль-Ислам. Он стал эпонимом маликитской правовой школы, одной из четырёх главных правовых школ суннитского ислама; его самый известный ученик, Мухаммад ибн Идрис аш-Шафи'и — впоследствии основавший шафиитскую школу, — назвал книгу Малика «самой надёжной на земле после Корана». Аббасидский халиф аль-Мансур, как говорят, хотел сделать её единственным правовым источником империи; сам Малик отказался.
hero.2=Аль-Муватта («проторённый путь») была составлена, по преданию, на протяжении около сорока лет в начале аббасидского периода; её название, как говорят, связано с тем, что Малик показал текст семидесяти правоведам Медины, и все они согласились (вата'а) с ним. Она объединяет хадисы, приписываемые Пророку, с правовыми высказываниями его соратников и следующего поколения, а также собственными решениями Малика — по одной оценке, это самый древний сохранившийся труд, который таким образом сплавляет хадис и фикх, предшествующий Шести книгам примерно на столетие. Цифры о её объёме различаются в зависимости от редакции и способа подсчёта: часто приводимая цифра для собственно хадисов — около 1 720, тогда как Малик, как говорят, отобрал чуть менее 1 900 рассказов из 100 000, которые, по преданию, были ему доступны.
hero.3=Известно по меньшей мере шестнадцать редакций аль-Муватты. Та, что стала стандартным источником, особенно для маликитской школы, — редакция Яхьи ибн Яхьи аль-Лейси; конкурирующая редакция Ахмада ибн Абу Бакра аз-Зухри примерно на пять-десять процентов длиннее. Только к редакции аль-Лейси существует около сотни комментариев. Поскольку она предшествует Шести книгам суннитского ислама, некоторые учёные — маликиты и Ибн аль-Асир среди них — утверждают, что именно аль-Муватта, а не [[IBM|Сунан Ибн Маджи]], должна входить в этот канонический список; Сунан Ибн Маджи, как принято считать, сохранил это место потому, что его содержание меньше всего перекрывается с остальными пятью, а не потому, что он считается более надёжным.
hero.4=Арабский текст здесь — это классический матн, находящийся в общественном достоянии. Под ним в читалке расположен английский перевод, взятый из издания eng-malik сервиса fawazahmed0/hadith-api и выровненный хадис за хадисом с арабским текстом, так что их можно читать парой — то же сопутствующее расположение, которое это собрание использует для [[BUK|Сахиха аль-Бухари]], [[MUS|Сахиха Муслима]], [[ABD|Сунана Абу Дауда]], [[TIR|Джами ат-Тирмизи]], [[NAS|Сунана ан-Насаи]], [[IBM|Сунана Ибн Маджи]] и своих переводов Корана. От какого именно опубликованного английского перевода происходит этот файл, со стороны этого собрания пока не установлено, и именно поэтому его лицензия отмечена как находящаяся на проверке, а не просто как общественное достояние; арабский текст над ним такой неопределённости не несёт.

