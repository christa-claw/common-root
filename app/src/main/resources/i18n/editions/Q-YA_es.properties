title=Corán — Yusuf Ali — Acerca de esta edición | Common Root
description=La traducción de Abdullah Yusuf Ali, publicada en cuatro volúmenes entre 1934 y 1937 por un funcionario indio convertido en erudito islámico — una de solo dos traducciones inglesas del Corán halladas inequívocamente de dominio público, y en este corpus una segunda traducción inglesa complementaria junto a la de Pickthall.
heroHeading=Corán — Yusuf Ali
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=Abdullah Yusuf Ali (1872-1953) nació en Bombay y se educó primero en el Wilson College de esa ciudad, donde una formación religiosa paralela a la escolar le hizo memorizar el Corán de niño. Una licenciatura de primera clase en literatura inglesa por la Universidad de Bombay en 1891 le valió una beca de la Presidency para ir a Gran Bretaña, donde estudió derecho en el St John's College de Cambridge, graduándose con una licenciatura y un título en derecho en 1895 y regresando ese mismo año a la India con un puesto en el Servicio Civil de la India.
hero.2=Pasó casi dos décadas en el Servicio Civil —como magistrado y funcionario de hacienda, luego como juez y más tarde como subsecretario en el Departamento de Finanzas del Gobierno de la India— antes de dimitir en 1914 y establecerse en Gran Bretaña. Allí se convirtió en fideicomisario de la mezquita Shah Jehan de Woking y del fondo de la mezquita de East London, fue nombrado CBE en 1917 por su labor durante la guerra y dio clases de hindustaní en la School of Oriental Studies. Regresó a la India en los años 1920 y 1930 como director del Islamia College de Lahore, y fue a lo largo de esos años, tras más de una década de trabajo, cuando puso el Corán en inglés con sus propias notas explicativas.
hero.3=La traducción apareció en treinta entregas publicadas por fascículos entre 1934 y 1937, la primera el 4 de abril de 1934, bajo el título "The Holy Qur'an: Text, Translation and Commentary", editada por Shaik Muhammad Ashraf de Lahore; una edición combinada en un solo volumen siguió en 1938, con una edición revisada en 1939-1940. Junto con la de Pickthall, se convirtió en una de las dos traducciones inglesas del Corán más leídas del siglo XX, conocida sobre todo por la extensión de sus notas a pie de página, y desde entonces se ha reeditado, y en ocasiones retocada por otras manos, en unas treinta impresiones posteriores, entre ellas una edición distribuida en Norteamérica por Amana Publications desde 1977 y una revisión patrocinada por Arabia Saudí en los años ochenta (1980).
hero.4=Lo que se ha digitalizado aquí, a través de alquran.cloud, es el propio texto de la traducción y no el comentario que la acompaña, y se ofrece en este corpus como una segunda traducción inglesa complementaria al [[Q-AR|texto árabe uthmani]], junto a la de [[Q-EN|Pickthall]] de 1930. Fue una de solo dos versiones inglesas que un repaso de las traducciones disponibles encontró inequívocamente libres de usar —esta y la de Pickthall—, aunque "inequívocamente" necesita aquí una salvedad: la obra es de dominio público en la Unión Europea y en Pakistán, donde Yusuf Ali murió y donde se publicó por primera vez, pero un copyright pro forma registrado en Estados Unidos en 1996 se considera vigente allí hasta 2033.

