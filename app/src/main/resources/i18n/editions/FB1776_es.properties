title=Biblia 1776 — Acerca de esta edición | Common Root
description=Biblia 1776: la Biblia de la iglesia finlandesa durante siglo y medio, la primera impresa para leer en casa y todavía el libro que el finés designa cuando dice «Biblia».
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
