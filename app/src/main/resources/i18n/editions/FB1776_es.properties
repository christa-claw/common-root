# The narrative, one paragraph per key, in order.
hero.1=La tercera Biblia de Finlandia, y la que se asentó. Es una revisión y no una traducción nueva: la línea vuelve, por la revisión de Florinus de 1683–85, hasta la Biblia de 1642, la primera Biblia finesa completa. La revisión fue obra de Anders (Antti) Lizelius, que ya en 1758 había editado una Biblia propia. Lo que cambió la edición de 1776 fue la ortografía y, con ella, el alcance. Fue la primera Biblia finesa en una ortografía modernizada y la primera impresa para el uso doméstico y no solo para el atril. Una Biblia que una familia puede poseer es un objeto distinto de una Biblia que posee una parroquia. Las ediciones intermedias no fueron sólo ortografía. Henrik Florinus, preboste de Paimio, que preparó la de 1685, sabía hebreo y griego y corrigió el contenido tanto como la lengua —la redacción se movió más que la ortografía— y se considera que las ediciones intermedias hicieron trabajo de traducción desde las lenguas originales y no sólo un aseo de 1642. Quien compara 1642 con 1776 mira a través de dos revisiones, no de un cambio de ortografía.
hero.2=Mantuvo el uso de la iglesia durante siglo y medio, hasta que la Kirkkoraamattu 1933/38 la reemplazó, y no dejó de leerse cuando dejó de ser oficial. Dos movimientos de despertar dentro de la Iglesia Evangélica Luterana de Finlandia, los laestadianos y los rukoilevaiset, la conservaron y la siguen usando. Por eso la palabra Biblia a secas señala en finés a este libro y no a ninguna edición anterior o posterior, y por eso se lo llama también Vanha kirkkoraamattu, la vieja Biblia de la iglesia.
hero.3=En este lector es el centro de la cadena finesa. Abra un peldaño debajo de un versículo de la Kirkkoraamattu 1933/38 y aparece esta edición; abra uno debajo de esta y aparece la Biblia de 1642. Los dos peldaños, sin embargo, deben leerse de distinto modo. Los traductores de 1933/38 trabajaron desde el hebreo y el griego, así que el peldaño de arriba es sucesión dentro de la Biblia de una iglesia y no derivación. El de abajo es filiación real: 1776 es una revisión de 1642, y las palabras a ambos lados de ese paso están hechas para compararse.
hero.4=Una advertencia sobre el texto de este sitio: no es la impresión de 1776. Lo que hay aquí desciende de un texto digital de dominio público cuya ortografía normalizó una mano posterior y cuya historia editorial no consta: de sus 31 102 versículos exactamente uno contiene la letra w, mientras que la Biblia de 1642 tiene 26 862, y la w por v es la marca más clara de la ortografía en que se imprimió 1776. Así que 1776 modernizó la ortografía de 1642, y este texto ha vuelto a modernizarse después, lo que lo deja más lejos del libro impreso de lo que 1776 estaba de 1642. Dos especialistas en finés literario antiguo preguntaron qué versión era esta antes que ninguna otra cosa, y la pregunta era la acertada. La impresión de 1776 se conserva como imágenes de página en la colección de la época sueca de la Biblioteca Nacional de Finlandia; poner en su lugar un texto fiel es un trabajo que nos gustaría hacer.

