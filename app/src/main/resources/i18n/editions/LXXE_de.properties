title=Brentons englische Septuaginta — Über diese Ausgabe | Common Root
description=Sir Lancelot Brentons englische Übersetzung des griechischen Alten Testaments, zuerst 1844 in London erschienen und 1851 mit den Apokryphen neu aufgelegt — mehr als ein Jahrhundert lang die englische Septuaginta schlechthin und in diesem Reader die Sprosse über dem Griechischen, aus dem sie übersetzt wurde.
heroHeading=Brentons englische Septuaginta
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) war der Sohn eines Admirals der Royal Navy, Sir Jahleel Brenton, und wurde 1830, zwei Jahre nach seinem Abschluss am Oriel College in Oxford, in der Church of England ordiniert. Lange blieb er nicht. In Oxford hatte er John Nelson Darby kennengelernt, und Ende 1831 hatte er die Staatskirche verlassen, um in Bath eine unabhängige Kapelle zu gründen; 1835 stand diese Kapelle den Plymouth-Brüdern nahe, der Bewegung, die Darby damals prägte. Darbys eigene Bibeln sind ebenfalls in diesem Korpus, auf Französisch und auf Englisch. 1844 erbte Brenton den Baronetstitel seines Vaters, und im selben Jahr veröffentlichten Samuel Bagster and Sons in London seine Übersetzung der Septuaginta. Er starb 1862 auf der Isle of Wight, kinderlos, als letzter Baronet seiner Linie.
hero.2=Sie war nicht die erste englische Septuaginta – Charles Thomson hatte 1808 in Philadelphia eine veröffentlicht –, aber sie war die, die blieb: Mehr als anderthalb Jahrhunderte lang, bis 2007 die New English Translation of the Septuagint erschien, las ein englischer Leser, der das griechische Alte Testament statt des hebräischen wollte, Brenton. Er übersetzte vor allem nach dem Codex Vaticanus, der Handschrift des vierten Jahrhunderts in der Vatikanischen Bibliothek. Die erste Ausgabe ließ die Apokryphen weg; die Ausgabe von 1851 fügte sie hinzu, und diese Abschrift gibt den Text von 1851 wieder. Bagsters griechisch-englische Ausgaben setzten das Griechische neben das Englische, und dieses Griechisch steht in diesem Korpus als eigene Ausgabe. Weil das Englische dem Griechischen folgt, liest es, wo das Griechische liest: Die Psalmen behalten die griechische Zählung, sodass Psalm 22 hier der Hirtenpsalm ist, und in Jesaja 7,14 gibt „a virgin shall conceive“ das griechische parthenos wieder, nicht das hebräische ʿalmah.
hero.3=In diesem Reader ist sie eine Sprosse mit einer einzigen, buchstäblichen Vorlage: Die griechische Septuaginta unter ihr ist der Text, den Brenton übersetzte, von seinem eigenen Verleger neben sein Englisch gedruckt. Öffnet man unter einem ihrer Verse eine Sprosse, erscheint das Griechische, und darunter der Codex Leningradensis als Boden der Ursprachen. Auf ihr selbst steht im Korpus nichts. Unsere Abschrift ist schmaler als das Buch. Sie hat 37 Bücher, jene, die auch der hebräische Kanon unter ihren gewohnten Namen hat. Die Dateien von eBible.org, aus denen sie stammt, enthalten auch die Apokryphen – Tobit, Judit, Weisheit, Jesus Sirach, Baruch, vier Makkabäerbücher und mehr – und geben Ester und Daniel nur in ihrer längeren griechischen Gestalt. Nichts davon ist im Korpus angekommen, also gibt es hier weder Ester noch Daniel, und wo das Griechische darunter Tobit oder die Weisheit hat, steht kein Englisch darüber. Esra und Nehemia stehen als zwei Bücher, wo das Griechische darunter eines hat. Eine Rechtschreibbearbeitung derselben Übersetzung, Adam Boyds Updated Brenton von 2020, ist als eigene Ausgabe im Korpus.

