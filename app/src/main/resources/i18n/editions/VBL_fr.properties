title=Versión Biblia Libre — À propos de cette édition | Common Root
description=Versión Biblia Libre : une Bible espagnole de Free Bible Ministry, traduite par Jonathan Gallagher et Shelly Barrios de Avila comme pendant espagnol de la Free Bible Version anglaise, et librement cédée sous licence pour tout usage.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — « la version libre de la Bible » — est le pendant en espagnol de la Free Bible Version anglaise, publiée par le même éditeur, Free Bible Ministry, une association à but non lucratif basée à Laurel, dans le Maryland. Son Nouveau Testament est attribué aux traducteurs Jonathan Gallagher et Shelly Barrios de Avila, avec Gustavo Sanabria et Rebekah Põldaas comme collaborateurs, et porte des droits d'auteur datés de 2018–2020 au nom de Gallagher et Barrios de Avila. Comme son pendant anglais, elle existe pour écarter la page de droits d'auteur comme obstacle à l'usage : le texte peut être copié, imprimé, publié en ligne ou adapté par quiconque, sans redevance ni permission à demander.
hero.2=Les pages liminaires publiées documentent clairement la base du Nouveau Testament — traduit directement du texte grec de Nestle–Aland, le texte critique dont se servent les sociétés bibliques — mais ne nomment pas séparément de texte source pour l'Ancien Testament, alors même que l'édition que détient ce corpus est le canon protestant complet de soixante-six livres. Là où les documents laissent un vide, il est laissé ici aussi, plutôt que comblé par une supposition.
hero.3=Dans ce lecteur, elle est l'une des cinq éditions espagnoles. L'interface espagnole ouvre toujours par défaut la [[RVR09|Reina-Valera 1909]], un texte du domaine public issu d'une tradition entièrement distincte et vieille de plusieurs siècles ; cette édition est atteinte au contraire depuis sa propre fiche, aux côtés de [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] et [[NBLA|Nueva Biblia de las Américas]]. Elle n'est la révision d'aucune d'elles, de sorte qu'aucun texte source ne lui est enregistré dans les échelons de filiation — un échelon ouvert sous l'un de ses versets tombe directement sur le sol des langues originales marqué d'un ≈. Son plus proche parent dans ce corpus n'est pas espagnol du tout : [[FBV|la Free Bible Version]], la traduction anglaise du même ministère, sous la même licence.

