title=Diodati 1885 (italia) — Tietoja tästä laitoksesta | Common Root
description=Giovanni Diodatin italiankielinen Raamattu 1800-luvun asussaan: hänen vuoden 1641 tekstinsä vuoden 1821 tarkistuksena, laitoksessa, joka on päivätty 1885 — sama käännös kuin tämän aineiston toinen Diodati, mutta jaettuna jakeisiin toisin.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Tämä on Giovanni Diodatin käännös — luccalaissukuisen geneveläisen, joka syntyi 1576 ja julkaisi 1607 ensimmäisen hepreasta ja kreikasta eikä latinasta tehdyn italiankielisen Raamatun ja tarkisti sen omin selityksin 1641, kahdeksan vuotta ennen kuolemaansa. Aineiston toisella Diodatilla on oma sivunsa, joka kertoo tuon tarinan. Kahden vuosisadan ajan hänen jälkeensä teksti eli uusintapainoksina, ja vuodesta 1808 Brittiläinen ja ulkomainen raamattuseura julkaisi sitä laitos laitoksen perään, koska italialaisille protestanteille ei ollut muuta painettavaa.
hero.2=Tämä tiedosto on yksi noista myöhemmistä asuista. eBible.org, joka toimittaa sen Yhtyneiden raamattuseurojen puolesta, kuvaa sitä Diodatin vuoden 1641 käännökseksi, joka tarkistettiin 1821, laitoksessa, joka on päivätty 1885. Kuka vuoden 1821 tarkistuksen teki ja mikä kirjapaino painoi vuoden 1885 laitoksen, sitä tämä hanke ei ole selvittänyt, joten sivu ei nimeä heitä. Vuosiluku ei ole sama ongelma kuin toisessa Diodatissa, jonka merkintä on Diodatin kuolinvuosi: 1885 on laitoksen oma vuosi, luettelo tallentaa sen, ja askelmamerkintä näyttää sen.
hero.3=Toisen Diodatin rinnalla sanamuoto on sama jokaisessa pistokokeessa: ”il Signore è il mio pastore” psalmissa 23, ”la Vergine concepirà” Jesajan 7:14:ssa, taivaalliset todistajat 1. Joh. 5:7:ssä, ylistys Isä meidän -rukouksen lopussa, Apostolien tekojen 8:37 kokonaisena. Jumalan nimi on ”il Signore”, Herra, kuten Diodati sen kirjoitti; vasta Riveduta, tämän tekstin vuonna 1924 julkaistu tarkistus, muutti sen muotoon ”l'Eterno”. Ero on jakeistuksessa. Yli kolmessakymmenessä kohdassa tämä kappale noudattaa toista, heprealaista lähellä olevaa järjestelmää — Joonan rukous alkaa jakeesta 2:1 ja luku jatkuu jakeeseen 2:11, Jesajan 8. luvussa on 23. jae, Jobin 39. luku jatkuu jakeeseen 38, ja Kolossalaiskirjeen 4. luvun ensimmäinen jae on 3. luvun lopussa — joten jakeita on kaikkiaan seitsemän vähemmän. Eikä tässä kappaleessa ole yhtään psalmin otsikkoa: psalmi 51 alkaa suoraan sanoista ”Abbi pietà di me, o Dio”, kun toinen Diodati liittää otsikon ensimmäiseen jakeeseen. eBible.orgin oma esitys tästä tekstistä näyttää otsikot, joten ne katosivat todennäköisimmin tämän hankkeen tuonnissa eivätkä puutu vuoden 1885 painoksesta.
hero.4=Tässä lukuohjelmassa se on yksi kolmesta italiankielisestä Raamatusta. Italiankielinen käyttöliittymä avaa toisen Diodatin, Diodati 1649:n, joka on luettelojärjestyksessä ensimmäinen, koska italialle ei ole valittu poimintaa. Polveutumisaskelmiin ei ole kirjattu sille kantatekstiä — ei edes tuota saman käännöksen toista kappaletta — joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukieliseen pohjaan. Kuten toisessa Diodatissa, Textus Receptus on siellä lähellä totuutta: Diodati työskenteli Bezan painetun kreikan pohjalta, joka kuuluu tuohon perheeseen.

