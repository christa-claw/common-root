title=Douay-Rheims 1899 — Bu Baskı Hakkında | Common Root
description=Douay-Rheims Kutsal Kitabı: Latince Vulgata'dan 1582'de Reims'te ve 1609–10'da Douai'de yapılan İngilizce Katolik çeviri; Piskopos Challoner'ın gözden geçirmesiyle, 1899 Baltimore baskısında.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=1568'de, çoğu artık görevlerini koruyamayan Oxford'lu bilginlerden oluşan bir İngiliz Katolik topluluğu, William Allen'ın yönetiminde Flandre'daki Douai'de bir kolej kurdu. Varlık sebeplerinden biri, İngilizce bir Kutsal Kitabı Katolik ellere ulaştırmaktı; çünkü o sırada dolaşımdaki tek İngilizce Kutsal Kitaplar Protestandı ve tartışmada kullanılıyordu. Gregory Martin çeviriye Ekim 1578'de, günde yaklaşık iki bölüm hızıyla başladı ve Yeni Antlaşma 1582'de, kolejin geçici olarak taşındığı Reims'te yayımlandı. Martin aynı yılın 28 Ekim'inde, Yeni Antlaşma'sının çıkışından haftalar sonra öldü. Eski Antlaşma aynı anda hazırdı ve sonra basılmadan kaldı; sebebi yalındı: kolejin onu bastıracak parası yoktu. Sonunda 1609 ve 1610'da iki cilt hâlinde çıktı; Kral James Çevirisi'ne iki yıl kalmıştı.
hero.2=Onu bu derlemedeki her başka İngilizce Kutsal Kitaptan ayıran şey, neyden yapıldığıdır. İbranice ve Yunanca'dan değil: Latince Vulgata'dan. Trento Konsili Vulgata'yı Kilise'nin güvenilir metni ilan etmişti; Douai çevirmenleri ayrıca Hieronymus'un, ellerindeki herhangi bir Yunanca kopyadan daha eski elyazmalarından çalıştığını öne sürüyorlardı — ki Eski Antlaşma için bu, 1600 dolaylarında akla aykırı bir düşünce değildi. Ortaya çıkan düzyazı ağır Latince yüklüdür, kimi yerde İngilizce olmaktan büsbütün çıkacak kadar: Rab'bin Duası “supersubstantial bread” diler, çünkü çevirmenler ilahiyatın üzerine dayandığı bir sözcüğü yerlileştirmek istemediler. Bu bir ilkeydi, bir yetersizlik değil.
hero.3=On sekizinci yüzyılın ortasına gelindiğinde onu neredeyse kimse okuyamıyordu ve Piskopos Richard Challoner 1749 ile 1752 arasında onu gözden geçirdi — köklü biçimde ve büyük ölçüde Kral James Çevirisi yönünde; çünkü o tarihte İngilizce kutsal metnin sesi zaten oydu. Bugün Douay-Rheims adıyla satılan her kitap Martin'in değil Challoner'ın metnidir. Buradaki, Baltimore'daki John Murphy Company'nin 1899 tarihli Amerikan baskısıdır ve Kardinal James Gibbons'ın imprimatur'unu taşır; o baskı çoktandır telif hakkından muaf olduğu için, o günden beri taranan, dizilen ve çoğaltılan odur ve neredeyse her dijital Douay-Rheims aslında budur.
hero.4=Bu okuyucuda, buradaki hemen hemen hiçbir baskının yapamadığı bir şeyi yapar. Kayıtlı kaynağı derlemede mevcuttur: bir Douay-Rheims ayetinin altında bir soy basamağı açın, alttaki basamak Latince Vulgata'nın kendisidir — gerçekten çevrildiği metin — çoğu baskının düştüğü ≈ işaretli özgün dil tabanı değil. Basamak düzeneği tam da bu durum için kurulmuştu. Etki ters yönde de işledi: Reims Yeni Antlaşma'sı Kral James çevirmenlerinin masalarındaydı ve Latince kökenli söz varlığının hatırı sayılır bir bölümü onların işine geçti — ama soy listesi yalnızca biçimsel gözden geçirme çizgilerini tutar, dolayısıyla bu borç orada kayıtlı değildir. Bir tersliği not etmek gerek: basamak etiketi 1899 yılını gösterirken katalog kartı hiçbir yıl göstermez. Basamak yılları elle derlenmiş ayrı bir listedir, kart ise kataloğun kendi üstverisini okur; bir baskı birinde bulunup ötekinde bulunmadığında ikisi açıkça çelişir.
hero.5=Kanon konusunda bir uyarı. Burada tutulan metinde 72 kitap vardır, basılı bir Katolik Kutsal Kitabındaki 73 değil. Taşıdığı altı deuterokanonik kitap — Tobit, Yudit, 1. ve 2. Makabeler, Bilgelik ve Sirak — Katolik konumlarında değil, Vahiy'den sonra yer alır ve Baruk büsbütün yoktur. Bu, 1899 kitabının değil, dijital metnin alındığı hâlinin bir özelliğidir; yani bu sütun ayet ayet doğru okunur ama Katolik kanonunun neleri içerdiğini denetlemek için kullanılmamalıdır.

