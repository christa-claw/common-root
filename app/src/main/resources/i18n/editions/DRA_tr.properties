fact.2.value=Latince Vulgata'dan, İbranice ve Yunanca'dan değil — bu derlemenin taşıdığı aynı [[VUL|Vulgata]]
fact.3.label=Yeni Antlaşma
fact.3.value=Reims, 1582 — başlıca Gregory Martin'in işi; yanında William Allen, Richard Bristow ve Thomas Worthington
fact.4.label=Eski Antlaşma
fact.4.value=Douai, 1609 ve 1610, iki cilt — Yeni Antlaşma ile aynı anda bitti ama basacak para bulunmadığı için otuz yıla yakın bekletildi
fact.5.label=Gözden geçiren
fact.5.value=Piskopos Richard Challoner, 1749–1752 — bugün Douay-Rheims adıyla satılan her kitap Challoner'ın gözden geçirmesidir, 1582/1610 metni değil
fact.6.label=Bu baskı
fact.6.value=John Murphy Company'nin 1899 tarihli Amerikan baskısı, Baltimore, Kardinal James Gibbons'ın imprimatur'uyla — çoktandır telif hakkından muaf ve dijital olarak dolaşan sürüm budur
fact.7.label=Buradaki içerik
fact.7.value=72 kitap: Protestan kanonunun 66 kitabı Protestan sırasıyla, ardından Vahiy'den sonra eklenmiş Tobit, Yudit, 1. ve 2. Makabeler, Bilgelik ve Sirak. Baruk yoktur, dolayısıyla bu sütun Katolik kanonu için güvenilir bir denetim değildir
fact.8.label=Soy
fact.8.value=kayıtlı kaynağı derlemenin kendi içinde bulunan buradaki birkaç baskıdan biri — bir Douay-Rheims ayetinin altındaki basamak, özgün dil tabanına değil [[VUL|Latince Vulgata]]'ya açılır
fact.9.label=Bu derlemede
fact.9.value=basamak etiketi 1899 yılını taşır, oysa katalog kartı yılı boş bırakır; basamak yılları ayrı ve elle derlenmiş bir listedir ve ikisinin çelişmesine izin verilir
