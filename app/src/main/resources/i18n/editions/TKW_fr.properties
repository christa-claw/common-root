title=Textbibel 1906 — À propos de cette édition | Common Root
description=La Textbibel de Kautzsch et Weizsäcker : une Bible allemande de savants, traduite à neuf de l'hébreu et du grec et publiée pour la première fois en un seul volume à Tübingen en 1899 ; le texte présenté ici est daté de 1906.
heroHeading=Textbibel 1906
readerHref=/reader?c1.src=tkw

# The narrative, one paragraph per key, in order.
hero.1=Deux professeurs, deux Testaments. Carl Weizsäcker (1822–1899) était historien de l'Église à Tübingen, où il succéda à Ferdinand Christian Baur dans sa chaire en 1861 et fut chancelier de l'université à partir de 1889. Sa traduction du Nouveau Testament parut pour la première fois en 1875 et connut neuf éditions de son vivant, la dernière préparée sur son lit de mort. Emil Kautzsch (1841–1910) était un spécialiste de l'Ancien Testament qui enseigna à Leipzig, Bâle et Tübingen avant de s'établir à Halle en 1888 ; son Ancien Testament, traduit avec un groupe de collègues spécialistes, parut complet en 1894.
hero.2=En 1899, l'année de la mort de Weizsäcker, les deux furent réunis en un seul volume, la Textbibel des Alten und Neuen Testaments, publiée à Tübingen par J.C.B. Mohr (Paul Siebeck). Le nom dit ce qu'elle est : le texte nu, pour des lecteurs qui voulaient savoir ce que disent l'hébreu et le grec, dans l'allemand de leur temps. Elle n'a jamais prétendu remplacer Luther. Weizsäcker évita délibérément la langue de Luther et chercha plutôt à rendre l'impression que l'original fit sur ses premiers lecteurs ; son biographe jugeait peu probable qu'elle devienne jamais un livre populaire, et elle ne le devint pas. Elle fut réimprimée jusque dans les années 1910. Le texte numérique présenté ici est daté de 1906 ; de quelle édition relevait ce tirage, ce projet ne l'a pas établi.
hero.3=Elle se lit comme la science de son époque. Le nom divin dans l'Ancien Testament est « Jahwe » — « Jahwe ist mein Hirte » au Psaume 23 —, des milliers de fois, là où Luther a « der Herr ». Ésaïe 7,14 porte « ein junges Weib », une jeune femme. Dans le Nouveau Testament, le Notre Père de Matthieu 6,13 s'achève sans la doxologie, et 1 Jean 5,7 n'a pas de témoins célestes. L'Ancien Testament garde les chapitres et versets hébreux : les titres des psaumes entrent dans la numérotation, si bien que le Psaume 51 compte 21 versets, et Malachie a trois chapitres au lieu de quatre. L'orthographe est plus ancienne que la date ne le laisse croire — en Jean 8,1, Jésus « gieng » au mont des Oliviers.
hero.4=Dans ce lecteur, c'est l'une des quatre bibles allemandes, à côté de l'Elberfelder et des textes de Luther de 1545 et de 1912. Une interface en allemand ne s'ouvre pas sur elle : l'allemand n'a pas de choix curaté, si bien que le lecteur prend la première bible allemande du catalogue, qui est l'Elberfelder. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation, ce qui convient à une traduction faite sur les originaux : un échelon ouvert sous un verset tombe droit sur le plancher des langues originales marqué de ≈ — le Codex de Léningrad de Westminster pour l'Ancien Testament et, pour le Nouveau, le Textus Receptus, un grec que cette traduction ne suit pas, comme le montre 1 Jean 5,7.

