title=Darby 1885 (francese) — Su questa edizione | Common Root
description=La Bibbia Darby francese del 1885: la traduzione di Pau e Vevey, iniziata nel 1859 da John Nelson Darby e dai suoi collaboratori e finita tre anni dopo la sua morte, e la versione da cui fu poi costruito il suo Antico Testamento inglese.
heroHeading=Darby 1885 (francese)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=John Nelson Darby è ricordato per altro — lasciò la Chiesa d'Irlanda, concorse a fondare i Fratelli di Plymouth e mise in circolazione il premillenarismo dispensazionalista —, ma passò gran parte della vita a tradurre la Bibbia, e lo fece in tre lingue. L'insolito, in lui, è l'ordine. La maggior parte dei traduttori lavora verso l'esterno partendo dalla propria lingua. La Bibbia inglese di Darby fu l'ultima delle tre a essere finita, e il suo Antico Testamento non lo fece lui direttamente dall'ebraico, bensì dalle versioni francese e tedesca che aveva già prodotto con altri.
hero.2=Questa è la francese. Darby ne fu lo studioso principale ma non fu mai l'unico traduttore di nulla che porti il suo nome; della squadra francese facevano parte William Joseph Lowe e Pierre Schlumberger. Il Nuovo Testamento uscì nel 1859 e fu ristampato tre volte nei due decenni seguenti. La Bibbia completa apparve nel 1885 a Pau e a Vevey — di qui il nome con cui la si conosce di solito — benché il frontespizio inganni un poco: Pau sta all'estremo sud della Francia, e il lavoro fu fatto soprattutto per le assemblee dei Fratelli della Svizzera francese. Darby era morto nel 1882, sicché non vide mai il libro finito.
hero.3=La traduzione è letterale per principio, e Darby ne disse apertamente la ragione nella prefazione al suo Nuovo Testamento tedesco: il dotto può consultare l'originale, sicché lo scopo di una traduzione è mettere una rappresentazione quanto più esatta possibile di esso nelle mani di chi non lo può. Avvertiva anche che una resa più libera perde significati che il traduttore stesso può non aver colto. Il risultato è esatto e disadorno, e non fu mai pensato per la lettura ad alta voce — nella propria predicazione Darby usava la King James Version.
hero.4=Due cose la legano al resto di questo corpus. La Bibbia Darby tedesca è l'Elberfelder, presente qui come Elberfelder 1905 — lo stesso uomo, gli stessi principi, e uno dei due testi da cui fu assemblato il suo Antico Testamento inglese, sicché queste due schede, la francese e la tedesca, sono parenti più stretti di quanto le lingue diverse lascino supporre. E il suo trattamento del nome divino la mette accanto alla American Standard Version, che stampa “Jehovah” migliaia di volte là dove la King James Version stampa “the LORD”; Darby prese la stessa decisione per primo, in tre lingue. Nel lettore è l'unica Bibbia francese, sicché un'interfaccia francese si apre su di essa. Nei pioli della discendenza non le è registrato alcun antecedente e, a differenza della maggior parte delle edizioni datate presenti qui, il suo segno di piolo non porta anno alcuno — la scheda di catalogo mostra 1885, ma gli anni dei pioli sono un elenco a parte curato a mano, e questa edizione non vi figura ancora.

