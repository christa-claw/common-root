fact.3.label=Studioso principale
fact.3.value=John Nelson Darby (1800–1882), in lavoro con William Joseph Lowe e Pierre Schlumberger — non fu l'unico traduttore di nessuna delle versioni che portano il suo nome
fact.4.label=Nuovo Testamento
fact.4.value=uscito la prima volta nel 1859, ristampato nel 1872, nel 1875 e nel 1878
fact.5.label=Bibbia completa
fact.5.value=1885, pubblicata a Pau e a Vevey — tre anni dopo la morte di Darby
fact.6.label=Fatta per
fact.6.value=le assemblee dei Fratelli, soprattutto quelle della Svizzera francese più che quelle di Pau stessa
fact.7.label=Genere di traduzione
fact.7.value=deliberatamente letterale, fatta per lo studio privato più che per la lettura ad alta voce; il nome divino è reso «l'Éternel» e non lasciato «le Seigneur»
fact.8.label=Versioni sorelle
fact.8.value=la Bibbia Darby tedesca è l'Elberfelder, in questo corpus come [[ELB|Elberfelder 1905]]; l'Antico Testamento Darby inglese fu fatto dal lavoro francese e tedesco, non direttamente dall'inglese proprio di Darby
