fact.5.label=שיטה
fact.5.value=כל חדית׳ נבחר ככזה שהוא, בלשון אלנוואוי, "יסוד גדול" (קאעדה עט׳ימה) של הדת; המשך למסורת קדומה יותר של "ארבעים חדית׳ים" (ארבעיניאת), שהאוסף הראשון והידוע שבה, שאבד, מיוחס לעבדאללה בן אלמובארכ (נפ׳ 797)
fact.6.label=מעמד
fact.6.value=נמנה בהרחבה עם החיבורים הנקראים ביותר באסלאם הסוני אחרי הקוראן עצמו; נושא לעשרות פירושים, המפורסם בהם ג׳אמע אלעלום ואלחכם של אבן רג׳ב אלחנבלי
fact.7.label=מספר החדית׳
