title=הארבעים של אלנוואוי — על מהדורה זו | Common Root
description=הארבעים של אלנוואוי: 42 חדית׳ים שבחר האִמאם אלנוואוי, כל אחד מהם נתפס כ"יסוד גדול" (קאעדה עט׳ימה) של הדת — החיבור הנקרא ביותר בסוגת "ארבעים החדית׳ים".
heroHeading=הארבעים של אלנוואוי
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=יחיא בן שרף אלנוואוי נולד בחודש מוחרם בשנת 631 להג׳רה (אוקטובר 1233) בנווא, סמוך לדרעא שבסוריה, ועבר בגיל שמונה־עשרה לדמשק ללמוד. בשנת 665 להג׳רה (1267) התמנה לעמוד בראש בית המדרש לחדית׳ "אלאשרפיה" בדמשק, תפקיד שמילא עד מותו בנווא בשנת 676 להג׳רה (1277), באמצע שנות הארבעים לחייו; הוא נקבר שם. כפוסק שאפעי, כתב בחייו הקצרים חיבורים רבים — בהם ריאד אלצאלחין, פירושו לצחיח מוסלם הידוע כ"אלמנהאג׳", אלמג׳מוע שרח אלמוהד׳ב, מנהאג׳ אלטאלבין וכתאב אלאד׳כאר.
hero.2=הארבעים של אלנוואוי ממשיכה מסורת קדומה יותר של אוספי "ארבעים חדית׳ים" (ארבעיניאת), שיסודה בחדית׳ המבטיח למי שישמור לבני אומתו ארבעים חדית׳ים בענייני הדת מקום בין החכמים ביום הדין — חדית׳ שרוב המבקרים מסווגים אותו עצמו כחלש (צ׳עיף). האוסף הראשון מסוג זה, שאבד, מיוחס לעבדאללה בן אלמובארכ (נפ׳ 797); חכמים רבים חיברו אחריו אוספים משל עצמם. אלנוואוי בחר חדית׳ים שראה בהם חדית׳ים מהימנים, רובם מ[[BUK|צחיח אלבוכ׳ארי]] ומ[[MUS|צחיח מוסלם]], כל אחד מהם מדגים את מה שקרא לו "יסוד גדול" (קאעדה עט׳ימה) של הדת — ולמרות שמו, האוסף כפי שהוא מונה היום ארבעים ושניים חדית׳ים. הוא הפך לחיבור הנקרא ביותר בסוגתו, זכה לעשרות פירושים, המפורסם בהם ג׳אמע אלעלום ואלחכם של אבן רג׳ב אלחנבלי, ונמנה עם החיבורים הנקראים ביותר באסלאם הסוני אחרי הקוראן עצמו.
hero.3=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-nawawi של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אלבוכ׳ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג׳אמע אלתרמד׳י]], [[NAS|סונן אלנסאאי]], [[IBM|סונן אבן מאג׳ה]], [[MAL|מואטא של מאלכ]] ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

