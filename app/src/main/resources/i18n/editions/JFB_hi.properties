title=जापानी Freedom Bible — इस संस्करण के बारे में | Common Root
description=जापानी Freedom Bible (フリーダム・バイブル): 66 पुस्तकों वाली एक सम्पूर्ण जापानी बाइबिल, जिसे eBible.org बिना किसी कॉपीराइट के एक अनुवाद-मसौदे के रूप में वितरित करता है — इस संग्रह की एकमात्र जापानी बाइबिल, इसलिए जापानी इंटरफ़ेस इसी पर खुलता है।
heroHeading=जापानी Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=जापानी Freedom Bible — जापानी में フリーダム・バイブル — एक सम्पूर्ण जापानी बाइबिल है, जिसे eBible.org वितरित करता है और जो स्वयं को इस अनुवाद का आधिकारिक वितरक बताता है। यह बहुत नई है: इस संग्रह में रखी स्रोत फ़ाइलों की तिथि 19 अगस्त 2026 है, और इसके कार्ड पर लिखा 2026 उन्हीं फ़ाइलों की तिथि है। eBible कोई अलग प्रकाशन-तिथि नहीं देता, और यहाँ भी कोई तिथि नहीं ठहराई जाती।
hero.2=इसके बारे में बहुत कुछ दर्ज नहीं है, और यह साफ़-साफ़ कहना उचित है। eBible के पृष्ठ न किसी अनुवादक का नाम लेते हैं, न किसी समिति का, न किसी प्रकाशक का; और न यह बताते हैं कि अनुवाद किस पाठ से किया गया — सीधे इब्रानी और यूनानी से, या किसी दूसरे आधुनिक अनुवाद के माध्यम से। इसका अपना कॉपीराइट पृष्ठ इसे अनुवाद का मसौदा (翻訳の草案) कहता है और सुधार के सुझाव आमंत्रित करता है; इसलिए यहाँ का पाठ किसी स्थिर संस्करण का नहीं, बल्कि चल रहे काम का एक क्षणचित्र है।
hero.3=जो स्पष्ट है, वह इसकी क़ानूनी स्थिति है: वही पृष्ठ कहता है कि इस अनुवाद पर कोई कॉपीराइट नहीं रखा गया है, और इसे सार्वजनिक अधिकार-क्षेत्र में बताता है। इसी कारण यहाँ का जापानी पाठ यही है — eBible पर कॉपीराइट से मुक्त सम्पूर्ण जापानी बाइबिल केवल यही थी। वह पुरानी जापानी बाइबिल जो इसे एक वंश-परम्परा दे सकती थी — 1887 में पूर्ण हुआ मेइजी-काल का अनुवाद, जो बहुत पहले से सार्वजनिक अधिकार-क्षेत्र में है — उस स्रोत से उपलब्ध नहीं है।
hero.4=इस संग्रह में इसमें प्रोटेस्टेंट सिद्धांत-सूची की 66 पुस्तकें और 31,098 पद हैं, कोई द्वितीयक-विहित पुस्तक नहीं। इसका कोई जनक पाठ दर्ज नहीं है, इसलिए इसके किसी पद के नीचे एक पायदान खोलने पर आप सीधे उस मूल-भाषा तल पर पहुँचते हैं जो ≈ से चिह्नित है: वहाँ दिखने वाली इब्रानी और यूनानी साक्षी हैं, इस बात का दावा नहीं कि इसका अनुवाद किससे हुआ — और जब इसका स्रोत अज्ञात है, तो यही ईमानदार पढ़ना है। यह संग्रह की एकमात्र जापानी बाइबिल है, इसलिए जापानी इंटरफ़ेस डिफ़ॉल्ट रूप से इसी पर खुलता है।

