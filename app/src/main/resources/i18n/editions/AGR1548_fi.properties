title=Agricola 1548 — Tietoja tästä laitoksesta | Common Root
description=Mikael Agricolan suomennokset: Se Wsi Testamenti 1548, Dauidin Psaltari 1551 ja profeetat — ensimmäinen painettu suomenkielinen Raamatun teksti ja kirjoitetun suomen alku.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Kiitokset heille, jotka lähettivät korjauksia tähän sivuun.

# The narrative, one paragraph per key, in order.
hero.1=Vanhinta painettua suomea mitä on. Kun Mikael Agricola julkaisi Uuden testamentin (Se Wsi Testamenti) vuonna 1548, suomea ei ollut juuri koskaan ladottu kirjaimiksi — hänen oma muutamaa vuotta varhaisempi ABC-kiriansa oli ylipäätään ensimmäinen suomenkielinen kirja. Niiden välissä ilmestyi vielä rukouskirja (1544), tekstimäärältään suuri teos, jossa oli jo psalmikäännöksiä. Ennen kuin pyhää tekstiä saattoi painaa, oli päätettävä, miten kieltä kirjoitetaan, ja ne päätökset — oikeinkirjoitus, lainasanat, poljento — ovat kirjoitetun suomen alku. Uusi testamentti vei Agricolalta ja hänen turkulaiselta piiriltään toistakymmentä vuotta; Psalttari seurasi 1551 ja valikoimat profeetoista ja Mooseksen kirjoista 1551 ja 1552. Hänen suomensa oli kuitenkin ensimmäistä painettua suomea, ei ensimmäistä kirjoitettua: neljä käsikirjoitusta — Codex Westh, Uppsalan koodeksi B 28, Kangasalan messukirja ja Uppsalan katkelma — sisältää suomenkielisiä raamatunkohtia, ja Kauko Pirinen osoitti 1988 vertaamalla niitä ruotsalaisiin lähteisiinsä, että osa niistä on vanhempaa kuin mikään Agricolan painattama, ehkä jo 1530-luvulla kirjoitettua.
hero.2=Koko Raamattua hän ei koskaan suomentanut, eikä tämä lukija väitä toisin. Uusi testamentti ja kaikki 150 psalmia ovat täydelliset; profeetat ja Mooseksen kirjat ovat mukana valikoiden. Mukana on myös se, minkä hän käänsi muualla: vuoden 1544 rukouskirjassa sekä vuoden 1549 Käsikirjassa ja Messussa on omaa raamatuntekstiä — muun muassa ne 1. Mooseksen kirjan luvut, jotka on painettu otsikolla "Genesist mutomat Lughut" — ja 685 jaetta on peräisin niistä. Niitä on käytetty vain siellä, missä raamatunkäännöksissä ei ole jaetta samassa kohdassa, ja vain silloin kun teksti jatkuu yhtenäisenä eikä ole yksittäinen lainaus rukouksen sisällä. Niinpä 1. Mooseksen kirja on sittenkin mukana, osittain: luvut 1–4, 22, 28 ja 32. Tuomarien kirja, Ruut, 1. Aikakirja ja Ester puuttuvat kokonaan. Täydellinen suomenkielinen Vanha testamentti sai odottaa vuoden 1642 Bibliaa, yhtä askelmaa ylempänä ketjussa.
hero.3=Tässä lukijassa Agricola on suomalaisen ketjun vanhin askelma. Avaa yksi askelma vuoden 1642 Biblian jakeen alta, ja hänen tekstinsä ilmestyy Lutherin saksan rinnalle — ne kaksi lähdettä, jotka 1642:n komitealla todella oli auki. Agricolan itsensä alapuolella ketju jättää suomen lopullisesti: hän työskenteli Erasmuksen kreikan ja sen rinnalle painetun Erasmuksen latinannoksen, Lutherin saksan ja Vulgatan varassa. Näistä kolme on merkitty tänne hänen vanhemmikseen; Erasmuksen latina ja Kustaa Vaasan ruotsinkielinen kokoraamattu vuodelta 1541, jota hän myös käytti, eivät ole tässä aineistossa. Teksti on Kotuksen VKS-korpuksen, vuoden 1548 painatuksen omalla kirjoitusasulla: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". Ruotsinkielistä Raamattua oli ollut painettuna vuodesta 1526, jolloin ilmestyi ruotsinkielinen Uusi testamentti, joten ruotsinnos oli hänen käytettävissään alusta asti.

