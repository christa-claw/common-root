title=Emphatic Diaglott (Interlinear) — Über diese Ausgabe | Common Root
description=Benjamin Wilsons Emphatic Diaglott von 1864: die Wort-für-Wort-Glosse auf Englisch, unter Griesbachs Griechisch gedruckt, später von der Wachtturm-Gesellschaft erworben und sechzig Jahre lang nachgedruckt — und der Text, um den der Streit über Joh 1,1 gewöhnlich geführt wird.
heroHeading=Emphatic Diaglott (Interlinear)
readerHref=/reader?c1.src=diagil

# The narrative, one paragraph per key, in order.
hero.1=Benjamin Wilson war kein Fachgelehrter. Er war Zeitungsredakteur in Geneva, Illinois, brachte sich Griechisch selbst bei und gab zwischen 1857 und 1863 in Lieferungen ein interlineares Neues Testament heraus, das er nicht nur übersetzt, sondern auch hergestellt hatte: sein Neffe sah ihm zu, wie er von jeder gesetzten Seite Wachsabdrücke nahm, sie über Nacht in Säure hängte, damit eine Kupferhaut aufwuchs, das Kupfer mit Gussmetall hinterfütterte und das Ergebnis auf einer Handpresse druckte, während der Junge die Platte einschwärzte. Der fertige Band erschien 1864. Für sein Griechisch nahm er den Text, den Johann Jakob Griesbach in den 1770er Jahren erstellt hatte, mit Lesarten aus dem Codex Vaticanus.
hero.2=Was Wilson tatsächlich druckte, waren zwei englische Texte, nicht einer. Am linken Rand der Seite lief das Griechische mit einer wörtlichen Wort-für-Wort-Glosse unter jedem Wort; am rechten seine eigene geglättete Übersetzung, die Emphatic Version. Sie sind nicht dasselbe, und bei Joh 1,1 widersprechen sie einander offen — die Glosse liest „and a god was the Word“, die Emphatic Version „and the LOGOS was God“. Beide stammen von Wilson, im selben Buch gedruckt, wenige Zentimeter voneinander entfernt. Dieses Korpus führt die Glosse, also die Spalte, die zitiert wird, und genau deshalb steht sie in einer eigenen Abteilung und nicht im Raster der Bibeln. Eine Glosse hält fest, wie ein griechischer Satz gefügt ist — Kasus für Kasus, Artikel für Artikel, in griechischer Wortfolge. Sie ist kein Urteil darüber, wie der Satz auf Englisch zu lesen sei, und Wilsons eigenes Urteil dazu steht in der Spalte daneben. Wer das eine zitiert, sollte wissen, dass es das andere gibt.
hero.3=Das spätere Leben des Buches ist der Grund, warum die meisten von ihm gehört haben. Wilson starb 1900 als Mitglied der Church of the Blessed Hope, nicht einer Gruppe, die es damals unter dem Namen Jehovas Zeugen gegeben hätte. 1902 erwarb Charles Taze Russell, Präsident der Watch Tower Bible and Tract Society, das Urheberrecht von Wilsons Erben und mit der Zeit auch die Platten. Die Gesellschaft druckte die Diaglott die folgenden sechzig Jahre — 1927 setzte sie den Text auf eigenen Pressen neu, zog weit über einhundertfünfzigtausend Exemplare ab, verkaufte sie für zwei Dollar und gab sie schließlich verschenkt weiter. Die Diaglott ist somit ein Buch der Zeugen Jehovas durch Übernahme und nicht durch Verfasserschaft, und ihre Gewohnheit, im Neuen Testament „Jehova“ zu drucken, wo die Schreiber κύριος schrieben, während sie die hebräischen Schriften zitierten, ist vier Jahrzehnte älter als die Bewegung, die diesen Brauch bekannt gemacht hat. Das Urheberrecht erlosch 1952, und seither ist der Text gemeinfrei.
hero.4=Zweierlei über sie in diesem Leser sollte man wissen, bevor man sie benutzt. Griesbach druckte weder Apg 8,37 noch Lk 17,36, also steht beides hier nicht; statt die Lücke zu schließen und jeden folgenden Vers um eins hinaufzurücken, lässt die Zählung die beiden Stellen leer, sodass eine Stellenangabe in dieser Spalte denselben Vers trifft wie in der daneben. Und es ist für sie kein Vorgänger verzeichnet, sodass eine unter einem Diaglott-Vers geöffnete Abstammungssprosse auf den Ursprachenboden führt und nicht auf eine ältere englische Ausgabe.
hero.5=Man sei genau darin, was dieser Boden druckt. Das Griechische, das er zeigt, ist der Textus Receptus — die Marke liest ≈ TR 1550, und dieses ≈ ist der Leser, der sagt, er biete einen Zeugen des Griechischen und nicht den Text, aus dem diese Ausgabe gemacht wurde. Wilson arbeitete nach Griesbach. Wo die beiden übereinstimmen, wie bei Joh 1,1, zeigt die Sprosse tatsächlich genau die glossierten Wörter. Wo sie auseinandergehen, nicht: Griesbach verwarf den trinitarischen Satz in 1 Joh 5,7, sodass die Diaglott keine Spur davon hat, während die Textus-Receptus-Zeile darunter ihn vollständig führt. Bei einem Interlinear, dessen ganze Voraussetzung ist, dass das Griechische eben dort auf der Seite steht, ist das die eine Lücke, die man kennen sollte, ehe man daraus zitiert.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Was dies ist
fact.1.value=die sublineare Glosse — das unter das Griechische gedruckte Wort-für-Wort-Englisch, nicht Wilsons lesbare Übersetzung
fact.2.label=Zusammengestellt von
fact.2.value=Benjamin Wilson (1817–1900), autodidaktischer Gelehrter und Zeitungsredakteur in Geneva, Illinois
fact.3.label=Griechischer Text
fact.3.value=Griesbachs Rezension, mit Lesarten aus dem Codex Vaticanus (Vatikanische Handschrift 1209)
fact.4.label=Erschienen
fact.4.value=in Lieferungen ab 1857; vollständig in einem Band 1864, bei Fowler and Wells in New York
fact.5.label=Druckweise
fact.5.value=Wilson galvanisierte jede Platte selbst und zog die erste Auflage auf einer Handpresse ab
fact.6.label=Der Gottesname
fact.6.value=druckt „Jehova“ im Neuen Testament, wo die Schreiber κύριος schrieben, während sie hebräische Schrift zitierten — dieselbe Entscheidung, die [[ASV|die American Standard Version]] durch das ganze Alte Testament traf
fact.7.label=Erworben von
fact.7.value=der Watch Tower Bible and Tract Society, die das Urheberrecht 1902 unter Charles Taze Russell erhielt, den Satz 1927 erneuerte und bis in die 1960er Jahre druckte
fact.8.label=Lizenz
fact.8.value=gemeinfrei — das Urheberrecht erlosch 1952, und die Wachtturm-Nachdrucke fügten kein neues hinzu
fact.9.label=Zwei Verse fehlen
fact.9.value=Apg 8,37 und Lk 17,36 stehen nicht bei Griesbach und darum nicht hier; ihre Zahlen bleiben leer, statt aufgefüllt zu werden, sodass der Text weiterhin Vers für Vers mit jeder anderen Ausgabe fluchtet
fact.10.label=Das Griechische unter der Sprosse
fact.10.value=der [[TR|Textus Receptus]], angezeigt als ≈ TR 1550 — ein Zeuge des Griechischen, nicht Wilsons Grundtext, der Griesbachs Rezension war; die beiden stimmen bei Joh 1,1 überein und trennen sich bei 1 Joh 5,7
fact.11.label=In diesem Korpus
fact.11.value=in einer eigenen Abteilung für Interlinear- und Studienausgaben gehalten, abseits der Lesebibeln, damit eine Glosse nie für eine Übersetzung genommen wird; in den Abstammungssprossen ist keine Vorlage verzeichnet, sodass eine Sprosse geradewegs auf den Ursprachenboden öffnet
