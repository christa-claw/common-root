title=Японская Freedom Bible — Об этом издании | Common Root
description=Японская Freedom Bible (フリーダム・バイブル): полная японская Библия из 66 книг, которую eBible.org распространяет как черновой перевод без авторских прав, — единственная японская Библия в этом собрании, поэтому японский интерфейс открывается на ней.
heroHeading=Японская Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=Японская Freedom Bible — по-японски フリーダム・バイブル — это полная японская Библия, которую распространяет eBible.org, называющий себя официальным распространителем перевода. Она совсем новая: исходные файлы, хранящиеся в этом собрании, датированы 19 августа 2026 года, и 2026 на её карточке — это дата этих файлов. Отдельной даты издания eBible не приводит, и здесь она тоже не утверждается.
hero.2=Многое о ней не записано, и это стоит сказать прямо. Страницы eBible не называют ни переводчика, ни комитета, ни издателя и не сообщают, с чего сделан перевод — прямо с еврейского и греческого или через другой современный перевод. Её собственная страница об авторских правах называет её черновым переводом (翻訳の草案) и приглашает присылать предложения по улучшению, так что текст здесь — снимок незавершённой работы, а не устоявшееся издание.
hero.3=Ясно другое — её правовое положение: та же страница заявляет, что на перевод не установлено авторское право, и относит его к общественному достоянию. Поэтому именно она служит здесь японским текстом: это была единственная полная японская Библия на eBible, свободная от авторских прав. Более старая японская Библия, которая могла бы дать ей родословную, — перевод эпохи Мэйдзи, завершённый в 1887 году и давно ставший общественным достоянием, — из этого источника недоступна.
hero.4=В этом собрании она содержит 66 книг протестантского канона, 31 098 стихов, без второканонических книг. Родительский текст для неё не записан, поэтому ступень, открытая под любым её стихом, ведёт прямо к полу исходных языков, помеченному знаком ≈: еврейский и греческий текст там — свидетели, а не утверждение о том, с чего она переведена, и при неизвестном источнике это и есть честное прочтение. Это единственная японская Библия в собрании, поэтому японский интерфейс по умолчанию открывается на ней.

