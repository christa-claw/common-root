fact.1.label=言語
fact.1.value=英語
fact.2.label=翻訳者
fact.2.value=ロバート・ヤング（1822–1888）。エディンバラの印刷業者、書籍商、独学の言語学者で、Analytical Concordance to the Bible の編者
fact.3.label=旧約の底本
fact.3.value=通行のマソラ・ヘブライ語本文——このコーパスの[[WLC|レニングラード写本]]も属する伝統
fact.4.label=新約の底本
fact.4.value=ギリシャ語の公認本文、[[TR|テクストゥス・レセプトゥス]]——ヤングによれば「完全だと考えられているからではなく」、翻訳と本文批評が別々の仕事だからこそ保たれた
fact.5.label=翻訳の方針
fact.5.value=厳密な逐語訳。英語が奇妙に響く箇所でも原文の時制を保ち、そのため物語はしばしば現在時制で進む。原文の一語にできる限り一つの英語を当て、olam と aiōn は「age」と「age-during」になる。意味を通すために補った語は角括弧に入れる。神の名は「Jehovah」
fact.6.label=出版
fact.6.value=エディンバラ、1862年。ヤングによる改訂、1887年。出版者たちによって再び改訂された第3版、エディンバラ、1898年1月——ここに収められた本文
fact.7.label=ライセンス
fact.7.value=パブリックドメイン。このコピーは eBible.org から
fact.8.label=このコーパスでは
fact.8.value=66書。プロテスタントの正典すべてで、外典は含まない。英語式の章節番号のため、詩編は150篇で、各篇の表題はその第1節に組み込まれている
fact.9.label=系譜
fact.9.value=記録された親本はなく、この版の上に立つものとして記録されたものもない——段はまっすぐ原語の底面で開き、旧約では[[WLC|レニングラード写本]]、新約では[[TR|テクストゥス・レセプトゥス]]となる。2020年の [[LSV|Literal Standard Version]] はヤングの仕事を改訂したものだが、コーパスはその結びつきを記録していない
