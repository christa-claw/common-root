title=Young's Literal Translation — この版について | Common Root
description=ロバート・ヤングによる聖書の逐語訳。1862年にエディンバラで初版が出て、1887年にヤング自身が、1898年に出版者たちが改訂した。英語がついていくのに苦労する箇所でも、ヘブライ語とギリシャ語の時制と語順、そしてできる限り語彙まで保とうとする英語聖書である。
heroHeading=Young's Literal Translation
readerHref=/reader?c1.src=ylt

# The narrative, one paragraph per key, in order.
hero.1=ロバート・ヤング（Robert Young、1822–1888）はエディンバラの印刷業者で書籍商だった。印刷の徒弟修業のあいだにヘブライ語とほかのいくつかの東洋の言語を独学で身につけ、1856年から1861年までインドのスーラトで伝道団の印刷所を監督し、何よりも2冊の書物で記憶されている。コンコーダンス Analytical Concordance to the Bible と、この翻訳である。彼は1862年にエディンバラで Literal Translation を出版し、1887年に改訂版を出した。彼の死から10年後の1898年1月、出版者たちは「現在の方針のまま」もう一度改訂した第3版を刊行した。このコーパスに収められているのはその本文である。ヤングは旧約を通行のマソラ・ヘブライ語本文から、新約をギリシャ語の公認本文、テクストゥス・レセプトゥスから訳し、どちらについても新しい本文を作ろうとはしないとはっきり述べた。翻訳は本文批評とは別の仕事であり、両方に通じた者はほとんどいない、と彼は書いている。
hero.2=その狙いはすべて、英語の読者に原文の文法を見せることにある。ヤングは、原文が過去時制のところに現在時制を当てたり、「an a for a the」、つまり定冠詞の代わりに不定冠詞を置いたりする訳は逐語霊感をないがしろにするものだと考え、それに従って訳した。ヘブライ語の動詞の形は英語の時制として移されるので、物語はしばしば現在時制で進む。創世記は「In the beginning of God's preparing the heavens and the earth —」で始まり、「and God saith, ‘Let light be;’ and light is.」と続く。意味を通すために補った語は角括弧に入っている。「Jehovah [is] my shepherd, I do not lack.」彼はできる限り、ヘブライ語やギリシャ語の一語ごとに一つの英語の訳語を当てようとした。そのためヘブライ語の olam とギリシャ語の aiōn は「ever」や「eternal」ではなく「age」と「age-during」になる。マタイによる福音書25:46では、正しい人々は「to life age-during」へ入っていく。神の名は旧約全体を通して「Jehovah」と記される。
hero.3=私たちのコピーは完全である。創世記からヨハネの黙示録までの66書で、外典は含まず、英語式の章節番号に従う。詩編は150篇で、各篇の表題はその第1節に組み込まれ、マラキ書は第4章で終わる。公認本文の翻訳であるため、後の批判校訂版が疑問視する箇所を含んでいる。マルコによる福音書の長い結びから、ヨハネの手紙一5:7の天における三つの証しまでであり、この本文はそれを角括弧に入れている。使徒言行録8:37の全体も同様である。このリーダーにおいて、これは単独で立っている。コーパスはこの版に親本を記録していないので、その節の一つの下で系譜の段を開くと、≈の印が付いた原語の底面へまっすぐ落ちる。旧約ではレニングラード写本、新約ではテクストゥス・レセプトゥスである。この底面は、ヤング自身が訳したマソラ・ヘブライ語本文と公認ギリシャ語本文に近いが、同じ刊本ではない。この版の上に立つものも記録されていない。同じくこのコーパスにある2020年の Literal Standard Version は、自らをヤングの仕事の大幅な改訂と称しているが、コーパスはその結びつきを記録していないので、LSV の下の段はここへは通じない。どのインターフェース言語もこの版では開かない。英語インターフェースは New International Version で開き、この版には翻訳グリッドにあるこの版自身のカードからたどり着く。

