title=Webster's Bible — この版について | Common Root
description=ノア・ウェブスターが1833年に行ったキング・ジェイムズ・バージョンの改訂。コネチカット州ニューヘイブンで出版された。通用していた英語聖書をほぼ一語一語そのまま保ち、廃れた語を置き換え、文法を正し、朗読のためにわずかな表現を和らげている。
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=ノア・ウェブスター（1758–1843）はニューヘイブンの辞書編纂者で、何よりも1828年の An American Dictionary of the English Language で知られている。その5年後、彼は明快で正しく、同時代にふさわしい英語へのこだわりを、自国の人々が実際に読んでいた聖書に向けた。1833年、ニューヘイブンの Durrie and Peck が The Holy Bible … in the Common Version, with Amendments of the Language を出版し、その序文は同年9月の日付で署名されている。これは新しい翻訳ではない。ウェブスターは1611年のキング・ジェイムズ・バージョン——「通用訳」——を当時印刷されていた形のまま取り上げ、その英語が分かりにくくなったり文法に合わなくなったりした箇所だけを改めた。修正にあたっては原語を参照したが、訳の全体的な文体は変えるべきではないと書き、またいずれかの教派が教義の拠り所とする箇所は、知る限り一つも変えていないと述べている。
hero.2=序文は3種類の変更を挙げている。まったく使われなくなった語は、通用している語に置き換えられた。キング・ジェイムズが「wotteth not」とする箇所で、ヨセフの主人は家の中のことを「knoweth not」（創世記39:8）となり、使徒言行録12:4ではヘロデがペトロを引き出そうとするのは「after Easter」ではなく「after the passover」である。文法はウェブスターの時代の用法に合わせられた。人を指す場合は「which」に代えて「who」とし、そのため主の祈りは「Our Father who art in heaven」で始まる。物を指す場合は「his」に代えて「its」とし、そのため創世記第1章の植物は「after its kind」種を結ぶ。さらに、男女の混じった聴衆の前で朗読するにはふさわしくないと彼が判断した少数の語が、穏やかな語に置き換えられた。またキング・ジェイムズの「Holy Ghost」を「Holy Spirit」と書き、私たちのコピーには「Holy Ghost」が一つもない。それ以外の改訂は軽く、たいていの読者は、キング・ジェイムズの本文を離れたことに気づかないまま章から章へと読み進められるだろう。
hero.3=私たちのコピーは完全である。創世記からヨハネの黙示録までの66書で、外典は含まず、英語式の章節番号に従う。詩編は150篇で、各篇の表題はその第1節に組み込まれ、マラキ書は第4章で終わる。キング・ジェイムズと同じく、後の批判校訂版が疑問視する公認本文の箇所を保っている。マルコによる福音書の長い結び、使徒言行録8:37、そしてヨハネの手紙一5:7の天における3つの証しである。このリーダーにおいて、これは単独で立っている。同じくこのコーパスにあるキング・ジェイムズ・バージョンの改訂でありながら、コーパスはこの版に親本を記録していないので、その節の一つの下で系譜の段を開くと、ウェブスターが実際に手を入れた英語本文ではなく、≈の印が付いた原語の底面へまっすぐ落ちる。旧約ではレニングラード写本、新約ではテクストゥス・レセプトゥスである。この版の上に立つものも記録されていない。どのインターフェース言語もこの版では開かない。英語インターフェースは New International Version で開き、この版には翻訳グリッドにあるこの版自身のカードからたどり着く。第2列にキング・ジェイムズと並べて置けば、ウェブスターの修正が節ごとに見える。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=英語
fact.2.label=改訂者
fact.2.value=ノア・ウェブスター（1758–1843）。アメリカの辞書編纂者で、An American Dictionary of the English Language（1828）の編者
fact.3.label=改訂の底本
fact.3.value=1611年の[[KJV|キング・ジェイムズ・バージョン]]、「通用訳」の当時の刷り——新たに翻訳したのではなく英語のまま改訂したもの。ただしウェブスターは修正のためにヘブライ語とギリシャ語を参照した
fact.4.label=改訂の方針
fact.4.value=軽く控えめ。廃れた語は通用する語に置き換え、文法を正し（人には「who」、物には「its」）、朗読にふさわしくないとされた少数の語を和らげ、「Holy Ghost」に代えて「Holy Spirit」とした。文体と教義に関わる箇所は意図的にそのまま残した
fact.5.label=出版
fact.5.value=コネチカット州ニューヘイブン、Durrie and Peck、1833年。書名は The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=ライセンス
fact.6.value=パブリックドメイン。このコピーは eBible.org から
fact.7.label=このコーパスでは
fact.7.value=66書。プロテスタントの正典すべてで、外典は含まない。英語式の章節番号のため、詩編は150篇で、各篇の表題はその第1節に組み込まれている
fact.8.label=系譜
fact.8.value=記録された親本はなく、この版の上に立つものとして記録されたものもない——段はまっすぐ原語の底面で開き、旧約では[[WLC|レニングラード写本]]、新約では[[TR|テクストゥス・レセプトゥス]]となる。ただしウェブスターが改訂した本文は[[KJV|キング・ジェイムズ・バージョン]]である
