fact.1.label=Sprache
fact.1.value=Englisch
fact.2.label=Bearbeiter
fact.2.value=Noah Webster (1758–1843), amerikanischer Lexikograph, Verfasser von An American Dictionary of the English Language (1828)
fact.3.label=Bearbeitet nach
fact.3.value=[[KJV|Der King James Version]] von 1611, „der gebräuchlichen Übersetzung“, wie sie damals gedruckt wurde — auf Englisch überarbeitet, nicht neu übersetzt, wobei Webster für seine Verbesserungen das Hebräische und Griechische zu Rate zog
fact.4.label=Art der Bearbeitung
fact.4.value=Leicht und behutsam: veraltete Wörter durch gebräuchliche ersetzt; Grammatik berichtigt, „who“ für Personen und „its“ für Dinge; einige zum Vorlesen für ungeeignet gehaltene Wörter gemildert; „Holy Spirit“ statt „Holy Ghost“; Stil und lehrrelevante Stellen bewusst unverändert gelassen
fact.5.label=Veröffentlicht
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, als The Holy Bible … in the Common Version, with Amendments of the Language
fact.6.label=Lizenz
fact.6.value=Gemeinfrei; diese Abschrift von eBible.org
fact.7.label=In diesem Korpus
fact.7.value=66 Bücher, der protestantische Kanon vollständig, ohne die Apokryphen; englische Kapitel- und Verszählung, sodass die Psalmen 150 zählen und die Überschrift jedes Psalms in seinen ersten Vers hineingezogen ist
fact.8.label=Abstammung
fact.8.value=Keine verzeichnete Vorlage und nichts als auf ihr stehend verzeichnet – eine Sprosse öffnet geradewegs auf den Ursprachenboden, im Alten Testament auf [[WLC|den Codex Leningradensis]], im Neuen auf [[TR|den Textus Receptus]], obwohl der Text, den Webster bearbeitete, [[KJV|die King James Version]] ist
