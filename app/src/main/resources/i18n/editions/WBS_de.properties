title=Webster's Bible — Über diese Ausgabe | Common Root
description=Noah Websters Revision der King James Version von 1833, erschienen in New Haven, Connecticut — die gebräuchliche englische Bibel fast Wort für Wort beibehalten, veraltete Wörter ersetzt, die Grammatik berichtigt und einige Ausdrücke für das Vorlesen gemildert.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), der Lexikograph aus New Haven, ist vor allem durch An American Dictionary of the English Language von 1828 in Erinnerung geblieben. Fünf Jahre später richtete er dieselbe Sorge um klares, korrektes und zeitgemäßes Englisch auf die Bibel, die sein Land tatsächlich las. 1833 brachten Durrie and Peck in New Haven The Holy Bible … in the Common Version, with Amendments of the Language heraus, mit einem im September desselben Jahres unterzeichneten Vorwort. Eine neue Übersetzung ist es nicht. Webster nahm die King James Version von 1611 — „die gebräuchliche Übersetzung“ — so, wie sie damals gedruckt wurde, und änderte sie nur dort, wo ihr Englisch dunkel oder ungrammatisch geworden war. Er schrieb, er habe für seine Verbesserungen die Ursprachen zu Rate gezogen, der allgemeine Stil der Übersetzung solle aber nicht verändert werden, und er habe wissentlich keine Stelle geändert, auf die eine Konfession ihre Lehre gründet.
hero.2=Sein Vorwort nennt drei Arten von Änderungen. Völlig außer Gebrauch gekommene Wörter wichen gebräuchlichen: Josefs Herr „knoweth not“, was im Haus ist (1. Mose 39:8), wo die King James „wotteth not“ hat, und in Apostelgeschichte 12:4 will Herodes Petrus „after the passover“ vorführen, nicht „after Easter“. Die Grammatik wurde dem Sprachgebrauch von Websters Zeit angepasst: „who“ statt „which“, wenn es sich auf Personen bezieht, sodass das Vaterunser mit „Our Father who art in heaven“ beginnt, und „its“ statt „his“, wenn es sich auf Dinge bezieht, sodass die Pflanzen in 1. Mose 1 Samen tragen „after its kind“. Und eine kleine Zahl von Wörtern, die er für ungeeignet hielt, vor einer gemischten Zuhörerschaft laut gelesen zu werden, ersetzte er durch sanftere. Außerdem schrieb er „Holy Spirit“, wo die King James „Holy Ghost“ hat; unsere Abschrift enthält kein einziges „Holy Ghost“. Darüber hinaus ist die Revision leicht: Die meisten Leser könnten Kapitel um Kapitel lesen, ohne zu bemerken, dass sie den King-James-Text verlassen haben.
hero.3=Unsere Abschrift ist vollständig: 66 Bücher von Genesis bis zur Offenbarung, ohne die Apokryphen, in der englischen Kapitel- und Verszählung — 150 Psalmen, bei denen die Überschrift jeweils in den ersten Vers hineingezogen ist, und Maleachi, das mit Kapitel 4 endet. Wie die King James behält sie die Stellen des empfangenen Textes, die spätere textkritische Ausgaben in Frage stellen: den längeren Markusschluss, Apostelgeschichte 8:37 und die drei Zeugen im Himmel in 1. Johannes 5:7. In diesem Reader steht sie für sich. Obwohl sie eine Revision der King James Version ist, die ebenfalls in diesem Korpus steht, verzeichnet das Korpus für sie keine Vorlage, sodass eine Abstammungssprosse, die man unter einem ihrer Verse öffnet, geradewegs auf den mit ≈ markierten Ursprachenboden fällt — im Alten Testament den Codex Leningradensis, im Neuen den Textus Receptus — statt auf den englischen Text, an dem Webster tatsächlich arbeitete. Auf ihr ist ihrerseits nichts als stehend verzeichnet. Keine Oberflächensprache öffnet auf dieser Ausgabe; eine englische Oberfläche öffnet auf der New International Version, und diese hier erreicht man über ihre eigene Karte im Übersetzungsraster. Neben die King James in eine zweite Spalte gestellt, zeigt sie Websters Verbesserungen Vers für Vers.

