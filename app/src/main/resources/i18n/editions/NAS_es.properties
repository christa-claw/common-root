title=Sunan an-Nasa'i — Acerca de esta edición | Common Root
description=Sunan an-Nasa'i: la colección de hadices que Ahmad ibn Shu'ayb al-Nasa'i extrajo de su obra mayor, el Sunan al-Kubra, señalada por Ibn Hajar como la que contiene menos hadices débiles de los Seis Libros después de los dos Sahihs.
heroHeading=Sunan an-Nasa'i
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali al-Nasa'i nació hacia el año 214–215 d. H. (829–830 d. C.) en Nasa, una ciudad de Jorasán situada en lo que hoy es Turkmenistán. Comenzó a viajar en busca de hadices hacia los quince años, estudiando primero con Qutaybah ibn Sa'id —con quien pasó más de un año en Baglán— y continuando después por Iraq, el Hiyaz, Siria y Egipto, donde estudió con eruditos como Ishaq ibn Rahwayh y Abu Dawud al-Sijistani, compilador del [[ABD|Sunan Abi Dawud]]. Se instaló en Egipto, donde enseñó y llegó a ser conocido como Hafiz al-Hadith; los biógrafos posteriores no se ponen de acuerdo sobre si llegó a estudiar directamente con Muhammad al-Bukhari, pues al-Mizzi sostuvo que ambos nunca se encontraron. Viajando desde El Cairo hacia Meca ya avanzada su vida, se detuvo en Damasco, donde, según el relato tradicional, una exposición que dio sobre las virtudes de los compañeros del Profeta provocó a una multitud hostil en medio del sentimiento antialauí de la ciudad; murió poco después, en el año 303 d. H. (915 d. C.), de las heridas recibidas allí. Los relatos difieren sobre el lugar de su sepultura: entre Safa y Marwa, en Meca, según una tradición, o en Ramla, en Palestina, según otra.
hero.2=De las aproximadamente quince obras que se le atribuyen, seis tratan de hadices. La mayor, el Sunan al-Kubra, la redujo él mismo más tarde a una selección más breve conocida como Sunan al-Sughra («el Sunan menor») o al-Mujtaba («el seleccionado») —el libro que hoy se designa con el simple título de Sunan an-Nasa'i—. Quién hizo exactamente esa selección, y a petición de quién, no consta en las fuentes consultadas para esta página. En ella, al-Nasa'i organizó los hadices por tema jurídico, como hicieron [[ABD|Abu Dawud]] y [[TIR|at-Tirmidhi]]. El jurista Ibn Hajar al-Asqalani lo señaló más tarde como el libro que contiene, después de los dos Sahihs, menos hadices débiles (daif) y transmisores poco fiables de los Seis Libros, y ningún hadiz fabricado (mawdu') en absoluto.
hero.3=La tradición suní cuenta el Sunan an-Nasa'i entre los Seis Libros (Kutub al-Sitta), junto con el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]] y el [[TIR|Jami` at-Tirmidhi]], más un sexto libro discutido entre el Sunan Ibn Majah y otros candidatos. El lugar exacto que ocupa entre las cuatro colecciones de Sunan se discute sin estar resuelto: algunas fuentes lo llaman el tercero en autoridad de los seis, después solo de los dos Sahihs, mientras que las propias páginas de este corpus sobre el [[ABD|Sunan Abi Dawud]] y el [[TIR|Jami` at-Tirmidhi]] reflejan el orden más habitual, que sitúa en tercer lugar al libro de Abu Dawud. El número de hadices que se le atribuye varía de manera parecida: 5.758, incluidos los relatos repetidos, según una cifra muy citada para el Mujtaba, frente a 5.765 en la edición de la que procede este corpus; las fuentes no reconcilian ambas cifras.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-nasai de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]] y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=árabe clásico, con una traducción al inglés debajo de cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i (215–303 d. H. / 830–915 d. C.)
fact.3.label=Título
fact.3.value=conocido como Sunan an-Nasa'i, Sunan al-Sughra («el Sunan menor») o al-Mujtaba («el seleccionado») —una selección posterior de la obra mayor del propio al-Nasa'i, el Sunan al-Kubra
fact.4.label=Compilado
fact.4.value=reunido en viajes por Iraq, el Hiyaz, Siria y Egipto iniciados hacia los quince años; al-Nasa'i se instaló en Egipto y murió en Damasco en el año 303 d. H. (915 d. C.)
fact.5.label=Método
fact.5.value=organizado por tema jurídico, como el [[ABD|Sunan Abi Dawud]] y el [[TIR|Jami` at-Tirmidhi]]; extraído del Sunan al-Kubra mayor de al-Nasa'i mediante un proceso que las fuentes consultadas aquí no registran
fact.6.label=Posición
fact.6.value=contado entre los Seis Libros del islam suní (Kutub al-Sitta); algunas fuentes lo sitúan en tercer lugar, después del [[BUK|Sahih al-Bukhari]] y el [[MUS|Sahih Muslim]], mientras que las páginas de este corpus sobre el [[ABD|Sunan Abi Dawud]] y el [[TIR|Jami` at-Tirmidhi]] reflejan el orden más habitual que sitúa en tercer lugar al libro de Abu Dawud —el rango exacto se discute sin estar resuelto
fact.7.label=Número de hadices
fact.7.value=5.758, incluidos los relatos repetidos, según una cifra muy citada para el Mujtaba; la edición fuente de este corpus numera 5.765 —las fuentes no reconcilian ambas cifras
fact.8.label=En este corpus
fact.8.value=52 libros y 5.765 hadices numerados
fact.9.label=Traducción al inglés
fact.9.value=tomada de la edición eng-nasai de fawazahmed0/hadith-api, mostrada como acompañamiento bajo el árabe; de qué traducción publicada procede aún no se ha determinado por parte de este corpus
fact.10.label=Licencia
fact.10.value=el matn árabe es el texto clásico de dominio público; la licencia de la traducción al inglés sigue en revisión
