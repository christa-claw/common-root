# The narrative, one paragraph per key, in order.
hero.1=לואי סגון נולד ב־1810 בפלנפלה, שהייתה אז ממש מחוץ לז׳נבה, ומת בז׳נבה ב־1885. הוא למד תאולוגיה בפקולטה הפרוטסטנטית בשטרסבורג, קיבל תואר דוקטור לתאולוגיה בגיל עשרים ושש, ושימש עשרים וארבע שנים כומר בקהילת הכפר שן־בוז׳רי, לפני שפנה להוראת עברית ומקרא. חבר הכמרים הנכבד של ז׳נבה הטיל עליו לתרגם מחדש את התנ״ך מן העברית, ותרגומו יצא במהדורה הנושאת את התאריך 1874. אחר כך תרגם ביוזמתו שלו את הברית החדשה, על פי הנוסח היווני הביקורתי של קונסטנטין טישנדורף ולא על פי הנוסח המקובל, וב־1880 יצא כל הספר בכרך אחד, מודפס באוקספורד.
hero.2=אין זה בדיוק הנוסח שסגון פרסם. לאחר מותו מסרה חברת התנ״ך הבריטית והזרה את תיקונו לקבוצה של כמרים ותאולוגים צרפתים ושווייצרים, והנוסח המתוקן יצא ב־1910. שינוייהם נטו אל אוצר המילים של האורתודוקסיה הפרוטסטנטית — הכוהנים נעשו „sacrificateurs”, המילה הפרוטסטנטית הישנה, ולא „prêtres”; בעותק זה „sacrificateur” מצויה בכל מקום ו־„prêtre” נדירה. נוסח זה של 1910 הוא שנעשה לספר המקרא המרכזי של הפרוטסטנטיות הצרפתית במשך רוב המאה העשרים, והוא עדיין בין הנקראים ביותר בקרב האוונגליסטים דוברי הצרפתית. יש לו גם משפחה ארוכה של תיקונים מאוחרים: „Colombe” מ־1978, Nouvelle Édition de Genève מ־1979 ו־Segond 21 ב־2007. כמה תכונות ניכרות כמעט בכל עמוד. השם המפורש מתורגם „l'Éternel”, הנצחי, כמו אצל אוסטרוואלד ובדארבי הצרפתי העומד לצדו באוסף זה: „L'Éternel est mon berger” בתהלים 23. וישעיהו 7:14 נקרא „la jeune fille deviendra enceinte” — הנערה הצעירה, לא הבתולה — בדיוק סוג התרגום שבגללו האשימו כמה פרוטסטנטים שמרנים את סגון בהחלשת הנבואות המשיחיות.
hero.3=בתהלים הספר הולך אחר העברית: המספור הוא העברי, ולכן מזמור 23 הוא מזמור הרועה, ובמקום שכותרת המזמור היא פסוק בעברית, היא פסוק גם כאן — במזמור 51 יש 21 פסוקים, שניים יותר מאשר ב־King James Version. יואל ומלאכי, לעומת זאת, שומרים על חלוקת הפרקים של המסורת הלטינית והאנגלית, שלושה פרקים וארבעה. בקורא הזה הוא אחד משלושה ספרי מקרא צרפתיים, לצד אוסטרוואלד והדארבי הצרפתי. ממשק בצרפתית אינו נפתח עליו: לצרפתית אין בחירה מוקפדת, ולכן הקורא לוקח את ספר המקרא הצרפתי הראשון בסדר הקטלוג, והוא דארבי. בשלבי השושלת לא רשום לו שום מקור, ולכן שלב הנפתח מתחת לפסוק יורד היישר אל רצפת שפות המקור המסומנת ב־≈ — לתנ״ך כתב יד לנינגרד, כתב יד של המסורה ולא נוסח עברי מודפס מימיו של סגון, ולברית החדשה הנוסח המקובל, כלומר בדיוק היוונית שהוא בחר שלא ללכת אחריה. תווית השלב שלו נושאת את השנה 1910.

