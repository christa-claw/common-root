title=לואי סגון 1910 (צרפתית) — על מהדורה זו | Common Root
description=תנ״ך וברית חדשה של סגון בנוסח המתוקן של 1910: תרגומו של כומר ז׳נבאי מן העברית ומן היוונית, שנדפס לראשונה בשלמותו ב־1880, תוקן בשביל חברת התנ״ך הבריטית והזרה, והיה במשך מאה שנה כתבי הקודש המקובלים על הפרוטסטנטים דוברי הצרפתית.
heroHeading=לואי סגון 1910
