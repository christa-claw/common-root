fact.7.value=الكتاب المقدس الوحيد بلغة ماتو تشين هنا، أُضيف بوصفه نصًّا في الملكية العامة حقًّا لأقلية مسيحية مضطهَدة — وهذا بالضبط ما يرمي إليه هذا القارئ الحريص على الخصوصية
