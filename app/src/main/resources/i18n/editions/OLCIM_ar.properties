title=Baibal Olcim — عن هذه النسخة | Common Root
description=Baibal Olcim: الكتاب المقدس بلغة ماتو تشين، إحدى لغات الأقليات في ولاية تشين بميانمار، توزّعه eBible.org بوصفه نصًا في الملكية العامة حقًّا، لا يُعرف مترجمه ولا تاريخ ترجمته.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=ماتو تشين — المعروفة أيضًا بماتوبي تشين — لغة صينية-تبتية يتحدثها نحو 34,000 شخص، يتركزون حول ماتوبي في جنوب ولاية تشين بميانمار، ولهم جماعات قريبة عبر الحدود في ولاية ميزورام الهندية. وBaibal Olcim هو الكتاب المقدس بهذه اللغة، وهو النص الوحيد بلغة ماتو تشين في هذه المجموعة.
hero.2=ما لا يقدّمه السجلّ هو مَن ترجمه ومتى. فموقع eBible.org، الذي يوزّع النص، لا يذكر سوى أنه في الملكية العامة، ويصنّفه تحت الرمز hlt، وهو رمز ISO 639-3 الخاص بلغة ماتو تشين — دون مترجم، ودون لجنة، ودون تاريخ ترجمة. وتترك هذه الصفحة الأمرين فارغين بدلًا من التخمين. ولهذا الرمز نفسه تاريخ صغير هنا: فمحاولة سابقة لإضافة كتاب مقدس هندي ثانٍ إلى هذه المجموعة وُضعت تحت hlt بسبب تشابه الاختصار، إلى أن كشف ظهور آيات بلغة ماتو تشين في موضع كان يُفترض أن يكون هنديًّا عن الخطأ. وهذه النسخة هي التي تم التحقق منها فعليًّا مقابل اللغة التي يسمّيها رمزها.
hero.3=أُضيفت هذه النسخة لِما هي عليه، لا لطولها: كتاب مقدس في الملكية العامة حقًّا، لا مجرد مرخَّص، بلغة أقلية مسيحية عانت اضطهادًا حقيقيًّا في خضم النزاع الأهلي في ميانمار، المتركز في ولاية تشين وما حولها. وقارئ بُني ليطلب لا شيء ممن يستخدمونه، وليتتبّع لا أحدًا منهم، مُعَدٌّ بالضبط لحالة كهذه — وهذا أيضًا جزء كبير من سبب قلة ما تضعه هذه الصفحة في حقائقها.

