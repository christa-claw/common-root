fact.1.label=Langue
fact.1.value=Arabe classique, avec une traduction anglaise sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Yahya ibn Sharaf an-Nawawi (631–676 AH / 1233–1277)
fact.3.label=Titre
fact.3.value=Connu sous le nom d'al-Arba'in al-Nawawiyya (« les quarante hadiths d'an-Nawawi ») ; malgré son nom, le recueil compte quarante-deux hadiths
fact.4.label=Compilé
fact.4.value=Pour l'essentiel tiré du [[BUK|Sahih al-Bukhari]] et du [[MUS|Sahih Muslim]], pendant qu'an-Nawawi dirigeait la Dar al-Hadith al-Ashrafiyya de Damas (665 AH / 1267) jusqu'à sa mort à Nawa, en Syrie, en 676 AH (1277)
fact.5.label=Méthode
fact.5.value=Chaque hadith choisi comme ce qu'an-Nawawi appelait un « grand fondement » (qa'ida azima) de la religion ; poursuit un genre plus ancien de quarante hadiths (arba'iniyyat) dont le premier exemple connu, aujourd'hui perdu, est attribué à Abdullah ibn al-Mubarak (m. 797)
fact.6.label=Rang
fact.6.value=Largement compté parmi les œuvres les plus lues de l'islam sunnite après le Coran lui-même ; objet de dizaines de commentaires, le plus célèbre étant le Jami' al-'Ulum wal-Hikam d'Ibn Rajab al-Hanbali
fact.7.label=Nombre de hadiths
fact.7.value=42, malgré le nom ; l'édition source de ce corpus en compte de même
fact.8.label=Dans ce corpus
fact.8.value=1 livre et 42 hadiths numérotés
fact.9.label=Traduction anglaise
fact.9.value=Tirée de l'édition eng-nawawi de fawazahmed0/hadith-api, présentée en accompagnement de l'arabe ; de quelle traduction imprimée elle descend n'est pas encore confirmé du côté de ce corpus
