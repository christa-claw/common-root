title=Les quarante hadiths d'an-Nawawi — À propos de cette édition | Common Root
description=Les quarante hadiths d'an-Nawawi : 42 hadiths choisis par l'imam an-Nawawi, chacun pensé comme un « grand fondement » (qa'ida azima) de la religion — l'œuvre la plus lue du genre des quarante hadiths.
heroHeading=Les quarante hadiths d'an-Nawawi
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Yahya ibn Sharaf an-Nawawi naquit en muharram 631 AH (octobre 1233) à Nawa, près de Daraa en Syrie, et s'installa à dix-huit ans à Damas pour étudier. En 665 AH (1267), il fut nommé à la tête de la Dar al-Hadith al-Ashrafiyya de Damas, poste qu'il occupa jusqu'à sa mort à Nawa en 676 AH (1277), au milieu de sa quarantaine ; il y fut enterré. Juriste shafi'ite, il écrivit abondamment durant cette courte vie — parmi ses autres œuvres figurent Riyad al-Salihin, un commentaire de Sahih Muslim connu sous le nom d'Al-Minhaj, al-Majmu' Sharh al-Muhadhab, Minhaj al-Talibin et Kitab al-Adhkar.
hero.2=Al-Arba'in al-Nawawiyya poursuit une tradition plus ancienne de recueils de « quarante hadiths » (arba'iniyyat), dont le principe est un hadith promettant à qui préserve quarante hadiths sur la religion une place parmi les savants au Jour du Jugement — un hadith que la plupart des critiques classent eux-mêmes comme da'if (faible). Le premier recueil de ce genre, aujourd'hui perdu, est attribué à Abdullah ibn al-Mubarak (m. 797) ; de nombreux savants firent ensuite les leurs. An-Nawawi choisit des hadiths qu'il jugeait sûrs, pour la plupart tirés du [[BUK|Sahih al-Bukhari]] et du [[MUS|Sahih Muslim]], chacun illustrant ce qu'il appelait un « grand fondement » (qa'ida azima) de la religion — et malgré son nom, le recueil tel qu'il subsiste en compte quarante-deux. Il devint l'exemple le plus lu du genre, suscita des dizaines de commentaires, le plus célèbre étant le Jami' al-'Ulum wal-Hikam d'Ibn Rajab al-Hanbali, et compte parmi les œuvres les plus lues de l'islam sunnite après le Coran lui-même.
hero.3=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-nawawi de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]], le [[NAS|Sunan an-Nasa'i]], le [[IBM|Sunan Ibn Majah]], le [[MAL|Muwatta Malik]] et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

