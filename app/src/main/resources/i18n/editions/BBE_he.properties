title=Bible in Basic English — על מהדורה זו | Common Root
description=Bible in Basic English (התנ״ך והברית החדשה באנגלית בסיסית), שתורגמה מעברית ומיוונית בידי ועדה בראשות ס. ה. הוק ויצאה לאור בהוצאת Cambridge University Press — הברית החדשה ב־1941 והמקרא כולו ב־1949 — באנגלית הבסיסית של צ'. ק. אוגדן, בת 850 מילים, ועוד 150 מילים שנוספו לשירה ולמקרא.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=האנגלית הבסיסית (Basic English) היא מעשה ידיו של צ'. ק. אוגדן מן ה־Orthological Institute: רשימה של 850 מילים אנגליות שהוצעה כשפת עזר בין־לאומית. את Bible in Basic English הכינה ועדה בניהולו של ס. ה. הוק (1874–1968), חוקר המקרא שנעשה ב־1930 לפרופסור על שם סמואל דייווידסון ללימודי הברית הישנה באוניברסיטת לונדון, בשיתוף עם ה־Orthological Institute. היא תורגמה מן העברית ומן היוונית, ולא פושטה מתוך תרגום אנגלי קודם, ואחר כך עברה ועדה שהקימו נאמני Cambridge University Press על הנוסח הבסיסי לפרטיו. ל־850 המילים של אוגדן הוסיפו המתרגמים 100 מילים המסייעות בשירה ו־50 מילים שהמקרא נזקק להן, 150 בסך הכול. Cambridge University Press הוציאה לאור את הברית החדשה ב־1941 ואת המקרא כולו ב־1949; הדפסה משנת 1965 הופצה בארצות הברית בלי הודעת זכויות יוצרים, ולכן הטקסט נמצא שם בנחלת הכלל.
hero.2=התוצאה נקראת בפשטות ובאחידות, בגבולות אוצר המילים המצומצם הזה. בראשית נפתח ב־”At the first God made the heaven and the earth.” תהלים 23 נפתח ב־”The Lord takes care of me as his sheep; I will not be without any good thing.” הבשורה על פי יוחנן נפתחת ב־”From the first he was the Word, and the Word was in relation with God and was God,” ויוחנן 3:16 נקרא ”For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.” שם האל הוא ”the Lord” לכל אורך הטקסט, מלבד שמונה פסוקים שבהם הוא ניתן כ־”Yahweh”, ובהם שמות 6:3, שבו אומר האל שאברהם, יצחק ויעקב ”had no knowledge of my name Yahweh”, ותהלים 83:18. במקום שבו העברית הייתה בלתי ודאית מכדי לתרגמה, שמו המתרגמים נקודות במקומה, ובעותק שלנו כמה פסוקים, ובהם איוב 34:29–33 ואיוב 36:16–20, אינם אלא ”...”.
hero.3=העותק שלנו מכיל 66 ספרים, מבראשית ועד ההתגלות, בלי הספרים החיצוניים, בחלוקת הפרקים והפסוקים של ה־King James ושל ה־Revised Version — 150 מזמורים, ומלאכי המסתיים בפרק 4. אין בו כותרות למזמורים: תהלים 51 מתחיל ב־”Have pity on me, O God”. הברית החדשה אינה תרגום של הנוסח המקובל. שישה־עשר פסוקים שהמהדורות הביקורתיות משמיטות, ובהם מתי 17:21, מעשי השליחים 8:37 והרומים 16:24, נשמרו כאן רק כמקומות ריקים המסומנים [], וביוחנן א׳ 5:7 אין שלושה עדים בשמים; סיפור האישה שנתפסה בניאוף, יוחנן 7:53–8:11, עומד בסוגריים מרובעים, ואילו הסיום הארוך של מרקוס נשמר. בקורא זה הוא עומד לבדו. האוסף אינו רושם לו הורה, ולכן שלב שושלת שנפתח מתחת לאחד מפסוקיו נופל ישירות לרצפת לשונות המקור המסומנת ב־≈: כתב יד לנינגרד בברית הישנה והטקסטוס רצפטוס בברית החדשה, נוסח יווני שהתרגום הזה אינו הולך אחריו בשישה־עשר המקומות האלה. גם דבר אינו רשום כעומד עליו. אף שפת ממשק אינה נפתחת על מהדורה זו; ממשק אנגלי נפתח על New International Version, ולמהדורה זו מגיעים מן הכרטיס שלה ברשת התרגומים.

