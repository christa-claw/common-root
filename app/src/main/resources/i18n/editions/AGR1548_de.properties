title=Agricola 1548 — Über diese Ausgabe | Common Root
description=Mikael Agricolas Finnisch: das Neue Testament von 1548, der Psalter von 1551 und die Propheten — die erste gedruckte finnische Bibelübersetzung und der Anfang des geschriebenen Finnisch.
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=Mit Dank an alle, die Korrekturen zu dieser Seite geschickt haben.

# The narrative, one paragraph per key, in order.
hero.1=Das älteste gedruckte Finnisch, das es gibt. Als Mikael Agricola 1548 Se Wsi Testamenti veröffentlichte, war Finnisch kaum je gesetzt worden — sein eigenes ABC-Buch von wenigen Jahren zuvor war überhaupt das erste finnische Buch. Dazwischen erschien noch das Gebetbuch von 1544 — ein umfangreiches Werk, das bereits Psalmenübersetzungen enthielt. Um die Schrift drucken zu können, musste er zuerst entscheiden, wie die Sprache geschrieben werden soll, und diese Entscheidungen — Rechtschreibung, Lehnwörter, Tonfall — sind der Anfang des geschriebenen Finnisch. Das Neue Testament kostete ihn und seinen Turkuer Kreis über ein Jahrzehnt; der Psalter folgte 1551, Auswahlen aus den Propheten und den Büchern Mose 1551 und 1552. Seines war allerdings das erste gedruckte Finnisch, nicht das erste geschriebene: vier Handschriften — der Codex Westh, der Uppsalaer Kodex B 28, das Missale von Kangasala und das Uppsalaer Fragment — enthalten finnische Bibelstellen, und Kauko Pirinen zeigte 1988 im Vergleich mit ihren schwedischen Vorlagen, dass Teile davon älter sind als alles, was Agricola druckte, vielleicht schon in den 1530er Jahren geschrieben.
hero.2=Die ganze Bibel hat er nie übersetzt, und dieser Reader tut nicht so. Das Neue Testament und alle 150 Psalmen sind vollständig; die Propheten und die Bücher Mose erscheinen in Auswahl. Auch das, was er anderswo übertrug, steht hier: sein Gebetbuch von 1544 und seine Käsikirja und Messu von 1549 führen eigenen Bibeltext — darunter die Kapitel der Genesis, gedruckt unter der Überschrift "Genesist mutomat Lughut" — und 685 Verse stammen daher. Sie werden nur dort verwendet, wo die Schriftbände an dieser Stelle keinen Vers haben, und nur dort, wo der Text fortlaufend ist und nicht als einzelnes Zitat in einem Gebet steht. So ist die Genesis nun doch da, in Teilen: Kapitel 1–4, 22, 28 und 32. Richter, Rut, 1. Chronik und Ester fehlen ganz. Ein vollständiges finnisches Altes Testament musste auf die Biblia von 1642 warten, eine Sprosse weiter oben.
hero.3=In diesem Reader ist Agricola die älteste finnische Sprosse. Öffnet man eine Sprosse unter einem Vers der Biblia 1642, erscheint sein Text neben Luthers Deutsch — die zwei Quellen, die die Kommission von 1642 wirklich aufgeschlagen hatte. Unter Agricola selbst verlässt die Kette das Finnische endgültig: er arbeitete mit Erasmus' Griechisch und dem daneben gedruckten Latein des Erasmus, mit Luthers Deutsch und mit der Vulgata. Drei davon sind hier als seine Eltern verzeichnet; Erasmus' Latein und die schwedische Bibel Gustav Wasas von 1541, die er ebenfalls nutzte, sind nicht in diesem Korpus. Der Text stammt aus dem Kotus-VKS-Korpus, in der Schreibung des Drucks von 1548: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". Schwedische Bibeltexte lagen seit 1526 gedruckt vor, als das schwedische Neue Testament erschien; eine schwedische Fassung stand ihm also von Anfang an zur Verfügung.

