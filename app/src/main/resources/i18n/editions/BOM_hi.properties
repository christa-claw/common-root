title=मॉरमन की पुस्तक — इस संस्करण के बारे में | Common Root
description=मॉरमन की पुस्तक: जोसेफ़ स्मिथ द्वारा 1830 में बोलकर लिखवाया गया अमेरिका के प्राचीन भविष्यवक्ताओं का अभिलेख, न्यूयॉर्क के पामाइरा में मुद्रित, जिसे लैटर-डे सेंट्स बाइबिल के साथ एक पूरक धर्मग्रंथ के रूप में पढ़ते हैं।
heroHeading=मॉरमन की पुस्तक
readerHref=/reader?c1.src=bom

hero.1=जोसेफ़ स्मिथ ने कहा कि उन्होंने इस पुस्तक का अनुवाद "ईश्वर के वरदान और सामर्थ्य से" प्राचीन धातु पट्टिकाओं के एक समूह से किया था, जिन्हें उन्होंने बताया कि उन्होंने 1827 में अपने परिवार के खेत के पास, न्यूयॉर्क के पामाइरा के निकट पाया था, और बाद में उन्हें उस दूत को लौटा दिया जिसने उन्हें दिखाई थीं। बोलकर लिखवाने की प्रक्रिया के साक्षी बताते हैं कि वे एक दृष्टा-पत्थर को देखते थे — काम के बाद के चरणों में, एक ऐसा पत्थर जिसे वे प्रकाश रोकने के लिए टोपी में रख लेते थे, न कि केवल वह जोड़ी जो एक वक्षपट्ट से जुड़े पत्थरों की थी, जिन्हें पारंपरिक रूप से ऊरीम और तुम्मीम कहा जाता है और जो कहा जाता है कि पट्टिकाओं के साथ आए थे — और वे पाठ को ऊँची आवाज़ में बोलते थे जबकि एक लिपिक उसे लिख लेता था। ओलिवर काउडरी ने 1829 में लगभग दो महीनों तक इस तरह अधिकांश भाग लिखा, मुख्यतः न्यूयॉर्क के फ़ेयेट में व्हिटमर परिवार के खेत पर; मार्टिन हैरिस और जोसेफ़ की पत्नी एम्मा स्मिथ ने पहले के, छोटे चरणों में लिपिक के रूप में काम किया था।
hero.2=पांडुलिपि उसी वर्ष मुद्रण के लिए भेज दी गई। स्मिथ ने जून 1829 में इस रचना का कॉपीराइट सुरक्षित किया, और मुद्रण पामाइरा में एग्बर्ट बी. ग्रैंडिन की दुकान में शुरू हुआ, जहाँ टाइपसेटर जॉन एच. गिल्बर्ट ने वे विराम-चिह्न और पैराग्राफ विभाजन जोड़े जो बोलकर लिखवाई गई पांडुलिपि में नहीं थे। तैयार पुस्तक मार्च 1830 में प्रकाशित हुई: लगभग 5,000 प्रतियाँ, जो ग्रैंडिन की पूरी छपाई थी।
hero.3=यह पन्द्रह पुस्तकों में विभाजित है, पहली नफ़ी की पुस्तक से लेकर मोरोनी की पुस्तक तक, जिनमें से प्रत्येक का नाम उस भविष्यवक्ता-अभिलेखक के नाम पर है जिसे उसके संकलन का श्रेय दिया जाता है। 1830 की किसी भी प्रति में एक भी पद संख्या नहीं थी — पाठ आज के पाठकों की तुलना में कहीं अधिक लंबे अध्यायों में निरंतर पैराग्राफ के रूप में चलता था। आज प्रयुक्त अध्याय और पद विभाजन 1879 के उस संस्करण से आते हैं जो ऑर्सन प्रैट ने तैयार किया था, जिन्होंने अध्यायों को भी छोटा किया और पहली फुटनोट जोड़ी। बाद के संस्करणों ने प्रस्तुति को और बदला: जॉर्ज एफ़. रिचर्ड्स की अध्यक्षता वाली एक समिति ने 1920 में पाठ को दो स्तंभों में सेट किया और अध्याय-सारांश व उच्चारण-गाइड जोड़े; 1981 के संस्करण ने क्रॉस-रेफ़रेंस, अध्याय-शीर्षक और अन्य संदर्भ सामग्री को अपडेट किया; और 2013 के मुद्रण ने उन टाइपोग्राफ़िक असंगतियों को ठीक किया जो 1981 से छपाई प्लेटों में आ गई थीं।
hero.4=यह उन चार रचनाओं में से एक है जिन्हें लैटर डे सेंट आंदोलन अपनी "मानक रचनाएँ" कहता है, बाइबिल, [[DC|डॉक्ट्रिन एंड कॉवनंट्स]] और [[PGP|पर्ल ऑफ़ ग्रेट प्राइस]] के साथ। इस संग्रह में पाठ Mormon Documentation Project के JSON निर्यात से लिया गया है, जिसे उसके रखवाले ने सार्वजनिक क्षेत्र घोषित किया है; यह वर्तमान मानक संस्करण के शब्दों और पद-विभाजन का पालन करता है, साथ ही 2013 के मुद्रण के टाइपोग्राफ़िक सुधारों के साथ, और उन फुटनोट, अध्याय-सारांश व भूमिका को छोड़ देता है जो अब भी कॉपीराइट के अंतर्गत हैं। क्योंकि यहाँ जो रखा गया है वह ठीक यही वर्तमान मानक पाठ है, न कि कोई विशेष ऐतिहासिक मुद्रण, इसलिए इसके लिए कोई एक प्रकाशन वर्ष नहीं दिया गया है।

