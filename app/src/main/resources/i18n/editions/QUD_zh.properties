title=四十则神圣圣训 — 关于此版本 | Common Root
description=四十则"库德西圣训"——穆斯林认为其含义源自真主，而其措辞如同其他圣训一样经由穆罕默德传述——本语料库将其作为《纳瓦维四十训》的伴读卷呈现。
heroHeading=四十则神圣圣训
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1="库德西圣训"（神圣或神启圣训）与普通圣训的区别在于其含义被认为的来源：阿尔·朱尔贾尼等学者将其描述为真主之言，以穆罕默德本人的措辞表达，这与《古兰经》不同——《古兰经》的措辞本身即被视为真主之言。这种区别关乎地位，而非可靠性——库德西圣训不必是萨希赫（确凿可信）；某些被如此归类的圣训属达伊夫（弱）或存在争议，其判定标准与其他任何圣训的传述链标准相同。
hero.2=汇编四十则库德西圣训延续了与[[NAW|纳瓦维四十训]]以及其所属的更广泛"四十圣训"（阿尔巴伊尼亚特）体裁相同的古老习惯，但此处仅限于一类圣训，而非圣训整体。一部恰以此为书名、广为流传的英译本——由伊兹丁·易卜拉欣与丹尼斯·约翰逊-戴维斯选编并翻译，二人也曾翻译纳瓦维汇编的伴读译本——于1997年由伊斯兰文本协会出版，为阿拉伯语与英语对照的双语版本，其四十则圣训取材于整个古典圣训文献。本语料库所收录的这四十则圣训究竟是否正是那一选本，还是在同一传统书名下独立编成的另一组圣训，本语料库尚未确定。
hero.3=此处的阿拉伯语文本是古典正文（matn），被视为公有领域。阅读器中其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-qudsi版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]、[[TIR|提尔米济圣训实录]]、[[NAS|奈萨仪圣训集]]、[[IBM|伊本·马哲圣训集]]、[[MAL|马立克穆瓦塔]]、[[NAW|纳瓦维四十训]]及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=语言
fact.1.value=古典阿拉伯语，阅读器中每则圣训下方附有英译文
fact.2.label=编纂者
fact.2.value=没有单一的古典编纂者；以此书名出版的英译本由伊兹丁·易卜拉欣与丹尼斯·约翰逊-戴维斯选编并翻译，二人从整个古典圣训文献中汇集了这四十则圣训
fact.3.label=名称
fact.3.value=库德西圣训——"神圣"或"神启"圣训，其含义被认为源自真主，但措辞与《古兰经》不同，仍属穆罕默德本人的言辞
fact.4.label=编纂地点与时间
fact.4.value=这是一部从更广泛圣训文献中汇编而成的选集，而非单一连续文本；伊卜拉欣／约翰逊-戴维斯以此书名出版的英译本发行于1997年
fact.5.label=方法
fact.5.value=依据是否归类为"库德西"而非经典地位来选录；库德西圣训不必是萨希赫（确凿可信）——某些被如此归类的属达伊夫（弱）或存在争议
fact.6.label=地位
fact.6.value=以此为名的多部选集之一，与[[NAW|纳瓦维四十训]]同属历史悠久的四十圣训（阿尔巴伊尼亚特）传统
fact.7.label=圣训数量
fact.7.value=40
fact.8.label=在本语料库中
fact.8.value=1卷、40则编号圣训
fact.9.label=英译文
fact.9.value=取自fawazahmed0/hadith-api的eng-qudsi版本，作为阿拉伯语的对照译文显示；它究竟源自伊卜拉欣／约翰逊-戴维斯译本还是另一独立译本，本语料库尚未确认
fact.10.label=许可
fact.10.value=阿拉伯语正文是被视为公有领域的古典文本；英译文的许可仍在审核中
