title=Женевская Библия 1599 — Об этом издании | Common Root
description=Женевская Библия: сделанная английскими протестантами в изгнании в Женеве, первая английская Библия со сплошной нумерацией стихов и примечаниями на полях, читанная поколением Шекспира и ступень под Библией короля Иакова.
heroHeading=Женевская Библия 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=Эта Библия была сделана за границей, людьми, которые не могли безопасно оставаться дома. Когда в 1553 году на престол взошла Мария I и Англия вернулась к Риму, несколько сотен протестантов уехали; часть из них осела в Женеве Кальвина, где были типографии, еврейская и греческая учёность и не было епископа, перед которым надо отвечать. Уильям Уиттингем издал там Новый Завет в 1557 году. Группа под началом Энтони Гилби прошла Ветхий Завет, и полная Библия была напечатана в Женеве Роуландом Холлом в 1560 году, через два года после смерти Марии, когда большинство изгнанников уже вернулось домой.
hero.2=То, что они сделали, изменило облик английской Библии. Она первой пронумеровала каждый стих, так что читателя можно было отослать к строке, а не к главе. Она была набрана антиквой, а не готическим шрифтом, и выпущена достаточно небольшой и достаточно дешёвой, чтобы её можно было иметь у себя, а не держать прикованной к аналою. И поля были полны: перекрёстные ссылки, толкования трудных слов, карты и примечания о том, что означает то или иное место. Именно последнее — причина того, что её любили, и того, что её не терпели. Примечания реформатские, местами резко, и они столь же охотно говорят читателю, что думать о королях, как и что думать о вероучении.
hero.3=Дата этого издания требует оговорки, потому что Женевская Библия была не книгой, а текстом, который переиздавался восемьдесят лет, пока его части менялись. В 1576 году Лоуренс Томсон заменил Новый Завет собственной правкой, сделанной по греческому изданию Теодора Безы 1565 года, и с 1587 года именно этот Новый Завет несёт большинство Женевских Библий. В 1599 году были добавлены примечания Франциска Юния к Откровению. Таким образом, “1599” называет скорее состав — Новый Завет Томсона плюс Юний на Откровение — чем год печати, и Библии с этой датой продолжали печатать и после. Поэтому каталожная карточка оставляет год пустым, тогда как метка ступени, которой нужно что-то короткое для показа, читается GNV 1599.
hero.4=Её место в этом собрании — петля. Самая длинная цепь родословия здесь идёт от World English Bible к American Standard Version, к Revised Version, к Библии короля Иакова, а затем к этой: откройте ещё одну ступень под стихом короля Иакова, и под ним появится женевская формулировка — самый наглядный способ увидеть, насколько Библия короля Иакова унаследована, а не сочинена. Под Женевской по-английски больше нет ничего — только греческий и еврейский, Textus Receptus и Вестминстерский Ленинградский кодекс, где лестница достигает дна. Текст даётся так, как его несёт издание, вместе с орфографией, так что Быт. 1:1 говорит heauen; надписания псалмов и колофон Послания к Евреям идут внутри начала первого стиха, как их набирали те печатники, и оставлены там, а не вычищены.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Язык
fact.1.value=английский — елизаветинский, в исходной орфографии
fact.2.label=Кем сделана
fact.2.value=английскими протестантами, бежавшими от правления Марии I и осевшими в Женеве — Новый Завет 1557 года сделал Уильям Уиттингем, Ветхий — группа под началом Энтони Гилби
fact.3.label=Первое полное издание
fact.3.value=1560, напечатано в Женеве Роуландом Холлом
fact.4.label=Ветхий Завет с
fact.4.value=масоретского еврейского — [[WLC|Вестминстерский Ленинградский кодекс]] в этом собрании свидетельствует об этом тексте
fact.5.label=Новый Завет с
fact.5.value=греческого линии [[TR|Textus Receptus]]; с 1576 года правка Лоуренса Томсона, сделанная по греческому изданию Безы 1565 года, вытеснила Новый Завет Уиттингема в большинстве тиражей
fact.6.label=Что называет “1599”
fact.6.value=тиражи, несущие Новый Завет Томсона вместе с примечаниями Франциска Юния к Откровению, вошедшими в Женевскую Библию в том году
fact.7.label=Впервые
fact.7.value=первая английская Библия со сплошной нумерацией стихов, набранная антиквой, а не готическим шрифтом, и снабжённая полным аппаратом примечаний на полях — учебная Библия до того, как появилось само выражение
fact.8.label=Возражал против
fact.8.value=Иаков I, считавший примечания на полях подстрекательскими — жалоба, отчасти приведшая в движение [[KJV|Библию короля Иакова]]
fact.9.label=Год в каталоге
fact.9.value=пуст на карточке «Об издании», хотя на метке ступени значится GNV 1599 — Женевскую Библию переиздавали с 1560 года до 1640-х, и её Новый Завет и примечания менялись под одним и тем же именем
fact.10.label=В этом собрании
fact.10.value=все 66 книг, без апокрифов, орфография не осовременена — Быт. 1:1 читается “the heauen and the earth”
fact.11.label=Под ступенью
fact.11.value=[[TR|Textus Receptus]] и [[WLC|Вестминстерский Ленинградский кодекс]]; сама Женевская Библия — первая ступень под [[KJV|Библией короля Иакова]]
