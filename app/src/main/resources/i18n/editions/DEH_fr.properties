title=Les quarante hadiths de Shah Waliullah Dehlawi — À propos de cette édition | Common Root
description=Les quarante hadiths de Shah Waliullah Dehlawi : quarante hadiths que ce savant de Delhi du XVIIIe siècle dit avoir entendus directement de son propre maître durant une année d'études à Médine, conservés avec leurs chaînes de transmission — le recueil le plus connu de ce genre venu du sous-continent indien.
heroHeading=Les quarante hadiths de Shah Waliullah Dehlawi
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Shah Waliullah Dehlawi — de son nom complet Qutb al-Din Ahmad ibn 'Abd al-Rahim al-'Umari al-Dihlawi — naquit le 21 février 1703 à Phulat, près de Muzaffarnagar, et grandit à Delhi, où son père, Shah Abdur Rahim, avait fondé la Madrasah-i Rahimiyah. Il aurait mémorisé le Coran à sept ans et achevé le cursus habituel de son époque à quinze ans, succédant à son père à la tête de la madrasa deux ans plus tard. En 1730–31, il accomplit le hajj, puis passa environ un an à Médine à étudier le hadith — principalement auprès d'Abu Tahir al-Kurdi (également transcrit al-Kurani), avec des études complémentaires auprès de Muhammad Wafdullah al-Maliki et du cheikh Taj al-Din al-Qal'i — avant de revenir à Delhi le 16 décembre 1732. Il y mourut le 20 août 1762 (29 muharram 1176 AH) et fut enterré aux côtés de son père. Parmi ses autres œuvres figurent Hujjat Allah al-Baligha, généralement considéré comme son livre le plus important, Al-Fawz al-Kabir, et Futuh al-Haramayn, son propre récit du voyage qui le mena au Hedjaz.
hero.2=Al-Arba'in poursuit la même tradition de « quarante hadiths » (arba'iniyyat) que [[NAW|Les quarante hadiths d'an-Nawawi]] et [[QUD|Les quarante hadiths sacrés]], une tradition qui remonte à un hadith promettant à qui préserve quarante hadiths sur la religion une place parmi les savants au Jour du Jugement — un hadith que la plupart des critiques classent eux-mêmes comme da'if (faible) — et à un premier recueil, aujourd'hui perdu, attribué à Abdullah ibn al-Mubarak (m. 797). Il diffère de ces deux recueils par ce qu'il réunit : plutôt que des hadiths choisis par thème ou par rang canonique dans l'ensemble de la littérature, son éditeur anglais le décrit comme quarante hadiths que Shah Waliullah dit avoir entendus directement de son propre maître à Médine, chacun conservé avec la chaîne de transmission (sanad) par laquelle il l'a reçu — un relevé personnel de transmission issu de cette année d'études qui, selon le récit de son fils, changea sa manière d'enseigner et d'écrire une fois revenu à Delhi.
hero.3=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-dehlawi de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]], le [[NAS|Sunan an-Nasa'i]], le [[IBM|Sunan Ibn Majah]], le [[MAL|Muwatta Malik]], [[NAW|Les quarante hadiths d'an-Nawawi]] et [[QUD|Les quarante hadiths sacrés]], ainsi que ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=Arabe classique, avec une traduction anglaise sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Shah Waliullah Dehlawi (1703–1762)
fact.3.label=Titre
fact.3.value=Connu en arabe sous le nom d'Al-Arba'in (« Les quarante ») ; une édition anglaise moderne intitulée Forty Hadith of Shah Wali-Allah a été publiée par Turath Publishing en 2015, traduite par Safaruk Zaman Chowdhury
fact.4.label=Compilé
fact.4.value=Après le retour de Shah Waliullah à Delhi le 16 décembre 1732, à la suite d'un hajj accompli en 1730–31 et d'environ un an d'étude du hadith à Médine, principalement auprès d'Abu Tahir al-Kurdi (également transcrit al-Kurani)
fact.5.label=Méthode
fact.5.value=Selon son éditeur anglais, chacun des quarante hadiths est un hadith que Shah Waliullah dit avoir entendu directement de son propre maître, conservé avec la chaîne de transmission (sanad) par laquelle il l'a reçu — un relevé personnel de transmission plutôt qu'une sélection faite par thème ou par rang canonique
fact.6.label=Rang
fact.6.value=Le recueil de « quarante hadiths » (arba'iniyyat) le plus connu du sous-continent indien ; poursuit un genre dont le premier exemple connu, aujourd'hui perdu, est attribué à Abdullah ibn al-Mubarak (m. 797) et qui a aussi produit [[NAW|Les quarante hadiths d'an-Nawawi]] et [[QUD|Les quarante hadiths sacrés]]
fact.7.label=Nombre de hadiths
fact.7.value=40
fact.8.label=Dans ce corpus
fact.8.value=1 livre et 40 hadiths numérotés
fact.9.label=Traduction anglaise
fact.9.value=Tirée de l'édition eng-dehlawi de fawazahmed0/hadith-api, présentée en accompagnement de l'arabe ; le jeu de données indique un traducteur inconnu, et il n'est pas confirmé du côté de ce corpus s'il s'agit de la traduction de Turath Publishing/Chowdhury ou d'une traduction indépendante
fact.10.label=Licence
fact.10.value=Le matn arabe est le texte classique du domaine public ; la licence de la traduction anglaise est encore en cours de vérification
