title=Sunan Abi Dawud — Acerca de esta edición | Common Root
description=Sunan Abi Dawud: la colección de hadices que Abu Dawud al-Sijistani compiló por su relación con el derecho islámico, extraída de unos 500.000 relatos que examinó y organizada por tema jurídico — el tercero de los Seis Libros del islam suní.
heroHeading=Sunan Abi Dawud
readerHref=/reader?c1.src=abd-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani nació hacia el año 202 d. H. (817–818 d. C.) en Sijistán, una provincia de Jorasán situada en lo que hoy es la frontera entre Irán y Afganistán. Llegó a Bagdad a los dieciocho años y después viajó por Jorasán, Iraq, el Hiyaz, Siria, Egipto y Nishapur en busca de hadices, estudiando con unos 300 eruditos, entre ellos Ahmad ibn Hanbal. Se instaló en Basora, donde murió un viernes del mes de shawwal del año 275 d. H. (889 d. C.) a los setenta y tres años, y fue enterrado junto al jurista Sufyan al-Zauri.
hero.2=Su interés era específicamente jurídico: a diferencia de Sahih al-Bukhari y Sahih Muslim, que abarcan por igual creencia, historia y derecho, Abu Dawud construyó su Sunan en torno a hadices relacionados con el fiqh, organizándolo en libros que recorren las materias que necesita un jurista: purificación, oración, zakat, ayuno, matrimonio, herencia, administración de justicia y el resto. Según su discípulo Ibn Dasah, examinó unos 500.000 relatos de hadices al reunir el material. También estableció un criterio distinto al de al-Bukhari y Muslim: mientras ellos solo admitían hadices que consideraban plenamente auténticos, Abu Dawud incluyó algunos relatos mursal, débiles (daif) e incluso munkar cuando ningún hadiz más fuerte trataba un punto jurídico determinado, explicando su método en una carta a los habitantes de Meca y señalando él mismo las calificaciones más débiles en lugar de dejarlas sin marcar.
hero.3=La tradición suní sitúa el Sunan Abi Dawud en tercer lugar entre los Seis Libros, después de Sahih al-Bukhari y Sahih Muslim; el lugar exacto que ocupa, junto con Jami` at-Tirmidhi, Sunan an-Nasa'i y Sunan Ibn Majah, entre los cuatro restantes, se ha discutido durante mucho tiempo sin llegar a zanjarse. Las cifras dadas para el libro no coinciden entre sí de un modo que nadie parece haber resuelto: la cifra de Ibn Dasah para lo que seleccionó Abu Dawud es de 4.800 hadices, mientras que la edición moderna de referencia —preparada por Muhammad Muhyiddin Abd al-Hamid e impresa en El Cairo en 1935— numera 5.274. La cifra propia de este corpus, 43 libros y 5.274 hadices, coincide exactamente con la numeración de esa edición de El Cairo, lo que la sitúa aquí en un terreno más firme que Sahih al-Bukhari o Sahih Muslim, donde la cifra de este corpus no reproduce ninguna tradición impresa concreta.
hero.4=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-abudawud de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para Sahih al-Bukhari, Sahih Muslim y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=árabe clásico, con una traducción al inglés debajo de cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Abu Dawud Sulayman ibn al-Ash'ath al-Azdi al-Sijistani (202–275 d. H. / 817–889 d. C.)
fact.3.label=Título
fact.3.value=conocido simplemente como Sunan Abi Dawud; a diferencia de [[BUK|Sahih al-Bukhari]], no se registra para él un título formal independiente
fact.4.label=Compilado
fact.4.value=reunido en viajes por Jorasán, Iraq, el Hiyaz, Siria, Egipto y Nishapur; Abu Dawud se instaló y murió en Basora
fact.5.label=Método
fact.5.value=organizado por tema jurídico (fiqh) y no por transmisor o cronología; incluye algunos hadices débiles, mursal y munkar cuando ningún relato más fuerte trata un punto jurídico, señalados expresamente como tales
fact.6.label=Posición
fact.6.value=el tercero de los Seis Libros del islam suní (Kutub al-Sitta), después de [[BUK|Sahih al-Bukhari]] y [[MUS|Sahih Muslim]]; su rango entre los otros tres libros se discute sin estar resuelto
fact.7.label=Número de hadices
fact.7.value=4.800 seleccionados según el discípulo de Abu Dawud, Ibn Dasah, o 5.274 en la edición de referencia de Muhammad Muhyiddin Abd al-Hamid, El Cairo, 1935; las fuentes no reconcilian ambas cifras
fact.8.label=En este corpus
fact.8.value=43 libros y 5.274 hadices numerados —coincide exactamente con la numeración de la edición de El Cairo de 1935
fact.9.label=Traducción al inglés
fact.9.value=tomada de la edición eng-abudawud de fawazahmed0/hadith-api, mostrada como acompañamiento bajo el árabe; de qué traducción publicada procede aún no se ha determinado por parte de este corpus
fact.10.label=Licencia
fact.10.value=el matn árabe es el texto clásico de dominio público; la licencia de la traducción al inglés sigue en revisión
