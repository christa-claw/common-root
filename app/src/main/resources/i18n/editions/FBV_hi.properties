fact.6.label=शैली
fact.6.value=अपशब्दों और क्षणिक बोलचाल से रहित आधुनिक अंग्रेज़ी, और किसी एक विश्वास-समुदाय के मतों को प्रस्तुत करने का कोई प्रयास नहीं
fact.7.label=लाइसेंस
fact.7.value=Creative Commons एट्रिब्यूशन-शेयरअलाइक 4.0 — स्वतंत्र रूप से प्रतिलिपि, मुद्रण और अनुकूलन, बशर्ते संस्करण का नाम दिया जाए, परिवर्तन चिह्नित हों, और व्युत्पन्न कृति वही लाइसेंस धारण करे
fact.8.label=सूची में वर्ष
fact.8.value=अनुमान लगाने के बजाय रिक्त छोड़ा गया — परियोजना पाठ को संशोधित करती और साथ-साथ पुनः प्रकाशित करती रहती है, इसलिए कोई एक मुद्रण ही संस्करण नहीं है
fact.9.label=पायदान के नीचे
fact.9.value=≈ TR, जो इस अनुवाद का आधार-पाठ नहीं, यूनानी का साक्षी है; संग्रह में अभी कोई समीक्षात्मक यूनानी संस्करण नहीं, इसलिए वही स्थानापन्न [[NIV|NIV]], [[NASB|NASB]] और [[BSB|BSB]] के काम भी आता है
fact.10.label=इस संग्रह में
fact.10.value=सभी 66 पुस्तकें। अंग्रेज़ी लाइसेंसप्राप्त [[NIV|New International Version]] पर खुलती है, इसलिए यह [[BSB|Berean Standard Bible]] और [[WEB|World English Bible]] के साथ वह अंग्रेज़ी है जिसे पाठक बाहर भी ले जा सकता है
