title=Free Bible Version — इस संस्करण के विषय में | Common Root
description=Free Bible Version: जॉनथन गैलाहर द्वारा इब्रानी और नेस्ले–आलंड की यूनानी से अनूदित एक आधुनिक अंग्रेज़ी बाइबिल, जो समान-साझा लाइसेंस के अधीन प्रकाशित है, ताकि कोई भी इसे पुनर्मुद्रित कर सके।
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=यह अनुवाद एक कॉपीराइट पृष्ठ के कारण अस्तित्व में है। लगभग हर आधुनिक अंग्रेज़ी बाइबिल में ऐसा एक पृष्ठ होता है, और उस पर प्रायः यही लिखा रहता है कि कुछ सौ पद बिना पूछे उद्धृत किए जा सकते हैं, कि पूरी पुस्तक के लिए लिखित अनुमति चाहिए, और कि सम्पूर्ण पाठ प्रकाशित करने का अर्थ है रॉयल्टी चुकाना। किसी कलीसिया की वेबसाइट या किसी ध्वनि-अभिलेख के लिए बात वहीं समाप्त हो सकती है। Free Bible Version इसीलिए बनाई गई कि वह वह संस्करण हो जिसके आगे कुछ भी बाधा न हो।
hero.2=यह जॉनथन गैलाहर की कृति है, जिनकी धर्मविद्या की डॉक्टरेट सेंट एंड्रयूज़ से है, और इसे Free Bible Ministry प्रकाशित करती है, जो अलाभकारी संस्था है। नया नियम नेस्ले–आलंड की यूनानी से आता है — वही समीक्षात्मक पाठ जिसे बाइबिल सोसाइटियाँ काम में लेती हैं — और पुराना नियम इब्रानी से। परियोजना जिस पद्धति का वर्णन करती है, उसे कह देना उचित है, क्योंकि वह प्रचलित पद्धति नहीं है: अनुवाद मूल पाठ से केवल कोशों के सहारे किया जाता है, और उसके बाद ही उपलब्ध संस्करणों से मिलान होता है — पुनरावृत्ति और त्रुटि की जाँच के रूप में, स्रोत के रूप में नहीं। यह न किसी पुरानी अंग्रेज़ी बाइबिल का संशोधन है और न नई बाइबिलों का समुच्चय। इसका घोषित लक्ष्य ऐसी समकालीन अंग्रेज़ी है जो अपशब्दों और चलती हुई शैलियों से बचती है, और यह किसी एक विश्वास-समुदाय के मतों की ओर अनुवाद करने से इनकार करती है।
hero.3=लाइसेंस ही इस सारे प्रयास का मर्म है। वह है Creative Commons एट्रिब्यूशन-शेयरअलाइक 4.0: इसे प्रतिलिपि कीजिए, छापिए, वेबसाइट पर रखिए, अनुकूलित कीजिए — बशर्ते संस्करण का नाम दिया जाए, परिवर्तन चिह्नित हों, और उससे जो कुछ बनाया जाए वह उन्हीं शर्तों पर निकले। यह सार्वजनिक अधिकार-क्षेत्र से भिन्न सौदा है — स्वतंत्रता आगे सौंपी जाती है, त्यागी नहीं जाती — और यही लाइसेंस इस संग्रह की स्पेनी Versión Biblia Libre का भी है, जो इसी सेवा-कार्य से आती है।
hero.4=पाठक के लिए इससे दो बातें निकलती हैं। सूची इसका वर्ष रिक्त छोड़ती है, क्योंकि परियोजना संशोधन करते-करते प्रकाशित करती जाती है; कोई तिथि-अंकित मुद्रण नहीं है जिससे यह संग्रह बँधा हो, और कोई गढ़ लेना रिक्त से भी बुरा होता। और Free Bible Version के किसी पद के नीचे खुला पायदान ≈ TR दिखाता है, अर्थात् टेक्स्टुस रेसेप्टुस, जो साक्षी के रूप में चिह्नित है, मूल के रूप में नहीं। इस अनुवाद का आधार वह नहीं है। वह तो वही है जो संग्रह इस समय यूनानी के रूप में दे सकता है — कोई समीक्षात्मक संस्करण अभी यहाँ नहीं है — और वही स्थानापन्न इसी कारण New International Version, New American Standard Bible और Berean Standard Bible के नीचे भी दिखता है।

