title=Smith & Van Dyck (eBible-teksti) — Tietoa tästä laitoksesta | Common Root
description=Smithin ja Van Dyckin vuoden 1865 arabiankielinen Raamattu täysin vokalisoidussa sähköisessä tekstissä, jonka eBible.org julkaisee vapaana käytössä, American Bible Societyn lähdetiedostosta.
heroHeading=Smith & Van Dyck — täysin vokalisoitu teksti
readerHref=/reader?c1.src=svd-e

# The narrative, one paragraph per key, in order.
hero.1=Tämä on sama käännös kuin [[SVD|Smith & Van Dyck]] — arabiankielinen Raamattu, jonka Eli Smith aloitti Beirutissa ja Cornelius Van Dyck sai päätökseen vuonna 1865 yhdessä arabian oppineiden Butrus al-Bustanin, Nasif al-Yazijin ja Yusuf al-Asirin kanssa — latottu eri sähköisestä tiedostosta. Käännös on sama; tiedosto on syy, jonka tähden tämä laitos on olemassa.
hero.2=Vuoden 1865 Raamattu on vapaa kaikille, mutta sen sähköinen jäljennös on myös jonkun työtä, ja Van Dyckin teksti kiertää verkossa monina kappaleina, joiden alkuperä on epävarma. Joitakin tarjotaan väitteellä, että tekijänoikeus koskee itse translitterointia. Tekstiä, jonka alkuperää ei voi jäljittää, ei voi painaa luottavaisin mielin, niin tämä laitos käyttää jäljennöstä, jonka alkuperä voidaan jäljittää: eBible.org:n julkaisemaa, vapaaksi käytöksi julistettua tekstiä, joka nimeää kääntäjäksi Syyrian lähetyksen ja lähteen luovuttajaksi American Bible Societyn. Tiedosto on päivätty 2020-08-03.
hero.3=Se on täysin vokalisoitu. Joka sana kantaa lyhyet vokaalinsa ja muut lukumerkit, missä tämän lukuohjelman toinen Van Dyckin teksti on suurelta osin vokalisoimatta. Se tekee latomisesta hitaampaa ja ääneen lukemisesta helpompaa, ja vokalisoitu sivu vaatii enemmän tilaa rivien väliin, niin että tämän laitoksen painettu kappale käy pitemmäksi kuin sama teksti vokalisoimatta.
hero.4=Se on laitos, joka kannattaa valita, kun kysymys on siitä, saako tekstin painaa. Näytöltä luettaessa kumpi tahansa Van Dyck käy yhtä hyvin.

