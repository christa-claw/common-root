title=Mormonin kirja — Tietoja tästä laitoksesta | Common Root
description=Mormonin kirja: Joseph Smithin vuonna 1830 sanelemana syntynyt muinaisten profeettojen aikakirja Amerikasta, painettu Palmyrassa, New Yorkin valtiossa, ja myöhempien päivien pyhien luettu Raamatun rinnakkaispyhä kirja.
heroHeading=Mormonin kirja
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith sanoi kääntäneensä tämän kirjan "Jumalan lahjalla ja voimalla" muinaisista metallilevyistä, jotka hän kertoi löytäneensä vuonna 1827 lähellä perheensä tilaa Palmyran kaupungin ulkopuolella New Yorkin valtiossa, ja palauttaneensa myöhemmin sanansaattajalle, joka oli näyttänyt ne hänelle. Sanelua todistaneet kertovat hänen tarkastelleen näkijänkiveä — työn myöhemmissä vaiheissa kiveä, jonka hän asetti hattuun sulkeakseen valon pois, ei vain sitä kahden kiven paria, joka oli kiinnitetty rintakilpeen ja jota perinteisesti kutsutaan Uurimiksi ja Tummimiksi ja jonka kerrotaan tulleen levyjen mukana — ja lausuneen tekstin ääneen kirjurin kirjoittaessa sen ylös. Oliver Cowdery kirjoitti suurimman osan tällä tavoin noin kahden kuukauden aikana vuonna 1829, pääosin Whitmer-perheen tilalla Fayettessa, New Yorkissa; Martin Harris ja Josephin vaimo Emma Smith toimivat kirjureina lyhyemmissä, aikaisemmissa vaiheissa.
hero.2=Käsikirjoitus painettiin vuoden sisällä. Smith hankki teokselle tekijänoikeuden kesäkuussa 1829, ja painaminen alkoi Egbert B. Grandinin painotalossa Palmyrassa, missä ladonnan tekijä John H. Gilbert lisäsi välimerkit ja kappalejaot, joita sanellussa käsikirjoituksessa ei ollut. Valmis kirja ilmestyi maaliskuussa 1830: noin 5 000 kappaletta, Grandinin koko painos.
hero.3=Se jakautuu viiteentoista kirjaan, Ensimmäisestä Nefin kirjasta Moronin kirjaan, joista jokainen on nimetty sen koonneeksi mainitun profeetallisen aikakirjanpitäjän mukaan. Yhdessäkään vuoden 1830 kappaleessa ei ollut yhtäkään jaenumeroa — teksti kulki yhtenäisenä leipätekstinä nykyistä paljon pidempien lukujen sisällä. Nykyisin käytössä olevat luku- ja jaejaot ovat peräisin Orson Prattin vuoden 1879 laitoksesta; hän myös lyhensi luvut ja lisäsi ensimmäiset alaviitteet. Myöhemmät laitokset muokkasivat esitystapaa edelleen: George F. Richardsin johtama komitea latoi tekstin vuonna 1920 kaksipalstaiseksi ja lisäsi lukujen tiivistelmät ja ääntämisoppaan; vuoden 1981 laitos päivitti ristiviittaukset, lukujen otsikot ja muun hakuaineiston; ja vuoden 2013 painos korjasi painolaattoihin vuodesta 1981 lähtien hiipineet typografiset epäjohdonmukaisuudet.
hero.4=Se on yksi niistä neljästä teoksesta, joita myöhempien päivien pyhien liike kutsuu standarditeoksikseen, Raamatun, [[DC|Opin ja liittojen kirjan]] ja [[PGP|Kallisarvoisen helmen kirjan]] ohella. Tämän aineiston teksti on peräisin Mormon Documentation Project -hankkeen JSON-aineistosta, jonka ylläpitäjä on julistanut yleisomistukseen; se noudattaa nykyisen standardilaitoksen sanamuotoa ja jaejakoa, vuoden 2013 painoksen typografisin korjauksin, ja jättää pois alaviitteet, lukujen tiivistelmät ja johdannon, jotka ovat edelleen tekijänoikeuden alaisia. Koska tässä on nimenomaan tämä nykyinen standarditeksti eikä mikään yksittäinen historiallinen painos, sille ei tässä esitetä yksittäistä julkaisuvuotta.

