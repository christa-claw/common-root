title=Coran — Pickthall — À propos de cette édition | Common Root
description=La traduction de 1930 de Muhammad Marmaduke Pickthall, la première traduction anglaise du Coran réalisée par un musulman dont l'anglais était la langue maternelle — produite au service du nizam d'Hyderabad et avec les conseils des savants d'al-Azhar, et dans ce corpus l'anglais affiché par défaut sous le texte arabe.
heroHeading=Coran — Pickthall
readerHref=/reader?c1.src=q-en

# The narrative, one paragraph per key, in order.
hero.1=Muhammad Marmaduke Pickthall (1875-1936) était un romancier anglais, admiré à son époque par H. G. Wells et D. H. Lawrence, avant de devenir traducteur de texte sacré. Il déclara sa conversion à l'islam en novembre 1917, après une conférence intitulée « Islam and Progress » donnée devant la Muslim Literary Society de Notting Hill, et prononça la chahada le même mois à la Woking Muslim Mission. Une décennie plus tard, il était directeur du Chadarghat High School à Hyderabad, au service du nizam, et c'est de là qu'il prit, en 1928, une année sabbatique de deux ans pour faire ce qu'il voulait faire depuis sa conversion : traduire le Coran en anglais.
hero.2=Il ne le fit ni seul ni dans la hâte. En 1929, il passa trois mois au Caire, où le soutien de Rashid Rida lui ouvrit des portes, cherchant la bénédiction des savants d'al-Azhar pour un projet dont certains d'entre eux avaient été prévenus qu'il pourrait leur coûter leur poste — une partie d'al-Azhar tenait la traduction même du Coran pour une affaire grave. Pickthall poursuivit malgré tout et continua à les consulter. Ce qu'il publia en 1930, sous le titre « The Meaning of the Glorious Koran: An Explanatory Translation », porte cette prudence jusque dans son titre : non pas « le Coran en anglais » mais une explication de son sens, car aucune traduction, selon son propre point de vue déclaré, ne pouvait être le Coran lui-même. Alfred A. Knopf publia la première édition à New York ; une édition bilingue de l'imprimerie du gouvernement d'Hyderabad suivit.
hero.3=Le Times Literary Supplement la qualifia de « a great literary achievement », et elle est généralement décrite comme la première traduction anglaise du Coran faite par un musulman dont l'anglais était la langue maternelle — les versions anglaises antérieures, notamment celles de Sale et de Rodwell, étaient l'œuvre d'orientalistes non musulmans. Celle de Pickthall est restée imprimée et utilisée pendant près d'un siècle depuis, l'une des rares traductions anglaises que des lecteurs ordinaires, et non seulement des érudits, lisent réellement.
hero.4=Dans ce corpus, c'est la traduction affichée par défaut sous le texte arabe uthmani — l'arabe reste la base de chaque colonne, et cet anglais s'affiche comme un commentaire à ses côtés, sans jamais le remplacer. Elle a été choisie pour ce rôle pour une raison aussi peu glorieuse que littéraire : un examen des traductions disponibles n'a trouvé que deux versions anglaises sans ambiguïté dans le domaine public, celle-ci et celle de Yusuf Ali de 1934, ainsi que la russe de Sablukov de 1878 pour une troisième langue. Le texte ici est une numérisation de la traduction, obtenue via alquran.cloud plutôt que tirée d'une impression particulière, et doit donc se lire comme le texte de Pickthall plutôt que comme le fac-similé d'une édition donnée.

