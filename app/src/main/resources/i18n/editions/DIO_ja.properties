title=ディオダティ聖書1649年（イタリア語） — この版について | Common Root
description=ジョヴァンニ・ディオダティのイタリア語聖書：1607年にジュネーヴで出版され、ウルガータではなくヘブライ語とギリシャ語から訳された最初のイタリア語聖書であり、1641年に自身の注釈を付して改訂された——そしてなぜファイルの年が彼の没年になっているのか。
heroHeading=ディオダティ聖書1649年
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=ジョヴァンニ・ディオダティは1576年、信仰を捨てるよりもイタリアを去ることを選んだルッカ出身の商人一家のもとにジュネーヴで生まれた。彼は血筋においてイタリア人であり、教育においてジュネーヴ人であった。この組み合わせこそ、この書物が存在する理由のすべてである——彼は宗教改革がまだ及んでいない国の言語を知っており、その出版拠点となった都市に身を置いていた。テオドール・ベザは二十一歳の彼をヘブライ語講座の教授に推薦した。彼は1606年に神学教授となり、1608年に牧師となり、その翌年にはベザの後を継いで神学講座を担った。1618年にはジュネーヴ代表としてドルト会議に赴き、その議事録をまとめる六人の一人に選ばれた。
hero.2=彼のイタリア語聖書は1607年にジュネーヴで印刷された。イタリアにはそれ以前にも俗語訳聖書があった——1471年のマレルミ訳、1532年のブルチョーリ訳——だが、それらはラテン語に拠るか、それに大きく依存していた。ディオダティはヘブライ語とギリシャ語に向かい、新約聖書については、同じ都市で一世代前にベザが校訂したギリシャ語本文を用いた。1641年には自身の解説注釈を添えた改訂版を出し、後の再版はすべてこの版から受け継がれている。これはイタリアのプロテスタント聖書となり、今もそうであり続けている——プロテスタントの読者がほとんど存在しない国において、四世紀のあいだごく少数の人々によって担われてきたことを意味する。彼は1644年にフランス語訳も手がけたが、それは一般に二つのうち弱いほうとされており、本人もおそらく異を唱えなかっただろう。
hero.3=カードにある年について一言述べておく価値がある。というのも、それは実在しないからである。この本文は「ディオダティ1649」という名でデジタル流通しているが、1649年はある版の年ではない——ディオダティが世を去った年である。意味を持つ二つの年は、翻訳が最初に世に出た1607年と、彼がそれを改訂した1641年である。特定のデジタルファイルが実際にどちらを表しているのかは、本プロジェクトが確認できていないため、カタログは責任を持てない数字を印刷するよりも、年の欄を空欄にしている。名称はそのまま受け継がれている。人々が検索するのはその名だからである。
hero.4=この読書環境において、これは唯一のイタリア語聖書であり、インターフェースをイタリア語に設定するとこれが開く——レイナ・バレラ1909がスペイン語のために選び抜かれたのとは違い、選定によってではなく、カタログを走査してもこの言語には他に何もないためである。系譜の段には母本が記録されていないため、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る。その底面はギリシャ語についてテクストゥス・レセプトゥスを供給しており、ここではそれが珍しく真実に近い。このコーパスの多くの版では、レセプトゥスは翻訳者たちが実際に使った校訂本文の代わりを務めているにすぎないが、ディオダティは本当にその系統の活字ギリシャ語本文から訳していたからである。その段のチップには年がなく、カードの空欄と一致している。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=イタリア語
fact.2.label=翻訳者
fact.2.value=ジョヴァンニ・ディオダティ（1576–1649）。信仰を捨てるよりもルッカを去ることを選んだプロテスタント商人の一家のもとにジュネーヴで生まれた
fact.3.label=初版
fact.3.value=1607年、ジュネーヴにて——ラテン語ではなくヘブライ語とギリシャ語から訳された最初のイタリア語聖書
fact.4.label=改訂版
fact.4.value=1641年、ディオダティ自身の注釈付き——以後三世紀にわたり、この形で再版され続けた
fact.5.label=なぜ表示が1649年なのか
fact.5.value=1649年はディオダティの没年であり、ある版の年ではない——その年がデジタル本文に付随しているだけであり、カタログの札は年を断定するよりも空欄にしている
fact.6.label=新約聖書の背後にあるギリシャ語
fact.6.value=一世代前にジュネーヴで作られたベザの校訂本——このコーパスが[[TR|テクストゥス・レセプトゥス]]として収める活字ギリシャ語本文の系統に属する
fact.7.label=彼のもう一つの仕事
fact.7.value=1644年のフランス語聖書。一般に二つのうち弱いほうとされる——フランス語は彼が考える言語ではなかった
fact.8.label=内容
fact.8.value=66巻——プロテスタントの正典であり、外典は含まない
fact.9.label=このコーパスでは
fact.9.value=ここにある唯一のイタリア語聖書であり、イタリア語インターフェースはこれを開く。系譜の段には母本が記録されておらず、その段のチップは年なしで表示される
fact.10.label=音声
fact.10.value=聖書全体——新旧両約のすべての章——が、マイクロソフト・アジュール（Microsoft Azure）のニューラル音声it-IT-BenignoNeuralによって読み上げられている。節ごとではなく章ごとに合成されており、散文が自然な文のリズムを保っている。
fact.11.label=音声の制限
fact.11.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
