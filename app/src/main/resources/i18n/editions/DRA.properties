title=Douay-Rheims 1899 — About This Edition | Common Root
description=The Douay-Rheims Bible: the English Catholic translation made from the Latin Vulgate at Rheims in 1582 and Douai in 1609–10, revised by Bishop Challoner, in the 1899 Baltimore printing.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=In 1568 a body of English Catholics, many of them Oxford men who could no longer hold their posts, set up a college at Douai in Flanders under William Allen. Part of what it existed to do was to put an English Bible into Catholic hands, because the only English Bibles then in circulation were Protestant ones and were being used in argument. Gregory Martin began translating in October 1578 at something like two chapters a day, and the New Testament was published in 1582 at Rheims, where the college had temporarily moved. Martin died on the 28th of October that year, weeks after his New Testament appeared. The Old Testament was ready at the same time and then sat unprinted, for the plain reason that the college could not afford to print it; it came out at last in two volumes in 1609 and 1610, by which point the King James Version was two years away.
hero.2=What separates it from every other English Bible in this corpus is what it was made from. Not the Hebrew and the Greek: the Latin Vulgate. The Council of Trent had declared the Vulgate the authentic text of the Church, and the Douai translators argued in addition that Jerome had worked from manuscripts older than any Greek copy available to them — which, for the Old Testament, was not an unreasonable thing to think in 1600. The prose that resulted is heavily Latinate, sometimes to the point of not being English at all: the Lord's Prayer asks for “supersubstantial bread”, because the translators would not naturalise a word the theology was resting on. That was policy, not incapacity.
hero.3=By the middle of the eighteenth century almost nobody could read it, and Bishop Richard Challoner revised it between 1749 and 1752 — heavily, and largely in the direction of the King James Version, which by then was simply what English scripture sounded like. Every Bible sold today as a Douay-Rheims is Challoner's text rather than Martin's. This one is the 1899 American printing, from the John Murphy Company of Baltimore, carrying the imprimatur of James Cardinal Gibbons; because that printing is long out of copyright it is the one that has been scanned, keyed and reproduced ever since, and it is what nearly every digital Douay-Rheims actually is.
hero.4=In this reader it does something almost no other edition here can. Its recorded parent is present in the corpus: open a lineage rung beneath a Douay-Rheims verse and the rung below is the Latin Vulgate itself, the actual text it was translated from, rather than the ≈ original-language floor that most editions fall through to. That is the case the rung mechanism was built for. The influence also ran the other way — the Rheims New Testament was on the King James translators' desks, and a fair amount of its Latinate vocabulary passed into their work — but the lineage list keeps only formal revision lines, so that debt is not recorded there. One inversion to note: its rung chip shows the year 1899 while the catalogue card shows no year at all. The rung years are a hand-curated list and the card reads the catalogue's own metadata, and where an edition sits in one and not the other, the two disagree in public.
hero.5=A caution about the canon. The text held here has 72 books, not the 73 of a printed Catholic Bible. The six deuterocanonical books it does carry — Tobit, Judith, 1 and 2 Maccabees, Wisdom and Sirach — sit after Revelation instead of in their Catholic positions, and Baruch is absent altogether. That is a property of the digital text as it was ingested, not of the 1899 book, and it means this column will read correctly verse by verse but should not be used to check what the Catholic canon contains.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Language
fact.1.value=English — the Catholic tradition
fact.2.label=Translated from
fact.2.value=The Latin Vulgate, not the Hebrew and Greek — the same [[VUL|Vulgate]] this corpus holds
fact.3.label=New Testament
fact.3.value=Rheims, 1582 — principally the work of Gregory Martin, with William Allen, Richard Bristow and Thomas Worthington
fact.4.label=Old Testament
fact.4.value=Douai, 1609 and 1610, in two volumes — finished at the same time as the New Testament but held nearly thirty years for want of money to print it
fact.5.label=Revised by
fact.5.value=Bishop Richard Challoner, 1749–1752 — every book sold as a Douay-Rheims today is Challoner's revision, not the 1582/1610 text
fact.6.label=This printing
fact.6.value=The 1899 American edition of the John Murphy Company, Baltimore, with the imprimatur of James Cardinal Gibbons — long out of copyright, and the version that circulates digitally
fact.7.label=Contents here
fact.7.value=72 books: the 66 of the Protestant canon in Protestant order, with Tobit, Judith, 1 and 2 Maccabees, Wisdom and Sirach appended after Revelation. Baruch is not present, so this column is not a reliable check on the Catholic canon
fact.8.label=Lineage
fact.8.value=One of the few editions here whose recorded parent is itself in the corpus — a rung beneath a Douay-Rheims verse opens on [[VUL|the Latin Vulgate]] rather than the original-language floor
fact.9.label=In this corpus
fact.9.value=Its rung chip carries the year 1899 even though the catalogue card leaves the year blank; the rung years are a separate curated list, and the two are allowed to disagree
