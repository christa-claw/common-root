title=Nueva Biblia de las Américas — Om denna utgåva | Common Root
description=Nueva Biblia de las Américas: The Lockman Foundations latinamerikansk-spanska bearbetning av sin egen La Biblia de las Américas, som för samma ord-för-ord-metod in i den vardagsspanska som talas i hela Amerika.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=Nueva Biblia de las Américas är The Lockman Foundations latinamerikansk-spanska utgåva, byggd på stiftelsens tidigare La Biblia de las Américas från 1986 — som i sin tur är resultatet av omkring femton års arbete av tjugotvå översättare och konsulter, enligt samma ord-för-ord-översättningsfilosofi som senare fördes över till engelska som New American Standard Bible. I stället för en ny översättning från hebreiska och grekiska är NBLA en registerbearbetning: en tolv man stark Lockman-kommitté omarbetade La Biblia de las Américas mer kastilianskt präglade spanska till den förtroliga, moderna spanska som talas i hela Latinamerika, och ersatte former som andra person pluralis "vosotros" med det mer spridda "ustedes" och lättade upp konstruktioner som det formelmässiga "y" och "sucedió que", som den tidigare texten hade burit över ordagrant från hebreisk berättarstil. The Lockman Foundations eget tillstånd-att-citera-meddelande daterar den färdiga texten till 2005.
hero.2=Textgrunden följer direkt från La Biblia de las Américas: Gamla testamentet vilar på Rudolf Kittels Biblia Hebraica, med Dödahavsrullarna konsulterade, och Nya testamentet i allmänhet på den 27:e upplagan av Eberhard Nestles Novum Testamentum Graece, med uppmärksamhet på ytterligare handskriftsbelägg där de påverkar en viss läsart. Vissa bokhandlare och bibelprogramvarukataloger grupperar numera Nueva Biblia de las Américas tillsammans med stiftelsens revidering från 2020 av New American Standard Bible, och marknadsför de två som ett matchande par för engelsk- och spanskspråkiga läsare av samma litterala tradition; översättningen själv bär dock inget senare upphovsrättsår än 2005 i stiftelsens egna meddelanden.
hero.3=Det spanska gränssnittet öppnar här som standard på Reina Valera 1909, en fritt kopierbar text från en helt annan översättningstradition och ett sekel äldre; Nueva Biblia de las Américas nås i stället från sitt eget kort i översättningsrutnätet. Den delar lite textuell historia med den utgåvan, men mycket med New American Standard Bible — samma stiftelse, samma formella motsvarighetsmetod och samma licensierade snarare än fria status, som tillåter att upp till 500 verser citeras utan skriftligt tillstånd, förutsatt att de inte utgör en hel bok eller mer än en fjärdedel av det citerande verket. Ingen förälder är antecknad i härstamningsstegen: La Biblia de las Américas, texten den bearbetar, finns inte själv i detta korpus, så en stegpinne under en NBLA-vers går rakt ner till botten med originalspråket, markerad ≈.

fact.1.label=Språk
fact.1.value=Spanska
fact.2.label=Beställd av
fact.2.value=The Lockman Foundation i La Habra, Kalifornien — samma ideella organisation bakom New American Standard Bible och dess egen föregångare, La Biblia de las Américas (1986)
fact.3.label=Utförd av
fact.3.value=En tolv man stark Lockman-revideringskommitté, som arbetade utifrån La Biblia de las Américas översättning, i sin tur verket av tjugotvå översättare och konsulter under omkring femton år
fact.4.label=Gamla testamentet från
fact.4.value=Rudolf Kittels Biblia Hebraica, med Dödahavsrullarna konsulterade, ärvt från La Biblia de las Américas egen textgrund
fact.5.label=Nya testamentet från
fact.5.value=Eberhard Nestles Novum Testamentum Graece, i allmänhet den 27:e upplagan, med uppmärksamhet på ytterligare handskriftsbelägg där de påverkar en läsart
fact.6.label=Typ av översättning
fact.6.value=Formell motsvarighet, samma ord-för-ord-metod som La Biblia de las Américas och New American Standard Bible — inte en ny översättning, utan en registerbearbetning till den förtroliga, moderna spanska som talas i hela Latinamerika, där kastilianska former som "vosotros" ersätts med "ustedes" och konstruktioner som det formelmässiga "y" och "sucedió que", som den tidigare texten bar över ordagrant från hebreiska, omarbetas
fact.7.label=Utgiven
fact.7.value=Upphovsrättsskyddad 2005 av The Lockman Foundation; vissa kataloger har sedan grupperat den tillsammans med stiftelsens revidering från 2020 av New American Standard Bible, men 2005 är fortfarande det år som anges i dess eget upphovsrättsmeddelande
fact.8.label=Licens
fact.8.value=Licensierad, inte fri att kopiera. Upp till 500 verser får citeras i valfri form utan skriftligt tillstånd, förutsatt att de inte utgör en hel bibelbok eller mer än en fjärdedel av det citerande verket, med ett upphovsrättsmeddelande som anger 2005; allt därutöver kräver The Lockman Foundations tillstånd
fact.9.label=I detta korpus
fact.9.value=Licensierad snarare än fri att kopiera, precis som [[NASB|New American Standard Bible]] från samma stiftelse. Det spanska gränssnittet öppnar som standard på [[RVR09|Reina Valera 1909]], en fritt kopierbar text från en obesläktad tradition och ett sekel äldre, medan denna utgåva nås från sitt eget kort. Ingen förälder är antecknad i härstamningsstegen: den är en registerbearbetning av La Biblia de las Américas, som inte själv finns i detta korpus, så en stegpinne under en NBLA-vers går rakt ner till botten med originalspråket, markerad ≈.
