title=日内瓦圣经 1599 — 关于此版本 | Common Root
description=日内瓦圣经：流亡日内瓦的英格兰新教徒所作，第一部通篇编有节号并附旁注的英文圣经，为莎士比亚那一代人所读，也是钦定本之下的一级。
heroHeading=日内瓦圣经 1599
readerHref=/reader?c1.src=gnv

# The narrative, one paragraph per key, in order.
hero.1=这部圣经作于异乡，出自一群无法安然留在本国的人之手。1553 年玛丽一世登基、英格兰重归罗马之后，数百名新教徒离境；其中一些人落脚于加尔文的日内瓦，那里有印刷机，有希伯来文与希腊文的学问，也没有需要交代的主教。威廉·惠廷汉于 1557 年在那里出版了一部新约。安东尼·吉尔比领导的团队通读了旧约，全本圣经于 1560 年由罗兰·霍尔在日内瓦印行，其时距玛丽去世已两年，多数流亡者早已返乡。
hero.2=他们所成就的，改变了英文圣经的样貌。这是第一部为每一节都编号的圣经，读者可以被指向某一行，而不只是某一章。它以罗马体而非哥特体排印，开本与价钱都足以让人自己拥有，而不必被锁在读经台上。页边也满满当当：互见、难词注解、地图，以及说明一段经文含义的注释。最后这一项，正是它被人喜爱、也被人记恨的缘由。这些注释是改革宗的，某些地方相当尖锐，它们告诉读者该如何看待君王，与告诉读者该如何看待教义一样毫不迟疑。
hero.3=此版本的年份需要一点提醒，因为日内瓦圣经并非一本书，而是一部在八十年间不断重印、其组成部分不断更换的文本。1576 年，劳伦斯·汤姆森以自己依照西奥多·贝扎 1565 年希腊文版所作的修订替换了新约；自 1587 年起，多数日内瓦圣经所载的便是这一新约。1599 年又加入了弗兰西斯库斯·尤尼乌斯对启示录的注释。因此“1599”与其说指某个印刷年份，不如说指一种组合——汤姆森的新约加上尤尼乌斯的启示录注释——而带有该年份的圣经在此之后仍继续印行。这就是目录卡片将年份留空、而谱系标签因需要一个简短的显示值而作 GNV 1599 的缘故。
hero.4=它在本收藏中的位置是一处枢纽。这里最长的一条谱系链自 World English Bible 上溯至 American Standard Version、Revised Version、钦定本，再到这一部：在钦定本的某一节之下再展开一级，日内瓦的措辞便出现在其下——这是看清钦定本有多少是承袭而非自撰的最直接的办法。日内瓦之下，英文再无它物——只有希腊文与希伯来文，Textus Receptus 与威斯敏斯特列宁格勒抄本，梯子在此触底。文本按该版本原样呈现，连拼写一并保留，因此创世记 1:1 作 heauen；诗篇的题记与希伯来书的尾跋依那些印本的排法，接在首节开头之内，也就照原样留着，未加清理。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=语言
fact.1.value=英语——伊丽莎白时代英语，保留原始拼写
fact.2.label=编者
fact.2.value=逃离玛丽一世治下、定居日内瓦的英格兰新教徒——威廉·惠廷汉负责 1557 年的新约，安东尼·吉尔比领导的团队负责旧约
fact.3.label=首个全本
fact.3.value=1560 年，由罗兰·霍尔在日内瓦印行
fact.4.label=旧约据
fact.4.value=马所拉希伯来文——[[WLC|威斯敏斯特列宁格勒抄本]]是本语料库中该文本的见证
fact.5.label=新约据
fact.5.value=[[TR|公认文本]]一系的希腊文；自 1576 年起，劳伦斯·汤姆森依贝扎 1565 年希腊文版所作的修订，在多数印本中取代了惠廷汉的新约
fact.6.label=“1599”所指
fact.6.value=载有汤姆森新约并附弗兰西斯库斯·尤尼乌斯启示录注释的印本，该注释于当年进入日内瓦圣经
fact.7.label=开创之处
fact.7.value=第一部通篇编有节号的英文圣经，以罗马体而非哥特体排印，并附有完整的旁注体系——在“研读本”一词出现之前的研读本圣经
fact.8.label=反对者
fact.8.value=詹姆士一世，他认为旁注含有煽动之意——这一不满促成了[[KJV|钦定本]]的启动
fact.9.label=目录中的年份
fact.9.value=“关于”卡片上留空，而谱系标签作 GNV 1599——日内瓦圣经自 1560 年重印至 1640 年代，其新约与注释在同一名称下不断更换
fact.10.label=在本语料库中
fact.10.value=全部 66 卷，无次经，拼写未作现代化——创世记 1:1 作“the heauen and the earth”
fact.11.label=其下一级
fact.11.value=[[TR|公认文本]]与[[WLC|威斯敏斯特列宁格勒抄本]]；日内瓦圣经本身即[[KJV|钦定本]]之下的第一级
