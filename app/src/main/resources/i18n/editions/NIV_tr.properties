title=New International Version — Bu Baskı Hakkında | Common Root
description=New International Version: bu okuyucunun varsayılan olarak açıldığı İngilizce Kutsal Kitap; kaynak dillerden doğrudan Committee on Bible Translation tarafından çevrilmiş ve ilk kez 1978'de tamamlanmıştır — burada 2011 metniyle.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Bu, bir mezhebin hoşnutsuzluğuyla başladı. 1955'te iş adamı Howard Long, Peder Peter De Jong ile birlikte, Christian Reformed Church'ü çağdaş İngilizceyle bir Kutsal Kitap üretmesi için zorladı ve 1957'de kilise bu fikri incelemek üzere bir komite onayladı. National Association of Evangelicals da aynı yıl kendi benzer projesini başlatmıştı. İki kuruluş güçlerini birleştirdi: ortak bir komite 1964'te bir çeviri konferansına davetler gönderdi; konferans Ağustos 1965'te Illinois'deki Palos Heights'ta Trinity Christian College'da toplandı ve çalışmayı sürdürmek için "on beş kişilik sürekli bir komite" kurulmasına karar verdi. Bu sürekli komite, Committee on Bible Translation oldu. 1967'de New York Bible Society — o zamandan beri Biblica olarak adlandırılan kurum — projenin himayesini üstlendi ve çeviriyi yapacak bilim adamlarını işe aldı.
hero.2=Burada hiçbir şey daha eski bir İngilizce Kutsal Kitaptan türememiştir. King James Version, Revised Version, American Standard Version ve World English Bible bu derlemede tek bir gözden geçirme zincirini oluştururken, New International Version doğrudan İbranice, Aramice ve Yunancadan yeniden çevrildi: Eski Antlaşma, Ölü Deniz Parşömenleri, Septuaginta ve diğer eski tanıkların da gözetildiği Masoretik İbranice metinden; Yeni Antlaşma ise United Bible Societies ve Nestle-Aland baskılarının temsil ettiği seçmeci eleştirel Yunanca metinden — burada Cenevre İncili'nin ve King James'in temelindeki Textus Receptus'tan değil. On beş kişilik komite, yaklaşık on yıl içinde, birkaç İngilizce konuşulan ülkeden ve pek çok mezhepten yüzden fazla bilim adamına dayanan bir projeye büyüdü. Belirttikleri hedef, orijinal metnin doğruluğuna bağlı kalan, ama onun kelime kelime bir kopyası gibi okunmayan bir çeviriydi — bu denge, genellikle dinamik eşdeğerlik olarak sınıflandırılır; sıkı harfiyen bir çeviri ile gevşek bir açımlama arasında bir yerde durur.
hero.3=Yeni Antlaşma önce çıktı, 1973'te; tam Kutsal Kitap onu 27 Ekim 1978'de izledi; hafif bir gözden geçirme 1984'te geldi. Metin 2011'de daha köklü biçimde değişti; daha kapsamlı bir gözden geçirme hem 1984 baskısının hem de 2005'teki Today's New International Version'ın yerini aldı ve ikisini de o zamandan beri geçerli olan tek metin lehine kullanımdan kaldırdı. Bu derlemede tutulan, işte bu 2011 metnidir — katalog kartının gösterdiği aynı yıl. Telif hakları her zaman Biblica, Inc.'e aittir; Birleşik Devletler'de Zondervan, Birleşik Krallık'ta ise Hodder & Stoughton tarafından yayımlanır.
hero.4=Bu okuyucudaki yeri, sessiz bir biçimde merkezidir. Arayüzü İngilizceye ayarlayın, açılan bu olur — bu derlemedeki King James Version ve Revised Version sayfaları kendileri bunun bu olmadığını söyler ve buraya, kendisinden geçiş yapılan baskı olarak, üzerine inilen baskı olarak değil, işaret eder. Hiçbir şeyi gözden geçirmediği için, derleme onun için bir kaynak metin kaydetmez: bir New International Version ayetinin altında bir soy basamağı açmak, doğrudan ≈ ile işaretli özgün dil tabanına iner, [[BSB|Berean Standard Bible]] için olduğu gibi — bilinmesi gereken bir fark dışında. O tabanın Yunanca tanığı Textus Receptus'tur, ve Textus Receptus bu çevirinin Yeni Antlaşması'nın gerçekte neden yapıldığı metin değildir — taban, genel olarak "özgün Yunanca" yerine geçer, bu komitenin kendi çalışma metni için değil. Onu İngilizce komşularının çoğundan ayıran bir şey daha vardır: lisanslıdır, kamuya açık değildir — New American Standard Bible 2020 ile aynı statüde, oysa Berean Standard Bible, Cenevre İncili, King James Version, Revised Version ve World English Bible'ın tümü özgürce kopyalanabilir.

