fact.1.label=Dil
fact.1.value=İngilizce
fact.2.label=Ismarlanışı
fact.2.value=Christian Reformed Church ve National Association of Evangelicals'in ortak bir komitesi tarafından; bu komite Ağustos 1965'te Illinois'deki Palos Heights'ta Trinity Christian College'da bir konferans topladı
fact.3.label=Hazırlayanlar
fact.3.value=Committee on Bible Translation — başlangıçta on beş bilim adamı, zamanla birkaç İngilizce konuşulan ülkeden ve pek çok mezhepten yüzü aşan sayıya ulaştı, yaklaşık on yıl boyunca
fact.4.label=Eski Antlaşma kaynağı
fact.4.value=Ölü Deniz Parşömenleri, Septuaginta ve diğer eski tanıkların da gözetildiği Masoretik İbranice metin
fact.5.label=Yeni Antlaşma kaynağı
fact.5.value=United Bible Societies ve Nestle-Aland baskılarının temsil ettiği seçmeci eleştirel Yunanca metin — burada [[GNV|Cenevre İncili]]'nin ve [[KJV|King James Version]]'ın temelindeki [[TR|Textus Receptus]]'tan değil
fact.6.label=Çeviri türü
fact.6.value=Harfiyen bir çevirinin doğruluğunu doğal, deyimsel İngilizceyle dengeler, iki uçtan birine bağlı kalmaz — genellikle dinamik eşdeğerlik olarak sınıflandırılır; kaynak dillerden yeni bir çeviri, King James geleneğinin bir gözden geçirmesi değil
fact.7.label=Yayımlanışı
fact.7.value=Yeni Antlaşma 1973'te; tam Kutsal Kitap 27 Ekim 1978'de; hafif bir gözden geçirme 1984'te; şimdiki, daha köklü biçimde gözden geçirilmiş metin 2011'de, bu da hem 1984 baskısını hem de 2005'teki Today's New International Version'ı kullanımdan kaldırdı
fact.8.label=Yayıncı
fact.8.value=Telif haklarını elinde tutan Biblica, Inc.; Birleşik Devletler'de Zondervan, Birleşik Krallık'ta Hodder & Stoughton
fact.9.label=Lisans
fact.9.value=Lisanslı, kamuya açık değil. Yazılı izin olmadan en fazla 500 ayet alıntılanabilir; ancak bunlar tam bir Kutsal Kitap kitabını oluşturmamalı ve eserin %25'ini geçmemelidir, telif hakkı bildirimiyle birlikte; bunun ötesi için Biblica'nın izni gerekir
fact.10.label=Bu derlemede
fact.10.value=Bir İngilizce arayüzün varsayılan olarak açıldığı Kutsal Kitap — burada [[KJV|King James Version]] ve [[RV|Revised Version]], ikisi de, kendilerinin bu olmadığını belirtir. Soy basamaklarında ona kayıtlı bir kaynak yoktur: bir NIV ayetinin altındaki basamak doğrudan ≈ ile işaretli özgün dil tabanına iner, [[BSB|Berean Standard Bible]] için olduğu gibi — yalnız o tabanın Yunanca tanığı [[TR|Textus Receptus]]'tur, ve bu, çevirinin Yeni Antlaşması'nın gerçekte yapıldığı metin değildir. Kamuya açık olmak yerine lisanslı olması, New American Standard Bible 2020 ile aynı statüde olması, onu [[KJV|King James Version]], [[RV|Revised Version]] ve [[WEB|World English Bible]] gibi kamuya açık komşularından ayırır
