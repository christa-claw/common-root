title=Open New Arabic Version — Tietoa tästä laitoksesta | Common Root
description=Biblican Open New Arabic Version: moderni arabiankielinen Raamattu, jonka tekijänoikeudet ovat vuosilta 1988, 1997 ja 2012, julkaistu Creative Commons -lisenssillä, joka sallii sen jakamisen, muokkaamisen ja painamisen mainiten lähde.
heroHeading=Biblican Open New Arabic Version
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Tämä on moderni arabiankielinen käännös, eri teksti kuin [[SVD|Smith & Van Dyck]] eikä vain toinen jäljennös siitä. Sen julkaisee Biblica, Inc., jonka tekijänoikeusmerkintä kantaa kolme vuotta: 1988, 1997 ja 2012. Tekstin oma tekijänoikeussivu antaa sen vanhemman nimen, Ketab El Hayat Majani.
hero.2=Se, mikä erottaa sen tässä lukuohjelmassa, on sen käyttölupa. Biblica julkaisi sen "avoimena" tekstinä Creative Commons Nimeä-JaaSamoin 4.0 -lisenssillä: kuka tahansa saa kopioida, muokata ja painaa sitä, kunhan Biblica mainitaan ja kaikki siitä rakennettu jaetaan samoin ehdoin. Mainintateksti, jota Biblica pyytää, on: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". Useimpia moderneja käännöksiä ei tarjota tällä tavoin, ja siksi se on tässä.
hero.3=Käyttöluvassa on yksi ehto, joka kannattaa tietää. Muuttamaton teksti saa kantaa Biblican nimeä. Uudelleenjärjestetty teksti ei saa: tämän sivuston Tapahtumajärjestys- ja Kirjoitusjärjestys-laitokset asettavat kirjat eri järjestykseen, minkä käsittelemme muokkauksena, niin ne kertovat tekstin olevan uudelleenjärjestetty eivätkä käytä Biblican nimeä otsikkona.
hero.4=Tiedosto on täysin vokalisoitu. Yksi sen lähteen yksityiskohta: Apostolien tekojen 15:25 ja 26 on painettu yhtenä jakeena, niin aineisto pitää ne yhdessä jakeen 25 alla eikä siellä ole erillistä jaetta 26.

