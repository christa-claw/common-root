fact.1.label=Språk
fact.1.value=klassisk arabiska, med en engelsk översättning under varje hadith i läsaren
fact.2.label=Sammanställare
fact.2.value=Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i (215–303 e.H. / 830–915 e.Kr.)
fact.3.label=Namn
fact.3.value=känd som Sunan an-Nasa'i, Sunan al-Sughra ("den mindre Sunan") eller al-Mujtaba ("det utvalda") — ett senare urval ur al-Nasa'is eget större verk Sunan al-Kubra
fact.4.label=Sammanställd
fact.4.value=insamlad på resor genom Irak, Hijaz, Syrien och Egypten som inleddes vid omkring femton års ålder; al-Nasa'i slog sig ner i Egypten och dog i Damaskus år 303 e.H. (915 e.Kr.)
fact.5.label=Metod
fact.5.value=ordnad efter rättsligt ämne, liksom [[ABD|Sunan Abi Dawud]] och [[TIR|Jami` at-Tirmidhi]]; dragen ner ur al-Nasa'is större Sunan al-Kubra genom en process som källorna som använts här inte dokumenterar
fact.6.label=Ställning
fact.6.value=räknas bland sunniislams Sex böcker (Kutub al-Sittah); några källor sätter den på tredje plats, efter [[BUK|Sahih al-Bukhari]] och [[MUS|Sahih Muslim]], medan detta korpus sidor för [[ABD|Sunan Abi Dawud]] och [[TIR|Jami` at-Tirmidhi]] återger den vanligare ordningen som sätter Abu Dawuds bok på tredje plats — den exakta rangen är omtvistad snarare än avgjord
fact.7.label=Antal hadither
fact.7.value=5 758, inklusive upprepade berättelser, enligt en ofta citerad siffra för al-Mujtaba; detta korpus källutgåva numrerar 5 765 — de två siffrorna förenas inte i källorna
fact.8.label=I detta korpus
fact.8.value=52 böcker och 5 765 numrerade hadither
fact.9.label=Engelsk översättning
fact.9.value=hämtad från fawazahmed0/hadith-apins eng-nasai-utgåva, visad som en parning under arabiskan; vilken publicerad översättning den härstammar från är ännu inte fastställt från detta korpus sida
fact.10.label=Licens
fact.10.value=den arabiska matnen är den klassiska texten i allmän egendom; den engelska översättningens licens är fortfarande under granskning
