title=Sunan an-Nasa'i — Om denna utgåva | Common Root
description=Sunan an-Nasa'i: den hadithsamling Ahmad ibn Shu'ayb al-Nasa'i drog ner från sitt större verk, Sunan al-Kubra, utpekad av Ibn Hajar som den av Sex böckerna som innehåller minst svaga hadither efter de två Sahiherna.
heroHeading=Sunan an-Nasa'i
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali al-Nasa'i föddes omkring år 214–215 e.H. (829–830 e.Kr.) i Nasa, en stad i Khorasan som i dag ligger i Turkmenistan. Han började resa för att söka hadither vid omkring femton års ålder, och studerade först under Qutaybah ibn Sa'id — hos vilken han stannade i Baghlan över ett år — innan han fortsatte genom Irak, Hijaz, Syrien och Egypten, där han studerade under lärda som Ishaq ibn Rahwayh och Abu Dawud al-Sijistani, sammanställaren av [[ABD|Sunan Abi Dawud]]. Han slog sig ner i Egypten, undervisade där och blev känd som Hafiz al-Hadith; senare biografer är oeniga om huruvida han någonsin studerade direkt under Muhammad al-Bukhari, eftersom al-Mizzi hävdade att de två aldrig träffades. På resa från Kairo mot Mecka sent i livet stannade han i Damaskus, där, enligt den traditionella berättelsen, ett föredrag han höll om profetens följeslagares förtjänster retade upp en fientlig folkmassa mitt i stadens antialidiska stämning; han dog kort därefter, år 303 e.H. (915 e.Kr.), av skador han fått där. Berättelserna skiljer sig åt om var han begravdes — mellan Safa och Marwa i Mecka enligt en tradition, eller i Ramla i Palestina enligt en annan.
hero.2=Av de omkring femton verk som tillskrivs honom rör sex hadith. Det största, Sunan al-Kubra, drog han senare själv ner till ett kortare urval känt som Sunan al-Sughra ("den mindre Sunan") eller al-Mujtaba ("det utvalda") — boken som i dag avses med den enkla titeln Sunan an-Nasa'i. Exakt vem som gjorde det urvalet, och på vems begäran, finns inte dokumenterat i de källor som använts för denna sida. I den ordnade al-Nasa'i hadither efter rättsligt ämne, liksom [[ABD|Abu Dawud]] och [[TIR|at-Tirmidhi]] gjorde. Den rättslärde Ibn Hajar al-Asqalani pekade senare ut den som den av Sex böckerna som, efter de två Sahiherna, innehåller minst svaga (da'if) hadither och opålitliga uppgiftslämnare, och inga förfalskade (mawdu') hadither alls.
hero.3=Sunnitisk tradition räknar Sunan an-Nasa'i bland Sex böckerna (Kutub al-Sittah), tillsammans med [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]] och [[TIR|Jami` at-Tirmidhi]], samt en sjätte bok som är omtvistad mellan Sunan Ibn Majah och andra kandidater. Var exakt den rankas bland de fyra Sunan-samlingarna är omtvistat snarare än avgjort: några källor kallar den den tredje mest auktoritativa av de sex, efter endast de två Sahiherna, medan detta korpus egna sidor för [[ABD|Sunan Abi Dawud]] och [[TIR|Jami` at-Tirmidhi]] återger den vanligare ordningen, som sätter Abu Dawuds bok på tredje plats. Antalet hadither som anges för den varierar på liknande sätt: 5 758, inklusive upprepade berättelser, enligt en ofta citerad siffra för al-Mujtaba, mot 5 765 i den utgåva detta korpus bygger på — de två siffrorna förenas inte i källorna.
hero.4=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-nasai-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]] och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

