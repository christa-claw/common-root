title=キング・ジェイムズ・バージョン — この版について | Common Root
description=1611年のキング・ジェイムズ・バージョン：四十七人の翻訳者が六つの班に分かれ、新たに訳すのではなくビショップス・バイブルを改訂するよう指示された——そしてこのコーパスでは、初版が持っていた外典をいまも収める八十巻の本文である。
heroHeading=キング・ジェイムズ・バージョン
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=それは別の議題を話し合う会議での、ちょっとした譲歩として始まった。1604年のハンプトン・コート会議は、祈祷書についてのピューリタンの不満を聞くためにジェイムズ1世が招集したものだったが、そこで新しい翻訳の提案が持ち出され、王はそれを取り上げた。四十七人の学者が任命され、六つの班に分けられた——ウェストミンスターに二班、オックスフォードに二班、ケンブリッジに二班——それぞれが聖書の一部分と、従うべき規則一式を受け持った。その規則の第一条が、この聖書を読むうえでもっとも重要である。1568年のビショップス・バイブルに従い、原語がそれを要求する場合にのみ変更せよ、というものだった。これは新訳としてではなく改訂として委嘱され、実際そのように読める。王の印刷者ロバート・バーカーが、完成した書物を1611年にロンドンで刊行した。
hero.2=規則が語らなかったこと、それでも翻訳者たちが実際に行ったことは、ビショップス・バイブルのさらに先へと何度も遡ることだった。彼らが受け継いだ英語は他の人々の手になるものだった——何よりもティンダル、そしてある世代の英語読者が実際に所有し家で読んでいたジュネーヴ聖書である。このコーパスはその借りを序文に委ねることなく記録している。ここでのキング・ジェイムズ・バージョンの母本は[[GNV|ジュネーヴ聖書]]であり、その下に公認のギリシャ語本文とマソラ本文のヘブライ語がある。キング・ジェイムズの一節の下で系譜の段を開けば、出てくるのはジュネーヴである。両者は一節ごとに十分近く、興味深い問いは「ジュネーヴが使われたか」ではなく「1611年の委員会がどこでそこから離れる決断をしたか」になる——それは今では鵜呑みにするのではなく、実際に見て確かめられることである。
hero.3=このキング・ジェイムズ訳と大多数の版とのちがいの一つは、中身に何が収められているかにある。ここでの本文は八十巻、36,820節に及ぶ——旧約聖書と新約聖書、そしてその間に印刷された十四巻の外典であり、1611年の版がそう印刷していたとおりである。今日売られているキング・ジェイムズ聖書のほとんどは六十六巻である。コーパスはその長い形を保っており、その効果は系譜が記録する連鎖に沿って見て取れる。[[GNV|ジュネーヴ聖書]]はここでは六十六巻、これは八十巻、その上の[[RV|リバイズド・バージョン]]も八十巻、さらにその上の[[ASV|アメリカン・スタンダード・バージョン]]は再び六十六巻である。外典を印刷するかどうかは各版がそれぞれ別に下した決定であり、それらを一つの列に並べることで、その模様が読み取れるようになる。
hero.4=カードに記された年が何を意味するかには注意が必要である。そこには1611年とあるが、これは翻訳の年代であって、この本文がどの印刷であるかを主張するものではない。ここでの英語は綴りが現代化されている。創世記は「In the beginning God created the heaven and the earth」で始まるが、1611年の原版は「In the beginning God created the Heauen, and the Earth」と読んだ。したがってこれは、後の印刷者たちが標準化したキング・ジェイムズであり、その背後にある特定の印刷がどれであるかは記録されていない——コーパスが[[FB1776|Biblia 1776]]についても残している、同じ誠実な空白である。翻訳者たちの選択を読むうえでは何の違いもないが、1611年の書物をひとつの遺物として引用するうえではすべてが違う。また、これは英語インターフェースが既定として開く版ではないことにも注意したい。それは[[NIV|ニュー・インターナショナル・バージョン]]であり、キング・ジェイムズはそこから切り替えて読む版である。

