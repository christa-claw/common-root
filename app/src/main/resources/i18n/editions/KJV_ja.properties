fact.5.label=初版
fact.5.value=1611年、ロンドンにて、王の印刷者ロバート・バーカーにより
fact.6.label=記録された母本
fact.6.value=[[GNV|1599年のジュネーヴ聖書]]。原語の底面には[[TR|テクストゥス・レセプトゥス]]と[[WLC|マソラ本文のヘブライ語]]があり、≈ の印が付くのは、これらが翻訳者自身の底本ではなくそれらの本文への証人だからである
fact.7.label=ここでの内容
fact.7.value=八十巻、36,820節——1611年の印刷が持っていたとおり外典を含み、今日のキング・ジェイムズ聖書の大半は六十六巻を印刷する
fact.8.label=カタログの年
fact.8.value=1611年、翻訳の年代であり、この本文の印刷の年代ではない。ここでの綴りは現代化されたものであり、どの印刷の系統かは記録されていない
fact.9.label=このコーパスでは
fact.9.value=[[GNV|ジュネーヴ]]と[[RV|リバイズド・バージョン]]の間、[[WLC|マソラ本文のヘブライ語]]と[[TR|ギリシャ語]]まで下る英語の連鎖の段である。英語の既定訳ではなく、それは[[NIV|ニュー・インターナショナル・バージョン]]である
