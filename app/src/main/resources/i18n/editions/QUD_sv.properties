title=Fyrtio hadith qudsi — Om denna utgåva | Common Root
description=Fyrtio hadith qudsi — uttalanden vars innebörd muslimer anser kommer från Gud, medan ordalydelsen, som i varje annan hadith, förmedlas genom Muhammed — lästa här som en följeslagarvolym till an-Nawawis fyrtio hadither.
heroHeading=Fyrtio hadith qudsi
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=En hadith qudsi ("helig" eller "gudomlig" hadith) skiljer sig från en vanlig hadith genom var dess innebörd anses ha sitt ursprung: lärda som al-Jurjani beskriver den som Guds ord, uttryckta i Muhammeds egen ordalydelse, till skillnad från Koranen, vars ordalydelse i sig anses vara Guds. Den skillnaden rör ställning, inte tillförlitlighet — en hadith qudsi behöver inte vara sahih (säker); några så klassade är da'if (svaga) eller omtvistade, bedömda efter samma kriterier för överföringskedjor som varje annan hadith.
hero.2=Att samla fyrtio hadith qudsi följer samma gamla sed som [[NAW|an-Nawawis fyrtio hadither]] och den vidare fyrtio-hadith-genren (arba'iniyyat) den tillhör, men begränsad här till en enda hadith-kategori snarare än hadither i allmänhet. En vitt spridd engelsk utgåva under just denna titel — utvald och översatt av Ezzeddin Ibrahim och Denys Johnson-Davies, som även gjorde följeöversättningen av an-Nawawis samling — gavs ut av Islamic Texts Society 1997 som en tvåspråkig arabisk-engelsk volym, med sina fyrtio hadither hämtade ur hela den klassiska hadith-litteraturen. Huruvida de fyrtio hadither detta korpus erbjuder är just detta urval, eller en oberoende sammanställd samling utgiven under samma traditionella titel, har inte fastställts från detta korpus sida.
hero.3=Den arabiska texten här är den klassiska matnen och anses vara i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-qudsi-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för [[BUK|Sahih al-Bukhari]], [[MUS|Sahih Muslim]], [[ABD|Sunan Abi Dawud]], [[TIR|Jami` at-Tirmidhi]], [[NAS|Sunan an-Nasa'i]], [[IBM|Sunan Ibn Majah]], [[MAL|Muwatta Malik]], [[NAW|an-Nawawis fyrtio hadither]] och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Språk
fact.1.value=Klassisk arabiska, med en engelsk översättning under varje hadith i läsaren
fact.2.label=Sammanställare
fact.2.value=Ingen enskild klassisk upphovsperson; en publicerad engelsk utgåva under denna titel valdes ut och översattes av Ezzeddin Ibrahim och Denys Johnson-Davies, som samlade sina fyrtio hadither ur hela den klassiska hadith-litteraturen
fact.3.label=Namn
fact.3.value=Hadith qudsi — "helig" eller "gudomlig" hadith, vars innebörd anses komma från Gud trots att ordalydelsen är Muhammeds egen, till skillnad från Koranen
fact.4.label=Sammanställd
fact.4.value=En antologi hämtad ur den vidare hadith-litteraturen snarare än en enda sammanhängande text; Ibrahim/Johnson-Davies engelska utgåva under denna titel gavs ut 1997
fact.5.label=Metod
fact.5.value=Urval efter klassificering som qudsi snarare än kanonisk rang; en hadith qudsi behöver inte vara sahih (säker) — några så klassade är da'if (svaga) eller omtvistade
fact.6.label=Ställning
fact.6.value=En av flera antologier under denna titel, i samma långvariga fyrtio-hadith-tradition (arba'iniyyat) som [[NAW|an-Nawawis fyrtio hadither]]
fact.7.label=Antal hadither
fact.7.value=40
fact.8.label=I detta korpus
fact.8.value=1 bok och 40 numrerade hadither
fact.9.label=Engelsk översättning
fact.9.value=Hämtad från fawazahmed0/hadith-apins eng-qudsi-utgåva, visad som följetext till arabiskan; huruvida den härstammar från Ibrahim/Johnson-Davies översättning eller en oberoende sådan är inte bekräftat från detta korpus sida
fact.10.label=Licens
fact.10.value=Den arabiska matnen är den klassiska texten, som anses vara i allmän egendom; den engelska översättningens licens är fortfarande under granskning
