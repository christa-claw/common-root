title=Version chinoise de l'Union, texte de 1919 — À propos de cette édition | Common Root
description=La version chinoise de l'Union telle qu'elle fut publiée pour la première fois en 1919, avec les anciennes formes de caractères et la ponctuation d'origine, transcrite par Chinese Wikisource, avec ses notes de bas de page.
heroHeading=Version chinoise de l'Union — le texte de 1919
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Voici la [[CUV|version chinoise de l'Union]] telle qu'elle fut imprimée en 1919 : la Bible en mandarin sur laquelle missionnaires et érudits chinois travaillèrent pendant vingt-neuf ans, fixée dans les formes de cette année-là. L'autre version de l'Union que contient ce lecteur est le texte tel qu'on le lit aujourd'hui, avec une ponctuation moderne et des choix de caractères modernes. Celle-ci conserve la page de 1919.
hero.2=On peut voir la différence dans les caractères. Le texte de 1919 utilise des formes que les impressions postérieures ont abandonnées — 爲 là où les éditions actuelles ont 為, ainsi que 愼, 册, 槪 — et il est imprimé entièrement en caractères traditionnels. Sa ponctuation est celle transcrite de l'impression de 1919, non la ponctuation moderne des éditions postérieures. Là où le livre de 1919 imprimait des versets consécutifs comme un seul passage, cette édition fait de même : la numérotation des versets est conservée, et le texte se trouve au premier verset de la série.
hero.3=Le texte provient de la transcription réalisée par Chinese Wikisource, et c'est l'édition Shen (神版), dans laquelle Dieu est 神, et non 上帝. Les notes de bas de page du livre de 1919 sont conservées, et apparaissent dans ce lecteur comme des annotations sur les versets auxquels elles se rapportent.
hero.4=Il a été ajouté afin qu'une Bible chinoise puisse être imprimée à partir d'un texte dont la date et l'origine sont connues. Une impression de 1919 est depuis longtemps hors droits. Les textes ponctués qui l'ont suivie, à partir de 1988, relèvent d'une question distincte, c'est pourquoi les deux sont tenus séparés.

