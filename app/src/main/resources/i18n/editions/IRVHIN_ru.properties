title=Индийская пересмотренная версия — Об этом издании | Common Root
description=Индийская пересмотренная версия (IRV): перевод Библии на хинди 2019 года, изданный Bridge Connectivity Solutions, по лицензии CC BY-SA 4.0 — текст на хинди, на котором это собрание открывается по умолчанию.
heroHeading=Индийская пересмотренная версия
readerHref=/reader?c1.src=irvhin

hero.1=Индийская пересмотренная версия — современный перевод Библии на язык хинди, права на который датированы 2017 и 2019 годами и принадлежат компании Bridge Connectivity Solutions Pvt. Ltd., индийской организации, занимающейся переводом Библии и технологиями. Она входит в более широкую серию «Индийская пересмотренная версия», которую тот же издатель параллельно выпустил на нескольких других крупных языках Индии — в их числе каннада, тамильский, телугу и ассамский, — каждая полная Библия на своей письменности, изданная по той же открытой лицензии.
hero.2=Текст Common Root взят из распространяемой на eBible.org USFM-версии хиндиязычного IRV, каталогизированной там как hin2017, а не из более ранней цифровой копии того же перевода, которая была в обороте с текстом примечаний, вклеенным прямо внутрь стихов, и с названиями книг на хинди вместо английского. Повторный импорт из этого источника USFM устранил обе проблемы перед тем, как это издание было добавлено сюда — это собрание хранит названия книг на английском внутренне, во всех своих изданиях, независимо от собственного языка Библии.
hero.3=Здесь он записан письмом деванагари, как इंडियन रिवाइज़्ड वर्ज़न, и содержит стандартный протестантский канон из 66 книг, без второканонических книг.
hero.4=Это единственная Библия на хинди в этом собрании, поэтому интерфейс на хинди открывается именно на ней по умолчанию.

