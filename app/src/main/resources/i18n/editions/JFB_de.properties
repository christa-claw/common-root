title=Japanische Freedom Bible — Über diese Ausgabe | Common Root
description=Die Japanische Freedom Bible (フリーダム・バイブル): eine vollständige japanische Bibel in 66 Büchern, die eBible.org als Übersetzungsentwurf ohne Urheberrecht verbreitet — die einzige japanische Bibel in diesem Korpus, daher öffnet die japanische Oberfläche auf ihr.
heroHeading=Japanische Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=Die Japanische Freedom Bible — japanisch フリーダム・バイブル — ist eine vollständige japanische Bibel, die von eBible.org verbreitet wird; eBible nennt sich selbst den offiziellen Vertreiber der Übersetzung. Sie ist sehr jung: Die Quelldateien in diesem Korpus tragen das Datum 19. August 2026, und die 2026 auf ihrer Karte ist das Datum dieser Dateien. eBible gibt kein eigenes Erscheinungsdatum an, und auch hier wird keines behauptet.
hero.2=Vieles an ihr ist nicht festgehalten, und das sollte man offen sagen. Die Seiten von eBible nennen weder Übersetzer noch Komitee noch Verlag und sagen nicht, woraus die Übersetzung gemacht wurde — unmittelbar aus dem Hebräischen und Griechischen oder über eine andere moderne Übersetzung. Ihre eigene Urheberrechtsseite nennt sie einen Übersetzungsentwurf (翻訳の草案) und bittet um Verbesserungsvorschläge; der Text hier ist also eine Momentaufnahme einer laufenden Arbeit, keine abgeschlossene Ausgabe.
hero.3=Klar ist dagegen ihre rechtliche Stellung: Dieselbe Seite hält fest, dass für die Übersetzung kein Urheberrecht besteht, und weist sie als gemeinfrei (public domain) aus. Deshalb ist sie hier der japanische Text — sie war die einzige vollständige japanische Bibel auf eBible, die frei von Urheberrecht ist. Die ältere japanische Bibel, die ihr eine Abstammungslinie hätte geben können, die 1887 vollendete Übersetzung der Meiji-Zeit, längst gemeinfrei, ist aus dieser Quelle nicht erhältlich.
hero.4=In diesem Korpus umfasst sie die 66 Bücher des protestantischen Kanons, 31.098 Verse, ohne deuterokanonische Bücher. Eine Vorlage ist für sie nicht verzeichnet; öffnet man unter einem ihrer Verse eine Sprosse, führt sie daher geradewegs zum Ursprachenboden, der mit ≈ bezeichnet ist: Das Hebräische und Griechische dort sind Zeugen, keine Aussage darüber, woraus sie übersetzt wurde — und da ihre Quelle unbekannt ist, ist genau das die ehrliche Lesart. Sie ist die einzige japanische Bibel im Korpus, sodass eine japanische Oberfläche standardmäßig auf ihr öffnet.

