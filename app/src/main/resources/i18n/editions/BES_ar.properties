title=Biblia en Español Sencillo — عن هذه الطبعة | Common Root
description=Biblia en Español Sencillo: كتاب مقدّس بالإسبانية الميسّرة تنشره AudioBiblia.org منذ 2018، كُتب ليُسمع بقدر ما يُقرأ، ورُخّص بحيث يجوز لأيّ أحد نسخه.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=ظلّ الكتاب المقدّس البروتستانتي بالإسبانية أربعة قرون، عملياً، كتاباً واحداً في مراجعات متعاقبة: ترجمة كاسيودورو دي رينا سنة 1569 كما راجعها ثيبريانو دي بالِيرا سنة 1602، ثم السلسلة الطويلة من طبعات رينا-بالِيرا بعدهما. وBiblia en Español Sencillo ليست منها. هي ترجمة جديدة، بالإسبانية المعاصرة ومقصودٌ فيها التبسيط، تنشرها AudioBiblia.org — العهد الجديد مع المزامير والأمثال سنة 2018، والعهد القديم مكتملاً في أكتوبر 2019. وتُنسب الترجمة إلى إرما فلوريس، ويصفها ناشروها بأنها محافظة وإنجيلية.
hero.2=ما يميّزها هو منبتها. فهي عمل خدمةٍ للكتاب المقدّس المسموع، وقد أُنتج النصّ وتسجيلٌ كاملٌ أصحاحاً أصحاحاً معاً، لا أن يكون أحدهما مقروءاً عن الآخر. والغاية المعلنة واحدة فيهما: كتاب مقدّس سهل الفهم، ويجوز نسخه ومشاركته بحرّية وقانونية. وهذا الشطر الثاني ليس عَرَضاً. فالترجمة تحمل رخصة المشاع الإبداعي - النسب، تنسب العمل إلى AudioBiblia.org وإرما فلوريس، لا حقوقاً محفوظة لدار نشر — ولهذا يمكن للنصّ كلّه أن يستقرّ في هذه المجموعة وأن يوضع آيةً بآية إلى جانب أيّ نصّ آخر فيها.
hero.3=في هذا القارئ هي واحدة من أربع طبعات إسبانية. واذا ضُبطت الواجهة على الإسبانية فالقارئ يفتح رينا-بالِيرا 1909 كما كان؛ وهذه طبعة يُنتقل إليها. وهي تسلك مسلكاً آخر في درجات النسب. فلأنها ترجمة جديدة لا مراجعة لشيء تحمله هذه المجموعة، لم يُسجَّل لها أصل — فالدرجة المفتوحة تحت آية من Biblia en Español Sencillo تهبط رأساً إلى أرضية اللغات الأصلية المعلَّمة بـ ≈، لا إلى طبعة أقدم من الكتاب نفسه كما في السلسلة الإنجليزية. ضعها بدل ذلك في العمود الثاني قبالة رينا-بالِيرا 1909، فالمسافة بين المستويين هي ما يستحقّ النظر.

