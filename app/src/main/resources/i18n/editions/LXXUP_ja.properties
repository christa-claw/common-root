title=ブレントン版英語七十人訳（改訂綴り版） — この版について | Common Root
description=サー・ランスロット・ブレントンによる1844年と1851年の英語七十人訳を、アダム・ボイドが2020年に綴りと人名・地名の面で現代化したもの——このコーパスで隣に並ぶブレントン原版と同じ翻訳であり、thou と thee はブレントンが置いたところに残されている。
heroHeading=ブレントン版英語七十人訳（改訂綴り版）
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=これは、サー・ランスロット・ブレントンによる七十人訳——ギリシャ語の旧約聖書——の英訳を、英語の面で現代化したものである。ブレントンは主にヴァティカン写本から訳した。ロンドンの Samuel Bagster and Sons が1844年にその翻訳を出版し、1851年に外典を加えて再刊した。2020年、アダム・ボイドが eBible.org のためにこれを改訂し、自らの変更をパブリックドメインに献じた。彼は訳し直したのではない。その序文は変更点を列挙している。綴りは現代アメリカ英語に改められ、「shew」は「show」になった。人名・地名は英語の読者になじみのある形に改められた。「begat」と「spake」は「begot」と「spoke」になった。ハイフンや重なった句読点は整理された。そして詩は詩として組まれた。残したものも同じく意図的である。「thou」「thee」「ye」とそれに伴う動詞の形、ブレントンの文法、そして19世紀の重い句読法である。
hero.2=違いが最もよく見えるのは、同じくこのコーパスにあるブレントン原版と並べたときである。ブレントンはヘブライ人の名をギリシャ語の綴りどおりに書いた。改訂版はたいてい英語の形を与える。ブレントンのネヘミヤ記が「the words of Neemias the son of Chelcia」で始まるところを、こちらは「Nehemiah the son of Hacaliah」とする。Elias the Thesbite は Elijah the Tishbite に、イザヤ書7:14の Emmanuel は Immanuel になる。綴りの下にある翻訳は今もブレントンのものであり、だから今もギリシャ語が読むとおりに読む。イザヤ書7:14の「A virgin shall conceive」はギリシャ語の parthenos を訳したものである。詩編はギリシャ語の番号を保つので、ここでは第22編が羊飼いの詩編である。創世記1:2の地は今も「unsightly and unfurnished」である。古い代名詞も残っている。「thou shalt call his name Immanuel」。
hero.3=このリーダーにおいて、これは系譜の段の外に立っている。コーパスはこの版に親本を記録していない——ブレントンが訳したギリシャ語も、この版が改訂したブレントン原版も——ので、その節の一つの下で段を開くと、≈の印が付いた原語の底面へまっすぐ落ちる。旧約聖書の場合それはレニングラード写本であり、ヘブライ語の本文であって、この翻訳の元になったギリシャ語ではない。ブレントンの英語から彼のギリシャ語へ降りたいなら、記録された親本が七十人訳であるブレントン原版を開くとよい。逆にこの版の上に立つものはなく、どのインターフェース言語もこの版では開かない。英語インターフェースは New International Version で開く。私たちのコピーは書物そのものより狭い。36書を収める。エズラ記とネヘミヤ記はギリシャ語と同じく23章から成る一書であり、ネヘミヤ記は第11章から始まる。取り込み元の eBible.org のファイルには外典も含まれ、エステル記とダニエル書はより長いギリシャ語の形でのみ収められている。そのいずれも取り込まれなかったので、ここにはエステル記もダニエル書もなく、トビト記や知恵の書もない。

