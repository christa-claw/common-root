title=World English Bible — Tietoja tästä laitoksesta | Common Root
description=World English Bible: vuoden 1901 American Standard Versionin nykyenglantilainen tarkistus, jonka Michael Paul Johnson aloitti 1994, jonka Uusi testamentti mukautettiin kreikkalaiseen enemmistötekstiin ja joka on tarkoituksella vapaassa käytössä.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=World English Bible on olemassa tekijänoikeusongelman vuoksi. Vuonna 1994 Michael Paul Johnson, insinööri joka käänsi Raamattua kokopäivätyöltä jäävinä tunteina, laski kuinka kauan häneltä kestäisi saada valmiiksi nykyenglantilainen Raamattu jota kuka tahansa saisi vapaasti kopioida, eikä pitänyt vastauksesta. Hän lopetti kääntämisen alusta ja aloitti uudelleen vuoden 1901 American Standard Versionista — täsmällisestä, arvostetusta ja, toisin kuin Kuningas Jaakon käännös (jota Englannissa ja Walesissa rasittaa yhä kruunun patenttikirje), kokonaan tekijänoikeudesta vapaasta. Hänen itse kirjoittamansa ohjelma kävi ASV:n läpi etsien sanoja joita mikään nykyraamattu ei käytä, ehdotti korvaajia ja teki vaihdot noin viidessätoista minuutissa. Kaikki mihin ohjelma ei pystynyt — sanajärjestys, välimerkit, lainausmerkit — tehtiin käsin seuraavien vuosien aikana, ja teksti julkaistiin, ja julkaistiin uudelleen tarkistuksina, vuodesta 1997 eteenpäin.
hero.2=Kaksi asiaa erottaa sen laitoksesta jota se tarkistaa. Ensimmäinen on kreikka. ASV:n Uusi testamentti seurasi tarkistajien kriittistä tekstiä, joka oli lähellä sitä mistä tuli Nestle–Alandin laitos; World English Bible sen sijaan mukautettiin bysanttilaiseen enemmistötekstiin, joten se ei ole kantamuotonsa teksti eikä Textus Receptus jota Kuningas Jaakon kääntäjät käyttivät. Toinen on Jumalan nimi. ASV painoi “Jehovah”; World English Bible painaa “Yahweh”, ja alaviite 1. Moos. 2:4 kohdalla selittää valinnan lukijalle joka odottaa muotoa “the LORD”. Brittiläinen laitos palaa muotoon “LORD” — tässä aineistossa oleva kappale on amerikkalainen, joten “Yahweh” on se minkä luet. Näiden kahden ratkaisun ulkopuolella se pysyy kantamuotonsa tapaan muodollisen vastaavuuden käännöksenä: sama heprean ja kreikan sanajärjestyksen tiivis seuraaminen, mutta oikeinkirjoituksella ja kieliopilla jotka eivät enää kaipaa selitystä.
hero.3=Lukijassa se on lehti, ja ainoa aineiston pisimmässä haarassa. Avaa askelma World English Biblen jakeen alta, ja American Standard Version ilmestyy sen alle, ja sen alla Revised Version, Kuningas Jaakon käännös ja Geneven Raamattu, alas alkukielten pohjaan joka on merkitty ≈-merkillä. Mikään aineistossa ei puolestaan seiso World English Biblen päällä. Se on myös haaransa laajin teksti: American Standard Versionilla ei ollut apokryfikirjoja, joten World English Biblen omat tehtiin erikseen, Kuningas Jaakon apokryfeistä ja Brentonin englanninkielisestä Septuagintasta, ja meidän kappaleemme kantaa kahdeksaakymmentä kirjaa siinä missä sen alla oleva ASV kantaa kuuttakymmentäkuutta — mukana 3. ja 4. Makkabilaiskirja sekä psalmi 151, joita Kuningas Jaakon apokryfeissä ei ole. Baruk, joka niissä on, puuttuu meidän kappaleestamme. Tietoja-sivu jättää tämän laitoksen vuosisarakkeen tyhjäksi, ja syystä: yhtä julkaisuvuotta ei ole. Aineisto leimaa vuoden 2000, jotta askelmakilvillä olisi jotain mille järjestyä.

