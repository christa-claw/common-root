title=四十の聖訓クドゥシー — この版について | Common Root
description=四十の聖訓クドゥシー——その意味は神に由来するとムスリムが信じ、その言葉は他のハディースと同様ムハンマドを通して伝えられたとされる四十のハディース。ここでは『アン=ナワウィーの四十のハディース』に付随する一巻として読まれる。
heroHeading=四十の聖訓クドゥシー
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=ハディース・クドゥシー（「聖なる」または「神的な」ハディース）は、その意味の由来とされる点で通常のハディースと区別される。アル=ジュルジャーニーのような学者はこれを、ムハンマド自身の言葉で表現された神の言葉であると説明する一方、クルアーンはその言葉そのものが神のものとされる点で異なる。この区別は信頼性ではなく位置づけに関するものである——ハディース・クドゥシーは必ずしもサヒーフ（確実）である必要はなく、そのように分類されるものの中には、他のハディースと同じ伝承経路の基準で判断される、ダイーフ（弱い）または異論のあるものも含まれる。
hero.2=四十の聖訓クドゥシーを集める試みは、[[NAW|アン=ナワウィーの四十のハディース]]やそれが属するより広い「四十ハディース」類（アルバイーニーヤート）と同じ古い習慣に従うものであるが、ここではハディース一般ではなく一つの範疇に限定されている。まさにこの題名を持つ広く流布した英訳版——アン=ナワウィーの編集の対訳も手がけたエッゼッディーン・イブラーヒームとデニス・ジョンソン=デイヴィーズが選定・翻訳したもの——は、1997年にイスラミック・テキスツ・ソサイエティーからアラビア語・英語対訳の一巻として刊行され、その四十のハディースは古典ハディース文献全体から集められた。このコーパスが提供する四十のハディースがまさにその選定と同じものか、あるいは同じ伝統的題名のもとで独立に編まれた一群であるかは、このコーパス側では確定していない。
hero.3=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインとされる。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-qudsi 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]、[[IBM|スナン・イブン・マージャ]]、[[MAL|ムワッタ・マーリク]]、[[NAW|アン=ナワウィーの四十のハディース]]、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=単一の古典的編纂者はいない。この題名で刊行された英訳版は、エッゼッディーン・イブラーヒームとデニス・ジョンソン=デイヴィーズが選定・翻訳し、古典ハディース文献全体から四十のハディースを集めた
fact.3.label=名称
fact.3.value=ハディース・クドゥシー——クルアーンとは異なり、言葉そのものはムハンマドのものでありながら、意味は神に由来するとされる「聖なる」または「神的な」ハディース
fact.4.label=編纂地と時期
fact.4.value=単一の連続した文献ではなく、より広いハディース文献から集められた選集。イブラーヒーム／ジョンソン=デイヴィーズによるこの題名の英訳版は1997年に刊行された
fact.5.label=方法
fact.5.value=正典上の位置づけではなく、クドゥシーとしての分類によって選ばれた。ハディース・クドゥシーは必ずしもサヒーフ（確実）である必要はなく、そのように分類されるものの中にはダイーフ（弱い）または異論のあるものもある
fact.6.label=位置づけ
fact.6.value=この題名を持つ複数の選集のうちの一つであり、[[NAW|アン=ナワウィーの四十のハディース]]と同じ長い四十ハディースの伝統（アルバイーニーヤート）に属する
fact.7.label=ハディースの数
fact.7.value=40
fact.8.label=このコーパスでは
fact.8.value=1巻・40件の番号付きハディース
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-qudsi 版から取られ、アラビア語の対訳として示される。イブラーヒーム／ジョンソン=デイヴィーズの訳に由来するか、別の独立した訳に由来するかは、このコーパス側で確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語本文はパブリックドメインとされる古典テキストである。英訳のライセンスは依然確認中である
