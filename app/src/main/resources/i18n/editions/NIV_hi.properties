fact.9.label=लाइसेंस
fact.9.value=अनुज्ञप्ति-प्राप्त, सार्वजनिक अधिकार-क्षेत्र की नहीं। लिखित अनुमति के बिना अधिकतम 500 आयतें उद्धृत की जा सकती हैं, बशर्ते वे बाइबिल की कोई संपूर्ण पुस्तक न बनें और न ही रचना के 25% से अधिक हों, तथा कॉपीराइट स्वीकृति शामिल हो; इससे आगे के लिए Biblica की अनुमति आवश्यक है
fact.10.label=इस संग्रह में
fact.10.value=वह बाइबिल जिस पर एक अंग्रेज़ी अंतरफलक डिफ़ॉल्ट रूप से खुलता है — यहाँ [[KJV|King James Version]] और [[RV|संशोधित संस्करण]] दोनों कहते हैं कि वे यह नहीं हैं। वंश-पायदानों में इसके लिए कोई मूल अभिलिखित नहीं है: NIV की किसी आयत के नीचे पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल तक उतरता है, जैसा [[BSB|Berean Standard Bible]] के साथ होता है — सिवाय इसके कि उस तल का यूनानी साक्षी [[TR|टेक्स्टस रिसेप्टस]] है, जो वह पाठ नहीं है जिससे इस अनुवाद का नया नियम वास्तव में बनाया गया। अनुज्ञप्ति-प्राप्त होने के कारण, सार्वजनिक अधिकार-क्षेत्र की नहीं, New American Standard Bible 2020 के समान स्थिति में, यह [[KJV|King James Version]], [[RV|संशोधित संस्करण]] और [[WEB|World English Bible]] जैसी सार्वजनिक अधिकार-क्षेत्र की पड़ोसी बाइबिलों से अलग खड़ी है
