fact.5.label=नया नियम किससे
fact.5.value=United Bible Societies और Nestle-Aland के संस्करणों द्वारा प्रस्तुत उदार समीक्षात्मक यूनानी पाठ से — उस [[TR|टेक्स्टस रिसेप्टस]] से नहीं, जिस पर यहाँ [[GNV|जिनेवा बाइबिल]] और [[KJV|King James Version]] टिकी हैं
fact.6.label=अनुवाद का प्रकार
fact.6.value=शाब्दिक अनुवाद की सटीकता को स्वाभाविक, मुहावरेदार अंग्रेज़ी के साथ संतुलित करता है, किसी एक छोर पर टिके बिना — सामान्यतः गतिक तुल्यता के रूप में वर्गीकृत; मूल भाषाओं से एक नया अनुवाद, King James परंपरा का संशोधन नहीं
