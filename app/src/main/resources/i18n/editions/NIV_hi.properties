title=New International Version — इस संस्करण के बारे में | Common Root
description=New International Version: वह अंग्रेज़ी बाइबिल जिस पर यह रीडर डिफ़ॉल्ट रूप से खुलता है, मूल भाषाओं से सीधे Committee on Bible Translation द्वारा अनुवादित, और पहली बार 1978 में पूर्ण हुई — यहाँ इसके 2011 के पाठ में।
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=यह एक संप्रदाय के असंतोष से आरंभ हुआ। 1955 में व्यवसायी हावर्ड लॉंग ने, पादरी पीटर डे यॉंग के साथ, Christian Reformed Church पर समकालीन अंग्रेज़ी में एक बाइबिल तैयार करने के लिए दबाव डाला, और 1957 में चर्च ने इस विचार का अध्ययन करने के लिए एक समिति स्वीकृत की। National Association of Evangelicals ने उसी वर्ष अपनी एक समान योजना आरंभ कर दी थी। दोनों संस्थाओं ने हाथ मिलाए: एक संयुक्त समिति ने 1964 में एक अनुवाद सम्मेलन के लिए निमंत्रण भेजे, जो अगस्त 1965 में इलिनॉय के पालोस हाइट्स स्थित Trinity Christian College में हुआ और "पंद्रह सदस्यों की एक स्थायी समिति" बनाने का निर्णय लिया ताकि काम आगे बढ़ाया जा सके। यही स्थायी समिति Committee on Bible Translation बनी। 1967 में New York Bible Society — जिसका नाम बाद में Biblica रखा गया — ने इस योजना का संरक्षण अपने हाथ में लिया और अनुवाद करने वाले विद्वानों को नियुक्त किया।
hero.2=यहाँ कुछ भी किसी पुरानी अंग्रेज़ी बाइबिल से नहीं उतरा है। जहाँ King James Version, Revised Version, American Standard Version और World English Bible इस संग्रह में संशोधनों की एक ही शृंखला बनाती हैं, वहाँ New International Version सीधे इब्रानी, अरामी और यूनानी से नए सिरे से अनूदित हुई: पुराना नियम मासोरा इब्रानी पाठ से, जिसमें मृत सागर पुस्तकें, सेप्टुआजिंट और अन्य प्राचीन साक्ष्य देखे गए; नया नियम United Bible Societies और Nestle-Aland के संस्करणों द्वारा प्रस्तुत उदार समीक्षात्मक यूनानी पाठ से — उस टेक्स्टस रिसेप्टस से नहीं, जिस पर यहाँ जिनेवा बाइबिल और King James टिकी हैं। पंद्रह सदस्यों की समिति लगभग एक दशक में बढ़कर एक ऐसी योजना बन गई जिसमें कई अंग्रेज़ीभाषी देशों और अनेक संप्रदायों के सौ से अधिक विद्वान जुड़े। उनका घोषित लक्ष्य एक ऐसा अनुवाद था जो मूल पाठ की सटीकता बनाए रखते हुए भी शब्द-दर-शब्द प्रतिलिपि जैसा न पढ़ा जाए — एक संतुलन जिसे सामान्यतः गतिक तुल्यता (dynamic equivalence) कहा जाता है, सख्त शाब्दिक अनुवाद और ढीली व्याख्या के बीच।
hero.3=नया नियम पहले प्रकट हुआ, 1973 में; संपूर्ण बाइबिल उसके बाद 27 अक्तूबर 1978 को आई; एक हल्का संशोधन 1984 में हुआ। पाठ अधिक गहराई से 2011 में बदला, जब एक व्यापक संशोधन ने 1984 के संस्करण और 2005 के Today's New International Version दोनों की जगह ले ली, और दोनों को उस एक पाठ के पक्ष में हटा दिया जो तब से स्थिर रहा है। यही 2011 का पाठ इस संग्रह में रखा गया है — वही वर्ष जो सूची कार्ड दिखाता है। Biblica, Inc. सदा से इसका कॉपीराइट रखती है; संयुक्त राज्य में इसे Zondervan और यूनाइटेड किंगडम में Hodder & Stoughton प्रकाशित करता है।
hero.4=इस रीडर में इसका स्थान एक शांत ढंग से केंद्रीय है। अंतरफलक को अंग्रेज़ी पर रखें, और यही खुलता है — इस संग्रह में King James Version और Revised Version के पृष्ठ स्वयं यही कहते हैं कि वे यह नहीं हैं, और यहीं की ओर संकेत करते हैं उस संस्करण के रूप में जिस पर से बदला जाता है, जिस पर पहुँचा नहीं जाता। क्योंकि इसने किसी का संशोधन नहीं किया, इस संग्रह में इसके लिए कोई मूल अभिलिखित नहीं है: New International Version की किसी आयत के नीचे वंश-पायदान खोलने पर यह सीधे ≈ से चिह्नित मूल-भाषाओं के तल तक उतरता है, जैसा Berean Standard Bible के साथ होता है — एक अंतर को छोड़कर, जो जानने योग्य है। उस तल का यूनानी साक्षी टेक्स्टस रिसेप्टस है, और टेक्स्टस रिसेप्टस वह नहीं है जिससे इस अनुवाद का नया नियम वास्तव में बनाया गया — वह तल सामान्यतः "मूल यूनानी" के लिए खड़ा है, न कि इस समिति के अपने कार्य-पाठ के लिए। एक और बात इसे इसकी अधिकांश अंग्रेज़ी पड़ोसी बाइबिलों से अलग करती है: यह अनुज्ञप्ति-प्राप्त है, सार्वजनिक अधिकार-क्षेत्र की नहीं, वही स्थिति जो New American Standard Bible 2020 की है, जबकि Berean Standard Bible, जिनेवा बाइबिल, King James Version, Revised Version और World English Bible सभी स्वतंत्र रूप से नकल की जा सकती हैं।

