title=Heprealainen Raamattu — Tietoja tästä laitoksesta | Common Root
description=Koko Raamattu hepreaksi: masoreettinen Vanha testamentti ja Franz Delitzschin vuoden 1877 Uusi testamentti, käännettynä takaisin Mishnan hepreaan niille lukijoille, jotka halusivat kirjan kokonaan yhdellä kielellä.
heroHeading=Heprealainen Raamattu — masoreettinen Vanha testamentti ja Delitzschin Uusi testamentti
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=Kannesta kanteen heprealainen Raamattu on oudompi esine kuin miltä kuulostaa, sillä puolta siitä ei koskaan kirjoitettu hepreaksi. Vanha testamentti on hepreaa ja on aina ollut. Uusi testamentti on säilynyt kreikaksi. Tämänkaltainen laitos on siis kahta aivan eri lajia tekstiä ommeltuna yhteen: alkuteksti ja käännös, joka on tehty tavanomaiseen nähden vastakkaiseen suuntaan — kreikasta takaisin siihen kieleen, jota sen kirjoittajat enimmäkseen puhuivat.
hero.2=Uuden testamentin puolisko on Franz Delitzschin työtä. Hän oli leipzigiläinen heprean ja rabbiinisen kirjallisuuden tuntija, ja Brittiläinen ja ulkomainen raamattuseura tilasi työn häneltä 1873; valmiiksi se tuli 1877. Hän ei kääntänyt oman vuosisatansa hepreaan. Hän kirjoitti Mishnan ja toisen temppelin ajan hepreaa sillä perusteella, että ensimmäisen vuosisadan tekstin kuuluu kuulostaa sellaiselta — niinpä tulos ei lue niinkään hepreaksi siirtämisenä kuin yrityksenä saada takaisin se, mitä lauseet saattoivat olla ennen kuin ne olivat kreikkaa. Se on yhä se heprealainen Uusi testamentti, johon useimmin tartutaan.
hero.3=Se, mistä kreikasta hän työskenteli, päätettiin osittain hänen puolestaan. Hän aloitti Codex Sinaiticuksesta, muutamaa vuosikymmentä aiemmin löytyneestä neljännen vuosisadan käsikirjoituksesta, ja raamattuseura — jonka linjana oli julkaista vastaanotetun tekstin mukaan — kieltäytyi rahoittamasta edelleen siihen rakennettua laitosta. Delitzsch palasi Textus Receptukseen ja merkitsi merkittävät sinaiittiset lukutavat sen sijaan että olisi ottanut ne käyttöön. Sen jälkeen teksti pysyi liikkeessä kolmetoista vuotta ja kymmenen painosta; viimeisen niistä saattoi painoon Gustav Dalman 1890, samana vuonna kun Delitzsch kuoli. Tämä on yksi syy siihen, että luettelo jättää tämän laitoksen vuoden tyhjäksi: puoliskoilla ei ole yhteistä vuotta, ja sillä puoliskolla, jolla vuosia on, niitä on kymmenen.
hero.4=Tässä lukuohjelmassa se on se laitos, jonka heprealainen käyttöliittymä avaa — valittu ratkaisu eikä aakkosellinen sattuma — ja heprean valitseminen kääntää koko käyttöliittymän oikealta vasemmalle sen ympärillä. Se seisoo Leningradin koodeksin rinnalla kilpailematta sen kanssa: koodeksi on tieteellinen Tanak, täysin vokaalimerkitty ja kantillaatiomerkein varustettu ja päättyy siihen mihin Vanha testamentti päättyy, kun taas tämä on koruton konsonanttiteksti, joka jatkuu Ilmestyskirjaan asti. Polveutumisaskelmiin ei ole kirjattu sille kantatekstiä, joten jakeen alta avattu askelma putoaa suoraan alkukielten pohjaan, ≈ WLC ja ≈ TR. Muualla tässä aineistossa tuo pohja on likiarvo, ja juuri siitä ≈ varoittaa. Täällä se ei aivan ole: ruudulla oleva Vanha testamentti on masoreettinen teksti, ja Textus Receptus on se, mikä Delitzschillä tosiasiassa oli edessään.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Kieli
fact.1.value=heprea — konsonanttiteksti ilman vokaalimerkkejä ja ilman kantillaatiomerkkejä
fact.2.label=Mikä tämä on
fact.2.value=kaksi tekstiä sidottuna yhdeksi Raamatuksi: perinteinen masoreettinen Vanha testamentti ja heprealainen Uusi testamentti, joka on käännetty kreikasta 1800-luvulla
fact.3.label=Uuden testamentin tekijä
fact.3.value=Franz Delitzsch (1813–1890), leipzigiläinen hebraisti
fact.4.label=Tilaaja
fact.4.value=Brittiläinen ja ulkomainen raamattuseura vuonna 1873; käännös valmistui 1877
fact.5.label=Vanha testamentti
fact.5.value=itse masoreettisesta hepreasta — ei käännös, mikä tekee tästä ainoan täkäläisen laitoksen, jonka Vanha testamentti on jo alkukielellään, kuten [[WLC|Westminsterin Leningradin koodeksi]] on
fact.6.label=Uusi testamentti
fact.6.value=[[TR|Textus Receptuksen]] kreikasta. Delitzsch aloitti sen sijaan Codex Sinaiticuksesta, mutta raamattuseura julkaisi vastaanotetun tekstin mukaan eikä suostunut rahoittamaan poikkeamaa
fact.7.label=Kielimuoto
fact.7.value=ei nykyhepreaa. Delitzsch kirjoitti Mishnan ja toisen temppelin ajan hepreaa ja pyrki antamaan kreikalle takaisin sen sanonnan, jota sen puhujat olisivat käyttäneet
fact.8.label=Tarkistettiin vuoteen
fact.8.value=1890, viimeisen painoksen saattoi painoon Gustav Dalman
fact.9.label=Ei pidä sekoittaa
fact.9.value=Israelin raamattuseuran julkaisemaan nykyheprealaiseen Uuteen testamenttiin, joka on eri, 1900-luvun käännös ja yhä tekijänoikeuden alainen
fact.10.label=Vuosi luettelossa
fact.10.value=jätetty tyhjäksi — puoliskoilla ei ole yhteistä vuotta, ja yksin Uutta testamenttia tarkistettiin kolmentoista vuoden ja kymmenen painoksen ajan
fact.11.label=Tässä aineistossa
fact.11.value=kaikki 66 kirjaa, ja heprealaisen käyttöliittymän valittu oletus — lukuohjelma avaa tämän eikä [[WLC|Westminsterin Leningradin koodeksia]], koska tämä kulkee koko matkan Uuden testamentin läpi
