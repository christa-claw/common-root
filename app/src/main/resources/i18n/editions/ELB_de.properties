title=Elberfelder 1905 — Über diese Ausgabe | Common Root
description=Die Elberfelder Bibel: die deutsche Übersetzung, 1855 von John Nelson Darby, Carl Brockhaus und Julius Anton von Poseck begonnen, eine der ersten deutschen, die den Textus Receptus verließ — hier im Druck von 1905.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Der Name ist ein Ort. Elberfeld ist eine Stadt im Tal der Wupper, seit 1929 ein Teil Wuppertals, und dort wurde der größte Teil der Arbeit getan. Drei Männer begannen sie: John Nelson Darby, Carl Brockhaus und Julius Anton von Poseck, alle mit dem deutschen Zweig der Brüderbewegung verbunden. Das Neue Testament erschien 1855, die Psalmen 1859 und das Alte Testament 1871 — nicht unter einem Namen herausgegeben, sondern als aus dem Urtext übersetzt „von einigen Christen“.
hero.2=Was sie heraushob, war das Griechische darunter. Nahezu jede damals umlaufende deutsche Bibel stand noch auf dem Textus Receptus; diese brach damit und nahm die Lesarten des Codex Sinaiticus und des Codex Vaticanus auf, so wie diese Handschriften um die Mitte des neunzehnten Jahrhunderts in Druck kamen. Das Alte Testament wurde aus dem masoretischen Hebräisch gemacht. Der Grundsatz war Genauigkeit vor Eleganz: ein Deutsch, das dem Hebräischen und dem Griechischen so eng folgt, dass es steif wird, jedes sinngemäß ergänzte Wort als ergänzt gekennzeichnet und überhaupt keine Abschnittsüberschriften, weil die Urtexte keine haben. Sie gilt noch immer als eine der deutschen Fassungen, die dem Wortlaut unter ihnen am nächsten stehen.
hero.3=Dies ist der Druck von 1905, der erste in Antiqua statt in Fraktur gesetzte; nach der geringen Größe dieser Schrift heißt er die Perlbibel. Er war keine neue Übersetzung. Bis zum Tod von Rudolf Brockhaus im Jahr 1932 wurde die Elberfelder von Druck zu Druck durchgesehen und verbessert — Alfred Rochat verantwortete das Alte Testament, Emil Dönges das Neue —, sodass eine Jahreszahl hier einen Druck in einem beweglichen Text benennt und keine abgeschlossene Ausgabe. Was heute als Elberfelder verkauft wird, ist meist wieder etwas anderes: eine Kommission aus derselben Bewegung hat fünfundzwanzig Jahre an einer Revision gearbeitet und sie 1975 und 1985 veröffentlicht. Diese Revision nahm „Jehova“ aus dem Alten Testament und setzte „HERR“ an seine Stelle. Dieser Text druckt noch „Jehova“, was ihn neben die American Standard Version und neben Darbys eigene französische Bibel stellt.
hero.4=Ihr Platz in dieser Sammlung liegt ein wenig abseits. Für das Deutsche gibt es im Leser keine kuratierte Standardausgabe, also öffnet eine deutsche Oberfläche die erste deutsche Bibel des Katalogs, und das ist diese — vor beiden Lutherbibeln, aus alphabetischer Ordnung und aus keinem anderen Grund. In den Abstammungssprossen steht sie allein. Die beiden Luther bilden eine Kette, 1912 aus 1545 überarbeitet und 1545 auf dem Griechischen und dem Hebräischen ruhend, während für die Elberfelder keine Vorlage verzeichnet ist, weil die Elberfelder von 1871, aus der sie durch fortlaufende Korrektur hervorging, in diesem Korpus nicht vorhanden ist. Eine Sprosse unter einem Elberfelder Vers führt daher geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden, obwohl die französische Darby-Bibel eine Spalte weiter ihr nächster Verwandter hier ist.

