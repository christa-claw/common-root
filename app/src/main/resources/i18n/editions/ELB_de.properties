fact.13.label=In diesem Korpus
fact.13.value=die Bibel, die eine deutsche Oberfläche öffnet: für das Deutsche gibt es keine kuratierte Standardausgabe, also nimmt der Leser die erste deutsche Bibel des Katalogs, und ELB steht vor [[LUT1545|Luther 1545]] und [[LUT1912|Luther 1912]] aus nichts als ihrem Kürzel. In den Abstammungssprossen ist keine Vorlage verzeichnet — die Elberfelder von 1871, aus der sie durch fortlaufende Korrektur hervorging, ist nicht im Korpus —, also öffnet eine Sprosse auf den Ursprachenboden. Ein Jahr trägt sie auf keiner Seite: die Katalogkarte lässt die Jahresspalte leer, und die von Hand gepflegte Liste der Sprossenjahre führt sie ebenfalls nicht, sodass ein Sprossen-Chip für ELB nichts als das Kürzel zeigt — der stille Fall, wo [[DRA|die Douay-Rheims]] der laute ist und die beiden Listen einander öffentlich widersprechen
