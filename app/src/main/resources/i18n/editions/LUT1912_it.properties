fact.12.label=In questo corpus
fact.12.value=La cima della scala tedesca: un genitore registrato, [[LUT1545|Luther Bibel 1545]], e sotto di esso il pavimento delle lingue originali. Le sue 85 note dei revisori sono portate qui come commenti anziché scartate, e sono legate all'edizione — una glossa del 1912 si mostra sotto una colonna del 1912 e in nessun altro luogo. Non è ciò su cui si apre un'interfaccia tedesca; quella è [[ELB|l'Elberfelder]], prima nel catalogo per la sua sigla e per nessun altro motivo
