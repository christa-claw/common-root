title=Luther Bibel 1912 — Su questa edizione | Common Root
description=La seconda revisione ecclesiastica ufficiale della Bibbia di Lutero: una rilettura deliberatamente prudente, conclusa nel 1910, adottata nel 1912, e l'ultimo testo luterano che poggia sul Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Una revisione di una revisione. Le chiese tedesche si erano accordate nel 1892 su un testo unico della Bibbia di Lutero, la prima revisione ecclesiastica ufficiale, e nel giro di pochi anni la si diceva insufficiente. Le lagnanze erano quelle di sempre: troppi arcaismi e un'ortografia che non era più di nessuno. Fu il secondo punto a decidere. Il Duden aveva dato all'Impero tedesco un'ortografia vincolante, insegnata nelle scuole, e una Bibbia di Lutero che se ne discostasse era scomoda da mettere davanti a una classe. Nel 1906 la conferenza ecclesiastica evangelica tedesca acconsentì a un'altra revisione e prescrisse espressamente che fosse riguardosa e conservativa. Una commissione di teologi percorse ogni libro entro il 1910, e nel 1912 la conferenza ne adottò il risultato.
hero.2=Il lavoro durò poco più di due anni, il che dice di che sorta di revisione si trattasse. Nessuno cercava di fare una nuova Bibbia di Lutero, né filologicamente né altrimenti. Un revisore più tardo, Fritz Tschirch, la liquidò come una revisione da maestro di scuola, e sul metodo l'etichetta non dice nulla di falso: l'ortografia rimessa in riga, le parole più palesemente morte sostituite, la lettera per il resto lasciata dove Lutero l'aveva posta. Ciò che l'etichetta non vede è quanto abbia tenuto. Attraverso i decenni di revisioni parziali che seguirono, il testo del 1912 rimase al suo posto, e si legge e si vende ancora. In parte lo si deve alla Jubiläumsbibel del 1912, l'edizione centenaria dell'istituto biblico del Württemberg con note esplicative, ristampata in fraktur fin dentro questo secolo. In parte lo si deve al diritto d'autore ormai scaduto: riprodurre il testo non costa nulla, e perciò salta fuori dappertutto — anche qui.
hero.3=Una cosa più di ogni altra la tiene in uso presso i lettori conservatori: è l'ultima revisione luterana costruita sul Textus Receptus, il Nuovo Testamento greco del Cinquecento e del Seicento. Tutto ciò che venne dopo passò al testo critico. Questo fa di questa edizione un piolo insolitamente pulito su cui posare il piede in una scala, perché il greco che le sta sotto è lo stesso greco che sta sotto l'edizione propria di Lutero del 1545 e sotto la Ginevra e sotto la King James — l'intera torre condivide un pavimento invece di cambiarlo a mezza altezza.
hero.4=Nei pioli della discendenza questa edizione sta immediatamente sopra la Luther Bibel 1545 e ha esattamente un genitore registrato, che è quella. Aprite un piolo sotto un versetto del 1912 e la lettera propria di Lutero del 1545 compare sotto di esso; apritene un altro e la scala raggiunge il Textus Receptus per il greco e il Codice di Leningrado per l'ebraico. Trecentosessantasette anni di revisione, versetto per versetto, in due clic. Ciò che questa edizione non è: la Bibbia su cui si apre un'interfaccia tedesca — il tedesco non ha un'edizione predefinita scelta, sicché il lettore riceve la prima Bibbia tedesca del catalogo, e quella è l'Elberfelder.

