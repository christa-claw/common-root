title=जामिʿ अल-तिर्मिज़ी — इस संस्करण के बारे में | Common Root
description=जामिʿ अल-तिर्मिज़ी: वह हदीस-संग्रह जिसे अबू ईसा अल-तिर्मिज़ी ने हर रिवायत की सामर्थ्य को खुले तौर पर आँकते हुए और उससे फ़क़ीहों द्वारा निकाले गए विधिक तर्कों को दर्ज करते हुए रचा — सुन्नी इस्लाम की छह पुस्तकों में गिना जाता है।
heroHeading=जामिʿ अल-तिर्मिज़ी
