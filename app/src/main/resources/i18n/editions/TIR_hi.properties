# The narrative, one paragraph per key, in order.
hero.1=अबू ईसा मुहम्मद इब्न ईसा अल-तिर्मिज़ी का जन्म हिजरी संवत् 209 (824 ई.) के आसपास तिर्मिज़ के निकट हुआ, जो ख़ुरासान में था और आज उज़्बेकिस्तान-अफ़ग़ानिस्तान सीमा पर स्थित है। उन्होंने लगभग बीस वर्ष की आयु में हदीस की पढ़ाई शुरू की और हिजरी संवत् 235 से हदीस की खोज में ख़ुरासान, इराक़ और हिजाज़ होते हुए यात्रा की, तथा मुख्यतः मुहम्मद अल-बुख़ारी — उनके प्रमुख गुरु — के साथ-साथ मुस्लिम इब्न अल-हज्जाज, अबू दाऊद अल-सिजिस्तानी, क़ुतैबा इब्न सईद और अली इब्न हुज्र से शिक्षा प्राप्त की। अपने अंतिम वर्षों में वे अंधे हो गए, जिससे उनकी उपाधि "अल-ज़रीर" ("अंधा") पड़ी। वे तिर्मिज़ क्षेत्र लौट आए, जहाँ हिजरी संवत् 279 की 13 रजब (9 अक्तूबर 892 ई.) को लगभग सत्तर वर्ष की आयु में उनका निधन हुआ।
hero.2=उनका पूरा नाम, अल-जामिʿ अल-मुख़्तसर मिन अल-सुनन अन रसूल अल्लाह व मारिफ़त अल-सहीह वल-मालूल व मा अलैहि अल-अमल, सामान्यतः जामिʿ अल-तिर्मिज़ी या सुनन अल-तिर्मिज़ी में संक्षिप्त किया जाता है। सहीह अल-बुख़ारी और सहीह मुस्लिम के विपरीत, जो केवल उन्हीं हदीसों को स्वीकार करते हैं जिन्हें उनके संकलनकर्ताओं ने पूर्णतः प्रामाणिक माना, अल-तिर्मिज़ी ने प्रत्येक हदीस को स्वयं पाठ के भीतर खुले तौर पर आँका — सहीह, हसन, ज़ईफ़ या ग़रीब — और हदीस को छोड़ने के बजाय दुर्बल आकलन के आधार स्पष्ट किए; उन्होंने यह भी बताया कि विधिक मत-सम्प्रदाय (मज़ाहिब) कहाँ भिन्न थे और प्रत्येक पक्ष किन प्रमाणों का सहारा लेता था, जिससे यह ग्रंथ अपने आप में एक हदीस-संग्रह जितना ही हदीस-आधारित विधिक तर्क का मार्गदर्शक भी बनता है।
hero.3=सुन्नी परंपरा इसे छह पुस्तकों में गिनती है, सामान्यतः सहीह अल-बुख़ारी, सहीह मुस्लिम और सुनन अबू दाऊद के बाद; बाक़ी पुस्तकों में यह ठीक किस स्थान पर आता है — और कौन-सा संग्रह छठा स्थान भरता है, जिसमें सुनन इब्न माजा सामान्य परंतु ऐतिहासिक रूप से प्रस्तावित एकमात्र उत्तर नहीं है — यह लंबे समय से विवाद का विषय रहा है, निर्णीत नहीं, जैसा इस संग्रह के अन्य सुनन-ग्रंथों के साथ भी है। इस पुस्तक के लिए दी गई हदीसों की संख्या इसी कारण भिन्न-भिन्न है: पारंपरिक गणना के अनुसार लगभग 4,330, अन्यत्र लगभग 4,400 बताई गई है; इसकी संरचना भी भिन्न-भिन्न ढंग से वर्णित है — 46 पुस्तकें, अहमद मुहम्मद शाकिर के काहिरा संस्करण में 49 अध्याय, या पचास अध्याय। इस संग्रह की अपनी संख्या एक और ही अलग संख्या है: 49 पुस्तकें और 3,998 क्रमांकित हदीसें, जो उस डिजिटल संस्करण का रूप है जिससे इन्हें लिया गया, न कि किसी एक विशेष मुद्रण-परंपरा को दोहराने का दावा।
hero.4=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-tirmidhi संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह सहीह अल-बुख़ारी, सहीह मुस्लिम, सुनन अबू दाऊद और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

