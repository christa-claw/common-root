title=عهد تيندل الجديد 1534 — عن هذه الطبعة | Common Root
description=العهد الجديد لوليم تيندل، أول ترجمة إنجليزية عن اليونانية وأول ترجمة إنجليزية تُطبع، في تنقيحه هو نفسه سنة 1534 — الصيغة التي تقع تحت كتاب جنيف المقدس وترجمة الملك جيمس.
heroHeading=عهد تيندل الجديد 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=في إنجلترا التي عاش فيها تيندل كان الكتاب المقدس بالإنجليزية لا يزال مخالفًا للقانون. فقد حظرت «دساتير أكسفورد» الصادرة سنة 1409 على أي أحد أن يترجم الكتاب المقدس إلى الإنجليزية، أو أن يقرأ ترجمة كهذه، من دون موافقة أسقف. وطلب وليم تيندل هذه الموافقة من أسقف لندن كَثبرت تنستول سنة 1523، فرُدّ طلبه، وغادر إنجلترا في السنة التالية ليقوم بالعمل من دونها. وبين يديه العهد الجديد اليوناني الذي نشره إراسموس، وإلى جانبه ترجمة لوثر الألمانية والفولغاتا اللاتينية، أنجز أول عهد جديد إنجليزي مترجم عن اليونانية، وأول عهد جديد إنجليزي طُبع على الإطلاق. وقد توقفت محاولة أولى في كولونيا سنة 1525 بعد مداهمة المطبعة؛ ثم خرج الكتاب كاملًا من مطبعة بيتر شوفر في فورمس سنة 1526، وهُرِّب إلى إنجلترا، حيث كان الأساقفة يشترون النسخ ويحرقونها.
hero.2=النص هنا هو تنقيح تيندل نفسه، المطبوع في أنتويرب سنة 1534، وفيه عاد إلى اليونانية وصحّح ترجمته الأولى وأضاف مقدمات وحواشي. وكان موقفًا في جدال بقدر ما كان ترجمة. فقد هاجمه توماس مور لأنه كتب «الجماعة» (congregation) حيث كانت الكنيسة تقول «الكنيسة»، و«الشيخ» (elder) حيث كانت تقول «الكاهن»، و«المحبة» (love) حيث كانت تقول charity، والاختيارات الثلاثة كلها قائمة في هذا النص: فمتى 16:18 يقرأ «apon this rocke I wyll bylde my congregacion». ونقّح تيندل ترجمته مرة أخرى سنة 1535، واعتُقل في أنتويرب في أيار/مايو من العام نفسه، ثم أُدين سنة 1536 بالهرطقة، فخُنق وأُحرق في فيلفورد قرب بروكسل.
hero.3=وفي هذا القارئ تجده في الأسفل. فتيندل مسجَّل درجةً تحت كتاب جنيف المقدس وتحت ترجمة الملك جيمس، ومن ثَمّ، في موضع أدنى من السلّم، تحت Revised Version وAmerican Standard Version وWorld English Bible القائمة على ترجمة الملك جيمس. وإذا نزلت من آية في ترجمة الملك جيمس متجاوزًا جنيف، فكثيرًا ما لا تكاد الصيغة تتحرك — وهذا هو بيت القصيد؛ أما في كورنثوس الأولى 13:13 فتتحرك، إذ يقول تيندل وجنيف love وتقول ترجمة الملك جيمس charity. وليس تحت تيندل أصل مسجَّل. فقد عمل على يونانية إراسموس، لكن النص المستلم الموجود هنا هو طبعة 1550، بعده بجيل، ولوثر الموجود هنا هو كتاب 1545 المقدس لا عهد 1522 الجديد الذي استعمله، فينزل السلّم مباشرة إلى قاع اللغات الأصلية. والموجود هنا العهد الجديد وحده، بإملاء تيندل نفسه: يبدأ إنجيل متى بعبارة «This is the boke of the generacion of Iesus Christ».

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الإنجليزية — إنجليزية مطلع العهد التيودوري، بإملائها الأصلي
fact.2.label=المترجم
fact.2.value=وليم تيندل، الذي عمل منفيًّا في القارة الأوروبية بعد أن رفض أسقف لندن منحه الإذن سنة 1523
fact.3.label=الطبعة الأولى
fact.3.value=1526، فورمس، من مطبعة بيتر شوفر — أول عهد جديد مطبوع بالإنجليزية
fact.4.label=هذا النص
fact.4.value=تنقيح تيندل نفسه، طُبع في أنتويرب سنة 1534
fact.5.label=مترجَم عن
fact.5.value=العهد الجديد اليوناني لإراسموس، ومعه عهد لوثر الجديد الألماني الصادر سنة 1522 والفولغاتا — و[[TR|النص المستلم]] هو شاهد هذه المجموعة على تلك اليونانية
fact.6.label=كلمات أثارت الجدل
fact.6.value=«congregation» بدل church، و«elder» بدل priest، و«love» بدل charity — الاختيارات التي هاجمها توماس مور
fact.7.label=في هذه المجموعة
fact.7.value=أسفار العهد الجديد الـ27 وحدها، 7954 آية، بإملاء غير محدَّث
fact.8.label=درجة تحت
fact.8.value=[[GNV|كتاب جنيف المقدس]] و[[KJV|ترجمة الملك جيمس]] — وعبر ترجمة الملك جيمس تحت [[RV|Revised Version]] و[[ASV|American Standard Version]] و[[WEB|World English Bible]]
fact.9.label=تحت هذه الدرجة
fact.9.value=لا أصل مسجَّل — ينزل السلّم مباشرة إلى قاع اللغات الأصلية، حيث يقف [[TR|النص المستلم]] شاهدًا على اليونانية لا كتابًا أمسكه تيندل بيده
