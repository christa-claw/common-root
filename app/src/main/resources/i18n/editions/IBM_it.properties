title=Sunan Ibn Majah — Su questa edizione | Common Root
description=Sunan Ibn Majah: l'ultimo dei Sei Libri dell'islam sunnita, organizzato per argomento giuridico, il cui posto fra essi è da tempo discusso per gli hadith debili e fabbricati che contiene anch'esso.
heroHeading=Sunan Ibn Majah
readerHref=/reader?c1.src=ibm-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu 'Abdullah Muhammad ibn Yazid Ibn Majah al-Rabi'i al-Qazwini nacque nell'anno 209 dell'Egira (824 d.C.) a Qazwin, oggi nel nord-ovest dell'Iran, in una famiglia di mawali (clienti non arabi) della tribù di Rabi'ah — Majah, secondo un racconto, era il soprannome del padre e non il nome di un nonno o di una madre. Viaggiò in cerca di hadith attraverso l'Iraq, l'Hijaz, la Siria e l'Egitto, studiando con un vasto cerchio di studiosi; più di un quarto del suo futuro Sunan si dice poggi su un solo maestro, Ibn Abi Shaybah. Contemporanei come Abu Ya'la al-Khalili lo lodarono come attendibile, eminente e un'autorità concordemente riconosciuta. Morì a Qazwin nell'anno 273 dell'Egira (887 d.C.), sebbene al-Kattani registri anche l'anno 275 (889 d.C.); secondo il racconto tradizionale, dopo che Ibn Majah gli lesse il Sunan appena terminato, Abu Zur'a al-Razi osservò che se la gente avesse posseduto questo libro, le altre raccolte di Sunan sarebbero diventate in gran parte superflue.
hero.2=Il suo Sunan conta, secondo il computo di al-Dhahabi, circa 1.500 capitoli e circa 4.000 hadith, organizzati per argomento giuridico come le raccolte di [[ABD|Abu Dawud]] e di [[TIR|at-Tirmidhi]]. Accanto a materiale sano e accettabile, contiene anche hadith che studiosi successivi giudicarono debili, tra cui una trentina circa generalmente considerati pure fabbricazioni — motivo per cui alcuni studiosi contano solo "i Cinque" e non i Sei.
hero.3=La tradizione sunnita colloca il Sunan Ibn Majah come l'ultimo dei Sei Libri (Kutub al-Sitta), insieme al [[BUK|Sahih al-Bukhari]], al [[MUS|Sahih Muslim]], al [[ABD|Sunan Abi Dawud]], al [[TIR|Jami` at-Tirmidhi]] e al [[NAS|Sunan an-Nasa'i]]. Questo sesto posto è a sua volta discusso: i malikiti e Ibn al-Athir, tra altri, gli preferiscono il [[MAL|Muwatta Malik]], e alcuni citano il Sunan di al-Daraqutni; si dice generalmente che il libro di Ibn Majah abbia ottenuto il posto perché il suo contenuto si sovrappone meno agli altri cinque, non perché sia giudicato il più sicuro tra i candidati.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-ibnmajah di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]], il [[NAS|Sunan an-Nasa'i]] e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Abu 'Abdullah Muhammad ibn Yazid Ibn Majah al-Qazwini (209–273 dell'Egira / 824–887 d.C.)
fact.3.label=Titolo
fact.3.value=noto come Sunan Ibn Majah
fact.4.label=Compilato
fact.4.value=raccolto durante viaggi attraverso l'Iraq, l'Hijaz, la Siria e l'Egitto; Ibn Majah si stabilì a Qazwin, dove morì nell'anno 273 dell'Egira (887 d.C.)
fact.5.label=Metodo
fact.5.value=organizzato per argomento giuridico, come il [[ABD|Sunan Abi Dawud]] e il [[TIR|Jami` at-Tirmidhi]]; conta circa 1.500 capitoli secondo il computo di al-Dhahabi
fact.6.label=Posizione
fact.6.value=contato come l'ultimo dei Sei Libri dell'islam sunnita (Kutub al-Sitta), dopo il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]] e il [[NAS|Sunan an-Nasa'i]] — un sesto posto discusso, che alcuni attribuiscono invece al [[MAL|Muwatta Malik]] o al Sunan di al-Daraqutni
fact.7.label=Numero di hadith
fact.7.value=circa 4.000, secondo il computo di al-Dhahabi, tra cui una trentina generalmente considerati fabbricazioni; l'edizione fonte di questo corpus ne numera 4.343
fact.8.label=In questo corpus
fact.8.value=38 libri e 4.343 hadith numerati
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-ibnmajah di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione pubblicata discenda non è ancora stato stabilito da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
