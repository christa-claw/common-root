title=Revised Version — Über diese Ausgabe | Common Root
description=Die English Revised Version: die einzige Revision der King James Version, die die Kirche von England je autorisiert hat, in drei Lieferungen zwischen 1881 und 1894 erschienen — und hier die Sprosse zwischen der King James Version und der American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=Die Revised Version ist die eine Revision der King James Version, die Englands Kirche tatsächlich in Auftrag gab. Die Konvokation von Canterbury beschloss sie 1870 und berief zwei Gruppen, je eine für ein Testament, in denen mehr als fünfzig britische Gelehrte aus mehreren Konfessionen zusammenkamen — nicht nur Anglikaner, was für sich genommen neu war und worüber gestritten wurde. Amerikanische Gelehrte wurden eingeladen, brieflich mitzuwirken, und taten es. Die Anweisung war zurückhaltend: die Authorised Version nur dort zu ändern, wo die treu wiedergegebenen Ursprachen es verlangten. Das Neue Testament erschien 1881, das Alte Testament 1885 und die zuletzt bearbeiteten Apokryphen 1894.
hero.2=Die zurückhaltende Anweisung hinderte die neutestamentliche Gruppe nicht daran, die folgenreichste Entscheidung des Buches zu treffen. Sie arbeiteten nicht nach dem Textus Receptus. Westcott und Hort saßen in dieser Gruppe und legten ihr im Fortgang der Arbeit ihren eigenen griechischen Text als Korrekturfahne vor; worauf die Revisoren sich festlegten, war ihr eigener eklektischer Text und nicht genau der von Westcott und Hort, aber er rückte entschieden zu den älteren Unzialhandschriften hin. Stellt man diese Ausgabe in zwei Spalten neben die King James Version, ist die Verschiebung sofort zu sehen. In 1. Johannes 5,7 liest die King-James-Spalte „For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one“, und diese hier liest „And it is the Spirit that beareth witness, because the Spirit is the truth“.
hero.3=Was die britischen Revisoren nicht änderten, ist gerade das, was die Amerikaner am dringendsten geändert sehen wollten. In Psalm 23,1 druckt diese Ausgabe weiterhin „The LORD is my shepherd“, genau wie die King James Version; die American Standard Version darüber druckt „Jehovah is my shepherd“. Der Name erscheint hier nur dort, wo ihn die King James Version selbst gedruckt hatte — in 2. Mose 6,3 lesen beide „by my name JEHOVAH“ —, und ihn durch das ganze Alte Testament zu führen war eine amerikanische Vorliebe, die nach der Vierzehnjahresvereinbarung in den Anhang verwiesen und erst 1901 in den Text entlassen wurde. Die beiden Spalten nebeneinander zu lesen ist der kürzeste Weg zu sehen, was jene Vereinbarung tatsächlich zurückhielt. Ein zweiter Unterschied zeigt sich in der Gestalt der Sätze statt in ihrem Wortlaut: Die Revisoren brachen mit dem Satz Vers für Vers und setzten Prosa in Absätzen, und die Spur davon bleibt hier in Versen, die klein beginnen, weil sie einen Satz fortsetzen — „and I appeared unto Abraham“ in 2. Mose 6,3, wo die King-James-Spalte „And I appeared“ beginnt.
hero.4=Die Karte dieser Ausgabe lässt die Jahreszahl leer, und das ist die ehrliche Antwort und keine Lücke. Die Revised Version wurde nicht einmal, sondern dreimal veröffentlicht, und der Text ist hier der mit achtzig Büchern: sechsundsechzig Bücher und dazu die vierzehn der Apokryphen, zusammen 36.873 Verse, was heißt, dass er Material führt, das vor 1894 nicht gedruckt vorlag. Der Korpuseintrag stempelt ihn auf 1885, das Jahr, in dem das Alte Testament die eigentliche Bibel vollendete, und dieses Jahr zeigt auch der Chip der Abstammungssprosse. Von welchem Druck der Text abstammt, ist nicht verzeichnet — dieselbe Lücke, die das Korpus bei der King James Version und bei der finnischen Biblia von 1776 offenlässt. Zu beachten ist auch, dass keine Oberfläche mit dieser Ausgabe öffnet; eine englische öffnet mit der New International Version, und zu dieser hier wechselt man.

