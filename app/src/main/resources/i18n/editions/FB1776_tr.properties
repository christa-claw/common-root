title=Biblia 1776 — Bu Baskı Hakkında | Common Root
description=Biblia 1776: bir buçuk yüzyıl boyunca Finlandiya'nın kilise Kutsal Kitabı, evde okunmak üzere basılan ilk Fince Kutsal Kitap ve Fincenin «Biblia» derken hâlâ kastettiği kitap.
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=Bu sayfaya düzeltme gönderenlere teşekkürlerimizle.

# The narrative, one paragraph per key, in order.
hero.1=Finlandiya'nın üçüncü Kutsal Kitabı ve yerleşen o. Yeni bir çeviri değil, bir gözden geçirmedir: hat, Florinus'un 1683–85 gözden geçirmesi üzerinden 1642 Biblia'sına, yani ilk tam Fince Kutsal Kitaba geri gider. Gözden geçirmeyi, daha 1758'de kendi Kutsal Kitap baskısını hazırlamış olan Anders (Antti) Lizelius yaptı. 1776 baskısının değiştirdiği şey imlâ oldu, onunla birlikte erişim. Modernleştirilmiş bir imlâyla dizilen ilk Fince Kutsal Kitap ve yalnızca kürsü için değil, ev kullanımı için basılan ilki oydu. Bir ailenin sahip olabileceği bir Kutsal Kitap, bir cemaatin sahip olduğu Kutsal Kitaptan başka bir nesnedir. Aradaki basımlar yalnızca imlâ meselesi değildi. 1685'i hazırlayan Paimio başpapazı Henrik Florinus İbranice ve Yunanca biliyordu ve dili ne kadar düzelttiyse özü de o kadar düzeltti — ifade, yazımdan daha çok kımıldadı — ve aradaki basımların yalnızca 1642'yi derleyip toplamakla kalmayıp özgün dillerden çeviri işi de yaptığı kabul edilir. Dolayısıyla 1642 ile 1776'yı karşılaştıran kişi iki gözden geçirmenin ötesine bakıyordur, bir imlâ değişikliğinin değil.
hero.2=Kirkkoraamattu 1933/38 yerini alana dek bir buçuk yüzyıl kilisenin kullanımında kaldı ve resmî olmaktan çıktığında okunmaktan çıkmadı. Finlandiya Evanjelik Luteryen Kilisesi içindeki iki uyanış hareketi — Laestadiusçular ve rukoilevaiset — onu korudular ve hâlâ kullanıyorlar. Fincede yalın hâliyle Biblia sözcüğünün daha eski ya da daha yeni bir baskıyı değil bunu göstermesinin sebebi budur; kitabın ayrıca Vanha kirkkoraamattu, yani eski kilise Kutsal Kitabı diye anılmasının sebebi de.
hero.3=Bu okuyucuda Fin zincirinin ortasıdır. Kirkkoraamattu 1933/38'den bir ayetin altında bir basamak açın, bu baskı belirir; bunun altında bir tane daha açın, 1642 Biblia'sı belirir. Ne var ki iki basamak farklı okunmalıdır. 1933/38 çevirmenleri İbraniceden ve Yunancadan çalıştılar, dolayısıyla üstteki basamak tek bir kilisenin Kutsal Kitabı içinde ardıllıktır, türeyiş değil. Alttaki basamak gerçek türeyiştir: 1776, 1642'nin gözden geçirmesidir ve o adımın iki yanındaki sözcükler karşılaştırılmak içindir.
hero.4=Bu sitedeki metin hakkında bir çekince: bu, 1776 baskısı değildir. Burada okunan metin, imlâsı sonraki bir el tarafından düzenlenmiş ve yayın tarihçesi kayda geçmemiş, kamuya açık bir dijital metinden gelir — 31.102 ayetinden tam olarak birinde w harfi geçer, oysa 1642 Biblia'sında 26.862 ayette geçer; v yerine w ise 1776'nın basıldığı imlânın en açık işaretidir. Yani 1776, 1642'nin yazımını yeniledi; buradaki metin ise o günden beri bir kez daha yenilendi ve böylece basılı kitaba 1776'nın 1642'ye olduğundan daha uzak düştü. Eski yazılı Fince üzerine çalışan iki araştırmacı, başka bir şey sormadan önce bunun hangi sürüm olduğunu sordu; soru yerindeydi. 1776 baskısının kendisi Finlandiya Millî Kütüphanesi'nin İsveç dönemi koleksiyonunda sayfa görüntüleri hâlinde korunuyor; onun yerine sadık bir metin koymak, yapmak istediğimiz bir iş.

