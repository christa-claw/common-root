title=Smith & Van Dyck — Bu baskı hakkında | Common Root
description=Smith ve Van Dyck'in Arapça Kutsal Kitabı: Beyrut'ta Eli Smith'in başlattığı, 1865'te Cornelius Van Dyck'in Nahda âlimleri Butrus el-Bustani, Nasif el-Yazici ve Yusuf el-Asir ile birlikte tamamladığı çeviri; bugün de en çok okunan Arapça Kutsal Kitap.
heroHeading=Smith & Van Dyck
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=Beyrut'taki Amerikan misyonu bu çeviriye 1847 dolaylarında girişti ve işi başlatan onu bitiremedi. Eli Smith Levant'ta yirmi yıl geçirmiş, dili üzerine tartışacak kadar iyi öğrenmişti; 1857'deki ölümüne dek metnin başından ayrılmadı. Cornelius Van Alen Van Dyck işi devraldı ve sonuna götürdü: Yeni Antlaşma 1860'ta, Eski Antlaşma beş yıl sonra, 1865'te tamamlandı. Kitabın üzerindeki iki ad, tek bir işin iki yarısıdır.
hero.2=Sırtta yazmayan adlar da o kadar ağır basar. Van Dyck Arapçasını Butrus el-Bustani ile Nasif el-Yazici'den öğrenmişti; ikisi de çeviride onunla çalıştı, Arapçayı deyiş ve üslup bakımından baştan sona gözden geçiren Şeyh Yusuf el-Asir de öyle. Bu üçü bir misyon girişiminin yardımcıları değildi. Arap edebî uyanışı Nahda'nın merkezî adları arasındaydılar ve ortaya çıkan metin, Arapça giysiye bürünmüş bir çeviri gibi değil, Arapça nesir gibi okunur. Kitabın, masrafını karşılayan misyondan uzun yaşamasının sebebi budur.
hero.3=Bu, bilgi kadar baskı sanatının da bir başarısıydı. Beyrut'taki American Press kitabı, misyon için kesilip 1843'te tamamlanan bir Arap harfiyle dizdi — bugün hâlâ el-Amerikani denen, biçimlenmesinde Smith'in payı bulunan hurufatla. Arapçayı iyi dizmek güçtür: harfler birbirine bağlanır ve bağlandıkça biçim değiştirir; sayfada doğru görünen bir Kutsal Kitabın kabul görmesine yaptığı katkı, hiçbir delilin yapabileceğinden çoktu. O gün bugündür milyonlarca nüsha, Protestan ve Kıpti okurlara birlikte ulaştı; Arapça konuşan Hristiyanların çoğu için Kutsal Kitap yalnızca böyle tınlar.
hero.4=Bu okuyucuda o, tek Arapça Kutsal Kitaptır ve davranışını bu belirler. Arayüz Arapçaya alındığında açılan odur — İspanyolca için Reina-Valera 1909'un seçildiği gibi seçildiğinden değil, katalog arayüz dilinde bir Kutsal Kitap aradığı ve tam olarak bir tane bulduğu için. Ayrıca metni sağdan sola akan, buradaki yalnızca iki baskıdan biridir; öbürü çağdaş İbranice Kutsal Kitaptır. Soy basamaklarında ona kayıtlı bir kaynak metin yoktur, dolayısıyla bir ayetin altında açılan basamak doğrudan ≈ ile imlenen özgün diller tabanına iner — ki bu, burada her zamankinden daha yakın düşer, çünkü o tabanın sunduğu Yunanca Textus Receptus'tur ve Yeni Antlaşması Textus Receptus'tan yapılmıştır.

