title=Английская Септуагинта Брентона — Об этом издании | Common Root
description=Английский перевод греческого Ветхого Завета, выполненный сэром Ланселотом Брентоном: впервые издан в Лондоне в 1844 году и переиздан с неканоническими книгами в 1851-м — более столетия английская Септуагинта как таковая, а в этом читателе ступень над тем греческим текстом, с которого она переведена.
heroHeading=Английская Септуагинта Брентона
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Ланселот Чарльз Ли Брентон (1807–1862) был сыном адмирала Королевского флота сэра Джахлила Брентона и в 1830 году, через два года после окончания Ориел-колледжа в Оксфорде, был рукоположен в Церкви Англии. Пробыл он в ней недолго. В Оксфорде он познакомился с Джоном Нельсоном Дарби и к концу 1831 года оставил государственную церковь, чтобы основать независимую часовню в Бате; к 1835 году эта часовня была связана с Плимутскими братьями — движением, которое тогда складывалось под рукой Дарби. Библии самого Дарби тоже есть в этом собрании, на французском и на английском. В 1844 году Брентон унаследовал от отца титул баронета, и в том же году лондонское издательство Samuel Bagster and Sons выпустило его перевод Септуагинты. Он умер на острове Уайт в 1862 году, бездетным, последним баронетом своей линии.
hero.2=Это была не первая английская Септуагинта — Чарльз Томсон издал свою в Филадельфии в 1808 году, — но именно она удержалась: более полутора веков, пока в 2007 году не вышел New English Translation of the Septuagint, англоязычный читатель, желавший греческий Ветхий Завет вместо еврейского, читал Брентона. Он переводил главным образом по Ватиканскому кодексу, рукописи IV века из Ватиканской библиотеки. В первом издании неканонических книг не было; издание 1851 года их добавило, и эта копия воспроизводит именно текст 1851 года. Греко-английские издания Багстера помещали греческий рядом с английским, и этот греческий текст есть в собрании как отдельное издание. Поскольку английский следует греческому, он читает там, где читает греческий: псалмы сохраняют греческую нумерацию, так что псалом 22 здесь — это псалом о пастыре, а в Исаии 7:14 «a virgin shall conceive» передаёт греческое parthenos, а не еврейское ʿalmah.
hero.3=В этом читателе это ступень с единственным, буквальным предком: греческая Септуагинта под ней — тот самый текст, который переводил Брентон, напечатанный его же издателем рядом с его английским. Откройте ступень под одним из её стихов, и появится греческий, а под ним — Ленинградский кодекс как основание языков оригинала. На ней самой в собрании ничто не стоит. Наша копия уже, чем книга. В ней 37 книг — те, что есть и в еврейском каноне под привычными названиями. Файлы eBible.org, из которых она взята, содержат и неканонические книги — Товит, Иудифь, Премудрость, Сирах, Варух, четыре книги Маккавейские и другие, — а Есфирь и Даниила дают только в их более длинном греческом виде. Ничего из этого в собрание не попало, поэтому здесь нет ни Есфири, ни Даниила, а там, где в греческом ниже есть Товит или Премудрость, английского над ним нет. Ездра и Неемия стоят двумя книгами, тогда как в греческом ниже это одна книга. Орфографическая редакция того же перевода, Updated Brenton Адама Бойда 2020 года, есть в собрании как самостоятельное издание.

