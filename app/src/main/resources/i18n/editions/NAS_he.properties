title=סונן אלנסאאי — על מהדורה זו | Common Root
description=סונן אלנסאאי: אוסף החדית׳ שאחמד בן שועיב אלנסאאי קיצר מתוך חיבורו הגדול יותר, אלסונן אלכֻּברא, אשר אבן חג'ר ציין כבעל המספר הקטן ביותר של חדית׳ חלשים מבין ששת הספרים אחרי שני הצחיחים.
heroHeading=סונן אלנסאאי
