# The narrative, one paragraph per key, in order.
hero.1=אבו עבד אלרחמן אחמד בן שועיב בן עלי אלנסאאי נולד בסביבות שנת 214–215 להג'רה (829–830 לספירה) בנסא, עיר בחוראסאן השוכנת כיום בטורקמניסטן. הוא התחיל לנסוע בחיפוש אחר חדית׳ בסביבות גיל חמש-עשרה, ולמד לראשונה אצל קֻתַייבה בן סעיד — שעמו שהה בבַּגְ'לאן למעלה משנה — ולאחר מכן המשיך בעיראק, אלחיג'אז, סוריה ומצרים, שם למד אצל חכמים כגון יצחק בן רַאהְוַויה ואבו דאווד אלסיג'סתאני, מחבר ה[[ABD|סונן אבו דאווד]]. הוא התיישב במצרים, לימד שם, והתפרסם בשם חאפז' אלחדית'; חוקרי תולדות חייו המאוחרים חלוקים בשאלה אם למד אי-פעם ישירות אצל מחמד אלבוכ'ארי, שכן אלמִזי טען ששני האנשים לא נפגשו כלל. בנסיעתו מקהיר למכה בשלהי חייו, עצר בדמשק, שם, לפי המסורת, הרצאה שנתן על מידותיהם הטובות של חבריו של הנביא עוררה קהל עוין בעיצומה של התחושה האנטי-עלוית בעיר; הוא מת זמן קצר אחר כך, בשנת 303 להג'רה (915 לספירה), מפציעות שספג שם. המסורות חלוקות על מקום קבורתו — בין צַפא למַרווה במכה, לפי מסורת אחת, או ברַמְלה שבפלשתינה, לפי אחרת.
hero.2=מתוך כחמישה-עשר חיבורים המיוחסים לו, שישה עוסקים בחדית׳. את הגדול מביניהם, אלסונן אלכֻּברא, הוא עצמו קיצר מאוחר יותר למבחר קצר יותר הידוע כסונן אלסֻגְ'רא ("הסונן הקטן") או אלמֻגְ'תַבא ("הנבחר") — החיבור המכונה כיום בפשטות סונן אלנסאאי. מי בדיוק עשה את הבחירה הזו, ועל פי בקשת מי, אינו מתועד במקורות שנבדקו לעמוד זה. בתוכו סידר אלנסאאי את החדית׳ לפי נושא הלכתי, כפי שעשו [[ABD|אבו דאווד]] ו[[TIR|אלתרמד'י]]. הפוסק אבן חג'ר אלעסקלאני ציין אותו מאוחר יותר כמכיל, אחרי שני הצחיחים, את המספר הקטן ביותר של חדית׳ חלשים (צ'עיף) ומוסרים לא אמינים מבין ששת הספרים, וללא אף חדית׳ מזויף (מַוְצ'וע) אחד.
hero.3=המסורת הסונית מונה את סונן אלנסאאי בין ששת הספרים (כתב אלסתה), לצד [[BUK|צחיח אלבוכ'ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]] ו[[TIR|ג'אמע אלתרמד'י]], וספר שישי השנוי במחלוקת בין סונן אבן מאג'ה למועמדים אחרים. היכן בדיוק הוא מתמקם בין ארבעת אוספי הסונן נדון זה זמן רב מבלי שהוכרע: מקורות מסוימים מכנים אותו השלישי במעמדו מבין השישה, אחרי שני הצחיחים בלבד, בעוד שעמודי האוסף הזה על [[ABD|סונן אבו דאווד]] ועל [[TIR|ג'אמע אלתרמד'י]] משקפים את הסדר השכיח יותר, המציב את ספרו של אבו דאווד במקום השלישי. מספר החדית׳ הנתון לו משתנה באופן דומה: 5,758, כולל מסורות חזרות, לפי מספר נפוץ המצוטט למֻגְ'תַבא, לעומת 5,765 במהדורה שממנה שואב האוסף הזה — המקורות אינם מיישבים בין שני המספרים.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-nasai של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אלבוכ'ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג'אמע אלתרמד'י]] ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

