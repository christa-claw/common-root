fact.1.label=言語
fact.1.value=フランス語
fact.2.label=別名
fact.2.value=ポー・ヴヴェー聖書——表題紙にある二つの町の名にちなむ
fact.3.label=主任学者
fact.3.value=ジョン・ネルソン・ダービー（1800–1882）。ウィリアム・ジョゼフ・ロウおよびピエール・シュランベルジェと共に——彼の名を冠するいずれの版についても、単独の翻訳者ではなかった
fact.4.label=新約聖書
fact.4.value=1859年に初版、1872年、1875年、1878年に再版
fact.5.label=聖書全体
fact.5.value=1885年、ポーとヴヴェーで刊行——ダービーの死から三年後
fact.6.label=誰のために作られたか
fact.6.value=ブレザレンの集会、なかでもポー自体よりもフランス語圏スイスの集会のために
fact.7.label=翻訳の種類
fact.7.value=意図的に逐語的であり、朗読よりも個人の学びのために作られた。神の御名は「le Seigneur」ではなく「l'Éternel」と訳される
fact.8.label=姉妹版
fact.8.value=ドイツ語のダービー聖書はエルバーフェルダー聖書であり、このコーパスには[[ELB|エルバーフェルダー聖書1905]]として収められている。英語のダービー旧約聖書はフランス語とドイツ語の仕事から作られたものであり、ダービー自身の英語から直接訳されたものではない
fact.9.label=内容
fact.9.value=66巻——プロテスタントの正典であり、外典は含まない
fact.10.label=このコーパスでは
fact.10.value=ここにある唯一のフランス語聖書であり、フランス語インターフェースはこれを開く。系譜の段には母本が記録されておらず、カタログの札には1885年と表示されるにもかかわらず、その段のチップは年なしで表示される
fact.11.label=音声
fact.11.value=聖書全体——新旧両約のすべての章——が、マイクロソフト・アジュール（Microsoft Azure）のニューラル音声fr-FR-AlainNeuralによって読み上げられている。節ごとではなく章ごとに合成されており、散文が自然な文のリズムを保っている。
fact.12.label=音声の制限
fact.12.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
