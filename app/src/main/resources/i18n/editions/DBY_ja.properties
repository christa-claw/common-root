title=ダービー聖書1885年（フランス語） — この版について | Common Root
description=1885年のフランス語ダービー聖書：ジョン・ネルソン・ダービーとその同労者たちが1859年に着手し、彼の死から三年後に完成した訳であり、後に彼の英語旧約聖書が組み立てられた土台となった版である。
heroHeading=ダービー聖書1885年（フランス語）
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=ジョン・ネルソン・ダービーは他のことで記憶されている——イングランド国教会を離れ、プリマス・ブレザレンの設立を助け、ディスペンセーション主義的前千年王国説を世に広めた——が、生涯の多くを聖書の翻訳に費やし、それを三つの言語で行った。彼について珍しいのはその順序である。たいていの翻訳者は自分自身の母語から外へ向かって働く。ダービーの英語聖書は三つのうち最後に完成したものであり、その旧約聖書は彼自身がヘブライ語から直接訳したのではなく、すでに他の人々と共に作り上げていたフランス語版とドイツ語版から訳出されたものだった。
hero.2=これがそのフランス語版である。ダービーは主任の学者であったが、彼の名を冠するどの版についても唯一の翻訳者であったことは一度もない。フランス語チームにはウィリアム・ジョゼフ・ロウとピエール・シュランベルジェが加わっていた。新約聖書は1859年に世に出て、その後二十年ほどのあいだに三度再版された。聖書全体は1885年、ポーとヴヴェーで刊行された——それが通称の由来である——が、表題紙はいくぶん誤解を招く。ポーはフランス最南部にあり、この仕事はおもにフランス語圏スイスのブレザレン集会のために行われたものだった。ダービーは1882年に世を去っており、完成した書物を目にすることはなかった。
hero.3=この翻訳は方針として逐語的であり、ダービーは自身のドイツ語新約聖書の序文でその理由をはっきりと述べている——学識ある者は原典に当たることができるが、翻訳の目的は、それができない読者の手に、できる限り正確な写しを渡すことにある。彼はまた、自由な訳し方は翻訳者自身も気づかなかった意味を失わせると警告した。その結果は正確だが美しくはなく、声に出して読まれることも初めから意図されていなかった——ダービー自身は自らの説教でキング・ジェイムズ・バージョンを用いていた。
hero.4=二つの点で、これはこのコーパスの他の部分とつながっている。ドイツ語のダービー聖書はエルバーフェルダー聖書であり、ここには「エルバーフェルダー聖書1905」として収められている——同じ人物、同じ原則であり、彼の英語旧約聖書が組み立てられた二つの底本のうちの一つでもある。だからこそ、このフランス語版とドイツ語版のカードは、言語の違いが示す以上に近い血縁にある。また神の御名の扱いは、これをアメリカン・スタンダード・バージョンと並べる——同版はキング・ジェイムズ・バージョンが「the LORD」と印刷する箇所に「Jehovah」を数千回にわたって印刷している。ダービーは三つの言語において先にこの同じ選択をしていた。この読書環境ではこれが唯一のフランス語聖書であり、フランス語インターフェースはこれを開く。系譜の段には記録された母本がなく、ここに収められた年代付きの版の多くと違い、その段のチップにはまったく年が示されない——カタログの札には1885年と表示されるが、段の年は別に管理された一覧であり、この版はまだそこに載っていない。

