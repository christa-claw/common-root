title=Svenska 1917 — À propos de cette édition | Common Root
description=La traduction de 1917 de l'Église de Suède — Gustav V:s bibel — la première Bible suédoise faite directement à partir de l'hébreu et du grec plutôt que révisée à partir de la précédente, et la seule Bible suédoise que ce corpus détient.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Pendant trois siècles et demi, l'Église de Suède n'eut qu'une seule Bible, révisée mais jamais refaite. La Bible de Gustave Vasa de 1541, la première Bible complète imprimée en suédois, s'appuyait largement sur l'allemand de Martin Luther. La Bible de Gustave II Adolphe de 1618 la révisa, et Karl XII:s bibel de 1703 — achevée sous un roi bien que commandée par son père avant lui — fit avancer d'un pas supplémentaire ce même suédois hérité. Aucune des trois ne repartit de zéro.
hero.2=En 1773, Gustave III nomma une commission biblique pour faire ce qu'aucune de ces révisions n'avait fait : traduire directement de l'hébreu et du grec plutôt que de faire avancer une fois de plus le vieux suédois. La commission siégea pendant 144 ans. Son résultat — la deuxième traduction complète de la Bible en Suède, après celle de Gustave Vasa et avant Bibel 2000 — fut achevé et autorisé sous Gustave V en 1917, et c'est pourquoi on l'appelle encore souvent Gustav V:s bibel.
hero.3=L'Ancien Testament repose sur le texte hébreu massorétique, comme les éditions qui l'ont précédé. Le Nouveau Testament ne poursuit pas leur ligne : il suit le texte grec critique le plus à jour dont la commission disposait vers 1917, plutôt que le Textus Receptus sur lequel reposent les Bibles de la Réforme que détient ce corpus.
hero.4=Dans ce lecteur, c'est la seule Bible suédoise, de sorte que régler l'interface sur le suédois ouvre sur elle — non par choix curaté, comme la Reina-Valera 1909 est choisie pour l'espagnol, mais parce que le balayage du catalogue ne trouve rien d'autre dans la langue. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation, si bien qu'un échelon ouvert sous un verset descend droit au sol des langues originales marqué d'un ≈. Ce sol fournit le Textus Receptus pour le grec, et ici cela s'éloigne de la vérité plus qu'à l'ordinaire : la commission a délibérément laissé le Textus Receptus pour un texte critique plus à jour, si bien que le sol sous un verset de cette traduction nomme un texte grec qui n'est pas celui qu'elle a réellement suivi.

