title=Los cuarenta hadices de Shah Waliullah Dehlawi — Acerca de esta edición | Common Root
description=Los cuarenta hadices de Shah Waliullah Dehlawi: cuarenta hadices que el erudito de Delhi del siglo XVIII dijo haber oído directamente de su propio maestro durante un año de estudio en Medina, conservados junto con sus cadenas de transmisión — la colección más conocida de este tipo procedente del subcontinente indio.
heroHeading=Los cuarenta hadices de Shah Waliullah Dehlawi
readerHref=/reader?c1.src=deh-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Shah Waliullah Dehlawi —en forma completa, Qutb al-Din Ahmad ibn 'Abd al-Rahim al-'Umari al-Dihlawi— nació el 21 de febrero de 1703 en Phulat, cerca de Muzaffarnagar, y se crió en Delhi, donde su padre, Shah Abdur Rahim, había fundado la Madrasah-i Rahimiyah. Se dice que memorizó el Corán a los siete años y completó el plan de estudios habitual de su época a los quince, sucediendo a su padre como director de la madrasa dos años después. En 1730–31 realizó el hajj, y después pasó aproximadamente un año en Medina estudiando hadiz —principalmente con Abu Tahir al-Kurdi (también transcrito al-Kurani), con estudios adicionales con Muhammad Wafdullah al-Maliki y el jeque Taj al-Din al-Qal'i— antes de regresar a Delhi el 16 de diciembre de 1732. Murió allí el 20 de agosto de 1762 (29 de muharram de 1176 AH) y fue enterrado junto a su padre. Entre sus otras obras figuran Hujjat Allah al-Baligha, considerada generalmente su libro más importante, Al-Fawz al-Kabir, y Futuh al-Haramayn, su propio relato del viaje que lo llevó al Hiyaz.
hero.2=Al-Arba'in continúa la misma tradición de "cuarenta hadices" (arba'iniyyat) que [[NAW|Los cuarenta hadices de an-Nawawi]] y [[QUD|Los cuarenta hadices sagrados]], que se remonta a un hadiz que promete un lugar entre los sabios el Día del Juicio a quien conserve cuarenta hadices sobre la religión —un hadiz que la mayoría de los críticos clasifica a su vez como da'if (débil)— y a una primera colección, hoy perdida, atribuida a Abdullah ibn al-Mubarak (m. 797). Se diferencia de esas dos en lo que reúne: en lugar de hadices elegidos por tema o rango canónico de la literatura más amplia, su editor en inglés la describe como cuarenta hadices que Shah Waliullah dijo haber oído directamente de su propio maestro en Medina, cada uno conservado junto con la cadena de transmisión (sanad) por la que lo recibió —un registro personal de transmisión del año de estudio que, según el relato de su hijo, cambió su manera de enseñar y escribir una vez de vuelta en Delhi.
hero.3=El texto árabe aquí es el matn clásico, de dominio público. Debajo, en el lector, aparece una traducción al inglés, tomada de la edición eng-dehlawi de fawazahmed0/hadith-api y alineada hadiz por hadiz con el árabe, de modo que ambos pueden leerse en pareja —la misma disposición de acompañamiento que este corpus usa para el [[BUK|Sahih al-Bukhari]], el [[MUS|Sahih Muslim]], el [[ABD|Sunan Abi Dawud]], el [[TIR|Jami` at-Tirmidhi]], el [[NAS|Sunan an-Nasa'i]], el [[IBM|Sunan Ibn Majah]], el [[MAL|Muwatta Malik]], [[NAW|Los cuarenta hadices de an-Nawawi]] y [[QUD|Los cuarenta hadices sagrados]], y sus traducciones del Corán—. De qué traducción inglesa publicada procede en realidad este archivo no se ha determinado por parte de este corpus, razón por la que su licencia figura como en revisión y no simplemente como de dominio público; el árabe de arriba no lleva esa misma incertidumbre.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Idioma
fact.1.value=Árabe clásico, con una traducción al inglés debajo de cada hadiz en el lector
fact.2.label=Compilador
fact.2.value=Shah Waliullah Dehlawi (1703–1762)
fact.3.label=Título
fact.3.value=Conocida en árabe como Al-Arba'in ("Los cuarenta"); una edición inglesa moderna titulada Forty Hadith of Shah Wali-Allah fue publicada por Turath Publishing en 2015, traducida por Safaruk Zaman Chowdhury
fact.4.label=Compilado
fact.4.value=Después de que Shah Waliullah regresara a Delhi el 16 de diciembre de 1732, tras un hajj realizado en 1730–31 y aproximadamente un año de estudio de hadiz en Medina, principalmente con Abu Tahir al-Kurdi (también transcrito al-Kurani)
fact.5.label=Método
fact.5.value=Según su editor en inglés, cada uno de los cuarenta hadices es uno que Shah Waliullah dijo haber oído directamente de su propio maestro, conservado junto con la cadena de transmisión (sanad) por la que lo recibió —un registro personal de transmisión y no una selección hecha por tema o rango canónico
fact.6.label=Posición
fact.6.value=La colección de "cuarenta hadices" (arba'iniyyat) más conocida del subcontinente indio; continúa un género cuyo primer ejemplo conocido, hoy perdido, se atribuye a Abdullah ibn al-Mubarak (m. 797) y que también produjo [[NAW|Los cuarenta hadices de an-Nawawi]] y [[QUD|Los cuarenta hadices sagrados]]
fact.7.label=Número de hadices
fact.7.value=40
fact.8.label=En este corpus
fact.8.value=1 libro y 40 hadices numerados
fact.9.label=Traducción al inglés
fact.9.value=Tomada de la edición eng-dehlawi de fawazahmed0/hadith-api, mostrada como acompañamiento del árabe; el conjunto de datos indica que su traductor es desconocido, y no está confirmado por parte de este corpus si se trata de la traducción de Turath Publishing/Chowdhury o de una independiente
fact.10.label=Licencia
fact.10.value=El matn árabe es el texto clásico de dominio público; la licencia de la traducción al inglés sigue en revisión
