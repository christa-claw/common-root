title=Codice di Leningrado — Informazioni su questa edizione | Common Root
description=Il Codice di Leningrado: il più antico manoscritto completo della Bibbia ebraica, copiato nel 1008 d.C. e ancora oggi il testo base della maggior parte delle traduzioni moderne dell'Antico Testamento.
heroHeading=Codice di Leningrado
readerHref=/reader?c1.src=wlc

# The narrative, one paragraph per key, in order.
hero.1=È il più antico manoscritto completo della Bibbia ebraica giunto fino a noi. Lo copiò uno scriba di nome Samuele ben Giacobbe, che lavorava nel Vecchio Cairo e che, in una nota di suo pugno alla fine del manoscritto, datò il proprio lavoro all'anno 1008 d.C.
hero.2=Samuele ben Giacobbe non inventava un testo: ne conservava uno. Lavorava nella tradizione della famiglia Ben Asher, la massima autorità in materia di masorah — l'elaborato sistema di segni vocalici, accenti di cantillazione e note marginali che gli studiosi ebrei avevano affinato per secoli per fissare la pronuncia della Bibbia ebraica e proteggerla dalla corruzione. Un manoscritto Ben Asher più antico, e probabilmente più autorevole, è sopravvissuto — il Codice di Aleppo — ma gran parte della sua sezione della Torah è andata perduta nel 1947. Il Codice di Leningrado è prezioso proprio perché è completo e abbastanza antico da collocarsi alla sorgente stessa di quella tradizione.
hero.3=Prende il nome dalla città in cui finì per essere conservato: Leningrado, come si chiamava San Pietroburgo quando il manoscritto entrò negli studi occidentali, un nome che gli è rimasto anche dopo che la città ha ripreso il proprio nel 1991. Oggi sta alla base della Biblia Hebraica Stuttgartensia, l'edizione scientifica di riferimento della Bibbia ebraica: il che significa che quasi ogni traduzione moderna dell'Antico Testamento, in quasi ogni lingua, risale al lavoro accurato di un solo scriba cairota dell'XI secolo, che i suoi lettori ne conoscano il nome o no.

