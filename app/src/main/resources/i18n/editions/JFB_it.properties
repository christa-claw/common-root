title=Freedom Bible giapponese — Su questa edizione | Common Root
description=La Freedom Bible giapponese (フリーダム・バイブル): una Bibbia giapponese completa in 66 libri che eBible.org diffonde come bozza di traduzione senza diritto d'autore — l'unica Bibbia giapponese di questo corpus, perciò l'interfaccia giapponese si apre su di essa.
heroHeading=Freedom Bible giapponese
readerHref=/reader?c1.src=jfb

hero.1=La Freedom Bible giapponese — in giapponese フリーダム・バイブル — è una Bibbia giapponese completa diffusa da eBible.org, che si definisce distributore ufficiale della traduzione. È recentissima: i file sorgente conservati in questo corpus sono datati 19 agosto 2026, e il 2026 sulla sua scheda è la data di quei file. eBible non indica una data di pubblicazione distinta, e qui non se ne afferma alcuna.
hero.2=Molto di essa non è documentato, ed è bene dirlo apertamente. Le pagine di eBible non nominano traduttore, comitato né editore, e non dicono da che cosa sia stata fatta la traduzione: direttamente dall'ebraico e dal greco, o attraverso un'altra traduzione moderna. La sua stessa pagina sul diritto d'autore la chiama bozza di traduzione (翻訳の草案) e invita a proporre miglioramenti; il testo qui è quindi l'istantanea di un lavoro in corso, non un'edizione definita.
hero.3=Chiara è invece la sua posizione giuridica: la stessa pagina dichiara che sulla traduzione non grava alcun diritto d'autore e la indica come di pubblico dominio. Per questo è il testo giapponese di questo corpus: era l'unica Bibbia giapponese completa su eBible libera da diritti. La Bibbia giapponese più antica che avrebbe potuto darle una discendenza, la traduzione dell'era Meiji completata nel 1887 e da tempo di pubblico dominio, non è disponibile da quella fonte.
hero.4=In questo corpus comprende i 66 libri del canone protestante, 31.098 versetti, senza libri deuterocanonici. Non ha alcun testo di base registrato, sicché aprire un piolo sotto uno dei suoi versetti porta direttamente al fondo delle lingue originali, segnato con ≈: l'ebraico e il greco che vi compaiono sono testimoni, non un'affermazione su ciò da cui è stata tradotta — e, essendo ignota la sua fonte, è questa la lettura onesta. È l'unica Bibbia giapponese del corpus, perciò un'interfaccia in giapponese si apre su di essa per impostazione predefinita.

