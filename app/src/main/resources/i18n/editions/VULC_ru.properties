title=Климентинская Вульгата — Об этом издании | Common Root
description=Климентинская Вульгата: папская редакция латинской Библии Иеронима, напечатанная в Риме в 1592 году и переизданная с исправлениями в 1593 и 1598 годах, — стандартный латинский текст Католической церкви до 1979 года, а в этом читателе — ступень над Вульгатой.
heroHeading=Климентинская Вульгата
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=В 1546 году Тридентский собор объявил Вульгату подлинной латинской Библией Церкви и тем оставил вопрос, на который не ответил: какую Вульгату? Одиннадцать веков переписывания от руки не оставили двух вполне одинаковых рукописей, и собор потребовал исправленного текста. Папа Сикст V представил его в 1590 году, во многом выправленный им самим, вместе с буллой, объявлявшей его подлинным. Он умер в августе того же года, и через несколько недель кардиналы остановили продажу. При Клименте VIII комиссия — среди редакторов Франсиско де Толедо, в центре работы Роберт Беллармин — подготовила ему замену, напечатанную в Риме в 1592 году. Переиздания меньшего формата в 1593 и 1598 годах устранили большую часть опечаток и добавили прологи Иеронима и ссылки на полях.
hero.2=Этот текст был стандартной латинской Библией Католической церкви почти четыре века, до Новой Вульгаты 1979 года, а миссал и бревиарий 1962 года пользуются им до сих пор. Это Библия Иеронима в том виде, в каком её приняла Церковь, а не в каком он её оставил. Псалмы здесь — его Галликанская Псалтирь, выправленная по греческому, а не его поздний перевод с еврейского, поэтому они сохраняют греческую нумерацию: Псалом 22 начинается здесь словами «Dominus regit me» — это псалом о пастыре. В 1 Ин 5:7 стоит Comma Johanneum, «Pater, Verbum, et Spiritus Sanctus», латинская вставка, которой нет в ранних греческих рукописях. Есфирь и Даниил даны в своих пространных формах: греческие дополнения собраны в конце Есфири и в двух последних главах Даниила. Файл eBible.org, из которого взята эта копия, печатает текст 1598 года с Glossa Ordinaria в примечаниях — комментарием XII века из школы Ансельма Ланского, в издании Миня 1880 года. Примечания в собрание не попали; квадратные скобки в некоторых стихах принадлежат самому источнику.
hero.3=В этом читателе это ступень с одним записанным предком, латинской Вульгатой: откройте ступень под любым её стихом, и появится Вульгата. Ожидайте, что обе читаются почти слово в слово одинаково. Вульгата в этом собрании сама взята из климентинского текста, так что разделяет их в основном пунктуация — и книги, которых в этой копии нет. Их здесь 66, книги протестантского канона, с Есфирью и Даниилом в пространных формах. В исходных файлах есть также Товит, Юдифь, Премудрость, Сирах, Варух и две книги Маккавейские, и все они есть в Вульгате под ней; ни одна не попала в собрание, так что там, где у Вульгаты есть Товит, над ней ничего нет. Молитвы Манассии и 3 и 4 книг Ездры, которые Климентина печатала в приложении, нет ни в источнике, ни в собрании. Ничто в этом собрании, в свою очередь, не стоит на этом издании.

