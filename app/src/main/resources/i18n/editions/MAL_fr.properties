title=Muwatta Malik — À propos de cette édition | Common Root
description=Muwatta Malik : le recueil de droit et de hadith de l'imam Malik ibn Anas, antérieur d'environ un siècle aux Six Livres de l'islam sunnite et parfois proposé pour y occuper la place du Sunan Ibn Majah.
heroHeading=Muwatta Malik
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Malik ibn Anas ibn Malik ibn Abi 'Amir al-Asbahi al-Madani, connu par la kunya Abu 'Abdullah, naquit vers l'an 93 de l'hégire (711 apr. J.-C.) à Médine et y mourut en l'an 179 (795 apr. J.-C.), enterré au cimetière d'al-Baqi'. Il étudia auprès de savants tels que Hisham ibn Urwah, Ibn Shihab al-Zuhri, Ja'far al-Sadiq et Nafi' Mawla Ibn Umar, et enseigna à Médine toute sa vie, y gagnant des titres comme Imam Dar al-Hijra (« l'imam de la cité de l'hégire ») et Shaykh al-Islam. Il devint l'éponyme de l'école malikite, une des quatre grandes écoles juridiques de l'islam sunnite ; son élève le plus notable, Muhammad ibn Idris al-Shafi'i — qui fonda plus tard l'école shafiite — qualifia le livre de Malik de « livre le plus sûr sur terre après le Coran ». Le calife abbasside al-Mansur aurait voulu en faire la référence juridique unique de l'empire ; Malik lui-même s'y refusa.
hero.2=Al-Muwatta (« le chemin bien foulé ») fut composé, selon la tradition, sur quelque quarante années au début de la période abbasside ; son nom viendrait de ce que Malik montra le texte à soixante-dix juristes de Médine, qui tous en convinrent (wata'a). Il réunit des hadiths attribués au Prophète avec les avis juridiques de ses compagnons et de la génération suivante, ainsi que les décisions de Malik lui-même — selon une évaluation, le plus ancien ouvrage subsistant à fondre ainsi hadith et fiqh, antérieur d'environ un siècle aux Six Livres. Les chiffres sur sa taille varient selon la recension et le mode de calcul : un chiffre souvent cité pour les hadiths proprement dits est d'environ 1 720, tandis que Malik aurait sélectionné un peu moins de 1 900 récits parmi les 100 000 qui lui auraient été accessibles.
hero.3=On connaît au moins seize recensions d'al-Muwatta. Celle devenue la référence standard, en particulier pour l'école malikite, est celle de Yahya ibn Yahya al-Laythi ; une recension rivale d'Ahmad ibn Abi Bakr al-Zuhri est environ cinq à dix pour cent plus longue. Une centaine de commentaires existent sur la seule recension d'al-Laythi. Parce qu'il est antérieur aux Six Livres de l'islam sunnite, certains savants — les malikites et Ibn al-Athir entre autres — soutiennent qu'al-Muwatta, et non le [[IBM|Sunan Ibn Majah]], devrait figurer dans cette liste canonique ; on dit généralement que le Sunan d'Ibn Majah a gardé cette place parce que son contenu recoupe le moins les cinq autres, et non parce qu'il serait jugé plus sûr.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-malik de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour le [[BUK|Sahih al-Bukhari]], le [[MUS|Sahih Muslim]], le [[ABD|Sunan Abi Dawud]], le [[TIR|Jami` at-Tirmidhi]], le [[NAS|Sunan an-Nasa'i]], le [[IBM|Sunan Ibn Majah]] et ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

