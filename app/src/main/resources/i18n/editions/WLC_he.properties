# The narrative, one paragraph per key, in order.
hero.1=זהו כתב היד השלם הקדום ביותר של המקרא שהגיע לידינו. העתיק אותו סופר בשם שמואל בן יעקב, שפעל בקהיר העתיקה, ובקולופון שבסוף כתב היד תיארך את מלאכתו לשנת 1008 לספירה.
hero.2=שמואל בן יעקב לא המציא נוסח, אלא שימר אותו. הוא פעל במסורת בית בן אשר, בעלי הסמכות המובהקים בענייני המסורה — אותה מערכת מורכבת של ניקוד, טעמי מקרא והערות שוליים שחכמי ישראל ליטשו במשך מאות שנים כדי לקבע את הגיית המקרא ולשמור עליו מפני שיבושים. אמנם שרד כתב יד קדום יותר ומוסמך אף יותר מבית בן אשר — כתר ארם צובא — אך רובו של חלק התורה שבו אבד בשנת 1947. כתב יד לנינגרד יקר בדיוק משום שהוא שלם, וקדום דיו כדי לעמוד ממש במקורה של אותה מסורת.
hero.3=שמו ניתן לו על שם העיר שבה מצא את מקומו: לנינגרד, כפי שנקראה סנקט פטרבורג בעת שכתב היד נכנס למחקר המערבי — שם שדבק בו גם לאחר שהעיר עצמה שבה לשמה בשנת 1991. כיום הוא עומד ביסודה של Biblia Hebraica Stuttgartensia, המהדורה המדעית המקובלת של המקרא. משמעות הדבר היא שכמעט כל תרגום מודרני של הברית הישנה, כמעט בכל שפה, חוזר אל העתקתו הקפדנית של סופר קהירי אחד מן המאה האחת עשרה — בין אם קוראיו יודעים את שמו ובין אם לאו.

