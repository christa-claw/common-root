title=Versión Unión China, texto de 1919 — Acerca de esta edición | Common Root
description=La Versión Unión China tal como se publicó por primera vez en 1919, con las formas de caracteres antiguas y la puntuación original, transcrita por Chinese Wikisource, con sus notas al pie.
heroHeading=Versión Unión China — el texto de 1919
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Esta es la [[CUV|Versión Unión China]] tal como se imprimió en 1919: la Biblia en mandarín en la que misioneros y eruditos chinos trabajaron durante veintinueve años, fijada con las formas de aquel año. La otra Versión Unión de este lector es el texto tal como se lee hoy, con puntuación moderna y elecciones de caracteres modernas. Esta conserva la página de 1919.
hero.2=Se puede ver la diferencia en los caracteres. El texto de 1919 usa formas que las impresiones posteriores retiraron — 爲 donde las ediciones actuales tienen 為, 愼, 册, 槪 — y está impreso en caracteres tradicionales en su totalidad. Su puntuación es la transcrita de la impresión de 1919, no la puntuación moderna de las ediciones posteriores. Donde el libro de 1919 imprimía versículos consecutivos como un solo pasaje, esta edición hace lo mismo: se conserva la numeración de los versículos, y el texto se sitúa en el primer versículo de la serie.
hero.3=El texto procede de la transcripción realizada por Chinese Wikisource, y es la edición Shen (神版), en la que Dios es 神 y no 上帝. Las notas al pie del libro de 1919 se conservan, y aparecen en este lector como notas sobre los versículos a los que pertenecen.
hero.4=Se añadió para que pudiera imprimirse una Biblia china a partir de un texto cuya fecha y origen son conocidos. Una impresión de 1919 lleva mucho tiempo fuera de derechos de autor. Los textos puntuados que la siguieron, de 1988 en adelante, son una cuestión distinta, por lo que ambos se mantienen separados.

