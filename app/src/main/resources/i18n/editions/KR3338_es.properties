title=Kirkkoraamattu 1933/38 — Acerca de esta edición | Common Root
description=Kirkkoraamattu 1933/38: la biblia eclesiástica finlandesa, traducida de nuevo del hebreo y del griego y adoptada en dos mitades, en 1933 y en 1938, tras unos setenta años de trabajo de una comisión.
heroHeading=Kirkkoraamattu 1933/38
readerHref=/reader?c1.src=kr3338

# The narrative, one paragraph per key, in order.
hero.1=El nombre son dos fechas, porque el libro llegó en dos mitades. La Iglesia Evangélica Luterana de Finlandia aceptó el Antiguo Testamento en 1933 y el Nuevo en 1938, y en finés se la llama desde entonces la biblia eclesiástica de 1933/38. Esas fechas finales ocultan cuán atrás quedaba el comienzo: la comisión de traducción había sido nombrada en 1861. Unos setenta años, y más de una generación de traductores, separan el encargo de la biblia terminada.
hero.2=Lo que la comisión produjo fue una traducción nueva y no una revisión. Trabajó sobre el hebreo del Antiguo Testamento y el griego del Nuevo — sin intermediarios latinos, alemanes o suecos, y no sobre la biblia finesa que ya estaba en uso. Con todo, era conscientemente la sucesora de aquella, la Biblia 1776, texto de la iglesia durante siglo y medio, y conservó buena parte del vocabulario y la cadencia del libro más antiguo. Esa herencia explica que una biblia terminada en 1938 sonara ya arcaica a sus primeros lectores, y que siga llevando el registro solemne de la escritura finesa. Siguió siendo la biblia eclesiástica oficial hasta 1992.
hero.3=En este lector hace dos cosas. Ponga la interfaz en finés y es esta edición la que se abre — el propio orden del catálogo le daría en cambio la Biblia 1776, de modo que el valor por defecto del finés es una elección deliberada y no un azar del alfabeto. Es además el peldaño más alto de la cadena finesa: abra un peldaño bajo un versículo del KR3338 y aparecerá debajo la Biblia 1776. Lea ese peldaño como sucesión dentro de la biblia de una misma iglesia y no como fuente, pues los traductores de 1933/38 tenían delante el hebreo y el griego, no el texto de 1776. Debajo de la Biblia 1776 la cadena continúa: la Biblia de 1642, que la de 1776 revisa, luego el finés de Agricola de 1548, que aquella comisión revisó a su vez, y el alemán de Lutero de 1545, abierto junto a ellos mientras trabajaban. Solo por debajo de esos alcanza la escalera el hebreo y el griego.

