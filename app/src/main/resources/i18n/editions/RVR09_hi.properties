title=रेइना-वालेरा 1909 — इस संस्करण के विषय में | Common Root
description=रेइना-वालेरा 1909: वह संशोधन जो कासिओदोरो दे रेइना की 1569 की स्पेनी को — जैसा सिप्रियानो दे वालेरा ने उसे 1602 में संशोधित किया था — बीसवीं सदी तक लाया, और वही संस्करण जिस पर यह पाठक स्पेनी के लिए खुलता है।
heroHeading=रेइना-वालेरा 1909
readerHref=/reader?c1.src=rvr09

# The narrative, one paragraph per key, in order.
hero.1=स्पेनी प्रोटेस्टेंट बाइबिल असाधारण मात्रा में एक ही पुस्तक है। कासिओदोरो दे रेइना, जो धर्माधिकरण से बचकर स्पेन छोड़ चुके थे, ने अपना अनुवाद निर्वासन में पूरा किया और 1569 में बाज़ेल में प्रकाशित किया — वह Biblia del Oso, जिसका नाम उसके मुखपृष्ठ के भालू से पड़ा। सिप्रियानो दे वालेरा, जो सेविल के बाहर उसी मठ में रहे थे और उसी भाँति भागे थे, वर्षों उसे देखते रहे और फल 1602 में आम्स्टर्डम में छापा, वह Biblia del Cántaro। उसके बाद की हर रेइना-वालेरा उसी के संशोधन का संशोधन है, और इसीलिए योजक-चिह्न वाला एक नाम उन दो व्यक्तियों को स्मरण कराता है जिन्होंने कभी एक ही कमरे में काम नहीं किया।
hero.2=यह 1909 का संशोधन है, जो ब्रिटिश एवं विदेशी बाइबिल सोसाइटी तथा अमेरिकन बाइबिल सोसाइटी के अधीन तैयार हुआ, और जिसे उसके व्यवहारकर्ता प्रायः Versión Antigua, अर्थात् पुराना संस्करण, कहते हैं। इससे पहले 1862 का संशोधन आया था, और यह ठीक उसी बात में संयमी है जिसे संशोधन बदला करते हैं: जहाँ रेइना और वालेरा दुर्बोध हो चले थे वहाँ शब्द आगे लाया गया, और जहाँ नहीं हुए थे वहाँ अछूता छोड़ा गया। पुराना नियम मासोरेटिक इब्रानी पर खड़ा है और नया तेक्स्तुस रेसेप्तुस पर, जैसे रेइना का खड़ा था।
hero.3=लगभग पचास वर्ष तक इसने स्पेनी-भाषी प्रोटेस्टेंट जगत को लगभग अकेले थामे रखा, जब तक 1960 के संशोधन ने इसे हटा न दिया; और यह कभी पूरी तरह लुप्त नहीं हुआ। यह प्रतिलिप्यधिकार से मुक्त है, जो 1960 वाला नहीं है — अतः यही वह रेइना-वालेरा है जो बिना किसी की अनुमति के छपती, जालक्रम पर चढ़ती और उद्धृत होती है। इसी कारण सम्पूर्ण पाठ इस संग्रह में रह सकता है और इससे बाहर प्रतिलिपि भी हो सकता है।
hero.4=इस पाठक में स्पेनी की पाँच बाइबिलें हैं, और अन्तरफलक इसी पर खुलता है। यह चुना हुआ निर्णय है, सूची का संयोग नहीं: अरबी या चीनी के विपरीत, जहाँ पाठक उस भाषा की एकमात्र बाइबिल पर खुलता है, स्पेनी के पास विकल्प हैं और यह उन्हीं में से चुनी गई। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं, अतः किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है। यहाँ वह तल सामान्य से अधिक निकट बैठता है, उसी कारण से जो अरबी बाइबिल में है: वह जो यूनानी देता है वही तेक्स्तुस रेसेप्तुस है, और तेक्स्तुस रेसेप्तुस से ही रेइना का नया नियम बना।

