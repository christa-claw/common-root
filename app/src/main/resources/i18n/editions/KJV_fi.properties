title=King James Version — Tietoja tästä laitoksesta | Common Root
description=Vuoden 1611 King James Version: neljäkymmentäseitsemän kääntäjää kuutena ryhmänä, käskettyinä tarkistamaan Bishops' Bible eikä aloittamaan alusta — ja tässä aineistossa kahdeksankymmenen kirjan teksti, joka yhä kantaa ensipainoksen apokryfikirjat.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Se alkoi myönnytyksenä kokouksessa, joka koski jotain muuta. Vuoden 1604 Hampton Courtin neuvottelussa, jonka Jaakko I oli kutsunut koolle kuullakseen puritaanien valituksia rukouskirjasta, esitettiin uutta käännöstä, ja kuningas tarttui ajatukseen. Neljäkymmentäseitsemän oppinutta nimitettiin ja jaettiin kuuteen ryhmään — kaksi Westminsteriin, kaksi Oxfordiin, kaksi Cambridgeen — ja kullakin oli osansa Raamatusta ja säännöstö, jonka mukaan työskennellä. Näistä säännöistä ensimmäinen on lukemisen kannalta tärkein: heidän tuli seurata vuoden 1568 Bishops' Bibleä ja muuttaa sitä vain sikäli kuin alkuteksti vaati. Tämä tilattiin tarkistukseksi eikä uudeksi käännökseksi, ja sellaiselta se lukeekin. Robert Barker, kuninkaan kirjanpainaja, julkaisi valmiin kirjan Lontoossa 1611.
hero.2=Mitä säännöt eivät sanoneet ja mitä kääntäjät silti tekivät, oli kurottaa yhä uudelleen Bishops' Biblen taakse. Heidän perimänsä englanti oli toisten tekemää — ennen muuta Tyndalen, ja Geneven Raamatun, jota kokonainen englantilaissukupolvi todella omisti ja luki kotonaan. Tämä aineisto kirjaa tuon velan sen sijaan, että jättäisi sen johdannon asiaksi: King James Versionin kantatekstinä on täällä [[GNV|Geneven Raamattu]], ja sen alla vastaanotettu kreikkalainen teksti ja masoreettinen heprea. Avaa polveutumisaskelma King James -jakeen alta, ja esiin tulee Geneve. Nämä kaksi ovat jae jakeelta niin lähellä toisiaan, että kiinnostava kysymys lakkaa olemasta se, käytettiinkö Geneveä, ja muuttuu siksi, missä vuoden 1611 ryhmät päättivät poiketa siitä — ja sitä voi nyt katsoa sen sijaan että ottaisi sen uskon varassa.
hero.3=Yksi ero tämän King Jamesin ja useimpien muiden välillä koskee sitä, mitä siinä on. Teksti käsittää täällä kahdeksankymmentä kirjaa ja 36 820 jaetta: Vanhan ja Uuden testamentin sekä niiden väliin painetut neljätoista apokryfikirjaa, niin kuin vuoden 1611 nide ne painoi. Lähes jokaisessa nykyään myytävässä King James -Raamatussa on kuusikymmentäkuusi. Aineisto säilyttää pidemmän muodon, ja vaikutus näkyy pitkin polveutumisketjua: [[GNV|Geneven Raamatussa]] on täällä kuusikymmentäkuusi kirjaa, tässä kahdeksankymmentä, sen yläpuolella [[RV|Revised Versionissa]] kahdeksankymmentä ja sen yläpuolella [[ASV|American Standard Versionissa]] taas kuusikymmentäkuusi. Se, painaako laitos apokryfikirjat, on kunkin erikseen tekemä ratkaisu, ja niiden asettaminen yhteen palstaan tekee kuvion luettavaksi.
hero.4=Ole tarkkana sen suhteen, mitä kortin vuosiluku tarkoittaa. Siinä lukee 1611, ja se on käännöksen vuosi — se ei ole väite siitä, mikä painos tämä teksti on. Englanti on täällä oikeinkirjoitukseltaan nykyaikaistettua: 1. Mooseksen kirja alkaa ”In the beginning God created the heaven and the earth”, kun vuoden 1611 arkeissa luki ”In the beginning God created the Heauen, and the Earth”. Tämä on siis King James sellaisena kuin myöhemmät kirjanpainajat sen vakiinnuttivat, eikä sitä nimenomaista painosta, josta se polveutuu, ole kirjattu — sama rehellinen aukko, jonka aineisto jättää [[FB1776|Biblia 1776:n]] kohdalla. Kääntäjien ratkaisujen lukemisen kannalta sillä ei ole väliä; vuoden 1611 kirjan siteeraamisessa esineenä sillä on kaikki väli. Huomaa myös, ettei tämä ole se laitos, jolla englanninkielinen käyttöliittymä avautuu: se on [[NIV|New International Version]], ja King James on se, johon vaihdetaan.

