title=Koranen — Sablukov — Om denna utgåva | Common Root
description=Gordi Sablukovs ryska översättning, utgiven i Kazan 1878 och vanligen beskriven som den första ryska koranöversättningen gjord direkt från arabiskan snarare än via en fransk eller engelsk mellanhand — och i detta korpus den ryska följeöversättningen som visas under den uthmanska arabiska texten.
heroHeading=Koranen — Sablukov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordi Semjonovitj Sablukov (1803–1880) utbildades för den rysk-ortodoxa prästkåren och tog examen från Orenburgs teologiska seminarium 1826 och Moskvas teologiska akademi 1830. Han tillbringade de följande två decennierna, från 1830 till 1849, med att undervisa i historia och österländska språk vid Saratovs teologiska seminarium — där en av hans elever i mitten av 1840-talet var den blivande radikale författaren Nikolaj Tjernyshevskij — innan han 1849 flyttade till Kazans teologiska akademis missionsavdelning, där han undervisade i österländska och klassiska språk fram till 1862.
hero.2=Ryska koranöversättningar går tillbaka till 1716, då Pjotr Postnikov gjorde en på Peter den stores order — men från André du Ryers franska, inte från arabiskan, liksom Aleksej Kolmakovs översättning från 1792, gjord från George Sales engelska. Sablukovs översättning, utgiven i Kazan 1878 som "Коран, законодательная книга мохаммеданского вероучения" ("Koranen, den muhammedanska trons lagbok"), tillskrivs vanligen rollen som den första ryska koranöversättningen gjord direkt från den arabiska originaltexten — resultatet av hans år som lärare i österländska språk i Kazan.
hero.3=Året därpå följde han upp den med en medföljande volym anteckningar, "Приложения к переводу Корана" (1879), och senare två ytterligare studier kopplade till den: "Сведения о Коране" ("Uppgifter om Koranen", 1884) och en tidigare jämförande avhandling om kristen och muslimsk lära om Guds namn (1873). Hans översättning har sedan dess förblivit en av de mer spridda ryska versionerna, även efter att senare översättningar — bland dem Ignatij Kratjkovskijs postumt utgivna — blivit mer kända i sovjetisk och post-sovjetisk akademisk användning.
hero.4=Det som digitaliserats här, i alquran.clouds utgåva ru.sablukov, erbjuds i detta korpus som den ryska följeöversättningen till [[Q-AR|den uthmanska arabiska texten]], vid sidan av de engelska översättningarna av [[Q-EN|Pickthall]] (1930) och [[Q-YA|Yusuf Ali]] (1934) — de tre översättningar som en genomgång av tillgängliga översättningar fann otvetydigt fria att kopiera, en per språk utöver arabiskan.

