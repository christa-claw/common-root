title=Septuaginta inglesa de Brenton actualizada — Acerca de esta edición | Common Root
description=La Septuaginta inglesa de Sir Lancelot Brenton, de 1844 y 1851, con la ortografía y los nombres puestos al día por Adam Boyd en 2020 — la misma traducción que el Brenton original que tiene al lado en este corpus, con thou y thee donde Brenton los dejó.
heroHeading=Septuaginta inglesa de Brenton actualizada
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Esta es la traducción inglesa de la Septuaginta, el Antiguo Testamento griego, hecha por Sir Lancelot Brenton, con su inglés puesto al día. Brenton tradujo principalmente del Codex Vaticanus; Samuel Bagster and Sons, de Londres, publicó su versión en 1844 y la reeditó con los apócrifos en 1851. En 2020 Adam Boyd la revisó para eBible.org y cedió sus cambios al dominio público. No la volvió a traducir. Su introducción enumera lo que cambió: la ortografía, llevada al inglés americano moderno, de modo que “shew” pasa a “show”; los nombres de personas y lugares, en las formas que conoce el lector inglés; “begat” y “spake”, convertidos en “begot” y “spoke”; guiones y signos de puntuación dobles, ordenados; y la poesía, dispuesta como poesía. Lo que conservó es igual de deliberado: “thou”, “thee” y “ye” con las formas verbales que los acompañan, la gramática de Brenton y su densa puntuación del siglo XIX.
hero.2=La diferencia se ve mejor junto al Brenton original, que también está en este corpus. Brenton escribía los nombres hebreos como los escribe el griego; la actualización suele dar la forma inglesa. Donde el Nehemías de Brenton empieza con “the words of Neemias the son of Chelcia”, este dice “Nehemiah the son of Hacaliah”; Elias the Thesbite pasa a Elijah the Tishbite, y Emmanuel en Isaías 7:14 pasa a Immanuel. Bajo la ortografía, la traducción sigue siendo la de Brenton, y por eso sigue leyendo donde lee el griego. “A virgin shall conceive” en Isaías 7:14 traduce el griego parthenos; los Salmos conservan la numeración griega, así que el Salmo 22 es aquí el salmo del pastor; y la tierra de Génesis 1:2 sigue siendo “unsightly and unfurnished”. También se quedan los pronombres antiguos: “thou shalt call his name Immanuel”.
hero.3=En este lector queda fuera de los peldaños del linaje. El corpus no registra ningún antecesor para ella — ni el griego que Brenton tradujo ni el Brenton que revisa —, de modo que un peldaño abierto bajo uno de sus versículos cae directamente al suelo de lenguas originales marcado con ≈, que para el Antiguo Testamento es el Códice de Leningrado: un texto hebreo, no el griego del que se hizo esta traducción. Para bajar del inglés de Brenton a su griego, abra el Brenton original, cuyo antecesor registrado es la Septuaginta. Nada se apoya a su vez en esta edición, y ningún idioma de la interfaz se abre en ella; una interfaz en inglés se abre en la New International Version. Nuestra copia es más estrecha que el libro. Tiene 36 libros. Esdras y Nehemías son un solo libro de 23 capítulos, como en el griego, y Nehemías empieza en el capítulo 11. Los archivos de eBible.org de los que procede contienen también los apócrifos y dan Ester y Daniel solo en sus formas griegas más largas; nada de eso se incorporó, así que aquí no hay Ester ni Daniel, ni tampoco Tobías ni Sabiduría.

