fact.3.label=Revisada por
fact.3.value=Robert Adam Boyd, 2020 — ortografía, nombres, guiones, puntuación y disposición de la poesía; la traducción en sí, tal como la hizo Brenton
fact.4.label=Revisión de
fact.4.value=[[LXXE|La Septuaginta inglesa de Brenton]] — Londres, Samuel Bagster and Sons, 1844; con los apócrifos, 1851
fact.5.label=Traducida de
fact.5.value=[[LXX|La Septuaginta griega]], principalmente en el texto del Codex Vaticanus
fact.6.label=Salmos
fact.6.value=En la numeración griega, 151 en total — el Salmo 22 es el salmo del pastor, que en [[KJV|la King James Version]] es el Salmo 23
fact.7.label=Licencia
fact.7.value=Dominio público; los cambios de Boyd cedidos a él con CC0; esta copia, de eBible.org
fact.8.label=En este corpus
fact.8.value=36 libros, solo Antiguo Testamento; Esdras y Nehemías como un solo libro, ni Ester ni Daniel, y ninguno de los apócrifos — los archivos de origen los contienen, pero no se incorporaron
fact.9.label=Linaje
fact.9.value=Sin antecesor registrado — un peldaño se abre directamente en el suelo de lenguas originales, [[WLC|el Códice de Leningrado]], y no en [[LXX|el griego]] al que baja [[LXXE|el Brenton original]]
