title=Libro de Mormón — Acerca de esta edición | Common Root
description=El Libro de Mormón: el registro de antiguos profetas de América dictado por Joseph Smith en 1830, impreso en Palmyra, Nueva York, y leído por los santos de los últimos días como escritura complementaria de la Biblia.
heroHeading=Libro de Mormón
readerHref=/reader?c1.src=bom

hero.1=Joseph Smith dijo haber traducido este libro "por el don y el poder de Dios" a partir de un conjunto de planchas metálicas antiguas que, según afirmó, había recuperado en 1827 cerca de la granja de su familia, a las afueras de Palmyra, Nueva York, y que después devolvió al mensajero que se las había mostrado. Los testigos del dictado lo describen examinando una piedra de vidente —en etapas posteriores del trabajo, una piedra que colocaba dentro de un sombrero para bloquear la luz, y no solo el par de piedras sujetas a un pectoral que tradicionalmente se llaman Urim y Tumim y que se dice llegaron junto con las planchas— mientras pronunciaba el texto en voz alta y un escribiente lo anotaba. Oliver Cowdery registró la mayor parte de esta manera durante unos dos meses en 1829, principalmente en la granja de la familia Whitmer en Fayette, Nueva York; Martin Harris y la esposa de Joseph, Emma Smith, habían servido como escribientes en tramos más breves y anteriores.
hero.2=El manuscrito fue a la imprenta dentro de ese mismo año. Smith registró los derechos de autor de la obra en junio de 1829, y la impresión comenzó en el taller de Egbert B. Grandin en Palmyra, donde el tipógrafo John H. Gilbert añadió la puntuación y la división en párrafos que el manuscrito dictado no tenía. El libro terminado apareció en marzo de 1830: unos 5.000 ejemplares, toda la tirada de Grandin.
hero.3=Se divide en quince libros, desde el Primer Libro de Nefi hasta el Libro de Moroni, cada uno llamado según el profeta compilador al que se atribuye su redacción. Ninguno de los ejemplares de 1830 tenía numeración de versículos: el texto corría como párrafos continuos dentro de capítulos mucho más largos que los que ven los lectores hoy. Las actuales divisiones en capítulos y versículos datan de una edición de 1879 preparada por Orson Pratt, quien también acortó los capítulos y añadió las primeras notas al pie. Ediciones posteriores reorganizaron aún más su presentación: un comité dirigido por George F. Richards lo compuso a dos columnas en 1920 y añadió resúmenes de capítulo y una guía de pronunciación; una edición de 1981 actualizó las referencias cruzadas, los encabezados de capítulo y otro material de consulta; y una impresión de 2013 corrigió inconsistencias tipográficas que se habían infiltrado en las planchas de impresión desde 1981.
hero.4=Se cuenta entre las cuatro obras que el movimiento de los Santos de los Últimos Días llama sus libros canónicos, junto a la Biblia, [[DC|Doctrina y Convenios]] y la [[PGP|Perla de Gran Precio]]. El texto de este corpus proviene de la exportación JSON del Mormon Documentation Project, que su responsable ha declarado de dominio público; sigue la redacción y la división en versículos de la edición estándar actual, con las correcciones tipográficas de la impresión de 2013, y omite las notas al pie, los resúmenes de capítulo y la introducción, que siguen protegidos por derechos de autor. Como lo que se conserva aquí es precisamente ese texto estándar actual y no una impresión histórica concreta, no se consigna para él un único año de publicación.

