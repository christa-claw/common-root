title=Hebreisk bibel — Om denna utgåva | Common Root
description=Hela Bibeln på hebreiska: det masoretiska Gamla testamentet tillsammans med Franz Delitzschs Nya testamente från 1877, återöversatt till Mishnans hebreiska för läsare som ville ha boken hel på ett enda språk.
heroHeading=Hebreisk bibel — masoretiskt Gamla testamente och Delitzschs Nya testamente
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=En bibel som är hebreisk från pärm till pärm är ett främmande ting, mer än det låter, eftersom hälften av den aldrig skrevs på hebreiska. Gamla testamentet är hebreiskt och var det alltid. Nya testamentet har kommit ned på grekiska. En utgåva som denna är alltså två olika slags text sydda samman: ett original, och en översättning gjord i motsatt riktning mot den vanliga — ur grekiskan och tillbaka till det språk dess författare mestadels talade.
hero.2=Den nytestamentliga hälften är Franz Delitzschs verk, en Leipzigkännare av hebreiskan och av den rabbinska litteraturen, som 1873 fick uppdraget av Brittiska och utländska bibelsällskapet och avslutade det 1877. Han översatte inte till sitt eget århundrades hebreiska. Han skrev på Mishnans och andra templets tids hebreiska, med argumentet att en text från första århundradet borde låta som en sådan — så resultatet läses mindre som en överflyttning till hebreiska än som ett försök att återvinna vad meningarna kan ha varit innan de blev grekiska. Det är fortfarande det hebreiska Nya testamente man oftast griper efter.
hero.3=Vilken grekiska han arbetade från avgjordes delvis åt honom. Han började från Codex Sinaiticus, den handskrift från fjärde århundradet som hittats några decennier tidigare, och bibelsällskapet — vars princip var att ge ut efter den mottagna texten — vägrade fortsätta bekosta en version byggd på den. Delitzsch gick tillbaka till Textus Receptus och antecknade de betydande sinaitiska läsarterna i stället för att ta upp dem. Texten fortsatte sedan att röra sig i tretton år och tio upplagor, den sista av dem förd genom pressen av Gustav Dalman 1890, samma år som Delitzsch dog. Det är ett skäl till att katalogen lämnar den här utgåvans år tomt: de två halvorna delar inget datum, och den halva som har datum har tio av dem.
hero.4=I den här läsaren är den utgåvan ett hebreiskt gränssnitt öppnar på — ett kurerat val, ingen alfabetisk tillfällighet — och att välja hebreiska vänder hela gränssnittet från höger till vänster omkring den. Den står bredvid Leningradkodexen utan att tävla med den: kodexen är den vetenskapliga Tanakh, fullt punkterad och accentuerad och slutande där Gamla testamentet slutar, medan detta är en enkel konsonanttext som fortsätter genom Uppenbarelseboken. Härstamningens stegpinnar registrerar ingen förlaga för den, så en stegpinne som öppnas under en vers faller rakt ned till originalspråksgolvet, ≈ WLC och ≈ TR. På andra håll i detta korpus är det golvet en approximation, och det är vad ≈ varnar för. Här är det nästan inte det: Gamla testamentet på skärmen är den masoretiska texten, och Textus Receptus är vad Delitzsch faktiskt hade framför sig.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Språk
fact.1.value=hebreiska — konsonanttext utan vokaltecken och utan accenter
fact.2.label=Vad det är
fact.2.value=två texter bundna som en bibel: det traditionella masoretiska Gamla testamentet, och ett hebreiskt Nya testamente översatt från grekiskan på artonhundratalet
fact.3.label=Nya testamentet av
fact.3.value=Franz Delitzsch (1813–1890), hebraisten i Leipzig
fact.4.label=Beställt av
fact.4.value=Brittiska och utländska bibelsällskapet år 1873; översättningen blev färdig 1877
fact.5.label=Gamla testamentet från
fact.5.value=den masoretiska hebreiskan själv — ingen översättning, vilket gör detta till den enda utgåvan här vars Gamla testamente redan står på sitt originalspråk, så som [[WLC|Westminster Leningradkodex]] gör
fact.6.label=Nya testamentet från
fact.6.value=grekiskan i [[TR|Textus Receptus]]. Delitzsch började i stället från Codex Sinaiticus, men bibelsällskapet gav ut efter den mottagna texten och ville inte bekosta avvikelsen
fact.7.label=Språkform
fact.7.value=inte modern hebreiska. Delitzsch skrev på Mishnans och andra templets tids hebreiska och sökte ge grekiskan tillbaka det idiom dess talare skulle ha använt
fact.8.label=Reviderad fram till
fact.8.value=1890, den sista upplagan förd genom pressen av Gustav Dalman
fact.9.label=Att inte förväxla med
fact.9.value=det nyhebreiska Nya testamentet utgivet av bibelsällskapet i Israel, en egen översättning från nittonhundratalet som fortfarande är upphovsrättsskyddad
fact.10.label=År i katalogen
fact.10.value=lämnat tomt — de två halvorna delar inget år, och enbart Nya testamentet reviderades över tretton år och tio upplagor
fact.11.label=I detta korpus
fact.11.value=alla 66 böcker, och det kurerade förvalet för ett hebreiskt gränssnitt — läsaren öppnar på denna och inte på [[WLC|Westminster Leningradkodex]], eftersom denna går hela vägen genom Nya testamentet
