title=क्लेमेंटीन वुल्गाता — इस संस्करण के बारे में | Common Root
description=क्लेमेंटीन वुल्गाता: जेरोम की लातीनी बाइबिल का पोपीय संशोधन, जो 1592 में रोम में छपा और 1593 तथा 1598 में सुधारों के साथ फिर से प्रकाशित हुआ — 1979 तक कैथोलिक कलीसिया का मानक लातीनी पाठ, और इस पाठक में वुल्गाता के ऊपर का एक पायदान।
heroHeading=क्लेमेंटीन वुल्गाता
readerHref=/reader?c1.src=vulc

# The narrative, one paragraph per key, in order.
hero.1=1546 में ट्रेंट की परिषद ने वुल्गाता को कलीसिया की प्रामाणिक लातीनी बाइबिल घोषित किया, और इस तरह एक ऐसा प्रश्न छोड़ दिया जिसका उसने उत्तर नहीं दिया: कौन-सी वुल्गाता? ग्यारह सदियों की हाथ से नकल ने कोई भी दो पांडुलिपियाँ पूरी तरह एक-सी नहीं छोड़ी थीं, और परिषद ने एक सुधारा हुआ पाठ माँगा। पोप सिक्सटस पंचम ने 1590 में ऐसा एक पाठ दिया, जिसका बड़ा हिस्सा उन्होंने स्वयं संशोधित किया था, एक पोपीय आदेशपत्र के साथ जो उसे प्रामाणिक घोषित करता था। उसी वर्ष अगस्त में उनकी मृत्यु हो गई, और कुछ ही हफ़्तों में कार्डिनलों ने उसकी बिक्री रोक दी। क्लेमेंट अष्टम के समय एक आयोग ने — संपादकों में फ़्रांसिस्को दे तोलेदो, और काम के केंद्र में रॉबर्ट बेलार्मिन — उसका स्थान लेने वाला पाठ तैयार किया, जो 1592 में रोम में छपा। 1593 और 1598 के छोटे आकार के पुनर्मुद्रणों ने उसकी अधिकांश छपाई की भूलें हटाईं और जेरोम की प्रस्तावनाएँ तथा हाशिये के संदर्भ जोड़े।
hero.2=यह पाठ लगभग चार सदियों तक, 1979 की नोवा वुल्गाता तक, कैथोलिक कलीसिया की मानक लातीनी बाइबिल रहा, और 1962 की मिस्सा-पुस्तक और प्रार्थना-पुस्तक आज भी इसी का उपयोग करती हैं। यह जेरोम की बाइबिल है जैसी कलीसिया ने उसे ग्रहण किया था, न कि जैसी उन्होंने उसे छोड़ा था। इसके भजन उनका गैलिकन भजन-संग्रह हैं, जो यूनानी के आधार पर संशोधित हुआ था, न कि इब्रानी से किया गया उनका बाद का अनुवाद, इसलिए वे यूनानी क्रमांकन रखते हैं: यहाँ भजन 22 “Dominus regit me” से शुरू होता है, जो चरवाहे वाला भजन है। 1 यूहन्ना 5:7 में योहन्नीय अल्पवाक्य (Comma Johanneum) है, “Pater, Verbum, et Spiritus Sanctus”, एक लातीनी जोड़ जो आरंभिक यूनानी पांडुलिपियों में नहीं है। एस्तेर और दानिय्येल अपने लंबे रूपों में हैं, और यूनानी जोड़ एस्तेर के अंत में तथा दानिय्येल के अंतिम दो अध्यायों के रूप में एकत्र हैं। जिस eBible.org फ़ाइल से यह प्रति ली गई है, वह 1598 के पाठ को ग्लोसा ऑर्डिनेरिया (Glossa Ordinaria) के साथ टिप्पणियों के रूप में छापती है — लाओं के आंसेल्म की परंपरा से निकली बारहवीं सदी की व्याख्या, मीन्य के 1880 के संस्करण में। टिप्पणियाँ संग्रह में नहीं आईं; कुछ पदों में दिखने वाले वर्गाकार कोष्ठक स्रोत के अपने हैं।
hero.3=इस पाठक में यह एक ऐसा पायदान है जिसका एक ही दर्ज जनक है, लातीनी वुल्गाता: इसके किसी भी पद के नीचे एक पायदान खोलिए और वुल्गाता प्रकट होती है। दोनों लगभग शब्दशः एक जैसे पढ़े जाएँगे, ऐसी अपेक्षा रखिए। इस संग्रह की वुल्गाता स्वयं एक क्लेमेंटीन पाठ से ली गई है, इसलिए दोनों को अलग करने वाली चीज़ मुख्यतः विराम-चिह्न हैं — और वे पुस्तकें जो इस प्रति में नहीं हैं। इसमें 66 पुस्तकें हैं, प्रोटेस्टेंट धर्मसूची की पुस्तकें, और एस्तेर तथा दानिय्येल अपने लंबे रूपों में। स्रोत फ़ाइलों में तोबीत, यूदीत, प्रज्ञा, सिराख, बारूक और मक्काबियों की दोनों पुस्तकें भी हैं, जो सब नीचे की वुल्गाता में मौजूद हैं; उनमें से कोई भी नहीं पहुँची, इसलिए जहाँ वुल्गाता में तोबीत है, वहाँ उसके ऊपर कुछ नहीं है। मनश्शे की प्रार्थना और 3 तथा 4 एज्रा, जिन्हें क्लेमेंटीन संस्करण ने परिशिष्ट में छापा था, न स्रोत में हैं न संग्रह में। संग्रह में कुछ भी अपनी बारी में इस संस्करण पर नहीं टिका है।

