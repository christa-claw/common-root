title=Biblia 1776 — About This Edition | Common Root
description=Biblia 1776: the Finnish church Bible for a century and a half, the first printed for reading at home, and the book Finnish still means when it says “Biblia”.
heroHeading=Biblia 1776
readerHref=/reader?c1.src=fb1776
thanks=With thanks to those who sent corrections to this page.

# The narrative, one paragraph per key, in order.
hero.1=Finland's third Bible, and the one that settled. It is a revision rather than a fresh translation — the line runs back through Florinus's revision of 1683–85 to the Biblia of 1642, the first complete Finnish Bible. The reviser was Anders (Antti) Lizelius, who had already edited a Bible of his own in 1758. What the 1776 edition changed was the spelling, and with it the reach: it was the first Finnish Bible set in a modernised orthography, and the first printed for domestic use rather than only for the lectern. A Bible a family can own is a different object from a Bible a parish owns. The editions in between were not merely spelling. Henrik Florinus, provost of Paimio, who prepared the 1685, knew Hebrew and Greek and corrected the substance as much as the language — the wording moved further than the orthography did — and the intervening editions are held to have done translation work from the original languages rather than only tidying 1642. A reader comparing 1642 with 1776 is looking across two revisions, not across a change of spelling.
hero.2=It held the church's use for a century and a half, until Kirkkoraamattu 1933/38 replaced it, and it did not stop being read when it stopped being official. Two revival movements inside the Evangelical Lutheran Church of Finland — the Laestadians and the rukoilevaiset, the “Beseechers” — kept it, and use it still. That is why the bare word Biblia in Finnish points here rather than to any older or newer edition, and why the book is also called Vanha kirkkoraamattu, the Old Church Bible.
hero.3=In this reader it is the middle of the Finnish chain. Open one rung beneath a Kirkkoraamattu 1933/38 verse and this edition appears; open one beneath this and the Biblia of 1642 does. The two rungs should be read differently, though. The 1933/38 translators worked from Hebrew and Greek, so the rung above is succession within one church's Bible rather than derivation. The rung below is the real thing: 1776 is a revision of 1642, and the words on either side of that step are meant to be compared.
hero.4=One caution about the text on this site: it is not the 1776 printing. What is here descends from a public-domain digital text whose spelling has been normalised by a later hand and whose editorial history is not recorded — of its 31,102 verses exactly one contains the letter w, where the 1642 Biblia has 26,862, and w for v is the plainest mark of the orthography 1776 was printed in. So 1776 modernised the spelling of 1642, and this text has been modernised again since, which leaves it further from the printed book than 1776 was from 1642. Two scholars of Old Literary Finnish asked which version this was before they asked anything else, and the question was the right one. The 1776 printing itself survives as page images in the National Library of Finland's Swedish-era collection; putting a faithful text in its place is work we would like to do.

