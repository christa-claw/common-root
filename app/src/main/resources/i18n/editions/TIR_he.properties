title=ג'אמע אלתרמד'י — על מהדורה זו | Common Root
description=ג'אמע אלתרמד'י: אוסף החדית׳ שאבו עיסא אלתרמד'י בנה סביב דירוג גלוי של עוצמת כל מסורת ותיעוד הטיעונים ההלכתיים שפוסקים הסיקו ממנו — נמנה עם ששת הספרים של האסלאם הסוני.
heroHeading=ג'אמע אלתרמד'י
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=אבו עיסא מוחמד בן עיסא אלתרמד'י נולד בסביבות שנת 209 להג'רה (824 לספירה) סמוך לטרמד', בחוראסאן, במה שהיום הוא הגבול בין אוזבקיסטן לאפגניסטן. הוא התחיל ללמוד חדית׳ בסביבות גיל עשרים, ומשנת 235 להג'רה נסע בחוראסאן, עיראק והחיג'אז בחיפוש אחריו, ולמד בעיקר אצל מוחמד אל-בוכ'ארי — מורו העיקרי — וכן אצל מוסלם בן אל-חג'אג', אבו דאווד אל-סיג'סתאני, קֻתַיְבַּה בן סעיד ועלי בן חג'ר. בשנותיו האחרונות התעוור, ומכאן שמו הנוסף "אלצ'רִיר" ("העיוור"). הוא חזר לאזור טרמד', שם מת ב-13 ברג'ב בשנת 279 להג'רה (9 באוקטובר 892 לספירה) בגיל כשבעים.
hero.2=שמו המלא, אל-ג'אמע אלמכ'תסר מן אלסֻּנן ען רסול אללה ומערפת אלצחיח ואלמעלול ומא עליה אלעמל, מקוצר בדרך כלל לג'אמע אלתרמד'י או סונן אלתרמד'י. בשונה מצחיח אל-בוכ'ארי וצחיח מוסלם, המקבלים רק חדית׳ שמחבריהם ראו בו מהימן באופן מלא, אלתרמד'י דירג כל חדית׳ בגלוי בתוך הטקסט עצמו — צחיח, חסן, צ'עיף או ע'ריב — והסביר את הנימוקים לדירוג חלש יותר במקום להשמיט את החדית׳; הוא גם ציין היכן נחלקו בתי המדרש ההלכתיים (מד'אהב) ואילו ראיות הביאה כל צד, מה שהופך את הספר למדריך לחשיבה הלכתית מבוססת-חדית׳ בדיוק כמו שהוא אוסף חדית׳ בפני עצמו.
hero.3=המסורת הסונית מונה אותו עם ששת הספרים, בדרך כלל אחרי צחיח אל-בוכ'ארי, צחיח מוסלם וסונן אבו דאווד; היכן בדיוק הוא ממוקם בין הספרים הנותרים — ואיזה אוסף תופס את המקום השישי, כאשר סונן אבן מאג'ה הוא התשובה המקובלת אך לא היחידה שהוצעה היסטורית — נדון זה זמן רב מבלי שהוכרע, כמו בשאר אוספי הסונן של האוסף הזה. מספר החדית׳ הנתון לספר משתנה מאותה סיבה: כ-4,330 לפי הספירה המקובלת, מצוטט במקומות אחרים כ-4,400; גם מבנהו מתואר בדרכים שונות — כ-46 ספרים, כ-49 פרקים במהדורת קהיר של אחמד מוחמד שאכר, או כחמישים פרקים. המספר העצמי של האוסף הזה הוא מספר נוסף ושונה: 49 ספרים ו-3,998 חדית׳ ממוספרים, צורתה של המהדורה הדיגיטלית שממנה נלקח, ולא טענה לשחזור מסורת דפוס מסוימת כלשהי.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-tirmidhi של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור צחיח אל-בוכ'ארי, צחיח מוסלם, סונן אבו דאווד ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

