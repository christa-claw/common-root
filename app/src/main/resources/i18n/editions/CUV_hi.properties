title=चीनी संयुक्त अनुवाद — इस संस्करण के बारे में | Common Root
description=1919 का चीनी संयुक्त अनुवाद: उनतीस वर्षों के समिति-कार्य से निकली वह बाइबिल जिसे चीनी प्रोटेस्टेंट आज भी पढ़ते हैं, और लिखित बोलचाल की मंदारिन में प्रकाशित होने वाली पहली पुस्तकों में से एक।
heroHeading=चीनी संयुक्त अनुवाद
readerHref=/reader?c1.src=cuv

# The narrative, one paragraph per key, in order.
hero.1=1890 में चीन में काम कर रहे प्रोटेस्टेंट मिशन शंघाई में एकत्र हुए और एक समस्या स्वीकार की। चीनी भाषा की कई बाइबिलें पहले से मौजूद थीं, और उनमें कोई दो आपस में सहमत न थीं — न शब्दावली पर, न नामों की वर्तनी पर, और न इस पर कि चीनी के किस स्तर में लिखा जाए। सम्मेलन ने एक ही अनुवाद का निश्चय किया जिसे हर मिशन काम में लाए, और उसे संयुक्त अनुवाद नाम दिया: 和合本, अर्थात् मेल बिठाया हुआ पाठ। चूँकि उस समय लिखित चीनी शिक्षितों की साहित्यिक भाषा और शेष सबकी बोलचाल की भाषा में बँटी हुई थी, इसलिए एक साथ तीन अनुवाद कराए गए — दो साहित्यिक चीनी में, एक मंदारिन में।
hero.2=मंदारिन समिति को उनतीस वर्ष लगे। उसकी अध्यक्षता कैल्विन विल्सन मेटीयर ने की, जो अमेरिकी प्रेस्बिटेरियन थे और 1863 से शानतुंग में रह रहे थे; 1908 में काम अधूरा छोड़कर उनका देहान्त हो गया, किन्तु आधे दर्जन मिशनों से उनके द्वारा जुटाया गया मण्डल आगे बढ़ता रहा, और उनके साथ काम करने वाले वे चीनी विद्वान भी, जिनके नाम मिशन के अभिलेखों ने कहीं कम सावधानी से सँभाले। उन्होंने अंग्रेज़ी Revised Version को वह पाठ माना जिसे वे उतार रहे थे, और उसे उसके पीछे की इब्रानी तथा यूनानी से मिलाकर देखा — इससे इसी संग्रह की Revised Version इस बाइबिल से एक पायदान ऊपर बैठती है, और King James Version उससे भी एक पायदान ऊपर। दोनों साहित्यिक अनुवाद अन्ततः एक में मिला दिए गए। जो बचा रहा, वह मंदारिन वाला है।
hero.3=यह 1919 में प्रकाशित हुई, और इस तिथि ने इसके लिए वह किया जो कोई समिति न कर पाती। वही चार मई आन्दोलन का वर्ष था, जब चीनी लेखक सचमुच साहित्यिक भाषा छोड़कर बोलचाल की भाषा अपनाने लगे, और संयुक्त अनुवाद उन पहली बड़ी पुस्तकों में से एक बनकर आया जो पहले से ही उसी भाषा में लिखी थीं। मिशनरियों का आपसी झगड़ा निपटाने के लिए बना अनुवाद आधुनिक चीनी गद्य का मील का पत्थर बन गया, और उसके वाक्यांश वे लोग उद्धृत करते हैं जिन्होंने कभी बाइबिल खोली तक नहीं। तब से यह दो संस्करणों में छपती आई है जिनमें केवल एक शब्द का अन्तर है — ईश्वर 神 है या 上帝 — और अवकाश ऐसा साधा गया है कि दोनों संस्करण आज भी पृष्ठ एक ही स्थान पर तोड़ते हैं।
hero.4=इस पाठक में यह एकमात्र चीनी बाइबिल है, और इससे इसके व्यवहार की दो बातें तय होती हैं। अन्तरफलक को चीनी पर रखिए और यही खुलती है — इसलिए नहीं कि इसे चुना गया, जैसे स्पेनिश के लिए Reina-Valera 1909 चुनी गई है, बल्कि इसलिए कि सूची को उस भाषा में दूसरी कोई बाइबिल नहीं मिलती। और वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं, इसलिए किसी पद के नीचे का पायदान सीधे ≈ से चिह्नित मूल-भाषा तल पर उतरता है, यद्यपि जिस Revised Version से यह बनी है वह संग्रह में एक ही स्तम्भ की दूरी पर खड़ी है। इसका पायदान चिह्न वर्ष अवश्य रखता है, 1919, जो यहाँ हर संस्करण नहीं रखता।

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=भाषा
fact.1.value=चीनी — बोलचाल की मंदारिन (官話 / baihua), साहित्यिक चीनी नहीं
fact.2.label=अपनी भाषा में नाम
fact.2.value=和合本 (héhéběn) — “मेल बिठाया हुआ” अथवा “संयुक्त” अनुवाद
fact.3.label=किसके कहने पर
fact.3.value=1890 का शंघाई प्रोटेस्टेंट मिशनरी महासम्मेलन
fact.4.label=अनुवादक
fact.4.value=कई प्रोटेस्टेंट मिशनों से जुटाई गई एक समिति; अमेरिकी प्रेस्बिटेरियन कैल्विन विल्सन मेटीयर (1836–1908) मृत्युपर्यन्त मंदारिन मण्डल के अध्यक्ष रहे और आरम्भ से अन्त तक चीनी सहयोगियों के साथ काम करते रहे
fact.5.label=प्रकाशन
fact.5.value=1919, उनतीस वर्षों के कार्य के पश्चात्
fact.6.label=पाठ का आधार
fact.6.value=कार्याधार के रूप में अंग्रेज़ी Revised Version, इब्रानी तथा यूनानी से मिलाकर देखी गई — वही [[RV|संशोधित संस्करण]] जो इस संग्रह में है
fact.7.label=दो संस्करण
fact.7.value=शेन संस्करण (神版) और शांगदी संस्करण (上帝版), जिनमें अन्तर केवल इतना है कि “ईश्वर” कौन-सा चीनी शब्द वहन करता है
fact.8.label=बाद का संशोधन
fact.8.value=संशोधित चीनी संयुक्त अनुवाद, नया नियम 2006 और सम्पूर्ण बाइबिल 2010 — यह पाठ नहीं
fact.9.label=इस संग्रह में
fact.9.value=यहाँ की एकमात्र चीनी बाइबिल, अतः चीनी अन्तरफलक पूर्वनिर्धारित रूप से इसी पर खुलता है; वंश-पायदानों में कोई मूल अभिलिखित नहीं, फिर भी इसका पायदान चिह्न 1919 वर्ष रखता है
