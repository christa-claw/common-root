title=Textus Receptus — Über diese Ausgabe | Common Root
description=Der Textus Receptus: das gedruckte griechische Neue Testament hinter Luther, Tyndale und der King-James-Bibel, 1516 erstmals von Erasmus herausgegeben und nach einer Werbezeile von 1633 benannt.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Jede Reformationsbibel dieser Sammlung geht auf ein Buch zurück, das 1516 in Basel gedruckt wurde. Erasmus von Rotterdam wollte das griechische Neue Testament vor allen anderen in den Druck bringen, und er arbeitete schnell — aus der Handvoll später Handschriften, die er in Basel erreichen konnte, keine davon besonders alt. Wo seinem Exemplar der Offenbarung das letzte Blatt fehlte, übersetzte er die letzten sechs Verse aus der lateinischen Vulgata ins Griechische zurück. Diese Verse kamen in den Druck und blieben dort vier Jahrhunderte lang.
hero.2=Der Text wurde hundert Jahre lang weiter korrigiert und neu aufgelegt — von Erasmus selbst, dann von Robert Estienne in Paris und Theodor Beza in Genf. Estiennes vierte Ausgabe von 1551 tat etwas, dessen Folgen weit über die Gelehrsamkeit hinausreichen: Sie zerlegte den Text in nummerierte Verse. Das sind die Versnummern, die noch heute in fast jeder Bibel der Welt stehen — und die, die dieser Leser abschalten lässt.
hero.3=Der Name kam zuletzt, und er kam aus der Werbung. 1633 warben die Brüder Elzevir in Leiden für ihre Ausgabe mit der Zeile, der Leser habe nun „den von allen angenommenen Text“ — textus receptus. Das war die Behauptung eines Buchhändlers, kein wissenschaftliches Urteil, aber sie blieb haften. Als im 19. Jahrhundert ältere Handschriften auftauchten, bauten Herausgeber von Tischendorf bis Westcott und Hort neue Texte darauf, und moderne Übersetzungen folgen diesen. Der Textus Receptus steht hier aus dem Grund, der ihn wichtig macht: Er ist das, was Luther, Tyndale, die Genfer Übersetzer und die King-James-Kommissionen tatsächlich vor sich hatten — also der Text, gegen den ihre Formulierungen gelesen werden müssen.

