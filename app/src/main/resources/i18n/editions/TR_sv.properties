title=Textus Receptus — Om denna utgåva | Common Root
description=Textus Receptus: det tryckta grekiska Nya testamentet bakom Luther, Tyndale och King James Version, först utgivet av Erasmus 1516 och uppkallat efter en bokhändlares reklamrad från 1633.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Varje reformationsbibel i den här samlingen härstammar från en bok tryckt i Basel 1516. Erasmus av Rotterdam ville få det grekiska Nya testamentet i tryck före någon annan, och han arbetade snabbt — utifrån den handfull sena handskrifter han kunde nå i Basel, ingen av dem särskilt gammal. Där hans exemplar av Uppenbarelseboken saknade sitt sista blad översatte han de sex sista verserna tillbaka till grekiska ur den latinska Vulgatan. De verserna kom i tryck och blev kvar där i fyra århundraden.
hero.2=Texten rättades och gavs ut på nytt under hundra år därefter — av Erasmus själv, sedan av Robert Estienne i Paris och Theodore Beza i Genève. Estiennes fjärde utgåva, från 1551, gjorde något vars följder sträcker sig långt bortom lärdomen: den delade in texten i numrerade verser. Det är de versnummer som fortfarande trycks i nästan varje bibel i världen, och de som den här läsaren låter dig stänga av.
hero.3=Namnet kom sist, och det kom från marknadsföring. År 1633 gjorde bröderna Elzevir i Leiden reklam för sin utgåva med raden att läsaren nu hade “den text som alla tagit emot” — textus receptus. Det var en bokhändlares påstående, inte en vetenskaplig dom, men det fastnade. När äldre handskrifter kom fram under 1800-talet byggde utgivare från Tischendorf till Westcott och Hort nya texter på dem, och moderna översättningar följer dessa i stället. Textus Receptus finns kvar här av det skäl som gör den viktig: det är vad Luther, Tyndale, Genèveöversättarna och King James-kommittéerna faktiskt hade framför sig, så det är texten deras ordval måste läsas mot.

