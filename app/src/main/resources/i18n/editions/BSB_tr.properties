title=Berean Standard Bible — Bu Baskı Hakkında | Common Root
description=Berean Standard Bible: Bible Hub ve Discovery Bible ekiplerinin masoretik İbranice metinden ve kendi hazırladıkları Yunanca Yeni Antlaşma'dan yaptığı çağdaş İngilizce çeviri — sonra da kamuya bağışlandı.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible bu derlemedeki en yeni çevirilerden biri, kendi işleyişi konusunda da en açık olanlarından biridir. Bible Hub ve Discovery Bible'ın arkasındaki ekipler, bir danışma kurulunun gözetiminde hazırladı; ilkin başka bir adla, Berean Study Bible adıyla çıktı. Bu sürekli bir karışıklığa yol açtı, çünkü study Bible genellikle şerh ve notlarla doldurulmuş bir Kutsal Kitap demektir, bu ise öyle değildir. Çeviri yeniden adlandırıldı; kısaltma olduğu gibi kaldı.
hero.2=Çevirilerin çoğu, başkasının hazırladığı bir Yunanca Yeni Antlaşma'dan yola çıkar. Bu proje önce kendi metnini kurdu. Berean Greek Bible temel olarak Nestle 1904'ü alır — hazırlayanların dediğine göre, hâlihazırda kamuya açık olan en doğru eleştirel metin olduğu için — ve onu Nestle–Aland, SBL Yunanca Yeni Antlaşma, Tischendorf, Westcott–Hort, Bizans metni ve Textus Receptus ile karşılaştırıp ayrıldıkları yerleri dipnota düşer. İngilizce ondan çevrildi. Eski Antlaşma masoretik İbraniceden gelir; Ölü Deniz Yazmaları, Septuaginta ve başka erken tanıklar bir okuyuşu ilgilendirdikleri yerde göz önünde tutulmuştur. Aynı çalışma sonra katman katman yayımlandı: kelimesi kelimesine bir satır arası metin, sertçe harfi bir baskı ve okunabilir olan bu — böylece okur çevirmenlerin sözüne güvenmek yerine Yunancadan İngilizceye adım adım yürüyebilir. Bu, Berean'ı aynı zamanda bu derlemenin görünür kıldığı bir ayrımın öbür yanına koyar: Cenevre Kutsal Kitabı ile King James Version burada Textus Receptus'tan iner, bu ise inmez.
hero.3=Projenin metinle yaptığı son iş, onu bağışlamak oldu. Berean metinleri Nisan 2023'te kamu malı ilan edildi; Kutsal Kitap'ın tamamının bu derlemede durabilmesi ve buradan geri kopyalanabilmesi bundandır. Okuyucunun arayüzü İngilizceye alındığında açılan, burada lisansla bulunan New International Version'dır; Berean ise onun yanındaki, herkesin alıntılayabileceği, basabileceği ve dağıtabileceği çağdaş İngilizcedir. Soy basamaklarında Biblia en Español Sencillo gibi davranır. Ona bir kaynak metin kaydedilmemiştir, çünkü derlemedeki herhangi bir metnin gözden geçirilmişi değil, yeni bir çeviridir; bu yüzden bir Berean ayetinin altından açılan basamak, daha eski bir İngilizce Kutsal Kitap'a değil, doğrudan ≈ ile işaretli özgün diller tabanına iner. Katalog yılını da boş bırakır. Bu bir ihmal değildir: metin, düzeltmeler geldikçe gözden geçirilmeye devam ediyor ve buradaki yıllar tahmin değil, seçilmiş yıllardır; tek bir tarihli baskısı olmayan bir baskı da yıl almaz.

