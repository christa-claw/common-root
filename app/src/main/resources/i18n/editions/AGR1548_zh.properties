title=Agricola 1548 — 关于此版本 | Common Root
description=米卡埃尔·阿格里科拉的芬兰语译本：1548 年的新约、1551 年的诗篇和众先知书——最早付印的芬兰语圣经文本，也是芬兰书面语的开端。
heroHeading=Agricola 1548
readerHref=/reader?c1.src=agr1548
thanks=感谢为本页寄来订正的各位。

# The narrative, one paragraph per key, in order.
hero.1=这是现存最古老的芬兰语印刷文字。1548 年米卡埃尔·阿格里科拉出版 Se Wsi Testamenti 时，芬兰语几乎从未被排成铅字——他自己几年前的识字课本，就是史上第一本芬兰语书。两者之间还有 1544 年的祈祷书，篇幅可观，其中已收有诗篇的译文。要想印行圣经，他必须先决定这门语言该怎样书写，而那些决定——正字法、借词、语句的节奏——正是芬兰书面语的开端。新约耗去他和图尔库同侪十余年；诗篇于 1551 年问世，先知书与摩西五经的选段则在 1551 和 1552 年相继刊行。 不过，他的芬兰语是最早付印的芬兰语，而非最早写下的：四份手稿——Codex Westh、乌普萨拉抄本 B 28、康加萨拉弥撒书与乌普萨拉残卷——载有芬兰语圣经段落；考科·皮里宁于1988年将它们与瑞典语底本比对后指出，其中一部分比阿格里科拉所印的任何文字都早，或许在1530年代便已写就。
hero.2=他从未译完整本圣经，本阅读器也不假装他译完了。新约与 150 篇诗篇是完整的；先知书与摩西五经以选段收录。他在别处译出的文字也在此：1544 年的祈祷书，以及 1549 年的 Käsikirja 与 Messu，都载有自己的圣经文本——其中就有以「Genesist mutomat Lughut」为题印行的创世记诸章——共 685 节取自这些书。它们只在圣经卷册于该处没有经文时才被采用，且只取连续成段的文字，而不取夹在祷文中的孤立引句。于是创世记终究在此，虽只是一部分：第 1–4、22、28 与 32 章。士师记、路得记、历代志上与以斯帖记则完全阙如。完整的芬兰语旧约，仍要等到链条上一级、1642 年的 Biblia。
hero.3=在本阅读器中，阿格里科拉是芬兰语链条最古老的一级。在 Biblia 1642 的经文下展开一级，他的译文便与路德的德文并排出现——那正是 1642 年委员会案头真正摊开的两个源头。而在阿格里科拉自己之下，链条便永远离开了芬兰语：他依据伊拉斯谟的希腊文与其并排刊印的拉丁文、路德的德文以及武加大译本从事翻译。其中三者在此被记为他的上源；伊拉斯谟的拉丁文，以及他同样参考过的1541 年古斯塔夫·瓦萨的瑞典语全本圣经，都不在本语料库中。文本取自 Kotus 的 VKS 语料库，保留 1548 年原版的拼写："Algusa oli Sana / Ja se Sana oli Jumalan tykene"。 瑞典语圣经自1526年瑞典语新约问世起便已付印，因此他自始便有瑞典语译本可参。

