title=السبعينية الإنجليزية لبرنتون — عن هذه الطبعة | Common Root
description=ترجمة السير لانسلوت برنتون الإنجليزية للعهد القديم اليوناني، صدرت أول مرة في لندن عام 1844 وأُعيد نشرها مع الأسفار المنحولة عام 1851 — وظلت أكثر من قرن هي السبعينية الإنجليزية، وهي في هذا القارئ الدرجة التي فوق النص اليوناني الذي تُرجمت عنه.
heroHeading=السبعينية الإنجليزية لبرنتون
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=كان لانسلوت تشارلز لي برنتون (1807–1862) ابنًا لأميرال في البحرية الملكية، السير جاهليل برنتون، ورُسم كاهنًا في كنيسة إنجلترا عام 1830، بعد عامين من تخرجه في كلية أوريل بأكسفورد. ولم يبقَ فيها طويلًا. ففي أكسفورد كان قد التقى جون نيلسون داربي، وبحلول نهاية 1831 كان قد ترك الكنيسة الرسمية ليؤسس كنيسة صغيرة مستقلة في باث؛ وبحلول 1835 كانت تلك الكنيسة مرتبطة بإخوة بليموث، الحركة التي كان داربي يشكّلها آنذاك. وأناجيل داربي نفسه موجودة أيضًا في هذه المجموعة، بالفرنسية وبالإنجليزية. وفي 1844 ورث برنتون لقب البارونيت عن أبيه، وفي السنة نفسها نشرت دار صموئيل باغستر وأبناؤه في لندن ترجمته للسبعينية. وتوفي في جزيرة وايت عام 1862 بلا عقب، آخر بارونيت في سلالته.
hero.2=لم تكن أول سبعينية إنجليزية — فقد نشر تشارلز تومسون واحدة في فيلادلفيا عام 1808 — لكنها كانت التي بقيت: فأكثر من قرن ونصف، حتى صدور New English Translation of the Septuagint عام 2007، كان القارئ الإنجليزي الذي يريد العهد القديم اليوناني بدل العبري يقرأ برنتون. وقد ترجم أساسًا عن المخطوطة الفاتيكانية، وهي مخطوطة من القرن الرابع محفوظة في مكتبة الفاتيكان. وأغفلت الطبعة الأولى الأسفار المنحولة؛ ثم أضافتها طبعة 1851، ونص 1851 هو الذي تعيده هذه النسخة. ووضعت طبعات باغستر اليونانية الإنجليزية النص اليوناني بجانب الإنجليزي، وذلك النص اليوناني موجود في هذه المجموعة طبعةً مستقلة. ولأن الإنجليزية تتبع اليونانية، فهي تقرأ حيث تقرأ اليونانية: تحتفظ المزامير بالترقيم اليوناني، فالمزمور 22 هنا هو مزمور الراعي، وفي إشعياء 7:14 تترجم عبارة “a virgin shall conceive” الكلمة اليونانية parthenos، لا العبرية ʿalmah.
hero.3=هي في هذا القارئ درجة لها أصل واحد، وبالمعنى الحرفي: فالسبعينية اليونانية التي تحتها هي النص الذي ترجمه برنتون، وقد طبعه ناشره نفسه بجانب إنجليزيته. افتح درجة تحت إحدى آياتها فيظهر النص اليوناني، وتحته مخطوطة لينينغراد قاعًا للغات الأصلية. ولا يقوم عليها بدورها شيء في المجموعة. ونسختنا أضيق من الكتاب. ففيها 37 سفرًا، هي الأسفار الموجودة في القانون العبري أيضًا بأسمائها المعتادة. أما ملفات eBible.org التي أُخذت منها فتحمل أيضًا الأسفار المنحولة — طوبيا ويهوديت والحكمة ويشوع بن سيراخ وباروخ وأربعة أسفار للمكابيين وغيرها — ولا تعطي أستير ودانيال إلا في صيغتيهما اليونانيتين الأطول. ولم يصل شيء من ذلك إلى المجموعة، فلا أستير هنا ولا دانيال، وحيث يكون في اليوناني تحتها طوبيا أو الحكمة لا يكون فوقه نص إنجليزي. ويقف عزرا ونحميا سفرين، حيث هما في اليوناني تحتها سفر واحد. وتحديث إملائي للترجمة نفسها، Updated Brenton لآدم بويد من عام 2020، موجود في المجموعة طبعةً قائمة بذاتها.

