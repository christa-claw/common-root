title=Biblia en Español Sencillo — Über diese Ausgabe | Common Root
description=Die Biblia en Español Sencillo: eine Bibel in einfachem Spanisch, seit 2018 von AudioBiblia.org herausgegeben, ebenso zum Hören wie zum Lesen geschrieben und so lizenziert, dass jeder sie kopieren darf.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Vier Jahrhunderte lang war die protestantische Bibel auf Spanisch faktisch ein einziges Buch in aufeinanderfolgenden Revisionen: Casiodoro de Reinas Übersetzung von 1569, so wie Cipriano de Valera sie 1602 überarbeitete, und die lange Reihe der Reina-Valera-Ausgaben danach. Die Biblia en Español Sencillo gehört nicht dazu. Sie ist eine neue Übersetzung, in heutigem Spanisch und mit Absicht schlicht, herausgegeben von AudioBiblia.org — das Neue Testament samt Psalmen und Sprüchen 2018, das Alte Testament im Oktober 2019 fertig. Die Übersetzung wird Irma Flores zugeschrieben, und ihre Herausgeber beschreiben sie als konservativ und evangelikal.
hero.2=Was sie heraushebt, ist ihre Herkunft. Sie ist die Arbeit eines Hörbibel-Werks, und der Text und eine vollständige Aufnahme Kapitel für Kapitel entstanden miteinander, statt dass eines aus dem anderen abgelesen worden wäre. Das erklärte Ziel war für beide dasselbe: eine Bibel, die leicht zu verstehen ist und die frei und legal kopiert und weitergegeben werden darf. Diese zweite Hälfte ist kein Nebending. Die Übersetzung trägt eine Creative-Commons-Namensnennung-Lizenz, die AudioBiblia.org und Irma Flores nennt, und keine vorbehaltenen Verlagsrechte — deshalb kann der ganze Text in diesem Korpus liegen und Vers für Vers neben alles andere darin gestellt werden.
hero.3=In diesem Leser ist sie eine von vier spanischen Ausgaben. Stellt man die Oberfläche auf Spanisch, öffnet der Leser weiterhin die Reina-Valera 1909; dies ist eine Ausgabe, zu der man wechselt. Auch in den Abstammungssprossen verhält sie sich anders. Weil sie eine frische Übersetzung ist und nicht die Revision von etwas, das dieses Korpus führt, ist für sie keine Vorlage verzeichnet — eine unter einem Vers der Biblia en Español Sencillo geöffnete Sprosse fällt daher geradewegs auf den mit ≈ gekennzeichneten Ursprachenboden und nicht, wie in der englischen Kette, auf eine ältere Ausgabe desselben Buches. Setzt man sie stattdessen in die zweite Spalte gegen die Reina-Valera 1909, so ist der Abstand zwischen den beiden Tonlagen das, was sich anzusehen lohnt.

