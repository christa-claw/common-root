title=ルター聖書1912年 — この版について | Common Root
description=ルター聖書の第二回公式教会改訂版：1910年に完了し1912年に採択された、意図的に慎重な見直しであり、テクストゥス・レセプトゥスに拠る最後のルター本文である。
heroHeading=ルター聖書1912年
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=改訂の改訂である。ドイツの諸教会は1892年、ルター聖書の統一本文——最初の公式教会改訂——について合意していたが、数年のうちにそれは不十分だと言われるようになった。不満は昔ながらのものだった。古語が多すぎること、そして綴りがもはや誰の綴りとも一致しないこと。決め手となったのは後者だった。デューデンによってドイツ帝国には学校で教えられる統一正書法が与えられており、それから外れたルター聖書を教室に持ち込むのは具合が悪かった。1906年、ドイツ福音教会会議は新たな改訂に合意し、それが穏やかで保守的なものであるよう明確に求めた。神学者からなる委員会が1910年までにすべての書を見直し、1912年に会議はその成果を採択した。
hero.2=作業にかかった年月はわずか二年あまりであり、それがどのような種類の改訂であったかを物語っている。誰も新しいルター聖書を、文献学的にせよ何にせよ、作ろうとはしていなかった。後の改訂者フリッツ・チルヒはこれを「教師のような改訂」だと切り捨てたが、その方法についていえばその評は的外れではない——綴りは統一され、あからさまに死語となった語は置き換えられ、それ以外の言い回しはルターのままに残された。この評が見落としているのは、それがいかに長く保たれたかである。その後に続いた部分改訂の数十年を通じて、1912年本文はそこに留まり続け、今なお読まれ、売られている。その一因は1912年の記念聖書、ヴュルテンベルク聖書協会による解説注釈付きの記念版であり、今世紀に入ってもフラクトゥールで再版され続けている。もう一つの一因は著作権が失効していることであり、そのため本文の複製には費用がかからず、ここを含めあらゆる場所に現れる。
hero.3=何よりもこれを保守的な読者のあいだで使わせ続けている一点がある。それはテクストゥス・レセプトゥス、すなわち十六・十七世紀のギリシャ語新約聖書に拠る最後のルター改訂だということである。これ以後のものはすべて校訂本文に移った。そのため、この版は梯子の中で珍しく素性の明確な段になっている。その下にあるギリシャ語は、ルター自身の1545年訳、そしてジュネーヴ聖書とキング・ジェイムズ・バージョンの下にあるのと同じギリシャ語であり、塔全体が途中で土台を入れ替えることなく一つの床を共有しているからである。
hero.4=系譜の段において、この版はルター聖書1545年の直上に位置し、記録された母本はそれ一つだけである。1912年版の節の下で一段開けば、ルター自身の1545年の言い回しがその下に現れる。もう一段開けば、梯子はギリシャ語についてテクストゥス・レセプトゥスへ、ヘブライ語についてウェストミンスター・レニングラード写本へと至る。三百六十七年にわたる改訂が、節ごとに、二回のクリックで辿れる。この版がそうではないもの——それはドイツ語インターフェースが開く聖書である。ドイツ語には選び抜かれた既定がなく、リーダーはカタログの中で最初のドイツ語聖書を採用しており、それがエルバーフェルダー聖書である。

