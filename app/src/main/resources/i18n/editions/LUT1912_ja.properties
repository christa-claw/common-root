fact.1.label=言語
fact.1.value=ドイツ語
fact.2.label=これは何か
fact.2.value=ルター聖書の第二回公式教会改訂版
fact.3.label=決議
fact.3.value=1906年、ドイツ福音教会会議により。穏やかで保守的な改訂を明確に求めた
fact.4.label=改訂者
fact.4.value=神学専門家からなる委員会。1910年までにすべての聖書の書を見直した
fact.5.label=採択
fact.5.value=1912年、副題「デューデン福音教会委員会の承認を得た本文に基づき新たに校閲」のもとで
fact.6.label=改訂元
fact.6.value=1892年の第一回公式教会改訂、その背後には[[LUT1545|ルターの1545年最終稿]]
fact.7.label=変更点
fact.7.value=綴りがデューデンに合わせられ、明らかに古びた語が置き換えられた。それ以外の言い回しはルターのままに残された
fact.8.label=新約の底本
fact.8.value=[[TR|テクストゥス・レセプトゥス]]——これに拠る最後のルター改訂であり、以後のものはすべて校訂ギリシャ語本文に移った
fact.9.label=旧約の底本
fact.9.value=マソラ本文のヘブライ語
fact.10.label=規模
fact.10.value=66巻、31,171節——このデジタル化には外典を含まない
fact.11.label=ライセンス
fact.11.value=パブリックドメイン
fact.12.label=このコーパスでは
fact.12.value=ドイツ語の梯子の最上段——記録された母本は一つ、[[LUT1545|ルター聖書1545年]]、その下は原語の底面である。翻訳者による85の脚注はここでは削除されずに注釈として保持されており、版ごとに固定されている——1912年の注は1912年の列にのみ表示され、他には表示されない。これはドイツ語インターフェースが開く聖書ではない——それは[[ELB|エルバーフェルダー聖書]]であり、略号順でカタログの最初に来るという、ただそれだけの理由による
fact.13.label=音声
fact.13.value=聖書全体——新旧両約のすべての章——が、マイクロソフト・アジュール（Microsoft Azure）のニューラル音声de-DE-ChristophNeuralによって読み上げられている。節ごとではなく章ごとに合成されており、散文が自然な文のリズムを保っている。
fact.14.label=音声の制限
fact.14.value=この音声は機械によって生成されたものであり、人間による朗読ではないため、人名や専門用語の発音は編集者による確認を受けていない。読み上げ行が各節に追随して強調表示されるのは「節区分」表示モードのみであり、それ以外のモードでも音声は再生されるが、強調表示はされない。
