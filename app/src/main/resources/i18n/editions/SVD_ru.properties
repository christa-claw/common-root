title=Смит и Ван Дейк — Об этом издании | Common Root
description=Арабская Библия Смита и Ван Дейка: начата Илаем Смитом в Бейруте, завершена Корнелиусом Ван Дейком в 1865 году вместе с учёными Нахды Бутрусом аль-Бустани, Насифом аль-Языджи и Юсуфом аль-Асиром; и поныне самая читаемая арабская Библия.
heroHeading=Смит и Ван Дейк
readerHref=/reader?c1.src=svd

# The narrative, one paragraph per key, in order.
hero.1=Американская миссия в Бейруте взялась за этот перевод около 1847 года, и тот, кто его начал, его не закончил. Илай Смит провёл в Леванте два десятилетия и знал язык достаточно, чтобы о нём спорить; он работал над текстом до самой смерти, в 1857 году. Корнелиус Ван Ален Ван Дейк принял дело и довёл его до конца: Новый Завет был готов в 1860 году, Ветхий — пятью годами позже, в 1865-м. Два имени на книге суть две половины одной работы.
hero.2=Имена, которых нет на корешке, весят не меньше. Свой арабский Ван Дейк получил от Бутруса аль-Бустани и Насифа аль-Языджи, и оба работали с ним над переводом, как работал и шейх Юсуф аль-Асир, прошедший арабский на предмет оборота и слога. Эти трое не были подручными миссионерского предприятия. Они принадлежали к главным фигурам Нахды, арабского литературного возрождения, и вышедшее читается как арабская проза, а не как перевод, переодетый в арабское платье. Оттого книга и пережила миссию, её оплатившую.
hero.3=Это был подвиг типографского дела не меньше, чем учёности. Бейрутская American Press набрала её арабским шрифтом, резанным для миссии и доведённым до конца в 1843 году, — той гарнитурой, что доныне зовётся аль-Американи и к облику которой приложил руку Смит. Арабский трудно набрать хорошо: буквы связываются и, связываясь, меняют очертания, — и Библия, которая на странице выглядела как надо, сделала для своего приёма больше, чем сделал бы довод. С тех пор вышли миллионы экземпляров, к читателям и протестантским, и коптским, и для большинства арабоязычных христиан Библия звучит попросту так.
hero.4=В этой читалке это единственная арабская Библия, и этим решается её поведение. Если поставить интерфейс на арабский, откроется именно она — не потому, что её выбрали, как выбрали Рейну-Валеру 1909 года для испанского, а потому, что каталог ищет Библию на языке интерфейса и находит ровно одну. Она же одно из всего двух здешних изданий, чей текст идёт справа налево; другое — современная еврейская Библия. В ступенях родословия основы для неё не записано, так что ступень, открытая под стихом, падает прямо на помеченный знаком ≈ пол языков оригинала — и здесь это ближе к истине, чем обыкновенно, ибо греческий, который этот пол подаёт, есть Textus Receptus, а из Textus Receptus её Новый Завет и сделан.

