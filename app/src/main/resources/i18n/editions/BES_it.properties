title=Biblia en Español Sencillo — Su questa edizione | Common Root
description=La Biblia en Español Sencillo: una Bibbia in spagnolo piano pubblicata da AudioBiblia.org dal 2018, scritta tanto per essere ascoltata quanto per essere letta e licenziata perché chiunque possa copiarla.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Per quattro secoli la Bibbia protestante in spagnolo è stata, di fatto, un unico libro in revisioni successive: la traduzione di Casiodoro de Reina del 1569, quale Cipriano de Valera la rivide nel 1602, e la lunga serie di edizioni Reina-Valera che ne seguì. La Biblia en Español Sencillo non è una di quelle. È una traduzione nuova, fatta in spagnolo odierno e volutamente piana, pubblicata da AudioBiblia.org: il Nuovo Testamento insieme ai Salmi e ai Proverbi nel 2018, l'Antico Testamento concluso nell'ottobre 2019. La traduzione è attribuita a Irma Flores, e i suoi editori la descrivono come conservatrice ed evangelica.
hero.2=A distinguerla è la sua provenienza. È opera di un'attività di Bibbia audio, e il testo e una registrazione completa capitolo per capitolo sono stati prodotti insieme, non l'uno letto dall'altro. Lo scopo dichiarato era lo stesso per entrambi: una Bibbia facile da capire, e che si possa copiare e diffondere liberamente e legalmente. Quella seconda metà non è un dettaglio. La traduzione porta una licenza Creative Commons Attribuzione, che accredita AudioBiblia.org e Irma Flores, e non i diritti riservati di un editore — ed è per questo che il testo intero può stare in questo corpus ed essere messo versetto per versetto accanto a qualunque altro vi si trovi.
hero.3=In questo lettore è una delle quattro edizioni spagnole. Se si mette l'interfaccia in spagnolo, il lettore apre ancora la Reina-Valera 1909; questa è un'edizione a cui si passa. Anche nei pioli della discendenza si comporta diversamente. Essendo una traduzione nuova e non la revisione di qualcosa che il corpus contenga, non le è registrato alcun testo base — sicché un piolo aperto sotto un versetto della Biblia en Español Sencillo cade diritto sul pavimento delle lingue originali contrassegnato con ≈ e non, come nella catena inglese, su un'edizione più antica dello stesso libro. Mettetela piuttosto nella seconda colonna di fronte alla Reina-Valera 1909: quel che vale la pena guardare è la distanza fra i due registri.

