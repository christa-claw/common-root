title=Riveduta 1927 (italien) — À propos de cette édition | Common Root
description=La Riveduta : la bible italienne de Giovanni Diodati révisée sur l'hébreu et le grec par un comité dirigé par le théologien vaudois Giovanni Luzzi, publiée à Rome en 1924 par la Société biblique britannique et étrangère — et pourquoi le fichier dit 1927.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi est né en 1856 en Basse-Engadine, dans le canton suisse des Grisons, et fut emmené nourrisson à Lucques lorsque sa famille y émigra l'année suivante. Il grandit italien, étudia à la Faculté vaudoise de théologie de Florence — l'école de la vieille Église protestante d'Italie — puis y enseigna la théologie et fut pasteur dans la ville. Il passa ses dernières années de nouveau en Suisse, à Poschiavo, et y mourut en 1948.
hero.2=La Riveduta commença en 1906, lorsque la Société biblique britannique et étrangère, qui imprimait depuis un siècle pour les lecteurs italiens la traduction de Diodati du XVIIe siècle, chargea un groupe de la réviser, avec Luzzi à sa tête. Il avait espéré en faire une bible commune avec des savants catholiques ; le Vatican refusa, et le travail se poursuivit comme révision protestante. La Bible complète parut à Rome en 1924, décrite sur sa page de titre comme une version révisée sur le texte original — « riveduta », révisée, et c'est ainsi qu'on la nomme depuis. Ce n'est pas une traduction nouvelle : dessous, il y a le texte de Diodati, confronté à nouveau à l'hébreu et au grec. Elle fut la Bible des protestants italiens pendant la plus grande partie du XXe siècle, et son héritière, la Nuova Riveduta, fut publiée par la Société biblique de Genève en 1994. Luzzi fit aussi une traduction personnelle, annotée, en douze volumes parus à Florence à partir de 1921 ; c'est une autre œuvre, et non ce texte.
hero.3=La révision se voit sur la page. Le nom divin dans l'Ancien Testament est « l'Eterno », l'Éternel — « L'Eterno è il mio pastore » au Psaume 23 — là où Diodati a « il Signore ». Ésaïe 7:14 porte « la giovane », la jeune femme, là où Diodati a « la Vergine ». Dans le Nouveau Testament, elle quitte le Textus Receptus là où le quittent les éditions critiques postérieures : 1 Jean 5:7 n'a pas les témoins célestes, le Notre Père de Matthieu 6:13 s'achève sans la doxologie, et Actes 8:37 est conservé mais placé entre crochets. Les Psaumes suivent la numérotation hébraïque, et le titre d'un psaume est fondu dans son premier verset — le Psaume 23 s'ouvre sur « Salmo di Davide. » —, de sorte que le Psaume 51 a 19 versets, comme dans les bibles anglaises. Quant à la date : 1927 est l'année que porte le texte numérique et que stocke le catalogue, si bien que sa pastille d'échelon affiche 1927. La Riveduta elle-même parut en 1924, et quel tirage ultérieur ce fichier reproduit, ce projet ne l'a pas établi.
hero.4=Dans ce lecteur, elle est l'une des trois bibles italiennes, à côté de deux exemplaires de Diodati. Une interface en italien ne s'ouvre pas sur elle : l'italien n'a pas de choix curaté, si bien que le lecteur prend la première bible italienne dans l'ordre du catalogue, qui est Diodati 1649. Aucun ascendant n'est enregistré pour elle dans les échelons de filiation — pas même Diodati, bien que la Riveduta soit une révision de Diodati et que Diodati figure dans le corpus —, de sorte qu'un échelon ouvert sous un verset tombe droit sur le plancher des langues originales marqué de ≈ : le Codex de Léningrad de Westminster pour l'Ancien Testament, et pour le Nouveau le Textus Receptus, c'est-à-dire précisément le grec dont cette révision s'est éloignée.

