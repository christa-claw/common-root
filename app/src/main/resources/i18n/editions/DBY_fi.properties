title=Darby 1885 (ranska) — Tietoja tästä laitoksesta | Common Root
description=Ranskankielinen Darbyn Raamattu vuodelta 1885: Paun ja Veveyn käännös, jonka John Nelson Darby työtovereineen aloitti 1859 ja joka valmistui kolme vuotta hänen kuolemansa jälkeen — ja se laitos, jonka varaan hänen englanninkielinen Vanha testamenttinsa myöhemmin rakennettiin.
heroHeading=Darby 1885 (ranska)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=John Nelson Darby muistetaan muusta — hän erosi Irlannin kirkosta, oli perustamassa Plymouthin veljesliikettä ja pani liikkeelle dispensationalistisen premillennialismin — mutta suuren osan elämästään hän käänsi Raamattua, ja teki sen kolmella kielellä. Erikoista hänessä on järjestys. Useimmat kääntäjät työskentelevät omasta kielestään ulospäin. Darbyn englanninkielinen Raamattu valmistui kolmesta viimeisenä, eikä hän tehnyt sen Vanhaa testamenttia suoraan hepreasta, vaan niistä ranskan- ja saksankielisistä laitoksista, jotka hän oli jo muiden kanssa tehnyt.
hero.2=Tämä on se ranskalainen. Darby oli pääasiallinen oppinut mutta ei koskaan ainoa kääntäjä missään nimeään kantavassa työssä; ranskalaiseen ryhmään kuuluivat William Joseph Lowe ja Pierre Schlumberger. Uusi testamentti ilmestyi 1859 ja otettiin seuraavien kahden vuosikymmenen kuluessa kolmesti uudelleen painoon. Koko Raamattu ilmestyi 1885 Paussa ja Veveyssä — siitä sen tavallinen nimi — vaikka nimiölehti hieman harhauttaa: Pau on Ranskan eteläisimmässä kolkassa, ja työ tehtiin pääosin ranskankielisen Sveitsin veljesseurakunnille. Darby oli kuollut 1882, joten valmista kirjaa hän ei nähnyt.
hero.3=Käännös on periaatteesta kirjaimellinen, ja Darby sanoi syyn suoraan saksankielisen Uuden testamenttinsa esipuheessa: oppineet voivat lukea alkutekstiä, joten käännöksen tehtävä on antaa siitä mahdollisimman tarkka kuva niiden käsiin, jotka eivät voi. Hän varoitti myös, että vapaampi käännöstapa hukkaa merkityksiä, joita kääntäjä itsekään ei ehkä ole huomannut. Tulos on tarkka ja kaunistelematon, eikä sitä ollut tarkoitettu ääneen luettavaksi — omassa saarnaamisessaan Darby käytti King James Versionia.
hero.4=Kaksi asiaa liittää sen muuhun aineistoon. Saksankielinen Darbyn Raamattu on Elberfelder, joka on täällä vuoden 1905 painoksena — sama mies, samat periaatteet, ja toinen niistä kahdesta tekstistä, joista hänen englanninkielinen Vanha testamenttinsa koottiin, joten nämä ranskalainen ja saksalainen kortti ovat läheisempää sukua kuin eri kielensä antaisivat ymmärtää. Ja tapa, jolla se kohtelee Jumalan nimeä, asettaa sen American Standard Versionin rinnalle, joka painaa “Jehovah” tuhansissa kohdissa siellä missä King James Version painaa “the LORD”; Darby teki saman ratkaisun ensin, kolmella kielellä. Lukuohjelmassa se on ainoa ranskankielinen Raamattu, joten ranskankielinen käyttöliittymä avaa sen. Polveutumisaskelmiin ei ole kirjattu sille kantatekstiä, ja toisin kuin useimmilla täällä olevilla vuosiluvun kantavilla laitoksilla, sen askelmamerkinnässä ei lue vuotta lainkaan — luettelokortti näyttää vuoden 1885, mutta askelmavuodet ovat erikseen käsin koottu luettelo, eikä tämä laitos ole siinä.

