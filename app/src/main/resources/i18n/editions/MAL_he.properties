title=מואטא של מאלכ — על מהדורה זו | Common Root
description=מואטא של מאלכ: אוסף ההלכה והחדית׳ של האימאם מאלכ בן אנס ממדינה, הקודם לששת הספרים של האסלאם הסוני בכמאה שנה, ושיש המציעים לעתים כי יתפוס בתוכם את מקומו של סונן אבן מאג'ה.
heroHeading=מואטא של מאלכ
readerHref=/reader?c1.src=mal-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=מאלכ בן אנס בן מאלכ בן אבי עאמר אלאצבחי אלמדני, המוכר בכינוי אבו עבד אללה, נולד בסביבות שנת 93 להג'רה (711 לספירה) במדינה, ומת בה בשנת 179 (795 לספירה); הוא נקבר בבית הקברות אלבקיע. הוא למד אצל חכמים כגון הישאם בן עורוה, אבן שהאב אלזהרי, ג'עפר אלצאדק ונאפע מולא אבן עומר, ולימד במדינה כל חייו, וזכה בתארים כמו אימאם דאר אלהג'רה ("אימאם עיר ההיג'רה") ושיח' אלאסלאם. הוא הפך לאב-הטיפוס של האסכולה המאלכית, אחת מארבע אסכולות ההלכה הגדולות של האסלאם הסוני; תלמידו הבולט ביותר, מחמד בן אדריס אלשאפעי — שהקים לאחר מכן את האסכולה השאפעית — קרא לספרו של מאלכ "האמין ביותר על פני הארץ אחרי הקוראן". נאמר שהח'ליף העבאסי אלמנצור רצה להפוך אותו למקור ההלכה היחיד של האימפריה; מאלכ עצמו סירב.
hero.2=המואטא ("הדרך הדרוכה היטב") חובר, כך מספרת המסורת, במשך כארבעים שנה בתחילת התקופה העבאסית; שמו, כך נאמר, בא מכך שמאלכ הציג את הטקסט לשבעים פוסקים של מדינה, וכולם הסכימו (ואטאעו) עליו. הוא מאחד חדית׳ המיוחסים לנביא עם אמרות הלכתיות של חבריו ושל הדור שאחריהם, יחד עם פסקי מאלכ עצמו — לפי הערכה אחת, החיבור העתיק ביותר השרוד שמאחד חדית׳ והלכה בדרך זו, הקודם לששת הספרים בכמאה שנה. המספרים לגבי גודלו משתנים לפי הנוסח ולפי שיטת הספירה: מספר נפוץ המצוטט לחדית׳ עצמם הוא כ-1,720, בעוד שמאלכ, כך נאמר, בחר כמעט 1,900 מסורות מתוך 100,000 שנאמר שהיו זמינות לו.
hero.3=ידועים לפחות שישה-עשר נוסחים של המואטא. הנוסח שהפך למקור הסטנדרטי, בעיקר לאסכולה המאלכית, הוא זה של יחיא בן יחיא אללית'י; נוסח מתחרה של אחמד בן אבי בכר אלזהרי ארוך ממנו בכחמישה עד עשרה אחוזים. על נוסח אללית'י בלבד יש כמאה פירושים. מכיוון שהוא קודם לששת הספרים של האסלאם הסוני, חכמים מסוימים — המאלכים ואבן אלאת'יר בהם — טוענים כי המואטא, ולא [[IBM|סונן אבן מאג'ה]], הוא זה שצריך להיכלל ברשימה המוסכמת הזו; סונן אבן מאג'ה, כך נהוג לומר, שמר על המקום הזה מפני שתוכנו חופף הכי פחות לחמישה האחרים, לא מפני שהוא נחשב נאמן יותר.
hero.4=הטקסט הערבי כאן הוא המתן הקלאסי, נחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-malik של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אלבוכ'ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג'אמע אלתרמד'י]], [[NAS|סונן אלנסאאי]], [[IBM|סונן אבן מאג'ה]] ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

