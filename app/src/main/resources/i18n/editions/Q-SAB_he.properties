title=קוראן — סבלוקוב — על המהדורה הזאת | Common Root
description=התרגום הרוסי של גורדי סבלוקוב, שפורסם בקאזאן ב-1878 ומתואר בדרך כלל כתרגום הרוסי הראשון של הקוראן שנעשה ישירות מהערבית ולא באמצעות תיווך צרפתי או אנגלי — ובאוסף הזה התרגום הרוסי המלווה המוצג מתחת לטקסט הערבי העות'מאני.
