# The narrative, one paragraph per key, in order.
hero.1=גורדי סמיונוביץ' סבלוקוב (1803-1880) התכשר לכהונה הנוצרית־אורתודוקסית הרוסית, ובסיים את הסמינר התיאולוגי של אורנבורג ב-1826 ואת האקדמיה התיאולוגית של מוסקבה ב-1830. הוא בילה את שני העשורים הבאים, מ-1830 עד 1849, בהוראת היסטוריה ושפות מזרחיות בסמינר התיאולוגי של סראטוב — ובאמצע שנות ה-1840 נמנה בין תלמידיו הסופר הרדיקלי לעתיד ניקולאי צ'רנישבסקי — לפני שעבר ב-1849 למחלקה המיסיונרית של האקדמיה התיאולוגית של קאזאן, שם הורה שפות מזרחיות וקלאסיות עד 1862.
hero.2=תרגומים רוסיים של הקוראן הלכו אחורה עד 1716, אז הפיק פיוטר פוסטניקוב תרגום בפקודת פיוטר הגדול — אך מתוך הצרפתית של אנדרה דו ריֶה, לא מהערבית, כמו גם תרגומו של אלכסיי קולמקוב מ-1792, שנעשה מהאנגלית של ג'ורג' סייל. תרגומו של סבלוקוב, שפורסם בקאזאן ב-1878 בשם "Коран, законодательная книга мохаммеданского вероучения" ("הקוראן, ספר החוק של הדת המוחמדית"), מיוחס בדרך כלל כתרגום הרוסי הראשון של הקוראן שנעשה ישירות מהמקור הערבי, פרי שנותיו בהוראת שפות מזרחיות בקאזאן.
hero.3=בשנה שלאחר מכן הוא הוסיף כרך מלווה של הערות, "Приложения к переводу Корана" (1879), ולאחר מכן שני מחקרים נוספים הקשורים בו: "Сведения о Коране" ("מידע על הקוראן", 1884) וחיבור השוואתי מוקדם יותר על ההוראה הנוצרית והמוסלמית בנוגע לשמות האל (1873). תרגומו נשאר בין הגרסות הרוסיות הנפוצות ביותר מאז, אפילו אחרי שתרגומים מאוחרים יותר — ובהם זה של איגנטי קרצ'קובסקי שפורסם לאחר מותו — הפכו מוכרים יותר בשימוש האקדמי הסובייטי ואחרי־הסובייטי.
hero.4=מה שעבר דיגיטציה כאן, במהדורת ru.sablukov של alquran.cloud, מוצע באוסף הזה כתרגום הרוסי המלווה את [[Q-AR|הטקסט הערבי העות'מאני]], לצד האנגלית של [[Q-EN|פיקת'ול]] (1930) ושל [[Q-YA|יוסוף עלי]] (1934) — שלושת התרגומים שסקירת התרגומים הזמינים מצאה חופשיים לשימוש בבירור, אחד לכל שפה מלבד הערבית.

