title=Diodati 1885 (italiano) — Su questa edizione | Common Root
description=La Bibbia italiana di Giovanni Diodati in una forma ottocentesca: il suo testo del 1641 nella revisione del 1821, in un'edizione datata 1885 — la stessa traduzione dell'altra Diodati di questo corpus, divisa in versetti in altro modo.
heroHeading=Diodati 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=Questa è la traduzione di Giovanni Diodati — il ginevrino di famiglia lucchese, nato nel 1576, che nel 1607 pubblicò la prima Bibbia italiana condotta sull'ebraico e sul greco anziché sul latino, e la rivide con note proprie nel 1641, otto anni prima di morire. L'altra Diodati di questo corpus ha una pagina sua che racconta quella storia. Per due secoli dopo di lui il testo visse di ristampe, e dal 1808 la Società Biblica Britannica e Forestiera lo pubblicò in un'edizione dopo l'altra, perché per i protestanti italiani non c'era altro da stampare.
hero.2=Questo file è una di quelle forme più tarde. eBible.org, che lo fornisce per conto delle Società Bibliche Unite, lo descrive come la traduzione di Diodati del 1641 riveduta nel 1821, in un'edizione datata 1885. Chi abbia fatto la revisione del 1821 e quale tipografia abbia stampato l'edizione del 1885 non è cosa che questo progetto abbia accertato, perciò la pagina non li nomina. La data non è il problema che è per l'altra Diodati, la cui etichetta è l'anno in cui Diodati morì: 1885 è la data propria dell'edizione, il catalogo la registra e il segno di piolo la mostra.
hero.3=Messa accanto all'altra Diodati, la lezione è la stessa in ogni sondaggio: «il Signore è il mio pastore» al Salmo 23, «la Vergine concepirà» in Isaia 7:14, i testimoni celesti in 1 Giovanni 5:7, la dossologia in fondo al Padre nostro, Atti 8:37 per intero. Il nome divino è «il Signore», come lo scrisse Diodati; fu la Riveduta, una revisione di questo testo pubblicata nel 1924, a mutarlo in «l'Eterno». Ciò che differisce è la divisione in versetti. In più di trenta punti questa copia segue un altro schema, vicino a quello ebraico — la preghiera di Giona comincia a 2:1 e il capitolo arriva a 2:11, Isaia 8 ha un 23° versetto, Giobbe 39 prosegue fino al versetto 38, e il primo versetto di Colossesi 4 sta alla fine del capitolo 3 —, così che conta in tutto sette versetti in meno. E questa copia non ha nessuno dei titoli dei salmi: il Salmo 51 si apre direttamente su «Abbi pietà di me, o Dio», dove l'altra Diodati fonde il titolo nel primo versetto. La presentazione di questo testo su eBible.org mostra i titoli, quindi con ogni probabilità sono andati persi nell'importazione di questo progetto e non mancano nella stampa del 1885.
hero.4=In questo lettore è una di tre Bibbie italiane. Un'interfaccia italiana si apre sull'altra Diodati, Diodati 1649, che viene prima nell'ordine del catalogo, dato che l'italiano non ha una scelta curata. Nei pioli della discendenza non è registrato per essa alcun antecedente — nemmeno quell'altra copia della stessa traduzione —, così un piolo aperto sotto un versetto scende diritto al fondo delle lingue originali segnato con ≈. Come per l'altra Diodati, il Textus Receptus lì è vicino al vero: Diodati lavorò sul greco a stampa di Beza, un testo di quella famiglia.

