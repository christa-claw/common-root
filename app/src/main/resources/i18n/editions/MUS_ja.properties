title=サヒーフ・ムスリム — この版について | Common Root
description=サヒーフ・ムスリム——サヒーフ・アル=ブハーリーと共に「サヒーハイン」を成し、スンニ派イスラームがクルアーンに次ぐ権威を認める二つの集成。ムスリム・イブン・アル=ハッジャージュが、アラビア半島、エジプト、イラク、シリアで集めたハディースの中から、信頼できる伝達者による切れ目のない伝達経路を備えたものだけを採録して編んだ。
heroHeading=サヒーフ・ムスリム
readerHref=/reader?c1.src=mus-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=アブー・アル=フサイン・ムスリム・イブン・アル=ハッジャージュ・アル=クシャイリー・アル=ナイサーブーリーは、アッバース朝のホラーサーン州(現在のイラン北東部)のニシャープールに生まれた。生年については諸説あり、ヒジュラ暦202年、204年、206年(西暦おおよそ817〜822年)のいずれかとされる。彼はアラビア半島、エジプト、イラク、シリアを旅して各地の学者からハディースを収集し、その後故郷に戻って定住し、そこでアル=ブハーリーと出会い、彼のもとで学び、生涯の友となった。アル=ハティーブ・アル=バグダーディーによれば、彼は弟子の一人アフマド・イブン・サラマ・アル=ナイサーブーリーの求めに応じてこの書に着手したという。その原題al-Musnad al-Sahih al-Mukhtasarは、アル=ブハーリーの場合と同様、通常サヒーフ・ムスリムと略される。彼はヒジュラ暦261年(西暦875年)にニシャープールで没し、その郊外ナサラーバードに葬られた。
hero.2=彼は、ムハンマドの教友まで切れ目なくつながる伝達経路を持ち、各段階で少なくとも二人の信頼できる伝達者を経ている場合に限ってハディースを採録した。伝達者を記憶力と人格によって三段階に分類し、誠実さが疑われる者は除外した。彼の注釈者アル=ナワウィーは、さらなる配慮を指摘している——ムスリムは、各ハディースをそのすべての伝達経路と字句の異同とともに一か所にまとめて置き、散在させないようにしたという。この提示法は、後の注釈者たちによって、[[BUK|サヒーフ・アル=ブハーリー]]がハディースの異なる字句をそれぞれ別の、その字句が示す論点にあたる章の下に別々に置く方式と対比されてきた。
hero.3=この書物に実際にいくつのハディースが含まれるかは、[[BUK|サヒーフ・アル=ブハーリー]]の場合と同様、誰が数え、繰り返しをどう扱うかによって変わる。カーティブ・チェレビーとシッディーク・ハサン・ハーンはいずれも7,275という数字に達した。ムハンマド・フアード・アブドゥルバーキーは繰り返しを除いて数え、3,033とした。マシュフール・イブン・ハサン・アール・サルマーンは7,385、あるいはムスリム自身の序文にある十件のハディースを含めれば7,395とした。他の推計では、総数はおおよそ5,500から7,500の間とされる。アル=ジャウザキーは、サヒーフ・アル=ブハーリーとほぼ一語一句同じ形で共有される2,326件のハディースを数えた。このコーパス自身の数はまた別の数字であり、57巻・7,563件の番号付きハディースというのは、単にそれが取られたデジタル版そのものの形であって、どれか特定の印刷番号づけを正確に再現するという主張ではない。
hero.4=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者(リーダー)ではその下に英訳が置かれ、fawazahmed0/hadith-apiのeng-muslim版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]やクルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=アブー・アル=フサイン・ムスリム・イブン・アル=ハッジャージュ・アル=クシャイリー・アル=ナイサーブーリー(ヒジュラ暦202–206年頃生 / 西暦817–822年頃 ― ヒジュラ暦261年 / 西暦875年没)
fact.3.label=正式な書名
fact.3.value=al-Musnad al-Sahih al-Mukhtasar——通常サヒーフ・ムスリムと略される
fact.4.label=編纂地と時期
fact.4.value=アラビア半島、エジプト、イラク、シリアでハディースが集められ、書物自体はホラーサーンのニシャープールで、弟子の求めに応じて完成した
fact.5.label=方法
fact.5.value=ムハンマドの教友まで各段階で少なくとも二人の信頼できる伝達者を経る、切れ目のない経路を備えたハディースのみを採録する。伝達者は信頼性によって三段階に分類され、誠実さが疑われる者は除外された
fact.6.label=位置づけ
fact.6.value=スンニ派イスラームの六書(クトゥブ・スィッタ)の第二書。[[BUK|サヒーフ・アル=ブハーリー]]とともに「サヒーハイン」を成し、権威においてクルアーンに次ぐ二つの集成とされる。大半の学者は、アル=ブハーリーの集成全体をこれより上位に置く
fact.7.label=ハディースの数
fact.7.value=数え方により、繰り返しを除いた3,033(アブドゥルバーキー)から、繰り返しを含めた7,275–7,395までの幅がある。印刷版は章とハディースの番号づけの両方で異なる
fact.8.label=このコーパスでは
fact.8.value=57巻・7,563件の番号付きハディース——これは元となったデータセット自体の形であり、特定の印刷番号づけの再現ではない
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-apiのeng-muslim版から取られ、アラビア語の下に並置の形で示される。どの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語のマトンは古典的なパブリックドメインの本文である。英訳のライセンスはまだ確認中である
