title=American Standard Version — À propos de cette édition | Common Root
description=L'American Standard Version de 1901 : l'édition américaine de la Revised Version, due à des savants qui avaient passé vingt ans à corriger la Bible du roi Jacques par courrier, et la souche de la Revised Standard Version, de la New American Standard Bible et de la World English Bible.
heroHeading=American Standard Version
readerHref=/reader?c1.src=asv

# The narrative, one paragraph per key, in order.
hero.1=L'American Standard Version a commencé comme le projet d'autrui. Lorsque l'Église d'Angleterre entreprit en 1870 de réviser la Bible du roi Jacques, elle invita des savants américains à y prendre part, et ils le firent — par correspondance, d'un bord à l'autre de l'Atlantique, pendant près de deux décennies. Là où les deux camps divergeaient, la leçon du comité britannique passait dans le texte et la préférence américaine en appendice, et les Américains s'engagèrent à s'abstenir d'une édition propre pendant quatorze ans. La Revised Version anglaise parut en 1881 et en 1885. L'édition américaine suivit en 1901, les leçons de l'appendice remontées dans le texte, où leurs éditeurs les avaient toujours voulues.
hero.2=C'est une traduction faite par des savants pour des savants, et elle se lit comme telle. Les réviseurs sont restés aussi près de l'ordre des mots hébreu et grec que l'anglais le tolérait, ce qui rend l'American Standard Version exacte et, sur de longs passages, raide. Sa décision la plus visible touche au nom divin : là où la Bible du roi Jacques imprimait « the LORD » en petites capitales, l'American Standard Version imprime « Jehovah », des milliers de fois, dans tout l'Ancien Testament. Au Nouveau Testament elle suit le grec des réviseurs plutôt que le Textus Receptus, de sorte que les leçons dont disposaient les traducteurs du roi Jacques et qu'ignorent les manuscrits plus anciens — la clause trinitaire de 1 Jn 5,7 parmi elles — sont en note ou absentes.
hero.3=L'American Standard Version n'est jamais devenue une bible de banc d'église. Ce qu'elle est devenue, c'est une souche. La Revised Standard Version de 1952 en était une révision ; la New American Standard Bible aussi, qui figure également dans ce corpus ; et la World English Bible également, qui l'a portée dans le domaine public en orthographe moderne. Voilà pourquoi elle occupe la place qu'elle occupe dans les échelons du lecteur — au milieu de la plus longue chaîne que possède ce corpus. Ouvrez un échelon sous un verset de l'ASV et la Revised Version dont elle est issue apparaît en dessous, et sous celle-ci la Bible du roi Jacques et la Bible de Genève, jusqu'au sol des langues originales marqué d'un ≈. Ouvrez un échelon sous un verset de la World English Bible et vous revenez ici.

