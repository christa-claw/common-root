title=ओस्टरवाल्ड बाइबिल (फ़्रांसीसी) — इस संस्करण के बारे में | Common Root
description=ओस्टरवाल्ड बाइबिल: नौशातेल के एक पादरी द्वारा जिनेवा की फ़्रांसीसी प्रोटेस्टेंट बाइबिल का संशोधन, पहली बार 1744 में प्रकाशित, यहाँ आधुनिक फ़्रांसीसी वर्तनी वाले एक बाद के संशोधन में।
heroHeading=ओस्टरवाल्ड बाइबिल
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=ज़ाँ-फ़्रेडरिक ओस्टरवाल्ड का जन्म 1663 में नौशातेल में हुआ और 1747 में वहीं उनका देहांत हुआ। 1683 में अपने जन्म-नगर में उनका अभिषेक हुआ, और उन्होंने जीवन का अधिकांश भाग वहीं की कलीसिया में बिताया, पहले उपयाजक के रूप में और 1699 से पादरी के रूप में; वे धर्मविज्ञान भी पढ़ाते थे। उनकी बाइबिल इब्रानी और यूनानी से किया गया कोई नया अनुवाद नहीं, बल्कि जिनेवा की फ़्रांसीसी प्रोटेस्टेंट बाइबिल का संशोधन है — वह अनुवाद जिसे फ़्रांसीसी-भाषी रिफ़ॉर्म्ड कलीसियाएँ सोलहवीं शताब्दी से पढ़ती आई थीं। ओस्टरवाल्ड का संशोधित पाठ पहली बार 1744 में, उनकी मृत्यु से तीन वर्ष पहले, प्रकाशित हुआ, और दो शताब्दियों से अधिक समय तक इसका पुनर्मुद्रण और संशोधन होता रहा; ब्रिटेन में भी यह भली-भाँति परिचित था।
hero.2=इस संग्रह का पाठ 1744 की फ़्रांसीसी नहीं है। अठारहवीं शताब्दी में जहाँ “étoit” लिखा जाता था, वहाँ आधुनिक फ़्रांसीसी “était” लिखती है; इस प्रति में हर जगह “était” है और “étoit” एक बार भी नहीं, इसलिए यह उन बाद के संशोधनों में से किसी एक से आती है जिन्होंने ओस्टरवाल्ड का नाम बनाए रखा। इनमें सबसे प्रसिद्ध वह संशोधन है जिसे Société biblique de France ने 1881 में प्रकाशित किया, जिसका नया नियम Ch. L. Frossard का काम था, और उस पाठ को 1996 में भी अद्यतन किया गया। इस प्रति का स्रोत eBible.org केवल “Ostervald” लिखता है, संशोधन का नाम नहीं, इसलिए यह पृष्ठ भी किसी का नाम नहीं लेता। कुछ विशेषताएँ लगभग हर पृष्ठ पर दिखती हैं। ईश्वरीय नाम “l'Éternel” है, अर्थात् शाश्वत, जैसा सेगों और फ़्रांसीसी डार्बी में: भजन संहिता 23 में “L'Éternel est mon berger; je n'aurai point de disette”। यशायाह 7:14 “la vierge sera enceinte” — कुँवारी — बनाए रखता है, जहाँ सेगों में युवती है। और नया नियम टेक्स्टस रिसेप्टस के वे पाठ बनाए रखता है जिन्हें आलोचनात्मक संस्करण हटा देते हैं: 1 यूहन्ना 5:7 में तीन स्वर्गीय गवाह हैं, “le Père, la Parole, et le Saint-Esprit”, जो बगल के सेगों में नहीं हैं।
hero.3=इस पाठक में यह सेगों और फ़्रांसीसी डार्बी के साथ तीन फ़्रांसीसी बाइबिलों में से एक है। फ़्रांसीसी अंतरफलक इस पर नहीं खुलता: फ़्रांसीसी के लिए कोई चुना हुआ संस्करण नहीं है, अतः पाठक सूची-क्रम में पहली फ़्रांसीसी बाइबिल लेता है, जो डार्बी है। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं — जिनेवा बाइबिल, जिसका यह संशोधन है, इस संग्रह में नहीं है — अतः किसी पद के नीचे खुला पायदान सीधे ≈ से चिह्नित मूल-भाषाओं के तल पर उतरता है: पुराने नियम के लिए लेनिनग्राद कोडेक्स, और नए नियम के लिए टेक्स्टस रिसेप्टस, वही यूनानी परंपरा जिसका यह बाइबिल वास्तव में अनुसरण करती है। इसका पायदान चिह्न वर्ष 1744 धरता है, जो ओस्टरवाल्ड के अपने संशोधन का वर्ष है, दिखाए गए पाठ का नहीं। इसे सेगों के बगल में खोलें, तो फ़्रांसीसी प्रोटेस्टेंट बाइबिल-भाषा की दो शताब्दियाँ साथ-साथ दिखेंगी।

