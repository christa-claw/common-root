title=Die Köstliche Perle — Über diese Ausgabe | Common Root
description=Die Köstliche Perle: eine Auswahl aus Joseph Smiths Offenbarungen, Übersetzungen und Berichten, erstmals 1851 als Missionsbroschüre in Liverpool, England, zusammengestellt und 1880 von den Heiligen der Letzten Tage als Schrift angenommen.
heroHeading=Die Köstliche Perle
readerHref=/reader?c1.src=pgp

hero.1=Die Köstliche Perle begann als Missionsbroschüre, nicht als heilige Schrift. 1851 stellte Franklin D. Richards, damals Präsident der Europäischen Mission der Kirche, sie in Liverpool, England, zusammen; er sammelte Schriften von Joseph Smith, die in frühen Zeitungen der Kirche erschienen oder nur in geringer Zahl im Umlauf gewesen waren, damit die Mitglieder in Großbritannien sie beisammen hatten. Der Titel geht auf das Gleichnis in Matthäus 13,45–46 zurück, vom Kaufmann, der alles verkauft, was er hat, um eine einzige kostbare Perle zu erwerben.
hero.2=Eine zweite Ausgabe, von Orson Pratt bearbeitet und neu geordnet, erschien 1878 in Salt Lake City, und am 10. Oktober 1880 nahm eine Generalkonferenz der Kirche sie durch Abstimmung als Schrift an. Eine Revision von 1902, vor allem von James E. Talmage erarbeitet, gliederte den Text in Kapitel und Verse und ließ die Offenbarungen weg, die sie mit Lehre und Bündnisse gemeinsam hatte; eine Ausgabe von 1921 wurde zweispaltig gesetzt. 1976 kamen zwei weitere Offenbarungen hinzu — eine Vision vom celestialen Reich und Joseph F. Smiths Vision von der Erlösung der Toten —, und 1979 verlegte die Kirche sie nach Lehre und Bündnisse, deren Ausgabe von 1981 sie als Abschnitte 137 und 138 enthält.
hero.3=Die heutige Ausgabe hat fünf Teile. Die Auszüge aus dem Buch Mose und Joseph Smith – Matthäus stammen aus Joseph Smiths 1830 begonnener Überarbeitung der King-James-Bibel: der erste ist eine erweiterte Darstellung der Anfangskapitel des Buches Genesis, gerahmt von Visionen, die Mose zuteilwurden; der zweite eine Neufassung von Matthäus 23,39 und Kapitel 24. Das Buch Abraham ist der Text, den Smith nach eigener Aussage aus ägyptischen Papyri übersetzte, die 1835 in Kirtland, Ohio, erworben worden waren; er erschien 1842 in der Zeitung Times and Seasons in Nauvoo, Illinois, mit drei Abbildungen, die heute Faksimile 1, 2 und 3 heißen. Joseph Smith – Lebensgeschichte stammt aus dem Bericht über sein frühes Leben und seine Visionen, den er 1838 verfasste, und die Glaubensartikel sind dreizehn Glaubenssätze aus einem Brief von 1842 an den Chicagoer Zeitungsherausgeber John Wentworth.
hero.4=Das Buch Abraham ist der am häufigsten angezweifelte Teil. Der größte Teil der Papyri galt lange als zerstört, vermutlich beim Brand von Chicago 1871, doch zehn Fragmente, die einst im Besitz Joseph Smiths gewesen waren, tauchten im Metropolitan Museum of Art in New York auf, das sie 1967 der Kirche übergab. Fachleute bestimmen die Fragmente als Teile gängiger ägyptischer Totentexte, geschrieben zwischen dem 3. Jahrhundert v. Chr. und dem 1. Jahrhundert n. Chr., und der eigene veröffentlichte Aufsatz der Kirche zu dem Buch räumt ein, dass keines der Schriftzeichen darauf Abrahams Namen oder ein Ereignis erwähnt, von dem das Buch berichtet.
hero.5=Neben der Bibel, dem Buch Mormon und Lehre und Bündnisse ist sie eines der vier Standardwerke der Kirche Jesu Christi der Heiligen der Letzten Tage; die Community of Christ, die andere große Kirche, die aus Joseph Smiths Bewegung hervorging, zählt sie nicht zu ihren Schriften. Der Text in diesem Korpus stammt aus dem gemeinfreien JSON-Export des Mormon Documentation Project, derselben Quelle wie das Buch Mormon und Lehre und Bündnisse hier, und bewahrt die fünf Teile als fünf Bücher: Mose mit acht Kapiteln, Abraham mit fünf und die letzten drei mit je einem. Die drei Faksimiles und die mit ihnen gedruckten Erklärungen sind kein Verstext und daher nicht enthalten. Wie ihre beiden Begleitwerke folgt sie dem Wortlaut der aktuellen Standardausgabe statt einem einzelnen historischen Druck, weshalb hier kein Erscheinungsjahr angegeben wird.

