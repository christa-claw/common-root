fact.2.label=Erarbeitet von
fact.2.value=Joseph Smith jr. (1805–1844): Offenbarungen, seine Überarbeitung der King-James-Bibel, eine Übersetzung, die er nach eigener Aussage aus ägyptischen Papyri anfertigte, seine eigene Lebensgeschichte und ein Glaubensbekenntnis; erstmals in einem Band zusammengestellt von Franklin D. Richards
fact.3.label=Erschienen
fact.3.value=1851, Liverpool, England, als Missionsbroschüre, zusammengestellt von Franklin D. Richards; zweite Ausgabe 1878, Salt Lake City, bearbeitet von Orson Pratt; am 10. Oktober 1880 von einer Generalkonferenz als Schrift angenommen
fact.4.label=Aufbau
fact.4.value=Fünf Teile — Auszüge aus dem Buch Mose, das Buch Abraham, Joseph Smith – Matthäus, Joseph Smith – Lebensgeschichte und die Glaubensartikel —, seit der Revision von 1902 in Kapitel und Verse gegliedert; in unserem Korpus steht jeder Teil als eigenes Buch
fact.5.label=Stellung
fact.5.value=Eines der vier Standardwerke der Kirche Jesu Christi der Heiligen der Letzten Tage, neben der Bibel, dem [[BOM|Buch Mormon]] und [[DC|Lehre und Bündnisse]]; die Community of Christ betrachtet sie nicht als Schrift
fact.6.label=In diesem Korpus
fact.6.value=Der Text folgt dem aktuellen Standardwortlaut aus dem als gemeinfrei erklärten JSON-Export des Mormon Documentation Project — derselben Quelle wie beim [[BOM|Buch Mormon]] und bei [[DC|Lehre und Bündnisse]]; die Auszüge zu Mose und Matthäus bearbeiten den Text der [[KJV|King James Version]], die das Korpus ebenfalls enthält; die Faksimiles und ihre Erklärungen sind ausgelassen, und es wird hier kein einzelnes Druckjahr angegeben
fact.7.label=Lizenz
fact.7.value=Gemeinfrei, laut Angabe der für die Daten Verantwortlichen; das moderne urheberrechtlich geschützte Studienmaterial ist nicht enthalten
