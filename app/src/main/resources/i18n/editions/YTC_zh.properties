title=Yorumsuz Türkçe Çeviri — 关于本译本 | Common Root
description=Yorumsuz Türkçe Çeviri(YTC):由伊斯梅尔·塞林肯依据《世界英语圣经》翻译、与eBible.org合作完成的现代土耳其语圣经,采用CC BY-ND 4.0授权——本语料库默认打开的土耳其语文本。
heroHeading=Yorumsuz Türkçe Çeviri
readerHref=/reader?c1.src=ytc

hero.1=Yorumsuz Türkçe Çeviri——字面意思是"无注释"或"不加解说"的土耳其语译本——是一部由伊斯梅尔·塞林肯与eBible.org合作完成的现代土耳其语圣经,版权标注为2023年至2025年。这个名称本身就说明了翻译方法:一种朴实的逐字对应译法,刻意不加解释性注解和诠释性改写,相较于流畸的措辞更看重对底本的透明忠实。
hero.2=老实说,这部译本所依据的底本是英语,而非希伯来文、亚兰文或希腊文:该译本自身的版权页说明它是依据《世界英语圣经》转译而成,这使它成为一部二次翻译,而非直接依据原文翻译而成,这与本语料库中的大多数圣经译本不同。Common Root最初寻找的是历史上1941年土耳其语圣经(Kitabı Mukaddes)的开放版本——该译本如今已足够古老,在土耳其已进入公共领域——但未能找到可用的数字化来源;Yorumsuz Türkçe Çeviri是当时唯一可获得、采用开放授权的土耳其语圣经。本语料库的文本来自eBible.org的USFM版本,在那里编目为turytc。
hero.3=它的翻译取向带有现代色彩,而非传统色彩:它将神的本名译为Yahve,而非土耳其语惯用的"RAB"或"Yehova",并引用《出埃及记》3:14-15为据;又将耶稣之名译为Yeşua,而非土耳其语常见的İsa,其余专有名词则保留惯常形式。全书采用标准的66卷新教正典,不含次经。
hero.4=这是本语料库中唯一的土耳其语圣经,因此土耳其语界面默认打开的就是这部译本。

