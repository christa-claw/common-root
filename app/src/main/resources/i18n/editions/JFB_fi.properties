title=Japanilainen Freedom Bible — Tietoja tästä laitoksesta | Common Root
description=Japanilainen Freedom Bible (フリーダム・バイブル): täydellinen, 66 kirjan japaninkielinen Raamattu, jota eBible.org jakaa käännösluonnoksena ja jolle ei ole asetettu tekijänoikeutta — tämän aineiston ainoa japaninkielinen Raamattu, joten japaninkielinen käyttöliittymä avautuu siihen.
heroHeading=Japanilainen Freedom Bible
readerHref=/reader?c1.src=jfb

hero.1=Japanilainen Freedom Bible — japaniksi フリーダム・バイブル — on täydellinen japaninkielinen Raamattu, jota jakaa eBible.org; se nimeää itsensä käännöksen viralliseksi jakelijaksi. Käännös on hyvin tuore: tämän aineiston lähdetiedostot on päivätty 19. elokuuta 2026, ja sen kortin vuosiluku 2026 on noiden tiedostojen päiväys. eBible ei ilmoita erillistä julkaisupäivää, eikä sellaista väitetä tässäkään.
hero.2=Paljon siitä on kirjaamatta, ja se kannattaa sanoa suoraan. eBiblen sivut eivät nimeä kääntäjää, komiteaa eivätkä kustantajaa, eivätkä ne kerro, mistä käännös on tehty — suoraan hepreasta ja kreikasta vai jonkin toisen nykykäännöksen kautta. Sen oma tekijänoikeussivu kutsuu sitä käännösluonnokseksi (翻訳の草案) ja pyytää ehdotuksia sen parantamiseksi, joten tämän aineiston teksti on tilannekuva keskeneräisestä työstä eikä vakiintunut laitos.
hero.3=Selvää on sen oikeudellinen asema: sama sivu toteaa, ettei käännökselle ole asetettu tekijänoikeutta, ja merkitsee sen vapaaseen käyttöön (public domain). Siksi juuri se on tämän aineiston japaninkielinen teksti — se oli eBiblessä ainoa täydellinen japaninkielinen Raamattu, jota tekijänoikeus ei sido. Vanhempi japanilainen Raamattu, joka olisi voinut antaa sille sukulinjan, vuonna 1887 valmistunut Meiji-kauden käännös, on jo kauan ollut vapaassa käytössä, mutta sitä ei ole saatavilla samasta lähteestä.
hero.4=Tässä aineistossa siinä on protestanttisen kaanonin 66 kirjaa ja 31 098 jaetta, ei deuterokanonisia kirjoja. Sille ei ole kirjattu kantatekstiä, joten askelma sen jakeen alta johtaa suoraan alkukielten pohjaan, joka on merkitty ≈-merkillä: siellä näkyvä heprea ja kreikka ovat todistajia eivätkä väite siitä, mistä se on käännetty — ja kun sen lähde on tuntematon, juuri niin se on rehellistä lukea. Se on aineiston ainoa japaninkielinen Raamattu, joten japaninkielinen käyttöliittymä avautuu siihen oletuksena.

