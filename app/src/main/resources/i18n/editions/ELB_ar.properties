title=Elberfelder 1905 — عن هذه الطبعة | Common Root
description=كتاب إلبرفلد المقدس: الترجمة الألمانية التي بدأها سنة 1855 جون نلسون داربي وكارل بروكهاوس ويوليوس أنطون فون بوزيك، وهي من أوائل الترجمات الألمانية التي فارقت النص المستلم — هنا في طبعة سنة 1905.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=الاسم موضع. إلبرفلد مدينة في وادي الفوبر، صارت منذ سنة 1929 جزءًا من فوبرتال، وفيها أُنجز معظم العمل. بدأها ثلاثة رجال: جون نلسون داربي وكارل بروكهاوس ويوليوس أنطون فون بوزيك، وكلهم على صلة بالفرع الألماني من حركة الإخوة. صدر العهد الجديد سنة 1855، والمزامير سنة 1859، والعهد القديم سنة 1871 — لا باسم أحد، بل بوصفها مترجمة عن النص الأصلي “على يد بعض المسيحيين”.
hero.2=وما ميّزها هو اليونانية التي تحتها. فكل كتاب مقدس ألماني متداول حينئذ يكاد يكون قائمًا بعدُ على النص المستلم؛ أما هذه فقطعت معه، وأخذت بقراءات المخطوط السينائي والمخطوط الفاتيكاني كلما نُشر هذان المخطوطان في منتصف القرن التاسع عشر. وصُنع العهد القديم عن العبرية الماسورية. وكان مبدأ الترجمة الدقة قبل الأناقة: ألمانية تتبع العبرية واليونانية من قرب حتى تصير متيبّسة، وكل لفظة تُضاف لاستقامة المعنى معلَّمة على أنها مضافة، ولا عناوين للأقسام البتة، بحجّة أنّ النصوص الأصلية لا عناوين فيها. وهي لا تزال تُعدّ من الترجمات الألمانية الأقرب إلى الحرف الذي تحتها.
hero.3=وهذه هي طبعة سنة 1905، أول ما رُكن بالحرف اللاتيني بدل الحرف القوطي؛ ومن صغر ذلك البنط سُمّيت Perlbibel. ولم تكن ترجمة جديدة. فحتى وفاة رودولف بروكهاوس سنة 1932 ظلّت الإلبرفلدية تُراجَع وتُصحَّح من طبعة إلى طبعة — يتولّى ألفريد روشا العهد القديم وإميل دونغِس العهد الجديد — حتى إنّ التاريخ ههنا يسمّي طبعة داخل نصّ متحرك لا طبعةً نهائية مكتملة. وأما ما يُباع اليوم باسم الإلبرفلدية فهو في الغالب شيء آخر: فقد أنفقت لجنة من الحركة نفسها خمسًا وعشرين سنة في مراجعتها ونشرت ثمرتها سنة 1975 وسنة 1985. وتلك المراجعة أخرجت “Jehova” من العهد القديم ووضعت “HERR” مكانها. أما هذا النص فما زال يطبع “Jehova”، وهو ما يضعه إلى جانب American Standard Version وإلى جانب كتاب داربي الفرنسي نفسه.
hero.4=وموضعها في هذه المجموعة قائم على حدة قليلًا. فليس للألمانية طبعة افتراضية منتقاة في القارئ، فتفتح الواجهة الألمانية أول كتاب مقدس ألماني في الفهرس، وهو هذا — قبل كتابَي لوثر كليهما بالترتيب الأبجدي لا بشيء سواه. وفي درجات النسب تقف وحدها. فاللوثريّان يؤلفان سلسلة: 1912 مراجعة عن 1545، و1545 مستندة إلى اليونانية والعبرية؛ أما الإلبرفلدية فلا أصل مسجّل لها، لأنّ إلبرفلدية سنة 1871 التي خرجت منها بتتابع التصحيح ليست في هذه المجموعة. ولذلك فإنّ درجة تحت آية إلبرفلدية تهبط رأسًا إلى أرضية اللغات الأصلية المعلّمة بـ≈، مع أنّ كتاب داربي الفرنسي الواقف على بعد عمود واحد هو أقرب أنسبائها ههنا.

