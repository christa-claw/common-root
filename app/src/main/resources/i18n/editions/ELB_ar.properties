fact.1.value=الألمانية
fact.2.label=بدأها
fact.2.value=جون نلسون داربي وكارل بروكهاوس ويوليوس أنطون فون بوزيك
fact.3.label=أول صدور
fact.3.value=العهد الجديد 1855، المزامير 1859، العهد القديم 1871، في إلبرفلد — مدينة تتبع فوبرتال منذ سنة 1929، وهي سبب التسمية التي تحملها الترجمة
fact.4.label=هذه الطبعة
fact.4.value=طبعة ر. بروكهاوس لسنة 1905 — أول ما رُكن بالحرف اللاتيني بدل الحرف القوطي، وتُعرف من صغر ذلك البنط باسم Perlbibel
fact.5.label=العهد الجديد عن
fact.5.value=اليونانية النقدية: من أوائل الكتب الألمانية التي قطعت مع [[TR|النص المستلم]]، آخذةً بقراءات المخطوط السينائي والمخطوط الفاتيكاني كلما دخل هذان المخطوطان المطبعة
fact.6.label=العهد القديم عن
fact.6.value=العبرية الماسورية، مع خروج عنها في مواضع قليلة
fact.7.label=نوع الترجمة
fact.7.value=موجَّهة إلى النص المصدر وحرفية عن قصد — الألفاظ المضافة لاستقامة المعنى معلَّمة على أنها مضافة، ولم تُضَف عناوين للأقسام، إذ لا عناوين في النصوص الأصلية
fact.8.label=الاسم الإلهي
fact.8.value=تطبع “Jehova” في العهد القديم كله؛ وقد استبدلت مراجعة سنة 1985 بها “HERR”. وهو القرار نفسه الذي في [[ASV|American Standard Version]] وفي [[DBY|كتاب داربي الفرنسي]]
fact.9.label=النسخة الشقيقة
fact.9.value=[[DBY|Darby 1885]] — الكتاب الفرنسي من الدائرة نفسها وعلى المبادئ نفسها
fact.10.label=صُحِّحت حتى
fact.10.value=سنة 1932، من طبعة إلى طبعة — تولّى ألفريد روشا العهد القديم وإميل دونغِس العهد الجديد
fact.11.label=ليست الكتاب نفسه
fact.11.value=Revidierte Elberfelder لسنتَي 1975 و1985، ثمرة مراجعة دامت خمسًا وعشرين سنة ونصّ غير هذا
fact.12.label=الترخيص
fact.12.value=ملك عام
fact.13.label=في هذه المجموعة
fact.13.value=الكتاب الذي تفتح عليه الواجهة الألمانية: ليس للألمانية طبعة افتراضية منتقاة، فيأخذ القارئ أول كتاب مقدس ألماني في الفهرس، وELB متقدّم على [[LUT1545|Luther 1545]] وعلى [[LUT1912|Luther 1912]] بمجرّد اختصاره لا بغيره. ولا أصل مسجّل له في درجات النسب — فإلبرفلدية سنة 1871 التي خرج منها بتتابع التصحيح ليست في المجموعة — فتنفتح الدرجة على أرضية اللغات الأصلية. ولا يحمل سنةً من أيّ الجانبين: بطاقة الفهرس تترك عمود السنة فارغًا، وقائمة سنوات الدرجات المرتّبة باليد لا تعرفه هي الأخرى، فلا تُظهر شارة الدرجة لـELB غير الاختصار وحده — وهي الحالة الصامتة، بينما [[DRA|دُواي-ريمس]] هي الصاخبة، وفيها تتناقض القائمتان على الملأ
