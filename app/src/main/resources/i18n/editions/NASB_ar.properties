title=New American Standard Bible 2020 — عن هذه الطبعة | Common Root
description=New American Standard Bible: استمرار مؤسسة Lockman الخاص لحرفية الترجمة الكلمة بكلمة التي عُرفت بها American Standard Version، تُرجمت من جديد عن العبرية والآرامية واليونانية، وهي الآن بنصّها الصادر سنة 2020.
heroHeading=New American Standard Bible 2020
readerHref=/reader?c1.src=nasb

hero.1=بدأت New American Standard Bible بوصفها استمرارًا مقصودًا لا مشروعًا جديدًا كليًا. أسّستها مؤسسة Lockman، هيئة غير ربحية مقرّها La Habra في كاليفورنيا، التي أطلقت العمل سنة 1959 لمواصلة American Standard Version لعام 1901 — محافظةً على سمعتها في الأمانة الحرفية الكلمة بكلمة للعبرية والآرامية واليونانية، مع تحديث إنجليزيتها القديمة. وجمعت المؤسسة لجنة من العلماء من كليات وجامعات ومعاهد لاهوتية مسيحية، معظمهم من طوائف إنجيلية محافظة، وظهرت الترجمة على مراحل: إنجيل يوحنا سنة 1960، باقي الأناجيل سنة 1962، العهد الجديد كاملًا سنة 1963، سفر المزامير منفردًا سنة 1968، والكتاب المقدّس كاملًا سنة 1971. واستند هذا الإصدار الكامل الأول، في العهد القديم، إلى الطبعة الثالثة من Biblia Hebraica لرودولف كيتل، مع الرجوع إلى مخطوطات البحر الميت، وفي العهد الجديد إلى الطبعة الثالثة والعشرين من Novum Testamentum Graece لنستله وألاند.
hero.2=استمرت أعمال المراجعة عقودًا بعد تلك الطبعة الأولى. فتبعتها تغييرات طفيفة في الصياغة سنوات 1972 و1973 و1975، ثم مراجعة أوسع سنة 1977، ومراجعة محدودة أخرى سنة 1992. وفي 1995 أصدرت المؤسسة Updated Edition — أي NASB95، النصّ الذي يقصده معظم الناس حين يقولون "NASB" وحدها — بالرجوع إلى Biblia Hebraica Stuttgartensia وإلى الطبعة السادسة والعشرين من Nestle-Aland. والنصّ الحالي هو تحديث سنة 2020، الذي بدأت أجزاء منه تظهر على الإنترنت منذ 2018: فنقل أساس العهد القديم النصّي إلى Biblia Hebraica Stuttgartensia، وإلى الأحدث منها Biblia Hebraica Quinta فيما تغطّيه من أسفار، بالرجوع إلى السبعينية ومخطوطات البحر الميت والترجومات وغيرها من النسخ القديمة حيث تؤثّر على القراءة، بينما يتبع العهد الجديد الآن الطبعة الثامنة والعشرين من Nestle-Aland، معزَّزةً بما تقدّمه Editio Critica Maior من شواهد مخطوطات يونانية أوفر. وبقيت منهجية المترجمين المعلنة واحدة عبر كل مراجعة: نقل الأصل حرفيًا بقدر ما تسمح به الإنجليزية، وحيث تضلّل الترجمة الحرفية الصارمة أو تُقرأ بشكل غير طبيعي، اختيار الصياغة الأوضح مع تدوين الصياغة الأكثر حرفية في الحاشية — وهو انضباط يُستشهد به عادة سببًا لكون هذه الترجمة من أكثر الترجمات الإنجليزية الحرفية المستخدمة على نطاق واسع في القرنين العشرين والحادي والعشرين.
hero.3=على الرغم من اسمها ودينها المُعلَن لـ American Standard Version، فإن New American Standard Bible ترجمة جديدة عن اللغات الأصلية لا مراجعة سطرًا بسطر لتلك الترجمة، ولذلك لا يسجّل لها المجموعة أصلًا: فتح درجة من درجات النسب تحت آية من NASB يُنزل مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈، تمامًا كما يحدث مع New International Version. وتتشارك الطبعتان أكثر من هذا الشكل — فكلتاهما مرخّصة لا حرّة التداول، منفردتين عن الطبعات الإنجليزية الحرّة النسخ على الرفّ نفسه، مع أنّ الواجهة الإنجليزية تفتح افتراضيًا على New International Version، فيما تُبلَغ New American Standard Bible من بطاقتها الخاصة في شبكة الترجمات.

fact.1.label=اللغة
fact.1.value=الإنجليزية
fact.2.label=مَن أمر بها
fact.2.value=مؤسسة Lockman في La Habra بكاليفورنيا، التي أطلقت المشروع سنة 1959 استمرارًا لتقليد American Standard Version في الترجمة الحرفية
fact.3.label=أنجزها
fact.3.value=لجنة ترجمة ترعاها المؤسسة، جمعت علماء من كليات وجامعات ومعاهد لاهوتية مسيحية، معظمهم من طوائف إنجيلية محافظة
fact.4.label=العهد القديم عن
fact.4.value=الطبعة الثالثة من Biblia Hebraica لرودولف كيتل ومخطوطات البحر الميت للإصدار الأصلي سنة 1971؛ Biblia Hebraica Stuttgartensia من مراجعة 1995؛ ونصّ 2020 يستند إلى Biblia Hebraica Stuttgartensia، وحيث تتوفّر، إلى الأحدث منها Biblia Hebraica Quinta، بالرجوع إلى السبعينية ومخطوطات البحر الميت والترجومات وغيرها من النسخ القديمة
fact.5.label=العهد الجديد عن
fact.5.value=الطبعة الثالثة والعشرون من Novum Testamentum Graece لنستله وألاند للإصدار الأصلي سنة 1971؛ الطبعة السادسة والعشرون من مراجعة 1995؛ الطبعة الثامنة والعشرون (NA28) لنصّ 2020، معزَّزةً بشواهد المخطوطات اليونانية من Editio Critica Maior
fact.6.label=نوع الترجمة
fact.6.value=تكافؤ صوري — تُرجمت حرفيًا عن اللغات الأصلية بقدر ما تسمح به الإنجليزية المقروءة، مع تدوين الصياغة الأكثر حرفية في الحاشية حيث اختيرت صياغة أوضح بدلًا منها؛ ترجمة جديدة عن العبرية والآرامية واليونانية، لا مراجعة لكتاب مقدّس إنجليزي أقدم، على الرغم من جذورها في منهج American Standard Version
fact.7.label=نُشر
fact.7.value=إنجيل يوحنا سنة 1960، الأناجيل سنة 1962، العهد الجديد سنة 1963، المزامير سنة 1968، الكتاب المقدّس كاملًا سنة 1971، تغييرات نصّية طفيفة سنوات 1972 و1973 و1975، مراجعة كبرى سنة 1977، مراجعة محدودة سنة 1992، Updated Edition (NASB95) سنة 1995، والنصّ الحالي لسنة 2020، الذي ظهرت أجزاء منه على الإنترنت منذ 2018
fact.8.label=الترخيص
fact.8.value=مرخّصة، لا حرّة التداول. يجوز اقتباس حتى 1,000 آية بأي صيغة من غير إذن خطّي، بشرط ألّا تشكّل سفرًا كاملًا من الكتاب المقدّس ولا أكثر من نصف العمل المقتبِس، مع إشعار حقوق نشر يذكر سنوات 1960 و1971 و1977 و1995 و2020؛ وما زاد عن ذلك يحتاج إذن مؤسسة Lockman
fact.9.label=في هذه المجموعة
fact.9.value=مرخّصة لا حرّة التداول، كما [[NIV|New International Version]] — تفتح الواجهة الإنجليزية على تلك الطبعة افتراضيًا، وتُبلَغ هذه من بطاقتها الخاصة. ولا أصل مسجَّل لها في درجات النسب: فمع أنّ المؤسسة تصف المشروع استمرارًا لحرفية [[ASV|American Standard Version]]، فهي مترجمة من جديد عن العبرية والآرامية واليونانية لا مراجعة لتلك الترجمة أو لأي نصّ إنجليزي آخر محفوظ هنا، فتنزل الدرجة تحت آية من NASB مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈
