title=Versión Biblia Libre — この版について | Common Root
description=Versión Biblia Libre：Free Bible Ministryによるスペイン語訳聖書で、ジョナサン・ギャラガーとシェリー・バリオス・デ・アビラが英語版Free Bible Versionのスペイン語姉妹版として翻訳し、あらゆる用途に自由に利用できるライセンスで公開されている。
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre──「自由な聖書版」の意──は、英語版Free Bible Versionのスペイン語姉妹版であり、同じ発行元であるFree Bible Ministry──メリーランド州ローレルに拠点を置く非営利団体──によって刊行されている。その新約聖書は翻訳者ジョナサン・ギャラガーとシェリー・バリオス・デ・アビラに帰せられ、グスタボ・サナブリアとレベッカ・ポルダースが協力者として名を連ねており、著作権は2018年から2020年の日付でギャラガーとバリオス・デ・アビラの名に帰属する。その英語版の姉妹版と同様、著作権ページを利用の障害として取り除くために存在する──テキストは誰でも、印税の支払いも許可を求めることもなく、複製し、印刷し、オンラインで公開し、改変することができる。
hero.2=公開されている前付けは新約聖書の底本を明確に記す──ギリシャ語ネストレ・アーラント本文、すなわち聖書協会各団体が用いる校訂本文から直接訳されている──が、このコーパスが収める版が完全な、六十六巻からなるプロテスタント正典であるにもかかわらず、旧約聖書については別個の底本を挙げていない。資料が空白を残す箇所は、推測で埋めるのではなく、ここでも空白のままにしてある。
hero.3=この読書環境では、五つのスペイン語訳のうちの一つである。スペイン語インターフェースは依然として既定で[[RVR09|レイナ・バレラ1909]]を開く──これはまったく別系統の、数世紀を経たより古い伝統に属するパブリックドメインの本文である。この版はむしろ、[[BES|Biblia en Español Sencillo]]、[[PDDPT|Palabra de Dios para Ti]]、[[NBLA|Nueva Biblia de las Américas]]とともに、自分自身のカードから到達する版である。これらのいずれの改訂でもないため、系譜の段に母本は記録されていない──Versión Biblia Libreの一節の下で段を開くと、≈ 印で示された原語の底面へ直接至る。このコーパスにおける最も近い「親類」は、そもそもスペイン語ではない──同じ団体による、同じライセンスの下での英語訳、[[FBV|Free Bible Version]]である。

