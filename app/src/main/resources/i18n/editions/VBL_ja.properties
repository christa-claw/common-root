fact.2.value=ジョナサン・ギャラガーとシェリー・バリオス・デ・アビラ。グスタボ・サナブリアとレベッカ・ポルダースが協力者として参加
fact.3.label=発行元
fact.3.value=Free Bible Ministry──英語版[[FBV|Free Bible Version]]も発行する同じ非営利団体
fact.4.label=旧約の底本
fact.4.value=公開されている前付けには別個に記されておらず、前付けは新約聖書の本文的底本のみを記す
fact.5.label=新約の底本
fact.5.value=ギリシャ語ネストレ・アーラント本文──聖書協会各団体が用いる校訂本文
fact.6.label=刊行
fact.6.value=2018年から2020年の日付の著作権、ジョナサン・ギャラガーとシェリー・バリオス・デ・アビラの名に帰属
fact.7.label=ライセンス
fact.7.value=クリエイティブ・コモンズ 表示 - 継承 4.0──版を名指しし、変更を明示し、派生物が同じライセンスを引き継ぐかぎり、自由に複製、印刷、改変できる
fact.8.label=このコーパスでは
fact.8.value=五つのスペイン語訳のうちの一つ。[[RVR09|レイナ・バレラ1909]]（スペイン語インターフェースが既定で開く版）、[[BES|Biblia en Español Sencillo]]、[[PDDPT|Palabra de Dios para Ti]]、[[NBLA|Nueva Biblia de las Américas]]とともに並ぶ──これらのいずれにも、ここではまだ母本が記録されていない。また、英語版[[FBV|Free Bible Version]]のスペイン語姉妹版でもあり、同じ発行元による同じライセンスの下にある
