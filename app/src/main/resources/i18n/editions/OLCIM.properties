title=Baibal Olcim — About This Edition | Common Root
description=Baibal Olcim: the Bible in Matu Chin, a minority language of Myanmar's Chin State, distributed by eBible.org as a genuinely public-domain text whose translator and date of translation are not recorded.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

# The narrative, one paragraph per key, in order.
hero.1=Matu Chin — also called Matupi Chin — is a Sino-Tibetan language spoken by roughly 34,000 people centred on Matupi, in the southern part of Myanmar's Chin State, with related communities across the border in India's Mizoram. Baibal Olcim is the Bible in this language, and it is the only Matu Chin text in this corpus.
hero.2=What the record does not give is who translated it, or when. eBible.org, which distributes the text, states only that it is in the public domain, and catalogues it under hlt, the ISO 639-3 code for Matu Chin — no translator, no committee, no date of translation. This page leaves both blank rather than guess at them. That same code has its own small history here: an earlier attempt to add a second Hindi Bible to this corpus was filed under hlt on the strength of a similar-looking abbreviation, before Matu Chin verses turning up where Hindi ones were expected caught the mistake. This edition is the one that was actually checked against the language its code names.
hero.3=It was added for what it is rather than for its length: a genuinely public-domain Bible, not merely a licensed one, in the language of a Christian minority that has faced real persecution amid Myanmar's civil conflict, concentrated in and around Chin State. A reader built to ask nothing of the people using it, and to track none of them, is squarely for a case like this one — which is also most of why this page has so little else to put in its facts.

