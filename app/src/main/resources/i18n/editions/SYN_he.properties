title=התרגום הסינודלי — על המהדורה הזו | Common Root
description=התרגום הסינודלי הרוסי משנת 1876: החל בשנת 1813 ביוזמת החברה התנ"כית הרוסית, הושלם בידי ארבע האקדמיות התאולוגיות האורתודוקסיות בהנהגת המטרופוליט פילארט, ועודנו התנ"ך שרוב דוברי הרוסית מתכוונים אליו כשהם אומרים סתם "התנ"ך".
heroHeading=התרגום הסינודלי
readerHref=/reader?c1.src=syn

hero.1=המפעל החל בשנת 1813, כשהחברה התנ"כית הרוסית שזה עתה נוסדה יצאה, בתמיכת הצאר אלכסנדר הראשון, לתרגם לרוסית תרגום שנועד לעמוד לצד התנ"ך הסלאבוני-הכנסייתי ולא להחליפו. תוך שנים אחדות יצא לאור ברית חדשה. אנשי דת שמרנים ראו בתנ"ך ברוסית המדוברת איום על סמכותו של הנוסח הסלאבוני, ובשנת 1826 פיזר ניקולאי הראשון את החברה ועצר את העבודה לשלושה עשורים.
hero.2=התרגום חודש רק בימי אלכסנדר השני. בשנת 1858 אישרה הסינודוס הקדושה מהדורה רוסית חדשה והפקידה את העבודה בידי האקדמיות התאולוגיות של מוסקבה, סנקט פטרבורג, קאזאן וקייב, כשהמטרופוליט פילארט (דרוזדוב) ממוסקבה משמש כעורך המוביל והסופי. הברית החדשה, שתורגמה מן הנוסח היווני המודפס המכונה הטקסטוס רספטוס, יצאה לאור ב-1862. הברית הישנה הייתה הנקודה הקשה יותר להכרעה: פילארט דרש לחזור מעבר לנוסח הסלאבוני אל העברית עצמה, דבר שהתנגדו לו מי שדבקו ביסוד היווני של הנוסח הסלאבוני, ואישורה הרשמי של הסינודוס לתרגם מן הנוסח המסורתי ניתן רק באותה שנה, 1862 — אז כבר תורגם רובה של הברית הישנה על בסיס זה ממילא.
hero.3=התנ"ך השלם — הברית הישנה והברית החדשה יחד, לראשונה בכריכה אחת ברוסית החדשה הזו ולא בסלאבונית-כנסייתית — יצא לאור ב-1876 מבית הדפוס הסינודלי, ומשם בא שמו המקובל של התרגום. הברית הישנה שבו לא יצאה עברית גרידא: במקומות שבהם השבעים, שהמסורת הסלאבונית שימרה, סטתה מן הנוסח המסורתי, נשמרה לעיתים קרובות גם הנוסח היווני, בדרך כלל כחלופה בסוגריים, כך שהספר המוגמר נושא עד היום חוב של ממש לתנ"ך היווני שעמד מאחורי הנוסח הסלאבוני הישן.
hero.4=מאז לא היה לו מתחרה רציני. קוראים אורתודוקסים, קתולים, בפטיסטים ופרוטסטנטים אחרים ברוסיה פונים כולם, בצורה זו או אחרת, לאותו נוסח עצמו, וסגנונו טבע חותם ברוסית הספרותית לא פחות משטבעה תרגום המלך ג'יימס באנגלית. באוסף זה הוא מונה 66 ספרים — הקנון הפרוטסטנטי ולא הקנון האורתודוקסי הרחב יותר — והוא התנ"ך הרוסי היחיד כאן, ולכן ממשק ברוסית נפתח בו.

