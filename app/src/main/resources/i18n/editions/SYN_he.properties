fact.13.value=התנ"ך השלם — כל פרק משתי הבריתות — מוקרא בקול הנוירלי הסינתטי של Microsoft Azure בשם ru-RU-DmitryNeural, שהופק פרק אחר פרק ולא פסוק אחר פסוק, כדי שהפרוזה תשמור על קצב המשפטים הטבעי שלה.
fact.14.label=מגבלות השמע
fact.14.value=ההקראה נוצרה במכונה ולא בידי אדם, ולכן הגייתם של שמות ומונחים לא נבדקה בעריכה; שורת הקריאה עוקבת אחר הטקסט ומדגישה כל פסוק רק במצב התצוגה "פסוקים" — במצבים האחרים השמע ממשיך לפעול, אך ללא הדגשה.
