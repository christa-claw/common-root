title=Septante anglaise de Brenton — À propos de cette édition | Common Root
description=La traduction anglaise de l'Ancien Testament grec par Sir Lancelot Brenton, parue à Londres en 1844 puis rééditée avec les apocryphes en 1851 — pendant plus d'un siècle la Septante anglaise, et dans ce lecteur l'échelon placé au-dessus du grec dont elle fut traduite.
heroHeading=Septante anglaise de Brenton
readerHref=/reader?c1.src=lxxe

# The narrative, one paragraph per key, in order.
hero.1=Lancelot Charles Lee Brenton (1807–1862) était le fils d'un amiral de la Royal Navy, Sir Jahleel Brenton, et fut ordonné dans l'Église d'Angleterre en 1830, deux ans après son diplôme d'Oriel College, à Oxford. Il n'y resta pas longtemps. À Oxford, il avait rencontré John Nelson Darby, et à la fin de 1831 il avait quitté l'Église établie pour fonder une chapelle indépendante à Bath ; en 1835, cette chapelle était liée aux Frères de Plymouth, le mouvement que Darby façonnait alors. Les Bibles de Darby lui-même figurent aussi dans ce corpus, en français et en anglais. En 1844, Brenton hérita du titre de baronnet de son père, et la même année Samuel Bagster and Sons, à Londres, publia sa traduction de la Septante. Il mourut sur l'île de Wight en 1862, sans enfant, dernier baronnet de sa lignée.
hero.2=Ce n'était pas la première Septante anglaise — Charles Thomson en avait publié une à Philadelphie en 1808 —, mais ce fut celle qui dura : pendant plus d'un siècle et demi, jusqu'à la parution en 2007 de la New English Translation of the Septuagint, le lecteur anglophone qui voulait l'Ancien Testament grec plutôt que l'hébreu lisait Brenton. Il traduisit principalement d'après le Codex Vaticanus, le manuscrit du IVe siècle conservé à la Bibliothèque vaticane. La première édition laissait de côté les apocryphes ; l'édition de 1851 les ajouta, et c'est le texte de 1851 que reproduit cette copie. Les éditions gréco-anglaises de Bagster plaçaient le grec à côté de l'anglais, et ce grec figure dans ce corpus comme édition distincte. Parce que l'anglais suit le grec, il lit là où lit le grec : les psaumes gardent la numérotation grecque, si bien que le psaume 22 est ici le psaume du berger, et en Ésaïe 7,14 « a virgin shall conceive » rend le grec parthenos, non l'hébreu ʿalmah.
hero.3=Dans ce lecteur, c'est un échelon au parent unique et littéral : la Septante grecque placée sous elle est le texte que Brenton traduisit, imprimé par son propre éditeur à côté de son anglais. Ouvrez un échelon sous l'un de ses versets et le grec apparaît, avec le Codex de Léningrad en dessous comme socle des langues originales. Rien dans le corpus ne repose à son tour sur elle. Notre copie est plus étroite que le livre. Elle compte 37 livres, ceux que le canon hébreu possède aussi sous leurs noms habituels. Les fichiers d'eBible.org dont elle provient contiennent aussi les apocryphes — Tobie, Judith, la Sagesse, le Siracide, Baruch, quatre livres des Maccabées et d'autres — et ne donnent Esther et Daniel que sous leurs formes grecques, plus longues. Rien de tout cela n'est passé dans le corpus : il n'y a donc ici ni Esther ni Daniel, et là où le grec du dessous a Tobie ou la Sagesse, il n'y a pas d'anglais au-dessus. Esdras et Néhémie y forment deux livres, là où le grec du dessous n'en a qu'un. Une mise à jour orthographique de la même traduction, l'Updated Brenton d'Adam Boyd, de 2020, figure dans le corpus comme édition à part entière.

