title=Biblia 1776 — Om denna utgåva | Common Root
description=Biblia 1776: Finlands kyrkobibel i ett och ett halvt sekel, den första finska bibeln tryckt för hemmabruk och fortfarande den bok som det finska ordet ”Biblia” avser.
heroHeading=Biblia 1776
