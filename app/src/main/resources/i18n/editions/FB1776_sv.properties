# The narrative, one paragraph per key, in order.
hero.1=Finlands tredje bibel, och den som blev bestående. Den är en revision och inte en nyöversättning: linjen går via Florinus revision 1683–85 tillbaka till Biblia från 1642, den första fullständiga finska bibeln. Revisionen gjordes av Anders (Antti) Lizelius, som redan 1758 hade utgett en egen bibelupplaga. Vad 1776-utgåvan ändrade var stavningen och därmed räckvidden. Den var den första finska bibeln i moderniserad ortografi och den första som trycktes för hemmabruk och inte bara för predikstolen. En bibel som en familj kan äga är ett annat föremål än en bibel som en församling äger. Utgåvorna däremellan handlade inte bara om stavning. Den som gjorde 1685 års utgåva, prosten Henrik Florinus i Pemar, kunde hebreiska och grekiska och rättade sakinnehållet lika mycket som språket — ordalydelsen flyttade sig mer än ortografin — och de mellanliggande utgåvorna anses ha utfört översättningsarbete också från grundspråken, inte bara städat 1642. Den som jämför 1642 med 1776 ser alltså över två revisioner, inte över en stavningsreform.
hero.2=Den behöll kyrkans bruk i ett och ett halvt sekel, till dess Kirkkoraamattu 1933/38 ersatte den, och den slutade inte läsas när den slutade vara officiell. Två väckelserörelser inom Evangelisk-lutherska kyrkan i Finland, laestadianerna och rukoilevaiset, behöll den och använder den fortfarande. Därför pekar det nakna ordet Biblia på finska hit och inte på någon äldre eller nyare utgåva, och därför kallas boken också Vanha kirkkoraamattu, den gamla kyrkobibeln.
hero.3=I denna läsare är den mitten av den finska kedjan. Öppna ett steg under en vers ur Kirkkoraamattu 1933/38 och denna utgåva träder fram; öppna ett under denna och Biblia från 1642 gör det. De två stegen bör dock läsas olika. Översättarna 1933/38 arbetade från hebreiskan och grekiskan, så steget ovanför är efterträdelse inom en kyrkas bibel och inte härledning. Steget nedanför är verklig härkomst: 1776 är en revision av 1642, och orden på båda sidor av det steget är avsedda att jämföras.
hero.4=En reservation om texten på den här webbplatsen: den är inte 1776 års tryck. Det som står här härstammar från en fritt tillgänglig digital text vars stavning normaliserats av en senare hand och vars redigeringshistoria inte är känd — av dess 31 102 verser innehåller exakt en bokstaven w, medan 1642 års Biblia har 26 862, och w för v är det tydligaste kännetecknet för den ortografi 1776 trycktes med. 1776 moderniserade alltså stavningen från 1642, och den här texten har sedan moderniserats på nytt, vilket lämnar den längre från den tryckta boken än 1776 låg från 1642. Två forskare i äldre finskt skriftspråk frågade vilken version detta var innan de frågade något annat, och frågan var den rätta. Själva 1776 års tryck finns bevarat som sidbilder i Nationalbibliotekets samling från svenska tiden; att sätta en trogen text i dess ställe är ett arbete vi gärna gör.

