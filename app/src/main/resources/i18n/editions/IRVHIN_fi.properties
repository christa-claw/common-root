title=Intialainen tarkistettu käännös — Tietoa tästä laitoksesta | Common Root
description=Intialainen tarkistettu käännös (IRV): Bridge Connectivity Solutionsin vuoden 2019 hindinkielinen raamatunkäännös, käyttöluvalla CC BY-SA 4.0 — hindinkielinen teksti, jolla tämä aineisto oletuksena avautuu.
heroHeading=Intialainen tarkistettu käännös
readerHref=/reader?c1.src=irvhin

hero.1=Intialainen tarkistettu käännös on nykyaikainen hindinkielinen raamatunkäännös, jonka tekijänoikeudet ovat vuosilta 2017 ja 2019 ja joka kuuluu Bridge Connectivity Solutions Pvt. Ltd:lle, intialaiselle raamatunkäännös- ja teknologiaorganisaatiolle. Se kuuluu laajempaan "Intialainen tarkistettu käännös" -sarjaan, jota samainen kustantaja on tuottanut rinnakkain useilla muillakin Intian valtakielillä — muun muassa kannadaksi, tamiliksi, telguksi ja assamiksi — kukin täydellinen raamattu omalla kirjoitusjärjestelmällään, julkaistuna samalla avoimella käyttöluvalla.
hero.2=Common Rootin teksti on peräisin eBible.orgin USFM-jakelusta hindinkielisestä IRV:stä, joka on luetteloitu sivustolla tunnuksella hin2017, eikä aiemmasta digitaalisesta kopiosta samasta käännöksestä, joka oli liikkeellä alaviitetekstin kanssa suoraan jakeiden sisään liimattuna ja kirjojen nimien kanssa hindiksi englannin sijaan. Tuonti uudelleen tuosta USFM-lähteestä korjasi molemmat ongelmat ennen kuin tämä laitos lisättiin tähän — tämä aineisto pitää kirjojen nimet englanniksi sisäisesti, kaikissa laitoksissaan, raamatun omasta kielestä riippumatta.
hero.3=Se on tässä kirjoitettu devanagari-kirjaimin, muodossa इंडियन रिवाइज़्ड वर्ज़न, ja sisältää vakiomuotoisen 66 kirjan protestanttisen kaanonin, ei deuterokanonisia kirjoja.
hero.4=Se on tämän aineiston ainoa hindinkielinen Raamattu, joten hindinkielinen käyttöliittymä avautuu siihen oletuksena.

