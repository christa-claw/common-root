fact.4.label=كُتبت
fact.4.value=في معظمها بعد استقالته من الخدمة المدنية الهندية سنة 1914؛ واكتملت وهو مديرٌ، للمرّة الثانية، لكلية إسلامية في لاهور
fact.5.label=أول نشر
fact.5.value=في ثلاثين جزءاً، 1934-1937، بعنوان "The Holy Qur'an: Text, Translation and Commentary"، نشرها شيخ محمد أشرف، لاهور؛ وطبعة في مجلد واحد سنة 1938
fact.6.label=الشهرة
fact.6.value=إلى جانب [[Q-EN|ترجمة بيكثال]]، واحدة من أكثر ترجمتين إنجليزيتين للقرآن قراءةً، عُرفت بحواشيها الواسعة؛ ونحو ثلاثين طبعة ومراجعة لاحقة منذ ذلك الحين
