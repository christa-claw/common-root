title=القرآن — يوسف علي — عن هذه الطبعة | Common Root
description=ترجمة عبد الله يوسف علي، التي نشرها في أربعة مجلدات بين 1934 و1937 موظفٌ هندي صار عالماً إسلامياً — واحدة من ترجمتين إنجليزيتين فقط للقرآن وُجدتا حرّتي التداول بلا شكّ، وهي في هذه المجموعة ترجمة إنجليزية ثانية مرافقة لترجمة بيكثال.
heroHeading=القرآن — يوسف علي
readerHref=/reader?c1.src=q-ya

# The narrative, one paragraph per key, in order.
hero.1=وُلد عبد الله يوسف علي (1872-1953) في بومباي، وتعلّم أولاً في كلية ويلسون هناك، حيث جعلته تربية دينية إلى جانب تعليمه المدرسي يحفظ القرآن صبياً. ونالت له شهادة بكالوريوس من الدرجة الأولى في الأدب الإنجليزي من جامعة بومباي سنة 1891 منحةً من حكومة الرئاسة إلى بريطانيا، حيث درس الحقوق في كلية سانت جونز بجامعة كامبردج، وتخرّج ببكالوريوس وشهادة في الحقوق سنة 1895، وعاد في تلك السنة نفسها إلى الهند بوظيفة في الخدمة المدنية الهندية.
hero.2=وقضى نحو عقدين في تلك الخدمة — قاضياً جزئياً وموظّف ضرائب، ثم قاضياً، ثم نائباً للسكرتير في وزارة المالية بحكومة الهند — قبل أن يستقيل سنة 1914 ويستقرّ في بريطانيا. وهناك صار أحد أمناء مسجد شاه جيهان في ووكنغ وصندوق مسجد شرق لندن، ونال وسام الإمبراطورية البريطانية سنة 1917 تقديراً لعمله في زمن الحرب، ودرّس الهندستانية في كلية الدراسات الشرقية. وعاد إلى الهند في العشرينيات (1920) والثلاثينيات مديراً لكلية إسلامية في لاهور، وفي أثناء هذه السنوات، بعد أكثر من عقد من العمل، كتب القرآن بالإنجليزية بحواشيه التفسيرية الخاصة.
hero.3=ظهرت الترجمة في ثلاثين جزءاً متتابعاً بين 1934 و1937، صدر أولها في 4 أبريل 1934، بعنوان "The Holy Qur'an: Text, Translation and Commentary"، ونشرها شيخ محمد أشرف من لاهور؛ وتلتها طبعة مجمَّعة في مجلد واحد سنة 1938، وطبعة منقَّحة بين 1939 و1940. وصارت، إلى جانب ترجمة بيكثال، واحدة من أكثر ترجمتين إنجليزيتين للقرآن قراءةً في القرن العشرين، عُرفت قبل كل شيء بسعة حواشيها، وأُعيد نشرها، وأُعيدت صياغة بعضها على أيدي آخرين في مواضع، في نحو ثلاثين طبعة لاحقة — منها طبعة وزّعتها دار أمانة للنشر في أمريكا الشمالية منذ 1977، ومراجَعة بتمويل سعودي في الثمانينيات (1980).
hero.4=وما رُقمن هنا، عبر alquran.cloud، هو نصّ الترجمة نفسه لا حاشية يوسف علي المرافقة له، وهو مُقدَّم في هذه المجموعة ترجمةً إنجليزية ثانية مرافقة لـ[[Q-AR|النصّ العربي العثماني]]، إلى جانب [[Q-EN|ترجمة بيكثال]] سنة 1930. وكانت واحدة من ترجمتين إنجليزيتين فقط وجدها استقصاء للترجمات المتاحة حرّتي التداول بلا شكّ — هذه وترجمة بيكثال — غير أن "بلا شكّ" تحتاج هنا تحفّظاً: فالعمل حرّ التداول في الاتحاد الأوروبي وفي باكستان، حيث توفي يوسف علي وحيث نُشر العمل أولاً، لكن حقّ نشر صوري سُجّل في الولايات المتحدة سنة 1996 يُعتقد أنه يظلّ نافذاً هناك حتى 2033.

