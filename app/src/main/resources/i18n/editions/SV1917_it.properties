title=Svenska 1917 — Su questa edizione | Common Root
description=La traduzione del 1917 della Chiesa di Svezia — Gustav V:s bibel — la prima Bibbia svedese fatta direttamente dall'ebraico e dal greco invece che revisionata da quella precedente, e l'unica Bibbia svedese che questo corpus possiede.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Per tre secoli e mezzo, la Chiesa di Svezia ebbe una sola Bibbia, revisionata ma mai rifatta. La Bibbia di Gustavo Vasa del 1541, la prima Bibbia completa stampata in svedese, si appoggiava molto al tedesco di Martin Lutero. La Bibbia di Gustavo II Adolfo del 1618 la revisionò, e Karl XII:s bibel del 1703 — completata sotto un re benché ordinata da suo padre prima di lui — portò quello stesso svedese ereditato un passo più avanti. Nessuna delle tre tornò a cominciare da capo.
hero.2=Nel 1773 Gustavo III nominò una commissione biblica per fare ciò che nessuna di quelle revisioni aveva fatto: tradurre direttamente dall'ebraico e dal greco invece di far avanzare ancora una volta il vecchio svedese. La commissione sedette per 144 anni. Il suo risultato — la seconda traduzione completa della Bibbia in Svezia, dopo quella di Gustavo Vasa e prima di Bibel 2000 — fu completato e autorizzato sotto Gustavo V nel 1917, e per questo è ancora spesso chiamato Gustav V:s bibel.
hero.3=L'Antico Testamento riposa sul testo ebraico masoretico, come le edizioni precedenti. Il Nuovo Testamento non ne continua la linea: segue il testo greco critico più aggiornato di cui la commissione disponeva verso il 1917, invece del Textus Receptus su cui si fondano le Bibbie della Riforma che questo corpus possiede.
hero.4=In questo lettore è l'unica Bibbia svedese, sicché mettendo l'interfaccia in svedese è su di essa che si apre — non per una scelta curata, come per lo spagnolo è scelta la Reina-Valera 1909, ma perché la scansione del catalogo non trova altro in quella lingua. Non le è registrato alcun antecedente nei pioli della discendenza, sicché un piolo aperto sotto un versetto scende dritto al pavimento delle lingue originali segnato con ≈. Quel pavimento fornisce il Textus Receptus per il greco, e qui ciò si allontana dal vero più del solito: la commissione lasciò deliberatamente il Textus Receptus per un testo critico più aggiornato, sicché il pavimento sotto un versetto di questa traduzione indica un testo greco che non è quello che essa ha davvero seguito.

