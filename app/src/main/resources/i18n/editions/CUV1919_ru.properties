title=Китайский союзный перевод, текст 1919 года — Об этом издании | Common Root
description=Китайский союзный перевод в том виде, в каком он впервые был издан в 1919 году, со старыми начертаниями иероглифов и исходной пунктуацией, в транскрипции китайского Викитекста, с его примечаниями.
heroHeading=Китайский союзный перевод — текст 1919 года
readerHref=/reader?c1.src=cuv1919

# The narrative, one paragraph per key, in order.
hero.1=Это [[CUV|Китайский союзный перевод]] в том виде, в каком он был отпечатан в 1919 году: Библия на мандаринском языке, над которой миссионеры и китайские учёные трудились двадцать девять лет и которая была записана начертаниями того года. Другой союзный перевод в этом читателе — текст таким, каким его читают сегодня, с современной пунктуацией и современным начертанием иероглифов. Этот сохраняет страницу 1919 года.
hero.2=Разницу можно увидеть в иероглифах. Текст 1919 года использует начертания, от которых позднейшие издания отказались, — 爲 там, где в нынешних изданиях стоит 為, а также 愼, 册, 槪, — и он целиком набран традиционными иероглифами. Его пунктуация такая, как она была переписана с издания 1919 года, а не современная пунктуация позднейших изданий. Там, где книга 1919 года печатала подряд идущие стихи как один отрывок, так же поступает и это издание: нумерация стихов сохраняется, а текст помещён при первом стихе отрывка.
hero.3=Текст основан на транскрипции, сделанной китайским Викитекстом, и это издание Шэнь (神版), в котором Бог — 神, а не 上帝. Примечания книги 1919 года сохранены и представлены в этом читателе как заметки к тем стихам, к которым они относятся.
hero.4=Его добавили, чтобы можно было напечатать китайскую Библию по тексту, дата и происхождение которого известны. Издание 1919 года давно вышло из-под действия авторского права. Пунктуированные тексты, появившиеся после него, с 1988 года и далее, — отдельный вопрос, и поэтому их держат раздельно.

