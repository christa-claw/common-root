title=Literal Standard Version — Об этом издании | Common Root
description=Literal Standard Version: переработка 2020 года, выполненная Covenant Press на основе Literal Translation Роберта Янга XIX века, с целью дать максимально последовательно буквальную английскую передачу еврейского, арамейского и греческого текста, какую допускает удобочитаемый английский язык.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version представляется как масштабная переработка Literal Translation Роберта Янга — предельно буквального английского перевода Библии XIX века, впервые изданного в 1862 году и пересмотренного самим Янгом в 1887 и 1898 годах. Covenant Press, издательское подразделение Covenant Christian Coalition, начало новую переработку в начале 2018 года с заявленной целью сохранить присущую Янгу верность пословному буквализму, одновременно обновив английский язык и исправив места, где более поздние рукописные и лексические исследования продвинулись вперёд. Работа была завершена и опубликована 2 февраля 2020 года; авторское право в США было зарегистрировано в январе того же года, а электронные издания последовали в мае того же года. Отдельные переводчики не названы в опубликованном издании; в качестве организаций-заказчиков указаны Covenant Press и Covenant Christian Coalition.
hero.2=Для Ветхого Завета LSV следует масоретскому тексту, с существенным влиянием Септуагинты и отдельными обращениями к свиткам Мёртвого моря, когда их чтения казались достаточно ясными, чтобы им отдать предпочтение. Для Нового Завета она следует Textus Receptus и Большинству текстов (Majority Text), принимая александрийские чтения лишь в конкретных, прямо указанных случаях, а не как общее правило. Переводчики установили три руководящих принципа: сохранять глагольное время оригинала там, где это позволяет английский язык, передавать данное слово оригинала одним и тем же английским словом там, где это возможно для единообразия, и сохранять порядок слов оригинала, кроме случаев, когда удобочитаемость английского действительно требует изменения. Божественное имя Ветхого Завета транслитерируется, а не передаётся титулом вроде «ГОСПОДЬ», что согласуется с общим стремлением этого перевода показывать читателю собственные решения исходного текста, а не сглаживать их.
hero.3=Связь с этим собранием носит текстовый, а не генеалогический характер: Новый Завет Literal Standard Version опирается на Textus Receptus и Большинство текстов — ту же греческую основу, которую это собрание хранит отдельно и полностью как Textus Receptus — текст, лежащий в основе King James Version и в целом традиции эпохи Реформации. Никакая ступень родословной не связывает эти два издания, поскольку LSV представлена как переработка Literal Translation Янга, а не самого Textus Receptus или любого другого текста, хранящегося здесь; поэтому ступень, открытая под стихом LSV, ведёт прямо к полу оригинального языка, отмеченному ≈. Она издаётся по лицензии Creative Commons Attribution-ShareAlike 4.0, а не передана в общественное достояние, что ставит её рядом с New International Version и New American Standard Bible как лицензированную, а не свободно копируемую — хотя на заметно более мягких условиях, чем у обеих. Английский интерфейс по умолчанию открывается на New International Version; это издание достигается со своей собственной карточки.

