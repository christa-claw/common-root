fact.9.value=Лицензирована, а не передана в общественное достояние, наряду с [[NIV|New International Version]] и [[NASB|New American Standard Bible]] — лицензирована, а не свободно копируема, хотя на заметно более мягких условиях, чем у обеих. В ступенях родословной не записано родителя: она представлена как переработка Literal Translation Роберта Янга, которая сама не хранится в этом собрании, так что ступень под стихом LSV ведёт прямо к полу оригинального языка, отмеченному ≈. Английский интерфейс по умолчанию открывается на New International Version; это издание достигается со своей собственной карточки.
