title=King James Version — Über diese Ausgabe | Common Root
description=Die King James Version von 1611: siebenundvierzig Übersetzer in sechs Gruppen, angewiesen, die Bishops' Bible zu revidieren statt neu anzufangen — und in diesem Korpus der Achtzig-Bücher-Text, der noch die Apokryphen der Erstausgabe führt.
heroHeading=King James Version
readerHref=/reader?c1.src=kjv

# The narrative, one paragraph per key, in order.
hero.1=Sie begann als Zugeständnis auf einer Versammlung, die etwas anderem galt. Auf der Hampton-Court-Konferenz von 1604, die Jakob I. einberufen hatte, um puritanische Beschwerden über das Gebetbuch zu hören, kam der Vorschlag einer neuen Übersetzung auf, und der König griff ihn auf. Siebenundvierzig Gelehrte wurden berufen und in sechs Gruppen geteilt — zwei in Westminster, zwei in Oxford, zwei in Cambridge —, jede mit ihrem Abschnitt der Bibel und einem Regelwerk, nach dem zu arbeiten war. Die erste dieser Regeln ist beim Lesen die wichtigste: Sie sollten der Bishops' Bible von 1568 folgen und sie nur ändern, soweit der Urtext es verlangte. Dies wurde als Revision in Auftrag gegeben und nicht als neue Übersetzung, und so liest es sich auch. Robert Barker, der Drucker des Königs, brachte das fertige Buch 1611 in London heraus.
hero.2=Was die Regeln nicht sagten und die Übersetzer dennoch taten, war, immer wieder hinter die Bishops' Bible zurückzugreifen. Das Englisch, das sie erbten, hatten andere gemacht — vor allem Tyndale, und die Genfer Bibel, die eine ganze Generation englischer Leser tatsächlich besaß und zu Hause las. Dieses Korpus verzeichnet diese Schuld, statt sie der Einleitung zu überlassen: die Vorlagen der King James Version sind hier [[GNV|die Genfer Bibel]], mit dem überlieferten griechischen Text und dem masoretischen Hebräisch darunter. Öffnet man eine Abstammungssprosse unter einem King-James-Vers, kommt Genf herauf. Die beiden liegen Vers für Vers so nah beieinander, dass die interessante Frage nicht mehr lautet, ob Genf benutzt wurde, sondern wo die Gruppen von 1611 sich entschieden, davon abzuweichen — und das lässt sich nun ansehen, statt es zu glauben.
hero.3=Ein Unterschied zwischen dieser King James und den meisten anderen betrifft das, was darin steht. Der Text umfasst hier achtzig Bücher und 36.820 Verse: das Alte und das Neue Testament und die vierzehn Bücher der Apokryphen, dazwischen gedruckt, so wie der Band von 1611 sie druckte. Fast jede heute verkaufte King-James-Bibel hat sechsundsechzig. Das Korpus behält die längere Gestalt, und die Wirkung zeigt sich entlang der verzeichneten Kette: [[GNV|die Genfer Bibel]] hat hier sechsundsechzig Bücher, diese achtzig, [[RV|die Revised Version]] darüber achtzig und [[ASV|die American Standard Version]] darüber wieder sechsundsechzig. Ob eine Ausgabe die Apokryphen druckt, ist eine Entscheidung, die jede für sich getroffen hat, und sie in eine Spalte zu stellen macht das Muster lesbar.
hero.4=Man sei genau darin, was die Jahreszahl auf der Karte bedeutet. Dort steht 1611, und das ist das Datum der Übersetzung — es ist keine Behauptung darüber, welcher Druck dieser Text ist. Das Englische ist hier in der Schreibung modernisiert: Die Genesis beginnt „In the beginning God created the heaven and the earth“, wo die Bogen von 1611 „In the beginning God created the Heauen, and the Earth“ lasen. Dies ist also die King James, wie spätere Drucker sie vereinheitlichten, und der bestimmte Druck, von dem sie abstammt, ist nicht verzeichnet — dieselbe ehrliche Lücke, die das Korpus bei [[FB1776|Biblia 1776]] lässt. Für das Lesen der Entscheidungen der Übersetzer macht das nichts aus; für das Zitieren des Buches von 1611 als Gegenstand macht es alles aus. Zu beachten ist auch, dass dies nicht die Ausgabe ist, mit der eine englische Oberfläche öffnet: das ist [[NIV|die New International Version]], und die King James ist eine, zu der man wechselt.

