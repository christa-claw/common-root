title=摩尔门经 — 关于此版本 | Common Root
description=《摩尔门经》：约瑟·斯密于1830年口述记录的古代美洲先知史书，印行于纽约州帕尔迈拉，被末世圣徒视为与《圣经》并行的经典。
heroHeading=摩尔门经
readerHref=/reader?c1.src=bom

hero.1=约瑟·斯密说，他是"借着上帝的恩赐与大能"翻译出这部书的，译自一套古代金属版片；他说自己于1827年在家族位于纽约州帕尔迈拉郊外的农场附近找到这些版片，后来又将其归还给向他展示这些版片的使者。目击口译过程的人描述，他曾察看一块先见石——在翻译工作的后期阶段，是一块他放入帽子中以遮挡光线的石头，而不仅是传统上称为乌陵和土明、据说与版片一同送来、固定在胸牌上的那一对石头——并一边口述文字，一边由一名文书记录下来。奥利弗·考德里在1829年用约两个月的时间以这种方式记录下大部分内容，主要是在纽约州费耶特的惠特默家族农场；约瑟的妻子艾玛·斯密与马丁·哈里斯曾在更早、更短的阶段担任文书。
hero.2=手稿在当年即送去印刷。斯密于1829年6月为这部作品取得版权，印刷工作在纽约州帕尔迈拉的埃格伯特·B·格兰丁印刷所开始，排字工约翰·H·吉尔伯特为口述手稿中原本没有的标点和分段加以补充。成书于1830年3月问世：约5,000册，是格兰丁的全部印数。
hero.3=全书分为15卷，从《尼腓一书》到《摩罗乃书》，每卷都以据称负责编纂该卷的先知记录者命名。1830年版的任何一册都没有节号——文本以连续的段落形式排列，章节比今天读者所见的要长得多。今天通行的章节与经节划分，源自奥森·普拉特于1879年编订的版本；他同时缩短了各章，并加入了最早的脚注。后来的版本进一步改变了呈现方式：1920年，由乔治·F·理查兹领导的委员会将文本排成双栏，并加入了章节提要和发音指南；1981年版更新了交叉引用、章节标题及其他参考资料；2013年版则纠正了自1981年以来印版中累积出现的排印不一致之处。
hero.4=它是末世圣徒运动所称的四部标准经典之一，与《圣经》、《[[DC|教义和圣约]]》及《[[PGP|无价珍珠]]》并列。本语料库中的文本来自Mormon Documentation Project的JSON数据导出，其维护者已将其声明为公共领域；文本及经节划分遵循现行标准版本的措辞，并采用2013年版的排印修正，省去了仍受版权保护的脚注、章节提要与导言。由于这里保存的正是这一现行标准文本，而非某一具体的历史印本，因此未为其标注单一的出版年份。

