fact.4.label=Koottu
fact.4.value=pääosin Mekan Pyhässä moskeijassa ja Medinan Profeetan moskeijassa; valmistui Buharassa noin vuonna 232 AH (846 jaa.)
fact.5.label=Menetelmä
fact.5.value=hyväksyy hadithin vain, jos sillä on katkeamaton ketju välittäjiä, jotka al-Bukhari arvioi luotettaviksi; hänen kerrotaan valinneen kokoelman noin 600 000 tutkimansa kertomuksen joukosta
fact.6.label=Asema
fact.6.value=ensimmäinen sunni-islamin Kuudesta kirjasta (Kutub al-Sittah); yhdessä [[MUS|Sahih Muslimin]] kanssa "Sahihayn" — näitä kahta kokoelmaa pidetään arvovaltaisimpina heti Koraanin jälkeen
fact.7.label=Hadith-määrä
fact.7.value=7 563 toistoineen laajasti käytetyssä Abd al-Baqin numeroinnissa, tai 2 602 toistoitta Ibn Hajar al-Asqalanin laskennan mukaan; painetut laitokset eroavat sekä luku- että hadith-numeroinnissa
fact.8.label=Tässä aineistossa
fact.8.value=98 kirjaa (kutub) ja 7 589 numeroitua hadithia — lähdeaineiston oman muodon mukaisesti, ei minkään yksittäisen painetun numeroinnin toistona
fact.9.label=Englanninkielinen käännös
fact.9.value=otettu fawazahmed0/hadith-api:n eng-bukhari-laitoksesta, näytetään arabiankielisen tekstin rinnalla; mistä julkaistusta käännöksestä se on peräisin, ei ole tämän aineiston puolesta vielä varmistettu
fact.10.label=Käyttöoikeus
fact.10.value=arabiankielinen matn on klassinen, vapaasti käytettävä teksti; englanninkielisen käännöksen käyttöoikeus on edelleen tarkistuksessa
