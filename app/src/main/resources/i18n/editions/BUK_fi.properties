title=Sahih al-Bukhari — Tietoja tästä laitoksesta | Common Root
description=Sahih al-Bukhari: hadith-kokoelma, jota sunnimuslimit pitävät arvovaltaisimpana heti Koraanin jälkeen; Muhammad al-Bukhari kokosi sen noin 600 000 tutkimansa kertomuksen joukosta, hyväksyen mukaan vain ne, joiden kerrontaketju luotettavista välittäjistä oli katkeamaton.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismail al-Bukhari kokosi tämän kokoelman pääosin kahdessa moskeijassa — Mekan Pyhässä moskeijassa ja Medinan Profeetan moskeijassa — ja sai sen valmiiksi kotikaupungissaan Buharassa noin vuonna 232 AH (846 jaa.); hän käytti suunnilleen elämänsä kaksi viimeistä vuosikymmentä sen tarkistamiseen matkojensa aikana. Teoksen täydellinen nimi, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, lyhennetään tavallisesti Sahih al-Bukhariksi — "al-Bukharin luotettava [kokoelma]". Al-Bukharin itsensä kerrotaan sanoneen valinneensa sen noin 600 000 tutkimansa hadith-kertomuksen joukosta, hyväksyen kertomuksen mukaan vain, kun sillä oli hänen arvionsa mukaan katkeamaton ketju luotettavia välittäjiä alkuperäiseen lähteeseen asti.
hero.2=Tämä vaatimustaso selittää, miksi teoksella on se painoarvo, joka sillä on. Sahih al-Bukhari lasketaan ensimmäiseksi sunni-islamin Kuudesta kirjasta (Kutub al-Sittah), ja yhdessä Sahih Muslimin — menetelmältään ja arvostukseltaan läheisimmän kilpailijansa — kanssa näitä kahta kutsutaan nimellä Sahihayn, "kaksi luotettavaa". Useimmat sunnioppineet asettavat Bukharin kokoelman kaikkien muiden hadith-kirjojen edelle ja arvovallaltaan toiseksi heti Koraanin jälkeen, vaikka vähemmistö oppineista on puoltanut Sahih Muslimin etusijaa. Aineisto on järjestetty aiheittain eikä kertojan tai ajan mukaan (sitä kutsutaan oppineiden kesken musannaf-muodoksi), ja se jakautuu kirjoihin (kutub), jotka etenevät rituaalisesta puhdistautumisesta ja rukouksesta kaupankäyntiin ja avioliittoon sekä aiempien profeettojen elämään ja Viimeisen hetken merkkeihin.
hero.3=Se, montako hadithia kirja tarkalleen sisältää, riippuu siitä, minkä painoperinteen mukaan lasketaan. Nykyisin useimmin mainittu luku, 7 563, on peräisin numeroinnista, jonka toimittaja Muhammad Fu'ad Abd al-Baqi antoi tekstille 1900-luvulla, ja se laskee hadithin uudelleen aina, kun se toistuu toisen luvun alla; toistot poistettuna Ibn Hajar al-Asqalani laski 2 602. Muitakin kokonaislukuja on esitetty. Tämän aineiston oma lukumäärä on jälleen kolmas luku: 98 kirjaa ja 7 589 numeroitua hadithia, joka on yksinkertaisesti sen digitaalisen laitoksen muoto, josta se on peräisin, ei väite minkään yksittäisen painetun numeroinnin toistamisesta.
hero.4=Arabiankielinen teksti tässä on klassinen matn, vapaasti käytettävissä (public domain). Sen alla lukijassa on englanninkielinen käännös, joka on otettu fawazahmed0/hadith-api:n eng-bukhari-laitoksesta ja kohdistettu hadith hadithilta arabiankieliseen tekstiin, niin että niitä voi lukea parina — samaa rinnakkaisjärjestelyä, jota tämä aineisto käyttää Koraani-käännöksissään. Mistä julkaistusta englanninkielisestä käännöksestä tämä tiedosto itse on peräisin, ei ole tämän aineiston puolesta varmistettu, minkä vuoksi sen käyttöoikeus on merkitty tarkistuksessa olevaksi eikä suoraan vapaasti käytettäväksi; yllä oleva arabiankielinen teksti ei kanna samaa epävarmuutta.

