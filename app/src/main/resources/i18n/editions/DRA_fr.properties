title=Douay-Rheims 1899 — À propos de cette édition | Common Root
description=La Bible de Douay-Rheims : la traduction catholique anglaise faite sur la Vulgate latine à Reims en 1582 et à Douai en 1609-10, révisée par l'évêque Challoner, dans le tirage de Baltimore de 1899.
heroHeading=Douay-Rheims 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=En 1568, un groupe de catholiques anglais, beaucoup d'entre eux gens d'Oxford qui ne pouvaient plus garder leurs charges, fonda un collège à Douai, en Flandre, sous la direction de William Allen. Une part de sa raison d'être était de mettre une Bible anglaise entre des mains catholiques, car les seules Bibles anglaises alors en circulation étaient protestantes et servaient dans la controverse. Gregory Martin commença à traduire en octobre 1578, au rythme d'environ deux chapitres par jour, et le Nouveau Testament parut en 1582 à Reims, où le collège s'était provisoirement déplacé. Martin mourut le 28 octobre de la même année, quelques semaines après la parution de son Nouveau Testament. L'Ancien Testament était prêt en même temps et resta ensuite sans être imprimé, pour la raison toute simple que le collège n'avait pas de quoi l'imprimer ; il parut enfin en deux volumes en 1609 et 1610, alors que la Bible du roi Jacques n'était plus qu'à deux ans.
hero.2=Ce qui la sépare de toute autre Bible anglaise de ce corpus, c'est ce dont elle a été faite. Non de l'hébreu et du grec : de la Vulgate latine. Le concile de Trente avait déclaré la Vulgate texte authentique de l'Église, et les traducteurs de Douai ajoutaient que Jérôme avait travaillé sur des manuscrits plus anciens qu'aucune copie grecque à leur portée — ce qui, pour l'Ancien Testament, n'était pas une idée déraisonnable vers 1600. La prose qui en résulte est lourdement latinisée, parfois au point de n'être plus de l'anglais du tout : le Notre Père demande du « supersubstantial bread », parce que les traducteurs ne voulaient pas naturaliser un mot sur lequel reposait la théologie. C'était un parti pris, non une incapacité.
hero.3=Au milieu du dix-huitième siècle, presque personne ne pouvait plus la lire, et l'évêque Richard Challoner la révisa entre 1749 et 1752 — profondément, et largement dans le sens de la Bible du roi Jacques, qui était alors tout simplement ce à quoi ressemblait l'Écriture en anglais. Toute bible vendue aujourd'hui comme Douay-Rheims est le texte de Challoner et non celui de Martin. Celle-ci est le tirage américain de 1899, de la John Murphy Company de Baltimore, portant l'imprimatur du cardinal James Gibbons ; comme ce tirage est depuis longtemps libre de droits, c'est lui qu'on a scanné, saisi et reproduit depuis, et c'est ce que presque toute Douay-Rheims numérique est en réalité.
hero.4=Dans ce lecteur, elle fait quelque chose que presque aucune autre édition d'ici ne peut faire. Son ascendant enregistré est présent dans le corpus : ouvrez un échelon de filiation sous un verset de la Douay-Rheims et l'échelon du dessous est la Vulgate latine elle-même, le texte dont elle a effectivement été traduite, au lieu du sol des langues originales marqué ≈ auquel la plupart des éditions aboutissent. C'est exactement le cas pour lequel le mécanisme d'échelons a été construit. L'influence a aussi joué dans l'autre sens — le Nouveau Testament de Reims était sur les tables des traducteurs du roi Jacques, et une bonne part de son vocabulaire latinisé est passée dans leur travail — mais la liste de filiation ne retient que les lignes formelles de révision, de sorte que cette dette n'y est pas enregistrée. Une inversion à noter : sa pastille d'échelon affiche l'année 1899 tandis que la fiche du catalogue n'affiche aucune année. Les années d'échelon sont une liste tenue à la main et la fiche lit les métadonnées propres au catalogue ; là où une édition figure dans l'une et non dans l'autre, les deux se contredisent en public.
hero.5=Un avertissement sur le canon. Le texte conservé ici compte 72 livres, et non les 73 d'une bible catholique imprimée. Les six livres deutérocanoniques qu'il porte — Tobie, Judith, 1 et 2 Maccabées, la Sagesse et le Siracide — se trouvent après l'Apocalypse au lieu de leurs places catholiques, et Baruch manque tout à fait. C'est une propriété du texte numérique tel qu'il a été intégré, non du livre de 1899, et cela signifie que cette colonne se lira correctement verset par verset mais ne doit pas servir à vérifier ce que contient le canon catholique.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=anglais — la tradition catholique
fact.2.label=Traduite d'après
fact.2.value=la Vulgate latine, non l'hébreu et le grec — la même [[VUL|Vulgate]] que garde ce corpus
fact.3.label=Nouveau Testament
fact.3.value=Reims, 1582 — principalement l'œuvre de Gregory Martin, avec William Allen, Richard Bristow et Thomas Worthington
fact.4.label=Ancien Testament
fact.4.value=Douai, 1609 et 1610, en deux volumes — achevé en même temps que le Nouveau Testament mais retenu près de trente ans faute d'argent pour l'imprimer
fact.5.label=Révisée par
fact.5.value=l'évêque Richard Challoner, 1749-1752 — tout livre vendu aujourd'hui comme Douay-Rheims est la révision de Challoner, non le texte de 1582/1610
fact.6.label=Ce tirage
fact.6.value=l'édition américaine de 1899 de la John Murphy Company, Baltimore, avec l'imprimatur du cardinal James Gibbons — libre de droits depuis longtemps, et la version qui circule sous forme numérique
fact.7.label=Contenu ici
fact.7.value=72 livres : les 66 du canon protestant dans l'ordre protestant, avec Tobie, Judith, 1 et 2 Maccabées, la Sagesse et le Siracide ajoutés après l'Apocalypse. Baruch est absent, de sorte que cette colonne n'est pas un contrôle fiable du canon catholique
fact.8.label=Filiation
fact.8.value=l'une des rares éditions d'ici dont l'ascendant enregistré est lui-même dans le corpus — un échelon sous un verset de la Douay-Rheims ouvre sur [[VUL|la Vulgate latine]] plutôt que sur le sol des langues originales
fact.9.label=Dans ce corpus
fact.9.value=sa pastille d'échelon porte l'année 1899 alors que la fiche du catalogue laisse l'année vide ; les années d'échelon sont une liste tenue à part, et les deux ont le droit de diverger
