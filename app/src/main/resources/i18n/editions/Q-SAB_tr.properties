title=Kur'an — Sablukov — Bu Baskı Hakkında | Common Root
description=Gordiy Sablukov'un Rusça çevirisi, 1878'de Kazan'da yayımlandı ve genellikle Fransızca veya İngilizce bir aracı üzerinden değil, doğrudan Arapçadan yapılan ilk Rusça Kur'an çevirisi olarak tanımlanır — bu derlemede Osmanlı mushaf metninin altında gösterilen Rusça eşlik eden çeviridir.
heroHeading=Kur'an — Sablukov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordiy Semyonoviç Sablukov (1803-1880), Rus Ortodoks din adamlığı için eğitim aldı; 1826'da Orenburg İlahiyat Semineri'nden ve 1830'da Moskova İlahiyat Akademisi'nden mezun oldu. Sonraki yirmi yılı, 1830'dan 1849'a kadar, Saratov İlahiyat Semineri'nde tarih ve doğu dilleri öğreterek geçirdi — 1840'ların ortasında öğrencilerinden biri, gelecekte radikal bir yazar olacak Nikolay Çernişevski'ydi — ve 1849'da Kazan İlahiyat Akademisi'nin misyonerlik bölümüne geçerek 1862'ye kadar orada doğu ve klasik diller öğretti.
hero.2=Rusça Kur'an çevirileri 1716'ya kadar uzanır; o yıl Pyotr Postnikov, Büyük Petro'nun emriyle bir çeviri yaptı — ancak bu, Arapçadan değil, André du Ryer'in Fransızca çevirisinden yapılmıştı; aynı şekilde Aleksey Kolmakov'un 1792 tarihli çevirisi de George Sale'in İngilizce çevirisinden yapılmıştı. Sablukov'un çevirisi, 1878'de Kazan'da "Коран, законодательная книга мохаммеданского вероучения" ("Kur'an, Muhammedî İnancın Yasama Kitabı") başlığıyla yayımlandı ve genellikle doğrudan Arapça aslından yapılan ilk Rusça Kur'an çevirisi olarak kabul edilir; bu, onun Kazan'da doğu dilleri öğretmenliği yaptığı yılların ürünüdür.
hero.3=Ertesi yıl bunu bir notlar cildiyle, "Приложения к переводу Корана" (1879), tamamladı; daha sonra bununla ilgili iki çalışma daha yazdı: "Сведения о Коране" ("Kur'an Hakkında Bilgiler," 1884) ve Hristiyan ile Müslüman öğretilerinin Tanrı'nın adları konusundaki karşılaştırmasına dair daha önceki bir risale (1873). Çevirisi, o zamandan beri en çok dolaşımda olan Rusça versiyonlardan biri olarak kalmıştır; bu, daha sonraki çeviriler — bunlar arasında İgnatiy Kraçkovskiy'nin ölümünden sonra yayımlanan çevirisi de vardır — Sovyet ve Sovyet sonrası akademik kullanımda daha tanınır hale geldikten sonra da sürmüştür.
hero.4=Burada alquran.cloud'un ru.sablukov baskısı üzerinden dijitalleştirilen metin, bu derlemede [[Q-AR|Osmanlı mushaf metninin]] Rusça eşlik eden çevirisi olarak, 1930 tarihli [[Q-EN|Pickthall]] ve 1934 tarihli [[Q-YA|Yusuf Ali]] İngilizce çevirilerinin yanında sunulur — mevcut çevirilerin bir taramasının Arapça dışında her dil için birer örnek olarak açıkça serbestçe kullanılabilir bulduğu üç çeviriden biridir.

