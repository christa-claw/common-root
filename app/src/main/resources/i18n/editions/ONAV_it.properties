title=Open New Arabic Version — Su questa edizione | Common Root
description=L'Open New Arabic Version di Biblica: una Bibbia araba moderna, con copyright del 1988, 1997 e 2012, pubblicata con una licenza Creative Commons che ne permette la condivisione, l'adattamento e la stampa con attribuzione.
heroHeading=L'Open New Arabic Version di Biblica
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Questa è una traduzione araba moderna, un testo diverso da [[SVD|Smith & Van Dyck]] e non un'altra copia di esso. È pubblicata da Biblica, Inc., il cui avviso di copyright porta tre anni: 1988, 1997 e 2012. La stessa pagina di copyright del testo ne dà il nome più antico, Ketab El Hayat Majani.
hero.2=Ciò che lo distingue in questo lettore è la sua licenza. Biblica lo ha pubblicato come testo «aperto» sotto la licenza Creative Commons Attribuzione-Condividi allo stesso modo 4.0: chiunque può copiarlo, adattarlo e stamparlo, purché Biblica sia accreditata e tutto ciò che ne derivi sia condiviso alle stesse condizioni. Il testo di credito che Biblica richiede è: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". La maggior parte delle traduzioni moderne non è offerta in questo modo, ed è per questo che si trova qui.
hero.3=La licenza ha una condizione che vale la pena conoscere. Il testo non modificato può portare il nome Biblica. Un testo riordinato non può: le edizioni in Ordine degli eventi e Ordine di stesura di questo sito dispongono i libri in una sequenza diversa, il che trattiamo come un adattamento, perciò dichiarano che il testo è stato riordinato e non usano il nome Biblica come titolo.
hero.4=Il file è completamente vocalizzato. Un dettaglio della sua fonte: Atti 15,25 e 26 sono stampati come un unico versetto, cosicché il corpus li mantiene insieme sotto il versetto 25 e lì non ha un versetto 26 separato.

