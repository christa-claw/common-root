title=Дарби 1885 (французская) — Об этом издании | Common Root
description=Французская Библия Дарби 1885 года: перевод Пау и Веве, начатый в 1859 году Джоном Нельсоном Дарби и его сотрудниками и законченный через три года после его смерти, — и та версия, из которой затем был построен его английский Ветхий Завет.
heroHeading=Дарби 1885 (французская)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=Джона Нельсона Дарби помнят за другое — он покинул Ирландскую церковь, участвовал в основании Плимутских братьев и пустил в оборот диспенсационалистский премилленаризм, — но немалую часть жизни он переводил Библию, и делал это на трёх языках. Необычен в нём порядок. Большинство переводчиков работает наружу от собственного языка. Английская Библия Дарби была закончена последней из трёх, и её Ветхий Завет он сделал не прямо с еврейского, а из французской и немецкой версий, которые уже подготовил вместе с другими.
hero.2=Вот французская. Дарби был главным учёным, но никогда единственным переводчиком чего бы то ни было, что носит его имя; во французскую группу входили Уильям Джозеф Лоу и Пьер Шлюмберже. Новый Завет вышел в 1859 году и за следующие два десятилетия переиздавался трижды. Полная Библия появилась в 1885 году в Пау и Веве — отсюда имя, под которым её обычно знают, — хотя титульный лист слегка вводит в заблуждение: Пау лежит на крайнем юге Франции, а работа делалась главным образом для собраний братьев французской Швейцарии. Дарби умер в 1882 году и законченной книги не увидел.
hero.3=Перевод буквален по принципу, и Дарби прямо сказал почему в предисловии к своему немецкому Новому Завету: учёный может справиться с подлинником, поэтому смысл перевода — вложить как можно более точное его отображение в руки тех, кто не может. Он предупреждал и о том, что более вольная передача теряет значения, которых сам переводчик, быть может, не уловил. Итог точен и неукрашен и никогда не предназначался для чтения вслух — в собственной проповеди Дарби пользовался King James Version.
hero.4=Две вещи связывают её с остальным собранием. Немецкая Библия Дарби — это Эльберфельдская, которая есть здесь как Elberfelder 1905: тот же человек, те же принципы и один из двух текстов, из которых был собран его английский Ветхий Завет, так что французская и немецкая карточки — родня более близкая, чем позволяют думать их разные языки. А обращение с именем Божиим ставит её рядом с American Standard Version, которая тысячи раз печатает “Jehovah” там, где King James Version печатает “the LORD”; Дарби принял то же решение первым, на трёх языках. В читалке это единственная французская Библия, так что французский интерфейс открывает её. В ступенях родословия источник для неё не записан, и в отличие от большинства датированных изданий здесь метка её ступени не несёт года вовсе — каталожная карточка показывает 1885, но ступенные годы — отдельный, составленный вручную список, и этого издания в нём пока нет.

