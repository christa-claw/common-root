fact.1.label=Язык
fact.1.value=французский
fact.2.label=Известна также как
fact.2.value=Библия Пау–Веве, по двум городам на титульном листе
fact.3.label=Главный учёный
fact.3.value=Джон Нельсон Дарби (1800–1882), в работе с Уильямом Джозефом Лоу и Пьером Шлюмберже — единственным переводчиком он не был ни в одной из версий, носящих его имя
fact.4.label=Новый Завет
fact.4.value=впервые издан в 1859 году, переиздан в 1872, 1875 и 1878 годах
fact.5.label=Полная Библия
fact.5.value=1885 год, издана в Пау и Веве — через три года после смерти Дарби
fact.6.label=Сделана для
fact.6.value=собраний братьев, прежде всего французской Швейцарии, а не самого Пау
fact.7.label=Род перевода
fact.7.value=намеренно буквальный, сделанный для частного изучения, а не для чтения вслух; имя Божие передаётся «l'Éternel», а не оставляется как «le Seigneur»
fact.8.label=Сестринские версии
fact.8.value=немецкая Библия Дарби — Эльберфельдская, в этом собрании как [[ELB|Elberfelder 1905]]; английский Ветхий Завет Дарби сделан из французской и немецкой работы, а не прямо из собственного английского Дарби
fact.9.label=Состав
fact.9.value=66 книг — протестантский канон, без второканонических
fact.10.label=В этом собрании
fact.10.value=единственная французская Библия здесь, так что французский интерфейс открывает её; в ступенях родословия источник не записан, а метка ступени отображается без года, хотя каталожная карточка показывает 1885
