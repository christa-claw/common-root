title=Indisk reviderad version — Om denna utgåva | Common Root
description=Indisk reviderad version (IRV): en hindisk bibelöversättning från 2019 utgiven av Bridge Connectivity Solutions, licensierad CC BY-SA 4.0 — den hindiska text som detta korpus öppnas på som standard.
heroHeading=Indisk reviderad version
readerHref=/reader?c1.src=irvhin

hero.1=Indisk reviderad version är en modern hindisk bibelöversättning, med upphovsrätt från 2017 och 2019 som tillhör Bridge Connectivity Solutions Pvt. Ltd., en indisk organisation för bibelöversättning och teknik. Den ingår i en bredare serie "Indisk reviderad version" som samma utgivare har tagit fram parallellt på flera andra av Indiens stora språk — bland andra kannada, tamil, telugu och assamesiska — var och en en komplett bibel på sitt eget skriftsystem, utgiven under samma öppna licens.
hero.2=Common Roots text kommer från eBible.orgs USFM-distribution av den hindiska IRV, katalogiserad där som hin2017, snarare än från en tidigare digital kopia av samma översättning som cirkulerade med fotnotstext klistrad direkt in i verserna och med bokernas namn på hindi i stället för engelska. Att importera på nytt från den USFM-källan rättade båda problemen innan utgåvan lades till här — detta korpus håller bokernas namn på engelska internt, i alla sina utgåvor, oavsett bibelns eget språk.
hero.3=Den är här skriven med devanagariskrift, som इंडियन रिवाइज़्ड वर्ज़न, och innehåller den vanliga protestantiska kanon på 66 böcker, utan deuterokanoniska skrifter.
hero.4=Den är den enda hindiska bibeln i detta korpus, så ett hindiskt gränssnitt öppnas på den som standard.

