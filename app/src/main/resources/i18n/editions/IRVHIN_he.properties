title=הגרסה ההודית המתוקנת — על המהדורה הזו | Common Root
description=הגרסה ההודית המתוקנת (IRV): תרגום מקרא להינדי משנת 2019 בהוצאת Bridge Connectivity Solutions, ברישיון CC BY-SA 4.0 — הטקסט ההינדי שבו נפתח אוסף זה כברירת מחדל.
heroHeading=הגרסה ההודית המתוקנת
readerHref=/reader?c1.src=irvhin

hero.1=הגרסה ההודית המתוקנת היא תרגום מקרא מודרני להינדי, שזכויות היוצרים בו מתוארכות לשנים 2017 ו-2019 ושייכות לחברת Bridge Connectivity Solutions Pvt. Ltd., גוף הודי לתרגום המקרא ולטכנולוגיה. היא חלק מסדרה רחבה יותר בשם "הגרסה ההודית המתוקנת" שאותו מוציא לאור הפיק במקביל בכמה משפות הודו המרכזיות האחרות — ביניהן קאנדה, טאמיל, טלוגו ואסאמית — כל אחת מהן מקרא שלם בכתב שלה, שפורסם ברישיון הפתוח הזהה.
hero.2=הטקסט של Common Root מגיע מהפצת ה-USFM של eBible.org לגרסת IRV ההינדית, המקוטלגת שם בשם hin2017, ולא מעותק דיגיטלי מוקדם יותר של אותו תרגום שהיה בתפוצה עם טקסט הערות שוליים שהוטמע ישירות בתוך הפסוקים, ועם שמות ספרים בהינדי במקום באנגלית. ייבוא מחדש ממקור ה-USFM הזה תיקן את שתי הבעיות לפני שמהדורה זו נוספה כאן — האוסף הזה שומר את שמות הספרים באנגלית באופן פנימי, בכל מהדורותיו, ללא קשר לשפתו של המקרא עצמו.
hero.3=היא כתובה כאן בכתב דוואנאגרי, כ-इंडियन रिवाइज़्ड वर्ज़न, וכוללת את הקנון הפרוטסטנטי הרגיל של 66 ספרים, ללא ספרים דאוטרוקנוניים.
hero.4=זהו המקרא היחיד בהינדי באוסף זה, ולכן ממשק בהינדי נפתח בו כברירת מחדל.

