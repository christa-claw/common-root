title=Luther Bibel 1545 — इस संस्करण के बारे में | Common Root
description=लूथर की Ausgabe letzter Hand: 1545 की विटेनबर्ग बाइबल, अंतिम संस्करण जिसे मार्टिन लूथर ने स्वयं संशोधित किया, और वह पाठ जो उनकी मृत्यु के बाद मानक बना।
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=लूथर की पहली बाइबल नहीं, उनकी अंतिम। वार्टबुर्ग में तैयार किया गया नया नियम 1522 में प्रकट हुआ और पूरी बाइबल 1534 में; वे एक दशक और संशोधन करते रहे, और हांस लुफ़्ट ने 1545 में विटेनबर्ग में जो संस्करण छापा वह अंतिम है जिसे लूथर ने स्वयं पूरा कराया। जर्मन इसे Ausgabe letzter Hand, अर्थात् अंतिम हाथ का संस्करण, कहती है। अगले फ़रवरी में उनका देहांत हुआ, और यही पाठ वह मानदंड बना जिससे बाद की लूथर बाइबलें मापी गईं।
hero.2=उन्होंने लैटिन से नहीं, मूल भाषाओं से काम किया: नए नियम के लिए इरास्मुस की छपी हुई यूनानी, पुराने के लिए मसोरा वाली इब्रानी, और कठिन स्थलों पर बहस के लिए विटेनबर्ग के सहयोगियों का एक मंडल। जो निकला उसने जर्मन के लिए लगभग वही किया जो एक सदी बाद 1642 की Biblia फ़िनिश के लिए करेगी। अनेक बोलियों और थोड़े स्थिर गद्य वाली भाषा को एक ऐसी शैली मिली जिसे सब पढ़ सकते थे, और आधुनिक लिखित भाषा उसी से उगी।
hero.3=यहाँ दो शृंखलाएँ मिलती हैं। Luther Bibel 1912 ठीक इस संस्करण के ऊपर है, क्योंकि वह इसी का पुनरीक्षण है। और वैसे ही Biblia 1642, फ़िनिश रेखा में तीन पायदान ऊपर, क्योंकि तुर्कू की समिति लूथर को खोलकर काम करती थी। इसके नीचे सीढ़ी तल तक पहुँचती है — यूनानी के लिए Textus Receptus, इब्रानी के लिए वेस्टमिंस्टर लेनिनग्राद कोडेक्स — और वे पायदान ठोस हैं, ≈ से चिह्नित नहीं, क्योंकि इरास्मुस की यूनानी और मसोरा वाली इब्रानी ही वह हैं जिनसे लूथर ने वास्तव में अनुवाद किया, बाद में रखे गए साक्षी नहीं।

