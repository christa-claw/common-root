fact.1.label=言語
fact.1.value=古典アラビア語。リーダーでは各ハディースの下に英訳が表示される
fact.2.label=編纂者
fact.2.value=ヤヒヤー・イブン・シャラフ・アン=ナワウィー（ヒジュラ暦631–676年／西暦1233–1277年）
fact.3.label=名称
fact.3.value=『アル=アルバイーン・アン=ナワウィーヤ』（「アン=ナワウィーの四十のハディース」）として知られる。名にかかわらず、収録ハディースは四十二
fact.4.label=編纂地と時期
fact.4.value=主に[[BUK|サヒーフ・アル=ブハーリー]]と[[MUS|サヒーフ・ムスリム]]から。アン=ナワウィーがダマスカスのアシュラフィーヤ・ダール・アル=ハディースの長であった間（ヒジュラ暦665年／1267年）から、シリア・ナワーで没したヒジュラ暦676年（1277年）まで
fact.5.label=方法
fact.5.value=各ハディースは、アン=ナワウィーが宗教の「大いなる基礎」（カーイダ・アズィーマ）と呼んだものの例として選ばれた。より古い「四十ハディース」類（アルバイーニーヤート）の継承であり、その最初の、現存しない例はアブドゥッラー・イブン・アル=ムバーラク（没797年）に帰せられる
fact.6.label=位置づけ
fact.6.value=クルアーンそのものに次いでスンナ派イスラームで最も読まれる著作の一つと広く見なされる。数十の注釈の対象となり、最も著名なのはイブン・ラジャブ・アル=ハンバリーの『ジャーミウ・アル=ウルーム・ワ・アル=ヒカム』
fact.7.label=ハディースの数
fact.7.value=名称にかかわらず42。このコーパスが用いる底本も同数とする
fact.8.label=このコーパスでは
fact.8.value=1巻・42件の番号付きハディース
fact.9.label=英訳
fact.9.value=fawazahmed0/hadith-api の eng-nawawi 版から取られ、アラビア語の対訳として示される。どの刊行された英訳に由来するかは、このコーパス側ではまだ確認されていない
fact.10.label=ライセンス
fact.10.value=アラビア語本文はパブリックドメインの古典テキストである。英訳のライセンスは依然確認中である
