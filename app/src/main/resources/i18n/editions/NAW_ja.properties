title=アン=ナワウィーの四十のハディース — この版について | Common Root
description=アン=ナワウィーの四十のハディース：イマーム・アン=ナワウィーが選んだ42のハディースで、それぞれが宗教の「大いなる基礎」（カーイダ・アズィーマ）とされる——四十ハディース類の中で最も読まれている作品。
heroHeading=アン=ナワウィーの四十のハディース
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=ヤヒヤー・イブン・シャラフ・アン=ナワウィーは、ヒジュラ暦631年ムハッラム月（西暦1233年10月）、シリアのダルアー近郊ナワーに生まれ、十八歳でダマスカスに移り学問を修めた。ヒジュラ暦665年（1267年）、ダマスカスのアシュラフィーヤ・ダール・アル=ハディースの長に任じられ、ヒジュラ暦676年（1277年）、四十代半ばでナワーにて没するまでその職を務め、同地に葬られた。シャーフィイー学派の法学者であった彼は、その短い生涯のうちに多くの著作を残した——他の著作にはリヤード・アッ=サーリヒーン、サヒーフ・ムスリムの注釈として知られるアル=ミンハージュ、アル=マジュムーウ・シャルフ・アル=ムハッザブ、ミンハージュ・アッ=ターリビーン、キターブ・アル=アズカールなどがある。
hero.2=『アル=アルバイーン・アン=ナワウィーヤ』は、それより古い「四十ハディース」（アルバイーニーヤート）類の伝統を継ぐものであり、その発端は、宗教に関する四十のハディースを自らの共同体のために保持する者には審判の日に学者たちの中に地位が与えられると約するハディース——批評家の多くがそれ自体を弱い（ダイーフ）と評するハディース——にある。この種の最初の編集、現存しないが、アブドゥッラー・イブン・アル=ムバーラク（没797年）に帰せられ、その後多くの学者が自らの編集を作った。アン=ナワウィーは確実と判断したハディースを、主に[[BUK|サヒーフ・アル=ブハーリー]]と[[MUS|サヒーフ・ムスリム]]から選び、それぞれが彼の言う宗教の「大いなる基礎」（カーイダ・アズィーマ）を示すものとした——そしてその名にかかわらず、現存する形の編集は四十二のハディースを収める。これはこの類の中で最も読まれる例となり、数十の注釈を生み、最も著名なのはイブン・ラジャブ・アル=ハンバリーの『ジャーミウ・アル=ウルーム・ワ・アル=ヒカム』であり、クルアーンそのものに次いでスンナ派イスラームで最も読まれる著作の一つとされる。
hero.3=ここにあるアラビア語本文は古典的なマトンであり、パブリックドメインである。読者（リーダー）ではその下に英訳が置かれ、fawazahmed0/hadith-api の eng-nawawi 版から取られ、アラビア語とハディースごとに対応づけられており、両者を一対として読むことができる——これは、このコーパスが[[BUK|サヒーフ・アル=ブハーリー]]、[[MUS|サヒーフ・ムスリム]]、[[ABD|スナン・アブー・ダーウード]]、[[TIR|ジャーミウ・アッ=ティルミズィー]]、[[NAS|スナン・アン=ナサーイー]]、[[IBM|スナン・イブン・マージャ]]、[[MAL|ムワッタ・マーリク]]、クルアーン訳で用いているのと同じ並置方式である。このファイル自体がどの出版された英訳に由来するのかは、このコーパス側ではまだ確認されていない。そのためそのライセンスは、単純にパブリックドメインとしてではなく確認中として記されている。上にあるアラビア語にはそうした不確かさはない。

