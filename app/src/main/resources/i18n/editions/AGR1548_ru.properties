title=Agricola 1548 — Об этом издании | Common Root
description=Финский язык Микаэля Агриколы: Новый Завет 1548 года, Псалтирь 1551 года и пророки — первое печатное Писание по-фински и самое начало финской письменности.
heroHeading=Agricola 1548
