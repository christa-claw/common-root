thanks=С благодарностью тем, кто прислал исправления к этой странице.

# The narrative, one paragraph per key, in order.
hero.1=Самый старый печатный финский, какой существует. Когда Микаэль Агрикола издал Se Wsi Testamenti в 1548 году, финский язык почти никогда не набирался в типографии: его собственный букварь, вышедший несколькими годами раньше, был вообще первой финской книгой. Между ними вышел ещё молитвенник 1544 года — объёмный труд, уже содержавший переводы псалмов. Чтобы напечатать Писание, ему пришлось сначала решить, как этот язык пишется, и эти решения — орфография, заимствования, ритм — и есть начало финской письменности. Новый Завет занял у него и его круга в Турку больше десятилетия; Псалтирь последовала в 1551 году, выборки из пророков и книг Моисеевых — в 1551 и 1552. Его финский, однако, был первым напечатанным, а не первым записанным: четыре рукописи — Codex Westh, уппсальский кодекс B 28, миссал из Кангасалы и уппсальский фрагмент — содержат библейские отрывки по-фински, и Кауко Пиринен показал в 1988 году, сравнив их со шведскими источниками, что часть из них старше всего напечатанного Агриколой и, возможно, была записана уже в 1530-е годы.
hero.2=Всю Библию он так и не перевёл, и этот читатель не делает вид, что было иначе. Новый Завет и все 150 псалмов полны; пророки и книги Моисеевы даны в выборках. Здесь есть и то, что он переложил в других книгах: его молитвенник 1544 года, а также Käsikirja и Messu 1549 года несут собственный библейский текст — в том числе главы Бытия, напечатанные под заглавием "Genesist mutomat Lughut", — и 685 стихов взяты оттуда. Они использованы только там, где в книгах Писания нет стиха по тому же адресу, и только там, где текст идёт сплошь, а не стоит одиночной цитатой внутри молитвы. Так что Бытие всё-таки есть, отчасти: главы 1–4, 22, 28 и 32. Книги Судей, Руфь, 1-я Паралипоменон и Есфирь отсутствуют полностью. Полного финского Ветхого Завета пришлось ждать до Biblia 1642 года — на ступень выше по цепи.
hero.3=В этом читателе Агрикола — древнейшая финская ступень. Откройте одну ступень под стихом Biblia 1642, и его текст появится рядом с немецким Лютера — те два источника, которые комиссия 1642 года действительно держала раскрытыми. Ниже самого Агриколы цепь навсегда покидает финский: он работал с греческим Эразма и с латинским текстом, который Эразм печатал рядом, с немецким Лютера и с Вульгатой. Три из них записаны здесь как его родители; латынь Эразма и шведская Библия Густава Васы 1541 года, которой он тоже пользовался, в это собрание не входят. Текст — из корпуса VKS института Kotus, в написании издания 1548 года: "Algusa oli Sana / Ja se Sana oli Jumalan tykene". Шведское Писание печаталось с 1526 года, когда вышел шведский Новый Завет, так что шведский перевод был у него под рукой с самого начала.

