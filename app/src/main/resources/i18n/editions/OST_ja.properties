title=オステルヴァルト訳聖書（フランス語） — この版について | Common Root
description=オステルヴァルト訳聖書：ヌーシャテルの牧師によるジュネーヴのフランス語プロテスタント聖書の改訂版。1744年に初めて出版され、ここでは現代フランス語の綴りによる後の改訂版で収められている。
heroHeading=オステルヴァルト訳聖書
readerHref=/reader?c1.src=ost

# The narrative, one paragraph per key, in order.
hero.1=ジャン＝フレデリック・オステルヴァルトは1663年にヌーシャテルで生まれ、1747年に同地で没した。1683年に故郷の町で按手を受け、生涯の大半をその教会で過ごした。はじめは執事として、1699年からは牧師として仕え、神学の講義も行った。彼の聖書はヘブライ語とギリシャ語からの新しい翻訳ではなく、ジュネーヴのフランス語プロテスタント聖書の改訂である。それはフランス語圏の改革派教会が16世紀以来読んできた訳であった。オステルヴァルトの改訂本文は、彼の死の3年前、1744年に初めて出版され、その後2世紀以上にわたって増刷と改訂を重ねた。イギリスでもよく知られていた。
hero.2=このコーパスの本文は1744年のフランス語ではない。18世紀には、現代フランス語が「était」と書くところを「étoit」と書いた。このコピーでは全体を通して「était」であり、「étoit」は一度も現れない。したがってこれは、オステルヴァルトの名を保った後の改訂版のいずれかに由来する。最もよく知られているのはフランス聖書協会（Société biblique de France）が1881年に出した改訂版で、その新約はCh. L. Frossardの仕事であり、この本文は1996年にもなお改められている。このコピーの出典であるeBible.orgは「Ostervald」とだけ記し、どの改訂かを示していないので、このページも特定しない。いくつかの特徴はほぼどのページにも見える。神名は「l'Éternel」（永遠なる者）であり、スゴン訳やフランス語ダービー訳と同じである。詩編23編は「L'Éternel est mon berger; je n'aurai point de disette」となっている。イザヤ書7:14は「la vierge sera enceinte」——処女——を保っており、スゴン訳ではそこが若い女となっている。そして新約は、批判版が削る公認本文（テクストゥス・レセプトゥス）の読みを保っている。ヨハネの手紙一5:7には天の3つの証し、「le Père, la Parole, et le Saint-Esprit」があり、隣に並ぶスゴン訳にはそれがない。
hero.3=この読書環境において、これはスゴン訳、フランス語ダービー訳と並ぶ3つのフランス語聖書の一つである。フランス語のインターフェースはこれを開かない。フランス語には選定された既定の版がないため、読書環境はカタログ順で最初のフランス語聖書を取り、それはダービー訳だからである。系譜の段には母本が記録されていない——これが改訂したジュネーヴ聖書はこのコーパスにない——ため、節の下で段を開くと直接、≈ の印が付いた原語の底面に至る。旧約ではレニングラード写本、新約ではテクストゥス・レセプトゥス、すなわちこの聖書が実際に従っているギリシャ語の伝統である。その段のチップには1744年の年が付いているが、それはオステルヴァルト自身の改訂の年であって、表示される本文の年ではない。スゴン訳と並べて開けば、フランス語プロテスタント聖書の言葉の2世紀を横に並べて見ることができる。

