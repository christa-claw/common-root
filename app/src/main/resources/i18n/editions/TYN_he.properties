title=הברית החדשה של טינדייל 1534 — על מהדורה זו | Common Root
description=הברית החדשה של ויליאם טינדייל, התרגום האנגלי הראשון שנעשה מן היוונית והראשון שנדפס, בתיקון שלו עצמו משנת 1534 — הנוסח השוכן מתחת לביבליית ז'נבה ולתרגום המלך ג'יימס.
heroHeading=הברית החדשה של טינדייל 1534
readerHref=/reader?c1.src=tyn

# The narrative, one paragraph per key, in order.
hero.1=באנגליה של טינדייל כתבי קודש באנגלית עדיין היו מחוץ לחוק. חוקות אוקספורד משנת 1409 אסרו לתרגם את כתבי הקודש לאנגלית, או לקרוא תרגום כזה, בלי אישור של בישוף. ויליאם טינדייל ביקש את האישור הזה מבישוף לונדון, קתברט טנסטול, בשנת 1523, נדחה, ובשנה שלאחר מכן עזב את אנגליה כדי לעשות את העבודה בלעדיו. כשלפניו הברית החדשה היוונית של ארסמוס, ולצדה הגרמנית של לותר והוולגטה הלטינית, הוא יצר את הברית החדשה האנגלית הראשונה שתורגמה מן היוונית, והראשונה שנדפסה אי־פעם. ניסיון ראשון בקלן בשנת 1525 נקטע בפשיטה על בית הדפוס; הספר השלם יצא מדפוסו של פטר שֶפֶר בוורמס בשנת 1526 והוברח לאנגליה, ושם קנו הבישופים עותקים ושרפו אותם.
hero.2=הנוסח כאן הוא התיקון של טינדייל עצמו, שנדפס באנטוורפן בשנת 1534: הוא חזר אל היוונית, תיקן את גרסתו הראשונה והוסיף הקדמות והערות. זה היה עמדה בוויכוח לא פחות משהיה תרגום. תומס מור תקף אותו משום שכתב "קהילה" (congregation) במקום שבו הכנסייה אמרה כנסייה, "זקן" (elder) במקום שבו אמרה כוהן, ו"אהבה" (love) במקום שבו אמרה charity — ושלוש הבחירות כולן עומדות בנוסח הזה: מתי 16:18 נקרא "apon this rocke I wyll bylde my congregacion". טינדייל תיקן שוב בשנת 1535, נעצר באנטוורפן במאי של אותה שנה, ובשנת 1536 הורשע ככופר, נחנק ונשרף בווילוורדה שליד בריסל.
hero.3=בקורא הזה מוצאים אותו למטה. טינדייל רשום כשלב מתחת לביבליית ז'נבה ומתחת לתרגום המלך ג'יימס, ולכן, נמוך יותר בסולם, גם מתחת ל־Revised Version, ל־American Standard Version ול־World English Bible הנשענים על תרגום המלך ג'יימס. כשיורדים מפסוק בתרגום המלך ג'יימס אל מעבר לז'נבה, הנוסח לא פעם כמעט אינו זז — וזה בדיוק העניין; בקורינתים א' 13:13 הוא זז: טינדייל וז'נבה אומרים love ותרגום המלך ג'יימס אומר charity. מתחת לטינדייל אין הורה רשום. הוא עבד על פי היוונית של ארסמוס, אבל הטקסטוס רצפטוס שבאוסף זה הוא מהדורת 1550, דור אחריו, והלותר שכאן הוא הביבליה של 1545 ולא הברית החדשה של 1522 שבה השתמש, ולכן הסולם יורד ישירות אל רצפת שפות המקור. כאן יש רק את הברית החדשה, בכתיב שלו: מתי נפתח במילים "This is the boke of the generacion of Iesus Christ".

