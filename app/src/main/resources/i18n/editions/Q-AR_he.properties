title=קוראן — הנוסח העות'מאני — על המהדורה הזאת | Common Root
description=הקוראן בקריאת ח'פץ מפי עאצם, הטקסט שעליו מבוססים רוב הקוראנים המודפסים בעולם מאז מהדורת קהיר משנת 1924 — ובאוסף הזה טקסט שנבדק פסוק־פסוק לעומת העותק של מתקן המלך פהד עצמו ונמצא תואם בשלד העיצורים בכל 6,236 הפסוקים שבו.
heroHeading=קוראן — הנוסח העות'מאני
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=לקריאה שעליה מושתת הטקסט הזה יש שרשרת מסירה בעלת שם. ח'פץ בן סלימאן אל-כופי (נפ' 796) מסר אותה מפי רבו, עאצם בן אבי אל-נג'וד, אחד מקריאני כופה שאת קריאתו קנן אבן מג'אהיד מאוחר יותר בין השבע (עאצם נפטר בשנת 745). ח'פץ מפי עאצם — "ח'פץ, לפי עאצם" — היא אחת מכמה קריאות שהמוסלמים מחשיבים למסירות שוות בסמכותן של אותה התגלות; היא אינה היחידה, אך היא בהחלט הנפוצה ביותר בדפוס. כאשר ועדה של חכמי אל-אזהר, שפעלה מאז 1907 בחצרו של המלך פואד הראשון, חיברה את הקוראן המצרי התקני שבית הדפוס אמירי בבולאק הוציא לאור ב-10 ביולי 1924, קריאה זו היא שקבעו באותיות הדפוס. רוב הקוראנים הנמכרים היום בכל מקום, לרבות זה של מתקן המלך פהד עצמו, הולכים בעקבות אותה מהדורה.
hero.2=מה שמופיע באוסף הזה נלקח, באמצעות מהדורת quran-uthmani של alquran.cloud, מתוך הדיגיטציה של פרויקט תנזיל לאותו טקסט ח'פץ עצמו. בקורא הוא מוצג לצד שלושה תרגומים: התרגום האנגלי של פיקת'ול משנת 1930, התרגום האנגלי של יוסוף עלי משנת 1934 והתרגום הרוסי של סבלוקוב משנת 1878 — פתחו כל אחד מהשלושה לצד זה, ותרגומו יופיע מתחת לכל פסוק. הקורא מציע את הקוראן גם בשני סדרים: סדר המֻצְחף המקובל שאותה מסורת קבעה, וסדר שחוקרים משחזרים לפי מועד התגלותה של כל סורה.
hero.3=שימור אותיות מדויק הוא עצמו אחת הטענות הנאמרות על הטקסט הזה, ולכן הוא נבדק כאן ולא מונח כמובן מאליו. בהשוואה פסוק־פסוק לעותק הח'פץ של מתקן המלך פהד להדפסת הקוראן האדיר, שני הטקסטים תואמים בשלד העיצורים — האותיות העירומות, לפני הוספת כל סימן תנועה — בכל 6,236 הפסוקים שבו. כל הבדל שנמצא מוגבל לאופן סימון התנועות וסימני ההפסקה, לכתיב ההמזה, ולשמונה מקומות שבהם שני הצדדים מותחים את גבול המילה באופן שונה; אף אחד מהם אינו נוגע באות אחת של הטקסט עצמו. זהו ההפך מחוסר הביטחון שעל האוסף הזה להודות בו לגבי התנ"ך הפיני משנת 1776, שבו פשוט אין יודעים מאיזו הדפסה הטקסט נובע.
hero.4=שני דברים שההתאמה הזאת אינה מוכיחה כדאי לומר בבירור. זו אינה טענת מוצא — התאמה לטקסט של המתקן מראה ששני הטקסטים הם אותו טקסט, לא שאחד הועתק מהאחר. וזו גם אינה רשות: בקשה שנשלחה למתקן בסוף אוגוסט 2026, ובה התבקשה רשות להציג את קובצי הרִואיאת שלו עצמו, לא נענתה עד כתיבת שורות אלו. הפסוק היחיד שבו ההשוואה עצמה הראתה לרגע חילוקי דעות, 19:3, התגלה כפגם באופן שבו נקרא קובץ הייחוס, לא בשום אחד משני הקוראנים — ובתיקונו הוא תואם בדיוק. עותק הייחוס עצמו הוא שחזור של קובץ מעבד התמלילים של המתקן, לא פרסומו הדיגיטלי הרשמי, וזהו ההיבט היחיד שבו זו אינה בדיוק השוואה למערך נתונים שפורסם רשמית.

