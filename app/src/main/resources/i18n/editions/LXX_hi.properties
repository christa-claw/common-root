title=ब्रेंटन का यूनानी सेप्टुआजिंट — इस संस्करण के बारे में | Common Root
description=सेप्टुआजिंट — यहूदी प्रवासी समुदाय और आरम्भिक कलीसिया का यूनानी पुराना नियम — उस यूनानी पाठ में जिसे लैंसलट ब्रेंटन ने 1851 में अपने अंग्रेज़ी अनुवाद के साथ छापा; इस रीडर में वुल्गाता और रूसी सिनॉडल बाइबिल के नीचे का पायदान।
