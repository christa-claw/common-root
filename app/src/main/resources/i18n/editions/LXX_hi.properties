readerHref=/reader?c1.src=lxx

# The narrative, one paragraph per key, in order.
hero.1=सेप्टुआजिंट इब्रानी बाइबिल का सबसे पुराना अनुवाद है, और पहली ईसाई सदियों में वही सीधे-सीधे बाइबिल था। अलेक्ज़ान्द्रिया के यूनानी-भाषी यहूदियों ने इसकी शुरुआत व्यवस्था की पाँच पुस्तकों से की, सम्भवतः ईसा पूर्व तीसरी सदी में, और बाक़ी पुस्तकें अगली दो सदियों में आईं। नाम एक कथा से आता है: अरिस्तियास का पत्र बताता है कि राजा टॉलेमी द्वितीय के लिए व्यवस्था का अनुवाद करने यरूशलेम से बहत्तर बुज़ुर्ग भेजे गए थे, और “सत्तर” — रोमन अंकों में LXX — पूरे यूनानी पुराने नियम का नाम बन गया। नए नियम के लेखक लगातार इसे उद्धृत करते हैं, आरम्भिक कलीसिया इसे पढ़ती थी, और ऑर्थोडॉक्स कलीसियाएँ आज भी इसे अपने पुराने नियम के रूप में पढ़ती हैं।
hero.2=इसका महत्व इसकी प्राचीनता से आगे जाता है। अनुवादकों ने ऐसी इब्रानी पांडुलिपियों से काम किया जो कुछ स्थानों पर उस मसोरेटिक पाठ से भिन्न थीं जो बाद में मानक बना — उदाहरण के लिए, यिर्मयाह यूनानी में काफ़ी छोटा है — इसलिए अनेक स्थानों पर सेप्टुआजिंट ऐसे इब्रानी पाठ का सबसे पुराना साक्ष्य है जिसे स्वयं इब्रानी परम्परा ने सुरक्षित नहीं रखा। इसमें ऐसी पुस्तकें भी हैं जो इब्रानी धर्मग्रन्थ-सूची में नहीं हैं, उनमें तोबित, यहूदीत, प्रज्ञा, सिराख और बारूक। और इसके कुछ शब्द-चुनाव सिद्धान्त बन गए: यशायाह 7:14 में, जहाँ इब्रानी में ʿalmah, यानी युवती, है, वहाँ यूनानी में parthenos, यानी कुँवारी, है — वही शब्द जिसे मत्ती उद्धृत करते हैं।
hero.3=यहाँ का यूनानी वह पाठ है जिसे सर लैंसलट ब्रेंटन ने छापा। उन्होंने 1844 में सेप्टुआजिंट का एक अंग्रेज़ी अनुवाद प्रकाशित किया, जो मुख्यतः कोडेक्स वैटिकेनस पर आधारित था — वैटिकन पुस्तकालय में रखी चौथी सदी की पांडुलिपि; 1851 में लंदन के सैमुअल बैगस्टर ने इसे फिर से प्रकाशित किया, अपोक्रिफ़ा पुस्तकें जोड़कर और यूनानी को अंग्रेज़ी के साथ रखकर, और यही यूनानी इस संग्रह में है। इसके भजन यूनानी क्रमांकन रखते हैं, जो यहाँ की वुल्गाता में भी है: दोनों में भजन 22 चरवाहे वाला भजन है, जो इब्रानी में और अधिकांश अंग्रेज़ी बाइबिलों में भजन 23 है। इसमें 151 भजन हैं; एज्रा और नहेम्याह एक ही पुस्तक हैं; एस्तेर और दानिय्येल अपने लम्बे यूनानी रूपों में हैं।
hero.4=इस रीडर में यह एक पायदान है, तल नहीं। यह लातीनी वुल्गाता के नीचे है, क्योंकि वुल्गाता का एक भाग यूनानी के रास्ते आया: उसका भजन-संग्रह वह है जो जेरोम ने ओरिजन के हेक्साप्ला की यूनानी से बनाया था और जिसे इब्रानी से किया गया उनका अपना अनुवाद कभी हटा नहीं पाया, और प्रज्ञा, सिराख और बारूक यूनानी से किए गए पुराने लातीनी अनुवादों में ही रहने दी गईं। यह रूसी सिनॉडल बाइबिल के नीचे है, जिसके पुराने नियम ने अपने पीछे खड़ी चर्च स्लावोनिक बाइबिल से सेप्टुआजिंट के बहुत से पाठ बचाए रखे, और ब्रेंटन के अपने अंग्रेज़ी अनुवाद के नीचे भी। इसका अपना कोई दर्ज जनक नहीं है: जिस इब्रानी पाठ से इसका अनुवाद हुआ वह संग्रह में नहीं है, और लेनिनग्राद कोडेक्स, जो इससे हज़ार वर्ष से अधिक बाद का है और मसोरेटिक धारा का है, इसके नीचे केवल मूल भाषाओं के तल के रूप में दिखता है। यह केवल पुराना नियम है, इसलिए नए नियम के किसी पद के नीचे यह पायदान छोड़ दिया जाता है — और यूनानी परम्परा की हर पुस्तक यहाँ नहीं है: इस प्रति में 45 पुस्तकें हैं और मक्काबियों की कोई पुस्तक नहीं।

