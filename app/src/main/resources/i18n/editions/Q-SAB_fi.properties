title=Koraani — Sablukov — Tietoja tästä laitoksesta | Common Root
description=Gordi Sablukovin venäjänkielinen käännös, julkaistu Kazanissa vuonna 1878 ja yleisesti kuvattu ensimmäiseksi venäjänkieliseksi Koraanin käännökseksi, joka tehtiin suoraan arabiasta eikä ranskalaisen tai englantilaisen välikäden kautta — ja tässä aineistossa venäjänkielinen rinnakkaiskäännös, joka näkyy uthmani-arabiankielisen tekstin alla.
heroHeading=Koraani — Sablukov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordi Semjonovitš Sablukov (1803–1880) koulutettiin Venäjän ortodoksisen kirkon papiksi; hän valmistui Orenburgin hengellisestä seminaarista vuonna 1826 ja Moskovan hengellisestä akatemiasta vuonna 1830. Hän vietti seuraavat kaksi vuosikymmentä, vuodesta 1830 vuoteen 1849, opettamassa historiaa ja itämaisia kieliä Saratovin hengellisessä seminaarissa — missä 1840-luvun puolivälissä yksi hänen oppilaistaan oli tuleva radikaali kirjailija Nikolai Tšernyševski — ennen kuin siirtyi vuonna 1849 Kazanin hengellisen akatemian lähetysosastoon, jossa hän opetti itämaisia ja klassisia kieliä vuoteen 1862 asti.
hero.2=Venäjänkieliset Koraanin käännökset juontuvat vuoteen 1716, jolloin Pjotr Postnikov laati yhden Pietari Suuren määräyksestä — mutta André du Ryerin ranskankielisestä käännöksestä, ei arabiasta, kuten myöskään Aleksei Kolmakovin vuoden 1792 käännös, joka tehtiin George Salen englanninkielisestä käännöksestä. Sablukovin käännös, julkaistu Kazanissa vuonna 1878 nimellä "Коран, законодательная книга мохаммеданского вероучения" ("Koraani, muhamettilaisen uskontunnustuksen säädöskirja"), katsotaan yleisesti ensimmäiseksi venäjänkieliseksi Koraanin käännökseksi, joka tehtiin suoraan arabialaisesta alkutekstistä — hänen vuosiensa tulos Kazanissa itämaisten kielten opettajana.
hero.3=Hän täydensi sitä seuraavana vuonna rinnakkaisella huomautusten osalla, "Приложения к переводу Корана" (1879), ja myöhemmin kahdella siihen liittyvällä tutkimuksella: "Сведения о Коране" ("Tietoja Koraanista", 1884) ja aiemmalla vertailevalla tutkielmalla kristillisestä ja muslimiopista Jumalan nimistä (1873). Hänen käännöksensä on sittemmin pysynyt yhtenä laajimmin levinneistä venäjänkielisistä versioista, vaikka myöhemmät käännökset — niiden joukossa Ignati Kratškovskin postuumisti julkaistu käännös — tulivat paremmin tunnetuiksi neuvostoliittolaisessa ja neuvostoliiton jälkeisessä akateemisessa käytössä.
hero.4=Tässä alquran.cloudin ru.sablukov-laitoksen kautta digitoitu teksti tarjotaan tässä aineistossa venäjänkielisenä rinnakkaiskäännöksenä [[Q-AR|uthmani-arabiankielisen tekstin]] alla, [[Q-EN|Pickthallin]] (1930) ja [[Q-YA|Yusuf Alin]] (1934) englanninkielisten käännösten ohella — kolme käännöstä, jotka käytettävissä olevien käännösten katsaus löysi kiistattomasti vapaasti käytettäviksi, yksi kutakin kieltä kohden arabian lisäksi.

