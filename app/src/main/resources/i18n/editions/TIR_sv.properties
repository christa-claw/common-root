title=Jami` at-Tirmidhi — Om denna utgåva | Common Root
description=Jami` at-Tirmidhi: den hadithsamling Abu Isa at-Tirmidhi byggde kring att öppet gradera varje berättelses styrka och registrera de rättsliga argument rättslärda hämtade ur den — räknad bland sunniislams Sex böcker.
heroHeading=Jami` at-Tirmidhi
readerHref=/reader?c1.src=tir-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Isa Muhammad ibn Isa at-Tirmidhi föddes omkring år 209 e.H. (824 e.Kr.) nära Termez, i Khorasan vid det som i dag är gränsen mellan Uzbekistan och Afghanistan. Han började studera hadither vid omkring tjugo års ålder och reste från år 235 e.H. genom Khorasan, Irak och Hijaz för att söka dem, och studerade främst under Muhammad al-Bukhari — hans huvudlärare — samt under Muslim ibn al-Hajjaj, Abu Dawud al-Sijistani, Qutaybah ibn Sa'id och Ali ibn Hujr. Han blev blind på äldre dagar, vilket är ursprunget till hans tillnamn "ad-Darir" ("den blinde"). Han återvände till trakten kring Termez, där han dog den 13 rajab år 279 e.H. (9 oktober 892 e.Kr.) vid omkring sjuttio års ålder.
hero.2=Hans fullständiga titel, al-Jami' al-Mukhtasar min al-Sunan 'an Rasul Allah wa Ma'rifat al-Sahih wal-Ma'lul wa ma 'alayhi al-'Amal, förkortas vanligen till Jami' at-Tirmidhi eller Sunan at-Tirmidhi. Medan Sahih al-Bukhari och Sahih Muslim endast godtar hadither deras sammanställare bedömde som fullt autentiska, graderade at-Tirmidhi varje hadith öppet inom själva texten — sahih, hasan, da'if eller gharib — och förklarade grunderna för en svagare gradering i stället för att utesluta hadithen; han angav också var de rättsliga skolorna (madhahib) skilde sig åt och vilka belägg varje sida åberopade, vilket gör boken lika mycket till en vägledning i hadithbaserat rättsligt resonemang som till en hadithsamling i sig.
hero.3=Sunnitisk tradition räknar den bland Sex böckerna, vanligen efter Sahih al-Bukhari, Sahih Muslim och Sunan Abi Dawud; var exakt den rankas bland de återstående böckerna — och vilken samling som fyller den sjätte platsen, där Sunan Ibn Majah är det vanliga men inte det enda historiskt föreslagna svaret — har länge diskuterats utan att avgöras, liksom för detta korpus övriga Sunan-samlingar. Antalet hadither som anges för boken varierar av samma skäl: omkring 4 330 enligt den traditionella räkningen, på andra håll angivet till omkring 4 400; även dess struktur beskrivs olika, som 46 böcker, 49 kapitel i Ahmad Muhammad Shakirs Kairoutgåva, eller femtio kapitel. Detta korpus egen siffra är ännu en siffra till: 49 böcker och 3 998 numrerade hadither, formen på den digitala utgåva den hämtats från, inte ett anspråk på att återge någon enskild tryckttradition.
hero.4=Den arabiska texten här är den klassiska matnen, i allmän egendom. Under den i läsaren ligger en engelsk översättning, hämtad från fawazahmed0/hadith-apins eng-tirmidhi-utgåva och parad hadith för hadith med arabiskan så att de två kan läsas tillsammans — samma parningsupplägg som detta korpus använder för Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud och sina Koranöversättningar. Vilken publicerad engelsk översättning själva filen härstammar från har inte fastställts från detta korpus sida, vilket är skälet till att dess licens är markerad som under granskning snarare än rätt och slätt allmän egendom; arabiskan ovanför bär ingen sådan osäkerhet.

