# The narrative, one paragraph per key, in order.
hero.1=כל מקרא של הרפורמציה באוסף הזה משתלשל מספר שנדפס בבאזל ב־1516. אראסמוס מרוטרדם רצה להביא את הברית החדשה היוונית לדפוס לפני כל אחד אחר, ועבד מהר — מתוך קומץ כתבי היד המאוחרים שהשיגה ידו בבאזל, ואף אחד מהם לא עתיק במיוחד. במקום שבו חסר הדף האחרון בעותק החזון שלו, תרגם את ששת הפסוקים האחרונים בחזרה ליוונית מן הוולגטה הלטינית. הפסוקים האלה נכנסו לדפוס ונשארו שם ארבע מאות שנה.
hero.2=הנוסח תוקן והוצא מחדש במשך מאה שנה לאחר מכן — בידי אראסמוס עצמו, אחר כך בידי רובר אסטיין בפריז ותאודור בזה בז'נבה. המהדורה הרביעית של אסטיין, מ־1551, עשתה דבר שהשלכותיו חורגות הרבה מעבר למדע: היא חילקה את הטקסט לפסוקים ממוספרים. אלה מספרי הפסוקים שעד היום מודפסים כמעט בכל מקרא בעולם — ואלה שהקורא הזה מאפשר לכבות.
hero.3=השם הגיע אחרון, והוא הגיע מן הפרסום. ב־1633 פרסמו האחים אלזביר מליידן את מהדורתם בשורה שלפיה בידי הקורא מעתה “הנוסח שהכל קיבלו” — textus receptus. זו הייתה טענה של מוכר ספרים, לא פסיקה מדעית, אבל היא נדבקה. כשעלו במאה התשע־עשרה כתבי יד קדומים יותר, בנו עליהם מהדירים מטישנדורף ועד וסטקוט והורט נוסחים חדשים, והתרגומים המודרניים הולכים אחריהם. טקסטוס רצפטוס נשאר כאן מן הטעם שבעבורו הוא חשוב: זה מה שעמד בפועל לפני לותר, טינדיל, מתרגמי ז'נבה וועדות המלך ג'יימס, ולכן זה הנוסח שמולו יש לקרוא את ניסוחיהם.

