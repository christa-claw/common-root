title=טקסטוס רצפטוס — על מהדורה זו | Common Root
description=טקסטוס רצפטוס: הברית החדשה היוונית המודפסת שמאחורי לותר, טינדיל ותרגום המלך ג'יימס, שערך אראסמוס לראשונה ב־1516 ונקרא על שם שורת פרסומת מ־1633.
