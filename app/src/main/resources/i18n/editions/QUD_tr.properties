title=Kırk Hadis-i Kudsî — Bu Baskı Hakkında | Common Root
description=Kırk Hadis-i Kudsî — anlamının Allah'tan geldiğine, lafzının ise diğer her hadis gibi Hz. Muhammed'den geçtiğine Müslümanların inandığı kırk hadis; burada Nevevî'nin Kırk Hadisi'ne eşlik eden bir cilt olarak sunulur.
heroHeading=Kırk Hadis-i Kudsî
readerHref=/reader?c1.src=qud-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Hadis-i kudsî ("kutsal" veya "ilahi" hadis), anlamının kaynağı bakımından sıradan bir hadisten ayrılır: el-Curcânî gibi âlimler onu, lafzı Hz. Muhammed'in kendi sözleriyle dile getirilmiş olsa da anlamı Allah'ın sözü olan bir hadis olarak tanımlar; bu, lafzının kendisi de Allah'a ait sayılan Kur'an'dan farklıdır. Bu ayrım sağlamlıkla değil, konumla ilgilidir — bir hadis-i kudsînin sahih olması şart değildir; böyle sınıflananlardan bazıları zayıf (da'îf) veya tartışmalıdır ve her hadis gibi aynı rivayet zinciri ölçütlerine göre değerlendirilir.
hero.2=Kırk hadis-i kudsî derlemek, [[NAW|Nevevî'nin Kırk Hadisi]] ve ait olduğu daha geniş "kırk hadis" (erbâîniyyât) türüyle aynı eski âdeti izler; burada fark, hadislerin genelinden ziyade tek bir hadis kategorisiyle sınırlı olmasıdır. Tam da bu başlıkla yaygın biçimde dolaşan bir İngilizce baskı — Nevevî'nin derlemesinin eşlik eden çevirisini de yapan Ezzeddin Ibrahim ve Denys Johnson-Davies tarafından seçilip çevrilmiş — 1997'de Islamic Texts Society tarafından, kırk hadisini klasik hadis literatürünün genelinden derleyen iki dilli bir Arapça-İngilizce cilt olarak yayımlanmıştır. Bu derlemenin sunduğu kırk hadisin tam olarak o seçki mi, yoksa aynı geleneksel başlık altında bağımsız olarak derlenmiş başka bir küme mi olduğu, bu derleme tarafından belirlenmemiştir.
hero.3=Buradaki Arapça metin, kamu malı sayılan klasik metindir (matn). Onun altında, okuyucuda, fawazahmed0/hadith-api'nin eng-qudsi baskısından alınmış ve Arapça metinle hadis hadis hizalanmış bir İngilizce çeviri bulunur, böylece ikisi bir çift olarak okunabilir — bu derlemenin [[BUK|Sahih al-Buhari]], [[MUS|Sahih-i Müslim]], [[ABD|Sünen-i Ebu Davud]], [[TIR|Câmiu't-Tirmizî]], [[NAS|Sünen-i Nesâî]], [[IBM|Sünen-i İbn Mâce]], [[MAL|Muvatta-i Mâlik]], [[NAW|Nevevî'nin Kırk Hadisi]] ve Kur'an çevirileri için kullandığı aynı eşlik düzeni. Bu dosyanın hangi yayınlanmış İngilizce çeviriden geldiği bu derleme tarafından henüz netleştirilmemiştir; bu nedenle lisansı doğrudan kamu malı değil, inceleme aşamasında olarak işaretlenmiştir. Üstündeki Arapça metin böyle bir belirsizlik taşımaz.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Dil
fact.1.value=Klasik Arapça; okuyucuda her hadisin altında bir İngilizce çeviri gösterilir
fact.2.label=Derleyen
fact.2.value=Tek bir klasik derleyeni yoktur; bu başlıkla yayımlanmış bir İngilizce baskı, kırk hadisini klasik hadis literatürünün genelinden derleyen Ezzeddin Ibrahim ve Denys Johnson-Davies tarafından seçilip çevrilmiştir
fact.3.label=Adı
fact.3.value=Hadis-i Kudsî — lafzı, Kur'an'dan farklı olarak Hz. Muhammed'in kendi sözleri olsa da anlamı Allah'tan geldiğine inanılan "kutsal" veya "ilahi" hadis
fact.4.label=Derlendiği yer
fact.4.value=Tek ve sürekli bir metinden ziyade daha geniş hadis literatüründen derlenmiş bir antolojidir; Ibrahim/Johnson-Davies'in bu başlıkla İngilizce baskısı 1997'de yayımlandı
fact.5.label=Yöntem
fact.5.value=Kanonik konumdan ziyade kudsî olarak sınıflanmasına göre seçilmiştir; bir hadis-i kudsînin sahih olması şart değildir — böyle sınıflananlardan bazıları zayıf (da'îf) veya tartışmalıdır
fact.6.label=Konum
fact.6.value=Bu başlığı taşıyan birkaç antolojiden biri; [[NAW|Nevevî'nin Kırk Hadisi]] ile aynı uzun soluklu kırk hadis (erbâîniyyât) geleneği içindedir
fact.7.label=Hadis sayısı
fact.7.value=40
fact.8.label=Bu derlemede
fact.8.value=1 kitap ve 40 numaralı hadis
fact.9.label=İngilizce çeviri
fact.9.value=fawazahmed0/hadith-api'nin eng-qudsi baskısından alınmış, Arapça metnin eşlikçisi olarak gösterilir; Ibrahim/Johnson-Davies çevirisinden mi yoksa bağımsız bir çeviriden mi geldiği bu derleme tarafından doğrulanmamıştır
fact.10.label=Lisans
fact.10.value=Arapça metin, kamu malı sayılan klasik metindir; İngilizce çevirinin lisansı hâlâ incelemededir
