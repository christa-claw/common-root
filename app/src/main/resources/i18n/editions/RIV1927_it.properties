title=Riveduta 1927 (italiano) — Su questa edizione | Common Root
description=La Riveduta: la Bibbia italiana di Giovanni Diodati riveduta sull'ebraico e sul greco da un comitato guidato dal teologo valdese Giovanni Luzzi, pubblicata a Roma nel 1924 dalla Società Biblica Britannica e Forestiera — e perché il file dice 1927.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi nacque nel 1856 in Bassa Engadina, nel cantone svizzero dei Grigioni, e fu portato a Lucca ancora lattante quando la famiglia vi emigrò l'anno seguente. Crebbe italiano, studiò alla Facoltà valdese di teologia di Firenze — la scuola dell'antica chiesa protestante d'Italia — e in seguito vi insegnò teologia e fu pastore in città. Passò gli ultimi anni di nuovo in Svizzera, a Poschiavo, e lì morì nel 1948.
hero.2=La Riveduta cominciò nel 1906, quando la Società Biblica Britannica e Forestiera, che da un secolo stampava per i lettori italiani la traduzione secentesca di Diodati, affidò a un gruppo il compito di rivederla, con Luzzi alla guida. Egli aveva sperato di farne una Bibbia comune con studiosi cattolici; il Vaticano rifiutò, e il lavoro proseguì come revisione protestante. La Bibbia completa uscì a Roma nel 1924, presentata sul frontespizio come versione riveduta sul testo originale — «riveduta», ed è con questo nome che da allora la si conosce. Non è una traduzione nuova: sotto c'è il testo di Diodati, confrontato di nuovo con l'ebraico e il greco. Fu la Bibbia dei protestanti italiani per gran parte del Novecento, e la sua erede, la Nuova Riveduta, fu pubblicata dalla Società Biblica di Ginevra nel 1994. Luzzi fece anche una traduzione propria, annotata, in dodici volumi usciti a Firenze dal 1921; è un'altra opera e non questo testo.
hero.3=La revisione si vede sulla pagina. Il nome divino nell'Antico Testamento è «l'Eterno» — «L'Eterno è il mio pastore» al Salmo 23 — dove Diodati ha «il Signore». Isaia 7:14 dice «la giovane» dove Diodati ha «la Vergine». Nel Nuovo Testamento si allontana dal Textus Receptus là dove se ne allontanano le edizioni critiche successive: 1 Giovanni 5:7 non ha i testimoni celesti, il Padre nostro in Matteo 6:13 termina senza la dossologia, e Atti 8:37 è mantenuto ma tra parentesi quadre. I Salmi seguono la numerazione ebraica, e il titolo di un salmo è fuso nel suo primo versetto — il Salmo 23 si apre con «Salmo di Davide.» —, così che il Salmo 51 ha 19 versetti, come nelle Bibbie inglesi. Quanto alla data: 1927 è l'anno che il testo digitale porta con sé e che il catalogo registra, perciò il suo segno di piolo mostra 1927. La Riveduta in sé uscì nel 1924, e quale ristampa successiva questo file riproduca non è cosa che questo progetto abbia accertato.
hero.4=In questo lettore è una di tre Bibbie italiane, accanto a due copie della Diodati. Un'interfaccia in italiano non si apre su di essa: l'italiano non ha una scelta curata, così il lettore prende la prima Bibbia italiana nell'ordine del catalogo, che è Diodati 1649. Nei pioli della discendenza non è registrato per essa alcun antecedente — nemmeno la Diodati, benché la Riveduta sia una revisione della Diodati e la Diodati sia nel corpus —, così un piolo aperto sotto un versetto scende diritto al fondo delle lingue originali segnato con ≈: il Codice di Leningrado di Westminster per l'Antico Testamento e, per il Nuovo, il Textus Receptus, cioè proprio il greco da cui questa revisione si è allontanata.

