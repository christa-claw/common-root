title=Revised Version — 关于此版本 | Common Root
description=英国修订本 Revised Version：英格兰教会有史以来唯一认可的 King James Version 修订本，分三次于 1881 年至 1894 年间出版——在此则是 King James Version 与 American Standard Version 之间的一级。
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=Revised Version 是英格兰教会真正下令进行的唯一一次 King James Version 修订。坎特伯雷教省会议于 1870 年作出决议，设立两个小组，新旧约各一，集合了 50 多位来自多个宗派的英国学者——不限于圣公会人士，这本身即属新事，并曾引起争论。美国学者受邀以通信方式参与，并且参与了。指示是保守的：唯有在忠实迻译的原文确有要求之处，才可改动 Authorised Version。新约于 1881 年问世，旧约于 1885 年问世，最后处理的次经则于 1894 年问世。
hero.2=保守的指示并未阻止新约小组作出全书中影响最深远的决定。他们并不依据 Textus Receptus。韦斯科特与霍特身在该小组之中，随着工作推进不断以校样向小组提交他们自己的希腊文本；修订者最终定下的是他们自己的折衷文本，而非严格意义上韦斯科特与霍特的文本，但它已决定性地转向较早的安色尔字体抄本。把此版本与 King James Version 并列为两栏，这一转向立刻可见。在约翰一书 5:7，King James 栏读作“For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one”，而此本读作“And it is the Spirit that beareth witness, because the Spirit is the truth”。
hero.3=英国修订者没有改动的，恰是美国人最想改动的。在诗篇 23:1，此版本仍印作“The LORD is my shepherd”，与 King James Version 全然一致；位于其上的 American Standard Version 则印作“Jehovah is my shepherd”。此处唯有 King James Version 自己印出该名之处才见其名——出埃及记 6:3 两者同读“by my name JEHOVAH”——而将其贯穿整部旧约乃是美国一方的偏好，依 14 年之约被置于附录，迟至 1901 年才放入正文。把两栏对读，是看清那份约定究竟压下了什么的最短路径。第二处差别见于句子的形态而非其字句：修订者打破了逐节一行的排版，将散文排成段落，其痕迹在此保留于那些以小写起首的经节之中，因为它们是在续接前句——出埃及记 6:3 的“and I appeared unto Abraham”，而 King James 栏起首作“And I appeared”。
hero.4=此版本的卡片把年份留空，这是诚实的答案，而非缺漏。Revised Version 并非出版一次，而是三次；此处的经文是 80 卷本：66 卷加上次经的 14 卷，共 36,873 节，这意味着它载有 1894 年之前并不存在于印本中的材料。语料库著录将其标为 1885 年，即旧约完成本部圣经的那一年，谱系一级的标记所显示的也是该年。经文出自哪一次印刷并无著录——这与语料库为 King James Version 以及 1776 年芬兰文 Biblia 留下的空缺相同。另需留意，没有任何界面以此版本开启；英文界面开启于 New International Version，此本是供切换过来的。

