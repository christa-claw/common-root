# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible इस संग्रह के नवीनतम अनुवादों में से एक है और अपनी बनावट के विषय में सबसे खुली कृतियों में से एक। इसे Bible Hub और Discovery Bible के पीछे खड़े दलों ने एक परामर्शदात्री समिति के अधीन बनाया, और यह पहले दूसरे नाम से निकली: Berean Study Bible। इससे लगातार भ्रम होता रहा, क्योंकि study Bible से प्रायः वह बाइबिल समझी जाती है जो टीका और टिप्पणियों से भरी हो, और यह वैसी नहीं है। अनुवाद का नाम बदल दिया गया; संक्षेपाक्षर वैसा ही रहा।
hero.2=अधिकांश अनुवाद किसी और के सम्पादित यूनानी नए नियम से आरम्भ होते हैं। इस परियोजना ने पहले अपना गढ़ा। Berean Greek Bible नेस्ले 1904 को आधार बनाती है — इसके सम्पादकों के कथनानुसार इसलिए चुना गया कि यह वह सर्वाधिक यथार्थ समीक्षात्मक पाठ है जो पहले से सार्वजनिक अधिकार-क्षेत्र में है — और उसे नेस्ले–आलन्द, SBL के यूनानी नए नियम, टिशनडोर्फ, वेस्टकॉट–हॉर्ट, बाइज़ैंटीनी पाठ तथा टेक्स्टस रेसेप्टुस से मिलाती है, और जहाँ वे अलग होते हैं वहाँ पाद-टिप्पणी देती है। अंग्रेज़ी उसी से अनूदित हुई। पुराना नियम मासोरा इब्रानी से आता है, और जहाँ पाठ-भेद पर उनका प्रभाव पड़ता है वहाँ मृत सागर के कुण्डल, सेप्टुआजिंट तथा अन्य आरम्भिक साक्षी देखे गए हैं। वही काम फिर परतों में प्रकाशित हुआ: शब्दशः एक पंक्ति-अन्तर्गत पाठ, एक कठोर शाब्दिक संस्करण, और यह पठनीय वाला — ताकि पाठक अनुवादकों की बात मान लेने के बजाय यूनानी से अंग्रेज़ी तक एक-एक पग चल सके। इससे Berean उस विभाजक के दूसरी ओर भी आ खड़ी होती है जिसे यह संग्रह दिखाता है: जिनेवा बाइबिल और किंग जेम्स संस्करण यहाँ टेक्स्टस रेसेप्टुस से उतरते हैं, और यह नहीं उतरती।
hero.3=परियोजना ने अपने पाठ के साथ अन्त में जो किया, वह था उसे दे देना। Berean पाठ अप्रैल 2023 में सार्वजनिक अधिकार-क्षेत्र में सौंप दिए गए, और इसी कारण पूरी बाइबिल इस संग्रह में रह सकती है और उससे बाहर पुनः प्रतिलिपि की जा सकती है। पाठक के अन्तरफलक को अंग्रेज़ी पर रखिए तो New International Version खुलता है, जो यहाँ अनुज्ञप्ति के अधीन है; Berean उसके बगल की वह आधुनिक अंग्रेज़ी है जिसे कोई भी उद्धृत कर सकता है, छाप सकता है और आगे बाँट सकता है। वंश-पायदानों में यह Biblia en Español Sencillo जैसा व्यवहार करती है। इसका कोई मूल अभिलिखित नहीं, क्योंकि यह नया अनुवाद है, संग्रह में उपलब्ध किसी पाठ का संशोधन नहीं; इसलिए Berean के किसी पद के नीचे खुला पायदान किसी पुरानी अंग्रेज़ी बाइबिल पर नहीं, सीधे ≈ से चिह्नित मूल-भाषा तल पर उतरता है। सूची इसका वर्ष भी रिक्त छोड़ती है। यह चूक नहीं है — जैसे-जैसे सुधार आते हैं पाठ अब भी संशोधित होता है, और यहाँ के वर्ष चुने हुए हैं, अनुमानित नहीं; अतः जिस संस्करण की कोई एक तिथ्यंकित छपाई नहीं, उसे तिथि नहीं मिलती।

