title=Biblia 1642 — Об этом издании | Common Root
description=Biblia 1642: первая полная Библия на финском языке, переведённая за три года четырьмя учёными в Турку и напечатанная под покровительством королевы Швеции Кристины.
heroHeading=Biblia 1642
readerHref=/reader?c1.src=fb1642
thanks=С благодарностью тем, кто прислал исправления к этой странице.

# The narrative, one paragraph per key, in order.
hero.1=Первая полная Библия на финском языке. До неё был Новый Завет Микаэля Агриколы 1548 года и части Ветхого, изданные в 1550-е годы; после неё была целая Библия на языке, который едва записывали. Работу выполнили четверо учёных между 1638 и 1641 годами — Эскиль Петреус, Мартинус Стодиус, Хенрикус Хоффман и Грегориус Маттеи — при Исаакусе Ротовиусе, епископе Турку, который довёл дело до конца. Финляндия входила в состав Швеции, и том вышел в 1642 году под покровительством королевы Кристины. Попытка была сделана поколением раньше: в 1602 году была назначена комиссия по переводу Библии, вероятно под началом Эрикуса Эрици Соролайнена, епископа Турку. По-видимому, она подготовила черновики, но так и не свела их в Библию, и их судьба во многом утрачена — считается, впрочем, что эта работа сказалась на переводе 1642 года.
hero.2=Они переводили с еврейского и греческого, имея рядом немецкий Лютера. Шведская Библия Густава Васы была другой книгой на столе; её нет в этом собрании, поэтому цепь фиксирует здесь Лютера — а рядом с ним финский Агриколы 1548 года, основу, которую перерабатывала комиссия. Большее действие Библии 1642 года пришлось на сам финский язык. Язык, почти не имевший письменной прозы, получил в одном томе словарь и строй для всего — от закона до плача, — и каждая позднейшая финская Библия есть её правка или преемница, а не новое начало.
hero.3=В этом читателе издание 1642 года стоит между двумя финскими ступенями. Тремя ступенями ниже Kirkkoraamattu 1933/38, под Библией 1776 года, появляется это издание, а под ним — два родителя рядом: финский Агриколы 1548 года, основа, которую перерабатывала комиссия, и немецкий Лютера 1545 года, раскрытый на столе. Ступенью ниже цепь уже навсегда покинула финский. Текст взят из корпуса VKS Института родных языков (Kotus) по старому литературному финскому, и поэтому написание, которое вы видите, — «tulcon walkeus» — принадлежит самому изданию 1642 года и не приведено к современной норме.

