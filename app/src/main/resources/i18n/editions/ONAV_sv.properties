title=Open New Arabic Version — Om denna utgåva | Common Root
description=Biblicas Open New Arabic Version: en modern arabisk bibel, med upphovsrätt från 1988, 1997 och 2012, utgiven under en Creative Commons-licens som tillåter att den delas, bearbetas och trycks med kreditering.
heroHeading=Biblicas Open New Arabic Version
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Detta är en modern arabisk översättning, en annan text än [[SVD|Smith & Van Dyck]] och inte ännu en kopia av den. Den ges ut av Biblica, Inc., vars upphovsrättsnotis bär tre år: 1988, 1997 och 2012. Textens egen upphovsrättssida ger dess äldre namn, Ketab El Hayat Majani.
hero.2=Det som skiljer den ut i den här läsaren är dess licens. Biblica gav ut den som en "öppen" text under licensen Creative Commons Erkännande-DelaLika 4.0: vem som helst får kopiera, bearbeta och trycka den, förutsatt att Biblica krediteras och att allt som byggs på den delas på samma villkor. Krediteringstexten Biblica begär är: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". De flesta moderna översättningar erbjuds inte på detta sätt, och det är därför den finns här.
hero.3=Licensen har ett villkor som är värt att känna till. Den oförändrade texten får bära namnet Biblica. En omordnad text får inte: utgåvorna i Händelseordning och Skrivordning på denna sajt lägger böckerna i en annan ordning, vilket vi behandlar som en bearbetning, så de anger att texten har omordnats och använder inte Biblicas namn som titel.
hero.4=Filen är helt vokaliserad. En detalj i dess källa: Apostlagärningarna 15:25 och 26 är tryckta som en enda vers, så korpuset håller dem samman under vers 25 och har ingen separat vers 26 där.

