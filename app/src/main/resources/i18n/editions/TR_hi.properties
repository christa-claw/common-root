title=टेक्स्टस रिसेप्टस — इस संस्करण के बारे में | Common Root
description=टेक्स्टस रिसेप्टस: लूथर, टिंडेल और किंग जेम्स अनुवाद के पीछे खड़ा मुद्रित यूनानी नया नियम, जिसे 1516 में इरास्मस ने पहली बार संपादित किया और जिसे 1633 की एक विज्ञापन पंक्ति से नाम मिला।
heroHeading=टेक्स्टस रिसेप्टस
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=इस संग्रह की हर सुधारकालीन बाइबल उस पुस्तक से उतरी है जो 1516 में बासेल में छपी। रॉटरडम के इरास्मस यूनानी नया नियम सबसे पहले छापना चाहते थे, और उन्होंने जल्दी काम किया — बासेल में जिन गिनी-चुनी परवर्ती पाण्डुलिपियों तक पहुँच सके, उनमें से कोई बहुत पुरानी नहीं थी। जहाँ उनकी प्रकाशितवाक्य की प्रति का अंतिम पन्ना गायब था, वहाँ उन्होंने अंतिम छह पदों को लैटिन वल्गाता से पुनः यूनानी में अनूदित किया। वे पद छपाई में आए और चार सदियों तक वहीं बने रहे।
hero.2=इसके बाद सौ वर्षों तक पाठ सुधारा और फिर से छापा जाता रहा — पहले स्वयं इरास्मस द्वारा, फिर पेरिस में रॉबेर एस्त्येन और जेनेवा में थियोडोर बेज़ा द्वारा। एस्त्येन के 1551 के चौथे संस्करण ने ऐसा कुछ किया जिसके परिणाम विद्वत्ता से कहीं आगे गए: उसने पाठ को संख्यांकित पदों में बाँट दिया। ये वही पद-संख्याएँ हैं जो आज भी दुनिया की लगभग हर बाइबल में छपती हैं — और वेही जिन्हें यह रीडर बंद करने देता है।
hero.3=नाम सबसे अंत में आया, और विज्ञापन से आया। 1633 में लाइडेन के एल्ज़ेवियर बंधुओं ने अपने संस्करण का प्रचार इस पंक्ति से किया कि पाठक के पास अब “वह पाठ है जिसे सबने स्वीकार किया” — textus receptus। यह एक पुस्तक-विक्रेता का दावा था, विद्वानों का निर्णय नहीं, पर यह टिक गया। जब उन्नीसवीं सदी में पुरानी पाण्डुलिपियाँ सामने आईं, तो टिशेनडॉर्फ से लेकर वेस्टकॉट और हॉर्ट तक के संपादकों ने उन पर नए पाठ खड़े किए, और आधुनिक अनुवाद उन्हीं का अनुसरण करते हैं। टेक्स्टस रिसेप्टस यहाँ उसी कारण से है जो इसे महत्व देता है: यही वह पाठ था जो लूथर, टिंडेल, जेनेवा के अनुवादकों और किंग जेम्स समितियों के सामने वास्तव में था — इसलिए उनके शब्दों को इसी के सामने रखकर पढ़ा जाना चाहिए।

