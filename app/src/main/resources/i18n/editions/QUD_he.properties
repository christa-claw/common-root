title=ארבעים חדית׳ קודסי — על מהדורה זו | Common Root
description=ארבעים חדית׳ קודסי — אמרות שמשמעותן, לפי אמונת המוסלמים, מקורה באל, ואילו ניסוחן, כבכל חדית׳ אחר, עובר במוחמד — נקראות כאן כספר לוויה להארבעים של אלנוואוי.
