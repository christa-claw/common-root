# The narrative, one paragraph per key, in order.
hero.1=חדית׳ קודסי ("קדוש" או "אלוהי") נבדל מחדית׳ רגיל במקור שממנו, כביכול, נובעת משמעותו: חכמים כאלג׳ורג׳אני מתארים אותו כדבר האל, המובא בניסוחו של מוחמד עצמו, בניגוד לקוראן שניסוחו עצמו נתפס כדבר האל. ההבחנה הזו נוגעת למעמד, לא למהימנות — חדית׳ קודסי אינו צריך להיות צחיח (מהימן); חלק מהמסווגים כך הם צ׳עיף (חלשים) או מוטלים בספק, ונבחנים לפי אותם קני מידה של שלשלת המסירה כמו כל חדית׳ אחר.
hero.2=איסוף ארבעים חדית׳ קודסי הולך בעקבות אותו מנהג ישן של [[NAW|הארבעים של אלנוואוי]] ושל סוגת "ארבעים החדית׳ים" (ארבעיניאת) הרחבה שאליה הוא משתייך, אך מוגבל כאן לקטגוריה אחת של חדית׳ ולא לחדית׳ בכלל. מהדורה אנגלית נפוצה בדיוק בשם הזה — שנבחרה ותורגמה בידי עזאלדין אבראהים ודניס ג׳ונסון-דייוויס, שחיברו גם את תרגום הלוויה לאוסף של אלנוואוי — יצאה לאור בהוצאת Islamic Texts Society בשנת 1997 כספר דו-לשוני בערבית ובאנגלית, שארבעים חדית׳יו נאספו מכל רוחב ספרות החדית׳ הקלאסית. האם ארבעים החדית׳ים המוצגים באוסף הזה הם אותה בחירה עצמה, או קובץ שנאסף באופן עצמאי ויצא לאור תחת אותו שם מסורתי, לא נקבע מצד האוסף הזה.
hero.3=הטקסט הערבי כאן הוא המתן הקלאסי, הנחשב לנחלת הכלל. תחתיו בקורא נמצא תרגום לאנגלית, הנלקח ממהדורת eng-qudsi של fawazahmed0/hadith-api ומיושר חדית׳ מול חדית׳ עם הערבית, כך ששניהם ניתנים לקריאה כזוג — אותו סידור לוויה שהאוסף הזה משתמש בו עבור [[BUK|צחיח אלבוכ׳ארי]], [[MUS|צחיח מוסלם]], [[ABD|סונן אבו דאווד]], [[TIR|ג׳אמע אלתרמד׳י]], [[NAS|סונן אלנסאאי]], [[IBM|סונן אבן מאג׳ה]], [[MAL|מואטא של מאלכ]], [[NAW|הארבעים של אלנוואוי]] ותרגומי הקוראן שלו. מאיזה תרגום אנגלי מתפרסם נובע הקובץ הזה עצמו לא נקבע מצד האוסף הזה, ומשום כך סומן רישיונו כנמצא בבדיקה ולא כנחלת הכלל פשוט; הערבית שמעליו אינה נושאת אי-ודאות כזו.

