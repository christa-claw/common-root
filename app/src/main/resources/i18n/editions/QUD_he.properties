fact.1.label=שפה
fact.1.value=ערבית קלאסית, עם תרגום לאנגלית המופיע תחת כל חדית׳ בקורא
fact.2.label=מחבר
fact.2.value=אין מחבר קלאסי יחיד; מהדורה אנגלית שפורסמה בשם הזה נבחרה ותורגמה בידי עזאלדין אבראהים ודניס ג׳ונסון-דייוויס, שאספו את ארבעים חדית׳יה מכל רוחב ספרות החדית׳ הקלאסית
fact.3.label=השם
fact.3.value=חדית׳ קודסי — חדית׳ "קדוש" או "אלוהי", שמשמעותו נחשבת לבאה מהאל אף שניסוחו הוא של מוחמד עצמו, בניגוד לקוראן
fact.4.label=מקום ומועד החיבור
fact.4.value=אנתולוגיה שנאספה מתוך ספרות החדית׳ הרחבה ולא טקסט רציף אחד; מהדורתם האנגלית של אבראהים/ג׳ונסון-דייוויס בשם הזה פורסמה בשנת 1997
fact.5.label=שיטה
fact.5.value=בחירה לפי סיווג כקודסי ולא לפי מעמד קנוני; חדית׳ קודסי אינו צריך להיות צחיח (מהימן) — חלק מהמסווגים כך הם צ׳עיף (חלשים) או מוטלים בספק
fact.6.label=מעמד
fact.6.value=אחת מכמה אנתולוגיות הנושאות את השם הזה, באותה מסורת ארוכת שנים של ארבעים חדית׳ים (ארבעיניאת) כמו [[NAW|הארבעים של אלנוואוי]]
fact.7.label=מספר החדית׳
fact.7.value=40
fact.8.label=באוסף זה
fact.8.value=ספר אחד ו-40 חדית׳ים ממוספרים
