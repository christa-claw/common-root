fact.9.value=נלקח ממהדורת eng-qudsi של fawazahmed0/hadith-api, מוצג כלוויה לערבית; האם הוא נובע מתרגום אבראהים/ג׳ונסון-דייוויס או מתרגום עצמאי אחר לא אושר מצד האוסף הזה
fact.10.label=רישיון
