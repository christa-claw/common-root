title=Brentons englische Septuaginta in aktualisierter Schreibung — Über diese Ausgabe | Common Root
description=Sir Lancelot Brentons englische Septuaginta von 1844 und 1851, Schreibung und Namen 2020 von Adam Boyd auf den heutigen Stand gebracht – dieselbe Übersetzung wie der ursprüngliche Brenton neben ihr in diesem Korpus, mit thou und thee dort, wo Brenton sie hinsetzte.
heroHeading=Brentons englische Septuaginta in aktualisierter Schreibung
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=Dies ist Sir Lancelot Brentons englische Übersetzung der Septuaginta, des griechischen Alten Testaments, mit auf den heutigen Stand gebrachtem Englisch. Brenton übersetzte vor allem aus dem Codex Vaticanus; Samuel Bagster and Sons in London veröffentlichten seine Übersetzung 1844 und noch einmal mit den Apokryphen 1851. Im Jahr 2020 überarbeitete Adam Boyd sie für eBible.org und gab seine Änderungen gemeinfrei. Neu übersetzt hat er sie nicht. Seine Einleitung zählt auf, was er änderte: die Schreibung auf modernes amerikanisches Englisch gebracht, sodass aus „shew“ „show“ wird; Personen- und Ortsnamen in den Formen, die englische Leser kennen; „begat“ und „spake“ zu „begot“ und „spoke“; Bindestriche und doppelte Satzzeichen bereinigt; und Poesie als Poesie gesetzt. Was er beibehielt, ist ebenso gewollt: „thou“, „thee“ und „ye“ mit den dazugehörigen Verbformen, Brentons Grammatik und seine schwere Zeichensetzung des 19. Jahrhunderts.
hero.2=Der Unterschied zeigt sich am besten neben dem ursprünglichen Brenton, der ebenfalls in diesem Korpus steht. Brenton schrieb hebräische Namen so, wie das Griechische sie schreibt; die Bearbeitung gibt meist die englische Form. Wo Brentons Nehemia mit „the words of Neemias the son of Chelcia“ beginnt, steht hier „Nehemiah the son of Hacaliah“; aus Elias the Thesbite wird Elijah the Tishbite, und aus Emmanuel in Jesaja 7,14 wird Immanuel. Unter der Schreibung ist die Übersetzung noch immer Brentons, also liest sie noch immer, wo das Griechische liest. „A virgin shall conceive“ in Jesaja 7,14 gibt das griechische parthenos wieder; die Psalmen behalten die griechische Zählung, sodass Psalm 22 hier der Hirtenpsalm ist; und die Erde von 1. Mose 1,2 ist noch immer „unsightly and unfurnished“. Auch die alten Pronomen bleiben: „thou shalt call his name Immanuel“.
hero.3=In diesem Reader steht sie außerhalb der Abstammungssprossen. Das Korpus verzeichnet für sie keine Vorlage – weder das Griechische, das Brenton übersetzte, noch den Brenton, den sie überarbeitet –, sodass eine Sprosse, die man unter einem ihrer Verse öffnet, geradewegs auf den mit ≈ markierten Ursprachenboden fällt, der für das Alte Testament der Codex Leningradensis ist: ein hebräischer Text, nicht das Griechische, aus dem diese Übersetzung gemacht wurde. Wer von Brentons Englisch hinab in sein Griechisch steigen will, öffnet den ursprünglichen Brenton, dessen verzeichnete Vorlage die Septuaginta ist. Auf dieser Ausgabe steht ihrerseits nichts, und keine Oberflächensprache öffnet auf ihr; eine englische Oberfläche öffnet auf der New International Version. Unsere Abschrift ist schmaler als das Buch. Sie hat 36 Bücher. Esra und Nehemia sind ein einziges Buch mit 23 Kapiteln, wie im Griechischen, und Nehemia beginnt mit Kapitel 11. Die Dateien von eBible.org, aus denen sie stammt, enthalten auch die Apokryphen und geben Ester und Daniel nur in ihrer längeren griechischen Gestalt; nichts davon wurde übernommen, also gibt es hier weder Ester noch Daniel und auch weder Tobit noch die Weisheit.

