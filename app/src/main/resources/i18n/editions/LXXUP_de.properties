fact.8.value=36 Bücher, nur Altes Testament; Esra und Nehemia als ein Buch, kein Ester, kein Daniel und keine Apokryphen – die Quelldateien enthalten sie, aber sie wurden nicht übernommen
fact.9.label=Abstammung
fact.9.value=Keine verzeichnete Vorlage – eine Sprosse öffnet geradewegs auf den Ursprachenboden, [[WLC|den Codex Leningradensis]], nicht auf [[LXX|das Griechische]], zu dem [[LXXE|der ursprüngliche Brenton]] hinabsteigt
