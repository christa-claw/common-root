title=Versión Biblia Libre — על מהדורה זו | Common Root
description=Versión Biblia Libre: תנא"ך ספרדי מבית Free Bible Ministry, שתירגמו ג'ונתן גלאגר ושלי בריוס דה אווילה כמהדורת האחות הספרדית של ה-Free Bible Version האנגלית, ומוענק ברישיון חופשי לכל שימוש.
heroHeading=Versión Biblia Libre
readerHref=/reader?c1.src=vbl

# The narrative, one paragraph per key, in order.
hero.1=Versión Biblia Libre — "הגרסה החופשית של התנא\"ך" — היא מהדורת האחות הספרדית של ה-Free Bible Version האנגלית, שפרסם אותו מוציא לאור, Free Bible Ministry, עמותה שמקום מושבה בלורל שבמרילנד. הברית החדשה שלה מיוחסת למתרגמים ג'ונתן גלאגר ושלי בריוס דה אווילה, כאשר גוסטאבו סנאברייה ורבקה פלדאס הם שותפים לעבודה, והיא נושאת זכויות יוצרים מתוארכות ל-2018–2020 על שם גלאגר ובריוס דה אווילה. כמו אחותה האנגלית, היא קיימת כדי להסיר את עמוד זכויות היוצרים כמכשול לשימוש: כל אחד רשאי להעתיק, להדפיס, לפרסם ברשת או לעבד את הטקסט, ללא תמלוגים וללא רשות שיש לבקש.
hero.2=הפתח-הדבר שפורסם מתעד בבירור את יסוד הברית החדשה — תורגמה ישירות מהטקסט היווני של נסטלה–אלנד, הטקסט הביקורתי שחברות המקרא משתמשות בו — אך אינו נוקב בנפרד בטקסט מקור לברית הישנה, אף שהמהדורה שמחזיק אוסף זה היא הקאנון הפרוטסטנטי המלא של ששים וששה ספרים. היכן שהחומרים משאירים חלל, הוא נותר כך גם כאן, במקום להתמלא בניחוש.
hero.3=בקורא הזה זו אחת מחמש מהדורות ספרדיות. הממשק הספרדי עדיין פותח כברירת מחדל את [[RVR09|Reina-Valera 1909]], נוסח נחלת הכלל ממסורת שונה לחלוטין ובת מאות שנים; למהדורה זאת, לעומת זאת, מגיעים מכרטיסה שלה, לצד [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] ו-[[NBLA|Nueva Biblia de las Américas]]. היא אינה עיבוד של אף אחת מהן, כך שלא נרשם לה מקור בשלבי השושלת — שלב הנפתח מתחת אחד מפסוקי Versión Biblia Libre צונח הישר אל רצפת לשונות המקור המסומנת ב-≈. קרובתה הקרובה ביותר באוסף זה אינה ספרדית כלל: [[FBV|Free Bible Version]], התרגום האנגלי של אותו הגוף, תחת אותו הרישיון.

