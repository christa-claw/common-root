fact.8.value=אחת מחמש מהדורות ספרדיות, עם [[RVR09|Reina-Valera 1909]] (המהדורה שהממשק הספרדי פותח בה כברירת מחדל), [[BES|Biblia en Español Sencillo]], [[PDDPT|Palabra de Dios para Ti]] ו-[[NBLA|Nueva Biblia de las Américas]] — ולאף אחת מהן אין כאן עדיין מקור רשום; וגם מהדורת האחות הספרדית של ה-[[FBV|Free Bible Version]] האנגלית, תחת אותו הרישיון מאותו המוציא לאור
