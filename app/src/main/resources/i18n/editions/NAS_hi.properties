# The narrative, one paragraph per key, in order.
hero.1=अबू अब्द अल-रहमान अहमद इब्न शुऐब इब्न अली अल-नसाई का जन्म हिजरी संवत् 214–215 (829–830 ई.) के आसपास नसा में हुआ, जो ख़ुरासान का एक नगर था और आज तुर्कमेनिस्तान में स्थित है। उन्होंने लगभग पंद्रह वर्ष की आयु में हदीस की खोज में यात्रा आरंभ की, पहले क़ुतैबा इब्न सईद से शिक्षा प्राप्त की — जिनके साथ वे बग़लान में एक वर्ष से अधिक रहे — और फिर इराक़, हिजाज़, सीरिया और मिस्र होते हुए यात्रा जारी रखी, जहाँ उन्होंने इस्हाक़ इब्न राहवैह और [[ABD|सुनन अबू दाऊद]] के संकलनकर्ता अबू दाऊद अल-सिजिस्तानी जैसे विद्वानों से शिक्षा प्राप्त की। वे मिस्र में बस गए, वहाँ शिक्षा दी, और "हाफ़िज़ अल-हदीस" के रूप में प्रसिद्ध हुए; बाद के जीवनीकार इस बात पर असहमत हैं कि क्या उन्होंने वास्तव में मुहम्मद अल-बुख़ारी से सीधे शिक्षा प्राप्त की थी, क्योंकि अल-मिज़्ज़ी का तर्क था कि दोनों कभी नहीं मिले। जीवन के अंतिम दौर में काहिरा से मक्का की यात्रा करते हुए, वे दमिश्क़ में ठहरे, जहाँ पारंपरिक विवरण के अनुसार, नबी के साथियों के गुणों पर दिया गया उनका एक भाषण, शहर में व्याप्त अली-विरोधी भावना के बीच एक शत्रुतापूर्ण भीड़ को उत्तेजित कर गया; वे इसके कुछ ही समय बाद, हिजरी संवत् 303 (915 ई.) में, वहाँ लगी चोटों के कारण चल बसे। उनके दफ़न स्थान को लेकर विवरण भिन्न हैं — एक परंपरा के अनुसार मक्का में सफ़ा और मरवा के बीच, दूसरी के अनुसार फ़िलिस्तीन के रामला में।
hero.2=उन्हें दिए गए लगभग पंद्रह ग्रंथों में से छह हदीस से संबंधित हैं। सबसे बड़े ग्रंथ, अल-सुनन अल-कुब्रा, को उन्होंने स्वयं बाद में एक छोटे चयन में संक्षिप्त किया, जो सुनन अल-सुग़रा ("छोटा सुनन") या अल-मुजतबा ("चयनित") के नाम से जाना जाता है — वही ग्रंथ जिसे आज सीधे "सुनन अल-नसाई" कहा जाता है। यह चयन किसने और किसके आग्रह पर किया, इसका उल्लेख इस पृष्ठ के लिए देखे गए स्रोतों में नहीं मिलता। इसमें अल-नसाई ने हदीसों को विधिक विषय के अनुसार व्यवस्थित किया, जैसा [[ABD|अबू दाऊद]] और [[TIR|अल-तिर्मिज़ी]] ने किया था। विधिशास्त्री इब्न हजर अल-असक़लानी ने बाद में इसे विशेष रूप से इस बात के लिए चिह्नित किया कि इसमें, दोनों सहीहों के बाद, छह पुस्तकों में सबसे कम दुर्बल (ज़ईफ़) हदीसें और अविश्वसनीय रावी हैं, और इसमें एक भी मनगढ़ंत (मौज़ू) हदीस नहीं है।
hero.3=सुन्नी परंपरा सुनन अल-नसाई को छह पुस्तकों (कुतुब अल-सित्ता) में गिनती है, [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]] और [[TIR|जामिʿ अल-तिर्मिज़ी]] के साथ, तथा एक छठी पुस्तक के साथ जिसे लेकर सुनन इब्न माजा और अन्य उम्मीदवारों के बीच विवाद है। चार सुनन-संग्रहों के बीच यह ठीक किस स्थान पर आता है, यह विवाद का विषय है, निर्णीत नहीं: कुछ स्रोत इसे छहों में तीसरा सबसे प्रामाणिक बताते हैं, केवल दोनों सहीहों के बाद, जबकि इस संग्रह के अपने [[ABD|सुनन अबू दाऊद]] और [[TIR|जामिʿ अल-तिर्मिज़ी]] पृष्ठ उस अधिक सामान्य क्रम को दर्शाते हैं जो अबू दाऊद की पुस्तक को तीसरा स्थान देता है। इसके लिए दी गई हदीसों की संख्या भी इसी तरह भिन्न है: अल-मुजतबा के लिए एक व्यापक रूप से उद्धृत आँकड़े के अनुसार 5,758, दोहराई गई रिवायतों सहित, जबकि इस संग्रह का स्रोत संस्करण 5,765 क्रमांकित करता है — स्रोत इन दोनों संख्याओं में समन्वय नहीं करते।
hero.4=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-nasai संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह [[BUK|सहीह अल-बुख़ारी]], [[MUS|सहीह मुस्लिम]], [[ABD|सुनन अबू दाऊद]], [[TIR|जामिʿ अल-तिर्मिज़ी]] और अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

