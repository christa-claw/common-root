title=Bible in Basic English — Acerca de esta edición | Common Root
description=La Bible in Basic English, traducida del hebreo y del griego por un comité dirigido por S. H. Hooke y publicada por Cambridge University Press —el Nuevo Testamento en 1941, la Biblia completa en 1949— en el Basic English de C. K. Ogden, de 850 palabras, con otras 150 añadidas para la poesía y para la Biblia.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=El Basic English fue obra de C. K. Ogden, del Orthological Institute: una lista de 850 palabras inglesas, propuesta como lengua auxiliar internacional. La Bible in Basic English la hizo un comité bajo la dirección de S. H. Hooke (1874–1968), el especialista en Antiguo Testamento que en 1930 llegó a ser profesor Samuel Davidson de Estudios del Antiguo Testamento en la Universidad de Londres, en colaboración con el Orthological Institute. Se tradujo del hebreo y del griego, no se simplificó a partir de una versión inglesa anterior, y después un comité formado por los Syndics de Cambridge University Press revisó en detalle el texto en Basic. A las 850 palabras de Ogden los traductores añadieron 100 que ayudan con la poesía y 50 necesarias para la Biblia, 150 en total. Cambridge University Press publicó el Nuevo Testamento en 1941 y la Biblia completa en 1949; una impresión de 1965 se distribuyó en los Estados Unidos sin aviso de copyright, y por eso el texto es allí de dominio público.
hero.2=El resultado se lee con sencillez y regularidad, dentro de ese vocabulario reducido. El Génesis empieza «At the first God made the heaven and the earth.» El Salmo 23 empieza «The Lord takes care of me as his sheep; I will not be without any good thing.» El Evangelio de Juan empieza «From the first he was the Word, and the Word was in relation with God and was God,» y Juan 3:16 dice «For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.» El nombre divino es «the Lord» en todo el texto, salvo en ocho versículos donde aparece como «Yahweh», entre ellos Éxodo 6:3, donde Dios dice que Abraham, Isaac y Jacob «had no knowledge of my name Yahweh», y Salmo 83:18. Donde el hebreo era demasiado incierto para traducirlo, los traductores pusieron puntos en su lugar, y en nuestra copia algunos versículos, entre ellos Job 34:29–33 y Job 36:16–20, no son más que «...».
hero.3=Nuestra copia contiene 66 libros, del Génesis al Apocalipsis, sin los apócrifos, en la numeración de capítulos y versículos de la King James y de la Revised Version: 150 salmos, y Malaquías termina en el capítulo 4. No lleva títulos de los salmos: el Salmo 51 empieza en «Have pity on me, O God». El Nuevo Testamento no es una traducción del texto recibido. Dieciséis versículos que las ediciones críticas omiten, entre ellos Mateo 17:21, Hechos 8:37 y Romanos 16:24, se conservan aquí solo como lugares vacíos marcados [], y 1 Juan 5:7 no tiene los tres testigos en el cielo; el relato de la mujer sorprendida en adulterio, Juan 7:53–8:11, va entre corchetes, mientras que el final largo de Marcos se conserva. En este lector se sostiene por sí misma. El corpus no le registra ningún antecesor, de modo que un peldaño del linaje abierto bajo uno de sus versículos cae directamente al suelo de lenguas originales marcado con ≈: el Códice de Leningrado en el Antiguo Testamento y el Textus Receptus en el Nuevo, un texto griego que esta traducción no sigue en esos dieciséis lugares. Tampoco hay nada registrado que se apoye en ella. Ningún idioma de la interfaz se abre en esta edición; una interfaz en inglés se abre en la New International Version, y a esta se llega desde su propia tarjeta en la cuadrícula de traducciones.

