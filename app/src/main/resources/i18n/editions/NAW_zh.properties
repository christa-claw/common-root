title=纳瓦维四十圣训 — 关于此版本 | Common Root
description=纳瓦维四十圣训：伊玛目纳瓦维精选的42则圣训，每则都被视为宗教的"重大根基"（卡伊达·阿齐麦）——四十圣训这一体裁中阅读最广的作品。
heroHeading=纳瓦维四十圣训
readerHref=/reader?c1.src=naw-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=叶哈雅·伊本·舍拉夫·纳瓦维生于希吉拉历631年穆哈兰姆月（西历1233年10月），出生地在叙利亚达拉附近的纳瓦村，十八岁时迁往大马士革求学。希吉拉历665年（1267年），他被任命为大马士革阿什拉菲耶圣训学院院长，此职一直担任到他去世——希吉拉历676年（1277年），四十多岁时在纳瓦村去世，并葬于该地。他是沙斐仪学派的教法学家，在短暂的一生中撰写了大量著作——其他著作包括《善行园》、被称为《明灯》的《穆斯林圣训实录》注释、《穆海扎卜详解大全》、《求学者指南》与《祈词全书》。
hero.2=《纳瓦维四十训》延续了更古老的"四十圣训"（阿尔巴伊尼亚特）体裁传统，其根源是一则圣训，承诺为本民族保存四十则宗教圣训的人，将在审判日跻身学者之列——这则圣训本身，大多数批评者将其判定为达伊夫（弱）。这一体裁最早的汇编（如今已失传）归于阿卜杜拉·伊本·穆巴拉克（卒于797年）；此后许多学者纷纷编纂自己的选集。纳瓦维选录了他判定为可靠的圣训，大多出自[[BUK|布哈里圣训实录]]和[[MUS|穆斯林圣训实录]]，每一则都说明了他所称的宗教"重大根基"——尽管名为"四十"，但该汇编如今实际收录四十二则圣训。它成为该体裁中阅读最广的范例，招来数十部注释，其中最著名的是伊本·拉贾卜·哈乃拜里的《知识与智慧全集》，并被列为《古兰经》之后逊尼派伊斯兰中阅读最广的著作之一。
hero.3=此处的阿拉伯语文本是公有领域的古典正文（matn）。阅读器中其下方附有一段英译文，取自fawazahmed0/hadith-api的eng-nawawi版本，并逐条圣训与阿拉伯语对齐，使两者可并排阅读——这与本语料库在[[BUK|布哈里圣训实录]]、[[MUS|穆斯林圣训实录]]、[[ABD|艾布·达乌德圣训集]]、[[TIR|提尔米济圣训实录]]、[[NAS|奈萨仪圣训集]]、[[IBM|伊本·马哲圣训集]]、[[MAL|马立克穆瓦塔]]及《古兰经》译文中采用的伴读方式相同。这份英译文件本身究竟源自哪一个已出版的英译本，本语料库尚未予以确认，因此其许可被标注为审核中，而非直接标注为公有领域；上方的阿拉伯语文本则不带有这种不确定性。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=语言
fact.1.value=古典阿拉伯语，阅读器中每则圣训下方附有英译文
fact.2.label=编纂者
fact.2.value=叶哈雅·伊本·舍拉夫·纳瓦维（希吉拉历631–676年／西历1233–1277年）
fact.3.label=名称
fact.3.value=称为《纳瓦维四十训》（阿尔巴因·纳瓦维耶）；尽管名为"四十"，该汇编实收四十二则圣训
fact.4.label=编纂地点与时间
fact.4.value=主要出自[[BUK|布哈里圣训实录]]和[[MUS|穆斯林圣训实录]]，编于纳瓦维任大马士革阿什拉菲耶圣训学院院长期间（希吉拉历665年／1267年），直至他希吉拉历676年（1277年）在叙利亚纳瓦村去世为止
fact.5.label=方法
fact.5.value=每则圣训之所以入选，是因为纳瓦维认为它体现了宗教的"重大根基"；延续了更古老的四十圣训体裁（阿尔巴伊尼亚特），其最早且已失传的范例归于阿卜杜拉·伊本·穆巴拉克（卒于797年）
fact.6.label=地位
fact.6.value=普遍被视为《古兰经》之后逊尼派伊斯兰中阅读最广的著作之一；数十部注释的对象，其中最著名的是伊本·拉贾卜·哈乃拜里的《知识与智慧全集》
fact.7.label=圣训数量
fact.7.value=尽管名为"四十"，实为42则；本语料库所据底本同样如此计数
fact.8.label=在本语料库中
fact.8.value=1卷、42则编号圣训
fact.9.label=英译文
fact.9.value=取自fawazahmed0/hadith-api的eng-nawawi版本，作为阿拉伯语的对照译文显示；该文件究竟源自哪一个出版译本，本语料库尚未确认
fact.10.label=许可
fact.10.value=阿拉伯语正文是公有领域的古典文本；英译文的许可仍在审核中
