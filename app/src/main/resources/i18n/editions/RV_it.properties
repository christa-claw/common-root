title=Revised Version — Su questa edizione | Common Root
description=L’English Revised Version: l’unica revisione della King James Version che la Chiesa d’Inghilterra abbia mai autorizzato, uscita in tre consegne fra il 1881 e il 1894 — e qui il piolo fra la King James Version e l’American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=La Revised Version è l’unica revisione della King James Version che la chiesa d’Inghilterra abbia davvero commissionato. La Convocazione di Canterbury la deliberò nel 1870 e nominò due compagnie, una per ciascun Testamento, che raccolsero più di cinquanta studiosi britannici di varie confessioni — non soltanto anglicani, cosa di per sé nuova e su cui si discusse. Studiosi americani furono invitati a parteciparvi per corrispondenza, e lo fecero. L’istruzione era prudente: alterare l’Authorised Version solo dove le lingue originali, fedelmente rese, lo richiedessero. Il Nuovo Testamento uscì nel 1881, l’Antico Testamento nel 1885 e gli apocrifi, lavorati per ultimi, nel 1894.
hero.2=L’istruzione prudente non impedì alla compagnia del Nuovo Testamento di prendere la decisione di maggiori conseguenze del libro. Non lavorarono sul Textus Receptus. Westcott e Hort sedevano in quella compagnia e le sottoposero in bozze il proprio testo greco man mano che il lavoro procedeva; ciò su cui i revisori si fermarono fu il loro testo eclettico e non esattamente quello di Westcott e Hort, ma si spostò decisamente verso i manoscritti onciali più antichi. Si metta questa edizione accanto alla King James Version in due colonne e lo spostamento si vede subito. In 1 Giovanni 5:7 la colonna della King James legge «For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one», e questa legge «And it is the Spirit that beareth witness, because the Spirit is the truth».
hero.3=Ciò che i revisori britannici non mutarono è proprio quello che gli americani più volevano mutato. Nel Salmo 23:1 questa edizione stampa ancora «The LORD is my shepherd», esattamente come fa la King James Version; l’American Standard Version che le sta sopra stampa «Jehovah is my shepherd». Il nome compare qui solo dove la King James Version lo aveva stampato essa stessa — in Esodo 6:3 entrambe leggono «by my name JEHOVAH» — e portarlo per tutto l’Antico Testamento era una preferenza americana, relegata nell’appendice per l’accordo quattordicennale e lasciata entrare nel testo soltanto nel 1901. Leggere le due colonne insieme è la via più breve per vedere che cosa quell’accordo trattenne davvero. Una seconda differenza si mostra nella forma delle frasi più che nella loro lettera: i revisori ruppero con la composizione un versetto per riga e composero la prosa in paragrafi, e l’impronta sopravvive qui nei versetti che cominciano in minuscola perché proseguono una frase — «and I appeared unto Abraham» in Esodo 6:3, dove la colonna della King James comincia «And I appeared».
hero.4=La scheda di questa edizione lascia l’anno in bianco, e questa è la risposta onesta e non una lacuna. La Revised Version non fu pubblicata una volta ma tre, e il testo qui è quello a ottanta libri: sessantasei libri più i quattordici degli apocrifi, 36.873 versetti in tutto, il che significa che porta materia che non esisteva a stampa prima del 1894. La registrazione del corpus lo timbra 1885, l’anno in cui l’Antico Testamento completò la Bibbia propriamente detta, ed è l’anno che mostra la targhetta del piolo di discendenza. Da quale stampa il testo discenda non è registrato — la stessa lacuna che il corpus lascia aperta per la King James Version e per la Biblia finlandese del 1776. Si noti inoltre che nessuna interfaccia si apre su questa edizione; un’interfaccia inglese si apre sulla New International Version, e a questa si passa.

