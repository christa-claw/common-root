title=Bible in Basic English — 关于此版本 | Common Root
description=Bible in Basic English（基本英语圣经）由 S. H. 胡克领导的委员会从希伯来文和希腊文译出，由 Cambridge University Press 出版——新约于1941年，全本圣经于1949年——使用 C. K. 奥格登的850词基本英语，另为诗歌和圣经增补了150个词。
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=基本英语（Basic English）出自 Orthological Institute 的 C. K. 奥格登之手：这是一份由850个英语单词组成的词表，被提议作为国际辅助语言。Bible in Basic English 由 S. H. 胡克（1874–1968）主持的委员会与 Orthological Institute 合作译成；胡克是旧约学者，1930年成为伦敦大学塞缪尔·戴维森旧约研究讲座教授。此译本是从希伯来文和希腊文译出的，而不是从某部较早的英文译本简化而来；之后，由 Cambridge University Press 理事会组成的委员会又对这部基本英语文本作了详细审阅。在奥格登的850个词之外，译者增补了100个有助于诗歌的词和50个圣经所需的词，共150个。Cambridge University Press 于1941年出版新约，1949年出版全本圣经；1965年的一次印本在美国发行时没有版权声明，因此该文本在美国属于公共领域。
hero.2=译文在这一小词汇量之内读来平实而均匀。创世记开篇为“At the first God made the heaven and the earth.”诗篇23篇开头是“The Lord takes care of me as his sheep; I will not be without any good thing.”约翰福音开篇为“From the first he was the Word, and the Word was in relation with God and was God,”约翰福音3:16则是“For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.”神的名字通篇作“the Lord”，只有8节经文作“Yahweh”，其中包括出埃及记6:3——神在那里说亚伯拉罕、以撒和雅各“had no knowledge of my name Yahweh”——以及诗篇83:18。凡希伯来文过于不确定、无法翻译之处，译者都以省略点代替；在我们的副本中，有几节经文只有“...”，其中包括约伯记34:29–33和约伯记36:16–20。
hero.3=我们的副本共66卷，从创世记到启示录，不含次经，采用 King James 和 Revised Version 的章节编号——诗篇共150篇，玛拉基书止于第4章。其中没有诗篇标题：诗篇51篇从“Have pity on me, O God”开始。新约并非公认文本的译本。校勘本所删去的16节经文，包括马太福音17:21、使徒行传8:37和罗马书16:24，在这里只保留为标作[]的空位；约翰一书5:7中没有天上的3个见证；行淫时被拿的妇人的故事，即约翰福音7:53–8:11，置于方括号中；而马可福音的较长结尾则予以保留。在本阅读器中，它独立存在。语料库没有为它记录母本，因此在它某节经文下打开的谱系之级会直接落到以≈标记的原文语言底层：旧约为列宁格勒抄本，新约为 Textus Receptus——而在那16处，此译本并不依从这一希腊文本。也没有任何版本被记录为立于它之上。没有任何界面语言默认打开此版本；英文界面默认打开的是 New International Version，此版本须从翻译网格中它自己的卡片进入。

