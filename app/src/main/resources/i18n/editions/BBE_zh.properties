fact.1.label=语言
fact.1.value=英语——基本英语，即 C. K. 奥格登的简化词汇
fact.2.label=译者
fact.2.value=由 S. H. 胡克（1874–1968，伦敦大学塞缪尔·戴维森旧约研究讲座教授）主持的委员会，与 Orthological Institute 合作；基本英语文本由 Cambridge University Press 理事会的委员会审阅
fact.3.label=译自
fact.3.value=希伯来文和希腊文——一部新译本，而非对较早英文圣经的修订，尽管其章节编号与 [[KJV|King James Version]] 和 [[RV|Revised Version]] 相同
fact.4.label=词汇
fact.4.value=奥格登的850个基本词，另加100个有助于诗歌的词和50个圣经所需的词——共增补150个
fact.5.label=出版
fact.5.value=Cambridge University Press：新约，1941年；全本圣经，1949年；1965年的一次印本在美国发行时没有版权声明
fact.6.label=授权
fact.6.value=公共领域；本副本取自 eBible.org
fact.7.label=在本语料库中
fact.7.value=66卷，完整的新教正典，不含次经；采用英文章节编号，因此诗篇共150篇；没有诗篇标题；校勘本删去的16节新约经文只保留为标作[]的空位
fact.8.label=谱系
fact.8.value=无记录在案的母本，也没有记录在案立于其上的版本——级会直接打开在原文语言底层：旧约为[[WLC|列宁格勒抄本]]，新约为[[TR|公认文本]]，而此译本并不依从这一希腊文本
