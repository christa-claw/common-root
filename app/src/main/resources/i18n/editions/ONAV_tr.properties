title=Open New Arabic Version — Bu baskı hakkında | Common Root
description=Biblica'nın Open New Arabic Version'ı: 1988, 1997 ve 2012 telif haklarını taşıyan modern bir Arapça Kutsal Kitap; paylaşılmasına, uyarlanmasına ve atıfla basılmasına izin veren bir Creative Commons lisansıyla yayımlanmıştır.
heroHeading=Biblica'nın Open New Arabic Version'ı
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=Bu, [[SVD|Smith & Van Dyck]]'ten farklı bir metin olan modern bir Arapça çeviridir, onun bir başka kopyası değildir. Telif hakkı bildirimi üç yıl taşıyan Biblica, Inc. tarafından yayımlanır: 1988, 1997 ve 2012. Metnin kendi telif hakkı sayfası, onun daha eski adını verir: Ketab El Hayat Majani.
hero.2=Bu okuyucuda onu ayıran şey lisansıdır. Biblica onu Creative Commons Atıf-AynıLisanslaPaylaş 4.0 lisansı altında "açık" bir metin olarak yayımladı: Biblica'ya atıfta bulunulması ve ondan üretilen her şeyin aynı koşullarla paylaşılması koşuluyla herkes onu kopyalayabilir, uyarlayabilir ve basabilir. Biblica'nın istediği atıf metni şudur: "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". Modern çevirilerin çoğu bu şekilde sunulmaz, ve bu onun burada olma sebebidir.
hero.3=Lisansın bilinmeye değer bir koşulu vardır. Değiştirilmemiş metin Biblica adını taşıyabilir. Yeniden düzenlenmiş bir metin taşıyamaz: bu sitedeki Olay sırası ve Yazım sırası baskıları kitapları farklı bir sıraya yerleştirir; bunu bir uyarlama olarak ele alıyoruz, dolayısıyla bu baskılar metnin yeniden düzenlendiğini belirtir ve Biblica'nın adını başlık olarak kullanmaz.
hero.4=Dosya tam harekelenmiştir. Kaynağının bir ayrıntısı: Elçilerin İşleri 15:25 ve 26 tek bir ayet olarak basılmıştır, bu yüzden derleme onları 25. ayet altında birlikte tutar ve orada ayrı bir 26. ayet yoktur.

