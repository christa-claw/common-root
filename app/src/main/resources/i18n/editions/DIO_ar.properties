title=ديودَاتي 1649 (الإيطالية) — عن هذه الطبعة | Common Root
description=الكتاب المقدس الإيطالي لجوفاني ديوداتي: صدر بجنيف سنة 1607، وهو أول كتاب إيطالي نُقل عن العبرية واليونانية لا عن الفولغاتا، ونُقّح بحواشيه هو سنة 1641 — ولماذا كانت السنة المكتوبة على الملف سنة وفاته.
heroHeading=ديودَاتي 1649
readerHref=/reader?c1.src=dio

# The narrative, one paragraph per key, in order.
hero.1=وُلد جوفاني ديوداتي بجنيف سنة 1576 في أسرة تجّار من لوكّا آثرت مغادرة إيطاليا على التخلّي عن دينها. كان إيطاليَّ المحتد جِنِفيَّ النشأة، وهذا الجمع بعينه هو كل سبب وجود هذا الكتاب: كانت عنده لغة البلد الذي لم يبلغه الإصلاح، وكان قائمًا في المدينة التي صارت مطبعة الإصلاح. رشّحه تيودور بيزا لكرسي العبرية وهو ابن إحدى وعشرين سنة. وصار أستاذًا للاهوت سنة 1606، وراعيًا سنة 1608، وخلف بيزا في كرسي اللاهوت في السنة التالية؛ وفي سنة 1618 ذهب إلى مجمع دورت مندوبًا عن جنيف، وكان أحد ستة عُيِّنوا لتحرير محاضره.
hero.2=طُبع كتابه المقدس الإيطالي بجنيف سنة 1607. وقد كانت لإيطاليا كتب مقدسة بالعامية من قبل — كتاب مالِرمي سنة 1471، وكتاب بروتشولي سنة 1532 — غير أنها عملت عن اللاتينية أو اتّكأت عليها اتّكاءً شديدًا. أما ديوداتي فذهب إلى العبرية واليونانية، وكان ذلك في العهد الجديد يعني النص اليوناني الذي حرّره بيزا في المدينة نفسها قبل جيل. وفي سنة 1641 أخرج طبعة منقّحة ملحقة بحواشيه التفسيرية، وعنها تنحدر إعادات الطبع. فصارت الكتابَ المقدس البروتستانتي الإيطالي وظلّت كذلك — وهذا في بلد يكاد لا يكون فيه قرّاء بروتستانت يعني أنّ الذين حملوها أربعة قرون كانوا نفرًا قليلًا جدًّا. وقد نقل الكتاب المقدس إلى الفرنسية أيضًا سنة 1644؛ وتلك تُعَدّ عمومًا أضعف الاثنتين، ولعلّه ما كان ليجادل في ذلك.
hero.3=السنة المثبتة على البطاقة تستحق جملة، لأنها غير موجودة. يدور هذا النص رقميًّا تحت اسم ”ديوداتي 1649“، و1649 ليست طبعة — بل هي سنة وفاة ديوداتي. والسنتان اللتان تعنيان شيئًا هما 1607، حين ظهرت الترجمة أول مرة، و1641، حين نقّحها. أما أيّهما يمثّل ملفٌّ رقميٌّ بعينه فأمر لم يثبته هذا المشروع، فيترك الفهرس خانة السنة فارغة بدل أن يطبع رقمًا لا يستطيع الوقوف خلفه. وقد أُبقي الاسم كما ورد، لأنه ما سيبحث الناس عنه.
hero.4=وهي في هذا القارئ الكتابُ المقدس الإيطالي الوحيد، فضبط الواجهة على الإيطالية يفتح عليها — لا لأنها انتُقيت انتقاءً، كما انتُقيت Reina-Valera 1909 للإسبانية، بل لأن مسح الفهرس لا يجد في اللغة غيرها. وليس لها في درجات النسب أصل مسجّل، فالدرجة المفتوحة تحت الآية تهبط رأسًا إلى أرضية اللغات الأصلية المعلَّمة بـ ≈. وتلك الأرضية تقدّم لليونانية النص المستلم، وهو ههنا قريب من الحقيقة قربًا غير معتاد: ففي أكثر طبعات هذه المجموعة يقوم النص المستلم مقام نص نقديّ استعمله المترجمون فعلًا، أما ديوداتي فقد كان يعمل حقًّا عن نص يونانيّ مطبوع من تلك الأسرة. وشارة درجتها بلا سنة، وذلك يطابق الفراغ في البطاقة.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الإيطالية
fact.2.label=المترجم
fact.2.value=جوفاني ديوداتي (1576–1649)، وُلد بجنيف في أسرة تجّار بروتستانت آثرت مغادرة لوكّا على التخلّي عن دينها
fact.3.label=أول نشر
fact.3.value=1607، بجنيف — أول كتاب مقدس إيطالي نُقل عن العبرية واليونانية لا عن اللاتينية
fact.4.label=الطبعة المنقّحة
fact.4.value=1641، بحواشي ديوداتي نفسه؛ وبتلك الصورة أُعيد طبع النص القرون الثلاثة التالية
fact.5.label=لماذا يقول الاسم 1649
fact.5.value=1649 سنة وفاة ديوداتي لا سنة طبعة — والتاريخ يسافر مع النص الرقمي، وبطاقة الفهرس تترك خانة السنة فارغة بدل أن تجزم بواحدة
fact.6.label=اليونانية وراء العهد الجديد
fact.6.value=طبعات بيزا، المصنوعة بجنيف قبل جيل — ضمن أسرة النصوص اليونانية المطبوعة التي تحفظها هذه المجموعة باسم [[TR|النص المستلم]]
fact.7.label=وله أيضًا
fact.7.value=كتاب مقدس بالفرنسية، 1644، يُعَدّ عمومًا أضعف الاثنين — ولم تكن الفرنسية اللغة التي يفكّر بها
fact.8.label=المحتوى
fact.8.value=66 سفرًا — القانون البروتستانتي، بلا أسفار قانونية ثانية
fact.9.label=في هذه المجموعة
fact.9.value=الكتاب المقدس الإيطالي الوحيد ههنا، فتفتح عليه الواجهة الإيطالية؛ ولا أصل مسجّل في درجات النسب، وتظهر شارة درجته بلا سنة
