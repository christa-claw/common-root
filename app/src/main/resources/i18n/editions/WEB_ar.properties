fact.3.label=صدرت
fact.3.value=لا سنة واحدة — بُدئت سنة 1994، وصدرت في تنقيحات من سنة 1997 فصاعدًا، وهي اليوم مجمّدة إلا من التصويبات، ولهذا خانة السنة في صفحة التعريف فارغة
fact.4.label=تنقيح لـ
fact.4.value=[[ASV|American Standard Version الصادرة سنة 1901]]، اختيرت لأنها دقيقة وخالية تمامًا من حقوق النشر
fact.5.label=العهد القديم عن
fact.5.value=النص العبري المسوري في طبعة Biblia Hebraica Stuttgartensia
fact.6.label=العهد الجديد عن
fact.6.value=النص البيزنطي الأكثري — لا اليونانية النقدية لأصلها ولا [[TR|Textus Receptus]]
fact.7.label=ما يميزها
fact.7.value=“Yahweh” اسمًا لله في العهد القديم كله، حيث طبعت American Standard Version “Jehovah” وطبعت [[KJV|ترجمة الملك جيمس]] “the LORD”
fact.8.label=الترخيص
fact.8.value=الملك العام بإرادة المترجم — وهو السبب كله في ابتداء العمل
fact.9.label=في هذه المجموعة
fact.9.value=ورقة أطول سلسلة نسب — WEB → ASV → RV → KJV → GNV — وأوسع نصوصها، ثمانون سفرًا مقابل ستة وستين لـ American Standard Version
