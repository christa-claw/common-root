title=World English Bible — عن هذه الطبعة | Common Root
description=World English Bible: تنقيح بالإنجليزية الحديثة لطبعة American Standard Version الصادرة سنة 1901، بدأه Michael Paul Johnson سنة 1994، وطُوبق عهده الجديد على النص اليوناني الأكثري، ووُضع عمدًا في الملك العام.
heroHeading=World English Bible
readerHref=/reader?c1.src=web

# The narrative, one paragraph per key, in order.
hero.1=توجد World English Bible بسبب مشكلة في حقوق النشر. في سنة 1994 حسب Michael Paul Johnson، وهو مهندس كان يترجم الكتاب المقدس في الساعات التي تفضل عن عمل بدوام كامل، كم يلزمه من الوقت لإتمام كتاب مقدس بإنجليزية حديثة يستطيع أي أحد نسخه بحرية، فلم يعجبه الجواب. فكف عن الترجمة من الصفر وبدأ من جديد من American Standard Version الصادرة سنة 1901 — دقيقة، محترمة، وخلافًا لترجمة الملك جيمس (التي لا تزال في إنجلترا وويلز مثقلة ببراءة التاج) خالية تمامًا من حقوق النشر. ومرّ برنامج كتبه بنفسه على نص ASV باحثًا عن الكلمات التي لم يعد أي كتاب مقدس حديث يستعملها، فاقترح البدائل وأجرى الاستبدالات في نحو خمس عشرة دقيقة. أما كل ما عجز عنه البرنامج — ترتيب الكلمات وعلامات الترقيم وعلامات الاقتباس — فقد صُنع باليد في السنوات التالية، وصدر النص وعاد يصدر في تنقيحات ابتداءً من سنة 1997.
hero.2=أمران يفصلانها عن الطبعة التي تنقّحها. الأول هو اليونانية. فعهد ASV الجديد تبع النص النقدي للمنقّحين، القريب مما صار طبعة نستله–آلاند؛ أما World English Bible فطُوبقت على النص البيزنطي الأكثري، فليست هي نص أصلها ولا Textus Receptus الذي استعمله مترجمو الملك جيمس. والثاني هو اسم الله. فقد طبعت ASV “Jehovah”؛ وتطبع World English Bible “Yahweh”، مع حاشية عند تكوين 2:4 تشرح الاختيار للقارئ الذي ينتظر “the LORD”. والطبعة البريطانية ترجع إلى “LORD” — والنسخة التي في هذه المجموعة أمريكية، فالذي يُقرأ هو “Yahweh”. وفيما عدا هذين القرارين تبقى ترجمة تكافؤ شكلي على منوال أصلها: الالتزام نفسه بترتيب الكلمات العبري واليوناني، لكن بإملاء ونحو لم يعودا يحتاجان إلى شرح.
hero.3=هي في القارئ ورقة، والوحيدة على أطول غصن في هذه المجموعة. افتح درجة تحت آية من World English Bible فتظهر تحتها American Standard Version، وتحتها Revised Version وترجمة الملك جيمس وكتاب جنيف المقدس، نزولًا إلى قاع اللغات الأصلية المعلَّم بالرمز ≈. وليس في المجموعة ما يقوم بدوره على World English Bible. وهي أيضًا أوسع نصوص ذلك الغصن: لم يكن لـ American Standard Version أسفار قانونية ثانية، فصُنعت أسفار World English Bible على حدة، من أبوكريفا الملك جيمس ومن الترجمة الإنجليزية للسبعينية عند برنتون، ونسختنا تحمل ثمانين سفرًا حيث تحمل ASV التي تحتها ستة وستين — ومنها المكابيين الثالث والرابع والمزمور 151، وهي ليست في أبوكريفا الملك جيمس. أما سفر باروخ، وهو فيها، فمفقود من نسختنا. وصفحة التعريف تترك خانة السنة لهذه الطبعة فارغة، وهي محقّة: لا سنة إصدار واحدة لها. والمجموعة تختم سنة 2000 ليكون لشارات الدرجات ما ترتّب عليه.

