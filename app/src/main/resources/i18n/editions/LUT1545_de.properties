title=Luther Bibel 1545 — Über diese Ausgabe | Common Root
description=Luthers Ausgabe letzter Hand: die Wittenberger Bibel von 1545, die letzte von Martin Luther selbst durchgesehene Ausgabe und der Text, der nach seinem Tod maßgeblich wurde.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=Nicht Luthers erste Bibel, sondern seine letzte. Das Neue Testament, das er auf der Wartburg schuf, erschien 1522 und die vollständige Bibel 1534; er revidierte ein weiteres Jahrzehnt, und die Ausgabe, die Hans Lufft 1545 in Wittenberg druckte, ist die letzte, die Luther selbst zum Abschluss brachte. Sie heißt die Ausgabe letzter Hand. Er starb im Februar darauf, und dieser Text wurde der Maßstab, an dem spätere Lutherbibeln ausgerichtet wurden.
hero.2=Er arbeitete aus den Urtexten und nicht aus dem Lateinischen: für das Neue Testament aus dem gedruckten Griechischen des Erasmus, für das Alte aus dem masoretischen Hebräisch, mit einem Kreis Wittenberger Kollegen, um die schwierigen Stellen zu erörtern. Was daraus entstand, tat für das Deutsche etwa das, was die Biblia von 1642 ein Jahrhundert später für das Finnische tun sollte. Eine Sprache mit vielen Mundarten und wenig gefestigter Prosa erhielt eine Ebene, die alle lesen konnten, und die moderne Schriftsprache wuchs daraus hervor.
hero.3=Hier treffen zwei Ketten zusammen. Die Luther Bibel 1912 steht unmittelbar über dieser Ausgabe, da sie eine Revision von ihr ist. Ebenso die Biblia 1642, drei Sprossen weiter oben in der finnischen Linie, weil das Turkuer Kollegium mit aufgeschlagenem Luther arbeitete. Darunter erreicht die Leiter den Grund — der Textus Receptus für das Griechische, der Westminster Leningrad Codex für das Hebräische — und diese Sprossen sind ausgefüllt und nicht mit ≈ bezeichnet, denn das Griechische des Erasmus und das masoretische Hebräisch sind das, woraus Luther tatsächlich übersetzte, und nicht nachträglich eingesetzte Zeugen.

