title=Baibal Olcim — Об этом издании | Common Root
description=Baibal Olcim: Библия на языке мату-чин, языке меньшинства в штате Чин (Мьянма), распространяемая eBible.org как текст, подлинно являющийся общественным достоянием, чей переводчик и дата перевода не установлены.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=Мату-чин — также называемый матупи-чин — сино-тибетский язык, на котором говорят около 34 000 человек, сосредоточенных вокруг Матупи, на юге штата Чин в Мьянме, с родственными общинами по другую сторону границы, в индийском штате Мизорам. Baibal Olcim — Библия на этом языке, и это единственный текст на мату-чин в этом собрании.
hero.2=Чего запись не даёт, так это того, кто её перевёл и когда. eBible.org, распространяющий текст, указывает лишь, что он является общественным достоянием, и каталогизирует его под кодом hlt — кодом ISO 639-3 для мату-чин — без переводчика, без комитета, без даты перевода. Эта страница оставляет оба поля пустыми, а не гадает. У этого же кода есть здесь своя небольшая история: более ранняя попытка добавить в это собрание вторую Библию на хинди была по ошибке занесена под hlt из-за похожего сокращения, пока появление стихов на мату-чин там, где ожидался хинди, не раскрыло ошибку. Это издание — то, что действительно было сверено с языком, который называет его код.
hero.3=Его добавили за то, чем оно является, а не за объём: подлинно являющаяся общественным достоянием Библия, а не просто лицензированная, на языке христианского меньшинства, пережившего реальные преследования в ходе гражданского конфликта в Мьянме, сосредоточенного в штате Чин и вокруг него. Читалка, созданная так, чтобы ничего не требовать от тех, кто ею пользуется, и никого из них не отслеживать, предназначена именно для такого случая — что во многом объясняет и то, почему на этой странице так мало прочих фактов.

