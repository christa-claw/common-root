title=Open New Arabic Version — À propos de cette édition | Common Root
description=L'Open New Arabic Version de Biblica : une Bible arabe moderne, sous droits d'auteur 1988, 1997 et 2012, publiée sous une licence Creative Commons qui permet de la partager, de l'adapter et de l'imprimer avec mention de crédit.
heroHeading=L'Open New Arabic Version de Biblica
readerHref=/reader?c1.src=onav

# The narrative, one paragraph per key, in order.
hero.1=C'est une traduction arabe moderne, un texte différent de [[SVD|Smith & Van Dyck]] et non une autre copie de celui-ci. Elle est publiée par Biblica, Inc., dont la mention de droits d'auteur porte trois années : 1988, 1997 et 2012. La page de droits d'auteur du texte lui-même donne son ancien nom, Ketab El Hayat Majani.
hero.2=Ce qui le distingue dans ce lecteur, c'est sa licence. Biblica l'a publié comme texte « ouvert » sous la licence Creative Commons Attribution-Partage dans les mêmes conditions 4.0 : chacun peut le copier, l'adapter et l'imprimer, à condition de créditer Biblica et de partager tout ce qui en est tiré selon les mêmes conditions. La mention de crédit que demande Biblica est : "The original work by Biblica, Inc. is available for free at www.biblica.com and open.bible". La plupart des traductions modernes ne sont pas proposées ainsi, et c'est pourquoi elle figure ici.
hero.3=La licence comporte une condition qu'il vaut la peine de connaître. Le texte non modifié peut porter le nom de Biblica. Un texte réarrangé ne le peut pas : les éditions en Ordre des événements et Ordre de rédaction de ce site placent les livres dans un ordre différent, ce que nous traitons comme une adaptation ; elles indiquent donc que le texte a été réarrangé et n'utilisent pas le nom de Biblica comme titre.
hero.4=Le fichier est entièrement vocalisé. Un détail de sa source : Actes 15.25 et 26 sont imprimés comme un seul verset, si bien que le corpus les garde ensemble sous le verset 25 et n'y a pas de verset 26 séparé.

