title=Sahih al-Bukhari — À propos de cette édition | Common Root
description=Sahih al-Bukhari : le recueil de hadiths que l'islam sunnite place au second rang d'autorité juste après le Coran, réuni par Muhammad al-Bukhari parmi environ 600 000 récits qu'il avait examinés, n'en retenant que ceux portés par une chaîne ininterrompue de transmetteurs fiables.
heroHeading=Sahih al-Bukhari
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Muhammad ibn Ismaïl al-Bukhari a réuni ce recueil pour l'essentiel dans deux mosquées — la Mosquée sacrée de La Mecque et la Mosquée du Prophète à Médine — et l'a achevé dans sa ville natale, Boukhara, vers l'an 232 de l'hégire (846 apr. J.-C.) ; il a passé à peu près les deux dernières décennies de sa vie à le réviser encore au fil de ses voyages. Son titre complet, al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi, est habituellement abrégé en Sahih al-Bukhari — « le [recueil] fidèle d'al-Bukhari ». Al-Bukhari lui-même aurait déclaré l'avoir choisi parmi environ 600 000 hadiths qu'il avait examinés, n'admettant un récit que lorsqu'il portait, selon son jugement, une chaîne ininterrompue de transmetteurs fiables jusqu'à sa source d'origine.
hero.2=Cette exigence explique le poids que porte l'ouvrage. Le Sahih al-Bukhari est compté comme le premier des Six Livres de l'islam sunnite (Kutub al-Sitta), et avec le Sahih Muslim — son plus proche rival par la méthode et la réputation — les deux sont appelés les Sahihayn, « les deux fidèles ». La plupart des savants sunnites placent le recueil d'al-Bukhari au-dessus de tout autre livre de hadiths et, en autorité, juste après le Coran lui-même, bien qu'une minorité ait plutôt plaidé pour la préséance du Sahih Muslim. La matière est organisée par thème plutôt que par transmetteur ou par chronologie (ce que les savants appellent un musannaf), répartie en livres (kutub) qui vont de la purification rituelle et de la prière jusqu'au commerce, au mariage, à la vie des prophètes antérieurs et aux signes de la Dernière Heure.
hero.3=Le nombre exact de hadiths que contient l'ouvrage dépend de la tradition imprimée qui les compte. Le chiffre le plus souvent cité aujourd'hui, 7 563, provient de la numérotation que l'éditeur Muhammad Fouad Abd al-Baqi a donnée au texte au XXe siècle, et il recompte un hadith chaque fois qu'il est répété sous un autre chapitre ; une fois les répétitions retirées, Ibn Hajar al-Asqalani en comptait 2 602. D'autres savants ont proposé d'autres totaux encore. Le chiffre propre à ce corpus en est un troisième : 98 livres et 7 589 hadiths numérotés, qui n'est que la forme de l'édition numérique dont il est tiré, non une prétention à reproduire exactement telle ou telle numérotation imprimée.
hero.4=Le texte arabe ici est le matn classique, dans le domaine public. En dessous, dans le lecteur, figure une traduction anglaise, tirée de l'édition eng-bukhari de fawazahmed0/hadith-api et alignée hadith par hadith sur l'arabe, afin que les deux puissent se lire en paire — la même disposition d'accompagnement que ce corpus utilise pour ses traductions du Coran. De quelle traduction anglaise publiée ce fichier descend réellement n'a pas été établi du côté de ce corpus, ce qui explique que sa licence soit marquée en cours de vérification plutôt que simplement domaine public ; l'arabe au-dessus ne porte pas cette même incertitude.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=arabe classique, avec une traduction anglaise sous chaque hadith dans le lecteur
fact.2.label=Compilateur
fact.2.value=Muhammad ibn Ismaïl al-Bukhari (194–256 de l'hégire / 810–870 apr. J.-C.)
fact.3.label=Titre complet
fact.3.value=al-Jami' al-Musnad al-Sahih al-Mukhtasar min Umur Rasul Allah wa-Sunanihi wa-Ayyamihi — habituellement abrégé en Sahih al-Bukhari
fact.4.label=Compilé
fact.4.value=pour l'essentiel à la Mosquée sacrée de La Mecque et à la Mosquée du Prophète à Médine ; achevé à Boukhara vers l'an 232 de l'hégire (846 apr. J.-C.)
fact.5.label=Méthode
fact.5.value=n'admet un hadith qu'avec une chaîne ininterrompue de transmetteurs qu'al-Bukhari jugeait fiables ; il aurait choisi le recueil parmi environ 600 000 récits qu'il avait examinés
fact.6.label=Rang
fact.6.value=le premier des Six Livres de l'islam sunnite (Kutub al-Sitta) ; avec [[MUS|le Sahih Muslim]], forme « les Sahihayn », les deux recueils placés en autorité juste après le Coran
fact.7.label=Nombre de hadiths
fact.7.value=7 563 avec répétitions selon la numérotation d'Abd al-Baqi, très répandue, ou 2 602 sans répétition selon le décompte d'Ibn Hajar al-Asqalani ; les éditions imprimées diffèrent à la fois sur la numérotation des chapitres et des hadiths
fact.8.label=Dans ce corpus
fact.8.value=98 livres (kutub) et 7 589 hadiths numérotés — la forme propre du jeu de données source, non la reproduction d'une numérotation imprimée en particulier
fact.9.label=Traduction anglaise
fact.9.value=tirée de l'édition eng-bukhari de fawazahmed0/hadith-api, montrée en accompagnement sous l'arabe ; la traduction publiée dont elle descend n'a pas encore été établie du côté de ce corpus
fact.10.label=Licence
fact.10.value=le matn arabe est le texte classique du domaine public ; la licence de la traduction anglaise reste en cours de vérification
