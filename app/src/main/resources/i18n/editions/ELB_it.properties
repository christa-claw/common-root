fact.13.label=In questo corpus
fact.13.value=la Bibbia su cui si apre un'interfaccia tedesca: il tedesco non ha un'edizione predefinita curata, sicché il lettore prende la prima Bibbia tedesca del catalogo, ed ELB precede [[LUT1545|Luther 1545]] e [[LUT1912|Luther 1912]] per nient'altro che la propria sigla. Nei pioli della discendenza non è registrato alcun antecedente — l'Elberfelder del 1871 da cui è venuta a forza di correzioni non è nel corpus — sicché un piolo si apre sul pavimento delle lingue originali. Né porta un anno da alcuna delle due parti: la scheda di catalogo lascia vuota la colonna dell'anno e l'elenco degli anni dei pioli, curato a mano, nemmeno la registra, cosicché un segno di piolo per ELB mostra la sigla e nient'altro — il caso silenzioso, là dove [[DRA|la Douay-Rheims]] è quello rumoroso e i due elenchi si contraddicono in pubblico
