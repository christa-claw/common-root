title=Elberfelder 1905 — Su questa edizione | Common Root
description=La Bibbia di Elberfeld: la traduzione tedesca cominciata nel 1855 da John Nelson Darby, Carl Brockhaus e Julius Anton von Poseck, una delle prime in tedesco ad abbandonare il Textus Receptus — qui nella stampa del 1905.
heroHeading=Elberfelder 1905
readerHref=/reader?c1.src=elb

# The narrative, one paragraph per key, in order.
hero.1=Il nome è un luogo. Elberfeld è una città della valle della Wupper, dal 1929 parte di Wuppertal, ed è lì che si fece la maggior parte del lavoro. La cominciarono tre uomini: John Nelson Darby, Carl Brockhaus e Julius Anton von Poseck, tutti legati al ramo tedesco del movimento dei Fratelli. Il Nuovo Testamento uscì nel 1855, i Salmi nel 1859 e l'Antico Testamento nel 1871, pubblicati non sotto il nome di nessuno ma come tradotti dal testo originale “da alcuni cristiani”.
hero.2=Ciò che la distingueva era il greco che aveva sotto. Quasi ogni Bibbia tedesca allora in circolazione poggiava ancora sul Textus Receptus; questa ruppe con esso e accolse le lezioni del Codice Sinaitico e del Codice Vaticano man mano che quei manoscritti venivano pubblicati, verso la metà dell'Ottocento. L'Antico Testamento fu fatto sull'ebraico masoretico. Il principio di traduzione era l'esattezza prima dell'eleganza: un tedesco che segue l'ebraico e il greco tanto da vicino da riuscire rigido, ogni parola aggiunta per il senso segnalata come aggiunta, e nessun titolo di sezione, per la ragione che i testi originali non ne hanno. È tuttora annoverata fra le versioni tedesche più vicine alla lettera che portano sotto di sé.
hero.3=Questa è la stampa del 1905, la prima composta in caratteri latini anziché in fraktur; dal corpo minuto di quel carattere è nota come la Perlbibel. Non fu una traduzione nuova. Fino alla morte di Rudolf Brockhaus nel 1932 l'Elberfelder fu riveduta e corretta di stampa in stampa — Alfred Rochat rispondeva dell'Antico Testamento, Emil Dönges del Nuovo — sicché una data nomina qui una stampa dentro un testo in movimento e non un'edizione conclusa. Ciò che oggi si vende come Elberfelder è per lo più un'altra cosa ancora: una commissione dello stesso movimento impiegò venticinque anni a rivederla e ne pubblicò il risultato nel 1975 e nel 1985. Quella revisione tolse “Jehova” dall'Antico Testamento e vi mise “HERR”. Questo testo stampa ancora “Jehova”, il che lo pone accanto all'American Standard Version e accanto alla Bibbia francese di Darby stesso.
hero.4=Il suo posto in questa raccolta sta un poco in disparte. Il tedesco non ha un'edizione predefinita curata nel lettore, sicché un'interfaccia tedesca apre la prima Bibbia tedesca del catalogo, e questa è quella — davanti a entrambe le Bibbie di Lutero per ordine alfabetico e per nient'altro. Nei pioli della discendenza sta da sola. I due Lutero formano una catena, quella del 1912 riveduta su quella del 1545 e quella del 1545 poggiante sul greco e sull'ebraico, mentre per l'Elberfelder non è registrato alcun antecedente, perché l'Elberfelder del 1871 da cui è venuta a forza di correzioni non è in questo corpus. Un piolo sotto un versetto dell'Elberfelder scende perciò diritto al pavimento delle lingue originali contrassegnato con ≈, benché la Bibbia francese di Darby, a una colonna di distanza, sia qui la sua parente più prossima.

