title=Textus Receptus — Об этом издании | Common Root
description=Textus Receptus: печатный греческий Новый Завет, стоящий за Лютером, Тиндейлом и Библией короля Иакова; впервые издан Эразмом в 1516 году и назван по рекламной строке 1633 года.
heroHeading=Textus Receptus
readerHref=/reader?c1.src=tr

# The narrative, one paragraph per key, in order.
hero.1=Каждая Библия Реформации в этом собрании восходит к книге, напечатанной в Базеле в 1516 году. Эразм Роттердамский хотел выпустить греческий Новый Завет раньше всех остальных и работал быстро — по тем немногим поздним рукописям, до которых мог дотянуться в Базеле, и ни одна из них не была особенно древней. Там, где в его экземпляре Откровения не хватало последнего листа, он перевёл шесть последних стихов обратно на греческий с латинской Вульгаты. Эти стихи попали в печать и оставались там четыре века.
hero.2=Текст исправлялся и переиздавался ещё сто лет — самим Эразмом, затем Робером Стефанусом в Париже и Теодором Безой в Женеве. Четвёртое издание Стефануса 1551 года сделало то, что вышло далеко за пределы учёности: оно разбило текст на нумерованные стихи. Это те самые номера стихов, которые до сих пор печатаются почти в каждой Библии мира — и те, которые этот читатель позволяет отключить.
hero.3=Имя пришло последним и пришло из рекламы. В 1633 году братья Элзевиры из Лейдена рекламировали своё издание строкой о том, что у читателя теперь “текст, принятый всеми” — textus receptus. Это было утверждение книготорговца, а не приговор науки, но оно прижилось. Когда в XIX веке открылись более древние рукописи, издатели от Тишендорфа до Уэсткотта и Хорта построили на них новые тексты, и современные переводы следуют им. Textus Receptus остаётся здесь по той причине, по которой он важен: это то, что действительно лежало перед Лютером, Тиндейлом, женевскими переводчиками и комитетами короля Иакова, а значит — тот текст, на фоне которого надо читать их формулировки.

