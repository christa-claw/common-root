title=Luther Bibel 1912 — Acerca de esta edición | Common Root
description=La segunda revisión eclesiástica oficial de la Biblia de Lutero: una relectura deliberadamente cautelosa, terminada en 1910, adoptada en 1912, y el último texto luterano que descansa sobre el Textus Receptus.
heroHeading=Luther Bibel 1912
readerHref=/reader?c1.src=lut1912

# The narrative, one paragraph per key, in order.
hero.1=Una revisión de una revisión. Las iglesias alemanas habían acordado en 1892 un texto único de la Biblia de Lutero, la primera revisión eclesiástica oficial, y en pocos años ya se la llamaba insuficiente. Las quejas eran las de siempre: demasiados arcaísmos y una ortografía que ya no era la de nadie. Fue el segundo punto el que decidió. El Duden había dado al Imperio alemán una ortografía vinculante que se enseñaba en las escuelas, y una Biblia de Lutero que se apartara de ella resultaba incómoda de poner delante de una clase. En 1906 la conferencia eclesiástica evangélica alemana acordó otra revisión y dispuso expresamente que fuera suave y conservadora. Una comisión de teólogos recorrió todos los libros hasta 1910, y en 1912 la conferencia adoptó el resultado.
hero.2=El trabajo duró apenas algo más de dos años, lo que dice qué clase de revisión fue. Nadie pretendía hacer una nueva Biblia de Lutero, ni filológica ni de ninguna otra manera. Un revisor posterior, Fritz Tschirch, la despachó como una revisión de maestro de escuela, y del método la etiqueta no dice nada falso: la ortografía puesta en orden, las palabras más visiblemente muertas sustituidas, la redacción por lo demás dejada donde Lutero la tenía. Lo que la etiqueta no ve es lo bien que aguantó. A través de las décadas de revisiones parciales que siguieron, el texto de 1912 se quedó donde estaba, y todavía se lee y se vende. Parte de ello es la Jubiläumsbibel de 1912, la edición centenaria del instituto bíblico de Wurtemberg con notas explicativas, reimpresa en letra gótica hasta bien entrado este siglo. Parte es que el derecho de autor ha caducado, de modo que reproducir el texto no cuesta nada y aparece por todas partes — también aquí.
hero.3=Una cosa por encima de todas la mantiene en uso entre los lectores conservadores: es la última revisión luterana levantada sobre el Textus Receptus, el Nuevo Testamento griego de los siglos XVI y XVII. Todo lo posterior pasó al texto crítico. Eso hace de esta edición un peldaño insólitamente limpio sobre el que apoyarse en una escalera, porque el griego que hay debajo es el mismo griego que hay debajo de la propia edición de Lutero de 1545 y debajo de la Ginebrina y de la King James — la torre entera comparte un suelo en vez de cambiarlo a media altura.
hero.4=En los peldaños del linaje, esta edición se sitúa justo encima de la Luther Bibel 1545 y tiene exactamente un antecesor registrado, que es esa. Abra un peldaño debajo de un versículo de 1912 y aparecerá debajo la redacción propia de Lutero de 1545; abra otro y la escalera alcanza el Textus Receptus para el griego y el Códice de Leningrado para el hebreo. Trescientos sesenta y siete años de revisión, versículo a versículo, en dos clics. Lo que esta edición no es: la Biblia con la que abre una interfaz en alemán — el alemán no tiene edición predeterminada elegida, así que el lector recibe la primera Biblia alemana del catálogo, y esa es la Elberfelder.

