fact.12.label=En este corpus
fact.12.value=Lo más alto de la escalera alemana: un antecesor registrado, [[LUT1545|Luther Bibel 1545]], y debajo el suelo de las lenguas originales. Sus 85 notas de los revisores se conservan aquí como comentarios en vez de descartarse, y están ligadas a la edición — una glosa de 1912 se muestra bajo una columna de 1912 y en ningún otro sitio. No es aquello con lo que abre una interfaz en alemán; eso es [[ELB|la Elberfelder]], la primera del catálogo por su abreviatura y por ningún otro motivo
