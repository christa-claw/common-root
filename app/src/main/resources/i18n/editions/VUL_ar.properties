title=الفولغاتا اللاتينية — عن هذه الطبعة | Common Root
description=الفولغاتا اللاتينية: ترجمة إيرونيموس، التي كُلِّف بها سنة 382 وفرغ منها نحو 405، وحملت الكتاب المقدس عبر أوروبا الغربية ألف سنة، وكانت أول كتاب طبعه غوتنبرغ.
heroHeading=الفولغاتا اللاتينية
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=في أواخر القرن الرابع كانت الأناجيل اللاتينية المتداولة في الغرب يناقض بعضها بعضًا، نسخةً بعد نسخة، فطلب البابا داماسوس الأول من كاتبه إيرونيموس أن يضبطها. بدأ إيرونيموس بمراجعة، ثم انتهى به الأمر إلى أن ينفق عليها أكثر من عشرين سنة، أكثرها في بيت لحم، وأن ينتج شيئًا لم يطلبه أحد.
hero.2=أما القرار الذي صنع الفارق فهو ترجمة العهد القديم عن العبرية لا عن السبعينية اليونانية التي درجت الكنيسة على استعمالها. سمّى إيرونيموس هذا المبدأ “hebraica veritas” — الحقيقة العبرية — وكان مثار جدل: كتب إليه أوغسطينوس قلقًا من أن تضطرب الجماعات حين تتبدّل تحتها قراءات مألوفة. ومضى إيرونيموس في عمله رغم ذلك. ولهذا صار كتاب مقدس لاتيني، من بين كل الكتب، أقرب إلى العبرية من الكتاب اليوناني الذي قرأه أوائل المسيحيين.
hero.3=صارت كتاب أوروبا الغربية المقدس ألف سنة، وهي مدة أطول من مدة أي ترجمة قبلها أو بعدها. عنها ترجم ويكليف إلى الإنجليزية، وعنها اشتغل مترجمو دُواي-ريمس أيضًا — فطبعة دُواي-ريمس في هذه المجموعة سليلتها المباشرة، ودرجات تلك الطبعة تشير إلى هنا. وكانت كذلك أول كتاب كبير يُطبع بالحروف المتحركة: فالكتاب المقدس الذي صفّه غوتنبرغ في ماينتس نحو 1455 هو هذا النص.

