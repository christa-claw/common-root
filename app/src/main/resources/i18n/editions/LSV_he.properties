title=Literal Standard Version — על המהדורה הזו | Common Root
description=Literal Standard Version: עיבוד משנת 2020 שעשתה Covenant Press ל-Literal Translation של רוברט יאנג מהמאה התשע-עשרה, בניסיון להגיע לתרגום האנגלי המילולי והעקבי ביותר של העברית, הארמית והיוונית שאנגלית קריאה מאפשרת.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version מוצגת כעיבוד מקיף של Literal Translation של רוברט יאנג, תרגום אנגלי מילולי קיצוני מהמאה התשע-עשרה שפורסם לראשונה ב-1862 ותוקן על ידי יאנג עצמו ב-1887 וב-1898. Covenant Press, זרוע ההוצאה לאור של Covenant Christian Coalition, החלה בעיבוד החדש בתחילת 2018 במטרה המוצהרת לשמר את מחויבותו של יאנג למילוליות מדויקת מילה במילה, ובה בעת לעדכן את אנגלית הטקסט ולתקן מקומות שבהם מחקר כתבי היד והלקסיקה המתקדם יותר התקדם. העבודה הושלמה ופורסמה ב-2 בפברואר 2020; זכויות היוצרים האמריקאיות נרשמו בינואר של אותה שנה, ומהדורות ספר אלקטרוני הופיעו במאי של אותה שנה. המתרגמים הבודדים אינם מצוינים במהדורה המודפסת; Covenant Press ו-Covenant Christian Coalition מצוינות כגופים המזמינים.
hero.2=בברית הישנה עוקבת LSV אחר הנוסח המסורתי, בהשפעה משמעותית של השבעים, ובפנייה מזדמנת למגילות מדבר יהודה כאשר נוסחיהן נראו ברורים מספיק כדי להעדיפם. בברית החדשה היא עוקבת אחר הטקסט המקובל (Textus Receptus) ואחר הנוסח הרוב (Majority Text), ומאמצת נוסחים מהמסורת האלכסנדרונית רק במקרים ספציפיים ומוצהרים, לא כקו מדיניות כללי. המתרגמים הציבו שלושה עקרונות מכוונים: לשמר את זמן הפועל של המקור במידה שהאנגלית מאפשרת, לתרגם מילה נתונה במקור באותה מילה אנגלית במידה שההתאמה אפשרית, ולשמר את סדר המילים המקורי אלא אם קריאוּת האנגלית מחייבת ממש שינוי. שם האלוהים בברית הישנה מועבר בתעתיק ולא במעמד כגון "אדוני", בהתאם להעדפתו הכללית של תרגום זה להציג לקורא את בחירותיו של הטקסט המקורי ולא להחליק אותן.
hero.3=הקשר לאוסף זה הוא טקסטואלי יותר משהוא גנאלוגי: הברית החדשה של Literal Standard Version נשענת על הטקסט המקובל ועל נוסח הרוב, אותו בסיס יווני שהאוסף הזה משמר בנפרד ובמלואו בשם הטקסט המקובל — הטקסט שעליו מבוססים King James Version ובאופן כללי מורשת עידן הרפורמציה. אין שלב שושלת המקשר בין שתי המהדורות, שכן LSV מוצגת כעיבוד של Literal Translation של יאנג ולא של הטקסט המקובל עצמו או של כל טקסט אחר המוחזק כאן; לכן שלב שנפתח מתחת לפסוק מ-LSV יורד ישירות לרצפת לשון המקור המסומנת ב-≈. היא מתפרסמת ברישיון Creative Commons ייחוס-שיתוף זהה 4.0 ולא נמסרה לנחלת הכלל, מה שמציב אותה לצד New International Version ו-New American Standard Bible כברישיון ולא חופשית להעתקה — אך בתנאים מקלים בהרבה משתיהן. מנשק האנגלית נפתח כברירת מחדל על New International Version; למהדורה זו מגיעים מכרטיסה שלה.

