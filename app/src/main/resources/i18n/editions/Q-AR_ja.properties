fact.1.label=言語
fact.1.value=標準のウスマーン正書法によるクルアーン・アラビア語
fact.2.label=読誦法（キラアア）
fact.2.value=アーシムからのハフス——クーファのアーシム・イブン・アビー・アン・ナジュード（745年没）からハフス・イブン・スライマーン（796年没）が受け継いだ。認められた十四の伝承の一つであり、世界の印刷版クルアーンの大半が従う伝承である
fact.3.label=標準印刷版
fact.3.value=1924年のカイロ版——1907年からファアード一世王の下で作業したアズハルの学者による委員会が作成し、ブーラークのアミーリー印刷所が1924年7月10日に印刷した。キング・ファハド・コンプレックス自身のものを含め、その後の印刷の大半が従う模範である
fact.4.label=ここで使用されている本文
fact.4.value=alquran.cloudのquran-uthmani版——そのアラビア語本文はタンジール・プロジェクトによるデジタル化に由来する
fact.5.label=照合対象
fact.5.value=キング・ファハド・クルアーン印刷コンプレックス自身のハフス版、一節ごとに照合——全6,236節で子音骨格が一致し、差異はすべて母音表記、ハムザの綴り、語の区切りの八つの事例に限られる
fact.6.label=この一致が示さないこと
fact.6.value=系統——一致は系統を意味しない——また許諾でもない。コンプレックス自身のファイルの表示許可を求めて2026年8月末に送られた依頼は、本稿執筆時点で回答を得ていなかった
fact.7.label=このコーパスにある対訳
fact.7.value=[[Q-EN|ピクソールの英訳]]（1930年）、[[Q-YA|ユースフ・アリーの英訳]]（1934年）、[[Q-SAB|サブルコフのロシア語訳]]（1878年）——この底本と各節の下で対になる三つの翻訳
fact.8.label=このコーパスでは
fact.8.value=ここでのすべての[[Q-EN|翻訳]]が対になる唯一のアラビア語本文。対照的に[[FB1776|1776年のフィンランド語聖書]]では、この本文がどの印刷に由来するのか、そもそも分かっていない
fact.9.label=ライセンス
fact.9.value=パブリックドメイン——クルアーン・アラビア語は誰のものでもないものとして扱われる。出典元自身の条件が求めるのは、転載においてウスマーン正書法を損なわないことだけである
