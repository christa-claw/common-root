title=クルアーン — ウスマーン正書体 — この版について | Common Root
description=ハフス・アン・アーシムの読誦法によるクルアーンであり、1924年のカイロ版以来、世界の印刷版クルアーンの大半が依拠する本文である——そして本コーパスでは、キング・ファハド・コンプレックス自身の写本と一節ごとに照合し、全6,236節の子音骨格において完全に一致することが確認された本文である。
heroHeading=クルアーン — ウスマーン正書体
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=この本文を支える読誦法には、名の知られた伝承の鎖がある。ハフス・イブン・スライマーン・アル・クーフィー（796年没）は、師であるアーシム・イブン・アビー・アン・ナジュード——クーファの読誦者の一人で、その読誦法は後にイブン・ムジャーヒドによって七つの読誦法の一つに数えられた——からこれを受け継いだ（アーシムは745年に没した）。「アーシムからのハフス」であるハフス・アン・アーシムは、ムスリムが同一の啓示の等しく権威ある伝承とみなす複数の読誦法の一つである。唯一のものではないが、群を抜いて最も印刷されてきたものである。アズハルの学者による委員会が、1907年からファアード一世王の下で作業を進め、ブーラークのアミーリー印刷所が1924年7月10日に発行した標準エジプト版クルアーンを作り上げたとき、活字に固定されたのはこの読誦法であった。今日どこで売られているクルアーンの大半——キング・ファハド・コンプレックス自身のものも含め——は、その版の例に従っている。
hero.2=本コーパスにある本文は、alquran.cloudのquran-uthmani版を通じて、タンジール・プロジェクトによる同じハフス本文のデジタル化から取られている。リーダーでは三つの翻訳と対になって表示される——ピクソールの英訳（1930年）、ユースフ・アリーの英訳（1934年）、サブルコフのロシア語訳（1878年）——この三つのいずれかをこの本文の横に開くと、その訳文が各節の下に表示される。リーダーはまた、クルアーンを二つの順序で提供する——同じ伝統が定めた伝統的なムスハフの配列と、各スーラが啓示された時期について学者が再構成した順序である。
hero.3=文字どおりの保存それ自体が、この本文について語られる主張の一つであるため、ここでは前提とされるのではなく検証される。キング・ファハド・クルアーン印刷コンプレックス自身のハフス版と一節ごとに比較したところ、両者は子音骨格——いかなる母音記号が加えられる前の、裸の文字——において、その全6,236節で一致する。見つかった差異はすべて、母音と停止記号の表記方法、ハムザの綴り方、そして両者が語の区切りを異なる位置に引く八箇所に限られ、本文そのもののいかなる文字にも触れない。これは、本コーパスが1776年のフィンランド語聖書について認めねばならない不確かさとは正反対である——そちらでは、この本文がどの印刷に由来するのか、そもそも分かっていない。
hero.4=この一致が立証しない二つのことを、はっきり述べておく価値がある。これは系統の主張ではない——コンプレックスの本文と一致することは、両者が同じ本文であることを示すのであって、一方が他方から写されたことを示すのではない。また許諾でもない——2026年8月末にコンプレックスへ送られた、その独自のリワーヤ・ファイルの表示許可を求める依頼は、本稿執筆時点で回答を得ていなかった。比較そのものが短く不一致を示した唯一の節、19章3節は、参照ファイルの読み取り方における欠陥であることが判明し、どちらのクルアーンの欠陥でもなかった——訂正すれば正確に一致する。参照用の写しそのものがコンプレックスのワープロファイルの再構成であり、その公式のデジタル版ではない。これが、この比較が公式に発表されたデータセットとの比較とは言い切れない唯一の点である。

