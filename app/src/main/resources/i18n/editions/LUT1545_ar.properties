title=Luther Bibel 1545 — عن هذه الطبعة | Common Root
description=Ausgabe letzter Hand للوثر: كتاب فيتنبرغ المقدّس سنة 1545، آخر طبعة نقّحها مارتن لوثر بنفسه، والنص الذي صار المعيار بعد وفاته.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=ليس أول كتاب مقدّس للوثر بل آخره. صدر العهد الجديد الذي أنجزه في قلعة فارتبورغ سنة 1522، والكتاب الكامل سنة 1534؛ ثم ظل ينقّح عقدًا آخر، والطبعة التي طبعها هانس لوفت في فيتنبرغ سنة 1545 هي آخر ما أتمّه لوثر بنفسه. وتسميها الألمانية Ausgabe letzter Hand، أي طبعة اليد الأخيرة. مات في شباط التالي، وصار هذا النص المقياس الذي عُيِّرت به كتب لوثر المقدّسة اللاحقة.
hero.2=عمل من الأصول لا من اللاتينية: يونانية إيراسموس المطبوعة للعهد الجديد، والعبرية المسورية للعهد القديم، ومعه حلقة من زملاء فيتنبرغ يجادلونه في المواضع الصعبة. وما نتج عن ذلك فعل بالألمانية نحو ما ستفعله Biblia 1642 بالفنلندية بعد قرن. فلغةٌ ذات لهجات كثيرة ونثر غير مستقر نالت مستوى واحدًا يستطيع الجميع قراءته، ومن هناك نمت اللغة المكتوبة الحديثة.
hero.3=تلتقي هنا سلسلتان. تقع Luther Bibel 1912 مباشرة فوق هذه الطبعة لكونها تنقيحًا لها. وكذلك Biblia 1642 على بُعد ثلاث درجات أعلى في الخط الفنلندي، لأن لجنة توركو عملت ولوثر مفتوح أمامها. وتحتها يبلغ السلّم قاعه — Textus Receptus لليونانية، ومخطوطة لينينغراد للعبرية — وهاتان الدرجتان مصمتتان لا تحملان علامة ≈، لأن يونانية إيراسموس والعبرية المسورية هما ما ترجم عنه لوثر فعلًا، لا شاهدان وُضعا بعد حين.

