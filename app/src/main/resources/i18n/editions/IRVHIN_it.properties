title=Versione Indiana Riveduta — Informazioni su questa edizione | Common Root
description=La Versione Indiana Riveduta (IRV): una traduzione in hindi della Bibbia del 2019 pubblicata da Bridge Connectivity Solutions, con licenza CC BY-SA 4.0 — il testo in hindi su cui questo corpus si apre per impostazione predefinita.
heroHeading=Versione Indiana Riveduta
readerHref=/reader?c1.src=irvhin

hero.1=La Versione Indiana Riveduta è una moderna traduzione in hindi della Bibbia, con copyright datato 2017 e 2019 e appartenente a Bridge Connectivity Solutions Pvt. Ltd., un'organizzazione indiana di traduzione biblica e tecnologia. Fa parte di una serie più ampia intitolata "Versione Indiana Riveduta" che lo stesso editore ha prodotto in parallelo in diverse altre delle principali lingue indiane — tra cui il kannada, il tamil, il telugu e l'assamese — ciascuna una Bibbia completa nella propria scrittura, pubblicata con la stessa licenza aperta.
hero.2=Il testo di Common Root proviene dalla distribuzione USFM di eBible.org dell'IRV in hindi, lì catalogata come hin2017, piuttosto che da una copia digitale precedente della stessa traduzione che circolava con il testo delle note incollato direttamente dentro i versetti e con i nomi dei libri in hindi invece che in inglese. Reimportare da quella fonte USFM ha corretto entrambi i problemi prima che questa edizione fosse aggiunta qui — questo corpus mantiene i nomi dei libri in inglese internamente, in tutte le sue edizioni, indipendentemente dalla lingua propria della Bibbia.
hero.3=Qui è scritta in scrittura devanagari, come इंडियन रिवाइज़्ड वर्ज़न, e contiene il canone protestante standard di 66 libri, senza libri deuterocanonici.
hero.4=È l'unica Bibbia in hindi di questo corpus, perciò un'interfaccia in hindi si apre su di essa per impostazione predefinita.

