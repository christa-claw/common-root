title=Qur'an — Uthmani — About This Edition | Common Root
description=The Qur'an in the Hafs 'an 'Asim reading, the text behind most printed Qur'ans worldwide since the Cairo edition of 1924 — and, in this corpus, a text checked verse by verse against the King Fahd Complex's own copy and found to agree on the consonantal rasm in all 6,236 verses.
heroHeading=Qur'an — Uthmani
readerHref=/reader?c1.src=q-ar

# The narrative, one paragraph per key, in order.
hero.1=The reading behind this text has a named chain. Hafs ibn Sulayman al-Kufi (d. 796) transmitted it from his teacher, Asim ibn Abi al-Najud, one of the Qur'an readers of Kufa whose recitation Ibn Mujahid later canonised among the seven (Asim died in 745). Hafs 'an 'Asim — "Hafs, from Asim" — is one of several readings Muslims hold to be equally authoritative transmissions of the same revelation; it is not the only one, but it is by far the most printed. When a committee of al-Azhar scholars, working from 1907 under King Fu'ad I, produced the standard Egyptian Qur'an that the Amiri Press at Bulaq printed on 10 July 1924, it was this reading they set in type. Most Qur'ans sold anywhere today, including the King Fahd Complex's own, follow that edition's lead.
hero.2=What sits in this corpus is drawn, through alquran.cloud's quran-uthmani edition, from the Tanzil Project's digitisation of that same Hafs text. It pairs in the reader with three translations: Pickthall's English of 1930, Yusuf Ali's English of 1934, and Sablukov's Russian of 1878 — open any of the three beside this one and its rendering shows beneath each ayah. The reader also offers the Qur'an in two orders: the canonical mushaf sequence this same tradition set, and the order scholars reconstruct for when each surah was revealed.
hero.3=Preservation to the letter is itself one of the claims made about this text, so it is checked rather than assumed. Compared verse by verse against the King Fahd Glorious Qur'an Printing Complex's own Hafs edition, the two agree on the consonantal rasm — the bare letters, before any vowel mark is added — in all 6,236 verses. Every difference found is confined to how the vowels and pause marks are notated, to the spelling of the hamza, and to eight places where the two houses draw a word boundary differently; none touches a letter of the text itself. That is the opposite of the uncertainty this corpus has to admit for the Finnish Bible of 1776, where which printing the text descends from is simply not known.
hero.4=Two things that agreement does not establish are worth saying plainly. It is not a claim of descent — agreeing with the Complex's text shows the two are the same text, not that one was copied from the other. And it is not a licence: a request sent to the Complex in late August 2026, asking permission to display its own riwayat files, had not been answered as of this writing. The one verse where the comparison itself briefly disagreed, 19:3, turned out to be a flaw in how the reference file was read, not in either Qur'an — corrected, it matches exactly. The reference copy itself is a reconstruction of the Complex's word-processor file, not an official digital release, which is the one respect in which this is not quite a comparison against a published dataset.

