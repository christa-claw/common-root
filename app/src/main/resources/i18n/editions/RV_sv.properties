title=Revised Version — Om denna utgåva | Common Root
description=Den engelska Revised Version: den enda revision av King James Version som Engelska kyrkan någonsin auktoriserat, utgiven i tre omgångar mellan 1881 och 1894 — och här stegpinnen mellan King James Version och American Standard Version.
heroHeading=Revised Version
readerHref=/reader?c1.src=rv

# The narrative, one paragraph per key, in order.
hero.1=Revised Version är den enda revision av King James Version som Englands kyrka faktiskt beställde. Canterburys konvokation beslutade om den 1870 och tillsatte två sällskap, ett för vartdera testamentet, med mer än femtio brittiska lärde ur flera samfund — inte bara anglikaner, vilket i sig var nytt och tvistades om. Amerikanska lärde inbjöds att delta per brev, och gjorde det. Instruktionen var försiktig: den auktoriserade översättningen fick ändras endast där grundspråken, troget återgivna, krävde det. Nya testamentet kom ut 1881, Gamla testamentet 1885 och apokryferna, som bearbetades sist, 1894.
hero.2=Den försiktiga instruktionen hindrade inte det nytestamentliga sällskapet från att fatta bokens mest följdrika beslut. De arbetade inte efter Textus Receptus. Westcott och Hort satt i det sällskapet och lade fram sin egen grekiska text som korrektur allteftersom arbetet fortskred; det revisorerna stannade för var deras egen eklektiska text och inte exakt Westcotts och Horts, men den flyttade sig avgjort mot de äldre uncialhandskrifterna. Ställ denna utgåva bredvid King James Version i två spalter, och förskjutningen syns genast. I 1 Joh. 5:7 läser King James-spalten ”For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one”, och denna läser ”And it is the Spirit that beareth witness, because the Spirit is the truth”.
hero.3=Vad de brittiska revisorerna inte ändrade är just det amerikanerna helst ville ha ändrat. I Psaltaren 23:1 trycker denna utgåva fortfarande ”The LORD is my shepherd”, precis som King James Version gör; American Standard Version ovanför den trycker ”Jehovah is my shepherd”. Namnet står här bara där King James Version själv hade tryckt det — i 2 Mos. 6:3 läser båda ”by my name JEHOVAH” — och att föra det genom hela Gamla testamentet var en amerikansk önskan, hänvisad till bilagan enligt fjortonårsöverenskommelsen och insläppt i texten först 1901. Att läsa de två spalterna tillsammans är den kortaste vägen att se vad den överenskommelsen faktiskt höll tillbaka. En andra skillnad visar sig i meningarnas form snarare än i deras ordalydelse: revisorerna bröt med sättningen vers per rad och satte prosan i stycken, och spåret finns kvar här i verser som börjar med liten bokstav därför att de fortsätter en mening — ”and I appeared unto Abraham” i 2 Mos. 6:3, där King James-spalten börjar ”And I appeared”.
hero.4=Kortet för denna utgåva lämnar årtalet tomt, och det är det ärliga svaret och inte en lucka. Revised Version gavs inte ut en gång utan tre, och texten här är den med åttio böcker: sextiosex böcker jämte apokryfernas fjorton, tillsammans 36 873 verser, vilket betyder att den bär stoff som inte fanns i tryck före 1894. Korpusets notering stämplar den till 1885, det år då Gamla testamentet fullbordade själva Bibeln, och det året visar också stegpinnens bricka. Vilken tryckning texten härstammar från är inte noterat — samma lucka som korpuset lämnar öppen för King James Version och för den finska Biblia från 1776. Lägg också märke till att inget gränssnitt öppnar med denna utgåva; ett engelskt öppnar med New International Version, och till denna byter man.

