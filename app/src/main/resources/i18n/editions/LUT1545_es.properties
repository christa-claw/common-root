title=Luther Bibel 1545 — Acerca de esta edición | Common Root
description=La Ausgabe letzter Hand de Lutero: la Biblia de Wittenberg de 1545, la última edición que Martín Lutero revisó él mismo, y el texto que quedó como referencia tras su muerte.
heroHeading=Luther Bibel 1545
readerHref=/reader?c1.src=lut1545

# The narrative, one paragraph per key, in order.
hero.1=No la primera Biblia de Lutero, sino la última. El Nuevo Testamento que hizo en Wartburg apareció en 1522 y la Biblia completa en 1534; siguió revisando otra década, y la edición que Hans Lufft imprimió en Wittenberg en 1545 es la última que Lutero llevó él mismo a término. El alemán la llama Ausgabe letzter Hand, la edición de última mano. Murió en el febrero siguiente, y este texto se convirtió en la medida con la que se cotejaron las Biblias luteranas posteriores.
hero.2=Trabajó desde los originales y no desde el latín: el griego impreso de Erasmo para el Nuevo Testamento, el hebreo masorético para el Antiguo, con un círculo de colegas de Wittenberg para discutir los pasajes difíciles. Lo que resultó hizo por el alemán aproximadamente lo que la Biblia de 1642 haría por el finés un siglo más tarde. Una lengua de muchos dialectos y poca prosa fijada recibió un registro único que todos podían leer, y de ahí creció la lengua escrita moderna.
hero.3=Aquí se encuentran dos cadenas. La Luther Bibel 1912 está justo encima de esta edición, por ser una revisión suya. También lo está la Biblia 1642, tres peldaños más arriba en la línea finesa, porque el comité de Turku trabajaba con Lutero abierto. Debajo, la escalera alcanza el suelo — el Textus Receptus para el griego, el Códice de Leningrado para el hebreo — y esos peldaños son macizos y no llevan la marca ≈, porque el griego de Erasmo y el hebreo masorético son aquello de lo que Lutero tradujo realmente, no testigos puestos después.

