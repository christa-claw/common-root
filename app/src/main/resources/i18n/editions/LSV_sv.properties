title=Literal Standard Version — Om denna utgåva | Common Root
description=Literal Standard Version: Covenant Press' revidering från 2020 av Robert Youngs Literal Translation från 1800-talet, med målet att ge den mest konsekvent ordagranna engelska återgivningen av hebreiska, arameiska och grekiska som läsbar engelska tillåter.
heroHeading=Literal Standard Version
readerHref=/reader?c1.src=lsv

hero.1=Literal Standard Version presenteras som en genomgripande revidering av Robert Youngs Literal Translation, den extremt ordagranna engelska bibeln från 1800-talet som först gavs ut 1862 och reviderades av Young själv 1887 och 1898. Covenant Press, utgivningsgrenen inom Covenant Christian Coalition, påbörjade den nya revideringen i början av 2018 med det uttalade målet att bevara Youngs åtagande om ord-för-ord-literalitet samtidigt som man moderniserade dess engelska och rättade ställen där senare handskrifts- och lexikal forskning hade gått vidare. Arbetet slutfördes och gavs ut den 2 februari 2020; amerikansk upphovsrätt registrerades i januari samma år, och e-boksutgåvor följde i maj samma år. De enskilda översättarna namnges inte i den utgivna utgåvan; Covenant Press och Covenant Christian Coalition anges som uppdragsgivare.
hero.2=För Gamla testamentet följer LSV den masoretiska texten, med betydande inflytande från Septuaginta och ett tillfälligt tillägg av Dödahavsrullarna där deras läsarter verkade tillräckligt tydliga att föredra. För Nya testamentet följer den Textus Receptus och majoritetstexten, och antar alexandrinska läsarter endast i specifika, uttalade fall, inte som allmän princip. Översättarna satte upp tre vägledande principer: bevara originalets verbtempus där engelskan tillåter det, återge ett givet originalord med samma engelska ord där konsekvens är möjlig, och behålla originalets ordföljd utom där engelskans läsbarhet verkligen kräver en ändring. Gamla testamentets gudsnamn translittereras i stället för att återges med en titel som "HERREN", i linje med översättningens allmänna förkärlek för att visa läsaren originaltextens egna val snarare än att jämna ut dem.
hero.3=Kopplingen till detta korpus är textuell snarare än genealogisk: Literal Standard Versionens Nya testamente bygger på Textus Receptus och majoritetstexten, samma grekiska grund som detta korpus bevarar separat och i sin helhet som Textus Receptus — texten bakom King James Version och i allmänhet reformationstidens tradition. Ingen härstamningsstegpinne förbinder de två utgåvorna, eftersom LSV presenteras som en revidering av Youngs Literal Translation och inte av Textus Receptus självt eller någon text som finns här; en stegpinne öppnad under en LSV-vers går därför rakt ner till botten med originalspråket, markerad ≈. Den ges ut under en Creative Commons Erkännande-DelaLika 4.0-licens i stället för att lämnas till public domain, vilket ställer den vid sidan av New International Version och New American Standard Bible som licensierad snarare än fritt kopierbar — dock på betydligt mer tillåtande villkor än båda. Det engelska gränssnittet öppnar som standard på New International Version; denna utgåva nås från sitt eget kort.

