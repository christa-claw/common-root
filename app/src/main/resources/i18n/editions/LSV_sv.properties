fact.9.value=Licensierad snarare än fri att kopiera, tillsammans med [[NIV|New International Version]] och [[NASB|New American Standard Bible]] — licensierad snarare än fritt kopierbar, dock på betydligt mer tillåtande villkor än båda. Ingen förälder är antecknad i härstamningsstegen: den presenteras som en revidering av Robert Youngs Literal Translation, som inte självt finns i detta korpus, så en stegpinne under en LSV-vers går rakt ner till botten med originalspråket, markerad ≈. Det engelska gränssnittet öppnar som standard på New International Version; denna utgåva nås från sitt eget kort.
