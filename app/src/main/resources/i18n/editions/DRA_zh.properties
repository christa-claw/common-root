title=杜埃-兰斯译本 1899 — 关于此版本 | Common Root
description=杜埃-兰斯圣经：1582 年在兰斯、1609–10 年在杜埃依拉丁文武加大译本所作的英文天主教译本，经查洛纳主教修订，此为 1899 年巴尔的摩印本。
heroHeading=杜埃-兰斯译本 1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=1568 年，一群英格兰天主教徒——其中许多是已无法保住教职的牛津人——在威廉·艾伦主持下于佛兰德的杜埃设立了一所学院。它存在的目的之一，便是把一部英文圣经交到天主教徒手中，因为当时流通的英文圣经全是新教的，且被用于论争。格里高利·马丁于 1578 年 10 月开始翻译，日进约两章，新约于 1582 年在兰斯出版，学院当时已暂迁至该地。马丁在同年 10 月 28 日去世，距其新约面世不过数周。旧约同时完成，随后却搁置未印，原因很简单：学院无力承担印费；它最终于 1609 年与 1610 年分两卷问世，其时距钦定本只剩两年。
hero.2=使它有别于本语料库中其他所有英文圣经的，是它据以译出的底本。不是希伯来文与希腊文，而是拉丁文武加大译本。特伦托会议已宣布武加大为教会的可信文本，而杜埃的译者更主张，耶柔米所据的抄本比他们所能见到的任何希腊文抄本都更古老——就旧约而言，这在 1600 年前后并非不合情理的想法。由此产生的文体拉丁气极重，有时重到根本不像英文：主祷文所求的是“supersubstantial bread”，因为译者不愿把一个承载着神学的词归化。这是原则，不是无能。
hero.3=到十八世纪中叶，几乎已无人能读懂它，理查德·查洛纳主教遂于 1749 至 1752 年间加以修订——改动幅度很大，且大体朝钦定本的方向靠拢，因为到那时钦定本就是英文经文该有的声音。今天以杜埃-兰斯之名出售的每一部圣经，都是查洛纳的文本，而非马丁的。此处所用的是 1899 年的美国印本，出自巴尔的摩的约翰·墨菲公司，载有枢机主教詹姆斯·吉本斯的准印许可；由于该印本早已不受版权限制，自那以后被扫描、录入、翻印的正是它，而几乎所有数字化的杜埃-兰斯译本实际上就是这一本。
hero.4=在本阅读器中，它能做到几乎其他任何版本都做不到的一件事。它所记录的母本就在本语料库之内：在杜埃-兰斯的一节经文之下展开一级谱系阶梯，下面一级便是拉丁文武加大译本本身——它真正据以翻译的那个文本，而不是多数版本坠落到的那个以 ≈ 标示的原文底层。这正是阶梯机制所为之而建的情形。影响也曾反向流动——兰斯新约就摊在钦定本译者的案头，其中不少拉丁气的词汇进入了他们的成果——但谱系表只记录正式的修订谱系，因此这笔债并未记在其中。有一处颠倒值得注意：它的谱系标签载有 1899 这一年份，而目录卡片却根本不显示年份。谱系年份是一份手工整理的清单，卡片读取的则是目录自身的元数据；某一版本若在其一之中而不在其二之中，两者便会公开地各说各话。
hero.5=关于正典的一点提醒。此处保存的文本有 72 卷，而非印本天主教圣经的 73 卷。它所收的六卷次经——多俾亚传、友弟德传、玛加伯上下、智慧篇与德训篇——置于启示录之后，而不在天主教的固有位置，巴路克书则完全缺失。这是数字文本入库时的属性，而非 1899 年那本书的属性；这意味着此栏逐节阅读无误，却不宜用来核对天主教正典究竟包含哪些书卷。

