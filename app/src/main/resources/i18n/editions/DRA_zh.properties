fact.1.label=语言
fact.1.value=英语——天主教传统
fact.2.label=译自
fact.2.value=拉丁文武加大译本，而非希伯来文与希腊文——即本语料库所收的同一部[[VUL|武加大译本]]
fact.3.label=新约
fact.3.value=兰斯，1582 年——主要出自格里高利·马丁之手，另有威廉·艾伦、理查德·布里斯托与托马斯·沃辛顿
fact.4.label=旧约
fact.4.value=杜埃，1609 年与 1610 年，分两卷——与新约同时完成，却因无钱付印而搁置近三十年
fact.5.label=修订者
fact.5.value=理查德·查洛纳主教，1749–1752 年——今日以杜埃-兰斯之名出售的每一部，都是查洛纳的修订本，而非 1582/1610 年的文本
fact.6.label=此印本
fact.6.value=1899 年巴尔的摩约翰·墨菲公司的美国版，载枢机主教詹姆斯·吉本斯的准印许可——早已不受版权限制，也是数字流通的那一版
fact.7.label=此处所收
fact.7.value=72 卷：新教正典的 66 卷依新教次序，另将多俾亚传、友弟德传、玛加伯上下、智慧篇与德训篇附于启示录之后。巴路克书未收，故此栏不能可靠地用以核对天主教正典
fact.8.label=谱系
fact.8.value=本语料库中少数几个所记母本本身也在库内的版本之一——杜埃-兰斯经文之下的一级开启的是[[VUL|拉丁文武加大译本]]，而非原文底层
fact.9.label=在本语料库中
fact.9.value=其谱系标签载有 1899 这一年份，而目录卡片将年份留空；谱系年份是另行整理的一份清单，二者允许不一致
