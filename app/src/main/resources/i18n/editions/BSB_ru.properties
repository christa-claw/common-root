title=Berean Standard Bible — Об этом издании | Common Root
description=Berean Standard Bible: современный английский перевод, сделанный командами Bible Hub и Discovery Bible с масоретского еврейского текста и греческого Нового Завета, изданного ими самими, — и затем переданный в общественное достояние.
heroHeading=Berean Standard Bible
readerHref=/reader?c1.src=bsb

# The narrative, one paragraph per key, in order.
hero.1=Berean Standard Bible — один из самых новых переводов в этом собрании и один из самых открытых относительно того, как он сделан. Его выполнили команды Bible Hub и Discovery Bible под наблюдением консультативного комитета, и вышел он сперва под другим названием — Berean Study Bible. Это порождало постоянную путаницу: study Bible обычно означает Библию, набитую комментарием и примечаниями, чем этот перевод не является. Перевод переименовали; сокращение осталось прежним.
hero.2=Большинство переводов отправляются от греческого Нового Завета, изданного кем-то другим. Этот проект сначала построил собственный. Berean Greek Bible берёт за основу издание Нестле 1904 года — выбранное, по словам издателей, потому что это самый точный критический текст, уже находящийся в общественном достоянии, — и сверяет его с Нестле–Аландом, греческим Новым Заветом SBL, Тишендорфом, Уэсткоттом–Хортом, византийским текстом и Textus Receptus, отмечая в сносках расхождения. Английский переведён с него. Ветхий Завет идёт с масоретского еврейского текста, с привлечением свитков Мёртвого моря, Септуагинты и других ранних свидетелей там, где они влияют на чтение. Та же работа была затем издана слоями: пословный подстрочник, жёстко буквальное издание и это, читаемое, — чтобы читатель мог пройти от греческого к английскому шаг за шагом, а не верить переводчикам на слово. Это ставит Berean и по ту сторону раздела, который делает видимым это собрание: Женевская Библия и King James Version здесь происходят от Textus Receptus, а этот перевод — нет.
hero.3=Последнее, что проект сделал с текстом, — отдал его. Тексты Berean были переданы в общественное достояние в апреле 2023 года, и именно поэтому вся Библия может лежать в этом собрании и копироваться из него обратно. Если поставить интерфейс читалки на английский, откроется New International Version, которая здесь по лицензии; Berean — стоящий рядом современный английский, который каждый вправе цитировать, печатать и распространять. В ступенях родословия он ведёт себя как Biblia en Español Sencillo. Основы для него не записано, потому что это новый перевод, а не пересмотр чего-либо, что есть в собрании, так что ступень, открытая под стихом Berean, падает прямо на пол языков оригинала, помеченный знаком ≈, а не к более старой английской Библии. Год в каталоге тоже оставлен пустым. Это не упущение: текст всё ещё правится по мере поступления исправлений, а годы здесь выверены, а не угаданы, так что издание без единой датированной печати даты не получает.

