title=Riveduta 1927 (italienisch) — Über diese Ausgabe | Common Root
description=Die Riveduta: Giovanni Diodatis italienische Bibel, am Hebräischen und Griechischen revidiert von einem Ausschuss unter dem waldensischen Theologen Giovanni Luzzi, 1924 in Rom von der Britischen und Ausländischen Bibelgesellschaft herausgegeben — und warum die Datei 1927 sagt.
heroHeading=Riveduta 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=Giovanni Luzzi wurde 1856 im Unterengadin geboren, im Schweizer Kanton Graubünden, und kam als Säugling nach Lucca, als seine Familie im folgenden Jahr dorthin auswanderte. Er wuchs als Italiener auf, studierte an der Waldensischen Theologischen Fakultät in Florenz — der Hochschule der alten protestantischen Kirche Italiens —, lehrte später dort Theologie und war Pfarrer in der Stadt. Seine letzten Jahre verbrachte er wieder in der Schweiz, in Poschiavo, und starb dort 1948.
hero.2=Die Riveduta begann 1906, als die Britische und Ausländische Bibelgesellschaft, die Diodatis Übersetzung aus dem siebzehnten Jahrhundert schon seit einem Jahrhundert für italienische Leser druckte, eine Gruppe mit ihrer Revision beauftragte, an ihrer Spitze Luzzi. Er hatte gehofft, daraus eine gemeinsame Bibel mit katholischen Gelehrten zu machen; der Vatikan lehnte ab, und die Arbeit ging als protestantische Revision weiter. Die vollständige Bibel erschien 1924 in Rom und hieß auf dem Titelblatt eine am Urtext revidierte Fassung — „riveduta“, revidiert, und so heißt sie seither. Eine neue Übersetzung ist sie nicht: Darunter liegt Diodatis Text, neu am Hebräischen und Griechischen geprüft. Sie wurde für den größten Teil des zwanzigsten Jahrhunderts die Bibel der italienischen Protestanten, und ihre Nachfolgerin, die Nuova Riveduta, gab die Genfer Bibelgesellschaft 1994 heraus. Luzzi schuf außerdem eine eigene, kommentierte Übersetzung in zwölf Bänden, die ab 1921 in Florenz erschienen; das ist ein anderes Werk und nicht dieser Text.
hero.3=Die Revision zeigt sich auf der Seite. Der Gottesname im Alten Testament ist „l'Eterno“, der Ewige — „L'Eterno è il mio pastore“ in Psalm 23 —, wo Diodati „il Signore“ hat. Jesaja 7:14 lautet „la giovane“, die junge Frau, wo Diodati „la Vergine“ hat. Im Neuen Testament verlässt sie den Textus Receptus dort, wo es die späteren kritischen Ausgaben tun: 1. Johannes 5:7 hat keine himmlischen Zeugen, das Vaterunser in Matthäus 6:13 endet ohne die Doxologie, und Apostelgeschichte 8:37 ist beibehalten, aber in eckige Klammern gesetzt. Die Psalmen folgen der hebräischen Zählung, und die Überschrift eines Psalms ist in seinen ersten Vers gezogen — Psalm 23 beginnt mit „Salmo di Davide.“ —, sodass Psalm 51 wie in englischen Bibeln 19 Verse hat. Zum Datum: 1927 ist das Jahr, das der digitale Text trägt und das der Katalog speichert, daher zeigt ihr Sprossen-Chip 1927. Die Riveduta selbst erschien 1924, und welchen späteren Druck diese Datei wiedergibt, hat dieses Projekt nicht festgestellt.
hero.4=In diesem Leser ist sie eine von drei italienischen Bibeln, neben zwei Exemplaren der Diodati. Eine italienische Oberfläche öffnet nicht auf ihr: Für Italienisch gibt es keine kuratierte Wahl, also nimmt der Leser die erste italienische Bibel in Katalogreihenfolge, und das ist Diodati 1649. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet — nicht einmal Diodati, obwohl die Riveduta eine Revision der Diodati ist und die Diodati im Korpus steht —, sodass eine unter einem Vers geöffnete Sprosse direkt auf den mit ≈ markierten Boden der Ursprachen fällt: den Westminster Leningrad Codex für das Alte Testament und für das Neue den Textus Receptus, genau das Griechisch, von dem sich diese Revision entfernt hat.

