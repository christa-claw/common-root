title=Free Bible Version — この版について | Common Root
description=Free Bible Version:ジョナサン・ギャラガーがヘブライ語とネストレ・アーラントのギリシャ語から訳した現代英語訳の聖書であり、誰でも再版できるようシェアアライク・ライセンスのもとで公開されている。
heroHeading=Free Bible Version
readerHref=/reader?c1.src=fbv

# The narrative, one paragraph per key, in order.
hero.1=この翻訳は、ある著作権表示のページから生まれた。現代の英語聖書のほとんどにはそれが記されており、そこにはたいてい、数百節までは許可を求めずに引用できるが、一冊全体となると書面での許可が必要であり、本文全体を刊行するには使用料を払わなければならないと書かれている。教会のウェブサイトや録音にとって、それで話は終わってしまうこともある。フリー・バイブル・バージョンは、そうした障害が何もない版になるよう作られた。
hero.2=これはジョナサン・ギャラガーの仕事であり、彼はセント・アンドルーズ大学で神学の博士号を得ている。発行元は非営利団体のフリー・バイブル・ミニストリーである。新約聖書はネストレ・アーラントのギリシャ語——聖書協会各団体が用いる校訂本文——から、旧約聖書はヘブライ語から訳された。この計画が述べている手法は、ありふれたものではないだけに記しておく価値がある。訳出は原典から辞書のみを頼りに行われ、そのあとで初めて既存の諸訳と比較される——それは出典としてではなく、重複や誤りがないかを確かめるための点検としてである。これは古い英語聖書の改訂ではなく、新しい諸訳を合わせたものでもない。掲げる目標は、俗語や流行の言い回しを避けた現代英語であり、特定の信仰共同体の立場に寄せて訳すことを拒んでいる。
hero.3=ライセンスこそがこの版の要点である。これはクリエイティブ・コモンズ 表示 - 継承 4.0であり、版を名指しし、変更を明示し、そこから作られるものすべてが同じ条件のもとに置かれるかぎり、複製し、印刷し、ウェブサイトに載せ、改変してよい。それはパブリックドメインとは異なる取り決めである——自由は譲り渡されるのではなく引き継がれていく——そして、このコーパスにあるスペイン語のヴェルシオン・ビブリア・リブレと同じライセンスであり、同じ団体から出ている。
hero.4=読者にとって、ここから二つのことが言える。カタログはその年を空欄のままにしている。この計画は改訂を行うたびに公開しているため、このコーパスが拠って立つ日付入りの印刷は存在せず、年をひとつ作り出すことは空欄にしておくより悪いからである。そして、フリー・バイブル・バージョンの一節の下で段を開くと、≈ TR——テクストゥス・レセプトゥス——が、母本ではなく証人として示される。この翻訳はそこから作られたのではない。これは、このコーパスが現在ギリシャ語として示せるものであり——校訂版はまだここに収められていない——同じ理由から、同じ代わりの印がニュー・インターナショナル・バージョン、ニュー・アメリカン・スタンダード・バイブル、ベレアン・スタンダード聖書の下にも現れる。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=英語——現代アメリカ英語
fact.2.label=翻訳者
fact.2.value=ジョナサン・ギャラガー。神学の博士号はセント・アンドルーズ大学から
fact.3.label=発行元
fact.3.value=非営利団体フリー・バイブル・ミニストリー——このコーパスに収められたスペイン語の[[VBL|ヴェルシオン・ビブリア・リブレ]]も同団体が発行している
fact.4.label=翻訳の底本
fact.4.value=ヘブライ語、および聖書協会各団体が用いる校訂本文であるネストレ・アーラントのギリシャ語新約聖書
fact.5.label=手法
fact.5.value=原典から辞書のみを頼りに訳出し、そのうえで点検として既存の諸訳と比較した——それらを合わせたものではなく、古い英語聖書の改訂でもない
fact.6.label=文体
fact.6.value=俗語や一時的な口語表現を避けた現代英語であり、特定の信仰共同体の立場を表すことを意図していない
fact.7.label=ライセンス
fact.7.value=クリエイティブ・コモンズ 表示 - 継承 4.0——版を名指しし、変更を明示し、派生物が同じライセンスを引き継ぐかぎり、自由に複製、印刷、改変できる
fact.8.label=カタログの年
fact.8.value=推測せず空欄のままにしている——この計画は本文を改訂するたびに新たに公開しており、ひとつの印刷がその版だとは言えない
fact.9.label=段の下
fact.9.value=≈ TR。この翻訳の底本ではなくギリシャ語の証人であり、校訂版のギリシャ語がまだこのコーパスにないため、同じ代わりの印が[[NIV|ニュー・インターナショナル・バージョン]]、[[NASB|ニュー・アメリカン・スタンダード・バイブル]]、[[BSB|ベレアン・スタンダード聖書]]にも使われている
fact.10.label=このコーパスでは
fact.10.value=66巻すべて。英語インターフェースはライセンスされた[[NIV|ニュー・インターナショナル・バージョン]]を開くため、これは[[BSB|ベレアン・スタンダード聖書]]や[[WEB|ワールド・イングリッシュ・バイブル]]と並ぶ、読者がそのまま外へ持ち出せる英語である
