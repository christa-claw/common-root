title=सहीह अल-बुख़ारी — इस संस्करण के बारे में | Common Root
description=सहीह अल-बुख़ारी: वह हदीस-संग्रह जिसे सुन्नी इस्लाम क़ुरआन के ठीक बाद दूसरे स्थान का प्रामाणिक स्रोत मानता है; मुहम्मद अल-बुख़ारी ने इसे लगभग 600,000 परखी गई रिवायतों में से चुना, और केवल उन्हीं को स्वीकार किया जो विश्वसनीय माने गए रावियों की अटूट श्रृंखला रखती थीं।
heroHeading=सहीह अल-बुख़ारी
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=मुहम्मद इब्न इस्माईल अल-बुख़ारी ने यह संग्रह मुख्यतः दो मस्जिदों में तैयार किया — मक्का की मस्जिद अल-हरम और मदीना की मस्जिद अल-नबवी — और इसे अपने गृहनगर बुखारा में हिजरी संवत् 232 (846 ई.) के आसपास पूर्ण किया; अपने जीवन के लगभग अंतिम दो दशक उन्होंने अपनी यात्राओं के दौरान इसे और परिष्कृत करने में बिताए। इसका पूरा नाम, अल-जामिʿ अल-मुसनद अल-सहीह अल-मुख़्तसर मिन उमूर रसूल अल्लाह व-सुननिही व-अय्यामिही, सामान्यतः सहीह अल-बुख़ारी के रूप में संक्षिप्त किया जाता है — 'अल-बुख़ारी का विश्वसनीय [संग्रह]'। कहा जाता है कि अल-बुख़ारी ने स्वयं कहा था कि उन्होंने इसे अपनी परखी हुई लगभग 600,000 हदीस-रिवायतों में से चुना, और किसी रिवायत को तभी स्वीकार किया जब उसमें, उनके आकलन में, मूल स्रोत तक विश्वसनीय रावियों की अटूट श्रृंखला होती थी।
hero.2=यही कसौटी इस पुस्तक के महत्व का कारण है। सहीह अल-बुख़ारी को सुन्नी इस्लाम की छह पुस्तकों (कुतुब अल-सित्ता) में प्रथम माना जाता है, और सहीह मुस्लिम — पद्धति और प्रतिष्ठा में इसके निकटतम प्रतिस्पर्धी — के साथ इन दोनों को सहीहैन, 'दो विश्वसनीय [संग्रह]' कहा जाता है। अधिकांश सुन्नी विद्वान अल-बुख़ारी के संग्रह को किसी भी अन्य हदीस-पुस्तक से ऊपर और प्रामाणिकता में क़ुरआन के ठीक बाद रखते हैं, यद्यपि विद्वानों के एक अल्पमत ने इसके बजाय सहीह मुस्लिम की प्रधानता का समर्थन किया है। सामग्री रावी या कालक्रम के बजाय विषय के अनुसार व्यवस्थित है (जिसे विद्वान मुसन्नफ़ कहते हैं), और यह उन पुस्तकों (कुतुब) में विभाजित है जो अनुष्ठानिक शुद्धि और नमाज़ से लेकर व्यापार, विवाह, पूर्व नबियों के जीवन और अंतिम घड़ी के संकेतों तक फैली हैं।
hero.3=पुस्तक में वास्तव में कितनी हदीसें हैं, यह इस पर निर्भर करता है कि कौन-सी मुद्रण-परंपरा उन्हें गिन रही है। आज सबसे अधिक उल्लिखित आँकड़ा, 7,563, उस क्रमांकन से आता है जो संपादक मुहम्मद फुआद अब्द अल-बाक़ी ने बीसवीं शताब्दी में इस पाठ को दिया, और यह हर बार जब कोई हदीस किसी अन्य अध्याय के अंतर्गत दोहराई जाती है तो उसे फिर से गिनता है; दोहराव हटाने पर इब्न हजर अल-असक़लानी ने 2,602 गिनी। अन्य विद्वानों ने और भी अन्य कुल संख्याएँ प्रस्तावित की हैं। इस संग्रह की अपनी संख्या एक तीसरी ही संख्या है: 98 पुस्तकें और 7,589 क्रमांकित हदीसें — जो केवल उस डिजिटल संस्करण का स्वरूप है जिससे यह लिया गया है, किसी एक विशेष मुद्रित क्रमांकन को यथावत् दोहराने का दावा नहीं।
hero.4=यहाँ का अरबी पाठ शास्त्रीय मतन है, जो सार्वजनिक अधिकार-क्षेत्र में है। इसके नीचे रीडर में एक अंग्रेज़ी अनुवाद है, जो fawazahmed0/hadith-api के eng-bukhari संस्करण से लिया गया है और अरबी के साथ हदीस-दर-हदीस संरेखित किया गया है, जिससे दोनों को साथ पढ़ा जा सके — वही सहवर्ती व्यवस्था जो यह संग्रह अपने क़ुरआन अनुवादों के लिए उपयोग करता है। यह फ़ाइल स्वयं किस प्रकाशित अंग्रेज़ी अनुवाद से उद्भूत है, यह इस संग्रह की ओर से अभी निर्धारित नहीं किया गया है, जिस कारण इसका लाइसेंस सीधे सार्वजनिक अधिकार-क्षेत्र के बजाय समीक्षाधीन अंकित है; ऊपर दी गई अरबी में यह अनिश्चितता नहीं है।

