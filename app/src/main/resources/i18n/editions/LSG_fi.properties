title=Louis Segond 1910 (ranska) — Tietoja tästä laitoksesta | Common Root
description=Segondin Raamattu vuoden 1910 tarkistuksena: genevalaisen pastorin käännös hepreasta ja kreikasta, painettu kokonaisena ensi kerran 1880, tarkistettu Brittiläiselle ja ulkomaiselle raamattuseuralle, ja vuosisadan ajan ranskankielisten protestanttien vakioraamattu.
heroHeading=Louis Segond 1910
readerHref=/reader?c1.src=lsg

# The narrative, one paragraph per key, in order.
hero.1=Louis Segond syntyi 1810 Plainpalais'ssa, joka oli silloin aivan Genevan ulkopuolella, ja kuoli Genevessä 1885. Hän opiskeli teologiaa Strasbourgin protestanttisessa tiedekunnassa, väitteli teologian tohtoriksi kahdenkymmenenkuuden vuoden iässä ja toimi kaksikymmentäneljä vuotta Chêne-Bougeriesin kyläseurakunnan pastorina ennen kuin siirtyi opettamaan hepreaa ja Vanhaa testamenttia. Genevan kunnianarvoisa pastorikunta antoi hänelle tehtäväksi kääntää Vanha testamentti hepreasta uudelleen, ja hänen käännöksensä ilmestyi vuodelle 1874 päivättynä laitoksena. Sen jälkeen hän käänsi omasta aloitteestaan Uuden testamentin, Constantin Tischendorfin kriittisestä kreikkalaisesta tekstistä eikä Textus Receptuksesta, ja 1880 koko Raamattu ilmestyi yhtenä niteenä, Oxfordissa painettuna.
hero.2=Tämä ei ole aivan se teksti, jonka Segond julkaisi. Hänen kuolemansa jälkeen Brittiläinen ja ulkomainen raamattuseura tarkistutti sen ranskalaisten ja sveitsiläisten pastorien ja teologien ryhmällä, ja tarkistus ilmestyi 1910. Muutokset kallistuivat protestanttisen ortodoksian sanastoon päin — papeista tuli ”sacrificateurs”, vanha protestanttinen sana, eikä ”prêtres”; tässä kappaleessa ”sacrificateur” on kaikkialla ja ”prêtre” harvinainen. Juuri tästä vuoden 1910 tekstistä tuli ranskalaisen protestanttisuuden viiteraamattu suurimmaksi osaksi kahdennellakymmenennellä vuosisadalla, ja se on yhä luetuimpia ranskankielisten evankelikaalien keskuudessa. Sillä on myös pitkä jälkeläisten suku: ”Colombe” vuodelta 1978, Nouvelle Édition de Genève vuodelta 1979 ja Segond 21 vuonna 2007. Muutama piirre näkyy lähes joka sivulla. Jumalan nimi on ”l'Éternel”, Iankaikkinen, kuten Ostervaldissa ja tämän aineiston ranskalaisessa Darbyssa: ”L'Éternel est mon berger” psalmissa 23. Ja Jesajan 7:14 kuuluu ”la jeune fille deviendra enceinte” — nuori nainen, ei neitsyt — juuri sellainen käännösratkaisu, jonka vuoksi eräät konservatiiviset protestantit syyttivät Segondia messiaanisten ennustusten heikentämisestä.
hero.3=Psalmeissa kirja seuraa hepreaa: numerointi on heprealainen, joten psalmi 23 on paimenpsalmi, ja missä psalmin otsikko on hepreassa jae, se on jae täälläkin — psalmissa 51 on 21 jaetta, kaksi enemmän kuin King James Versionissa. Joel ja Malakia sen sijaan säilyttävät latinalaisen ja englantilaisen perinteen lukujaon, kolme lukua ja neljä. Tässä lukuohjelmassa se on yksi kolmesta ranskankielisestä Raamatusta, Ostervaldin ja ranskalaisen Darbyn rinnalla. Ranskankielinen käyttöliittymä ei avaa sitä: ranskalle ei ole valittu poimintaa, joten lukuohjelma ottaa luettelojärjestyksessä ensimmäisen ranskankielisen Raamatun, joka on Darby. Polveutumisaskelmiin sille ei ole kirjattu kantatekstiä, joten jakeen alta avattu askelma putoaa suoraan ≈-merkittyyn alkukielten pohjaan — Vanhassa testamentissa Leningradin koodeksiin, masoreettisen perinteen käsikirjoitukseen eikä Segondin aikaiseen painettuun hepreaan, ja Uudessa Textus Receptukseen, joka on juuri se kreikka, jota hän päätti olla seuraamatta. Sen askelmamerkintä kantaa vuotta 1910.

