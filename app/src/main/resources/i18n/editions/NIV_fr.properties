title=New International Version — À propos de cette édition | Common Root
description=La New International Version : la Bible anglaise sur laquelle ce lecteur s'ouvre par défaut, traduite directement des langues originales par le Committee on Bible Translation et achevée pour la première fois en 1978 — ici dans son texte de 2011.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Tout a commencé par le mécontentement d'une confession. En 1955, l'homme d'affaires Howard Long, avec le pasteur Peter De Jong, pressa la Christian Reformed Church de produire une Bible en anglais contemporain, et en 1957 la CRC approuva la formation d'un comité pour étudier l'idée. La National Association of Evangelicals avait lancé la même année un projet similaire, de son côté. Les deux organismes joignirent leurs forces : un comité commun envoya en 1964 des invitations à une conférence de traduction, qui se réunit en août 1965 au Trinity Christian College, à Palos Heights, dans l'Illinois, et résolut de former « un comité permanent de quinze » pour poursuivre le travail. Ce comité permanent devint le Committee on Bible Translation. En 1967, la New York Bible Society — depuis renommée Biblica — reprit le parrainage du projet et engagea les spécialistes qui allaient faire la traduction.
hero.2=Rien ici ne descend d'une Bible anglaise plus ancienne. Là où la King James Version, la Revised Version, l'American Standard Version et la World English Bible forment dans ce corpus une seule chaîne de révisions, la New International Version a été traduite à neuf, directement depuis l'hébreu, l'araméen et le grec : l'Ancien Testament depuis le texte hébreu massorétique, en tenant compte des manuscrits de la mer Morte, de la Septante et d'autres témoins anciens ; le Nouveau Testament depuis le texte grec critique éclectique que représentent les éditions de l'United Bible Societies et de Nestle-Aland, et non le Textus Receptus sur lequel reposent ici la Bible de Genève et la King James. Le comité de quinze membres grandit, en une dizaine d'années, pour devenir un projet faisant appel à plus de cent spécialistes venus de plusieurs pays anglophones et de nombreuses confessions. Leur but déclaré était une traduction fidèle à l'exactitude du texte original sans se lire comme une transcription mot à mot de celui-ci — un équilibre généralement classé comme équivalence dynamique, entre une restitution littérale stricte et une paraphrase lâche.
hero.3=Le Nouveau Testament parut d'abord, en 1973 ; la Bible complète suivit le 27 octobre 1978 ; une légère révision eut lieu en 1984. Le texte changea plus profondément en 2011, lorsqu'une révision plus large remplaça à la fois l'édition de 1984 et la Today's New International Version de 2005, retirant les deux au profit du texte unique en vigueur depuis. C'est ce texte de 2011 que conserve ce corpus — la même année que celle indiquée sur la fiche du catalogue. Biblica, Inc. en détient les droits d'auteur de bout en bout ; Zondervan la publie aux États-Unis et Hodder & Stoughton au Royaume-Uni.
hero.4=Sa place dans ce lecteur est discrètement centrale. Réglez l'interface sur l'anglais, et c'est elle qui s'ouvre — les pages de la King James Version et de la Revised Version dans ce corpus le disent elles-mêmes, désignant celle-ci comme l'édition dont on s'éloigne plutôt que celle sur laquelle on atterrit. Comme elle n'a révisé aucun texte antérieur, le corpus ne lui attribue aucun texte source : ouvrir un échelon de filiation sous un verset de la New International Version descend directement au sol des langues originales marqué ≈, comme pour la Berean Standard Bible — à une nuance près qu'il convient de connaître. Le témoin grec de ce sol est le Textus Receptus, et le Textus Receptus n'est pas ce dont le Nouveau Testament de cette traduction a réellement été fait — le sol tient lieu du « grec original » en général, non du texte de travail propre à ce comité. Autre chose la distingue de la plupart de ses voisines anglaises : elle est sous licence, non dans le domaine public, le même statut que la New American Standard Bible 2020, tandis que la Berean Standard Bible, la Bible de Genève, la King James Version, la Revised Version et la World English Bible peuvent toutes être copiées librement.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Langue
fact.1.value=Anglais
fact.2.label=Commandée
fact.2.value=Par un comité commun de la Christian Reformed Church et de la National Association of Evangelicals, qui convoqua une conférence au Trinity Christian College, à Palos Heights, dans l'Illinois, en août 1965
fact.3.label=Réalisée par
fact.3.value=Le Committee on Bible Translation — quinze spécialistes au départ, dont le nombre dépassa par la suite la centaine, venus de plusieurs pays anglophones et de nombreuses confessions, sur une dizaine d'années
fact.4.label=Ancien Testament d'après
fact.4.value=Le texte hébreu massorétique, en tenant compte des manuscrits de la mer Morte, de la Septante et d'autres témoins anciens
fact.5.label=Nouveau Testament d'après
fact.5.value=Le texte grec critique éclectique que représentent les éditions de l'United Bible Societies et de Nestle-Aland — non [[TR|le Textus Receptus]] sur lequel reposent ici [[GNV|la Bible de Genève]] et [[KJV|la King James Version]]
fact.6.label=Genre de traduction
fact.6.value=Équilibre l'exactitude d'une restitution littérale avec un anglais naturel et idiomatique, sans s'arrêter à l'une ou l'autre extrémité — généralement classé comme équivalence dynamique ; une traduction nouvelle depuis les langues originales, non une révision de la tradition King James
fact.7.label=Publiée
fact.7.value=Le Nouveau Testament en 1973 ; la Bible complète le 27 octobre 1978 ; une légère révision en 1984 ; le texte actuel, révisé plus en profondeur, en 2011, qui retira à la fois l'édition de 1984 et la Today's New International Version de 2005
fact.8.label=Éditeur
fact.8.value=Biblica, Inc., qui en détient les droits d'auteur ; Zondervan aux États-Unis, Hodder & Stoughton au Royaume-Uni
fact.9.label=Licence
fact.9.value=Sous licence, non dans le domaine public. Jusqu'à 500 versets peuvent être cités sans autorisation écrite, à condition qu'ils ne constituent ni un livre entier de la Bible ni plus de 25 % de l'ouvrage, avec une mention des droits d'auteur ; tout ce qui dépasse exige l'autorisation de Biblica
fact.10.label=Dans ce corpus
fact.10.value=La Bible sur laquelle une interface en anglais s'ouvre par défaut — [[KJV|la King James Version]] et [[RV|la Revised Version]] constatent ici, l'une comme l'autre, qu'elles ne le sont pas. Aucun texte source n'est enregistré dans les échelons de filiation : un échelon sous un verset de la NIV descend directement au sol des langues originales marqué ≈, comme pour [[BSB|la Berean Standard Bible]] — sauf que le témoin grec de ce sol est [[TR|le Textus Receptus]], qui n'est pas le texte dont le Nouveau Testament de cette traduction a réellement été fait. Sous licence plutôt que dans le domaine public, avec le même statut que la New American Standard Bible 2020, elle se distingue ainsi de voisines du domaine public comme [[KJV|la King James Version]], [[RV|la Revised Version]] et [[WEB|la World English Bible]]
