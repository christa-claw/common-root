title=सिनॉडल बाइबिल — इस संस्करण के बारे में | Common Root
description=1876 का रूसी सिनॉडल अनुवाद: 1813 में रूसी बाइबिल सोसाइटी द्वारा आरंभ किया गया, महानगर फ़िलारेट के नेतृत्व में चार रूढ़िवादी धर्मशास्त्रीय अकादमियों द्वारा पूरा किया गया, और आज भी वह बाइबिल जिसे अधिकांश रूसी भाषी केवल "बाइबिल" कहकर पुकारते हैं।
heroHeading=सिनॉडल बाइबिल
readerHref=/reader?c1.src=syn

hero.1=यह परियोजना 1813 में शुरू हुई, जब नवस्थापित रूसी बाइबिल सोसाइटी ने, ज़ार अलेक्ज़ेंडर प्रथम के समर्थन से, एक रूसी अनुवाद का काम हाथ में लिया जिसे चर्च स्लावोनिक बाइबिल की जगह लेने के बजाय उसके साथ खड़ा होना था। कुछ ही वर्षों में एक नया नियम सामने आया। रूढ़िवादी पादरियों ने बोलचाल की रूसी में बाइबिल को चर्च स्लावोनिक पाठ के अधिकार के लिए ख़तरा माना, और 1826 में निकोलस प्रथम ने सोसाइटी को बंद कर काम को तीन दशकों के लिए रोक दिया।
hero.2=अनुवाद का काम अलेक्ज़ेंडर द्वितीय के समय में ही फिर शुरू हुआ। 1858 में पवित्र धर्मसभा ने एक नए रूसी संस्करण को मंज़ूरी दी और यह काम मॉस्को, सेंट पीटर्सबर्ग, कज़ान और कीव की धर्मशास्त्रीय अकादमियों को सौंपा; मॉस्को के महानगर फ़िलारेट (द्रोज़्दोव) इसके प्रमुख और अंतिम संपादक रहे। टेक्स्टस रिसेप्टस कहे जाने वाले मुद्रित यूनानी पाठ से अनूदित नया नियम 1862 में प्रकाशित हुआ। पुराना नियम तय करने में अधिक कठिन मुद्दा था: फ़िलारेट ने चर्च स्लावोनिक पाठ से आगे जाकर सीधे हिब्रू पाठ तक पहुँचने पर ज़ोर दिया, जिसका विरोध उन लोगों ने किया जो चर्च स्लावोनिक पाठ के यूनानी आधार पर अडिग थे, और मासोरेटिक पाठ से अनुवाद करने की धर्मसभा की औपचारिक अनुमति उसी 1862 में ही मिली — तब तक पुराने नियम का अधिकांश भाग उसी आधार पर पहले ही अनूदित हो चुका था।
hero.3=पूरी बाइबिल — पुराना और नया नियम चर्च स्लावोनिक के बजाय इस नई रूसी भाषा में पहली बार एक ही जिल्द में — 1876 में धर्मसभा छापाखाने से प्रकाशित हुई, जहाँ से अनुवाद का प्रचलित नाम आया है। इसका पुराना नियम केवल हिब्रू नहीं निकला: जहाँ चर्च स्लावोनिक परंपरा द्वारा संजोई गई सेप्टुआजिंट मासोरेटिक पाठ से भिन्न थी, वहाँ यूनानी पाठ को भी अक्सर रखा गया, प्रायः कोष्ठक में एक विकल्प के रूप में, जिससे तैयार पुस्तक पुराने चर्च स्लावोनिक पाठ के पीछे खड़ी यूनानी बाइबिल के प्रति एक वास्तविक ऋण आज भी वहन करती है।
hero.4=तब से इसका कोई गंभीर प्रतिद्वंद्वी नहीं रहा। रूस में रूढ़िवादी, कैथोलिक, बैप्टिस्ट और अन्य प्रोटेस्टेंट पाठक सभी किसी न किसी रूप में इसी पाठ की ओर रुख़ करते हैं, और इसकी शैली ने साहित्यिक रूसी को उतना ही प्रभावित किया है जितना किंग जेम्स बाइबिल ने अंग्रेज़ी को। इस संग्रह में यह 66 पुस्तकों वाला है — व्यापक रूढ़िवादी सिद्धांत-सूची के बजाय प्रोटेस्टेंट सिद्धांत-सूची — और यहाँ यह एकमात्र रूसी बाइबिल है, इसलिए रूसी इंटरफ़ेस इसी पर खुलता है।

