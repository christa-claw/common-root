title=صحيح البخاري — عن هذه الطبعة | Common Root
description=صحيح البخاري: مجموعة الأحاديث التي يضعها الإسلام السني في المرتبة الثانية من السلطة بعد القرآن مباشرة، جمعها محمد البخاري من بين نحو 600,000 رواية فحصها، فلم يقبل منها إلا ما حمل سلسلة متصلة من الرواة الذين وثق بهم.
heroHeading=صحيح البخاري
readerHref=/reader?c1.src=buk-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=جمع محمد بن إسماعيل البخاري هذه المجموعة في معظمها في مسجدين — المسجد الحرام في مكة ومسجد النبي في المدينة — وأتمها في مدينته بخارى نحو سنة 232 هـ (846 م)؛ وقضى نحو العقدين الأخيرين من حياته في مراجعتها أكثر خلال رحلاته. واسمها الكامل، الجامع المسند الصحيح المختصر من أمور رسول الله وسننه وأيامه، يُختصر عادة إلى صحيح البخاري — "[مجموعة] البخاري الموثوقة". ويُروى أن البخاري نفسه قال إنه اختارها من بين نحو 600,000 رواية حديثية فحصها، ولم يقبل رواية إلا حين حملت، في تقديره، سلسلة متصلة من رواة وثق بهم حتى مصدرها الأصلي.
hero.2=وهذا المعيار هو سبب الثقل الذي يحمله الكتاب. يُحسب صحيح البخاري أول كتب السنة الستة عند أهل السنة (الكتب الستة)، ومع صحيح مسلم — أقرب نظرائه في المنهج والمكانة — يُسمّى الكتابان الصحيحين، "الكتابان الموثوقان". ويضع معظم علماء السنة مجموعة البخاري فوق كل كتاب حديث آخر، وفي السلطة في المرتبة الثانية بعد القرآن نفسه مباشرة، وإن كانت أقلية من العلماء قد ذهبت إلى تقديم صحيح مسلم عليه. وقد رُتّبت المادة بحسب الموضوع لا بحسب الراوي أو الزمن (وهو ما يسمّيه العلماء مصنَّفاً)، وقُسّمت إلى كتب تمضي من الطهارة والصلاة إلى التجارة والزواج وحياة الأنبياء السابقين وعلامات الساعة.
hero.3=ويختلف عدد الأحاديث التي يحتويها الكتاب فعلاً باختلاف التقليد المطبوع الذي يعدّها. فالرقم الأكثر ذكراً اليوم، 7,563، مأخوذ من الترقيم الذي أعطاه المحقق محمد فؤاد عبد الباقي للنص في القرن العشرين، وهو يعيد عدّ الحديث كل مرة يتكرر فيها تحت باب آخر؛ وبحذف التكرار، عدّ ابن حجر العسقلاني 2,602. وقد اقترح علماء آخرون مجاميع أخرى غيرها. أما رقم هذه المجموعة نفسها فهو رقم ثالث: 98 كتاباً و7,589 حديثاً مرقَّماً، وهو مجرد شكل الطبعة الرقمية التي أُخذت منها، لا دعوى بإعادة طبعة مطبوعة واحدة بعينها بدقة.
hero.4=والنص العربي هنا هو المتن الكلاسيكي، وهو ملك عام. وتحته في القارئ ترجمة إنجليزية، مأخوذة من طبعة eng-bukhari في fawazahmed0/hadith-api، ومحاذاة حديثاً بحديث مع العربية بحيث يمكن قراءة الاثنين معاً — وهو نفس ترتيب المرافقة الذي تستخدمه هذه المجموعة في ترجماتها للقرآن. ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة إنجليزية منشورة يعود هذا الملف نفسه، ولهذا السبب وُضعت رخصته على أنها قيد المراجعة لا ملكاً عاماً مباشرة؛ أما العربية فوقها فلا تحمل هذا الغموض.

