fact.7.label=عدد الأحاديث
fact.7.value=7,563 بالتكرار في ترقيم عبد الباقي الواسع الانتشار، أو 2,602 بلا تكرار بحسب عدّ ابن حجر العسقلاني؛ وتختلف الطبعات المطبوعة في ترقيم الأبواب والأحاديث معاً
fact.8.label=في هذه المجموعة
fact.8.value=98 كتاباً و7,589 حديثاً مرقَّماً — وهو شكل مجموعة البيانات المصدرية نفسها، لا إعادة إنتاج لترقيم مطبوع معيّن
fact.9.label=الترجمة الإنجليزية
fact.9.value=مأخوذة من طبعة eng-bukhari في fawazahmed0/hadith-api، وتظهر مرافقة تحت العربية؛ ولم يتحدد من جهة هذه المجموعة إلى أي ترجمة منشورة تعود
fact.10.label=الرخصة
fact.10.value=المتن العربي هو النص الكلاسيكي الملك العام؛ أما رخصة الترجمة الإنجليزية فما زالت قيد المراجعة
