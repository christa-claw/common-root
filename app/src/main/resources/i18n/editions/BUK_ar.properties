fact.4.label=مكان وزمان التأليف
fact.4.value=في معظمه بالمسجد الحرام في مكة ومسجد النبي في المدينة؛ واكتمل في بخارى نحو سنة 232 هـ (846 م)
fact.5.label=المنهج
fact.5.value=لا يقبل حديثاً إلا بسلسلة متصلة من الرواة الذين وثق بهم البخاري؛ ويُروى أنه اختار المجموعة من بين نحو 600,000 رواية فحصها
fact.6.label=المكانة
