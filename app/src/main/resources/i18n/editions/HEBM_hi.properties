title=इब्रानी बाइबिल — इस संस्करण के बारे में | Common Root
description=सम्पूर्ण बाइबिल इब्रानी में: मासोरेटिक पुराना नियम, और साथ में फ़्रांत्स डेलिच का 1877 का नया नियम, जो मिश्ना की इब्रानी में लौटाकर अनूदित किया गया — उन पाठकों के लिए जो पूरी पुस्तक एक ही भाषा में चाहते थे।
heroHeading=इब्रानी बाइबिल — मासोरेटिक पुराना नियम और डेलिच का नया नियम
readerHref=/reader?c1.src=hebm

# The narrative, one paragraph per key, in order.
hero.1=आवरण से आवरण तक इब्रानी बाइबिल सुनने में जितनी लगती है उससे अधिक अनोखी वस्तु है, क्योंकि उसका आधा भाग कभी इब्रानी में लिखा ही नहीं गया। पुराना नियम इब्रानी है और सदा रहा है। नया नियम हम तक यूनानी में पहुँचा। अतः इस प्रकार का संस्करण दो भिन्न कोटियों के पाठ हैं जो एक साथ सिल दिए गए हैं: एक मूल, और एक अनुवाद जो सामान्य से उलटी दिशा में किया गया — यूनानी से लौटकर उस भाषा में जिसे उसके लेखक प्रायः बोलते थे।
hero.2=नए नियम वाला आधा भाग फ़्रांत्स डेलिच का कार्य है — लाइपत्सिग के इब्रानी तथा रब्बीनी साहित्य के विद्वान, जिन्हें ब्रिटिश एण्ड फ़ॉरेन बाइबिल सोसाइटी ने 1873 में यह कार्य सौंपा और जिन्होंने उसे 1877 में पूरा किया। उन्होंने अपनी ही शताब्दी की इब्रानी में अनुवाद नहीं किया। उन्होंने मिश्ना की और द्वितीय मन्दिर काल की इब्रानी में लिखा, इस तर्क पर कि पहली शताब्दी के पाठ को वैसा ही सुनाई देना चाहिए — इसलिए परिणाम इब्रानी में उतारे जाने से कम, और यह पता लगाने के प्रयास से अधिक पढ़ा जाता है कि यूनानी बनने से पहले वे वाक्य क्या रहे होंगे। यह आज भी वही इब्रानी नया नियम है जिस तक सबसे अधिक पहुँचा जाता है।
hero.3=वे किस यूनानी पाठ से काम करेंगे, यह कुछ हद तक उनके लिए तय कर दिया गया। उन्होंने कोडेक्स सिनाइटिकस से आरम्भ किया — वह चौथी शताब्दी की पाण्डुलिपि जो कुछ दशक पूर्व ही मिली थी — और बाइबिल सोसाइटी ने, जिसकी नीति प्रचलित पाठ से प्रकाशित करने की थी, उस पर खड़े संस्करण को आगे धन देने से मना कर दिया। डेलिच टेक्स्टस रिसेप्टस पर लौट आए और महत्वपूर्ण सिनाई पाठान्तरों को अपनाने के बजाय उन्हें चिह्नित भर किया। इसके बाद पाठ तेरह वर्ष और दस संस्करणों तक चलता रहा; अन्तिम को 1890 में गुस्ताफ़ डाल्मान ने छपाई तक पहुँचाया, उसी वर्ष जिसमें डेलिच का निधन हुआ। सूची इस संस्करण का वर्ष रिक्त क्यों छोड़ती है, उसका एक कारण यही है: दोनों अर्धांशों की कोई साझी तिथि नहीं, और जिस अर्धांश के पास तिथियाँ हैं उसके पास दस हैं।
hero.4=इस पाठक में यही वह संस्करण है जिस पर इब्रानी अंतरफलक खुलता है — एक चुना हुआ निर्णय, वर्णक्रम का संयोग नहीं — और इब्रानी चुनने पर सम्पूर्ण अंतरफलक इसके चारों ओर दाएँ से बाएँ पलट जाता है। यह लेनिनग्राद कोडेक्स के साथ खड़ा है, उससे होड़ किए बिना: कोडेक्स विद्वत्ता का तनख़ है, पूर्ण स्वरांकित और स्वराघात-चिह्नित, और वहीं रुक जाता है जहाँ पुराना नियम रुकता है; जबकि यह एक सादा व्यंजन-पाठ है जो प्रकाशितवाक्य तक चलता जाता है। वंश-पायदान इसके लिए कोई मूल दर्ज नहीं करते, इसलिए किसी पद के नीचे खोला गया पायदान सीधे मूल-भाषा तल पर गिरता है, ≈ WLC और ≈ TR। इस संग्रह में अन्यत्र वह तल एक सन्निकटन है, और ≈ इसी की चेतावनी देता है। यहाँ वह लगभग सन्निकटन नहीं है: परदे पर का पुराना नियम स्वयं मासोरेटिक पाठ है, और टेक्स्टस रिसेप्टस ठीक वही है जो डेलिच के सामने वास्तव में रखा था।

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=भाषा
fact.1.value=इब्रानी — स्वर-चिह्नों और स्वराघात-चिह्नों के बिना व्यंजन-पाठ
fact.2.label=यह क्या है
fact.2.value=एक ही बाइबिल के रूप में बँधे दो पाठ: परम्परागत मासोरेटिक पुराना नियम, और उन्नीसवीं शताब्दी में यूनानी से अनूदित एक इब्रानी नया नियम
fact.3.label=नए नियम के अनुवादक
fact.3.value=फ़्रांत्स डेलिच (1813–1890), लाइपत्सिग के इब्रानीविद्
fact.4.label=किसने कराया
fact.4.value=ब्रिटिश एण्ड फ़ॉरेन बाइबिल सोसाइटी ने 1873 में; अनुवाद 1877 में पूरा हुआ
fact.5.label=पुराना नियम किससे
fact.5.value=स्वयं मासोरेटिक इब्रानी से — अनुवाद नहीं, और इसी से यह यहाँ का एकमात्र ऐसा संस्करण बनता है जिसका पुराना नियम पहले से ही अपनी मूल भाषा में है, जैसे [[WLC|वेस्टमिंस्टर लेनिनग्राद संहिता]] है
fact.6.label=नया नियम किससे
fact.6.value=[[TR|टेक्स्टस रिसेप्टस]] की यूनानी से। डेलिच ने आरम्भ इसके बजाय कोडेक्स सिनाइटिकस से किया था, किन्तु सोसाइटी प्रचलित पाठ से प्रकाशित करती थी और इस विचलन को धन देना नहीं चाहती थी
fact.7.label=भाषा-स्तर
fact.7.value=आधुनिक इब्रानी नहीं। डेलिच ने मिश्ना की और द्वितीय मन्दिर काल की इब्रानी में लिखा, और यूनानी को वह मुहावरा लौटाने का प्रयत्न किया जो उसके बोलने वालों ने प्रयोग किया होता
fact.8.label=संशोधन चलता रहा
fact.8.value=1890 तक; अन्तिम संस्करण को गुस्ताफ़ डाल्मान ने छपाई तक पहुँचाया
fact.9.label=इससे भ्रमित न हों
fact.9.value=इस्राएल की बाइबिल सोसाइटी द्वारा प्रकाशित आधुनिक इब्रानी नया नियम, जो बीसवीं शताब्दी का अलग अनुवाद है और अब भी कॉपीराइट में है
fact.10.label=सूची में वर्ष
fact.10.value=रिक्त छोड़ा गया — दोनों अर्धांशों का कोई साझा वर्ष नहीं, और अकेले नए नियम का संशोधन तेरह वर्षों और दस संस्करणों तक चला
fact.11.label=इस संग्रह में
fact.11.value=सभी 66 पुस्तकें, और इब्रानी अंतरफलक के लिए चुना हुआ पूर्वनिर्धारित संस्करण — पाठक [[WLC|वेस्टमिंस्टर लेनिनग्राद संहिता]] पर नहीं, इसी पर खुलता है, क्योंकि यह नए नियम के अन्त तक पूरा मार्ग तय करता है
