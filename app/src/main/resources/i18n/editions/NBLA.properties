title=Nueva Biblia de las Américas — About This Edition | Common Root
description=The Nueva Biblia de las Américas: The Lockman Foundation's Latin American Spanish revision of its own La Biblia de las Américas, carrying the same word-for-word method into the everyday Spanish spoken across the Americas.
heroHeading=Nueva Biblia de las Américas
readerHref=/reader?c1.src=nbla

hero.1=The Nueva Biblia de las Américas is The Lockman Foundation's Latin American Spanish edition, built on the Foundation's earlier La Biblia de las Américas of 1986 — itself the product of roughly fifteen years' work by twenty-two translators and consultants, using the same word-for-word translation philosophy later carried into English as the New American Standard Bible. Rather than a fresh translation from Hebrew and Greek, the NBLA is a register revision: a twelve-member Lockman committee reworked La Biblia de las Américas's more Castilian-leaning Spanish into the familiar, modern Spanish spoken across Latin America, replacing forms such as the second-person plural "vosotros" with the more widely used "ustedes" and loosening constructions, such as the formulaic "y" and "sucedió que," that the earlier text had carried over literally from Hebrew narrative style. The Lockman Foundation's own permission-to-quote notice dates the finished text to 2005.
hero.2=The textual basis follows directly from La Biblia de las Américas: the Old Testament rests on Rudolf Kittel's Biblia Hebraica, with the Dead Sea Scrolls consulted, and the New Testament generally on the 27th edition of Eberhard Nestle's Novum Testamentum Graece, with further manuscript evidence weighed where it bears on a particular reading. Some booksellers and Bible-software catalogues now group the Nueva Biblia de las Américas together with the Foundation's 2020 revision of the New American Standard Bible, marketing the two as a matched pair for English and Spanish readers of the same literal tradition; the translation itself, however, carries no later copyright date than 2005 in the Foundation's own notices.
hero.3=The Spanish interface here opens by default on the Reina Valera 1909, a public-domain text from an entirely separate translation tradition and a century older; the Nueva Biblia de las Américas is reached instead from its own card in the translation grid. It shares little textual history with that edition, but a great deal with the New American Standard Bible — the same foundation, the same formal-equivalence method, and the same licensed rather than public-domain status, permitting up to 500 verses to be quoted without written permission, short of a complete book or a quarter of the quoting work. No parent is recorded in the lineage rungs: La Biblia de las Américas, the text it revises, is not itself held in this corpus, so a rung opened beneath an NBLA verse goes straight to the original-language floor marked ≈.

fact.1.label=Language
fact.1.value=Spanish
fact.2.label=Commissioned by
fact.2.value=The Lockman Foundation of La Habra, California — the same nonprofit behind the New American Standard Bible and its own predecessor, La Biblia de las Américas (1986)
fact.3.label=Made by
fact.3.value=A twelve-member Lockman revision committee working from La Biblia de las Américas's translation, itself the work of twenty-two translators and consultants over some fifteen years
fact.4.label=Old Testament from
fact.4.value=Rudolf Kittel's Biblia Hebraica, with the Dead Sea Scrolls consulted, carried over from La Biblia de las Américas's own textual basis
fact.5.label=New Testament from
fact.5.value=Eberhard Nestle's Novum Testamentum Graece, generally the 27th edition, with attention to further manuscript evidence where it bears on a reading
fact.6.label=Kind of translation
fact.6.value=Formal equivalence, the same word-for-word approach as La Biblia de las Américas and the New American Standard Bible — not a fresh translation but a register revision into the familiar, modern Spanish spoken across Latin America, replacing Castilian forms such as "vosotros" with "ustedes" and reworking constructions such as the formulaic "y" and "sucedió que" that the earlier text carried over literally from Hebrew
fact.7.label=Published
fact.7.value=Copyrighted 2005 by The Lockman Foundation; some catalogues since group it alongside the Foundation's 2020 revision of the New American Standard Bible, though 2005 remains the year named in its own copyright notice
fact.8.label=Licence
fact.8.value=Licensed, not public domain. Up to 500 verses may be quoted in any form without written permission, provided they do not form a complete Bible book or more than a quarter of the quoting work, with a copyright notice naming 2005; anything beyond that needs the Lockman Foundation's permission
fact.9.label=In this corpus
fact.9.value=Licensed rather than public domain, like [[NASB|the New American Standard Bible]] from the same foundation. The Spanish interface opens by default on [[RVR09|the Reina Valera 1909]], a public-domain text from an unrelated tradition and a century older, with this edition reached from its own card. No parent is recorded in the lineage rungs: it is a register revision of La Biblia de las Américas, which is not itself held in this corpus, so a rung opened beneath an NBLA verse goes straight to the original-language floor marked ≈.
