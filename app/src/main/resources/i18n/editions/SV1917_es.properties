title=Svenska 1917 — Sobre esta edición | Common Root
description=La traducción de 1917 de la Iglesia de Suecia —Gustav V:s bibel— la primera Biblia sueca hecha directamente del hebreo y el griego en lugar de revisada a partir de la anterior, y la única Biblia sueca que conserva este corpus.
heroHeading=Svenska 1917
readerHref=/reader?c1.src=sv1917

# The narrative, one paragraph per key, in order.
hero.1=Durante tres siglos y medio, la Iglesia de Suecia tuvo una sola Biblia, revisada pero nunca rehecha. La Biblia de Gustavo Vasa de 1541, la primera Biblia completa impresa en sueco, se apoyaba en gran medida en el alemán de Martín Lutero. La Biblia de Gustavo II Adolfo de 1618 la revisó, y Karl XII:s bibel de 1703 —terminada bajo un rey aunque encargada por su padre antes que él— llevó ese mismo sueco heredado un paso más allá. Ninguna de las tres volvió a empezar de nuevo.
hero.2=En 1773 Gustavo III nombró una comisión bíblica para hacer lo que ninguna de aquellas revisiones había hecho: traducir directamente del hebreo y el griego en vez de volver a trasladar el sueco antiguo una vez más. La comisión trabajó durante 144 años. Su resultado —la segunda traducción completa de la Biblia en Suecia, después de la de Gustavo Vasa y antes de Bibel 2000— quedó terminado y autorizado bajo Gustavo V en 1917, y por eso todavía se la suele llamar Gustav V:s bibel.
hero.3=El Antiguo Testamento descansa sobre el texto hebreo masorético, como las ediciones anteriores. El Nuevo Testamento no continúa su línea: sigue el texto crítico griego más actualizado de que disponía la comisión hacia 1917, en vez del Textus Receptus sobre el que se basan las Biblias de la Reforma que guarda este corpus.
hero.4=En este lector es la única Biblia sueca, de modo que poner la interfaz en sueco abre en ella —no por una elección curada, como se escogió la Reina-Valera 1909 para el español, sino porque el barrido del catálogo no encuentra otra cosa en la lengua. No tiene ningún antecedente registrado en los peldaños del linaje, de modo que un peldaño abierto bajo un versículo baja derecho al suelo de lenguas originales marcado con ≈. Ese suelo suministra el Textus Receptus para el griego, y aquí queda más lejos de la verdad que de costumbre: la comisión dejó deliberadamente atrás el Textus Receptus por un texto crítico más actualizado, de modo que el suelo bajo un versículo de esta traducción nombra un texto griego que no es el que ella realmente siguió.

