title=रिवेदुता 1927 (इतालवी) — इस संस्करण के बारे में | Common Root
description=रिवेदुता: जोवान्नी दियोदाती की इतालवी बाइबिल, जिसे वाल्डेंसियन धर्मविज्ञानी जोवान्नी लुत्सी के नेतृत्व में एक समिति ने इब्रानी और यूनानी से मिलाकर संशोधित किया, और जिसे ब्रिटिश एंड फ़ॉरेन बाइबिल सोसाइटी ने 1924 में रोम से प्रकाशित किया — और फ़ाइल पर 1927 क्यों लिखा है।
heroHeading=रिवेदुता 1927
readerHref=/reader?c1.src=riv1927

# The narrative, one paragraph per key, in order.
hero.1=जोवान्नी लुत्सी का जन्म 1856 में स्विट्ज़रलैंड के ग्राउब्युंडेन कैंटन के निचले एंगादीन में हुआ, और अगले वर्ष जब उनका परिवार लुक्का जा बसा, तो वे शिशु के रूप में वहाँ ले जाए गए। वे इतालवी बनकर बड़े हुए, फ़्लोरेंस के वाल्डेंसियन धर्मविज्ञान संकाय में पढ़े — जो इटली की पुरानी प्रोटेस्टेंट कलीसिया का विद्यालय है — और बाद में वहीं धर्मविज्ञान पढ़ाया तथा उसी नगर में पादरी रहे। अपने अंतिम वर्ष उन्होंने फिर स्विट्ज़रलैंड में, पोस्कियावो में बिताए, और 1948 में वहीं उनका देहांत हुआ।
hero.2=रिवेदुता का आरंभ 1906 में हुआ, जब ब्रिटिश एंड फ़ॉरेन बाइबिल सोसाइटी ने — जो सौ वर्ष से इतालवी पाठकों के लिए दियोदाती का सत्रहवीं सदी का अनुवाद छाप रही थी — एक समूह को उसके संशोधन का काम सौंपा और लुत्सी को उसका प्रमुख बनाया। उनकी आशा थी कि यह कैथोलिक विद्वानों के साथ मिलकर एक साझा बाइबिल बने; वैटिकन ने इनकार किया, और काम प्रोटेस्टेंट संशोधन के रूप में आगे बढ़ा। पूरी बाइबिल 1924 में रोम में छपी, और उसके मुखपृष्ठ पर उसे मूल पाठ से मिलाकर संशोधित संस्करण कहा गया — “riveduta”, यानी संशोधित, और तब से वह इसी नाम से जानी जाती है। यह नया अनुवाद नहीं है: इसके नीचे दियोदाती का पाठ है, जिसे इब्रानी और यूनानी से फिर से मिलाया गया। बीसवीं सदी के अधिकांश समय तक यह इतालवी प्रोटेस्टेंटों की बाइबिल रही, और इसकी उत्तराधिकारी, नुओवा रिवेदुता, जिनेवा बाइबिल सोसाइटी ने 1994 में प्रकाशित की। लुत्सी ने अपना एक निजी, टिप्पणियों सहित अनुवाद भी किया, बारह खंडों में, जो 1921 से फ़्लोरेंस में छपे; वह एक अलग कृति है, यह पाठ नहीं।
hero.3=संशोधन पृष्ठ पर दिखता है। पुराने नियम में ईश्वरीय नाम “l'Eterno” है, यानी शाश्वत — भजन 23 में “L'Eterno è il mio pastore” — जहाँ दियोदाती में “il Signore” है। यशायाह 7:14 में “la giovane” है, यानी युवती, जहाँ दियोदाती में “la Vergine” है। नए नियम में यह वहाँ टेक्स्टस रिसेप्टस से हटता है जहाँ बाद के समीक्षात्मक संस्करण हटते हैं: 1 यूहन्ना 5:7 में स्वर्गीय गवाह नहीं हैं, मत्ती 6:13 में प्रभु की प्रार्थना स्तुतिवचन के बिना समाप्त होती है, और प्रेरितों के काम 8:37 रखा गया है पर वर्गाकार कोष्ठकों में। भजन इब्रानी क्रमांकन का पालन करते हैं, और भजन का शीर्षक उसके पहले पद में मिला दिया गया है — भजन 23 “Salmo di Davide.” से आरंभ होता है — इसलिए भजन 51 में अंग्रेज़ी बाइबिलों की तरह 19 पद हैं। और तिथि: 1927 वह वर्ष है जो डिजिटल पाठ अपने साथ लाता है और जिसे सूची सहेजती है, इसलिए इसका पायदान चिह्न 1927 दिखाता है। रिवेदुता स्वयं 1924 में छपी थी, और यह फ़ाइल बाद की किस छपाई को दोहराती है, यह इस परियोजना ने स्थापित नहीं किया है।
hero.4=इस पाठक में यह तीन इतालवी बाइबिलों में से एक है, दियोदाती की दो प्रतियों के साथ। इतालवी अंतरफलक इस पर नहीं खुलता: इतालवी के लिए कोई चुना हुआ संस्करण नहीं है, इसलिए पाठक सूची-क्रम में पहली इतालवी बाइबिल लेता है, जो दियोदाती 1649 है। वंश-पायदानों में इसका कोई मूल अभिलिखित नहीं है — दियोदाती भी नहीं, यद्यपि रिवेदुता दियोदाती का ही संशोधन है और दियोदाती इस संग्रह में है — इसलिए किसी पद के नीचे खोला गया पायदान सीधे ≈ से चिह्नित मूल-भाषा तल पर पहुँचता है: पुराने नियम के लिए वेस्टमिंस्टर लेनिनग्राद कोडेक्स, और नए के लिए टेक्स्टस रिसेप्टस, ठीक वही यूनानी जिससे यह संशोधन दूर हटा।

