title=Biblia en Español Sencillo — Bu Baskı Hakkında | Common Root
description=Biblia en Español Sencillo: AudioBiblia.org'un 2018'den bu yana yayımladığı sade İspanyolca bir Kutsal Kitap; okunmak kadar duyulmak için de yazılmış ve herkesin kopyalayabileceği bir lisansla verilmiştir.
heroHeading=Biblia en Español Sencillo
readerHref=/reader?c1.src=bes

# The narrative, one paragraph per key, in order.
hero.1=Dört yüzyıl boyunca İspanyolca Protestan Kutsal Kitap, fiilen ardışık gözden geçirmeler hâlinde tek bir kitap oldu: Casiodoro de Reina'nın 1569 tarihli çevirisi, Cipriano de Valera'nın 1602'de gözden geçirdiği biçimiyle, ve ardından gelen uzun Reina-Valera baskıları dizisi. Biblia en Español Sencillo bunlardan biri değildir. Yeni bir çeviridir; bugünün İspanyolcasıyla ve bilerek sade yapılmış, AudioBiblia.org tarafından yayımlanmıştır — Yeni Antlaşma, Mezmurlar ve Süleyman'ın Özdeyişleri ile birlikte 2018'de, Eski Antlaşma ise Ekim 2019'da tamamlandı. Çeviri Irma Flores'e mal edilir; yayıncıları onu muhafazakâr ve evanjelik olarak niteler.
hero.2=Onu ayıran şey, nereden geldiğidir. Sesli Kutsal Kitap hizmetinin işidir ve metin ile bölüm bölüm eksiksiz bir ses kaydı, biri ötekinden okunarak değil, birlikte üretilmiştir. Açıklanan amaç ikisi için de aynıydı: anlaşılması kolay olan ve serbestçe, yasal olarak kopyalanıp paylaşılabilen bir Kutsal Kitap. Bu ikinci yarı ayrıntı değildir. Çeviri, bir yayıncının saklı hakları yerine AudioBiblia.org ile Irma Flores'i anan bir Creative Commons Atıf lisansı taşır — metnin tamamının bu derlemede durabilmesi ve içindeki herhangi bir metnin yanına ayet ayet konulabilmesi bundandır.
hero.3=Bu okuyucuda dört İspanyolca baskıdan biridir. Arayüz İspanyolcaya alındığında okuyucu yine Reina-Valera 1909'u açar; bu, geçiş yapılan bir baskıdır. Soy basamaklarında da başka türlü davranır. Derlemenin taşıdığı herhangi bir metnin gözden geçirilmesi değil, yeni bir çeviri olduğu için ona kayıtlı bir kaynak metin yoktur — böylece bir Biblia en Español Sencillo ayetinin altında açılan basamak, İngilizce zincirdeki gibi aynı kitabın daha eski bir baskısına değil, doğrudan ≈ ile imlenen özgün diller tabanına iner. Bunun yerine onu ikinci sütuna, Reina-Valera 1909'un karşısına koyun: bakmaya değer olan, iki üslup arasındaki mesafedir.

