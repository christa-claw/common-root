title=النسخة الهندية المنقَّحة — عن هذه النسخة | Common Root
description=النسخة الهندية المنقَّحة (IRV): ترجمة هندية للكتاب المقدس صدرت عام 2019 عن Bridge Connectivity Solutions، مرخَّصة بموجب CC BY-SA 4.0 — وهي النص الهندي الذي تُفتح عليه هذه المجموعة افتراضيًا.
heroHeading=النسخة الهندية المنقَّحة
readerHref=/reader?c1.src=irvhin

hero.1=النسخة الهندية المنقَّحة ترجمة حديثة للكتاب المقدس إلى الهندية، حقوق نشرها لعامي 2017 و2019 لصالح Bridge Connectivity Solutions Pvt. Ltd.، منظمة هندية لترجمة الكتاب المقدس والتقنية. وهي جزء من سلسلة أوسع بعنوان "النسخة الهندية المنقَّحة" أصدرتها نفس الجهة بالتوازي في عدة لغات هندية رئيسية أخرى — من بينها الكانّادية والتاميلية والتيلجوية والآسامية — كل منها كتاب مقدس كامل بحروفه الخاصة، صادر بالترخيص المفتوح نفسه.
hero.2=يعتمد نص Common Root على توزيعة USFM من موقع eBible.org لنسخة IRV الهندية، المصنّفة هناك تحت الرمز hin2017، بدلاً من نسخة رقمية سابقة من نفس الترجمة كانت متداولة وتتضمّن نص حواشٍ مُلصقًا داخل الآيات نفسها، وأسماء أسفار مكتوبة بالهندية بدلاً من الإنجليزية. وقد أصلح إعادة الاستيراد من مصدر USFM هاتين المشكلتين قبل إضافة هذه النسخة هنا — فهذه المجموعة تحتفظ بأسماء الأسفار بالإنجليزية داخليًا، في كل نسخها، بصرف النظر عن لغة الكتاب المقدس نفسه.
hero.3=تُكتب هنا بالأبجدية الديفاناغارية، باسم इंडियन रिवाइज़्ड वर्ज़न، وتضمّ القانون البروتستانتي المكوَّن من 66 سفرًا، دون أسفار قانونية ثانية.
hero.4=وهي الكتاب المقدس الهندي الوحيد في هذه المجموعة، فتُفتح الواجهة الهندية عليه افتراضيًا.

