title=Darby 1885 (französisch) — Über diese Ausgabe | Common Root
description=Die französische Darby-Bibel von 1885: die Übersetzung von Pau und Vevey, 1859 von John Nelson Darby und seinen Mitarbeitern begonnen und drei Jahre nach seinem Tod vollendet — und die Fassung, aus der später sein englisches Altes Testament gebaut wurde.
heroHeading=Darby 1885 (französisch)
readerHref=/reader?c1.src=dby

# The narrative, one paragraph per key, in order.
hero.1=John Nelson Darby ist für anderes in Erinnerung — er verließ die Church of Ireland, war an der Gründung der Plymouth-Brüder beteiligt und brachte den dispensationalistischen Prämillenarismus in Umlauf —, aber einen großen Teil seines Lebens übersetzte er die Bibel, und er tat es in drei Sprachen. Ungewöhnlich an ihm ist die Reihenfolge. Die meisten Übersetzer arbeiten von ihrer eigenen Sprache nach außen. Darbys englische Bibel wurde von den dreien als letzte fertig, und ihr Altes Testament entstand bei ihm nicht unmittelbar aus dem Hebräischen, sondern aus den französischen und deutschen Fassungen, die er zuvor mit anderen erarbeitet hatte.
hero.2=Dies ist die französische. Darby war der maßgebliche Gelehrte, aber bei nichts, was seinen Namen trägt, der alleinige Übersetzer; zum französischen Kreis gehörten William Joseph Lowe und Pierre Schlumberger. Das Neue Testament erschien 1859 und wurde in den folgenden zwei Jahrzehnten dreimal neu aufgelegt. Die vollständige Bibel kam 1885 in Pau und Vevey heraus — daher der Name, unter dem sie gewöhnlich läuft —, wobei das Titelblatt ein wenig in die Irre führt: Pau liegt im äußersten Süden Frankreichs, und die Arbeit geschah vor allem für die Brüderversammlungen der französischsprachigen Schweiz. Darby war 1882 gestorben und hat das fertige Buch nie gesehen.
hero.3=Die Übersetzung ist aus Grundsatz wörtlich, und Darby sagte im Vorwort zu seinem deutschen Neuen Testament klar, warum: der Gelehrte kann das Original einsehen, also besteht der Sinn einer Übersetzung darin, denen, die das nicht können, eine möglichst genaue Abbildung davon in die Hand zu geben. Er warnte auch, eine freiere Wiedergabe verliere Bedeutungen, die der Übersetzer selbst womöglich nicht bemerkt hat. Das Ergebnis ist genau und ungeschmückt und war nie zum lauten Lesen gedacht — in seiner eigenen Predigt gebrauchte Darby die King James Version.
hero.4=Zweierlei verbindet sie mit dem übrigen Korpus. Die deutsche Darby-Bibel ist die Elberfelder, hier als Elberfelder 1905 — derselbe Mann, dieselben Grundsätze, und einer der beiden Texte, aus denen sein englisches Altes Testament zusammengesetzt wurde, sodass diese französische und diese deutsche Karte enger verwandt sind, als ihre verschiedenen Sprachen vermuten lassen. Und ihr Umgang mit dem Gottesnamen stellt sie neben die American Standard Version, die tausendfach „Jehovah“ druckt, wo die King James Version „the LORD“ druckt; Darby hat dieselbe Entscheidung zuerst getroffen, in drei Sprachen. Im Leser ist sie die einzige französische Bibel, sodass eine französische Oberfläche auf ihr öffnet. In den Abstammungssprossen ist für sie keine Vorlage verzeichnet, und anders als die meisten datierten Ausgaben hier trägt ihr Sprossen-Chip überhaupt kein Jahr — die Katalogkarte zeigt 1885, aber die Sprossenjahre sind eine eigene, von Hand gepflegte Liste, und diese Ausgabe steht noch nicht darauf.

