hero.1=पर्ल ऑफ़ ग्रेट प्राइस की शुरुआत धर्मग्रंथ के रूप में नहीं, बल्कि एक मिशन पुस्तिका के रूप में हुई। 1851 में चर्च के यूरोपीय मिशन के तत्कालीन अध्यक्ष फ़्रैंकलिन डी. रिचर्ड्स ने लिवरपूल, इंग्लैंड में इसे संकलित किया। उन्होंने जोसेफ़ स्मिथ के वे लेख इकट्ठे किए जो चर्च के आरंभिक समाचार-पत्रों में छपे थे या केवल थोड़ी प्रतियों में प्रचलित थे, ताकि ब्रिटेन के सदस्यों को वे एक ही जगह मिल सकें। इसका नाम मत्ती 13:45–46 के दृष्टांत से लिया गया है, जिसमें एक व्यापारी अपना सब कुछ बेचकर एक बहुमूल्य मोती ख़रीदता है।
hero.2=ओर्सन प्रैट द्वारा संपादित और पुनर्व्यवस्थित दूसरा संस्करण 1878 में सॉल्ट लेक सिटी में प्रकाशित हुआ, और 10 अक्टूबर 1880 को चर्च के एक महासम्मेलन ने मतदान द्वारा इसे धर्मग्रंथ के रूप में स्वीकार किया। 1902 के संशोधन ने, जिसे मुख्य रूप से जेम्स ई. टालमेज ने तैयार किया, पाठ को अध्यायों और पदों में बाँटा और वे प्रकटीकरण हटा दिए जो डॉक्ट्रिन एंड कॉवनंट्स में भी थे; 1921 के संस्करण में इसे दो स्तंभों में छापा गया। 1976 में दो और प्रकटीकरण जोड़े गए — सिलेस्टियल राज्य का दर्शन और मृतकों के उद्धार के विषय में जोसेफ़ एफ़. स्मिथ का दर्शन — और 1979 में चर्च ने उन्हें डॉक्ट्रिन एंड कॉवनंट्स में स्थानांतरित कर दिया, जिसके 1981 के संस्करण में वे खंड 137 और 138 के रूप में छपे हैं।
hero.3=वर्तमान संस्करण में पाँच भाग हैं। "मूसा की पुस्तक से चयन" और "जोसेफ़ स्मिथ — मत्ती" जोसेफ़ स्मिथ द्वारा 1830 में आरंभ किए गए किंग जेम्स बाइबिल के संशोधन के अंश हैं: पहला उत्पत्ति के आरंभिक अध्यायों का विस्तारित वर्णन है, जो मूसा को दिए गए दर्शनों के ढाँचे में रखा गया है; दूसरा मत्ती 23:39 और अध्याय 24 का पुनर्लेखन है। "इब्राहीम की पुस्तक" वह पाठ है जिसके बारे में स्मिथ ने कहा कि उन्होंने उसे 1835 में कर्टलैंड, ओहायो में प्राप्त मिस्री पपीरस से अनुवादित किया; यह 1842 में नावू, इलिनॉय के Times and Seasons में तीन चित्रों के साथ प्रकाशित हुई, जिन्हें आज प्रतिकृति 1, 2 और 3 कहा जाता है। "जोसेफ़ स्मिथ — इतिहास" उनके आरंभिक जीवन और दर्शनों के उस वृत्तांत से लिया गया है जो उन्होंने 1838 में तैयार किया था, और "विश्वास के अनुच्छेद" शिकागो के समाचार-पत्र संपादक जॉन वेंटवर्थ को 1842 में लिखे गए एक पत्र से लिए गए तेरह विश्वास-कथन हैं।
hero.4="इब्राहीम की पुस्तक" वह भाग है जिस पर सबसे अधिक प्रश्न उठाए गए हैं। लंबे समय तक माना जाता रहा कि अधिकांश पपीरस नष्ट हो गए, संभवतः 1871 की शिकागो की आग में, परंतु जो दस टुकड़े कभी जोसेफ़ स्मिथ के पास थे, वे न्यूयॉर्क के मेट्रोपॉलिटन म्यूज़ियम ऑफ़ आर्ट में मिले, जिसने 1967 में उन्हें चर्च को सौंप दिया। विद्वान इन टुकड़ों को सामान्य मिस्री अंत्येष्टि ग्रंथों के अंश मानते हैं, जो ईसा पूर्व तीसरी शताब्दी और ईसवी पहली शताब्दी के बीच लिखे गए, और स्वयं चर्च द्वारा इस पुस्तक पर प्रकाशित लेख स्वीकार करता है कि उन पर अंकित कोई भी चिह्न न इब्राहीम का नाम लेता है और न ही पुस्तक में वर्णित किसी घटना का उल्लेख करता है।
hero.5=बाइबिल, मॉरमन की पुस्तक और डॉक्ट्रिन एंड कॉवनंट्स के साथ यह द चर्च ऑफ़ जीसस क्राइस्ट ऑफ़ लैटर-डे सेंट्स की चार मानक रचनाओं में से एक है; जोसेफ़ स्मिथ के आंदोलन से निकला दूसरा बड़ा चर्च, Community of Christ, इसे अपने धर्मग्रंथों में नहीं गिनता। इस संग्रह में पाठ Mormon Documentation Project के सार्वजनिक क्षेत्र वाले JSON निर्यात से लिया गया है, वही स्रोत जो यहाँ मॉरमन की पुस्तक और डॉक्ट्रिन एंड कॉवनंट्स का है, और यह पाँचों भागों को पाँच पुस्तकों के रूप में रखता है: मूसा आठ अध्यायों में, इब्राहीम पाँच में, और अंतिम तीन एक-एक अध्याय में। तीनों प्रतिकृतियाँ और उनके साथ छपी व्याख्याएँ पद-पाठ नहीं हैं, इसलिए वे शामिल नहीं हैं। अपनी दोनों सहचर रचनाओं की तरह यह किसी एक ऐतिहासिक छपाई के बजाय वर्तमान मानक संस्करण के शब्दों का अनुसरण करता है, इसीलिए यहाँ कोई प्रकाशन वर्ष नहीं दिया गया है।

