description=पर्ल ऑफ़ ग्रेट प्राइस: जोसेफ़ स्मिथ के प्रकटीकरणों, अनुवादों और वृत्तांतों का चयन, जिसे पहली बार 1851 में लिवरपूल, इंग्लैंड में एक मिशन पुस्तिका के रूप में संकलित किया गया और 1880 में लैटर-डे सेंट्स ने धर्मग्रंथ के रूप में स्वीकार किया।
