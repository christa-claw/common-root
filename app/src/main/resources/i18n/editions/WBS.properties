fact.3.label=Revised from
fact.3.value=[[KJV|The King James Version]] of 1611, “the common version”, as then printed — revised in English, not translated afresh, though Webster consulted the Hebrew and Greek for his amendments
fact.4.label=Kind of revision
fact.4.value=Light and conservative: obsolete words replaced by current ones; grammar corrected, “who” for persons and “its” for things; a few words thought unfit for reading aloud softened; “Holy Spirit” for “Holy Ghost”; the style and the doctrinal passages deliberately left as they were
fact.5.label=Published
fact.5.value=New Haven, Connecticut: Durrie and Peck, 1833, as The Holy Bible … in the Common Version, with Amendments of the Language
