title=Webster's Bible — About This Edition | Common Root
description=Noah Webster's 1833 revision of the King James Version, published at New Haven, Connecticut — the common English Bible kept almost word for word, with obsolete words replaced, its grammar corrected and a few expressions softened for reading aloud.
heroHeading=Webster's Bible
readerHref=/reader?c1.src=wbs

# The narrative, one paragraph per key, in order.
hero.1=Noah Webster (1758–1843), the New Haven lexicographer, is remembered above all for An American Dictionary of the English Language of 1828. Five years later he turned the same concern for clear, correct, current English on the Bible his country actually read. In 1833 Durrie and Peck of New Haven published The Holy Bible … in the Common Version, with Amendments of the Language, its preface signed in September of that year. It is not a new translation. Webster took the King James Version of 1611 — “the common version” — as it was then printed, and changed it only where its English had become obscure or ungrammatical. He wrote that he had consulted the original languages in making his amendments, but that the general style of the version ought not to be altered, and that he had not knowingly changed any passage on which a denomination rested its doctrine.
hero.2=His preface names three kinds of change. Words wholly out of use gave way to words in good use: Joseph's master “knoweth not” what is in the house (Genesis 39:8) where the King James has “wotteth not”, and at Acts 12:4 Herod means to bring Peter out “after the passover”, not “after Easter”. Grammar was brought into line with the usage of Webster's day: “who” for “which” when it refers to persons, so that the Lord's Prayer opens “Our Father who art in heaven”, and “its” for “his” when it refers to things, so that the plants of Genesis 1 bear seed “after its kind”. And a small number of words he judged unfit to be read aloud before a mixed audience were replaced by gentler ones. He also wrote “Holy Spirit” where the King James has “Holy Ghost”, and our copy has no “Holy Ghost” at all. Beyond this the revision is light: most readers could go chapter after chapter without noticing that they had left the King James text.
hero.3=Our copy is complete: 66 books, Genesis to Revelation, without the Apocrypha, in the English chapter and verse numbering — 150 Psalms, each psalm's title run into its first verse, and Malachi ending at chapter 4. Following the King James, it keeps the Received-Text passages that later critical editions question: the longer ending of Mark, Acts 8:37, and the three witnesses in heaven at 1 John 5:7. In this reader it stands on its own. Although it is a revision of the King James Version, which is also in this corpus, the corpus records no parent for it, so a lineage rung opened beneath one of its verses goes straight to the original-language floor marked ≈ — the Westminster Leningrad Codex in the Old Testament and the Textus Receptus in the New — rather than to the English text Webster actually worked from. Nothing is recorded as standing on it either. No interface language opens on this edition; an English interface opens on the New International Version, and this one is reached from its own card in the translation grid. Set beside the King James in a second column, it shows Webster's amendments verse by verse.

