# The narrative, one paragraph per key, in order.
hero.1=Palabra de Dios para Ti — « la Parole de Dieu pour toi » — est une traduction espagnole neuve, publiée en 2020 par l'Asociación Bíblica Latinoamericana ; un texte électronique a paru en 2022 par l'intermédiaire de la Latinamerican Textual Bible Foundation, Inc., association à but non lucratif enregistrée en Floride qui la diffuse sur eBible.org et YouVersion. Elle est attribuée aux traducteurs Francisco Liévano et Joyce Liévano. À la différence de la lignée Reina-Valera, sur laquelle s'ouvre par défaut l'interface espagnole de ce corpus, ce n'est pas une révision de la traduction de Casiodoro de Reina du seizième siècle ni de rien qui en descende ; c'est une traduction indépendante, faite directement à partir des langues sources, destinée aux lecteurs ordinaires de toute l'Amérique hispanophone et conçue pour être citée librement, sans demander la permission.
hero.2=L'Ancien Testament suit la Biblia Hebraica Stuttgartensia et le Nouveau Testament la 27e édition du Novum Testamentum Graece d'Eberhard Nestle. Un choix distingue ses pages de la plupart des Bibles espagnoles postérieures à Reina : là où celles-ci rendent le Tétragramme par « Jehová » ou le remplacent par « Señor », Palabra de Dios para Ti conserve les noms hébreux eux-mêmes, translittérés — Yavé, ʼElohim, ʼEL-Shadday —, de sorte que la Genèse s'ouvre, dans les propres mots de cette édition, sur « En un principio ʼElohim creó los cielos y la tierra ».
hero.3=Dans ce lecteur, elle est l'une des quatre éditions espagnoles, aux côtés de [[RVR09|Reina-Valera 1909]], [[BES|Biblia en Español Sencillo]] et [[VBL|Versión Biblia Libre]]. L'interface ouvre toujours par défaut la Reina-Valera 1909 ; celle-ci est une édition que l'on atteint depuis sa propre fiche. Comme les deux autres, c'est une traduction neuve et non la révision de quoi que ce soit d'autre que le corpus contienne, de sorte qu'aucun texte source ne lui est enregistré dans les échelons de filiation — un échelon ouvert sous l'un de ses versets tombe directement sur le sol des langues originales marqué d'un ≈. L'Asociación Bíblica Latinoamericana publie aussi une édition imprimée plus complète comportant les livres deutérocanoniques ; le texte que détient ce corpus est le canon protestant habituel de soixante-six livres.

