title=Palabra de Dios para Ti — À propos de cette édition | Common Root
description=Palabra de Dios para Ti : une traduction espagnole publiée en 2020 par l'Asociación Bíblica Latinoamericana, qui conserve translittérés les noms hébreux de Dieu et qui est librement concédée sous licence pour tout usage.
