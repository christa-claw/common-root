# The narrative, one paragraph per key, in order.
hero.1=עבדאללה יוסוף עלי (1872-1953) נולד בבומביי והתחנך לראשונה בוילסון קולג' שבה, שם חינוך דתי לצד הלימודים הפורמליים גרם לו לשנן את הקוראן כנער. תואר ראשון מהמעלה הראשונה בספרות אנגלית מאוניברסיטת בומביי ב-1891 הקנה לו מילגת פרזידנסי לבריטניה, שם למד משפטים בסנט ג'ונס קולג' בקיימברידג', קיבל תואר ראשון ותואר במשפטים ב-1895, ושב באותה שנה להודו עם משרה בשירות האזרחי ההודי.
hero.2=הוא בילה כשני עשורים בשירות האזרחי — כשופט שלום ופקיד מסים, לאחר מכן כשופט, ולבסוף כסגן מזכיר במחלקת הכספים של ממשלת הודו — לפני שהתפטר ב-1914 והשתקע בבריטניה. שם הפך לנאמן מסגד שאה ג'יהאן בוווקינג ושל קרן מסגד מזרח לונדון, הוסמך ל-CBE ב-1917 בעבור עבודתו בזמן המלחמה, והרצה בהינדוסטאנית ב-School of Oriental Studies. הוא חזר להודו בשנות ה-1920 וה-1930 כמנהל Islamia College בלאהור, ובמהלך השנים הללו, אחרי יותר מעשור של עבודה, כתב את הקוראן באנגלית עם הערותיו המבארות שלו.
hero.3=התרגום פורסם בשלושים חלקים סידרתיים בין 1934 ל-1937, הראשון ב-4 באפריל 1934, תחת הכותרת "The Holy Qur'an: Text, Translation and Commentary", בהוצאת שייח' מוחמד אשרף מלאהור; מהדורת כרך אחד מאוחדת באה בעקבותיה ב-1938, ומהדורה מתוקנת ב-1939-1940. לצד תרגום פיקת'ול, הוא הפך לאחד משני תרגומי הקוראן האנגליים הנקראים ביותר במאה העשרים, ידוע מעל לכול בהיקף הערות השוליים שלו, ומאז הוא יצא לאור מחדש, ובמקומות עובד מחדש בידיים אחרות, בכשלושים הדפסות נוספות — ובהן מהדורה שהפיצה Amana Publications בצפון אמריקה מ-1977 ותיקון בחסות סעודית בשנות ה-1980.
hero.4=מה שעבר דיגיטציה כאן, באמצעות alquran.cloud, הוא טקסט התרגום עצמו ולא פירושו המלווה של יוסוף עלי, והוא מוצע באוסף הזה כתרגום אנגלי שני המלווה את [[Q-AR|הטקסט הערבי העות'מאני]], לצד [[Q-EN|תרגום פיקת'ול]] משנת 1930. הוא היה אחד משני תרגומים אנגליים בלבד שסקירת התרגומים הזמינים מצאה נחלת הכלל בבירור — זה ותרגום פיקת'ול — אם כי "בבירור" דורש כאן הסתייגות: היצירה היא נחלת הכלל באיחוד האירופי ובפקיסטן, שבה נפטר יוסוף עלי ושבה היצירה פורסמה לראשונה, אך זכות יוצרים פרו-פורמה שנרשמה בארצות הברית ב-1996 נחשבת תקפה שם עד 2033.

