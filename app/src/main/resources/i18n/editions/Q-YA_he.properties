title=קוראן — יוסוף עלי — על המהדורה הזאת | Common Root
description=התרגום של עבדאללה יוסוף עלי, שפורסם בארבעה כרכים בין 1934 ל-1937 על ידי פקיד הודי שהפך לחכם איסלאם — אחד משני תרגומי קוראן אנגליים בלבד שנמצאו נחלת הכלל בבירור, ובאוסף הזה תרגום אנגלי שני המלווה את תרגום פיקת'ול.
