title=Bible in Basic English — عن هذه الطبعة | Common Root
description=Bible in Basic English (الكتاب المقدس بالإنجليزية الأساسية)، ترجمتها من العبرية واليونانية لجنةٌ برئاسة س. هـ. هوك، ونشرتها Cambridge University Press — العهد الجديد سنة 1941، والكتاب المقدس كله سنة 1949 — بالإنجليزية الأساسية التي وضعها س. ك. أوغدن في 850 كلمة، مع 150 كلمة أخرى أُضيفت للشعر وللكتاب المقدس.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=الإنجليزية الأساسية (Basic English) من وضع س. ك. أوغدن من Orthological Institute: قائمة من 850 كلمة إنجليزية اقتُرحت لغةً دولية مساعدة. وقد أعدّت Bible in Basic English لجنةٌ بإدارة س. هـ. هوك (1874–1968)، عالم العهد القديم الذي صار سنة 1930 أستاذ كرسي صموئيل دافيدسون لدراسات العهد القديم في جامعة لندن، بالتعاون مع Orthological Institute. وقد تُرجمت من العبرية واليونانية، ولم تُبسَّط من ترجمة إنجليزية سابقة، ثم راجعت النصَّ الأساسي بالتفصيل لجنةٌ شكّلها أمناء Cambridge University Press. وإلى كلمات أوغدن الـ850 أضاف المترجمون 100 كلمة تُعين على الشعر و50 كلمة يحتاج إليها الكتاب المقدس، أي 150 كلمة في المجموع. ونشرت Cambridge University Press العهد الجديد سنة 1941 والكتاب المقدس كله سنة 1949؛ ووُزِّعت طبعةٌ من سنة 1965 في الولايات المتحدة من غير إشعار بحقوق النشر، ولهذا فالنص هناك ملك عام.
hero.2=والنتيجة تُقرأ ببساطة واطّراد، ضمن تلك المفردات القليلة. يبدأ سفر التكوين بـ«At the first God made the heaven and the earth.» ويبدأ المزمور 23 بـ«The Lord takes care of me as his sheep; I will not be without any good thing.» ويُفتتح إنجيل يوحنا بـ«From the first he was the Word, and the Word was in relation with God and was God,» ونصّ يوحنا 3:16 هو «For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.» والاسم الإلهي هو «the Lord» في النص كله، إلا في ثماني آيات جاء فيها «Yahweh»، منها الخروج 6:3، حيث يقول الله إن إبراهيم وإسحاق ويعقوب «had no knowledge of my name Yahweh»، والمزمور 83:18. وحيث كانت العبرية أشدّ غموضًا من أن تُترجم، وضع المترجمون نقاطًا مكانها، وفي نسختنا بضع آيات، منها أيوب 34:29–33 وأيوب 36:16–20، ليس فيها إلا «...».
hero.3=تضمّ نسختنا 66 سفرًا من التكوين إلى الرؤيا، من غير الأسفار القانونية الثانية، بترقيم الأصحاحات والآيات في King James وRevised Version — 150 مزمورًا، وملاخي ينتهي عند الأصحاح 4. وليس فيها عناوين للمزامير: يبدأ المزمور 51 بـ«Have pity on me, O God». والعهد الجديد ليس ترجمةً للنص المتلقّى. فست عشرة آية تحذفها الطبعات النقدية، منها متى 17:21 وأعمال الرسل 8:37 ورومية 16:24، محفوظة هنا مواضعَ فارغة فقط موسومة بـ[]، وليس في 1 يوحنا 5:7 الشهود الثلاثة في السماء؛ وقصة المرأة التي أُمسكت في زنى، يوحنا 7:53–8:11، موضوعة بين قوسين معقوفين، في حين أن الخاتمة الطويلة لإنجيل مرقس محفوظة. وهي في هذا القارئ قائمة بذاتها. لا تسجّل المجموعة لها أصلًا، ولذا فإن درجة نسب تُفتح تحت إحدى آياتها تسقط مباشرة إلى أرضية اللغات الأصلية الموسومة بـ≈: مخطوطة لينينغراد في العهد القديم، وTextus Receptus في العهد الجديد، وهو نص يوناني لا تتبعه هذه الترجمة في تلك المواضع الست عشرة. ولا شيء مسجَّل أيضًا على أنه قائم عليها. ولا تُفتح على هذه الطبعة أي لغة من لغات الواجهة؛ فالواجهة الإنجليزية تُفتح على New International Version، ويُوصل إلى هذه الطبعة من بطاقتها الخاصة في شبكة الترجمات.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=اللغة
fact.1.value=الإنجليزية — الإنجليزية الأساسية، المفردات المبسَّطة التي وضعها س. ك. أوغدن
fact.2.label=المترجمون
fact.2.value=لجنة بإدارة س. هـ. هوك (1874–1968)، أستاذ كرسي صموئيل دافيدسون لدراسات العهد القديم في جامعة لندن، بالتعاون مع Orthological Institute؛ وراجعت النصَّ الأساسي لجنةٌ من أمناء Cambridge University Press
fact.3.label=مترجمة عن
fact.3.value=العبرية واليونانية — ترجمة جديدة، لا مراجعة لكتاب مقدس إنجليزي سابق، وإن كانت أصحاحاتها وآياتها مرقّمة كما في [[KJV|ترجمة الملك جيمس]] و[[RV|الترجمة المنقَّحة]]
fact.4.label=المفردات
fact.4.value=كلمات أوغدن الأساسية الـ850، ومعها 100 كلمة تُعين على الشعر و50 كلمة يحتاج إليها الكتاب المقدس — 150 كلمة مضافة في المجموع
fact.5.label=نُشرت
fact.5.value=Cambridge University Press: العهد الجديد، 1941؛ الكتاب المقدس كله، 1949؛ وطبعة من سنة 1965 وُزِّعت في الولايات المتحدة من غير إشعار بحقوق النشر
fact.6.label=الترخيص
fact.6.value=ملك عام؛ وهذه النسخة من eBible.org
fact.7.label=في هذه المجموعة
fact.7.value=66 سفرًا، القانون البروتستانتي كاملًا، من غير الأسفار القانونية الثانية؛ بترقيم الأصحاحات والآيات الإنجليزي، فعدد المزامير 150؛ من غير عناوين للمزامير؛ وست عشرة آية من العهد الجديد تحذفها الطبعات النقدية محفوظة مواضعَ فارغة فقط موسومة بـ[]
fact.8.label=النسب
fact.8.value=لا أصل مسجَّل، ولا شيء مسجَّل على أنه قائم عليها — تُفتح الدرجة مباشرة على أرضية اللغات الأصلية، [[WLC|مخطوطة لينينغراد]] في العهد القديم و[[TR|النص المتلقّى]] في العهد الجديد، وهو نص يوناني لا تتبعه هذه الترجمة
