title=Bible in Basic English — Om denna utgåva | Common Root
description=Bible in Basic English, översatt från hebreiskan och grekiskan av en kommitté under S. H. Hooke och utgiven av Cambridge University Press — Nya testamentet 1941, hela Bibeln 1949 — på C. K. Ogdens Basic English med 850 ord, utökat med 150 ord för poesin och för Bibeln.
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=Basic English utarbetades av C. K. Ogden vid Orthological Institute: en lista med 850 engelska ord, framlagd som ett internationellt hjälpspråk. Bible in Basic English gjordes av en kommitté under ledning av S. H. Hooke (1874–1968), den gammaltestamentliga forskare som 1930 blev Samuel Davidson-professor i gammaltestamentliga studier vid Londons universitet, i samarbete med Orthological Institute. Den översattes från hebreiskan och grekiskan, inte förenklad från någon tidigare engelsk översättning, och därefter gicks Basic-texten igenom i detalj av en kommitté som tillsattes av Cambridge University Press styrelse. Till Ogdens 850 ord lade översättarna 100 ord som hjälper med poesin och 50 som behövdes för Bibeln, 150 sammanlagt. Cambridge University Press gav ut Nya testamentet 1941 och hela Bibeln 1949; en tryckning från 1965 spreds i USA utan copyrightnotis, och därför är texten fri att använda där.
hero.2=Resultatet läses enkelt och jämnt, inom det lilla ordförrådet. Första Moseboken börjar ”At the first God made the heaven and the earth.” Psaltaren 23 börjar ”The Lord takes care of me as his sheep; I will not be without any good thing.” Johannesevangeliet börjar ”From the first he was the Word, and the Word was in relation with God and was God,” och Johannes 3:16 lyder ”For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.” Gudsnamnet är genomgående ”the Lord”, utom i åtta verser där det återges som ”Yahweh”, bland dem Andra Moseboken 6:3, där Gud säger att Abraham, Isak och Jakob ”had no knowledge of my name Yahweh”, och Psaltaren 83:18. Där hebreiskan var för osäker för att översättas satte översättarna punkter i dess ställe, och i vår kopia består några verser, bland dem Job 34:29–33 och Job 36:16–20, av ingenting annat än ”...”.
hero.3=Vår kopia rymmer 66 böcker, från Första Moseboken till Uppenbarelseboken, utan apokryferna, i King James- och Revised Versions kapitel- och versindelning — 150 psalmer, och Malaki som slutar med kapitel 4. Den har inga psalmöverskrifter: Psaltaren 51 börjar vid ”Have pity on me, O God”. Nya testamentet är ingen översättning av den mottagna texten. Sexton verser som de textkritiska utgåvorna utelämnar, bland dem Matteus 17:21, Apostlagärningarna 8:37 och Romarbrevet 16:24, finns här bara som tomma platser märkta [], och Första Johannesbrevet 5:7 har inga tre vittnen i himlen; berättelsen om kvinnan som greps för äktenskapsbrott, Johannes 7:53–8:11, står inom hakparentes, medan Markus längre slut är kvar. I denna läsare står den för sig själv. Korpuset har ingen förlaga noterad för den, så en härstamningens stegpinne öppnad under en av dess verser faller rakt ned på grundspråksgolvet märkt med ≈: Leningradkodexen i Gamla testamentet och Textus Receptus i Nya, en grekisk text som denna översättning inte följer på de sexton ställena. Ingenting är heller noterat som stående på den. Inget gränssnittsspråk öppnar på denna utgåva; ett engelskt gränssnitt öppnar på New International Version, och denna nås från sitt eget kort i översättningsrutnätet.

