title=Sunan an-Nasa'i — Su questa edizione | Common Root
description=Sunan an-Nasa'i: la raccolta di hadith che Ahmad ibn Shu'ayb al-Nasa'i trasse dalla sua opera più vasta, il Sunan al-Kubra, segnalata da Ibn Hajar come quella dei Sei Libri con il minor numero di hadith debili dopo i due Sahih.
heroHeading=Sunan an-Nasa'i
readerHref=/reader?c1.src=nas-ar&c1.companion=1

# The narrative, one paragraph per key, in order.
hero.1=Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali al-Nasa'i nacque verso l'anno 214–215 dell'Egira (829–830 d.C.) a Nasa, una città del Khorasan che oggi si trova in Turkmenistan. Cominciò a viaggiare in cerca di hadith verso i quindici anni, studiando prima con Qutaybah ibn Sa'id — presso il quale rimase a Baghlan oltre un anno — e continuando poi attraverso l'Iraq, l'Hijaz, la Siria e l'Egitto, dove studiò con studiosi come Ishaq ibn Rahwayh e Abu Dawud al-Sijistani, compilatore del [[ABD|Sunan Abi Dawud]]. Si stabilì in Egitto, dove insegnò e divenne noto come Hafiz al-Hadith; i biografi successivi non sono d'accordo sul fatto che abbia studiato davvero direttamente con Muhammad al-Bukhari, poiché al-Mizzi sosteneva che i due non si incontrarono mai. Viaggiando dal Cairo verso la Mecca negli ultimi anni di vita, si fermò a Damasco, dove, secondo il racconto tradizionale, un discorso che tenne sulle virtù dei compagni del Profeta suscitò una folla ostile nel clima antialide della città; morì poco dopo, nell'anno 303 dell'Egira (915 d.C.), per le ferite ricevute in quell'occasione. I racconti divergono sul luogo della sua sepoltura — tra Safa e Marwa, alla Mecca, secondo una tradizione, oppure a Ramla, in Palestina, secondo un'altra.
hero.2=Delle circa quindici opere a lui attribuite, sei riguardano gli hadith. La più ampia, il Sunan al-Kubra, egli stesso la ridusse più tardi in una selezione più breve nota come Sunan al-Sughra ("il Sunan minore") o al-Mujtaba ("il prescelto") — l'opera indicata oggi con il semplice titolo Sunan an-Nasa'i. Chi esattamente abbia compiuto questa selezione, e su richiesta di chi, non è registrato nelle fonti consultate per questa pagina. In essa al-Nasa'i organizzò gli hadith per argomento giuridico, come fecero [[ABD|Abu Dawud]] e [[TIR|at-Tirmidhi]]. Il giurista Ibn Hajar al-Asqalani lo distinse più tardi come quello che, dopo i due Sahih, contiene il minor numero di hadith debili (da'if) e di trasmettitori poco attendibili fra i Sei Libri, e nessun hadith fabbricato (mawdu') in assoluto.
hero.3=La tradizione sunnita colloca il Sunan an-Nasa'i tra i Sei Libri (Kutub al-Sitta), insieme al [[BUK|Sahih al-Bukhari]], al [[MUS|Sahih Muslim]], al [[ABD|Sunan Abi Dawud]] e al [[TIR|Jami` at-Tirmidhi]], più un sesto libro conteso tra il Sunan Ibn Majah e altri candidati. Dove esattamente si collochi tra le quattro raccolte di Sunan è discusso piuttosto che risolto: alcune fonti lo definiscono il terzo per autorità dei sei, subito dopo i due Sahih, mentre le pagine di questo corpus dedicate al [[ABD|Sunan Abi Dawud]] e al [[TIR|Jami` at-Tirmidhi]] riflettono l'ordine più comune, che pone al terzo posto il libro di Abu Dawud. Il numero di hadith attribuito ad esso varia in modo analogo: 5.758, ripetizioni incluse, secondo una cifra ampiamente citata per l'al-Mujtaba, contro 5.765 nell'edizione da cui questo corpus è tratto — le fonti non riconciliano queste due cifre.
hero.4=Il testo arabo qui presente è il matn classico, di pubblico dominio. Sotto di esso, nel lettore, compare una traduzione inglese, tratta dall'edizione eng-nasai di fawazahmed0/hadith-api e allineata hadith per hadith all'arabo, cosicché i due possano leggersi in coppia — la stessa disposizione di accompagnamento che questo corpus usa per il [[BUK|Sahih al-Bukhari]], il [[MUS|Sahih Muslim]], il [[ABD|Sunan Abi Dawud]], il [[TIR|Jami` at-Tirmidhi]] e le sue traduzioni del Corano. Da quale traduzione inglese pubblicata discenda davvero questo file non è stato stabilito da parte di questo corpus, motivo per cui la sua licenza è segnata come in verifica e non semplicemente come di pubblico dominio; l'arabo sopra di essa non porta la stessa incertezza.

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=Lingua
fact.1.value=arabo classico, con una traduzione inglese sotto ogni hadith nel lettore
fact.2.label=Compilatore
fact.2.value=Abu Abd al-Rahman Ahmad ibn Shu'ayb al-Nasa'i (215–303 dell'Egira / 830–915 d.C.)
fact.3.label=Titolo
fact.3.value=noto come Sunan an-Nasa'i, Sunan al-Sughra ("il Sunan minore") o al-Mujtaba ("il prescelto") — una selezione successiva tratta dall'opera più vasta di al-Nasa'i, il Sunan al-Kubra
fact.4.label=Compilato
fact.4.value=raccolto durante viaggi attraverso l'Iraq, l'Hijaz, la Siria e l'Egitto, iniziati verso i quindici anni; al-Nasa'i si stabilì in Egitto e morì a Damasco nell'anno 303 dell'Egira (915 d.C.)
fact.5.label=Metodo
fact.5.value=organizzato per argomento giuridico, come il [[ABD|Sunan Abi Dawud]] e il [[TIR|Jami` at-Tirmidhi]]; ridotto dal più vasto Sunan al-Kubra di al-Nasa'i mediante un processo che le fonti qui consultate non registrano
fact.6.label=Posizione
fact.6.value=contato tra i Sei Libri dell'islam sunnita (Kutub al-Sitta); alcune fonti lo collocano al terzo posto, dopo il [[BUK|Sahih al-Bukhari]] e il [[MUS|Sahih Muslim]], mentre le pagine di questo corpus sul [[ABD|Sunan Abi Dawud]] e il [[TIR|Jami` at-Tirmidhi]] riflettono l'ordine più comune che pone al terzo posto il libro di Abu Dawud — la posizione esatta è discussa piuttosto che risolta
fact.7.label=Numero di hadith
fact.7.value=5.758, ripetizioni incluse, secondo una cifra ampiamente citata per l'al-Mujtaba; l'edizione fonte di questo corpus ne numera 5.765 — le fonti non riconciliano queste due cifre
fact.8.label=In questo corpus
fact.8.value=52 libri e 5.765 hadith numerati
fact.9.label=Traduzione inglese
fact.9.value=tratta dall'edizione eng-nasai di fawazahmed0/hadith-api, mostrata come accompagnamento sotto l'arabo; da quale traduzione pubblicata discenda non è ancora stato stabilito da parte di questo corpus
fact.10.label=Licenza
fact.10.value=il matn arabo è il testo classico di pubblico dominio; la licenza della traduzione inglese è ancora in verifica
