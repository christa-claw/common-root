title=Baibal Olcim — על המהדורה הזו | Common Root
description=Baibal Olcim: המקרא בשפת מאטו צ'ין, שפת מיעוט במדינת צ'ין שבמיאנמר, מופץ על ידי eBible.org כטקסט שהוא נחלת הכלל של ממש, שמתרגמו ותאריך תרגומו אינם ידועים.
heroHeading=Baibal Olcim
readerHref=/reader?c1.src=olcim

hero.1=מאטו צ'ין — המכונה גם מאטופי צ'ין — היא שפה סינית-טיבטית המדוברת בפי כ-34,000 בני אדם, המרוכזים סביב מאטופי שבדרום מדינת צ'ין שבמיאנמר, עם קהילות קרובות מעבר לגבול, במדינת מיזוראם שבהודו. Baibal Olcim הוא המקרא בשפה זו, והוא הטקסט היחיד בשפת מאטו צ'ין באוסף זה.
hero.2=מה שהרישום אינו נותן הוא מי תרגם אותו, ומתי. אתר eBible.org, המפיץ את הטקסט, מציין רק שהוא נחלת הכלל, וממיין אותו תחת hlt, קוד ה-ISO 639-3 של מאטו צ'ין — בלי מתרגם, בלי ועדה, בלי תאריך תרגום. עמוד זה משאיר את שניהם ריקים במקום לנחש. לאותו קוד יש כאן היסטוריה קטנה משלו: ניסיון קודם להוסיף לאוסף זה מקרא שני בהינדי תויק בטעות תחת hlt בשל ראשי תיבות דומים, עד שהופעת פסוקים במאטו צ'ין במקום שבו ציפו להינדי חשפה את הטעות. המהדורה הזו היא זו שאכן נבדקה מול השפה שהקוד שלה נוקב בה.
hero.3=היא נוספה בשל מה שהיא, לא בשל אורכה: מקרא שהוא נחלת הכלל של ממש, לא רק מורשה, בשפתו של מיעוט נוצרי שסבל רדיפה ממשית בעיצומו של הסכסוך האזרחי במיאנמר, המרוכז במדינת צ'ין ובסביבתה. קורא שנבנה כך שלא ידרוש דבר ממי שמשתמשים בו, ולא יעקוב אחר אף אחד מהם, נועד בדיוק למקרה כזה — וזו גם רוב הסיבה לכך שלעמוד הזה כה מעט נתונים נוספים להציג.

