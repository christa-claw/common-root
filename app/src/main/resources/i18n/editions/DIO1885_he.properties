title=דיודאטי 1885 (איטלקית) — על מהדורה זו | Common Root
description=הביבליה האיטלקית של ג'ובאני דיודאטי בצורה מן המאה התשע־עשרה: הטקסט שלו מ־1641 בתיקון של 1821, במהדורה הנושאת את התאריך 1885 — אותו תרגום כמו דיודאטי האחר באוסף זה, מחולק לפסוקים בדרך אחרת.
heroHeading=דיודאטי 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=זהו תרגומו של ג'ובאני דיודאטי — הז'נבאי בן המשפחה מלוקה, שנולד ב־1576, הוציא ב־1607 את הביבליה האיטלקית הראשונה שתורגמה מן העברית והיוונית ולא מן הלטינית, ותיקן אותה בהערות משלו ב־1641, שמונה שנים לפני מותו. לדיודאטי האחר באוסף זה יש דף משלו המספר את הסיפור הזה. במשך מאתיים שנה אחריו חי הטקסט בזכות הדפסות חוזרות, ומ־1808 הוציאה אותו חברת התנ״ך הבריטית והזרה מהדורה אחר מהדורה, כי לפרוטסטנטים האיטלקים לא היה דבר אחר להדפיס.
hero.2=הקובץ הזה הוא אחת מאותן צורות מאוחרות. eBible.org, המספק אותו בשם חברות התנ״ך המאוחדות, מתאר אותו כתרגומו של דיודאטי מ־1641 שתוקן ב־1821, במהדורה הנושאת את התאריך 1885. מי ערך את תיקון 1821 ואיזה בית דפוס הדפיס את מהדורת 1885 — את זאת לא בירר פרויקט זה, ולכן הדף אינו נוקב בשמם. התאריך אינו הבעיה שהוא אצל דיודאטי האחר, שתוויתו היא שנת מותו של דיודאטי: 1885 הוא תאריכה של המהדורה עצמה, הקטלוג שומר אותו ותווית השלב מציגה אותו.
hero.3=לצד דיודאטי האחר, הנוסח זהה בכל בדיקה מדגמית: „il Signore è il mio pastore” במזמור 23, „la Vergine concepirà” בישעיהו 7:14, העדים השמימיים ביוחנן א' 5:7, השבח בסוף תפילת האדון, מעשי השליחים 8:37 במלואו. השם המפורש הוא „il Signore”, האדון, כפי שכתב אותו דיודאטי; הריבדוטה, תיקון של טקסט זה שיצא ב־1924, היא ששינתה אותו ל־„l'Eterno”. מה ששונה הוא החלוקה לפסוקים. ביותר משלושים מקומות העותק הזה הולך לפי שיטה אחרת, קרובה לעברית — תפילת יונה מתחילה ב־2:1 והפרק נמשך עד 2:11, בישעיהו 8 יש פסוק 23, איוב 39 נמשך עד פסוק 38, והפסוק הראשון של האיגרת אל הקולוסים 4 עומד בסוף פרק 3 — ולכן יש בו בסך הכול שבעה פסוקים פחות. ואין בעותק הזה אף אחת מכותרות המזמורים: מזמור 51 נפתח ישר ב־„Abbi pietà di me, o Dio”, ואילו דיודאטי האחר מצרף את הכותרת לפסוק הראשון. ההצגה של eBible.org עצמו לטקסט הזה מראה את הכותרות, ולכן סביר ביותר שאבדו בייבוא של פרויקט זה ולא שהן חסרות בהדפסת 1885.
hero.4=בקורא זה היא אחת משלוש ביבליות איטלקיות. ממשק איטלקי נפתח על דיודאטי האחר, דיודאטי 1649, הבא ראשון בסדר הקטלוג, שכן לאיטלקית אין בחירה מאוצרת. בשלבי השושלת לא רשום לה שום מקור — אפילו לא אותו עותק אחר של אותו תרגום — ולכן שלב שנפתח תחת פסוק יורד ישר אל רצפת לשונות המקור המסומנת ב־≈. כמו אצל דיודאטי האחר, הנוסח המקובל שם קרוב לאמת: דיודאטי עבד על פי היוונית המודפסת של בזא, טקסט מאותה משפחה.

