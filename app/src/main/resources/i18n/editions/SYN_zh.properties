fact.14.label=音频的局限
fact.14.value=音频为机器生成，并非真人朗读，因此人名与术语的发音未经编辑核实；阅读行会随文本滚动，并仅在"经文"显示模式下高亮每一节——在其他模式下音频仍会播放，只是没有高亮。
