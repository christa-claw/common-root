title=俄文教会公会译本 — 关于本版本 | Common Root
description=1876年俄文教会公会译本圣经：1813年由俄罗斯圣经公会发起，在莫斯科都主教斐拉列特的主持下由四所东正教神学院完成翻译，至今仍是大多数俄语使用者口中那部直接被称为"圣经"的译本。
heroHeading=俄文教会公会译本
readerHref=/reader?c1.src=syn

hero.1=这项工程始于1813年，新成立的俄罗斯圣经公会在沙皇亚历山大一世的支持下着手翻译一部俄文圣经，其用意是与教会斯拉夫语圣经并存，而非取而代之。数年之内，一部新约便已问世。保守派教士认为，用口语俄文写成的圣经会威胁教会斯拉夫语文本的权威，于是尼古拉一世在1826年解散了该公会，工作就此中断了三十年。
hero.2=翻译工作直到亚历山大二世在位期间才得以恢复。1858年，至圣宗教事务管理总局批准了一部新的俄文译本，并将工作交给莫斯科、圣彼得堡、喀山和基辅四所神学院，莫斯科都主教斐拉列特（德罗兹多夫）担任主导与最终定稿的编辑。新约译自被称为"公认文本"（Textus Receptus）的希腊语印刷本，于1862年出版。旧约则是更难解决的争议焦点：斐拉列特坚持要越过教会斯拉夫语文本，直接回到希伯来文本身，这遭到那些坚守教会斯拉夫语文本希腊语根基的人反对，而宗教事务管理总局正式批准以马索拉文本为翻译依据的许可，直到同一年即1862年才下达——那时旧约的大部分内容其实早已据此译出。
hero.3=完整的圣经——旧约与新约首次以这种新俄文而非教会斯拉夫语合订一册——于1876年由宗教事务管理总局印刷所出版，译本常用的名称便由此而来。它的旧约并非纯粹译自希伯来文：在教会斯拉夫语传统所保存的七十士译本与马索拉文本有分歧之处，希腊语译文往往仍被保留下来，通常以括注异文的形式呈现，因此这部译成的圣经至今仍然真切地受惠于站在古老教会斯拉夫语文本背后的那部希腊语圣经。
hero.4=此后它再未遇到真正的对手。俄罗斯的东正教徒、天主教徒、浸信会信徒以及其他新教徒，如今都以某种形式沿用同一个文本，其文风对俄语文学语言的塑造，不亚于英王钦定本对英语的塑造。在本语料库中，它收录66卷书——新教正典，而非范围更广的东正教正典——也是这里唯一的俄文圣经，因此俄文界面正是以它开启。

