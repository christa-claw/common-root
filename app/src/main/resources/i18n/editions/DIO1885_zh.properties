title=迪奥达蒂圣经 1885（意大利文）— 关于此版本 | Common Root
description=乔瓦尼·迪奥达蒂的意大利文圣经的 19 世纪形态：他 1641 年的文本，经 1821 年修订，见于一部标为 1885 年的版本——与本语料库中另一部迪奥达蒂是同一译本，只是分节方式不同。
heroHeading=迪奥达蒂圣经 1885
readerHref=/reader?c1.src=dio1885

# The narrative, one paragraph per key, in order.
hero.1=这是乔瓦尼·迪奥达蒂的译本——这位祖籍卢卡的日内瓦人生于 1576 年，1607 年出版了第一部从希伯来文和希腊文而非拉丁文译出的意大利文圣经，又在 1641 年、去世前 8 年，附上自己的注释加以修订。本语料库中的另一部迪奥达蒂有自己的页面，讲述了这段经历。在他身后的 2 个世纪里，这部译文靠重印流传；自 1808 年起，大英圣书公会一版接一版地出版它，因为对意大利新教徒来说，没有别的可印。
hero.2=这份文件就是那些后来形态中的一种。eBible.org 代表联合圣经公会提供它，称之为迪奥达蒂 1641 年的译本，1821 年经过修订，见于一部标为 1885 年的版本。1821 年的修订出自谁手、1885 年的版本由哪家印坊印制，本项目尚未查明，所以页面不提名字。年份在这里不像在另一部迪奥达蒂那里成问题——那一部的标签是迪奥达蒂的卒年：1885 是这个版本自身的年份，目录存着它，阶梯标签也显示它。
hero.3=与另一部迪奥达蒂对照，每一处抽查的措辞都相同：诗篇 23 篇作“il Signore è il mio pastore”，以赛亚书 7:14 作“la Vergine concepirà”，约翰一书 5:7 有天上的见证，主祷文结尾有颂荣句，使徒行传 8:37 完整。神名作“il Signore”，即“主”，正如迪奥达蒂所写；把它改为“l'Eterno”的，是 1924 年出版的这一文本的修订本——里韦杜塔修订本。不同之处在分节。有 30 多处，这个副本遵循另一套接近希伯来文的体系——约拿的祷告从 2:1 开始，该章一直到 2:11；以赛亚书第 8 章有第 23 节；约伯记第 39 章延续到第 38 节；歌罗西书第 4 章的第 1 节放在第 3 章末尾——因此总节数少了 7 节。此外，这个副本没有任何诗篇标题：诗篇 51 篇直接以“Abbi pietà di me, o Dio”开头，而另一部迪奥达蒂把标题并入第一节。eBible.org 自己呈现的这一文本是有标题的，所以标题很可能是在本项目导入时丢失的，而不是 1885 年的印本本来就没有。
hero.4=在本阅读器中，它是三部意大利文圣经之一。意大利文界面开启的是另一部迪奥达蒂，即迪奥达蒂 1649，它在目录顺序中排在最前，因为意大利文没有选定的默认版本。谱系阶梯中未为它记录任何母本——连同一译本的那另一个副本也没有——所以在某一节之下展开的阶梯径直落到以 ≈ 标示的原文底层。和另一部迪奥达蒂一样，那里的公认文本离事实很近：迪奥达蒂依据的是贝扎的希腊文印本，正属于这一系。

