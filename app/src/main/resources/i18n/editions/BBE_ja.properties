title=Bible in Basic English — この版について | Common Root
description=Bible in Basic English（ベーシック・イングリッシュ聖書）。S・H・フックの率いる委員会がヘブライ語とギリシャ語から訳し、Cambridge University Press が出版した。新約は1941年、聖書全体は1949年。C・K・オグデンの850語のベーシック・イングリッシュに、詩と聖書のための150語を加えて書かれている。
heroHeading=Bible in Basic English
readerHref=/reader?c1.src=bbe

# The narrative, one paragraph per key, in order.
hero.1=ベーシック・イングリッシュ（Basic English）は、Orthological Institute の C・K・オグデンが考案したもので、国際補助語として提案された850の英単語のリストである。Bible in Basic English は、S・H・フック（1874–1968）の指揮する委員会が Orthological Institute と協力して作った。フックは旧約学者で、1930年にロンドン大学のサミュエル・デイヴィッドソン記念旧約学教授となった。翻訳はヘブライ語とギリシャ語からなされ、それ以前の英語訳を簡略化したものではない。その後、ベーシックの本文は Cambridge University Press の理事会が組織した委員会によって細部まで見直された。オグデンの850語に、訳者たちは詩を助ける100語と聖書に必要な50語、合わせて150語を加えた。Cambridge University Press は1941年に新約を、1949年に聖書全体を出版した。1965年の刷りが著作権表示なしで米国に流通したため、米国ではこの本文はパブリックドメインとなっている。
hero.2=その結果、この小さな語彙の範囲内で、平明でむらのない文章になっている。創世記は「At the first God made the heaven and the earth.」で始まる。詩編23は「The Lord takes care of me as his sheep; I will not be without any good thing.」で始まる。ヨハネによる福音書は「From the first he was the Word, and the Word was in relation with God and was God,」で始まり、ヨハネによる福音書3:16は「For God had such love for the world that he gave his only Son, so that whoever has faith in him may not come to destruction but have eternal life.」となっている。神の名は全体を通じて「the Lord」だが、8つの節では「Yahweh」とされている。そのうちには、アブラハム、イサク、ヤコブが「had no knowledge of my name Yahweh」と神が語る出エジプト記6:3と、詩編83:18がある。ヘブライ語が不確かすぎて訳せない箇所には、訳者たちは点を置いた。私たちのコピーでは、ヨブ記34:29–33やヨブ記36:16–20など、いくつかの節が「...」だけになっている。
hero.3=私たちのコピーは創世記からヨハネの黙示録までの66書を収め、外典は含まず、キング・ジェイムズとリバイズド・バージョンの章節番号に従う。詩編は150篇で、マラキ書は第4章で終わる。詩編の表題は含まれていない。詩編51は「Have pity on me, O God」から始まる。新約は公認本文の翻訳ではない。批判校訂版が省く16の節、たとえばマタイによる福音書17:21、使徒言行録8:37、ローマの信徒への手紙16:24は、ここでは[]と記された空の場所としてのみ残されている。ヨハネの手紙一5:7には天における3つの証しがない。姦淫の女の物語、ヨハネによる福音書7:53–8:11は角括弧に入れられているが、マルコによる福音書の長い結びは保たれている。このリーダーにおいて、これは単独で立っている。コーパスはこの版に親本を記録していないので、その節の一つの下で系譜の段を開くと、≈の印が付いた原語の底面へまっすぐ落ちる。旧約ではレニングラード写本、新約ではテクストゥス・レセプトゥスだが、その16箇所でこの翻訳はこのギリシャ語本文に従っていない。この版の上に立つものも記録されていない。どのインターフェース言語もこの版では開かない。英語インターフェースは New International Version で開き、この版には翻訳グリッドにあるこの版自身のカードからたどり着く。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=英語。C・K・オグデンの簡略化された語彙、ベーシック・イングリッシュ
fact.2.label=訳者
fact.2.value=S・H・フック（1874–1968、ロンドン大学サミュエル・デイヴィッドソン記念旧約学教授）の指揮する委員会。Orthological Institute と協力。ベーシックの本文は Cambridge University Press 理事会の委員会が見直した
fact.3.label=翻訳の底本
fact.3.value=ヘブライ語とギリシャ語。新しい翻訳であり、以前の英語聖書の改訂ではない。ただし章と節は[[KJV|キング・ジェイムズ・バージョン]]や[[RV|リバイズド・バージョン]]と同じ番号である
fact.4.label=語彙
fact.4.value=オグデンのベーシック850語に、詩を助ける100語と聖書に必要な50語。加えた語は合わせて150語
fact.5.label=出版
fact.5.value=Cambridge University Press。新約1941年、聖書全体1949年。1965年の刷りは著作権表示なしで米国に流通した
fact.6.label=ライセンス
fact.6.value=パブリックドメイン。このコピーは eBible.org から
fact.7.label=このコーパスでは
fact.7.value=66書。プロテスタントの正典すべてで、外典は含まない。英語式の章節番号のため、詩編は150篇。詩編の表題はない。批判校訂版が省く新約の16の節は、[]と記された空の場所としてのみ残る
fact.8.label=系譜
fact.8.value=記録された親本はなく、この版の上に立つものとして記録されたものもない——段はまっすぐ原語の底面で開き、旧約では[[WLC|レニングラード写本]]、新約では[[TR|テクストゥス・レセプトゥス]]となる。この翻訳はそのギリシャ語本文には従っていない
