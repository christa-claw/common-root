title=New International Version — Об этом издании | Common Root
description=New International Version: английская Библия, с которой это приложение открывается по умолчанию, переведённая прямо с оригинальных языков Комитетом по переводу Библии (Committee on Bible Translation) и впервые завершённая в 1978 году — здесь в тексте 2011 года.
heroHeading=New International Version
readerHref=/reader?c1.src=niv

# The narrative, one paragraph per key, in order.
hero.1=Всё началось с недовольства одной деноминации. В 1955 году бизнесмен Хауард Лонг вместе с пастором Питером Де Йонгом настаивал перед Christian Reformed Church на создании Библии на современном английском языке, и в 1957 году церковь утвердила комитет для изучения этой идеи. National Association of Evangelicals начала в том же году собственный похожий проект. Обе организации объединили усилия: совместный комитет разослал в 1964 году приглашения на переводческую конференцию, которая собралась в августе 1965 года в Trinity Christian College в Палос-Хайтс, штат Иллинois, и постановила образовать «постоянный комитет из пятнадцати» для продолжения работы. Этот постоянный комитет стал Комитетом по переводу Библии. В 1967 году New York Bible Society — ныне переименованное в Biblica — взяло на себя руководство проектом и наняло учёных, которые выполнили перевод.
hero.2=Ничто здесь не восходит к более старой английской Библии. В то время как King James Version, Revised Version, American Standard Version и World English Bible образуют в этом собрании одну цепь пересмотров, New International Version была переведена заново прямо с еврейского, арамейского и греческого: Ветхий Завет — с масоретского еврейского текста, с учётом свитков Мёртвого моря, Септуагинты и других ранних свидетельств; Новый Завет — с эклектического критического греческого текста, представленного изданиями United Bible Societies и Nestle-Aland, а не с Textus Receptus, на котором здесь стоят Женевская Библия и King James. Комитет из пятнадцати человек за примерно десятилетие вырос в проект, в котором участвовало более ста учёных из нескольких англоязычных стран и многих деноминаций. Заявленной целью было создать перевод, который сохранял бы точность оригинала, не читаясь при этом как слово-в-слово скопированный текст — равновесие, обычно классифицируемое как динамическая эквивалентность, между строго буквальной передачей и вольным пересказом.
hero.3=Новый Завет появился первым, в 1973 году; полная Библия последовала 27 октября 1978 года; лёгкий пересмотр произошёл в 1984 году. Текст изменился более существенно в 2011 году, когда более обширный пересмотр заменил и издание 1984 года, и Today's New International Version 2005 года, отправив оба в прошлое в пользу единого текста, который действует с тех пор. Именно этот текст 2011 года хранится в данном собрании — тот же год, что показывает карточка каталога. Авторские права на всё время принадлежат Biblica, Inc.; издают её Zondervan в Соединённых Штатах и Hodder & Stoughton в Великобритании.
hero.4=Её место в этом приложении — тихо центральное. Поставьте интерфейс на английский язык, и откроется именно она — страницы King James Version и Revised Version в этом собрании сами говорят, что это не они, указывая сюда как на издание, с которого переключаются, а не на которое попадают. Поскольку она ничего не пересматривала, в собрании для неё не записан источник: открытие ступени родословия под стихом New International Version ведёт прямо на пол языков оригинала, помеченный ≈, как и для Berean Standard Bible — с одной оговоркой, которую стоит знать. Греческий свидетель этого пола — Textus Receptus, а Textus Receptus не является тем, из чего на самом деле сделан Новый Завет этого перевода: пол обозначает «греческий оригинал» в общем смысле, а не собственный рабочий текст этого комитета. Есть ещё одна особенность, отличающая её от большинства английских соседей: она лицензионная, а не общественное достояние — тот же статус, что у New American Standard Bible 2020, тогда как Berean Standard Bible, Женевскую Библию, King James Version, Revised Version и World English Bible можно копировать свободно.

