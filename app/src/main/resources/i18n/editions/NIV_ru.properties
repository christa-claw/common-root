fact.1.label=Язык
fact.1.value=Английский
fact.2.label=Заказан
fact.2.value=Совместным комитетом Christian Reformed Church и National Association of Evangelicals, который созвал конференцию в Trinity Christian College в Палос-Хайтс, штат Иллинойс, в августе 1965 года
fact.3.label=Кем сделан
fact.3.value=Комитетом по переводу Библии — сначала пятнадцатью учёными, число которых со временем превысило сто человек из нескольких англоязычных стран и многих деноминаций, за примерно десятилетие
fact.4.label=Ветхий Завет с
fact.4.value=Масоретского еврейского текста, с учётом свитков Мёртвого моря, Септуагинты и других ранних свидетельств
fact.5.label=Новый Завет с
fact.5.value=Эклектического критического греческого текста, представленного изданиями United Bible Societies и Nestle-Aland, — не с [[TR|Textus Receptus]], на котором здесь стоят [[GNV|Женевская Библия]] и [[KJV|King James Version]]
fact.6.label=Род перевода
fact.6.value=Уравновешивает точность буквальной передачи с естественным, идиоматическим английским, не придерживаясь ни одной из крайностей, — обычно классифицируется как динамическая эквивалентность; новый перевод с оригинальных языков, а не пересмотр традиции King James
fact.7.label=Издан
fact.7.value=Новый Завет в 1973 году; полная Библия 27 октября 1978 года; лёгкий пересмотр в 1984 году; нынешний, более основательно пересмотренный текст — в 2011 году, который отправил в прошлое и издание 1984 года, и Today's New International Version 2005 года
fact.8.label=Издатель
fact.8.value=Biblica, Inc., которой принадлежат авторские права; Zondervan в Соединённых Штатах, Hodder & Stoughton в Великобритании
fact.9.label=Лицензия
fact.9.value=Лицензионная, не общественное достояние. До 500 стихов можно цитировать без письменного разрешения, если они не составляют целую книгу Библии и не более 25 % произведения, с указанием авторских прав; всё сверх этого требует разрешения Biblica
fact.10.label=В этом собрании
fact.10.value=Библия, с которой английский интерфейс открывается по умолчанию — [[KJV|King James Version]] и [[RV|Revised Version]] здесь обе отмечают, что это не они. В ступенях родословия для неё не записан источник: ступень под стихом NIV ведёт прямо на пол языков оригинала, помеченный ≈, как и для [[BSB|Berean Standard Bible]], — только что греческий свидетель этого пола — [[TR|Textus Receptus]], а это не тот текст, из которого на самом деле сделан Новый Завет этого перевода. Будучи лицензионной, а не общественным достоянием, в том же статусе, что New American Standard Bible 2020, она стоит отдельно от соседей из общественного достояния, таких как [[KJV|King James Version]], [[RV|Revised Version]] и [[WEB|World English Bible]]
