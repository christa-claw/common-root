title=Corán — Sablúkov — Acerca de esta edición | Common Root
description=La traducción rusa de Gordi Sablúkov, publicada en Kazán en 1878 y descrita habitualmente como la primera traducción rusa del Corán hecha directamente del árabe en lugar de a través de un intermediario francés o inglés — y en este corpus la traducción rusa complementaria que se muestra bajo el texto árabe uthmani.
heroHeading=Corán — Sablúkov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordi Semiónovich Sablúkov (1803-1880) se formó para el clero ortodoxo ruso, licenciándose en el Seminario Teológico de Oremburgo en 1826 y en la Academia Teológica de Moscú en 1830. Pasó las dos décadas siguientes, de 1830 a 1849, enseñando historia y lenguas orientales en el Seminario Teológico de Sarátov —donde, a mediados de la década de 1840, uno de sus alumnos fue el futuro escritor radical Nikolái Chernishevski— antes de trasladarse en 1849 al departamento misionero de la Academia Teológica de Kazán, donde enseñó lenguas orientales y clásicas hasta 1862.
hero.2=Las traducciones rusas del Corán se remontan a 1716, cuando Piotr Postnikov hizo una por orden de Pedro el Grande —pero a partir del francés de André du Ryer, no del árabe, igual que la de Alekséi Kolmakov de 1792, hecha a partir del inglés de George Sale. La de Sablúkov, publicada en Kazán en 1878 como "Коран, законодательная книга мохаммеданского вероучения" ("El Corán, el libro legislativo de la fe mahometana"), se considera habitualmente la primera traducción rusa del Corán hecha directamente del original árabe, fruto de sus años enseñando lenguas orientales en Kazán.
hero.3=Al año siguiente la complementó con un volumen de notas, "Приложения к переводу Корана" (1879), y más tarde con otros dos estudios relacionados: "Сведения о Коране" ("Datos sobre el Corán", 1884) y un tratado comparativo anterior sobre la enseñanza cristiana y musulmana acerca de los nombres de Dios (1873). Su traducción ha seguido siendo una de las versiones rusas más difundidas desde entonces, incluso después de que traducciones posteriores —entre ellas la de Ignati Krachkovski, publicada póstumamente— se hicieran más conocidas en el uso académico soviético y postsoviético.
hero.4=Lo que se ha digitalizado aquí, en la edición ru.sablukov de alquran.cloud, se ofrece en este corpus como la traducción rusa complementaria al [[Q-AR|texto árabe uthmani]], junto a las traducciones inglesas de [[Q-EN|Pickthall]] (1930) y de [[Q-YA|Yusuf Ali]] (1934) —las tres traducciones que un repaso de las disponibles encontró inequívocamente libres de usar, una por idioma además del árabe.

