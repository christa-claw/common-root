title=ドゥエー・ランス訳1899 — この版について | Common Root
description=ドゥエー・ランス訳聖書:1582年のランスと1609–10年のドゥエーでラテン語ウルガータから作られた英語カトリック訳。チャロナー主教による改訂を経た、1899年のボルティモア版。
heroHeading=ドゥエー・ランス訳1899
readerHref=/reader?c1.src=dra

# The narrative, one paragraph per key, in order.
hero.1=1568年、もはや自国で地位を保てなくなった、その多くがオックスフォード出身者だった英語カトリック教徒の一団が、ウィリアム・アレンのもとフランドルのドゥエーに学寮を設立した。その存在目的の一つは、英語の聖書をカトリックの手に渡すことだった。当時流通していた英語聖書はプロテスタントのものだけで、論争の道具として使われていたからである。グレゴリー・マーティンは1578年10月、一日およそ二章の速さで翻訳を始め、新約聖書は学寮が一時移っていたランスで1582年に刊行された。マーティンは同年10月28日、自分の新約聖書が世に出てから数週間後に亡くなった。旧約聖書も同じころに準備が整っていたが、学寮にそれを印刷する費用がなかったという単純な理由で、そのまま印刷されずにいた。ようやく世に出たのは1609年と1610年、二巻に分けてであり、そのころにはキング・ジェイムズ・バージョンの刊行まであと二年だった。
hero.2=このコーパスにある他のどの英語聖書とも違うのは、それが何から作られたかである。ヘブライ語やギリシャ語からではなく、ラテン語ウルガータからである。トリエント公会議はウルガータを教会の正典本文と宣言しており、ドゥエーの訳者たちはさらに、ヒエロニムスが当時手に入るどのギリシャ語写本よりも古い写本に基づいて訳したのだと主張した——旧約についていえば、1600年当時としては不合理な考えではなかった。その結果できた文章は強くラテン語的であり、時にはまったく英語とは言えないところにまで至る。主の祈りは「supersubstantial bread(超実体的なパン)」を求めるが、これは訳者たちが、神学がその語に懸かっている以上、それを英語らしく馴染ませようとしなかったからである。それは能力の欠如ではなく、方針だった。
hero.3=18世紀半ばまでには、これを読める者はほとんどいなくなっており、リチャード・チャロナー主教が1749年から1752年にかけて大幅な改訂を行った——多くの点で、キング・ジェイムズ・バージョンの方向へと。その頃にはキング・ジェイムズ訳こそが、英語の聖書とはどう響くべきものかを体現していたからである。今日ドゥエー・ランス訳として売られている聖書はすべて、マーティンの本文ではなくチャロナーの本文である。ここに収めるのは1899年のアメリカ版で、ボルティモアのジョン・マーフィー社が刊行し、ジェイムズ枢機卿ギボンズの認可(imprimatur)を得ている。この版はとうに著作権が切れているため、以来ずっとスキャンされ、入力され、複製されてきており、今日デジタルで出回っているドゥエー・ランス訳のほとんどが実質的にこの版である。
hero.4=この読書環境において、これはほかのほぼどの版にもできないことをする。その記録された母本がこのコーパス自体に存在するのである。ドゥエー・ランス訳のある節の下でさらにもう一段開けば、その下の段はラテン語ウルガータそのもの——実際にそこから翻訳された本文——であり、多くの版が行き着く ≈ 印つきの原語の底面ではない。まさにこの段の仕組みはこの場合のために作られた。影響は逆方向にも及んでいた——ランスの新約聖書はキング・ジェイムズ訳の訳者たちの机の上にもあり、そのラテン語的な語彙の少なからぬ部分が彼らの仕事に入り込んだ——が、系譜の一覧に記録されるのは正式な改訂の系統のみであるため、その負債はそこには記されていない。もう一つ、逆転していることに触れておく価値がある。その段のチップには1899年という年が示されているのに対し、カタログの札には年がまったく示されていない。段の年は手作業でまとめられた別の一覧であり、カタログの札はカタログ自体のメタデータを読んでいるため、ある版が一方にだけ存在する場合、この二つは公然と食い違う。
hero.5=正典についての注意を一つ。ここに収められている本文は72巻であり、印刷されたカトリック聖書の73巻ではない。含まれている6巻の第二正典——トビト記、ユディト記、マカバイ記一・二、知恵の書、シラ書——はカトリックの位置ではなく、ヨハネの黙示録の後に置かれており、バルク書はまったく含まれていない。これはこのデジタル本文が取り込まれた際の性質であって、1899年の書物そのものの性質ではない。したがってこの欄は節単位では正しく読めるものの、カトリックの正典が何を含むかを確認する用途には使うべきではない。

# The facts strip: label on the left, value on the right, in display order.
fact.1.label=言語
fact.1.value=英語——カトリックの伝統
fact.2.label=翻訳元
fact.2.value=ラテン語ウルガータであり、ヘブライ語やギリシャ語ではない——このコーパスが収める同じ[[VUL|ウルガータ]]
fact.3.label=新約聖書
fact.3.value=ランス、1582年——主にグレゴリー・マーティンの仕事で、ウィリアム・アレン、リチャード・ブリストウ、トマス・ワーシントンが加わった
fact.4.label=旧約聖書
fact.4.value=ドゥエー、1609年と1610年、二巻——新約聖書と同時に完成していたが、印刷費用がなかったためおよそ三十年間留め置かれた
fact.5.label=改訂者
fact.5.value=リチャード・チャロナー主教、1749–1752年——今日ドゥエー・ランス訳として売られている書物はすべてチャロナーの改訂版であり、1582/1610年の本文ではない
fact.6.label=この版
fact.6.value=1899年のアメリカ版、ボルティモアのジョン・マーフィー社刊、ジェイムズ枢機卿ギボンズの認可付き——とうに著作権が切れており、デジタルで流通している版である
fact.7.label=ここでの内容
fact.7.value=72巻:プロテスタント正典の66巻をプロテスタントの順序で収め、トビト記、ユディト記、マカバイ記一・二、知恵の書、シラ書がヨハネの黙示録の後に付されている。バルク書は含まれておらず、この欄はカトリックの正典を確認する信頼できる手段ではない
fact.8.label=系譜
fact.8.value=このコーパスの中で、記録された母本自体もコーパスに含まれている数少ない版の一つ——ドゥエー・ランス訳の節の下の段は、原語の底面ではなく[[VUL|ラテン語ウルガータ]]へと開く
fact.9.label=このコーパスでは
fact.9.value=カタログの札は年を空欄のままにしているにもかかわらず、その段のチップには1899年という年が示されている。段の年は別途手作業でまとめられた一覧であり、この二つが食い違うことは許容されている
