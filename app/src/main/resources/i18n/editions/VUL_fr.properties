title=Vulgate latine — À propos de cette édition | Common Root
description=La Vulgate latine : la traduction de Jérôme, commandée en 382 et achevée vers 405, qui a porté la Bible à travers l'Europe occidentale pendant mille ans et fut le premier livre imprimé par Gutenberg.
heroHeading=Vulgate latine
readerHref=/reader?c1.src=vul

# The narrative, one paragraph per key, in order.
hero.1=À la fin du IVe siècle, les évangiles latins qui circulaient en Occident se contredisaient d'une copie à l'autre, et le pape Damase Ier demanda à son secrétaire Jérôme de les mettre en ordre. Jérôme commença par une révision. Il y consacra finalement plus de vingt ans, la plupart à Bethléem, et produisit quelque chose que personne n'avait demandé.
hero.2=La décision qui a tout changé fut de traduire l'Ancien Testament depuis l'hébreu plutôt que depuis la Septante grecque dont l'Église s'était toujours servie. Jérôme appelait ce principe “hebraica veritas” — la vérité hébraïque — et il fit polémique : Augustin lui écrivit, craignant que les assemblées ne se révoltent en voyant changer sous elles des lectures familières. Jérôme le fit tout de même. C'est pourquoi une Bible latine, de toutes choses, se tient plus près de l'hébreu que la Bible grecque que lisaient les premiers chrétiens.
hero.3=Elle devint la Bible de l'Europe occidentale pour un millénaire, une durée plus longue que celle d'aucune traduction avant ou depuis. C'est d'elle que Wyclif traduisit en anglais, et d'elle aussi que travaillèrent les traducteurs de la Douay-Rheims — la Douay-Rheims de ce corpus en est donc la descendante directe, et les échelons de cette édition renvoient ici. Ce fut également le premier livre d'ampleur imprimé en caractères mobiles : la Bible que Gutenberg composa à Mayence vers 1455, c'était ce texte.

