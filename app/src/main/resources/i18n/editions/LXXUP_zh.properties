title=布伦顿英文七十士译本（更新版） — 关于本版本 | Common Root
description=兰斯洛特·布伦顿爵士1844年与1851年的英文七十士译本，由亚当·博伊德于2020年更新拼写与人名地名——与本语料库中并列的布伦顿原版是同一译本，thou 与 thee 仍留在布伦顿原来的位置。
heroHeading=布伦顿英文七十士译本（更新版）
readerHref=/reader?c1.src=lxxup

# The narrative, one paragraph per key, in order.
hero.1=这是兰斯洛特·布伦顿爵士对七十士译本——即希腊文旧约——的英文翻译，其英文经过了更新。布伦顿主要依据梵蒂冈抄本翻译；伦敦的 Samuel Bagster and Sons 于1844年出版其译本，1851年又连同次经再版。2020年，亚当·博伊德为 eBible.org 修订了此本，并将其改动献入公共领域。他并没有重新翻译。他的序言列出了所作的改动：拼写改为现代美式英语，于是“shew”成了“show”；人名与地名采用英语读者熟悉的形式；“begat”与“spake”改作“begot”与“spoke”；连字符与重叠的标点得到整理；诗歌按诗歌排版。他所保留的同样是有意为之：“thou”“thee”“ye”及与之相配的动词形式、布伦顿的语法，以及他那19世纪式的繁重标点。
hero.2=两者的差别，放在同样收于本语料库的布伦顿原版旁边看得最清楚。布伦顿按希腊文的写法拼写希伯来人名；更新版通常给出英语形式。布伦顿的尼希米记以“the words of Neemias the son of Chelcia”开篇，这里则作“Nehemiah the son of Hacaliah”；Elias the Thesbite 成了 Elijah the Tishbite，以赛亚书7:14的 Emmanuel 成了 Immanuel。拼写之下，译文仍是布伦顿的，因此它仍随希腊文而读。以赛亚书7:14的“A virgin shall conceive”译的是希腊文 parthenos；诗篇保留希腊文编号，所以这里的第22篇是牧者之诗；创世记1:2的大地仍是“unsightly and unfurnished”。旧式代词也都保留：“thou shalt call his name Immanuel”。
hero.3=在本阅读器中，它处在谱系阶梯之外。语料库没有为它记录母本——既未记录布伦顿所译的希腊文，也未记录它所修订的布伦顿原版——因此在它某节经文下打开的级会直接落到以≈标记的原文语言底层，而旧约的底层是列宁格勒抄本：一部希伯来文文本，并非此译本据以译出的希腊文。若要从布伦顿的英文下到他的希腊文，请打开布伦顿原版，其记录在案的母本正是七十士译本。反过来，也没有任何版本立于此版之上，且没有任何界面语言默认打开它；英文界面默认打开的是 New International Version。我们的副本比原书窄。它有36卷。以斯拉记与尼希米记合为一卷，共23章，与希腊文相同，尼希米记从第11章开始。它所取自的 eBible.org 文件也包含次经，并且只以较长的希腊文形式提供以斯帖记与但以理书；这些都没有导入，所以这里既没有以斯帖记，也没有但以理书，也没有多比传或智慧篇。

