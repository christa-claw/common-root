title=Coran — Sabloukov — À propos de cette édition | Common Root
description=La traduction russe de Gordi Sabloukov, publiée à Kazan en 1878 et habituellement décrite comme la première traduction russe du Coran faite directement de l'arabe plutôt que par l'intermédiaire du français ou de l'anglais — et dans ce corpus la traduction russe d'accompagnement présentée sous le texte arabe uthmani.
heroHeading=Coran — Sabloukov
readerHref=/reader?c1.src=q-sab

# The narrative, one paragraph per key, in order.
hero.1=Gordi Semionovitch Sabloukov (1803-1880) se forma pour le clergé orthodoxe russe, obtenant son diplôme du séminaire théologique d'Orenbourg en 1826 puis de l'académie théologique de Moscou en 1830. Il passa les deux décennies suivantes, de 1830 à 1849, à enseigner l'histoire et les langues orientales au séminaire théologique de Saratov — où, au milieu des années 1840, l'un de ses élèves fut le futur écrivain radical Nikolaï Tchernychevski — avant de rejoindre en 1849 le département missionnaire de l'académie théologique de Kazan, où il enseigna les langues orientales et classiques jusqu'en 1862.
hero.2=Les traductions russes du Coran remontent à 1716, lorsque Piotr Postnikov en réalisa une sur l'ordre de Pierre le Grand — mais à partir du français d'André du Ryer, non de l'arabe, comme celle d'Alexeï Kolmakov en 1792, faite à partir de l'anglais de George Sale. Celle de Sabloukov, publiée à Kazan en 1878 sous le titre "Коран, законодательная книга мохаммеданского вероучения" (« Le Coran, livre législatif de la foi mahométane »), est généralement considérée comme la première traduction russe du Coran faite directement à partir de l'original arabe — le fruit de ses années d'enseignement des langues orientales à Kazan.
hero.3=Il la fit suivre l'année suivante d'un volume d'accompagnement de notes, "Приложения к переводу Корана" (1879), puis de deux autres études qui s'y rattachent : "Сведения о Коране" (« Informations sur le Coran », 1884) et un traité comparatif antérieur sur l'enseignement chrétien et musulman concernant les noms de Dieu (1873). Sa traduction est restée depuis l'une des versions russes les plus diffusées, même après que des traductions plus récentes — dont celle d'Ignace Krachkovski, publiée après sa mort — soient devenues plus connues dans l'usage académique soviétique puis post-soviétique.
hero.4=Ce qui est numérisé ici, dans l'édition ru.sablukov d'alquran.cloud, est proposé dans ce corpus comme la traduction russe d'accompagnement [[Q-AR|du texte arabe uthmani]], à côté des traductions anglaises de [[Q-EN|Pickthall]] (1930) et de [[Q-YA|Yusuf Ali]] (1934) — les trois traductions qu'un examen des traductions disponibles jugea sans ambiguïté libres d'usage, une par langue en plus de l'arabe.

