about.modes.simplified.label=Semplificata
about.modes.simplified.subtitle=Testo continuo leggibile
about.modes.simplified.p1=Questa modalità conserva il flusso continuo e indiviso dell'originale, ma ripristina ciò che i copisti aggiunsero nei secoli successivi — gli spazi tra le parole, le lettere minuscole e la punteggiatura. Riflette un intervallo storico reale: molto tempo dopo che i testi erano diventati leggibili in questo modo, circolavano ancora senza numeri di capitolo e versetto. I capitoli di Langton e i versetti di Estienne erano ancora lontani secoli.
about.modes.simplified.p2=La Scriptio continua completa è volutamente ardua — elimina tutto in una volta, il che la rende una dimostrazione d'effetto ma un luogo difficile in cui leggere davvero. Questa modalità semplificata rimuove solo lo strato di cui parla questa sezione: la numerazione di capitoli e versetti, le aggiunte tarde che invitano alla citazione fuori contesto. Il testo resta leggibile, così da poter leggere un intero libro come l'argomentazione o la narrazione continua che il suo autore scrisse, anziché come una griglia di celle citabili. Dove la Scriptio continua completa è la scossa occasionale, questa è la maniera quotidiana di leggere senza i numeri.
about.texts.hadithHeader=Raccolte di hadith
about.texts.hadithNote=Il matn arabo di ogni raccolta è classico e di pubblico dominio. Le traduzioni inglesi provengono dalla hadith-api e la loro provenienza è in corso di verifica per ciascuna edizione.
about.texts.ldsHeader=Opere canoniche dei Santi degli Ultimi Giorni
about.texts.ldsNote=Le opere canoniche dei Santi degli Ultimi Giorni (mormoni), di pubblico dominio — il testo tradizionale senza l'apparato di studio moderno protetto da copyright (note a piè di pagina, sommari dei capitoli e introduzione al Libro di Mormon).
