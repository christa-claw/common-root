# ── The Qur'an landing section ───────────────────────────────────────
about.quran.title=Il Corano
about.quran.intro=Laddove i capitoli e i versetti della Bibbia furono imposti al testo secoli dopo la sua stesura, il Corano è giunto con la sua struttura intatta. La sua divisione in 114 sure, e gli ayat al loro interno, appartiene al testo così come è stato trasmesso — non una griglia editoriale posteriore sovrapposta ad esso. Ciò che il Corano offre invece al lettore comparativo sono due percorsi attraverso lo stesso testo, e una distinzione tra l'originale e le sue traduzioni che ne plasma la lettura.
about.quran.original.title=Sura e ayah: originali, non editoriali
about.quran.original.p1=Una sura è un capitolo; un ayah (letteralmente «un segno») è un versetto. A differenza dei numeri di capitolo e versetto della Bibbia — aggiunti da Stephen Langton intorno al 1227 e da Robert Estienne nel 1551 — le sure e gli ayat del Corano appartengono alla struttura propria del testo, presenti fin dalla sua più antica trasmissione.
about.quran.original.p2=Leggere in modalità «Ayat numerati» qui non significa quindi disfare una sovrastruttura medievale, come avviene con la Bibbia; la numerazione è nativa del testo.
about.quran.standardization.title=Un solo testo, per scelta
about.quran.standardization.p1=Il Corano così come circola oggi riflette una standardizzazione deliberata. Secondo il racconto tradizionale, circa due decenni dopo la morte del Profeta il califfo Uthman, di fronte a comunità regionali che recitavano in modi divergenti, fece stabilire un testo scritto autorevole e inviare copie ai centri principali — e ordinò la distruzione dei codici concorrenti. Si ricorda che alcuni compagni di spicco possedevano codici personali che differivano in alcuni punti, nella formulazione o nell'ordine delle sure.
about.quran.standardization.p2=Laddove il testo della Bibbia fu plasmato da molte mani nel corso dei secoli, quello del Corano fu fissato presto e deliberatamente in un'unica recensione ufficiale — un tipo diverso di storia editoriale, ma pur sempre una storia editoriale.
about.quran.orders.title=Due ordini: recitazione e rivelazione
about.quran.orders.p1=Il Corano che di solito vedi — il mushaf — non è disposto nell'ordine in cui fu rivelato. Dopo la sura di apertura, Al-Fatiha, le sure vanno in linea di massima dalla più lunga alla più breve: un ordine per la recitazione e la memorizzazione, non cronologico. L'ordine di rivelazione è diverso — inizia con le sure brevi e incalzanti dei primi anni meccani e si sviluppa nell'arco di circa due decenni.
about.quran.orders.p2=Questo lettore ti permette di passare dall'uno all'altro, così da leggere il testo come viene recitato o seguirlo come fu rivelato. (La sequenza esatta della rivelazione è ricostruita dagli studiosi e in alcuni punti dibattuta.)
about.quran.meccaMedina.title=Meccane e medinesi
about.quran.meccaMedina.p1=La tradizione divide le sure tra quelle rivelate alla Mecca e quelle rivelate più tardi a Medina. Le sure meccane tendono a essere più brevi e più poetiche — incentrate sull'unicità di Dio, sulla risurrezione e sul giudizio futuro. Le sure medinesi tendono a essere più lunghe e più attente alla legge, alla comunità e alla vita di una società stabile.
about.quran.meccaMedina.p2=Sapere se un passo è meccano o medinese ne cambia spesso la lettura, proprio come accade per l'ambientazione di un passo biblico.
about.quran.translations.title=L'arabo e le sue traduzioni
about.quran.translations.p1=Nella tradizione islamica il Corano è il testo arabo stesso; una traduzione è considerata un'interpretazione del suo significato piuttosto che il Corano vero e proprio — per questo i traduttori intitolano la loro opera «Il significato del nobile Corano» o «un'interpretazione».
about.quran.translations.p2=Questo lettore mantiene visibile tale distinzione: l'edizione araba è il testo di base, e una traduzione può essere mostrata sotto ciascun ayah anziché al suo posto, così da leggere insieme l'originale e una sua resa.
about.quran.callout.title=Leggere il Corano qui
about.quran.callout.p1=Due funzionalità sono pensate esattamente per questo. Il selettore dell'ordine ti fa passare dall'ordine recitato all'ordine di rivelazione. Il compagno di traduzione colloca una resa sotto ciascun ayah arabo, allineata riga per riga, così che l'originale resti primario e la traduzione lo sostenga.
about.quran.callout.p2=Lo scopo è lo stesso della Bibbia — lasciare che il testo sia letto secondo i propri termini, e rendere visibili anziché invisibili gli strati editoriali e interpretativi.

