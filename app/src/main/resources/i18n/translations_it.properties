about.search.title=Cerca ovunque
about.search.body=Un'unica casella di ricerca abbraccia ora ogni edizione e lingua della biblioteca — Bibbia, Corano, Hadith e altro — insieme ai commenti. Cerca una parola o una frase e otterrai un risultato per versetto; scegli quali traduzioni aprire e confrontane due o più affiancate in colonne sincronizzate. Puoi anche incollare un elenco di riferimenti nella barra degli strumenti del lettore per aprire ciascun passo nella propria colonna in una sola volta.
