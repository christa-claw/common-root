about.sources.download=Ogni edizione di pubblico dominio può essere scaricata per intero, nello stesso XML che legge il lettore stesso — libri, capitoli, versetti e le sequenze di ordine di lettura, secondo lo schema di religious-text.xsd. Nessun account, nessun passaggio di esportazione, nessuno scraping di una pagina web per ottenere un testo che non è mai stato nostro da trattenere. Le edizioni con licenza non vengono servite lì, e l'endpoint lo decide leggendo la licenza propria di ciascun testo invece di fidarsi di una lista.
about.sources.downloadTitle=Porta i testi con te
about.texts.downloadThis=Scarica questo testo come XML (pubblico dominio)
about.texts.lineageChains=Catene registrate, da patch_lineage.py:
about.texts.lineageHow=Il controllo ▾ in cima a una colonna biblica apre quella catena sotto ogni versetto, un piolo per clic, finché non raggiunge l'ebraico o il greco sottostante. ▴ richiude il piolo più profondo. Ogni piolo porta l'abbreviazione e l'anno della sua edizione — «GNV 1599» — così la distanza percorsa da una lezione è qualcosa che puoi vedere, non qualcosa che noi affermiamo.
about.texts.lineageIntro=Le traduzioni non sono testimoni indipendenti. I traduttori della King James lavorarono a partire dalla Bishops' Bible con Tyndale e Ginevra a portata di mano; la Revised Version corresse la King James; l'American Standard revisionò la Revised; la World English Bible modernizzò l'American Standard. Quattro secoli di traduttori, ciascuno a leggere da sopra la spalla del precedente.
about.texts.lineageModes=I pioli sono a grana di versetto, quindi i controlli compaiono solo nelle modalità di visualizzazione Versetti e Titoli. Originale, Continuo e Capitoli mantengono il loro flusso ininterrotto; una profondità impostata lì persiste in silenzio e ritorna quando torni indietro. Lo scorrimento è anche sensibile al contenuto — i pioli che non hanno nulla da dire per il libro in cui ti trovi vengono saltati, così scorrendo dall'Antico Testamento al Nuovo il testimone ebraico lascia il posto a quello greco senza un clic.
about.texts.lineageTitle=Lignaggio delle traduzioni — su cosa poggia un'edizione
about.texts.lineageWitness=I pioli contrassegnati con ≈ sono testimoni in lingua originale. Vengono mostrati perché ogni traduzione poggia in ultima analisi sull'ebraico e sul greco, non perché l'edizione li nomini come sua fonte — il Codex Leningradensis (Westminster) e il Textus Receptus fanno le veci di quel fondamento. È un limite reale, non una pretesa: una traduzione moderna come la NIV o la NASB lavora su edizioni critiche non ancora presenti in questo corpus, quindi la sua scala è un unico piolo ≈ anziché una catena. L'assenza di un'edizione dall'elenco qui sopra significa che non ne abbiamo registrato l'ascendenza, non che non ne abbia una.
