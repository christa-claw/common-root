about.sources.title=Fonti e attribuzione
about.sources.intro=Tutti i testi provengono da fornitori affidabili, di pubblico dominio o su licenza. Ci impegniamo ad attribuire correttamente ogni testo presente su questa piattaforma. Dove la licenza lo consente, il testo completo è fornito gratuitamente per lo studio personale.
