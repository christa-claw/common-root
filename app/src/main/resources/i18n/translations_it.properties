about.sources.row.licensed=NIV, NASB, NBLA (su licenza)
about.sources.row.quran=Corano — arabo e traduzioni
about.sources.row.hadith=Raccolte di hadith — arabo e inglese
about.sources.note=Le traduzioni su licenza (NIV, NASB, NBLA) sono usate con autorizzazione. La riproduzione o la ridistribuzione di contenuti su licenza al di fuori di questa piattaforma non è consentita. I testi di pubblico dominio possono essere liberamente usati e condivisi.

about.comments.title=Condividi le tue riflessioni
about.comments.body=Crea un account gratuito per lasciare commenti e note su qualsiasi versetto. Le tue annotazioni restano private per impostazione predefinita — condividile se vuoi. Leggere e studiare i testi è sempre gratuito, senza bisogno di un account.
about.comments.register=Crea un account gratuito
about.comments.signIn=Accedi

about.about.title=Informazioni su questo progetto
about.about.p1=Common Root? è un progetto indipendente nato per rendere lo studio comparativo serio delle scritture abramitiche accessibile a tutti — studiosi, studenti e lettori curiosi. Non è affiliato ad alcuna organizzazione religiosa o editore. Il nome è un invito: leggere questi testi fianco a fianco e valutare di persona ciò che condividono e dove divergono.
about.about.p2=La piattaforma è costruita su tecnologie open source: Java, Vaadin, Spring Boot, BaseX (un database XML nativo) e MySQL (per gli account utente e i commenti). I testi di partenza di pubblico dominio sono disponibili gratuitamente. Le traduzioni su licenza sono usate con il permesso dei loro editori.
about.about.p3=Nuove traduzioni, tradizioni e funzionalità vengono aggiunte di continuo. Le traduzioni del Corano e le raccolte di Hadith arriveranno presto, seguite dall'integrazione dei commentari e dai collegamenti ai riferimenti incrociati.

about.support.title=Sostieni il progetto
about.support.body=Common Root? è gratuito e lo sarà sempre. Se ti è utile, una sponsorizzazione aiuta a coprire l'hosting, l'accesso alle traduzioni su licenza e il tempo per aggiungere nuovi testi e funzionalità.
about.support.cta=♥ Sostieni su GitHub

