about.nav.openReader=Apri il lettore

about.hero.title=Studia i testi che plasmano il nostro mondo
about.hero.subtitle=Un lettore libero e aperto per esplorare le scritture delle fedi abramitiche — traduzioni della Bibbia, il Corano, gli Hadith e i commentari — fianco a fianco, in qualsiasi lingua, a qualsiasi livello di approfondimento.
about.hero.cta=Apri il lettore →

about.howto.title=Come usare il lettore
about.howto.intro=Il lettore è organizzato in colonne. Ogni colonna mostra un testo — una traduzione della Bibbia, il Corano, un commentario o le tue note. Puoi aprire tutte le colonne che vuoi e combinare liberamente le tradizioni.
about.howto.step1.title=Scegli una fonte
about.howto.step1.body=Fai clic su «Seleziona una fonte...» nell'intestazione della colonna e scegli una traduzione o un testo dal menu a discesa.
about.howto.step2.title=Naviga
about.howto.step2.body=Usa il selettore dei libri e le frecce dei capitoli per spostarti ovunque. Oppure scorri semplicemente — il lettore carica automaticamente il capitolo successivo quando raggiungi il fondo.
about.howto.step3.title=Aggiungi altre colonne
about.howto.step3.body=Fai clic su «Aggiungi colonna» nella barra degli strumenti per aprire un secondo o un terzo testo accanto al primo. Confronta traduzioni o tradizioni fianco a fianco.
about.howto.step4.title=Sincronizza o sfoglia liberamente
about.howto.step4.body=Le colonne scorrono insieme per impostazione predefinita. Fai clic sull'icona del collegamento 🔗 nell'intestazione di una colonna per scollegarla e sfogliare quella colonna in modo indipendente.
about.howto.step5.title=Cambia modalità di visualizzazione
about.howto.step5.body=Passa tra le modalità Originale, Capitoli (1227), Versetti (1551) e Titoli per ogni colonna usando il menu a discesa nell'intestazione. Vedi sotto cosa significano.
about.howto.step6.title=Segui i collegamenti dei commentari
about.howto.step6.body=Quando un commentario rimanda a un versetto, fai clic sul collegamento — tutte le colonne bibliche aperte passano automaticamente a quel passo.
about.howto.step7.title=Cerca ovunque
about.howto.step7.body=Fai clic sull'icona 🔍 nella barra degli strumenti per cercare in tutti i versetti e commenti in una sola volta. Qualsiasi risultato si apre direttamente al passo, in una nuova colonna.

about.modes.title=Comprendere le modalità di visualizzazione
about.modes.intro=Il selettore della modalità di visualizzazione nell'intestazione di ogni colonna controlla come viene presentato il testo. Ogni modalità riflette uno strato diverso della storia editoriale — alcuni antichi, altri sorprendentemente recenti. Capire da dove provengono queste divisioni cambia il modo in cui leggi.
about.modes.original.label=Originale
about.modes.original.subtitle=Scriptio Continua
about.modes.original.p1=I più antichi manoscritti biblici — siano essi i papiri greci del Nuovo Testamento o i grandi codici ebraici — erano scritti in maiuscolo continuo, senza spazi, senza punteggiatura, senza divisioni in capitoli e senza numeri di versetto. Ci si aspettava che i lettori conoscessero già il testo abbastanza bene da saperlo decifrare.
about.modes.original.p2=Questa modalità ricrea quell'esperienza. È volutamente impegnativa. Leggerla ti costringe ad affrontare il testo come facevano i primi lettori — come un argomento o un racconto continuo, e non come una raccolta di frammenti isolati e citabili. Molti studiosi sostengono che questo sia il modo più onesto di incontrare l'intento originale degli autori.
about.modes.chapters.label=Capitoli (1227)
about.modes.chapters.subtitle=Aggiunti da Stephen Langton
about.modes.chapters.p1=Stephen Langton, uno studioso inglese che divenne arcivescovo di Canterbury, divise la Bibbia secondo il sistema di capitoli ancora oggi in uso intorno al 1227 d.C. — più di mille anni dopo la stesura dei testi.
about.modes.chapters.p2=La sua motivazione era pratica: gli studiosi avevano bisogno di un modo coerente per citare i passi nei dibattiti teologici. Le divisioni in capitoli non furono mai concepite come confini ispirati. Langton lavorò rapidamente su un testo enorme, e le sue divisioni sono a volte eccellenti e a volte stridenti — interrompendo a metà di un argomento, di una poesia o persino di una frase, in modi che oscurano il flusso originale dell'autore.
about.modes.verses.label=Versetti (1551)
about.modes.verses.subtitle=Aggiunti da Robert Estienne
about.modes.verses.p1=I numeri dei versetti furono aggiunti al Nuovo Testamento nel 1551 da Robert Estienne, uno stampatore francese noto anche come Stephanus. Secondo suo figlio, fece le divisioni inter equitandum — «a cavallo» — durante il viaggio da Parigi a Lione. L'immagine di qualcuno che numera i versetti in sella è celebre ma discussa; come sa chiunque vada a cavallo, è ben difficile farlo in movimento, e gli studiosi sospettano che in realtà lavorasse la sera, nelle locande lungo la strada. Comunque stessero le cose, la fretta del viaggio potrebbe spiegare alcune delle divisioni più sconcertanti.
about.modes.verses.p2=Il sistema dei versetti dell'Antico Testamento seguì poco dopo. Come i capitoli, i versetti furono aggiunti unicamente per comodità di riferimento. Da allora hanno plasmato il modo in cui miliardi di persone leggono e citano le Scritture — spesso isolando frammenti dal loro contesto in modi che gli autori originali non avevano mai inteso né previsto.
about.modes.titles.label=Titoli
about.modes.titles.subtitle=Intestazioni editoriali delle sezioni
about.modes.titles.p1=I titoli delle sezioni — talvolta chiamati pericopi — sono intestazioni editoriali aggiunte da editori e traduttori per aiutare i lettori a orientarsi. Non fanno parte di alcun manoscritto originale.
about.modes.titles.p2=Variano notevolmente da una traduzione all'altra: la NIV li usa ampiamente, mentre la KJV non ne ha affatto. Alcuni titoli sono riassunti utili; altri impongono un'interpretazione teologica a un passo prima ancora che tu abbia letto una sola parola. Leggere prima senza i titoli, poi con essi, può essere un esercizio rivelatore.

about.problems.title=Quando le divisioni distorcono il testo
about.problems.intro=Le divisioni in capitoli e versetti hanno plasmato il modo in cui miliardi di persone leggono le Scritture — ma sono state aggiunte da editori umani secoli dopo la stesura dei testi, e a volte tagliano l'argomento originale in modi che ne cambiano davvero il significato. I seguenti sono tra gli esempi più significativi.
about.problems.isaiah.ref=Isaia 52:13 – 53:12
about.problems.isaiah.title=Una profezia divisa in due
about.problems.isaiah.p1=L'interruzione di capitolo a Isaia 53 attraversa quello che in realtà è un unico poema continuo — spesso chiamato il quarto Canto del Servo. Il poema inizia in Isaia 52:13 con «Ecco, il mio servo agirà con saggezza; sarà elevato, innalzato e grandemente esaltato.» Questa strofa iniziale (52:13–15) prepara l'intero passo che segue nel capitolo 53, che i cristiani leggono come una profezia della crocifissione.
about.problems.isaiah.p2=Poiché la divisione in capitoli colloca 52:13–15 in ciò che i lettori considerano «Isaia 52» e il corpo principale in «Isaia 53», i versetti iniziali vengono spesso trascurati. Il poema viene abitualmente citato a partire da 53:1, perdendo la sua drammatica apertura. Leggerlo come un unico passo ininterrotto — come lo presenta il testo originale — restituisce l'intero arco della profezia.
about.problems.romans.ref=Romani 7 – 8
about.problems.romans.title=Il «Perciò» che ha perso il suo «perché»
about.problems.romans.p1=Romani 8 si apre con una delle frasi più celebri del Nuovo Testamento: «Non c'è dunque ora alcuna condanna per quelli che sono in Cristo Gesù.» La parola «dunque» svolge un ruolo cruciale — segnala che Paolo sta traendo una conclusione da un argomento che ha appena esposto.
about.problems.romans.p2=Ma l'interruzione di capitolo separa la conclusione dall'argomento. I lettori che cominciano dal capitolo 8 incontrano una dichiarazione senza la sua dimostrazione. L'argomento di Paolo sulla lotta tra carne e spirito nel capitolo 7 è il fondamento diretto della certezza del capitolo 8. La divisione in capitoli ha contribuito a far leggere Romani 8:1 come una promessa a sé stante anziché come il culmine di un argomento teologico sostenuto.
about.problems.philippians.ref=Filippesi 4:13
about.problems.philippians.title=Il versetto più citato a sproposito delle Scritture
about.problems.philippians.p1=«Tutto posso in Colui che mi fortifica» è uno dei versetti più citati della Bibbia — stampato sui prodotti, citato prima degli eventi sportivi e invocato come promessa generale di potenza divina.
about.problems.philippians.p2=Nel suo contesto, Paolo parla di qualcosa di molto più specifico e molto più impegnativo: la contentezza nella povertà. I versetti circostanti recitano: «Ho imparato ad accontentarmi dello stato in cui mi trovo. So vivere nella povertà e so vivere nell'abbondanza.» Il «tutto» che Paolo può fare in Cristo è sopportare qualunque circostanza — l'abbondanza o la privazione — con serenità. La divisione in versetti ha strappato il versetto da questo contesto e ha trasformato un insegnamento sul soffrire con grazia in uno slogan sul successo.
about.problems.jeremiah.ref=Geremia 29:11
about.problems.jeremiah.title=Una promessa agli esuli, non agli individui
about.problems.jeremiah.p1=«Io conosco i pensieri che medito per voi, dice il Signore: pensieri di pace e non di sventura, per darvi un avvenire e una speranza» è uno dei versetti più popolari della cultura cristiana contemporanea, spesso applicato come promessa divina personale.
about.problems.jeremiah.p2=Nel suo contesto, Dio si rivolge all'intera comunità degli Israeliti esiliati a Babilonia — e sta dicendo loro qualcosa che non volevano sentire: che l'esilio durerà settant'anni. Il versetto pieno di speranza è inserito in una lettera che dice agli esuli di stabilirsi a Babilonia, costruire case, piantare giardini e accettare che non torneranno in vita. La promessa è reale — ma è collettiva, a lungo termine e preceduta da decenni di sofferenza. La divisione in versetti ha reso facile estrarre il conforto lasciando da parte il contesto.
about.problems.john.ref=Giovanni 11:35
about.problems.john.title=Il versetto più breve e ciò che ha perduto
about.problems.john.p1=«Gesù pianse» è il versetto più breve della Bibbia — una caratteristica che lo ha reso celebre, spesso citato e ampiamente memorizzato in modo isolato.
about.problems.john.p2=Nel greco originale, il versetto fa parte di una scena emotiva prolungata: Gesù che arriva alla tomba di Lazzaro, che vede Maria piangere, che vede la folla piangere, ed è «profondamente commosso nello spirito e turbato» — un'espressione che in greco (embrimaomai) porta un senso di ira o agitazione, non solo di tristezza. Gli studiosi discutono se Gesù abbia pianto per il dolore, per compassione verso chi piangeva, o per qualcosa di più complesso. La divisione in versetti ha ridotto un momento teologicamente ricco a un aneddoto toccante su Gesù che condivide un'emozione umana.
about.problems.callout.title=Il «proof-texting» e il sistema dei versetti
about.problems.callout.p1=Il sistema dei versetti ha creato involontariamente le condizioni per il «proof-texting» — la pratica di citare un versetto isolato a sostegno di una posizione teologica o morale senza riferimento all'argomento che lo circonda. Sia il dibattito accademico sia la cultura popolare ne sono stati segnati. Un versetto staccato dal suo contesto può sembrare dire quasi l'opposto di ciò che l'autore intendeva.
about.problems.callout.p2=Ecco perché esistono le modalità di visualizzazione Originale e Capitoli. Leggere un capitolo o un libro come prosa continua — senza l'interruzione visiva dei numeri di versetto — spesso rivela un argomento, un racconto o un poema che la griglia dei versetti aveva reso quasi invisibile.

