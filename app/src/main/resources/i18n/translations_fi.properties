about.search.body=Yksi hakukenttä kattaa nyt kirjaston jokaisen laitoksen ja kielen — Raamatun, Koraanin, hadithit ja muut — sekä selitykset. Hae sanaa tai ilmausta, niin saat yhden tuloksen jaetta kohden; valitse avattavat käännökset ja vertaa kahta tai useampaa rinnakkain synkronoiduissa sarakkeissa. Voit myös liittää lukijan työkalupalkkiin listan viitteitä, jolloin kukin kohta avautuu omaan sarakkeeseensa kerralla.

