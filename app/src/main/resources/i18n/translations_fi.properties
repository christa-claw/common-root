about.sources.row.quran=Koraani — arabia ja käännökset
about.sources.row.hadith=Hadith-kokoelmat — arabia ja englanti
about.sources.row.lds=Myöhempien aikojen pyhien perusteokset (public domain)
about.sources.note=Lisensoituja käännöksiä (NIV, NASB, NBLA) käytetään luvalla. Lisensoidun sisällön jäljentäminen tai levittäminen tämän alustan ulkopuolella ei ole sallittua. Public domain -tekstejä saa vapaasti käyttää ja jakaa.

about.comments.title=Jaa oivalluksesi
about.comments.body=Luo ilmainen tili jättääksesi kommentteja ja muistiinpanoja mihin tahansa jakeeseen. Merkintäsi ovat oletuksena yksityisiä — jaa ne, jos haluat. Tekstien lukeminen ja opiskelu on aina ilmaista, eikä tiliä tarvita.
about.comments.register=Luo ilmainen tili
about.comments.signIn=Kirjaudu sisään

about.about.title=Tietoa tästä hankkeesta
about.about.p1=Common Root? on riippumaton hanke, joka on rakennettu tekemään abrahamilaisten kirjoitusten vakavasta vertailevasta tutkimuksesta kaikkien ulottuvilla olevaa — niin tutkijoiden, opiskelijoiden kuin uteliaiden lukijoidenkin. Se ei ole sidoksissa mihinkään uskonnolliseen järjestöön tai kustantajaan. Nimi on kutsu: lukea näitä tekstejä rinnakkain ja punnita itse, mitä niillä on yhteistä ja missä ne eroavat.
about.about.p2=Alusta on rakennettu avoimen lähdekoodin teknologialle: Java, Vaadin, Spring Boot, BaseX (natiivi XML-tietokanta) ja MySQL (käyttäjätileille ja kommenteille). Vapaan käyttöoikeuden lähdetekstit ovat saatavilla maksutta. Lisensoituja käännöksiä käytetään niiden kustantajien luvalla.
about.about.p3=Uusia käännöksiä, perinteitä ja ominaisuuksia lisätään jatkuvasti. Koraani ja kymmenen Hadith-kokoelmaa ovat nyt lukijassa Raamatun käännösten rinnalla; seuraavaksi tulevat kommentaarien integrointi ja ristiviittauslinkit.

about.support.title=Tue hanketta
about.support.body=Common Root? on ilmainen ja pysyy aina sellaisena. Jos siitä on sinulle hyötyä, tuki auttaa kattamaan palvelinkustannukset, lisensoitujen käännösten käyttöoikeudet ja ajan uusien tekstien ja ominaisuuksien lisäämiseen.
about.support.cta=♥ Tue GitHubissa

