about.sources.download=Jokaisen vapaasti käytettävän laitoksen voi ladata kokonaisuudessaan — samana XML:nä, jota lukija itsekin lukee: kirjat, luvut, jakeet ja lukujärjestykset religious-text.xsd-skeeman mukaisesti. Ei tiliä, ei vientivaihetta, ei verkkosivun kaapimista tekstin saamiseksi, joka ei koskaan ollut meidän pantattavaksemme. Lisensoituja laitoksia ei jaeta sieltä, ja päätepiste ratkaisee sen lukemalla kunkin tekstin oman lisenssin sen sijaan, että luottaisi listaan.
