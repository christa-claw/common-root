about.texts.hadithHeader=Hadith-kokoelmat
about.texts.hadithNote=Kunkin kokoelman arabiankielinen matn on klassinen ja vapaasti käytettävissä (public domain). Englanninkieliset käännökset tarjotaan hadith-api:n kautta, ja niiden alkuperää tarkistetaan kokoelmakohtaisesti.
