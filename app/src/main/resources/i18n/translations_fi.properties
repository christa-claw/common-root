# === Landing page (AboutView) — Suomi ===
about.nav.openReader=Siirry lukijaan

about.hero.title=Tutki kirjoituksia, jotka muokkaavat maailmaamme
about.hero.subtitle=Ilmainen lukija jolla pystyy tutkimaan Abrahamilaisten uskontojen kirjituksia — Raamatun käännöksiä, Koraanin versioita, Haditheja, ja kommentaareja — rinnakkain, alkukielillään ja käännöksinä, kuinka syvällisesti tahansa.
about.hero.cta=Avaa lukija →

about.howto.title=Lukijan käyttöohje
about.howto.intro=Lukija rakentuu palstoista. Jokainen palsta näyttää yhden tekstin — Raamatun käännöksen, Koraanin, kommentaarin tai omat muistiinpanosi. Voit avata niin monta palstaa kuin haluat ja yhdistellä perinteitä vapaasti.
about.howto.step1.title=Valitse lähde
about.howto.step1.body=Napsauta palstan otsikossa »Valitse lähde...» ja valitse mikä tahansa käännös tai teksti pudotusvalikosta.
about.howto.step2.title=Liiku tekstissä
about.howto.step2.body=Käytä kirjavalitsinta ja lukunuolia siirtyäksesi mihin tahansa kohtaan. Tai vieritä vain — lukija lataa seuraavan luvun automaattisesti, kun saavut loppuun.
about.howto.step3.title=Lisää palstoja
about.howto.step3.body=Napsauta työkalupalkin »Lisää palsta» avataksesi toisen tai kolmannen tekstin ensimmäisen rinnalle. Vertaa käännöksiä tai perinteitä rinnakkain.
about.howto.step4.title=Synkronoi tai selaa vapaasti
about.howto.step4.body=Palstat vierivät oletuksena yhdessä. Napsauta minkä tahansa palstan otsikon linkkikuvaketta 🔗 irrottaaksesi sen ja selataksesi sitä itsenäisesti.
about.howto.step5.title=Vaihda näyttötilaa
about.howto.step5.body=Vaihda palstakohtaisesti tilojen Alkuperäinen, Luvut (1227), Jakeet (1551) ja Otsikot välillä otsikon pudotusvalikosta. Alta löydät selityksen siitä, mitä ne tarkoittavat.
about.howto.step6.title=Seuraa kommentaarien linkkejä
about.howto.step6.body=Kun kommentaari viittaa jakeeseen, napsauta linkkiä — kaikki avoimet Raamattu-palstat siirtyvät automaattisesti kyseiseen kohtaan.
about.howto.step7.title=Hae kaikesta
about.howto.step7.body=Napsauta työkalupalkin 🔍-kuvaketta hakeaksesi kaikista jakeista ja kommenteista kerralla. Mikä tahansa tulos avautuu suoraan kyseiseen kohtaan uudessa sarakkeessa.

about.modes.title=Näyttötilojen ymmärtäminen
about.modes.intro=Kunkin palstan otsikossa oleva näyttötilan valitsin määrää, miten teksti esitetään. Jokainen tila heijastaa eri kerrosta toimituksellista historiaa — osa muinaista, osa yllättävän tuoretta. Sen ymmärtäminen, mistä nämä jaottelut ovat peräisin, muuttaa tapaasi lukea.
about.modes.original.label=Alkuperäinen
about.modes.original.subtitle=Scriptio continua
about.modes.original.p1=Vanhimmat raamatulliset käsikirjoitukset — niin Uuden testamentin kreikkalaiset papyrukset kuin suuret heprealaiset koodeksit — kirjoitettiin yhtäjaksoisella suuraakkoskirjoituksella ilman välilyöntejä, välimerkkejä, lukujakoja tai jaenumeroita. Lukijan oletettiin tuntevan tekstin jo niin hyvin, että osasi jäsentää sen.
about.modes.original.p2=Tämä tila luo uudelleen sen kokemuksen. Se on tarkoituksella haastava. Sen lukeminen pakottaa kohtaamaan tekstin niin kuin varhaisimmat lukijat — yhtenäisenä argumenttina tai kertomuksena, ei kokoelmana irrallisia, lainattavia katkelmia. Monet tutkijat pitävät tätä rehellisimpänä tapana kohdata kirjoittajien alkuperäinen tarkoitus.
about.modes.simplified.label=Yksinkertaistettu
about.modes.simplified.subtitle=Luettava jatkuva teksti
about.modes.simplified.p1=Tämä tila säilyttää alkuperäisen yhtenäisen, jakamattoman virtauksen, mutta palauttaa sen, minkä kirjurit lisäsivät seuraavien vuosisatojen aikana — sanavälit, pienaakkoset ja välimerkit. Se kuvastaa todellista historiallista vaihetta: vielä pitkään sen jälkeen, kun tekstit muuttuivat näin luettaviksi, ne levisivät yhä ilman luku- tai jaenumeroita. Langtonin luvut ja Estiennen jakeet olivat vielä vuosisatojen päässä.
about.modes.simplified.p2=Täysi Scriptio continua on tarkoituksella raskas — se riisuu kaiken kerralla, mikä tekee siitä vaikuttavan havainnollistuksen mutta vaikean paikan todella lukea. Tämä yksinkertaistettu tila poistaa vain sen yhden kerroksen, josta tämä osio kertoo: luku- ja jaenumerot, myöhäiset lisäykset, jotka houkuttelevat irrottamaan jakeita asiayhteydestään. Teksti pysyy luettavana, joten voit lukea kokonaisen kirjan jatkuvana argumenttina tai kertomuksena, jollaisena sen kirjoittaja sen kirjoitti, eikä lainattavien ruutujen ruudukkona. Siinä missä täysi Scriptio continua on satunnainen herätys, tämä on arkinen tapa lukea ilman numeroita.
about.modes.chapters.label=Luvut (1227)
about.modes.chapters.subtitle=Lisäsi Stephen Langton
about.modes.chapters.p1=Stephen Langton, englantilainen oppinut, josta tuli Canterburyn arkkipiispa, jakoi Raamatun yhä nykyäänkin käytössä olevaan lukujärjestelmään noin vuonna 1227 jKr. — yli tuhat vuotta tekstien kirjoittamisen jälkeen.
about.modes.chapters.p2=Hänen vaikuttimensa oli käytännöllinen: oppineet tarvitsivat yhdenmukaisen tavan viitata jaksoihin teologisissa kiistoissa. Lukujakoja ei koskaan tarkoitettu jumalallisesti annetuiksi rajoiksi. Langton työskenteli nopeasti valtavan tekstin parissa, ja hänen jakonsa ovat välillä erinomaisia, välillä kömpelöitä — ne katkaisevat kesken argumentin, runon tai jopa lauseen tavalla, joka hämärtää kirjoittajan alkuperäisen ajatuskulun.
about.modes.verses.label=Jakeet (1551)
about.modes.verses.subtitle=Lisäsi Robert Estienne
about.modes.verses.p1=Jaenumerot lisäsi Uuteen testamenttiin vuonna 1551 ranskalainen kirjanpainaja Robert Estienne, joka tunnettiin myös nimellä Stephanus. Poikansa mukaan hän teki jaotukset inter equitandum – "ratsain" – matkallaan Pariisista Lyoniin. Kuva siitä, kuinka joku numeroi jakeita satulassa, on kuuluisa mutta kiistelty; kuten kuka tahansa ratsastaja tietää, se ei liikkeessä juuri onnistu, ja tutkijat epäilevät, että hän teki työn oikeastaan iltaisin matkan varren majataloissa. Oli miten oli, matkan kiire saattaa selittää jotkin hämmentävimmistä jaoista.
about.modes.verses.p2=Vanhan testamentin jaejärjestelmä seurasi pian perässä. Lukujen tapaan jakeet lisättiin puhtaasti viittaamisen helpottamiseksi. Sittemmin ne ovat muovanneet sitä, miten miljardit ihmiset lukevat ja lainaavat Raamattua — usein irrottaen katkelmat asiayhteydestään tavoilla, joita alkuperäiset kirjoittajat eivät koskaan tarkoittaneet eivätkä ennakoineet.
about.modes.titles.label=Otsikot
about.modes.titles.subtitle=Toimitukselliset väliotsikot
about.modes.titles.p1=Väliotsikot — joita joskus kutsutaan perikoopeiksi — ovat kustantajien ja kääntäjien lisäämiä toimituksellisia otsikoita, jotka auttavat lukijaa suunnistamaan. Ne eivät kuulu mihinkään alkuperäiseen käsikirjoitukseen.
about.modes.titles.p2=Ne vaihtelevat huomattavasti käännösten välillä: NIV käyttää niitä runsaasti, kun taas KJV:ssä niitä ei ole lainkaan. Jotkin otsikot ovat hyödyllisiä tiivistelmiä; toiset tyrkyttävät jaksolle teologisen tulkinnan ennen kuin olet lukenut sanaakaan. Lukeminen ensin ilman otsikoita ja sitten niiden kanssa voi olla paljastava harjoitus.

about.problems.title=Kun jaottelut vääristävät tekstiä
about.problems.intro=Luku- ja jaejaottelut ovat muovanneet sitä, miten miljardit ihmiset lukevat Raamattua — mutta ne lisäsivät inhimilliset toimittajat vuosisatoja tekstien kirjoittamisen jälkeen, ja toisinaan ne leikkaavat alkuperäisen argumentin poikki tavalla, joka todella muuttaa merkitystä. Seuraavassa on joitakin merkittävimmistä esimerkeistä.
about.problems.isaiah.ref=Jesaja 52:13 – 53:12
about.problems.isaiah.title=Kahtia leikattu profetia
about.problems.isaiah.p1=Lukujako Jesajan 53. luvun kohdalla halkaisee sen, mikä on todellisuudessa yksi yhtenäinen runo — jota usein kutsutaan neljänneksi Herran palvelijan lauluksi. Runo alkaa jakeesta Jesaja 52:13: »Katso, minun palvelijani menestyy; hänet korotetaan ja ylennetään, ja hän kohoaa hyvin korkealle.» Tämä avaussäkeistö (52:13–15) pohjustaa koko sitä jaksoa, joka seuraa luvussa 53 ja jonka kristityt lukevat ristiinnaulitsemisen profetiaksi.
about.problems.isaiah.p2=Koska lukujako sijoittaa jakeet 52:13–15 siihen, mitä lukijat pitävät »Jesajan lukuna 52», ja varsinaisen rungon »Jesajan lukuun 53», avausjakeet jäävät usein huomaamatta. Runo lainataan rutiininomaisesti alkaen jakeesta 53:1, jolloin sen dramaattinen avaus katoaa. Sen lukeminen yhtenä katkeamattomana jaksona — niin kuin alkuperäinen teksti sen esittää — palauttaa profetian koko kaaren.
about.problems.romans.ref=Roomalaiskirje 7 – 8
about.problems.romans.title=»Niin siis», joka menetti »koska»-perustelunsa
about.problems.romans.p1=Roomalaiskirjeen 8. luku alkaa yhdellä Uuden testamentin kuuluisimmista lauseista: »Niin ei nyt siis ole mitään kadotustuomiota niille, jotka ovat Kristuksessa Jeesuksessa.» Sana »niin siis» tekee ratkaisevaa työtä — se osoittaa, että Paavali tekee johtopäätöksen juuri esittämästään argumentista.
about.problems.romans.p2=Mutta lukujako erottaa johtopäätöksen argumentista. Ne, jotka aloittavat luvusta 8, kohtaavat väitteen ilman sen perustelua. Paavalin argumentti lihan ja hengen taistelusta luvussa 7 on suora perusta luvun 8 varmuudelle. Lukujako on osaltaan johtanut siihen, että Roomalaiskirje 8:1 luetaan itsenäisenä lupauksena eikä pitkän teologisen argumentin huipentumana.
about.problems.philippians.ref=Filippiläiskirje 4:13
about.problems.philippians.title=Raamatun väärimmin lainattu jae
about.problems.philippians.p1=»Kaikki minä voin hänessä, joka minua vahvistaa» on yksi Raamatun laajimmin lainatuista jakeista — painettuna tuotteisiin, lausuttuna ennen urheilukilpailuja ja vedottuna yleisenä lupauksena jumalallisesta voimasta.
about.problems.philippians.p2=Asiayhteydessään Paavali puhuu jostakin paljon täsmällisemmästä ja paljon vaativammasta: tyytyväisyydestä köyhyydessä. Ympäröivät jakeet kuuluvat: »Olen oppinut tulemaan toimeen sillä, mitä minulla on. Osaan elää niukkuudessa, osaan myös runsaudessa.» Se »kaikki», minkä Paavali voi Kristuksessa, on kestää mikä tahansa tilanne — yltäkylläisyys tai puute — tyynesti. Jaejako irrotti jakeen tästä yhteydestä ja muutti opetuksen kärsimyksen arvokkaasta kestämisestä menestyksen iskulauseeksi.
about.problems.jeremiah.ref=Jeremia 29:11
about.problems.jeremiah.title=Lupaus pakkosiirtolaisille, ei yksilöille
about.problems.jeremiah.p1=»Sillä minä tunnen ajatukseni, jotka minulla on teitä kohtaan, sanoo Herra: rauhan eikä turmion ajatukset, antaakseni teille tulevaisuuden ja toivon» on yksi nykyajan kristillisen kulttuurin suosituimmista jakeista, jota sovelletaan usein henkilökohtaisena jumalallisena lupauksena.
about.problems.jeremiah.p2=Asiayhteydessään Jumala puhuu koko Babyloniaan karkotetun Israelin kansan yhteisölle — ja kertoo heille jotakin, mitä he eivät halunneet kuulla: että pakkosiirtolaisuus kestäisi seitsemänkymmentä vuotta. Toivoa täynnä oleva jae on upotettu kirjeeseen, joka kehottaa pakkosiirtolaisia asettumaan Babyloniaan, rakentamaan taloja, istuttamaan puutarhoja ja hyväksymään, etteivät he palaa elinaikanaan. Lupaus on todellinen — mutta se on yhteisöllinen, pitkäaikainen ja sitä edeltää vuosikymmenten kärsimys. Jaejako teki helpoksi poimia lohdutuksen ja jättää asiayhteyden taakse.
about.problems.john.ref=Johannes 11:35
about.problems.john.title=Lyhin jae ja se, minkä se menetti
about.problems.john.p1=»Jeesus itki» on Raamatun lyhin jae — piirre, joka on tehnyt siitä kuuluisan, usein lainatun ja laajalti irrallaan ulkoa opetellun.
about.problems.john.p2=Alkukielisessä kreikassa jae on osa yhtenäistä tunnepitoista kohtausta: Jeesus saapuu Lasaruksen haudalle, näkee Marian itkevän, näkee väkijoukon itkevän ja »järkyttyi hengessään ja tuli syvästi liikuttuneeksi» — ilmaus, joka kreikaksi (embrimaomai) kantaa vihan tai kuohunnan sävyä, ei pelkkää surua. Tutkijat kiistelevät siitä, itkikö Jeesus surusta, myötätunnosta surevia kohtaan vai jostakin monimutkaisemmasta. Jaejako on supistanut teologisesti rikkaan hetken liikuttavaksi anekdootiksi siitä, miten Jeesus jakaa inhimillisen tunteen.
about.problems.callout.title=Jakeiden irrottelu asiayhteydestä ja jaejärjestelmä
about.problems.callout.p1=Jaejärjestelmä loi tahattomasti edellytykset »proof-textingille» — käytännölle, jossa lainataan yksittäistä jaetta tukemaan teologista tai moraalista kantaa ottamatta huomioon sitä ympäröivää argumenttia. Tämä on muovannut sekä tieteellistä keskustelua että populaarikulttuuria. Asiayhteydestään irrotettu jae voi näyttää sanovan lähes päinvastaista kuin kirjoittaja tarkoitti.
about.problems.callout.p2=Juuri tästä syystä Alkuperäinen- ja Luvut-näyttötilat ovat olemassa. Luvun tai kirjan lukeminen yhtäjaksoisena proosana — ilman jaenumeroiden visuaalista keskeytystä — paljastaa usein argumentin, kertomuksen tai runon, jonka jaeruudukko on tehnyt lähes näkymättömäksi.

about.texts.title=Saatavilla olevat tekstit
about.texts.intro=Alusta sisältää tällä hetkellä seuraavat tekstit. Uusia käännöksiä ja perinteitä lisätään säännöllisesti.
