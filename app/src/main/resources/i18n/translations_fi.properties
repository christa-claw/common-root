about.texts.lineageChains=Kirjatut ketjut, lähteenä patch_lineage.py:
about.texts.lineageHow=Raamattusarakkeen yläreunan ▾-painike avaa tämän ketjun jokaisen jakeen alle, yksi puola napsautusta kohden, kunnes se ulottuu alla olevaan hepreaan tai kreikkaan. ▴ sulkee syvimmän puolan jälleen. Jokaisessa puolassa on laitoksensa lyhenne ja vuosi — ”GNV 1599” — joten lukutavan kulkema matka on jotain, minkä voit nähdä, ei jotain, minkä me väitämme.
about.texts.lineageIntro=Käännökset eivät ole riippumattomia todistajia. King Jamesin kääntäjät työskentelivät Bishops' Biblen pohjalta Tyndale ja Geneve käsillään; Revised Version korjasi King Jamesia; American Standard tarkisti Revisedin; World English Bible nykyaikaisti American Standardin. Neljä vuosisataa kääntäjiä, kukin lukemassa edeltäjänsä olan yli.
about.texts.lineageModes=Puolat ovat jaekohtaisia, joten painikkeet näkyvät vain Jakeet- ja Otsikot-näyttötiloissa. Alkuperäinen, Jatkuva ja Luvut säilyttävät katkeamattoman virtansa; niissä asetettu syvyys säilyy hiljaisesti ja palaa, kun vaihdat takaisin. Askellus on myös sisältötietoista — puolat, joilla ei ole sanottavaa juuri lukemastasi kirjasta, ohitetaan, joten vieritys Vanhasta testamentista Uuteen vaihtaa heprealaisen todistajan kreikkalaiseen ilman napsautusta.
about.texts.lineageTitle=Käännösten sukulinjat — minkä varassa laitos seisoo
about.texts.lineageWitness=≈-merkityt puolat ovat alkukielisiä todistajia. Ne näytetään, koska jokainen käännös lepää viime kädessä heprean ja kreikan varassa — ei siksi, että laitos nimeäisi ne lähteikseen; Westminsterin Leningradin koodeksi ja Textus Receptus edustavat tuota pohjaa. Tämä on todellinen rajoitus, ei väite: nykyaikainen käännös kuten NIV tai NASB työskentelee tekstikriittisten laitosten pohjalta, joita ei vielä ole tässä korpuksessa, joten sen tikkaat ovat yksi ≈-puola eivätkä ketju. Laitoksen puuttuminen yllä olevasta listasta tarkoittaa, ettemme ole kirjanneet sen syntyperää — ei, ettei sillä olisi sellaista.
