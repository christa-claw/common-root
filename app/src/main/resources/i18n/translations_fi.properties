# ── Koraani-osio ─────────────────────────────────────────────────────
about.quran.title=Koraani
about.quran.intro=Siinä missä Raamatun luvut ja jakeet liitettiin tekstiin vuosisatoja sen kirjoittamisen jälkeen, Koraani saapui rakenne valmiina. Sen jako 114 suuraan ja niiden sisältämiin jakeisiin kuuluu tekstiin sellaisena kuin se välitettiin — ei myöhemmin päälle asetettuna toimituksellisena ruudukkona. Sen sijaan Koraani tarjoaa vertailevalle lukijalle kaksi tapaa kulkea saman tekstin läpi sekä erottelun alkutekstin ja sen käännösten välillä, mikä vaikuttaa siihen, miten sitä luetaan.
about.quran.original.title=Suura ja jae: alkuperäinen, ei toimituksellinen
about.quran.original.p1=Suura on luku; jae (arabiaksi āya, kirjaimellisesti "merkki") on säe. Toisin kuin Raamatun luku- ja jaenumerot — jotka Stephen Langton lisäsi noin vuonna 1227 ja Robert Estienne vuonna 1551 — Koraanin suurat ja jakeet kuuluvat tekstin omaan rakenteeseen ja ovat olleet siinä varhaisimmasta välityksestä lähtien.
about.quran.original.p2=Niinpä "Numeroidut jakeet" -tilassa lukeminen ei täällä pura keskiaikaista lisäkerrosta, kuten Raamatun kohdalla; numerointi on tekstille ominaista.
about.quran.standardization.title=Yksi teksti, tarkoituksella
about.quran.standardization.p1=Koraani sellaisena kuin se nykyään leviää heijastaa tietoista vakiinnuttamista. Perinteisen kertomuksen mukaan noin kaksi vuosikymmentä Profeetan kuoleman jälkeen kalifi Uthman — kohdatessaan alueellisia yhteisöjä, jotka resitoivat toisistaan poikkeavin tavoin — antoi vahvistaa arvovaltaisen kirjoitetun tekstin ja lähettää kopiot tärkeimpiin keskuksiin, ja määräsi kilpailevat tekstilaitokset hävitettäviksi. Joidenkin merkittävien seuralaisten muistetaan omistaneen henkilökohtaisia tekstilaitoksia, jotka poikkesivat paikoin sanamuodoltaan tai suurien järjestykseltään.
about.quran.standardization.p2=Siinä missä Raamatun teksti muotoutui monien käsien kautta vuosisatojen kuluessa, Koraanin teksti vakiinnutettiin varhain ja tarkoituksella yhdeksi viralliseksi laitokseksi — toisenlaista toimituksellista historiaa, mutta toimituksellista historiaa kuitenkin.
about.quran.orders.title=Kaksi järjestystä: resitaatio ja ilmoitus
about.quran.orders.p1=Koraani, jonka yleensä näet — mushaf — ei ole järjestetty siinä järjestyksessä kuin se ilmoitettiin. Avaussuuran, Al-Fatihan, jälkeen suurat etenevät suunnilleen pisimmästä lyhimpään: tämä on resitaation ja ulkoa opettelun järjestys, ei aikajärjestys. Ilmoituksen järjestys on toinen — se alkaa varhaisten Mekan vuosien lyhyistä, kiireellisistä suurista ja kehittyy noin kahden vuosikymmenen aikana.
about.quran.orders.p2=Tämä lukija antaa sinun vaihtaa näiden kahden välillä, niin että voit lukea tekstin sellaisena kuin se resitoidaan tai seurata sitä sellaisena kuin se ilmoitettiin. (Ilmoituksen tarkka järjestys on tutkijoiden rekonstruoima ja paikoin kiistanalainen.)
about.quran.meccaMedina.title=Mekkalaiset ja medinalaiset
about.quran.meccaMedina.p1=Perinne jakaa suurat Mekassa ilmoitettuihin ja myöhemmin Medinassa ilmoitettuihin. Mekkalaiset suurat ovat tavallisesti lyhyempiä ja runollisempia — ne käsittelevät Jumalan ykseyttä, ylösnousemusta ja tulevaa tilinteon hetkeä. Medinalaiset suurat ovat tavallisesti pidempiä ja käsittelevät enemmän lakia, yhteisöä ja vakiintuneen yhteiskunnan elämää.
about.quran.meccaMedina.p2=Sen tietäminen, onko jokin kohta mekkalainen vai medinalainen, muuttaa usein sen lukutapaa — aivan kuten raamatunkohdan asiayhteys.
about.quran.translations.title=Arabia ja sen käännökset
about.quran.translations.p1=Islamilaisessa perinteessä Koraani on itse arabiankielinen teksti; käännöstä pidetään pikemminkin sen merkityksen tulkintana kuin varsinaisena Koraanina — siksi kääntäjät otsikoivat teoksensa "Loistokkaan Koraanin merkitys" tai "tulkinta".
about.quran.translations.p2=Tämä lukija pitää tuon erottelun näkyvissä: arabiankielinen laitos on perusteksti, ja käännös voidaan näyttää kunkin jakeen alla sen sijaan, että se korvaisi jakeen, niin että luet alkutekstin ja sen toisinnon yhtä aikaa.
about.quran.callout.title=Koraanin lukeminen täällä
about.quran.callout.p1=Kaksi ominaisuutta on rakennettu juuri tähän. Järjestyksen vaihtokytkin siirtää sinut resitoidun järjestyksen ja ilmoituksen järjestyksen välillä. Käännöskumppani asettaa toisinnon kunkin arabiankielisen jakeen alle, rivi riviltä lukittuna, niin että alkuteksti pysyy ensisijaisena ja käännös tukee sitä.
about.quran.callout.p2=Tavoite on sama kuin Raamatun kohdalla — antaa tekstin tulla luetuksi omilla ehdoillaan ja tehdä toimitukselliset ja tulkinnalliset kerrokset näkyviksi näkymättömien sijaan.

