about.sources.title=Lähteet ja attribuutio
about.sources.intro=Kaikki tekstit ovat peräisin maineikkailta vapaan käyttöoikeuden (public domain) tai lisensoiduilta tarjoajilta. Sitoudumme asianmukaiseen lähdeviittaukseen jokaisen tällä alustalla olevan tekstin osalta. Siellä missä lisenssi sen sallii, koko teksti tarjotaan vapaasti henkilökohtaiseen opiskeluun.
