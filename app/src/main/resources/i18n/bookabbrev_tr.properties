# Turkish book abbreviations, USFM code = comma-separated forms.
# RefListParser normalises each form (lower-case via Locale.ROOT, strip
# spaces/dots/punctuation), so "1. Ko.", "1 Ko" and "1Ko" collapse together.
# Primary forms follow the Kutsal Kitap (Yeni Çeviri) abbreviations; older
# Kitab-ı Mukaddes (1941) book names are added as alternates so references in
# either naming tradition resolve. Full modern names live in booknames_tr.
