about.about.title=About This Project
about.about.p1=Common Root? is an independent project built to make serious comparative study of the Abrahamic scriptures accessible to everyone — scholars, students, and curious readers alike. It is not affiliated with any religious organisation or publisher. The name is an invitation: to read these texts side by side and weigh for yourself what they share and where they diverge.
about.about.p2=The platform is built on open-source technology: Java, Vaadin, Spring Boot, BaseX (a native XML database), and MySQL (for user accounts and comments). Source texts from the public domain are available freely. Licensed translations are used with permission from their publishers.
about.about.p3=New translations, traditions, and features are added continuously. The Qur'an and ten Hadith collections are now in the reader alongside the Bible translations, and full-text search across every text and comment is built in; commentary integration and cross-reference links are next.

about.support.title=Support the Project
about.support.body=Common Root? is free and always will be. If it's useful to you, sponsorship helps cover hosting, licensed translation access, and the time to add new texts and features.
