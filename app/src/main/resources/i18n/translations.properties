# ── The Qur'an landing section ───────────────────────────────────────
about.quran.title=The Qur'an
about.quran.intro=Where the Bible's chapters and verses were imposed on the text centuries after it was written, the Qur'an arrived with its structure intact. Its division into 114 surahs, and the ayat within them, belongs to the text as it was transmitted — not a later editorial grid laid over it. What the Qur'an offers the comparative reader instead is two ways through the same text, and a distinction between the original and its translations that shapes how it is read.
about.quran.original.title=Surah and ayah: original, not editorial
about.quran.original.p1=A surah is a chapter; an ayah (literally "a sign") is a verse. Unlike the Bible's chapter and verse numbers — added by Stephen Langton around 1227 and Robert Estienne in 1551 — the Qur'an's surahs and ayat belong to the text's own structure, present from its earliest transmission.
about.quran.original.p2=Reading in "Numbered ayat" mode here is therefore not undoing a medieval overlay, as it is with the Bible; the numbering is native to the text.
about.quran.standardization.title=One text, by design
about.quran.standardization.p1=The Qur'an as it circulates today reflects a deliberate standardization. In the traditional account, about two decades after the Prophet's death the caliph Uthman, faced with regional communities reciting in divergent ways, had an authoritative written text established and copies sent to the major centres — and ordered the competing codices destroyed. Some prominent companions are remembered as having had personal codices that differed in places, in wording or in the ordering of surahs.
about.quran.standardization.p2=Where the Bible's text was shaped by many hands over centuries, the Qur'an's was fixed early and deliberately into a single official recension — a different kind of editorial history, but an editorial history nonetheless.
about.quran.orders.title=Two orders: recitation and revelation
about.quran.orders.p1=The Qur'an you usually see — the mushaf — is not arranged in the order it was revealed. After the opening surah, Al-Fatiha, the surahs run broadly from longest to shortest: an order for recitation and memorisation, not chronology. The order of revelation is different — it begins with the short, urgent surahs of the early Meccan years and unfolds over some two decades.
about.quran.orders.p2=This reader lets you switch between the two, so you can read the text as it is recited or follow it as it was revealed. (The exact sequence of revelation is reconstructed by scholars and debated in places.)
about.quran.meccaMedina.title=Meccan and Medinan
about.quran.meccaMedina.p1=Tradition divides the surahs into those revealed at Mecca and those revealed later at Medina. The Meccan surahs tend to be shorter and more poetic — concerned with the oneness of God, the resurrection, and the reckoning to come. The Medinan surahs tend to be longer and more concerned with law, community, and the life of a settled society.
about.quran.meccaMedina.p2=Knowing whether a passage is Meccan or Medinan often changes how it reads, much as a biblical passage's setting does.
about.quran.translations.title=The Arabic and its translations
about.quran.translations.p1=In the Islamic tradition the Qur'an is the Arabic text itself; a translation is regarded as an interpretation of its meaning rather than the Qur'an proper — which is why translators title their work "The Meaning of the Glorious Qur'an" or "an interpretation."
about.quran.translations.p2=This reader keeps that distinction visible: the Arabic edition is the base text, and a translation can be shown beneath each ayah rather than in place of it, so you read the original and a rendering of it together.
about.quran.callout.title=Reading the Qur'an here
about.quran.callout.p1=Two features are built for exactly this. The order toggle moves you between the recited order and the order of revelation. The translation companion places a rendering beneath each Arabic ayah, locked line for line, so the original stays primary and the translation supports it.
about.quran.callout.p2=The aim is the same as with the Bible — to let the text be read on its own terms, and to make the editorial and interpretive layers visible rather than invisible.

