about.nav.openReader=Open Reader

about.hero.title=Study the Texts That Shape our World
about.hero.subtitle=A free, open reader for exploring the scriptures of the Abrahamic faiths — Bible translations, the Quran, Hadith, and commentaries — side by side, in their original languages and translation, at any depth.
about.hero.cta=Open the Reader →

about.howto.title=How to Use the Reader
about.howto.intro=The reader is built around columns. Each column shows one text — a Bible translation, the Quran, a commentary, or your own notes. You can open as many columns as you like and mix traditions freely.
about.howto.step1.title=Choose a Source
about.howto.step1.body=Click "Select source..." in the column header and pick any translation or text from the dropdown.
about.howto.step2.title=Navigate
about.howto.step2.body=Use the book selector and chapter arrows to jump anywhere. Or just scroll — the reader loads the next chapter automatically as you reach the bottom.
about.howto.step3.title=Add More Columns
about.howto.step3.body=Click "Add Column" in the toolbar to open a second or third text alongside the first. Compare translations or traditions side by side.
about.howto.step4.title=Sync or Browse Freely
about.howto.step4.body=Columns scroll together by default. Click the 🔗 link icon in any column header to unlink it and browse that column independently.
about.howto.step5.title=Change Display Mode
about.howto.step5.body=Switch between Original, Chapters (1227), Verses (1551), and Titles modes per column using the dropdown in the header. See below for what these mean.
about.howto.step6.title=Follow Commentary Links
about.howto.step6.body=When a commentary references a verse, click the link — all open Bible columns jump to that passage automatically.
about.howto.step7.title=Search Everything
about.howto.step7.body=Click the 🔍 icon in the toolbar to search across every verse and comment at once. Any result jumps straight to the passage in a new column.

about.modes.title=Understanding the Display Modes
about.modes.intro=The display mode selector in each column header controls how the text is presented. Each mode reflects a different layer of editorial history — some ancient, some surprisingly recent. Understanding where these divisions come from changes how you read.
about.modes.original.label=Original
about.modes.original.subtitle=Scriptio Continua
about.modes.original.p1=The earliest biblical manuscripts — whether Greek papyri of the New Testament or the great Hebrew codices — were written in continuous uppercase script with no spaces, no punctuation, no chapter breaks, and no verse numbers. Readers were expected to already know the text well enough to parse it.
about.modes.original.p2=This mode recreates that experience. It is deliberately challenging. Reading it forces you to engage with the text as the earliest readers did — as a continuous argument or narrative, not a collection of isolated quotable fragments. Many scholars argue this is the most honest way to encounter the original intent of the authors.
about.modes.simplified.label=Simplified
about.modes.simplified.subtitle=Readable Continuous Text
about.modes.simplified.p1=This mode keeps the continuous, undivided flow of the original but restores what scribes added over the following centuries — word spaces, lower-case letters, and punctuation. It reflects a real historical interval: long after texts became readable in this way, they still circulated with no chapter or verse numbers. Langton's chapters and Estienne's verses were centuries in the future.
about.modes.simplified.p2=The full Scriptio Continua is deliberately punishing — it strips everything at once, which makes it a striking demonstration but a hard place to actually read. This simplified mode removes only the one layer this section is about: the chapter and verse numbering, the late additions that invite proof-texting. The text stays legible, so you can read an entire book as the continuous argument or narrative its author wrote, rather than a grid of quotable cells. Where the full Scriptio Continua is the occasional jolt, this is the everyday way to read without the numbers.
about.modes.chapters.label=Chapters (1227)
about.modes.chapters.subtitle=Added by Stephen Langton
about.modes.chapters.p1=Stephen Langton, an English scholar who became Archbishop of Canterbury, divided the Bible into the chapter system still in use today around 1227 AD — more than a thousand years after the texts were written.
about.modes.chapters.p2=His motivation was practical: scholars needed a consistent way to cite passages in theological debates. The chapter divisions were never intended as inspired boundaries. Langton worked quickly across an enormous text, and his divisions are sometimes excellent and sometimes jarring — cutting mid-argument, mid-poem, or even mid-sentence in ways that obscure the author's original flow.
about.modes.verses.label=Verses (1551)
about.modes.verses.subtitle=Added by Robert Estienne
about.modes.verses.p1=Verse numbers were added to the New Testament in 1551 by Robert Estienne, a French printer also known as Stephanus. His son said he made the divisions inter equitandum — "while riding" — on the road from Paris to Lyon. The image of numbering verses from the saddle is famous but disputed; as anyone who rides can attest, it is hardly possible in motion, and scholars suspect he actually worked at the inns each evening. Whatever the posture, the haste of the trip may explain some of the more puzzling divisions.
about.modes.verses.p2=The Old Testament verse system followed shortly after. Like chapters, verses were added purely for reference convenience. They have since shaped how billions of people read and quote scripture — often in ways that isolate fragments from their context in ways the original authors never intended or anticipated.
about.modes.titles.label=Titles
about.modes.titles.subtitle=Editorial Section Headings
about.modes.titles.p1=Section titles — sometimes called pericopes — are editorial headings added by publishers and translators to help readers navigate. They are not part of any original manuscript.
about.modes.titles.p2=They vary significantly between translations: the NIV uses them extensively, while the KJV has none at all. Some titles are helpful summaries; others impose a theological interpretation on a passage before you have read a single word. Reading without titles first, then with, can be a revealing exercise.
about.modes.openInReader=Open the reader in this mode

about.problems.title=When Divisions Distort the Text
about.problems.intro=Chapter and verse divisions have shaped how billions of people read scripture — but they were added by human editors centuries after the texts were written, and they sometimes cut across the original argument in ways that genuinely change the meaning. The following are among the most significant examples.
about.problems.isaiah.ref=Isaiah 52:13 – 53:12
about.problems.isaiah.title=A Prophecy Split in Two
about.problems.isaiah.p1=The chapter break at Isaiah 53 cuts through what is actually one continuous poem — often called the fourth Servant Song. The poem begins at Isaiah 52:13 with "See, my servant will act wisely; he will be raised and lifted up and highly exalted." This opening stanza (52:13–15) sets up the entire passage that follows in chapter 53, which Christians read as a prophecy of the crucifixion.
about.problems.isaiah.p2=Because the chapter division places 52:13–15 in what readers think of as "Isaiah 52" and the main body in "Isaiah 53", the opening verses are frequently overlooked. The poem is routinely cited beginning at 53:1, losing its dramatic opening. Reading it as one unbroken passage — as the original text presents it — restores the full arc of the prophecy.
about.problems.romans.ref=Romans 7 – 8
about.problems.romans.title=The "Therefore" That Lost Its "Because"
about.problems.romans.p1=Romans 8 opens with one of the most famous lines in the New Testament: "Therefore, there is now no condemnation for those who are in Christ Jesus." The word "therefore" is doing critical work — it signals that Paul is drawing a conclusion from an argument he has just made.
about.problems.romans.p2=But the chapter break separates the conclusion from the argument. Readers who begin at chapter 8 encounter a declaration without its proof. Paul's argument about the struggle between flesh and spirit in chapter 7 is the direct foundation for the assurance in chapter 8. The chapter division has contributed to Romans 8:1 being read as a standalone promise rather than the climax of a sustained theological argument.
about.problems.philippians.ref=Philippians 4:13
about.problems.philippians.title=The Most Misquoted Verse in Scripture
about.problems.philippians.p1="I can do all things through Christ who strengthens me" is one of the most widely quoted verses in the Bible — printed on merchandise, cited before sporting events, and invoked as a general promise of divine empowerment.
about.problems.philippians.p2=In context, Paul is talking about something far more specific and far more challenging: contentment in poverty. The surrounding verses read: "I have learned, in whatever state I am, to be content. I know how to be abased, and I know how to abound." The "all things" Paul can do through Christ is endure any circumstance — abundance or deprivation — with equanimity. The verse division stripped the verse from this context and turned a teaching about suffering gracefully into a slogan about achievement.
about.problems.jeremiah.ref=Jeremiah 29:11
about.problems.jeremiah.title=A Promise to Exiles, Not Individuals
about.problems.jeremiah.p1="For I know the plans I have for you, declares the Lord, plans to prosper you and not to harm you, plans to give you hope and a future" is one of the most popular verses in contemporary Christian culture, frequently applied as a personal divine promise.
about.problems.jeremiah.p2=In context, God is addressing the entire community of Israelites exiled in Babylon — and he is telling them something they did not want to hear: that the exile will last seventy years. The hopeful verse is embedded in a letter telling the exiles to settle in Babylon, build houses, plant gardens, and accept that they will not return in their lifetimes. The promise is real — but it is collective, long-term, and preceded by decades of suffering. Verse division made it easy to extract the comfort while leaving behind the context.
about.problems.john.ref=John 11:35
about.problems.john.title=The Shortest Verse and What It Lost
about.problems.john.p1="Jesus wept" is the shortest verse in the Bible — a distinction that has made it famous, frequently cited, and widely memorised in isolation.
about.problems.john.p2=In the original Greek, the verse is part of a sustained emotional scene: Jesus arriving at the tomb of Lazarus, seeing Mary weeping, seeing the crowd weeping, and being "deeply moved in spirit and troubled" — a phrase that in the Greek (embrimaomai) carries a sense of anger or agitation, not just sadness. Scholars debate whether Jesus wept from grief, from compassion for those grieving, or from something more complex. The verse division has reduced a theologically rich moment to a touching anecdote about Jesus sharing human emotion.
about.problems.callout.title=Proof-Texting and the Verse System
about.problems.callout.p1=The verse system inadvertently created the conditions for "proof-texting" — the practice of citing an isolated verse to support a theological or moral position without reference to its surrounding argument. Both scholarly debate and popular culture have been shaped by this. A verse divorced from its context can appear to say almost the opposite of what the author intended.
about.problems.callout.p2=This is why the Original and Chapters display modes exist. Reading a chapter or book as continuous prose — without the visual interruption of verse numbers — often reveals an argument, narrative, or poem that the verse grid has made almost invisible.
about.problems.openInReader=Read this passage in context

about.texts.title=Available Texts
about.texts.intro=The platform currently includes the following texts. More translations and traditions are being added regularly. Every public-domain text can be taken away whole: the \u2913 on its card downloads the complete edition as a single file \u2014 the same one the reader itself uses, not a cut-down copy.
about.texts.bibleHeader=Bible Translations
about.texts.quranHeader=The Qur'an
about.texts.hadithHeader=Hadith Collections
about.texts.hadithNote=The Arabic matn of each collection is classical and public domain. English translations are served via the hadith-api, and their provenance is being verified per edition.
about.texts.ldsHeader=Latter-day Saint Standard Works
about.texts.ldsNote=The Latter-day Saint (Mormon) standard works, in the public domain — the long-standing text without the copyrighted modern study apparatus (footnotes, chapter summaries, and the Book of Mormon introduction).
about.texts.glossHeader=Interlinear & Study Editions
about.texts.glossNote=These are word-for-word alignment aids, not reading editions \u2014 they follow the grammar of the original language rather than the sense of the receiving one, so they read awkwardly by design. The Emphatic Diaglott's sublinear gloss and Benjamin Wilson's own published Emphatic Version differ at John 1:1: the gloss reads \u201cand a god was the Word\u201d, the Emphatic Version \u201cand the LOGOS was God\u201d. Both are Wilson's, printed in the same 1864 volume, and the difference is the point \u2014 a gloss records how the Greek is put together, not how the translator judged it should be read. Cite it as what it is. Following its Griesbach base, this edition omits Acts 8:37 and Luke 17:36; the verse numbering keeps their places empty so the text stays aligned verse-for-verse with the other editions.
about.texts.comingHeader=Coming Soon
about.texts.comingMore=200+ additional translations
about.texts.openInReader=Open this text in the reader
about.texts.lineageTitle=Translation lineage \u2014 what an edition stands on
about.texts.lineageIntro=Translations are not independent witnesses. The King James translators worked from the Bishops' Bible with Tyndale and Geneva at their elbow; the Revised Version corrected the King James; the American Standard revised the Revised; the World English Bible modernised the American Standard. Four centuries of translators, each reading over the last one's shoulder.
about.texts.lineageHow=The \u25BE control at the top of a Bible column opens that chain beneath each verse, one rung per click, until it reaches the Hebrew or Greek underneath. \u25B4 closes the deepest rung again. Every rung carries its edition's abbreviation and year \u2014 \u201cGNV 1599\u201d \u2014 so the distance a reading has travelled is something you can see rather than something we assert.
about.texts.lineageModes=Rungs are verse-granular, so the controls appear only in the Verses and Titles display modes. Original, Continuous and Chapters keep their unbroken flow; a depth you set there persists quietly and returns when you switch back. Stepping is also content-aware \u2014 rungs with nothing to say for the book you are in are skipped, so scrolling from the Old Testament into the New swaps the Hebrew witness for the Greek one without a click.
about.texts.lineageChains=Recorded chains, from patch_lineage.py:
about.texts.lineageWitness=Rungs marked \u2248 are original-language witnesses. They are shown because every translation ultimately rests on the Hebrew and Greek, not because the edition names them as its source \u2014 the Westminster Leningrad Codex and the Textus Receptus stand in for that floor. This is a real limitation, not a claim: a modern translation such as the NIV or the NASB works from critical editions not yet in this corpus, so its ladder is a single \u2248 rung rather than a chain. An edition\u2019s absence from the list above means we have not recorded its ancestry, not that it has none.

