# French book abbreviations (Louis Segond / TOB usage). USFM code = comma-separated.
# DRAFT for native-speaker review (issue #55). Normalised (lower-case, spaces/dots stripped,
# accents kept as letters) before matching, so give the accented and unaccented spelling
# where people type both. Full French names come from booknames_fr.properties.
# Note: "Mc"=Marc (Mark) here, "Jn"=Jean (John) — they override the English Micah / Jonah
# for French users only. Esther is "Est" (not "Es", which reads as Ésaïe).
