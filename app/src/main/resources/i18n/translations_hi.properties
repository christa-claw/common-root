about.about.title=इस परियोजना के बारे में
about.about.p1=Common Root? एक स्वतंत्र परियोजना है, जो इब्राहीमी धर्मग्रंथों के गम्भीर तुलनात्मक अध्ययन को सबके लिए सुलभ बनाने हेतु बनाई गई है — विद्वानों, विद्यार्थियों और जिज्ञासु पाठकों, सभी के लिए। यह किसी धार्मिक संगठन या प्रकाशक से सम्बद्ध नहीं है। नाम स्वयं एक निमंत्रण है: इन ग्रंथों को साथ-साथ पढ़ने और स्वयं तौलने का, कि उनमें क्या साझा है और वे कहाँ अलग होते हैं।
about.about.p2=यह मंच ओपन-सोर्स तकनीक पर बना है: Java, Vaadin, Spring Boot, BaseX (एक मूल XML डेटाबेस) और MySQL (उपयोगकर्ता खातों व टिप्पणियों के लिए)। सार्वजनिक-अधिकार-क्षेत्र के स्रोत-पाठ निःशुल्क उपलब्ध हैं। लाइसेंस-प्राप्त अनुवाद उनके प्रकाशकों की अनुमति से प्रयुक्त हैं।
about.about.p3=नए अनुवाद, परम्पराएँ और सुविधाएँ निरन्तर जोड़ी जाती हैं। क़ुरआन और दस हदीस संग्रह अब बाइबल अनुवादों के साथ रीडर में हैं, और हर पाठ व टिप्पणी में पूर्ण-पाठ खोज अंतर्निहित है; भाष्य-एकीकरण और परस्पर-संदर्भ कड़ियाँ अगली पंक्ति में हैं।

about.support.title=परियोजना का समर्थन करें
about.support.body=Common Root? निःशुल्क है और सदा रहेगा। यदि यह आपके काम आता है, तो प्रायोजन होस्टिंग, लाइसेंस-प्राप्त अनुवादों की पहुँच, और नए पाठ व सुविधाएँ जोड़ने के समय की लागत उठाने में सहायता करता है।
about.support.cta=♥ GitHub पर प्रायोजक बनें

