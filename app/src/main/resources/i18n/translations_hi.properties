about.sources.title=स्रोत और श्रेय
about.sources.intro=सभी पाठ प्रतिष्ठित सार्वजनिक-अधिकार-क्षेत्र या लाइसेंस-प्राप्त प्रदाताओं से लिए गए हैं। इस मंच के हर पाठ के लिए उचित श्रेय देना हमारी प्रतिबद्धता है। जहाँ लाइसेंस अनुमति देता है, पूरा पाठ व्यक्तिगत अध्ययन के लिए निःशुल्क उपलब्ध है।
