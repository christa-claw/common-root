about.search.title=सब में एक साथ खोजें
about.search.body=अब एक ही खोज-बॉक्स पुस्तकालय के हर संस्करण और हर भाषा में फैला है — बाइबल, क़ुरआन, हदीस और अन्य — भाष्य के साथ-साथ। कोई शब्द या वाक्यांश खोजें और आपको प्रति पद एक परिणाम मिलता है; चुनें कि कौन-से अनुवाद खोलें, और दो या अधिक की समकालिक स्तंभों में साथ-साथ तुलना करें। आप रीडर के टूलबार में संदर्भों की सूची चिपकाकर हर अंश को एक साथ अपने-अपने स्तंभ में भी खोल सकते हैं।

