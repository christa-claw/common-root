# ── The Qur'an landing section ───────────────────────────────────────
about.quran.title=क़ुरआन
about.quran.intro=जहाँ बाइबल के अध्याय और पद पाठ पर उसके लिखे जाने के सदियों बाद आरोपित किए गए, वहीं क़ुरआन अपनी संरचना के साथ ही आया। उसका 114 सूरतों में विभाजन, और उनके भीतर की आयतें, पाठ की उसी बनावट का अंग हैं जैसे वह प्रेषित हुआ — कोई बाद की सम्पादकीय जाली नहीं। तुलनात्मक पाठक को क़ुरआन इसके बदले जो देता है, वह है एक ही पाठ से गुज़रने के दो मार्ग, और मूल तथा उसके अनुवादों के बीच वह भेद जो पढ़ने के ढंग को आकार देता है।
about.quran.original.title=सूरह और आयह: मूल, सम्पादकीय नहीं
about.quran.original.p1=सूरह एक अध्याय है; आयह (शाब्दिक अर्थ "एक निशानी") एक पद। बाइबल की अध्याय-पद संख्याओं के विपरीत — जिन्हें स्टीफ़न लैंगटन ने लगभग 1227 में और रॉबर्ट एस्तिएन ने 1551 में जोड़ा — क़ुरआन की सूरतें और आयतें पाठ की अपनी संरचना का हिस्सा हैं, उसके सबसे आरम्भिक प्रेषण से ही उपस्थित।
about.quran.original.p2=अतः यहाँ "क्रमांकित आयतें" शैली में पढ़ना, बाइबल की तरह किसी मध्यकालीन परत को हटाना नहीं है; यह क्रमांकन पाठ का अपना है।
about.quran.standardization.title=एक पाठ, सोच-समझकर
about.quran.standardization.p1=आज प्रचलित क़ुरआन एक सुविचारित मानकीकरण का फल है। पारम्परिक वृत्तान्त के अनुसार, पैग़म्बर के देहान्त के लगभग दो दशक बाद ख़लीफ़ा उस्मान ने, क्षेत्रीय समुदायों के भिन्न-भिन्न पाठों का सामना करते हुए, एक प्रामाणिक लिखित पाठ स्थापित करवाया और प्रतियाँ प्रमुख केन्द्रों को भेजीं — और प्रतिस्पर्धी संहिताओं को नष्ट करने का आदेश दिया। कुछ प्रमुख सहाबियों के बारे में स्मरण है कि उनकी निजी संहिताएँ कहीं-कहीं शब्दों या सूरतों के क्रम में भिन्न थीं।
about.quran.standardization.p2=जहाँ बाइबल का पाठ सदियों में अनेक हाथों से गढ़ा गया, वहीं क़ुरआन का पाठ आरम्भ में ही, सोच-समझकर, एक आधिकारिक संस्करण में स्थिर कर दिया गया — सम्पादकीय इतिहास की एक भिन्न क़िस्म, पर सम्पादकीय इतिहास फिर भी।
about.quran.orders.title=दो क्रम: पाठ का और अवतरण का
about.quran.orders.p1=क़ुरआन जो आप प्रायः देखते हैं — मुसहफ़ — उस क्रम में व्यवस्थित नहीं है जिसमें वह अवतरित हुआ। आरम्भिक सूरह अल-फ़ातिहा के बाद सूरतें मोटे तौर पर सबसे लम्बी से सबसे छोटी की ओर चलती हैं: यह पाठ और कंठस्थ करने का क्रम है, कालक्रम नहीं। अवतरण का क्रम भिन्न है — वह आरम्भिक मक्की वर्षों की छोटी, उत्कट सूरतों से शुरू होकर लगभग दो दशकों में खुलता है।
about.quran.orders.p2=यह रीडर आपको दोनों के बीच बदलने देता है, ताकि आप पाठ को वैसे पढ़ सकें जैसे वह पढ़ा जाता है, या उसका अनुसरण कर सकें जैसे वह अवतरित हुआ। (अवतरण का सटीक क्रम विद्वानों द्वारा पुनर्निर्मित है और कहीं-कहीं विवादित।)
about.quran.meccaMedina.title=मक्की और मदनी
about.quran.meccaMedina.p1=परम्परा सूरतों को मक्का में अवतरित और बाद में मदीना में अवतरित सूरतों में बाँटती है। मक्की सूरतें प्रायः छोटी और अधिक काव्यात्मक होती हैं — परमेश्वर की एकता, पुनरुत्थान और आने वाले हिसाब से सम्बन्धित। मदनी सूरतें प्रायः लम्बी होती हैं और विधि, समुदाय और बसे हुए समाज के जीवन से अधिक जुड़ी होती हैं।
about.quran.meccaMedina.p2=किसी अंश का मक्की या मदनी होना जानना प्रायः उसके पढ़ने का ढंग बदल देता है, ठीक वैसे जैसे किसी बाइबलीय अंश की पृष्ठभूमि।
about.quran.translations.title=अरबी और उसके अनुवाद
about.quran.translations.p1=इस्लामी परम्परा में क़ुरआन स्वयं अरबी पाठ है; अनुवाद को क़ुरआन नहीं, बल्कि उसके अर्थ की व्याख्या माना जाता है — इसीलिए अनुवादक अपनी कृति का शीर्षक "क़ुरआन-ए-मजीद के अर्थ" या "एक व्याख्या" रखते हैं।
about.quran.translations.p2=यह रीडर उस भेद को दृश्य रखता है: अरबी संस्करण आधार-पाठ है, और अनुवाद उसके स्थान पर नहीं, बल्कि हर आयत के नीचे दिखाया जा सकता है — ताकि आप मूल और उसका एक रूपांतर साथ-साथ पढ़ें।
about.quran.callout.title=यहाँ क़ुरआन पढ़ना
about.quran.callout.p1=दो सुविधाएँ ठीक इसी के लिए बनी हैं। क्रम-टॉगल आपको पाठ-क्रम और अवतरण-क्रम के बीच ले जाता है। अनुवाद-सहचर हर अरबी आयत के नीचे, पंक्ति-दर-पंक्ति बद्ध, एक रूपांतर रखता है — ताकि मूल प्रधान रहे और अनुवाद उसका सहारा बने।
about.quran.callout.p2=उद्देश्य वही है जो बाइबल के साथ है — पाठ को उसकी अपनी शर्तों पर पढ़ने देना, और सम्पादकीय व व्याख्यात्मक परतों को अदृश्य नहीं, दृश्य बनाना।

