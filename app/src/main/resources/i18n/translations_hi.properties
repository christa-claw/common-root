about.sources.download=सार्वजनिक क्षेत्र का हर संस्करण पूरा डाउनलोड किया जा सकता है — उसी XML के रूप में जिसे रीडर स्वयं पढ़ता है: religious-text.xsd स्कीमा के अनुसार पुस्तकें, अध्याय और पद। 0.8.5 से यह API के माध्यम से होता है: अपने खाता पृष्ठ पर एक निःशुल्क कुंजी बनाएँ और /api/v1/texts/{token}/download प्राप्त करें। साइट पर पढ़ने के लिए कभी कुंजी की आवश्यकता नहीं; कुंजी केवल डाउनलोड मापती है। लाइसेंस वाले संस्करण नहीं दिए जाते, और API यह प्रत्येक पाठ के अपने लाइसेंस को पढ़कर तय करता है, किसी सूची पर भरोसा करके नहीं।
about.sources.downloadTitle=पाठ अपने साथ ले जाएँ
about.texts.lineageChains=दर्ज शृंखलाएँ, patch_lineage.py से:
about.texts.lineageHow=बाइबल कॉलम के शीर्ष पर ▾ नियंत्रण उस शृंखला को हर पद के नीचे खोलता है, हर क्लिक पर एक पायदान, जब तक वह नीचे की इब्रानी या यूनानी तक न पहुँच जाए। ▴ सबसे गहरे पायदान को फिर बंद कर देता है। हर पायदान पर उसके संस्करण का संक्षिप्त नाम और वर्ष अंकित है — “GNV 1599” — ताकि किसी पाठ-भेद ने जितनी दूरी तय की है, वह आपको दिखे, न कि हमें उसका दावा करना पड़े।
about.texts.lineageIntro=अनुवाद स्वतंत्र गवाह नहीं हैं। किंग जेम्स के अनुवादकों ने बिशप्स बाइबल से काम किया, टिंडेल और जिनेवा उनके पास रहते थे; रिवाइज़्ड वर्शन ने किंग जेम्स को सुधारा; अमेरिकन स्टैंडर्ड ने रिवाइज़्ड को संशोधित किया; वर्ल्ड इंग्लिश बाइबल ने अमेरिकन स्टैंडर्ड को आधुनिक बनाया। चार सदियों के अनुवादक, हर एक अपने से पहले वाले के कंधे के ऊपर से पढ़ता हुआ।
about.texts.lineageModes=पायदान पद-स्तर के हैं, इसलिए नियंत्रण केवल ‘पद’ और ‘शीर्षक’ प्रदर्शन मोड में दिखते हैं। ‘मूल’, ‘अविराम’ और ‘अध्याय’ अपना अटूट प्रवाह बनाए रखते हैं; वहाँ चुनी गई गहराई चुपचाप बनी रहती है और वापस लौटने पर फिर मिल जाती है। कदम सामग्री के प्रति भी सजग हैं — जिस पुस्तक में आप हैं उसके लिए जिन पायदानों के पास कहने को कुछ नहीं, वे छोड़ दिए जाते हैं; पुराने नियम से नए नियम में स्क्रॉल करते ही इब्रानी गवाह बिना क्लिक के यूनानी गवाह से बदल जाता है।
about.texts.lineageTitle=अनुवाद-वंशावली — कोई संस्करण किस पर टिका है
about.texts.lineageWitness=≈ चिह्नित पायदान मूल-भाषा के गवाह हैं। वे इसलिए दिखाए जाते हैं कि हर अनुवाद अंततः इब्रानी और यूनानी पर टिका है — इसलिए नहीं कि संस्करण उन्हें अपना स्रोत बताता है; वेस्टमिंस्टर लेनिनग्राद कोडेक्स और टेक्स्टस रिसेप्टस उस आधार का प्रतिनिधित्व करते हैं। यह एक वास्तविक सीमा है, दावा नहीं: NIV या NASB जैसा आधुनिक अनुवाद ऐसे पाठ-आलोचनात्मक संस्करणों से काम करता है जो अभी इस संग्रह में नहीं हैं, इसलिए उसकी सीढ़ी एक शृंखला नहीं बल्कि अकेला ≈ पायदान है। ऊपर की सूची से किसी संस्करण की अनुपस्थिति का अर्थ है कि हमने उसकी वंशावली दर्ज नहीं की — यह नहीं कि उसकी कोई वंशावली नहीं।
