# Landing page (AboutView)
# ─────────────────────────────────────────────────────────────────────
about.nav.openReader=रीडर खोलें

about.hero.title=उन ग्रंथों का अध्ययन करें जो हमारी दुनिया को आकार देते हैं
about.hero.subtitle=इब्राहीमी धर्मों के धर्मग्रंथों — बाइबल के अनुवाद, क़ुरआन, हदीस और भाष्य — को साथ-साथ, मूल भाषाओं और अनुवादों में, किसी भी गहराई तक पढ़ने के लिए एक निःशुल्क, खुला रीडर।
about.hero.cta=रीडर खोलें →

about.howto.title=रीडर का उपयोग कैसे करें
about.howto.intro=रीडर स्तंभों के इर्द-गिर्द बना है। हर स्तंभ एक पाठ दिखाता है — बाइबल का कोई अनुवाद, क़ुरआन, कोई भाष्य, या आपकी अपनी टिप्पणियाँ। आप जितने चाहें स्तंभ खोल सकते हैं और परम्पराओं को स्वतंत्र रूप से मिला सकते हैं।
about.howto.step1.title=स्रोत चुनें
about.howto.step1.body=स्तंभ शीर्ष में "स्रोत चुनें..." पर क्लिक करें और सूची से कोई भी अनुवाद या पाठ चुनें।
about.howto.step2.title=आगे बढ़ें
about.howto.step2.body=पुस्तक चयनकर्ता और अध्याय तीरों से कहीं भी पहुँचें। या बस स्क्रॉल करें — नीचे पहुँचते ही रीडर अगला अध्याय अपने आप लोड कर देता है।
about.howto.step3.title=और स्तंभ जोड़ें
about.howto.step3.body=टूलबार में "स्तंभ जोड़ें" पर क्लिक करके पहले पाठ के बगल में दूसरा या तीसरा पाठ खोलें। अनुवादों या परम्पराओं की साथ-साथ तुलना करें।
about.howto.step4.title=समकालिक करें या स्वतंत्र रूप से पढ़ें
about.howto.step4.body=स्तंभ सामान्यतः एक साथ स्क्रॉल होते हैं। किसी स्तंभ के शीर्ष में 🔗 कड़ी चिह्न पर क्लिक करके उसे अलग करें और उस स्तंभ को स्वतंत्र रूप से पढ़ें।
about.howto.step5.title=प्रदर्शन शैली बदलें
about.howto.step5.body=हर स्तंभ के शीर्ष में मौजूद सूची से मूल, अध्याय (1227), पद (1551) और शीर्षक शैलियों के बीच बदलें। इनका अर्थ नीचे बताया गया है।
about.howto.step6.title=भाष्य की कड़ियों का अनुसरण करें
about.howto.step6.body=जब कोई भाष्य किसी पद का हवाला देता है, तो कड़ी पर क्लिक करें — बाइबल के सभी खुले स्तंभ अपने आप उस अंश पर पहुँच जाते हैं।
about.howto.step7.title=सब कुछ खोजें
about.howto.step7.body=टूलबार में 🔍 चिह्न पर क्लिक करके हर पद और टिप्पणी में एक साथ खोजें। कोई भी परिणाम नए स्तंभ में सीधे उस अंश पर ले जाता है।

about.modes.title=प्रदर्शन शैलियों को समझना
about.modes.intro=हर स्तंभ के शीर्ष में प्रदर्शन-शैली चयनकर्ता यह तय करता है कि पाठ कैसे प्रस्तुत हो। हर शैली सम्पादकीय इतिहास की एक अलग परत दर्शाती है — कुछ प्राचीन, कुछ आश्चर्यजनक रूप से हाल की। ये विभाजन कहाँ से आए, यह समझना पढ़ने का ढंग बदल देता है।
about.modes.original.label=मूल
about.modes.original.subtitle=स्क्रिप्टियो कॉन्टिनुआ
about.modes.original.p1=सबसे पुरानी बाइबलीय पांडुलिपियाँ — चाहे नए नियम की यूनानी पपीरी हों या महान इब्रानी संहिताएँ — बिना रिक्त स्थानों, विराम-चिह्नों, अध्याय-विभाजनों और पद-संख्याओं के, लगातार बड़े अक्षरों में लिखी गई थीं। पाठकों से अपेक्षा थी कि वे पाठ को पहले से इतना जानते हों कि उसे पढ़ सकें।
about.modes.original.p2=यह शैली उसी अनुभव को पुनर्जीवित करती है। यह जान-बूझकर चुनौतीपूर्ण है। इसे पढ़ना आपको पाठ से वैसे जुड़ने पर विवश करता है जैसे सबसे पहले पाठक जुड़े थे — उद्धरण-योग्य अलग-थलग टुकड़ों के संग्रह के रूप में नहीं, बल्कि एक अखंड तर्क या कथा के रूप में। कई विद्वानों का मत है कि लेखकों के मूल अभिप्राय से मिलने का यही सबसे ईमानदार तरीका है।
about.modes.simplified.label=सरलीकृत
about.modes.simplified.subtitle=पठनीय अखंड पाठ
about.modes.simplified.p1=यह शैली मूल के अखंड, अविभाजित प्रवाह को बनाए रखती है, पर वह सब लौटा देती है जो लिपिकों ने आने वाली सदियों में जोड़ा — शब्दों के बीच रिक्त स्थान, छोटे अक्षर और विराम-चिह्न। यह एक वास्तविक ऐतिहासिक कालखंड को दर्शाती है: पाठ इस रूप में पठनीय हो जाने के बहुत बाद तक भी बिना अध्याय-पद संख्याओं के प्रचलित रहे। लैंगटन के अध्याय और एस्तिएन के पद तब सदियों दूर थे।
about.modes.simplified.p2=पूर्ण स्क्रिप्टियो कॉन्टिनुआ जान-बूझकर कठोर है — वह सब कुछ एक साथ हटा देती है, जिससे वह प्रभावशाली प्रदर्शन तो बनती है पर पढ़ने के लिए कठिन जगह। यह सरलीकृत शैली केवल वही एक परत हटाती है जिसके बारे में यह खंड है: अध्याय और पद की संख्याएँ — वे देर से जुड़ी चीज़ें जो प्रमाण-पाठन (proof-texting) को न्योता देती हैं। पाठ सुपाठ्य रहता है, इसलिए आप पूरी पुस्तक को उद्धरण-योग्य कोष्ठकों की जाली के बजाय उस अखंड तर्क या कथा के रूप में पढ़ सकते हैं जो उसके लेखक ने लिखी थी। जहाँ पूर्ण स्क्रिप्टियो कॉन्टिनुआ कभी-कभार का झटका है, वहीं संख्याओं के बिना पढ़ने का यह रोज़मर्रा का तरीका है।
about.modes.chapters.label=अध्याय (1227)
about.modes.chapters.subtitle=स्टीफ़न लैंगटन द्वारा जोड़े गए
about.modes.chapters.p1=स्टीफ़न लैंगटन, एक अंग्रेज़ विद्वान जो कैंटरबरी के आर्चबिशप बने, ने लगभग 1227 ईस्वी में — पाठों के लिखे जाने के एक हज़ार से अधिक वर्ष बाद — बाइबल को उस अध्याय-प्रणाली में बाँटा जो आज भी प्रचलित है।
about.modes.chapters.p2=उनकी प्रेरणा व्यावहारिक थी: धर्मशास्त्रीय बहसों में अंशों का हवाला देने के लिए विद्वानों को एक सुसंगत तरीका चाहिए था। अध्याय-विभाजन कभी ईश्वर-प्रेरित सीमाओं के रूप में अभिप्रेत नहीं थे। लैंगटन ने एक विशाल पाठ पर तेज़ी से काम किया, और उनके विभाजन कहीं उत्कृष्ट हैं तो कहीं खटकने वाले — तर्क के बीच, कविता के बीच, यहाँ तक कि वाक्य के बीच में कटते हुए, ऐसे ढंग से जो लेखक के मूल प्रवाह को धुंधला कर देता है।
about.modes.verses.label=पद (1551)
about.modes.verses.subtitle=रॉबर्ट एस्तिएन द्वारा जोड़े गए
about.modes.verses.p1=पद-संख्याएँ 1551 में रॉबर्ट एस्तिएन नामक फ़्रांसीसी मुद्रक (जो स्टेफ़ानुस के नाम से भी जाने जाते हैं) ने नए नियम में जोड़ीं। उनके पुत्र के अनुसार उन्होंने ये विभाजन पेरिस से ल्योन की यात्रा के दौरान inter equitandum — अर्थात् "घोड़े पर सवार" — किए। घोड़े की काठी पर बैठे-बैठे पदों को क्रमांकित करने की यह छवि प्रसिद्ध तो है पर विवादित; जैसा कोई भी घुड़सवार जानता है, चलते-चलते ऐसा कर पाना कठिन ही है, और विद्वानों का अनुमान है कि उन्होंने वास्तव में यह काम शाम को रास्ते की सरायों में किया। जो भी हो, यात्रा की जल्दबाज़ी कुछ अधिक अटपटे विभाजनों की व्याख्या कर सकती है।
about.modes.verses.p2=पुराने नियम की पद-प्रणाली शीघ्र ही उसके बाद आई। अध्यायों की तरह पद भी केवल संदर्भ-सुविधा के लिए जोड़े गए थे। तब से उन्होंने यह आकार दिया है कि अरबों लोग धर्मग्रंथ को कैसे पढ़ते और उद्धृत करते हैं — प्रायः ऐसे ढंग से जो टुकड़ों को उनके संदर्भ से इस तरह अलग कर देता है जिसकी मूल लेखकों ने कभी कल्पना नहीं की थी।
about.modes.titles.label=शीर्षक
about.modes.titles.subtitle=सम्पादकीय खंड-शीर्षक
about.modes.titles.p1=खंड-शीर्षक — जिन्हें कभी-कभी पेरिकोपे कहा जाता है — प्रकाशकों और अनुवादकों द्वारा पाठकों की सुविधा के लिए जोड़े गए सम्पादकीय शीर्षक हैं। वे किसी भी मूल पांडुलिपि का हिस्सा नहीं हैं।
about.modes.titles.p2=वे अनुवादों के बीच काफ़ी भिन्न होते हैं: NIV उनका व्यापक उपयोग करता है, जबकि KJV में वे बिल्कुल नहीं हैं। कुछ शीर्षक उपयोगी सार हैं; कुछ किसी अंश पर, आपके एक शब्द भी पढ़ने से पहले, एक धर्मशास्त्रीय व्याख्या थोप देते हैं। पहले बिना शीर्षकों के, फिर उनके साथ पढ़ना एक आँखें खोलने वाला अभ्यास हो सकता है।

about.problems.title=जब विभाजन पाठ को विकृत करते हैं
about.problems.intro=अध्याय और पद विभाजनों ने आकार दिया है कि अरबों लोग धर्मग्रंथ कैसे पढ़ते हैं — पर वे पाठों के लिखे जाने के सदियों बाद मानव सम्पादकों द्वारा जोड़े गए, और कभी-कभी मूल तर्क को ऐसे काटते हैं कि अर्थ सचमुच बदल जाता है। नीचे कुछ सबसे महत्वपूर्ण उदाहरण हैं।
about.problems.isaiah.ref=यशायाह 52:13 – 53:12
about.problems.isaiah.title=दो टुकड़ों में बँटी एक भविष्यवाणी
about.problems.isaiah.p1=यशायाह 53 पर अध्याय-विच्छेद वास्तव में एक अखंड कविता — जिसे प्रायः चौथा सेवक-गीत कहा जाता है — के बीच से कटता है। कविता यशायाह 52:13 से शुरू होती है: "देखो, मेरा दास बुद्धि से काम करेगा; वह ऊँचा, महान और अति महिमान्वित होगा।" यह आरम्भिक छंद (52:13–15) उस पूरे अंश की भूमिका रचता है जो अध्याय 53 में आता है, और जिसे मसीही क्रूसारोपण की भविष्यवाणी के रूप में पढ़ते हैं।
about.problems.isaiah.p2=चूँकि अध्याय-विभाजन 52:13–15 को पाठकों की दृष्टि में "यशायाह 52" में और मुख्य भाग को "यशायाह 53" में रख देता है, आरम्भिक पद प्रायः अनदेखे रह जाते हैं। कविता का हवाला नियमतः 53:1 से दिया जाता है, जिससे उसका नाटकीय आरम्भ खो जाता है। उसे एक अटूट अंश के रूप में पढ़ना — जैसे मूल पाठ उसे प्रस्तुत करता है — भविष्यवाणी की पूरी परिधि लौटा देता है।
about.problems.romans.ref=रोमियों 7 – 8
about.problems.romans.title=वह "इसलिए" जिसका "क्योंकि" खो गया
about.problems.romans.p1=रोमियों 8 नए नियम की सबसे प्रसिद्ध पंक्तियों में से एक से शुरू होता है: "इसलिए अब जो मसीह यीशु में हैं, उन पर दण्ड की आज्ञा नहीं।" शब्द "इसलिए" यहाँ निर्णायक काम कर रहा है — वह संकेत देता है कि पौलुस अभी-अभी किए गए एक तर्क से निष्कर्ष निकाल रहे हैं।
about.problems.romans.p2=पर अध्याय-विच्छेद निष्कर्ष को तर्क से अलग कर देता है। जो पाठक अध्याय 8 से शुरू करते हैं, उन्हें बिना प्रमाण की एक घोषणा मिलती है। अध्याय 7 में शरीर और आत्मा के संघर्ष के बारे में पौलुस का तर्क ही अध्याय 8 के आश्वासन की सीधी नींव है। अध्याय-विभाजन ने इसमें योगदान दिया है कि रोमियों 8:1 को एक सुदीर्घ धर्मशास्त्रीय तर्क की पराकाष्ठा के बजाय एक स्वतंत्र प्रतिज्ञा के रूप में पढ़ा जाए।
about.problems.philippians.ref=फिलिप्पियों 4:13
about.problems.philippians.title=धर्मग्रंथ का सबसे अधिक ग़लत उद्धृत पद
about.problems.philippians.p1="जो मुझे सामर्थ्य देता है, उसमें मैं सब कुछ कर सकता हूँ" बाइबल के सबसे व्यापक रूप से उद्धृत पदों में से एक है — वस्तुओं पर छपा, खेल-आयोजनों से पहले दोहराया गया, और दिव्य सशक्तिकरण की एक सामान्य प्रतिज्ञा के रूप में पुकारा गया।
about.problems.philippians.p2=संदर्भ में पौलुस किसी कहीं अधिक विशिष्ट और कहीं अधिक चुनौतीपूर्ण बात की चर्चा कर रहे हैं: दरिद्रता में संतोष। आस-पास के पद कहते हैं: "मैंने यह सीखा है कि जिस दशा में हूँ, उसी में संतोष रखूँ। मैं दीन होना भी जानता हूँ और बढ़ना भी जानता हूँ।" जो "सब कुछ" पौलुस मसीह के द्वारा कर सकते हैं, वह है हर परिस्थिति — बहुतायत या अभाव — को धैर्य से सह लेना। पद-विभाजन ने पद को इस संदर्भ से नोच लिया और गरिमा से दुःख सहने की शिक्षा को उपलब्धि के नारे में बदल दिया।
about.problems.jeremiah.ref=यिर्मयाह 29:11
about.problems.jeremiah.title=बंदियों से की गई प्रतिज्ञा, व्यक्तियों से नहीं
about.problems.jeremiah.p1="क्योंकि यहोवा की यह वाणी है, कि मैं तुम्हारे विषय में जो कल्पनाएँ करता हूँ उन्हें जानता हूँ — वे हानि की नहीं, वरन् कुशल की हैं, कि तुम्हें भविष्य और आशा दूँ" समकालीन मसीही संस्कृति के सबसे लोकप्रिय पदों में से एक है, जिसे प्रायः व्यक्तिगत दिव्य प्रतिज्ञा के रूप में लागू किया जाता है।
about.problems.jeremiah.p2=संदर्भ में परमेश्वर बाबेल में बंदी इस्राएलियों के पूरे समुदाय को सम्बोधित कर रहे हैं — और उनसे वह कह रहे हैं जो वे सुनना नहीं चाहते थे: कि बंधुआई सत्तर वर्ष चलेगी। यह आशा-भरा पद उस पत्र में गुँथा है जो बंदियों से कहता है कि बाबेल में बस जाओ, घर बनाओ, बारियाँ लगाओ, और स्वीकार करो कि तुम अपने जीवनकाल में नहीं लौटोगे। प्रतिज्ञा सच्ची है — पर वह सामूहिक है, दीर्घकालिक है, और दशकों के दुःख से पहले नहीं, उसके साथ आती है। पद-विभाजन ने सांत्वना को निकाल लेना और संदर्भ को पीछे छोड़ देना आसान बना दिया।
about.problems.john.ref=यूहन्ना 11:35
about.problems.john.title=सबसे छोटा पद और जो उसने खोया
about.problems.john.p1="यीशु रोया" बाइबल का सबसे छोटा पद है — एक ऐसी विशिष्टता जिसने उसे प्रसिद्ध, बहु-उद्धृत और अलग-थलग कंठस्थ बना दिया है।
about.problems.john.p2=मूल यूनानी में यह पद एक सुदीर्घ भावनात्मक दृश्य का हिस्सा है: यीशु लाज़र की कब्र पर पहुँचते हैं, मरियम को रोते देखते हैं, भीड़ को रोते देखते हैं, और "आत्मा में बहुत व्याकुल और घबरा" जाते हैं — एक ऐसा वाक्यांश जो यूनानी (embrimaomai) में केवल शोक नहीं, बल्कि क्रोध या क्षोभ का भाव भी रखता है। विद्वान बहस करते हैं कि यीशु शोक से रोए, शोक करने वालों के प्रति करुणा से, या किसी और भी जटिल भाव से। पद-विभाजन ने एक धर्मशास्त्रीय रूप से समृद्ध क्षण को यीशु के मानवीय भावना बाँटने के एक मार्मिक प्रसंग भर में सिमटा दिया है।
about.problems.callout.title=प्रमाण-पाठन और पद-प्रणाली
about.problems.callout.p1=पद-प्रणाली ने अनजाने में "प्रमाण-पाठन" (proof-texting) की परिस्थितियाँ रच दीं — किसी धर्मशास्त्रीय या नैतिक पक्ष के समर्थन में, आस-पास के तर्क का उल्लेख किए बिना, एक अलग-थलग पद को उद्धृत करने की प्रथा। विद्वत्-चर्चा और लोक-संस्कृति, दोनों इससे आकार पाए हैं। संदर्भ से कटा हुआ पद लगभग वही कहता प्रतीत हो सकता है जो लेखक के अभिप्राय के विपरीत हो।
about.problems.callout.p2=इसीलिए मूल और अध्याय प्रदर्शन-शैलियाँ हैं। किसी अध्याय या पुस्तक को अखंड गद्य के रूप में — पद-संख्याओं की दृश्य बाधा के बिना — पढ़ना प्रायः वह तर्क, कथा या कविता उजागर कर देता है जिसे पदों की जाली ने लगभग अदृश्य बना दिया था।

about.texts.title=उपलब्ध पाठ
about.texts.intro=मंच पर वर्तमान में निम्नलिखित पाठ उपलब्ध हैं। नए अनुवाद और परम्पराएँ नियमित रूप से जोड़ी जा रही हैं।
about.texts.bibleHeader=बाइबल के अनुवाद
