about.texts.hadithHeader=हदीस संग्रह
about.texts.hadithNote=हर संग्रह का अरबी मतन शास्त्रीय और सार्वजनिक अधिकार-क्षेत्र (public domain) में है। अंग्रेज़ी अनुवाद hadith-api से लिए गए हैं, और उनके स्रोत की पुष्टि संस्करण-दर-संस्करण की जा रही है।
