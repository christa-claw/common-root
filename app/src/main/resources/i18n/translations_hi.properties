about.sources.note=लाइसेंस-प्राप्त अनुवाद (NIV, NASB, NBLA) अनुमति के साथ प्रयुक्त हैं। लाइसेंस-प्राप्त सामग्री का इस मंच के बाहर पुनरुत्पादन या पुनर्वितरण अनुमत नहीं है। सार्वजनिक-अधिकार-क्षेत्र के पाठ स्वतंत्र रूप से उपयोग और साझा किए जा सकते हैं।

about.comments.title=अपनी अंतर्दृष्टियाँ साझा करें
about.comments.body=किसी भी पद पर टिप्पणियाँ और नोट्स छोड़ने के लिए निःशुल्क खाता बनाएँ। आपकी टिप्पणियाँ सामान्यतः निजी रहती हैं — चाहें तो साझा करें। पाठों को पढ़ना और उनका अध्ययन करना सदा निःशुल्क है, खाते की आवश्यकता नहीं।
