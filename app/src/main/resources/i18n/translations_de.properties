about.about.title=Über dieses Projekt
about.about.p1=Common Root? ist ein unabhängiges Projekt, das ernsthaftes vergleichendes Studium der abrahamitischen Schriften für alle zugänglich machen soll — für Gelehrte, Studierende und neugierige Leser gleichermaßen. Es ist mit keiner religiösen Organisation und keinem Verlag verbunden. Der Name ist eine Einladung: diese Texte nebeneinander zu lesen und selbst abzuwägen, was sie teilen und wo sie auseinandergehen.
about.about.p2=Die Plattform basiert auf Open-Source-Technologie: Java, Vaadin, Spring Boot, BaseX (eine native XML-Datenbank) und MySQL (für Benutzerkonten und Kommentare). Gemeinfreie Quelltexte sind frei verfügbar. Lizenzierte Übersetzungen werden mit Genehmigung ihrer Verlage verwendet.
about.about.p3=Neue Übersetzungen, Traditionen und Funktionen werden laufend hinzugefügt. Koranübersetzungen und Hadith-Sammlungen folgen als Nächstes, danach die Einbindung von Kommentaren und Querverweisen.

about.support.title=Das Projekt unterstützen
about.support.body=Common Root? ist kostenlos und wird es immer bleiben. Wenn es Ihnen nützt, hilft eine Förderung, Hosting, den Zugang zu lizenzierten Übersetzungen und die Zeit für neue Texte und Funktionen zu decken.
