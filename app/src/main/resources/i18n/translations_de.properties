about.search.body=Ein einziges Suchfeld umfasst jetzt jede Ausgabe und Sprache der Bibliothek — Bibel, Koran, Hadith und mehr — samt den Kommentaren. Suchen Sie ein Wort oder eine Wendung, und Sie erhalten ein Ergebnis pro Vers; wählen Sie, welche Übersetzungen geöffnet werden, und vergleichen Sie zwei oder mehr nebeneinander in synchronisierten Spalten. Sie können auch eine Liste von Stellen in die Symbolleiste des Lesers einfügen, um jede Stelle auf einmal in einer eigenen Spalte zu öffnen.
