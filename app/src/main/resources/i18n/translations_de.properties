# ── The Qur'an landing section ───────────────────────────────────────
about.quran.title=Der Koran
about.quran.intro=Während die Kapitel und Verse der Bibel dem Text Jahrhunderte nach seiner Niederschrift auferlegt wurden, kam der Koran mit unversehrter Struktur. Seine Einteilung in 114 Suren und die Ayat darin gehört zum Text, wie er überliefert wurde — kein späteres redaktionelles Raster, das darübergelegt wurde. Was der Koran dem vergleichenden Leser stattdessen bietet, sind zwei Wege durch denselben Text und eine Unterscheidung zwischen dem Original und seinen Übersetzungen, die prägt, wie er gelesen wird.
about.quran.original.title=Sure und Aya: ursprünglich, nicht redaktionell
about.quran.original.p1=Eine Sure ist ein Kapitel; eine Aya (wörtlich „ein Zeichen“) ist ein Vers. Anders als die Kapitel- und Versnummern der Bibel — um 1227 von Stephen Langton und 1551 von Robert Estienne hinzugefügt — gehören die Suren und Ayat des Korans zur eigenen Struktur des Textes und sind seit seiner frühesten Überlieferung vorhanden.
about.quran.original.p2=Im Modus „Nummerierte Ayat“ zu lesen bedeutet hier also nicht, eine mittelalterliche Überlagerung rückgängig zu machen, wie es bei der Bibel der Fall ist; die Nummerierung ist dem Text eigen.
about.quran.standardization.title=Ein Text, mit Absicht
about.quran.standardization.p1=Der Koran, wie er heute im Umlauf ist, spiegelt eine bewusste Vereinheitlichung wider. Der traditionellen Überlieferung zufolge ließ der Kalif Uthman etwa zwei Jahrzehnte nach dem Tod des Propheten — angesichts regionaler Gemeinschaften, die auf abweichende Weise rezitierten — einen maßgeblichen schriftlichen Text festlegen und Abschriften an die großen Zentren senden — und ordnete die Vernichtung der konkurrierenden Kodizes an. Von einigen bedeutenden Gefährten ist überliefert, dass sie persönliche Kodizes besaßen, die sich stellenweise unterschieden, im Wortlaut oder in der Reihenfolge der Suren.
about.quran.standardization.p2=Während der Text der Bibel über Jahrhunderte von vielen Händen geformt wurde, wurde der des Korans früh und bewusst in einer einzigen offiziellen Rezension festgelegt — eine andere Art von Redaktionsgeschichte, aber dennoch eine Redaktionsgeschichte.
about.quran.orders.title=Zwei Ordnungen: Rezitation und Offenbarung
about.quran.orders.p1=Der Koran, den Sie gewöhnlich sehen — der Mushaf — ist nicht in der Reihenfolge angeordnet, in der er offenbart wurde. Nach der Eröffnungssure Al-Fatiha verlaufen die Suren grob von der längsten zur kürzesten: eine Ordnung für Rezitation und Auswendiglernen, nicht chronologisch. Die Offenbarungsreihenfolge ist eine andere — sie beginnt mit den kurzen, eindringlichen Suren der frühen mekkanischen Jahre und entfaltet sich über etwa zwei Jahrzehnte.
about.quran.orders.p2=Dieser Leser lässt Sie zwischen beiden wechseln, sodass Sie den Text so lesen können, wie er rezitiert wird, oder ihm folgen, wie er offenbart wurde. (Die genaue Abfolge der Offenbarung wird von Gelehrten rekonstruiert und stellenweise diskutiert.)
about.quran.meccaMedina.title=Mekkanisch und medinensisch
about.quran.meccaMedina.p1=Die Überlieferung teilt die Suren in die in Mekka offenbarten und die später in Medina offenbarten. Die mekkanischen Suren neigen dazu, kürzer und poetischer zu sein — befasst mit der Einheit Gottes, der Auferstehung und der kommenden Abrechnung. Die medinensischen Suren neigen dazu, länger zu sein und sich mehr mit Recht, Gemeinschaft und dem Leben einer sesshaften Gesellschaft zu befassen.
about.quran.meccaMedina.p2=Zu wissen, ob eine Passage mekkanisch oder medinensisch ist, verändert oft, wie sie sich liest, ähnlich wie es der Schauplatz einer biblischen Passage tut.
about.quran.translations.title=Das Arabische und seine Übersetzungen
about.quran.translations.p1=In der islamischen Tradition ist der Koran der arabische Text selbst; eine Übersetzung gilt als Deutung seiner Bedeutung und nicht als der eigentliche Koran — weshalb Übersetzer ihr Werk „Die Bedeutung des glorreichen Korans“ oder „eine Deutung“ nennen.
about.quran.translations.p2=Dieser Leser hält diese Unterscheidung sichtbar: Die arabische Ausgabe ist der Grundtext, und eine Übersetzung kann unter jeder Aya statt an ihrer Stelle angezeigt werden, sodass Sie das Original und seine Wiedergabe zusammen lesen.
about.quran.callout.title=Den Koran hier lesen
about.quran.callout.p1=Zwei Funktionen sind genau dafür gebaut. Der Reihenfolge-Umschalter führt Sie zwischen der rezitierten Reihenfolge und der Offenbarungsreihenfolge hin und her. Der Übersetzungsbegleiter setzt eine Wiedergabe unter jede arabische Aya, Zeile für Zeile verankert, sodass das Original vorrangig bleibt und die Übersetzung es stützt.
about.quran.callout.p2=Das Ziel ist dasselbe wie bei der Bibel — den Text zu seinen eigenen Bedingungen lesen zu lassen und die redaktionellen und deutenden Schichten sichtbar statt unsichtbar zu machen.

