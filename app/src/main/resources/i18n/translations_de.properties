about.sources.download=Jede gemeinfreie Ausgabe lässt sich vollständig herunterladen — als dasselbe XML, das der Leser selbst liest: Bücher, Kapitel und Verse nach dem Schema in religious-text.xsd. Seit 0.8.5 geht das über die API: Erstellen Sie auf Ihrer Kontoseite einen kostenlosen Schlüssel und rufen Sie /api/v1/texts/{token}/download ab. Das Lesen auf der Website braucht nie einen Schlüssel; der Schlüssel zählt nur Downloads. Lizenzierte Ausgaben werden nicht ausgeliefert, und die API entscheidet das anhand der Lizenz jedes Textes selbst, nicht anhand einer Liste.
about.sources.downloadTitle=Nehmen Sie die Texte mit
about.texts.lineageChains=Erfasste Ketten, aus patch_lineage.py:
about.texts.lineageHow=Das Steuerelement ▾ am Kopf einer Bibelspalte öffnet diese Kette unter jedem Vers, eine Sprosse pro Klick, bis sie beim hebräischen oder griechischen Text darunter ankommt. ▴ schließt die tiefste Sprosse wieder. Jede Sprosse trägt Kürzel und Jahr ihrer Ausgabe — „GNV 1599“ — sodass die Strecke, die eine Lesart zurückgelegt hat, sichtbar ist, statt bloß von uns behauptet zu werden.
about.texts.lineageIntro=Übersetzungen sind keine unabhängigen Zeugen. Die Übersetzer der King James arbeiteten auf Grundlage der Bishops' Bible, mit Tyndale und Genf griffbereit; die Revised Version korrigierte die King James; die American Standard revidierte die Revised; die World English Bible modernisierte die American Standard. Vier Jahrhunderte von Übersetzern, jeder las dem Vorgänger über die Schulter.
about.texts.lineageModes=Sprossen sind versgenau, daher erscheinen die Steuerelemente nur in den Anzeigemodi „Verse“ und „Überschriften“. „Original“, „Fortlaufend“ und „Kapitel“ behalten ihren ununterbrochenen Fluss; eine dort eingestellte Tiefe bleibt still erhalten und kehrt zurück, wenn Sie zurückwechseln. Das Stufen ist zudem inhaltsbewusst — Sprossen, die für das aktuelle Buch nichts zu sagen haben, werden übersprungen; wer vom Alten Testament ins Neue scrollt, bekommt ohne Klick den griechischen statt des hebräischen Zeugen.
about.texts.lineageTitle=Übersetzungslinien — worauf eine Ausgabe steht
about.texts.lineageWitness=Mit ≈ markierte Sprossen sind ursprachliche Zeugen. Sie werden gezeigt, weil jede Übersetzung letztlich auf dem Hebräischen und Griechischen ruht — nicht, weil die Ausgabe sie als Quelle nennt; der Westminster Leningrad Codex und der Textus Receptus stehen stellvertretend für diesen Boden. Das ist eine echte Einschränkung, keine Behauptung: Eine moderne Übersetzung wie die NIV oder die NASB arbeitet mit kritischen Ausgaben, die noch nicht in diesem Korpus sind; ihre Leiter ist daher eine einzelne ≈-Sprosse statt einer Kette. Fehlt eine Ausgabe in der Liste oben, heißt das nur, dass wir ihre Herkunft nicht erfasst haben — nicht, dass sie keine hätte.
