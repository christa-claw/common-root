about.comments.title=Teilen Sie Ihre Einsichten
about.comments.body=Erstellen Sie ein kostenloses Konto, um Kommentare und Notizen zu jedem Vers zu hinterlassen. Ihre Anmerkungen bleiben standardmäßig privat — teilen Sie sie, wenn Sie möchten. Das Lesen und Studieren der Texte ist immer kostenlos, ohne Konto.
about.comments.register=Kostenloses Konto erstellen
