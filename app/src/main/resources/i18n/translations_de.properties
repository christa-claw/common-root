about.sources.title=Quellen & Nachweis
about.sources.intro=Alle Texte stammen von seriösen gemeinfreien oder lizenzierten Anbietern. Wir verpflichten uns zu einem korrekten Nachweis für jeden Text auf dieser Plattform. Wo eine Lizenz es erlaubt, wird der vollständige Text kostenlos zum persönlichen Studium bereitgestellt.
