about.nav.openReader=Leser öffnen

about.hero.title=Studieren Sie die Texte, die unsere Welt prägen
about.hero.subtitle=Ein freier, offener Leser, um die Schriften der abrahamitischen Religionen — Bibelübersetzungen, den Koran, die Hadithe und Kommentare — nebeneinander zu erkunden, in jeder Sprache, in jeder Tiefe.
about.hero.cta=Den Leser öffnen →

about.howto.title=So verwenden Sie den Leser
about.howto.intro=Der Leser ist um Spalten herum aufgebaut. Jede Spalte zeigt einen Text — eine Bibelübersetzung, den Koran, einen Kommentar oder Ihre eigenen Notizen. Sie können beliebig viele Spalten öffnen und Traditionen frei mischen.
about.howto.step1.title=Eine Quelle wählen
about.howto.step1.body=Klicken Sie in der Spaltenüberschrift auf „Quelle auswählen...“ und wählen Sie eine Übersetzung oder einen Text aus dem Dropdown-Menü.
about.howto.step2.title=Navigieren
about.howto.step2.body=Verwenden Sie die Buchauswahl und die Kapitelpfeile, um überallhin zu springen. Oder scrollen Sie einfach — der Leser lädt das nächste Kapitel automatisch, wenn Sie das Ende erreichen.
about.howto.step3.title=Weitere Spalten hinzufügen
about.howto.step3.body=Klicken Sie in der Symbolleiste auf „Spalte hinzufügen“, um einen zweiten oder dritten Text neben dem ersten zu öffnen. Vergleichen Sie Übersetzungen oder Traditionen nebeneinander.
about.howto.step4.title=Synchronisieren oder frei blättern
about.howto.step4.body=Spalten scrollen standardmäßig gemeinsam. Klicken Sie auf das Verknüpfungssymbol 🔗 in einer Spaltenüberschrift, um sie zu lösen und diese Spalte unabhängig zu durchblättern.
about.howto.step5.title=Anzeigemodus ändern
about.howto.step5.body=Wechseln Sie pro Spalte zwischen den Modi Original, Kapitel (1227), Verse (1551) und Überschriften über das Dropdown-Menü in der Überschrift. Was diese bedeuten, lesen Sie unten.
about.howto.step6.title=Kommentarverknüpfungen folgen
about.howto.step6.body=Wenn ein Kommentar auf einen Vers verweist, klicken Sie auf die Verknüpfung — alle geöffneten Bibelspalten springen automatisch zu dieser Stelle.
about.howto.step7.title=Alles durchsuchen
about.howto.step7.body=Klicken Sie auf das 🔍-Symbol in der Symbolleiste, um alle Verse und Kommentare auf einmal zu durchsuchen. Jedes Ergebnis springt direkt zur Stelle in einer neuen Spalte.

about.modes.title=Die Anzeigemodi verstehen
about.modes.intro=Die Anzeigemodus-Auswahl in jeder Spaltenüberschrift steuert, wie der Text dargestellt wird. Jeder Modus spiegelt eine andere Schicht der redaktionellen Geschichte wider — manche uralt, manche überraschend jung. Zu verstehen, woher diese Einteilungen stammen, verändert, wie Sie lesen.
about.modes.original.label=Original
about.modes.original.subtitle=Scriptio Continua
about.modes.original.p1=Die ältesten biblischen Handschriften — ob griechische Papyri des Neuen Testaments oder die großen hebräischen Kodizes — wurden in fortlaufender Großschrift geschrieben, ohne Zwischenräume, ohne Satzzeichen, ohne Kapiteltrennungen und ohne Versnummern. Von den Lesern wurde erwartet, dass sie den Text bereits gut genug kannten, um ihn zu gliedern.
about.modes.original.p2=Dieser Modus stellt jene Erfahrung wieder her. Er ist bewusst anspruchsvoll. Ihn zu lesen zwingt Sie, sich mit dem Text wie die frühesten Leser auseinanderzusetzen — als fortlaufende Argumentation oder Erzählung, nicht als Sammlung isolierter, zitierbarer Fragmente. Viele Gelehrte argumentieren, dies sei die ehrlichste Weise, der ursprünglichen Absicht der Autoren zu begegnen.
about.modes.chapters.label=Kapitel (1227)
about.modes.chapters.subtitle=Hinzugefügt von Stephen Langton
about.modes.chapters.p1=Stephen Langton, ein englischer Gelehrter, der Erzbischof von Canterbury wurde, teilte die Bibel um 1227 n. Chr. nach dem noch heute gebräuchlichen Kapitelsystem ein — mehr als tausend Jahre nach der Niederschrift der Texte.
about.modes.chapters.p2=Seine Beweggründe waren praktischer Natur: Gelehrte brauchten eine einheitliche Möglichkeit, Stellen in theologischen Debatten zu zitieren. Die Kapiteleinteilungen waren nie als inspirierte Grenzen gedacht. Langton arbeitete rasch an einem riesigen Text, und seine Einteilungen sind mal hervorragend, mal befremdlich — sie schneiden mitten in eine Argumentation, ein Gedicht oder sogar einen Satz, auf eine Weise, die den ursprünglichen Fluss des Autors verschleiert.
about.modes.verses.label=Verse (1551)
about.modes.verses.subtitle=Hinzugefügt von Robert Estienne
about.modes.verses.p1=Die Versnummern wurden dem Neuen Testament 1551 von Robert Estienne hinzugefügt, einem französischen Drucker, der auch als Stephanus bekannt ist. Seinem Sohn zufolge nahm er die Einteilung inter equitandum vor — „zu Pferde" —, auf der Reise von Paris nach Lyon. Das Bild, wie jemand die Verse im Sattel nummeriert, ist berühmt, aber umstritten; wie jeder Reiter bestätigen kann, ist das in der Bewegung kaum möglich, und Forscher vermuten, dass er die Arbeit in Wahrheit abends in den Gasthäusern erledigte. Wie er auch gesessen haben mag — die Eile der Reise könnte einige der rätselhafteren Einteilungen erklären.
about.modes.verses.p2=Das Versesystem des Alten Testaments folgte kurz darauf. Wie die Kapitel wurden die Verse rein aus Gründen der Verweisbarkeit hinzugefügt. Seither haben sie geprägt, wie Milliarden von Menschen die Schrift lesen und zitieren — oft auf eine Weise, die Fragmente aus ihrem Zusammenhang löst, wie es die ursprünglichen Autoren nie beabsichtigt oder erwartet haben.
about.modes.titles.label=Überschriften
about.modes.titles.subtitle=Redaktionelle Abschnittsüberschriften
about.modes.titles.p1=Abschnittsüberschriften — manchmal Perikopen genannt — sind redaktionelle Überschriften, die von Verlagen und Übersetzern hinzugefügt werden, um Lesern die Orientierung zu erleichtern. Sie sind in keiner Originalhandschrift enthalten.
about.modes.titles.p2=Sie unterscheiden sich erheblich zwischen den Übersetzungen: Die NIV verwendet sie ausgiebig, während die KJV gar keine hat. Manche Überschriften sind hilfreiche Zusammenfassungen; andere legen einer Stelle eine theologische Deutung auf, bevor Sie ein einziges Wort gelesen haben. Erst ohne, dann mit den Überschriften zu lesen, kann eine aufschlussreiche Übung sein.

about.problems.title=Wenn Einteilungen den Text verzerren
about.problems.intro=Kapitel- und Verseinteilungen haben geprägt, wie Milliarden von Menschen die Schrift lesen — doch sie wurden von menschlichen Herausgebern Jahrhunderte nach der Niederschrift der Texte hinzugefügt, und sie durchschneiden mitunter die ursprüngliche Argumentation auf eine Weise, die die Bedeutung wirklich verändert. Die folgenden gehören zu den bedeutendsten Beispielen.
about.problems.isaiah.ref=Jesaja 52,13 – 53,12
about.problems.isaiah.title=Eine in zwei geteilte Prophezeiung
about.problems.isaiah.p1=Der Kapitelbruch bei Jesaja 53 durchschneidet, was eigentlich ein einziges fortlaufendes Gedicht ist — oft das vierte Gottesknechtslied genannt. Das Gedicht beginnt in Jesaja 52,13 mit „Siehe, mein Knecht wird weise handeln; er wird erhöht und erhoben werden und sehr hoch erhaben sein.“ Diese Eröffnungsstrophe (52,13–15) leitet die gesamte Passage ein, die in Kapitel 53 folgt, das Christen als Prophezeiung der Kreuzigung lesen.
about.problems.isaiah.p2=Weil die Kapiteleinteilung 52,13–15 in das stellt, was Leser als „Jesaja 52“ ansehen, und den Hauptteil in „Jesaja 53“, werden die Eröffnungsverse häufig übersehen. Das Gedicht wird gewöhnlich ab 53,1 zitiert und verliert so seinen dramatischen Auftakt. Es als eine ununterbrochene Passage zu lesen — so wie der Originaltext sie darbietet — stellt den vollen Bogen der Prophezeiung wieder her.
about.problems.romans.ref=Römer 7 – 8
about.problems.romans.title=Das „Also“, das sein „Weil“ verlor
about.problems.romans.p1=Römer 8 beginnt mit einer der berühmtesten Zeilen des Neuen Testaments: „So gibt es nun keine Verdammnis mehr für die, die in Christus Jesus sind.“ Das Wort „so“ leistet entscheidende Arbeit — es signalisiert, dass Paulus eine Schlussfolgerung aus einer soeben vorgebrachten Argumentation zieht.
about.problems.romans.p2=Doch der Kapitelbruch trennt die Schlussfolgerung von der Argumentation. Leser, die mit Kapitel 8 beginnen, treffen auf eine Aussage ohne ihren Beweis. Paulus' Argumentation über den Kampf zwischen Fleisch und Geist in Kapitel 7 ist das unmittelbare Fundament für die Gewissheit in Kapitel 8. Die Kapiteleinteilung hat dazu beigetragen, dass Römer 8,1 als eigenständige Verheißung gelesen wird statt als Höhepunkt einer durchgehenden theologischen Argumentation.
about.problems.philippians.ref=Philipper 4,13
about.problems.philippians.title=Der am häufigsten falsch zitierte Vers der Schrift
about.problems.philippians.p1=„Ich vermag alles durch den, der mich mächtig macht“ ist einer der meistzitierten Verse der Bibel — auf Waren gedruckt, vor Sportereignissen zitiert und als allgemeines Versprechen göttlicher Befähigung angeführt.
about.problems.philippians.p2=Im Zusammenhang spricht Paulus von etwas weit Spezifischerem und weit Anspruchsvollerem: von Zufriedenheit in der Armut. Die umgebenden Verse lauten: „Ich habe gelernt, mir genügen zu lassen, wie es mir auch geht. Ich kann niedrig sein und kann hoch sein.“ Das „alles“, das Paulus durch Christus vermag, ist, jede Lage zu ertragen — Überfluss oder Entbehrung — mit Gleichmut. Die Verseinteilung hat den Vers aus diesem Zusammenhang gerissen und eine Lehre über würdevolles Leiden in einen Slogan über Leistung verwandelt.
about.problems.jeremiah.ref=Jeremia 29,11
about.problems.jeremiah.title=Eine Verheißung an Verbannte, nicht an Einzelne
about.problems.jeremiah.p1=„Denn ich weiß wohl, was ich für Gedanken über euch habe, spricht der Herr: Gedanken des Friedens und nicht des Leides, dass ich euch gebe Zukunft und Hoffnung“ ist einer der beliebtesten Verse der zeitgenössischen christlichen Kultur und wird häufig als persönliche göttliche Verheißung angewandt.
about.problems.jeremiah.p2=Im Zusammenhang wendet sich Gott an die gesamte Gemeinschaft der nach Babylon verbannten Israeliten — und er sagt ihnen etwas, das sie nicht hören wollten: dass die Verbannung siebzig Jahre dauern wird. Der hoffnungsvolle Vers ist in einen Brief eingebettet, der den Verbannten sagt, sie sollen sich in Babylon niederlassen, Häuser bauen, Gärten anlegen und hinnehmen, dass sie zu Lebzeiten nicht zurückkehren werden. Die Verheißung ist real — aber sie ist kollektiv, langfristig und von Jahrzehnten des Leidens begleitet. Die Verseinteilung machte es leicht, den Trost herauszulösen und den Zusammenhang zurückzulassen.
about.problems.john.ref=Johannes 11,35
about.problems.john.title=Der kürzeste Vers und was er verlor
about.problems.john.p1=„Jesus weinte“ ist der kürzeste Vers der Bibel — eine Besonderheit, die ihn berühmt gemacht hat, oft zitiert und vielfach isoliert auswendig gelernt.
about.problems.john.p2=Im griechischen Original ist der Vers Teil einer ausgedehnten emotionalen Szene: Jesus kommt zum Grab des Lazarus, sieht Maria weinen, sieht die Menge weinen und ist „im Geist erregt und tief bewegt“ — ein Ausdruck, der im Griechischen (embrimaomai) einen Sinn von Zorn oder Erregung trägt, nicht nur von Trauer. Gelehrte streiten, ob Jesus aus Kummer, aus Mitgefühl für die Trauernden oder aus etwas Komplexerem weinte. Die Verseinteilung hat einen theologisch reichen Moment auf eine rührende Anekdote über Jesus reduziert, der menschliche Gefühle teilt.
about.problems.callout.title=Das „Proof-Texting“ und das Versesystem
about.problems.callout.p1=Das Versesystem schuf unbeabsichtigt die Bedingungen für das „Proof-Texting“ — die Praxis, einen isolierten Vers zur Stützung einer theologischen oder moralischen Position anzuführen, ohne Bezug auf die umgebende Argumentation. Sowohl die wissenschaftliche Debatte als auch die Populärkultur wurden davon geprägt. Ein aus seinem Zusammenhang gelöster Vers kann fast das Gegenteil dessen zu sagen scheinen, was der Autor meinte.
about.problems.callout.p2=Deshalb gibt es die Anzeigemodi Original und Kapitel. Ein Kapitel oder Buch als fortlaufende Prosa zu lesen — ohne die visuelle Unterbrechung durch Versnummern — offenbart oft eine Argumentation, eine Erzählung oder ein Gedicht, das das Versraster nahezu unsichtbar gemacht hatte.

