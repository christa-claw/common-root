nav.sponsor=♥ Sponsor
about.modes.simplified.label=Vereinfacht
about.modes.simplified.subtitle=Lesbarer Fließtext
about.modes.simplified.p1=Dieser Modus bewahrt den durchgehenden, ungeteilten Fluss des Originals, stellt aber wieder her, was Schreiber in den folgenden Jahrhunderten hinzufügten — Wortzwischenräume, Kleinbuchstaben und Interpunktion. Er spiegelt einen realen historischen Zeitraum wider: Noch lange nachdem Texte auf diese Weise lesbar geworden waren, zirkulierten sie ohne Kapitel- und Versnummern. Langtons Kapitel und Estiennes Verse lagen Jahrhunderte in der Zukunft.
about.modes.simplified.p2=Die vollständige Scriptio continua ist bewusst fordernd — sie entfernt alles auf einmal, was sie zu einer eindrucksvollen Demonstration macht, aber zu einem schwierigen Ort zum eigentlichen Lesen. Dieser vereinfachte Modus entfernt nur die eine Schicht, um die es in diesem Abschnitt geht: die Kapitel- und Versnummerierung, die späten Zusätze, die zum Herauspicken einzelner Belegstellen einladen. Der Text bleibt gut lesbar, sodass Sie ein ganzes Buch als das durchgehende Argument oder die Erzählung lesen können, die sein Autor schrieb — statt als Raster zitierbarer Zellen. Wo die vollständige Scriptio continua der gelegentliche Weckruf ist, ist dies die alltägliche Art, ohne die Nummern zu lesen.
about.texts.hadithHeader=Hadith-Sammlungen
about.texts.hadithNote=Der arabische Matn jeder Sammlung ist klassisch und gemeinfrei. Die englischen Übersetzungen stammen aus der hadith-api; ihre Herkunft wird derzeit für jede Ausgabe geprüft.
about.texts.ldsHeader=Standardwerke der Heiligen der Letzten Tage
about.texts.ldsNote=Die Standardwerke der Heiligen der Letzten Tage (Mormonen), gemeinfrei — der überlieferte Text ohne den urheberrechtlich geschützten modernen Studienapparat (Fußnoten, Kapitelzusammenfassungen und die Einführung zum Buch Mormon).
