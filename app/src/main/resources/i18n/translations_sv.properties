about.sources.download=Varje utgåva i allmän egendom kan laddas ner i sin helhet, som samma XML som läsaren själv läser — böcker, kapitel, verser och läsordningarna, enligt schemat i religious-text.xsd. Inget konto, inget exportsteg, ingen skrapning av en webbsida för att komma åt en text som aldrig var vår att undanhålla. Licensierade utgåvor serveras inte där, och det avgör slutpunkten genom att läsa varje texts egen licens i stället för att lita på en lista.
about.sources.downloadTitle=Ta med dig texterna
about.texts.downloadThis=Ladda ner den här texten som XML (allmän egendom)
about.texts.lineageChains=Registrerade kedjor, från patch_lineage.py:
about.texts.lineageHow=Kontrollen ▾ överst i en bibelkolumn öppnar den kedjan under varje vers, en stegpinne per klick, tills den når hebreiskan eller grekiskan därunder. ▴ stänger den djupaste pinnen igen. Varje pinne bär sin utgåvas förkortning och årtal — ”GNV 1599” — så att sträckan en läsart har färdats är något du kan se snarare än något vi påstår.
about.texts.lineageIntro=Översättningar är inte oberoende vittnen. King James-översättarna arbetade utifrån Bishops' Bible med Tyndale och Geneve inom räckhåll; Revised Version korrigerade King James; American Standard reviderade Revised; World English Bible moderniserade American Standard. Fyra århundraden av översättare, var och en läsande över den föregåendes axel.
about.texts.lineageModes=Stegpinnarna är versvisa, så kontrollerna visas bara i visningslägena Verser och Rubriker. Original, Löpande och Kapitel behåller sitt obrutna flöde; ett djup du ställer in där består i tysthet och återkommer när du växlar tillbaka. Stegningen är också innehållsmedveten — pinnar som inte har något att säga för boken du befinner dig i hoppas över, så när du rullar från Gamla testamentet in i Nya byts det hebreiska vittnet mot det grekiska utan ett klick.
about.texts.lineageTitle=Översättningslinjer — vad en utgåva vilar på
about.texts.lineageWitness=Pinnar märkta ≈ är vittnen på originalspråken. De visas för att varje översättning ytterst vilar på hebreiskan och grekiskan, inte för att utgåvan anger dem som sin källa — Westminster Leningrad-kodexen och Textus Receptus står in för det golvet. Detta är en verklig begränsning, inte ett påstående: en modern översättning som NIV eller NASB arbetar utifrån kritiska utgåvor som ännu inte finns i denna korpus, så dess stege är en enda ≈-pinne snarare än en kedja. Att en utgåva saknas i listan ovan betyder att vi inte har registrerat dess härkomst, inte att den saknar en.
