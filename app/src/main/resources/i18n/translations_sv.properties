# === Tillagt 2026-07-02 — startsida (förenklat läge, hadith/SDH), kommentarer, anteckningar, lägen ===
mode.ORIGINAL.desc=De ursprungliga handskrifterna skrevs med sammanhängande versaler (scriptio continua) utan ordmellanrum och utan kapitel- eller versindelning
mode.ORIGINAL_SIMPLE.desc=Löpande text med moderna ordmellanrum och gemener, men utan kapitel- och versindelning — så som texterna såg ut innan numreringen infördes
mode.CHAPTERS.desc=Kapitlen infördes av Stephen Langton, ärkebiskop av Canterbury, ca 1227 e.Kr.
mode.CHAPTERS_VERSES.desc=Verserna infördes av Robert Estienne (Stephanus) år 1551
