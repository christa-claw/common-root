about.texts.ldsNote=Sista dagars heligas (mormonernas) standardverk, i allmän egendom — den hävdvunna texten utan den upphovsrättsskyddade moderna studieapparaten (fotnoter, kapitelsammanfattningar och inledningen till Mormons bok).
