# ── Koran-avsnittet ──────────────────────────────────────────────────
about.quran.title=Koranen
about.quran.intro=Där Bibelns kapitel och verser lades på texten århundraden efter att den skrevs, kom Koranen med sin struktur intakt. Dess indelning i 114 suror, och de verser de innehåller, hör till texten så som den överfördes — inte ett redaktionellt rutnät som lades över den senare. Vad Koranen i stället erbjuder den jämförande läsaren är två vägar genom samma text, och en åtskillnad mellan originalet och dess översättningar som formar hur den läses.
about.quran.original.title=Sura och vers: ursprunglig, inte redaktionell
about.quran.original.p1=En sura är ett kapitel; en aya (bokstavligen "ett tecken") är en vers. Till skillnad från Bibelns kapitel- och versnummer — tillagda av Stephen Langton omkring 1227 och Robert Estienne 1551 — hör Koranens suror och verser till textens egen struktur, närvarande från dess tidigaste överföring.
about.quran.original.p2=Att läsa i läget "Numrerade verser" här innebär därför inte att man tar bort ett medeltida lager, som med Bibeln; numreringen är ursprunglig för texten.
about.quran.standardization.title=En text, med avsikt
about.quran.standardization.p1=Koranen så som den sprids i dag återspeglar en medveten standardisering. Enligt den traditionella berättelsen lät kalifen Uthman, omkring två decennier efter Profetens död och inför regionala samfund som reciterade på olika sätt, upprätta en auktoritativ skriven text och sända kopior till de större centra — och beordrade att de konkurrerande handskrifterna skulle förstöras. Vissa framstående följeslagare minns man hade personliga handskrifter som skilde sig på sina ställen, i ordalydelse eller i surornas ordning.
about.quran.standardization.p2=Där Bibelns text formades av många händer under århundraden, fastställdes Koranens tidigt och avsiktligt till en enda officiell recension — ett annat slags redaktionell historia, men en redaktionell historia likväl.
about.quran.orders.title=Två ordningar: recitation och uppenbarelse
about.quran.orders.p1=Koranen du vanligtvis ser — mushaf — är inte ordnad i den ordning den uppenbarades. Efter den inledande suran, al-Fatiha, går surorna i stort sett från längst till kortast: en ordning för recitation och memorering, inte kronologi. Uppenbarelsens ordning är en annan — den börjar med de korta, brådskande surorna från de tidiga Mecka-åren och utvecklas under ungefär två decennier.
about.quran.orders.p2=Den här läsaren låter dig växla mellan de två, så att du kan läsa texten så som den reciteras eller följa den så som den uppenbarades. (Uppenbarelsens exakta ordningsföljd är rekonstruerad av forskare och omdebatterad på sina ställen.)
about.quran.meccaMedina.title=Meckanska och medinska
about.quran.meccaMedina.p1=Traditionen delar in surorna i dem som uppenbarades i Mecka och dem som uppenbarades senare i Medina. De meckanska surorna tenderar att vara kortare och mer poetiska — de handlar om Guds enhet, uppståndelsen och den kommande räkenskapen. De medinska surorna tenderar att vara längre och handlar mer om lag, gemenskap och livet i ett bofast samhälle.
about.quran.meccaMedina.p2=Att veta om ett avsnitt är meckanskt eller medinskt förändrar ofta hur det läses, ungefär som ett bibelställes sammanhang gör.
about.quran.translations.title=Arabiskan och dess översättningar
about.quran.translations.p1=I den islamiska traditionen är Koranen själva den arabiska texten; en översättning betraktas som en tolkning av dess innebörd snarare än Koranen i egentlig mening — vilket är varför översättare betitlar sitt verk "Den ärorika Koranens innebörd" eller "en tolkning".
about.quran.translations.p2=Den här läsaren håller den åtskillnaden synlig: den arabiska utgåvan är grundtexten, och en översättning kan visas under varje vers i stället för i dess ställe, så att du läser originalet och en återgivning av det samtidigt.
about.quran.callout.title=Att läsa Koranen här
about.quran.callout.p1=Två funktioner är byggda för just detta. Ordningsväxlaren flyttar dig mellan den reciterade ordningen och uppenbarelsens ordning. Översättningsföljeslagaren placerar en återgivning under varje arabisk vers, låst rad för rad, så att originalet förblir det primära och översättningen stöder det.
about.quran.callout.p2=Syftet är detsamma som med Bibeln — att låta texten läsas på sina egna villkor och att göra de redaktionella och tolkande lagren synliga i stället för osynliga.

