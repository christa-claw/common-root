about.modes.simplified.label=Förenklad
about.modes.simplified.subtitle=Läsbar löpande text
about.modes.simplified.p1=Det här läget behåller originalets sammanhängande, odelade flöde men återställer det som skrivare lade till under de följande århundradena — ordmellanrum, gemener och skiljetecken. Det speglar ett verkligt historiskt skede: långt efter att texterna blivit läsbara på det här sättet cirkulerade de fortfarande utan kapitel- och versnummer. Langtons kapitel och Estiennes verser låg århundraden fram i tiden.
about.modes.simplified.p2=Den fullständiga Scriptio continua är avsiktligt krävande — den tar bort allt på en gång, vilket gör den till en slående demonstration men en svår plats att faktiskt läsa på. Det här förenklade läget tar bara bort det lager som det här avsnittet handlar om: kapitel- och versnumreringen, de sena tilläggen som inbjuder till lösryckta citat. Texten förblir läsbar, så att du kan läsa en hel bok som det sammanhängande resonemang eller den berättelse dess författare skrev, i stället för som ett rutnät av citerbara celler. Där den fullständiga Scriptio continua är den tillfälliga väckarklockan är detta det vardagliga sättet att läsa utan numren.
about.texts.hadithHeader=Hadithsamlingar
about.texts.hadithNote=Varje samlings arabiska matn är klassisk och allmän egendom. De engelska översättningarna hämtas via hadith-api och deras ursprung verifieras utgåva för utgåva.
