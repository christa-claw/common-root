about.comments.title=Dela dina insikter
about.comments.body=Skapa ett gratis konto för att lämna kommentarer och anteckningar på vilken vers som helst. Dina anteckningar är privata som standard — dela dem om du vill. Att läsa och studera texterna är alltid gratis, utan konto.
about.comments.register=Skapa gratis konto
about.comments.signIn=Logga in

about.about.title=Om detta projekt
about.about.p1=Common Root? är ett oberoende projekt byggt för att göra seriösa jämförande studier av de abrahamitiska skrifterna tillgängliga för alla — forskare, studenter och nyfikna läsare. Det är inte knutet till någon religiös organisation eller något förlag. Namnet är en inbjudan: att läsa dessa texter sida vid sida och själv väga vad de delar och var de skiljer sig åt.
about.about.p2=Plattformen är byggd på teknik med öppen källkod: Java, Vaadin, Spring Boot, BaseX (en inbyggd XML-databas) och MySQL (för användarkonton och kommentarer). Källtexter i public domain är tillgängliga utan kostnad. Licensierade översättningar används med tillstånd från sina förlag.
about.about.p3=Nya översättningar, traditioner och funktioner läggs till löpande. Härnäst kommer översättningar av Koranen och hadithsamlingar, följt av integrering av kommentarer och korshänvisningslänkar.

about.support.title=Stöd projektet
about.support.body=Common Root? är gratis och kommer alltid att vara det. Om det är till nytta för dig hjälper sponsring till att täcka drift, åtkomst till licensierade översättningar och tiden att lägga till nya texter och funktioner.
