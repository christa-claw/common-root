about.search.title=Sök i allt
about.search.body=En enda sökruta omfattar nu varje utgåva och språk i biblioteket — Bibeln, Koranen, hadither och mer — tillsammans med kommentarerna. Sök ett ord eller en fras så får du ett resultat per vers; välj vilka översättningar som ska öppnas och jämför två eller fler sida vid sida i synkroniserade kolumner. Du kan också klistra in en lista med referenser i läsarens verktygsfält för att öppna varje ställe i en egen kolumn på en gång.
