about.nav.openReader=Öppna läsaren

about.hero.title=Studera texterna som format vår värld
about.hero.subtitle=En fri och öppen läsare för att utforska de abrahamitiska religionernas skrifter — bibelöversättningar, Koranen, hadither och kommentarer — sida vid sida, på vilket språk som helst och på vilket djup du vill.
about.hero.cta=Öppna läsaren →

about.howto.title=Så använder du läsaren
about.howto.intro=Läsaren är uppbyggd kring kolumner. Varje kolumn visar en text — en bibelöversättning, Koranen, en kommentar eller dina egna anteckningar. Du kan öppna hur många kolumner du vill och blanda traditioner fritt.
about.howto.step1.title=Välj en källa
about.howto.step1.body=Klicka på »Välj källa...» i kolumnens rubrik och välj valfri översättning eller text i rullgardinsmenyn.
about.howto.step2.title=Navigera
about.howto.step2.body=Använd bokväljaren och kapitelpilarna för att hoppa vart som helst. Eller bläddra bara — läsaren laddar nästa kapitel automatiskt när du når slutet.
about.howto.step3.title=Lägg till fler kolumner
about.howto.step3.body=Klicka på »Lägg till kolumn» i verktygsfältet för att öppna en andra eller tredje text bredvid den första. Jämför översättningar eller traditioner sida vid sida.
about.howto.step4.title=Synkronisera eller bläddra fritt
about.howto.step4.body=Kolumnerna bläddrar tillsammans som standard. Klicka på länkikonen 🔗 i någon kolumns rubrik för att koppla loss den och bläddra i den oberoende.
about.howto.step5.title=Byt visningsläge
about.howto.step5.body=Växla mellan lägena Original, Kapitel (1227), Verser (1551) och Rubriker per kolumn via rullgardinsmenyn i rubriken. Se nedan vad de betyder.
about.howto.step6.title=Följ kommentarslänkar
about.howto.step6.body=När en kommentar hänvisar till en vers, klicka på länken — alla öppna bibelkolumner hoppar automatiskt till det avsnittet.
about.howto.step7.title=Sök i allt
about.howto.step7.body=Klicka på 🔍-ikonen i verktygsfältet för att söka i alla verser och kommentarer på en gång. Varje resultat öppnas direkt vid stället i en ny kolumn.

about.modes.title=Att förstå visningslägena
about.modes.intro=Visningslägesväljaren i varje kolumns rubrik styr hur texten presenteras. Varje läge speglar ett annat lager av redaktionell historia — en del uråldrig, en del förvånansvärt sentida. Att förstå var dessa indelningar kommer ifrån förändrar hur du läser.
about.modes.original.label=Original
about.modes.original.subtitle=Scriptio continua
about.modes.original.p1=De äldsta bibliska handskrifterna — vare sig Nya testamentets grekiska papyrer eller de stora hebreiska kodexarna — skrevs med löpande versalskrift utan mellanrum, utan skiljetecken, utan kapitelindelningar och utan versnummer. Läsaren förväntades redan känna texten väl nog för att tyda den.
about.modes.original.p2=Detta läge återskapar den upplevelsen. Det är avsiktligt utmanande. Att läsa det tvingar dig att möta texten som de tidigaste läsarna gjorde — som ett sammanhängande resonemang eller en berättelse, inte som en samling isolerade, citerbara fragment. Många forskare menar att detta är det ärligaste sättet att möta författarnas ursprungliga avsikt.
about.modes.chapters.label=Kapitel (1227)
about.modes.chapters.subtitle=Tillagda av Stephen Langton
about.modes.chapters.p1=Stephen Langton, en engelsk lärd man som blev ärkebiskop av Canterbury, delade in Bibeln i det kapitelsystem som används än i dag omkring år 1227 e.Kr. — mer än tusen år efter att texterna skrevs.
about.modes.chapters.p2=Hans motiv var praktiskt: lärda behövde ett enhetligt sätt att hänvisa till avsnitt i teologiska dispyter. Kapitelindelningarna var aldrig avsedda som ingivna gränser. Langton arbetade snabbt genom en väldig text, och hans indelningar är ibland utmärkta och ibland skärande — de bryter mitt i ett resonemang, en dikt eller till och med en mening på sätt som skymmer författarens ursprungliga flöde.
about.modes.verses.label=Verser (1551)
about.modes.verses.subtitle=Tillagda av Robert Estienne
about.modes.verses.p1=Versnumren lades till i Nya testamentet år 1551 av Robert Estienne, en fransk boktryckare även känd som Stephanus. Enligt hans son gjorde han indelningarna inter equitandum – "till häst" – under resan från Paris till Lyon. Bilden av någon som numrerar verser från sadeln är berömd men omtvistad; som varje ryttare vet är det knappast möjligt i rörelse, och forskare misstänker att han i själva verket arbetade på kvällarna, i värdshusen längs vägen. Hur det än var kan resans brådska förklara några av de mer förbryllande indelningarna.
about.modes.verses.p2=Gamla testamentets verssystem följde kort därefter. Liksom kapitlen lades verserna till enbart för att underlätta hänvisningar. Sedan dess har de format hur miljarder människor läser och citerar Skriften — ofta genom att isolera fragment från sitt sammanhang på sätt som de ursprungliga författarna aldrig avsåg eller förutsåg.
about.modes.titles.label=Rubriker
about.modes.titles.subtitle=Redaktionella avsnittsrubriker
about.modes.titles.p1=Avsnittsrubriker — ibland kallade perikoper — är redaktionella rubriker som lagts till av förläggare och översättare för att hjälpa läsaren att navigera. De ingår inte i någon ursprunglig handskrift.
about.modes.titles.p2=De varierar avsevärt mellan översättningar: NIV använder dem flitigt, medan KJV saknar dem helt. Vissa rubriker är användbara sammanfattningar; andra påtvingar ett avsnitt en teologisk tolkning innan du har läst ett enda ord. Att läsa först utan rubriker och sedan med dem kan vara en avslöjande övning.

about.problems.title=När indelningar förvränger texten
about.problems.intro=Kapitel- och versindelningar har format hur miljarder människor läser Skriften — men de lades till av mänskliga redaktörer århundraden efter att texterna skrevs, och de skär ibland tvärs igenom det ursprungliga resonemanget på sätt som verkligen förändrar innebörden. Följande är några av de mest betydelsefulla exemplen.
about.problems.isaiah.ref=Jesaja 52:13 – 53:12
about.problems.isaiah.title=En profetia kluven i två
about.problems.isaiah.p1=Kapitelbrytningen vid Jesaja 53 skär igenom det som i själva verket är en enda sammanhängande dikt — ofta kallad den fjärde Herrens tjänare-sången. Dikten börjar i Jesaja 52:13: »Se, min tjänare skall handla vist. Han skall bli hög och upphöjd, ja, mycket hög.» Denna inledande strof (52:13–15) bereder marken för hela det avsnitt som följer i kapitel 53, vilket kristna läser som en profetia om korsfästelsen.
about.problems.isaiah.p2=Eftersom kapitelindelningen placerar 52:13–15 i det läsarna uppfattar som »Jesaja 52» och själva huvuddelen i »Jesaja 53», förbises de inledande verserna ofta. Dikten citeras rutinmässigt med början i 53:1, varvid dess dramatiska inledning går förlorad. Att läsa den som ett enda obrutet avsnitt — så som den ursprungliga texten framställer den — återställer profetians fulla båge.
about.problems.romans.ref=Romarbrevet 7 – 8
about.problems.romans.title=Det »därför» som förlorade sitt »eftersom»
about.problems.romans.p1=Romarbrevet 8 inleds med en av Nya testamentets mest berömda rader: »Så finns nu ingen fördömelse för dem som är i Kristus Jesus.» Ordet »så/därför» gör ett avgörande arbete — det signalerar att Paulus drar en slutsats av ett resonemang han just framfört.
about.problems.romans.p2=Men kapitelbrytningen skiljer slutsatsen från resonemanget. De som börjar vid kapitel 8 möter ett påstående utan dess bevis. Paulus resonemang om kampen mellan köttet och anden i kapitel 7 är den direkta grunden för vissheten i kapitel 8. Kapitelindelningen har bidragit till att Romarbrevet 8:1 läses som ett fristående löfte snarare än som höjdpunkten på ett sammanhängande teologiskt resonemang.
about.problems.philippians.ref=Filipperbrevet 4:13
about.problems.philippians.title=Skriftens mest felciterade vers
about.problems.philippians.p1=»Allt förmår jag i honom som ger mig kraft» är en av de mest citerade verserna i Bibeln — tryckt på prylar, åberopad före idrottsevenemang och åkallad som ett allmänt löfte om gudomlig kraft.
about.problems.philippians.p2=I sitt sammanhang talar Paulus om något långt mer specifikt och långt mer krävande: förnöjsamhet i fattigdom. De omgivande verserna lyder: »Jag har lärt mig att vara nöjd med det jag har. Jag kan leva i ringa omständigheter, och jag kan leva i överflöd.» Det »allt» som Paulus förmår i Kristus är att uthärda vilken omständighet som helst — överflöd eller umbäranden — med jämnmod. Versindelningen slet loss versen från detta sammanhang och förvandlade en undervisning om att bära lidande med värdighet till en slogan om framgång.
about.problems.jeremiah.ref=Jeremia 29:11
about.problems.jeremiah.title=Ett löfte till de landsförvisade, inte till individer
about.problems.jeremiah.p1=»Jag vet vilka tankar jag har för er, säger Herren, nämligen fridens tankar och inte ofärdens, för att ge er en framtid och ett hopp» är en av de mest populära verserna i samtida kristen kultur, ofta tillämpad som ett personligt gudomligt löfte.
about.problems.jeremiah.p2=I sitt sammanhang talar Gud till hela gemenskapen av israeliter som landsförvisats till Babylon — och han säger något de inte ville höra: att landsflykten skulle vara i sjuttio år. Den hoppfulla versen är inbäddad i ett brev som uppmanar de landsförvisade att slå sig ner i Babylon, bygga hus, anlägga trädgårdar och acceptera att de inte kommer att återvända under sin livstid. Löftet är verkligt — men det är kollektivt, långsiktigt och föregånget av årtionden av lidande. Versindelningen gjorde det lätt att plocka ut trösten och lämna sammanhanget bakom sig.
about.problems.john.ref=Johannes 11:35
about.problems.john.title=Den kortaste versen och vad den förlorade
about.problems.john.p1=»Jesus grät» är den kortaste versen i Bibeln — en särställning som gjort den berömd, ofta citerad och vitt utantillärd i isolering.
about.problems.john.p2=I den grekiska grundtexten är versen en del av en sammanhållen känslomässig scen: Jesus anländer till Lasarus grav, ser Maria gråta, ser folkskaran gråta och blev »upprörd i sin ande och skakad» — ett uttryck som på grekiska (embrimaomai) bär en innebörd av vrede eller upprördhet, inte bara sorg. Forskare debatterar om Jesus grät av sorg, av medkänsla med de sörjande eller av något mer sammansatt. Versindelningen har reducerat ett teologiskt rikt ögonblick till en rörande anekdot om att Jesus delar mänsklig känsla.
about.problems.callout.title=Bevistextning och verssystemet
about.problems.callout.p1=Verssystemet skapade oavsiktligt förutsättningarna för »proof-texting» (bevistextning) — bruket att citera en isolerad vers till stöd för en teologisk eller moralisk ståndpunkt utan hänsyn till det omgivande resonemanget. Både den vetenskapliga debatten och populärkulturen har formats av detta. En vers lösryckt ur sitt sammanhang kan tyckas säga nästan motsatsen till vad författaren avsåg.
about.problems.callout.p2=Det är därför visningslägena Original och Kapitel finns. Att läsa ett kapitel eller en bok som sammanhängande prosa — utan versnumrens visuella avbrott — avslöjar ofta ett resonemang, en berättelse eller en dikt som versrutnätet har gjort nästan osynligt.

