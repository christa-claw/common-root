# ─────────────────────────────────────────────────────────────────────
# Landing page (AboutView)
# ─────────────────────────────────────────────────────────────────────
about.nav.openReader=リーダーを開く

about.hero.title=世界を形づくってきた諸文書を読む
about.hero.subtitle=アブラハムの宗教の聖典 — 聖書の諸翻訳、クルアーン、ハディース、注解 — を、原語と翻訳で、任意の深さまで並べて読める、無料で開かれたリーダーです。
about.hero.cta=リーダーを開く →

about.howto.title=リーダーの使い方
about.howto.intro=このリーダーは列を単位に作られています。各列には一つの本文 — 聖書の翻訳、クルアーン、注解、あるいはご自身のノート — が表示されます。列はいくつでも開くことができ、伝統をまたいで自由に並べられます。
about.howto.step1.title=底本を選ぶ
about.howto.step1.body=列の見出しにある「底本を選択...」をクリックし、一覧から任意の翻訳や本文を選びます。
about.howto.step2.title=移動する
about.howto.step2.body=書の選択と章の矢印で任意の箇所へ移動できます。あるいはただスクロールしてください — 末尾に近づくと次の章が自動で読み込まれます。
about.howto.step3.title=列を増やす
about.howto.step3.body=ツールバーの「列を追加」をクリックすると、二つ目・三つ目の本文を並べて開けます。翻訳や伝統を左右に並べて比較できます。
about.howto.step4.title=同期するか、個別に読むか
about.howto.step4.body=列は既定で一緒にスクロールします。列の見出しにある 🔗 をクリックすると連結が外れ、その列だけを自由に読めます。
about.howto.step5.title=表示モードを変える
about.howto.step5.body=見出しのドロップダウンで、列ごとに Scriptio Continua、章区分 (1227)、節区分 (1551)、小見出しの各モードを切り替えられます。それぞれの意味は下記をご覧ください。
about.howto.step6.title=注解のリンクをたどる
about.howto.step6.body=注解が節を参照している場合、そのリンクをクリックすると、開いている聖書の列がすべてその箇所へ移動します。
about.howto.step7.title=すべてを検索する
about.howto.step7.body=ツールバーの 🔍 をクリックすると、あらゆる節とコメントを一度に検索できます。検索結果からは新しい列で該当箇所へ直接移動できます。

about.modes.title=表示モードを理解する
about.modes.intro=各列の見出しにある表示モードの選択は、本文の見せ方を切り替えます。それぞれのモードは編集史の異なる層 — 古いものもあれば、驚くほど新しいものもあります — に対応しています。これらの区分がどこから来たのかを知ると、読み方が変わります。
about.modes.original.label=原形
about.modes.original.subtitle=Scriptio Continua
about.modes.original.p1=最初期の聖書写本は — 新約のギリシャ語パピルスであれ、ヘブライ語の大型写本であれ — 語間の空白も句読点も章の切れ目も節番号もない、連続した大文字で書かれていました。読み手は、本文をすでに十分に知っていて解析できることを前提とされていたのです。
about.modes.original.p2=このモードはその経験を再現します。読みにくいのは意図的です。読むことで、最初期の読者と同じように — 引用しやすい断片の集まりではなく、連続した議論や物語として — 本文に向き合わざるを得なくなります。これこそ著者本来の意図に触れる最も誠実な方法だと論じる研究者も少なくありません。
about.modes.simplified.label=簡易版
about.modes.simplified.subtitle=読みやすい連続本文
about.modes.simplified.p1=このモードは原形の途切れない流れを保ちながら、その後の数世紀に写字生が加えたもの — 語間の空白、小文字、句読点 — を戻したものです。これは実際にあった歴史上の期間を映しています。本文がこのように読みやすくなってからも長いあいだ、章や節の番号はまだ付いていませんでした。ラングトンの章もエティエンヌの節も、何世紀も先のことだったのです。
about.modes.simplified.p2=完全な Scriptio Continua はあえて厳しく作られています。すべてを一度に取り去るため、示すものは鮮烈ですが、実際に読み進めるのは骨が折れます。この簡易版は、この節で扱っている層だけ — 章と節の番号、証拠引き（プルーフテキスト）を誘う後代の追加 — を取り除きます。本文は読みやすいままなので、引用しやすいます目の集まりとしてではなく、著者が書いたひと続きの議論や物語として一巻を通して読めます。完全な Scriptio Continua が時おりの衝撃だとすれば、こちらは番号なしで読むための日常の方法です。
about.modes.chapters.label=章区分 (1227)
about.modes.chapters.subtitle=スティーヴン・ラングトンによる追加
about.modes.chapters.p1=イングランドの学者でのちにカンタベリー大司教となったスティーヴン・ラングトンは、1227年頃、今日なお用いられている章の体系を聖書に導入しました — 本文が書かれてから千年以上のちのことです。
about.modes.chapters.p2=その動機は実務的なものでした。神学論争で箇所を一貫した仕方で引用する手段が学者たちに必要だったのです。章の区分は霊感による境界として意図されたものではありません。ラングトンは膨大な本文を急いで区切ったため、その区分は見事なこともあれば、議論や詩の途中、時には文の途中で切るなど、著者本来の流れを覆い隠す耳障りなものになっていることもあります。
about.modes.verses.label=節区分 (1551)
about.modes.verses.subtitle=ロベール・エティエンヌによる追加
about.modes.verses.p1=節番号は1551年、ステファヌスの名でも知られるフランスの印刷業者ロベール・エティエンヌによって新約に加えられました。息子によれば、彼はパリからリヨンへの道中、inter equitandum —「馬に乗りながら」— 区分を行ったといいます。鞍の上で節を振るという情景は有名ですが、疑わしくもあります。馬に乗る人ならわかるとおり、動きながらではまず不可能で、実際には毎夕の宿で作業したのだろうと研究者は見ています。姿勢はともあれ、旅の慌ただしさが、いくつかの腑に落ちない区分を説明するのかもしれません。
about.modes.verses.p2=旧約の節の体系もほどなく続きました。章と同じく、節はもっぱら参照の便宜のために加えられたものです。しかしそれ以来、何十億もの人々の読み方と引用のしかたを形づくってきました — しばしば、原著者が意図も予期もしなかった仕方で、断片を文脈から切り離しながら。
about.modes.titles.label=小見出し
about.modes.titles.subtitle=編集上の区分見出し
about.modes.titles.p1=小見出し — ペリコーペと呼ばれることもあります — は、読者の便宜のために出版者や翻訳者が加えた編集上の見出しです。どの原写本にも存在しません。
about.modes.titles.p2=翻訳によって大きく異なります。NIV は多用し、KJV にはまったくありません。有益な要約もあれば、一語も読まないうちに神学的解釈を本文に押しつけるものもあります。まず見出しなしで読み、次に見出し付きで読むと、多くのことが見えてきます。
about.modes.openInReader=このモードでリーダーを開く

about.problems.title=区分が本文をゆがめるとき
about.problems.intro=章と節の区分は、何十億もの人々の聖典の読み方を形づくってきました。しかしそれらは本文が書かれてから何世紀ものちに人間の編集者が加えたものであり、ときに本来の議論を横断して意味そのものを変えてしまいます。以下は最も重要な例です。
about.problems.isaiah.ref=イザヤ書 52:13 – 53:12
about.problems.isaiah.title=二つに裂かれた預言
about.problems.isaiah.p1=イザヤ書53章の章の切れ目は、実際には一つの連続した詩 — しばしば第四の僕の歌と呼ばれるもの — を断ち切っています。この詩はイザヤ書52章13節「見よ、わたしの僕は栄える。彼は高められ、上げられ、きわめて高くなる」から始まります。この冒頭連（52:13–15）が、キリスト教徒が十字架の預言として読む53章全体を準備しているのです。
about.problems.isaiah.p2=章の区分によって52:13–15が読者の意識では「イザヤ書52章」に入り、本体が「イザヤ書53章」に置かれるため、冒頭の数節はしばしば見落とされます。この詩は決まって53:1から引用され、劇的な導入を失っています。本文が示すとおり一つの途切れない箇所として読むことで、預言の全体の弧が戻ってきます。
about.problems.romans.ref=ローマの信徒への手紙 7 – 8
about.problems.romans.title=「だから」から失われた「なぜなら」
about.problems.romans.p1=ローマ書8章は新約で最も有名な一文の一つで始まります。「こういうわけで、今やキリスト・イエスに結ばれている者は、罪に定められることがない。」この「こういうわけで」は決定的な働きをしています — パウロが今しがた展開した議論から結論を引き出している合図なのです。
about.problems.romans.p2=ところが章の切れ目は、その結論を議論から切り離します。8章から読み始める人は、論証を欠いた宣言に出会うことになります。7章の肉と霊の葛藤についてのパウロの議論こそ、8章の確信の直接の土台です。この章区分のために、ローマ8:1は持続した神学的議論の頂点としてではなく、独立した約束として読まれるようになりました。
about.problems.philippians.ref=フィリピの信徒への手紙 4:13
about.problems.philippians.title=聖書で最も誤って引用される節
about.problems.philippians.p1=「わたしを強めてくださる方のお陰で、わたしにはすべてが可能です」は聖書で最も広く引用される節の一つで、商品に印刷され、試合前に唱えられ、神の力づけの一般的な約束として持ち出されます。
about.problems.philippians.p2=文脈のなかでパウロが語っているのは、はるかに具体的で、はるかに厳しい事柄です — 貧しさのなかでの満ち足りです。前後の節はこう読みます。「わたしは、どんな境遇にあっても満足することを学びました。貧しく暮らすすべも、豊かに暮らすすべも知っています。」パウロがキリストによってできる「すべて」とは、豊かさであれ欠乏であれ、あらゆる境遇に平静をもって耐えることなのです。節の区分はこの文脈から一節を引きはがし、苦しみを潔く担うことについての教えを、達成についての標語に変えてしまいました。
about.problems.jeremiah.ref=エレミヤ書 29:11
about.problems.jeremiah.title=個人にではなく、捕囚の民への約束
about.problems.jeremiah.p1=「わたしは、あなたたちのために立てた計画をよく心に留めている、と主は言われる。それは平和の計画であって、災いの計画ではない。将来と希望を与えるものである」は現代のキリスト教文化で最も人気のある節の一つで、しばしば個人への神の約束として当てはめられます。
about.problems.jeremiah.p2=文脈において、神が語りかけているのはバビロンに捕囚となったイスラエルの共同体全体であり、しかも彼らが聞きたくないこと — 捕囚が七十年続くということ — を告げています。この希望の節は、バビロンに腰を落ち着け、家を建て、園を作り、生きているうちには帰れないと受け入れよと告げる手紙のなかに置かれているのです。約束は本物です。しかしそれは共同体的で、長期にわたり、何十年もの苦難を前に置いています。節の区分は、文脈を置き去りにしたまま慰めだけを取り出すことを容易にしました。
about.problems.john.ref=ヨハネによる福音書 11:35
about.problems.john.title=最短の節と、そこで失われたもの
about.problems.john.p1=「イエスは涙を流された」は聖書で最も短い節であり、そのことで有名になり、しばしば引用され、単独で広く暗記されています。
about.problems.john.p2=ギリシャ語原文では、この節は持続した情感の場面の一部です。イエスがラザロの墓に着き、泣くマリアを見、泣く群衆を見て、「心に憤りを覚え、興奮して」いる — ギリシャ語（embrimaomai）では悲しみだけでなく怒りや動揺を含む語です。イエスが涙したのは悲嘆からか、嘆く人々への同情からか、それとももっと複雑なものからかは、研究者のあいだで議論があります。節の区分は、神学的に豊かなこの瞬間を、イエスが人間の感情を分かち合ったという心温まる挿話に縮めてしまいました。
about.problems.callout.title=証拠引きと節の体系
about.problems.callout.p1=節の体系は、意図せずして「証拠引き（プルーフテキスト）」— 周囲の議論に触れないまま、孤立した一節を引いて神学的・道徳的立場を支える行い — の条件を作り出しました。学問的な論争も大衆文化も、これに形づくられてきました。文脈から切り離された一節は、著者の意図とほとんど正反対のことを語っているように見えることさえあります。
about.problems.callout.p2=だからこそ原形と章区分の表示モードがあるのです。章や巻を連続した散文として — 節番号による視覚的な中断なしに — 読むと、節のます目がほとんど見えなくしていた議論や物語や詩が、しばしば立ち現れてきます。
about.problems.openInReader=この箇所を文脈のなかで読む

about.texts.title=収録されている本文
about.texts.intro=現在このプラットフォームには以下の本文が収録されています。翻訳と伝統は随時追加されています。
about.texts.bibleHeader=聖書の翻訳
about.texts.quranHeader=クルアーン
about.texts.hadithHeader=ハディース集
about.texts.hadithNote=各集成のアラビア語マトンは古典であり、パブリックドメインです。英訳は hadith-api を通して提供されており、その来歴は版ごとに検証中です。
about.texts.ldsHeader=末日聖徒の標準聖典
about.texts.ldsNote=末日聖徒（モルモン）の標準聖典のうち、パブリックドメインのもの — 著作権のある現代の研究補助（脚注、章の要約、モルモン書の序文）を含まない、長く用いられてきた本文です。
about.texts.glossHeader=インターリニア・研究用の版
about.texts.glossNote=これらは語と語を対応させるための補助であり、読むための版ではありません — 受け手の言語の語感ではなく原語の文法に従うため、設計上ぎこちなく読めます。『エンファティック・ダイアグロット』の行間注と、ベンジャミン・ウィルソン自身が公刊した Emphatic Version は、ヨハネ1:1で食い違います。行間注は「そして言葉は一つの神であった」と読み、Emphatic Version は「そしてロゴスは神であった」と読みます。どちらもウィルソンのもので、同じ1864年の一巻に印刷されており、その食い違いこそが要点です — 行間注はギリシャ語がどう組み立てられているかを記録するのであって、訳者がどう読むべきと判断したかを記すのではありません。そのものとして引用してください。グリースバッハの底本に従い、この版は使徒8:37とルカ17:36を欠いています。節番号はその位置を空けたままにしてあるので、本文は他の版と節ごとに対応したままです。
about.texts.comingHeader=近日追加
about.texts.comingMore=さらに200以上の翻訳
about.texts.openInReader=この本文をリーダーで開く
about.texts.lineageTitle=翻訳の系譜 — その版が何の上に立っているか
about.texts.lineageIntro=翻訳は互いに独立した証人ではありません。欽定訳の翻訳者たちはビショップス聖書を底本とし、ティンダルとジュネーヴを傍らに置いて仕事をしました。改訂訳は欽定訳を正し、アメリカ標準訳は改訂訳を改め、世界英語聖書はアメリカ標準訳を現代化しました。四世紀にわたる翻訳者たちが、それぞれ前の一人の肩越しに読んできたのです。
about.texts.lineageHow=聖書の列の上部にある ▾ を押すと、その連鎖が各節の下に一段ずつ開き、下敷きとなるヘブライ語やギリシャ語に至ります。▴ は最も深い段を閉じます。各段にはその版の略号と年 —「GNV 1599」— が付くので、ある読みがどれだけの距離を旅してきたかは、こちらが主張することではなく、見て取れることになります。
about.texts.lineageModes=段は節を単位とするため、この操作は節区分と小見出しの表示モードでのみ現れます。原形・連続本文・章区分は途切れない流れを保ちます。そこで設定した深さは静かに保持され、戻ったときに復元されます。段送りは内容を見て行われ — いま読んでいる書について語ることのない段は飛ばされるので、旧約から新約へスクロールすると、クリックなしにヘブライ語の証人がギリシャ語の証人へ入れ替わります。
about.texts.lineageChains=patch_lineage.py に記録されている連鎖:
about.texts.lineageWitness=≈ の付いた段は原語の証人です。それらが示されるのは、すべての翻訳が究極的にはヘブライ語とギリシャ語に依拠しているからであって、その版がそれらを典拠として挙げているからではありません — ウェストミンスター・レニングラード写本とテクストゥス・レセプトゥスが、その底面の代わりを務めています。これは主張ではなく、実際の限界です。NIV や NASB のような現代訳は、このコーパスにまだ収められていない批判校訂版から訳しているため、その梯子は連鎖ではなく ≈ の一段になります。上の一覧にない版は、系譜がないのではなく、こちらがまだ記録していないということです。

