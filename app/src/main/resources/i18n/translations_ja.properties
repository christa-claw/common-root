about.texts.editionInfo=この版について
about.sources.downloadTitle=本文を持ち出す
about.sources.download=パブリックドメインの版はすべて、リーダー自身が読んでいるのと同じXMLとして丸ごとダウンロードできます — 書・章・節が、religious-text.xsd のスキーマに沿って収められています。0.8.5 以降、これはAPIを通して行います。アカウントページで無料のキーを作成し、/api/v1/texts/{token}/download を取得してください。サイトを読むのにキーは不要で、キーはダウンロードの計量にのみ用いられます。許諾版は提供されません。その判断はAPIが一覧に頼らず各本文自身のライセンスを読んで行います。
about.sources.note=上の表で「使用許諾」と記された翻訳は、許諾を得て使用しています。許諾を受けた内容を本プラットフォームの外で複製・再配布することは認められていません。パブリックドメインの本文は自由に利用・共有できます。

about.comments.title=気づいたことを共有する
about.comments.body=無料のアカウントを作れば、どの節にもコメントとノートを残せます。あなたの書き込みは既定では非公開で、望むときにだけ共有されます。本文を読み、学ぶことは常に無料で、アカウントは不要です。
about.comments.register=無料アカウントを作成
about.comments.signIn=ログイン

about.about.title=このプロジェクトについて
about.about.p1=Common Root? は、アブラハムの宗教の聖典を本格的に比較して学ぶことを、研究者にも学生にも関心をもつ読者にも等しく開くために作られた独立のプロジェクトです。いかなる宗教団体や出版社とも関係がありません。この名前は招きです。これらの本文を並べて読み、何を共有し、どこで分かれるのかを、あなた自身が量ってください。
about.about.p2=このプラットフォームはオープンソースの技術で作られています。Java、Vaadin、Spring Boot、BaseX（ネイティブXMLデータベース）、そしてMySQL（アカウントとコメント用）です。パブリックドメインの底本は自由に利用できます。許諾を得た翻訳は、出版社の許可のもとで使用しています。
about.about.p3=新しい翻訳・伝統・機能を継続的に追加しています。クルアーンと十のハディース集が聖書の諸翻訳と並んでリーダーに入り、あらゆる本文とコメントを横断する全文検索も組み込まれました。注解の統合と相互参照リンクが次の予定です。

about.support.title=プロジェクトを支える
about.support.body=Common Root? は無料であり、これからも無料です。もし役に立っているなら、ご支援はホスティング、許諾翻訳の利用、そして新しい本文と機能を加える時間に充てられます。
