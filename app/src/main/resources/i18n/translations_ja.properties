about.sources.intro=すべての本文は、信頼できるパブリックドメインまたは許諾済みの提供元から取得しています。本プラットフォーム上のあらゆる本文について、適切な帰属表示を行うことを重視しています。ライセンスが認める範囲で、全文を個人の学びのために自由に提供します。
