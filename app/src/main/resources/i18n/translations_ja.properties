# ── The Qur'an landing section ───────────────────────────────────────
about.quran.title=クルアーン
about.quran.intro=聖書の章と節が、本文が書かれてから何世紀ものちに外から課されたのに対し、クルアーンはその構造を保ったまま伝えられました。114のスーラへの区分と、その中のアーヤは、あとから本文の上に敷かれた編集上の格子ではなく、伝承されたままの本文に属しています。クルアーンが比較して読む者に差し出すのは、同じ本文を通る二つの道筋と、読み方を左右する原典と翻訳の区別です。
about.quran.original.title=スーラとアーヤ — 編集ではなく、原形
about.quran.original.p1=スーラは章であり、アーヤ（文字どおりには「しるし」）は節です。1227年頃のスティーヴン・ラングトンと1551年のロベール・エティエンヌが加えた聖書の章節番号とは異なり、クルアーンのスーラとアーヤは本文自身の構造に属し、最初期の伝承から存在しています。
about.quran.original.p2=したがって、ここで「アーヤ番号つき」モードで読むことは、聖書の場合のように中世の上塗りを取り除くことではありません。番号は本文に本来備わったものです。
about.quran.standardization.title=意図された一つの本文
about.quran.standardization.p1=今日流布しているクルアーンは、意図的な標準化を反映しています。伝統的な説明では、預言者の死からおよそ二十年後、地域ごとに異なる仕方で誦まれている状況に直面したカリフのウスマーンが、権威ある写本を定めて主要な中心地へ送り、競合する写本を焼却するよう命じたとされます。著名な教友のなかには、語句やスーラの配列が所々異なる個人写本を持っていたと伝えられる者もいます。
about.quran.standardization.p2=聖書の本文が何世紀にもわたり多くの手によって形づくられたのに対し、クルアーンの本文は早い時期に意図して一つの公式校訂へと定められました — 種類の異なる編集史ではありますが、やはり編集史です。
about.quran.orders.title=二つの配列 — 誦読と啓示
about.quran.orders.p1=ふだん目にするクルアーン — ムスハフ — は、啓示された順に並んではいません。開端章アル・ファーティハのあと、スーラはおおむね長いものから短いものへと続きます。年代ではなく、誦読と暗記のための配列です。啓示の順序は異なり、初期マッカ期の短く切迫したスーラから始まり、およそ二十年にわたって展開します。
about.quran.orders.p2=このリーダーでは両者を切り替えられるので、誦まれるとおりに読むことも、啓示されたとおりにたどることもできます。（啓示の正確な順序は研究者による再構成であり、所々議論があります。）
about.quran.meccaMedina.title=マッカ啓示とマディーナ啓示
about.quran.meccaMedina.p1=伝統はスーラを、マッカで啓示されたものと、のちにマディーナで啓示されたものに分けます。マッカのスーラは短く詩的な傾向があり、神の唯一性、復活、来るべき清算を主題とします。マディーナのスーラは長く、法、共同体、定住社会の生活に関わる傾向があります。
about.quran.meccaMedina.p2=ある箇所がマッカのものかマディーナのものかを知ると、聖書の箇所における状況設定と同じように、読み方がしばしば変わります。
about.quran.translations.title=アラビア語とその翻訳
about.quran.translations.p1=イスラームの伝統において、クルアーンとはアラビア語の本文そのものであり、翻訳はクルアーンそのものではなくその意味の解釈とみなされます。翻訳者が自らの仕事に「栄光あるクルアーンの意味」や「一つの解釈」といった題を付けるのはそのためです。
about.quran.translations.p2=このリーダーはその区別を目に見える形で保ちます。アラビア語版が基底の本文であり、翻訳は本文に代わってではなく各アーヤの下に表示できるので、原典とその訳を一緒に読むことになります。
about.quran.callout.title=ここでクルアーンを読む
about.quran.callout.p1=まさにこのために二つの機能があります。配列の切り替えは、誦読の順序と啓示の順序のあいだを行き来させます。翻訳の並記は、各アラビア語アーヤの下に訳を行ごとに固定して置くので、原典が主であり続け、翻訳がそれを支えます。
about.quran.callout.p2=目指すところは聖書の場合と同じです — 本文がそれ自身の条件で読まれるようにし、編集と解釈の層を、見えないものではなく見えるものにすることです。

